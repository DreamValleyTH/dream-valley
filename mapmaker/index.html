<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#241d16">
<title>Dream Valley Map Maker</title>
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Mobile-first isometric map editor. Phone: top bar · tool row · map · control dock · palette sheet.
   Desktop (≥900px): tools on the left, palette on the right. */
:root{
  --bg:#17130f; --panel:#241d16; --panel2:#2f261d; --line:#46392b; --fg:#f2e8d6; --muted:#b0a089;
  --accent:#9ccb5c; --accent-ink:#1d2a0e; --gold:#e9c46a; --gold-ink:#2a1f0c; --danger:#e0685a;
  --display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif; --body:"IBM Plex Sans Thai","Chakra Petch",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;
  grid-template-areas:"top" "tools" "stage" "dock" "side";padding-top:env(safe-area-inset-top,0px)}
header{grid-area:top;display:flex;align-items:center;gap:6px;background:var(--panel);border-bottom:1px solid var(--line);padding-block:6px;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),#5f8f32);flex:none}
.brand{font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap}
.grow{flex:1}
.btn{min-height:40px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:0 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(1px)} .btn:disabled{opacity:.35}
.btn.icon{width:40px;padding:0;font-size:18px}
.btn.send{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
select{min-height:40px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:0 8px;min-width:0;max-width:44vw}
nav.tools{grid-area:tools;display:flex;gap:4px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;
  padding-block:6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tool{flex:1 0 auto;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;color:var(--muted);font-size:12px}
.tool b{font-size:21px;line-height:1.1;font-weight:400}
.tool[aria-pressed=true]{color:var(--accent-ink);background:var(--accent)}
main{grid-area:stage;position:relative;min-width:0;min-height:0;background:#0f0c09}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.status{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;font-size:12px}
.chip{background:rgba(36,29,22,.9);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.chip.ok{color:var(--accent)}
.zoom{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:8px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:44px;min-height:44px;padding:0;font-size:20px;background:rgba(47,38,29,.92)}
/* control dock: what the current tool does / the move pad */
.dock{grid-area:dock;background:var(--panel);border-top:1px solid var(--line);min-height:64px;display:flex;align-items:center;gap:10px;
  padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.dock .hint{color:var(--muted);font-size:13.5px;line-height:1.45;flex:1;min-width:0}
.dock .hint b{color:var(--fg);font-weight:600}
.selname{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.selname b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selname small{font-size:12px;color:var(--muted)} .selname small.bad{color:var(--danger)}
.pad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,40px);gap:4px 6px;flex:none}
.pad button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;font-size:20px;cursor:pointer;touch-action:none}
.pad button:active{background:var(--accent);color:var(--accent-ink)}
.pad .rot{grid-column:2;grid-row:1/3;border-radius:12px;font-size:22px;background:var(--panel)}
.dock .done{min-height:52px;min-width:52px;border-radius:12px;font-size:20px}
/* palette sheet (place / paint) */
aside{grid-area:side;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;height:32dvh;min-height:0;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{display:flex;gap:6px;padding:8px 10px 6px;overflow-x:auto;scrollbar-width:none;flex:none}
.tab{flex:none;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--muted)}
.tab[aria-selected=true]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600}
.search{padding:0 10px 8px;flex:none}.search input{width:100%;min-height:38px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:0 10px;user-select:text}
.pal{flex:1;overflow:auto;padding:0 10px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;align-content:start}
.it{border:1px solid var(--line);border-radius:9px;background:#3a4a24;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px 2px 4px;min-height:96px;gap:3px}
.it[aria-pressed=true]{outline:3px solid var(--accent);outline-offset:-2px}
.it img{max-width:74px;max-height:66px;image-rendering:pixelated}
.it span{font-size:11.5px;text-align:center;line-height:1.15}
.terr{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.terr button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:8px;cursor:pointer;text-align:left;min-height:46px}
.terr button[aria-pressed=true]{outline:3px solid var(--accent);outline-offset:-2px}
.terr i{width:24px;height:24px;border-radius:5px;flex:none}
.sizes{grid-column:1/-1;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding-top:4px}
.sizes .btn{min-width:44px}.sizes .btn[aria-pressed=true]{outline:3px solid var(--accent)}
/* sheets & toasts */
.modal{position:fixed;inset:0;background:rgba(10,8,6,.66);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:min(560px,100%);display:flex;flex-direction:column;gap:12px;max-height:88dvh;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card h2{margin:0;font-family:var(--display);font-size:19px;text-wrap:balance}
.card p{margin:0;line-height:1.6;color:var(--muted)}
.card textarea,.card input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--fg);padding:8px 10px;user-select:text}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.card label.tg{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line)}
.card label.tg input{width:22px;height:22px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(36dvh + 70px);transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;z-index:30;font-size:14px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--gold);font-weight:600;cursor:pointer;padding:0}
.hide-sm{display:none}
@media (min-width:900px){
  .app{grid-template-columns:auto minmax(0,1fr) 320px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top top" "tools stage side" "tools dock side"}
  nav.tools{flex-direction:column;border-bottom:0;border-right:1px solid var(--line);padding:8px 6px;overflow:auto}
  .tool{flex:none;width:66px}
  aside{height:auto;border-top:0;border-left:1px solid var(--line)}
  .hide-sm{display:inline}
  .toast{bottom:90px}
  .modal{align-items:center}.card{border-radius:14px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="logo"></span><span class="brand hide-sm">Map Maker</span>
    <select id="mapSel" aria-label="แผนที่"><option value="town">ใจกลางตำบล</option><option value="farm">ฟาร์มยาย</option></select>
    <button class="btn icon" id="undo" title="ย้อนกลับ" aria-label="ย้อนกลับ">↶</button>
    <button class="btn icon" id="redo" title="ทำซ้ำ" aria-label="ทำซ้ำ">↷</button>
    <span class="grow"></span>
    <button class="btn icon" id="menuBtn" title="ตัวเลือก" aria-label="ตัวเลือก">⋯</button>
    <button class="btn send" id="sendBtn">📤 ส่งให้ Claude</button>
  </header>
  <nav class="tools" id="tools">
    <button class="tool" data-t="move" aria-pressed="true"><b>✋</b>ย้าย</button>
    <button class="tool" data-t="rotate"><b>⟳</b>หมุน</button>
    <button class="tool" data-t="place"><b>➕</b>วางของ</button>
    <button class="tool" data-t="erase"><b>🗑</b>ลบ</button>
    <button class="tool" data-t="paint"><b>🖌</b>พื้น</button>
    <button class="tool" data-t="door"><b>🚪</b>ประตู</button>
  </nav>
  <main>
    <canvas id="cv"></canvas>
    <div class="status"><span class="chip" id="stSave">กำลังโหลด…</span></div>
    <div class="zoom"><button class="btn" id="zin" aria-label="ซูมเข้า">＋</button><button class="btn" id="zout" aria-label="ซูมออก">－</button><button class="btn" id="zfit" aria-label="ดูทั้งแผนที่">⤢</button></div>
  </main>
  <div class="dock" id="dock"></div>
  <aside id="side">
    <div class="tabs" id="tabs"></div>
    <div class="search" id="searchBox"><input id="q" placeholder="ค้นหา เช่น บ้าน มะพร้าว เสาไฟ"></div>
    <div class="pal" id="pal"></div>
  </aside>
</div>

<script src="../js/firebase-config.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const T = 32, K = .75, MAP_NAMES = { town: 'ใจกลางตำบล', farm: 'ฟาร์มยาย' };
const TERR_COL = { '.': '#6f9a3a', a: '#5c5a58', c: '#c4bdac', l: '#c4673a', p: '#a08a62', y: '#b39468', s: '#e2cd9c', w: '#3f8aa0', r: '#9cb653', g: '#7a5434' };
const TERR_NAME = { '.': 'หญ้า', a: 'ถนนลาดยาง', c: 'ทางคอนกรีต', l: 'ดินลูกรัง', p: 'ทางเดินดิน', y: 'ลานดินบ้าน', s: 'ทรายลานวัด', w: 'น้ำ / คลอง', r: 'นาข้าว', g: 'แปลงผัก' };
const CAT_NAME = { farm: 'ของในฟาร์ม', building: 'อาคาร', tree: 'ต้นไม้', prop: 'ของตกแต่ง', animal: 'สัตว์' };
const HINT = {
  move: '<b>ย้าย:</b> แตะของที่จะย้าย แล้วกดลูกศรเลื่อนทีละช่อง · ลากนิ้วบนแผนที่เพื่อเลื่อนดู',
  rotate: '<b>หมุน:</b> แตะของเพื่อหันไปอีกด้าน',
  place: '<b>วางของ:</b> เลือกของด้านล่าง แล้วแตะจุดบนแผนที่',
  erase: '<b>ลบ:</b> แตะของที่ต้องการลบ (กด ↶ เพื่อเอาคืน)',
  paint: '<b>ระบายพื้น:</b> เลือกชนิดพื้นด้านล่าง แล้วลากนิ้วระบาย · ใช้สองนิ้วเลื่อนแผนที่',
  door: '<b>ประตู:</b> ลากช่องสีทอง (จุดเข้าร้าน/บ้าน) ไปที่ใหม่',
};
let CAT = null, MAP = null, mapName = 'town', IMG = {}, ALPHA = {}, GROUND = null;
let view = { x: 0, y: 0, z: .5 }, tool = 'move', palKey = null, palTab = 'building', brush = { code: 'l', size: 1 };
let sel = null, dirty = true, undo = [], redo = [], me = '', opts = { ground: true, grid: true, doors: true };
try { me = localStorage.getItem('dvmm_me') || ''; Object.assign(opts, JSON.parse(localStorage.getItem('dvmm_opts') || '{}')); } catch (_) {}
const cv = $('cv'), ctx = cv.getContext('2d');

// ---------- geometry: the same projection as the game ----------
const MG = () => MAP.mg || 120, OX = () => MAP.H * T * K + MG(), OY = () => MG();
const P = (x, y) => [(x - y) * K + OX(), (x + y) * K / 2 + OY()];
const unP = (sx, sy) => { const a = (sx - OX()) / K, b = (sy - OY()) / (K / 2); return [(a + b) / 2, (b - a) / 2]; };
const fpOf = o => { const c = CAT.items[o.k]; if (!c) return [1, 1]; return o.flip && c.iso ? [c.fp[1], c.fp[0]] : c.fp; };
function anchor(o) {   // sprite bottom-centre in iso px — exactly how the game places it
  const c = CAT.items[o.k], [fw, fd] = fpOf(o);
  if (c.iso) return [P((o.x + fw / 2) * T, (o.y + fd / 2) * T)[0], P((o.x + fw) * T, (o.y + fd) * T)[1] + (c.dy != null ? c.dy : 4)];
  if (c.corner) { const q = P((o.x + fw) * T, (o.y + fd) * T); return [q[0] + c.corner[0], q[1] + c.corner[1]]; }
  const ax = o.ax != null ? o.ax : c.ax, ay = o.ay != null ? o.ay : c.ay;
  if (ax != null) return P(o.x * T + ax, o.y * T + ay);
  return P((o.x + fw / 2) * T, (o.y + fd) * T - 3);
}
const depth = o => { const [fw, fd] = fpOf(o); return (o.x + fw / 2 + o.y + fd / 2) + (o.layer === 'front' ? 1e6 : o.layer === 'top' ? 2e6 : 0); };
const cellsOf = o => { const [fw, fd] = fpOf(o), r = []; for (let y = o.y; y < o.y + fd; y++) for (let x = o.x; x < o.x + fw; x++) r.push([x, y]); return r; };
const nameOf = o => { const c = CAT.items[o.k]; return o.label || (c && c.name) || o.k; };

// ---------- online store: Firebase (same project as the game) — the page still works fully offline ----------
const Store = {
  ready: false, db: null, subs: {},
  async init() {
    const cfg = window.DV_FIREBASE; if (!cfg) return false;
    const load = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
    try {
      const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
      await load(V + 'firebase-app-compat.js'); await Promise.all([load(V + 'firebase-auth-compat.js'), load(V + 'firebase-database-compat.js')]);
      const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
      await app.auth().signInAnonymously(); this.db = app.database(); this.ready = true; return true;
    } catch (e) { console.warn('online off', e); return false; }
  },
  async get(path) { if (!this.ready) return null; try { const s = await this.db.ref(path).get(); return s.exists() ? s.val() : null; } catch (_) { return null; } },
  async set(path, v) { if (!this.ready) throw new Error('offline'); await this.db.ref(path).set(v); },
  watch(path, fn) { if (!this.ready) return () => {}; const r = this.db.ref(path), h = s => fn(s.val()); r.on('value', h, () => {}); return () => r.off('value', h); },
};

// ---------- loading ----------
const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
async function boot() {
  CAT = await fetch('mapkit/catalog.json').then(r => r.json());
  await Promise.all(Object.keys(CAT.items).map(async k => { IMG[k] = await loadImg(`mapkit/s/${k}.png`); }));
  for (const k in IMG) { const im = IMG[k]; if (!im) continue; const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const x = c.getContext('2d'); x.drawImage(im, 0, 0); ALPHA[k] = x.getImageData(0, 0, im.width, im.height).data; }
  try { const m = localStorage.getItem('dvmm_last'); if (m && MAP_NAMES[m]) mapName = m; } catch (_) {}
  $('mapSel').value = mapName;
  await loadMap(mapName);
  loop();
  if (await Store.init()) await pullOnline(mapName); else setSave('ออฟไลน์ · บันทึกในเครื่องนี้');
}
let unwatch = null, lastSaved = '';
async function loadMap(name) {
  mapName = name; try { localStorage.setItem('dvmm_last', name); } catch (_) {}
  if (unwatch) { unwatch(); unwatch = null; }
  palTab = name === 'farm' ? 'farm' : 'building';
  let local = null; try { local = JSON.parse(localStorage.getItem('dvmm_' + name) || 'null'); } catch (_) {}
  MAP = local || await fetch(`maps/${name}.json`).then(r => r.json());
  GROUND = await loadImg(`maps/${name}_ground.png`);
  undo = []; redo = []; sel = null; fit(); setSave(local ? 'โหลดจากเครื่องนี้' : 'ผังจาก Claude');
  renderTools(); buildPalette(); renderDock();
  if (Store.ready) await pullOnline(name);
}
async function pullOnline(name) {
  const d = await Store.get('maps/' + name);
  if (d && d.json && mapName === name && d.json !== JSON.stringify(MAP)) { MAP = JSON.parse(d.json); lastSaved = d.json; sel = null; renderDock(); dirty = true; setSave(`ฉบับล่าสุดออนไลน์${d.by ? ' · ' + d.by : ''}`); }
  else setSave('ออนไลน์ · บันทึกอัตโนมัติ');
  unwatch = Store.watch('maps/' + name, v => { if (!v || !v.json || v.json === lastSaved || v.json === JSON.stringify(MAP) || mapName !== name) return; lastSaved = v.json; MAP = JSON.parse(v.json); sel = null; renderDock(); dirty = true; setSave(`${v.by || 'มีคน'}แก้ล่าสุด`); });
}
$('mapSel').onchange = e => loadMap(e.target.value);

// ---------- saving + undo ----------
let saveTimer = null;
function changed() {
  dirty = true; clearTimeout(saveTimer); setSave('กำลังบันทึก…');
  saveTimer = setTimeout(async () => {
    const json = JSON.stringify(MAP); lastSaved = json;
    try { localStorage.setItem('dvmm_' + mapName, json); } catch (_) {}
    if (Store.ready) { try { await Store.set('maps/' + mapName, { json, by: me || 'ไม่ระบุชื่อ', at: Date.now() }); setSave('บันทึกออนไลน์แล้ว'); } catch (_) { setSave('บันทึกในเครื่องแล้ว'); } }
    else setSave('บันทึกในเครื่องแล้ว');
  }, 800);
}
function snapshot() { undo.push(JSON.stringify(MAP)); if (undo.length > 80) undo.shift(); redo = []; }
function restore(json) { MAP = JSON.parse(json); sel = sel && MAP.objects.find(o => o.id === sel.id) || null; renderDock(); changed(); }
$('undo').onclick = () => { if (!undo.length) return toast('ไม่มีอะไรให้ย้อน'); redo.push(JSON.stringify(MAP)); restore(undo.pop()); };
$('redo').onclick = () => { if (!redo.length) return; undo.push(JSON.stringify(MAP)); restore(redo.pop()); };
addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); (e.shiftKey ? $('redo') : $('undo')).click(); return; }
  if (sel && tool === 'move') { const k = { ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1], ArrowLeft: [-1, 0] }[e.key]; if (k) { e.preventDefault(); nudge(...k); } if (e.key.toLowerCase() === 'r') rotate(sel); }
  if (e.key === 'Escape') { sel = null; renderDock(); dirty = true; }
});
const setSave = t => { $('stSave').textContent = t; };
function toast(t, act, fn) { document.querySelectorAll('.toast').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
  if (act) { const b = document.createElement('button'); b.textContent = act; b.onclick = () => { fn(); d.remove(); }; d.appendChild(b); }

// ---------- palette ----------
function buildPalette() {

    pal.innerHTML = Object.keys(TERR_NAME).map(c => `<button data-c="${c}" aria-pressed="${brush.code === c}"><i style="background:${TERR_COL[c]}"></i>${TERR_NAME[c]}</button>`).join('') +
      `<div class="sizes">ขนาดแปรง ${[1, 2, 3].map(n => `<button class="btn" data-s="${n}" aria-pressed="${brush.size === n}">${n}</button>`).join('')}</div>`;
    pal.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { brush.code = b.dataset.c; buildPalette(); renderDock(); });
    pal.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { brush.size = +b.dataset.s; buildPalette(); renderDock(); });
    return;

  $('searchBox').hidden = false; pal.className = 'pal';

  tabs.innerHTML = cats.map(c => `<button class="tab" data-c="${c}" aria-selected="${palTab === c}">${CAT_NAME[c]}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b => b.onclick = () => { palTab = b.dataset.c; $('q').value = ''; buildPalette(); });
  const q = $('q').value.trim();

  pal.innerHTML = items.map(([k, c]) => `<button class="it" data-k="${k}" aria-pressed="${palKey === k}"><img src="mapkit/s/${k}.png" alt="" loading="lazy"><span>${c.name}</span></button>`).join('') || '<div class="hint" style="color:var(--muted)">ไม่พบ</div>';
  pal.querySelectorAll('.it').forEach(b => b.onclick = () => { palKey = b.dataset.k; if (tool !== 'place') setTool('place'); else { buildPalette(); renderDock(); } });

}

      await Store.set('handoff/' + mapName, { json: j, note, by: me || 'ไม่ระบุชื่อ', at: Date.now() });
      const say = `ดึงแผนที่${nm}จาก Map Maker เข้าเกม`;
      msg.innerHTML = `ส่งแล้ว ✓ พิมพ์บอก Claude ในแชทว่า <b style="color:var(--fg)">“${say}”</b>`;
      try { await navigator.clipboard.writeText(say); msg.innerHTML += ' (คัดลอกข้อความไว้ให้แล้ว)'; } catch (_) {}
      setSave('ส่งให้ Claude แล้ว');
    } catch (e) { msg.textContent = 'ส่งไม่ได้ — กด “ดาวน์โหลดไฟล์แทน” แล้วแนบไฟล์ให้ Claude'; }
  };
};
boot();
})();
</script>
</body>
</html>
