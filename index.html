<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2117">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dream Valley</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ui_icons.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hud-card clock-card"><span id="clockIcon" class="uic uic-sun"></span><div><div id="dayLabel">วันที่ 1</div><div id="clock">06:00</div></div></div>
  <div class="hud-card energy-card"><span class="uic uic-energy"></span><div class="ebar"><div id="energyBar"></div></div><b id="energyNum">100</b></div>
  <div class="hud-card small"><span class="uic uic-money"></span><span id="money">฿500</span></div>
  <div class="hud-card small" id="waterCard"><span class="uic uic-water"></span><span id="water">12/12</span></div>
</div>
<div id="ticker"></div>
<div id="notif"></div>
<div id="toast"></div>

<button id="camBtn" class="hidden" title="สลับกล้อง: ตามตัวละคร / อิสระ" aria-label="สลับกล้อง">🎯</button>
<nav id="bar" class="hidden">
  <button id="bagBtn"><span class="uic uic-bag em"></span>กระเป๋า</button>
  <button id="questBtn"><span class="uic uic-quest em"></span>งาน</button>
  <button id="phoneBtn"><span class="uic uic-phone em"></span>มือถือ</button>
  <button id="menuBtn"><span class="uic uic-menu em"></span>เมนู</button>
</nav>

<div id="sheet" class="hidden">
  <div class="sheet-head"><div id="sheetIcon"></div><div><div id="sheetTitle"></div><div id="sheetSub"></div></div></div>
  <div id="sheetBody"></div>
  <button class="btn ghost" id="sheetClose">ปิด</button>
</div>

<div id="cardWrap" class="hidden">
  <div id="card">
    <div class="card-tag" id="cardTag">เหตุการณ์</div>
    <div class="card-art" id="cardArt"></div>
    <div class="card-title" id="cardTitle"></div>
    <div class="card-text" id="cardText"></div>
    <div id="cardChoices"></div>
  </div>
</div>

<div id="scene" class="hidden">
  <div class="scene-box">
    <div class="scene-art" id="sceneArt"><div class="scene-title" id="sceneTitle"></div></div>
    <div class="scene-line"><div class="scene-portrait" id="scenePortrait"></div><div class="scene-body"><div class="scene-name" id="sceneName"></div><div class="scene-text" id="sceneText"></div></div></div>
    <div id="sceneChoices"></div>
  </div>
</div>

<div id="talk" class="hidden">
  <div class="talk-portrait" id="talkPortrait"></div>
  <div class="talk-box"><div class="talk-name" id="talkName"></div><div class="talk-text" id="talkText"></div><div id="talkChoices"></div></div>
</div>

<div id="map" class="hidden"></div>


<div id="phone" class="hidden">
  <div class="phone-body"><div id="phoneScreen"></div><button id="phoneClose" aria-label="ปิดมือถือ"></button></div>
</div>

<div id="panel" class="hidden"></div>

<div id="title">
  <canvas id="tiCv"></canvas>
  <div id="tiDim"></div>
  <div class="ti-ui" id="tiLogo"><div id="tiName">DREAM<small>VALLEY</small></div><div id="tiSub">ชุมชนคนช่างฝัน</div></div>
  <div class="ti-ui" id="tiMenu">
    <button class="primary" data-a="new">เริ่มเกมใหม่</button><button data-a="cont">เล่นต่อ</button><button data-a="upd">อัปเดต<i class="cl-dot hidden" id="clDot"></i></button><button data-a="saves">จัดการเซฟ</button>
    <div id="tiWho"></div>
  </div>
  <div id="loading"><div class="bar"><div id="loadBar"></div></div><small>กำลังโหลด…</small></div>
  <div class="ti-panel" id="tiCreate">
    <h2 id="tiPanelH">สร้างตัวละคร</h2>
    <div id="newOnly">
      <div class="ti-who"><button class="ti-arrow" data-g="-1">‹</button><canvas id="tiPv" width="64" height="64"></canvas><button class="ti-arrow" data-g="1">›</button></div>
      <div class="ti-gname" id="tiGname">ผู้ชาย</div>
    </div>
    <div class="ti-row"><label>ชื่อเล่น</label><input id="pname" maxlength="12" placeholder="เช่น ต้น"></div>
    <div class="ti-row"><label>รหัส 6 ตัว</label><input id="pcode" maxlength="6" placeholder="ABC123" autocomplete="off" autocapitalize="characters"><button class="ti-small" id="genCode" type="button">สุ่ม</button></div>
    <div class="ti-row" id="dlRow"><label>1 วันในเกม</label><div class="ti-days"><button data-m="5">5 นาที</button><button class="on" data-m="10">10 นาที</button><button data-m="15">15 นาที</button></div></div>
    <div class="ti-hint">จด <b>ชื่อ + รหัส</b> ไว้ ใช้เข้าเล่นต่อครั้งหน้า</div>
    <div id="loginErr"></div>
    <div class="ti-btns"><button class="back" id="tiBack">กลับ</button><button class="go" id="startBtn">ไปบ้านยาย</button></div>
    <div class="ti-hint" id="cloudNote"></div>
  </div>
  <div id="tiSaves" class="hidden"><div class="box"><h3>เซฟในเครื่องนี้</h3><div id="tiSaveList"></div><button class="tsv-close">ปิด</button></div></div>
  <div id="tiScroll"><div class="roll"></div><div class="paper" id="tiPaper"></div><div class="roll"></div></div>
  <div id="tiVer"></div><div id="tiSkip">แตะเพื่อข้าม</div>
</div>
<canvas id="tiCurtain"></canvas>

<script src="data/world.js"></script>
<script src="data/meta.js"></script>
<script src="data/catalog.js"></script>
<script src="data/npcs.js"></script>
<script src="data/story.js"></script>
<script src="changelog.js"></script>
<script src="cards.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/farm.js"></script>
<script src="js/people.js"></script>
<script src="js/story.js"></script>
<script src="js/line.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/fbroom.js"></script>
<script src="js/net.js"></script>
<script src="js/ui.js"></script>
<script src="js/minigames.js"></script>
<script src="js/ghosts.js"></script>
<script src="js/life.js"></script>
<script src="js/audio.js"></script>
<script src="js/intro.js"></script>
<script src="js/main.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent/.test(location.host)) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
