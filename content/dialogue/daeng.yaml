# ลุงพรานแดง — พรานป่ารุ่นเก่า ชายป่าท้ายหมู่บ้าน · convos + quests
convos:
  # ===== react =====
  - id: daeng_r_thana_visit
    topic: react
    once: true
    when: { flag: story_thana_visit }
    npc: "คนใส่เชิ้ตขาวขับรถเก๋งเข้าซอยบ้านยายเอ็งเมื่อวาน… รถเก๋งเข้าซอยนั้นได้ แปลว่าเขาตั้งใจมากนะหลาน ซอยนั้นหลุมเท่าบ่อปลา"
    options:
      - text: "เขามาขอซื้อที่{k}ลุง"
        heart: 1
        reply: "รู้… ยายเอ็งไล่เขามาสามรอบ รอบสุดท้ายลุงยืนอยู่ปากซอย เห็นยายถือจอบ ลุงไม่ได้ช่วยอะไร ลุงแค่ยืนให้เขาเห็นว่ามีพรานอยู่"
        next:
          - text: "ลุงยืนเฉยๆ ก็ช่วยแล้ว{k}"
            heart: 2
            reply: "เสือมันก็ยืนเฉยๆ คนก็ไม่กล้าเข้าป่า… ลุงแก่แล้ว ยืนได้อย่างเดียว"
          - text: "ครั้งหน้าลุงมายืนอีกได้ไหม{kq}"
            heart: 1
            reply: "ได้… ลุงจะถือแหมาด้วย ไม่ได้จะเหวี่ยงใส่ใคร แค่ถือ คนเมืองกลัวแห"
      - text: "ลุงรู้ได้ไง{kq}"
        heart: 0
        reply: "รอยล้อ… รอยล้อรถเก๋งกว้างกว่ารถกระบะสองนิ้ว ลุงอ่านรอยสัตว์ได้ ก็อ่านรอยคนได้"

  - id: daeng_r_well_dry
    topic: react
    when: { flag: story_well_dry }
    npc: "หนองกลางป่าแห้งไปอีกหนอง… เมื่อเช้าลุงเห็นรอยกวางเดินลงมาถึงคลองหลังวัด กวางไม่เคยลงมาใกล้คนขนาดนี้"
    options:
      - text: "กวางหิวน้ำเหรอ{kq}"
        heart: 1
        reply: "หิว… สัตว์ไม่มีบ่อบาดาล มันมีแต่หนอง หนองแห้ง มันก็เดินตามน้ำมา ถ้าใครเห็นกวางในหมู่บ้าน อย่าไล่ บอกลุง"
        next:
          - text: "ถ้ามีคนจะยิงล่ะ{kq}"
            heart: 2
            reply: "…ลุงจะไปยืนข้างกวาง ลุงไม่มีปืนแล้ว แต่ลุงมีปาก ปากพรานแก่ยังดังกว่าปืนในหมู่บ้านนี้"
          - text: "{p}จะบอกทุกคนในกลุ่ม LINE{k}"
            heart: 1
            reply: "ดี… บอกว่าห้ามยิง ห้ามจับ อย่าบอกว่ากวางอยู่ตรงไหน คนบางคนอ่านแล้วไม่ได้คิดเรื่องน้ำ คิดเรื่องลาบ"
      - text: "เพราะบริษัทดูดน้ำใช่ไหม{kq}"
        heart: 1
        reply: "ลุงไม่รู้เรื่องท่อ… ลุงรู้ว่าหนองนั้นมีน้ำมาห้าสิบปี ลุงเคยหลบแล้งที่นั่นตอนหนุ่ม ปีนี้ลุงเดินข้ามมันได้ไม่เปียกเท้า"

  - id: daeng_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "คนงานบริษัทเห็นผู้หญิงยืนข้างปั๊มใช่ไหม… ลุงไม่แปลกใจ ตรงนั้นเคยเป็นต้นตะเคียนใหญ่ เขาโค่นไปตอนตั้งปั๊ม ไม่ไหว้ไม่ขอ"
    options:
      - text: "นางตะเคียนเหรอ{kq}"
        heart: 1
        reply: "ลุงไม่บอกว่าใคร… แต่ลุงเคยหลงป่าตอนหนุ่ม มีผู้หญิงชุดไทยยืนชี้ทางออกให้ใต้ต้นนั้น ลุงไม่เคยเล่าให้ใคร วันนี้เล่าครั้งแรก"
        next:
          - text: "{p}จะไม่เล่าต่อ{k}"
            heart: 2
            reply: "เล่าได้… ตอนนี้ไม่มีใครหาว่าลุงบ้าแล้ว คนงานบริษัทบ้าไปสามคนก่อนลุง"
          - text: "นางคงโกรธที่โดนโค่นบ้าน{k}"
            heart: 1
            reply: "ใครไม่โกรธ… ถ้ามีคนมาโค่นบ้านเอ็งตอนเอ็งหลับ เอ็งก็ออกมายืนข้างเครื่องจักรเหมือนกัน"
      - text: "ลุงเชื่อเรื่องผีไหม{kq}"
        heart: 0
        reply: "ลุงเชื่อกฎของป่า… อะไรที่อยู่ก่อนเรา ต้องขอก่อน ไม่ขอแล้วโดน ไม่ต้องเชื่อผีก็เข้าใจ"

  - id: daeng_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ผู้สมัครคนหนึ่งเดินมาถึงชายป่า ยื่นใบปลิวให้ลุง เขียนว่า ‘ปลูกป่าล้านต้น’… ลุงถามว่าปลูกตรงไหน เขาชี้ไปที่ป่าที่มีอยู่แล้ว"
    options:
      - text: "ปลูกในป่าที่มีอยู่แล้วได้ด้วยเหรอ{kq}"
        heart: 1
        reply: "ได้… ปลูกให้ถ่ายรูป ต้นไม้ในรูปขึ้นง่ายกว่าต้นไม้ในดิน ปีก่อนก็ปลูกสามร้อยต้นตรงนั้น เหลือรอดสองต้น อีกสองร้อยเก้าสิบแปดต้นอยู่ในเพจ อบต."
        next:
          - text: "สองต้นที่รอดอยู่ตรงไหน{kq}"
            heart: 1
            reply: "ต้นหนึ่งลุงรดน้ำเอง อีกต้นขึ้นเองข้างป้ายโครงการ… ป้ายล้มไปแล้ว ต้นไม้ยังอยู่ ลุงว่าต้นไม้ชนะ"
          - text: "ลุงน่าจะไปพูดที่เวทีหาเสียง{k}"
            heart: 1
            reply: "ลุงพูดได้สามประโยค แล้วก็ต้องเดินกลับป่า… ประโยคแรก ‘ป่ามีอยู่แล้ว’ ประโยคสอง ‘อย่าดูดน้ำมัน’ ประโยคสาม ‘ลุงกลับละ’"
      - text: "ลุงจะเลือกใคร{kq}"
        heart: 1
        reply: "คนที่กล้าเดินเข้าป่าลึกกับลุงหนึ่งคืน… ยังไม่มีใครรับคำท้า ผู้สมัครคนนั้นรีบกลับก่อนห้าโมง"

  - id: daeng_r_snake
    topic: react
    once: true
    when: { flag: met_snake }
    npc: "เจองูเขียวมาใช่ไหม… ลุงเห็นเอ็งเดินยกเท้าสูงๆ เหมือนไก่เหยียบน้ำร้อน"
    options:
      - text: "มันมีพิษไหม{kq}ลุง"
        heart: 1
        reply: "เขียวหางไหม้มีพิษ เขียวปากจิ้งจกไม่ค่อยมี… ดูหาง หางแดงถอยออกมา หางไม่แดงก็ถอยออกมา ถอยไว้ก่อนดีที่สุด"
      - text: "{p}เกือบเหยียบมันแล้ว{k}"
        heart: 1
        reply: "งูไม่ได้มาหาเอ็ง เอ็งเดินไปหามัน… เดินหญ้ารกให้ไม้เคาะนำหน้า งูได้ยินแล้วมันหลบเอง มันก็ไม่อยากเจอเอ็ง"
      - text: "ทำไมไม่ฆ่ามันไปเลย{kq}"
        heart: -1
        reply: "มันกินหนูในแปลงเอ็ง… ฆ่ามันแล้วหนูกินแปลงเอ็งแทน เอ็งจะไปฆ่าหนูทีละตัวเหรอ"

  - id: daeng_r_end_teach
    topic: react
    once: true
    when: { flag: daeng_end_teach }
    npc: "เมื่อวานลุงพาน้องมิวน้องโอ๊ตเดินชายป่า… น้องโอ๊ตเห็นไก่ป่าตัวจริงครั้งแรก ร้องลั่นป่าจนไก่ป่าบินหนี แต่ลุงไม่ว่า ลุงก็ร้องแบบนั้นตอนเห็นครั้งแรก"
    options:
      - text: "น้องมิวว่าไงบ้าง{kq}"
        heart: 1
        reply: "ถามว่าทำไมไก่ป่าสวยกว่าไก่บ้านสิบเจ็ดรอบ… ลุงตอบไม่ได้สักรอบ ครูเต้ยจดไว้ บอกว่าจะให้เป็นการบ้าน"
      - text: "ลุงยิ้มด้วยเหรอ{kq}"
        heart: 2
        reply: "…ลุงยิ้มตอนไหน ใครเห็น ลุงไม่ได้ยิ้ม ฟันโยกมันโผล่เอง"

  - id: daeng_r_end_confess
    topic: react
    once: true
    when: { flag: daeng_end_confess }
    npc: "ลุงเล่าเรื่องปืนให้คนที่ศาลาวัดฟังแล้ว… พระอาจารย์สุเมธฟังจนจบ แล้วบอกว่า ‘รู้ตัวก็เริ่มแล้ว’ ลุงไม่เข้าใจทั้งหมด แต่โล่งอก"
    options:
      - text: "คนในตำบลว่าไงบ้าง{kq}"
        heart: 1
        reply: "ป้าแต๋วร้องไห้ ลุงสมหมายถามว่าปืนเลขทะเบียนอะไร… ป้าทองใบเอาแกงหม้อแรกมาให้ลุงทั้งที่ไม่ใช่งานบุญ"
      - text: "ลุงกล้ามากเลย{k}"
        heart: 2
        reply: "ไม่ได้กล้า… แก่แล้วไม่อยากเก็บของหนักไว้คนเดียว ปืนไม้บนฝาลุงจะแขวนต่อ คราวนี้ทุกคนรู้ว่ามันเป็นไม้"

  - id: daeng_r_end_forest
    topic: react
    once: true
    when: { flag: daeng_end_forest }
    npc: "ปาล์มกับไอ้กล้ามาเดินสำรวจป่าชุมชนกับลุงสามวัน… ปาล์มจดชื่อต้นไม้สองร้อยต้น ไอ้กล้าจดระดับน้ำทุกหนอง ลุงจดแค่ว่าตรงไหนห้ามเข้า"
    options:
      - text: "ทำไมต้องจดตรงห้ามเข้า{kq}"
        heart: 1
        reply: "ป่ามีที่ของผี ที่ของสัตว์ ที่ของคน… ถ้าเขียนแผนที่แล้วไม่บอกที่ห้ามเข้า คนจะเดินไปทุกที่ แล้วป่าก็ไม่เหลือที่ให้ใคร"
      - text: "ยื่นเรื่องป่าชุมชนไปแล้วเหรอ{kq}"
        heart: 1
        reply: "ยื่นแล้ว… อำเภอบอกรอพิจารณาหกเดือน ลุงรอได้ ต้นยางนามันรอมาร้อยปี"

  # ===== news =====
  - id: daeng_n_junglefowl
    topic: news
    npc: "ไก่ป่ากลับมาขันชายป่าเยอะขึ้นปีนี้… เมื่อเช้าลุงนับได้เจ็ดตัว ตัวผู้หางยาวสีทองหนึ่งตัว สวยกว่าไก่ชนกำนันอีก"
    options:
      - text: "อย่าให้กำนันได้ยินนะ{kq}"
        heart: 1
        reply: "กำนันได้ยินแล้ว… มาขอดูถึงชายป่า ลุงพาไป ไก่ป่าบินหนีตั้งแต่ได้ยินเสียงกำนันพูดเรื่องไก่ตัวเอง"
      - text: "ทำไมมันกลับมา{kq}"
        heart: 1
        reply: "คนเลิกวางบ่วงไปหลายปี… ไอ้กล้าเลิกฉีดยาในนาริมป่า แมลงก็กลับมา ไก่ป่ากินแมลง ทุกอย่างผูกกันเป็นเชือกเส้นเดียว"
        next:
          - text: "เหมือนเส้นด้ายยายจันทร์เลย{k}"
            heart: 1
            reply: "ยายจันทร์พูดแบบนี้ทุกเรื่อง… แต่ยายจันทร์ถูกนะ ป่าก็ทอแบบผ้า ดึงเส้นเดียวขาด ทั้งผืนก็หลวม"
          - text: "{p}อยากไปดูบ้าง{k}"
            heart: 1
            reply: "มาตอนหกโมงเช้า ห้ามพูด ห้ามใส่เสื้อแดง ห้ามพกโทรศัพท์ที่มีเสียง… ถ้าทำได้สามข้อ ลุงพาไป"

  - id: daeng_n_bees
    topic: news
    npc: "ผึ้งหลวงทำรังบนต้นยางนาใหญ่หลังวัดแล้วสิบสองรัง… มีคนนอกมาถามจะซื้อเหมาทั้งต้น ลุงบอกว่าต้นไม้ไม่ใช่ของลุง ผึ้งก็ไม่ใช่ของลุง"
    options:
      - text: "แล้วลุงตีรังผึ้งเองไหม{kq}"
        heart: 1
        reply: "ตีสองรังต่อปี เอาครึ่งรัง ทิ้งตัวอ่อนไว้ให้มันอยู่ต่อ… คนนอกจะเอาทั้งสิบสองรังเผาไฟทีเดียว ปีหน้าไม่มีผึ้งสักตัว"
      - text: "เขาให้ราคาเท่าไหร่{kq}"
        heart: 0
        reply: "หมื่นห้า… ลุงคิดเป็นปี ผึ้งสิบสองรังให้น้ำผึ้งตำบลกินสิบปี หมื่นห้าคนเดียวกินได้ไม่ถึงปี"

  - id: daeng_n_amulet
    topic: news
    npc: "มีคนเอาพระเครื่องวัดเจริญทรัพย์ในอำเภอมาขายลุง บอกว่ารุ่นกันงูกัด องค์ละเก้าร้อย… ลุงถามว่าห้อยแล้วงูไม่กัดเหรอ เขาบอกว่างูกัดแต่ไม่เจ็บ"
    options:
      - text: "ลุงซื้อไหม{kq}"
        heart: 1
        reply: "ไม่ซื้อ… ลุงไหว้เจ้าที่ ไหว้พระที่วัดดงเย็น ใส่รองเท้าบูท เดินเคาะไม้ สามอย่างนี้กันงูได้ดีกว่ารุ่นไหนในอำเภอ"
      - text: "งูกัดแต่ไม่เจ็บ{k} คิดได้ไง"
        heart: 1
        reply: "เขาบอกว่ารุ่นหน้าจะกันผีด้วย ราคาจะขึ้นเป็นพันสอง… ลุงว่ารุ่นที่กันคนขายได้น่าจะขายดีกว่า"

  - id: daeng_n_firebreak
    topic: news
    when: { day_min: 5 }
    npc: "ลุงจะทำแนวกันไฟรอบป่าชุมชนวันเสาร์ อบต. บอกให้งบอาสาสมัครหัวละร้อย… ปีก่อนก็บอก ยังไม่ได้ ปีนี้ลุงไม่ถามแล้ว ลุงถางเอง"
    options:
      - text: "{p}ไปช่วยถางได้ไหม{kq}"
        heart: 2
        reply: "มาได้… เอามีดพร้ามา น้ำมาเอง ข้าวมาเอง ป้าทองใบบอกจะเอาข้าวห่อมาให้ ถ้าคนมาเกินสิบ ป้าบอกไม่ไหว"
      - text: "งบอาสาไปไหน{kq}"
        heart: 1
        reply: "ไปเป็นเสื้อกั๊กสีส้มสกรีนชื่อโครงการ… ห้าสิบตัว ใส่ถ่ายรูปวันเปิดโครงการ แล้วเก็บเข้าตู้ ลุงยังไม่เคยใส่"
      - text: "ทำไมต้องทำแนวกันไฟ{kq}"
        heart: 1
        reply: "หน้าแล้งใบไม้แห้งเต็มป่า ก้นบุหรี่ก้นเดียว… ถ้ามีแนวถางไว้ ไฟมาถึงแนวมันหยุด เหมือนคนเจอรั้ว"

  - id: daeng_n_bigfish
    topic: news
    npc: "เด็กอู่บอลมาเล่าว่าเห็นเงาปลาใหญ่ในอ่างเก็บน้ำ ยาวเท่าเรือ… ทั้งตำบลแห่ไปตกกันวันอาทิตย์ ลุงไม่ไป"
    options:
      - text: "ทำไมลุงไม่ไป{kq}"
        heart: 1
        reply: "ปลาตัวนั้นอยู่มาก่อนคนพวกนั้นเกิด… มันเห็นเบ็ดมามากกว่าที่คนพวกนั้นเห็นปลา ไม่มีใครได้หรอก"
        next:
          - text: "ลุงเคยตกได้ใช่ไหม{kq}"
            heart: 2
            reply: "…ใครบอกเอ็ง ลุงไม่เคยเล่า… เออ เคย แล้วก็ปล่อย มันมองลุงตาเดียว แล้วว่ายกลับลงไป ลุงไม่อยากเป็นคนสุดท้ายที่มันเห็น"
          - text: "ลุงกลัวว่าเขาจะได้ใช่ไหม{kq}"
            heart: 1
            reply: "กลัวนิดหนึ่ง… แต่ปลาใหญ่ขนาดนั้น ถ้าเบ็ดไม่ดีจริง มันลากคนลงน้ำแทน ลุงไปยืนห่างๆ เผื่อต้องกระโดดช่วยคน ไม่ใช่ช่วยปลา"
      - text: "ปลาใหญ่ขนาดนั้นมีจริงเหรอ{kq}"
        heart: 0
        reply: "มีหรือไม่มีก็ได้… คนต้องมีอะไรให้ไปตกวันอาทิตย์ ดีกว่าไปนั่งวงเหล้า"

  # ===== advice =====
  - id: daeng_a_honey
    topic: advice
    npc: "ถ้าเจอรังผึ้ง อย่าเอาหมด… เอาครึ่งเดียว ทิ้งตัวอ่อนไว้ ผึ้งมันจำได้ว่าใครเอาแต่พอ"
    options:
      - text: "ผึ้งจำคนได้จริงเหรอ{kq}"
        heart: 1
        reply: "จำ… ลุงตีรังต้นเดิมมาสามสิบปี ยังไม่เคยโดนต่อยหนัก คนที่เผาทั้งรังโดนต่อยทั้งหมู่บ้าน"
      - text: "ครึ่งเดียวขายได้ไม่พอ{k}"
        heart: 0
        reply: "พอปีนี้ ไม่พอปีหน้า… เอาหมดพอปีนี้ ปีหน้าไม่มี เอ็งเลือกเอง ลุงเลือกไปแล้ว"
      - text: "ลุงสอนตีรังผึ้งได้ไหม{kq}"
        heart: 2
        reply: "ได้… ต้องรมควันจากใบไม้สด ไม่ใช่ไฟ ใส่เสื้อแขนยาว ไม่ใช้น้ำหอม เอ็งตัวหอมสบู่ ผึ้งจะนึกว่าเอ็งเป็นดอกไม้ แล้วเอ็งจะเสียใจ"

  - id: daeng_a_tracks
    topic: advice
    npc: "เดินชายป่าให้ก้มดูดินด้วย… รอยเท้าบอกว่าใครเดินมาก่อนเรา เดินไปทางไหน กี่ชั่วโมงแล้ว"
    options:
      - text: "ดูยังไงว่ากี่ชั่วโมง{kq}"
        heart: 1
        reply: "ขอบรอยคม แปลว่าใหม่ ขอบรอยพัง มีมดเดินในรอย แปลว่าเก่า… รอยคนก็เหมือนกัน รอยรองเท้าบูทใหม่ๆ เมื่อวานเป็นคนบริษัท"
      - text: "{p}เห็นรอยแปลกๆ ใกล้ฟาร์ม{k}"
        heart: 1
        reply: "รอยอะไร… สามนิ้วชี้หน้าเป็นนก สี่นิ้วกลมเป็นแมว ถ้ารอยเท้าคนเดินถอยหลัง อย่าตามไป ลุงบอกแค่นี้"
        next:
          - text: "ทำไมรอยเดินถอยหลังห้ามตาม{kq}"
            heart: 1
            reply: "คนไม่เดินถอยหลังในป่า… ยายบัวรู้เรื่องนี้ดีกว่าลุง ไปถามยายบัว แล้วอย่ามาเล่าให้ลุงฟัง"
          - text: "เดี๋ยว{p}ถ่ายรูปมาให้ลุงดู{k}"
            heart: 1
            reply: "ได้… ใช้นิ้ววางข้างรอยด้วย ให้เห็นว่าใหญ่แค่ไหน รูปไม่มีอะไรเทียบ ลุงดูไม่ออก"

  - id: daeng_a_bait
    topic: advice
    when: { has_item: worm }
    npc: "เอ็งมีไส้เดือนในกระเป๋า… ตกปลานิลตอนเย็นใช้ไส้เดือนครึ่งตัว ทั้งตัวปลามันกินแล้วไม่ติดเบ็ด"
    options:
      - text: "ครึ่งตัวมันไม่ตายเหรอ{kq}"
        heart: 0
        reply: "ตาย… ลุงบอกตรงๆ พรานไม่มีเหยื่อที่ไม่ตาย ถ้าใจไม่ถึง ใช้ข้าวสุกปั้นก็ได้ ปลาตะเพียนชอบ"
      - text: "ให้ลุงตัวหนึ่งไหม{kq}"
        heart: 2
        take: { worm: 1 }
        reply: "…ตัวอ้วน ขุดจากดินดี ดินยายเอ็งยังมีชีวิต ขอบใจหลาน พรุ่งนี้ลุงเอาปลามาให้"

  - id: daeng_a_ask_first
    topic: advice
    npc: "ก่อนเก็บอะไรในป่า พูดในใจหนึ่งคำ ‘ขอนะ’… เห็ดก็ขอ หน่อไม้ก็ขอ ฟืนก็ขอ"
    options:
      - text: "ขอแล้วใครตอบ{kq}"
        heart: 1
        reply: "ไม่มีใครตอบ… แต่คนที่ขอ จะเก็บน้อยลงเอง ไม่ต้องมีใครห้าม ลุงว่านั่นคือคำตอบ"
      - text: "{p}ขอทุกครั้ง{k} ยายสอนไว้"
        heart: 2
        reply: "ยายเอ็งสอนเหรอ… ยายเอ็งเก็บเห็ดได้น้อยที่สุดในหมู่บ้าน แต่ไม่เคยหลงป่าสักครั้ง ลุงสังเกตมาสี่สิบปี"

  # ===== smalltalk =====
  - id: daeng_s_dog
    topic: smalltalk
    npc: "หมาลุงชื่อไอ้ตูบ เป็นหมาพรานที่ขี้ขลาดที่สุดในอำเภอ… ได้ยินเสียงกิ่งไม้หักมันวิ่งกลับบ้านก่อนลุงทุกที"
    options:
      - text: "แล้วลุงเลี้ยงมันทำไม{kq}"
        heart: 1
        reply: "มันวิ่งกลับก่อนแปลว่ามันรู้ก่อน… หมาขี้ขลาดอยู่รอดในป่า หมากล้าตายไปหมดแล้ว"
      - text: "ไอ้ตูบน่ารัก{k}"
        heart: 1
        reply: "น่ารักตอนนอนใต้เตียง… ออกจากใต้เตียงมาเห่าหมาบ้านอื่นแล้ววิ่งกลับมาหลบ หมาตัวนี้มีชีวิตแบบผู้สมัครบางคน"

  - id: daeng_s_khaolam
    topic: smalltalk
    npc: "ข้าวหลามเผาในป่า ใช้ไผ่ข้าวหลามปล้องยาว เยื่อหนา ข้าวเหนียวแช่กะทิ… กินกลางป่ากับปลาย่าง ร้านไหนในอำเภอก็สู้ไม่ได้"
    options:
      - text: "ทำไมกินในป่าอร่อยกว่า{kq}"
        heart: 1
        reply: "เพราะเหนื่อยก่อนกิน… คนในร้านไม่ได้เดินมาสามกิโล ลิ้นมันไม่หิวพอ"
      - text: "ยายจันทร์ก็เผาข้าวหลามเก่งนะ{kq}"
        heart: 1
        reply: "ยายจันทร์เผาเก่งกว่าลุง ลุงยอมรับ… ยายจันทร์ไม่ใส่น้ำตาลเยอะ คนแก่กินได้ ลุงขอยายทุกงานกำฟ้า"
        next:
          - text: "ลุงไปงานกำฟ้าด้วยเหรอ{kq}"
            heart: 1
            reply: "ไปฟังฟ้าร้อง… ไทยพวนเขาฟังฟ้าทายฝน ลุงฟังฟ้าทายปลา ฟ้าร้องทางเหนือปีนั้นปลาเยอะ ไม่เคยพลาด"
          - text: "{p}อยากลองกินข้าวหลามในป่า{k}"
            heart: 1
            reply: "ได้… วันไหนเอ็งไปช่วยลุงถางแนวกันไฟ ลุงเผาให้กลางป่า เหนื่อยก่อนแล้วค่อยกิน"

  - id: daeng_s_stars
    topic: smalltalk
    when: { time: evening }
    npc: "ฟ้าใสคืนนี้… ดาวลูกไก่ขึ้นแล้ว ลุงดูดาวรู้ทิศ ไม่ต้องมีโทรศัพท์ โทรศัพท์ไม่มีสัญญาณในป่า ดาวมีทุกคืน"
    options:
      - text: "สอน{p}ดูดาวหน่อย{k}"
        heart: 2
        reply: "ดาวลูกไก่เจ็ดดวง ขึ้นทางตะวันออก… เห็นแล้วต้องรีบกลับบ้าน เพราะแปลว่าดึกแล้ว สามทุ่มผีออก บทเรียนแรกจบ"
      - text: "ทำไมเรียกดาวลูกไก่{kq}"
        heart: 1
        reply: "แม่ไก่ตายเพราะคนจะเอาไปทำกับข้าวเลี้ยงพระ ลูกไก่กระโดดเข้ากองไฟตามแม่… ยายลุงเล่า ลุงฟังแล้วไม่กินไก่ไปหนึ่งเดือน"

  - id: daeng_s_rain
    topic: smalltalk
    when: { rain: true }
    npc: "ฝนตก ปลาว่ายทวนน้ำขึ้นนาแล้ว… ลุงไม่ไปวางไซวันนี้ ลุงนั่งฟังฝนตกบนหลังคาสังกะสี เพลงที่ลุงชอบที่สุด"
    options:
      - text: "ทำไมไม่ไปวางไซ{kq} ปลาเยอะ"
        heart: 1
        reply: "ปลามันก็ต้องมีวันได้ว่ายไปไหนก็ได้บ้าง… วันนี้วันมัน ลุงหยุด"
      - text: "{p}ก็ชอบเสียงฝนบนสังกะสี{k}"
        heart: 1
        reply: "บ้านยายเอ็งหลังคาสังกะสีครึ่งหนึ่ง กระเบื้องครึ่งหนึ่ง… ฝนตกบ้านยายเอ็งเสียงสองแบบ ยายเอ็งบอกว่าเหมือนวงดนตรี"

  # ===== self =====
  - id: daeng_f_city_hunter
    topic: self
    npc: "สมัยหนุ่ม ลุงพาคนเมืองเข้าป่าล่าสัตว์ ได้เงินวันละสามร้อย สมัยนั้นเยอะมาก… คนเมืองยิงแล้วถ่ายรูป ลุงแบกซากออกมา"
    options:
      - text: "ลุงเลิกเพราะอะไร{kq}"
        heart: 1
        reply: "ป่าเงียบ… ปีหนึ่งลุงเดินทั้งวันไม่ได้ยินเสียงนกสักตัว ลุงรู้ว่าลุงเป็นคนหนึ่งที่ทำให้มันเงียบ"
      - text: "ได้เงินเยอะนะ{kq}"
        heart: 0
        reply: "เยอะ… ใช้หมดภายในเดือน ป่าที่หายไปใช้เวลาห้าสิบปียังไม่กลับมาครบ เงินกับป่าหายเร็วไม่เท่ากัน"

  - id: daeng_f_son
    topic: self
    when: { heart_min: 3 }
    npc: "ลูกชายลุงเป็นเจ้าหน้าที่ป่าไม้อยู่ทางเหนือ… พ่อเป็นพราน ลูกเป็นคนจับพราน ลุงว่าฟ้ามันขำดี"
    options:
      - text: "ลุงภูมิใจในตัวเขาไหม{kq}"
        heart: 2
        reply: "…ภูมิใจ ลุงไม่เคยบอกมัน มันโทรมาทุกวันพระ ถามว่าพ่อยังเข้าป่าไหม ลุงบอกเข้า มันถามว่าเข้าไปทำอะไร ลุงบอกไปดูว่าป่ายังอยู่"
        next:
          - text: "บอกเขาสักครั้งสิ{kq}ว่าภูมิใจ"
            heart: 2
            reply: "…ปากลุงพูดเรื่องป่าได้ทั้งวัน พูดเรื่องนี้ไม่ออก ลุงจะส่งปลากรอบไปให้มันแทน มันรู้"
          - text: "เขาเคยจับพรานจริงไหม{kq}"
            heart: 1
            reply: "จับ… มันเล่าว่าพรานคนนั้นอายุเท่าลุงตอนหนุ่ม มันนั่งคุยกับพรานคนนั้นทั้งคืน เหมือนนั่งคุยกับพ่อมันเมื่อสามสิบปีก่อน"
      - text: "ลูกลุงเก่งนะ{kq}"
        heart: 1
        reply: "เก่งกว่าพ่อ… อ่านหนังสือคล่องกว่าพ่อ อ่านรอยสัตว์ไม่เก่งเท่า แต่ไม่เป็นไร เดี๋ยวนี้เขาใช้กล้องดักถ่าย"

  - id: daeng_f_marks
    topic: self
    when: { heart_min: 5 }
    npc: "เสาบ้านลุงมีรอยมีดบากไว้เป็นแถว… ทุกรอยคือสัตว์หนึ่งตัวที่ลุงล่า ลุงไม่เคยลบ แต่ไม่ได้บากเพิ่มมายี่สิบปีแล้ว"
    options:
      - text: "มีกี่รอย{kq}ลุง"
        heart: 1
        reply: "สองร้อยสิบสาม… ลุงนับทุกปีวันเข้าพรรษา นับเสร็จก็จุดธูปหนึ่งดอก ไม่ได้ขอโทษ เพราะขอโทษไม่ได้ทำให้มันกลับมา แค่จำไว้"
      - text: "ทำไมไม่ลบทิ้ง{kq}"
        heart: 2
        reply: "ลบแล้วลุงจะลืม… คนที่ลืมว่าเคยทำอะไร จะทำซ้ำได้ง่ายที่สุด"

  - id: daeng_f_last_hunt
    topic: self
    when: { heart_min: 7 }
    npc: "รู้ไหมหลาน ลุงเลิกล่าวันไหน… วันที่ลุงยิงชะนีตัวแม่ แล้วลูกมันเกาะอกแม่ไม่ปล่อย ลุงเอาลูกมันกลับมาเลี้ยงสามเดือน แล้วมันก็ตาย ลุงวางปืนวันนั้น"
    options:
      - text: "(นั่งเงียบๆ ข้างลุง)"
        heart: 2
        reply: "…ขอบใจที่ไม่พูดอะไร คนส่วนใหญ่บอกลุงว่า ‘ลุงไม่ได้ตั้งใจ’ ลุงตั้งใจหลาน ลุงตั้งใจยิง แค่ไม่ได้ตั้งใจให้มันเจ็บขนาดนี้"
      - text: "ลุงยังคิดถึงมันไหม{kq}"
        heart: 2
        reply: "ทุกครั้งที่ได้ยินเสียงชะนีร้องตอนเช้าในป่าลึก… ชะนีกลับมาร้องในป่าดงเย็นปีที่แล้ว ครั้งแรกในยี่สิบปี ลุงนั่งฟังจนสาย"
      - text: "ลุงเลิกแล้ว{k} นั่นสำคัญที่สุด"
        heart: 1
        reply: "เลิกแล้วก็ยังเป็นคนที่เคยทำ… แต่เอ็งพูดถูก ลุงเลือกได้แค่วันนี้ วันก่อนเลือกไม่ได้แล้ว"

  # ===== others =====
  - id: daeng_o_thongbai
    topic: others
    npc: "ทองใบเข้าป่าทางทิศใต้ ลุงเข้าทางทิศเหนือ… สี่สิบปีเราไม่เคยเดินทางเดียวกัน แต่เจอกันที่ปลายทางทุกงานบุญ ลุงมีปลา ทองใบมีหม้อ"
    options:
      - text: "ทำไมไม่เข้าป่าทางเดียวกัน{kq}"
        heart: 1
        reply: "ทองใบพูดเยอะ ปลาหนี ลุงพูดน้อย เห็ดไม่สน… แยกกันดีกว่า เจอกันตอนหิว"
      - text: "ป้าทองใบเก็บหม้อแรกให้ลุงทุกงานจริงเหรอ{kq}"
        heart: 1
        reply: "จริง… ปีนี้ทองใบบอกว่าแกงเผ็ดน้อยให้เพราะฟันลุงโยก ลุงไม่ได้บอกใครว่าฟันโยก ทองใบรู้ได้ไง ลุงยังไม่รู้"

  - id: daeng_o_sathian
    topic: others
    npc: "ลุงไปแจ้งดาบเสถียรเรื่องคนช็อตปลาในคลอง… ดาบจดใส่สมุด บอก ‘พรุ่งนี้ดาบไปดู’ สมุดเล่มนั้นมีคำว่าพรุ่งนี้มากกว่าคำอื่น"
    options:
      - text: "ดาบไปดูจริงไหม{kq}"
        heart: 1
        reply: "ไป… อาทิตย์ต่อมา ตอนกลางวัน คนช็อตปลามาตอนกลางคืน ดาบบอกกลางวันปลอดภัยกว่า ดาบพูดถูก ปลอดภัยสำหรับทุกคนรวมทั้งคนช็อตปลา"
      - text: "ดาบไม่อยากทำงานเหรอ{kq}"
        heart: 1
        reply: "ดาบเคยขยัน… ลุงจำได้ ตอนดาบมาใหม่จับคนตัดไม้ได้สามราย แล้วคนตัดไม้กลับมาตัดต่อภายในอาทิตย์เดียว ดาบเลยเริ่มพูดพรุ่งนี้ตั้งแต่ตอนนั้น"

  - id: daeng_o_bua
    topic: others
    npc: "ก่อนเข้าป่าลึก ลุงไปถามยายบัวทุกครั้ง… ยายบัวเคี้ยวหมากสามคำ แล้วบอกว่า ‘วันนี้ไม่ดี’ หรือ ‘ไปได้ ไหว้ตะเคียนด้วย’ ลุงเชื่อยายบัวมากกว่าพยากรณ์อากาศ"
    options:
      - text: "ยายบัวเคยห้ามแล้วลุงไม่ฟังไหม{kq}"
        heart: 1
        reply: "ครั้งเดียว… ลุงไป แล้วหลงป่าสามวัน กลับมายายบัวไม่ด่า ยายบัวให้กินข้าวต้ม แล้วบอกว่า ‘ครั้งหน้าฟัง’ ลุงฟังตั้งแต่นั้น"
      - text: "ยายบัวกับป้าทองใบสนิทกันใช่ไหม{kq}"
        heart: 1
        reply: "ยายบัวดูผี ทองใบดูเห็ด ลุงดูปลา ตาเผือกดูควาย… คนแก่ตำบลนี้แบ่งกันดูคนละอย่าง ไม่มีใครดูหนังสือพิมพ์"

  - id: daeng_o_thana
    topic: others
    npc: "คุณธนาเดินมาถึงชายป่า ใส่รองเท้าหนังมันวับ… บอกลุงว่าบริษัทจะ ‘ฟื้นฟูระบบนิเวศ’ ลุงถามว่าระบบนิเวศคืออะไร เขาอธิบายสิบนาที ลุงว่ามันก็คือป่านั่นแหละ"
    options:
      - text: "เขาจะทำอะไรกับป่า{kq}"
        heart: 1
        reply: "บอกว่าจะปลูกป่าทดแทน… ทดแทนอะไร ป่ายังไม่ได้หาย แต่หนองหายไปสามหนองแล้ว เขาไม่ได้พูดเรื่องหนอง"
      - text: "รองเท้าหนังเดินป่าได้เหรอ{kq}"
        heart: 1
        reply: "ไม่ได้… เขาลื่นตรงทางลงคลอง ลุงจับไว้ทัน เขาขอบคุณลุงห้าครั้งเป็นภาษาไทย ครั้งเดียวที่ลุงได้ยินเขาพูดแบบไม่ต้องคิด"
        next:
          - text: "ลุงช่วยเขาด้วยเหรอ{kq}"
            heart: 1
            reply: "คนลื่นก็ต้องจับ… ใครก็ได้ ป่าไม่ได้สอนให้ปล่อยคนล้มเพราะไม่ชอบหน้า"
          - text: "เขาเป็นคนยังไงตอนไม่ได้พูดภาษาบริษัท{kq}"
            heart: 1
            reply: "เหมือนลูกชาวนา… มือเขามีแผลเป็นเคียว เขาไม่รู้ว่าลุงเห็น ลุงไม่บอก"

  - id: daeng_o_kids
    topic: others
    npc: "น้องมิวกับน้องโอ๊ตแอบตามลุงมาถึงชายป่าเมื่อวาน… คิดว่าลุงไม่รู้ ลุงได้ยินตั้งแต่สะพาน เดินดังกว่าควายตาเผือกอีก"
    options:
      - text: "ลุงไล่เขากลับไหม{kq}"
        heart: 1
        reply: "ไม่ไล่… ลุงชี้ให้ดูรอยกระรอกแล้วพาเดินกลับไปส่งที่ศาลา ห้ามเด็กเข้าป่าคนเดียว แต่ห้ามเด็กอยากรู้ไม่ได้"
      - text: "เด็กๆ อยากเป็นพรานเหรอ{kq}"
        heart: 1
        reply: "น้องโอ๊ตอยากเป็นพราน น้องมิวอยากเป็นคนห้ามพราน… ลุงว่าตำบลนี้ต้องการทั้งสองคน"

quests:
  - id: daeng_q1
    npc: daeng
    title: "ไซใบแรก"
    desc: "ลุงพรานแดงสอนวางไซดักปลาในคลอง ต้องหาเหยื่อมาเองและตื่นเช้าไปกู้ไซ"
    start: { heart_min: 0, day_min: 3 }
    offer:
      npc: "อยากได้ปลากินโดยไม่ต้องซื้อไหมหลาน… ลุงมีไซเก่าใบหนึ่ง ลุงจะสอนวาง แต่เหยื่อเอ็งต้องหาเอง ไส้เดือนห้าตัว ขุดจากดินบ้านยายเอ็ง"
      options:
        - text: "อยากได้{k}ลุง เดี๋ยวขุดมาให้"
          accept: true
          heart: 1
          reply: "ขุดตอนเช้าหลังรดน้ำ ไส้เดือนขึ้นมาใกล้ผิวดิน… ตัวที่ดิ้นแรงคือตัวที่ปลาชอบ"
        - text: "ไซคืออะไร{kq}"
          accept: true
          heart: 1
          reply: "เครื่องดักปลาสานจากไผ่ ปลาเข้าได้ออกไม่ได้… เหมือนเงินกู้เสี่ยเฮง ลุงไม่ได้พูดนะ ป้าแต๋วพูด"
        - text: "ซื้อปลาที่ตลาดง่ายกว่า{k}"
          heart: 0
          reply: "ง่ายกว่า… แต่ปลาตลาดไม่รู้จักชื่อเอ็ง ไว้อยากรู้จักปลาค่อยมาหาลุง"
    steps:
      - goal: { type: give, npc: daeng, item: worm, n: 5 }
        hint: "ขุดหาไส้เดือน 5 ตัว เอาไปให้ลุงพรานแดงที่ชายป่า"
        done:
          npc: "ห้าตัว… ดี ใส่ไซสองตัว เก็บสามตัวไว้รอบหน้า พรานไม่ใช้เหยื่อหมดในวันเดียว เย็นนี้ลุงวางไซที่คลอง พรุ่งนี้เช้าเอ็งไปกู้เอง"
          options:
            - text: "กู้ไซยังไง{kq}ลุง"
              heart: 1
              reply: "ดึงเชือกขึ้นช้าๆ อย่ากระชาก ปลาตกใจจะดิ้นหลุดปากไซ… แล้วดูก่อนว่าในไซมีอะไร ไม่ใช่ทุกอย่างในไซเป็นของเอ็ง"
            - text: "ทำไมไม่ใช้หมดทีเดียว{kq}"
              heart: 1
              reply: "เพราะพรุ่งนี้เอ็งยังต้องกินอยู่… คนที่ใช้หมดทีเดียวคือคนที่ไม่คิดว่าจะมีพรุ่งนี้"
      - goal: { type: visit, place: canal, from: "06:00", to: "07:30" }
        hint: "ไปกู้ไซที่คลองส่งน้ำตอนเช้ามืด ก่อนแดดแรง"
        done:
          npc: "(ในไซมีปลาช่อนตัวหนึ่ง ปลาซิวครึ่งกำ กับเต่านาตัวเท่าฝ่ามือติดอยู่ ลุงพรานแดงยืนดูอยู่บนสะพาน) …ดูก่อนหลาน ว่าอะไรของเอ็ง อะไรไม่ใช่"
          options:
            - text: "ปล่อยเต่ากับปลาซิวตัวเล็กไป{k} เอาแค่ปลาช่อน"
              heart: 2
              set_flag: daeng_q1_release
              reply: "…เอ็งเป็นพรานแล้ว ไม่ต้องมีปืน ไม่ต้องมีแห แค่รู้ว่าอะไรต้องปล่อย ลุงสอนเอ็งได้อีกเยอะ"
            - text: "เอาหมดเลย{k} เต่าเลี้ยงไว้ได้"
              heart: -1
              reply: "เต่านาอยู่ในโอ่งบ้านเอ็งไม่เกินเดือน… เอาไปก็ได้ ลุงไม่ห้าม แต่ลุงจะไม่ให้ยืมไซใบที่สอง"
            - text: "ลุงว่าไงดี{kq}"
              heart: 1
              reply: "ปลาช่อนเอาไป ปลาซิวเล็กปล่อย เต่าปล่อย มันกินหอยเชอรี่ในนาให้ไอ้กล้า… ถามก่อนดีกว่าทำผิด จำไว้"
    reward: { money: 0, heart: 2, items: { fish_snakehead: 1 }, set_flag: daeng_q1_done }

  - id: daeng_q2
    npc: daeng
    title: "เสียงหึ่งในคลองตอนกลางคืน"
    desc: "มีคนเอาแบตเตอรี่มาช็อตปลาในคลองส่งน้ำตอนหัวค่ำ ลุงพรานแดงต้องการหลักฐาน"
    start: { flag: daeng_q1_done, heart_min: 3, day_min: 8 }
    offer:
      npc: "หลาน… มีคนช็อตปลาในคลองอีกแล้ว ปลาลอยตายทั้งแถบ ตัวเล็กตัวน้อยไม่เหลือ ดาบเสถียรบอกพรุ่งนี้ ลุงรอพรุ่งนี้ของดาบมาสามเดือนแล้ว… เอ็งมีโทรศัพท์ถ่ายรูปได้ ลุงมีตา ไปด้วยกันไหม ก่อนสามทุ่ม"
      options:
        - text: "ไป{k}ลุง {p}จะถ่ายรูปให้ชัด"
          accept: true
          heart: 2
          reply: "หัวค่ำ หนึ่งทุ่มครึ่ง ห้ามเปิดไฟฉาย ห้ามพูด… ถ้ามีอะไรผิดปกติ ลุงจะจับไหล่ แปลว่าถอย"
        - text: "ไม่อันตรายเหรอ{kq}"
          accept: true
          heart: 1
          reply: "อันตราย… คนช็อตปลาไม่ได้กลัวคน เขากลัวรูป ถ้าได้รูป เขาไม่กลับมา ไปก่อนสามทุ่ม ผียังไม่ออก คนเลวออกแล้ว"
        - text: "ให้ดาบจัดการเถอะ{k}"
          heart: -1
          reply: "…ดาบจะจัดการพรุ่งนี้ ปลาตายวันนี้ ไม่เป็นไรหลาน ลุงไปคนเดียวก็ได้ ตาลุงยังดีอยู่"
    steps:
      - goal: { type: visit, place: canal, from: "19:30", to: "20:45" }
        hint: "ไปที่คลองส่งน้ำตอนหัวค่ำ (ก่อนสามทุ่ม) กับลุงพรานแดง ถ่ายรูปคนช็อตปลา"
        done:
          npc: "(เสียงหึ่งจากแบตเตอรี่ใต้สะพาน ปลาลอยขึ้นมาเป็นแพ ไฟหน้ารถกระบะส่องจากฝั่งตรงข้าม ข้างประตูรถติดสติกเกอร์ ‘หจก.รุ่งเรืองก่อสร้าง’ …ลุงพรานแดงกระซิบ) ถ่ายสติกเกอร์ ถ่ายทะเบียน ถ่ายแบต… รถรับเหมาซ่อมถนนของน้องเมียนายกฯ"
          options:
            - text: "(ถ่ายรูปเงียบๆ ให้ครบทุกอย่าง)"
              heart: 2
              set_flag: daeng_q2_photo
              reply: "…ได้ครบ ถอยออกมาช้าๆ อย่าหันหลังวิ่ง วิ่งแล้วเขาได้ยิน เดินเหมือนคนมาดูหิ่งห้อย"
            - text: "ลุง! นั่นรถรับเหมาถนนนี่{kq}"
              heart: 1
              reply: "ชู่… ถนนซ่อมทุกปีก่อนเลือกตั้ง ปลาในคลองก็โดนช็อตทุกปีก่อนเลือกตั้ง ลุงเพิ่งต่อจุดได้คืนนี้ ถ่ายไว้แล้วรีบถอย"
      - goal: { type: talk, npc: sathian }
        hint: "เอารูปไปแจ้งดาบเสถียรที่ป้อมตำรวจ"
        done:
          npc: "รูปชัดดีนะ… ดาบเห็นสติกเกอร์แล้ว ดาบไม่เห็นอะไรทั้งนั้น ดาบเห็นแค่ว่าตัวเองอยากเกษียณอย่างมีความสุข… เอางี้ ดาบจะลงบันทึกประจำวันไว้ พรุ่งนี้ดาบจะไปเตือนแบบไม่ระบุชื่อ เตือนคลอง"
          options:
            - text: "ดาบเตือนคลองได้ยังไง{kq}"
              heart: 0
              reply: "ติดป้าย ‘ห้ามช็อตปลา’ ที่สะพาน คลองจะได้รู้… ดาบรู้ว่าดาบฟังดูแย่ ดาบก็รู้สึกแย่ แต่ป้ายนี่ดาบจะติดจริงนะ ไม่ใช่พรุ่งนี้ วันนี้เลย"
            - text: "งั้น{p}ส่งรูปให้เมย์ลงเพจ{k}"
              heart: 1
              set_flag: daeng_q2_may
              reply: "…ดาบไม่ได้ยินนะ ดาบไม่เห็น ดาบไม่รู้จักเมย์ ถ้าเมย์ลงข่าวแล้วคนในอำเภอโทรมาถาม ดาบจะได้มีเหตุผลไปจับ… ดาบพูดอะไรไปเมื่อกี้ ดาบลืมแล้ว"
            - text: "ดาบ{k} ดาบเคยขยันนะ ลุงแดงเล่าให้ฟัง"
              heart: 1
              reply: "…ลุงแดงเล่าเหรอ เออ ดาบเคยขยัน ขยันจนรู้ว่าขยันแล้วโดนย้ายเร็วกว่าขี้เกียจ… ดาบจะไปเอง คืนนี้ ทุ่มครึ่ง ห้ามบอกใครว่าดาบไป ดาบเสียชื่อ"
      - goal: { type: days, n: 2 }
        hint: "รอ 2 วัน แล้วไปหาลุงพรานแดงที่ชายป่า"
        done:
          npc: "คลองเงียบสองคืนแล้ว… ไม่มีเสียงหึ่ง เมื่อเช้าลุงเห็นปลาซิวฝูงแรกกลับมาใต้สะพาน กลุ่ม LINE ว่ายังไงบ้างหลาน ลุงไม่ได้ดู"
          options:
            - text: "น้องเมียนายกฯ โพสต์ขอโทษ บอกว่าเข้าใจผิดคิดว่าเป็นคลองส่วนตัว{k}"
              heart: 1
              reply: "คลองส่วนตัว… คลองที่ขุดด้วยงบหลวงสามสิบล้าน เขาคิดว่าเป็นของเขา ก็ไม่แปลก ถนนเขาก็คิดแบบนั้น… ช่างเถอะ ปลากลับมาก็พอ"
            - text: "ทุกคนชมลุงในกลุ่มเลย{k}"
              heart: 2
              reply: "…ลุงไม่ได้อ่าน ไม่ต้องเล่า ลุงอาย ไปบอกปลาซิวใต้สะพานดีกว่า มันได้ประโยชน์จริง"
    reward: { money: 200, heart: 2, items: { fish_snakehead: 2 }, set_flag: daeng_q2_done, line: { from: sathian, text: "ประกาศจากป้อมตำรวจ: ห้ามช็อตปลาในคลองส่งน้ำ ฝ่าฝืนดำเนินคดีตามกฎหมาย ป้ายติดที่สะพานแล้ว (ติดวันนี้ ไม่ใช่พรุ่งนี้) — ดาบเสถียร" } }

  - id: daeng_q3
    npc: daeng
    title: "ปืนบนฝาบ้าน"
    desc: "ลุงพรานแดงชวนเดินชายป่า เล่าเรื่องที่ไม่เคยเล่า และขอให้ช่วยตัดสินใจว่าจะทำอะไรกับป่าที่เหลือ"
    start: { flag: daeng_q2_done, heart_min: 5, day_min: 12 }
    offer:
      npc: "หลาน… บ่ายนี้มาชายป่าได้ไหม ลุงอยากให้เอ็งดูอะไรบางอย่าง ลุงไม่เคยพาใครไปดู… ไม่ใช่ผีนะ ไม่ต้องทำหน้าแบบนั้น"
      options:
        - text: "{p}ไปแน่{k}ลุง"
          accept: true
          heart: 2
          reply: "สามโมงถึงห้าโมง… ใส่รองเท้าหุ้มส้น ห้ามใส่แตะ ป่าไม่ชอบคนใส่แตะ"
        - text: "ถ้าไม่ใช่ผีแล้วเป็นอะไร{kq}"
          accept: true
          heart: 1
          reply: "เป็นของที่น่ากลัวกว่าผี… ของที่คนทำไว้แล้วลืมไม่ได้ มาเถอะ"
        - text: "บ่ายนี้{p}ติดธุระ{k}"
          heart: 0
          reply: "อืม… ไว้วันอื่น ลุงเก็บมาสี่สิบปี เก็บอีกวันก็ได้"
    steps:
      - goal: { type: visit, place: forest_edge, from: "15:00", to: "17:00" }
        hint: "ไปหาลุงพรานแดงที่ชายป่าท้ายหมู่บ้านช่วงบ่าย"
        done:
          npc: "(ในเถียงของลุงพรานแดง ปืนแก๊ปแขวนบนฝา ลุงยกลงมาวางในมือเอ็ง… มันเบาผิดปกติ) …ไม้ ลุงแกะเอง ปืนจริงลุงเอาไปมอบอำเภอปีก่อน ไม่มีใครรู้ ทุกคนยังกลัวลุงเพราะปืนไม้กระบอกนี้"
          options:
            - text: "ทำไมลุงไม่บอกใคร{kq}"
              heart: 1
              reply: "คนช็อตปลา คนวางบ่วง คนตัดไม้ ยังกลัวพรานแดงมีปืน… ถ้ารู้ว่าเป็นไม้ ป่าก็เหลือแค่ลุงกับไม้แกะหนึ่งกระบอก"
            - text: "ลุงแกะเหมือนมาก{k} {p}ไม่รู้เลย"
              heart: 2
              reply: "แกะสามเดือน… ทุกคืนที่แกะ ลุงนึกถึงสัตว์ทีละตัว สองร้อยสิบสามตัว แกะเสร็จ ลุงนอนหลับเต็มคืนครั้งแรกในรอบยี่สิบปี"
      - goal: { type: give, npc: daeng, item: honey, n: 1 }
        hint: "หาน้ำผึ้ง 1 ขวด เอาไปให้ลุงพรานแดงไว้ไหว้เจ้าป่า"
        done:
