      - text: "สามสิบปีเพลงเดียวเลยเหรอ{kq}"
        heart: 1
        reply: "สามเพลงจ้ะ หน้าเดียว เพลงที่สามมีเสียงไอของใครไม่รู้ตอนกลาง คนในตำบลร้องตามได้หมด รวมเสียงไอด้วย"
