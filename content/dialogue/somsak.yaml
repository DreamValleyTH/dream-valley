# ผู้ใหญ่สมศักดิ์ — convos + quests
convos:
  # ===== react =====
  - id: somsak_r_meet
    topic: react
    once: true
    when: { not_flag: met_somsak }
    npc: "อ้อ หลานยายเพียรใช่ไหม ผู้ใหญ่สมศักดิ์จ้ะ ผู้ใหญ่บ้านหมู่สาม ย้ำอีกครั้งนะ หมู่สาม หมู่สองอยู่ฝั่งคลอง คนละผู้ใหญ่"
    set_flag: met_somsak
    options:
      - text: "สวัสดี{k}ผู้ใหญ่ ยายฝากความคิดถึงไว้ในจดหมายด้วย"
        heart: 2
        reply: "ยายเพียรเหรอ… ยายเขียนถึงผู้ใหญ่ด้วยเหรอ ผู้ใหญ่ขอยืนตรงนี้แป๊บนะ ลมมันเข้าตา"
        next:
          - text: "ยายเขียนว่าผู้ใหญ่พูดซ้ำแต่ใจดี{k}"
            heart: 2
            reply: "ฮ่า… ยายเพียรเขียนแบบนี้เหรอ ตรงเป๊ะ ผู้ใหญ่จะจดลงสมุดประชุมเลย วาระพิเศษ ‘ยายเพียรชม’"
          - text: "ผู้ใหญ่เป็นอะไรไหม{kq}"
            heart: 1
            reply: "ไม่เป็นไรจ้ะ แค่คิดถึง ยายเพียรเป็นคนเดียวที่เถียงผู้ใหญ่กลางประชุมแล้วผู้ใหญ่ยังขอบใจ"
      - text: "ผู้ใหญ่ที่ประกาศเสียงตามสายใช่ไหม{kq}"
        heart: 1
        reply: "ใช่จ้ะ เสียงนั้นแหละ ถ้าได้ยินเพลงลูกทุ่งตอนหกโมงแล้วตามด้วยเสียงไอ นั่นผู้ใหญ่เอง ไอก่อนพูดทุกครั้ง ระเบียบส่วนตัว"
      - text: "ต้องเอาเอกสารอะไรมาให้ผู้ใหญ่ไหม{kq}"
        heart: 1
        reply: "ดีมาก ถามก่อนเลย คนรุ่นใหม่ไม่ค่อยถาม! สำเนาบัตรสามชุด ทะเบียนบ้านสองชุด ใจเย็นหนึ่งชุด อันสุดท้ายสำคัญที่สุด"

  - id: somsak_r_intro
    topic: react
    once: true
    when: { flag: story_town_intro }
    npc: "เมื่อเช้าได้ยินผู้ใหญ่ประกาศต้อนรับหลานไหม ผู้ใหญ่เขียนไว้ก่อนสามวัน ซ้อมห้ารอบ ประกาศจริงสามรอบ รอบที่สองผู้ใหญ่เรียกชื่อยายผิด เป็นยายเพียง"
    options:
      - text: "ได้ยิน{k} ขอบคุณผู้ใหญ่มาก"
        heart: 2
        reply: "ดีใจ ดีใจ ย้ำอีกครั้งนะ ดีใจ… รอบที่สามผู้ใหญ่แก้ชื่อแล้วนะ ถือว่าเฉลี่ยถูกสองในสาม ระเบียบอนุโลม"
      - text: "ไม่ต้องประกาศก็ได้{k} {p}อาย"
        heart: 0
        reply: "ไม่ได้จ้ะ ระเบียบหมู่บ้าน คนย้ายเข้าต้องประกาศ คนย้ายออกก็ประกาศ สมัยก่อนประกาศคนเกิดด้วย เลิกเพราะเด็กเกิดตอนตีสาม ผู้ใหญ่ตื่นไม่ไหว"
      - text: "ยายเพียงนี่ใคร{kq}"
        heart: 1
        reply: "ไม่มีจ้ะ ไม่มี ป้าแต๋วก็ถามผู้ใหญ่ทั้งวัน ผู้ใหญ่บอกว่าเป็นญาติยายเพียรจากตำบลข้างๆ… ไม่จริงนะ ผู้ใหญ่โกหกป้าแต๋ว อย่าบอกใคร"

  - id: somsak_r_meeting1
    topic: react
    once: true
    when: { flag: story_meeting1 }
    npc: "ประชุมประชาคมวันนั้น ผู้ใหญ่ถูศาลาตั้งแต่ตีห้า ปูเสื่อแปดผืน ต้มน้ำแดง นายกฯ พูดสี่สิบนาที กำนันหลับห้าสิบนาที… ผู้ใหญ่จดรายงานได้สองบรรทัด"
    options:
      - text: "สองบรรทัดว่าอะไรบ้าง{kq}"
        heart: 1
        reply: "บรรทัดแรก ‘ที่ประชุมรับทราบ’ บรรทัดที่สอง ‘น้ำแดงหมด’ ผู้ใหญ่จะเพิ่มบรรทัดที่สามว่า ‘ขนมชั้นป้าแต๋วอร่อย’ ระเบียบไม่ได้ห้าม"
        next:
          - text: "ผู้ใหญ่จดเรื่องกำนันหลับด้วยไหม{kq}"
            heart: 1
            reply: "ไม่จด ผู้ใหญ่เขียนว่า ‘กำนันพิจารณาอย่างลึกซึ้ง’ เพื่อนกันต้องช่วยกันในรายงาน นอกรายงานผู้ใหญ่หัวเราะจนน้ำแดงหก"
          - text: "{p}ช่วยจดรอบหน้าไหม{kq}"
            heart: 2
            reply: "ดีมาก! ลายมืออย่าหวัดนะหลาน ผู้ใหญ่อ่านลายมือนายกฯ ไม่ออกมาสองวาระแล้ว ไม่อยากเพิ่มอีกคน"
      - text: "ผู้ใหญ่ไม่เหนื่อยเหรอ{kq}"
        heart: 1
        reply: "เหนื่อยจ้ะ แต่อีกไม่กี่ครั้งก็ไม่ได้จัดแล้ว ผู้ใหญ่เลยถูพื้นให้เงาที่สุดทุกครั้ง เผื่อเป็นครั้งสุดท้าย"

  - id: somsak_r_vote_market
    topic: react
    once: true
    when: { flag: vote_market }
    npc: "หลานโหวตตลาดนัดเหรอ ผู้ใหญ่เห็นมือหลานยก ผู้ใหญ่นับมือเองกับตา นับสามรอบ ได้ผลไม่เท่ากันสามรอบ"
    options:
      - text: "ทำไมนับไม่เท่ากัน{kq}"
        heart: 1
        reply: "รอบแรกลุงสมหมายยกสองมือ รอบสองป้าพรดึงมือลุงลง รอบสามป้าแต๋วยกมือแทนแมวส้มที่นั่งตัก ระเบียบไม่ได้เขียนเรื่องแมว"
      - text: "ผู้ใหญ่โหวตอะไร{kq}"
        heart: 0
        reply: "ผู้ใหญ่เป็นคนนับ คนนับไม่โหวตจ้ะ ระเบียบ… แต่ในใจผู้ใหญ่ยกมือให้ระบบน้ำ อย่าบอกใครนะ ใจผู้ใหญ่ไม่มีคนนับ"

  - id: somsak_r_result_market
    topic: react
    once: true
    when: { flag: meeting1_result_market }
    npc: "ตลาดนัดชนะจ้ะ ผู้ใหญ่ประกาศผลไปสามรอบแล้ว รอบที่สามผู้ใหญ่อ่านหนังสือ อบต. ต่อท้าย ‘งบส่วนหนึ่งใช้ศึกษาความเป็นไปได้’ อ่านแล้วเสียงผู้ใหญ่หายไปเอง"
    options:
      - text: "ส่วนหนึ่งคือเท่าไหร่{kq}"
        heart: 1
        reply: "ครึ่งนึงจ้ะ ครึ่งนึง ย้ำอีกครั้งนะ… ผู้ใหญ่ไม่อยากย้ำเรื่องนี้ ย้ำแล้วเจ็บคอ ตลาดนัดเลยได้หลังคาเต็นท์สามหลังกับป้ายหนึ่งป้าย ป้ายใหญ่กว่าเต็นท์"
        next:
          - text: "ศึกษาอะไรตั้งครึ่งงบ{kq}"
            heart: 1
            reply: "ศึกษาว่าคนในตำบลอยากมีตลาดไหม… ทั้งที่เพิ่งโหวตกันเองเมื่อวาน ผู้ใหญ่ทำหนังสือถามไปแล้ว รอคำตอบ ‘รับทราบ’ อยู่จ้ะ"
          - text: "ป้าแต๋วคงดีใจ{k}"
            heart: 1
            reply: "ดีใจสามวัน วันที่สี่ป้าแต๋วเห็นป้าย ป้าแต๋วบอกว่าเต็นท์เล็กกว่ามุ้งป้าอีก ป้าแต๋วจะไปขายใต้ป้ายแทน ร่มกว่า"
      - text: "อย่างน้อยก็ได้ตลาด{k}"
        heart: 1
        reply: "ได้จ้ะ ได้ ผู้ใหญ่ไม่ได้บ่นนะ ผู้ใหญ่แค่… อ่านหนังสือซ้ำสามรอบแล้วมันก็ยังเขียนเหมือนเดิม"

  - id: somsak_r_well
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "บ่อหลังร้านป้าแต๋วแห้ง บ่อลุงสมหมายแห้ง ผู้ใหญ่ทำหนังสือถึงบริษัทแล้ว ย้ำอีกครั้งนะ ทำหนังสือแล้ว เขาตอบกลับมาเป็นแผ่นพับสี่สี มีรูปเด็กยิ้มกับแก้วน้ำ"
    options:
      - text: "แผ่นพับเขียนว่าอะไร{kq}"
        heart: 1
        reply: "เขียนว่า ‘เราใส่ใจทุกหยดน้ำของชุมชน’ ผู้ใหญ่อ่านสามรอบ ไม่มีคำว่าบ่อ ไม่มีคำว่าแห้ง มีแต่คำว่าใส่ใจ ใส่ใจไปเก้าครั้ง ผู้ใหญ่นับ"
        next:
          - text: "ผู้ใหญ่จะทำยังไงต่อ{kq}"
            heart: 2
            reply: "รวบรวมรายชื่อคนบ่อแห้ง ยื่นอำเภอ คราวนี้ผู้ใหญ่ไม่ยอมแค่รับทราบแล้ว ผู้ใหญ่จะไปนั่งรอที่อำเภอจนกว่าเขาจะ ‘ดำเนินการ’ เอาข้าวห่อไปด้วย"
          - text: "ใส่ใจเก้าครั้งแต่ไม่ใส่น้ำ{k}"
            heart: 1
            reply: "พูดดี! ผู้ใหญ่จะยืมไปพูดในประกาศพรุ่งนี้ ไม่บอกว่าใครพูด บอกว่าแหล่งข่าวคนรุ่นใหม่"
      - text: "บ่อบ้านผู้ใหญ่เป็นไงบ้าง{kq}"
        heart: 1
        reply: "ยังมีจ้ะ แต่กะเพราหลังบ้านผู้ใหญ่ใบเริ่มห่อ ผู้ใหญ่รดน้ำทีละขันแทนสายยาง กะเพรามันไม่รู้ระเบียบ แต่มันรู้ว่าน้ำน้อย"

  - id: somsak_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "มีคนมาขอให้ผู้ใหญ่ประกาศเรื่องผีที่ดินบริษัท ผู้ใหญ่ไม่ประกาศจ้ะ ระเบียบไม่มีแบบฟอร์มประกาศผี… แต่ผู้ใหญ่ประกาศว่า ‘กลับบ้านก่อนสามทุ่ม’ สี่รอบแทน"
    options:
      - text: "ผู้ใหญ่เชื่อไหม{kq}"
        heart: 1
        reply: "ผู้ใหญ่ไม่เชื่อไม่ได้ ผู้ใหญ่เห็นผีโพงตอนเด็ก แต่ผู้ใหญ่ไม่เชื่อว่าคนงานลาออกเพราะผีอย่างเดียว ค่าแรงเขาก็น้อย ผีเป็นข้ออ้างที่สุภาพ"
      - text: "สี่รอบเลยเหรอ{kq}"
        heart: 1
        reply: "สี่จ้ะ เรื่องผีต้องมากกว่าเรื่องอื่นหนึ่งรอบ เพราะผีมันไม่ฟังหอกระจายข่าว คนต้องฟังแทนผี"

  - id: somsak_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ประชุมรอบสอง คนนั่งแยกสองฝั่งจนผู้ใหญ่ต้องปูเสื่อตรงกลางเพิ่ม ไม่มีใครนั่ง ผู้ใหญ่เลยนั่งคนเดียวตรงกลาง เหมือนเส้นแบ่งเขต"
    options:
      - text: "ผู้ใหญ่อยู่ฝั่งไหน{kq}"
        heart: 1
        reply: "ผู้ใหญ่อยู่ฝั่งคนที่ต้องกวาดศาลาหลังประชุม ฝั่งนั้นมีผู้ใหญ่คนเดียวทุกครั้ง… ถังน้ำ CSR เขาวางทิ้งไว้สิบใบ ผู้ใหญ่เอาไปรองหลังคาศาลาที่รั่ว พอดีทุกจุด"
        next:
          - text: "ถังบริษัทรองน้ำฝนให้ศาลา ประชดดีนะ{kq}"
            heart: 2
            reply: "ผู้ใหญ่ไม่ได้ประชดนะ ผู้ใหญ่ประหยัด… แต่ถ้าคนเห็นแล้วคิดว่าประชด ผู้ใหญ่ก็ไม่ห้าม ระเบียบไม่ห้ามคนคิด"
          - text: "เดี๋ยว{p}ช่วยกวาด{k}"
            heart: 2
            reply: "ดีจ้ะ ฝั่งคนกวาดศาลามีสองคนแล้ว ผู้ใหญ่จะจดลงสมุด ‘เสียงข้างน้อยที่ขยันที่สุด’"
      - text: "แตกเป็นสองฝ่ายแบบนี้น่ากลัว{k}"
        heart: 1
        reply: "น่ากลัวจ้ะ ผู้ใหญ่เห็นมาหลายครั้ง แตกกันเรื่องเลือกตั้ง เรื่องเขื่อน เรื่องถนน แตกแล้วก็ต่อกันได้ ถ้ายังไปงานศพบ้านกันและกันอยู่"

  - id: somsak_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ป้ายหาเสียงติดศาลาอีกแล้ว ผู้ใหญ่แกะไปสิบสองแผ่น ย้ำอีกครั้งนะ สิบสอง พรุ่งนี้มีสิบสามแผ่น ผู้ใหญ่ว่าเขาติดตอนผู้ใหญ่หลับ"
    options:
      - text: "ใครติด{kq}"
        heart: 1
        reply: "ทุกคน! ป้ายนายกฯ ป้ายคนท้าชิง ป้ายแสดงความยินดีที่ไม่รู้ยินดีอะไร แล้วก็มีบัญชีในกลุ่ม LINE ชื่อ ‘ชาวบ้านธรรมดา99’ โพสต์ชมนายกฯ ทุกชั่วโมง ผู้ใหญ่ไม่รู้จักชาวบ้านคนนี้"
        next:
          - text: "บัญชีอวตารนี่นา{k}"
            heart: 1
            reply: "อวตารเหรอ… ผู้ใหญ่นึกว่าเป็นชื่อหมู่บ้านใหม่ ผู้ใหญ่ทักไปขอสำเนาบัตรสามชุด เขาบล็อกผู้ใหญ่เลย"
          - text: "ผู้ใหญ่เป็นกลางใช่ไหม{kq}"
            heart: 1
            reply: "กลางจ้ะ กลางเพราะระเบียบ ผู้ใหญ่แกะป้ายทุกฝ่ายเท่ากัน แกะเสร็จพับเก็บไว้ หลังเลือกตั้งเอามาปูให้ไก่ตาเผือกนอน"
      - text: "ผู้ใหญ่ได้ยินหมาหอนหรือยัง{kq}"
        heart: 1
        reply: "ยังจ้ะ ยัง หมาหอนจริงๆ คืนก่อนวันเลือกตั้ง ผู้ใหญ่ไม่ได้บอกว่ามีอะไร ผู้ใหญ่แจ้งเพื่อทราบว่าหมามันจะหอน"

  - id: somsak_r_headman
    topic: react
    once: true
    when: { flag: heard_headman_rumor }
    npc: "หลาน… ผู้ใหญ่ได้ยินข่าวลือว่ามีคนเอ่ยชื่อหลานจะเป็นผู้ใหญ่คนต่อไป ผู้ใหญ่ไม่ได้โกรธนะ ผู้ใหญ่แค่อยากถามหน้าตรงๆ ว่าหลานรู้หรือเปล่า"
    options:
      - text: "{p}เพิ่งรู้จากป้าแต๋ว{k}"
        heart: 1
        reply: "อ้อ ป้าแต๋ว ผู้ใหญ่ก็รู้จากป้าแต๋ว แปลว่าเราสองคนรู้พร้อมกัน… ถ้าป้าแต๋วเป็นคนจัดเลือกตั้ง ตำบลนี้จะประหยัดงบได้เยอะ"
      - text: "ผู้ใหญ่คิดว่า{p}ทำได้ไหม{kq}"
        heart: 2
        reply: "ยังไม่รู้จ้ะ ผู้ใหญ่ดูคนสามปีถึงรู้ ผู้ใหญ่ดูหลานมาไม่กี่อาทิตย์… แต่หลานถามคำถามนี้ ไม่ได้ถามว่าเงินเดือนเท่าไหร่ อันนี้ผู้ใหญ่จดไว้แล้ว"
        next:
          - text: "แล้วผู้ใหญ่อยากให้ใครเป็น{kq}"
