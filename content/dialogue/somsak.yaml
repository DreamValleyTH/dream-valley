        heart: 0
        reply: "ไปร้องเรียน อบต. จ้ะ อบต. รับทราบ… ผู้ใหญ่เลยบอกทุกคนว่า อ่านก่อนเซ็น อ่านแล้วไม่เข้าใจ เอามาให้ผู้ใหญ่อ่าน ผู้ใหญ่อ่านช้าแต่อ่านทุกตัว"

