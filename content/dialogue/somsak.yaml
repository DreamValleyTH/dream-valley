    npc: "หลานจำไว้นะ สามทุ่มตรง ไม่ใช่สามทุ่มครึ่ง ถ้ากลับไม่ทัน เข้าวัดหรือร้าน 24 ชม. ผู้ใหญ่บอกทุกคนเหมือนกันหมด ระเบียบไม่เลือกที่รักมักที่ชัง ผีก็ไม่เลือก"
