      - text: "{p}จะกลับก่อนสามทุ่ม{k}"
        heart: 1
        reply: "ดีจ้ะ ถ้าได้ยินหมาหอนแล้วยังอยู่ข้างนอก ให้วิ่ง ย้ำอีกครั้งนะ วิ่ง ไม่ต้องเดินเร็ว วิ่ง"

