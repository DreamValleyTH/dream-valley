          - text: "{p}ร้องตามได้แล้วเหมือนกัน{k}"
            heart: 2
            reply: "ดีจ้ะ! ตอนนี้หลานเป็นคนตำบลนี้เต็มตัวแล้ว ระเบียบไม่ได้เขียน แต่ผู้ใหญ่ถือว่าร้องเพลงเทปได้ก็ย้ายทะเบียนบ้านใจได้แล้ว"
