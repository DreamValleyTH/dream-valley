          - text: "ไม่ต้องอ่านจบก็ได้{k} ทุกคนรู้อยู่แล้ว"
            heart: 2
            reply: "รู้เหรอ… ทุกคนรู้จริงเหรอ ผู้ใหญ่นึกว่าต้องพูดออกไปถึงจะรู้ ยี่สิบสองปีผู้ใหญ่พูดซ้ำเพราะกลัวคนไม่รู้"
          - text: "ซ้อมอีกสามรอบก็จบเอง{k}"
            heart: 1
            reply: "สามรอบ ระเบียบเดิม… ได้จ้ะ ผู้ใหญ่จะซ้อมแบบนั้น แต่ถ้ารอบที่สามยังร้อง หลานต้องอ่านต่อให้นะ"
      - text: "ผู้ใหญ่อย่าเพิ่งพูดเรื่องเศร้าเลย{k}"
        heart: 0
        reply: "ไม่เศร้าจ้ะ ไม่เศร้า เป็นระเบียบ ทุกคนต้องลงจากตำแหน่ง ผู้ใหญ่แค่อยากลงให้สวยเหมือนรีดกางเกง"

  - id: somsak_f_rules
    topic: self
    npc: "คนชอบว่าผู้ใหญ่ยึดระเบียบ ผู้ใหญ่ยึดเพราะระเบียบมันไม่เลือกที่รักมักที่ชังจ้ะ คนต่างหากที่เลือก ผู้ใหญ่ก็คน ผู้ใหญ่เลยต้องเกาะระเบียบไว้"
    options:
      - text: "แต่ระเบียบบางข้อก็ไม่ยุติธรรมนะ{kq}"
        heart: 2
        reply: "จริงจ้ะ ข้อที่ให้ศึกษาความเป็นไปได้ไม่จำกัดงบ ผู้ใหญ่ไม่ชอบ แต่มันเป็นระเบียบ… หลานพูดแบบนี้ดี อย่าเลิกพูด รุ่นผู้ใหญ่เลิกพูดเร็วไป"
      - text: "ผู้ใหญ่เคยแหกระเบียบไหม{kq}"
        heart: 1
        reply: "ครั้งเดียวจ้ะ ปี 54 น้ำท่วม ผู้ใหญ่เปิดศาลาให้คนนอนโดยไม่ทำหนังสือขออนุญาต ทำหนังสือตามหลังสามฉบับ ผู้ใหญ่ไม่เสียใจสักฉบับ"

  # ===== others =====
  - id: somsak_o_prasert
    topic: others
    npc: "กำนันประเสริฐกับผู้ใหญ่บวชพร้อมกันจ้ะ ตอนขานนาค ผู้ใหญ่ขานซ้ำสามรอบ พระอุปัชฌาย์ท่านยิ้ม กำนันขานเร็วจนพระฟังไม่ทันต้องให้ขานใหม่"
    options:
      - text: "สองคนนี้คู่กันจริงๆ{k}"
        heart: 1
        reply: "คู่จ้ะ เขาพูดเร็ว ผู้ใหญ่พูดซ้ำ รวมกันออกมาพอดีคนฟัง… ช่วงนี้กำนันพูดช้าลง ผู้ใหญ่ห่วงจ้ะ คนพูดเร็วพูดช้าเมื่อไหร่ แปลว่าคิดหนัก"
        next:
          - text: "เรื่องที่ดินใช่ไหม{kq}"
            heart: 1
            reply: "ผู้ใหญ่ไม่พูดเรื่องของคนอื่นจ้ะ… แต่ผู้ใหญ่เห็นกำนันนั่งมองไก่นานผิดปกติ ไก่ยังงง"
          - text: "ผู้ใหญ่ช่วยเขาได้ไหม{kq}"
            heart: 1
            reply: "ช่วยได้จ้ะ ช่วยนั่งข้างๆ ไม่พูด เพื่อนรุ่นนี้ช่วยกันแบบนั้น ผู้ใหญ่นั่งข้างกำนันเงียบๆ ได้สามชั่วโมง ไม่ต้องย้ำสักคำ"
      - text: "ใครขี้โมโหกว่ากัน{kq}"
        heart: 1
        reply: "กำนันโมโหเร็ว หายเร็ว ผู้ใหญ่โมโหช้า… ผู้ใหญ่ไม่เคยหายจ้ะ ผู้ใหญ่จดไว้ในสมุด ฮ่าๆ ล้อเล่น ผู้ใหญ่ไม่มีสมุดโมโห มีแต่สมุดประชุม"

  - id: somsak_o_wichai
    topic: others
    npc: "นายกฯ วิชัยตอบหนังสือขอหินคลุกของผู้ใหญ่แล้วจ้ะ ฉบับที่สี่ เขียนว่า ‘รับทราบด้วยความห่วงใยอย่างยิ่ง’ เพิ่มคำว่าอย่างยิ่งมา ผู้ใหญ่ว่าความคืบหน้า"
    options:
      - text: "เพิ่มคำเดียวในสี่ฉบับ{k}"
        heart: 1
        reply: "ใช่จ้ะ อีกสิบฉบับอาจได้ ‘หินคลุก’ สักคำ ผู้ใหญ่อดทนได้ ผู้ใหญ่ใกล้เกษียณ แต่หนังสือไม่เกษียณ ผู้ใหญ่จะฝากคนต่อไปเขียนฉบับห้า"
      - text: "ผู้ใหญ่ว่านายกฯ เป็นคนไม่ดีเหรอ{kq}"
        heart: 1
        reply: "ไม่ใช่จ้ะ นายกฯ ไม่ใช่คนไม่ดี เขาเป็นคนที่ระบบเคี้ยวจนนุ่ม… ผู้ใหญ่ก็ถูกเคี้ยวนะ แต่ผู้ใหญ่เหนียวกว่า"
      - text: "ไปถามตรงๆ ไม่ได้เหรอ{kq}"
        heart: 0
        reply: "ถามแล้วจ้ะ เขาตอบยาวจนผู้ใหญ่ลืมว่าถามอะไร ขากลับผู้ใหญ่ถือข้าวกล่องโครงการอบรมมาสองกล่อง ไม่รู้ได้มาตอนไหน"

  - id: somsak_o_sathian
    topic: others
    npc: "ผู้ใหญ่ส่งหนังสือเรื่องไก่ขันเสียงดังให้ดาบเสถียรสามรอบ ดาบตอบรอบเดียวว่า ‘ไก่ไม่ใช่ผู้ต้องหา’ ผู้ใหญ่เถียงไม่ได้ ระเบียบเขาแน่นกว่า"
    options:
      - text: "ไก่ใครขันดัง{kq}"
        heart: 1
        reply: "ไก่กำนันจ้ะ แต่ผู้ใหญ่ไม่ได้ฟ้องกำนันนะ ผู้ใหญ่ฟ้องไก่ ไก่ไม่ใช่เพื่อนผู้ใหญ่ ฟ้องได้"
      - text: "ดาบทำงานบ้างไหม{kq}"
        heart: 1
        reply: "ทำจ้ะ ดาบรู้ทุกเรื่องในตำบล แค่ไม่ลุก… ผู้ใหญ่เคยเห็นดาบลุกครั้งเดียว ตอนน้ำท่วมปี 54 ดาบแบกยายบัวเดินน้ำสองกิโล ไม่มีใครถ่ายรูปไว้เลย"

  - id: somsak_o_taew
    topic: others
    npc: "ป้าแต๋วเป็นแหล่งข่าวที่เร็วที่สุดในตำบลจ้ะ ผู้ใหญ่เคยลองจับเวลา ผู้ใหญ่ประกาศหกโมง ป้าแต๋วเล่าต่อได้ก่อนหกโมงห้านาที ข่าวเดียวกันแต่ป้าเล่าละเอียดกว่า"
    options:
      - text: "ป้าแต๋วรู้ก่อนผู้ใหญ่ได้ยังไง{kq}"
        heart: 1
        reply: "ผู้ใหญ่จิบโอเลี้ยงหน้าร้านป้าตอนเขียนประกาศจ้ะ ป้าอ่านกลับหัวได้ ผู้ใหญ่รู้มาสิบปีแล้ว ไม่เคยย้ายโต๊ะ"
      - text: "ข่าวป้าแต๋วถูกทุกเรื่องไหม{kq}"
        heart: 1
        reply: "ถูกแปดในสิบจ้ะ เท่ากับพยากรณ์อากาศ อีกสองเรื่องป้าเติมให้มันสนุก ผู้ใหญ่เติมไม่เป็น ประกาศผู้ใหญ่เลยไม่สนุก"

  - id: somsak_o_palm
    topic: others
    npc: "ปาล์มเด็ก อบต. มาช่วยผู้ใหญ่กรอกแบบรายงานภัยแล้งจ้ะ สิบสองหน้า เด็กมันกรอกเสร็จในชั่วโมงเดียว แล้วนั่งร้องไห้อีกครึ่งชั่วโมง ผู้ใหญ่ไม่กล้าถาม"
    options:
      - text: "ร้องไห้เพราะอะไร{kq}"
        heart: 1
        reply: "ผู้ใหญ่เห็นช่องสุดท้ายเขียนว่า ‘ข้อเสนอแนะ (ไม่เกินสองบรรทัด)’ ปาล์มเขียนไปสิบบรรทัด แล้วต้องลบ ผู้ใหญ่ว่าเด็กมันร้องให้แปดบรรทัดที่ลบ"
        next:
          - text: "แปดบรรทัดนั้นเขียนว่าอะไร{kq}"
            heart: 1
            reply: "ผู้ใหญ่ขอดูแล้ว เรื่องบ่อบาดาล ตัวเลขระดับน้ำ เขียนดีกว่ารายงานทั้งเล่ม… ผู้ใหญ่จดไว้ในสมุดประชุมแทนให้ อย่างน้อยมีที่อยู่"
          - text: "ปาล์มทำงานหนักนะ{kq}"
            heart: 1
            reply: "หนักจ้ะ หนักเหมือนผู้ใหญ่ตอนหนุ่ม ผู้ใหญ่อยากบอกเขาว่าอย่าหนักจนเลิกร้อง คนเลิกร้องเรื่องงานเมื่อไหร่ จะเริ่มตอบว่ารับทราบ"
      - text: "ผู้ใหญ่ปลอบเขาหรือยัง{kq}"
        heart: 1
        reply: "ผู้ใหญ่ให้น้ำกระเจี๊ยบแก้วนึงจ้ะ ไม่พูดอะไร คนรุ่นผู้ใหญ่ปลอบเป็นอย่างเดียว คือเอาน้ำให้กิน"

  - id: somsak_o_cherd
    topic: others
    npc: "ลุงเชิดขับรถเมล์ตรงเวลากว่านาฬิกา อบต. ผู้ใหญ่ตั้งนาฬิกาบ้านตามเสียงแตรเขา นาฬิกา อบต. เร็วไปสิบนาทีมาสามปี ไม่มีใครตั้ง"
    options:
      - text: "ทำไมไม่มีใครตั้ง{kq}"
        heart: 1
        reply: "ต้องทำเรื่องขออนุมัติปีนนาฬิกาจ้ะ ต้องมีบันได บันไดอยู่ในพัสดุ พัสดุต้องเซ็นยืม คนเซ็นไปประชุม… นาฬิกาเลยเร็วไปเรื่อยๆ เหมือนจะหนีไปก่อน"
      - text: "ลุงเชิดจะพาผู้ใหญ่ไปทะเลได้ไหม{kq}"
        heart: 2
        reply: "รถเมล์ลุงเชิดไปถึงแค่อำเภอจ้ะ แต่ลุงบอกว่าต่อรถทัวร์ไปถึงทะเลได้ ลุงจะจองที่ข้างคนขับให้ผู้ใหญ่ ไม่ต้องสำเนาบัตร ลุงบอกเอง"

quests:
  - id: somsak_q1
    npc: somsak
    title: "สมุดเล่มแรก"
    desc: "ผู้ใหญ่จะจัดสมุดประชุมสามสิบกว่าเล่มก่อนเกษียณ ขอแฟ้มมาเก็บ แล้วตามหาเล่มปี 2530"
    start: { heart_min: 2, day_min: 4 }
    offer:
      npc: "หลาน ผู้ใหญ่จะจัดสมุดประชุมในตู้ศาลา ตั้งแต่ปี 2530 สามสิบกว่าเล่ม ต้องใส่แฟ้มให้เรียบร้อยก่อนส่งมอบ… ช่วยไปซื้อแฟ้มร้านป้าแต๋วมาสามแฟ้มได้ไหม ย้ำอีกครั้งนะ สามแฟ้ม"
      options:
        - text: "ได้{k}ผู้ใหญ่ สามแฟ้มนะ{k}"
          accept: true
          heart: 1
          reply: "ดีจ้ะ ดีมาก หลานพูดซ้ำด้วย ผู้ใหญ่ชอบ บอกป้าแต๋วว่าเอาสีฟ้า สีฟ้าเป็นสีของหมู่สาม ระเบียบส่วนตัว"
        - text: "จะส่งมอบให้ใคร{kq}"
          accept: true
          heart: 1
          reply: "ให้ผู้ใหญ่คนต่อไปจ้ะ ยังไม่รู้ว่าใคร แต่สมุดต้องพร้อมก่อนคน ระเบียบ… ไปเถอะหลาน แฟ้มละยี่สิบห้า"
        - text: "ใช้แฟ้มเก่าไม่ได้เหรอ{kq}"
          heart: 0
          reply: "แฟ้มเก่าปลวกกินจ้ะ เหลือแต่คำว่า ‘รับทราบ’ ปลวกมันไม่กินคำนี้ สงสัยไม่อร่อย"
    steps:
      - goal: { type: give, npc: somsak, item: folder, n: 3 }
        hint: "ซื้อแฟ้มเอกสาร 3 แฟ้มที่ร้านป้าแต๋ว แล้วเอาไปให้ผู้ใหญ่ที่ศาลา"
        done:
          npc: "ได้แฟ้มแล้ว… หลาน ดูนี่ ผู้ใหญ่เจอแล้ว เล่มปี 2530 ลายมือเมียผู้ใหญ่ หน้าสุดท้ายเขียนว่า ‘พูดช้าๆ นะ ชาวบ้านจะเข้าใจ’ …ผู้ใหญ่ขอนั่งก่อนนะ"
          options:
            - text: "ลายมือสวยมาก{k}"
              heart: 2
              reply: "สวยจ้ะ สวยกว่าผู้ใหญ่ร้อยเท่า ผู้ใหญ่จะใส่แฟ้มสีฟ้าแฟ้มแรก ไม่ส่งมอบเล่มนี้ ผิดระเบียบนิดหน่อย ผู้ใหญ่ยอม"
            - text: "ผู้ใหญ่พูดช้าตามที่เขาบอกมาตลอดเลยนะ{kq}"
              heart: 2
              reply: "ตลอดจ้ะ… แล้วแถมพูดซ้ำ เขาคงหัวเราะอยู่ที่ไหนสักแห่ง ขอบใจนะหลาน ถ้าหลานไม่ช่วย ผู้ใหญ่คงไม่เปิดตู้นี้จนเกษียณ"
            - text: "เล่มอื่นจะเอาไปไหน{kq}"
              heart: 0
              reply: "เก็บไว้ที่ศาลาจ้ะ ใครอยากรู้ว่าตำบลนี้รับทราบอะไรไปบ้างสามสิบปี มาเปิดได้ ส่วนใหญ่รับทราบเรื่องถนน"
    sold_at: { folder: taew_shop }
    reward: { money: 100, heart: 1, set_flag: somsak_q1_done }

  - id: somsak_q2
    npc: somsak
    title: "ประกาศหกโมงเช้า"
    desc: "ผู้ใหญ่ชวนขึ้นหอกระจายข่าวตอนเช้า ช่วยถือกระดาษประกาศ แล้วลองพูดรอบเดียว"
    start: { flag: somsak_q1_done, heart_min: 3, day_min: 8 }
    offer:
      npc: "พรุ่งนี้หกโมง มาที่ศาลานะหลาน ผู้ใหญ่จะให้ถือกระดาษประกาศ ตาผู้ใหญ่ไม่ดีแล้ว… แล้วผู้ใหญ่อยากลองอะไรอย่างนึง ลองพูดรอบเดียว ดูว่าตำบลจะเป็นยังไง"
      options:
        - text: "ไป{k} {p}อยากเห็นหอกระจายข่าวข้างใน"
          accept: true
          heart: 1
          reply: "ข้างในมีเครื่องเสียง เทปปี 2538 กับจิ้งจกสามตัว จิ้งจกฟังประกาศผู้ใหญ่ทุกเช้า ไม่เคยบ่น"
        - text: "พูดรอบเดียว ผู้ใหญ่กล้าเหรอ{kq}"
          accept: true
          heart: 1
          reply: "ไม่กล้าจ้ะ ถึงต้องมีคนยืนข้างๆ ถ้าผู้ใหญ่จะย้ำ หลานสะกิดผู้ใหญ่นะ"
        - text: "หกโมงเช้าไม่ไหว{k}"
          heart: 0
          reply: "ไม่เป็นไรจ้ะ ผีออกสามทุ่ม หอกระจายข่าวออกหกโมง สองอย่างนี้ตรงเวลาที่สุดในตำบล คนไม่ต้องตรงก็ได้"
    steps:
      - goal: { type: visit, place: sala, from: "06:00", to: "07:30" }
        hint: "ไปศาลาตอนหกโมงเช้า ขึ้นหอกระจายข่าวกับผู้ใหญ่"
        done:
          npc: "‘พี่น้องหมู่สาม พรุ่งนี้ อบต. แจกพันธุ์ปลาเจ็ดโมง เอาสำเนาบัตรไปหนึ่งชุด’ …จบ ผู้ใหญ่พูดรอบเดียว มือสั่นเลยหลาน ดูสิ… ไมค์ยังไม่หอนเลย มันคงตกใจ"
          options:
            - text: "เก่งมาก{k}ผู้ใหญ่ ชัดกว่าทุกวันอีก"
              heart: 2
              set_flag: somsak_q2_once
              reply: "ชัดเหรอ… ผู้ใหญ่ขอจดไว้ วันนี้ผู้ใหญ่พูดรอบเดียวแล้วโลกไม่แตก แต่… หนึ่งชุดนะ ไม่ใช่สามชุด ผู้ใหญ่ลดสำเนาด้วย อันนี้กล้ากว่าอีก"
            - text: "ย้ำอีกสองรอบเถอะ{k} คนยังไม่ตื่น"
              heart: 1
              set_flag: somsak_q2_thrice
              reply: "ฮ่า! ใช่จ้ะ ใช่ ผู้ใหญ่ก็คิดแบบนั้น ย้ำอีกครั้งนะพี่น้อง… หลานรู้ใจผู้ใหญ่กว่าผู้ใหญ่อีก"
            - text: "ได้ยินเสียงป้าแต๋วตะโกนว่า ‘ผู้ใหญ่เป็นอะไรไป’{k}"
              heart: 1
              reply: "ได้ยินจ้ะ ทั้งตำบลคงตกใจ ผู้ใหญ่พูดรอบเดียวครั้งแรกในยี่สิบสองปี… ผู้ใหญ่จะเดินไปบอกป้าแต๋วเองว่าไม่ได้ป่วย ไปด้วยกันนะ"
    reward: { money: 120, heart: 1, items: { egg_duck: 3 }, set_flag: somsak_q2_done }

  - id: somsak_q3
    npc: somsak
    title: "ซ้อมอำลา"
    desc: "ผู้ใหญ่จะเขียนคำอำลาใหม่ให้สั้นลง รอสองวันแล้วไปฟังซ้อมที่ศาลาตอนเย็น"
    start: { flag: somsak_q2_done, heart_min: 5, day_min: 14 }
    offer:
      npc: "หลาน คำอำลาผู้ใหญ่ยาวสามหน้า อ่านไม่เคยจบ ผู้ใหญ่จะเขียนใหม่ ให้เวลาผู้ใหญ่สองวัน แล้วเย็นวันนั้นมาฟังผู้ใหญ่ซ้อมที่ศาลา ไม่ต้องปรบมือ แค่นั่งเฉยๆ"
      options:
        - text: "ได้{k} {p}จะนั่งฟังตั้งแต่ต้นจนจบ"
          accept: true
          heart: 2
          reply: "จนจบนะ… ถ้ามันจบ ผู้ใหญ่จะพยายามให้มันจบ ย้ำอีกครั้งนะ พยายาม"
        - text: "เขียนสั้นแค่ไหน{kq}"
          accept: true
          heart: 1
          reply: "ผู้ใหญ่ตั้งใจหน้าเดียว ไม่มีย้ำ… แต่เขียนไปเขียนมาเหลือสองหน้า มีย้ำห้าที่ ผู้ใหญ่จะตัดอีก"
        - text: "ยังอีกนานกว่าจะเกษียณนะ{kq}"
          heart: 0
          reply: "อีกไม่กี่เดือนจ้ะ สำหรับหลานนาน สำหรับผู้ใหญ่ เท่ากับประชุมถังขยะสามครั้ง"
    steps:
      - goal: { type: days, n: 2 }
        hint: "รอสองวันให้ผู้ใหญ่เขียนคำอำลาใหม่"
        done:
          npc: "เขียนเสร็จแล้วจ้ะ หน้าเดียว ไม่มีย้ำเลยสักคำ ผู้ใหญ่อ่านเองยังไม่เชื่อว่าผู้ใหญ่เขียน เย็นนี้มานะ"
          options:
            - text: "{p}ไปแน่{k}"
              heart: 1
              reply: "ห้าโมงครึ่ง หลังประกาศราคาผัก ผู้ใหญ่จะได้มีเสียงเหลือ"
            - text: "ไม่มีย้ำเลยเหรอ{kq} ไม่เหมือนผู้ใหญ่นะ"
              heart: 1
              reply: "ไม่เหมือนจ้ะ ผู้ใหญ่ก็กลัวว่าไม่เหมือน แต่วันสุดท้ายผู้ใหญ่อยากพูดแบบที่เมียผู้ใหญ่อยากได้ยิน คือพูดช้าๆ ครั้งเดียว"
      - goal: { type: visit, place: sala, from: "17:30", to: "19:30" }
        hint: "ไปศาลาตอนเย็น (17:30–19:30) ฟังผู้ใหญ่ซ้อมคำอำลา"
        done:
          npc: "‘พี่น้องหมู่สามที่รัก ยี่สิบสองปีที่ผู้ใหญ่พูดซ้ำ ก็เพราะกลัวว่าจะมีสักบ้านที่ไม่ได้ยิน วันนี้ผู้ใหญ่ขอพูดครั้งเดียว… ขอบคุณที่ฟัง’ …จบแล้วหลาน ผู้ใหญ่อ่านจบ!"
          options:
            - text: "จบแล้ว{k}ผู้ใหญ่ ไม่ร้องด้วย"
              heart: 2
              reply: "ร้องจ้ะ ร้องหลังจบ ไม่นับ… ระเบียบผู้ใหญ่บอกว่าร้องหลังจบไม่นับ ผู้ใหญ่เพิ่งตั้งระเบียบนี้เมื่อกี้"
            - text: "{p}ร้องแทนผู้ใหญ่แล้ว{k}"
              heart: 2
              reply: "โธ่หลาน… อย่าร้อง ผู้ใหญ่ยังไม่ไปไหน ผู้ใหญ่แค่จะว่างขึ้น ว่างจนไม่รู้จะทำอะไร… ตรงนี้แหละที่ผู้ใหญ่ยังไม่ได้เขียน"
    reward: { money: 150, heart: 2, items: { basil: 3 }, set_flag: somsak_q3_done }

  - id: somsak_q4
    npc: somsak
    title: "หลังวันที่ไมค์เงียบ"
    desc: "ผู้ใหญ่ไม่รู้ว่าหลังเกษียณจะทำอะไร ช่วยปลูกกะเพราเพิ่มให้ผู้ใหญ่ แล้วช่วยเขาตัดสินใจ"
    start: { flag: somsak_q3_done, heart_min: 6, day_min: 20 }
    offer:
      npc: "หลาน ผู้ใหญ่นั่งคิดสามคืนว่าวันแรกหลังเกษียณจะทำอะไร ได้คำตอบเดียวคือรดน้ำกะเพรา รดได้สิบนาที แล้วอีกยี่สิบสามชั่วโมงห้าสิบนาทีล่ะ… ช่วยเอากะเพรามาให้ผู้ใหญ่ปลูกเพิ่มห้าต้นก่อน แล้วค่อยช่วยผู้ใหญ่คิดต่อ"
      options:
        - text: "ได้{k} กะเพราจากแปลง{p}เลย"
          accept: true
          heart: 2
          reply: "ดีจ้ะ กะเพราแปลงยายเพียร ผู้ใหญ่จะตั้งชื่อกระถางว่า ‘หมู่ยายเพียร’ เป็นกระถางที่สิบสี่"
        - text: "ผู้ใหญ่ไม่ต้องรีบคิดก็ได้นะ{kq}"
          accept: true
          heart: 1
          reply: "ต้องรีบจ้ะ คนแก่ไม่รีบคิดเรื่องนี้ แล้ววันนั้นมาถึง จะนั่งหน้าหอกระจายข่าวทั้งวันเหมือนหมารอเจ้าของ"
        - text: "ผู้ใหญ่ไปถามกำนันดีกว่า{k}"
          heart: -1
          reply: "ถามแล้วจ้ะ กำนันบอกให้เลี้ยงไก่ ผู้ใหญ่กลัวไก่"
    steps:
      - goal: { type: give, npc: somsak, item: basil, n: 5 }
        hint: "เอากะเพรา 5 ต้นไปให้ผู้ใหญ่ที่ศาลา"
        done:
          npc: "ปลูกแล้ว ห้าต้น ห้ากระถาง… หลาน พรุ่งนี้เช้ามาที่ศาลาก่อนผู้ใหญ่ขึ้นประกาศนะ ผู้ใหญ่จะตัดสินใจเรื่องหลังเกษียณ แล้วจะประกาศให้ทั้งตำบลรู้ ผู้ใหญ่อยากให้หลานเป็นคนเลือกกับผู้ใหญ่"
          options:
            - text: "{p}จะไป{k}"
              heart: 1
              reply: "หกโมงนะจ้ะ หกโมง… รอบเดียว ผู้ใหญ่พูดรอบเดียวแล้วนะ เห็นไหม"
            - text: "ผู้ใหญ่ให้{p}เลือกเหรอ{kq} ชีวิตผู้ใหญ่นะ"
              heart: 1
              reply: "ชีวิตผู้ใหญ่จ้ะ แต่ผู้ใหญ่ตัดสินใจคนเดียวมาตลอด อยากลองมีคนช่วยสักครั้ง ระเบียบไม่ได้ห้าม"
      - goal: { type: visit, place: sala, from: "05:30", to: "07:00" }
        hint: "ไปศาลาตอนเช้ามืดก่อนประกาศหกโมง ช่วยผู้ใหญ่ตัดสินใจ"
        done:
          npc: "ผู้ใหญ่คิดไว้สามทาง ย้ำอีกครั้งนะ สามทาง… หนึ่ง เก็บกระเป๋าไปทะเลกับรถลุงเชิด สอง เปิดมุมสมุดประชุมที่ศาลา สอนคนรุ่นใหม่เขียนหนังสือราชการ สาม… ฝากไมค์ให้หลาน หลานว่าผู้ใหญ่ควรไปทางไหน"
          options:
            - text: "ไปทะเลเถอะ{k}ผู้ใหญ่ ยี่สิบสองปีแล้ว"
              heart: 2
              set_flag: somsak_q_sea
              reply: "ทะเล… ได้จ้ะ ได้! ผู้ใหญ่จะประกาศเลย ‘พี่น้องหมู่สาม หลังผู้ใหญ่เกษียณ ผู้ใหญ่จะไปทะเล’ …แล้วผู้ใหญ่จะเอาเทปปี 2538 ออก เปิดเพลงทะเลแทนเช้านี้ ช่างเปี๊ยกเอาออกให้แล้วเมื่อวาน ผู้ใหญ่ซ่อนไว้"
            - text: "เปิดมุมสอนคนรุ่นใหม่ ตำบลยังต้องการผู้ใหญ่{k}"
              heart: 2
              set_flag: somsak_q_mentor
              reply: "‘มุมระเบียบผู้ใหญ่สมศักดิ์’ …ฟังดูน่าเบื่อนะหลาน แต่ผู้ใหญ่ชอบ จะสอนเขียนหนังสือให้นายกฯ ตอบได้ภายในสามฉบับ ไม่ต้องรอสิบ"
            - text: "ให้{p}ลองรับไมค์ต่อดูไหม{kq}"
              heart: 1
              set_flag: somsak_q_successor
              reply: "หลานเหรอ… ผู้ใหญ่ไม่ได้ให้นะ ต้องเลือกตั้ง ระเบียบ แต่ผู้ใหญ่ให้ยืมไมค์ได้หนึ่งรอบ มา พูดเลย ประกาศรอบเดียวให้ทั้งตำบลได้ยินเสียงหลานก่อน"
    reward: { money: 300, heart: 2, items: { basil_seedling: 3 }, set_flag: somsak_q4_done, line: { from: somsak, text: "📢 แจ้งพี่น้องหมู่สาม ผู้ใหญ่ตัดสินใจแล้วว่าหลังเกษียณจะทำอะไร รายละเอียดฟังทางหอกระจายข่าวพรุ่งนี้หกโมง ย้ำอีกครั้งนะ… ไม่ย้ำแล้ว 🙏 ขอบใจหลานยายเพียร" } }
