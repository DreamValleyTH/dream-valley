# พี่หน่อย — ร้านก๋วยเตี๋ยว ครูสายเชฟ · convos + quests
convos:
  # ===== react =====
  - id: noi_r_meet
    topic: react
    once: true
    when: { not_flag: met_noi }
    npc: "อ้าว ลูกค้าใหม่! เดี๋ยวนะ… หน้าคุ้นๆ หลานยายเพียรใช่ไหมจ๊ะ ยายมานั่งโต๊ะนี้ทุกวันพระ สั่งเส้นเล็กน้ำใส ไม่ผงชูรส"
    set_flag: met_noi
    options:
      - text: "ใช่{k} {p}เพิ่งกลับมาอยู่บ้านยาย"
        heart: 1
        reply: "นั่งเลยน้อง ชามแรกพี่เลี้ยง ไม่ต้องเกรงใจ ยายน้องเคยเลี้ยงข้าวพี่ตอนพี่กลับมาใหม่ๆ ไม่มีใครมานั่งร้านเลย… เส้นอะไรดีจ๊ะ"
        next:
          - text: "เส้นเล็กน้ำใสเหมือนยายเลย{k}"
            heart: 2
            reply: "โอ๊ย… พี่ขนลุกเลย รอแป๊บนะ พี่ใส่ตับให้สองชิ้น ยายชอบตับ แต่หมอแอนห้าม ยายเลยกินแบบแอบๆ"
          - text: "แล้วแต่พี่เลย{k} {p}กินได้หมด"
            heart: 1
            reply: "กินได้หมดเนี่ยลูกค้าที่พี่รักที่สุดเลย งั้นบะหมี่ไข่ทำเองนะ พี่นวดเองตั้งแต่ตีห้า ไม่มีใครสั่งเลย น่าน้อยใจ"
      - text: "ชามละเท่าไหร่{kq}"
        heart: 0
        reply: "สี่สิบจ้ะ พิเศษห้าสิบ… วันนี้ไม่เอาเงินนะ ถือว่าพี่รับขวัญ วันหลังค่อยจ่ายเต็มๆ"
      - text: "ขอไม่ผักนะ{kq} ไม่ชอบผัก"
        heart: 0
        reply: "ไม่ผักได้จ้ะ… แต่พี่จะแอบใส่ผักบุ้งสองเส้น ใต้เส้นหมี่ ถือว่าไม่เห็นก็ไม่นับนะ"

  - id: noi_r_fainted
    topic: react
    when: { fainted_recent: true }
    npc: "นั่งลงก่อนเลย! พี่ได้ข่าวจากตั้มว่าเมื่อคืนน้องโดนหามไป รพ.สต. เมื่อวานกินข้าวกี่มื้อ บอกพี่มาตรงๆ"
    options:
      - text: "มื้อเดียว{k}…"
        heart: 1
        reply: "นั่นไง! ท้องว่างแรงก็น้อย ผีก็ชอบคนแรงน้อย พี่ตักข้าวต้มปลาให้ ไม่ใส่พริก ห้ามลุกจนกว่าจะหมดชาม"
      - text: "ตั้มเล่าด้วยเหรอ{kq}"
        heart: 0
        reply: "ตั้มไม่ได้เล่าหรอก ตั้มแค่มาซื้อก๋วยเตี๋ยวแล้วพูดว่า ‘คนที่พี่ห่วงไปนอนเตียงเหล็กมาครับ’ พี่ก็รู้แล้ว"
      - text: "ไม่เป็นไรแล้ว{k} ไม่ต้องห่วง"
        heart: 0
        reply: "ไม่เป็นไรแต่ปากซีด… พี่ไม่ห่วงหรอก พี่แค่จะยืนตรงนี้จนกว่าน้องจะกินหมด"

  - id: noi_r_town_intro
    topic: react
    once: true
    when: { flag: story_town_intro }
    npc: "เมื่อเช้าผู้ใหญ่ประกาศชื่อน้องตอนพี่กำลังลวกเส้น สามรอบนะ พี่ลวกเส้นเกินไปสามชาม ต้องกินเองหมด"
    options:
      - text: "ขอโทษ{k}พี่ {p}ไม่ได้ขอให้ประกาศเลย"
        heart: 1
        reply: "ไม่ต้องขอโทษ เส้นเกินพี่กินเองอร่อยดี แค่อายุพี่ไม่ควรกินสามชามก่อนเจ็ดโมง"
      - text: "ผู้ใหญ่พูดว่าไงบ้าง{kq}"
        heart: 1
        reply: "บอกว่า ‘ขอต้อนรับหลานยายเพียร ขอให้ทุกคนช่วยดูแล’ แล้วไมค์ก็หอน แล้วก็พูดใหม่… คนในร้านพี่ปรบมือรอบที่สามด้วยนะ"
        next:
          - text: "จริงเหรอ{kq} ปรบมือให้{p}"
            heart: 1
            reply: "ปรบมือให้ผู้ใหญ่ที่พูดจบได้ด้วยแหละ แต่ก็มีให้น้องครึ่งนึง พี่ยืนยัน"
          - text: "{p}อายจัง{k}"
            heart: 1
            reply: "อายอะไร คนที่นี่เขาประกาศหมดแหละ ใครคลอดลูก ใครหมาหาย ใครค้างค่าไฟ… อันสุดท้ายผู้ใหญ่เลิกไปแล้ว โดนด่า"

  - id: noi_r_thana_refused
    topic: react
    once: true
    when: { flag: thana_refused }
    npc: "พี่ได้ยินมาว่าน้องไม่ขายที่ให้คุณธนา… คุณธนามากินร้านพี่เมื่อวานนะ สั่งเส้นใหญ่แห้ง ไม่ยิ้มเลยทั้งชาม"
    options:
      - text: "{p}ยังไม่พร้อมขาย{k} ที่ของยาย"
        heart: 2
        reply: "พี่ไม่ถามเหตุผลหรอกน้อง แค่ดีใจ ร้านพี่ขาดลูกค้าไปไม่ได้แล้ว คนหนุ่มสาวในตำบลนับนิ้วได้"
      - text: "เขาจ่ายเงินตรงไหม{kq} คุณธนา"
        heart: 1
        reply: "จ่ายตรง ทิปด้วยยี่สิบ เขาก็เป็นคนธรรมดาจ้ะ… พี่แค่ไม่ชอบเวลาเขามองบ่อน้ำหลังร้านพี่นานเกินไป"
      - text: "เขาคงไม่ยอมแพ้ง่ายๆ หรอก{k}"
        heart: 0
        reply: "นั่นสิ คนแบบนั้นเหมือนน้ำซุป เคี่ยวไปเรื่อยๆ ไม่รีบ… น้องอย่าเซ็นอะไรตอนหิวนะ คนหิวตัดสินใจแย่"

  - id: noi_r_thana_maybe
    topic: react
    once: true
    when: { flag: thana_maybe }
    npc: "น้อง… ป้าแต๋วบอกพี่ว่าน้องบอกคุณธนาว่า ‘ขอคิดดูก่อน’ พี่ไม่ได้จะยุ่งนะ แค่ถามว่ากินข้าวก่อนคิดหรือยัง"
    options:
      - text: "ยังคิดไม่ตก{k}"
        heart: 1
        reply: "คิดไม่ตกก็อย่าเพิ่งตก ตักน้ำซุปซดก่อน… ยายน้องเคยบอกพี่ว่าที่ดินมันกินไม่ได้ แต่ไม่มีมันก็ไม่มีอะไรให้กิน"
        next:
          - text: "ยายพูดแบบนั้นจริงเหรอ{kq}"
            heart: 2
            reply: "จริงจ้ะ ตอนนั้นมีคนมาขอซื้อที่ยายรอบแรก ยายนั่งตรงนี้ ซดน้ำซุปหมดชามแล้วเดินกลับไปไล่เขาเลย"
          - text: "แต่เงินล้านสองก็เยอะนะ{kq}"
            heart: 0
            reply: "เยอะจ้ะ พี่ไม่เถียง พี่คิดเป็นก๋วยเตี๋ยวได้สามหมื่นชาม… แต่ขายที่ได้ครั้งเดียว ก๋วยเตี๋ยวพี่ขายได้ทุกวัน"
      - text: "ป้าแต๋วนี่รู้ทุกเรื่องเลย{k}"
        heart: 0
        reply: "ป้ารู้ก่อนน้องตัดสินใจอีกนะ ป้าบอกว่าน้องจะไม่ขาย พี่บอกว่ายังไม่แน่ เราพนันกันไว้ลูกชิ้นสิบลูก"

  - id: noi_r_result_road
    topic: react
    once: true
    when: { flag: meeting1_result_road }
    npc: "ถนนชนะเหรอน้อง… พี่ไม่ว่าอะไรหรอก ถนนดีขึ้นลุงเชิดจะได้เลิกบ่นโช้ค แต่ป้ายโครงการขึ้นก่อนรถบดอีกแล้วนะ"
    options:
      - text: "ป้ายขึ้นแล้วเหรอ{kq} เร็วจัง"
        heart: 1
        reply: "ขึ้นตั้งแต่เช้า ไวนิลใหญ่กว่าหน้าร้านพี่ รูปนายกฯ ยิ้มกว้างกว่าถนนอีก ส่วนเงินครึ่งนึงเขาบอกว่าไปศึกษาความเป็นไปได้"
        next:
          - text: "ศึกษาอะไร{kq} ถนนก็คือถนน"
            heart: 1
            reply: "พี่ก็ถามแบบนั้น เขาบอกว่าศึกษาว่าถนนควรยาวเท่าไหร่… พี่ว่ายาวเท่าเงินที่เหลือนั่นแหละ"
          - text: "อย่างน้อยก็ได้ถนนครึ่งนึง{k}"
            heart: 0
            reply: "จ้ะ ครึ่งนึงพอดีถึงหน้าบ้านญาติใครบางคน พี่ไม่ได้พูดนะ ป้าแต๋วพูด"
      - text: "พี่อยากได้อะไร{kq} ตอนโหวต"
        heart: 1
        reply: "พี่อยากได้น้ำจ้ะ ไม่มีน้ำก็ไม่มีน้ำซุป… แต่พี่ไม่ได้ไปยกมือ พี่ต้องเฝ้าหม้อ เลยไม่มีสิทธิ์บ่นมาก บ่นได้แค่นิดหน่อย"

  - id: noi_r_result_water
    topic: react
    once: true
    when: { flag: meeting1_result_water }
    npc: "ระบบน้ำชนะ! พี่ดีใจจนลวกลูกชิ้นแถมทุกชามเมื่อเช้า… แล้วพี่ก็ได้ยินว่าครึ่งนึงไปเป็นค่าศึกษาความเป็นไปได้ ลูกชิ้นพี่หายฟรีเลย"
    options:
      - text: "ครึ่งเดียวก็ยังดีกว่าไม่ได้นะ{kq}"
        heart: 1
        reply: "ก็ใช่… แต่พี่สงสัยว่าคนศึกษาเขาจะมาศึกษาบ่อหลังร้านพี่ไหม มันแห้งไปครึ่งนึงแล้ว ศึกษาง่ายมาก"
      - text: "ใครเป็นคนศึกษา{kq}"
        heart: 1
        reply: "บริษัทที่ปรึกษาในเมือง ป้าแต๋วบอกว่าเจ้าของเป็นญาติใครสักคน พี่ไม่รู้ พี่รู้แค่ว่ายังไม่มีใครมากินร้านพี่สักคน"
      - text: "แถมลูกชิ้นให้{p}ด้วยไหม{kq}"
        heart: 1
        reply: "แถมสิ น้องโหวตมาใช่ไหมล่ะ… ไม่ต้องบอกก็ได้ พี่ไม่ถาม พี่แถมทุกคนที่หน้าดีใจ"

  - id: noi_r_well_dry
    topic: react
    when: { flag: story_well_dry }
    npc: "บ่อหลังร้านพี่แห้งจนเห็นก้นแล้วน้อง พี่ต้องซื้อน้ำถังมาเคี่ยวน้ำซุป ถังละยี่สิบห้า วันละหกถัง… พี่คิดเลขทีไรน้ำตาซึม"
    options:
      - text: "ขึ้นราคาไหม{kq}พี่"
        heart: 0
        reply: "ยังไม่ขึ้นจ้ะ ถ้าพี่ขึ้น ลุงเชิดจะสั่งเส้นเล็กลง คนแก่เขาไม่บ่นหรอก เขาแค่กินน้อยลง พี่ทนดูไม่ได้"
      - text: "เดี๋ยว{p}ช่วยหาบน้ำคลองมาให้{k}"
        heart: 2
        reply: "น้องจ๋า น้ำคลองช่วงนี้ขุ่นเหมือนกาแฟเย็น เอามาล้างชามได้ แต่เคี่ยวซุปไม่ได้… แต่พี่รับน้ำใจไว้เต็มหม้อเลย"
        next:
          - text: "งั้นช่วยล้างชามแทน{k}"
            heart: 1
            reply: "ตกลง! ล้างให้สะอาดนะ ถ้าพี่เห็นคราบมันพี่ให้ล้างใหม่ มาตรฐานโรงแรมห้าดาวจ้ะ"
          - text: "พี่ว่าเพราะบริษัทจริงไหม{kq}"
            heart: 1
            reply: "พี่ไม่รู้เรื่องใต้ดินหรอกน้อง พี่รู้แค่ว่าสิบห้าปีบ่อไม่เคยแห้ง แล้วรั้วบริษัทมาปีเดียว… พี่ทำอาหาร พี่นับเวลาเก่ง"
      - text: "ซื้อน้ำแพงจัง{k}"
        heart: 0
        reply: "แพงจ้ะ น้ำเปล่าที่เคยฟรี วันนี้มันกลายเป็นวัตถุดิบ"

  - id: noi_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "คนงานบริษัทสามคนมากินก๋วยเตี๋ยวพี่เป็นมื้อสุดท้าย บอกว่าลาออกแล้ว เห็นผู้หญิงยืนข้างปั๊มน้ำตอนตีสอง… พี่ใส่ลูกชิ้นเพิ่มให้ปลอบใจ"
    options:
      - text: "พี่เชื่อเรื่องผีไหม{kq}"
        heart: 1
        reply: "พี่ไม่ค่อยเชื่อ แต่พี่ก็ไม่ลบหลู่ พี่ตั้งหม้อตีสี่มาสิบห้าปี เคยได้ยินอะไรเดินผ่านบ้าง ก็ทักไป ‘กินข้าวหรือยัง’ แล้วมันก็เงียบ"
        next:
          - text: "ทักผีว่ากินข้าวหรือยังเนี่ยนะ{kq}"
            heart: 1
            reply: "ก็พี่ทักทุกคนแบบนี้ ผีก็คงเคยเป็นคนมาก่อน หิวเป็นเหมือนกันแหละ"
          - text: "พี่กล้ากว่า{p}เยอะเลย{k}"
            heart: 1
            reply: "ไม่ได้กล้าจ้ะ แค่ไม่มีเวลากลัว น้ำซุปไม่รอใคร"
      - text: "แล้วคนงานจะไปทำอะไร{kq}"
        heart: 1
        reply: "คนหนึ่งบอกจะกลับบ้านไปทำนาที่โคราช พี่ว่าผีคงช่วยเขาตัดสินใจมากกว่าหลอกเขานะ"

  - id: noi_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "พี่ได้ถังน้ำโลโก้บริษัทมาใบหนึ่งจากประชุม ใส่น้ำซุปได้พอดีเลยน้อง… พี่หันโลโก้เข้าผนังนะ ไม่อยากให้ลูกค้ากินแล้วรู้สึกเป็นลูกค้าบริษัท"
    options:
      - text: "พี่รับถังเขามาด้วยเหรอ{kq}"
        heart: 0
        reply: "รับสิ ถังไม่ผิดอะไร พี่ไม่ได้ขายใจไปกับถังนะน้อง… ถังใบละสองร้อย พี่ได้ฟรี หัวใจพี่ไม่ได้ราคาเท่านั้น"
      - text: "คนในประชุมว่าไงกันบ้าง{kq}"
        heart: 1
        reply: "แตกเป็นสองฝ่ายจ้ะ ฝ่ายหนึ่งว่าได้ถังก็ดี อีกฝ่ายว่าเอาน้ำไปแล้วเอาถังมาคืน พี่นั่งท้ายห้องแจกข้าวต้มมัด ไม่มีฝ่าย มีแต่ขนม"
        next:
          - text: "พี่อยู่ฝ่ายไหนจริงๆ{kq}"
            heart: 1
            reply: "พี่อยู่ฝ่ายคนที่ยังอยากกินน้ำซุปพี่ในอีกสิบปี… น้องคิดเอาเองนะว่าฝ่ายนั้นคือฝ่ายไหน"
          - text: "เดี๋ยว{p}ขอข้าวต้มมัดบ้าง{k}"
            heart: 1
            reply: "หมดแล้วจ้ะ กำนันกินไปสี่ห่อ หลับไปสองรอบ ตื่นมากินต่อ"

  - id: noi_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ป้ายหาเสียงขึ้นเต็มเสาไฟหน้าร้านพี่แล้ว เสาเดียวมีสามหน้ายิ้มซ้อนกัน พี่เปิดร้านมาสิบห้าปี ไม่เคยมีคนหน้ายิ้มเยอะขนาดนี้"
    options:
      - text: "ผู้สมัครมากินร้านพี่หรือยัง{kq}"
        heart: 1
        reply: "มาแล้วสองคน จ่ายเงินคนเดียว อีกคนบอกว่า ‘เดี๋ยวทีมงานมาจ่าย’ ทีมงานยังไม่มาจ้ะ พี่จดไว้ในใจแล้ว"
      - text: "พี่อยากได้นายกฯ แบบไหน{kq}"
        heart: 1
        reply: "แบบที่ทำให้คนหนุ่มสาวอยู่ได้ ไม่ต้องไปกรุงเทพฯ กันหมด… ถ้าไม่มีก็ขอแบบที่ไม่เปิดรถแห่หน้าร้านพี่ตอนเที่ยงก็พอ"
      - text: "ป้ายบังร้านพี่ไหม{kq}"
        heart: 0
        reply: "บังป้ายก๋วยเตี๋ยวพี่ไปครึ่งนึง ลูกค้าใหม่นึกว่าร้านนี้ชื่อ ‘เบอร์ 2 ทำจริง’ พี่ต้องอธิบายทั้งวัน"

  - id: noi_r_lottery
    topic: react
    once: true
    when: { flag: bought_lottery }
    npc: "ลุงสมหมายมานั่งร้านพี่บอกว่าน้องซื้อสลากด้วยใช่ไหม ลุงขอเลขจากเลขโต๊ะร้านพี่ไปแล้ว โต๊ะเบอร์สามเพราะขาโยก"
    options:
      - text: "ซื้อเล่นๆ ใบเดียว{k}"
        heart: 1
        reply: "ใบเดียวพอจ้ะ ถูกก็ดีใจ ไม่ถูกก็เท่าก๋วยเตี๋ยวสองชามครึ่ง พี่คิดทุกอย่างเป็นก๋วยเตี๋ยว ชินแล้ว"
      - text: "โต๊ะขาโยกได้เลขด้วยเหรอ{kq}"
        heart: 1
        reply: "ลุงว่ามันโยกสามที แปลว่าสาม ป้าพรว่ามันโยกเพราะลุงนั่งแรง… พี่ว่าพี่ควรเปลี่ยนโต๊ะ แต่ลุงขอไว้ก่อน จนกว่าหวยจะออก"

  - id: noi_r_end_class
    topic: react
    once: true
    when: { flag: noi_end_class }
    npc: "น้อง! เสาร์นี้ห้องเรียนทำอาหารรุ่นแรก มีคนสมัครสิบสองคน เด็กเจ็ด ผู้ใหญ่ห้า ดาบเสถียรสมัครด้วย บอกว่าจะมาเรียนต้มบะหมี่ซองให้อร่อย"
    options:
      - text: "พี่สอนอะไรเป็นจานแรก{kq}"
        heart: 1
        reply: "ไข่เจียวจ้ะ จานที่ง่ายที่สุดแต่ทำให้ดีที่สุดยากที่สุด… แล้วก็สอนให้ชิมก่อนแล้วค่อยเติม จานแรกต้องสอนนิสัยก่อนสอนสูตร"
      - text: "ดาบเสถียรจะมาจริงเหรอ{kq}"
        heart: 1
        reply: "เขาบอก ‘มานะ… พรุ่งนี้’ พี่เลยจดชื่อไว้ในวันพรุ่งนี้ทุกวันเลย จะได้มาแน่ๆ"

  - id: noi_r_end_shop
    topic: react
    once: true
    when: { flag: noi_end_shop }
    npc: "พี่ซื้อโอ่งมังกรมาสามใบไว้รองน้ำฝนแล้วน้อง ช่างเปี๊ยกต่อรางให้ คิดค่าแรงเป็นก๋วยเตี๋ยวทั้งเดือน… พี่ยังอยู่ตรงนี้นะ ไม่ไปไหน"
    options:
      - text: "ดีใจด้วย{k}พี่ {p}จะมากินทุกวัน"
        heart: 2
        reply: "ทุกวันจริงนะ พี่จะจำว่าน้องมากี่วัน ขาดวันเดียวพี่จะเดินไปถามถึงบ้าน"
      - text: "ช่างเปี๊ยกกินทั้งเดือนเลยเหรอ{kq}"
        heart: 1
        reply: "ทั้งเดือน วันละสองชาม แล้วรางยังรั่วอยู่หนึ่งจุด เขาบอกพรุ่งนี้มาแก้… พรุ่งนี้ของช่างเปี๊ยกกับดาบเสถียรเป็นวันเดียวกัน"

  - id: noi_r_end_company
    topic: react
    once: true
    when: { flag: noi_end_company }
    npc: "พรุ่งนี้พี่เริ่มส่งข้าวกล่องให้โรงอาหารบริษัทวันละร้อยกล่องแล้วน้อง… พี่ยังเปิดร้านตอนเช้าเหมือนเดิมนะ แค่ปิดเร็วขึ้น"
    options:
      - text: "พี่โอเคใช่ไหม{kq}"
        heart: 2
        reply: "โอเคจ้ะ… คนงานก็คนหิวเหมือนกัน พี่ทำอาหารให้คนหิว ไม่ได้ทำให้บริษัท พี่บอกตัวเองแบบนี้ทุกเช้า บางเช้าก็เชื่อ"
      - text: "เขาให้น้ำฟรีด้วยไหม{kq}"
        heart: 0
        reply: "ให้จ้ะ น้ำขวดมีโลโก้ ส่งทุกเช้า… น้ำจากบ่อเราเอง ใส่ขวดกลับมาให้เรา พี่คิดแล้วก็ไม่อยากคิดต่อ"
      - text: "ป้าทองใบว่าไงบ้าง{kq}"
        heart: 1
        reply: "ป้าไม่พูดกับพี่สองวัน วันที่สามเอาแกงมาให้ถ้วยหนึ่ง บอกว่า ‘ข้าวกล่องบริษัทจืดแน่ เติมอันนี้ไป’ นั่นแหละป้า"

  # ===== news =====
  - id: noi_n_salt
    topic: news
    npc: "ข่าวดีน้อง หมอแอนวัดความดันคนในร้านพี่วันพุธ ลดลงทุกคน ยกเว้นป้าแต๋ว ป้าบอกว่าเครื่องวัดเสีย"
    options:
      - text: "เพราะพี่ลดเกลือในน้ำซุปใช่ไหม{kq}"
        heart: 1
        reply: "ส่วนหนึ่งจ้ะ อีกส่วนเพราะพี่ซ่อนขวดน้ำปลาบนโต๊ะไว้ใต้ตะกร้าผัก คนขี้เกียจหาก็ไม่เติม จิตวิทยาจ้ะ"
        next:
          - text: "แล้วคนที่ขยันหาล่ะ{kq}"
            heart: 1
            reply: "ก็ป้าแต๋วไง หาเจอภายในสามวินาที แล้วยังบอกพี่ว่า ‘ซ่อนไม่เนียน’ ป้าเป็นนักสืบน้ำปลา"
          - text: "พี่ฉลาดจัง{k}"
            heart: 1
            reply: "ฉลาดแบบแม่ครัวจ้ะ หมอแอนใช้ความรู้ พี่ใช้ตะกร้าผัก ได้ผลเหมือนกัน"
      - text: "ป้าแต๋วเติมน้ำปลากี่ช้อน{kq}"
        heart: 1
        reply: "สามช้อน แล้วเติมพริกน้ำส้มบอกว่าเพื่อความสมดุล… เมื่อวานพี่เห็นป้าพกน้ำปลาขวดเล็กมาจากร้านป้าเอง"
      - text: "เครื่องวัดเสียจริงหรือเปล่า{kq}"
        heart: 0
        reply: "เครื่องเดียวกันวัดลุงเชิดได้สวยเลย พี่ว่าเครื่องไม่เสีย คนเสียนิสัย ฮ่าๆ อย่าบอกป้านะ"

  - id: noi_n_kla_veg
    topic: news
    npc: "ผักบุ้งสหกรณ์กล้ามาส่งเช้านี้ช้าไปครึ่งชั่วโมง กล้าบอกว่ามอไซค์ดับกลางทาง เข็นมาสองกิโล… ผักยังกรอบ คนส่งเหี่ยวแทน"
    options:
      - text: "พี่กล้าไม่เป็นอะไรนะ{kq}"
        heart: 1
        reply: "ไม่เป็นไร แต่ยังไม่ได้กินข้าว พี่ให้กินชามหนึ่ง เขาจะจ่ายเงิน พี่ไม่รับ เถียงกันห้านาที สุดท้ายเขาจ่ายเป็นผักบุ้งเพิ่มสามกำ"
      - text: "ทำไมไม่ซื้อผักเสี่ยเฮง ถูกกว่า{kq}"
        heart: 0
        reply: "ถูกกว่าจ้ะ แต่ผักสหกรณ์ไม่มีกลิ่นยา พี่ลวกแล้วรู้เลย… แล้วพี่อยากให้เงินพี่วนอยู่ในตำบล ไม่ใช่วนไปลานเสี่ย"
      - text: "บอลน่าจะซ่อมให้ได้นะ{kq}"
        heart: 1
        reply: "บอลบอกว่ารถคันนั้นอยู่ได้ด้วยศรัทธา ซ่อมไม่ได้แล้ว ได้แต่สวดมนต์ให้… แต่ก็ซ่อมให้ฟรีอีกรอบอยู่ดี"

  - id: noi_n_school
    topic: news
    npc: "ครูเต้ยมาบอกว่า อบต. ตัดงบอาหารกลางวันเด็กลงอีกแล้ว หัวละไม่กี่บาท ต้องเลี้ยงให้ครบห้าหมู่ ครูนั่งคิดเมนูจนผมร่วง"
    options:
      - text: "พี่ช่วยคิดเมนูให้ได้ไหม{kq}"
        heart: 2
        reply: "พี่คิดไว้แล้วจ้ะ ไข่พะโล้ใส่ฟักทอง ถูก อิ่ม เด็กกินได้… พี่แค่ไม่รู้จะคิดยังไงให้ไวนิลเปิดโครงการถูกกว่าค่าไข่"
      - text: "งบไปไหนหมด{kq}"
        heart: 1
        reply: "ไปที่ซุ้มประตูทางเข้าตำบลอันใหม่ไงน้อง สวยมาก ไฟกะพริบได้ เด็กกินไม่ได้แต่ถ่ายรูปได้"
      - text: "เด็กๆ เขากินอะไรกัน{kq}"
        heart: 1
        reply: "ข้าวกับแกงจืดน้ำใสเห็นก้นถ้วย น้องโอ๊ตบอกพี่ว่าแกงจืดโรงเรียนเหมือนน้ำล้างมือ… ปากเด็กไม่โกหกจ้ะ"

  - id: noi_n_bus
    topic: news
    when: { time: morning }
    npc: "ลุงเชิดเพิ่งไปเลยน้อง วันนี้ลุงสั่งเส้นใหญ่น้ำใสเหมือนเดิม แต่ขอผักชีเพิ่ม สามสิบปีครั้งแรก! พี่ตกใจจนทำทัพพีหล่น"
    options:
      - text: "ลุงเป็นอะไรหรือเปล่า{kq}"
        heart: 1
        reply: "พี่ก็ถาม ลุงบอกว่า ‘หมอแอนบอกให้กินผัก’ แล้วลุงก็เขี่ยผักชีออกทีละใบ กินแต่เส้น… ก้าวแรกจ้ะ ก้าวแรก"
      - text: "พี่ควรประกาศหอกระจายข่าวเลย{k}"
        heart: 1
        reply: "ประกาศแล้วผู้ใหญ่ต้องพูดสามรอบ ลุงเชิดจะอายแล้วเลิกกินผักชีอีกสามสิบปี ปล่อยให้เป็นความลับของร้านพี่ดีกว่า"

  - id: noi_n_thongbai_contest
    topic: news
    when: { day_min: 5 }
    npc: "ป้าทองใบส่งคนมาท้าแข่งกวนกระยาสารทอีกแล้ว ปีนี้ป้าบอกว่าจะให้พระอาจารย์สุเมธเป็นกรรมการ พี่แพ้แน่ๆ ท่านชอบของไม่หวาน"
    options:
      - text: "พี่ทำหวานน้อยแข่งสิ{kq}"
        heart: 1
        reply: "ป้าก็คิดแบบนั้นเหมือนกันน้อง ป้าเป็นคนเดียวในตำบลที่พี่อ่านใจออกและอ่านใจพี่ออก เราเลยเสมอกันทุกปีในใจ แต่แพ้ในงาน"
      - text: "ทำไมไม่ทำด้วยกัน{kq}"
        heart: 1
        reply: "เคยลองแล้วจ้ะ สองคนกวนกระทะเดียว ไม้พายตีกันจนกระทะหมุน เณรต้นหัวเราะจนตกเก้าอี้"
      - text: "{p}จะเชียร์ป้าทองใบนะ{kq}"
        heart: 0
        reply: "ไปเลย คนทรยศ! …ล้อเล่นจ้ะ ป้าทองใบก็ต้องมีกองเชียร์บ้าง ปีที่แล้วกองเชียร์ป้ามีแต่ลุงพรานแดง ยืนเฉยๆ ไม่ปรบมือ"

  # ===== advice =====
  - id: noi_a_meal
    topic: advice
    when: { time: noon }
    npc: "บ่ายโมงแล้วน้อง มื้อแรกกินหรือยัง… อย่าตอบว่ากาแฟ กาแฟไม่ใช่ข้าว ขนมก็ไม่ใช่ข้าว พี่ได้ยินคำตอบนี้ทุกวัน"
    options:
      - text: "กินแล้ว{k} ข้าวไข่เจียว"
        heart: 1
        reply: "เก่งจ้ะ ไข่เจียวทอดให้ฟูต้องตีไข่ให้ขึ้นฟองแล้วเทลงน้ำมันร้อนจัด ไม่ใช่น้ำมันอุ่นๆ เหมือนใจคนกลางวัน"
      - text: "ยัง{k} ตอนนี้กินเลยได้ไหม"
        heart: 1
        reply: "ได้สิ นั่งเลย ก่อนบ่ายสองยังนับเป็นมื้อแรก… พี่ให้ชามพิเศษราคาธรรมดา ถือว่าค่าปรับที่ยังไม่กิน ปรับตัวพี่เองนะ"
      - text: "เดี๋ยวค่อยกินมื้อเดียวทีเดียวเลย{k}"
        heart: -1
        reply: "มื้อเดียวทีเดียวคือสูตรโรคกระเพาะจ้ะน้อง พี่เป็นมาแล้วตอนอยู่โรงแรม ยืนหน้าเตาทั้งวันแต่ไม่ได้กิน ตลกไหม แม่ครัวท้องหิว"

  - id: noi_a_taste
    topic: advice
    npc: "เวลาปรุงนะน้อง เติมทีละอย่าง แล้วชิม อย่าเทน้ำปลา น้ำตาล มะนาวทีเดียวพร้อมกัน มันจะเถียงกันในหม้อ"
    options:
      - text: "เติมอะไรก่อนดี{kq}"
        heart: 1
        reply: "เค็มก่อน แล้วเปรี้ยว หวานทีหลังสุด หวานมันกลบทุกอย่าง เหมือนคนพูดเพราะในที่ประชุม"
      - text: "{p}ชอบเทรวมทีเดียว ประหยัดเวลา{k}"
        heart: 0
        reply: "ประหยัดเวลาแต่เปลืองข้าวจ้ะ ปรุงพังหนึ่งหม้อต้องทิ้ง… แล้วอาหารจะได้ป้ายหวานป้ายเค็มติดมาเต็มเลย"
      - text: "ชิมก่อนแล้วค่อยเติม ใช่ไหม{kq}"
        heart: 2
        reply: "ใช่! น้องจำได้ด้วย พี่พูดประโยคนี้กับลูกค้าทุกคน มีคนจำได้แค่สามคน น้อง เณรต้น กับแมวป้าแต๋ว"

  - id: noi_a_cook_before
    topic: advice
    when: { time: evening }
    npc: "ถ้าน้องจะออกไปไหนหัวค่ำ กินของร้อนๆ ก่อนนะ ต้มยำน้ำใสสักถ้วย คนท้องอุ่นใจไม่ค่อยสั่น"
    options:
      - text: "ช่วยได้จริงเหรอ{kq}"
        heart: 1
        reply: "ยายบัวบอกว่าช่วย หมอแอนบอกว่าไม่เกี่ยว แต่ทั้งสองคนกินต้มยำพี่ก่อนกลับบ้านทุกวัน พี่เลยถือว่าช่วย"
      - text: "{p}ทำต้มยำไม่เป็น{k}"
        heart: 1
        reply: "ง่ายจ้ะ ตะไคร้ ข่า ใบมะกรูด ทุบให้แตก ต้มให้หอมก่อนใส่กุ้ง กุ้งสุกแล้วปิดไฟ มะนาวใส่ตอนปิดไฟ ไม่งั้นขม"
        next:
          - text: "ทำไมมะนาวต้องใส่ตอนปิดไฟ{kq}"
            heart: 1
            reply: "มะนาวโดนความร้อนนานมันขม เหมือนคนโดนบ่นนาน… พี่เปรียบมั่วไปหน่อย แต่จำง่ายใช่ไหมล่ะ"
          - text: "พี่สอนตอนบ่ายได้ไหม{kq}"
            heart: 2
            reply: "ได้สิ บ่ายสามร้านว่าง มาได้เลย เอากุ้งมาเอง… ล้อเล่น พี่มีกุ้งแช่แข็งอยู่ครึ่งถุง"

  - id: noi_a_grade
    topic: advice
    npc: "น้องอย่ารีบหัดหลายจานนะ เอาจานเดียวให้ได้ทองก่อน พี่อยู่โรงแรม เชฟใหญ่ให้พี่ทอดไข่ดาวอย่างเดียวสามเดือน"
    options:
      - text: "สามเดือนไข่ดาวอย่างเดียวเลยเหรอ{kq}"
        heart: 1
        reply: "สามเดือน ไข่แดงต้องอยู่กลาง ขอบต้องกรอบแค่ครึ่งมิล… เดือนที่สี่ได้ทำไข่ลวก พี่ร้องไห้ดีใจในห้องเย็น"
      - text: "แต่{p}เบื่อง่าย{k}"
        heart: 1
        reply: "เบื่อก็สลับไปทำจานง่ายบ้าง แต่อย่าทิ้งจานแรก กลับมาทำทุกวันทีละนิด เหมือนเคี่ยวน้ำซุป ไม่ต้องไฟแรง ขอแค่ไม่ดับ"

  - id: noi_a_gift
    topic: advice
    when: { heart_min: 2 }
    npc: "จะทำอาหารไปฝากใครนะน้อง ดูคนกินด้วย ยายบัวไม่กินเผ็ด ลุงพรานแดงฟันโยก ป้าทองใบบอกจืดทุกจาน อันนั้นไม่ต้องสนใจ"
    options:
      - text: "แล้วพี่ชอบกินอะไร{kq}"
        heart: 2
        reply: "พี่เหรอ… ไม่ค่อยมีใครถาม พี่ชอบน้ำพริกกะปิกับผักลวก ของง่ายๆ ที่คนอื่นทำให้กิน อาหารที่ไม่ต้องทำเองอร่อยที่สุดในโลกจ้ะ"
      - text: "ลุงพรานแดงฟันโยกจริงเหรอ{kq}"
        heart: 1
        reply: "จริง แต่แกยังเคี้ยวปลาเผาได้ทั้งตัว บอกว่าเคี้ยวข้างเดียว อีกข้างเก็บไว้ยิ้ม ซึ่งแกก็ไม่ค่อยยิ้มอยู่ดี"
      - text: "ซื้อขนมไปฝากง่ายกว่า{k}"
        heart: 0
        reply: "ง่ายกว่าจ้ะ แต่ของทำเองคนเขาจำ ของซื้อคนเขากิน… กินแล้วก็ลืม"

  # ===== smalltalk =====
  - id: noi_s_noodle_type
    topic: smalltalk
    npc: "พี่มีทฤษฎีนะน้อง คนชอบเส้นใหญ่ใจกว้าง คนชอบหมี่ใจร้อน คนชอบบะหมี่ช่างเลือก คนชอบเส้นเล็กใจเย็น… น้องเป็นแบบไหน"
    options:
      - text: "เส้นเล็ก{k} ใจเย็นมาก"
        heart: 1
        reply: "จริงเหรอ แต่เมื่อวานพี่เห็นน้องเดินเร็วไล่ไก่รอบบ้าน… ทฤษฎีพี่อาจต้องปรับ"
      - text: "หมี่{k} เพราะหิวเร็ว"
        heart: 1
        reply: "นั่นไง! ใจร้อนท้องร้อนเหมือนกัน หมี่สุกเร็วสุด พี่ลวกสามวิก็ได้แล้ว"
      - text: "แล้วดาบเสถียรชอบเส้นอะไร{kq}"
        heart: 1
        reply: "เกาเหลาจ้ะ ไม่มีเส้น… ดาบบอกว่าเส้นทำให้ง่วง ทั้งที่ดาบง่วงตั้งแต่ก่อนสั่ง"

  - id: noi_s_hotel
    topic: smalltalk
    npc: "ตอนพี่อยู่โรงแรม มีฝรั่งสั่ง ‘ก๋วยเตี๋ยวไม่เผ็ด ไม่หวาน ไม่เค็ม’ พี่ยกน้ำต้มเส้นไปให้ถ้วยหนึ่ง เขาชมว่าเพียวมาก"
    options:
      - text: "พี่โดนดุไหม{kq}"
        heart: 1
        reply: "เชฟใหญ่หัวเราะจนต้องออกไปยืนหลังครัว แล้วบอกว่าพรุ่งนี้ห้ามทำอีก… วันต่อมาฝรั่งคนเดิมมาสั่งเหมือนเดิมเลย"
      - text: "พี่คิดถึงโรงแรมไหม{kq}"
        heart: 1
        reply: "คิดถึงแอร์ในครัวจ้ะ ที่นี่หน้าเตาร้อนจนเหงื่อพี่ลงหม้อ… ล้อเล่น พี่เช็ดทันทุกหยด"

  - id: noi_s_rain
    topic: smalltalk
    when: { rain: true }
    npc: "ฝนตกทีไรร้านพี่เต็ม คนหลบฝนแล้วเกรงใจ เลยสั่งก๋วยเตี๋ยวคนละชาม พี่ควรขอบคุณฟ้าหรือขอบคุณความเกรงใจดี"
    options:
      - text: "ขอบคุณทั้งคู่เลย{k}"
        heart: 1
        reply: "ดีจ้ะ งั้นพี่ตั้งน้ำชาร้อนไว้ให้ฟ้ากาหนึ่ง ให้คนเกรงใจกาหนึ่ง"
      - text: "{p}ก็มาหลบฝนเหมือนกัน{k}"
        heart: 1
        reply: "น้องไม่ต้องสั่งก็ได้นะ นั่งเฉยๆ ได้ แต่ถ้าหิวพี่มีเกาเหลาเหลือ… หน้าน้องบอกว่าหิว"
      - text: "ฝนแบบนี้เห็ดน่าจะขึ้นนะ{kq}"
        heart: 1
        reply: "ขึ้นแน่ ป้าทองใบคงเข้าป่าตั้งแต่ตีห้า แล้วกลับมาบอกพี่ว่า ‘ไม่เจอเลย’ ทั้งที่ตะกร้าเต็ม"

  - id: noi_s_cat
    topic: smalltalk
    npc: "แมวส้มป้าแต๋วมานั่งหน้าร้านพี่ทุกเช้า พี่ให้ลูกชิ้นหนึ่งลูก มันกินแล้วเดินกลับไปนั่งร้านป้าแต๋วต่อ ไม่มีความภักดีเลย"
    options:
      - text: "มันคงไปเล่าข่าวให้ป้าแต๋วฟัง{k}"
        heart: 1
        reply: "ใช่! พี่ว่ามันเป็นสายลับป้าแต๋ว เรื่องในร้านพี่ไปถึงร้านป้าเร็วกว่าคนเดินอีก"
      - text: "ให้ลูกชิ้นแมวกินได้เหรอ{kq}"
        heart: 0
        reply: "ลูกชิ้นไม่ใส่เกลือจ้ะ พี่ทำแยกให้มันโดยเฉพาะ… ใช่ พี่ทำลูกชิ้นจืดให้แมว อย่าบอกป้าทองใบ เดี๋ยวโดนว่าจืด"

  - id: noi_s_lastmeal
    topic: smalltalk
    when: { heart_min: 3 }
    npc: "น้องเคยคิดไหมว่าถ้าได้กินอาหารแค่อย่างเดียวไปตลอดชีวิต จะเลือกอะไร"
    options:
      - text: "ก๋วยเตี๋ยวพี่หน่อย{k}"
        heart: 2
        reply: "ปากหวานจริง… แต่พี่ยอมให้ปากหวานแบบนี้นะ พี่ใส่ลูกชิ้นเพิ่มให้สองลูก ห้ามบอกใคร"
      - text: "ข้าวผัดกะเพรา{k} ไม่มีวันเบื่อ"
        heart: 1
        reply: "คำตอบยอดฮิตของคนกรุงเทพฯ! กะเพราใบต้องเด็ดตอนจะใส่นะ ห้ามเด็ดทิ้งไว้ มันดำ แล้วกลิ่นหนีไปหมด"
        next:
          - text: "{p}ปลูกกะเพราเองอยู่{k}"
            heart: 1
            reply: "งั้นเด็ดมาตอนเช้าแล้ววิ่งมาร้านพี่ พี่ผัดให้ทันที ใบสดจากต้นถึงกระทะไม่เกินสิบนาที นั่นแหละกะเพราที่แท้"
          - text: "พี่ล่ะเลือกอะไร{kq}"
            heart: 1
            reply: "ข้าวต้มขาวกับไข่เค็มจ้ะ เป็นอาหารที่แม่ทำให้ตอนพี่ป่วย พี่เลือกความรู้สึก ไม่ได้เลือกรสชาติ"
      - text: "ข้าวเวฟ{k} สะดวกดี"
        heart: -1
        reply: "น้อง… พี่จะทำเป็นไม่ได้ยิน แล้วจะไปบอกตั้มว่ามีคนเป็นเพื่อนเขาแล้ว"

  # ===== self =====
  - id: noi_f_name
    topic: self
    npc: "ทุกคนเรียกพี่ว่าพี่หน่อย เด็กก็เรียก ยายก็เรียก พระก็… ไม่ได้เรียก พระเรียกโยม แต่ท่านยิ้มแบบพี่หน่อย"
    options:
      - text: "ชื่อจริงพี่ชื่ออะไร{kq}"
        heart: 1
        reply: "ยาวมากจ้ะ สี่พยางค์ มีตัวการันต์สองตัว ครูประถมพี่สะกดผิดหกปี พี่เลยยอมแพ้ ใช้หน่อยดีกว่า"
      - text: "พี่หน่อยฟังแล้วอบอุ่นดี{k}"
        heart: 2
        reply: "จริงเหรอ… ตอนอยู่โรงแรมเขาเรียกพี่ว่า ‘ครัวสาม’ ตามสถานีที่ยืน กลับมาเป็นพี่หน่อยแล้วพี่ไม่อยากเป็นสถานีอีกเลย"

  - id: noi_f_mother
    topic: self
    when: { heart_min: 3 }
    npc: "หม้อน้ำซุปใบใหญ่นั่นของแม่พี่นะน้อง ก้นหม้อบุบตรงนั้นเพราะแม่ทำตกตอนพี่เกิด แม่บอกว่ารีบไปโรงพยาบาลจนลืมยกหม้อ"
    options:
      - text: "แม่พี่คงทำอาหารเก่งมาก{k}"
        heart: 1
        reply: "เก่งแต่ไม่เคยจด แม่ชิมแล้วบอกว่า ‘ขาดอีกนิด’ พี่ถามว่านิดเท่าไหร่ แม่บอก ‘นิดเท่าที่ขาด’ พี่ใช้เวลาสิบปีถึงเข้าใจ"
        next:
          - text: "ตอนนี้พี่เข้าใจแล้วเหรอ{kq}"
            heart: 2
            reply: "เข้าใจครึ่งนึงจ้ะ อีกครึ่งพี่จดไว้ในสมุดเล่มเล็ก… เดี๋ยว พี่พูดมากไปแล้ว ไว้วันหลังนะ"
          - text: "พี่ยังใช้หม้อใบนี้ทุกวันเลยเหรอ{kq}"
            heart: 1
            reply: "ทุกวันจ้ะ หม้อใหม่ก็มีนะ แต่น้ำซุปในหม้อใหม่ไม่หอมเท่า พี่ว่าหม้อมันจำรสได้ เหมือนลิ้นคน"
      - text: "ก้นหม้อบุบไม่รั่วเหรอ{kq}"
        heart: 0
        reply: "ไม่รั่วจ้ะ บุบแต่ไม่รั่ว เหมือนคนในตำบลนี้แหละ"

  - id: noi_f_hotel_cry
    topic: self
    when: { heart_min: 5 }
    npc: "พี่เคยร้องไห้ในห้องเย็นของโรงแรม เพราะวันเกิดพี่ไม่มีใครรู้ ทำเค้กให้แขกห้าสิบก้อน ไม่มีก้อนไหนเขียนชื่อพี่"
    options:
      - text: "วันเกิดพี่วันไหน{kq} {p}จะจำไว้"
        heart: 2
        reply: "ไม่ต้องจดหรอกน้อง… เอาเป็นว่าวันที่พี่ทำขนมครกแจกทั้งร้านนั่นแหละ น้องมาร้านพี่วันนั้นก็พอ"
      - text: "แล้วทำไมพี่ไม่ลาออกตั้งแต่ตอนนั้น{kq}"
        heart: 1
        reply: "เงินดีจ้ะ แล้วพี่คิดว่าความเหงาเป็นค่าจ้างส่วนหนึ่ง… จนแม่ป่วย พี่ถึงรู้ว่าพี่จ่ายความเหงาแพงกว่าเงินเดือนที่ได้"
        next:
          - text: "{p}ก็เคยรู้สึกแบบนั้นที่กรุงเทพฯ{k}"
            heart: 2
            reply: "พี่รู้จ้ะ วันแรกที่น้องมานั่งร้านพี่ น้องซดน้ำซุปแล้วนิ่ง พี่จำหน้านั้นได้ หน้าคนที่เพิ่งได้ยินใครถามว่ากินข้าวหรือยัง"
          - text: "พี่ไม่เสียดายเงินเหรอ{kq}"
            heart: 0
            reply: "เสียดายทุกต้นเดือนจ้ะ แล้วก็หายเสียดายตอนลุงเชิดมาสั่งเส้นใหญ่ตอนหกโมงเช้า"

  - id: noi_f_fear
    topic: self
    when: { heart_min: 7 }
    npc: "น้อง… พี่กลัวอย่างหนึ่ง ถ้าวันหนึ่งพี่ตั้งหม้อตีสี่แล้วไม่มีใครมานั่งเลย พี่จะทำยังไง พี่ไม่รู้จะเป็นอะไรนอกจากพี่หน่อย"
    options:
      - text: "{p}จะมานั่งเอง{k} ทุกวัน"
        heart: 2
        reply: "สัญญาไม่ได้หรอก คนเรามีวันต้องไป… แต่พี่รับคำพูดไว้นะ วางไว้ข้างหม้อ หยิบมาอุ่นได้ทุกเช้า"
      - text: "พี่สอนคนอื่นทำต่อได้นะ{kq}"
        heart: 2
        reply: "พี่เคยคิดจ้ะ ถ้าหม้อใบนี้มีคนตั้งต่อ พี่ก็ไม่ต้องกลัวว่าร้านจะเงียบ… ร้านเงียบได้ แต่น้ำซุปไม่ควรหายไป"
      - text: "ตำบลยังไม่ร้างขนาดนั้นหรอก{k}"
        heart: 0
        reply: "ยังจ้ะ แต่โรงเรียนเหลือนักเรียนห้องละแปดคน ปีก่อนสิบสอง พี่นับลูกค้าเหมือนนับก้อนน้ำแข็งในกระติก มันละลายช้าๆ"

  - id: noi_f_soup_secret
    topic: self
    when: { heart_min: 4 }
    npc: "สารภาพนะน้อง ลูกชิ้นพี่ครึ่งหนึ่งซื้อจากอำเภอ แต่ลูกค้าชมว่าลูกชิ้นทำเองอร่อย พี่ไม่กล้าบอกมาห้าปีแล้ว"
    options:
      - text: "ครึ่งไหนทำเอง{kq} {p}จะลองทาย"
        heart: 1
        reply: "ทายได้ พี่ให้ลูกชิ้นฟรีทั้งเดือน… ไม่มีใครทายถูกเลยสักคน แปลว่าพี่ทำเหมือนเขา หรือเขาทำเหมือนพี่ ไม่รู้จะดีใจหรือเสียใจ"
      - text: "น้ำซุปพี่ทำเองใช่ไหม{kq}"
        heart: 2
        reply: "ทุกหยดจ้ะ สาบานต่อหน้าหม้อแม่ อันนี้พี่ไม่เคยโกง เพราะน้ำซุปคือของจริงของร้าน ลูกชิ้นเป็นแค่เพื่อนร่วมชาม"

  # ===== others =====
  - id: noi_o_tam
    topic: others
    npc: "ตั้มมาซื้อก๋วยเตี๋ยวตอนบ่ายสามทุกวัน ก่อนเข้ากะ ห่อกลับไปกินตอนตีสอง… น้องว่าเส้นแช่น้ำซุปเจ็ดชั่วโมงมันยังเป็นก๋วยเตี๋ยวไหม"
    options:
      - text: "เป็นโจ๊กเส้นแล้ว{k}"
        heart: 1
        reply: "ใช่! พี่เลยแยกเส้นแยกน้ำให้เขาแล้ว เขาบอก ‘ขอบคุณครับ ผมรู้สึกเหมือนได้รับสวัสดิการ’ หน้าเขาไม่ยิ้ม แต่เขากินหมด"
      - text: "ตั้มไม่ค่อยพูดเลยนะ{kq}"
        heart: 1
        reply: "พูดน้อยแต่พูดแรง เมื่อวานบอกพี่ว่า ‘ปริญญาผมแลกได้ข้าวเวฟสองพันกล่อง’ พี่ได้ยินแล้วอยากต้มไข่ให้สิบฟอง"
        next:
          - text: "{p}จะแวะไปคุยกับตั้มบ้าง{k}"
            heart: 2
            reply: "ไปเถอะน้อง เอาก๋วยเตี๋ยวพี่ไปฝากด้วย บอกว่าพี่หน่อยสั่งให้กินตอนยังร้อน ไม่ใช่ตอนตีสอง"
          - text: "ปริญญาเขาจบอะไรมา{kq}"
            heart: 0
            reply: "พี่ถามแล้ว เขาตอบว่า ‘จบแล้วครับ’ แค่นั้น… พี่ไม่ถามต่อ บางเรื่องต้องเคี่ยวนานกว่าจะได้น้ำ"
      - text: "ทำไมพี่ห่วงตั้มจัง{kq}"
        heart: 1
        reply: "เพราะเขาเหมือนพี่ตอนอยู่โรงแรม ทำงานตอนที่คนอื่นหลับ ไม่มีใครถามว่ากินหรือยัง พี่เลยถามแทนทุกคน"

  - id: noi_o_thongbai
    topic: others
    npc: "ป้าทองใบมาร้านพี่เมื่อเช้า ชิมน้ำซุปแล้วบอก ‘จืด’ แล้วสั่งชามพิเศษ กินหมด ซดน้ำหมด แล้วบอก ‘จืดจริงๆ’ อีกที"
    options:
      - text: "สรุปป้าชอบหรือไม่ชอบ{kq}"
        heart: 1
        reply: "ชอบจ้ะ ถ้าป้าไม่ชอบป้าจะไม่บ่น ป้าจะเงียบ ป้าเงียบทีไรพี่กลัวกว่าโดนบ่นอีก"
      - text: "พี่ไม่โกรธป้าเหรอ{kq}"
        heart: 1
        reply: "โกรธได้ไง พี่ป่วยทีไรป้าคนแรกที่หอบข้าวต้มมา แล้วก็บอกว่าข้าวต้มป้า ‘ไม่จืด’ ถึงจะจืดจริงๆ พี่ก็กินหมด"
        next:
          - text: "เหมือนคู่แข่งที่เป็นเพื่อนเลย{k}"
            heart: 1
            reply: "เพื่อนที่ถือทัพพีคนละอันจ้ะ ไม่ตีกัน แต่ก็ไม่ยอมกัน"
          - text: "แล้วใครแกงเก่งกว่า{kq}"
            heart: 0
            reply: "ป้าแกงเก่งกว่า พี่ทำน้ำซุปเก่งกว่า… ห้ามไปบอกป้าครึ่งแรกนะ ป้าจะได้ใจ"

  - id: noi_o_kla
    topic: others
    when: { heart_min: 2 }
    npc: "กล้าน่ะ พี่ให้กินฟรีไม่ยอม ต้องจ่ายเป็นผักทุกครั้ง ตอนนี้พี่ติดหนี้ผักเขาไปสองกระสอบแล้ว ไม่รู้ใครเป็นหนี้ใคร"
    options:
      - text: "พี่กล้าดื้อจังนะ{kq}"
        heart: 1
        reply: "ดื้อแบบคนซื่อจ้ะ ดื้อแบบที่พี่ไม่อยากให้เขาเลิกดื้อ… แต่อยากให้กินข้าวตรงเวลาบ้าง เขาเป็นลมกลางแปลงมาสองรอบแล้ว"
      - text: "พี่ว่าพี่กล้าเป็นคนยังไง{kq}"
        heart: 1
        reply: "เป็นคนที่แบกอะไรไว้หนักกว่าที่บอกคนอื่นจ้ะ พี่ดูจากวิธีที่เขาซดน้ำซุป ซดเร็วเหมือนกลัวไม่มีเวลา"
      - text: "เขามีแฟนหรือยัง{kq}"
        heart: 1
        reply: "แฟนเขาคือกองปุ๋ยหมักจ้ะ ตั้งชื่อให้ทุกกอง… ถามทำไมล่ะน้อง พี่ไม่ถามต่อนะ แต่พี่ยิ้มได้ใช่ไหม"

  - id: noi_o_cherd
    topic: others
    npc: "ลุงเชิดกินร้านพี่สามสิบปี ตั้งแต่สมัยแม่พี่ ลุงบอกว่าถ้าวันไหนร้านพี่ปิด ลุงจะขับรถเมล์ไม่ออก ไม่มีแรงเหยียบคลัตช์"
    options:
      - text: "พี่เคยปิดร้านไหม{kq}"
        heart: 1
        reply: "ปิดวันเดียวตอนแม่เสีย วันนั้นรถเมล์ลุงออกช้าไปสิบนาที ครั้งเดียวในสามสิบปี คนทั้งตำบลยังพูดถึง"
      - text: "ลุงเชิดน่ารักจัง{k}"
        heart: 1
        reply: "น่ารักแต่ไม่เปลี่ยนเมนู… พี่แอบใส่ตับให้ลุงชิ้นหนึ่งทุกวันมาสิบปี ลุงคิดว่าเป็นของปกติในชาม ไม่เคยรู้ว่าคนอื่นไม่ได้"

  - id: noi_o_ann
    topic: others
    npc: "หมอแอนมากินร้านพี่ทุกวันพุธ สั่งไม่เค็ม ไม่หวาน ไม่ผงชูรส แล้วนั่งมองชามคนอื่นด้วยสายตาเป็นห่วง ลูกค้าพี่เลยเกร็งกันทั้งร้าน"
    options:
      - text: "ป้าแต๋วเกร็งไหม{kq}"
        heart: 1
        reply: "ป้าแต๋วเปลี่ยนวันมากินเป็นวันพฤหัสแล้วจ้ะ บอกว่าวันพุธดวงไม่ดี แต่ดวงที่ไม่ดีคือดวงความดัน"
      - text: "หมอแอนกินอร่อยไหม{kq}"
        heart: 1
        reply: "หมอบอกว่าอร่อย แต่ตอนหมอลุกไป พี่เห็นหมอแอบเติมพริกน้ำส้มไปหนึ่งช้อน หมอก็คนจ้ะ"

quests:
  - id: noi_q1
    npc: noi
    title: "ชิมก่อนแล้วค่อยเติม"
    desc: "พี่หน่อยปรับสูตรน้ำซุปลดเกลือ อยากได้ผักกรอบๆ กับลิ้นคนชิมที่ไม่ใช่ลิ้นตัวเอง"
    start: { heart_min: 1, day_min: 3 }
    offer:
      npc: "น้อง ว่างไหมจ๊ะ หมอแอนขอให้พี่ลดเกลือในน้ำซุป พี่จะตั้งหม้อใหม่ แต่ลิ้นพี่ชินเค็มมายี่สิบปีแล้ว เชื่อไม่ได้ ขอยืมลิ้นน้องหน่อย แล้วก็ผักบุ้งกรอบๆ สักหน่อยไว้ตัดรส"
      options:
        - text: "ยืมได้เลย{k} ลิ้น{p}ว่างทั้งวัน"
          accept: true
          heart: 1
          reply: "ฮ่าๆ ดีจ้ะ เอาผักบุ้งมาสักสี่กำนะ ผักบุ้งในแปลงน้องนั่นแหละ พี่อยากได้ผักที่รู้ว่าใครปลูก"
        - text: "{p}ไม่ค่อยรู้เรื่องรสชาติ แต่จะลองดู{k}"
          accept: true
          heart: 1
          reply: "ไม่ต้องรู้จ้ะ คนกินไม่ต้องรู้ คนกินแค่ต้องซื่อสัตย์ อร่อยบอกอร่อย จืดบอกจืด"
        - text: "ไว้ก่อนนะ{kq} ยุ่งอยู่"
          heart: 0
          reply: "ได้จ้ะ หม้อพี่ยังเคี่ยวรอได้ อีกสองสามวันพี่ยังลังเลอยู่ดี"
    steps:
      - goal: { type: give, npc: noi, item: morning_glory, n: 4 }
        hint: "เก็บผักบุ้ง 4 กำไปให้พี่หน่อยที่ร้านก๋วยเตี๋ยว"
        done:
          npc: "ได้แล้ว กรอบเสียงดังเลยน้อง… เอ้า ชิมน้ำซุปหม้อใหม่ก่อน ซดคำแรกแล้วอย่าคิด พูดเลย"
          options:
            - text: "เค็มน้อยลงแต่ยังหอมกระดูก{k}"
              heart: 2
              reply: "จริงนะ! พี่ใส่หัวไชเท้าเพิ่มสองหัวกับรากผักชีอีกกำ ให้หวานแทนเกลือ… พี่ลุ้นจนมือสั่น ทัพพีกระทบหม้อดังเป็นระฆัง"
            - text: "จืดไปนิด{k}พี่"
              heart: 1
              reply: "นิดเท่าไหร่… ไม่ต้องตอบ แม่พี่ก็ตอบว่านิดเท่าที่ขาด พี่จะเติมตังฉ่ายนิดเดียว ตังฉ่ายเค็มแต่หอม หมอแอนน่าจะยอม"
            - text: "อร่อยเหมือนเดิมเป๊ะ{k}"
              heart: 0
              reply: "เหมือนเดิมเป๊ะเลยเหรอ… น้องพูดให้พี่สบายใจหรือเปล่า ไม่เป็นไร พรุ่งนี้มีกรรมการตัวจริง ลุงเชิด"
      - goal: { type: visit, place: noi_noodle, from: "06:30", to: "08:00" }
        hint: "ไปร้านพี่หน่อยตอนเช้า ดูลุงเชิดกินน้ำซุปสูตรใหม่ก่อนออกรถ"
        done:
          npc: "น้องมาทันพอดี ดูๆ ลุงเชิดยกชามแล้ว… ซด… ซดอีก… วางชาม… ลุงไม่พูดอะไรเลยน้อง แล้วก็เดินไปขึ้นรถ"
          options:
            - text: "ไม่พูดแปลว่าดีนะ{kq} ลุงซดหมดชาม"
              heart: 1
              reply: "นั่นสิ! สามสิบปีลุงไม่เคยชม แต่ถ้าไม่อร่อยลุงจะเหลือน้ำครึ่งชาม วันนี้ชามแห้งเลย พี่จะเอาชามนี้ไปตั้งบนหิ้งเลยดีไหม"
            - text: "พี่ถามลุงตรงๆ ก็ได้นะ{kq}"
              heart: 0
              reply: "ถามแล้วลุงจะรู้ว่าพี่เปลี่ยนสูตร แล้วลุงจะคิดมากไปถึงอำเภอ คนแก่บางคนรักของเดิมเพราะมันไม่เคยทำให้ผิดหวัง"
            - text: "ป้าแต๋วมาแล้วนั่น{k} เตรียมรับมือ"
              heart: 1
              reply: "ตายแล้ว ป้าพกน้ำปลามาจริงด้วย… ไม่เป็นไร ทีละคนจ้ะน้อง ชนะลุงเชิดได้ก็ถือว่าชนะครึ่งตำบลแล้ว"
    reward: { money: 120, heart: 1, items: { kuay_tiew_ruea: 2 }, set_flag: noi_q1_done, line: { from: noi, text: "ร้านก๋วยเตี๋ยวพี่หน่อยเปลี่ยนน้ำซุปเป็นสูตรเกลือน้อยแล้วนะคะ หอมกระดูกเท่าเดิม 🍜 ขอบคุณหลานยายเพียรที่ช่วยชิม ป้าแต๋วไม่ต้องพกน้ำปลามาเองแล้วจ้ะ" } }

  - id: noi_q2
    npc: noi
    title: "ห้องครัวโรงเรียน"
    desc: "พี่หน่อยอยากสอนเด็กๆ ทำอาหาร แต่ตื่นเต้นจนพูดไม่รู้เรื่อง ช่วยเตรียมคาบแรกด้วยกัน"
    start: { flag: noi_q1_done, heart_min: 3, day_min: 6 }
    offer:
      npc: "น้อง… ครูเต้ยเคยชวนพี่ไปสอนทำอาหารเด็กๆ พี่ตอบว่าไว้ก่อนมาสองปีแล้ว ครั้งนี้พี่อยากตอบว่าได้ แต่พี่ไม่กล้าไปบอกเอง ไปเป็นเพื่อนพี่หน่อยได้ไหม"
      options:
        - text: "ไปด้วยกันเลย{k}"
          accept: true
          heart: 2
          reply: "ขอบใจจ้ะ… น้องไปคุยกับครูเต้ยก่อนนะ บอกว่าพี่หน่อยว่างบ่ายวันพฤหัส แต่อย่าบอกว่าพี่กลัว บอกว่าพี่ยุ่ง"
        - text: "พี่สอนลูกค้าทั้งร้านทุกวัน จะกลัวเด็กทำไม{kq}"
          accept: true
          heart: 1
          reply: "ลูกค้าเขาไม่ถามว่า ‘ทำไม’ ทุกสามวินาทีไงน้อง น้องมิวถามพี่ว่าทำไมไข่ต้องกลมสิบรอบแล้ว"
        - text: "{p}ไม่ถนัดเรื่องเด็ก{k}"
          heart: 0
          reply: "พี่ก็ไม่ถนัด… งั้นไว้พี่ลองรวบรวมความกล้าอีกสองปีก็ได้ ล้อเล่นจ้ะ ไว้น้องว่างค่อยมาบอกนะ"
    steps:
      - goal: { type: talk, npc: toey }
        hint: "ไปบอกครูเต้ยที่โรงเรียนว่าพี่หน่อยพร้อมมาสอนทำอาหาร"
        done:
          npc: "พี่หน่อยจะมาสอนจริงเหรอ! ตั้งใจฟังนะ… ครูดีใจจนให้สิบเต็มสิบเลย ครูขอเด็ก ป.4 ห้องเดียวก่อน แปดคน แล้วก็ขอเมนูที่ไม่ใช้มีด ครูกลัวน้องโอ๊ต"
          options:
            - text: "ไข่เจียวดีไหม{kq}ครู ไม่ต้องใช้มีด"
              heart: 1
              reply: "เก้าเต็มสิบจ้ะ หักหนึ่งเพราะน้ำมันร้อน… แต่ไม่เป็นไร ครูจะยืนถือฝาหม้อเป็นโล่ให้"
            - text: "พี่หน่อยตื่นเต้นมาก{k} ครูช่วยปลอบหน่อย"
              heart: 1
              reply: "ครูก็ตื่นเต้นจ้ะ สอนมาเจ็ดปีไม่เคยมีวิชาไหนที่เด็กอยากเข้าก่อนกริ่ง บอกพี่หน่อยว่าครูจะติดดาวให้ก่อนเลย"
      - goal: { type: give, npc: noi, item: egg_chicken, n: 10 }
        hint: "ซื้อไข่ไก่ 10 ฟองที่ร้านป้าแต๋ว เอาไปให้พี่หน่อยซ้อมสอน"
        done:
          npc: "ไข่สิบฟอง… พี่ซ้อมพูดกับไข่อยู่เมื่อคืน ‘เด็กๆ จ๊ะ ตีไข่ให้ขึ้นฟอง’ แล้วพี่ก็พูดเร็วจนไข่ฟังไม่ทัน… น้องฟังพี่ซ้อมหน่อย"
          options:
            - text: "พูดช้าลงหน่อย{k} แล้วให้เด็กได้ลองเอง"
              heart: 2
              reply: "จริงด้วย… พี่ชอบทำให้ดูจนเสร็จ ไม่ปล่อยให้ใครจับกระทะ เหมือนตอนอยู่โรงแรม เชฟไม่ให้พี่จับเลยสามเดือน พี่ไม่อยากเป็นแบบนั้น"
            - text: "พี่ทอดให้ดูสักฟองก่อน{k} {p}อยากกิน"
              heart: 1
              reply: "นั่นไง น้องมาซ้อมเป็นเด็กเองเลย ได้จ้ะ ฟองนี้ฟู ฟองหน้าน้องทอดเอง"
      - goal: { type: visit, place: school, from: "14:00", to: "15:30" }
        hint: "ไปโรงเรียนช่วงบ่าย ช่วยพี่หน่อยสอนคาบแรก"
        done:
          npc: "จบแล้วน้อง! ไข่ไหม้สามฟอง ฟูสี่ฟอง น้องโอ๊ตทำหล่นหนึ่งฟองแล้วร้องไห้ น้องมิวถามว่าทำไมไข่ไหม้ถึงหอมกว่า… พี่ตอบไม่ได้ พี่ต้องกลับไปคิด"
          options:
            - text: "{p}เห็นน้องโอ๊ตยิ้มตอนท้ายนะ{kq} ตอนได้กินไข่ของมิว"
              heart: 2
              set_flag: noi_q2_oat
              reply: "เห็นเหมือนกันจ้ะ สองคนนั้นเถียงกันทั้งคาบ แต่แบ่งไข่กันกิน… พี่ว่าวันนี้สอนได้เรื่องเดียว คือแบ่งกันกิน ก็พอแล้ว"
            - text: "ไข่ไหม้ฟองนั้น{p}ขอกินเอง{k}"
              heart: 1
              reply: "กินไหม้ทำไมน้อง… เอ้า ก็ได้ ไหม้แค่ข้างเดียว อีกข้างนิ่มดี คนทำไหม้ต้องมีคนกินให้ เขาจะได้กล้าทำอีก"
            - text: "พี่สอนเก่งกว่าที่คิดนะ{kq}"
              heart: 1
              reply: "จริงเหรอ… พี่พูดเร็วไปแค่สามรอบเอง ครูเต้ยให้แปดเต็มสิบ หักสองเพราะพี่แอบทอดแทนเด็กสองฟอง"
    sold_at: { egg_chicken: taew_shop }
    reward: { money: 0, heart: 2, items: { khai_jiao: 2 }, set_flag: noi_q2_done, line: { from: toey, text: "ขอบคุณพี่หน่อยที่มาสอน ป.4 ทำไข่เจียวนะคะ ⭐ ครูให้แปดเต็มสิบ ไข่ไหม้ไปสามฟองถือเป็นบทเรียนค่ะ เด็กๆ ถามว่าคาบหน้าเมื่อไหร่ ทุกคนเลย" } }

  - id: noi_q3
    npc: noi
    title: "ถ้วยน้ำซุปตีสี่"
    desc: "ทุกเช้ามืดพี่หน่อยวางน้ำซุปไว้หนึ่งถ้วยหน้าร้าน ถ้วยว่างทุกวันมาสิบปี ไม่รู้ว่าใคร"
    start: { flag: noi_q2_done, heart_min: 5, day_min: 9 }
    offer:
      npc: "น้อง พี่จะเล่าอะไรให้ฟัง อย่าหัวเราะนะ… ตีสี่ทุกวันพี่ตักน้ำซุปวางไว้ถ้วยนึงบนโต๊ะหน้าร้าน แม่พี่ทำมาก่อน พี่ก็ทำต่อ เช้ามาถ้วยว่างทุกวัน สิบปีแล้วพี่ไม่เคยรู้ว่าใคร พี่ไม่กล้าดู กลัวเขาไม่มาอีก"
      options:
        - text: "{p}จะแอบดูให้{k} เงียบๆ ไม่ให้เขารู้ตัว"
          accept: true
          heart: 2
          reply: "เงียบๆ นะน้อง… ถ้าเป็นคน อย่าทักเขา ถ้าไม่ใช่คน… ก็อย่าทักเหมือนกัน แล้วรีบกลับมาบอกพี่"
        - text: "ไม่กลัวเป็นผีเหรอ{kq}"
          accept: true
          heart: 1
          reply: "ถ้าเป็นผี ผีตนนี้ก็ล้างถ้วยคืนนะน้อง พี่ไม่เคยต้องล้างถ้วยนั้นเลย ผีอะไรจะมีมารยาทขนาดนั้น"
        - text: "บางเรื่องไม่รู้ก็ดีแล้ว{k}"
          heart: 0
          reply: "นั่นสิ… พี่ก็คิดแบบนั้นมาสิบปี แต่ช่วงนี้พี่อยากรู้ขึ้นมา คนแก่ในตำบลหายไปทีละคน พี่กลัวถ้วยจะเริ่มเต็มแล้วพี่ไม่รู้จะไปถามใคร"
    steps:
      - goal: { type: visit, place: noi_noodle, from: "06:00", to: "06:40" }
        hint: "ไปแอบดูโต๊ะหน้าร้านพี่หน่อยตอนหกโมงเช้า ก่อนร้านเปิด"
        done:
          npc: "น้อง! มาแต่มืดเลย พี่เห็นน้องยืนหลังเสา… ถ้วยว่างแล้ว ล้างวางคว่ำไว้เหมือนทุกวัน เห็นใครไหม บอกพี่มา"
          options:
            - text: "{p}เห็นแต่หลังคนแก่จูงควายเดินผ่านไป{k}"
              heart: 1
              reply: "คนแก่จูงควาย… ตำบลนี้มีคนเดียว พี่ไม่พูดชื่อนะ ให้น้องไปถามเองดีกว่า พี่ถามเองพี่ร้องไห้ก่อนแน่"
            - text: "ควายตัวหนึ่งเดินผ่าน{k} หรือควายกิน{kq}"
              heart: 1
              reply: "ควายล้างถ้วยไม่เป็นจ้ะน้อง… แต่ถ้ามีควาย ก็ต้องมีคนจูง ไปตามควายไปน้อง"
      - goal: { type: talk, npc: phueak }
        hint: "ไปหาตาเผือกที่ทุ่งเลี้ยงควาย ถามเรื่องถ้วยน้ำซุป"
        done:
          npc: "…ถ้วยน้ำซุปเหรอ ข้าเอง เมียข้าชอบน้ำซุปแม่หน่อย ตอนเมียข้าตาย แม่หน่อยเริ่มวางถ้วยไว้ ข้าก็กิน ล้าง วางคืน แม่หน่อยตาย ลูกมันวางต่อ ข้าก็กินต่อ… ข้าไม่เคยขอบใจ ข้าพูดไม่เป็นวะหลาน"
          options:
            - text: "ตาไปขอบคุณพี่หน่อยเองสิ{kq}"
              heart: 1
              reply: "…ข้าทักใครไม่เป็นมาสิบปีแล้ว ไปยืนหน้าร้านมัน มันจะยื่นเมนูให้ข้า ข้าจะยิ่งพูดไม่ออก… เอ็งบอกแทนก็แล้วกัน ถ้าจะบอก"
            - text: "น้ำซุปอร่อยไหม{kq}ตา"
              heart: 1
              reply: "เค็มไปนิดแต่ก่อน ตอนนี้พอดี… บอกมันว่าเดือนนี้พอดีแล้ว ตากินมาสิบปี ตารู้"
      - goal: { type: talk, npc: noi }
        hint: "กลับไปบอกพี่หน่อย หรือจะเก็บไว้ก็ได้"
        done:
          npc: "น้องไปเจอใครมาจ๊ะ… หน้าน้องมีเรื่องจะบอก แต่ปากยังไม่ยอม พี่ไม่บังคับนะ"
          options:
            - text: "ตาเผือก{k} ตาบอกว่าเดือนนี้น้ำซุปพอดีแล้ว"
              heart: 2
              set_flag: noi_cup_told
              reply: "ตาเผือก… ตอนยายสายเมียตาเสีย ตาไม่พูดกับใครเลย แม่พี่บอกว่า ‘คนไม่พูดก็ยังต้องกิน’ …พี่เข้าใจแล้วจ้ะน้อง พรุ่งนี้พี่จะใส่ไข่ลวกให้ตาฟองนึง แล้วยังจะไม่ทักเหมือนเดิม ให้ตาสบายใจ"
            - text: "คนที่กินเขาอยากให้พี่วางต่อไป{k} แค่นั้นพอ"
              heart: 2
              set_flag: noi_cup_secret
              reply: "แค่นั้นพอจริงๆ จ้ะ… น้องเก็บความลับให้เขาใช่ไหม พี่รู้ พี่ไม่ถาม ถ้วยนั้นพี่จะวางต่อไปจนกว่าพี่จะยกหม้อไม่ไหว"
    reward: { money: 0, heart: 2, items: { tom_jued: 1 }, set_flag: noi_q3_done }

  - id: noi_q4
    npc: noi
    title: "สมุดสูตรของแม่"
    desc: "บ่อหลังร้านแห้ง บริษัทยื่นข้อเสนอให้พี่หน่อยทำครัวให้คนงาน พี่หน่อยต้องเลือกว่าหม้อใบนี้จะไปทางไหน"
    start: { flag: noi_q3_done, heart_min: 7, day_min: 15 }
    offer:
      npc: "น้อง… คุณธนามาหาพี่ เสนอให้พี่ส่งข้าวกล่องให้คนงานบริษัทวันละร้อยกล่อง เงินเดือนละหลายหมื่น น้ำขวดส่งฟรีทุกเช้า… บ่อหลังร้านพี่ก็แห้งแล้ว พี่คิดไม่ตกจริงๆ ช่วยพี่คิดหน่อย"
      options:
        - text: "{p}จะช่วยพี่คิด{k} ไม่ว่าพี่เลือกทางไหน"
          accept: true
          heart: 2
          reply: "ขอบใจจ้ะ… น้องลองไปฟังคุณธนาพูดเองก่อนนะ พี่ฟังแล้วจำได้แต่คำภาษาอังกฤษ ไม่รู้ว่าเขาเสนออะไรกันแน่"
        - text: "เงินเยอะขนาดนั้นรับไปเลยสิ{kq}"
          accept: true
          heart: 0
          reply: "พี่ก็คิดอย่างนั้นวันละสามรอบ แล้วก็เปลี่ยนใจวันละสามรอบ… ไปฟังเขาก่อนเถอะน้อง แล้วค่อยบอกพี่"
        - text: "เรื่องนี้พี่ต้องตัดสินใจเองนะ{kq}"
          heart: 0
          reply: "จ้ะ… พี่รู้ พี่แค่ไม่อยากตัดสินใจคนเดียว คนตัดสินใจคนเดียวมักลืมกินข้าว"
    steps:
      - goal: { type: talk, npc: thana }
        hint: "ไปฟังคุณธนาที่สำนักงานบริษัท ว่าข้อเสนอให้พี่หน่อยเป็นยังไง"
        done:
          npc: "คุณ{player}ครับ เรามองร้านพี่หน่อยเป็น local partner ที่สำคัญมากครับ เราอยากสร้าง win-win ให้ชุมชนมีรายได้ คนงานได้อาหารบ้านๆ เรามีน้ำให้ฟรีด้วย… น้ำของเราเองครับ ผมหมายถึงน้ำที่บริษัทบริหาร"
          options:
            - text: "น้ำที่บริษัทบริหารมาจากบ่อใต้ร้านพี่หน่อยหรือเปล่า{kq}"
              heart: 0
              reply: "เป็นคำถามที่ดีมากครับ ผมขอรับไว้เป็น feedback… ผมเองก็กินก๋วยเตี๋ยวพี่หน่อยทุกวันพุธนะครับ แม่ผมก็ทำน้ำซุปแบบนี้ ผมไม่ได้อยากให้ร้านปิดจริงๆ"
            - text: "ถ้าพี่หน่อยไม่รับ จะเป็นยังไง{kq}"
              heart: 0
              reply: "ไม่มีอะไรครับ เราก็จะหา partner อื่น… อาจเป็นแฟรนไชส์จากในเมือง ผมพูดตรงที่สุดเท่าที่ตำแหน่งผมพูดได้แล้วครับ"
      - goal: { type: give, npc: noi, item: tamarind, n: 3 }
        hint: "เอามะขาม 3 ฝักไปให้พี่หน่อย พี่จะทำแกงส้มตามสมุดสูตรของแม่"
        done:
          npc: "มะขามจากต้นหลังบ้านยายน้อง… พี่จะเปิดสมุดแม่ให้ดูนะ หน้าแรกแม่ไม่ได้เขียนสูตร แม่เขียนว่า ‘ขาดอีกนิด คือนิดที่คนกินต้องการ ไม่ใช่นิดที่เราอยากใส่’ …พี่อ่านมาสิบห้าปี เพิ่งเข้าใจวันนี้เอง"
          options:
            - text: "แม่พี่เขียนเหมือนพูดเลย{k}"
              heart: 2
              reply: "ใช่ ลายมือเบี้ยวๆ เปื้อนน้ำมันหมู ทุกหน้ามีรอยนิ้วแม่ พี่ไม่กล้าล้าง… น้องชิมแกงส้มก่อน แล้วบอกพี่ว่าขาดอีกนิดไหม"
            - text: "แล้วพี่ต้องการอะไรจริงๆ{kq}"
              heart: 2
              reply: "พี่ต้องการให้คนมานั่งร้านพี่ไปอีกนานๆ จ้ะ… ส่วนจะนั่งยังไง ใครจ่ายค่าน้ำ พี่ยังตอบไม่ได้"
      - goal: { type: visit, place: noi_noodle, from: "13:00", to: "15:00" }
        hint: "ไปหาพี่หน่อยตอนร้านว่างช่วงบ่าย ช่วยพี่ตัดสินใจ"
        done:
          npc: "ร้านว่างแล้ว นั่งตรงนี้น้อง ตรงที่ยายน้องชอบนั่ง… พี่เขียนสามทางไว้บนกระดาษห่อลูกชิ้น น้องเลือกให้พี่ทีเถอะ พี่จะไม่เปลี่ยนใจอีกแล้ว"
          options:
            - text: "อยู่เป็นร้านพี่หน่อยต่อ{k} ซื้อโอ่งรองน้ำฝน ไม่ต้องพึ่งใคร"
              heart: 2
              set_flag: noi_end_shop
              reply: "ร้านพี่หน่อยต่อ… ได้จ้ะ ฝนตกปีละหกเดือน พี่รองให้เต็มทุกโอ่ง หน้าแล้งค่อยลดหม้อลง ร้านเล็กลงได้ แต่ร้านไม่ต้องขายตัว"
            - text: "รับงานบริษัทไปก่อน{k} ร้านจะได้อยู่รอด แล้วค่อยว่ากัน"
              heart: 1
              set_flag: noi_end_company
              reply: "รับไปก่อน… พี่ก็เป็นคนธรรมดาที่กลัวร้านปิดจ้ะน้อง คนงานก็ต้องกินข้าวเหมือนกัน พี่จะทำข้าวกล่องให้อร่อยที่สุด ให้เขาคิดถึงบ้านทุกคำ อย่างน้อยพี่ก็เลือกได้ว่าจะใส่อะไรในกล่อง"
            - text: "เปิดสมุดแม่สอนทั้งตำบล{k} ให้น้ำซุปไม่หายไปไหน"
              heart: 2
              set_flag: noi_end_class
              reply: "สอนทั้งตำบล… แม่พี่บอกว่าอาหารไม่มีเจ้าของ มีแต่คนกิน ถ้ามีคนทำน้ำซุปนี้เป็นสิบคน บริษัทจะซื้อสูตรไปก็ไม่มีความหมาย พี่จะเปิดห้องเรียนเสาร์อาทิตย์ที่ศาลาวัด น้องต้องมาเป็นนักเรียนคนแรกนะ"
    reward: { money: 300, heart: 2, items: { kaeng_som: 2 }, set_flag: noi_q4_done, line: { from: noi, text: "ร้านก๋วยเตี๋ยวพี่หน่อยยังเปิดทุกวันนะคะ 07–15 น. ขอบคุณทุกคนที่มานั่ง ขอบคุณคนที่ช่วยพี่คิด และขอบคุณลูกค้าตอนตีสี่ที่ล้างถ้วยคืนทุกวันด้วยจ้ะ 🍜" } }
