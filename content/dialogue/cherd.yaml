# ลุงเชิด — convos + quests (ตัวรอง)
convos:
  # ===== react =====
  - id: cherd_r_meet
    topic: react
    once: true
    when: { not_flag: met_cherd }
    npc: "อ้าว หลานที่ลุงไปส่งหน้าทางลูกรังวันนั้นนี่ ยังจำลุงได้ไหม วันนั้นหลานหลับตั้งแต่ท่ารถอำเภอ ตื่นมาก็ถึงพอดี ลุงไม่กล้าปลุก หน้าเหนื่อยเหมือนคนไม่ได้นอนมาสามปี"
    set_flag: met_cherd
    options:
      - text: "จำได้{k}ลุง ขอบคุณที่ไปส่งนะ{kq}"
        heart: 1
        reply: "ไม่ต้องขอบคุณ ลุงจอดหน้าทางลูกรังให้ทุกคนที่ลงตรงนั้นแหละ แต่วันนั้นลุงจอดนานกว่าปกติสองนาที รอดูว่าหลานเดินถึงบ้านยายหรือเปล่า"
        next:
          - text: "ลุงห่วง{p}เหรอ{kq}"
            heart: 1
            reply: "ยายเพียรนั่งรถลุงไปอำเภอทุกเดือน นั่งข้างคนขับ เล่าเรื่องหลานทุกเที่ยว ลุงรู้จักหลานก่อนเจอตัวจริงนะ"
          - text: "{p}หลับจริงๆ เหรอ{kq}"
            heart: 0
            reply: "หลับกรนด้วย ผู้โดยสารอีกสามคนหันมาดู ลุงบอกว่าคนนี้มาจากกรุงเทพฯ เขาพยักหน้าเข้าใจกันทั้งคัน"
      - text: "ลุงคือคนขับเจ้าเขียวใช่ไหม{kq}"
        heart: 1
        reply: "ใช่จ้ะ ลุงเชิด กับเจ้าเขียว คันเดียวของตำบล ออกหกโมง เก้าโมง เที่ยง บ่ายสาม หกโมงเย็น ตรงเป๊ะ ไม่รอใครนะ"
      - text: "จำไม่ได้{k}"
        heart: 0
        reply: "ไม่เป็นไร ลุงจำได้ ลุงจดชื่อหลานลงสมุดคนขึ้นรถครั้งแรกแล้ว เล่มที่เจ็ด หน้าสี่สิบสอง"

  - id: cherd_r_town_intro
    topic: react
    once: true
    when: { flag: story_town_intro }
    npc: "ผู้ใหญ่ประกาศชื่อหลานทางหอกระจายข่าวสามรอบ ลุงได้ยินบนรถ ผู้โดยสารทั้งคันหันมาถามลุงว่า ‘หลานยายเพียรคือใคร’ ลุงตอบสามรอบเหมือนกัน"
    options:
      - text: "ลุงตอบว่าไง{kq}"
        heart: 1
        reply: "ลุงบอกว่า ‘คนที่หลับกรนบนรถลุงวันพุธ’ คนบนรถหัวเราะ ป้าทองใบบอกว่าเดี๋ยวจะทำแกงไปให้ ลุงว่าหลานได้แกงแน่"
      - text: "อายจัง{k}"
        heart: 1
        reply: "ไม่ต้องอาย ในตำบลนี้ถ้าผู้ใหญ่ประกาศชื่อเรา แปลว่าเราเป็นคนของที่นี่แล้ว ลุงโดนประกาศชื่อครั้งแรกตอนเจ้าเขียวยางแตกกลางทาง ยังภูมิใจอยู่"

  - id: cherd_r_result_road
    topic: react
    once: true
    when: { flag: meeting1_result_road }
    npc: "ถนนลาดยางใหม่ได้แล้วนะหลาน ลาดจากหน้าอบต. ไปถึงหน้าลานเสี่ยเฮงพอดี เส้นที่เจ้าเขียววิ่งไปอำเภอยังเป็นลูกรังเหมือนเดิม หลุมเท่าเดิม ลุงนับได้สี่สิบเจ็ดหลุม"
    options:
      - text: "ลุงนับหลุมด้วยเหรอ{kq}"
        heart: 1
        reply: "นับมาสิบปี ลุงตั้งชื่อด้วย หลุมใหญ่หน้าวัดชื่อ ‘งบปีที่แล้ว’ หลุมโค้งหน้าโรงเรียนชื่อ ‘งบปีนี้’ ปีหน้าคงมีหลุมใหม่ชื่อ ‘ศึกษาความเป็นไปได้’"
        next:
          - text: "ลุงไปร้องเรียนสิ{kq}"
            heart: 1
            reply: "ร้องแล้วสามรอบ อบต.บอกว่ารับทราบ ลุงเลยขับช้าลงให้ผู้โดยสารไม่หัวโขกเพดาน เป็นการแก้ปัญหาที่ได้ผลเร็วกว่า"
          - text: "เจ้าเขียวจะพังไหม{kq}"
            heart: 1
            reply: "เจ้าเขียวทนกว่าถนน ถนนลาดยางสามปีพัง เจ้าเขียววิ่งมาสามสิบปีบนลูกรัง ถ้าจะมีอะไรพังก่อน คงเป็นหลังลุง"
      - text: "ถนนใหม่ก็ดีกับลุงนะ{kq}"
        heart: 0
        reply: "ดีครึ่งกิโล ลุงขับครึ่งกิโลนั้นช้าๆ ให้มันคุ้ม ผู้โดยสารบอกว่านุ่มเหมือนนั่งรถทัวร์ ห้าสิบวินาทีแห่งความหรูหรา แล้วก็กลับไปหลุมงบปีที่แล้ว"

  - id: cherd_r_well_dry
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "บ่อบ้านลุงแห้งแล้วหลาน ลุงต้องหาบน้ำจากวัดมาล้างเจ้าเขียว เช้านี้ล้างได้แค่ครึ่งคัน ข้างซ้ายสะอาด ข้างขวายังน้ำตาล ผู้โดยสารขึ้นทางซ้ายเลยไม่รู้"
    options:
      - text: "ลุงไม่ต้องล้างทุกวันก็ได้{k}"
        heart: 1
        reply: "ลุงล้างทุกวันมาสามสิบปีจ้ะ เจ้าเขียวไม่เคยออกไปข้างนอกตัวสกปรก มันเป็นหน้าเป็นตาของตำบล ไปถึงท่ารถอำเภอคนเขาจะได้รู้ว่าดงเย็นยังดูแลกันอยู่"
        next:
          - text: "{p}จะเอาน้ำบ่อยายมาช่วยล้าง{k}"
            heart: 2
            reply: "จริงเหรอหลาน… บ่อยายเพียรลึกที่สุดในตำบล ยายรู้ก่อนใครว่าวันนี้จะมาถึง ลุงขอแค่สองถัง พอล้างข้างขวา"
          - text: "บริษัทต้องรับผิดชอบนะลุง{k}"
            heart: 1
            reply: "รถบรรทุกน้ำบริษัทวิ่งสวนลุงทุกเช้ามืด ถังน้ำเต็มคัน ลุงมองแล้วนึกว่าน้ำบ่อลุงคงนั่งอยู่ในนั้นสักลิตร"
      - text: "รถบรรทุกบริษัทวิ่งเยอะขึ้นไหม{kq}"
        heart: 1
        reply: "วิ่งทั้งคืน ลุงนับเสียงเครื่องตอนนอน คืนละสิบสองเที่ยว มากกว่าเจ้าเขียววิ่งทั้งวันอีก ถนนลูกรังพังเพราะเขา แต่คนด่าลุงเพราะรถลุงเด้ง"

  - id: cherd_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "เมื่อเช้าคนงานบริษัทสามคนขึ้นรถลุงเที่ยวหกโมง ถือกระเป๋าใบใหญ่ บอกว่าไม่กลับแล้ว เจอผีที่ไซต์ ขึ้นเที่ยวเดียวไม่กลับ ลุงเก็บค่ารถสามสิบเท่าเดิมนะ ไม่ได้ขึ้นราคาเพราะเขากลัว"
    options:
      - text: "เขาเล่าว่าเจออะไร{kq}"
        heart: 1
        reply: "ผู้หญิงนุ่งผ้าซิ่นยืนลูบท่อบาดาล ไม่พูดอะไร แค่ร้องไห้ คนหนึ่งบอกว่าเหมือนแม่ตัวเองตอนบ่อบ้านแห้ง ทั้งคันเงียบไปจนถึงอำเภอ"
        next:
          - text: "น่าสงสารทั้งผีทั้งคน{k}"
            heart: 2
            reply: "ใช่จ้ะ คนงานก็ลูกหลานใครสักคน มาทำงานเพราะต้องการเงิน ผีก็คงเป็นแม่ใครสักคน ลุงขับรถพาคนหนีมาสามสิบปี ไม่เคยเห็นใครหนีจากความผิดของคนอื่นแบบนี้"
          - text: "ลุงกลัวไหม{kq}"
            heart: 0
            reply: "ลุงไม่ขับหลังสามทุ่ม ผีไม่ขึ้นรถเมล์กลางวัน เราแบ่งเวลากันชัดเจน"
      - text: "ลุงได้ผู้โดยสารเพิ่มสามคน{k}"
        heart: 0
        reply: "เพิ่มขาไป ขากลับไม่มี เที่ยวเดียวแบบนี้ลุงเห็นบ่อยขึ้นทุกปี ไม่ได้เพราะผีหรอก ส่วนใหญ่เพราะงาน"

  - id: cherd_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ช่วงหาเสียงแล้ว มีคนมาขอติดป้ายผู้สมัครข้างเจ้าเขียว ให้เดือนละสองพัน ลุงไม่รับ เจ้าเขียวไม่เลือกข้าง มันพาทุกคนไปอำเภอเท่ากัน"
    options:
      - text: "สองพันก็เยอะนะ{kq}ลุง"
        heart: 0
        reply: "เยอะ ค่าน้ำมันสามวัน แต่ถ้าติดป้าย คนฝ่ายตรงข้ามจะไม่ขึ้นรถลุง หรือขึ้นแล้วนั่งหน้าบึ้ง ลุงไม่อยากขับรถที่คนนั่งหน้าบึ้งเพราะลุง"
      - text: "ลุงซื่อสัตย์มาก{k}"
        heart: 1
        reply: "ไม่ใช่ซื่อสัตย์หรอกหลาน ลุงแค่จำได้ว่าเลือกตั้งที่แล้ว ทั้งสองฝ่ายสัญญาว่าจะลาดยางถนนไปอำเภอ ลุงยังขับบนลูกรังอยู่ ป้ายไหนลุงก็ไม่เชื่อ"
        next:
          - text: "วันเลือกตั้งลุงทำอะไร{kq}"
            heart: 1
            reply: "รับคนแก่ไปหน่วยเลือกตั้งฟรีทุกเที่ยว ไม่ถามว่าเลือกใคร ลุงถามแค่ว่ากินข้าวหรือยัง"
          - text: "ลุงจะเลือกใคร{kq}"
            heart: 0
            reply: "ลุงเลือกคนที่นั่งรถลุงไปอำเภอสักครั้งโดยไม่มีกล้องตาม จนตอนนี้ยังไม่มีใครผ่านเกณฑ์"

  - id: cherd_r_fainted
    topic: react
    when: { fainted_recent: true }
    npc: "เช้านี้ลุงขับผ่าน รพ.สต. เห็นไฟเปิดทั้งคืน หมอแอนยืนหาวหน้าประตู ลุงเดาว่ามีคนโดนผีจับ… หลานใช่ไหม หน้าซีดเหมือนกระดาษตั๋วรถ"
    options:
      - text: "ใช่{k}ลุง กลับบ้านไม่ทัน"
        heart: 1
        reply: "คราวหน้าถ้ากลับไม่ทันจริงๆ เข้าร้านตั้มไว้ ไฟเปิด ตั้มตื่น ลุงไว้ใจไฟร้านตั้มกับไฟหน้าเจ้าเขียว สองดวงนี้ผีไม่กล้าเข้าใกล้"
      - text: "ไม่ใช่{k} {p}แค่นอนน้อย"
        heart: 0
        reply: "นอนน้อยแล้วไปนอนต่อที่ รพ.สต. ใช่ไหม… ไม่เป็นไร ลุงไม่เล่าบนรถ สัญญา ลุงเล่าแค่ว่ามีคน ไม่บอกว่าใคร"

  - id: cherd_r_end_saved
    topic: react
    once: true
    when: { flag: cherd_end_saved }
    npc: "เจ้าเขียววิ่งต่อแล้วหลาน เหลือวันละสามเที่ยว หกโมง เที่ยง หกโมงเย็น เที่ยวเก้าโมงกับบ่ายสามโดนตัด คนแก่บ่นว่ารอนาน ลุงบอกว่ารอนานดีกว่าไม่มีให้รอ"
    options:
      - text: "ลุงโอเคไหม{kq}"
        heart: 2
        reply: "ลุงโอเค ช่วงที่ไม่มีเที่ยว ลุงนั่งในรถที่ป้าย เปิดเพลง ให้คนแก่มานั่งรอในรถเย็นๆ เจ้าเขียวกลายเป็นศาลาที่มีล้อ ลุงชอบ"
      - text: "รถตู้ยังมาวิ่งแข่งไหม{kq}"
        heart: 1
        reply: "มาสองอาทิตย์แล้วเลิก คนขึ้นน้อย รถตู้ไม่รอคนแก่ถือของ ไม่จอดหน้าบ้านคนป่วย สุดท้ายคนก็กลับมารอเจ้าเขียว ลุงไม่ได้ดีใจนะ… ดีใจนิดนึง"

  # ===== news =====
  - id: cherd_n_survey
    topic: news
    npc: "ขนส่งจังหวัดส่งคนมาสำรวจผู้โดยสารบนรถลุงเมื่อวาน นั่งนับคนเที่ยวบ่ายสามเที่ยวเดียว ได้สองคน แล้วจดว่า ‘เส้นทางนี้ผู้โดยสารน้อย’ ทำไมไม่มาเที่ยวหกโมงเช้า เต็มคัน"
    options:
      - text: "เขาจะตัดสายลุงเหรอ{kq}"
        heart: 1
        reply: "ลุงไม่รู้จ้ะ เขาบอกว่าแค่สำรวจ แต่ลุงขับมาสามสิบปี ทุกครั้งที่มีคนมาสำรวจ ตามมาด้วยการเปลี่ยนแปลงที่ไม่มีใครถาม"
        next:
          - text: "ลุงบอกเขาเรื่องเที่ยวเช้าสิ{k}"
            heart: 1
            reply: "บอกแล้ว เขาบอกว่าแบบฟอร์มมีช่องเดียว ช่องเที่ยวบ่ายสาม ลุงถามว่าใครออกแบบฟอร์ม เขาบอกว่าส่วนกลาง ส่วนกลางคงไม่เคยนั่งรถเมล์บ่ายสาม"
          - text: "ลุงเครียดไหม{kq}"
            heart: 1
            reply: "เครียดแบบคนขับรถ คือขับต่อไป พรุ่งนี้หกโมงลุงก็ต้องออก ความเครียดไม่ทำให้รถออกช้าได้"
      - text: "บ่ายสามคนน้อยจริงนะ{kq}"
        heart: 0
        reply: "น้อย แต่สองคนนั้นคือยายจันทร์ไปหาหมอตา กับเด็กนักเรียนกลับจากโรงเรียนอำเภอ น้อยแต่ไม่มีรถเที่ยวอื่นให้เขาขึ้น"

  - id: cherd_n_van
    topic: news
    npc: "มีรถตู้สีขาวมาจอดที่ป้ายลุงเมื่อเช้า ติดสติกเกอร์ ‘รุ่งเรืองทรานสปอร์ต ทดลองวิ่ง’ คนขับบอกว่าจะวิ่งสายตำบล-อำเภอ ค่าโดยสารสี่สิบห้า แอร์เย็น"
    options:
      - text: "ใครเป็นเจ้าของ{kq}"
        heart: 1
        reply: "ลุงไม่รู้หรอก แต่ป้าแต๋วรู้ภายในห้านาที ป้าบอกว่าเป็นบริษัทของน้องเขยหลานภรรยาท่านนายก ลุงต้องวาดแผนผังถึงจะเข้าใจว่าใครเป็นใคร"
        next:
          - text: "แบบนี้ไม่ยุติธรรม{k}"
            heart: 1
            reply: "ลุงไม่รู้ว่ายุติธรรมไหม ลุงรู้แค่ว่ารถตู้ไม่มีที่วางกระสอบข้าว ไม่มีที่ให้ไก่นั่ง ยายๆ ไปตลาดอำเภอเอาไก่ไปขาย จะให้ไก่นั่งตักเหรอ"
          - text: "แอร์เย็นก็ดีนะ{kq}"
            heart: 0
            reply: "ดีจ้ะ เจ้าเขียวแอร์คือหน้าต่าง แต่หน้าต่างเปิดได้ทุกบาน คนเมารถชอบ รถตู้เปิดหน้าต่างไม่ได้ เหมือนนั่งในกล่องเย็นๆ ที่ไม่มีใครรู้จักใคร"
      - text: "สี่สิบห้าแพงกว่าลุงนะ{k}"
        heart: 1
        reply: "แพงกว่าสิบห้าบาท คนแก่สิบห้าบาทคือไข่สามฟอง เดือนนึงไปหาหมอสี่รอบ ไข่สิบสองฟอง ลุงคิดเป็นไข่หมด ลุงอยู่กับคนแก่มานาน"

  - id: cherd_n_diesel
    topic: news
    npc: "ดีเซลขึ้นอีกลิตรละบาท ลุงยังเก็บค่ารถสามสิบเท่าเดิม สิบปีแล้วไม่เคยขึ้น เมียลุงสมัยยังอยู่บอกว่าลุงทำบุญด้วยน้ำมันทุกวัน"
    options:
      - text: "ลุงขาดทุนไหม{kq}"
        heart: 1
        reply: "เดือนไหนคนเยอะก็พอ เดือนไหนคนน้อยลุงเอาเงินบำนาญคนแก่มาเติม ลุงอายุหกสิบสอง ได้เบี้ยยังชีพเดือนละเจ็ดร้อย ใส่น้ำมันเจ้าเขียวได้สองวัน"
        next:
          - text: "ขึ้นค่ารถเถอะ{k}ลุง"
            heart: 1
            reply: "ขึ้นห้าบาท ยายจันทร์ต้องเลือกระหว่างไปหาหมอตากับซื้อด้าย ลุงไม่อยากให้ใครต้องเลือกเพราะลุง ลุงเลือกเองดีกว่า"
          - text: "{p}จะช่วยลงขันค่าน้ำมัน{k}"
            heart: 2
            reply: "หลานใจดีเหมือนยายเลย ยายเพียรเคยแอบใส่เงินในกล่องค่ารถเกินทุกครั้ง ลุงรู้ แต่ลุงไม่เคยทัก ทักแล้วยายจะเลิก"
      - text: "รัฐไม่ช่วยรถเมล์เหรอ{kq}"
        heart: 0
        reply: "ช่วยรถเมล์ในเมือง รถเมล์บ้านนอกได้แบบฟอร์มสำรวจ"

  - id: cherd_n_market
    topic: news
    npc: "บนรถเที่ยวเก้าโมงวันนี้ มีป้าสองคนเถียงกันเรื่องราคาไข่ห้างค้าส่งอำเภอ คนนึงบอกแผงละร้อยห้า อีกคนบอกร้อยแปด เถียงจนถึงท่ารถ ลงไปดูด้วยกัน ร้อยหก ทั้งคู่ผิด ทั้งคู่ดีใจ"
    options:
      - text: "บนรถลุงสนุกนะ{k}"
        heart: 1
        reply: "สนุกกว่าละครหลังข่าวจ้ะ ละครหลังข่าวจบทุกคืน บนรถลุงไม่เคยจบ ต่อจากเที่ยวเช้าไปเที่ยวเย็น ต่อจากวันนี้ไปพรุ่งนี้"
      - text: "ไข่ห้างถูกกว่าร้านป้าแต๋วไหม{kq}"
        heart: 0
        reply: "ถูกกว่าสี่บาท บวกค่ารถไปกลับหกสิบ ซื้อสิบห้าแผงถึงคุ้ม ลุงบอกทุกคน ส่วนใหญ่ซื้อแผงเดียว แต่ไปเพราะอยากนั่งรถคุยกัน ไม่ได้ไปเพราะไข่"

  - id: cherd_n_trucks
    topic: news
    when: { time: morning }
    npc: "เช้านี้รถบรรทุกบริษัทจอดขวางป้ายรถเมล์อีกแล้ว ลุงบีบแตรจนเจ้าเขียวเสียงแหบ ดาบเสถียรมาช่วยเรียก ดาบลุกจากร้านป้าแต๋วเร็วที่สุดในรอบปี"
    options:
      - text: "ดาบลุกจริงเหรอ{kq}"
        heart: 1
        reply: "ลุกจริง ดาบบอกว่าเรื่องรถเมล์ดาบยอม เพราะแม่ดาบนั่งรถลุงไปขายของทุกวันสมัยดาบเรียน ทุกคนในตำบลมีใครสักคนเคยนั่งเจ้าเขียว"
      - text: "คนขับรถบรรทุกขอโทษไหม{kq}"
        heart: 0
        reply: "บอกว่า ‘ป้ายรถเมล์ไม่มีในแผนที่ GPS’ ลุงบอกว่าป้ายนี้อยู่ตรงนี้มาก่อนแผนที่เขาเกิด เขาไม่เข้าใจ ลุงก็ไม่เข้าใจเขา เราจากกันด้วยความไม่เข้าใจ"

  # ===== advice =====
  - id: cherd_a_last_bus
    topic: advice
    when: { time: noon }
    npc: "ไปอำเภอวันนี้อย่าลืมนะหลาน เที่ยวสุดท้ายหกโมงเย็น ตกรถต้องนอนโรงแรมสี่ร้อยห้าสิบ หรือนอนท่ารถกับหมา หมาท่ารถไม่กัด แต่ยุงกัด"
    options:
      - text: "ลุงไม่รอ{p}สักห้านาทีเหรอ{kq}"
        heart: 0
        reply: "ไม่รอจ้ะ ถ้ารอหลานห้านาที คนที่ป้ายถัดไปต้องรอห้านาที รอกันไปทั้งสาย ถึงตำบลมืดค่ำ ผีออก ลุงตรงเวลาเพื่อทุกคน ไม่ได้ใจร้าย"
        next:
          - text: "เข้าใจแล้ว{k}ลุง"
            heart: 1
            reply: "ดี ถ้าจะสายโทรมาบอกลุงก่อน ลุงไม่รอ แต่ลุงจะบอกตั้มให้เก็บที่นั่งในร้านไว้ให้ ลุงไม่ทิ้งใครนะ แค่ไม่รอ"
          - text: "ลุงเคยรอใครบ้างไหม{kq}"
            heart: 1
            reply: "เคยรอคนเดียว แม่ภก.มด ตอนนั้นแกเป็นลมบนรถ ลุงจอดรอหน้าโรงพยาบาลสองชั่วโมง ทั้งคันไม่มีใครบ่นสักคำ ตำบลนี้รู้ว่าเมื่อไหร่ควรรอ"
      - text: "จำแล้ว{k}"
        heart: 1
        reply: "ดีจ้ะ ตั้งนาฬิกาปลุกห้าโมงครึ่ง ไม่ใช่หกโมง หกโมงลุงล้อหมุนแล้ว"

  - id: cherd_a_documents
    topic: advice
    npc: "ถ้าจะไปติดต่อราชการที่อำเภอ เอาสำเนาบัตรประชาชนไปสามชุด รับรองสำเนาถูกต้องทุกแผ่น ลุงพาคนไปอำเภอสามสิบปี ทุกคนกลับมาเพราะลืมสำเนาชุดที่สาม"
    options:
      - text: "ทำไมต้องสามชุด{kq}"
        heart: 1
        reply: "ชุดแรกให้เจ้าหน้าที่ ชุดสองเจ้าหน้าที่ส่งต่อ ชุดสามลุงไม่รู้ ลุงเคยถาม เจ้าหน้าที่บอกว่า ‘ระเบียบ’ ลุงว่าชุดสามคือของผี"
      - text: "ถ่ายเอกสารที่ไหนดี{kq}"
        heart: 1
        reply: "ร้านตั้ม แผ่นละบาท ถ่ายตอนเย็นก่อนตั้มเข้ากะ ตั้มถ่ายเร็ว แต่ถ้าถ่ายตอนตีสอง ตั้มจะเล่าเรื่องผีให้ฟังทุกแผ่น"

  - id: cherd_a_carsick
    topic: advice
    npc: "ถ้าเมารถนั่งแถวหน้าข้างคนขับ มองถนนไกลๆ อย่าก้มดูโทรศัพท์ คนรุ่นหลานเมารถเพราะโทรศัพท์ ไม่ใช่เพราะถนน"
    options:
      - text: "ที่นั่งข้างคนขับว่างไหม{kq}"
        heart: 1
        reply: "ว่างสำหรับคนที่ลุงไว้ใจ… ว่างสำหรับหลาน ลุงจะเปิดเทปเพลงลูกทุ่งม้วนที่ยายเพียรชอบ ม้วนนั้นยืดไปนิดนึง เสียงยานๆ แต่ยายบอกว่ายิ่งยานยิ่งเศร้าดี"
      - text: "ถนนหลุมเยอะแบบนั้นใครก็เมา{k}"
        heart: 1
        reply: "ก็จริง หลุมงบปีที่แล้วทำให้เด็กนักเรียนอาเจียนบนรถลุงทุกอาทิตย์ ลุงเก็บถุงพลาสติกไว้หลังเบาะยี่สิบใบ งบถุงลุงจ่ายเอง"

  - id: cherd_a_send
    topic: advice
    npc: "ฝากของไปอำเภอกับลุงได้นะหลาน ผักไปส่งร้านอาหาร ของไปส่งไปรษณีย์ ลุงไม่คิดเพิ่ม ขอขนมสักห่อพอ ลุงชอบกล้วยตาก"
    options:
      - text: "ลุงรับฝากของทุกคนเลยเหรอ{kq}"
        heart: 1
        reply: "ทุกคน ตั้งแต่จดหมายรักยันกระสอบข้าว ลุงเป็นไปรษณีย์ที่ไม่มีแสตมป์ จดหมายรักลุงไม่เคยเปิดอ่านนะ… มีครั้งเดียวที่ซองเปิดเอง"
        next:
          - text: "ครั้งนั้นเป็นของใคร{kq}"
            heart: 0
            reply: "ความลับ ลุงขับรถเก็บความลับมาสามสิบปี ถ้าลุงเล่า ป้าแต๋วจะเลิกเป็นศูนย์ข่าวลือ ลุงไม่อยากแย่งงานป้า"
          - text: "ลุงใจดีจัง{k}"
            heart: 1
            reply: "ไม่ได้ใจดี ลุงขับไปอยู่แล้ว มีของไปด้วยรถไม่หนักขึ้น แต่ใจลุงเบาขึ้น เพราะรู้ว่ายังมีประโยชน์"
      - text: "{p}มีกล้วยตากไหม เดี๋ยวซื้อมาฝาก{k}"
        heart: 1
        reply: "แผงเจ๊หงษ์ห่อละยี่สิบ หวานพอดี เจ๊หงษ์แอบใส่เพิ่มให้ลุงทุกครั้ง เจ๊บอกเพราะลุงพาแม่เจ๊ไปหาหมอสมัยก่อน ตำบลนี้ใช้หนี้กันด้วยกล้วยตาก"

  # ===== smalltalk =====
  - id: cherd_s_tape
    topic: smalltalk
    npc: "เทปเพลงในรถลุงมีสิบสองม้วน เปิดวนมาสิบปี ผู้โดยสารร้องตามได้ทุกเพลง ทุกท่อน แม้แต่ตรงที่เทปยานเสียงเพี้ยน ทุกคนก็ร้องเพี้ยนตามพร้อมกัน"
    options:
      - text: "ลุงเปลี่ยนเป็นบลูทูธสิ{kq}"
        heart: 0
        reply: "ตั้มเคยต่อให้ เปิดเพลงจากโทรศัพท์ ผู้โดยสารไม่ร้องตาม เพราะเพลงไม่ยาน ไม่ตรงกับที่จำ ลุงเลยถอดออก บางอย่างพังแล้วดีกว่า"
      - text: "เพลงไหนผู้โดยสารชอบสุด{kq}"
        heart: 1
        reply: "เพลงคนจากบ้านไปทำงานโรงงาน เปิดทีไรคนแก่เงียบ คนหนุ่มสาวหันมองหน้าต่าง ลุงเปิดตอนเที่ยวหกโมงเย็นเสมอ เที่ยวที่คนกลับบ้าน"
        next:
          - text: "ลุงเปิดเศร้าไปไหม{kq}"
            heart: 1
            reply: "เศร้าแบบที่คนอยากได้ยินจ้ะ เพลงร้องแทนสิ่งที่คนบนรถไม่กล้าพูด ลุงเป็นแค่คนกดปุ่ม"
          - text: "ลุงร้องตามด้วยไหม{kq}"
            heart: 1
            reply: "ร้องในใจ ปากลุงต้องบอกป้ายรถ ถ้าลุงร้องออกมา ลุงจะลืมจอดป้ายวัด เคยแล้วครั้งหนึ่ง พระท่านโบกให้จอด ลุงอายไปทั้งเดือน"

  - id: cherd_s_pigeons
    topic: smalltalk
    npc: "นกพิราบทำรังบนหลังคาเจ้าเขียว ลุงไม่กล้าไล่ มันนั่งไปอำเภอกับลุงทุกเที่ยว ฟรี ไม่จ่ายสามสิบ ผู้โดยสารที่จ่ายน้อยที่สุดแต่ไม่เคยพลาดเที่ยวเลย"
    options:
      - text: "มันไม่กลัวลมเหรอ{kq}"
        heart: 1
        reply: "ลุงขับช้าตรงโค้งหน้าวัด ไม่ใช่เพราะกฎจราจร เพราะรังนก ผู้โดยสารคิดว่าลุงขับระวัง ที่จริงลุงขับระวังไข่นก"
      - text: "ตั้งชื่อนกด้วยไหม{kq}"
        heart: 1
        reply: "ชื่อ ‘ผู้ใหญ่’ เพราะมันขันไม่ได้แต่ครางวันละสามรอบตรงเวลา ห้ามบอกผู้ใหญ่สมศักดิ์นะ"

  - id: cherd_s_seat
    topic: smalltalk
    when: { time: morning }
    npc: "เช้านี้ลมดี ลุงเปิดหน้าต่างทุกบาน กลิ่นข้าวในนาเข้ามาเต็มรถ คนกรุงเทพฯ ต้องซื้อเทียนหอมกลิ่นนี้ ลุงได้ฟรีทุกเช้า"
    options:
      - text: "ลุงรักงานนี้มากนะ{k}"
        heart: 1
        reply: "รักจ้ะ สามสิบปียังไม่เบื่อ ถนนเดิม ป้ายเดิม แต่คนบนรถไม่เคยเหมือนเดิม วันนี้มีหลานอยู่ด้วย พรุ่งนี้มีใครก็ไม่รู้"
      - text: "ไปด้วยสักเที่ยวได้ไหม{kq}"
        heart: 2
        reply: "ได้สิ ขึ้นมาเลย นั่งข้างลุง ไม่ต้องไปไหนก็ได้ ไปอำเภอแล้วกลับเที่ยวเที่ยง ลุงจะชี้ให้ดูว่าบ้านไหนเป็นของใคร ใครเคยจีบใคร ลุงรู้หมดจากที่นั่งคนขับ"

  - id: cherd_s_horn
    topic: smalltalk
    npc: "ลุงบีบแตรทักคนตลอดทาง บีบสั้นหนึ่งทีคือสวัสดี สองทีคือกินข้าวหรือยัง ยาวหนึ่งทีคือมีพัสดุของบ้านนั้น ทั้งตำบลเข้าใจรหัสลุง"
    options:
      - text: "ถ้าบีบสามทีล่ะ{kq}"
        heart: 1
        reply: "สามทีคือ ‘ระวัง รถบรรทุกบริษัทมา’ เพิ่งคิดได้ปีนี้ เด็กๆ ได้ยินแล้ววิ่งเข้าข้างทางทุกคน รหัสใหม่ที่ลุงไม่ได้อยากคิด"
      - text: "สอน{p}บ้างสิ{kq}"
        heart: 1
        reply: "ไม่ได้ หลานไม่มีแตรรถเมล์ ถ้าหลานบีบแตรมอเตอร์ไซค์ทักคน คนจะคิดว่าหลานด่า แตรมอเตอร์ไซค์เสียงมันโกรธเกินไป"

  - id: cherd_s_rain
    topic: smalltalk
    when: { rain: true }
    npc: "ฝนตกแบบนี้ ที่ปัดน้ำฝนเจ้าเขียวปัดได้ข้างเดียว ลุงชะโงกหน้าออกนอกหน้าต่างดูทางอีกข้าง เปียกครึ่งหน้า ผู้โดยสารเห็นแล้วยื่นผ้าขาวม้ามาให้สามผืน"
    options:
      - text: "ลุงซ่อมที่ปัดสิ{kq}"
        heart: 1
        reply: "บอลบอกว่ามอเตอร์เสีย สั่งของใหม่ต้องรอสองเดือน รุ่นนี้ไม่มีขายแล้ว เจ้าเขียวแก่จนอะไหล่ตามไม่ทัน เหมือนลุงไปหาหมอ"
      - text: "ผู้โดยสารลุงน่ารักนะ{k}"
        heart: 1
        reply: "น่ารักจ้ะ บนรถลุงไม่มีใครเป็นคนแปลกหน้าเกินสองป้าย ขึ้นป้ายแรกยังไม่รู้จักกัน ถึงป้ายที่สามแบ่งขนมกินแล้ว"

  # ===== self =====
  - id: cherd_f_thirty
    topic: self
    npc: "ลุงเริ่มขับสายนี้ตอนอายุสามสิบสอง ตอนนั้นเจ้าเขียวยังเป็นเจ้าเหลือง ทาสีใหม่สามรอบ สีเดิมยังโผล่ตรงที่สีลอก เหมือนหน้าลุงตอนหนุ่มยังโผล่ตอนยิ้ม"
    options:
      - text: "ทำไมเปลี่ยนเป็นสีเขียว{kq}"
        heart: 1
        reply: "เมียลุงเลือก บอกว่าสีเขียวเหมือนนา คนเห็นแล้วจะคิดถึงบ้าน คนที่กลับจากกรุงเทพฯ ลงท่ารถแล้วเห็นเจ้าเขียว จะรู้ว่าใกล้ถึงบ้านแล้ว"
      - text: "สามสิบปีไม่เบื่อเลยเหรอ{kq}"
        heart: 1
        reply: "เบื่อถนน ไม่เบื่อคน ถนนเหมือนเดิมทุกวัน คนเปลี่ยนทุกวัน ลุงขับรถเพื่อดูคนเปลี่ยน"

  - id: cherd_f_son
    topic: self
    when: { heart_min: 3 }
    npc: "ลูกชายลุงอยู่ระยอง ขึ้นรถลุงเที่ยวหกโมงเย็นไปเมื่อสิบสองปีก่อน กลับมาสงกรานต์ทุกปี ขับรถเก๋งมาเอง ไม่ได้นั่งเจ้าเขียวอีกเลย"
    options:
      - text: "ลุงอยากให้เขานั่งรถลุงอีกไหม{kq}"
        heart: 2
        reply: "อยาก ลุงอยากให้เขานั่งข้างคนขับสักเที่ยว ไม่ต้องคุยอะไร นั่งเฉยๆ เหมือนตอนเขาเจ็ดขวบ ตอนนั้นเขาบอกว่าโตขึ้นจะขับเจ้าเขียวแทนพ่อ"
        next:
          - text: "ลุงบอกเขาตรงๆ สิ{k}"
            heart: 1
            reply: "ลุงไม่ใช่คนพูดตรงเรื่องแบบนี้จ้ะ ลุงตรงแต่เวลา สงกรานต์หน้าลุงจะลองชวน ถ้าเขาหัวเราะ ลุงจะบอกว่าล้อเล่น"
          - text: "เขาคงยุ่งงาน{k}"
            heart: 0
            reply: "ยุ่งจ้ะ ลุงเข้าใจ โทรมาทุกอาทิตย์ถามว่ารถยังวิ่งไหม ลุงอยากให้ถามว่าพ่อยังวิ่งไหวไหมบ้าง แต่ก็ไม่เป็นไร"
      - text: "ระยองไกลไหม{kq}"
        heart: 0
        reply: "ไกลแปดชั่วโมงถ้านั่งรถทัวร์ ไกลสิบสองปีถ้านับจากวันที่เขาขึ้นรถลุงเที่ยวสุดท้าย"

  - id: cherd_f_wife
    topic: self
    when: { heart_min: 5 }
    npc: "เมียลุงนั่งข้างคนขับทุกเที่ยวยี่สิบห้าปี เก็บค่ารถ ทอนเงิน ชวนผู้โดยสารคุย ลุงขับอย่างเดียว ตั้งแต่เขาไม่อยู่ ลุงต้องทำทุกอย่างคนเดียว ทอนเงินผิดบ่อยมาก"
    options:
      - text: "ลุงคิดถึงป้าไหม{kq}"
        heart: 2
        reply: "ทุกป้ายจ้ะ บางเช้าลุงยังเผลอจอดหน้าบ้านเก่าเขา ป้ายที่ไม่มีใครยืนรอ ผู้โดยสารไม่มีใครถาม ทุกคนรู้ เขารอให้ลุงออกรถเอง"
        next:
          - text: "{p}นั่งข้างลุงได้ไหม{kq} ช่วยทอนเงิน"
            heart: 2
            reply: "…ได้จ้ะ วันไหนหลานว่าง ขึ้นมาเที่ยวเช้า ทอนเงินผิดได้ ลุงไม่ว่า เมียลุงก็ทอนผิดบ่อย แต่ผิดแบบให้คนจนเกินทุกที"
          - text: "ป้าคงภูมิใจในลุง{k}"
            heart: 1
            reply: "เขาคงด่าว่าทำไมยังไม่เปลี่ยนที่ปัดน้ำฝน… ใช่ เขาคงด่า ลุงอยากได้ยินอีกสักครั้ง"
      - text: "ลุงจ้างคนเก็บค่ารถสิ{k}"
        heart: 0
        reply: "จ้างไม่ไหวจ้ะ และที่นั่งนั้นลุงไม่ได้ว่างไว้ให้คนเก็บค่ารถ ลุงว่างไว้ให้คนที่ลุงไว้ใจ ยังไม่ค่อยมีใครนั่ง"

  - id: cherd_f_books
    topic: self
    when: { heart_min: 7 }
    npc: "หลานรู้ไหม ลุงจดชื่อทุกคนที่ขึ้นรถลุงครั้งแรกไว้เจ็ดเล่ม พันกว่าชื่อ บางคนตายไปแล้ว บางคนย้ายไป บางคนนั่งอยู่ทุกวัน ลุงกลัวอย่างเดียว ว่าจะไม่มีเล่มที่แปด"
    options:
      - text: "ทำไมจะไม่มี{kq}"
        heart: 2
        reply: "ขนส่งบอกว่าผู้โดยสารน้อย คนหนุ่มสาวมีมอเตอร์ไซค์ คนแก่ตายไปทีละคน ถ้าวันหนึ่งเขาตัดสาย สมุดเจ็ดเล่มนี้จะเป็นแค่รายชื่อคนที่เคยไปอำเภอด้วยกัน"
        next:
          - text: "{p}จะช่วยหาชื่อเล่มที่แปด{k}"
            heart: 2
            reply: "…หลานนี่ ลุงจะเริ่มเล่มที่แปดเลย หน้าแรกชื่อหลาน ถึงหลานจะอยู่เล่มเจ็ดแล้วก็ตาม ลุงทำผิดระเบียบตัวเองครั้งแรก"
          - text: "สมุดพวกนี้มีค่ามากนะ{kq}"
            heart: 1
            reply: "มีค่ากับลุงคนเดียวจ้ะ คนอื่นเห็นเป็นกระดาษ แต่ลุงเปิดหน้าไหนก็จำได้ว่าคนนั้นนั่งตรงไหน ถือของอะไร หัวเราะหรือร้องไห้"
      - text: "ลุงเกษียณได้แล้วนะ{kq}"
        heart: 0
        reply: "เกษียณแล้วลุงจะทำอะไร นั่งบ้านฟังเสียงรถตู้ผ่าน… ไม่ล่ะจ้ะ ลุงยังไหว ขาลุงยังเหยียบคลัตช์ได้"

  # ===== others =====
  - id: cherd_o_tam
    topic: others
    npc: "ตั้มชงกาแฟเย็นให้ลุงทุกเย็นก่อนเที่ยวหกโมง หวานน้อยไม่ต้องสั่ง สามปีแล้ว ตั้มดูรถลุงออกทุกเย็น ลุงรู้ว่าตั้มอยากขึ้น แต่ไม่เคยขึ้น"
    options:
      - text: "ลุงชวนพี่ตั้มบ้างสิ{kq}"
        heart: 1
        reply: "ลุงไม่ชวนจ้ะ ชวนแล้วเหมือนไล่ คนที่อยากไปต้องเดินมาที่ป้ายเอง ลุงทำได้แค่เปิดประตูรอเวลาเดิมทุกวัน"
        next:
          - text: "ถ้าพี่ตั้มขึ้นจริงลุงจะว่าไง{kq}"
            heart: 1
            reply: "ลุงจะไม่พูดอะไร ลุงจะเปิดเพลงคนจากบ้านไปทำงาน แล้วขับให้นุ่มที่สุดในชีวิต"
          - text: "พี่ตั้มกลัวทิ้งแม่{k}"
            heart: 1
            reply: "ลุงรู้ ลุงพาแม่ตั้มไปหาหมอแอนทุกพฤหัส ไม่คิดค่ารถ ถ้าตั้มไป ลุงก็ยังพาไป บอกตั้มด้วยนะ ลุงพูดเองไม่เป็น"
      - text: "พี่ตั้มน่ารักนะ{k}"
        heart: 1
        reply: "น่ารักแบบคนที่ไม่รู้ว่าตัวเองน่ารัก หายากกว่าคนขับรถเมล์ตรงเวลาอีก"

  - id: cherd_o_ball
    topic: others
    npc: "บอลมาดูเครื่องเจ้าเขียวให้ทุกอาทิตย์ ไม่คิดเงิน บอกว่าเครื่องเจ้าเขียวสอนเขามากกว่าวิทยาลัย ถ้าบอลไประยอง ลุงไม่รู้จะเอาเจ้าเขียวไปหาใคร"
    options:
      - text: "ลุงบอกบอลไหมว่าอยากให้อยู่{kq}"
        heart: 1
        reply: "บอกไปครึ่งเดียว ลุงบอกว่า ‘เจ้าเขียวจะคิดถึง’ ไม่ได้บอกว่าลุงจะคิดถึง บอลยิ้มแล้วตบหลังคารถสองที เหมือนตบไหล่ลุง"
      - text: "บอลอาจจะอยู่ก็ได้{k}"
        heart: 1
        reply: "หวังว่างั้นจ้ะ แต่ถ้าไป ลุงจะขับไปส่งที่ท่ารถด้วยตัวเอง นั่งข้างคนขับ ลุงยกที่นั่งนั้นให้คนที่ซ่อมเจ้าเขียวได้"

  - id: cherd_o_somsak
    topic: others
    npc: "ผู้ใหญ่สมศักดิ์ตั้งนาฬิกาตามแตรรถลุงเที่ยวหกโมง ลุงเลยไม่กล้าสาย ถ้าลุงสายห้านาที หอกระจายข่าวทั้งตำบลประกาศช้าห้านาที ทั้งตำบลตื่นสายตามลุง"
    options:
      - text: "ลุงเคยสายไหม{kq}"
        heart: 1
        reply: "ครั้งเดียว วันที่เมียลุงเสีย ผู้ใหญ่ไม่ประกาศเลยวันนั้น รอลุงทั้งเช้า พอลุงบีบแตรตอนแปดโมง ผู้ใหญ่ถึงเปิดไมค์ แล้วประกาศว่า ‘วันนี้ลุงเชิดมาช้า ขอให้ทุกคนเข้าใจ’ สามรอบ"
        next:
          - text: "ผู้ใหญ่ใจดีนะ{k}"
            heart: 2
            reply: "ผู้ใหญ่พูดซ้ำทุกเรื่อง แต่วันนั้นลุงอยากให้ซ้ำ ได้ยินสามรอบแล้วลุงรู้ว่าไม่ได้อยู่คนเดียว"
          - text: "ทั้งตำบลรอลุงเลยเหรอ{kq}"
            heart: 1
            reply: "ทั้งตำบลจ้ะ วันนั้นไม่มีใครบ่นว่ารถเมล์ช้าสักคน ตำบลนี้ขี้บ่นทุกเรื่อง ยกเว้นเรื่องที่ไม่ควรบ่น"
      - text: "ทำไมผู้ใหญ่ไม่ดูนาฬิกาเอง{kq}"
        heart: 0
        reply: "นาฬิกาผู้ใหญ่ช้าสิบนาที ผู้ใหญ่ไม่ยอมเปลี่ยนถ่าน บอกว่าเป็นนาฬิกาที่พ่อให้ ลุงเลยเป็นถ่านนาฬิกาผู้ใหญ่ไปแทน"

  - id: cherd_o_thana
    topic: others
    npc: "คุณธนาเคยขึ้นรถลุงครั้งเดียว ตอนรถบริษัทเสีย นั่งแถวหลังสุด ใส่เสื้อเชิ้ตรีดเรียบ พอถึงหลุมงบปีที่แล้วหัวโขกเพดาน ลุงไม่ได้ตั้งใจนะ… นิดเดียว"
    options:
      - text: "คุณธนาว่าไงบ้าง{kq}"
        heart: 1
        reply: "ลงรถแล้วบอกว่า ‘ประสบการณ์ที่น่าสนใจครับ’ แล้วอาทิตย์ต่อมาบริษัทซื้อรถตู้ใหม่สามคัน ลุงว่าเขาคงไม่อยากสนใจอีก"
      - text: "ลุงแกล้งเขาเหรอ{kq}"
        heart: 0
        reply: "ไม่ได้แกล้ง หลุมแกล้ง ลุงขับเท่าเดิม ลุงแค่ไม่ได้ขับช้าเป็นพิเศษเหมือนที่ทำให้คนแก่ เป็นการให้บริการตามมาตรฐาน"

  - id: cherd_o_tam_gone
    topic: others
    when: { flag: tam_end_city }
    npc: "ตั้มส่งคลิปมาให้ลุงดูทางโทรศัพท์ ถ่ายรถเมล์ในกรุงเทพฯ ติดอยู่บนถนนสองชั่วโมง เขียนมาว่า ‘ไม่มีคันไหนตรงเวลาเหมือนลุงเลยครับ’ ลุงดูไปสิบรอบ"
    options:
      - text: "ลุงคิดถึงพี่ตั้มไหม{kq}"
        heart: 2
        reply: "ทุกเย็นจ้ะ กาแฟเย็นร้านนั้นยังมีขาย เด็กใหม่ชงหวานเกินทุกที ลุงไม่สั่ง เขาก็ไม่รู้ ลุงเลยดื่มหวานเกินไปเรื่อยๆ จนกว่าตั้มจะกลับมาสักเที่ยว"
      - text: "แม่พี่ตั้มเป็นไงบ้าง{kq}"
        heart: 1
        reply: "ลุงพาไปหาหมอแอนทุกพฤหัสเหมือนเดิม แม่ตั้มนั่งข้างคนขับ เล่าเรื่องตั้มตลอดทาง เหมือนยายเพียรเล่าเรื่องหลานไม่มีผิด"

quests:
  - id: cherd_q1
    npc: cherd
    title: "ยางล้อหลังโล้น"
    desc: "เจ้าเขียวยางหลังโล้นใกล้วันตรวจสภาพ ลุงเชิดไม่มีเงินเปลี่ยน"
    start: { heart_min: 1, day_min: 3 }
    offer:
      npc: "หลาน… ขนส่งจะมาตรวจสภาพเจ้าเขียวเดือนหน้า ยางหลังโล้นจนเห็นเส้นลวด ถ้าไม่ผ่าน เจ้าเขียวต้องหยุดวิ่ง ลุงไม่อยากขอใคร แต่ช่วยลุงไปถามบอลหน่อยว่าต้องใช้เงินเท่าไหร่"
      options:
        - text: "ได้{k}ลุง เดี๋ยว{p}ไปถามให้"
          accept: true
          heart: 1
          reply: "ขอบใจจ้ะ บอลอยู่อู่ทั้งวัน บอกว่าลุงเชิดฝากถาม ไม่ต้องบอกว่าลุงไม่มีเงิน บอลรู้อยู่แล้ว"
        - text: "ลุงจะให้ทั้งตำบลลงขันไหม{kq}"
          accept: true
          heart: 1
          reply: "ลุงไม่กล้าขอ… แต่ถ้ามีคนเริ่มก่อน ลุงคงไม่ปฏิเสธ ไปถามบอลก่อนนะ ดูว่าต้องเท่าไหร่"
        - text: "ลุงซื้อรถใหม่เลยดีกว่า{k}"
          heart: -1
          reply: "เจ้าเขียวเป็นเพื่อนลุงนะหลาน ไม่ใช่แค่รถ เพื่อนยางโล้นเราก็ซื้อยางให้ ไม่ใช่ซื้อเพื่อนใหม่"
    steps:
      - goal: { type: talk, npc: ball }
        hint: "ไปถามบอลที่อู่ว่ายางเจ้าเขียวต้องใช้เงินเท่าไหร่"
        done:
          npc: "ยางหลังสองเส้น เส้นละสามพันห้า รุ่นนี้หายาก ผมหามือสองสภาพดีได้เส้นละพันแปด ค่าแรงผมไม่คิด… ลุงเชิดพาแม่ผมไปคลอดผมตอนตีสาม คืนเดียวที่ลุงขับหลังสามทุ่ม ผมติดหนี้ลุงตั้งแต่เกิด"
          options:
            - text: "บอลเกิดบนรถลุงเหรอ{kq}"
              heart: 1
              reply: "เกือบครับ แม่บอกว่าคลอดหน้าประตูโรงพยาบาลพอดี ลุงบีบแตรยาวจนพยาบาลวิ่งออกมา ลุงไม่เคยเล่าให้ใครฟัง แม่ผมเล่าแทนทุกปี"
            - text: "ขาดอีกเท่าไหร่{kq}"
              heart: 1
              reply: "สามพันหกร้อยครับ ลุงมีสามพัน ขาดอีกหกร้อย ผมช่วยไปสามร้อยแล้ว เหลือสามร้อย ไปบอกลุงว่าผมไม่ได้ช่วยนะ ลุงไม่ยอมรับ"
      - goal: { type: pay, npc: cherd, n: 300 }
        hint: "ลงขันค่ายางเจ้าเขียว 300 บาทกับลุงเชิด"
        done:
          npc: "หลาน… ลุงไม่รับไม่ได้ใช่ไหม เพราะหลานจะไปใส่กล่องค่ารถแทน เหมือนยายเพียรเลย ลุงรับจ้ะ ลุงจะจดลงสมุดเล่มเจ็ด หน้าหลาน ‘ช่วยเปลี่ยนยางเจ้าเขียว’"
          options:
            - text: "บอลก็ช่วยนะ{k}ลุง"
              heart: 1
              reply: "รู้จ้ะ บอลไม่เคยเก็บเงินลุง บอลคิดว่าลุงไม่รู้ ทั้งตำบลช่วยลุงแบบนี้แหละ แอบช่วยแล้วทำเป็นไม่ได้ช่วย ลุงก็ทำเป็นไม่รู้ เราเล่นละครกันทั้งตำบล"
            - text: "ถือว่าค่ารถล่วงหน้า{k}"
              heart: 2
              reply: "ค่ารถล่วงหน้าสิบเที่ยว ลุงจะขับให้นุ่มเป็นพิเศษทั้งสิบเที่ยว หลุมงบปีที่แล้วลุงจะอ้อมให้"
    reward: { money: 0, heart: 2, items: { boiled_peanut: 2 }, set_flag: cherd_q1_done, line: { from: cherd, text: "เจ้าเขียวได้ยางใหม่แล้ว 🚌💚 ขอบคุณทุกคนที่ช่วย (ลุงรู้นะว่าใครบ้าง) เที่ยวหกโมงเช้าพรุ่งนี้ตรงเวลาเหมือนเดิม" } }

  - id: cherd_q2
    npc: cherd
    title: "จดหมายจากขนส่ง"
    desc: "ขนส่งจังหวัดจะทบทวนเส้นทาง เพราะ ‘ผู้โดยสารน้อย’ — ต้องพิสูจน์ว่าไม่จริง"
    start: { flag: cherd_q1_done, heart_min: 3, day_min: 8 }
    offer:
      npc: "จดหมายจากขนส่งมาแล้วหลาน ‘เส้นทางตำบลดงเย็น–อำเภอ อยู่ระหว่างทบทวน เนื่องจากผู้โดยสารน้อย อาจพิจารณาให้ผู้ประกอบการรายใหม่ดำเนินการ’ ผู้ประกอบการรายใหม่คือรถตู้สีขาวคันนั้น ลุงอ่านสามรอบ"
      options:
        - text: "เราต้องพิสูจน์ว่าคนขึ้นเยอะ{k}"
          accept: true
          heart: 2
          reply: "ใช่! มานั่งรถเที่ยวหกโมงเช้ากับลุง นับคนให้ลุงหน่อย ลุงนับเองเขาไม่เชื่อ ต้องมีพยาน แล้วไปขอผู้ใหญ่ประกาศให้คนมาขึ้นรถด้วย"
        - text: "ลุงจะยอมให้รถตู้มาแทนเหรอ{kq}"
          accept: true
          heart: 1
          reply: "ไม่ยอมจ้ะ แต่ลุงไม่รู้จะสู้ยังไง ลุงขับรถเป็นอย่างเดียว ช่วยลุงคิดหน่อย เริ่มจากนั่งเที่ยวหกโมงเช้ากับลุงก่อน"
        - text: "รถตู้ก็สบายกว่านะ{kq}"
          heart: -1
          reply: "สบายจ้ะ สำหรับคนที่ไม่ถือไก่ ไม่ถือกระสอบข้าว ไม่มีขาที่ต้องค่อยๆ ก้าว… ไม่เป็นไร ลุงสู้เอง"
    steps:
      - goal: { type: visit, place: bus_stop, from: "06:00", to: "06:30" }
        hint: "ไปขึ้นรถเที่ยวหกโมงเช้ากับลุงเชิด นับผู้โดยสาร (06:00–06:30)"
        done:
          npc: "นับได้เท่าไหร่หลาน… ยี่สิบเจ็ด! เที่ยวนี้เต็มคันเหมือนทุกเช้า ยายจันทร์ไปหาหมอตา เด็กนักเรียนแปดคน แม่ค้าห้าคน ไก่สองตัวไม่นับ ลุงจดไว้แล้ว ลายมือหลานเซ็นเป็นพยาน"
          options:
            - text: "ทำไมขนส่งมานับแต่เที่ยวบ่ายสาม{kq}"
              heart: 1
              reply: "ลุงเดาว่าเพราะบ่ายสามคนสำรวจตื่นแล้ว หกโมงเช้าคนสำรวจยังไม่ตื่น ระบบมันนับจากเวลาที่คนนับสะดวก"
            - text: "นับไก่ด้วยได้ไหม{kq}"
              heart: 1
              reply: "ฮ่าๆ ถ้านับไก่ เจ้าเขียวขนผู้โดยสารเยอะที่สุดในจังหวัด แต่ขนส่งไม่มีช่องนับไก่ ลุงจะเขียนหมายเหตุไว้ใต้ตาราง ‘และไก่’"
      - goal: { type: talk, npc: somsak }
        hint: "ไปขอผู้ใหญ่สมศักดิ์ประกาศเรื่องรถเมล์ทางหอกระจายข่าว"
        done:
          npc: "ประกาศเรื่องรถลุงเชิดเหรอ… ได้ ย้ำอีกครั้งนะ ได้ ผู้ใหญ่ตั้งนาฬิกาตามแตรลุงเชิดมาสิบห้าปี ถ้าเจ้าเขียวหยุด ผู้ใหญ่ก็ไม่รู้จะเปิดไมค์ตอนไหน… ผู้ใหญ่จะประกาศว่า ‘ใครเคยนั่งรถลุงเชิด ไปลงชื่อที่ศาลา’ สามรอบ"
          options:
            - text: "ขอบคุณ{k}ผู้ใหญ่"
              heart: 1
              reply: "ไม่ต้องขอบคุณ ผู้ใหญ่ทำเพราะนาฬิกา… และเพราะลุงเชิดพาแม่ผู้ใหญ่ไปฟอกไตอาทิตย์ละสามวันอยู่สองปี ไม่คิดค่ารถสักเที่ยว ย้ำอีกครั้งนะ ไม่คิดสักเที่ยว"
            - text: "ประกาศรอบเดียวพอไหม{kq}"
              heart: 0
              reply: "รอบเดียวไม่มีใครฟัง สามรอบคนถึงจะเริ่มรู้ว่าเป็นเรื่องจริง ผู้ใหญ่ไม่ได้พูดซ้ำเพราะแก่ ผู้ใหญ่พูดซ้ำเพราะรู้จักคนในตำบล"
    reward: { money: 100, heart: 2, set_flag: cherd_q2_done, line: { from: somsak, text: "📢 ประกาศ ประกาศ ใครเคยนั่งรถเมล์ลุงเชิด เชิญลงชื่อที่ศาลา ย้ำอีกครั้งนะ ใครเคยนั่งรถลุงเชิด… (ย้ำสามครั้ง)" } }

  - id: cherd_q3
    npc: cherd
    title: "สมุดเจ็ดเล่ม"
    desc: "รวบรวมรายชื่อคนที่ต้องพึ่งรถเจ้าเขียว ยื่นคัดค้านที่ อบต."
    start: { flag: cherd_q2_done, heart_min: 4, day_min: 12 }
    offer:
      npc: "คนมาลงชื่อที่ศาลาสามร้อยกว่าคน ลุงเอาสมุดเจ็ดเล่มมาเทียบ ชื่อตรงกันเกือบหมด… แต่ อบต.บอกว่าต้องมีหนังสือรับรองจากโรงเรียนกับ รพ.สต. ด้วย ว่ารถลุงจำเป็น ช่วยลุงวิ่งเอกสารหน่อย"
      options:
        - text: "{p}จะวิ่งให้{k}ลุง"
          accept: true
          heart: 2
          reply: "ขอบใจจ้ะ ไปครูเต้ยที่โรงเรียน ไปหมอแอนที่ รพ.สต. แล้วอย่าลืมเอาแฟ้มใส่สำเนาบัตรสามชุด ไม่งั้นนายกจะบอกว่า ‘เอกสารไม่ครบ เรารับทราบ’"
        - text: "ทำไมต้องยุ่งยากขนาดนี้{kq}"
          accept: true
          heart: 0
          reply: "รถตู้ได้ใบอนุญาตทดลองวิ่งภายในสามวัน รถลุงวิ่งมาสามสิบปีต้องพิสูจน์ว่ามีตัวตน ลุงไม่เข้าใจ แต่ลุงทำตาม ช่วยลุงนะ"
        - text: "ลุงหาคนอื่นช่วยเถอะ{k}"
          heart: -1
          reply: "ได้จ้ะ ลุงไปเองก็ได้ แต่ลุงต้องหยุดวิ่งหนึ่งวัน วันนั้นยายจันทร์จะไม่ได้ไปหาหมอตา… ไม่เป็นไร ลุงจะไปวันอาทิตย์"
    steps:
      - goal: { type: talk, npc: toey }
        hint: "ไปขอหนังสือรับรองจากครูเต้ยที่โรงเรียน"
        done:
          npc: "รถลุงเชิดเหรอคะ ครูเขียนให้เลย เด็กแปดคนนั่งรถลุงไปเรียนต่อ ม.ต้น ที่อำเภอทุกวัน ถ้าไม่มีรถลุง สามคนในนั้นจะไม่ได้เรียนต่อ ครูจะใส่ชื่อเด็กทุกคน… เดี๋ยวครูให้เด็กวาดรูปเจ้าเขียวแนบไปด้วย"
          options:
            - text: "วาดรูปแนบด้วยดีมาก{k}ครู"
              heart: 1
              reply: "ใช่ไหมคะ เอกสารราชการไม่มีใครอ่าน แต่รูปเด็กวาดมีคนดู น้องมิววาดลุงเชิดยิ้มกว้างกว่าตัวรถ"
            - text: "ครูคิดว่าจะสำเร็จไหม{kq}"
              heart: 0
              reply: "ครูไม่รู้ค่ะ แต่ครูรู้ว่าถ้าเราไม่ทำ มันจะไม่สำเร็จแน่นอน ครูสอนเด็กแบบนี้ทุกวัน ครูต้องทำให้เด็กเห็นบ้าง"
      - goal: { type: talk, npc: ann }
        hint: "ไปขอหนังสือรับรองจากหมอแอนที่ รพ.สต."
        done:
          npc: "หมอเขียนให้แล้วจ้ะ คนไข้สามสิบสองคนนั่งรถลุงไปโรงพยาบาลอำเภอทุกเดือน ฟอกไต ตรวจตา ตรวจครรภ์ หมอเขียนว่า ‘การยกเลิกเส้นทางนี้เป็นความเสี่ยงต่อสุขภาพของชุมชน’ หมอใส่ตราประทับสองอัน เผื่ออันเดียวไม่มีใครเห็น"
          options:
            - text: "ขอบคุณ{k}หมอ"
              heart: 1
              reply: "ขอบคุณลุงเชิดเถอะจ้ะ ลุงเคยขับเลยป้ายไปส่งคนไข้หมอถึงห้องฉุกเฉินโดยไม่ต้องขอสองรอบ หมอติดหนี้ลุงมากกว่าจดหมายฉบับเดียว"
            - text: "รถตู้พาคนป่วยไปไม่ได้เหรอ{kq}"
              heart: 1
              reply: "ได้ ถ้าคนป่วยเดินขึ้นรถตู้ได้เอง จ่ายสี่สิบห้าได้ และไม่อ้วกบนเบาะหนัง หมอเขียนเรื่องอ้วกไม่ได้ แต่หมอคิดในใจ"
      - goal: { type: have, item: folder, n: 1 }
        hint: "ซื้อแฟ้มเอกสารที่ร้านป้าแต๋ว ใส่สำเนาบัตรสามชุดกับหนังสือรับรอง"
        done:
          npc: "แฟ้มสีฟ้า ป้าแต๋วเลือกให้ใช่ไหม ป้าบอกว่าสีฟ้าคือสีของความน่าเชื่อถือ ป้าดูมาจากละคร… ใส่ครบแล้ว สำเนาบัตรลุงสามชุด รายชื่อสามร้อยสิบสี่คน จดหมายครู จดหมายหมอ รูปเจ้าเขียวของน้องมิว"
          options:
            - text: "ครบแล้ว{k} ไป อบต. กัน"
              heart: 1
              reply: "ไปจ้ะ ลุงขับไปเอง จอดหน้า อบต. บีบแตรสั้นหนึ่งทีเหมือนทักคนรู้จัก ถึงเขาจะไม่ทักกลับก็ตาม"
            - text: "แฟ้มนี้หนักกว่าที่คิด{k}"
              heart: 1
              reply: "หนักเพราะมีชื่อคนสามร้อยคน ลุงอุ้มคนพวกนี้ไปอำเภอมาสามสิบปี วันนี้ให้เขาช่วยอุ้มลุงบ้าง"
      - goal: { type: talk, npc: wichai }
        hint: "ยื่นแฟ้มคัดค้านกับนายกฯ วิชัยที่ อบต."
        done:
          npc: "อ้อ เรื่องรถเมล์ลุงเชิด เรารับทราบแล้ว และจะรับทราบต่อไปอย่างจริงจังครับ… สามร้อยสิบสี่รายชื่อเลยเหรอ เยอะกว่าคนมาเลือกตั้งหน่วยนี้อีก เอ่อ เราจะส่งเรื่องต่อขนส่งจังหวัด พร้อมความเห็นของสภาครับ"
          options:
            - text: "สภาจะเห็นด้วยไหม{kq}"
              heart: 0
              reply: "สภาเห็นด้วยกับประชาชนเสมอครับ โดยเฉพาะประชาชนที่มีสามร้อยสิบสี่รายชื่อ… ในช่วงใกล้เลือกตั้ง เราให้ความสำคัญกับทุกเสียงเป็นพิเศษครับ"
            - text: "รถตู้นั่นเป็นของญาติท่านใช่ไหม{kq}"
              heart: -1
              reply: "เอ่อ… เรื่องนี้เรารับทราบว่ามีข่าวลือ และเราจะไม่ให้ข่าวลือมีผลต่อการพิจารณาครับ ทั้งข่าวลือที่จริงและไม่จริง"
    sold_at: { folder: taew_shop }
    reward: { money: 150, heart: 2, set_flag: cherd_q3_done, line: { from: cherd, text: "ขอบคุณสามร้อยสิบสี่รายชื่อ 🙏 ลุงจะขับให้ตรงเวลาทุกเที่ยว จนกว่าจะมีคำสั่งให้หยุด และถ้าหยุด… ลุงจะเดินไปส่งเอง" } }

  - id: cherd_q4
    npc: cherd
    title: "ที่นั่งข้างคนขับ"
    desc: "ผลการพิจารณาเส้นทางเจ้าเขียวออกแล้ว — ลุงเชิดต้องเลือกอนาคตของตัวเองกับรถ"
    start: { flag: cherd_q3_done, heart_min: 6, day_min: 19 }
    offer:
      npc: "ขนส่งส่งผลมาแล้ว ให้เลือกสองทาง วิ่งต่อแต่เหลือวันละสามเที่ยว หรือยกเส้นทางให้รถตู้แล้วรับเงินชดเชย… แล้วกล้ามาเสนอทางที่สาม สหกรณ์จะซื้อเจ้าเขียวเป็นรถชุมชน ลุงขับวันตลาดนัดกับรับส่งเด็ก หลานมานั่งข้างลุงเที่ยวเช้าวันมะรืนได้ไหม ลุงจะตัดสินใจบนรถ"
      options:
        - text: "{p}จะไปนั่งข้างลุง{k}"
          accept: true
          heart: 2
          reply: "ดีจ้ะ หกโมงตรง ลุงไม่รอนะ… ครั้งนี้ลุงรอ ห้านาที ห้านาทีเท่านั้น"
        - text: "ลุงคิดว่าจะเลือกอะไร{kq}"
          accept: true
          heart: 1
          reply: "ลุงยังไม่รู้จ้ะ ลุงคิดบนเตียงไม่ออก ลุงคิดออกแต่ตอนมือจับพวงมาลัย มาฟังลุงคิดบนรถนะ"
        - text: "ลุงตัดสินใจเองเถอะ{k}"
          heart: 0
          reply: "ได้จ้ะ ลุงตัดสินใจเองมาสามสิบปี แต่ที่นั่งข้างคนขับว่างนะ ถ้าเปลี่ยนใจ"
    steps:
      - goal: { type: days, n: 2 }
        hint: "รอ 2 วัน จนถึงเช้าวันที่ลุงเชิดนัด"
        done:
          npc: "พรุ่งนี้เช้านะหลาน หกโมงตรง ลุงล้างเจ้าเขียวไว้แล้วทั้งคัน ข้างขวาด้วย เอาน้ำบ่อวัดมาสามหาบ เจ้าเขียวต้องสวยวันที่ต้องตัดสินใจเรื่องตัวเอง"
          options:
            - text: "เจอกันหกโมง{k}"
              heart: 1
              reply: "ห้าโมงห้าสิบห้าดีกว่า เผื่อไว้ห้านาที ลุงไม่รอ… ลุงรอ ลุงพูดไปแล้ว ลุงแก่แล้วพูดกลับไปกลับมา"
            - text: "ลุงนอนหลับไหม{kq}"
              heart: 1
              reply: "ไม่หลับจ้ะ ลุงนั่งอ่านสมุดเจ็ดเล่มทั้งคืน อ่านถึงหน้าเมียลุงขึ้นรถครั้งแรก ปีสองห้าสามสอง นั่งแถวสาม ถือตะกร้ามะม่วง"
      - goal: { type: visit, place: bus_stop, from: "06:00", to: "06:30" }
        hint: "ไปขึ้นรถเที่ยวหกโมงเช้า นั่งข้างลุงเชิด (06:00–06:30)"
        done:
          npc: "นั่งเลยหลาน ที่นั่งนี้ไม่มีใครนั่งมาเจ็ดปี… รถออกแล้วนะ ลุงจะถามครั้งเดียว ลุงควรทำยังไงกับเจ้าเขียว"
          options:
            - text: "วิ่งต่อ{k}ลุง สามเที่ยวก็ยังเป็นเจ้าเขียว"
              heart: 2
              set_flag: cherd_end_saved
              reply: "สามเที่ยว… หกโมง เที่ยง หกโมงเย็น ช่วงว่างลุงจะจอดรถที่ป้ายให้คนแก่มานั่งรอในร่ม เจ้าเขียวจะเป็นศาลาที่มีล้อ ลุงจะเริ่มเล่มที่แปดวันนี้"
            - text: "ให้สหกรณ์ซื้อ{k} เจ้าเขียวจะเป็นรถของทุกคน"
              heart: 2
              set_flag: cherd_end_coop
              reply: "รถของทุกคน… ทาสีเขียวเหมือนเดิมนะ ลุงจะขับวันตลาดนัด รับเด็กไปโรงเรียน พาคนแก่ไปหาหมอ ไม่ต้องตรงเวลาเป๊ะแล้ว ลุงจะรอคนได้ทุกคน ลุงไม่เคยได้รอใครแบบสบายใจเลยในชีวิต"
              next:
                - text: "ลุงรอได้แล้วนะ{k}"
                  heart: 2
                  reply: "รอได้แล้วจ้ะ เมียลุงคงบอกว่า ‘ในที่สุด’ … ลุงจะติดรูปเขาไว้ที่นั่งข้างคนขับ เวลาไม่มีใครนั่ง"
