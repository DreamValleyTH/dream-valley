# ตั้ม — convos + quests (ตัวรอง 🖤)
convos:
  # ===== react =====
  - id: tam_r_meet
    topic: react
    once: true
    when: { not_flag: met_tam }
    npc: "ยินดีต้อนรับครับ… คุณคือหลานยายเพียร ผมรู้เพราะคุณเป็นคนเดียวในตำบลที่ผมไม่เคยเห็นหน้า และในตำบลนี้ คนที่ผมไม่เคยเห็นหน้ามีสองแบบ คนใหม่กับผี คุณมีเงา"
    set_flag: met_tam
    options:
      - text: "สวัสดี{k}พี่ ผีมาบ่อยจริงเหรอ{kq}"
        heart: 1
        reply: "คืนละสองสามรายครับ ซื้อธูป ซื้อนมเย็น ซื้อบุหรี่ ทุกรายจ่ายพอดีไม่ต้องทอน ผมสรุปว่าผีมีวินัยทางการเงินกว่าคนเป็น"
        next:
          - text: "พี่ไม่กลัวเลยเหรอ{kq}"
            heart: 1
            reply: "กลัวครับ แต่ผมกลัวลูกค้าที่ขอคืนของไม่มีใบเสร็จมากกว่า ผีไม่เคยขอคืนอะไร"
          - text: "เดี๋ยวพี่ก็หลอก{p}{k}"
            heart: 0
            reply: "ผมไม่หลอกลูกค้าครับ นโยบายบริษัท ผมแค่เล่าข้อมูลที่ไม่มีใครขอ"
      - text: "ข้าวเวฟกะเพรามีไหม{kq}"
        heart: 0
        reply: "มีครับ ล็อตนี้หมดอายุคืนนี้ ตอนใกล้หมดอายุอร่อยที่สุด อุ่นไหมครับ สองนาที"
      - text: "พี่ดูเหนื่อยนะ{k}"
        heart: 1
        reply: "ผมดูแบบนี้ตั้งแต่จบมหาวิทยาลัยครับ ไม่ใช่เหนื่อย มันคือหน้าตาของคนที่ใช้วุฒิไปกับเครื่องอุ่นข้าว"

  - id: tam_r_fainted
    topic: react
    when: { fainted_recent: true }
    npc: "ได้ข่าวว่าเมื่อคืนคุณโดนผีจับครับ ผมเปิดร้านอยู่ห่างไปสามร้อยเมตร ไฟเปิดอยู่ ผมก็เปิดอยู่ คราวหน้าวิ่งมาทางแสงนีออนนะครับ"
    options:
      - text: "{p}วิ่งไม่ทัน{k}"
        heart: 1
        reply: "ผมเข้าใจครับ ผมเคยวิ่งไม่ทันเหมือนกัน ตอนนั้นผมตื่นที่ รพ.สต. หมอแอนถามว่าทำงานที่ไหน ผมตอบว่าร้านที่คุณมาซื้อนมทุกคืน หมอทำหน้าผิดหวังในระบบ"
      - text: "พี่ไม่มาช่วยเลยนะ{kq}"
        heart: 0
        reply: "ผมออกจากเคาน์เตอร์ไม่ได้ครับ ถ้าผมออก ร้านไม่มีคนตื่น ถ้าร้านไม่มีคนตื่น ผีจะเข้าร้าน แล้วจะไม่มีที่ให้คนหนี ผมเป็นด่านสุดท้ายที่ไม่มีอาวุธ"
        next:
          - text: "พี่พูดเหมือนเป็นฮีโร่{k}"
            heart: 1
            reply: "ฮีโร่ค่าแรงขั้นต่ำครับ ไม่มีชุด มีแต่ยูนิฟอร์มที่ต้องซักเอง"
          - text: "ขอโทษ{k} {p}ไม่รู้"
            heart: 1
            reply: "ไม่เป็นไรครับ คนส่วนใหญ่คิดว่าร้านเปิดเองได้ เหมือนประตูอัตโนมัติ"

  - id: tam_r_well_dry
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "บ่อบ้านแม่ผมหลังคลองแห้งแล้วครับ ตอนนี้แม่อาบน้ำด้วยน้ำขวดจากร้านผม ผมใช้ส่วนลดพนักงานสิบเปอร์เซ็นต์ ผมกำลังขายน้ำให้แม่ตัวเองในราคาพนักงาน"
    options:
      - text: "แม่พี่โอเคไหม{kq}"
        heart: 2
        reply: "แม่บอกว่าไม่เป็นไรครับ แม่พูดประโยคนี้ตอนพ่อเสีย ตอนบ้านน้ำท่วม และตอนผมตกงานในเมือง ผมเลยรู้ว่ามันแปลว่าเป็นอะไร"
        next:
          - text: "ให้แม่มาอาบน้ำบ้าน{p}ก็ได้{k}"
            heart: 2
            reply: "…ผมจะบอกแม่ครับ แม่จะปฏิเสธสามครั้งก่อน แล้วจะมาพร้อมขนมครก ให้รับขนมด้วยนะครับ ไม่งั้นแม่จะไม่มาอีก"
          - text: "บริษัทต้องรับผิดชอบนะ{k}"
            heart: 1
            reply: "บริษัทสั่งน้ำดื่มร้านผมทีละห้าสิบแพ็คไปไซต์เจาะครับ คนดูดน้ำใต้ดินยังต้องซื้อน้ำดื่มจากผม แม่ผมก็ต้องซื้อ ผมยืนอยู่กลางวงจรนี้ทั้งคืน"
      - text: "ซื้อน้ำแพ็คให้แม่พี่ได้ไหม{kq}"
        heart: 1
        reply: "ได้ครับ แพ็คละหกสิบห้า คุณไม่ต้องทำก็ได้ แต่ถ้าทำ ผมจะยกไปส่งเองตอนเลิกกะ หกโมงเช้า เวลาที่แม่ผมตื่นพอดี"

  - id: tam_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "คืนนี้มีคนงานบริษัทสามคนมานั่งในร้านตั้งแต่สี่ทุ่มครับ ไม่ซื้ออะไรเลย นั่งเงียบหน้าตู้แช่ ผมถามว่าเป็นอะไร เขาบอกว่าไม่กล้ากลับไซต์"
    options:
      - text: "พี่ให้เขานั่งไหม{kq}"
        heart: 1
        reply: "ให้ครับ ร้านผมไม่เลือกว่าใครหนีผี คนดูดน้ำก็กลัวผีเท่ากับคนที่น้ำโดนดูด ผีทำให้ทุกคนเท่ากันเป็นเวลาสั้นๆ"
        next:
          - text: "เขาเล่าว่าเห็นอะไรไหม{kq}"
            heart: 1
            reply: "ผู้หญิงนุ่งผ้าซิ่นยืนข้างท่อบาดาล เอามือลูบท่อเหมือนลูบหัวลูก แล้วร้องไห้ ผมจดไว้ครับ เป็นเรื่องสั้นเรื่องที่สามสิบเอ็ด"
          - text: "พี่ขายข้าวเวฟให้เขาสิ{kq}"
            heart: 0
            reply: "ผมเสนอแล้วครับ เขาบอกกินไม่ลง เป็นครั้งแรกที่ผมเห็นคนปฏิเสธข้าวเวฟเพราะเหตุผลทางจิตวิญญาณ"
      - text: "พี่เห็นผีที่ไซต์ไหม{kq}"
        heart: 0
        reply: "ผมไม่ได้ไปครับ ร้านผมมีผีประจำอยู่แล้ว ผมไม่อยากนอกใจ"

  - id: tam_r_helped_may
    topic: react
    once: true
    when: { flag: helped_may }
    npc: "เมื่อคืนตีหนึ่งกล้องหน้าร้านจับภาพคุณกับเมย์เดินผ่านไปทางไซต์บาดาลครับ ถือไฟฉายคนละอัน ผมลบไฟล์แล้ว บอกไว้เฉยๆ"
    options:
      - text: "พี่ลบให้ทำไม{kq}"
        heart: 2
        reply: "กล้องบันทึกย้อนหลังเจ็ดวันครับ ถ้ามีคนจากบริษัทมาขอดู ผมจะบอกว่าคืนนั้นมีแต่แมว ซึ่งไม่ผิด แมวส้มเดินผ่านจริงตอนตีหนึ่งห้านาที"
        next:
          - text: "พี่จะเดือดร้อนไหม{kq}"
            heart: 1
            reply: "ผู้จัดการเขตไม่มีตัวตนครับ ไม่มีใครดูไฟล์นอกจากผม ระบบที่ไม่มีใครสนใจ บางครั้งก็มีประโยชน์"
          - text: "ขอบคุณ{k}พี่ตั้ม"
            heart: 2
            reply: "ไม่เป็นไรครับ เมย์ซื้อกาแฟผมทุกคืนวันศุกร์ คุณซื้อนมเย็นทุกคืน ผมปกป้องลูกค้าประจำ เป็นนโยบายของผมเอง"
      - text: "ไม่ใช่{p}หรอก{k}"
        heart: 0
        reply: "ครับ ไม่ใช่คุณ คนในกล้องแค่หน้าเหมือนคุณ เดินเหมือนคุณ และซื้อนมเย็นแก้วเดียวกับคุณก่อนออกไป บังเอิญมากครับ"

  - id: tam_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ถังน้ำ CSR ที่บริษัทแจก ส่งมาวางหน้าร้านผมสองร้อยใบครับ ให้ผมแจกต่อ ไม่มีค่าแรงเพิ่ม ผมกลายเป็นจุดกระจายภาพลักษณ์ของบริษัทที่ทำให้บ่อแม่ผมแห้ง"
    options:
      - text: "พี่แจกไหม{kq}"
        heart: 1
        reply: "แจกครับ ถังไม่มีความผิด ผมแปะกระดาษบนถังทุกใบว่า ‘ต้มน้ำก่อนดื่ม – ภก.มด’ เป็นการประท้วงที่สุภาพที่สุดที่ผมทำได้"
      - text: "ทำไมพี่ไม่ปฏิเสธ{kq}"
        heart: 0
        reply: "สำนักงานใหญ่เซ็นสัญญากับบริษัทแล้วครับ ร้านผมเป็นพาร์ตเนอร์ ผมเป็นแค่คนที่ยืนอยู่ตรงจุดที่สัญญามาถึง ไม่มีใครถามผม ระบบไม่เคยถามคนกะดึก"
        next:
          - text: "พี่ควรได้ถูกถามบ้าง{k}"
            heart: 2
            reply: "…ผมจะจดประโยคนี้ไว้ข้างใบปริญญาครับ ข้างประโยคที่คุณพูดครั้งก่อน มุมนั้นเริ่มเต็มแล้ว"
          - text: "งั้นแจกไปเถอะ{k}"
            heart: 0
            reply: "ครับ ผมแจกอยู่แล้ว แค่บ่นให้ใครสักคนฟังก่อน การบ่นเป็นสวัสดิการเดียวที่พนักงานกะดึกมี"

  - id: tam_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ช่วงหาเสียงเริ่มแล้วครับ มีคนมาถ่ายสำเนาบัตรประชาชนสามพันแผ่น ถ่ายครั้งเดียว เครื่องถ่ายเอกสารร้านผมร้อนจนกลิ่นไหม้ ผมว่ามันคือผู้ชนะการเลือกตั้งตัวจริง"
    options:
      - text: "ถ่ายไปทำอะไร{kq}"
        heart: 1
        reply: "ผมไม่ถามครับ แต่เขาถ่ายบัตรคนแก่ทั้งตำบล รับรองสำเนาถูกต้องด้วยลายมือเดียวกันหมด ผมแค่สังเกตว่าลายมือนั้นสวยมาก"
        next:
          - text: "แบบนี้ไม่ผิดเหรอ{kq}"
            heart: 1
            reply: "ผิดหรือไม่ผิดผมไม่รู้ครับ ผมรู้แค่ว่าแผ่นละหนึ่งบาท เขาจ่ายครบ ร้านผมได้ยอดดีที่สุดของเดือน ผมรู้สึกเหมือนรับเงินทอนที่ไม่ใช่ของผม"
          - text: "บอกพี่เมย์สิ{k}"
            heart: 1
            reply: "ผมเก็บกระดาษที่ถ่ายเสียไว้สามแผ่นครับ อยู่ในล็อกเกอร์ ข้างใบปริญญา ผมไม่รู้จะทำอะไรกับมัน แต่ไม่ได้ทิ้ง"
      - text: "พี่จะเลือกใคร{kq}"
        heart: 0
        reply: "คนที่ไม่มีรถแห่ครับ ถ้าไม่มีใครแบบนั้น ผมจะเลือกนอนกลางวัน ซึ่งเป็นสิทธิ์ที่ผมใช้ไม่ค่อยได้"

  - id: tam_r_end_stay
    topic: react
    once: true
    when: { flag: tam_end_stay }
    npc: "ช่อง ‘กะดึกดงเย็น’ มีคนติดตามสามร้อยสิบสองคนแล้วครับ คลิปล่าสุดเป็นป้าแต๋วเล่าเรื่องผีโพง ยอดวิวสูงกว่าคลิปผีจริงของผมสามเท่า ผมยอมรับความพ่ายแพ้อย่างภูมิใจ"
    options:
      - text: "พี่ดูมีความสุขขึ้นนะ{k}"
        heart: 2
        reply: "หน้าผมยังเหมือนเดิมครับ แต่ผมหลับกลางวันได้หกชั่วโมงแล้ว จากสี่ชั่วโมง ร่างกายผมคงรู้ว่าผมทำอะไรที่อยากทำบ้างแล้ว"
      - text: "ถ่ายคลิป{p}บ้างสิ{k}"
        heart: 1
        reply: "ได้ครับ ตอนคุณรดน้ำผักตอนเช้า ผมจะตั้งชื่อว่า ‘คนที่หนีกรุงเทพฯ มาได้’ น่าจะมีคนดูเยอะ คนในเมืองชอบดูสิ่งที่ตัวเองยังทำไม่ได้"

  # ===== news =====
  - id: tam_n_selfcheckout
    topic: news
    npc: "สำนักงานใหญ่ส่งเครื่องคิดเงินอัตโนมัติมาแล้วครับ วางข้างเคาน์เตอร์ผม มันพูดได้ว่า ‘ยินดีต้อนรับ’ เสียงสดใสกว่าผมมาก ผมกำลังถูกแทนที่ด้วยสิ่งที่ร่าเริงกว่า"
    options:
      - text: "พี่จะตกงานไหม{kq}"
        heart: 1
        reply: "ยังครับ เครื่องกลัวผี ตีสามมันค้างทุกคืน ต้องมีคนกดรีเซ็ต คนนั้นคือผม ผมยังมีงานเพราะเครื่องจักรขี้ขลาด"
        next:
          - text: "ผีช่วยพี่ไว้นะ{k}"
            heart: 1
            reply: "ครับ ผมเลยซื้อนมเย็นไว้หน้าร้านหนึ่งแก้วทุกคืน ไม่รู้ให้ใคร แต่ผมรู้สึกว่าควรขอบคุณ"
          - text: "ไปหางานอื่นเถอะ{k}"
            heart: 0
            reply: "ผมหาครับ ทุกที่ต้องการประสบการณ์ห้าปีกับทักษะที่ผมได้เรียน แต่ไม่ได้ใช้ ผมมีทั้งสองอย่าง แต่อย่างหลังขึ้นสนิมแล้ว"
      - text: "เครื่องพูดเพราะกว่าพี่จริงไหม{kq}"
        heart: 0
        reply: "จริงครับ แต่มันพูดยินดีต้อนรับกับแมวด้วย ผมไม่เคยพูดกับแมว ผมพูดกับแมวว่า ‘ไม่มีปลาทู’ มันเข้าใจผมมากกว่า"

  - id: tam_n_regular_ghost
    topic: news
    npc: "ลูกค้าประจำตีสองของผม ป้าใส่เสื้อลายดอก ซื้อธูปหนึ่งห่อทุกคืน ไม่มาสามคืนแล้วครับ ผมเป็นห่วง ไม่รู้ว่าป้าเป็นผีหรือคน แต่เป็นห่วงเท่ากัน"
    options:
      - text: "อาจเป็นคนก็ได้นะ{kq}"
        heart: 1
        reply: "ผมเคยคิดครับ แต่ป้าจ่ายเหรียญที่ผลิตปีสองห้าสองสามทุกครั้ง แล้วไม่เคยมีใครในตำบลรู้จักป้า แม้แต่ป้าแต๋ว ซึ่งเป็นไปไม่ได้ทางสถิติ"
        next:
          - text: "{p}จะช่วยถามป้าแต๋วอีกที{k}"
            heart: 1
            reply: "ป้าแต๋วจะเล่าทั่วตำบลภายในชั่วโมงครับ แล้วคืนนั้นจะมีคนมารอดูหน้าร้านยี่สิบคน ป้าลายดอกคงไม่มาอีกเลย ปล่อยไปดีกว่าครับ"
          - text: "พี่ผูกพันกับลูกค้าเยอะจัง{k}"
            heart: 2
            reply: "ลูกค้ากะดึกเป็นคนเดียวที่ผมเจอทุกคืนครับ คนอื่นในชีวิตผมเจอเดือนละครั้ง ผมผูกพันกับคนที่อยู่ ไม่ว่าเขาจะมีชีพจรหรือเปล่า"
      - text: "ผีซื้อธูปไปทำไม{kq}"
        heart: 0
        reply: "ผมเดาว่าไปไหว้ใครสักคนครับ ผีก็อาจมีคนที่คิดถึงเหมือนกัน"

  - id: tam_n_wage
    topic: news
    npc: "ข่าวดีครับ ค่าแรงขั้นต่ำขึ้นเจ็ดบาท ข่าวร้ายคือข้าวเวฟขึ้นห้าบาท ผมคำนวณแล้ว ผมรวยขึ้นวันละสองบาท ถ้ากินข้าวเวฟวันละมื้อเดียว"
    options:
      - text: "สองบาทก็ยังดี{k}"
        heart: 1
        reply: "ครับ ผมจะเก็บไว้ ปีหน้าได้เจ็ดร้อยสามสิบบาท พอซื้อกาแฟดริปร้านกาแฟในตำบลได้สิบห้าแก้ว เป็นเป้าหมายระยะยาวที่ชัดเจนที่สุดในชีวิตผม"
      - text: "นักการเมืองบอกว่าขึ้นสามร้อยต่อวันนี่{kq}"
        heart: 1
        reply: "บอกตอนหาเสียงครับ ตอนนี้บอกว่า ‘กำลังศึกษาความเป็นไปได้’ ผมคิดว่าความเป็นไปได้น่าจะเป็นนักศึกษาที่เรียนนานที่สุดในประเทศ"

  - id: tam_n_atm
    topic: news
    npc: "ตู้ ATM ในร้านผมถูกกดเงินหมดตู้ตอนตีหนึ่งเมื่อคืนครับ คนกดใส่เสื้อบริษัท กดเต็มวงเงินสิบบัตร ผมไม่ได้สอดรู้ ผมนับบัตร"
    options:
      - text: "เขากดไปทำอะไร{kq}"
        heart: 1
        reply: "ผมไม่รู้ครับ แต่วันรุ่งขึ้นมีข่าวในกลุ่มว่าบริษัทแจกเงินช่วยเหลือ ‘ครอบครัวที่บ่อแห้ง’ เป็นเงินสด ไม่มีใบเสร็จ ผมแค่วางสองข้อมูลนี้ไว้ใกล้กันเฉยๆ"
      - text: "เงินในตู้หมดแล้วคนอื่นทำไง{kq}"
        heart: 0
        reply: "รอธนาคารเติมพรุ่งนี้เที่ยงครับ ลุงสมหมายมากดตอนตีห้าเพื่อซื้อหวย ไม่ได้ ลุงบอกว่าเป็นลางร้าย งวดนั้นลุงประหยัดไปพันห้า ลางดีที่สุดในชีวิตลุง"

  - id: tam_n_heng_coffee
    topic: news
    when: { flag: heng_q1_tam_mom }
    npc: "เสี่ยเฮงมาซื้อกาแฟร้านผมทุกวันครับ วันละสิบแก้ว แจกคนงานลาน ผมคำนวณแล้ว ถ้าซื้อแบบนี้สองปี จะเท่ากับดอกเบี้ยที่แม่ผมจ่ายเสี่ยไปพอดี"
    options:
      - text: "เสี่ยคืนเงินแบบเนียนๆ{k}"
        heart: 2
        reply: "ผมรู้ครับ เสี่ยก็รู้ว่าผมรู้ เราไม่พูดเรื่องนี้ เสี่ยแค่สั่งกาแฟ ผมแค่ชง เป็นการขอโทษที่มีรสหวานน้อยที่สุดที่ผมเคยได้รับ"
      - text: "พี่ยังโกรธเสี่ยไหม{kq}"
        heart: 1
        reply: "ไม่ครับ ผมงง คนที่ทั้งตำบลบอกว่าใจร้าย แอบขีดฆ่าหนี้แม่ผมแล้วไม่กล้าบอก ผมกำลังเขียนเรื่องสั้นเรื่องนี้ แต่เปลี่ยนเสี่ยเป็นผี จะได้ไม่มีใครเชื่อ"

  # ===== advice =====
  - id: tam_a_shelter
    topic: advice
    when: { time: evening }
    npc: "สามทุ่มแล้วถ้ายังอยู่ไกลบ้าน เข้าร้านผมไว้ก่อนครับ นอนในร้านตื่นมาแรงเหลือสามในสี่ ข้างนอกถ้าโดนผีจับเหลือครึ่ง ผมคำนวณให้แล้ว ร้านผมคุ้มกว่า"
    options:
      - text: "นอนในร้านได้จริงเหรอ{kq}"
        heart: 1
        reply: "ได้ครับ เก้าอี้พลาสติกหน้าตู้แช่สมชายสบายที่สุด อย่านอนพื้นนะครับ พื้นเป็นที่ของผมตอนตีสี่"
      - text: "ทำไมผีไม่เข้าร้าน{kq}"
        heart: 1
        reply: "ผมคิดว่าเพราะมีคนตื่นอยู่ครับ ผีไม่ชอบที่ที่มีคนตื่น ผมเลยตื่น เป็นหน้าที่ที่ไม่มีในสัญญาจ้าง"
        next:
          - text: "พี่ไม่ง่วงเหรอ{kq}"
            heart: 1
            reply: "ง่วงครับ ทุกคืน แต่ทุกครั้งที่มีคนวิ่งเข้ามาหอบๆ แล้วพูดว่า ‘ขอบคุณที่เปิด’ ผมก็ตื่นขึ้นอีกชั่วโมง"
          - text: "ถ้าพี่หลับล่ะ{kq}"
            heart: 0
            reply: "ผมเคยหลับครั้งหนึ่งครับ สิบนาที ตื่นมามีธูปจุดอยู่หน้าเคาน์เตอร์สามดอก ไม่มีใครเข้ามาตามกล้อง ผมไม่หลับอีกเลย"

  - id: tam_a_bills
    topic: advice
    npc: "จ่ายบิลที่ร้านผมค่าธรรมเนียมสิบบาทครับ ไปตั้งหักบัญชีอัตโนมัติที่ธนาคารฟรี ผมบอกทุกคน ผู้จัดการเขตไม่รู้ว่าผมพูด เพราะเขาไม่มีตัวตน"
    options:
      - text: "พี่บอกแบบนี้ร้านไม่เสียรายได้เหรอ{kq}"
        heart: 1
        reply: "เสียครับ เดือนละสามร้อยบาท สำนักงานใหญ่คงไม่สังเกต สำนักงานใหญ่สังเกตแค่ยอดขายบุหรี่กับเบียร์ ส่วนน้ำใจไม่มีรหัสสินค้า"
      - text: "ขอบคุณ{k} {p}จะไปตั้งที่ธนาคาร"
        heart: 1
        reply: "ดีครับ ไปก่อนเที่ยง หลังเที่ยงพนักงานธนาคารหน้าเหมือนผม คุยยากครับ"

  - id: tam_a_meals
    topic: advice
    npc: "ถ้ายุ่งจนไม่ได้กินข้าว ข้าวเวฟนับเป็นมื้อนะครับ ซาลาเปากับแซนด์วิชก็นับ ขนมไม่นับ ผมรู้เพราะผมใช้ชีวิตตามกฎนี้มาสามปี"
    options:
      - text: "พี่หน่อยบอกว่าข้าวเวฟไม่ใช่อาหาร{k}"
        heart: 1
        reply: "พี่หน่อยพูดถูกครับ ในทางจิตวิญญาณ ในทางร่างกาย มันพอกันตาย ผมเลือกฟังพี่หน่อยวันละมื้อ ฟังร่างกายวันละมื้อ"
      - text: "พี่ควรกินผักบ้างนะ{k}"
        heart: 1
        reply: "ข้าวเวฟกะเพรามีใบกะเพราสามใบครับ ผมนับ ถ้าคุณมีกะเพราในแปลง เอามาให้ผมกำหนึ่งได้ไหม ผมจะได้ผักครบสัปดาห์"
        next:
          - text: "ได้{k} เดี๋ยวเอามาให้"
            heart: 2
            reply: "ผมจะรอครับ ไม่ใช่รอผัก รอคนที่บอกว่าจะเอามาให้ ผมไม่ค่อยมีคนแบบนี้"
          - text: "ซื้อร้านป้าแต๋วสิ{kq}"
            heart: 0
            reply: "ร้านป้าแต๋วปิดก่อนผมตื่นครับ ชีวิตผมกับป้าแต๋วเหมือนกะสองกะที่ไม่เคยทับกัน ยกเว้นตอนป้ามาถามว่าใครซื้ออะไรเมื่อคืน"

  - id: tam_a_atm_fee
    topic: advice
    npc: "เวลากดเงินตู้ต่างธนาคาร ห้าครั้งแรกของเดือนฟรีครับ ครั้งที่หกเสียสิบห้าบาท ผมเห็นคนกดครั้งละห้าร้อยสิบครั้ง เสียค่าเข้าถึงเงินตัวเองเจ็ดสิบห้าบาท"
    options:
      - text: "ทำไมเขาไม่กดทีเดียว{kq}"
        heart: 1
        reply: "เพราะเขาไม่อยากเห็นตัวเลขยอดคงเหลือลดฮวบทีเดียวครับ ลดทีละห้าร้อยมันเจ็บน้อยกว่า ผมเข้าใจ ผมก็ดูยอดหนี้กองทุนทีละเดือน ไม่ดูทั้งก้อน"
      - text: "พี่รู้เรื่องเงินดีนะ{k}"
        heart: 1
        reply: "คนไม่มีเงินรู้เรื่องเงินดีที่สุดครับ เหมือนคนอดนอนรู้เรื่องการนอนดีที่สุด"

  # ===== smalltalk =====
  - id: tam_s_fridge
    topic: smalltalk
    npc: "ตู้แช่สมชายเสียแล้วครับ ช่างมาเปลี่ยนเป็นตู้ใหม่ ผมยังไม่ได้ตั้งชื่อ มันเย็นเร็วกว่า เงียบกว่า แต่ผมยังไม่พร้อมจะผูกพัน"
    options:
      - text: "ตั้งชื่อว่าสมชายสองสิ{kq}"
        heart: 1
        reply: "ไม่ได้ครับ ไม่ยุติธรรมกับมัน มันต้องมีตัวตนของตัวเอง ผมจะสังเกตนิสัยมันสักสองอาทิตย์ ตอนนี้มันดูเหมือน ‘ประยูร’ แต่ยังไม่แน่ใจ"
      - text: "สมชายตัวเก่าไปไหน{kq}"
        heart: 2
        reply: "ไปโกดังที่อำเภอครับ ผมยืนส่งตอนรถมารับ ช่างถามว่ายืนทำอะไร ผมบอกว่ารอเซ็นใบรับของ ที่จริงผมยืนบอกลา"
        next:
          - text: "พี่น่ารักนะ{k}"
            heart: 1
            reply: "ผมไม่เคยได้ยินคำนี้ตั้งแต่อนุบาลครับ ผมจะเก็บไว้ในตู้แช่ตัวใหม่ เผื่อมันเย็นพอจะรักษาไว้ได้นาน"
          - text: "แปลกดีนะ{k}"
            heart: 0
            reply: "ครับ ผมทำงานคนเดียวกับเครื่องใช้ไฟฟ้ามาสามปี ความแปลกเป็นผลข้างเคียงที่คาดการณ์ได้"

  - id: tam_s_points
    topic: smalltalk
    npc: "คืนนี้มีลูกค้าถามว่าสะสมแต้มยังไง ผมดีใจมากครับ เป็นคนแรกในรอบสองเดือน แล้วเขาก็บอกว่าไม่สมัครหรอก ถามเฉยๆ"
    options:
      - text: "{p}สมัครให้{k}"
        heart: 2
        reply: "ผมจะกรอกให้ครับ ชื่อ เบอร์ วันเกิด… วันเกิดคุณผมจะจำไว้ ระบบจะส่งคูปองให้ ผมจะส่งข้าวเวฟให้ คุณจะได้สองอย่าง"
      - text: "แต้มเอาไปทำอะไรได้{kq}"
        heart: 0
        reply: "ห้าร้อยแต้มแลกแก้วน้ำครับ ผมมีสามพันแต้ม แลกแก้วมาหกใบ ผมอยู่คนเดียว ใช้แก้วเดียว อีกห้าใบเป็นอนุสาวรีย์ของการสะสม"

  - id: tam_s_moths
    topic: smalltalk
    when: { rain: true }
    npc: "ฝนตกแมลงเม่าบินเข้าไฟหน้าร้านเป็นพันตัวครับ ปีกร่วงเต็มพื้น ผมกวาดไปสามรอบ แล้วนั่งคิดว่ามันบินมาหาแสงทั้งที่รู้ว่าต้องเสียปีก"
    options:
      - text: "พี่คิดลึกจัง{k}"
        heart: 1
        reply: "ผมมีเวลาคิดครับ ตีสามไม่มีลูกค้า มีแต่แมลงเม่ากับความคิด แมลงเม่าเสียปีกครั้งเดียว ความคิดผมเสียปีกทุกคืน"
      - text: "เด็กๆ ชอบเอาไปทอดนะ{k}"
        heart: 1
        reply: "ป้าทองใบมาเก็บไปทอดเมื่อปีก่อนครับ แบ่งให้ผมจานหนึ่ง กรอบดี ผมกินแล้วรู้สึกผิดนิดหน่อยกับบทกวีที่เพิ่งคิด"

  - id: tam_s_receipt
    topic: smalltalk
    npc: "ผมอ่านใบเสร็จลูกค้าตอนว่างครับ ใบเสร็จบอกอะไรได้เยอะ เมื่อคืนมีคนซื้อนมจืดหนึ่งกล่อง ยาลดไข้เด็กหนึ่งแผง กับขนมหนึ่งซอง ตีสอง ผมรู้ว่ามีพ่อคนหนึ่งยังไม่ได้นอน"
    options:
      - text: "พี่ควรเป็นนักเขียนนะ{k}"
        heart: 2
        reply: "ผมเขียนอยู่ครับ ไม่มีใครอ่าน ใบเสร็จเป็นเรื่องสั้นที่สั้นที่สุดในโลก ผมแค่ต่อมันให้ยาวขึ้นในหัว"
      - text: "แบบนี้ละเมิดความเป็นส่วนตัวไหม{kq}"
        heart: 0
        reply: "ผมไม่เล่าชื่อใครครับ ผมเล่าแค่ว่าตีสองมีพ่อคนหนึ่ง ทุกตำบลมีพ่อแบบนี้ เรื่องนี้เป็นของทุกคน"

  - id: tam_s_bus
    topic: smalltalk
    when: { time: evening }
    npc: "หกโมงเย็นครับ รถเมล์ลุงเชิดเที่ยวสุดท้ายเพิ่งออก ผมดูมันผ่านหน้าร้านทุกเย็นมาสามปี ยังไม่เคยขึ้น"
    options:
      - text: "พี่อยากไปไหน{kq}"
        heart: 1
        reply: "ไม่รู้ครับ แค่อยากขึ้น เที่ยวสุดท้ายมันมีอะไรบางอย่าง เหมือนโอกาสที่บอกว่า ‘ครั้งนี้แล้วนะ’ ทุกวัน แล้วพรุ่งนี้ก็บอกอีก"
        next:
          - text: "พรุ่งนี้ขึ้นเลยสิ{kq}"
            heart: 1
            reply: "พรุ่งนี้ผมเข้ากะครับ พรุ่งนี้ของผมคือคืนนี้ซ้ำไปเรื่อยๆ ผมเริ่มเข้าใจดาบเสถียรแล้ว"
          - text: "ไว้วันหยุดไปด้วยกัน{k}"
            heart: 2
            reply: "…ได้ครับ ผมไม่มีวันหยุดในตารางแต่จะหามา ผมเพิ่งรู้ว่าผมไม่ได้อยากขึ้นรถ ผมอยากมีคนนั่งข้างๆ ตอนขึ้น"
      - text: "รถลุงเชิดยังวิ่งดีอยู่นะ{k}"
        heart: 0
        reply: "วิ่งดีครับ เสียงเครื่องเหมือนคนไอตอนตีห้า ผมฟังทุกเย็น ถ้าวันไหนไม่ได้ยิน ผมคงรู้สึกเหมือนตู้แช่สมชายหายไปอีกตัว"

  # ===== self =====
  - id: tam_f_degree
    topic: self
    npc: "ใบปริญญาผมแขวนในห้องพักพนักงาน ข้างตารางเวรล้างห้องน้ำครับ ผมย้ายมันไปแขวนที่อื่นไม่ได้ เพราะห้องอื่นในร้านมีแต่ตู้แช่"
    options:
      - text: "พี่จบอะไร{kq}"
        heart: 1
        reply: "นิเทศศาสตร์ครับ ภาพยนตร์ ผมได้เกียรตินิยมอันดับสอง ทักษะที่ผมใช้ทุกวันคือดูกล้องวงจรปิดแปดจอ ผมกำกับหนังเงียบที่ไม่มีใครดูคืนละแปดเรื่อง"
      - text: "ห้องน้ำกับปริญญาก็เป็นเพื่อนกันได้{k}"
        heart: 1
        reply: "ครับ ทั้งคู่สะอาด ทั้งคู่ผมดูแลเอง และทั้งคู่ไม่มีใครเห็นนอกจากผม"

  - id: tam_f_loan
    topic: self
    when: { heart_min: 3 }
    npc: "ผมผ่อนกองทุนกู้ยืมเพื่อการศึกษาเดือนละหนึ่งพันสองร้อยครับ เหลือเก้าปี ผมคำนวณแล้ว ผมจะผ่อนหมดตอนสามสิบหก อายุที่ผมคิดว่าน่าจะเลิกฝันพอดี"
    options:
      - text: "อย่าเลิกฝันเพราะหนี้สิ{k}"
        heart: 2
        reply: "ผมไม่ได้เลิกเพราะหนี้ครับ หนี้แค่บอกเวลา เหมือนนาฬิกาที่เดินถอยหลัง ทุกเดือนที่จ่ายผมรู้สึกว่ากำลังจ่ายค่าเช่าความฝันที่ไม่ได้อยู่"
        next:
          - text: "พี่ยังมีเวลา{k}"
            heart: 2
            reply: "คุณพูดเหมือนเชื่อจริงครับ ผมจะยืมความเชื่อของคุณไปใช้สักพัก ไม่มีดอกเบี้ยใช่ไหมครับ"
          - text: "{p}ก็มีหนี้การศึกษาเหมือนกัน{k}"
            heart: 1
            reply: "ยินดีต้อนรับสู่ชมรมครับ สมาชิกตลอดชีพ เราไม่มีการประชุม เพราะทุกคนต้องทำงานเพิ่ม"
      - text: "ทำไมไม่หางานเงินดีกว่านี้{kq}"
        heart: 0
        reply: "ผมสมัครไปสี่สิบที่ครับ ได้สัมภาษณ์สองที่ ทั้งสองที่ถามว่าทำไมทำงานร้านสะดวกซื้อสามปี ผมตอบว่าเพราะไม่มีใครรับ เขาไม่รับผมด้วยเหตุผลเดียวกัน"

  - id: tam_f_mom
    topic: self
    when: { heart_min: 5 }
    npc: "ผมเลือกกะดึกเพราะแม่ครับ กลางวันผมพาแม่ไปหาหมอแอน ไปตลาด ไปวัด ผมได้นอนบ่ายสองถึงห้าโมง ผมไม่ได้รักกะดึก ผมแค่รักกลางวันของแม่มากกว่ากลางวันของผม"
    options:
      - text: "แม่พี่รู้ไหม{kq}"
        heart: 2
        reply: "แม่คิดว่าผมชอบกลางคืนครับ ผมบอกแม่ว่าผมเป็นคนกลางคืน แม่เชื่อ แม่เป็นคนเดียวในโลกที่เชื่อทุกอย่างที่ผมพูด ผมเลยพูดแต่เรื่องที่ทำให้แม่สบายใจ"
        next:
          - text: "พี่เป็นลูกที่ดีมาก{k}"
            heart: 2
            reply: "…ผมไม่รู้ว่าลูกที่ดีหน้าตาเป็นยังไงครับ ผมรู้แค่ว่าวันไหนแม่ยิ้มที่ รพ.สต. ผมนอนหลับได้นานกว่าปกติ"
          - text: "พี่ควรนอนให้พอด้วยนะ{k}"
            heart: 1
            reply: "ภก.มดพูดแบบเดียวกันครับ พูดทุกเดือน ผมเริ่มคิดว่าพวกคุณประชุมกันลับหลังผม"
      - text: "พี่ไม่มีเวลาให้ตัวเองเลยนะ{k}"
        heart: 1
        reply: "ผมมีครับ ตีสามถึงตีห้า ไม่มีลูกค้า ไม่มีแม่ ไม่มีผี ผมเขียนหนังสั้นในหัว เป็นสองชั่วโมงที่เป็นของผมจริงๆ"

  - id: tam_f_daylight
    topic: self
    when: { heart_min: 7 }
    npc: "คุณรู้ไหมครับ ผมไม่ได้กลัวผี ผมกลัวกลางวัน กลางวันทุกคนถามว่าเรียนจบแล้วทำอะไร กลางคืนไม่มีใครถาม ผีไม่สนใจวุฒิ"
    options:
      - text: "{p}ไม่เคยถามพี่เรื่องนั้นเลยนะ{k}"
        heart: 2
        reply: "ผมรู้ครับ คุณเป็นคนกลางวันคนแรกที่ไม่ถาม คุณถามว่าผมเหนื่อยไหม ผมเลยเริ่มคิดว่ากลางวันอาจไม่น่ากลัวทั้งหมด"
        next:
          - text: "มาเดินกลางวันด้วยกันไหม{kq}"
            heart: 2
            reply: "ได้ครับ ผมจะใส่แว่นกันแดด ไม่ใช่เพราะแดด เพราะผมไม่อยากให้ใครเห็นว่าผมตื่นเต้น"
          - text: "กลางวันก็มีคนดีนะ{k}"
            heart: 1
            reply: "ครับ ผมกำลังรวบรวมหลักฐาน ตอนนี้มีคุณ พี่หน่อย ภก.มด กับแม่ สี่คน ยังน้อยกว่าผีประจำของผม แต่ใกล้แล้ว"
      - text: "พี่ก็ตอบไปตรงๆ สิ{kq}"
        heart: 0
        reply: "ผมตอบแล้วครับ ‘ทำงานร้านสะดวกซื้อ’ แล้วเขาทำหน้าแบบนั้น หน้าที่คุณเพิ่งทำเมื่อกี้เบาๆ นั่นแหละครับ"

  # ===== others =====
  - id: tam_o_sathian
    topic: others
    npc: "ดาบเสถียรนั่งในร้านผมตั้งแต่สี่ทุ่มถึงตีสี่ทุกคืนครับ สั่งกาแฟกระป๋องเดียว บอกว่าจ่ายพรุ่งนี้ บิลค้างดาบยาวกว่าใบปริญญาผมแล้ว ผมแขวนมันไว้ข้างกัน"
    options:
      - text: "พี่ไม่ทวงดาบเลยเหรอ{kq}"
        heart: 1
        reply: "ผมทวงครับ ดาบตอบว่า ‘ดาบนั่งตรงนี้ ร้านตั้มไม่เคยโดนปล้น ค่ากาแฟถือเป็นค่าจ้าง’ ผมคิดแล้วมันสมเหตุสมผลกว่าเงินเดือนผมอีก"
        next:
          - text: "ดาบหลับทั้งคืนไม่ใช่เหรอ{kq}"
            heart: 1
            reply: "ครับ แต่หลับในชุดตำรวจ ผมว่าชุดทำงานแทนดาบ ผมเลยจ่ายค่ากาแฟให้ชุด ไม่ได้จ่ายให้ดาบ"
          - text: "ดีแล้วมีคนอยู่เป็นเพื่อน{k}"
            heart: 2
            reply: "…ใช่ครับ ผมไม่เคยพูดออกมา แต่คืนที่ดาบลาป่วย ผมเปิดวิทยุทั้งคืน ร้านเงียบเกินไป"
      - text: "แจ้งผู้กำกับเลย{k}"
        heart: 0
        reply: "ผมเคยแจ้งครับ ผู้กำกับมานั่งด้วยอีกคน ตอนนี้ร้านผมมีตำรวจหลับสองคน ปลอดภัยเป็นสองเท่า กาแฟค้างเป็นสองเท่า"

  - id: tam_o_cherd
    topic: others
    npc: "ลุงเชิดแวะซื้อกาแฟเย็นก่อนเที่ยวหกโมงทุกวันครับ วันนี้ลุงบอกว่าผู้โดยสารเหลือสองคน ลุงพูดเหมือนนับคนที่ยังอยู่ ไม่ใช่นับผู้โดยสาร"
    options:
      - text: "ลุงดูเศร้าไหม{kq}"
        heart: 1
        reply: "ลุงไม่เคยดูเศร้าครับ ลุงดูตรงเวลา แต่วันนี้ลุงยืนรอกาแฟนานกว่าปกติสามสิบวินาที สำหรับลุงเชิด สามสิบวินาทีคือการร้องไห้"
      - text: "พี่ขึ้นรถลุงบ้างสิ{kq}"
        heart: 0
        reply: "ผมเข้ากะตอนรถออกครับ เราสองคนเจอกันตรงจุดเปลี่ยนกะของตำบลทุกวัน ลุงไปผมอยู่ ลุงกลับผมยังอยู่"

  - id: tam_o_noi
    topic: others
    npc: "พี่หน่อยเอาเกาเหลามาให้อีกแล้วครับ ห่อมาในถุงพร้อมโน้ตว่า ‘ห้ามอุ่นในเวฟ’ ผมไม่เข้าใจว่าพี่หน่อยรู้ได้ยังไงว่าผมอุ่นทุกอย่างในเวฟ"
    options:
      - text: "พี่หน่อยใจดีนะ{k}"
        heart: 1
        reply: "พี่หน่อยใจดีแบบขู่ครับ บอกว่าถ้าไม่กินจะไม่ซื้อน้ำแข็งร้านผมอีก เป็นภัยคุกคามที่ทำให้ผมได้กินผักสัปดาห์ละสามครั้ง"
      - text: "แล้วพี่อุ่นไหม{kq}"
        heart: 0
        reply: "อุ่นครับ ยี่สิบวินาที ในฐานะคนกะดึก ผมต้องมีอิสรภาพบางอย่างที่ระบบควบคุมไม่ได้ แม้จะเป็นเกาเหลา"

  - id: tam_o_may
    topic: others
    npc: "เมย์มานั่งพิมพ์ข่าวในร้านผมทุกคืนวันศุกร์ครับ บอกว่าไวไฟดีที่สุดในตำบล ผมรู้สึกภูมิใจกับไวไฟ ซึ่งผมไม่ได้ทำอะไรกับมันเลย"
    options:
      - text: "พี่เมย์เขียนข่าวอะไร{kq}"
        heart: 1
        reply: "ผมไม่ดูครับ แต่เมื่อคืนวันศุกร์มีรถเก๋งสีดำจอดหน้าร้านสองชั่วโมง ไม่มีใครลงมาซื้ออะไร ผมให้เมย์ออกประตูหลัง ผมไม่ได้ดูข่าว แต่ผมดูรถ"
        next:
          - text: "พี่ช่วยพี่เมย์ไว้นะ{k}"
            heart: 2
            reply: "ผมแค่เปิดประตูหลังครับ ประตูนั้นมีไว้ทิ้งขยะ คืนนั้นมันมีประโยชน์ที่สุดในประวัติของมัน"
          - text: "บอกดาบสิ{k}"
            heart: 0
            reply: "ดาบหลับอยู่ในร้านตอนนั้นครับ ผมไม่อยากปลุก ถ้าปลุก ดาบจะต้องเขียนบันทึก แล้วรถสีดำจะรู้ว่ามีคนเห็น"
      - text: "ไวไฟร้านพี่ดีจริงเหรอ{kq}"
        heart: 0
        reply: "ดีกว่าที่อื่นครับ เพราะที่อื่นไม่มี การเป็นที่หนึ่งในตำบลง่ายกว่าที่คิด"

  - id: tam_o_mod
    topic: others
    npc: "ภก.มดร้านยาข้างๆ ครับ เราสองคนไม่ค่อยคุยกัน แต่เวลาร้านเขาปิดสองทุ่ม เขายืนมองร้านผมสามวินาทีก่อนกลับ ผมพยักหน้า เขาพยักหน้า เป็นมิตรภาพที่ประหยัดคำพูดที่สุดในตำบล"
    options:
      - text: "พวกพี่น่ารักดี{k}"
        heart: 1
        reply: "ภก.มดคงไม่ชอบคำนี้ครับ เขาจะบอกว่า ‘ข้อมูลไม่เพียงพอ’ ผมจะบอกว่า ‘ยินดีต้อนรับ’ แล้วเราก็กลับไปทำงาน"
      - text: "ทำไมไม่คุยกันเลย{kq}"
        heart: 0
        reply: "เราคุยครับ ผ่านคนอื่น ภก.บอกคุณว่าผมขาดวิตามินดี ผมบอกคุณว่าภก.กลัวผี เราต่างใช้คุณเป็นไปรษณีย์"

quests:
  - id: tam_q1
    npc: tam
    title: "ลูกค้าตีสาม"
    desc: "ตั้มอยากให้มีพยานสักคน ว่าลูกค้ากะดึกของเขามีจริง"
    start: { heart_min: 2, day_min: 4 }
    offer:
      npc: "คุณครับ ผมเขียนเรื่องสั้นเรื่องลูกค้ากะดึกมาสามสิบเรื่อง ไม่มีใครเชื่อว่ามาจากเรื่องจริง ผมอยากได้พยานหนึ่งคน คืนนี้มานั่งในร้านได้ไหมครับ ผมเลี้ยงข้าวเวฟ"
      options:
        - text: "ได้{k} {p}จะเอาข้าวเหนียวหมูปิ้งไปฝาก"
          accept: true
          heart: 2
          reply: "…ข้าวเหนียวหมูปิ้งร้อนๆ ตอนกะดึก คุณรู้จุดอ่อนผมได้ยังไงครับ ผมจะทำเป็นไม่ตื่นเต้น"
        - text: "พี่จะให้{p}เจอผีเหรอ{kq}"
          accept: true
          heart: 0
          reply: "ผมไม่รับประกันครับ ผีไม่ได้มาตามตาราง แต่ผมรับประกันว่าจะไม่เหงา อย่างน้อยฝั่งผม"
        - text: "{p}ไม่ออกจากบ้านตอนกลางคืน{k}"
          heart: 0
          reply: "ตัดสินใจถูกต้องครับ ผมจะเขียนเรื่องที่สามสิบเอ็ดโดยไม่มีพยานเหมือนเดิม"
    steps:
      - goal: { type: give, npc: tam, item: moo_ping, n: 1 }
        hint: "ซื้อข้าวเหนียวหมูปิ้งที่ตลาดไปฝากตั้ม"
        done:
          npc: "ยังอุ่นอยู่ครับ… ผมจะเก็บไว้กินตีสอง ตอนที่ใจผมอ่อนแอที่สุด แล้วคืนนี้มานะครับ สี่ทุ่ม ผมเตรียมเก้าอี้ไว้หน้าตู้แช่"
          options:
            - text: "กินตอนนี้เลยสิ{kq} อุ่นๆ"
              heart: 1
              reply: "ไม่ได้ครับ ผมต้องมีอะไรให้รอคอยตอนตีสอง ไม่งั้นตีสองจะเป็นแค่ตีสอง"
            - text: "เจอกันสี่ทุ่ม{k}"
              heart: 1
              reply: "ครับ ผมจะบอกผีประจำว่าคืนนี้มีแขก เผื่อเขาอยากแต่งตัว"
      - goal: { type: visit, place: store24, from: "22:00", to: "23:59" }
        hint: "ไปนั่งเป็นพยานที่ร้าน 24 ชม. ตอนดึก (22:00–24:00)"
        done:
          npc: "สี่ทุ่มห้าสิบ ลูกค้าคนนั้นมาครับ ผู้ชายใส่เสื้อนักเรียนเก่าๆ ซื้อบะหมี่ถ้วยหนึ่ง วางเหรียญสิบห้าบาทพอดี แล้วเดินออกไปตอนประตูยังไม่ทันเปิด… คุณเห็นใช่ไหมครับ"
          options:
            - text: "เห็น{k} เขาเดินทะลุประตู"
              heart: 2
              set_flag: tam_q1_saw
              reply: "คุณเห็นจริงๆ… ผมไม่ได้บ้า ผมไม่ได้บ้าครับ ผมเขียนมาสามปีโดยคิดว่าตัวเองอาจจะบ้า ขอบคุณครับ นี่คือคำขอบคุณที่จริงใจที่สุดที่ผมพูดในร้านนี้"
            - text: "ไม่เห็น{k} พี่อาจจะง่วง"
              heart: 1
              reply: "อาจจะครับ ผมง่วงทุกคืน… แต่เหรียญสิบห้าบาทยังอยู่บนเคาน์เตอร์ เป็นเหรียญปีสองห้าสามสอง ไม่เป็นไรครับ ผมจะเขียนว่ามีพยานที่ไม่เห็น ก็เป็นเรื่องสั้นที่ดีเหมือนกัน"
    sold_at: { moo_ping: market }
    reward: { money: 100, heart: 2, items: { snack: 3 }, set_flag: tam_q1_done, line: { from: tam, text: "ร้าน 24 ชม. เปิดตลอดคืนเหมือนเดิมครับ ใครกลับบ้านไม่ทันสามทุ่ม แวะได้ มีเก้าอี้เพิ่มหนึ่งตัวแล้ว 🪑" } }

  - id: tam_q2
    npc: tam
    title: "หนังสั้นเรื่องกะดึก"
    desc: "ตั้มจะถ่ายหนังสั้นในร้าน ต้องหานักแสดงกับของประกอบฉาก"
    start: { flag: tam_q1_done, heart_min: 3, day_min: 9 }
    offer:
      npc: "คุณครับ… ผมอยากถ่ายหนังสั้นเรื่อง ‘กะดึก’ ในร้านนี้ ใช้โทรศัพท์ถ่าย ผมไม่ได้จับกล้องมาสามปี มือผมอาจสั่น ช่วยผมหานักแสดงกับของประกอบฉากได้ไหมครับ"
      options:
        - text: "ได้เลย{k} ต้องการอะไรบ้าง{kq}"
          accept: true
          heart: 2
          reply: "นักแสดงหนึ่งคน บทตำรวจที่หลับอยู่ในร้าน กับขนมสามซองวางบนเคาน์เตอร์ แทนของที่ผีซื้อ… บทตำรวจผมคิดว่ามีคนเหมาะที่สุดในประเทศอยู่แล้ว"
        - text: "{p}ขอเล่นเป็นผีได้ไหม{kq}"
          accept: true
          heart: 1
          reply: "ได้ครับ คุณมีหน้าที่เหมาะ หมายถึงหน้าที่ต้องเล่น ไม่ใช่หน้าคุณ… ผมพูดผิด ผมตื่นเต้น"
        - text: "ไว้ก่อนนะ{kq}"
          heart: 0
          reply: "ครับ ผมรอได้ ผมรอมาสามปีแล้ว"
    steps:
      - goal: { type: talk, npc: sathian }
        hint: "ไปชวนดาบเสถียรมาเล่นบทตำรวจหลับในร้าน"
        done:
          npc: "เล่นหนังเหรอ บทตำรวจที่หลับอยู่ในร้านสะดวกซื้อ… ดาบไม่ต้องซ้อมนะ ดาบเล่นทุกคืนอยู่แล้ว แต่มีเงื่อนไข ดาบขอหลับจริง ไม่เอาแกล้งหลับ แกล้งหลับมันเหนื่อย"
          options:
            - text: "ได้{k}ดาบ หลับจริงเลย"
              heart: 1
              reply: "ดี ดาบจะเป็นนักแสดงที่สมจริงที่สุดในอำเภอ ถ้าได้รางวัล บอกเขาว่าดาบรับพรุ่งนี้"
            - text: "ดาบเล่นเป็นตำรวจที่ตื่นได้ไหม{kq}"
              heart: 0
              reply: "นั่นมันหนังแฟนตาซีแล้ว ดาบไม่ถนัดแนวนั้น"
      - goal: { type: have, item: snack, n: 3 }
        hint: "มีขนมขบเคี้ยว 3 ซองไว้เป็นของประกอบฉาก"
        done:
          npc: "ขนมสามซอง… คุณซื้อจากร้านผมใช่ไหมครับ ผมขายของประกอบฉากให้หนังตัวเอง ยอดขายผมขึ้นเพราะความฝันผม เป็นวงจรที่แปลกที่สุดในชีวิต"
          options:
            - text: "ถือว่าลงทุน{k}"
              heart: 1
              reply: "ครับ ผมจะใส่ชื่อคุณในเครดิตท้ายเรื่อง ‘ผู้สนับสนุนขนม’ ตัวหนังสือใหญ่กว่าชื่อผู้กำกับ"
            - text: "เอาไปกินหลังถ่ายด้วย{k}"
              heart: 1
              reply: "ครับ ผมจะกินซองหนึ่ง ดาบกินซองหนึ่ง อีกซองวางไว้หน้าร้านให้ผีประจำ ถ้าเขามาดูการถ่ายทำ"
      - goal: { type: visit, place: store24, from: "21:00", to: "23:30" }
        hint: "ไปถ่ายหนังที่ร้าน 24 ชม. ตอนกลางคืน (21:00–23:30)"
        done:
          npc: "คัท… ถ่ายครบแล้วครับ ดาบหลับจริงสามเทค ประตูอัตโนมัติเปิดเองตอนเทคสุดท้าย ไม่มีใครเดินผ่าน ผมไม่ได้หยุดกล้อง… ผมได้ฉากที่ดีที่สุดในชีวิต และผมไม่รู้ว่าใครเป็นคนเล่น"
          options:
            - text: "ส่งประกวดเลย{k}พี่"
              heart: 2
              set_flag: tam_q2_contest
              reply: "ผมจะตัดต่อคืนนี้ครับ ไม่นอน ผมไม่นอนอยู่แล้ว แต่ครั้งนี้ไม่นอนเพราะอยากทำ ไม่ใช่เพราะต้องทำ ความรู้สึกต่างกันมาก"
            - text: "โพสต์ในกลุ่ม LINE หมู่บ้านก่อนสิ{k}"
              heart: 1
              set_flag: tam_q2_line
              reply: "กลุ่มหมู่บ้าน… ผู้ชมที่ไม่มีวันให้คะแนนดีกว่าสติกเกอร์สวัสดีวันจันทร์ ได้ครับ ผมจะลอง ผมชินกับการไม่มีคนดู"
    sold_at: { snack: store24 }
    reward: { money: 150, heart: 2, set_flag: tam_q2_done, line: { from: tam, text: "🎬 หนังสั้นเรื่อง ‘กะดึก’ ถ่ายเสร็จแล้วครับ ขอบคุณนักแสดง (ดาบเสถียร) ผู้สนับสนุนขนม และ… ใครไม่รู้ที่เปิดประตูตอนเทคสุดท้าย" } }

  - id: tam_q3
    npc: tam
    title: "คลิปหลุด"
    desc: "หนังของตั้มถูกแชร์จนบริษัทในกรุงเทพฯ ติดต่อมาชวนไปทำงาน — แต่แม่เขาอยู่ที่นี่"
    start: { flag: tam_q2_done, heart_min: 4, day_min: 14 }
    offer:
      npc: "คลิปฉากประตูเปิดเองหลุดออกไปนอกกลุ่มครับ คนแชร์สองหมื่นครั้ง บอกว่าเป็นผีจริง บริษัทโปรดักชันในกรุงเทพฯ ทักมา ชวนไปเป็นผู้ช่วยตัดต่อ เริ่มเดือนหน้า… ผมควรดีใจใช่ไหมครับ"
      options:
        - text: "ควรสิ{k} พี่ทำได้แล้ว"
          accept: true
          heart: 2
          reply: "ผมดีใจครับ ข้างในกระโดดอยู่ แต่ขาผมยืนนิ่ง เพราะบ่อแม่ผมแห้ง และแม่ผมไปหมอแอนทุกอาทิตย์ ช่วยผมคิดหน่อยได้ไหมครับ"
        - text: "พี่ยังลังเลอะไร{kq}"
          accept: true
          heart: 1
          reply: "แม่ครับ ทุกอย่างคือแม่ ผมอยากรู้ว่าถ้าผมไป แม่จะโอเคจริงๆ หรือแค่พูดว่าไม่เป็นไร ช่วยผมถามหมอแอนได้ไหม"
        - text: "เรื่องใหญ่แบบนี้ตัดสินเองเถอะ{k}"
          heart: 0
          reply: "ครับ ผมเข้าใจ ผมแค่อยากให้มีคนตัดสินใจแทนผมสักครั้ง แต่ก็ไม่เป็นไร"
    steps:
      - goal: { type: talk, npc: ann }
        hint: "ไปถามหมอแอนเรื่องสุขภาพแม่ของตั้ม"
        done:
          npc: "แม่ตั้มความดันสูงจ้ะ คุมได้ดีถ้ากินยาครบ ถ้าตั้มไป หมอให้ อสม. แวะไปวัดความดันให้อาทิตย์ละครั้งได้ แต่หมอดูแลได้แค่ร่างกาย หลานต้องถามตั้มเองว่าใครจะดูแลวันอาทิตย์ที่แม่เขานั่งรอลูกที่ระเบียง"
          options:
            - text: "หมอว่าตั้มควรไปไหม{kq}"
              heart: 1
              reply: "หมอว่าตั้มควรได้เลือกจ้ะ สามปีที่ผ่านมาตั้มไม่เคยได้เลือกอะไรเลย ทุกอย่างเลือกเพราะคนอื่น… หมอพูดในฐานะคนที่เลือกกลับมาเหมือนกัน"
            - text: "{p}จะแวะไปหาแม่พี่ตั้มบ่อยๆ{k}"
              heart: 2
              set_flag: tam_q3_promise_mom
              reply: "หลานใจดีเหมือนยายเพียรเลย ยายก็แวะไปบ้านคนแก่ที่ลูกไปทำงานไกลทุกวันพฤหัส หมอจะบอกตั้มให้"
      - goal: { type: talk, npc: cherd }
        hint: "ไปถามลุงเชิดที่ป้ายรถเมล์ว่ารถเที่ยวไหนต่อรถทัวร์เข้ากรุงเทพฯ ได้"
        done:
          npc: "ตั้มจะไปเหรอ… เที่ยวหกโมงเย็นถึงท่ารถอำเภอหนึ่งทุ่ม ต่อรถทัวร์สองทุ่มครึ่ง ถึงกรุงเทพฯ ตีสี่ ลุงขับมาสามสิบปี เห็นคนขึ้นเที่ยวนั้นไปแล้วไม่กลับมาเยอะ แต่ลุงก็เห็นคนกลับมาเที่ยวหกโมงเช้าเยอะเหมือนกันนะหลาน"
          options:
            - text: "ลุงว่าตั้มจะกลับมาไหม{kq}"
              heart: 1
              reply: "คนที่ซื้อกาแฟลุงทุกเย็นสามปี ไม่ลืมทางกลับหรอก ลุงจะเก็บที่นั่งแถวหน้าไว้ให้ ทั้งขาไปขากลับ"
            - text: "ลุงเหงาแย่เลย{k}"
              heart: 1
              reply: "เหงาสิ ใครจะชงกาแฟเย็นให้ลุงแบบหวานน้อยโดยไม่ต้องสั่ง… แต่ลุงเหงาได้ เด็กมันควรได้ไป"
      - goal: { type: days, n: 2 }
        hint: "ให้เวลาตั้มคิด 2 วัน แล้วกลับไปหาที่ร้าน"
        done:
          npc: "ผมคุยกับแม่แล้วครับ แม่บอกว่าไม่เป็นไรสามครั้ง ครั้งที่สี่แม่บอกว่า ‘ไปเถอะลูก แม่อยากเห็นชื่อลูกในหนัง’ ผมไม่เคยได้ยินครั้งที่สี่มาก่อน"
          options:
            - text: "นั่นคือคำตอบจริงของแม่{k}"
              heart: 2
              reply: "ผมคิดแบบนั้นครับ… แต่ผมยังกลัว ผมจะขอเวลาอีกนิดก่อนตอบบริษัท ผมอยากยืนที่ป้ายรถเมล์ดูสักวัน ว่าขาผมจะก้าวไหม"
            - text: "หรือพี่จะทำหนังที่นี่ก็ได้นะ{k}"
              heart: 1
              reply: "ที่นี่… ผมไม่เคยคิดว่าที่นี่มีเรื่องให้ถ่าย ทั้งที่ผมเขียนเรื่องที่นี่มาสามสิบเรื่อง ผมจะคิดเรื่องนี้ด้วยครับ"
    reward: { money: 200, heart: 2, set_flag: tam_q3_done, line: { from: tam, text: "ขอบคุณทุกคนที่แชร์คลิปครับ ประตูเปิดเองเพราะเซนเซอร์เสีย (ช่างบอก) ผมเลือกเชื่อช่าง แต่ก็ขอบคุณใครก็ตามที่เปิดให้ 🙏" } }

  - id: tam_q4
    npc: tam
    title: "รถเมล์เที่ยวหกโมงเย็น"
    desc: "ตั้มต้องตัดสินใจ — ขึ้นรถเที่ยวสุดท้ายไปกรุงเทพฯ หรืออยู่ต่อ"
    start: { flag: tam_q3_done, heart_min: 6, day_min: 19 }
    offer:
      npc: "บริษัทให้ผมตอบภายในวันศุกร์ครับ ผมแลกกะกับเด็กกะเช้าไว้แล้ว เย็นนั้นผมจะไปยืนที่ป้ายรถเมล์ตอนหกโมง ถ้าผมขึ้น ผมก็ไป ถ้าไม่ขึ้น… ผมอยากให้คุณไปยืนด้วยครับ"
      options:
        - text: "{p}จะไปยืนด้วย{k}"
          accept: true
          heart: 2
          reply: "ขอบคุณครับ ก่อนวันนั้นช่วยไปถามภก.มดให้หน่อย ถ้าผมไป ใครจะเป็นคนตื่นอยู่ตอนกลางคืนในตำบล ผมไม่อยากให้ร้านมืด"
        - text: "พี่ตัดสินใจแล้วใช่ไหม{kq}"
          accept: true
          heart: 1
          reply: "ยังครับ ผมจะให้ขาผมตัดสินใจตอนรถมาถึง สมองผมคิดมาสามปีแล้วไม่ได้คำตอบ ขาอาจรู้ดีกว่า"
        - text: "{p}ไม่อยากเห็นพี่ไป{k}"
          heart: 1
          reply: "ผมก็ไม่อยากเห็นตัวเองไปครับ แต่ผมอยากเห็นตัวเองอยู่ที่นั่น สองอย่างนี้ขัดกัน ไว้คุณพร้อมค่อยมาบอกผมนะครับ"
    steps:
      - goal: { type: talk, npc: mod }
        hint: "ไปถามภก.มดว่าถ้าตั้มไป ใครจะเฝ้าตอนกลางคืน"
        done:
          npc: "ตั้มจะไปเหรอครับ… ผมจะเปิดร้านถึงสี่ทุ่มสัปดาห์ละสามคืน ไม่ใช่เพราะเขา ผมแค่คำนวณแล้วว่าตำบลต้องการไฟอย่างน้อยหนึ่งดวงหลังสามทุ่ม ผมกลัวผี แต่ผมกลัวความมืดทั้งตำบลมากกว่า"
          options:
            - text: "ภก.ใจดีมาก{k}"
              heart: 1
              reply: "ผมไม่ได้ใจดีครับ ผมจัดลำดับความเสี่ยง ฝากบอกตั้มด้วยว่าผมพยักหน้าให้เขา สามวินาที เหมือนทุกคืน"
            - text: "ภก.จะคิดถึงพี่ตั้มไหม{kq}"
              heart: 1
              reply: "ข้อมูลไม่เพียงพอต่อการวินิจฉัยครับ… ใช่ ผมจะคิดถึง อย่าบอกเขาว่าผมตอบเร็วขนาดนี้"
      - goal: { type: visit, place: bus_stop, from: "17:30", to: "18:00" }
        hint: "ไปยืนกับตั้มที่ป้ายรถเมล์ก่อนเที่ยวหกโมงเย็น (17:30–18:00)"
        done:
          npc: "รถมาแล้วครับ ลุงเชิดเปิดประตูรอ… ลุงไม่เคยรอใครเลยนะครับ ขาผมยังไม่ขยับ ผมถือกระเป๋าใบเดียว ข้างในมีใบปริญญากับแก้วสะสมแต้มหนึ่งใบ คุณว่าผมควรทำยังไงครับ บอกผมทีเถอะ ครั้งเดียว"
          options:
            - text: "ขึ้นเลย{k}พี่ตั้ม {p}จะดูแลแม่ให้"
              heart: 2
              set_flag: tam_end_city
              reply: "…ขาผมขยับแล้วครับ ผมจะส่งคลิปทุกเรื่องมาให้คุณดูเป็นคนแรก แล้วทุกวันอาทิตย์ผมจะโทรหาแม่ตอนหกโมงเย็น เวลาเดียวกับที่รถออก จะได้จำได้ว่าผมมาจากไหน"
            - text: "อยู่ทำหนังที่นี่เถอะ เรื่องที่นี่ยังไม่มีใครเล่า"
              heart: 2
              set_flag: tam_end_stay
              reply: "…ผมวางกระเป๋าแล้วครับ ลุงเชิดปิดประตูแล้วยิ้ม ลุงไม่เคยยิ้มตอนรถออก ผมจะเปิดช่อง ‘กะดึกดงเย็น’ ถ่ายทุกคนในตำบลที่ไม่เคยมีใครถ่าย เริ่มจากป้าแต๋ว เพราะป้าจะยอมง่ายที่สุด"
            - text: "รับงานตัดต่อแบบส่งออนไลน์สิ ทำตอนกะดึกได้"
              heart: 1
              set_flag: tam_end_remote
              reply: "ส่งออนไลน์… ไวไฟร้านผมดีที่สุดในตำบล ตีสามถึงตีห้าไม่มีลูกค้า ผมไม่เคยคิดว่าสองอย่างนี้เป็นทรัพยากร ลุงครับ ไปเถอะครับ ผมจะโทรหาบริษัทเดี๋ยวนี้"
    reward: { money: 300, heart: 2, set_flag: tam_q4_done, line: { from: tam, text: "ขอบคุณทุกคนที่ยืนอยู่ด้วยตอนหกโมงเย็นครับ 🚌 ไม่ว่าผมจะอยู่ไหน ร้านนี้จะมีไฟเปิดอยู่เสมอ" } }
