# ช่างเปี๊ยก — convos + quests (ตัวรอง)
convos:
  # ===== react =====
  - id: piak_r_meet
    topic: react
    once: true
    when: { not_flag: met_piak }
    npc: "เฮ้ย หลานยายเพียรใช่ไหม! พี่เปี๊ยก ช่างประจำตำบล บ้านยายเราน่ะพี่เปลี่ยนเสาตอม่อให้สองต้นเมื่อสามปีก่อน ยังแข็งแรงอยู่ไหม ยังไม่เอียงใช่ไหม"
    set_flag: met_piak
    options:
      - text: "แข็งแรงดี{k}พี่ ไม่เอียงเลย"
        heart: 1
        reply: "ดี! เสาที่พี่ลงต้องตรงเหมือนใจพี่… ยายเราจ่ายค่าแรงเป็นแกงส้มหม้อนึงกับมะม่วงสองเข่ง พี่ว่าพี่ได้กำไร"
        next:
          - text: "ยายจ่ายเป็นแกงเหรอ{kq}"
            heart: 1
            reply: "พี่ไม่ยอมรับเงินยายหรอก ยายเลยทำแกงมาให้ทุกวันที่พี่ทำงาน สามวัน แกงสามหม้อ อร่อยจนพี่อยากให้เสาพังอีก"
          - text: "หลังคาครัวรั่วนะพี่{k}"
            heart: 0
            reply: "รู้ ยายบอกพี่ไว้ตั้งแต่ก่อน… ก่อนยายไป พี่ยังไม่ได้ไปซ่อม ช่วงนั้นงานเยอะ แล้วก็… เดี๋ยวพี่ไปดูให้นะ"
      - text: "พี่ทำเฟอร์นิเจอร์ด้วยใช่ไหม{kq}"
        heart: 1
        reply: "ทำหมด ตู้ เตียง แคร่ โต๊ะ ประตู ขอแบบก่อน วาดบนกระดาษสมุดก็ได้ วาดเบี้ยวพี่ทำให้ตรงเอง"
      - text: "ไม่ได้ต้องการอะไร{k}"
        heart: 0
        reply: "ตอนนี้ไม่ต้องการ อีกเดี๋ยวก็ต้องการ บ้านไม้ร้อยปีไม่มีหลังไหนไม่ต้องการช่าง จำหน้าพี่ไว้ก่อน"

  - id: piak_r_snake
    topic: react
    once: true
    when: { flag: met_snake }
    npc: "ได้ข่าวว่าเจองูที่ทางเดิน กองไม้ข้างบ้านยายรกไหม งูชอบนอนกองไม้ ร่มดี เย็นดี เหมือนช่างพักเที่ยง"
    options:
      - text: "รกมาก{k} {p}ไม่กล้าแตะเลย"
        heart: 1
        reply: "เดี๋ยวพี่ไปยกให้ ใส่รองเท้าบูท ถือไม้ยาวเขี่ยก่อนยก ไม้ดีๆ พี่เอาไปทำของให้ ไม้ผุเอาไปเป็นฟืน งูได้บ้านใหม่ในป่า ทุกคนชนะ"
      - text: "พี่ไม่กลัวงูเหรอ{kq}"
        heart: 0
        reply: "กลัวสิ แต่กลัวไม้ปลวกกินมากกว่า งูกัดทีเดียว ปลวกกินบ้านทั้งหลังแบบเงียบๆ"

  - id: piak_r_meeting1
    topic: react
    once: true
    when: { flag: story_meeting1 }
    npc: "ประชุมเมื่อวาน พี่ยกมือถามว่าถ้าได้ถนนหรือระบบน้ำ จะจ้างช่างในตำบลไหม นายกตอบว่า ‘เรื่องนี้เรารับทราบ’ พี่ยังไม่รู้เลยว่าได้คำตอบหรือยัง"
    options:
      - text: "ไม่ได้คำตอบหรอก{k}พี่"
        heart: 1
        reply: "นั่นแหละ ทุกครั้งที่มีงานใหญ่ ผู้รับเหมามาจากข้างนอก ช่างในตำบลได้งานซ่อมสิ่งที่เขาทำพังทีหลัง พี่เป็นช่างซ่อมงานรับเหมามาสิบปี"
        next:
          - text: "พี่ควรรวมกลุ่มช่างไปเสนอราคาสิ{k}"
            heart: 2
            reply: "เฮ้ย… ไอเดียดีเว้ย พี่ บอล ช่างไฟหมู่สี่ ช่างประปาหลังวัด ร่วมกันก็เป็นทีมได้ แต่ต้องมีเอกสาร พี่เกลียดเอกสารมากกว่าปูนแห้งคาถัง"
          - text: "ระบบเป็นแบบนี้แหละ{k}"
            heart: 0
            reply: "ระบบก็คนทำ คนก็เปลี่ยนได้ ปูนยังเปลี่ยนจากเหลวเป็นแข็งได้เลย แต่ต้องรอนาน"
      - text: "กำนันหลับใช่ไหม{kq}"
        heart: 1
        reply: "หลับตั้งแต่เสี่ยเฮงพูด ตื่นตอนแจกขนม ตรงเวลาแบบช่างที่ดี"

  - id: piak_r_result_road
    topic: react
    once: true
    when: { flag: meeting1_result_road }
    npc: "ถนนเทเสร็จแล้ว ผู้รับเหมาจากอำเภอ พี่ไปเอาตลับเมตรวัด หนาสามเซน สเปกเขียนห้าเซน อีกสองเซนไปไหนวะ… ไม่ใช่ ไปไหนนะ"
    options:
      - text: "ไปอยู่ในกระเป๋าใครสักคน{k}"
        heart: 1
        reply: "พี่ไม่ได้พูดนะ แต่ปีหน้าถนนนี้แตกตรงกลาง แล้วก็จะมีงบซ่อมก่อนเลือกตั้งพอดี ถนนเส้นนี้เป็นถนนที่วางแผนไว้ล่วงหน้าดีที่สุดในประเทศ"
        next:
          - text: "พี่ไปบอกพี่เมย์สิ{k}"
            heart: 1
            reply: "บอกแล้ว เมย์ถ่ายรูปพี่ถือตลับเมตรไปสามรูป บอกว่าจะลง พี่ขอให้ตัดหน้าพี่ออก พี่ยังต้องหางานในตำบลอยู่"
          - text: "ช่างวัดถนนคนอื่นด้วยเหรอ{kq}"
            heart: 0
            reply: "ช่างวัดทุกอย่าง นิสัยเสีย เข้าบ้านใครพี่ดูก่อนเลยว่าผนังได้ฉากไหม บ้านกำนันผนังเอียงสององศา พี่ไม่บอกกำนันนะ"
      - text: "พี่น่าจะได้งานนี้นะ{k}"
        heart: 1
        reply: "พี่ไม่ได้เพราะพี่ไม่ได้เป็นหลานใคร ถ้าพี่ได้ ถนนจะหนาห้าเซนเต็ม แล้วพี่จะไม่ได้งานซ่อมปีหน้า ช่างซื่อสัตย์อดตายนะเว้ย ฮ่าๆ"

  - id: piak_r_well_dry
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "ตาเผือกกับป้าแต๋วจ้างพี่ขุดบ่อให้ลึกขึ้น พี่ขุดลงไปอีกห้าเมตรยังไม่เจอน้ำ ดินแห้งเหมือนปูนก่อนผสม พี่ขุดมายี่สิบปีไม่เคยเจอแบบนี้"
    options:
      - text: "พี่คิดว่าน้ำไปไหน{kq}"
        heart: 1
        reply: "ไปทางเดียวกับที่ท่อบาดาลบริษัทชี้ลงไป พี่ไม่ใช่นักวิชาการแบบปาล์ม แต่น้ำมันไหลไปที่ต่ำ และตอนนี้ที่ต่ำที่สุดในตำบลคือก้นท่อบริษัท"
        next:
          - text: "พี่คิดเงินค่าขุดไหม{kq}"
            heart: 1
            reply: "ค่าขุดคิด ค่าไม่เจอน้ำไม่คิด ตาเผือกจ่ายเป็นนมควายสองขวด ป้าแต๋วจ่ายเป็นข่าวลือสามเรื่อง พี่ขาดทุนแต่รู้ข่าวเยอะขึ้น"
          - text: "แล้วบ่อ{p}ล่ะ{kq}"
            heart: 1
            reply: "บ่อยายเราลึกกว่าบ้านอื่น ยายจ้างพ่อพี่ขุดเมื่อสี่สิบปีก่อน สั่งให้ขุดลึกไว้ก่อน บอกว่า ‘วันหน้าคนจะแย่งน้ำกัน’ ยายพูดถูกเว้ย"
      - text: "ขุดลึกกว่านี้อีกได้ไหม{kq}"
        heart: 0
        reply: "ได้ แต่ต้องใช้เครื่องเจาะ เครื่องเจาะต้องเช่าจากเสี่ยเฮง เสี่ยเฮงขายเครื่องเจาะให้บริษัทด้วย เรากำลังแข่งเจาะลงไปหาน้ำหยดเดียวกัน"

  - id: piak_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "รั้วบริษัทล้ำเข้าทางเดินไปศาลปู่ตาสองเมตร พี่เอาตลับเมตรไปวัดสามรอบ ไปบอกคุณธนาในที่ประชุม คุณธนาบอกว่า ‘เดี๋ยวให้ทีมตรวจสอบครับ’ ทีมตรวจสอบคือคนที่สร้างรั้วนั่นแหละ"
    options:
      - text: "พี่จะทำยังไงต่อ{kq}"
        heart: 1
        reply: "ยายบัวบอกว่าไม่ต้องทำอะไร ปู่ตาจะจัดการเอง พี่ก็อยากเชื่อ แต่พี่จะเขียนตัวเลขสองเมตรไว้บนเสารั้วด้วยสีสเปรย์ เผื่อปู่ตาอ่านหนังสือออก"
        next:
          - text: "ระวังโดนแจ้งความนะ{k}"
            heart: 1
            reply: "พี่เขียนบนเสาฝั่งที่ล้ำเข้ามาในที่สาธารณะ ถ้าเขาแจ้งความ เขาต้องยอมรับก่อนว่าเสาอยู่ในที่ของใคร ช่างไม่เก่งกฎหมาย แต่เก่งวัดระยะ"
          - text: "{p}จะไปช่วยถือตลับเมตร{k}"
            heart: 2
            reply: "เฮ้ย ได้เลย พรุ่งนี้หกโมงเช้า ก่อนคนงานเข้า ใส่เสื้อแขนยาว ไม่ใช่เพราะแดด เพราะหญ้าคา"
      - text: "แจกถังฟรีก็ดีแล้วนี่{kq}"
        heart: -1
        reply: "ถังพลาสติกสองร้อยห้าสิบบาท แลกที่ดินสาธารณะสองเมตรยาวร้อยเมตร คิดเป็นตารางวาแล้วถังนั่นแพงที่สุดในประวัติศาสตร์ถัง"

  - id: piak_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ป้ายหาเสียงขึ้นเต็มเสาไฟแล้ว พี่เดินดูทุกป้าย ไม้อัดหนาสิบมิล ดีกว่าฝาบ้านพี่อีก เลือกตั้งเสร็จพี่จะขอเก็บไปทำชั้นวางของแจกโรงเรียน"
    options:
      - text: "ทำชั้นจากป้ายหาเสียงเหรอ{kq}"
        heart: 1
        reply: "ใช่ หันหน้ารูปเข้าข้างใน เด็กจะได้ไม่ต้องเห็นหน้าใครยิ้มทุกครั้งที่หยิบหนังสือ ครูเต้ยบอกพี่ทำมาสองรอบแล้ว ชั้นแข็งแรงกว่าคำสัญญาบนป้าย"
        next:
          - text: "พี่ใจดีนะ{k}"
            heart: 1
            reply: "ไม่ได้ใจดี พี่เสียดายไม้ เห็นไม้ดีถูกทิ้งแล้วพี่นอนไม่หลับ"
          - text: "เอาหน้าใครออกก่อน{kq}"
            heart: 1
            reply: "ใครแพ้ก็เอาออกก่อน ใครชนะพี่ต้องรอสี่ปี คนชนะชอบปล่อยป้ายตัวเองไว้ให้คนจำ"
      - text: "พี่จะเลือกใคร{kq}"
        heart: 0
        reply: "คนที่จ้างช่างในตำบล ปีนี้ยังไม่มีใครบอก พี่เลยยังว่าง… พี่หมายถึงยังไม่ตัดสินใจ"

  - id: piak_r_end_bench
    topic: react
    once: true
    when: { flag: piak_end_bench }
    npc: "ตั้งแต่แคร่ใต้ต้นมะม่วงยายเสร็จ มีคนมาจ้างพี่ทำแคร่แบบเดียวกันห้าบ้านแล้ว ทุกบ้านขอให้แกะลายแบบเดียวกัน พี่บอกไม่ได้ ลายนั้นของยายคนเดียว"
    options:
      - text: "พี่ทำลายอื่นให้เขาสิ{kq}"
        heart: 1
        reply: "ทำ พี่ถามทุกบ้านว่าในบ้านมีใครที่อยากให้นั่งแล้วมองแปลงผัก แล้วแกะสิ่งที่คนนั้นชอบ ห้าบ้าน ห้าลาย พี่ไม่เคยรู้สึกเป็นช่างแบบนี้มาก่อน"
      - text: "บริษัทยังมาจ้างพี่ไหม{kq}"
        heart: 1
        reply: "มาอีกรอบ พี่บอกคิวยาวถึงหน้าหนาว ซึ่งเป็นเรื่องจริงครั้งแรก ไม่ใช่ข้ออ้าง"

  # ===== news =====
  - id: piak_n_sign
    topic: news
    npc: "อบต. จ้างทำป้ายโครงการ ‘ส่งเสริมอาชีพช่างชุมชน’ ป้ายเหล็กสามเมตร ผู้รับเหมาจากอำเภอทำ ไม่มีช่างในตำบลได้แตะสักคน ตลกไหมวะ… ตลกไหมนะ"
    options:
      - text: "ตลกร้ายเลย{k}พี่"
        heart: 1
        reply: "ร้ายสุด แล้วป้ายก็ติดเอียง พี่เห็นแล้วทนไม่ได้ เมื่อคืนพี่แอบไปขันน็อตให้ตรง ฟรี ส่งเสริมอาชีพช่างชุมชนด้วยตัวเอง"
        next:
          - text: "พี่ซ่อมให้ฟรีเลยเหรอ{kq}"
            heart: 1
            reply: "ฟรี แต่พี่เอาปากกาเคมีเขียนตัวเล็กๆ ใต้ป้ายว่า ‘ขันตรงโดยช่างเปี๊ยก’ ไม่มีใครเห็นหรอก แต่พี่รู้"
          - text: "อย่าทำแบบนั้นอีกนะ{kq}"
            heart: 0
            reply: "ทำไม ป้ายเอียงมันอันตราย ลมแรงหล่นใส่เด็ก พี่ทำเพราะเด็ก ไม่ใช่เพราะงบ"
      - text: "ป้ายแพงไหม{kq}"
        heart: 0
        reply: "สองแสน พี่สร้างบ้านไม้ชั้นเดียวได้ครึ่งหลัง ป้ายไม่มีใครอยู่ แต่มีคนยิ้มอยู่บนป้ายหนึ่งคน"

  - id: piak_n_school_toilet
    topic: news
    npc: "ห้องน้ำโรงเรียนจากเงินซองกฐินปีนี้ พระอาจารย์ให้พี่สร้าง ค่าแรงครึ่งเดียว อีกครึ่งพี่ทำบุญ พี่ปูกระเบื้องให้เด็กแบบลายเดียวกับห้องน้ำโรงแรมในเมือง"
    options:
      - text: "เด็กๆ ชอบไหม{kq}"
        heart: 2
        reply: "น้องโอ๊ตบอกว่าห้องน้ำสวยกว่าห้องนอนตัวเอง พี่ไม่รู้จะดีใจหรือเศร้า ช่างได้ยินแบบนี้ทั้งสองอย่างพร้อมกัน"
      - text: "ทำไมพี่ทำบุญครึ่งนึง{kq}"
        heart: 1
        reply: "เงินกฐินมาจากซองนักการเมืองสองซอง พี่ไม่อยากได้เงินนั้นเต็มๆ ครึ่งที่พี่ไม่รับ พี่ถือว่าล้างมือ ปูนล้างได้ด้วยน้ำ เงินแบบนี้ต้องล้างด้วยแรง"

  - id: piak_n_poles
    topic: news
    npc: "เสาไฟใหม่สิบต้นหน้าทางเข้าตำบลติดตั้งเสร็จแล้ว ไม่มีสายไฟ ไม่มีหลอด มีแต่เสา พี่ถามคนติด เขาบอกว่าเฟสหนึ่งคือเสา เฟสสองคืองบปีหน้า"
    options:
      - text: "ติดเสาไว้ทำอะไร{kq}"
        heart: 1
        reply: "ติดป้ายหาเสียงไง ช่วงเลือกตั้งพอดี เสาไม่มีไฟแต่มีหน้าคน พี่ว่าวางแผนดีมาก เฟสหนึ่งตรงเวลาเป๊ะ"
      - text: "ปีหน้าจะมีไฟไหม{kq}"
        heart: 0
        reply: "ถ้ามีเลือกตั้งปีหน้าก็มี ถ้าไม่มีเลือกตั้ง เสาจะยืนรอไปเรื่อยๆ เหมือนพี่ยืนรอลูกค้าเปลี่ยนแบบรอบที่สี่"

  - id: piak_n_steel
    topic: news
    npc: "ปูนขึ้นถุงละห้าบาท เหล็กเส้นขึ้นอีกแล้ว พี่ต้องไปบอกลูกค้าว่าราคาที่ตกลงเมื่อเดือนก่อนใช้ไม่ได้แล้ว ทุกครั้งพี่โดนมองเหมือนพี่เป็นคนโกง"
    options:
      - text: "ไม่ใช่ความผิดพี่นะ{k}"
        heart: 1
        reply: "รู้ แต่ลูกค้าไม่ได้เห็นโรงงานปูน เห็นแต่หน้าพี่ หน้าพี่เลยเป็นหน้าของเงินเฟ้อทั้งประเทศในสายตาลุงสมหมาย"
        next:
          - text: "ซื้อของล่วงหน้าตุนไว้สิ{k}"
            heart: 1
            reply: "พี่ไม่มีเงินตุน ต้องเชื่อเสี่ยเฮง เสี่ยคิดดอก ดอกขึ้นเร็วกว่าปูน สุดท้ายพี่ตุนหนี้แทนปูน"
          - text: "ขึ้นราคาไปเลยพี่{k}"
            heart: 0
            reply: "ขึ้นได้ แต่ลูกค้าพี่คือคนที่พี่เจอที่วัดทุกวันพระ ขึ้นราคาแล้วพี่ต้องหลบหน้าที่โรงทาน ไม่คุ้ม"
      - text: "ใช้ไม้แทนปูนสิ{kq}"
        heart: 1
        reply: "ไม้ก็ขึ้น ไม้สักลูกบาศก์ฟุตแพงกว่าค่าแรงพี่สามวัน ตอนนี้ของถูกที่สุดในงานก่อสร้างคือช่าง"

  - id: piak_n_company_job
    topic: news
    npc: "บริษัทคุณธนาจะสร้างโกดังใหญ่ ประกาศรับช่าง ค่าแรงวันละแปดร้อย สองเท่าของที่พี่ได้ ช่างหนุ่มสามคนในตำบลไปสมัครแล้ว พี่ยังไม่ไป"
    options:
      - text: "ทำไมพี่ไม่ไป{kq}"
        heart: 1
        reply: "ไปแล้วใครจะซ่อมหลังคาบ้านคนแก่ตอนฝนตก บริษัทไม่จ่ายค่ารอ พี่รอได้ แต่ถ้าพี่ไป คนแก่รอไม่ได้"
        next:
          - text: "แต่พี่ก็ต้องกินนะ{k}"
            heart: 1
            reply: "ใช่ เมียพี่ก็พูดแบบนั้นทุกคืน ลูกพี่จะขึ้น ม.1 ค่าชุดค่าเทอม พี่ยังคิดอยู่ ยังไม่ได้บอกว่าไม่ไป"
          - text: "พี่ดีจัง{k}"
            heart: 1
            reply: "ดีหรือโง่ พี่ยังไม่แน่ใจ อีกสองเดือนรู้ ตอนนั้นค่าเทอมลูกจะบอกพี่เอง"
      - text: "ไปเถอะ เงินดี{k}"
        heart: 0
        reply: "เงินดีแต่ไม้ไม่ดี โกดังเหล็กสำเร็จรูป พี่แค่ขันน็อตตามแบบ ไม่มีที่ให้มือช่างคิดเลย"

  # ===== advice =====
  - id: piak_a_termite
    topic: advice
    npc: "บ้านไม้ยายเรานะ เดือนละครั้งเอาไขควงจิ้มเสาข้างล่างดู ถ้าจิ้มแล้วยุบ มีปลวก รีบบอกพี่ ปลวกไม่เคยหยุดงาน ไม่มีวันหยุดนักขัตฤกษ์"
    options:
      - text: "ถ้าเจอปลวกทำไง{kq}"
        heart: 1
        reply: "อย่าไปซื้อยาฉีดร้านเสี่ยเฮงมาพ่นเอง พ่นแล้วปลวกย้ายไปอีกเสา บอกพี่ พี่จะเปลี่ยนเสาแล้วรองฐานด้วยแผ่นสังกะสีกันปลวกขึ้น วิธีพ่อพี่"
      - text: "พี่ห่วงบ้านยายจัง{k}"
        heart: 2
        reply: "บ้านหลังนั้นพ่อพี่สร้าง พี่ซ่อม ถ้ามันพัง พี่เสียสองคน ทั้งพ่อทั้งยาย ไม่ได้เว่อร์นะเว้ย ช่างผูกพันกับบ้านที่ตัวเองตอกตะปู"

  - id: piak_a_roof
    topic: advice
    when: { rain: false }
    npc: "ฟ้าแจ่มแบบนี้ ขึ้นไปดูหลังคาซะ อย่ารอฝนตกค่อยรู้ว่ารั่ว ตอนฝนตกช่างทุกคนในตำบลคิวเต็ม หลังคาไม่รอคิว"
    options:
      - text: "ดูยังไงว่ารั่ว{kq}"
        heart: 1
        reply: "ขึ้นไปใต้หลังคากลางวัน มองหาจุดที่แดดลอด แดดลอดตรงไหน ฝนก็ลอดตรงนั้น วิทยาศาสตร์บ้านๆ แต่แม่นกว่าพยากรณ์อากาศหอกระจายข่าว"
        next:
          - text: "เจอแล้วปิดเองได้ไหม{kq}"
            heart: 1
            reply: "รูเล็กยาซิลิโคนได้ รูใหญ่เรียกพี่ อย่าปีนขึ้นไปคนเดียว ปีก่อนลุงสมหมายตกหลังคา ไปนอน รพ.สต. สามวัน ป้าพรด่าจนลุงอยากกลับไปนอนบนหลังคา"
          - text: "พี่ไปดูให้หน่อยได้ไหม{kq}"
            heart: 1
            reply: "ได้ วันอังคาร ช่วงเช้า แต่ต้องมีข้าวเที่ยงนะ ไม่ต้องหรู ไข่เจียวหมูสับก็พอ ค่าแรงพี่ลดได้ด้วยไข่"
      - text: "ไว้ฝนตกค่อยดู{k}"
        heart: -1
        reply: "แล้วก็จะโทรหาพี่ตอนตีสองตอนน้ำหยดบนหัว พี่ไม่รับนะ ตีสองผีออก"

  - id: piak_a_canal
    topic: advice
    npc: "ถ้าจะสร้างอะไรเพิ่มในฟาร์ม อย่าสร้างตรงที่ต่ำ ดูว่าน้ำปีก่อนท่วมถึงไหน ถามตาเผือก ตาจำได้ทุกปีว่าควายยืนน้ำลึกแค่ไหน"
    options:
      - text: "ตาเผือกจำระดับน้ำจากควายเหรอ{kq}"
        heart: 1
        reply: "แม่นกว่ากรมชลประทาน ปีไหนน้ำถึงเข่าควาย ปีไหนถึงท้อง ตาเผือกบอกได้หมด ช่างที่ฉลาดถามคนแก่ก่อนวาดแบบ"
      - text: "{p}ยังไม่มีเงินสร้างอะไรหรอก{k}"
        heart: 0
        reply: "ไม่มีเงินก็คิดไว้ก่อน คิดไม่เสียเงิน วาดแบบไว้ในหัว พอมีเงินจะได้ไม่สร้างผิดที่ สร้างผิดที่แพงกว่าไม่สร้าง"

  - id: piak_a_change_plan
    topic: advice
    npc: "ถ้าจะจ้างช่างคนไหนก็ตาม คิดแบบให้จบก่อนจ้างนะ ลูกค้าเปลี่ยนแบบกลางงานคือเหตุผลอันดับหนึ่งที่งานช้า อันดับสองคือฝน อันดับสามคือช่างไปงานบวช"
    options:
      - text: "ช่างไปงานบวชบ่อยเหรอ{kq}"
        heart: 1
        reply: "ทุกงาน ช่างต้องไปตั้งเต็นท์ให้ ไปยกโต๊ะ ไปกินเหล้าตอนเย็น วันรุ่งขึ้นงานช้า ในตำบลนี้งานบวชคือวันหยุดของช่างที่ไม่มีในปฏิทิน"
      - text: "พี่เบื่อลูกค้าเปลี่ยนแบบไหม{kq}"
        heart: 1
        reply: "เบื่อจนเริ่มคิดค่ายางลบ แต่รู้ไหม ลูกค้าที่เปลี่ยนแบบมากที่สุดคือคนที่รักบ้านตัวเองที่สุด เขากลัวมันออกมาไม่ดี พี่เข้าใจ"

  # ===== smalltalk =====
  - id: piak_s_level
    topic: smalltalk
    npc: "ดูนี่ ระดับน้ำอันนี้พ่อพี่ให้ตอนพี่อายุสิบห้า ฟองอากาศยังอยู่ตรงกลางเป๊ะ พี่ทำหล่นสามครั้ง ตกนั่งร้านหนึ่งครั้ง มันยังแม่น"
    options:
      - text: "ของพ่อพี่ทนจัง{k}"
        heart: 1
        reply: "ของสมัยก่อนทำมาให้ใช้จนตาย ของสมัยนี้ทำมาให้ซื้อใหม่ พี่ซื้อระดับเลเซอร์มาอันนึง ใช้ได้สองปีเสีย อันนี้สามสิบปียังอยู่"
      - text: "ให้{p}ลองถือหน่อย{k}"
        heart: 2
        reply: "เอ้า ถือสองมือนะ วางบนโต๊ะ… ฟองไปทางซ้าย โต๊ะเอียง โต๊ะตัวนี้พี่ทำเองเมื่อปีก่อน… อย่าบอกใครนะเว้ย"

  - id: piak_s_radio
    topic: smalltalk
    npc: "วิทยุในโรงไม้พี่เปิดสถานีลูกทุ่งตลอด เพลงช้าพี่ไสไม้ เพลงเร็วพี่ตอกตะปู วันไหนเปิดข่าวการเมือง พี่ทำงานพังทั้งวัน"
    options:
      - text: "ทำไมข่าวการเมืองทำให้งานพัง{kq}"
        heart: 1
        reply: "ฟังแล้วโมโห โมโหแล้วตอกแรง ตอกแรงไม้แตก พี่เลยเลิกฟังข่าว ฟังแต่หอกระจายข่าวผู้ใหญ่ ฟังสามรอบเท่ากับเพลงหนึ่งเพลง"
      - text: "พี่ชอบเพลงอะไร{kq}"
        heart: 1
        reply: "เพลงที่ร้องเรื่องคนจากบ้านไปทำงาน พี่ฟังแล้วนึกถึงตอนอยู่กรุงเทพฯ ฟังแล้วไสไม้ได้เรียบที่สุด ความเศร้าทำให้มือนิ่ง"

  - id: piak_s_pencil
    topic: smalltalk
    npc: "ดินสอช่างพี่หายอีกแล้ว เหน็บไว้หลังหู ก้มลงตอกตะปูทีเดียวหล่นหายไปในกองขี้เลื่อย ปีนี้หายไปสิบสามแท่ง"
    options:
      - text: "ใช้ดินสอผูกเชือกสิ{k}"
        heart: 1
        reply: "ลองแล้ว เชือกพันขาตอนปีนบันได เกือบตก ระหว่างเสียดินสอกับเสียขา พี่เลือกเสียดินสอ"
      - text: "เอาไปหาในกองขี้เลื่อยกัน{k}"
        heart: 2
        reply: "เฮ้ย มาช่วยจริงเหรอ… เจอแล้ว สามแท่ง! แต่ไม่มีแท่งของวันนี้ แท่งของวันนี้อยู่หลังหูพี่ พี่ลืม"

  - id: piak_s_lunch
    topic: smalltalk
    when: { time: noon }
    npc: "พักเที่ยงแล้ว ข้าวมันไก่หน้าตลาดห่อนึง ชาวบ้านเห็นช่างกินข้าวมันไก่แล้วถามว่ารวยแล้วเหรอ ไม่ได้รวย ห่อละห้าสิบ แค่ไม่อยากกินมาม่าอีกวัน"
    options:
      - text: "ช่างทำงานหนัก ต้องกินดีๆ{k}"
        heart: 1
        reply: "ใช่ไหม! บอกเมียพี่ด้วย เมียบอกว่าค่าข้าวพี่เดือนนึงซื้อปูนได้สิบถุง พี่บอกว่าไม่กินข้าวก็ยกปูนไม่ได้สักถุง"
      - text: "{p}มีลาบหมูมาฝาก{k}"
        take: { larb_moo: 1 }
        heart: 2
        reply: "ลาบหมู! ของโปรดพี่เลย กินแล้วตอกตะปูได้ทั้งบ่าย งานบ้านเราคิวขยับขึ้นมาหนึ่งอันดับแล้ว อย่าบอกลูกค้าคนอื่น"

  - id: piak_s_truck
    topic: smalltalk
    npc: "กระบะพี่อายุยี่สิบสองปี บอลบอกว่าเครื่องเหลือใจอยู่ครึ่งเดียว พี่บอกเหมือนพี่เลย เหลือใจครึ่งเดียว แต่ยังขนไม้ได้ทุกวัน"
    options:
      - text: "ใจอีกครึ่งพี่ไปไหน{kq}"
        heart: 1
        reply: "ทิ้งไว้บนนั่งร้านชั้นยี่สิบที่กรุงเทพฯ มั้ง… ไม่ใช่เรื่องเศร้านะ พี่แค่เลือกเอาใจครึ่งที่เหลือกลับบ้าน"
      - text: "เปลี่ยนรถใหม่สิ{kq}"
        heart: 0
        reply: "รถใหม่ผ่อนเดือนละหมื่น ค่าแรงพี่เดือนละหมื่นสอง พี่จะเหลือสองพันไว้ซื้อน้ำมันใส่รถใหม่ที่ไม่มีไม้ให้ขน"

  # ===== self =====
  - id: piak_f_third
    topic: self
    npc: "พี่เป็นช่างรุ่นที่สามของบ้าน ปู่สร้างศาลาวัด พ่อสร้างบ้านยายเรากับครึ่งตำบล พี่… พี่ซ่อมของที่ปู่กับพ่อสร้าง"
    options:
      - text: "พี่ก็สร้างของตัวเองด้วยนะ{k}"
        heart: 1
        reply: "สร้าง แต่ไม่มีชิ้นไหนที่พี่ภูมิใจเท่าศาลาปู่ ศาลาหลังนั้นไม่มีตะปูสักตัว เข้าเดือยทั้งหลัง ร้อยปีแล้วยังไม่โยก"
      - text: "ลูกพี่จะเป็นช่างไหม{kq}"
        heart: 1
        reply: "ลูกพี่อยากเป็นยูทูบเบอร์ พี่บอกได้ ขอให้ถ่ายตอนพ่อทำงานด้วย อย่างน้อยวิชาช่างจะได้อยู่ในโทรศัพท์ ถ้าไม่ได้อยู่ในมือ"

  - id: piak_f_scaffold
    topic: self
    when: { heart_min: 3 }
    npc: "ตอนพี่อยู่กรุงเทพฯ ชั้นยี่สิบ เชือกนิรภัยขาด พี่ห้อยอยู่ด้วยมือข้างเดียวสามสิบวินาที เพื่อนดึงขึ้นมาทัน คืนนั้นพี่ซื้อตั๋วรถทัวร์กลับบ้าน ไม่ได้บอกหัวหน้าเลย"
    options:
      - text: "สามสิบวินาทีนั้นพี่คิดอะไร{kq}"
        heart: 2
        reply: "คิดว่ายังไม่ได้สร้างอะไรให้บ้านตัวเองสักชิ้น สร้างคอนโดให้คนที่ไม่รู้จักชื่อพี่สามสิบชั้น แต่หลังคาบ้านแม่รั่วมาห้าปี"
        next:
          - text: "กลับมาแล้วซ่อมหลังคาแม่หรือยัง{kq}"
            heart: 2
            reply: "ซ่อมวันแรกที่กลับ ยังไม่ได้แกะกระเป๋าเลย แม่ยืนดูข้างล่างร้องไห้ พี่นึกว่าแม่ร้องเพราะพี่กลับ แม่บอกว่าร้องเพราะกลัวพี่ตกหลังคา ฮ่าๆ"
          - text: "เพื่อนคนนั้นยังติดต่อกันไหม{kq}"
            heart: 1
            reply: "ยังอยู่ที่นั่น โทรมาปีละครั้ง ทุกครั้งพี่ขอบคุณ ทุกครั้งเขาบอกว่า ‘เลิกขอบคุณได้แล้วเปี๊ยก’ พี่เลิกไม่ได้"
      - text: "น่ากลัวจัง{k}"
        heart: 1
        reply: "ตอนนี้ไม่กลัวแล้ว แต่พี่ไม่รับงานเกินชั้นสอง ใครจ้างสร้างตึกสามชั้นพี่ส่งไปให้คนอื่น ชั้นสองคือความสูงที่ตกแล้วยังกลับมาบ่นได้"

  - id: piak_f_wife
    topic: self
    when: { heart_min: 5 }
    npc: "ความลับนะ พี่สลักชื่อเมียไว้ใต้ขื่อทุกบ้านที่สร้าง บ้านกำนัน ศาลาหลังวัด ห้องน้ำโรงเรียน ทุกหลัง เมียไม่รู้ ถ้ารู้จะว่าพี่บ้า"
    options:
      - text: "โรแมนติกมาก{k}พี่"
        heart: 2
        reply: "โรแมนติกที่ไม่มีใครเห็น ช่างก็แบบนี้แหละ งานดีที่สุดอยู่ในที่ที่ไม่มีใครมอง ฐานราก ใต้ขื่อ ในผนัง"
        next:
          - text: "บอกพี่สะใภ้บ้างสิ{k}"
            heart: 1
            reply: "ไว้วันครบรอบสามสิบปี พี่จะพาไปบ้านทุกหลัง ปีนบันไดชี้ให้ดูทีละชื่อ ถ้าเมียไม่เป็นลมก่อนหลังที่สาม"
          - text: "บ้านยาย{p}มีไหม{kq}"
            heart: 2
            reply: "บ้านยายเราพ่อพี่สร้าง ใต้ขื่อมีชื่อแม่พี่… พ่อเริ่มธรรมเนียมนี้ พี่แค่ทำต่อ ไปส่องดูได้ ขื่อกลางบ้าน ด้านทิศตะวันออก"
      - text: "ถ้าหย่ากันล่ะ{kq}"
        heart: -1
        reply: "เฮ้ย! ปากไม่ดีเลย… ถ้าหย่า พี่ต้องรื้อบ้านทั้งตำบล ช่างไม่มีทางเลือก เลยไม่หย่า ง่ายดี"

  - id: piak_f_guilt
    topic: self
    when: { heart_min: 7 }
    npc: "พี่มีเรื่องติดค้างยายเรา พี่ไม่เคยบอกใคร ยายจ้างพี่ทำของชิ้นนึงก่อนยายไป จ่ายมัดจำแล้ว พี่ผัดไปเรื่อยๆ เพราะงานเยอะ แล้วยายก็ไปก่อน มัดจำยังอยู่ในลิ้นชักพี่ ไม่กล้าแตะ"
    options:
      - text: "ยายจ้างทำอะไร{kq}"
        heart: 2
        reply: "แคร่ไม้มีพนักพิง มีหลังคาเล็กๆ ใต้ต้นมะม่วงข้างแปลงผัก ยายบอกว่า ‘อยากนั่งดูผักโตแบบไม่ปวดหลัง’ พี่บอกเดือนหน้าเสร็จ… เดือนหน้าของพี่ยาวไปสองปี"
        next:
          - text: "ทำให้เสร็จตอนนี้ได้ไหม{kq}"
            heart: 2
            reply: "…ได้ไหมวะ พี่ถามตัวเองทุกคืน หลานอยากให้ทำไหม ถ้าหลานอยากให้ทำ พี่ทำ พี่จะทำให้ดีกว่าที่ยายสั่งไว้"
          - text: "ยายไม่โกรธพี่หรอก{k}"
            heart: 1
            reply: "พี่รู้ ยายไม่เคยโกรธใคร นั่นแหละที่ทำให้พี่รู้สึกแย่กว่าเดิม คนที่ไม่โกรธ เราติดค้างเขาตลอดไป"
      - text: "มัดจำคืน{p}ก็ได้นะ{k}"
        heart: 0
        reply: "ไม่ ไม่คืน พี่รับงานแล้ว ช่างรับงานแล้วต้องส่งงาน ไม่ได้ส่งเงินคืน นั่นมันศักดิ์ศรีช่าง"

  # ===== others =====
  - id: piak_o_ball
    topic: others
    npc: "บอลอู่ซ่อมรถมาช่วยพี่ยกขื่อเมื่อวาน แรงดี มือนิ่ง ถ้าบอลไประยอง ตำบลจะเหลือช่างอายุต่ำกว่าสี่สิบแค่พี่… พี่อายุสี่สิบสาม ไม่เหลือเลยสักคน"
    options:
      - text: "พี่ชวนบอลมาเป็นช่างไม้ด้วยกันสิ{k}"
        heart: 1
        reply: "ชวนแล้ว บอลบอกว่าไม้ไม่มีเครื่องยนต์ ไม่สนุก พี่บอกไม้มีชีวิต เครื่องยนต์มีแต่น้ำมัน เราเถียงกันจนตะวันตกดิน เถียงกับบอลแล้วพี่รู้สึกหนุ่ม"
        next:
          - text: "พี่อยากให้บอลอยู่ใช่ไหม{kq}"
            heart: 1
            reply: "อยาก แต่พี่จะไม่ขอ พี่เคยไปมาแล้ว รู้ว่าต้องไปเองถึงจะรู้ว่าอยากกลับไหม ถ้าบอลกลับมา บ้านหลังใหม่พี่คิดราคาพี่น้อง"
          - text: "นกจะว่ายังไงนะ{kq}"
            heart: 0
            reply: "เรื่องนั้นพี่ไม่ยุ่ง ช่างไม่ยุ่งเรื่องหัวใจ ช่างยุ่งแต่เรื่องหลังคา… แต่ถ้าสองคนนั้นจะสร้างบ้าน พี่ทำฟรี"
      - text: "บอลเก่งไหม{kq}"
        heart: 1
        reply: "เก่ง ฟังเสียงเครื่องแล้วรู้ว่าเสียตรงไหน เหมือนพี่เคาะไม้แล้วรู้ว่าปลวกกิน คนแบบนี้หายากกว่าไม้สัก"

  - id: piak_o_jamrat
    topic: others
    npc: "ลุงจำรัสจดทุกอย่าง พี่ไปซ่อมหลังคาวัดสาย ห้านาที ลุงจดลงสมุดว่า ‘ช่างเปี๊ยกสาย 5 นาที ฝนไม่ตก’ พี่ซ่อมฟรีนะ ยังโดนจด"
    options:
      - text: "ลุงจดไปทำอะไร{kq}"
        heart: 1
        reply: "ลุงบอกว่าวันหน้าจะมีคนอยากรู้ว่าใครทำอะไรให้วัดบ้าง สมุดลุงจำรัสคือประวัติศาสตร์ตำบลที่เขียนด้วยลายมือคนเดียว พี่อยู่ในนั้นสามร้อยหน้า สายห้าสิบครั้ง"
      - text: "พี่ซ่อมวัดฟรีทุกครั้งเลยเหรอ{kq}"
        heart: 1
        reply: "ปู่พี่สร้างศาลาวัด พ่อพี่สร้างกุฏิ พี่จะไปคิดเงินวัดได้ยังไง วัดดงเย็นเลี้ยงข้าวพี่มาตั้งแต่เด็ก ข้าวก้นบาตรอร่อยกว่าข้าวมันไก่อีก"

  - id: piak_o_heng
    topic: others
    npc: "เสี่ยเฮงขายปูนให้พี่เชื่อได้ เซ็นทีไรพี่รู้สึกเหมือนกำลังเทฐานรากให้บ้านเสี่ย… แต่ปีก่อนพี่ป่วยสองเดือน เสี่ยไม่ทวงสักบาท ไม่พูดสักคำ"
    options:
      - text: "เสี่ยใจดีกว่าที่คิดนะ{k}"
        heart: 1
        reply: "พี่ไม่รู้ว่าใจดีหรือลืม เสี่ยไม่เคยลืมอะไร งั้นคงใจดี… อย่าบอกเสี่ยว่าพี่พูด เสี่ยจะขึ้นดอกพี่เพื่อรักษาภาพลักษณ์"
      - text: "พี่ยังติดหนี้เสี่ยอยู่ไหม{kq}"
        heart: 0
        reply: "ติด ช่างทุกคนในอำเภอติดเสี่ย เสี่ยคือธนาคารของคนที่ธนาคารไม่ให้กู้ ช่างไม่มีสลิปเงินเดือน ธนาคารมองช่างเหมือนมองนั่งร้าน"

  - id: piak_o_wichai
    topic: others
    npc: "นายกวิชัยมาจ้างพี่ทำซุ้มประตูหน้าบ้าน ลายไทย ไม้สัก ใหญ่กว่าซุ้มประตูวัด พี่ปฏิเสธไป บอกคิวยาว นายกบอกว่า ‘ช่างเปี๊ยกไม่ค่อยร่วมมือกับการพัฒนานะ’"
    options:
      - text: "พี่ไม่รับเพราะอะไร{kq}"
        heart: 1
        reply: "ซุ้มหน้าบ้านนายกใหญ่กว่าซุ้มวัด พี่ทำไม่ได้ มือพี่ไม่ยอม ปู่พี่สร้างซุ้มวัดไว้ ใครจะให้พี่ทำของที่ใหญ่กว่าของปู่ไปให้คนที่ไม่เคยมาวัดเลย"
        next:
          - text: "แล้วใครทำให้นายก{kq}"
            heart: 0
            reply: "ช่างจากอำเภอ ทำสองเดือน ไม้สักเกรดบี ลงงบซ่อมศาลาประชาคม ไม่ใช่ๆ พี่พูดเกินไป พี่ไม่ได้เห็นใบเสร็จ"
          - text: "พี่กล้ามากนะ{k}"
            heart: 1
            reply: "ไม่ได้กล้า แค่ไม่อยากตื่นมาเจอซุ้มนั้นทุกเช้าตอนขับรถผ่าน ช่างจำงานตัวเองได้ทุกชิ้น งานที่ไม่ชอบจะตามหลอนเหมือนผี"
      - text: "รับไปก็ได้เงินนี่{kq}"
        heart: 0
        reply: "ได้ แต่เงินซื้อปูนได้ ซื้อการนอนหลับไม่ได้"

  - id: piak_o_cherd
    topic: others
    npc: "ลุงเชิดมาให้พี่เปลี่ยนเบาะคนขับเจ้าเขียว เบาะเดิมนั่งมาสิบห้าปีจนเป็นรูปก้นลุง พี่ทำใหม่ ลุงนั่งแล้วบอกว่าไม่ใช่ ขอเบาะเก่าคืน"
    options:
      - text: "ลุงติดเบาะเก่าเหรอ{kq}"
        heart: 1
        reply: "ลุงบอกว่าเบาะเก่าจำลุงได้ เบาะใหม่ยังไม่รู้จักกัน พี่เลยซ่อมเบาะเก่าแทน เย็บหนังใหม่ แต่เก็บฟองน้ำรูปก้นลุงไว้ ลุงนั่งแล้วยิ้ม"
      - text: "เจ้าเขียวยังไหวไหม{kq}"
        heart: 1
        reply: "ตัวถังพี่ดูให้ได้ เครื่องต้องบอล พื้นรถผุสองจุด พี่ปะไว้แล้ว ถ้ารถคันนี้หยุดวิ่ง ลุงเชิดจะหยุดด้วย สองคนนี้ใช้หัวใจดวงเดียวกัน"

quests:
  - id: piak_q1
    npc: piak
    title: "ใบสั่งงานในลิ้นชัก"
    desc: "ยายเพียรเคยจ้างช่างเปี๊ยกทำแคร่ใต้ต้นมะม่วง แต่ยังไม่ได้ทำ"
    start: { heart_min: 2, day_min: 3 }
    offer:
      npc: "หลาน… พี่มีเรื่องต้องสารภาพ ยายเราจ่ายมัดจำพี่ไว้ทำแคร่มีพนักพิงใต้ต้นมะม่วง พี่ผัดจนยายไปก่อน มัดจำพันห้ายังอยู่ในลิ้นชัก พี่อยากทำให้เสร็จ ถ้าหลานยอม"
      options:
        - text: "ทำเลย{k}พี่ ยายคงดีใจ"
          accept: true
          heart: 2
          reply: "ขอบใจเว้ย… ขอบใจนะ พี่ต้องใช้ไม้โครงก่อน ไม้ฟืนในฟาร์มยายท่อนใหญ่ๆ มีเยอะ คัดมาสักสิบท่อน พี่จะไสเอง"
        - text: "ทำไมพี่ไม่ทำตั้งแต่ตอนนั้น{kq}"
          accept: true
          heart: 0
          reply: "งานเยอะ… ไม่ใช่ พี่ข้ออ้าง ตอนนั้นมีงานบ้านกำนันจ่ายดีกว่า พี่เลือกเงิน แล้วยายก็ไป เอาไม้มาสิบท่อน พี่จะไม่เลือกผิดอีก"
        - text: "ไม่ต้องหรอก{k} คืนมัดจำก็พอ"
          heart: -1
          reply: "พี่คืนเงินไม่ได้ ช่างรับงานแล้วต้องส่งงาน… ไม่เป็นไร ไว้หลานเปลี่ยนใจค่อยบอกพี่"
    steps:
      - goal: { type: give, npc: piak, item: wood, n: 10 }
        hint: "คัดไม้ฟืนท่อนใหญ่ 10 ท่อนจากฟาร์มไปให้ช่างเปี๊ยกที่โรงช่าง"
        done:
          npc: "ไม้จากฟาร์มยาย… ท่อนนี้ไม้มะขามต้นที่ยายตัดเมื่อปีก่อนแน่ๆ แข็งดี ทำขาแคร่ได้ พี่ดีใจที่ไม้ยายจะได้กลับไปอยู่ใต้ต้นมะม่วงยายอีกครั้ง"
          options:
            - text: "พี่รู้ด้วยว่าไม้มาจากต้นไหน{kq}"
              heart: 1
              reply: "ช่างดูเสี้ยนไม้แล้วรู้ ไม้มะขามเสี้ยนบิดเหมือนนิสัยยายตอนมีคนมาขอซื้อที่ ฮ่าๆ"
            - text: "ทำนานไหม{kq}"
              heart: 0
              reply: "โครงสามวัน แต่พนักพิงต้องใช้ไม้ดีกว่านี้ ไม้ฟืนรับน้ำหนักได้ แต่พิงแล้วเสี้ยนตำหลัง ยายไม่ได้จ่ายเงินมาให้โดนเสี้ยน"
      - goal: { type: days, n: 2 }
        hint: "รอ 2 วันให้ช่างเปี๊ยกไสไม้ทำโครง"
        done:
          npc: "โครงเสร็จแล้ว ได้ฉากทุกมุม พี่วัดสามรอบ… แต่พนักพิงนี่สิ พี่อยากได้ไม้สัก ไม้สักลูกบาศก์ฟุตละเท่าไหร่หลานรู้ไหม แพงกว่าแคร่ทั้งตัวอีก"
          options:
            - text: "ไม่มีวิธีอื่นเหรอ{kq}"
              heart: 1
              reply: "มี วัดกำลังรื้อหลังคาโรงครัวเก่า ขื่อเป็นไม้สักร้อยปี ปู่พี่วางไว้ ถ้าลุงจำรัสยอม เราจะได้ไม้ที่ดีที่สุดในตำบล"
            - text: "ไม้อะไรก็ได้{k}พี่"
              heart: 0
              reply: "ไม่ได้ ยายนั่งดูผักทุกเย็น พนักต้องดีที่สุด พี่ติดยายสองปี ต้องจ่ายดอกด้วยไม้ที่ดีกว่าสัญญา"
    reward: { money: 150, heart: 2, set_flag: piak_q1_done, line: { from: piak, text: "รับทำแคร่ ม้านั่ง โต๊ะไม้ ตามสั่ง คิวเต็มถึงหน้าหนาว… ยกเว้นงานค้างเก่า งานค้างเก่าทำก่อนเสมอ 🔨" } }

  - id: piak_q2
    npc: piak
    title: "ขื่อไม้สักหลังคาวัด"
    desc: "ช่วยช่างเปี๊ยกซ่อมหลังคาโรงครัววัด แลกไม้สักเก่ามาทำพนักแคร่"
    start: { flag: piak_q1_done, heart_min: 3, day_min: 7 }
    offer:
      npc: "พรุ่งนี้เช้าพี่ขึ้นหลังคาโรงครัววัด ซ่อมฟรีเหมือนทุกปี ขื่อเก่าที่รื้อลงมาเป็นไม้สักปู่พี่ ถ้าลุงจำรัสยอมให้เบิก เราได้ไม้พนักแคร่ยาย มาช่วยพี่ยกของหน่อยได้ไหม"
      options:
        - text: "ได้{k}พี่ กี่โมง{kq}"
          accept: true
          heart: 2
          reply: "แปดโมงถึงสิบเอ็ดโมง ก่อนแดดเที่ยง ใส่รองเท้าหุ้มส้น มีตะปูเก่าเยอะ ถ้าเหยียบตะปูต้องไปฉีดยาบาดทะยัก พี่ไม่อยากเลี้ยงข้าวต้มคนป่วย"
        - text: "ไม้วัดเอามาใช้ได้เหรอ{kq}"
          accept: true
          heart: 0
          reply: "ต้องขอลุงจำรัส ลุงจะจดลงสมุด จะขอให้ทำบุญหรือแลกแรงงานก็แล้วแต่ลุง เราไม่เอาของวัดฟรีๆ นะเว้ย"
        - text: "{p}ไม่ว่าง{k}"
          heart: 0
          reply: "ไม่เป็นไร ปีหน้าก็ซ่อมอีก หลังคาวัดรั่วทุกปีเหมือนงบ อบต."
    steps:
      - goal: { type: visit, place: temple, from: "08:00", to: "11:00" }
        hint: "ไปช่วยช่างเปี๊ยกซ่อมหลังคาโรงครัววัด (08:00–11:00)"
        done:
          npc: "เสร็จแล้ว! ขื่อเก่าสามท่อนกองอยู่ตรงนั้น ดูเสี้ยนสิหลาน ร้อยปียังแน่น… ตรงปลายขื่อมีรอยสลักชื่อ ‘บุญมา’ ชื่อย่าพี่ ปู่สลักไว้ พี่ไม่เคยรู้มาก่อน"
          options:
            - text: "ธรรมเนียมนี้มาจากปู่พี่เหรอ{kq}"
              heart: 2
              reply: "พี่นึกว่าพ่อเริ่ม… ปู่เริ่ม ปู่สลักชื่อย่า พ่อสลักชื่อแม่ พี่สลักชื่อเมีย สามรุ่นทำเรื่องเดียวกันโดยไม่มีใครบอกใคร พี่ขนลุกเลยเว้ย"
            - text: "ใช้ท่อนนี้ทำพนักแคร่ได้ไหม{kq}"
              heart: 1
              reply: "ท่อนนี้ไม่ได้ ท่อนนี้พี่จะเก็บไว้ให้ลูก ท่อนอื่นอีกสองท่อนพอทำพนักได้ ไปขอลุงจำรัสกัน"
      - goal: { type: talk, npc: jamrat }
        hint: "ไปขอลุงจำรัสเบิกไม้ขื่อเก่า"
        done:
          npc: "ไม้ขื่อโรงครัวเก่าสองท่อนเหรอหลาน ลุงจดไว้แล้ว ‘เบิกไม้เก่า 2 ท่อน ทำแคร่ให้ยายเพียร ผู้ล่วงลับ’ ยายเพียรทำบุญวัดนี้มาห้าสิบปี ไม้สองท่อนนี้ถือว่าวัดคืนยาย หลานจะทำบุญเพิ่มหรือไม่ก็ได้ ลุงไม่บังคับ"
          options:
            - text: "{p}ขอทำบุญค่าไม้ร้อยนึง{k}"
              heart: 2
              set_flag: piak_q2_merit
              reply: "สาธุ ลุงจดไว้ ‘หลานยายเพียร ทำบุญ 100 บาท ค่าไม้เก่า’ ลายมือลุงสวยที่สุดหน้านี้เลย"
            - text: "ขอบคุณ{k}ลุง"
              heart: 1
              reply: "ขอบคุณยายเถอะหลาน ลุงจดชื่อยายเพียรในสมุดมาสามสิบเล่ม ยายไม่เคยขอคืนอะไรจากวัดเลย ครั้งนี้ลุงจดในช่อง ‘วัดให้’ ครั้งแรก"
    reward: { money: 100, heart: 2, set_flag: piak_q2_done, line: { from: jamrat, text: "📒 บันทึกวัดดงเย็น: ซ่อมหลังคาโรงครัวเสร็จ ช่างเปี๊ยก (สาย 0 นาที) และหลานยายเพียร ช่วยยกของ ขออนุโมทนาบุญ 🙏" } }

  - id: piak_q3
    npc: piak
    title: "ลายบนพนัก"
    desc: "ช่างเปี๊ยกถามว่าจะแกะสลักอะไรบนพนักแคร่ — และต้องใช้หินทำฐาน"
    start: { flag: piak_q2_done, heart_min: 4, day_min: 11 }
    offer:
      npc: "พนักพิงไสเสร็จแล้ว เรียบเหมือนหน้าน้ำ พี่อยากแกะลายสักอย่าง แต่ไม่รู้ว่ายายชอบอะไร หลานรู้ไหม… แล้วพี่ต้องใช้หินรองขาแคร่กันปลวกด้วย"
      options:
        - text: "{p}ไม่แน่ใจ{k} ไปถามยายบัวดีไหม"
          accept: true
          heart: 1
          reply: "ดีเลย ยายบัวเป็นเพื่อนยายเรามาหกสิบปี ไปถามยายบัว แล้วเก็บหินก้อนใหญ่ๆ ในฟาร์มมาห้าก้อน พี่จะทำฐาน"
        - text: "แกะอะไรก็สวยแหละ{k}"
          accept: true
          heart: 0
          reply: "ไม่ได้ ของยายต้องเป็นของยาย ไปถามยายบัวเถอะ แล้วเอาหินมาห้าก้อนด้วย"
        - text: "ไม่ต้องแกะหรอก{k}"
          heart: 0
          reply: "ก็ได้ ไม่แกะก็เรียบดี แต่ถ้าเปลี่ยนใจบอกพี่ ไม้สักร้อยปีรอได้"
    steps:
      - goal: { type: give, npc: piak, item: stone, n: 5 }
        hint: "เก็บหินก้อนใหญ่ 5 ก้อนจากฟาร์มไปให้ช่างเปี๊ยกทำฐานแคร่"
        done:
          npc: "หินดี ก้อนนี้แบนพอดี วางขาแคร่ได้เลย ฐานรากดีแคร่ก็ไม่โยก คนนั่งก็ไม่โยก พี่เชื่อแบบนี้ทุกงาน"
          options:
            - text: "พี่พูดเรื่องแคร่หรือเรื่องคน{kq}"
              heart: 1
              reply: "ทั้งสองแหละ ช่างพูดอะไรก็เรื่องฐานรากหมด พี่พูดเป็นอยู่เรื่องเดียว"
            - text: "หินพอไหม{kq}"
              heart: 0
              reply: "พอ เหลือหนึ่งก้อน พี่จะวางไว้ข้างแคร่ ให้คนนั่งวางแก้วน้ำ ยายชอบมีที่วางแก้ว"
      - goal: { type: talk, npc: bua }
        hint: "ไปถามยายบัวว่ายายเพียรชอบอะไร"
        done:
          npc: "เพียรน่ะเหรอ… ชอบดอกพิกุล เก็บดอกที่ร่วงใส่ขันทุกเช้า บอกว่าดอกพิกุลแห้งแล้วยังหอม เหมือนคนดีตายแล้วยังมีคนพูดถึง… แล้วยายเพียรก็ชอบกลอนบทหนึ่ง ‘ปลูกผักให้คนกิน ปลูกดินให้ลูกหลาน’ ยายท่องทุกเช้าตอนรดน้ำ"
          options:
            - text: "ขอบคุณ{k}ยาย {p}ไม่เคยรู้เลย"
              heart: 2
              reply: "ยายเพียรไม่เคยเล่าเรื่องตัวเองหรอกหลาน ยายเพียรเล่าแต่เรื่องหลาน ทุกครั้งที่หลานโทรมา ยายเพียรเล่าให้ยายฟังสามวัน"
            - text: "ยายบัวคิดถึงยายไหม{kq}"
              heart: 2
              reply: "ทุกเช้าตอนดอกพิกุลร่วง ยายยังเก็บเผื่อเพียรทุกวัน แก่แล้วนิสัยมันไม่ยอมตายตามคน"
      - goal: { type: days, n: 3 }
        hint: "รอ 3 วันให้ช่างเปี๊ยกแกะสลัก แล้วไปฟังว่าเขาเลือกอะไร"
        done:
          npc: "พี่ร่างไว้สามแบบ หลานเลือกเลย ดอกพิกุลร่วงเต็มพนัก กลอนของยาย หรือ… ชื่อยาย แบบที่พ่อพี่สลักใต้ขื่อ หลานเลือกนะ พี่แกะได้ทุกแบบ"
          options:
            - text: "ดอกพิกุล{k}"
              heart: 2
              set_flag: piak_q3_flower
              reply: "ดอกพิกุลสิบสองดอก เท่ากับเดือนที่ยายนั่งตรงนั้นในหนึ่งปี พี่จะแกะดอกนึงให้เหมือนกำลังร่วง ยังไม่ถึงพื้น"
            - text: "กลอนของยาย{k}"
              heart: 2
              set_flag: piak_q3_poem
              reply: "‘ปลูกผักให้คนกิน ปลูกดินให้ลูกหลาน’ พี่จะแกะตัวหนังสือเอนนิดๆ เหมือนลายมือคนแก่ ใครนั่งแล้วพิงจะได้แบกกลอนยายไว้ข้างหลัง"
            - text: "ชื่อยาย ใต้พนัก ไม่ต้องให้ใครเห็น"
              heart: 2
              set_flag: piak_q3_name
              reply: "ใต้พนัก… แบบช่างบ้านพี่ งานดีที่สุดอยู่ในที่ที่ไม่มีใครมอง หลานเข้าใจช่างมากกว่าลูกค้าคนไหนที่พี่เคยมี"
    reward: { money: 150, heart: 2, set_flag: piak_q3_done, line: { from: piak, text: "งานแกะสลักชิ้นแรกในรอบสองปี มือยังไม่ลืม 🪵 (ไม่บอกว่างานของใคร เดี๋ยวคนมาแห่ดู)" } }

  - id: piak_q4
    npc: piak
    title: "แคร่ใต้ต้นมะม่วง"
    desc: "แคร่ของยายเสร็จแล้ว — และช่างเปี๊ยกต้องตัดสินใจเรื่องงานโกดังของบริษัท"
    start: { flag: piak_q3_done, heart_min: 6, day_min: 17 }
    offer:
      npc: "แคร่ยายเสร็จแล้ว พี่ยกไปวางใต้ต้นมะม่วงเมื่อเช้า ไม่บอกหลานก่อน อยากให้เจอเอง… แต่พี่มีอีกเรื่อง บริษัทยื่นคำขาด รับงานโกดังภายในสัปดาห์นี้ ค่าแรงสองเท่า หลานช่วยพี่คิดหน่อย"
      options:
        - text: "{p}จะช่วยพี่คิด{k}"
          accept: true
          heart: 2
          reply: "ไปคุยกับบอลก่อน บอลเคยบอกว่าอยากลองงานไม้ ถ้าบอลจริงจัง พี่มีทางเลือกที่สาม แล้วเย็นนี้มาหาพี่ที่โรงช่าง"
        - text: "ขอบคุณเรื่องแคร่{k}พี่"
          accept: true
          heart: 2
          reply: "ไม่ต้องขอบคุณ พี่ใช้หนี้… แต่ถ้าอยากตอบแทน ช่วยพี่คิดเรื่องงานบริษัทหน่อย ไปถามบอลก่อน แล้วมาหาพี่เย็นนี้"
        - text: "เรื่องงานพี่ตัดสินเองเถอะ{k}"
          heart: 0
          reply: "ก็จริง… แต่พี่นึกว่าเราเป็นทีมกันแล้ว ไม่เป็นไร แคร่อยู่ใต้ต้นมะม่วงนะ ไปนั่งดูได้"
    steps:
      - goal: { type: talk, npc: ball }
        hint: "ไปถามบอลที่อู่ ว่าอยากเรียนงานไม้กับช่างเปี๊ยกจริงไหม"
        done:
          npc: "พี่เปี๊ยกให้มาถามเหรอ… ผมอยากลองนะ ซ่อมรถเงียบๆ บางวันไม่มีรถเข้าเลย ถ้าพี่เปี๊ยกรับผมเป็นลูกมือช่วงบ่าย ผมอาจจะไม่ต้องไประยอง… ผมยังไม่แน่ใจ แต่ผมอยากลอง"
          options:
            - text: "ลองดูเถอะ{k} ตำบลต้องการช่างหนุ่ม"
              heart: 1
              reply: "ครับ ถ้าผมตอกตะปูโดนนิ้ว บอกพี่เปี๊ยกว่าคุณเป็นคนชวน"
            - text: "อย่าเปลี่ยนใจเพราะ{p}นะ{k}"
              heart: 1
              reply: "ไม่ได้เปลี่ยนเพราะคุณหรอก เปลี่ยนเพราะเห็นแคร่ใต้ต้นมะม่วงบ้านคุณเมื่อเช้า ผมยืนดูสิบนาที อยากทำอะไรแบบนั้นได้บ้าง"
      - goal: { type: visit, place: workshop, from: "16:00", to: "17:30" }
        hint: "ไปหาช่างเปี๊ยกที่โรงช่างตอนเย็น (16:00–17:30)"
        done:
          npc: "บอลว่าไง… ดี พี่มีสามทางแล้ว รับงานบริษัท ได้เงินค่าเทอมลูกสบาย ไม่รับ ทำงานช่างตำบลต่อแบบเดิม หรือไม่รับ แล้วเปิดสอนช่างให้บอลกับเด็กๆ ที่โรงเรียนกับครูเต้ย เงินน้อยสุดแต่… หลานว่าไง"
          options:
            - text: "ไม่รับ{k} พี่เป็นช่างของตำบล"
              heart: 2
              set_flag: piak_end_bench
              reply: "ช่างของตำบล… พี่จะเอาคำนี้สลักใต้ขื่อโรงช่าง ค่าเทอมลูกพี่จะรับงานเพิ่ม แคร่แบบของยายมีคนถามแล้วสามบ้าน"
            - text: "รับงานบริษัทไปเถอะ แต่ให้เขาจ้างช่างในตำบลด้วย"
              heart: 1
              set_flag: piak_end_company
              reply: "เออ… พี่จะไปต่อรอง จ้างพี่ต้องจ้างช่างตำบลห้าคน ถ้าเขายอม พี่ไป ถ้าไม่ยอม พี่ก็รู้แล้วว่าเขาต้องการช่างหรือต้องการแค่มือ"
            - text: "เปิดสอนช่าง{k} ให้วิชาพี่อยู่ต่อ"
              heart: 2
              set_flag: piak_end_apprentice
              reply: "สอน… ปู่สอนพ่อ พ่อสอนพี่ พี่ยังไม่ได้สอนใครเลย บอลวันจันทร์ เด็กโรงเรียนวันพุธ ครูเต้ยจะดีใจ พี่จะให้ทุกคนสลักชื่อคนที่รักไว้ใต้งานชิ้นแรก"
    reward: { money: 300, heart: 2, items: { larb_moo: 1 }, set_flag: piak_q4_done, line: { from: piak, text: "📸 แคร่ไม้สักใต้ต้นมะม่วงบ้านยายเพียร งานค้างสองปี ส่งงานแล้วครับยาย 🙏🪵" } }
