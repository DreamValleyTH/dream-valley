    npc: "ไผ่เผาข้าวหลามต้องเลือกไผ่ข้าวหลามเด้อ ปล้องยาว เยื่อหนา ไผ่อื่นเยื่อบาง ข้าวหลามบ่หอม แกะออกมาเปลือยๆ เหมือนคนบ่นุ่งซิ่น"
    options:
      - text: "ดูยังไงว่าเยื่อหนา{kq}"
        heart: 1
        reply: "เคาะดูเด้อ เสียงทึบแปลว่าเยื่อหนา เสียงใสแปลว่าเยื่อบาง… คนกะคือกัน คนเสียงใสหลายบ่ค่อยมีอีหยังข้างใน"
      - text: "ใส่ถั่วดำด้วยไหม{kq}"
        heart: 1
        reply: "ใส่เด้อ บ่ใส่บ่แซบ… บัวบ่มักถั่วดำ ฟันบัวบ่ดี ข้อยต้องเผาแยกกระบอกให้บัวทุกปี บัวนี่กินยากแท้"

  - id: chan_a_patience
