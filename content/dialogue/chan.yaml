    npc: "แดดแรงจั่งซี้ นุ่งผ้าฝ้ายเด้อ บ่นุ่งผ้าโรงงานลื่นๆ… ผ้าฝ้ายดูดเหงื่อ ลมผ่านได้ ทำนาทั้งวันบ่เป็นผื่น"
    options:
      - text: "ผ้าฝ้ายแพงไหม{kq}"
        heart: 1
        reply: "ผืนละหลายร้อยเด้อ แต่ใส่ได้สิบปี… เสื้อโรงงานผืนละร้อย ใส่ได้ปีหนึ่ง เจ้าคิดเอาเอง ข้อยคิดบ่เก่ง แต่ข้อยใส่ผ้าผืนเดิมมาสิบปีแล้ว"
      - text: "{p}ใส่เสื้อยืดสบายกว่า{k}"
        heart: 0
        reply: "สบายตอนเช้า ตอนเที่ยงมันติดหลังเหมือนใบตองเปียก… บ่เป็นหยังเด้อ ลองเหงื่อท่วมสักมื้อ แล้วค่อยมาขอผ้าข้อย"

  - id: chan_a_bamboo
