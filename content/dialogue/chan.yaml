      - text: "ยายคงคิดถึงตามาก{k}"
        heart: 1
        reply: "คึดฮอดเด้อ… แต่บ่เศร้าหลายแล้ว ข้อยมีเส้นด้ายให้จับทุกวัน คนมีอีหยังให้จับทุกวัน บ่ค่อยหลง"

  - id: chan_f_daughter
