            reply: "มิว… มิวมือละเอียดแท้ แต่ยายมิวว่าให้เรียนหนังสือก่อน ข้อยบ่อยากแย่งเด็กไปจากหนังสือ แต่ถ้าเด็กมาเอง ข้อยกะบ่ไล่"
          - text: "{p}ลองเรียนดูได้ไหม{kq}"
            heart: 2
            reply: "เจ้า… มือเจ้าใหญ่ไปนิด ใจร้อนไปหลาย แต่ข้อยสอนได้เด้อ เริ่มจากดอกแก้วดอกเดียว ทอเสร็จแล้วค่อยว่ากัน"

  - id: chan_f_name
