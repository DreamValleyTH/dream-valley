            reply: "โอย… หมาจะงอนข้อยเด้อ แต่บ่เป็นหยัง หมามันอ้วนพอแล้ว มาทุกเช้าเด้อลูกหลาน ข้าวจี่ร้อนตอนเจ็ดโมง"
