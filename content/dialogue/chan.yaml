        heart: 1
        reply: "ลองเด้อ… ช้าลงบ่ได้แปลว่าขี้คร้าน ช้าลงแปลว่าเจ้าเห็นเส้นด้ายทุกเส้น"

  # ===== smalltalk =====
  - id: chan_s_words
    topic: smalltalk
    npc: "มาเรียนพวนกับข้อยบ่ลูกหลาน… ‘เฮือน’ คือบ้าน ‘มัก’ คือชอบ ‘ย่าน’ คือกลัว เจ้าลองพูดดูสิ ‘ข้อยมักเฮือนยาย’"
    options:
      - text: "ข้อยมักเฮือนยาย{k}"
        heart: 2
        reply: "โอย แม่นแท้! สำเนียงเจ้าเหมือนคนกรุงเทพฯ อ่านป้ายรถเมล์ แต่ข้อยฟังแล้วชื่นใจหลายเด้อ"
