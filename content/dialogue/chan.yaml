            reply: "เพียรกะว่าจั่งซี้ทุกเช้า สามสิบปี บ่เคยเบื่อ… ข้อยว่าเพียรโกหก แต่ข้อยมักให้เพียรโกหก"
      - text: "{p}กินแล้ว{k} ขอบคุณ"
        heart: 1
        reply: "กินแล้วกะเอาไปเด้อ เก็บไว้กินตอนบ่าย ข้าวจี่บ่บูดง่าย… ไม้นี้ของเจ้าแล้ว ข้อยปั้นไว้แล้ว ข้อยบ่เอาคืน"

