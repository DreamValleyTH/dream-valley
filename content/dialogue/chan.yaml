      - text: "ยายบัวจ่ายไหม{kq}"
        heart: 1
        reply: "จ่ายเด้อ แต่ข้าวหลามบัวบ่ใส่ถั่วดำ เพราะบัวบ่มัก… บัวจ่ายค่าเช่าเป็นของที่บัวมัก ข้อยว่าบัวขี้โกงแท้ แต่ข้อยกะกินหมด"
      - text: "ยายสองคนเป็นเพื่อนกันนานไหม{kq}"
        heart: 1
        reply: "หกสิบปีเด้อ… บัวปากบอกย่านผี แต่เล่าผีเก่งที่สุดในตำบล ข้อยปากบอกบ่ย่าน แต่ฟังบัวเล่าแล้วนอนบ่หลับทุกเทื่อ"

  - id: chan_o_mew
    topic: others
    npc: "มิวมานั่งดูข้อยทอทุกเย็นหลังเลิกเรียนเด้อ… วันนี้ถามข้อยว่าทำไมผ้าไทยพวนมีนาค ข้อยตอบว่าแม่ข้อยบอก มิวถามต่อว่าแม่ยายรู้ได้ไง ข้อยตอบบ่ได้แล้ว"
    options:
      - text: "น้องมิวถามเก่งจริงๆ{k}"
        heart: 1
        reply: "เก่งแท้… ข้อยว่าวันหนึ่งมิวจะเป็นคนตอบคำถามพวกนี้เอง ข้อยหวังว่ามิวจะตอบโดยมีผ้าอยู่ในมือ บ่ใช่มีแค่โทรศัพท์"
      - text: "แล้วนาคมีความหมายว่าอะไร{kq}"
        heart: 1
        reply: "นาคเฝ้าน้ำเด้อ… มีนาคมีน้ำ มีน้ำมีข้าว คนพวนเฮาทอนาคไว้ที่ชายซิ่น ให้น้ำอยู่กับคนทุกก้าวที่เดิน… ตอนนี้น้ำในบ่อหายหมด ข้อยว่านาคข้อยเหนื่อย"

  - id: chan_o_palm
    topic: others
    npc: "ปาล์มมาวัดขนาดกี่ข้อยด้วยตลับเมตร จดใส่สมุด แล้วว่า ‘ตามหลักวิชาการนะยาย กี่นี้ควรอยู่พิพิธภัณฑ์’ ข้อยว่าข้อยยังใช้อยู่ ยังบ่ตาย"
    options:
      - text: "ปาล์มคงหมายถึงว่ามีค่ามาก{k}"
        heart: 1
        reply: "ข้อยรู้เด้อ ปาล์มเป็นเด็กดี… แต่ของที่มีค่าบ่ควรอยู่ในตู้กระจก ควรอยู่ในมือคน ข้อยบอกปาล์ม ปาล์มว่า ‘ล้อเล่นๆ’ แล้วจดต่อ"
      - text: "ปาล์มช่วยขายผ้าให้ยายไหม{kq}"
        heart: 1
        reply: "ช่วยเด้อ ปาล์มบอกว่าจะพาผ้าข้อยไปออกงานจังหวัด ข้อยบอกไปได้ แต่ข้อยบ่ขึ้นเวที ข้อยย่านไมค์ ไมค์ผู้ใหญ่หอนใส่ข้อยมาห้าสิบปี"

  - id: chan_o_cherd
    topic: others
    npc: "ลุงเชิดฝากส่งผ้าให้ข้อยหลายปีแล้วเด้อ… ขึ้นรถเที่ยวเก้าโมง ยื่นห่อผ้า ลุงเชิดบ่เคยถามว่าส่งให้ไผ บ่เคยเปิดดู บ่เคยคิดค่าฝาก"
    options:
      - text: "ลุงเชิดใจดีจัง{k}"
        heart: 1
        reply: "ใจดีแท้… ตอนข้อยเป็นหนี้ค่าไหมพ่อค้า ลุงเชิดเป็นคนเอาเงินค่าซิ่นจากคนกรุงเทพฯ มาให้ข้อยทุกเดือน ข้อยบ่เคยรู้จักคนซื้อ รู้แค่ว่าลุงเชิดเอามา"
        next:
          - text: "คนกรุงเทพฯ คนนั้นเป็นใคร{kq}"
            heart: 1
            reply: "ข้อยบ่รู้เด้อ ลุงเชิดว่า ‘เขาไม่อยากให้บอกชื่อจ้ะ’ ข้อยทอให้สามผืน ผืนที่งามที่สุดในชีวิตข้อย… ข้อยอยากรู้หลายว่าเขานุ่งบ่"
          - text: "ยายเป็นหนี้เยอะไหม{kq}"
            heart: 1
            reply: "สองปีกว่าจะหมดเด้อ ถ้าบ่มีคนกรุงเทพฯ คนนั้น ข้อยคงต้องขายกี่… ข้อยถึงทอให้เขางามที่สุด เป็นคำขอบใจที่ข้อยพูดเป็นภาษาผ้า"
      - text: "ลุงเชิดตรงเวลาจริงไหม{kq}"
        heart: 1
        reply: "แม่นแท้เด้อ ข้อยไปช้านาทีเดียว รถออกแล้ว ลุงเชิดโบกมือ ‘ขึ้นๆ ออกแล้วนะ’ แต่บ่จอด… ข้อยเลยไปรอก่อนครึ่งชั่วโมงทุกเทื่อ"

  - id: chan_o_taew
    topic: others
    npc: "แต๋วมานั่งใต้ถุนข้อยทุกบ่าย เล่าเรื่องทั้งตำบลให้ข้อยฟัง ข้อยทอไปฟังไป… ซิ่นผืนนี้ข้อยว่ามีเรื่องลุงสมหมายซื้อหวยทออยู่ข้างในสามสิบเรื่อง"
    options:
      - text: "ป้าแต๋วเล่าเรื่องไหนสนุกสุด{kq}"
        heart: 1
        reply: "เรื่องผู้ใหญ่ประกาศหมาหายแล้วประกาศชื่อหมาผิด หมาที่หายเดินกลับมาเอง หมาที่ถูกประกาศชื่อหายไปแทน… แต๋วเล่าสามเทื่อ ข้อยหัวเราะสามเทื่อ"
      - text: "ยายเชื่อป้าแต๋วไหม{kq}"
        heart: 1
        reply: "เชื่อครึ่งเดียวเด้อ… แต่ครึ่งที่บ่จริงมันกะสนุก ข้อยแก่แล้ว ข้อยต้องการเรื่องสนุกหลายกว่าเรื่องจริง"

quests:
  - id: chan_q1
    npc: chan
    title: "น้ำย้อมครั่ง"
    desc: "บ่อยายจันทร์แห้ง ย้อมไหมไม่ได้ ช่วยหาบน้ำคลองและหามะขามมาเป็นน้ำยึดสี"
    start: { heart_min: 1, day_min: 4 }
    offer:
      npc: "ลูกหลานเด้อ… ข้อยต้องย้อมไหมสีครั่งให้ทันทอซิ่นผืนใหม่ แต่บ่อข้อยน้ำเหลือก้น ข้อยหาบน้ำคลองบ่ไหวแล้ว ขาข้อยสั่น… เจ้าช่วยข้อยได้บ่"
      options:
        - text: "ช่วยได้{k}ยาย"
          accept: true
          heart: 2
          reply: "ใจดีหลายเด้อ… พรุ่งนี้เช้าไปที่ปากคลอง ข้อยจะเอาคานหาบไปรอ หาบตอนเช้าน้ำเย็น ตะกอนน้อย"
        - text: "ย้อมครั่งต้องใช้น้ำเยอะเหรอ{kq}"
          accept: true
          heart: 1
          reply: "หลายแท้เด้อ ต้มครั่ง แช่ไหม ล้างไหม สามน้ำ… แล้วต้องมีมะขามเปียกให้สีติด บ่มีมะขาม สีแดงจะไหลหนีไปกับน้ำล้าง"
        - text: "ไว้ก่อนนะ{kq}ยาย"
          heart: 0
          reply: "บ่เป็นหยังเด้อ… ไหมรอได้ ข้อยแค่ย่านตาข้อยรอบ่ได้ ตาข้อยฝ้าลงทุกปี"
    steps:
      - goal: { type: visit, place: canal, from: "07:00", to: "09:00" }
        hint: "ไปที่คลองส่งน้ำตอนเช้า ช่วยยายจันทร์หาบน้ำไปย้อมไหม"
        done:
          npc: "(ยายจันทร์ยืนรอที่หัวสะพานกับคานหาบสองคู่) …หาบเบาๆ เด้อ อย่าให้น้ำกระฉอก น้ำที่กระฉอกคือน้ำที่หายไป ตอนนี้น้ำหายง่ายหลายแล้ว"
          options:
            - text: "(หาบจนครบสี่เที่ยว)"
              heart: 2
              reply: "สี่เที่ยวแท้… เจ้าบ่บ่นสักคำ เพียรกะหาบให้ข้อยจั่งซี้ตอนแล้งปีห้าสอง บ่บ่นสักคำคือกัน ข้อยคึดฮอดเพียรขึ้นมาเลย"
            - text: "หนักกว่าที่คิด{k}ยาย"
              heart: 1
              reply: "หนักแท้เด้อ ขาข้อยหาบมาห้าสิบปี เจ้าเพิ่งหาบมื้อแรก… บ่เป็นหยัง มื้อหน้าจะเบาลง เพราะเจ้ารู้แล้วว่าหนัก"
      - goal: { type: give, npc: chan, item: tamarind, n: 3 }
        hint: "เอามะขาม 3 ฝักไปให้ยายจันทร์ ใช้ทำน้ำยึดสีครั่ง"
        done:
          npc: "มะขามจากต้นเฮือนเพียร… ข้อยจำได้ ฝักยาวเปรี้ยวจัด ย้อมครั่งแล้วสีแดงเข้มเหมือนเลือดนก ดูสิ (ยายยกไจไหมขึ้นจากหม้อ) แดงแท้เด้อ บ่ด่างเลย"
          options:
            - text: "สวยมาก{k}ยาย จะทอเป็นลายอะไร"
              heart: 1
              reply: "ลายนาคเกี้ยวเด้อ ลายประจำเฮือนข้อย… นาคต้องหันหน้าหากัน จำไว้ เจ้าเป็นคนนอกคนแรกที่ข้อยบอก"
            - text: "มะขามต้นนั้นยายเพียรปลูกเหรอ{kq}"
              heart: 2
              reply: "เพียรปลูกตอนแม่เจ้าเกิด… บ่ ต้นนั้นมะม่วง ต้นมะขามเพียรปลูกตอนผัวเพียรไป เพียรว่า ‘ปลูกของเปรี้ยวไว้กินตอนใจขม’ ข้อยจำได้ทุกคำ"
    reward: { money: 0, heart: 2, items: { khao_jee: 3 }, set_flag: chan_q1_done }

  - id: chan_q2
    npc: chan
    title: "ซิ่นราคาเก้าบาทต่อวัน"
    desc: "พ่อค้าจากเมืองกดราคาซิ่นตีนจกของยายจันทร์ ช่วยหาทางให้คนที่รู้ค่าได้เห็นผ้า"
    start: { flag: chan_q1_done, heart_min: 3, day_min: 7 }
    offer:
      npc: "พ่อค้ามาอีกแล้วเด้อ ให้ผืนละแปดร้อย สามเดือนแปดร้อย… ข้อยบ่อยากขาย แต่ข้อยต้องซื้อไหมผืนใหม่ ไหมกะขึ้นราคา เจ้าคนหนุ่มคนสาว รู้จักทางขายอื่นบ่"
      options:
        - text: "ปาล์ม อบต. ช่วยลงเพจได้{k} {p}ไปคุยให้"
          accept: true
          heart: 2
          reply: "ปาล์มเด็กตลับเมตร… ไปเด้อ บอกปาล์มว่าข้อยบ่ขึ้นเวที บ่จับไมค์ บ่ยืนถ่ายรูปกับนายกฯ ห้าข้อนี้"
        - text: "ยายขายได้เท่าไหร่ถึงจะพอ{kq}"
          accept: true
          heart: 1
          reply: "ข้อยบ่รู้เด้อ… ข้อยรู้แค่ว่าแปดร้อยบ่พอ ไหมผืนหนึ่งสามร้อย ครั่ง มะขาม ฟืน แล้วยังตาข้อยที่ฝ้าลงทุกผืน… ตาข้อยคิดเป็นเงินบ่ได้"
        - text: "แปดร้อยก็ได้เงินนะ{kq}ยาย"
          heart: -1
          reply: "ได้เด้อ… ได้แปดร้อย เสียสามเดือน เสียลายแม่ข้อยไปอยู่ในห้างที่บ่มีไผรู้ชื่อข้อย ข้อยขอคิดก่อน"
    steps:
      - goal: { type: talk, npc: palm }
        hint: "ไปหาปาล์มที่ อบต. ขอให้ช่วยลงขายผ้าของยายจันทร์"
        done:
          npc: "ซิ่นยายจันทร์! ตามหลักวิชาการนะ ผ้าทอมือลายโบราณต้องมีเรื่องเล่าประกอบ คนถึงจะยอมจ่าย… เราจะเขียนว่าใช้เวลาสามเดือน ลายนาคเกี้ยวต้องหันหน้าหากัน แล้วใส่รูปมือยายตอนจก ไม่ใส่รูปนายกฯ สัญญา ล้อเล่นๆ… ไม่ล้อเล่น สัญญาจริง"
          options:
            - text: "ตั้งราคาผืนละห้าพันเลย{k}"
              heart: 1
              set_flag: chan_q2_high
              reply: "ห้าพัน… ตามหลักวิชาการคือคนซื้อน้อยแต่รู้ค่า โอเค เราลองเนอะ ถ้าไม่มีคนสั่งค่อยปรับ แต่เราว่ามี คนเมืองซื้อเรื่องเล่าแพงกว่าซื้อผ้า"
            - text: "ให้ยายตั้งราคาเอง{k}"
              heart: 2
              set_flag: chan_q2_chan
              reply: "ดีมาก! ราคาต้องมาจากคนทอ ไม่ใช่จากเรา… เราจะไปถามยายเอง เอาตลับเมตรไปวัดผ้าด้วย ยายจะได้หงุดหงิดใส่เราแทนหงุดหงิดใส่พ่อค้า"
      - goal: { type: days, n: 2 }
        hint: "รอ 2 วัน ให้เพจของปาล์มมีคนเห็น"
        done:
          npc: "ลูกหลานเด้อ! มีคนโทรมาสั่งซิ่นสองผืน! คนหนึ่งอยู่เชียงใหม่ อีกคนอยู่กรุงเทพฯ เขาถามว่า ‘นาคหันหน้าหากันแปลว่าอะไรคะ’ ข้อยเล่าครึ่งชั่วโมง เขาบ่วางสายเลย"
          options:
            - text: "ยายเล่าเก่งกว่าป้าแต๋วอีก{k}"
              heart: 1
              reply: "ฮ่า… อย่าบอกแต๋วเด้อ แต๋วจะมาเล่าแข่ง… ข้อยบ่เคยมีคนฟังเรื่องลายผ้าข้อยนานจั่งซี้ คนกรุงเทพฯ คนนี้ข้อยมักแท้"
            - text: "ยายจะทอทันไหม{kq}"
              heart: 1
              reply: "สองผืนหกเดือนเด้อ… ข้อยบอกเขาแล้ว เขาว่ารอได้ ข้อยแปลกใจหลาย ข้อยนึกว่าคนเดี๋ยวนี้รออีหยังบ่เป็นแล้ว"
      - goal: { type: give, npc: chan, item: silk_thread, n: 1 }
        hint: "ซื้อเส้นไหม 1 ไจที่ตลาดนัด เอาไปให้ยายจันทร์เริ่มทอผืนใหม่"
        done:
          npc: "ไหมใหม่… (ยายดมไหม) หอมเหมือนข้าวใหม่เด้อ ขอบใจหลาย ข้อยจะขึ้นกี่มื้ออื่นเลย ผืนแรกนี้ข้อยจะทอให้งามที่สุด เหมือนผืนที่ข้อยเคยทอให้คนกรุงเทพฯ คนนั้น"
          options:
            - text: "คนกรุงเทพฯ คนไหน{kq}"
              heart: 1
              reply: "สมัยข้อยเป็นหนี้ค่าไหม… มีคนกรุงเทพฯ สั่งซิ่นข้อยสามผืน ให้ราคาดีหลาย ส่งเงินผ่านลุงเชิดทุกเดือน ข้อยบ่เคยเห็นหน้า บ่เคยรู้ชื่อ… ข้อยยังคิดถึงเขาทุกเทื่อที่ขึ้นกี่"
            - text: "ไม่ต้องรีบนะ{kq}ยาย"
              heart: 1
              reply: "บ่รีบเด้อ วันละสองนิ้ว… ข้อยรีบบ่ได้แล้ว ลายนาคมันบ่ยอมให้รีบ รีบทีไรนาคหันหลังให้กันทุกที"
    sold_at: { silk_thread: market }
    reward: { money: 0, heart: 2, items: { cotton_handwoven: 1 }, set_flag: chan_q2_done, line: { from: palm, text: "ซิ่นตีนจกลายนาคเกี้ยวของยายจันทร์ ทอมือ 3 เดือน/ผืน นาคต้องหันหน้าหากันนะ ไม่ใช่แบบผ้าพิมพ์ 😊 สนใจสั่งทักเราได้เลย (ยายฝากบอกว่าไม่ขึ้นเวที ไม่จับไมค์)" } }

  - id: chan_q3
    npc: chan
    title: "จดหมายที่ข้อยอ่านไม่ออก"
    desc: "ยายจันทร์มีซองจดหมายลายมือยายเพียรที่เก็บไว้สิบปี ยายอ่านภาษากลางไม่คล่อง"
    start: { flag: chan_q2_done, heart_min: 4, day_min: 10 }
    offer:
      npc: "ลูกหลาน… ข้อยมีซองหนึ่ง เพียรฝากไว้ตั้งแต่ก่อนเพียรไป บอกว่า ‘ให้หลานข้อย ถ้าหลานกลับมา’ ข้อยอ่านภาษากลางบ่คล่อง ข้อยบ่เคยเปิด… บ่ายนี้มาเฮือนข้อยได้บ่ ข้อยอยากได้ยินด้วยว่าเพียรเขียนอีหยัง"
      options:
        - text: "{p}จะไป{k}ยาย"
          accept: true
          heart: 2
          reply: "บ่ายสองเด้อ… ข้อยจะปิ้งข้าวจี่สองไม้ เหมือนตอนเพียรยังมา"
        - text: "ทำไมยายไม่ให้คนอื่นอ่านให้{kq}"
          accept: true
          heart: 1
          reply: "เพียรว่าให้หลาน ข้อยกะรอหลาน… ข้อยรอเป็นเด้อ ข้อยทอผ้ามาหกสิบปี"
        - text: "ไว้วันหลังนะ{kq}ยาย"
          heart: 0
          reply: "บ่เป็นหยัง… ซองนี้อยู่ใต้หมอนข้อยสิบปีแล้ว ข้อยหลับบนมันทุกคืน อีกคืนกะได้"
    steps:
      - goal: { type: visit, place: house_chan, from: "14:00", to: "16:00" }
        hint: "ไปบ้านยายจันทร์ช่วงบ่าย อ่านจดหมายของยายเพียรให้ยายฟัง"
        done:
          npc: "(ยายจันทร์ยื่นซองสีเหลืองเก่าให้ ปลายซองมีรอยด้ายแดงผูก) …อ่านดังๆ เด้อ ข้อยหูบ่ดีแล้ว"
          set_flag: diary_chan
          options:
            - text: "(อ่าน) ‘หลาน ซิ่นสามผืนในหีบไม้ใต้เตียงยาย เป็นของจันทร์ ยายซื้อไว้ตอนจันทร์เป็นหนี้ค่าไหม บอกจันทร์ว่าเป็นคนกรุงเทพฯ ซื้อ ให้เชิดเอาเงินไปให้ทุกเดือน…’"
              heart: 2
              reply: "(กระสวยในมือยายหล่นลงพื้น)"
              next:
                - text: "‘…ถ้าจันทร์รู้ว่าเป็นยาย จันทร์จะไม่ยอมรับเงิน คนพวนถือ ของไม่ใช่ของเราไม่เอา ยายเลยต้องเป็นคนกรุงเทพฯ ไปสองปี ถ้าหลานแต่งงาน นุ่งผืนลายนาคเกี้ยว ถ้าไม่แต่ง เอาคืนให้จันทร์ ลายนี้ต้องไม่หาย’"
                  heart: 2
                  reply: "…คนกรุงเทพฯ ของข้อย… แม่นเพียร เพียรนั่งดูข้อยทอซิ่นสามผืนนั้นทุกวัน นับเส้นยืนให้ข้อย ชมว่างามกว่าทุกผืน แล้วกะซื้อของที่ตัวเองนั่งดูเขาทอ บ่ให้ข้อยรู้สองปี… โอย เพียรเอ้ย (ยายเอาชายซิ่นซับตา) ด้ายมันพันกันอยู่ในอก แก้บ่ทันแล้ว"
                - text: "ยาย… ข้างล่างมีสูตรข้าวหลามของยายเพียรด้วย เขียนว่า ‘แบบที่จันทร์สอน’"
                  heart: 2
                  reply: "สูตรข้อย… เพียรจดสูตรข้อยไว้ในจดหมายถึงหลาน ให้หลานรู้ว่าข้าวหลามแบบนี้มาจากจันทร์… เพียรให้เครดิตข้อยแท้เด้อ ข้อยบ่เคยมีชื่อในอีหยังเลย"
            - text: "(อ่านเงียบๆ ก่อน แล้วค่อยเล่าให้ยายฟังช้าๆ)"
              heart: 1
              reply: "…เพียรเป็นคนกรุงเทพฯ ของข้อย… ซิ่นสามผืนที่ข้อยทองามที่สุด อยู่ในหีบใต้เตียงเพียรมาตลอด ข้อยเดินผ่านเฮือนเพียรทุกวัน บ่เคยรู้ว่าผ้าของข้อยนอนอยู่ข้างใน… เพียรเอ้ย ทำไมบ่บอกข้อย"
      - goal: { type: talk, npc: cherd }
        hint: "ไปหาลุงเชิดที่ป้ายรถเมล์ ถามเรื่องคนกรุงเทพฯ ที่ซื้อซิ่น"
        done:
          npc: "คนกรุงเทพฯ ที่ซื้อซิ่นยายจันทร์เหรอหลาน… (ลุงเชิดถอดหมวกวางบนพวงมาลัย) ลุงสาบานกับยายเพียรว่าจะไม่บอกใครจนตาย ยายเพียรไปก่อนลุง ลุงก็ไม่รู้ว่าสัญญายังนับไหม… หลานรู้แล้วใช่ไหม ลุงเห็นหน้าหลานก็รู้"
          options:
            - text: "ลุงเก็บความลับให้ยายสองปีเลยเหรอ{kq}"
              heart: 1
              reply: "สิบสองปีจ้ะหลาน สองปีส่งเงิน สิบปีเก็บปาก… ทุกเดือนยายเพียรยื่นซองให้ลุงที่ป้ายรถเมล์ บอกว่า ‘เชิด อย่าให้จันทร์รู้นะ’ ลุงขับรถไปจอดหน้าบ้านยายจันทร์ บอกว่า ‘คนกรุงเทพฯ ฝากมาจ้ะ’ ลุงโกหกได้แค่เรื่องเดียวในชีวิต เรื่องนี้"
            - text: "ขอบคุณ{k}ลุง ที่ช่วยยาย"
              heart: 2
              reply: "ไม่ต้องขอบคุณลุงหรอก ลุงแค่ขับรถ… ยายเพียรเป็นคนจ่าย ยายจันทร์เป็นคนทอ ลุงได้นั่งดูคนดีสองคนผ่านกระจกหน้ารถ ขึ้นๆ ไปบอกยายจันทร์เถอะหลาน บอกว่าลุงขอโทษที่โกหก"
    reward: { money: 0, heart: 2, items: { khao_lam: 2 }, set_flag: chan_q3_done }

  - id: chan_q4
    npc: chan
    title: "ซ้อมกำฟ้า"
    desc: "ยายจันทร์จะเผาข้าวหลามบูชาฟ้าที่เรือน และต้องตัดสินใจว่าลายนาคเกี้ยวจะไปอยู่กับใคร"
    start: { flag: chan_q3_done, heart_min: 6, day_min: 14 }
    offer:
      npc: "ลูกหลาน… คนพวนเฮากำฟ้าเดือนสาม แต่ปีนี้ข้อยบ่อยากรอ ข้อยอยากเผาข้าวหลามบอกฟ้าที่เฮือนข้อยคืนหนึ่ง บอกฟ้าว่าเพียรเป็นคนกรุงเทพฯ ของข้อย… เจ้ามาช่วยข้อยเด้อ ข้อยต้องการฟืน"
      options:
        - text: "{p}จะหาฟืนมาให้{k}ยาย"
          accept: true
          heart: 2
          reply: "ห้าท่อนเด้อ ไม้แห้งๆ ไฟต้องอ่อนแต่ยาว ข้าวหลามจะได้สุกช้าๆ เหมือนคนแก่เล่าเรื่อง"
        - text: "บอกฟ้าได้จริงเหรอ{kq}"
          accept: true
          heart: 1
          reply: "ได้เด้อ… ฟ้าบ่ตอบเป็นคำ ฟ้าตอบเป็นเสียงร้อง ถ้าคืนนั้นฟ้าร้อง ข้อยรู้ว่าเพียรได้ยิน ถ้าบ่ร้อง ข้อยกะรู้ว่าเพียรหลับแล้ว บ่เป็นหยัง"
        - text: "ไว้งานกำฟ้าจริงดีกว่า{k}"
          heart: 0
          reply: "บ่เป็นหยังเด้อ… แต่ข้อยอายุเจ็ดสิบแปดแล้ว ข้อยบ่แน่ใจว่าจะรอเดือนสามได้กี่เทื่อ"
    steps:
      - goal: { type: give, npc: chan, item: wood, n: 5 }
        hint: "เอาไม้ฟืน 5 ท่อนไปให้ยายจันทร์ สำหรับเผาข้าวหลาม"
        done:
          npc: "ฟืนแห้งดีเด้อ… ข้อยกรอกข้าวเหนียวใส่กระบอกไว้แล้วสิบกระบอก กระบอกหนึ่งบ่ใส่ถั่วดำให้บัว กระบอกหนึ่งใส่ถั่วดำหลายๆ ให้เพียร เพียรมักถั่วดำ"
          options:
            - text: "แล้วกระบอกของ{p}ล่ะ{kq}"
              heart: 1
              reply: "กระบอกของเจ้าข้อยใส่ทุกอย่างพอดีๆ เด้อ… ข้อยยังบ่รู้ว่าเจ้ามักอีหยัง เจ้าต้องมาบ่อยๆ ข้อยจะได้รู้"
            - text: "ยายเพียรชอบถั่วดำเหรอ{kq}"
              heart: 1
              reply: "มักหลายแท้… แต่บ่เคยบอกไผ เพียรบ่บอกไผว่ามักอีหยัง ข้อยรู้เพราะเห็นเพียรเขี่ยถั่วดำไว้กินคำสุดท้ายทุกเทื่อ คนที่เก็บของมักไว้กินคำสุดท้าย คือคนที่ให้คนอื่นก่อนเสมอ"
      - goal: { type: visit, place: house_chan, from: "18:00", to: "20:30" }
        hint: "ไปบ้านยายจันทร์ตอนหัวค่ำ เผาข้าวหลามบอกฟ้า (กลับก่อนสามทุ่ม)"
        done:
          npc: "(กองไฟหน้าเรือนยายจันทร์ ข้าวหลามสิบกระบอกพิงไฟ ยายบัว ป้าทองใบ น้องมิว มานั่งล้อมวง… ไกลๆ มีฟ้าร้องเบาๆ หนึ่งครั้ง ยายจันทร์ยิ้ม) …เพียรได้ยินแล้วเด้อ ลูกหลาน ข้อยต้องตัดสินใจเรื่องสุดท้าย ลายนาคเกี้ยวของแม่ข้อย ซิ่นสามผืนของเพียร จะไปอยู่กับไผ"
          options:
            - text: "สอนน้องมิวทอลายนาคเกี้ยว{k} ให้ลายไม่หาย"
              heart: 2
              set_flag: chan_end_mew
              reply: "มิว… (น้องมิวที่นั่งข้างกองไฟหันมาตาโต) ถ้ายายมิวยอม ข้อยจะสอนทุกเย็นหลังเลิกเรียน หนังสือก่อน ผ้าทีหลัง… ลายแม่ข้อยจะอยู่ในมือเด็กที่ถามทำไมทุกเส้น ข้อยว่าดีที่สุดแล้ว"
            - text: "ทอลายใหม่ ‘ดอกเพียร’ ส่งประกวดที่อำเภอ{k}"
              heart: 2
              set_flag: chan_end_contest
              reply: "ลายดอกเพียร… ข้อยจะทอดอกแก้วซ่อนชื่อเพียรไว้ข้างใน เหมือนที่ข้อยซ่อนชื่อผัวข้อยไว้ในขานาค ผืนที่ข้อยทอค้างไว้สองนิ้ว ข้อยจะทอให้จบ แล้วส่งไปให้กรรมการที่บ่เคยจกผ้าดู ข้อยบ่ย่านแพ้แล้ว"
            - text: "ตั้งกลุ่มทอผ้าที่ศาลา{k} ให้ทั้งหมู่บ้านได้เรียน"
              heart: 2
              set_flag: chan_end_group
              reply: "กลุ่มทอผ้า… ใต้ถุนเฮือนข้อยแคบไป ศาลากว้าง คนผ่านไปมาได้เห็น เด็กเห็น คนแก่เห็น ข้อยจะเอากี่ไปตั้งที่ศาลา ใครอยากนั่ง นั่ง ใครอยากเล่าเรื่อง เล่า… เพียรนั่งดูข้อยทอคนเดียวมาหลายปี ต่อไปให้ทั้งหมู่บ้านนั่งดูแทนเพียร"
    reward: { money: 0, heart: 2, items: { cotton_handwoven: 1 }, set_flag: chan_q4_done, line: { from: palm, text: "คืนนี้หน้าเรือนยายจันทร์มีเผาข้าวหลามซ้อมกำฟ้านะ 🔥 ฟ้าร้องหนึ่งครั้งตอนสองทุ่มพอดี ยายบอกว่ามีคนได้ยินแล้ว (ยายไม่บอกว่าใคร)" } }
