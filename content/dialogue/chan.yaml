    options:
      - text: "วันละสองนิ้วไม่ช้าไปเหรอ{kq}"
        heart: 1
        reply: "ช้าแท้… แต่สามเดือนได้ซิ่นผืนหนึ่งที่นุ่งได้ห้าสิบปี เจ้าทำงานเร็วในกรุงเทพฯ ได้อีหยังที่อยู่ได้ห้าสิบปีบ่"
        next:
          - text: "ไม่มีเลย{k}ยาย"
            heart: 2
            reply: "บ่เป็นหยังเด้อ… เจ้ายังหนุ่มยังสาว เริ่มทอวันนี้ วันละสองนิ้ว อีกห้าสิบปีเจ้าจะมีอีหยังสักผืน"
          - text: "เงินเดือนไง{kq} แต่ใช้หมดแล้ว"
            heart: 1
            reply: "ฮ่า… เงินเดือนอยู่ได้เดือนเดียวเด้อ ชื่อมันกะบอก"
