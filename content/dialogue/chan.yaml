      - text: "ไล่แล้วทำไมยังกลับมา{kq}"
        heart: 1
        reply: "เส้นไหมอุ่นเด้อ ข้อยนั่งทอทั้งวัน มันรู้ว่าตรงนั้นมีคนอยู่… แมวกะคือคน มันอยากอยู่ใกล้ที่มีคนนั่งนานๆ"

