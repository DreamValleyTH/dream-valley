# ยายจันทร์ — ชาวไทยพวน ช่างทอซิ่นตีนจก แม่งานกำฟ้า · convos + quests
convos:
  # ===== react =====
  - id: chan_r_town_intro
    topic: react
    once: true
    when: { flag: story_town_intro }
    npc: "เมื่อเช้าผู้ใหญ่ประกาศชื่อเจ้าเด้อลูกหลาน… ข้อยฟังบ่ทัน รอบสองก็บ่ทัน รอบสามไมค์หอน ข้อยเลยรู้แค่ว่ามีหลานไผสักคนกลับมา"
    options:
      - text: "หลานยายเพียร{k}ยาย"
        heart: 1
        reply: "โอย หลานเพียรแท้บ่… ข้อยกับเพียรนั่งใต้ถุนเฮือนนี้ด้วยกันหลายปี เพียรนั่งดูข้อยทอ บ่เคยจับกี่ บอกว่า ‘มือข้อยหยาบ จันทร์ทอไปเถิด’"
        next:
          - text: "ยายเพียรไม่เคยทอผ้าเลยเหรอ{kq}"
            heart: 1
            reply: "บ่เคยเด้อ แต่เพียรนับเส้นยืนให้ข้อยแม่นกว่าข้อยเอง… ตาข้อยฝ้าฟาง เพียรเป็นตาให้ข้อยหลายปี"
          - text: "{p}ขอนั่งดูยายทอบ้างได้ไหม{kq}"
            heart: 2
            reply: "ได้เด้อ นั่งตรงที่เพียรเคยนั่ง ม้าไม้ตัวนั้น… ข้อยบ่ให้ไผนั่งตั้งแต่เพียรไป วันนี้ให้หลานเพียรนั่ง"
      - text: "ไมค์ผู้ใหญ่หอนทุกวันเลยเหรอ{kq}"
        heart: 1
        reply: "หอนแม่นกว่าหมาข้อยอีก… หมาข้อยหอนเฉพาะคืนผีมา ไมค์ผู้ใหญ่หอนทุกเช้า"

  - id: chan_r_well_dry
    topic: react
    when: { flag: story_well_dry }
    npc: "บ่อข้อยแห้งจนเห็นก้นเด้อลูกหลาน… ย้อมครั่งบ่ได้ ไหมที่ย้อมไว้สีด่างหมด เหมือนผ้าเป็นขี้กลาก"
    options:
      - text: "ใช้น้ำคลองย้อมได้ไหม{kq}"
        heart: 1
        reply: "ได้แต่สีเพี้ยนเด้อ น้ำคลองมีโคลน สีแดงครั่งออกน้ำตาล… ข้อยต้องหาบน้ำคลองมาตั้งไว้สามวันให้ตกตะกอนก่อน ขาข้อยบ่หนุ่มแล้ว"
        next:
          - text: "{p}ช่วยหาบให้{k}"
            heart: 2
            reply: "ใจดีหลายเด้อ… หาบตอนเช้า น้ำเย็น ตะกอนน้อย อย่าหาบตอนเที่ยง เหงื่อเจ้าจะไหลลงถัง ข้อยบ่ย้อมด้วยเหงื่อไผ"
          - text: "บ่อบ้านยาย{p}ยังมีน้ำนะ{kq}"
            heart: 2
            reply: "บ่อเพียร… บ่อนั้นเพียรขุดลึกตอนคนหัวเราะใส่ เดี๋ยวนี้บ่มีไผหัวเราะแล้ว ข้อยขอตักสักสองถังได้บ่ ข้อยจะทอผ้าเช็ดหน้าแลกเด้อ"
      - text: "ผ้าสีด่างก็สวยดีนะ{kq}ยาย"
        heart: 0
        reply: "สวยในตาเจ้า บ่สวยในตาแม่ข้อย… แม่ข้อยเห็นคงตีมือข้อยจากฟ้า"

  - id: chan_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "เขาว่ามีผีผู้หญิงยืนข้างปั๊มบริษัท… ข้อยได้ยินแล้วบ่ย่าน ข้อยว่าเป็นแม่ธรณีมาทวงน้ำคืน คนพวนเฮาเคารพแม่ธรณีเด้อ"
    options:
      - text: "ผีนุ่งซิ่นด้วยไหม{kq}"
        heart: 1
        reply: "คนงานว่านุ่งซิ่นสีแดงเข้ม… ข้อยว่าสีครั่ง ครั่งแท้ย้อมด้วยน้ำบ่อ ตอนนี้บ่อแห้งหมด ผีกะคงบ่มีน้ำย้อมซิ่นใหม่เหมือนข้อย"
      - text: "ยายไม่กลัวเลยเหรอ{kq}"
        heart: 1
        reply: "ข้อยย่านผีหลายเด้อ… แต่ผีที่มาทวงน้ำ ข้อยบ่ย่าน ข้อยกะอยากทวงเหมือนกัน"
        next:
          - text: "ยายอยากไปทวงด้วยเหรอ{kq}"
            heart: 1
            reply: "ข้อยแก่แล้ว ไปบ่ไหว… ฝากผีทวงแทนเด้อ ผีเดินเร็วกว่าข้อย"
          - text: "ยายบัวว่าไงบ้าง{kq}"
            heart: 1
            reply: "บัวว่า ‘ผีบ่มักคนดูดน้ำจากแม่ธรณี’ แล้วบัวกะเคี้ยวหมากต่อ ข้อยฟังแล้วขนลุกทั้งคืน บัวนี่ปากบอกย่านแต่เล่าเก่งแท้"

  - id: chan_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ข้อยได้ถังน้ำบริษัทมาใบหนึ่งเด้อ… เอามาแช่ไหมย้อมครั่ง ไหมออกมาสีชมพูอ่อน ข้อยบ่เคยได้สีนี้ ข้อยว่าถังมันคายสีโลโก้"
    options:
      - text: "สีชมพูก็สวยนะ{kq}"
        heart: 1
        reply: "สวยแท้เด้อ ข้อยจะทอเป็นผ้าเช็ดหน้าผืนเล็ก ตั้งชื่อลายว่า ‘ถังบริษัท’… ฮ่า บ่ ข้อยล้อเล่น ข้อยจะตั้งชื่อว่า ‘น้ำที่หายไป’"
      - text: "คนในประชุมเถียงกันไหม{kq}"
        heart: 1
        reply: "เถียงกันหลาย… ข้อยนั่งฟังแล้วคิดถึงด้ายพันกัน ฝั่งหนึ่งดึงทางนี้ ฝั่งหนึ่งดึงทางนั้น ด้ายบ่เคยคลายเพราะดึง ด้ายคลายเพราะมีคนนั่งแก้"

  - id: chan_r_kitten
    topic: react
    once: true
    when: { flag: kitten_promise }
    npc: "แต๋วว่าเจ้าจะรับลูกแมวไปเลี้ยงบ่… ข้อยทอผ้าปูนอนให้มันผืนหนึ่งแล้วเด้อ ลายดอกแก้วตัวเล็กๆ แมวบ่รู้ค่าหรอก แต่ข้อยรู้"
    options:
      - text: "ยายทอให้แมวด้วยเหรอ{kq}"
        heart: 2
        reply: "ทอให้ไผกะได้ ขอให้มีคนใช้… ผ้าที่ไผบ่ใช้ เป็นผ้าที่ตายแล้ว ผ้าที่แมวนอนทุกคืน เป็นผ้าที่ยังมีชีวิต"
      - text: "แมวจะข่วนผ้าพังไหม{kq}"
        heart: 1
        reply: "ข่วนกะข่วนไป ข้อยทอใหม่ได้… คนแก่บ่ย่านของพัง ย่านบ่มีไผใช้ของ"

  - id: chan_r_end_mew
    topic: react
    once: true
    when: { flag: chan_end_mew }
    npc: "น้องมิวมาเรียนจกทุกเย็นแล้วเด้อลูกหลาน… วันนี้จกลายดอกแก้วได้สามดอก เบี้ยวสองดอก ข้อยว่างามที่สุดในรอบสิบปี"
    options:
      - text: "งามกว่าของยายเหรอ{kq}"
        heart: 1
        reply: "งามกว่าแท้… ของข้อยงามเพราะมือชิน ของน้องมิวงามเพราะใจตั้ง มือชินหาได้ ใจตั้งหายาก"
      - text: "น้องมิวถามทำไมเยอะไหม{kq}"
        heart: 2
        reply: "ถามทุกเส้นเด้อ ทำไมเส้นนี้แดง ทำไมนาคต้องเกี้ยว ทำไมยายบ่ใส่แว่น… ข้อยตอบได้ครึ่งเดียว อีกครึ่งข้อยบอกว่า ‘แม่ข้อยสอนมาจั่งซี้’ น้องมิวจดไว้หมด"

  - id: chan_r_end_contest
    topic: react
    once: true
    when: { flag: chan_end_contest }
    npc: "อำเภอโทรมาเด้อ… ซิ่นลายดอกเพียรของข้อยได้รางวัลที่หนึ่ง! คนจากกรุงเทพฯ มาขอดูถึงเฮือน ข้อยบอกให้นั่งใต้ถุน เพียรเคยนั่งตรงนั้น"
    options:
      - text: "ยินดีด้วย{k}ยาย!"
        heart: 2
        reply: "ขอบใจหลายเด้อ… รางวัลนี้แม่นของเพียรครึ่งหนึ่ง ข้อยเอาเงินรางวัลไปทำบุญให้เพียรแล้ว ส่วนที่เหลือซื้อไหมมาสอนเด็กๆ"
      - text: "คนกรุงเทพฯ มาซื้อซิ่นไหม{kq}"
        heart: 1
        reply: "มาขอซื้อผืนนั้นเด้อ ให้หลายหมื่น ข้อยบ่ขาย… ผืนนั้นข้อยทอให้เพียร คนกรุงเทพฯ จริงๆ มาซื้อผ้าของเพียรบ่ได้ ฮ่า"

  - id: chan_r_end_group
    topic: react
    once: true
    when: { flag: chan_end_group }
    npc: "กลุ่มทอผ้าที่ศาลามีคนมาแปดคนแล้วเด้อลูกหลาน… พรเย็บผ้าเก่ง แต่ทอบ่เป็น แต๋วมานั่งคุยอย่างเดียว ข้อยว่าแต๋วทอเรื่องเก่งกว่าทอผ้า"
    options:
      - text: "ป้าแต๋วทอผ้าได้สักเส้นไหม{kq}"
        heart: 1
        reply: "ได้สองเส้น แล้วกะเล่าเรื่องลูกสะใภ้ไผบ่รู้ไปสามชั่วโมง… บ่เป็นหยัง กลุ่มทอผ้าต้องมีคนเล่า มือจะได้บ่ง่วง"
      - text: "ปาล์มขายผ้าออนไลน์ให้ไหม{kq}"
        heart: 1
        reply: "ปาล์มถ่ายรูปลงเพจแล้ว มีคนสั่งสิบผืน… ข้อยบอกว่าต้องรอสามเดือน คนสั่งว่ารอได้ ข้อยแปลกใจ คนเดี๋ยวนี้ยังรอเป็นอยู่เด้อ"

  # ===== news =====
  - id: chan_n_contest
    topic: news
    npc: "อำเภอจะจัดประกวดผ้าซิ่นอีกแล้วเด้อ… ปีที่แล้วที่หนึ่งเป็นผ้าทอเครื่องจากโรงงาน เขาว่า ‘ลายสม่ำเสมอ’ ข้อยฟังแล้วอยากเอาฟืมตีหัวกรรมการ"
    options:
      - text: "ผ้าเครื่องส่งประกวดได้ด้วยเหรอ{kq}"
        heart: 1
        reply: "ได้เด้อ กรรมการเป็นญาติคนส่ง… ข้อยบ่ได้ว่าไผ ข้อยแค่รู้ว่ากรรมการบ่เคยจกผ้าสักเส้น จับซิ่นข้อยแล้วว่า ‘หยาบ’ มือแท้มันกะหยาบแหละ"
        next:
          - text: "ปีนี้ยายส่งไหม{kq}"
            heart: 1
            reply: "ข้อยยังคิดอยู่… ส่งไปแพ้ผ้าเครื่องอีก ข้อยย่านใจข้อยแตก ใจคนแก่ซ่อมยากกว่าผ้าขาด"
          - text: "{p}ไปเป็นกำลังใจให้{k}"
            heart: 2
            reply: "ไปด้วยแท้บ่… ถ้าเจ้าไป ข้อยจะส่ง ข้อยบ่ย่านแพ้แล้ว ข้อยย่านไปคนเดียว"
      - text: "ผ้าเครื่องกับผ้ามือต่างกันยังไง{kq}"
        heart: 1
        reply: "ผ้าเครื่องทุกผืนเหมือนกัน ผ้ามือทุกผืนบ่เหมือนกัน… ผ้ามือมีวันที่ข้อยเศร้า วันที่ข้อยดีใจ ทออยู่ในนั้นหมด จับดูกะรู้"

  - id: chan_n_fake_sarong
    topic: news
    npc: "ตลาดนัดมีผ้าถุงพิมพ์ลายตีนจกขายผืนละร้อยยี่สิบเด้อ… ลายนาคเกี้ยวของเฮือนข้อย พิมพ์ผิดด้าน นาคหันหลังให้กัน"
    options:
      - text: "นาคหันหลังให้กันแปลว่าอะไร{kq}"
        heart: 1
        reply: "แปลว่าทะเลาะกันเด้อ… นาคเกี้ยวต้องหันหน้าหากัน คนพิมพ์บ่รู้ คนซื้อกะบ่รู้ นุ่งไปงานแต่งก็มี ข้อยบ่กล้าบอกเขา"
      - text: "ยายโกรธไหม{kq}"
        heart: 1
        reply: "บ่โกรธเด้อ… ข้อยเสียใจ ลายแม่ข้อยถูกพิมพ์เป็นพันผืน แต่บ่มีไผรู้ว่านาคต้องหันหน้าหากัน ลายอยู่ แต่ความหมายหาย"
      - text: "ถูกดีนะ{kq} ร้อยยี่สิบ"
        heart: -1
        reply: "ถูกแท้… ซิ่นข้อยผืนหนึ่งสามเดือน ผืนนั้นสามนาที ถ้าเจ้าอยากได้ของถูก ข้อยบ่ห้าม แต่อย่านุ่งมาเฮือนข้อยเด้อ"

  - id: chan_n_daughter
    topic: news
    when: { day_min: 5 }
    npc: "ลูกสาวข้อยโทรมาเด้อ บอกว่าหลานที่ระยองได้เลื่อนตำแหน่งเป็นหัวหน้ากะ… ข้อยถามว่ากะคืออีหยัง ลูกบอกว่าคือเวลาทำงาน ข้อยว่าทำงานมีหัวหน้าเวลาด้วยบ่"
    options:
      - text: "หลานยายคงเก่งมาก{k}"
        heart: 1
        reply: "เก่งแท้เด้อ… ข้อยทอผ้าห่มไว้ให้ผืนหนึ่งตั้งแต่หน้าหนาวปีก่อน ยังบ่ได้ส่ง ข้อยบ่รู้ว่าที่ระยองหนาวบ่"
        next:
          - text: "{p}ช่วยส่งไปรษณีย์ให้{k}"
            heart: 2
            reply: "ส่งได้แท้บ่… ฝากลุงเชิดเอาไปส่งไปรษณีย์อำเภอ ลุงเชิดส่งของให้ข้อยหลายปีแล้ว ลุงเชิดซื่อ บ่เคยถามว่าข้างในมีอีหยัง"
          - text: "ระยองไม่ค่อยหนาวหรอก{k}ยาย"
            heart: 1
            reply: "บ่หนาวกะส่งไปเด้อ… ผ้าห่มยายบ่ได้มีไว้กันหนาวอย่างเดียว มีไว้ให้รู้ว่ามีคนคิดถึง"
      - text: "ยายอยากให้หลานกลับมาไหม{kq}"
        heart: 1
        reply: "อยาก… แต่ข้อยบ่พูด ข้อยกลัวมันกลับมาแล้วบ่มีงาน แล้วมันจะเศร้ากว่าอยู่ระยอง"

  - id: chan_n_page
    topic: news
    npc: "ปาล์มเอารูปผ้าข้อยลงเพจ อบต. มีคนกดหัวใจสามร้อย… แต่ข้างล่างมีรูปนายกฯ ยืนถือผ้าข้อยยิ้ม ข้อยบ่เคยเห็นหน้าเขาที่เฮือนข้อยสักครั้ง"
    options:
      - text: "นายกฯ มาถ่ายรูปตอนไหน{kq}"
        heart: 1
        reply: "ถ่ายที่ อบต. เด้อ ปาล์มเอาผ้าไปโชว์ นายกฯ เดินมาจับยิ้ม แล้วเดินไป… รูปนั้นคนกดหัวใจหลายกว่ารูปข้อยนั่งทอ ข้อยบ่ว่า หน้าเขาสะอาดกว่า"
      - text: "มีคนสั่งผ้าไหม{kq}"
        heart: 1
        reply: "มีคนโทรมาถามราคาห้าคน พอบอกว่าสามเดือนผืนหนึ่ง เหลือสองคน… สองคนนั้นข้อยจะทอให้งามที่สุด"

  - id: chan_n_merchant
    topic: news
    npc: "พ่อค้าจากในเมืองมาอีกเด้อ… ให้ผืนละแปดร้อย บอกว่าจะเอาไปขายห้างในกรุงเทพฯ ข้อยถามว่าห้างขายเท่าไหร่ เขาบอก ‘อย่ารู้เลยยาย’"
    options:
      - text: "ยายขายไหม{kq}"
        heart: 1
        reply: "ข้อยบ่ขาย… สามเดือนแปดร้อย วันละเก้าบาท ข้าวจี่ยังไม้ละสิบห้า ข้อยทอผ้าได้ค่าแรงบ่ถึงข้าวจี่วันละไม้"
        next:
          - text: "{p}จะลองหาคนซื้อราคาดีให้{k}"
            heart: 2
            reply: "แท้บ่… ข้อยบ่หวังหลายเด้อ ขอแค่คนซื้อรู้ว่านาคต้องหันหน้าหากัน ราคาข้อยยอมลดให้คนรู้"
          - text: "ห้างขายหลายพันแน่ๆ{k}"
            heart: 1
            reply: "ข้อยกะว่าอย่างนั้น… แต่ข้อยบ่โกรธพ่อค้าดอก เขากะมีลูกต้องเลี้ยง ข้อยโกรธที่คนซื้อในห้างบ่เคยรู้ว่าข้อยชื่อจันทร์"
      - text: "ทำไมเขาไม่ให้ยายรู้{kq}"
        heart: 1
        reply: "ย่านข้อยรู้ว่าตัวเองมีค่าเด้อ… คนที่บ่รู้ว่าตัวเองมีค่า ขายถูกทุกอย่าง"

  # ===== advice =====
  - id: chan_a_knot
    topic: advice
    npc: "ด้ายพันกันอย่าดึงเด้อลูกหลาน… ยิ่งดึงยิ่งแน่น ต้องนั่งลง หาปลายเส้น แล้วค่อยๆ แก้ทีละปม เรื่องในชีวิตกะจั่งซี้"
    options:
      - text: "ถ้าหาปลายเส้นไม่เจอล่ะ{kq}"
        heart: 1
        reply: "กะพักก่อน ไปกินข้าวจี่ ไปนอน… ตื่นมาตอนเช้า ปลายเส้นมันโผล่มาเองเด้อ ด้ายกับใจคนเหมือนกัน กลางคืนพันกันหลาย"
      - text: "ตัดทิ้งเลยง่ายกว่า{k}"
        heart: -1
        reply: "ตัดได้ แต่ด้ายสั้นลง… ตัดหลายเทื่อ ด้ายเหลือบ่พอทอผ้า คนกะคือกัน ตัดคนออกหลายเทื่อ ชีวิตเหลือบ่พอให้อยู่"
      - text: "ยายสอนแก้ปมได้ไหม{kq}"
        heart: 2
        reply: "มานั่งนี่… ใช้ปลายเข็มหยิบ บ่ใช้นิ้ว นิ้วใหญ่เกิน ใจร้อนเกิน… เจ้ามือเบาเหมือนเพียร เพียรแก้ปมให้ข้อยหลายปี"

  - id: chan_a_cotton
