      - text: "ทำไมยายซ่อนชื่อตาไว้{kq}"
        heart: 2
        reply: "ตอนสาวๆ ข้อยอาย… แม่ข้อยบ่ให้คบคนเป่าแคน ข้อยเลยทอชื่อเขาไว้ใต้นาค นาคเฝ้าให้ แม่ข้อยดูซิ่นผืนนั้นทุกวัน บ่เคยรู้"
      - text: "ยายเคยทอชื่อคนอื่นไหม{kq}"
        heart: 1
        reply: "เคยเด้อ… ชื่อเพียร ทอไว้ผืนหนึ่งตอนเพียรไป ซ่อนอยู่ในดอกแก้วตรงชายซิ่น ผืนนั้นข้อยยังทอบ่แล้ว ขาดอีกสองนิ้ว ข้อยทอบ่ลง"

  # ===== others =====
  - id: chan_o_bua
    topic: others
    npc: "บัวยืมซิ่นข้อยนุ่งไปวัดอีกแล้วเด้อ… ข้อยคิดค่าเช่าเป็นข้าวหลามสิบกระบอก บัวว่าแพง ข้อยว่าซิ่นข้อยแพงกว่า"
