      - text: "ยากจัง{k}"
        heart: 0
        reply: "บ่ยากดอก เจ้าแค่บ่ชิน… อีกสิบปีเหลือคนพูดพวนบ่ถึงสิบคนในตำบล ภาษาหายง่ายกว่าลายผ้าอีกเด้อ"

  - id: chan_s_cat_loom
