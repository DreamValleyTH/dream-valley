# เณรต้น — สามเณรอายุ 11 ปี วัดดงเย็น (เด็กใสซื่อ ไม่มีตลกร้าย ไม่เกี่ยวเรื่องรัก) · เด็ก 18–22 บท
convos:
  # ===== react =====
  - id: ton_r_meet
    topic: react
    once: true
    when: { not_flag: met_ton }
    npc: "สวัสดีครับ! พี่คือหลานยายเพียรใช่ไหมครับ ผมจำได้ครับ ยายเพียรเคยให้มะม่วงผมสามลูก ผมนับครับ"
    set_flag: met_ton
    options:
      - text: "สวัสดี{k}เณร ยายให้มะม่วงด้วยเหรอ"
        heart: 1
        reply: "ครับ! ลูกใหญ่สองลูก ลูกเล็กหนึ่งลูก ลูกเล็กหวานที่สุดครับ… ผมเก็บเมล็ดไว้ปลูกหลังกุฏิ ตอนนี้สูงเท่าเข่าผมแล้วครับ"
        next:
          - text: "พี่ขอไปดูต้นมะม่วงได้ไหม"
            heart: 2
            reply: "ได้ครับ! ผมจะพาไปครับ แต่ต้องเดินอ้อมถ่านนะครับ ถ่านชอบนอนข้างต้นมะม่วงของผม มันเฝ้าให้ครับ"
          - text: "ยายใจดีกับเณรนะ"
            heart: 1
            reply: "ยายเพียรใจดีกับทุกคนครับ… ยายบอกผมว่าเณรต้องกินเยอะๆ จะได้โต ผมก็กินเยอะครับ แต่ก็ยังไม่โตเท่าไหร่"
      - text: "เณรนับทุกอย่างเลยเหรอ"
        heart: 1
        reply: "ครับ ผมชอบนับครับ… วันนี้ผมนับได้แล้วว่าพี่ยิ้มสองครั้ง นับรวมครั้งนี้เป็นสามครับ"
      - text: "พี่รีบนะเณร"
        heart: 0
        reply: "ได้ครับ ไปเถอะครับพี่… ผมจะนับว่าวันนี้เจอพี่หนึ่งครั้ง พรุ่งนี้ถ้าเจออีกเป็นสองครั้งครับ"

  - id: ton_r_fainted
    topic: react
    when: { fainted_recent: true }
    npc: "พี่ครับ! ผมได้ยินหลวงพ่อพูดกับลุงจำรัสว่าพี่โดนผีจับ… พี่เจ็บไหมครับ ผมสวดบทที่คล่องที่สุดให้พี่สามรอบแล้วครับ"
    options:
      - text: "ไม่เจ็บแล้ว ขอบใจนะเณร"
        heart: 2
        reply: "ดีจังครับ… ผมสวดรอบที่สามตะกุกตะกักนิดหนึ่ง ผมกลัวว่ามันจะไม่นับ แต่พี่หายแล้ว แปลว่านับครับ"
      - text: "ผีน่ากลัวมากเลยเณร"
        heart: 1
        reply: "ผมก็กลัวครับ… คืนนี้พี่มานอนศาลาวัดนะครับ ผมมีหมอนสองใบ ใบหนึ่งให้ถ่าน อีกใบให้พี่ได้ครับ ถ่านนอนพื้นก็ได้"
        next:
          - text: "ถ่านจะยอมเหรอ"
            heart: 1
            reply: "ไม่ยอมครับ… แต่ถ้าพี่ให้ไข่ต้มมันฟองหนึ่ง มันยอมทุกอย่างครับ ผมรู้ราคาของถ่านครับ"
          - text: "พี่นอนบ้านได้ เณรไม่ต้องห่วง"
            heart: 0
            reply: "ได้ครับ… แต่ถ้าได้ยินหมาหอน พี่รีบเข้าบ้านนะครับ หมาหอนสองทุ่มครึ่ง ผมจับเวลาแล้วครับ"

  - id: ton_r_meeting1
    topic: react
    once: true
    when: { flag: story_meeting1 }
    npc: "พี่ครับ ประชุมที่ศาลาเมื่อวาน ผมช่วยยกเก้าอี้ครับ ยกไปหกสิบสองตัว… แต่คนมานั่งสี่สิบเก้าคน อีกสิบสามคนนั่งพื้น เพราะเก้าอี้ร้อนครับ"
    options:
      - text: "เณรเก่งมาก นับได้ด้วย"
        heart: 1
        reply: "ผมนับคนหลับด้วยครับ… หลับเจ็ดคน กำนันหลับก่อนครับ ผมไม่ได้บอกใครนะครับ ผมบอกพี่คนเดียว"
        next:
          - text: "เณรฟังรู้เรื่องไหมว่าเขาประชุมอะไร"
            heart: 1
            reply: "ไม่ค่อยรู้เรื่องครับ… ผมรู้แค่ว่ามีน้ำ มีถนน มีตลาด ผมอยากได้น้ำครับ สระวัดจะได้มีปลา"
          - text: "อย่าบอกกำนันนะว่าเณรนับ"
            heart: 0
            reply: "ไม่บอกครับ… แต่ถ้ากำนันถาม ผมต้องพูดความจริงนะครับ หลวงพ่อสอนว่าห้ามโกหก"
      - text: "นั่งพื้นก็ได้นี่"
        heart: 0
        reply: "ได้ครับ แต่ลุงสมหมายนั่งพื้นแล้วลุกไม่ขึ้นครับ ผมกับถ่านต้องช่วยดึง ถ่านช่วยด้วยการเห่าครับ"

  - id: ton_r_well
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "พี่ครับ… สระวัดน้ำลดลงมากเลยครับ ปลาที่ผมตั้งชื่อไว้เหลือแค่ห้าตัว จากสิบสองตัว ผมนับทุกเช้าครับ"
    options:
      - text: "ปลาไปไหนหมด"
        heart: 1
        reply: "หลวงพ่อกับผมตักไปปล่อยคลองครับ เพราะสระจะแห้ง… ผมบอกลาทุกตัวครับ ตัวที่ชื่อเจ้าแดงไม่ยอมไป มันว่ายวนกลับมาสามรอบครับ"
        next:
          - text: "เจ้าแดงคงรักเณรนะ"
            heart: 2
            reply: "จริงเหรอครับ… ผมก็รักเจ้าแดงครับ ผมจะไปเยี่ยมมันที่คลองทุกวันพระ แต่หลวงพ่อห้ามชะโงกครับ ผีพราย"
          - text: "ฝนตกเดี๋ยวน้ำก็มา"
            heart: 0
            reply: "ผมก็หวังครับ… ผมนั่งสมาธิขอฝนทุกคืน หลวงพ่อบอกว่าสมาธิไม่ได้มีไว้ขอฝน แต่ผมขอแค่นิดเดียวครับ"
      - text: "เณรตั้งชื่อปลาทุกตัวเลยเหรอ"
        heart: 1
        reply: "ครับ! เจ้าแดง เจ้าดำ เจ้าจุด เจ้าอ้วน เจ้าเร็ว… อีกเจ็ดตัวผมจำไม่ได้ว่าตัวไหนชื่ออะไร มันเหมือนกันครับ"

  - id: ton_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "พี่ครับ มีคนงานบริษัทมาขอผ้ายันต์จากลุงจำรัสเยอะมากครับ… เขาบอกว่าเห็นผีผู้หญิง ผมนับคนมาเช่าได้ยี่สิบเอ็ดคนครับ"
    options:
      - text: "เณรกลัวไหม"
        heart: 1
        reply: "กลัวครับ… แต่หลวงพ่อบอกว่าผีไม่ค่อยกล้าเข้าใกล้คนที่ใจนิ่ง ผมเลยนั่งสมาธิก่อนนอน แต่บางคืนผมนั่งแล้วหลับเลยครับ"
        next:
          - text: "หลับก็ใจนิ่งเหมือนกัน"
            heart: 2
            reply: "จริงด้วยครับ! หลับใจนิ่งที่สุดเลย… ผมจะไปบอกหลวงพ่อครับ ไม่สิ ผมไม่บอกดีกว่า หลวงพ่อจะให้นั่งแถวหน้า"
          - text: "พี่ก็กลัวเหมือนกัน"
            heart: 1
            reply: "งั้นเรากลัวด้วยกันครับ… กลัวสองคนไม่น่ากลัวเท่ากลัวคนเดียวครับ ถ่านก็กลัวด้วย เป็นสามคนครับ"
      - text: "คนงานเขาเห็นจริงเหรอ"
        heart: 0
        reply: "ผมไม่รู้ครับ… แต่เขามือสั่นตอนจ่ายเงินลุงจำรัส เหรียญหล่นสามเหรียญ ผมช่วยเก็บครับ"

  - id: ton_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "พี่ครับ รถแห่ผ่านหน้าวัดเจ็ดรอบวันนี้ครับ ถ่านเห่าทั้งเจ็ดรอบ… รอบที่แปดถ่านเหนื่อยแล้ว มันแค่มองครับ"
    options:
      - text: "รถแห่เปิดเพลงอะไร"
        heart: 1
        reply: "เพลงเดิมทุกรอบครับ ผมร้องตามได้แล้วครับ… แต่หลวงพ่อบอกว่าเณรไม่ร้องเพลงหาเสียง ผมเลยฮัมในใจครับ"
        next:
          - text: "ฮัมในใจไม่ผิดหรอก"
            heart: 1
            reply: "จริงเหรอครับ… ดีจังครับ เพลงมันติดหูมากครับ ตอนท่องบทสวด ผมเกือบท่องเป็นทำนองนั้นไปแล้ว"
          - text: "ถ่านเหนื่อยแย่เลย"
            heart: 1
            reply: "ถ่านนอนหลับไปแล้วครับ… ผมเอาผ้าห่มเก่ามาห่มให้ ถ่านเห่าเก่งที่สุดในวัดครับ วันนี้ถ่านทำงานหนัก"
      - text: "เณรอยากให้ใครชนะ"
        heart: 0
        reply: "ผมเลือกไม่ได้ครับ… แต่ถ้าเลือกได้ ผมจะเลือกคนที่ซ่อมชิงช้าโรงเรียนครับ ชิงช้าโซ่ขาดมาสองเดือนแล้วครับ"

  - id: ton_r_lottery
    topic: react
    once: true
    when: { flag: bought_lottery }
    npc: "พี่ครับ… พี่ซื้อหวยด้วยเหรอครับ ผมไม่ได้ฝันเลขให้ใครนะครับ ผมฝันไม่เป็น ผมฝันเห็นแต่หมา"
    options:
      - text: "พี่ไม่ได้จะมาถามหรอกเณร"
        heart: 2
        reply: "จริงเหรอครับ… ดีจังครับ ผมดีใจครับ คนที่ไม่ถามผมเรื่องฝันมีน้อยมากครับ พี่เป็นคนที่เจ็ดครับ ผมนับครับ"
        next:
          - text: "ใครบ้างที่ไม่ถาม"
            heart: 1
            reply: "หลวงพ่อ ลุงจำรัส หมอแอน ครูเต้ย ยายบัว ถ่าน แล้วก็พี่ครับ… ถ่านไม่ถามเพราะพูดไม่ได้ แต่ผมนับให้ครับ"
          - text: "ถ้ามีคนมาถามอีก บอกพี่นะ"
            heart: 1
            reply: "ได้ครับ! แต่พี่อย่าไปดุเขานะครับ เขาไม่ได้ใจร้าย หลวงพ่อบอกว่าเขาแค่อยากมีความหวังครับ"
      - text: "เณรฝันอะไรเมื่อคืน"
        heart: -1
        reply: "… พี่ก็ถามด้วยเหรอครับ ผมฝันเห็นถ่านครับ ถ่านกินข้าวเหนียว แค่นั้นครับ ไม่มีเลขครับ"

  # ===== news =====
  - id: ton_n_exam
    topic: news
    npc: "พี่ครับ อีกสิบสองวันผมสอบนักธรรมตรีครับ… ผมนับถอยหลังทุกเช้าครับ วันนี้สิบสอง พรุ่งนี้สิบเอ็ด"
    options:
      - text: "เณรอ่านหนังสือทันไหม"
        heart: 1
        reply: "ทันครับ ผมท่องให้ถ่านฟังทุกเย็นครับ… ถ่านหลับทุกครั้ง ผมว่าถ่านจำได้หมดแล้ว แต่มันไม่ต้องสอบครับ โชคดีจัง"
        next:
          - text: "พี่ช่วยถือหนังสือให้ท่องนะ"
            heart: 2
            reply: "จริงเหรอครับ! พี่ถือหนังสือ ผมท่อง ถ้าผมผิด พี่อย่าเพิ่งบอกนะครับ ให้ผมรู้เองก่อนสองวินาที หลวงพ่อสอนครับ"
          - text: "สอบได้แล้วจะได้อะไร"
            heart: 0
            reply: "ได้ใบประกาศครับ… แล้วหลวงพ่อจะพาไปกินขนมครกตอนเช้าครับ ขนมครกสำคัญกว่าใบประกาศนิดหนึ่งครับ"
      - text: "ขอให้สอบได้นะเณร"
        heart: 1
        reply: "ขอบคุณครับพี่… ผมจะนับว่าพี่อวยพรผมหนึ่งครั้งครับ ตอนนี้มีคนอวยพรผมสิบสี่ครั้งแล้วครับ"

  - id: ton_n_than_bath
    topic: news
    npc: "พี่ครับ วันนี้ผมอาบน้ำให้ถ่านครับ! ถ่านไม่ชอบเลย มันวิ่งรอบลานวัดเปียกทั้งตัว สามรอบครับ… แล้วไปนอนบนจีวรผมที่ตากไว้"
    options:
      - text: "จีวรเณรเปียกหมดเลยสิ"
        heart: 1
        reply: "เปียกแล้วก็มีขนหมาครับ… ผมต้องซักใหม่ หลวงพ่อเห็นแล้วหัวเราะ หลวงพ่อไม่ค่อยหัวเราะเสียงดังครับ วันนี้หัวเราะดังครับ"
        next:
          - text: "เณรทำให้หลวงพ่อมีความสุขนะ"
            heart: 2
            reply: "จริงเหรอครับ… ผมนึกว่าผมทำให้หลวงพ่อเหนื่อยครับ ผมจะจำไว้ว่าวันนี้ทำให้หลวงพ่อหัวเราะได้หนึ่งครั้ง"
          - text: "ถ่านกลัวน้ำเหรอ"
            heart: 1
            reply: "ไม่กลัวครับ ถ่านแค่ไม่ชอบสบู่ครับ… ผมใช้สบู่สมุนไพรที่ยายบัวให้ ถ่านจามสี่ครั้ง ผมนับครับ"
      - text: "หมาวัดต้องอาบน้ำด้วยเหรอ"
        heart: 0
        reply: "ต้องครับ ถ่านกลิ้งในโคลนทุกวัน… ถ้าไม่อาบ ถ่านจะเหม็นเหมือนควายตาเผือกครับ ผมไม่ได้ว่าควายนะครับ"

  - id: ton_n_library
    topic: news
    npc: "พี่ครับ ครูเต้ยให้ผมเป็นบรรณารักษ์ห้องสมุดวัดครับ! ผมจดชื่อคนยืมหนังสือครับ… ลุงจำรัสบอกว่าลายมือผมเหมือนไก่ แต่ไก่ที่ตั้งใจครับ"
    options:
      - text: "ยินดีด้วยนะเณร"
        heart: 2
        reply: "ขอบคุณครับ! ผมได้ป้ายชื่อด้วยครับ ครูเต้ยเขียนให้ แปะดาวทองข้างชื่อหนึ่งดวง… ผมแปะไว้ที่ข้างหมอนครับ"
        next:
          - text: "มีคนมายืมเยอะไหม"
            heart: 1
            reply: "วันนี้สามคนครับ… น้องโอ๊ตยืมหนังสือไดโนเสาร์ครั้งที่สิบ น้องมิวยืมนิทาน แล้วก็ลุงสมหมายยืมหนังสือ ‘ทำนายฝัน’ ผมไม่รู้ว่ามันมาอยู่ในห้องสมุดได้ไงครับ"
          - text: "พี่ขอยืมสักเล่มได้ไหม"
            heart: 1
            reply: "ได้ครับ! พี่ต้องเขียนชื่อเองนะครับ ลายมือพี่สวยกว่าผม… แล้วต้องคืนภายในเจ็ดวัน ผมจะนับครับ"
      - text: "ลายมือไก่อ่านออกไหม"
        heart: 0
        reply: "ผมอ่านออกครับ… คนอื่นอ่านไม่ค่อยออก ผมเลยต้องเป็นบรรณารักษ์ตลอดไปครับ ไม่มีใครแทนได้"

  - id: ton_r_letter
    topic: react
    once: true
    when: { flag: ton_q3_done }
    npc: "พี่ครับ! เมื่อคืนผมไม่ได้ร้องไห้เลยครับ วันอาทิตย์นะครับ… ผมนับแล้ว เป็นวันอาทิตย์แรกในสองปีที่ไม่ร้องครับ"
    options:
      - text: "เพราะจดหมายถึงแม่ใช่ไหม"
        heart: 2
        reply: "ใช่ครับ… ผมรู้แล้วว่าแม่รู้ว่าผมคิดถึง ผมเลยไม่ต้องร้องให้ใครรู้อีกครับ หลวงพ่อบอกว่าผมโตขึ้นหนึ่งเซนติเมตรในใจครับ"
        next:
          - text: "หนึ่งเซนติเมตรในใจวัดยังไง"
            heart: 1
            reply: "ผมก็ถามหลวงพ่อแบบนี้ครับ… หลวงพ่อบอกว่าวัดด้วยจำนวนคืนที่หลับสบายครับ ผมจะนับต่อครับ"
          - text: "พี่ดีใจด้วยนะเณร"
            heart: 1
            reply: "ขอบคุณครับพี่… ผมเล่าให้ถ่านฟังแล้วครับ ถ่านกระดิกหางสามครั้ง ผมนับว่าถ่านดีใจด้วยครับ"
      - text: "ถ้าคิดถึงแม่อีกก็เขียนอีกนะ"
        heart: 1
        reply: "ครับ! ผมมีกระดาษสีเหลือแผ่นหนึ่งครับ ผมเก็บไว้สำหรับวันที่คิดถึงที่สุดครับ"

  # ===== advice =====
  - id: ton_a_light
    topic: advice
    when: { time: evening }
    npc: "พี่ครับ ถ้ากลับบ้านไม่ทัน มองหาไฟโบสถ์นะครับ หลวงพ่อเปิดทิ้งไว้ทั้งคืน… ผมเป็นคนเปิดเองครับ สองทุ่มตรง"
    options:
      - text: "เณรเปิดทุกคืนเลยเหรอ"
        heart: 1
        reply: "ทุกคืนครับ… หลวงพ่อบอกว่าเผื่อมีคนหลงทาง ผมเลยเปิดแล้วยืนดูสักพัก เผื่อมีใครเห็นแล้วเดินมาครับ"
        next:
          - text: "เคยมีคนเดินมาไหม"
            heart: 1
            reply: "เคยครับ… คืนหนึ่งลุงเชิดรถเสีย เดินตามไฟมาถึงวัด ลุงบอกผมว่า ‘ไฟเณรช่วยลุงไว้’ ผมนอนยิ้มทั้งคืนครับ"
          - text: "ขอบใจที่เปิดไฟนะเณร"
            heart: 2
            reply: "ไม่เป็นไรครับ… คืนนี้ผมจะเปิดแล้วนึกถึงพี่ด้วยครับ เป็นไฟของพี่ด้วยครับ"
      - text: "เปิดไฟทั้งคืนเปลืองไฟนะ"
        heart: 0
        reply: "ลุงจำรัสก็พูดแบบนี้ครับ… แล้วลุงก็จ่ายค่าไฟเพิ่มทุกเดือนโดยไม่บ่น ผมเห็นลุงจดว่า ‘ค่าไฟโบสถ์ จำเป็น’"

  - id: ton_a_snake
    topic: advice
    npc: "พี่ครับ ถ้าเจองูอย่าวิ่งนะครับ ยืนนิ่งๆ ให้มันไปก่อน… ผมเจองูเขียวที่ลานวัดเมื่อวาน ผมยืนนิ่งนับถึงหนึ่งร้อยยี่สิบ มันถึงไป"
    options:
      - text: "เณรไม่กลัวเหรอ"
        heart: 1
        reply: "กลัวครับ ขาสั่นครับ… แต่หลวงพ่อสอนว่าสัตว์ก็กลัวเราเหมือนกัน ผมเลยคิดว่ามันกำลังนับถึงหนึ่งร้อยยี่สิบเหมือนผมครับ"
      - text: "นับถึงร้อยยี่สิบเลยเหรอ"
        heart: 1
        reply: "ครับ… ผมนับได้ไกลกว่านี้ครับ แต่งูไปก่อน ถ้างูอยู่นานกว่านี้ ผมคงนับถึงพันครับ"

  # ===== smalltalk =====
  - id: ton_s_hungry
    topic: smalltalk
    when: { time: evening }
    npc: "พี่ครับ ท้องผมร้องครับ… หลังเที่ยงห้ามฉัน ผมเลยนับเสียงท้องร้องแทนครับ วันนี้ร้องเก้าครั้งแล้ว"
    options:
      - text: "เณรหิวทุกเย็นเลยเหรอ"
        heart: 1
        reply: "ทุกเย็นครับ… แต่ตอนเช้าข้าวอร่อยมากครับ หิวตอนเย็นทำให้ข้าวเช้าอร่อยขึ้น หลวงพ่อบอกครับ ผมว่าจริงครับ"
        next:
          - text: "พรุ่งนี้พี่เอาขนมครกมาใส่บาตรนะ"
            heart: 2
            reply: "จริงเหรอครับ! ขนมครกเป็นของโปรดผมครับ… ผมจะไม่นับเสียงท้องร้องคืนนี้แล้วครับ ผมจะนับชั่วโมงถึงเช้าแทน"
          - text: "ดื่มน้ำเยอะๆ นะเณร"
            heart: 1
            reply: "ครับ ผมดื่มไปสามแก้วแล้วครับ… ท้องผมตอนนี้เป็นเสียงน้ำครับ ไม่ใช่เสียงหิว"
      - text: "ทนไม่ไหวก็ฉันแอบๆ สิ"
        heart: -1
        reply: "ไม่ได้ครับพี่… ผมเป็นเณร ผมต้องรักษาศีลครับ ถ้าผมแอบ ผมจะไม่กล้ามองหน้าหลวงพ่อ"

  - id: ton_s_frog
    topic: smalltalk
    when: { rain: true }
    npc: "พี่ครับ ฝนตกกบร้องแล้วครับ! ผมนับเสียงได้สามเสียง เสียงทุ้ม เสียงแหลม แล้วก็เสียงที่เหมือนลุงสมหมายไอครับ"
    options:
      - text: "เหมือนลุงสมหมายไอจริงเหรอ"
        heart: 1
        reply: "จริงครับ! ผมเกือบไปถามว่าลุงเป็นอะไรไหมครับ… ปรากฏว่าเป็นกบตัวใหญ่ใต้โอ่งครับ"
      - text: "กบร้องเพราะดีใจหรือเปล่า"
        heart: 2
        reply: "ผมก็คิดแบบนั้นครับ! กบดีใจที่ฝนตก ผมก็ดีใจที่ฝนตก… เราเป็นเพื่อนกันครับ แต่กบร้องดังกว่าผม"
        next:
          - text: "เณรลองร้องตามสิ"
            heart: 1
            reply: "อ๊บ… อ๊บ… ไม่ได้ครับพี่ เดี๋ยวหลวงพ่อได้ยิน หลวงพ่อจะคิดว่ามีกบเข้ากุฏิครับ"
          - text: "ฟังกบแล้วหลับง่ายนะ"
            heart: 1
            reply: "ใช่ครับ… คืนฝนตกผมหลับก่อนนับกบครบทุกครั้งครับ"

  - id: ton_s_bell
    topic: smalltalk
    npc: "พี่ครับ ผมตีระฆังทำวัตรเย็นทุกวันครับ ตีสิบสองครั้ง… วันหนึ่งผมเผลอตีสิบสาม หลวงพ่อถามว่าครั้งที่สิบสามให้ใคร"
    options:
      - text: "เณรตอบว่าไง"
        heart: 1
        reply: "ผมตอบว่าให้ถ่านครับ… หลวงพ่อยิ้มแล้วบอกว่า ‘ดีแล้ว ถ่านก็ควรได้ฟังเสียงระฆังสักครั้ง’ ผมนึกว่าจะโดนดุครับ"
        next:
          - text: "หลวงพ่อใจดีนะ"
            heart: 1
            reply: "ใจดีที่สุดครับ… แต่ถ้าผมหลับตอนทำวัตร หลวงพ่อให้ย้ายไปนั่งแถวหน้า ใจดีแต่ไม่ให้หลับครับ"
          - text: "ครั้งต่อไปตีให้พี่สักครั้งได้ไหม"
            heart: 2
            reply: "ได้ครับ! แต่ต้องบอกหลวงพ่อก่อนนะครับ… ผมจะบอกว่า ‘ครั้งที่สิบสามให้พี่หลานยายเพียรครับ’"
      - text: "ตีเกินหนึ่งครั้งไม่เป็นไรหรอก"
        heart: 0
        reply: "เป็นครับ… ผมนอนคิดทั้งคืนว่าเสียงที่สิบสามไปถึงไหนครับ"

  # ===== self =====
  - id: ton_f_ordain
    topic: self
    npc: "ผมมาบวชตอนเก้าขวบครับ… ตอนนั้นผมร้องไห้ทุกคืน คิดถึงบ้าน ตอนนี้ร้องอาทิตย์ละครั้งครับ"
    options:
      - text: "เณรเก่งมากเลยนะ"
        heart: 1
        reply: "ผมไม่ได้เก่งครับ… ถ่านมานอนข้างผมทุกคืนที่ผมร้อง ผมเลยร้องน้อยลงครับ ถ่านเก่งกว่าครับ"
      - text: "ร้องวันไหนเณร"
        heart: 2
        reply: "วันอาทิตย์ครับ… หลังคุยโทรศัพท์กับแม่ แม่ชอบถามว่ากินอิ่มไหม ผมบอกว่าอิ่มครับ แต่พอวางสาย ผมก็ร้องครับ ไม่รู้ทำไม"
        next:
          - text: "คิดถึงแม่ก็ร้องได้นะ"
            heart: 2
            reply: "จริงเหรอครับ… หลวงพ่อก็บอกแบบนี้ครับ หลวงพ่อบอกว่าหลวงพ่อก็ยังคิดถึงแม่หลวงพ่อ ผมเลยไม่อายแล้วครับ"
          - text: "แม่เณรอยู่ไกลไหม"
            heart: 1
            reply: "อยู่ระยองครับ ทำงานโรงงาน… ไกลมากครับ ผมนับป้ายรถเมล์ได้ไม่หมด ลุงเชิดบอกว่าต้องต่อรถอีกสามคันครับ"

  - id: ton_f_dream_job
    topic: self
    when: { heart_min: 3 }
    npc: "พี่ครับ… ผมอยากเป็นหมอเหมือนหมอแอน แต่ผมก็อยากเป็นพระเหมือนหลวงพ่อ ผมเลือกไม่ได้ครับ ผมคิดทุกคืน"
    options:
      - text: "ไม่ต้องรีบเลือกหรอกเณร"
        heart: 2
        reply: "จริงเหรอครับ… ผมนึกว่าต้องเลือกก่อนสอบนักธรรมครับ งั้นผมจะคิดไปอีกสักสิบปีครับ"
      - text: "เป็นพระที่รักษาคนได้ไหม"
        heart: 2
        reply: "ได้เหรอครับ… ผมไม่เคยคิดเลยครับ! หลวงพ่อรักษาต้นไม้ได้ หมอแอนรักษาคนได้ ผมเป็นทั้งสองอย่างได้ไหมครับ"
        next:
          - text: "ลองถามหลวงพ่อดูสิ"
            heart: 1
            reply: "ผมจะถามคืนนี้ครับ… ถ้าหลวงพ่อตอบว่าได้ ผมจะเรียนหนังสือหนักขึ้นสองเท่าครับ"
          - text: "ยายบัวก็รักษาคนได้นะ"
            heart: 1
            reply: "จริงด้วยครับ! ยายบัวไม่ใช่หมอ ไม่ใช่พระ แต่รักษาคนได้… งั้นผมเป็นอะไรก็ได้ แค่ต้องตั้งใจครับ"
      - text: "เป็นหมอรวยกว่านะ"
        heart: 0
        reply: "รวยคืออะไรครับ… ผมอยากรักษาคนครับ ไม่ได้อยากรวย ถ้ารวยผมจะซื้อขนมครกให้ถ่านทุกวันครับ"

  - id: ton_f_pien
    topic: self
    when: { heart_min: 5 }
    npc: "พี่ครับ… ผมมีเรื่องยายเพียรที่ไม่เคยบอกใคร ตอนผมบวชใหม่ๆ แล้วร้องไห้ทุกคืน ยายเพียรมาวัดตอนเย็น เอาขนมครกมาวางไว้หน้ากุฏิผมทุกวันพระครับ"
    options:
      - text: "ยายไม่ได้บอกเณรเหรอว่ายายเอามา"
        heart: 1
        reply: "ไม่บอกครับ… ยายวางแล้วกลับ ผมแอบมองจากหน้าต่าง ผมเห็นยายครับ ยายไม่รู้ว่าผมเห็น ผมเก็บไว้เป็นความลับสองปีครับ"
        next:
          - text: "ทำไมเก็บเป็นความลับ"
            heart: 2
            reply: "เพราะยายอยากให้เป็นความลับครับ… ถ้าผมบอก ยายจะไม่ได้เป็นคนวางขนมลึกลับอีก ผมอยากให้ยายเป็นแบบนั้นต่อไปครับ"
          - text: "เณรกินหลังเที่ยงไม่ได้นี่"
            heart: 1
            reply: "ผมเก็บไว้ฉันตอนเช้าครับ… ขนมครกเย็นชืดแต่อร่อยที่สุด เพราะมีคนตั้งใจเอามาให้ครับ"
      - text: "ทำไมเพิ่งเล่าให้พี่ฟัง"
        heart: 1
        reply: "เพราะยายเพียรไม่อยู่แล้วครับ… ผมคิดว่าความลับของคนที่จากไปแล้ว ควรมีคนรู้สักคนหนึ่ง พี่เป็นหลานยาย พี่ควรรู้ครับ"

  # ===== others =====
