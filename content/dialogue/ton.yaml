      - text: "ยายเล่าเรื่องผีอะไร"
        heart: 1
        reply: "ผีปอบครับ… ผมจำได้แค่ว่าผีปอบกินตับ ผมเลยจับท้องตัวเองไว้ทั้งวันครับ ไม่รู้ตับอยู่ตรงไหน"
        next:
          - text: "ตับอยู่ข้างขวาบนนะเณร"
            heart: 1
            reply: "ขวาบน… ขอบคุณครับพี่ ผมจะจับถูกที่แล้วครับ หมอแอนก็คงบอกแบบนี้ครับ"
          - text: "ผีปอบไม่มีหรอก อย่ากลัว"
            heart: 0
            reply: "ยายบัวบอกว่ามีครับ… แต่ยายบอกด้วยว่าผีปอบไม่ชอบวัด ผมอยู่วัดครับ ผมปลอดภัยครับ"

  - id: ton_o_ann
    topic: others
    npc: "หมอแอนให้พลาสเตอร์ลายดาวผมตอนเข่าแตกครับ… ผมไม่ได้แกะเลย สามวันแล้ว มันเริ่มดำครับ แต่ดาวยังอยู่"
    options:
      - text: "ต้องเปลี่ยนแล้วนะเณร"
