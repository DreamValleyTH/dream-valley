        reply: "หมอแอนก็บอกแบบนี้ครับ… หมอแอนบอกว่าจะให้แผ่นใหม่ลายดาวเหมือนกัน ผมเลยยอมแกะครับ ผมจะเก็บแผ่นเก่าไว้ด้วย"
        next:
          - text: "เก็บพลาสเตอร์เก่าไว้ทำไม"
            heart: 1
            reply: "เป็นความทรงจำครับ… วันที่ผมล้มแล้วไม่ร้อง ผมนั่งสมาธิแทน หมอแอนชมผมครับ ผมไม่ค่อยได้รับคำชมครับ"
          - text: "ดีแล้ว เดี๋ยวแผลติดเชื้อ"
            heart: 1
            reply: "ติดเชื้อคืออะไรครับ… หมอแอนอธิบายแล้วครับ แต่ยาวมาก ผมจำได้แค่ว่าต้องล้างมือครับ"
      - text: "เณรชอบหมอแอนเหรอ"
        heart: 1
        reply: "ชอบครับ หมอแอนเหมือนพี่สาวครับ… หมอแอนไม่เคยถามผมเรื่องฝันเลยครับ ถามแต่ว่าเจ็บตรงไหนครับ"

quests:
  - id: ton_q1
    npc: ton
    title: "ฝันของเณร"
    desc: "ชาวบ้านมาถามเลขจากความฝันเณรต้นทุกเช้า จนเณรกลัวการนอน"
    start: { heart_min: 1, day_min: 3 }
    offer:
      npc: "พี่ครับ… ผมนอนไม่ค่อยหลับครับ ทุกเช้ามีคนมารอถามว่าผมฝันอะไร ผมกลัวฝันผิดแล้วเขาจะเสียเงินครับ… พี่ช่วยผมได้ไหมครับ ผมไม่อยากให้ใครเสียใจ"
      options:
        - text: "ได้สิเณร พี่จะช่วย"
          accept: true
          heart: 2
          reply: "ขอบคุณครับพี่! ลุงสมหมายมาบ่อยที่สุดครับ… ผมไม่อยากให้ลุงโกรธ ลุงใจดีครับ ลุงแค่อยากถูกหวยมากๆ"
        - text: "เณรไม่ต้องตอบเขาก็ได้"
          accept: true
          heart: 1
          reply: "แต่ผมไม่ตอบแล้วรู้สึกเหมือนผมใจร้ายครับ… พี่ช่วยผมคิดหน่อยนะครับ ว่าจะบอกเขายังไงดี"
        - text: "บอกเลขเขาไปสิ จะได้จบ"
          reply: "ผมฝันเป็นเลขไม่เป็นครับพี่… ไม่เป็นไรครับ ผมจะท่องบทสวดก่อนนอนให้หลับไวครับ"
    steps:
      - goal: { type: talk, npc: sommai }
        hint: "ไปคุยกับลุงสมหมายเรื่องที่มาถามฝันเณรต้นทุกเช้า"
        done:
          npc: "เณรกลัวเหรอหลาน… ลุงไม่รู้เลยนะ ลุงนึกว่าเณรสนุก เณรยิ้มทุกที ลุงแค่ถามเว้ย ไม่ได้บังคับ… แต่ก็จริง ลุงถามทุกเช้า สามสิบวันติด ลุงขอโทษเณรดีไหมหลาน"
          options:
            - text: "ขอโทษเณรเถอะ{k}ลุง"
              heart: 1
              reply: "ได้ๆ ลุงจะไปขอโทษพรุ่งนี้เช้า แล้วลุงจะเอาขนมครกไปใส่บาตรด้วย ไม่ถามเลขสักคำ… แต่ถ้าเณรเล่าเองลุงไม่ห้ามนะ"
            - text: "ลุงไปถามถ่านแทนดีไหม{kq}"
              heart: 1
              reply: "ถามหมา! หลานพูดจริงเหรอ… เออ หมามันก็ฝันนะ ตอนนอนขามันกระตุก ลุงจะนับว่ากระตุกกี่ที ฉลาดหลาน ฉลาด"
      - goal: { type: visit, place: temple, from: "06:00", to: "07:00" }
        hint: "ไปยืนเป็นเพื่อนเณรต้นหน้ากุฏิตอนเช้า"
        done:
          npc: "พี่มาแล้วครับ! เช้านี้มีคนมารอสองคนครับ… ลุงสมหมายมาขอโทษผม แล้วใส่ขนมครกในบาตร ผมดีใจมากครับ แต่อีกคนผมไม่รู้จัก เขายังถามอยู่ครับ ผมจะทำยังไงดีครับพี่"
          options:
            - text: "บอกเขาตรงๆ ว่าเณรฝันเห็นแต่หมา"
              heart: 2
              set_flag: ton_says_dog
              reply: "ผมบอกแล้วครับ! ‘ผมฝันเห็นแต่หมาครับ ไม่มีเลขครับ’… เขาหัวเราะแล้วไปครับ ผมไม่กลัวแล้วครับพี่ การพูดความจริงง่ายกว่าที่ผมคิดครับ"
            - text: "ชวนเขามาช่วยกวาดลานก่อน แล้วค่อยคุย"
              heart: 1
              set_flag: ton_broom_rule
              reply: "เขากวาดครับ! กวาดเสร็จเขาลืมถามผมเลยครับ… หลวงพ่อเห็นแล้วยิ้ม บอกว่าลานวัดสะอาดขึ้นเพราะความฝันของผมครับ"
            - text: "ให้หลวงพ่อช่วยพูดให้"
              heart: 1
              set_flag: ton_sumet_helps
              reply: "หลวงพ่อออกมาพูดครับ… ‘ฝันของเณรเป็นของเณร’ แค่ประโยคเดียว ทุกคนเงียบเลยครับ ผมอยากพูดเก่งแบบหลวงพ่อครับ"
    reward: { money: 50, heart: 2, items: { marble: 1 }, set_flag: ton_q1_done, line: { from: ton, text: "สวัสดีครับ ผมเณรต้นครับ (หลวงพ่อให้ยืมโทรศัพท์) ผมฝันเห็นแต่หมาครับ ไม่มีเลขครับ ขอบคุณที่ไม่ถามครับ 🙏🐕" } }

  - id: ton_q2
    npc: ton
    title: "ถ่านหายไป"
    desc: "หมาวัดของเณรต้นหายไปตั้งแต่บ่าย เณรออกไปนอกวัดตอนค่ำไม่ได้"
    start: { flag: ton_q1_done, heart_min: 3, day_min: 5 }
    offer:
      npc: "พี่ครับ… ถ่านหายครับ ตั้งแต่บ่ายสอง ผมเรียกร้อยกว่าครั้งแล้วครับ ผมนับครับ… หลวงพ่อไม่ให้ผมออกนอกวัดตอนเย็น พี่ช่วยหาถ่านให้ผมได้ไหมครับ"
      options:
        - text: "ได้เณร พี่ไปหาเดี๋ยวนี้เลย"
          accept: true
          heart: 2
          reply: "ขอบคุณครับ! ถ่านชอบไปริมคลองครับ ไปดูเจ้าแดงปลาของผม… พี่ระวังนะครับ กลับก่อนสามทุ่มนะครับ ผมจะเปิดไฟโบสถ์รอครับ"
        - text: "เดี๋ยวมันก็กลับมาเองแหละ"
          accept: true
          heart: 0
          reply: "ถ่านไม่เคยไปไหนนานขนาดนี้ครับ… พี่ช่วยไปดูริมคลองหน่อยได้ไหมครับ แค่แป๊บเดียวครับ"
        - text: "พี่ไม่ว่างนะเณร"
          reply: "ไม่เป็นไรครับ… ผมจะยืนรอที่ประตูวัดครับ ถ่านต้องเห็นผมแน่ๆ ครับ"
    steps:
      - goal: { type: visit, place: canal, from: "17:00", to: "19:30" }
        hint: "ไปตามหาถ่านที่ริมคลองช่วงเย็น"
        done:
          npc: "(ใต้สะพาน ถ่านยืนเห่าอยู่ที่ตลิ่ง ขาหน้าติดอยู่ในตาข่ายดักปลาเก่า… ในน้ำตื้นข้างๆ มีปลาสีแดงตัวหนึ่งว่ายวนอยู่ไม่ยอมไปไหน)"
          options:
            - text: "(ค่อยๆ แกะตาข่ายออกจากขาถ่าน)"
              heart: 1
              reply: "(ถ่านนิ่งให้แกะจนเสร็จ แล้วเลียมือหนึ่งที ก่อนวิ่งนำทางกลับวัดโดยหันมาดูทุกสิบก้าว)"
            - text: "(อุ้มถ่านขึ้นมาทั้งตาข่าย แล้วรีบเดินกลับ)"
              heart: 1
              reply: "(ถ่านหนักกว่าที่คิด… ระหว่างทาง ถ่านส่งเสียงครางเบาๆ เหมือนจะบอกว่าตัวเองไม่ได้หลงทาง มาเยี่ยมเพื่อนต่างหาก)"
      - goal: { type: talk, npc: ton }
        hint: "พาถ่านกลับไปส่งเณรต้นที่วัด"
        done:
          npc: "ถ่าน! ถ่านกลับมาแล้ว… พี่ครับ ขอบคุณครับ ขอบคุณครับ ขอบคุณครับ ผมขอบคุณสามรอบเหมือนผู้ใหญ่สมศักดิ์ครับ… ถ่านไปติดอยู่ที่ไหนครับ"
          options:
            - text: "ริมคลอง มันไปเฝ้าเจ้าแดงอยู่"
              heart: 2
              set_flag: ton_than_friend
              reply: "เจ้าแดงยังอยู่เหรอครับ! ถ่านไปเยี่ยมเจ้าแดงแทนผม… ผมไม่ได้ไปเพราะหลวงพ่อห้าม ถ่านเลยไปแทน ถ่านเป็นหมาที่ดีที่สุดในโลกครับ"
            - text: "ขาติดตาข่ายดักปลา โชคดีที่เจอทัน"
              heart: 1
              reply: "ตาข่ายดักปลา… ผมจะไปบอกลุงจำรัสให้จดว่ามีตาข่ายเก่าที่ริมคลองครับ จะได้ไม่มีหมาตัวอื่นติดอีกครับ"
    reward: { money: 0, heart: 2, items: { mango: 1 }, set_flag: ton_q2_done, line: { from: ton, text: "ถ่านกลับมาแล้วครับ! 🐕 ขอบคุณพี่หลานยายเพียรครับ ใครเห็นตาข่ายเก่าที่ริมคลองช่วยเก็บด้วยนะครับ (เณรต้น ยืมโทรศัพท์หลวงพ่อ)" } }

  - id: ton_q3
    npc: ton
    title: "จดหมายถึงแม่"
    desc: "เณรต้นอยากส่งจดหมายพร้อมรูปวาดไปให้แม่ที่โรงงาน"
    start: { flag: ton_q2_done, heart_min: 4, day_min: 9 }
    offer:
      npc: "พี่ครับ… วันอาทิตย์นี้แม่ผมไม่ได้โทรมาครับ แม่ส่งข้อความมาบอกหลวงพ่อว่าต้องทำโอที ผมอยากเขียนจดหมายไปหาแม่ครับ แต่ผมไม่มีกระดาษสีครับ"
      options:
        - text: "พี่ซื้อกระดาษสีมาให้นะ"
          accept: true
          heart: 2
          reply: "จริงเหรอครับ! ผมอยากวาดรูปถ่านให้แม่ดูครับ แม่ยังไม่เคยเห็นถ่านตัวจริง… ขอสองแผ่นครับ แผ่นหนึ่งวาดรูป อีกแผ่นเขียนจดหมาย"
        - text: "วิดีโอคอลหาแม่ไม่ดีกว่าเหรอ"
          accept: true
          heart: 1
          reply: "แม่ทำงานอยู่ครับ คอลไม่ได้… จดหมายแม่อ่านตอนไหนก็ได้ครับ แม่จะได้อ่านซ้ำได้ด้วยครับ"
        - text: "เดี๋ยวแม่ก็โทรมาเองแหละ"
          reply: "ครับ… ผมจะรอครับ ผมรอเก่งครับ"
    steps:
      - goal: { type: give, npc: ton, item: color_paper, n: 2 }
        hint: "ซื้อกระดาษสี 2 แผ่นที่ร้านป้าแต๋วไปให้เณรต้น"
        done:
          npc: "สีเหลืองกับสีฟ้าครับ! สีเหลืองผมวาดถ่าน สีฟ้าผมเขียนจดหมาย… พี่ช่วยดูว่าผมเขียนถูกไหมครับ ‘แม่ครับ ผมสบายดีครับ ผมกินอิ่มครับ ผมคิดถึงแม่ทุกวันครับ ถ่านก็คิดถึงแม่ครับ ถึงแม้ถ่านไม่เคยเจอแม่ก็ตามครับ’"
          options:
            - text: "เขียนดีมากเลยเณร"
              heart: 2
              reply: "จริงเหรอครับ… ผมเขียนครับเยอะไปไหมครับ ผมนับได้เก้าครับ ครูเต้ยบอกว่าจดหมายถึงแม่ ครับเยอะได้ครับ"
            - text: "เขียนเพิ่มว่าสอบนักธรรมด้วยสิ"
              heart: 1
              reply: "จริงด้วยครับ! ‘ผมจะสอบนักธรรมตรีครับ ถ้าสอบได้ ผมจะท่องให้แม่ฟังตอนสงกรานต์ครับ’… แม่ต้องดีใจแน่ครับ"
      - goal: { type: talk, npc: ton }
        hint: "ช่วยเณรต้นเลือกว่าจะส่งจดหมายถึงแม่ยังไง"
        done:
          npc: "จดหมายเสร็จแล้วครับ… พี่ครับ ส่งยังไงดีครับ ไปรษณีย์อยู่ที่อำเภอ ผมไปเองไม่ได้ครับ"
          options:
            - text: "ฝากลุงเชิดไปส่งไปรษณีย์ที่อำเภอ"
              heart: 2
              set_flag: ton_letter_bus
              reply: "ลุงเชิด! ลุงต้องรับแน่ครับ ลุงใจดี… ผมจะวาดรูปทะเลให้ลุงด้วยเป็นค่าส่งครับ ลุงไม่เคยเห็นทะเล แม่ผมทำงานใกล้ทะเลครับ แม่จะเล่าให้ผมฟัง แล้วผมจะเล่าให้ลุงฟังต่อครับ"
            - text: "ถ่ายรูปส่งให้แม่ทางโทรศัพท์พี่ก่อน"
              heart: 1
              set_flag: ton_letter_photo
              reply: "แม่จะได้เห็นวันนี้เลยใช่ไหมครับ… แม่ตอบมาแล้วครับ! แม่ส่งรูปหัวใจมาสามดวง ผมนับครับ แล้วแม่บอกว่าจะเก็บจดหมายตัวจริงไว้ตอนสงกรานต์ ให้ผมยื่นให้แม่เองครับ"
            - text: "เก็บไว้ให้แม่ตอนสงกรานต์เลย"
              heart: 1
              set_flag: ton_letter_keep
              reply: "ผมจะเก็บไว้ใต้หมอนครับ… แล้วทุกอาทิตย์ผมจะเขียนเพิ่มอีกหนึ่งหน้า ถึงสงกรานต์แม่จะได้จดหมายเป็นเล่มเลยครับ ผมนับแล้ว ยี่สิบสามหน้าครับ"
    sold_at: { color_paper: taew_shop }
    reward: { money: 0, heart: 2, items: { khanom_krok: 2 }, set_flag: ton_q3_done }
