    npc: "ยายบัวมายืนรอหน้ากุฏิผมเมื่อเช้าครับ… ยายเล่าเรื่องผีให้ลุงสมหมายฟังจนลุงลืมถามผมเรื่องฝัน ยายช่วยผมครับ"
    options:
