# เสี่ยเฮง — convos + quests (ตัวหลัก 🖤)
convos:
  # ===== react =====
  - id: heng_r_meet
    topic: react
    once: true
    when: { not_flag: met_heng }
    npc: "อ้าว น้องคนใหม่ หลานยายเพียรใช่ไหม เฮียรู้จักยายน้องดี… ยายน้องเป็นคนเดียวในตำบลที่ไม่เคยติดเฮียสักบาท เฮียเลยไม่รู้จะคุยอะไรกับยาย"
    set_flag: met_heng
    options:
      - text: "สวัสดี{k}เฮีย ยายไม่เคยกู้เลยเหรอ{kq}"
        heart: 1
        reply: "ไม่เคย ซื้อปุ๋ยจ่ายสด ขายข้าวขอชั่งซ้ำทุกกระสอบ เฮียกลัวยายน้องมากกว่ากลัวสรรพากรอีก ฮ่าๆ"
        next:
          - text: "งั้น{p}จะจ่ายสดเหมือนยาย{k}"
            heart: 1
            reply: "เฮียเคารพ… แต่เฮียจะรอวันที่น้องเปลี่ยนใจนะ หน้าฝนคนเปลี่ยนใจกันเยอะ"
          - text: "ชั่งซ้ำ? ตาชั่งเฮียมีปัญหาเหรอ{kq}"
            heart: 0
            reply: "ไม่มีปัญหา แค่มีบุคลิก ตาชั่งก็เหมือนคน วันไหนอารมณ์ดีก็ใจกว้างหน่อย"
      - text: "เฮียคือคนที่ป้าแต๋วบอกให้นับนิ้วใช่ไหม{kq}"
        heart: 0
        reply: "เจ๊แต๋วพูดเหรอ… นับเลยน้อง สิบนิ้วครบ เฮียไม่เคยเอาอะไรที่ไม่ได้จดไว้"
      - text: "แค่เดินผ่าน{k} ไม่มีธุระ"
        heart: 0
        reply: "เดินผ่านแล้วแวะคุยก็ดี การตลาดเริ่มจากเดินผ่าน เดี๋ยวน้องก็กลับมาในฐานะลูกค้า เฮียรอได้"

  - id: heng_r_thana_visit
    topic: react
    once: true
    when: { flag: story_thana_visit }
    npc: "ได้ข่าวว่าคุณธนาไปบ้านน้องเมื่อวาน เสนอล้านสองใช่ไหม เฮียกดเครื่องคิดเลขให้แล้ว… ที่ตรงนั้นมันมากกว่านั้นนะน้อง"
    options:
      - text: "แล้วเฮียว่าเท่าไหร่{kq}"
        heart: 1
        reply: "ราคาดิน ราคาน้ำใต้ดิน ราคาที่ยายนั่งรดน้ำผักมาห้าสิบปี… เครื่องคิดเลขเฮียหลักไม่พอ"
        next:
          - text: "เฮียพูดเหมือนไม่อยากให้{p}ขาย"
            heart: 1
            reply: "เฮียไม่ได้ใจดีนะน้อง ถ้าบริษัทได้ที่ดินครบ ลานเฮียก็โดนกินต่อ เฮียเห็นแก่ตัวแบบมีเหตุผล"
          - text: "งั้นเฮียซื้อเองไหมล่ะ"
            heart: 0
            reply: "ฮ่าๆ เฮียซื้อได้ แต่เฮียจะให้ครึ่งเดียวของคุณธนา ยังอยากขายอยู่ไหมล่ะ"
      - text: "{p}ยังไม่ได้ตัดสินใจ{k}"
        heart: 0
        reply: "ดี อย่ารีบ คนรีบขายคือคนที่โดนกดราคา เฮียรู้ เพราะเฮียเป็นคนกด"

  - id: heng_r_refused
    topic: react
    once: true
    when: { flag: thana_refused }
    npc: "ปฏิเสธคุณธนาเลยเหรอน้อง… เฮียไม่รู้จะว่าน้องโง่หรือกล้า สองอย่างนี้ในตำบลนี้หน้าตาเหมือนกัน"
    options:
      - text: "ที่ของยาย{p}ไม่ขาย{k}"
        heart: 2
        reply: "เหมือนยายเปี๊ยบ ประโยคเดียวกันเลย ยายพูดกับเฮียตอนเฮียขอเช่าที่ทำลานเมื่อยี่สิบปีก่อน"
        next:
          - text: "เฮียก็เคยขอที่ยายเหรอ{kq}"
            heart: 1
            reply: "เคยสิ ยายตอบว่า ‘เอ็งจะเอาไปตากข้าวคนอื่นแล้วหักความชื้นเขาเหรอ’ เฮียจำได้ทุกคำ เจ็บดี"
          - text: "แล้วเฮียโกรธยายไหม{kq}"
            heart: 1
            reply: "โกรธสามวัน แล้วไปซื้อที่เจ้าอื่นแพงกว่าเดิม ยายน้องทำให้เฮียขาดทุนครั้งแรกในชีวิต"
      - text: "บริษัทจะทำอะไร{p}ได้{kq}"
        heart: 0
        reply: "เขาไม่ทำอะไรหรอก เขาแค่รอ ทุนใหญ่ไม่ต้องรีบน้อง ดอกเบี้ยเขาทำงานแทน"

  - id: heng_r_meeting1
    topic: react
    once: true
    when: { flag: story_meeting1 }
    npc: "ประชุมเมื่อวานเห็นไหมน้อง เฮียเสนอถนนลาดยาง กำนันหลับตั้งแต่เฮียพูดคำแรก"
    options:
      - text: "เฮียอยากได้ถนนเพราะรถบรรทุกลานเฮียใช่ไหม{kq}"
        heart: 1
        reply: "ใช่ เฮียพูดตรงๆ กลางศาลาเลย คนอื่นพูดว่า ‘เพื่อพี่น้อง’ เฮียพูดว่า ‘เพื่อรถเฮีย’ เฮียซื่อสัตย์ที่สุดในศาลาแล้ว"
        next:
          - text: "แล้วถนนดีกับชาวบ้านไหม{kq}"
            heart: 1
            reply: "ดีสิ ข้าวมาถึงลานเร็วขึ้น เฮียหักความชื้นได้เร็วขึ้น ทุกคนได้ประโยชน์ในจังหวะที่ต่างกัน"
          - text: "กล้าว่าระบบน้ำสำคัญกว่า{k}"
            heart: 0
            reply: "ไอ้กล้าพูดถูก ไม่มีน้ำก็ไม่มีข้าว ไม่มีข้าวถนนก็มีแต่รถเปล่า… เออ เฮียแพ้ ห้ามไปบอกมัน"
      - text: "นายกพูดตั้งนานไม่ได้อะไรเลย"
        heart: 1
        reply: "เฮียจับเวลา สี่สิบสามนาที ถ้าคิดดอกเบี้ยเวลาของคนทั้งศาลา นายกติดหนี้ตำบลไปหลายแสนแล้ว"

  - id: heng_r_result_road
    topic: react
    once: true
    when: { flag: meeting1_result_road }
    npc: "ถนนชนะ! แต่งบครึ่งนึงไป ‘ศึกษาความเป็นไปได้’ ถนนเลยลาดยางได้ถึงหน้าลานเฮียพอดี… บังเอิญมากเลยน้อง"
    options:
      - text: "บังเอิญจริงเหรอ{kq}เฮีย"
        heart: 1
        reply: "บังเอิญแบบผู้รับเหมาเป็นหลานเมียนายก แล้วซื้อหินคลุกจากเฮีย บังเอิญหลายชั้นหน่อย"
        next:
          - text: "แบบนี้มันไม่ถูกนะ{kq}เฮีย"
            heart: 1
            reply: "ไม่ถูก แต่ราคาถูกกว่าที่อื่นสิบเปอร์เซ็นต์… น้องหน้าบึ้งแบบยายเลย เออๆ เฮียรู้ว่ามันไม่ถูก"
          - text: "เฮียได้ส่วนแบ่งเท่าไหร่{kq}"
            heart: 0
            reply: "เฮียได้ค่าหินตามราคาตลาด ส่วนอย่างอื่นเขาไม่เรียกส่วนแบ่ง เขาเรียกน้ำใจ เฮียไม่รับน้ำใจ… รอบนี้"
      - text: "ศึกษาความเป็นไปได้คืออะไร{kq}"
        heart: 1
        reply: "คือจ้างคนในอำเภอมาบอกว่าถนนเป็นไปได้ ซึ่งเรารู้อยู่แล้วเพราะเดินบนดินทุกวัน ค่าบอกห้าแสน"

  - id: heng_r_result_water
    topic: react
    once: true
    when: { flag: meeting1_result_water }
    npc: "ระบบน้ำชนะ ไอ้กล้าดีใจเลี้ยงน้ำแดงทั้งศาลา เฮียก็ไปกินนะ น้ำแดงฟรีไม่เกี่ยวกับการเมือง"
    options:
      - text: "เฮียไม่เสียใจเหรอ{kq}"
        heart: 1
        reply: "เสียใจครึ่งเดียว อีกครึ่งงบไปศึกษาความเป็นไปได้ ไม่มีใครชนะเต็มๆ สักคน ระบบนี้ยุติธรรมกับทุกคนเท่ากัน คือไม่มีใครได้อะไร"
      - text: "งั้นเฮียขายท่อพีวีซีให้โครงการได้นะ{kq}"
        heart: 1
        reply: "…น้องนี่ เฮียกำลังจะโทรหาผู้รับเหมาพอดี น้องคิดเร็วกว่าเฮียหนึ่งวินาที น่ากลัวนะ"

  - id: heng_r_well_dry
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "ปั๊มบาดาลเฮียขายหมดเกลี้ยงในสามวัน บ่อป้าแต๋วแห้ง บ่อลุงสมหมายแห้ง… เฮียควรดีใจนะน้อง แต่ทำไมเฮียนอนไม่หลับ"
    options:
      - text: "เพราะเฮียรู้ว่าใครดูดน้ำไปใช่ไหม{kq}"
        heart: 2
        reply: "ทุกคนรู้แหละน้อง… คนของบริษัทมาซื้อท่อเหล็กหกนิ้วจากเฮียเดือนก่อน ตอนขายเฮียไม่รู้ว่ามันจะลงไปลึกขนาดนั้น"
        next:
          - text: "เฮียบอกพี่เมย์ได้ไหม{kq}"
            heart: 1
            reply: "บอกได้ แล้วบริษัทก็เลิกซื้อของเฮีย แล้วมาซื้อลานเฮียแทน… ให้เฮียคิดก่อนนะ ไม่ใช่ว่าไม่บอก"
          - text: "เฮียไม่ผิดหรอก แค่ขายท่อ"
            heart: 0
            reply: "ใช่ คนขายมีดไม่ผิด… ประโยคนี้เฮียพูดกับตัวเองมาสามคืนแล้ว ยังไม่ค่อยเชื่อเลย"
      - text: "บ่อ{p}ยังมีน้ำอยู่{k}"
        heart: 0
        reply: "เก็บไว้ดีๆ อีกหน่อยน้ำในบ่อน้องจะแพงกว่าข้าวที่เฮียรับซื้อ เฮียพูดจริง ไม่ใช่สำนวน"

  - id: heng_r_helped_may
    topic: react
    once: true
    when: { flag: helped_may }
    npc: "มีคนไปถ่ายรูปท่อบริษัทตอนกลางคืนกับเมย์ เฮียไม่ถามว่าใครนะ… แต่ขากางเกงน้องมีโคลนติดอยู่"
    options:
      - text: "เฮียจะไปบอกคุณธนาไหม{kq}"
        heart: 1
        reply: "เฮียไม่ได้ทำงานให้คุณธนา เฮียแค่ขายของให้ มันต่างกัน ความลับคือสินทรัพย์ เฮียไม่ขายสินทรัพย์ราคาถูก"
      - text: "{p}แค่ไปเดินเล่น{k}"
        heart: 0
        reply: "เดินเล่นสี่ทุ่มแถวไซต์บาดาล ต้องรักการเดินมาก… ฮ่าๆ ระวังตัวด้วยนะน้อง อันนี้เฮียพูดจริง"

  - id: heng_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ถังน้ำ CSR โลโก้บริษัท ใบละสองร้อยห้าสิบ เฮียเช็กราคาส่งแล้ว… ดูดน้ำไปห้าล้าน คืนมาเป็นถังเปล่า เฮียยังทำธุรกิจเก่งไม่ถึงขั้นนี้"
    options:
      - text: "เฮียอยู่ฝ่ายไหน{kq}"
        heart: 1
        reply: "เฮียอยู่ฝ่ายที่ยังมีลูกค้า ชาวบ้านไม่มีน้ำก็ไม่มีข้าว ไม่มีข้าวก็ไม่มีเฮีย… ปีนี้เฮียคงต้องอยู่ฝ่ายชาวบ้าน แปลกดี"
        next:
          - text: "ดีใจที่ได้ยิน{k}"
            heart: 1
            reply: "อย่าเพิ่งดีใจ เฮียอยู่ฝ่ายชาวบ้านแต่ยังคิดดอกชาวบ้านนะ ความภักดีกับดอกเบี้ยแยกบัญชีกัน"
          - text: "เฮียแค่กลัวโดนกินใช่ไหม{kq}"
            heart: 1
            reply: "ใช่ น้องอ่านเฮียออก ปลาตัวกลางรู้ดีที่สุดว่าปากปลาใหญ่หน้าตาเป็นยังไง"
      - text: "ได้ถังฟรีก็ดีนะ{kq}"
        heart: -1
        reply: "ฟรีที่ไหนน้อง ถังใบนั้นราคาเท่าน้ำในบ่อน้องทั้งปี เขาแค่ไม่ส่งบิลมาเท่านั้นเอง"

  - id: heng_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ป้ายหาเสียงขึ้นเต็มเสาไฟแล้ว เห็นไหมน้อง ป้ายของทั้งสองฝ่าย… พิมพ์ร้านเดียวกัน ร้านที่เฮียถือหุ้น"
    options:
      - text: "เฮียช่วยทั้งสองฝ่ายเลยเหรอ{kq}"
        heart: 1
        reply: "ไม่ได้ช่วย เฮียขายไวนิล ตารางเมตรละร้อยยี่สิบ ใครชนะก็ต้องปลดป้าย ป้ายเก่าเฮียรับซื้อคืนไปคลุมกองปุ๋ย วงจรครบ"
      - text: "เฮียจะลงสมัครเองไหม{kq}"
        heart: 1
        reply: "ไม่ล่ะ ลงสมัครต้องแจกเงิน ไม่ลงสมัครได้ให้คนแจกยืมเงิน อย่างหลังดอกดีกว่า"
        next:
          - text: "ฟังแล้วน่ากลัวนะ{kq}เฮีย"
            heart: 0
            reply: "น่ากลัวเพราะมันจริงน้อง เฮียไม่ได้สร้างระบบ เฮียแค่ยืนตรงที่ระบบมันไหลผ่าน"
          - text: "แล้วถ้า{p}ลงสมัครล่ะ"
            heart: 2
            reply: "…พูดเล่นใช่ไหม ถ้าพูดจริงมาหาเฮียก่อน เฮียไม่ให้กู้หรอก เฮียจะสอนวิธีไม่ต้องกู้"

  - id: heng_r_lottery
    topic: react
    once: true
    when: { flag: bought_lottery }
    npc: "ซื้อสลากพัฒนาตำบลเหรอน้อง ใบละร้อย… รู้ไหม รัฐคือเจ้ามือคนเดียวที่ไม่ต้องหลบดาบเสถียร"
    options:
      - text: "ซื้อเล่นๆ{k}"
        heart: 0
        reply: "เฮียไม่ว่า ถ้าถูกมาคุยเรื่องปิดหนี้ ถ้าไม่ถูกมาคุยเรื่องเปิดหนี้ เฮียรอทั้งสองทาง"
      - text: "เฮียไม่เคยซื้อเลยเหรอ{kq}"
        heart: 1
        reply: "ไม่เคย เจ้ามือไม่ซื้อของเจ้ามือด้วยกัน มันผิดมารยาทวงการ เจ๊หงษ์ก็ไม่ซื้อ ถามดูสิ"

  - id: heng_r_fainted
    topic: react
    when: { fainted_recent: true }
    npc: "ได้ข่าวว่าเมื่อคืนน้องสลบ ตื่นที่ รพ.สต. เงินสดหายไปเท่าไหร่ บอกเฮียมา เฮียช่วยคิด… ไม่ได้ช่วยจ่ายนะ ช่วยคิด"
    options:
      - text: "หายไปนิดหน่อย{k}"
        heart: 0
        reply: "นิดหน่อยของน้องคือกำไรทั้งวันของเฮียบางวันนะ ฝากธนาคารไว้ ดอกน้อยแต่มันไม่สลบตามน้อง"
      - text: "เฮียห่วง{p}เหรอ{kq}"
        heart: 1
        reply: "ห่วงสิ ลูกค้าประจำสลบ ยอดขายเฮียก็สลบ… ห่วงตัวน้องด้วยนิดนึง นิดเดียว อย่าคิดมาก"

  - id: heng_r_end_forgive
    topic: react
    once: true
    when: { flag: heng_end_forgive }
    npc: "ตั้งแต่เฮียประกาศ ‘โปรโมชั่นสามสิบปีลานเฮง’ คนมาหาเฮียเยอะกว่าเดิม ไม่ได้มากู้นะ เอาขนมมาให้ เฮียไม่รู้จะตีราคาความรู้สึกนี้ยังไง"
    options:
      - text: "ไม่ต้องตีราคาก็ได้{k}เฮีย"
        heart: 2
        reply: "ไม่ตีราคาเหรอ… ยากนะน้อง เหมือนให้คนตาบอดเลิกฟังเสียง แต่เฮียจะลองวันละชั่วโมง"
      - text: "ป้าแต๋วบอกทั้งอำเภอแล้วนะ{kq}"
        heart: 1
        reply: "รู้ เมื่อเช้ามีคนจากตำบลข้างๆ มาถามว่าโปรนี้ใช้ข้ามเขตได้ไหม เฮียบอกว่าไม่ได้ ใจอ่อนเฮียมีเขตบริการ"

  - id: heng_r_end_coop
    topic: react
    once: true
    when: { flag: heng_end_coop }
    npc: "ไอ้กล้าย้ายข้าวสหกรณ์เข้าโกดังเฮียแล้ว ทะเลาะกันสามรอบตั้งแต่เช้า เรื่องความชื้นสองรอบ เรื่องเพลงที่เปิดหนึ่งรอบ… เฮียรู้สึกหนุ่มขึ้นนะน้อง"
    options:
      - text: "ใครชนะ{kq}"
        heart: 1
        reply: "ความชื้นมันชนะ เครื่องวัดสหกรณ์ได้สิบสี่ เครื่องเฮียได้สิบเจ็ด เราเลยซื้อเครื่องที่สามมาตัดสิน ได้สิบห้าครึ่ง ทุกคนไม่พอใจเท่ากัน แฟร์ดี"
      - text: "เพลงอะไรเหรอ{kq}"
        heart: 1
        reply: "มันเปิดเพลงเพื่อชีวิต เฮียเปิดเพลงจีน สุดท้ายตกลงเปิดหอกระจายข่าวรอบห้าโมง ไม่มีใครชอบเหมือนกัน"

  - id: heng_r_end_sold
    topic: react
    once: true
    when: { flag: heng_end_sold }
    npc: "เฮียเซ็นแล้วน้อง… ป้ายลานเฮงถูกถอดเมื่อเช้า ตาชั่งดิจิทัลบริษัทไม่ยิ้มให้ใคร เฮียมานั่งดูทุกเช้า เหมือนไปเยี่ยมงานศพตัวเอง แต่รวยนะ"
    options:
      - text: "เฮียเสียใจไหม{kq}"
        heart: 1
        reply: "เสียใจแบบมีเงินในบัญชี มันเป็นความเสียใจที่นั่งสบาย แต่นั่งนานแล้วปวดหลังเหมือนกัน"
      - text: "มาช่วย{p}คิดบัญชีฟาร์มไหม{kq}เฮีย"
        heart: 2
        reply: "จริงเหรอ… เฮียคิดฟรีนะ ครั้งแรกในชีวิตที่เฮียทำอะไรฟรี เพราะไม่มีลานให้หักคืนแล้ว ฮ่าๆ"

  # ===== news =====
  - id: heng_n_kathin
    topic: news
    npc: "ปีนี้กฐินวัดดงเย็นมีซองชื่อผู้สมัครนายกสองซอง แข่งกันว่าซองใครหนากว่า พระอาจารย์ท่านรับไว้แล้วประกาศว่าเอาไปทำห้องน้ำโรงเรียน ทั้งสองฝ่ายต้องปรบมือ"
    options:
      - text: "พระอาจารย์ฉลาดนะ{k}"
        heart: 1
        reply: "ฉลาดที่สุดในตำบล ใครเอาเงินมาหาเสียง ท่านเปลี่ยนเป็นส้วมให้เด็กหมด เฮียเรียนจากท่านเยอะ แต่ใช้ไม่เป็น"
      - text: "เฮียใส่ซองชื่อใคร{kq}"
        heart: 0
        reply: "ชื่อเฮียเอง ใส่ทุกปีเท่าเดิม เฮียไม่ใส่ชื่อนักการเมือง เดี๋ยวบุญไปเข้าบัญชีผิดคน"
        next:
          - text: "เฮียใส่เท่าไหร่{kq}"
            heart: 0
            reply: "ความลับน้อง ถ้าบอก ปีหน้าคนจะเอาไปตั้งเป็นมาตรฐาน แล้วเฮียลดไม่ได้"
          - text: "บุญมีบัญชีด้วยเหรอ{kq}"
            heart: 1
            reply: "เฮียไม่รู้ว่ามีไหม แต่เฮียทำเหมือนมี เผื่อไว้ คนทำบัญชีอย่างเฮียไม่ชอบความเสี่ยงที่จดไม่ได้"

  - id: heng_n_app
    topic: news
    npc: "ข่าวร้ายน้อง แอปเงินด่วนในโทรศัพท์โฆษณาในกลุ่ม LINE หมู่บ้านแล้ว ‘อนุมัติในห้านาที’ ดอกแพงกว่าเฮียสามเท่า แต่หน้าตาน่ารักกว่าเฮีย"
    options:
      - text: "คนจะไปกู้แอปกันเหรอ{kq}"
        heart: 1
        reply: "ไปสิ แอปไม่ต้องมองหน้า ไม่ต้องอาย คนอายน้อยกว่ากู้มากกว่า แล้วพอทวง แอปโทรหาทุกคนในรายชื่อ เฮียยังไม่เคยทำขนาดนั้น"
        next:
          - text: "เฮียก็ทำแอปบ้างสิ{kq}"
            heart: 1
            reply: "เฮียทำแล้ว ชื่อแอปเฮง มีปุ่มเดียว กดแล้วโทรหาเฮีย ไอ้มิวทำให้ เด็กมันคิดค่าทำสามสิบบาท"
          - text: "{p}จะช่วยเตือนคนในกลุ่ม{k}"
            heart: 2
            reply: "ดีน้อง เตือนเยอะๆ บอกว่าถ้าจะกู้ ให้มากู้เจ้าที่มีหน้าให้ด่า… หมายถึงเฮียไง"
      - text: "แข่งขันเสรีไง{kq}เฮีย"
        heart: 0
        reply: "เสรีที่ไหน มันมาจากเมือง ไม่เสียภาษีตำบล ไม่ทำบุญกฐิน ไม่มาช่วยงานศพ แข่งกันแบบนี้เฮียแพ้ทุกครั้ง"

  - id: heng_n_contract
    topic: news
    npc: "คุณธนาเสนอให้เฮียเป็นตัวแทนรับซื้อข้าวโพดสัญญาของบริษัทแล้ว เฮียได้ค่าหัวคิวกิโลละสิบสตางค์ แลกกับชื่อเฮียไปอยู่บนป้าย"
    options:
      - text: "สิบสตางค์คุ้มเหรอ{kq}"
        heart: 1
        reply: "ไม่คุ้ม ถ้าชาวบ้านส่งไม่ครบ บริษัทปรับชาวบ้าน ชาวบ้านมาด่าเฮีย เฮียได้สิบสตางค์กับคำด่าเต็มกระสอบ"
      - text: "เฮียจะรับไหม{kq}"
        heart: 0
        reply: "ยังไม่รู้ ถ้าไม่รับ บริษัทก็หาตัวแทนคนอื่น เขามีเงินพอจ้างคนมาเป็นเฮียได้ทั้งตำบล"
        next:
          - text: "แต่ไม่มีใครเป็นเฮียได้หรอก{k}"
            heart: 2
            reply: "…ประโยคนี้ฟังแล้วเฮียไม่รู้ว่าชมหรือด่า แต่เฮียจะเก็บไว้ในหมวดชม"
          - text: "รับไปเถอะ{k} เงินคือเงิน"
            heart: 0
            reply: "น้องพูดเหมือนเฮียตอนสามสิบ ตอนนี้เฮียห้าสิบห้า เงินยังเป็นเงินอยู่ แต่เฮียเริ่มนับอย่างอื่นด้วยแล้ว"

  - id: heng_n_scale
    topic: news
    npc: "เจ้าหน้าที่ชั่งตวงวัดจะมาตรวจตาชั่งทุกลานวันอังคารนี้ เฮียรู้ตั้งแต่วันศุกร์ที่แล้ว คนรู้ก่อนคือคนเตรียมตัวทัน"
    options:
      - text: "เฮียต้องเตรียมอะไรด้วยเหรอ{kq}"
        heart: 0
        reply: "เตรียมกาแฟ เตรียมที่จอดรถในร่ม เตรียมตาชั่งให้แม่นสักสองวัน… อันหลังเฮียพูดเล่น ส่วนใหญ่"
      - text: "ทำไมรู้ก่อนล่ะ{kq}"
        heart: 1
        reply: "เจ้าหน้าที่เขาโทรมาจองห้องพักกับเฮีย เฮียมีห้องว่างหลังโกดัง ระบบมันเป็นมิตรกันแบบนี้แหละน้อง"

  - id: heng_n_ghost
    topic: news
    when: { flag: story_ghost_rumor }
    npc: "คนงานบริษัทลาออกเพราะผีสามคนแล้ว เฮียเพิ่งรู้ว่าผีต่อรองค่าแรงได้ผลกว่าสหภาพ บริษัทขึ้นค่าแรงกะกลางคืนสองเท่าแล้วนะ"
    options:
      - text: "เฮียเชื่อเรื่องผีไหม{kq}"
        heart: 1
        reply: "เฮียเชื่อเรื่องต้นทุน ผีทำให้ค่าแรงบริษัทขึ้นสองเท่า ถ้าผีทำได้ขนาดนี้ เฮียก็เชื่อผีได้"
      - text: "ยายบัวว่าผีไม่ชอบคนดูดน้ำ{k}"
        heart: 1
        reply: "งั้นเฮียต้องระวัง เฮียขายปั๊มเยอะที่สุดในอำเภอ… คืนนี้เฮียจะเปิดไฟลานทุกดวง แล้วจุดธูปเพิ่มอีกสามดอก"

  # ===== advice =====
  - id: heng_a_good_debt
    topic: advice
    npc: "เฮียสอนฟรีเลยนะน้อง หนี้มีสองแบบ หนี้ที่ทำเงินกลับมา กับหนี้ที่กินเงินไปเฉยๆ กู้ซื้อปุ๋ยคือแบบแรก กู้ซื้อหวยคือแบบหลัง"
    options:
      - text: "แล้วกู้ซื้อโทรศัพท์ใหม่ล่ะ{kq}"
        heart: 1
        reply: "แบบหลัง แต่สวยกว่า เฮียไม่ปล่อยกู้ซื้อโทรศัพท์ ไม่ใช่เพราะเฮียดีนะ เพราะโทรศัพท์ไม่มีเมล็ดให้เก็บเกี่ยว"
      - text: "ทำไมเฮียสอนให้คนกู้น้อยลงล่ะ{kq}"
        heart: 1
        reply: "ลูกหนี้ที่กู้ฉลาดจ่ายคืนได้ ลูกหนี้ที่กู้โง่จ่ายไม่ได้แล้วหนีไประยอง เฮียชอบลูกหนี้ที่อยู่ในตำบลนานๆ"
        next:
          - text: "เฮียคิดยาวจัง{k}"
            heart: 1
            reply: "คนปล่อยกู้ต้องคิดยาวน้อง คนกู้ถึงคิดสั้นได้ ระบบมันแบ่งงานกันแบบนี้"
          - text: "เฮียห่วงลูกหนี้จริงๆ ใช่ไหม{kq}"
            heart: 1
            reply: "เฮียห่วงเงินที่อยู่ในตัวลูกหนี้ ซึ่งบางทีมันแยกจากตัวลูกหนี้ไม่ออก… ช่างเถอะ อย่าถามลึก"
      - text: "{p}ไม่กู้ใครทั้งนั้น{k}"
        heart: 0
        reply: "พูดตอนนี้ง่าย รอฝนทิ้งช่วงสักปีก่อน แล้วค่อยมาพูดประโยคนี้ให้เฮียฟังอีกที"

  - id: heng_a_contract
    topic: advice
    npc: "ถ้าคุณธนามาเสนอทำเกษตรพันธสัญญา อ่านสัญญาให้จบทุกหน้านะน้อง หน้าสุดท้ายตัวเล็กที่สุด แต่แพงที่สุด"
    options:
      - text: "หน้าสุดท้ายเขียนอะไร{kq}"
        heart: 1
        reply: "เขียนว่าตาชั่งบริษัทเป็นที่สิ้นสุด ตาชั่งเขาขาดสามถึงห้าเปอร์เซ็นต์ เฮียรู้เพราะเฮียเอาข้าวโพดเฮียไปชั่งเทียบมาแล้ว"
        next:
          - text: "ตาชั่งเฮียก็ขาดนะ{kq}"
            heart: 1
            reply: "ตาชั่งเฮียขาดแบบมีหน้าเฮียยืนอยู่ ด่าได้ ต่อได้ ตาชั่งบริษัทขาดแบบมีทนายยืนอยู่ ต่างกันเยอะนะน้อง"
          - text: "แล้วเฮียบอก{p}ทำไม{kq}"
            heart: 0
            reply: "เพราะถ้าน้องทำสัญญากับเขาหมด ข้าวโพดน้องก็ไม่มาลานเฮีย คำแนะนำเฮียมีผลประโยชน์ทับซ้อนทุกคำ แต่จริงทุกคำ"
      - text: "เขาให้เมล็ดให้ปุ๋ยฟรีนะ{kq}"
        heart: 0
        reply: "ไม่มีของฟรีในสัญญาน้อง ปุ๋ยที่เขาให้ หักคืนตอนส่งของ แล้วหักแบบไม่มีสมุดให้ดู"

  - id: heng_a_sell_timing
    topic: advice
    when: { time: evening }
    npc: "เย็นแล้ว ฟังหอกระจายข่าวรอบห้าโมงหรือยัง เคล็ดลับเฮียนะ ราคาขึ้นอย่าเพิ่งเทขาย ราคาขึ้นวันแรกทุกคนแห่ขาย วันที่สองราคาลง"
    options:
      - text: "งั้นขายวันที่สามเหรอ{kq}"
        heart: 1
        reply: "วันที่สามคนเหนื่อยแห่แล้ว ราคานิ่ง ขายตอนนั้น… อย่าบอกใครนะ ถ้าทุกคนรู้ วันที่สามจะกลายเป็นวันแรก"
      - text: "เฮียบอกแบบนี้ไม่ขาดทุนเหรอ{kq}"
        heart: 1
        reply: "ขาด แต่ลูกค้าที่ฉลาดอยู่กับเฮียนานกว่าลูกค้าที่โกรธ เฮียลงทุนกับความฉลาดของน้อง ดอกช้าแต่ยาว"

  - id: heng_a_smile
    topic: advice
    npc: "จะต่อราคาใครในตำบลนี้นะน้อง อย่าต่อตอนเขาเหนื่อย ต่อตอนเขาเพิ่งกินข้าวเสร็จ คนอิ่มใจกว้างกว่าคนหิวสามเปอร์เซ็นต์"
    options:
      - text: "ใช้กับเฮียได้ไหม{kq}"
        heart: 1
        reply: "ได้ เฮียกินข้าวเที่ยงครึ่ง แต่เฮียกินไปคิดเลขไป อิ่มแล้วใจก็ยังแคบเท่าเดิม ลองดูก็ได้ ฮ่าๆ"
      - text: "เจ๊หงษ์ต่อไม่ลงเลย{k}"
        heart: 1
        reply: "เจ๊หงษ์ไม่เคยกินข้าวในเวลาที่ใครรู้ เป็นกลยุทธ์ เฮียนับถือเจ๊หงษ์เรื่องนี้ที่สุด"
      - text: "เฮียสอนอะไรก็เรื่องเงินหมดเลย"
        heart: 0
        reply: "ก็เฮียรู้เรื่องเดียวน้อง ถ้าอยากรู้เรื่องใจไปถามพระอาจารย์ ท่านไม่คิดค่าปรึกษา เฮียคิด… ล้อเล่น"

  # ===== smalltalk =====
  - id: heng_s_dog
    topic: smalltalk
    npc: "หมาเฮียชื่อดอกเบี้ย เพิ่งคลอดลูกสี่ตัว เฮียตั้งชื่อว่า ทบต้น ค้างจ่าย ผ่อนผัน กับ ปลดหนี้"
    options:
      - text: "ตัวไหนน่ารักสุด{kq}"
        heart: 1
        reply: "ปลดหนี้ ตัวเล็กสุด ขาวที่สุด ไม่เคยมีใครเห็นมันเดินมาหาเลย มันชอบหลบอยู่ใต้โต๊ะ เหมือนชื่อมันจริงๆ"
        next:
          - text: "{p}ขอเลี้ยงตัวนั้นได้ไหม{kq}"
            heart: 2
            reply: "เอาไปเลย เฮียไม่คิดตังค์… ถ้าคนถามว่าได้มาจากไหน บอกว่าปลดหนี้จากเฮียได้ เฮียอยากได้ยินคนพูดประโยคนี้สักครั้ง"
          - text: "ตั้งชื่อแบบนี้หมาจะเครียดไหม{kq}"
            heart: 1
            reply: "หมาไม่รู้หรอก คนที่เครียดคือลูกค้าที่ได้ยินเฮียเรียก ‘ค้างจ่าย มานี่’ ทุกเช้า"
      - text: "เฮียตั้งชื่อเรื่องเงินหมดเลยนะ{kq}"
        heart: 0
        reply: "ตั้งชื่อเรื่องอื่นเฮียจำไม่ได้ ชื่อเรื่องเงินจำแม่นกว่าวันเกิดลูก"

  - id: heng_s_calc
    topic: smalltalk
    npc: "เครื่องคิดเลขเฮียปุ่มบวกพังอีกแล้ว เครื่องที่สามปีนี้ ปุ่มลบไม่เคยพังเลย น้องว่าแปลกไหม"
    options:
      - text: "เพราะเฮียบวกบ่อยกว่าลบ{k}"
        heart: 1
        reply: "ฉลาด! นี่แหละชีวิตเฮีย สึกตรงที่ใช้บ่อย ส่วนที่ไม่ใช้ก็ใหม่เอี่ยมเหมือนวันแรก เหมือนหัวใจเฮียเลย ฮ่าๆ"
      - text: "ซื้อเครื่องใหม่ที่ร้านพี่ตั้มสิ{kq}"
        heart: 1
        reply: "ซื้อมาแล้ว ร้านตั้มแพงกว่าในอำเภอสามสิบบาท เฮียต่อตั้ม ตั้มบอกว่า ‘ราคาสำนักงานใหญ่ครับ’ หน้าตายมาก เฮียแพ้"

  - id: heng_s_tea
    topic: smalltalk
    when: { time: noon }
    npc: "นั่งก่อนน้อง ชาจีนกาใหม่ เฮียเพิ่งชง กาละสามร้อยห้าสิบ ถ้วยเล็กๆ แบบนี้ถ้วยละยี่สิบเก้าบาทนะ"
    options:
      - text: "งั้น{p}ดื่มช้าๆ ให้คุ้ม{k}"
        heart: 2
        reply: "ฮ่าๆ น้องเข้าใจเรื่องมูลค่า ดื่มช้าๆ ชาก็คุ้ม เวลาก็คุ้ม คุยกับเฮียก็คุ้ม สามต่อเลยนะ"
      - text: "เฮียคิดราคาทุกอย่างเลยเหรอ{kq}"
        heart: 1
        reply: "คิด แต่ไม่ได้เก็บ คิดเฉยๆ มันเป็นนิสัย เหมือนคนบางคนนับก้าวตอนเดิน เฮียนับเงินตอนหายใจ"
        next:
          - text: "เหนื่อยไหม{kq}เฮีย"
            heart: 2
            reply: "…ไม่มีใครเคยถามเฮียแบบนี้นะน้อง เหนื่อยสิ แต่ถ้าหยุดนับ เฮียกลัวจะได้ยินเสียงอื่นในหัว"
          - text: "นับให้{p}ฟังหน่อย"
            heart: 1
            reply: "น้องนั่งมาสิบนาที เฮียเสียค่าเสียโอกาสไปสามลูกค้า แต่ได้คนฟังเฮียบ่นหนึ่งคน เท่ากันพอดี"
      - text: "ไม่ดื่มดีกว่า{k}"
        heart: 0
        reply: "ไม่ดื่มก็ได้ ชาไม่ว่าอะไร เฮียดื่มเอง กำไรเฮียยี่สิบเก้าบาท"

  - id: heng_s_rain
    topic: smalltalk
    when: { rain: true }
    npc: "ฝนตกแบบนี้เฮียนั่งดูลานว่างๆ ได้ทั้งวัน ข้าวไม่มา คนไม่มา มีแต่ดอกเบี้ยที่เดินต่อเงียบๆ เพลงฝนกับเพลงดอกเบี้ยจังหวะเดียวกันนะน้อง"
    options:
      - text: "เฮียพูดเป็นกวีเลย{k}"
        heart: 1
        reply: "สมัยหนุ่มเฮียเขียนกลอนส่งนิตยสาร ไม่เคยได้ลง เฮียเลยเปลี่ยนมาเขียนสัญญาเงินกู้ ได้ลงลายมือชื่อทุกฉบับ"
      - text: "ฝนตกเฮียได้หักความชื้นเยอะใช่ไหม{kq}"
        heart: 0
        reply: "หักเยอะแต่ข้าวมาน้อย สุดท้ายเท่าเดิม ฟ้าเขาก็คิดบัญชีเป็นนะน้อง"

  - id: heng_s_calendar
    topic: smalltalk
    npc: "ปฏิทินร้านเฮียปีหน้าออกแบบเสร็จแล้ว หน้าปกเป็นรูปเฮียยืนหน้าลานยิ้มกว้างๆ ตารางดอกเบี้ยอยู่ด้านหลัง ป้าแต๋วบอกว่าน่ากลัวกว่าปฏิทินผี"
    options:
      - text: "ขอ{p}หนึ่งฉบับ{k}"
        heart: 1
        reply: "ได้ คนแรกที่ขอโดยไม่ได้ติดหนี้เฮีย เฮียจะเขียนลายเซ็นให้ด้วย มูลค่าเพิ่มขึ้นห้าบาท"
      - text: "เปลี่ยนรูปหน้าปกเป็นหมาเฮียดีกว่า{k}"
        heart: 1
        reply: "หมาเฮียหน้าน่ารักกว่าเฮียก็จริง แต่หมาเฮียไม่ใช่คนเซ็นสัญญา คนต้องจำหน้าคนเซ็นนะน้อง"
      - text: "ป้าแต๋วพูดถูก{k}"
        heart: 0
        reply: "เจ๊แต๋วพูดถูกทุกเรื่องที่เกี่ยวกับเฮีย นั่นแหละปัญหา"

  # ===== self =====
  - id: heng_f_jok
    topic: self
    npc: "รู้ไหมน้อง ร้านโจ๊กหน้าตลาดที่ตอนนี้เป็นแผงเจ๊หงษ์ เดิมเป็นแผงแม่เฮีย เฮียตื่นตีสี่ล้างถ้วยก่อนไปโรงเรียนทุกวัน"
    options:
      - text: "แม่เฮียยังอยู่ไหม{kq}"
        heart: 1
        reply: "อยู่ อายุแปดสิบเจ็ด ยังด่าเฮียทุกเช้าว่าใส่ขิงในโจ๊กน้อยไป เฮียไม่ได้ทำโจ๊กมาสี่สิบปีแล้ว แต่แม่ยังด่าเหมือนเดิม"
        next:
          - text: "น่ารักดี{k}"
            heart: 1
            reply: "น่ารักตอนน้องฟัง ตอนเฮียโดนไม่น่ารัก… แต่ถ้าวันไหนแม่ไม่ด่า เฮียคงนอนไม่หลับ"
          - text: "เฮียยังทำโจ๊กเป็นไหม{kq}"
            heart: 1
            reply: "เป็น แต่ไม่ทำ ถ้าทำแล้วอร่อย เฮียกลัวจะอยากกลับไปขายโจ๊ก ชีวิตง่ายกว่านี้เยอะ"
      - text: "เฮียเลยรวยเพราะขยันใช่ไหม{kq}"
        heart: 0
        reply: "ขยันก็ส่วนนึง อีกส่วนคือรู้ว่าใครต้องการเงินตอนไหน คนขยันในตำบลนี้มีเยอะ แต่คนที่รู้จังหวะมีไม่กี่คน"

  - id: heng_f_m3
    topic: self
    npc: "เฮียจบ ม.3 นะน้อง ครูประจำชั้นบอกว่าเฮียไม่มีอนาคต วันนี้ครูคนนั้นยังมาเชื่อปุ๋ยเฮียอยู่เลย"
    options:
      - text: "เฮียแก้แค้นครูเหรอ{kq}"
        heart: 0
        reply: "เปล่า เฮียคิดดอกครูถูกที่สุดในตำบล ครูไม่รู้หรอก เฮียอยากให้ครูรู้ว่าคนไม่มีอนาคตก็ใจดีเป็น… แต่ไม่บอก"
      - text: "เรียนน้อยแต่คิดเลขเก่งกว่าคนเรียนเยอะ{k}"
        heart: 1
        reply: "คิดเลขเก่งไม่ได้แปลว่าฉลาดนะน้อง เฮียคิดเลขเร็ว แต่เรื่องบางเรื่องคิดมาสามสิบปีไม่จบ"

  - id: heng_f_father
