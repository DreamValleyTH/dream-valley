  - id: heng_o_sathian
    topic: others
    npc: "ดาบเสถียรมาตรวจความเรียบร้อยลานเฮียทุกเย็น ตรวจเสร็จกินกาแฟ กินเสร็จหลับบนเก้าอี้ผ้าใบ เฮียคิดเป็นค่าประกันภัยเดือนละสามพัน คุ้มนะ"
    options:
