      - text: "เฮียลองบอกเขาว่าคิดถึงดูสิ{kq}"
        heart: 2
        reply: "คิดถึง… เฮียพิมพ์แล้วลบไปสามรอบ สุดท้ายส่งไปว่า ‘ค่าเทอมโอนแล้ว’ มันน่าจะเข้าใจนะ ใช่ไหมน้อง"
        next:
          - text: "ไม่เข้าใจหรอก{k}เฮีย"
            heart: 2
            reply: "…ไม่เข้าใจเหรอ งั้นคืนนี้เฮียจะส่งหมีกลับไปตัวนึง ตัวที่กอดหัวใจ เฮียเห็นในร้านค้าสติกเกอร์ ราคาสามสิบบาท คุ้มไหม"
          - text: "เขาเข้าใจ{k} พ่อลูกกัน"
            heart: 1
            reply: "หวังว่างั้น พ่อเฮียก็ไม่เคยพูด เฮียก็เข้าใจ… เข้าใจตอนพ่อตายไปแล้วสิบปี"
      - text: "ลูกเฮียคงรวยแล้วไม่ต้องคุยกับพ่อ"
        heart: -1
        reply: "รวยด้วยเงินเฮียนะน้อง… พูดแบบนี้เจ็บนะ ดอกเพิ่มครึ่งเปอร์เซ็นต์ ไม่ได้ล้อเล่น"

  - id: heng_f_ledger
    topic: self
    when: { heart_min: 7 }
    npc: "น้อง เฮียไว้ใจน้องแล้วนะ เฮียจะบอกตัวเลขหนึ่งตัว สี่แสนสองหมื่น คือหนี้ที่เฮียขีดฆ่าทิ้งไปในสามสิบปี ไม่มีใครรู้ แม้แต่เมียเฮีย"
    options:
      - text: "ทำไมเฮียไม่ให้ใครรู้{kq}"
        heart: 2
        reply: "ถ้ารู้ คนจะเลิกจ่าย ถ้าคนเลิกจ่าย เฮียก็ไม่มีเงินให้คนที่เดือดร้อนจริงยืม ใจอ่อนต้องมีหน้าโหดคุ้มกันนะน้อง"
        next:
          - text: "หน้าโหดเฮียก็ไม่ได้โหดขนาดนั้น{k}"
            heart: 2
            reply: "ชู่ว เบาๆ น้อง ทั้งตำบลเชื่อว่าโหด อย่าทำลายแบรนด์เฮีย แบรนด์นี้สร้างมาสามสิบปี"
          - text: "{p}จะไม่บอกใคร{k}"
            heart: 2
            reply: "เฮียรู้ ถ้าน้องเป็นคนเล่าเยอะ เฮียคงไม่เล่า เฮียคิดดอกมาทั้งชีวิต รู้ว่าใครถือของมีค่าได้"
      - text: "สี่แสนกว่าเฮียเสียดายไหม{kq}"
        heart: 1
        reply: "เสียดายทุกบาท แต่เสียดายแบบคนที่ซื้อของแพงแล้วใช้ทุกวัน ไม่ได้เสียดายแบบคนโดนโกง"

