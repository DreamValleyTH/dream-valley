        heart: 1
        reply: "ดาบหลับแต่ชุดตำรวจไม่หลับ ขโมยเห็นชุดก็ไม่เข้า เฮียซื้อชุด ไม่ได้ซื้อดาบ"
      - text: "แบบนี้เรียกว่าส่วยหรือเปล่า{kq}"
        heart: 0
        reply: "เฮียเรียกว่ากาแฟ น้องเรียกอะไรก็ได้ แต่อย่าเรียกดังๆ ดาบตื่นแล้วไม่ยอมหลับต่อ"

  - id: heng_o_wichai
    topic: others
    npc: "นายกวิชัยมาเชื่อปุ๋ยเฮียตั้งแต่ก่อนเป็นนายก ตอนนี้เป็นนายกแล้วยังเชื่ออยู่ แต่เปลี่ยนจากเชื่อปุ๋ยเป็นเชื่อใจ ชำระคืนเป็นโครงการ"
    options:
      - text: "ชำระคืนเป็นโครงการยังไง{kq}"
        heart: 1
        reply: "ถนนหน้าลานเฮียซ่อมทุกปีก่อนเลือกตั้ง ปีละรอบ เฮียไม่ได้ขอนะ เขาซ่อมให้เอง ความเกรงใจมันเดินทางเป็นยางมะตอย"
        next:
          - text: "ไม่ผิดกฎหมายเหรอ{kq}"
            heart: 0
            reply: "ผิดตรงไหนน้อง ถนนซ่อมจริง ใช้จริง แค่มันพังตรงเดิมทุกปีพอดี ผู้รับเหมาเขาเผื่องานปีหน้าไว้"
          - text: "เฮียไม่เบื่อเหรอ{kq}"
            heart: 1
            reply: "เบื่อ แต่ถ้าเฮียหยุด ถนนก็ไปซ่อมหน้าบ้านคนอื่น เฮียไม่ได้ดีกว่าใคร เฮียแค่อยู่ในคิวหน้า"
      - text: "เฮียสนับสนุนนายกเหรอ{kq}"
        heart: 0
        reply: "เฮียสนับสนุนทุกคนที่มีโอกาสชนะ แล้วก็สนับสนุนคนที่ไม่มีโอกาสนิดหน่อย เผื่อปาฏิหาริย์ ประกันความเสี่ยง"

  - id: heng_o_taew
    topic: others
    npc: "เจ๊แต๋วให้เชื่อดอกเดือนละบาท เฮียคิดแล้วนะ ถ้าเจ๊แต๋วเป็นธนาคาร เจ๊แต๋วจะเป็นธนาคารที่เจ๊งแล้วยังมีความสุขที่สุดในโลก"
    options:
      - text: "เฮียอิจฉาป้าแต๋วเหรอ{kq}"
        heart: 1
        reply: "อิจฉาตรงที่คนรักเจ๊ แต่ไม่อิจฉาบัญชีเจ๊ ถ้าเลือกได้เฮียขอทั้งสองอย่าง แต่โลกมันไม่ให้ใครครบ"
      - text: "ป้าแต๋วก็นินทาเฮียบ่อยนะ{k}"
        heart: 0
        reply: "รู้ เจ๊นินทาเฮียแล้วคนก็มาที่ร้านเฮียมากขึ้น ข่าวลือคือโฆษณาฟรี เจ๊แต๋วเป็นฝ่ายการตลาดเฮียโดยไม่รู้ตัว"

quests:
  - id: heng_q1
    npc: heng
    title: "สมุดปกแดงหาย"
    desc: "เสี่ยเฮงทำสมุดเล่มเล็กหาย ขอให้ช่วยตามหาแบบเงียบๆ"
    start: { heart_min: 2, day_min: 4 }
    offer:
      npc: "น้อง… มานี่แป๊บ พูดเบาๆ นะ เฮียทำสมุดหายเล่มนึง เล่มเล็กปกแดง ไม่ใช่สมุดหนี้นะ… คือเป็นสมุดหนี้ แต่อีกแบบ ช่วยเฮียหาหน่อย"
      options:
        - text: "ได้{k}เฮีย หายที่ไหน{kq}"
          accept: true
          heart: 1
          reply: "ถ้ารู้ว่าหายที่ไหนก็ไม่เรียกว่าหายสิน้อง… เมื่อวานเฮียไปร้าน 24 ชม. ซื้อเครื่องคิดเลขสำรอง ลองถามตั้มก่อน"
        - text: "สมุดอะไร ทำไมต้องพูดเบา{kq}"
          accept: true
          heart: 0
          reply: "ถ้าบอกก็ต้องพูดเบากว่านี้อีก หาก่อน เจอแล้วเฮียเล่า… บางส่วน"
        - text: "เฮียจ้างคนหาเองสิ{k}"
          heart: -1
          reply: "จ้างคนหาก็มีคนรู้ว่าเฮียทำอะไรหาย ไม่เป็นไร เฮียหาเอง"
    steps:
      - goal: { type: talk, npc: tam }
        hint: "ไปถามตั้มที่ร้าน 24 ชม. (16:00–24:00) ว่าเห็นสมุดปกแดงของเสี่ยไหม"
        done:
          npc: "สมุดปกแดงของเสี่ยเฮงเหรอครับ ผมเก็บไว้ในล็อกเกอร์ ไม่ได้เปิดอ่านครับ มันตกแล้วเปิดเอง หน้าที่เปิดมีชื่อแม่ผมอยู่… ฝากคืนเสี่ยด้วยครับ บอกว่าผมไม่เห็นอะไร"
          options:
            - text: "ชื่อแม่พี่ตั้มอยู่ในนั้นเหรอ{kq}"
              heart: 1
              set_flag: heng_q1_tam_mom
              reply: "ครับ ขีดฆ่าด้วยปากกาแดง ข้างๆ เขียนว่า ‘ไม่ต้องทวง’ ลงวันที่สองปีก่อน ผมจ่ายดอกให้เสี่ยมาสองปีโดยไม่รู้ว่าเงินต้นไม่มีแล้ว ผมไม่รู้จะรู้สึกยังไงครับ"
              next:
                - text: "เดี๋ยว{p}ถามเฮียให้{k}"
                  heart: 1
                  reply: "ครับ ถามเบาๆ นะครับ ผมว่าเสี่ยอายมากกว่าผมอีก"
                - text: "ดีแล้วนี่{kq} ไม่ต้องจ่ายแล้ว"
                  heart: 0
                  reply: "ดีครับ แต่ผมจ่ายดอกของหนี้ที่ไม่มีอยู่ไปสองปี ผมว่าเศรษฐศาสตร์ยังไม่มีหน่วยนับเรื่องนี้"
            - text: "ขอบคุณ{k} {p}เอาไปคืนเลย"
              heart: 0
              reply: "ครับ ใส่ถุงให้แล้ว ถุงละสองบาท… ล้อเล่นครับ ฟรี สำหรับสมุดที่หนักขนาดนี้"
      - goal: { type: visit, place: heng_shop, from: "17:00", to: "18:30" }
        hint: "เอาสมุดไปคืนเสี่ยเฮงตอนลานปิด (17:00–18:30) ตอนไม่มีลูกค้า"
        done:
          npc: "เจอแล้ว! …น้องเปิดอ่านหรือเปล่า บอกเฮียตรงๆ เฮียไม่โกรธ เฮียแค่ต้องรู้ว่าต้องปิดปากใครบ้าง"
          options:
            - text: "อ่านนิดเดียว{k} เฮียไม่ทวงหลายบ้านเลยนี่"
              heart: 1
              set_flag: heng_q1_read
              reply: "เฮียไม่ได้ยกนะ เฮียแค่… ไม่ทวง มันต่างกัน ยกคือใจดี ไม่ทวงคือขี้เกียจ เฮียขี้เกียจหลายบ้าน"
              next:
                - text: "แม่พี่ตั้มยังจ่ายดอกให้เฮียอยู่นะ{k}"
                  heart: 1
                  reply: "…เฮียลืมบอกเขา ไม่ใช่ ไม่กล้าบอก เดี๋ยวเฮียคืนดอกแบบเนียนๆ ซื้อกาแฟร้านตั้มทุกวันไปสองปี ตั้มจะได้ยอดขายด้วย"
                - text: "ความลับนี้{p}เก็บให้{k}"
                  heart: 2
                  reply: "ดีมาก ความลับนี้มูลค่าสูงกว่าลานเฮียนะน้อง ถ้าคนรู้ว่าเฮียใจอ่อน ดอกเบี้ยทั้งตำบลจะถล่ม"
            - text: "ไม่ได้อ่าน{k} ไม่ยุ่งเรื่องคนอื่น"
              heart: 1
              reply: "โกหกเก่งนะน้อง หน้าเหมือนคนเพิ่งอ่านจบ… แต่เฮียซื้อคำโกหกนี้ ราคาดี"
    reward: { money: 300, heart: 1, items: { chinese_tea: 1 }, set_flag: heng_q1_done, line: { from: heng, text: "📢 ลานเฮงเปิดถึงหกโมงเย็นทุกวัน ข้าวชื้นไม่ชื้นมาคุยกันได้ ใครเก็บของหายได้ให้รางวัลงาม (เฮียไม่ได้ทำอะไรหายนะ แค่บอกไว้เฉยๆ)" } }

  - id: heng_q2
    npc: heng
    title: "ซองสีขาวพร้อมใบเสร็จ"
    desc: "เอาซองเงินบริจาคของเสี่ยเฮงไปส่งนายกฯ ที่ อบต. — แบบมีใบเสร็จ"
    start: { flag: heng_q1_done, heart_min: 3, day_min: 8 }
    offer:
      npc: "น้อง ช่วยเฮียหน่อย นายกมาขอ ‘ทุนสนับสนุนประชาคม’ จากเฮีย เฮียเตรียมซองไว้แล้ว พร้อมใบเสร็จ ช่วยเอาไปส่งที่ อบต. ที เฮียไปเองคนจะถ่ายรูปลงกลุ่มว่าเฮียซื้อนายก"
      options:
        - text: "ในซองมีอะไร{kq}เฮีย"
          accept: true
          heart: 0
          reply: "ค่าน้ำแดงกับขนมประชุมประชาคมสองพัน มีใบเสร็จแนบ เฮียไม่ได้โง่ขนาดส่งซองดำผ่านเด็กใหม่หรอก… อันนี้เฮียอยากทดสอบอะไรบางอย่าง"
        - text: "ได้{k} {p}ไปส่งให้"
          accept: true
          heart: 1
          reply: "ดีน้อง ส่งให้ถึงมือนายก แล้วสังเกตหน้าเขาตอนเห็นใบเสร็จ หน้านั้นเฮียอยากรู้มากกว่าเงินอีก"
        - text: "เฮียส่งเองเถอะ{k}"
          heart: 0
          reply: "ก็ได้ เฮียไปเอง พรุ่งนี้น้องจะเห็นรูปเฮียในกลุ่ม LINE พร้อมคำว่า ‘เจ้าสัวซื้อตำบล’ คุ้นๆ ไหม"
    steps:
      - goal: { type: talk, npc: wichai }
        hint: "เอาซองไปส่งนายกฯ วิชัยที่ อบต. (09:00–16:00)"
        done:
          npc: "อ้อ ซองจากเสี่ยเฮง ขอบคุณมากครับ เรื่องนี้เรารับทราบแล้ว… แต่ใบเสร็จนี่ ไม่ต้องก็ได้มั้งครับ ไม่มีใบเสร็จมันยืดหยุ่นกว่า ฝากบอกเสี่ยด้วยนะครับ"
          options:
            - text: "ใบเสร็จต้องมี{k} เฮียกำชับไว้"
              heart: 1
              set_flag: heng_q2_receipt
              reply: "ครับๆ มีก็มี เราโปร่งใส เราโปร่งใสมาตลอด และจะโปร่งใสต่อไปเรื่อยๆ ครับ… เซ็นตรงไหนนะครับ"
            - text: "เดี๋ยว{p}ไปบอกเฮียให้{k}"
              heart: 0
              reply: "ขอบคุณครับ คนรุ่นใหม่เข้าใจระบบเร็วดี ระบบเราต้องการคนแบบนี้… หมายถึงคนที่เข้าใจนะครับ"
      - goal: { type: talk, npc: may }
        hint: "เมย์เห็นคุณเดินออกจาก อบต. — ไปคุยกับเมย์ที่ร้านกาแฟ"
        done:
          npc: "เห็นนะว่าเดินออกจาก อบต. พร้อมซองว่างๆ ของใครคะ ไม่ต้องบอกก็ได้ หนูเดาได้ แต่อยากได้ยินจากปากคน"
          options:
            - text: "ซองค่าน้ำแดงประชุม มีใบเสร็จ{k}"
              heart: 1
              reply: "มีใบเสร็จ… ในตำบลนี้ประโยคนี้เป็นข่าวได้เลยนะคะ หนูจะจดไว้ว่าเสี่ยเฮงทำอะไรถูกระเบียบหนึ่งครั้ง"
            - text: "ไม่เกี่ยวกับพี่เมย์{k}"
              heart: -1
              reply: "ไม่เกี่ยวค่ะ จนกว่าจะเกี่ยว หนูรอได้ หนูรอเก่ง"
      - goal: { type: talk, npc: heng }
        hint: "กลับไปเล่าให้เสี่ยเฮงฟัง"
        done:
          npc: "นายกว่าไงบ้าง… ไม่ต้องบอก เฮียเดาได้ อยากได้แบบไม่มีใบเสร็จใช่ไหม หน้าเขาตอนนั้นเป็นยังไงน้อง"
          options:
            - text: "ใช่{k} แต่{p}ยืนยันให้เซ็นใบเสร็จ"
              heart: 2
              set_flag: heng_q2_clean
              reply: "ฮ่าๆ น้องนี่! เฮียตั้งใจทดสอบนายก กลายเป็นทดสอบน้องแทน… ผ่านนะ ผ่านแบบยายเพียรเลย"
            - text: "ให้แบบไม่มีใบเสร็จก็ได้ ใครๆ ก็ทำ"
              heart: -1
              set_flag: heng_q2_dirty
              reply: "ใครๆ ก็ทำ… ใช่ เฮียก็เคยทำ แต่ปีนี้เฮียอยากรู้ว่าไม่ทำแล้วรู้สึกยังไง น้องทำให้เฮียไม่ได้รู้เลย"
            - text: "เฮียเลิกให้ทุกฝ่ายเลยดีไหม{kq}"
              heart: 1
              reply: "เลิกให้ก็เป็นคนรวยไม่มีเพื่อน ปีหน้าถนนจะลาดยางหลบหน้าลานเฮีย… แต่ก็น่าลองนะ ขอเฮียคิดก่อน"
    reward: { money: 200, heart: 1, set_flag: heng_q2_done, line: { from: heng, text: "ขอบคุณ อบต. ที่รับเงินบริจาคค่าน้ำแดงประชุมประชาคม 2,000 บาท ใบเสร็จเลขที่ 0047 🙏 (ประกาศเพื่อความโปร่งใส ไม่ได้ประชดใคร)" } }

  - id: heng_q3
    npc: heng
    title: "ลูกเฮียเรียนเมืองนอก"
    desc: "ลูกชายเสี่ยเฮงโอนค่าเทอมคืน — เขาไม่ได้เรียนมาปีนึงแล้ว"
    start: { flag: heng_q2_done, heart_min: 5, day_min: 12 }
    offer:
      npc: "น้อง… เฮียถามหน่อย น้องเคยโกหกพ่อแม่ไหม เรื่องงาน เรื่องเรียน อะไรแบบนั้น"
      options:
        - text: "เคย{k} บอกว่าสบายดีตอนหมดไฟ"
          accept: true
          heart: 2
          reply: "งั้นน้องเข้าใจ… ลูกเฮียไม่ได้เรียนแล้ว ดรอปมาปีนึง ไปทำงานครัวร้านอาหารไทยที่โน่น ค่าเทอมที่เฮียส่ง มันไม่ได้ใช้ เพิ่งโอนคืนมาทั้งก้อน เฮียไม่รู้จะทำหน้ายังไง"
        - text: "ทำไมถาม{kq}เฮีย"
          accept: true
          heart: 0
          reply: "ลูกเฮียโอนเงินคืนมาทั้งก้อน บอกว่าไม่ได้เรียนมาปีนึงแล้ว ไปทำครัว เฮียโกรธ แต่ก็… ช่วยเฮียคิดหน่อย เรื่องนี้เครื่องคิดเลขกดไม่ได้"
        - text: "ไม่เคย{k}"
          heart: 0
          reply: "ไม่เคยเลย… เฮียอิจฉาพ่อแม่น้องนะ ไม่เป็นไร ไว้วันหลังเฮียค่อยถาม"
    steps:
      - goal: { type: talk, npc: noi }
        hint: "ไปถามพี่หน่อยร้านก๋วยเตี๋ยวว่างานครัวเป็นอาชีพจริงจังได้ไหม"
        done:
          npc: "ลูกเสี่ยเฮงใช่ไหม พี่ได้ยินจากป้าแต๋วแล้วจ้ะ ทั้งตำบลรู้หมดแล้ว ยกเว้นเสี่ยที่คิดว่ายังเป็นความลับ… ฝากบอกเสี่ยนะ ครัวไม่ใช่ที่ที่คนหนีมา มันคือที่ที่คนมีวินัยที่สุดอยู่กัน พี่ยืนหน้าหม้อมาสิบห้าปี ไม่เคยดรอปสักวัน"
          options:
            - text: "พี่หน่อยว่าเขาจะไปรอดไหม{kq}"
              heart: 1
              reply: "คนที่กล้าโอนเงินคืนพ่อ กล้าพอจะทำอะไรก็รอด คนที่โกหกแล้วใช้เงินพ่อต่อต่างหากที่ไม่รอด"
            - text: "ป้าแต๋วรู้ได้ไงอีกแล้ว{kq}"
              heart: 1
              reply: "เสี่ยไปยืนบ่นหน้าตู้ ATM เสียงดัง ป้าแต๋วต่อคิวอยู่ข้างหลังพอดี แค่นั้นแหละจ้ะ"
      - goal: { type: give, npc: heng, item: khao_tom_pla, n: 1 }
        hint: "เอาข้าวต้มปลาจากร้านพี่หน่อยไปให้เสี่ยเฮง เขาไม่ได้กินอะไรตั้งแต่เมื่อวาน"
        done:
          npc: "ข้าวต้มปลา… ร้านหน่อยใช่ไหม แม่เฮียเคยขายโจ๊ก เฮียล้างถ้วยจนนิ้วเปื่อย เฮียสาบานว่าลูกเฮียจะไม่ต้องล้างถ้วยใคร… แล้วมันก็ไปยืนหน้าเตาที่เมืองนอก ฮ่าๆ เฮียหัวเราะได้แล้วนะ ดีขึ้นแล้ว"
          options:
            - text: "เขาไม่ได้ล้างถ้วย{k} เขาทำอาหาร"
              heart: 2
              reply: "…ใช่ ล้างถ้วยกับทำอาหารมันต่างกัน เฮียพูดผิด ต้นทุนต่าง กำไรก็ต่าง เฮียควรรู้ดีที่สุด"
            - text: "กินก่อน{k}เฮีย แล้วค่อยคิด"
              heart: 1
              reply: "เออ กินก่อน… อร่อยนะ ร้านหน่อยไม่ขึ้นราคามาห้าปี เฮียไม่เข้าใจว่าเขาอยู่รอดได้ยังไง"
      - goal: { type: days, n: 2 }
        hint: "รอ 2 วันให้เสี่ยเฮงตัดสินใจเรื่องลูก แล้วกลับไปหา"
        done:
          npc: "เฮียคิดสองวันแล้ว มีสามทาง เรียกมันกลับมาเรียนต่อ ส่งเงินให้มันเปิดร้านเอง หรือ… เฮียไม่รู้ น้องว่าไง"
          options:
            - text: "ส่งเงินให้เขาเปิดร้าน{k} ถือว่าลงทุน"
              heart: 2
              set_flag: heng_q3_invest
              reply: "ลงทุนกับลูก… ดอกเบี้ยศูนย์ คืนทุนไม่รู้เมื่อไหร่ ความเสี่ยงสูง ผิดหลักเฮียทุกข้อ… เฮียจะทำ"
            - text: "ให้เขากลับมาเรียนให้จบ{k}"
              heart: 0
              set_flag: heng_q3_school
              reply: "เฮียก็คิดแบบนั้น… แต่ถ้ากลับมาแล้วไม่มีความสุข เฮียก็แค่ซื้อปริญญาให้คนที่ไม่อยากได้ เหมือนใส่ปุ๋ยในนาที่ไม่ได้ปลูกอะไร"
            - text: "แค่โทรไปบอกว่าภูมิใจ{k} ที่เหลือให้เขาเลือก"
              heart: 2
              set_flag: heng_q3_call
              reply: "ภูมิใจ… คำนี้เฮียไม่เคยพูดกับใคร พ่อเฮียก็ไม่เคยพูดกับเฮีย คืนนี้เฮียจะลอง ถ้าเสียงสั่นน้องห้ามล้อนะ"
    sold_at: { khao_tom_pla: noi_noodle }
    reward: { money: 300, heart: 2, set_flag: heng_q3_done, line: { from: heng, text: "ใครรู้บ้างว่าร้านอาหารไทยที่เมืองนอกขายผัดกะเพราจานละเท่าไหร่ สอบถามเพื่อศึกษาตลาดเฉยๆ 🧮" } }

  - id: heng_q4
    npc: heng
    title: "ลานเฮงสามสิบปี"
    desc: "คุณธนาเสนอซื้อลานของเสี่ยเฮง — ช่วยเขาฟังทุกฝ่ายก่อนตัดสินใจ"
    start: { flag: heng_q3_done, heart_min: 7, day_min: 20 }
    offer:
      npc: "น้อง คุณธนาเสนอซื้อลานเฮียแล้ว ราคาพอเปิดร้านทองในอำเภอได้สองร้าน เฮียมีเวลาตอบเจ็ดวัน ไปฟังทุกฝ่ายแทนเฮียที เฮียฟังเองได้ยินแต่ตัวเลข"
      options:
        - text: "ได้{k}เฮีย {p}ไปฟังให้"
          accept: true
          heart: 2
          reply: "ไปคุยกับคุณธนา แล้วไปคุยกับ… ไอ้กล้า เฮียพูดชื่อมันแล้วเจ็บคอ แต่ต้องฟังมันด้วย"
        - text: "เฮียอยากขายเหรอ{kq}"
          accept: true
          heart: 1
          reply: "อยากครึ่งนึง ไม่อยากครึ่งนึง เฮียเลยอยากได้เสียงที่สามที่ไม่ใช่เครื่องคิดเลข"
        - text: "เรื่องของเฮีย{k} {p}ไม่ยุ่ง"
          heart: -1
          reply: "ก็จริง เรื่องของเฮีย… เฮียแค่นึกว่าเรามาถึงตรงที่น้องจะยุ่งเรื่องเฮียได้แล้ว ไม่เป็นไร"
    steps:
      - goal: { type: talk, npc: thana }
        hint: "ไปฟังข้อเสนอของคุณธนาที่ออฟฟิศบริษัทท้ายตลาด"
        done:
          npc: "เสี่ยเฮงส่งคุณมาเหรอครับ ดีครับ บริษัทมองเสี่ยเป็นพาร์ตเนอร์ เราจะช่วยดูแลลานแบบทันสมัย ตาชั่งดิจิทัลเชื่อมระบบกลาง ไม่ต้องใช้ดุลยพินิจของคนอีกต่อไปครับ"
          options:
            - text: "แล้วชาวบ้านจะขายได้ราคาเท่าไหร่{kq}"
              heart: 0
              reply: "ราคาตามระบบครับ ระบบไม่มีอารมณ์ ไม่ใจอ่อน ไม่มีหนี้ที่ไม่ทวง… ทำไมคุณทำหน้าแบบนั้นครับ"
            - text: "ทำไมบริษัทอยากได้ลานเล็กๆ{kq}"
              heart: 0
              reply: "เพราะลานเล็กๆ คือที่ที่ชาวบ้านไว้ใจครับ เราซื้อความไว้ใจที่เสี่ยสร้างมาสามสิบปี ในราคายุติธรรม"
      - goal: { type: talk, npc: kla }
        hint: "ไปฟังกล้าที่สวนผักสหกรณ์"
        done:
          npc: "เฮียส่งมาถามผมเหรอ… บอกเฮียว่าถ้าไม่ขาย สหกรณ์อยากเช่าโกดังเฮียเก็บข้าวสมาชิก จ่ายค่าเช่าตรงเวลาทุกเดือน ผมรู้ว่าเฮียชอบคนจ่ายตรง"
          options:
            - text: "กล้ากับเฮียทำงานด้วยกันได้จริงเหรอ{kq}"
              heart: 1
              reply: "ไม่ได้หรอก ทะเลาะกันทุกวันแน่ แต่ทะเลาะกันในตำบล ดีกว่าเงียบแล้วให้บริษัทตัดสินแทน"
            - text: "กล้าไม่แค้นเฮียเหรอ{kq}"
              heart: 1
              reply: "แค้นเรื่องความชื้น แต่เฮียไม่เคยเอานาใคร ไม่เคยฟ้องใคร ผมรู้ว่าเฮียมีสมุดอีกเล่ม… ป้าแต๋วบอก ป้าบอกทุกคนแหละ"
      - goal: { type: visit, place: heng_shop, from: "17:00", to: "18:30" }
        hint: "กลับไปหาเสี่ยเฮงตอนลานปิด (17:00–18:30) ให้เขาตัดสินใจ"
        done:
          npc: "เฮียนั่งดูลานมาสามชั่วโมง กระสอบแรกที่เฮียแบกยังวางอยู่มุมโกดังนะน้อง เฮียไม่เคยทิ้ง… น้องว่าไง เฮียควรทำอะไรกับลานนี้"
          options:
            - text: "อย่าขาย{k} แล้วเผาสมุดเล่มเล็กซะ ประกาศยกหนี้คนที่จ่ายไม่ไหว"
              heart: 2
              set_flag: heng_end_forgive
              reply: "เผาสมุด… เฮียจะประกาศว่าเป็นโปรโมชั่นฉลองสามสิบปีลานเฮง ห้ามใครบอกว่าเฮียใจดี ใครบอก เฮียขึ้นดอกคนนั้น"
              next:
                - text: "ยายเพียรคงภูมิใจในเฮีย{k}"
                  heart: 2
                  reply: "ยายน้องเหรอ… คงพูดว่า ‘ช้าไปยี่สิบปีนะเอ็ง’ แล้วยิ้มแบบนั้น เฮียเห็นหน้ายายเลย… ไปเถอะน้อง ขอเฮียนั่งคนเดียวแป๊บ"
                - text: "ใครจะกล้าบอกล่ะ{k}"
                  heart: 1
                  reply: "เจ๊แต๋วไง พรุ่งนี้ทั้งอำเภอรู้ ช่างมัน เฮียแก่แล้ว ใจอ่อนได้แล้วมั้ง"
            - text: "ให้สหกรณ์เช่าโกดัง เฮียเป็นคนรับซื้อร่วม"
              heart: 2
              set_flag: heng_end_coop
              reply: "เฮียกับไอ้กล้า… เฮียจะเขียนในสัญญาว่าห้ามมันพูดเรื่องอุดมการณ์เกินวันละสิบนาที ถ้ามันยอม เฮียยอม"
            - text: "ขายไปเถอะ{k}เฮีย ได้พักสักที"
              heart: 0
              set_flag: heng_end_sold
              reply: "พัก… ใช่ เฮียเหนื่อยมานาน เงินก้อนนี้ไม่ต้องคิดเลขอีกเลย แต่ถ้าวันนึงเห็นเฮียนั่งกดเครื่องคิดเลขเปล่าๆ ที่ร้านกาแฟ ไม่ต้องทักนะ"
    reward: { money: 500, heart: 2, set_flag: heng_q4_done, line: { from: heng, text: "📢 ลานเฮง ขอบคุณลูกค้าทุกท่านตลอดสามสิบปี รายละเอียดฟังหอกระจายข่าวรอบห้าโมงเย็นพรุ่งนี้ (เฮียจ่ายค่าประกาศครบสามเปอร์เซ็นต์แล้ว)" } }
