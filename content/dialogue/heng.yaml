    npc: "น้องรู้ไหมว่าที่ลานเฮียตั้งอยู่ตอนนี้ เดิมเป็นนาพ่อเฮีย พ่อติดหนี้พ่อค้าข้าวจนต้องยกนาให้ เฮียใช้เวลายี่สิบปีซื้อคืนมา แล้วก็เทปูนทับทั้งแปลง"
    options:
      - text: "ทำไมเทปูนทับล่ะ{kq}"
        heart: 2
        reply: "เพราะถ้ายังเป็นนา เฮียต้องทำนาแบบพ่อ แล้วก็อาจจะเป็นหนี้แบบพ่อ เฮียเลยเปลี่ยนมันเป็นที่ที่คนอื่นเอาข้าวมาให้เฮียแทน"
        next:
          - text: "เฮียกลายเป็นพ่อค้าข้าวคนนั้นเหรอ{kq}"
            heart: 1
            reply: "…น้องพูดตรงกว่าที่เฮียกล้าพูดกับตัวเองนะ ใช่ เฮียกลายเป็นคนที่เฮียเกลียด แต่เฮียไม่เคยเอานาใคร ไม่เคยสักแปลง"
          - text: "พ่อเฮียคงภูมิใจ{k}"
            heart: 1
            reply: "เฮียไม่รู้ พ่อเสียตอนเฮียยี่สิบ ไม่ได้เห็นเฮียซื้อคืน บางเช้าเฮียยืนบนลานแล้วนึกว่าพ่อยืนอยู่ตรงคันนาเก่า"
      - text: "เฮียเล่าทำไม{kq}"
        heart: 0
