  - id: heng_f_son
    topic: self
    when: { heart_min: 5 }
    npc: "ลูกเฮียเรียนเมืองนอก เฮียบอกทุกคนแบบนี้ แต่ช่วงนี้มันไม่ค่อยรับสาย ส่งแต่สติกเกอร์หมีมาให้ เฮียไม่รู้จะอ่านหมีตัวนั้นยังไง"
    options:
      - text: "เขาอาจจะยุ่ง{k}"
