# น้องมิว (เด็ก ป.4) — convos + quests (เรื่องรอง: ไลฟ์ป้าแต๋ว จดหมายถึงแม่ ปลาหางนกยูงย้ายบ้าน)
convos:
  # ===== react =====
  - id: mew_r_meet
    topic: react
    once: true
    when: { not_flag: met_mew }
    npc: "พี่คะ! พี่คือพี่ที่ผู้ใหญ่สมศักดิ์ประกาศสามรอบใช่ไหม ‘หลานยายเพียร หลานยายเพียร หลานยายเพียร’ หนูกับโอ๊ตพูดตามกันทั้งวันเลย"
    set_flag: met_mew
    options:
      - text: "ใช่จ้ะ พี่เอง หนูชื่ออะไร"
        heart: 1
        reply: "หนูชื่อมิวค่ะ ป.4 แชมป์หนังยางหมู่สี่ โอ๊ตบอกว่าเขาเป็นแชมป์ แต่ไม่ใช่นะคะ เขาแชมป์ทอยเส้น ไม่เหมือนกัน"
        next:
          - text: "แชมป์หนังยางเลยเหรอ เก่งจัง"
            heart: 2
            reply: "เก่งค่ะ! หนูกระโดดได้ถึงหู พี่มาดูได้ที่ศาลาตอนเย็น ห้ามหัวเราะตอนหนูพลาดนะ"
          - text: "แล้วโอ๊ตคือใคร"
            heart: 1
            reply: "เพื่อนหนูค่ะ ชอบโกงตอนทอยเส้น แต่ใจดี… อย่าบอกเขาว่าหนูชมนะคะ"
      - text: "ผู้ใหญ่ประกาศสามรอบจริงเหรอ"
        heart: 1
        reply: "จริงค่ะ ผู้ใหญ่ประกาศทุกอย่างสามรอบ เมื่อวานประกาศเรื่องหมาหายสามรอบ หมากลับมาตั้งแต่รอบที่สองแล้ว"
      - text: "สวัสดีจ้ะ"
        heart: 0
        reply: "สวัสดีค่ะ หนูไหว้แล้วนะคะ ยายบอกว่าต้องไหว้ก่อน พี่ไม่ต้องไหว้หนูนะ หนูเด็ก"

  - id: mew_r_meeting1
    topic: react
    once: true
    when: { flag: story_meeting1 }
    npc: "พี่คะ ประชุมเมื่อวานหนูไปด้วย หนูไม่ได้ฟังหรอก หนูไปกินน้ำแดง ได้สามแก้ว ป้าแต๋วให้แก้วที่สามเพราะหนูช่วยถือถาดขนมชั้น"
    options:
      - text: "แล้วหนูเห็นอะไรบ้าง"
        heart: 1
        reply: "เห็นกำนันหลับค่ะ หนูนับได้ว่ากำนันกรนเก้าที แล้วนายกฯ พูดยาวมาก หนูถามยายว่าเขาพูดเรื่องอะไร ยายบอกว่ายายก็ไม่รู้ค่ะ"
        next:
          - text: "ผู้ใหญ่ก็ไม่รู้เหมือนกันจ้ะ"
            heart: 1
            reply: "งั้นทำไมต้องพูดยาวคะ ครูเต้ยสอนว่าพูดสั้นๆ ให้คนเข้าใจดีที่สุด หนูว่านายกฯ ต้องไปเรียนกับครูเต้ย"
          - text: "ถ้าหนูโหวตได้ หนูจะเลือกอะไร"
            heart: 2
            reply: "หนูเลือกน้ำค่ะ! บ่อปลาที่โรงเรียนจะได้มีน้ำ ถนนหนูไม่ต้องการ หนูเดินเท้าเปล่าได้ ตลาดก็ได้ ถ้ามีไอติม"
      - text: "น้ำแดงสามแก้ว ฟันจะผุนะ"
        heart: 0
        reply: "หนูแปรงฟันแล้วค่ะ แปรงนานด้วย นับถึงร้อย… ไม่ถึงร้อย ห้าสิบ"

  - id: mew_r_welldry
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "พี่… บ่อปลาหางนกยูงที่โรงเรียนแห้งค่ะ หนูกับโอ๊ตตักปลาใส่ขันไว้ ยี่สิบสามตัว ตายไปสองตัว หนูร้องไห้นิดเดียว"
    options:
      - text: "หนูช่วยปลาไว้ได้ตั้งเยอะนะ เก่งมาก"
        heart: 2
        reply: "จริงเหรอคะ… หนูนึกว่าหนูช้า ถ้าหนูไปเร็วกว่านี้มันจะไม่ตาย ครูเต้ยบอกไม่ใช่ความผิดหนู แต่หนูก็ยังเสียใจ"
        next:
          - text: "เสียใจได้จ้ะ แต่หนูช่วยไว้ยี่สิบเอ็ดตัวนะ"
            heart: 2
            reply: "ยี่สิบเอ็ดตัว… หนูตั้งชื่อครบทุกตัวแล้วค่ะ ตัวที่หางยาวสุดชื่อพี่{player}"
          - text: "เดี๋ยวพี่ช่วยหาที่อยู่ใหม่ให้ปลา"
            heart: 1
            reply: "จริงนะคะ! พี่สัญญาแล้วนะ หนูจะบอกปลาทุกตัวเลย"
      - text: "ทำไมบ่อแห้งล่ะ"
        heart: 1
        reply: "ครูบอกว่าน้ำใต้ดินลดค่ะ หนูถามว่าลดไปไหน ครูไม่ตอบ ครูมองไปทางรั้วบริษัท แล้วบอกให้หนูไปเข้าแถว"

  - id: mew_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "พี่คะ… ผีที่ที่ดินบริษัทมีจริงไหมคะ โอ๊ตบอกว่าเขาไม่กลัว แต่เมื่อคืนเขาให้แม่เปิดไฟนอนทั้งคืน แม่เขาบอกยายหนู"
    options:
      - text: "พี่ไม่รู้จ้ะ แต่ผีไม่มาหาเด็กที่อยู่ในบ้านตอนกลางคืนหรอก"
        heart: 2
        reply: "งั้นหนูจะอยู่ในบ้านทุกคืนเลยค่ะ หนูอยู่อยู่แล้ว แต่จะอยู่ให้แน่นขึ้น"
      - text: "ยายบัวบอกว่าผีไม่ชอบคนดูดน้ำนะ"
        heart: 1
        reply: "งั้นผีอยู่ข้างปลาหางนกยูงหนูใช่ไหมคะ! ผีใจดีแบบนี้หนูกลัวน้อยลงนิดนึง… นิดเดียวนะ"
        next:
          - text: "ใช่ ผีตัวนี้อยู่ข้างเรา"
            heart: 1
            reply: "หนูจะไม่บอกโอ๊ตนะคะ เดี๋ยวเขาจะไปท้าผี เขาชอบท้าทุกอย่าง แล้ววิ่งหนีทุกอย่าง"
          - text: "แต่ห้ามไปดูเด็ดขาดนะ"
            heart: 1
            reply: "ไม่ไปค่ะ สัญญา หนูเกี่ยวก้อยกับพี่ได้ไหมคะ ถ้าไม่เกี่ยวก้อยมันไม่นับ"
      - text: "โอ๊ตกลัวผีเหรอ ฮ่าๆ"
        heart: 0
        reply: "อย่าบอกเขานะคะว่าหนูเล่า… หนูก็กลัวค่ะ แต่หนูทำเป็นไม่กลัวเพราะโอ๊ตกลัวกว่า"

  - id: mew_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "พี่ หนูได้ถังน้ำสีเขียวจากประชุมค่ะ มีรูปใบไม้ใหญ่ๆ หนูจะเอาไปใส่ปลาหางนกยูง แต่ยายบอกว่าถังมันไม่มีน้ำมาด้วย"
    options:
      - text: "งั้นเราเอาน้ำฝนใส่ถังกัน"
        heart: 2
        reply: "เย้! หนูจะวางไว้ใต้ชายคา ฝนตกทีไรมันจะเต็ม ปลาจะได้มีบ้านใหม่ ถังนี้มีประโยชน์แล้วค่ะ"
      - text: "รูปใบไม้นั่นคือโลโก้บริษัทนะ"
        heart: 1
        reply: "โลโก้คืออะไรคะ… อ๋อ ป้ายบอกว่าของใคร หนูจะวาดรูปปลาทับค่ะ จะได้รู้ว่าถังนี้ของปลา"
        next:
          - text: "วาดทับเลย เดี๋ยวพี่ช่วยวาด"
            heart: 2
            reply: "พี่วาดครีบนะคะ หนูวาดตา ตาสำคัญที่สุด ครูเต้ยบอกว่าวาดตาสวยรูปจะมีชีวิต"
          - text: "เก็บไว้แบบนั้นก็ได้"
            heart: 0
            reply: "ไม่เอาค่ะ ปลาต้องมีบ้านที่เป็นของปลา หนูจะวาดคนเดียวก็ได้"

  - id: mew_r_sent
    topic: react
    once: true
    when: { flag: mew_sent_letter }
    npc: "พี่คะ! แม่ดูคลิปที่หนูอ่านจดหมายแล้ว แม่ร้องไห้ในวิดีโอคอล แล้วบอกว่าจะขอลากลับมาก่อนสงกรานต์สองวัน สองวันเลยค่ะ!"
    options:
      - text: "ดีใจด้วยนะ มิว"
        heart: 2
        reply: "หนูนับวันแล้วค่ะ ทำปฏิทินกระดาษติดข้างฝา ขีดทุกเย็น ยายบอกว่าขีดแรงจนฝาบ้านจะเป็นรู"
      - text: "แม่ร้องไห้ หนูไม่เสียใจใช่ไหม"
        heart: 1
        reply: "ตอนแรกหนูตกใจค่ะ แต่แม่บอกว่าร้องเพราะดีใจ ผู้ใหญ่ดีใจแล้วร้องไห้ได้ด้วยเหรอคะ แปลกจัง"
        next:
          - text: "ได้จ้ะ ผู้ใหญ่ชอบทำแบบนั้น"
            heart: 1
            reply: "งั้นตอนแม่กลับมา หนูจะเตรียมผ้าเช็ดหน้าไว้ให้แม่ผืนนึง ผืนที่หนูซ่อนไว้หลังศาลาวัด ยังไม่มีใครหาเจอ"
          - text: "หนูก็เคยร้องไห้ตอนดีใจหรือเปล่า"
            heart: 1
            reply: "ไม่เคยค่ะ… เคยครั้งนึง ตอนกระโดดหนังยางชนะโอ๊ตครั้งแรก แต่หนูบอกทุกคนว่าฝุ่นเข้าตา"

  # ===== news =====
  - id: mew_n_live
    topic: news
    npc: "ข่าวใหญ่ค่ะพี่! หนูสอนป้าแต๋วไลฟ์ได้แล้ว เมื่อวานป้าไลฟ์ได้สิบนาทีไม่หันกล้องไปที่เพดานเลย คนดูห้าคน มีคนแปลกหน้าด้วยหนึ่งคน!"
    options:
      - text: "เก่งมาก ใครคือคนแปลกหน้า"
        heart: 1
        reply: "ชื่อบัญชี ‘น้ำพริกแซ่บ88’ ค่ะ ป้าแต๋วดีใจมาก แต่หนูดูแล้ว เป็นบัญชีของพี่ตั้มร้าน 24 ชม. พี่ตั้มขอไม่ให้บอกป้า"
        next:
          - text: "งั้นเราเก็บเป็นความลับนะ"
            heart: 2
            reply: "ความลับค่ะ หนูเก็บความลับเก่ง หนูยังไม่เคยบอกใครเลยว่าโอ๊ตกลัวผี… อุ๊ย"
          - text: "พี่ตั้มใจดีนะ"
            heart: 1
            reply: "ใจดีค่ะ พี่ตั้มพิมพ์ว่า ‘น่ากินครับ’ ทุกไลฟ์ ทั้งที่พี่ตั้มไม่กินเผ็ด หนูเห็นเขากินแต่ข้าวเวฟ"
      - text: "หนูสอนผู้ใหญ่ได้ด้วยเหรอ"
        heart: 1
        reply: "ได้ค่ะ ป้าแต๋วเรียนช้ากว่าเด็ก ป.1 นิดนึง แต่ป้าขยัน ป้าจดลงสมุดทุกอย่าง จดว่า ‘กดปุ่มแดง = ออกทีวี’"

  - id: mew_n_school
    topic: news
    npc: "ครูเต้ยให้การบ้านวาดรูป ‘บ้านของฉันในอนาคต’ ค่ะ โอ๊ตวาดคอกควายใหญ่กว่าบ้าน หนูวาดบ้านที่มีแม่อยู่ด้วย"
    options:
      - text: "รูปหนูน่ารักมากเลย"
        heart: 2
        reply: "ครูให้ดาวห้าดวงค่ะ แต่ครูถามว่าทำไมแม่ในรูปถือกระเป๋า หนูบอกว่าแม่เพิ่งกลับมา ยังไม่ได้วางกระเป๋า"
      - text: "แล้วโอ๊ตได้กี่ดาว"
        heart: 1
        reply: "สามดาวค่ะ เพราะควายสีชมพู โอ๊ตบอกว่าสีเทาหมด ครูเลยหักสองดาว แต่ครูชมว่าควายยิ้มสวย"
        next:
          - text: "ควายสีชมพูก็น่ารักดีนะ"
            heart: 1
            reply: "หนูก็ว่างั้นค่ะ! แต่อย่าบอกโอ๊ตนะ เดี๋ยวเขาวาดทุกอย่างเป็นสีชมพู"
          - text: "หนูแบ่งสีให้โอ๊ตบ้างสิ"
            heart: 2
            reply: "หนูแบ่งแล้วค่ะ แต่หนูมีสีเทาแท่งเดียว หนูใช้วาดเมฆฝนให้บ่อปลา… พรุ่งนี้หนูจะให้เขา"

  - id: mew_n_poster
    topic: news
    when: { flag: act1_done }
    npc: "พี่คะ ทำไมเสาไฟมีรูปคนยิ้มเต็มเลย ยิ้มทุกเสาเลย หนูเดินไปโรงเรียนเหมือนมีคนจ้องหนูตลอดทาง"
    options:
      - text: "เขาจะเลือกตั้งนายกฯ ใหม่จ้ะ"
        heart: 1
        reply: "งั้นคนที่ยิ้มสวยที่สุดชนะเหรอคะ หนูจะเลือกคนที่ฟันขาวที่สุด… ไม่ได้ หนูยังเลือกไม่ได้ หนูเด็ก"
        next:
          - text: "ไม่ใช่ยิ้มสวยนะ ต้องดูว่าเขาจะทำอะไรให้ตำบล"
            heart: 2
            reply: "งั้นหนูจะไปถามทุกคนค่ะว่าจะเอาน้ำมาที่บ่อปลาโรงเรียนไหม ใครตอบว่าเอา หนูจะวาดรูปให้"
          - text: "หนูไม่ต้องสนใจหรอก"
            heart: 0
            reply: "แต่เขามองหนูอยู่นะคะ… หนูจะเดินอีกทางก็ได้ ทางผ่านคอกควายตาเผือก ควายไม่ยิ้มให้หนู"
      - text: "หนูกลัวรูปพวกนั้นเหรอ"
        heart: 1
        reply: "ไม่กลัวค่ะ แต่ตอนกลางคืนมองจากหน้าต่าง ไฟส่องหน้าเขา หนูดึงผ้าห่มคลุมหัวค่ะ"

  # ===== advice =====
  - id: mew_a_rubber
    topic: advice
    npc: "พี่คะ ถ้าพี่จะกระโดดหนังยาง ต้องกระโดดด้วยปลายเท้านะคะ ห้ามกระโดดด้วยส้นเท้า หนังยางจะพันขา แล้วหัวจะทิ่มทราย"
    options:
      - text: "หนูเคยหัวทิ่มทรายเหรอ"
        heart: 1
        reply: "เคยค่ะ ตอน ป.2 ทรายเข้าจมูก โอ๊ตหัวเราะจนล้มตาม เราสองคนหัวทิ่มทรายพร้อมกัน ครูเต้ยให้ล้างหน้าที่โอ่ง"
      - text: "ขอบคุณจ้ะ ครูมิว"
        heart: 2
        reply: "ครูมิว! หนูชอบค่ะ เรียกหนูว่าครูมิวอีกที… พี่ต้องจ่ายค่าเรียนเป็นไอติมหนึ่งแท่งนะคะ ล้อเล่นค่ะ… ครึ่งแท่งก็ได้"
        next:
          - text: "ได้เลย ครึ่งแท่ง"
            heart: 1
            reply: "เย้! หนูจะสอนพี่จนถึงระดับเข่าเลย ระดับเอวพี่ต้องจ่ายเต็มแท่ง"
          - text: "ครูมิวงก จังเลย"
            heart: 1
            reply: "ไม่งกค่ะ หนูแบ่งไอติมให้โอ๊ตครึ่งนึงทุกครั้ง… เกือบครึ่ง"
      - text: "พี่ตัวใหญ่ กระโดดไม่ไหวหรอก"
        heart: 0
        reply: "ตาเผือกตัวใหญ่กว่าพี่ยังกระโดดตอนงานวันเด็กเลยค่ะ ได้ระดับข้อเท้า แต่ทุกคนปรบมือ"

  - id: mew_a_grandma
    topic: advice
    npc: "พี่คะ ถ้าพี่อยากให้ยายหนูชอบพี่ ให้นั่งฟังยายเล่าเรื่องสมัยก่อนนะคะ ยายเล่ายาวมาก แต่ถ้าฟังจบยายจะให้ขนมครก"
    options:
      - text: "ยายเล่าเรื่องอะไรบ้าง"
        heart: 1
        reply: "เรื่องยายเพียรค่ะ! ยายหนูบอกว่ายายเพียรเคยพายเรือส่งยายหนูไปคลอดแม่หนูตอนน้ำท่วม พายคนเดียวทั้งคืน"
        next:
          - text: "ยายเพียรเก่งมากเลยนะ"
            heart: 2
            reply: "เก่งค่ะ ยายหนูบอกว่าถ้าไม่มียายเพียร ก็ไม่มีแม่หนู ไม่มีแม่หนูก็ไม่มีหนู งั้นหนูต้องขอบคุณยายพี่ใช่ไหมคะ"
          - text: "พี่ไม่เคยรู้เรื่องนี้เลย"
            heart: 1
            reply: "ยายหนูบอกว่ายายเพียรไม่ชอบเล่าเรื่องตัวเอง ชอบทำแล้วเงียบ เหมือนพี่ตั้มเลยค่ะ ทำดีแล้วไม่ให้บอก"
      - text: "ยาวแค่ไหน"
        heart: 0
        reply: "ยาวจนหนูหลับตักยายสองรอบค่ะ แต่ขนมครกยังอุ่นอยู่ ยายรอจนหนูตื่น"

  - id: mew_a_dark
    topic: advice
    when: { time: evening }
    npc: "พี่ ฟ้าเริ่มมืดแล้วค่ะ หนูมีเทคนิค ถ้ากลับบ้านไม่ทัน ให้ร้องเพลงดังๆ ตลอดทาง ผีจะคิดว่าเรามีหลายคน"
    options:
      - text: "ร้องเพลงอะไรดี"
        heart: 1
        reply: "เพลงชาติก็ได้ค่ะ ผีน่าจะเคารพ หรือเพลงช้างก็ได้ เพลงช้างสั้น ร้องซ้ำได้หลายรอบ"
      - text: "ได้ผลจริงเหรอ"
        heart: 1
        reply: "ได้ผลค่ะ หนูร้องทุกครั้งก็ไม่เคยเจอผี… ยายบอกว่าเพราะหนูกลับก่อนมืดทุกวัน แต่หนูว่าเพราะเพลง"
        next:
          - text: "พี่ว่าเพราะหนูกลับเร็ว"
            heart: 1
            reply: "ทั้งสองอย่างค่ะ! หนูทำทั้งสองอย่าง ผีเลยไม่มีโอกาสเลย"
          - text: "พี่จะลองร้องเพลงช้างดู"
            heart: 2
            reply: "ร้องดังๆ นะคะ ถ้าได้ยินเสียงพี่ร้อง หนูจะร้องตามจากในบ้าน ผีจะได้คิดว่ามีสองคน"
      - text: "หนูรีบกลับบ้านเถอะ"
        heart: 1
        reply: "ค่ะ หนูไปแล้ว… พี่ก็รีบกลับนะคะ พี่ไม่มียายเรียก หนูเลยเรียกแทน"

  # ===== smalltalk =====
  - id: mew_s_color
    topic: smalltalk
    npc: "พี่คะ ถ้าพี่เป็นสีได้ พี่จะเป็นสีอะไร หนูว่าพี่เป็นสีเขียวใบตอง เพราะพี่อยู่กับผักทั้งวัน"
    options:
      - text: "งั้นมิวเป็นสีม่วง"
        heart: 2
        reply: "ใช่เลยค่ะ! พี่จำได้ด้วยว่าหนูชอบสีม่วง หนูจะให้หนังยางสีม่วงพี่เส้นนึง เส้นที่ไม่ขาด"
      - text: "พี่อยากเป็นสีทอง"
        heart: 1
        reply: "สีทองเหมือนรถเกี่ยวลุงสมหมายเหรอคะ รถเกี่ยวลุงสีทองแต่เปื้อนโคลนจนเป็นสีน้ำตาล"
      - text: "สีเขียวใบตองเหรอ ไม่ค่อยสวยนะ"
        heart: 0
        reply: "สวยค่ะ! ใบตองห่อขนมได้ทุกอย่าง สีอื่นห่อขนมไม่ได้ หนูชมพี่อยู่นะคะ"

  - id: mew_s_frog
    topic: smalltalk
    when: { rain: true }
    npc: "ฝนตกแล้วค่ะพี่ กบร้องเต็มเลย หนูนับได้ว่ามีกบสามเสียง เสียงทุ้ม เสียงแหลม แล้วก็เสียงเหมือนลุงสมหมายไอ"
    options:
      - text: "ฮ่าๆ เหมือนลุงสมหมายไอจริงเหรอ"
        heart: 1
        reply: "จริงค่ะ ‘อ๊อบ อ๊อบ แค่ก’ หนูบอกลุง ลุงหัวเราะแล้วบอกว่าจะเอาไปเป็นเลข หนูไม่เข้าใจว่าเสียงเป็นเลขได้ยังไง"
        next:
          - text: "ลุงเขาเห็นอะไรเป็นเลขหมดแหละ"
            heart: 1
            reply: "งั้นหนูเป็นเลขอะไรคะ… ลุงบอกว่าหนูเป็นเลขสี่ เพราะอยู่ ป.4 ลุงคิดง่ายจัง"
          - text: "หนูเลียนเสียงเก่งนะ"
            heart: 2
            reply: "หนูเลียนเสียงไก่ได้ด้วยค่ะ เอ้กอี้เอ้กเอ้ก! ไก่บ้านป้าพรขันตามเลย ป้าพรบอกว่าหนูทำไก่สับสนเวลา"
      - text: "หนูอย่าไปเล่นน้ำฝนนะ"
        heart: 0
        reply: "ไม่ไปค่ะ… หนูยืนใต้ชายคา ยื่นมือออกไปนิดเดียว นิดเดียวไม่นับใช่ไหมคะ"

  - id: mew_s_flower
    topic: smalltalk
    when: { heart_min: 2 }
    npc: "พี่คะ หนูเก็บดอกหญ้ามาให้ค่ะ สีเหลือง ไม่ได้เด็ดจากสวนใครนะ เด็ดจากข้างคลอง ข้างคลองไม่มีเจ้าของใช่ไหมคะ"
    options:
      - text: "ขอบใจนะมิว สวยมากเลย"
        heart: 2
        reply: "พี่เอาไปเสียบแจกันที่บ้านยายเพียรนะคะ บ้านพี่ไม่มีดอกไม้เลย หนูเห็นตอนเดินผ่าน มีแต่พริก"
      - text: "ข้างคลองเป็นของทุกคนจ้ะ"
        heart: 1
        reply: "ของทุกคนแปลว่าของหนูด้วยใช่ไหมคะ งั้นหนูจะไปเก็บมาให้ยายด้วย ให้ป้าแต๋วด้วย ให้ครูเต้ยด้วย"
        next:
          - text: "แต่เก็บแค่พอดีนะ ให้ผึ้งบ้าง"
            heart: 2
            reply: "จริงด้วยค่ะ ผึ้งต้องกินด้วย หนูจะเก็บข้างละดอกเดียว ที่เหลือให้ผึ้ง"
          - text: "ให้ป้าแต๋วด้วยเหรอ"
            heart: 1
            reply: "ค่ะ ป้าแต๋วจะได้ถ่ายในไลฟ์ ป้าบอกว่าต้องมีของสวยๆ ในกล้อง ไม่งั้นคนดูแต่หน้าป้า"

  - id: mew_s_bird
    topic: smalltalk
    when: { time: morning }
    npc: "เช้านี้หนูเห็นนกกระจิบทำรังในกระถางหน้าบ้านยายค่ะ ยายบอกว่าห้ามรดน้ำกระถางนั้นจนกว่านกจะไป ต้นไม้ในกระถางเหี่ยวแล้ว"
    options:
      - text: "ต้นไม้คงยอมเสียสละให้นก"
        heart: 2
        reply: "จริงด้วยค่ะ ต้นไม้ใจดี หนูจะบอกต้นไม้ว่าขอบคุณทุกเช้า ยายบอกว่าต้นไม้ฟังได้"
      - text: "รังนกมีไข่ไหม"
        heart: 1
        reply: "มีสองฟองค่ะ เล็กเท่าเม็ดถั่ว หนูไม่ได้จับนะคะ ยายบอกว่าถ้าจับแม่นกจะไม่กลับมา"
      - text: "ย้ายรังไปที่อื่นก็ได้นี่"
        heart: -1
        reply: "ไม่ได้ค่ะ! บ้านเขา เราย้ายบ้านเขาไม่ได้… เหมือนที่บริษัทจะย้ายบ้านคนไหมคะ ยายพูดแบบนั้นเมื่อวาน"

  # ===== self =====
  - id: mew_f_nurse
    topic: self
    npc: "พี่คะ โตขึ้นหนูจะเป็นพยาบาลเหมือนหมอแอน หนูฝึกแล้วนะคะ หนูพันแผลให้โอ๊ตทุกครั้งที่เขาล้ม เขาล้มบ่อยมาก หนูเลยเก่งเร็ว"
    options:
      - text: "พยาบาลมิวต้องเก่งแน่ๆ"
        heart: 2
        reply: "หนูจะดูแลยายก่อนค่ะ ยายปวดเข่า หนูนวดให้ทุกคืน ยายบอกว่ามือหนูเบาเกิน แต่ยายหลับทุกครั้ง"
      - text: "โอ๊ตยอมให้พันแผลเหรอ"
        heart: 1
        reply: "ไม่ยอมค่ะ เขาบอกผู้ชายไม่ต้องพันแผล แต่ถ้าหนูไม่พัน เขาจะมาให้หนูเป่า… พันแผลง่ายกว่า"
        next:
          - text: "เป่าแผลก็เป็นการรักษาแบบนึงนะ"
            heart: 1
            reply: "หมอแอนบอกว่าเป่าไม่ช่วยเรื่องเชื้อโรค แต่ช่วยเรื่องหายเจ็บใจ หนูเลยทำทั้งสองอย่าง"
          - text: "หนูดูแลทุกคนเลยนะ"
            heart: 2
            reply: "ยายบอกว่าหนูเหมือนยายเพียร ยายเพียรดูแลทุกคนในหมู่บ้าน แต่ไม่มีใครดูแลยายเพียร… พี่กลับมาก็ดีแล้วค่ะ"

  - id: mew_f_mom
    topic: self
    when: { heart_min: 3 }
    npc: "พี่คะ… ทุกคืนวันอาทิตย์แม่วิดีโอคอลมา แต่สัญญาณบ้านยายไม่ค่อยดี ภาพแม่ค้างทุกที หนูเห็นหน้าแม่ค้างตอนกำลังยิ้ม หนูเลยแคปเก็บไว้หมด"
    options:
      - text: "หนูมีรูปแม่ยิ้มเยอะเลยนะ"
        heart: 2
        reply: "สี่สิบเจ็ดรูปค่ะ บางรูปแม่ตาปิดครึ่งนึง แต่หนูชอบทุกรูป เวลาคิดถึงหนูเปิดดูทีละรูป"
        next:
          - text: "วันหลังมาโทรที่บ้านพี่ได้นะ ตรงนั้นสัญญาณดี"
            heart: 2
            reply: "จริงเหรอคะ! หนูขอยายก่อนนะคะ… ถ้าแม่เห็นบ้านยายเพียร แม่ต้องจำได้ แม่เคยเล่าว่าเคยไปขโมยมะม่วงบ้านยายเพียร"
          - text: "แม่คงคิดถึงหนูเหมือนกัน"
            heart: 1
            reply: "แม่บอกว่าคิดถึงทุกวันค่ะ แต่แม่บอกตอนภาพค้าง หนูเลยไม่แน่ใจว่าแม่พูดจริงหรือหนูได้ยินเอง"
      - text: "สัญญาณไม่ดีเพราะอะไร"
        heart: 0
        reply: "ป้าแต๋วบอกว่าเสาสัญญาณอยู่ไกล อบต. สัญญาว่าจะทำใหม่ตั้งแต่หนูอยู่อนุบาล ตอนนี้หนู ป.4 แล้วค่ะ"

  - id: mew_f_brave
    topic: self
    when: { heart_min: 5 }
    npc: "พี่… หนูบอกความลับนะคะ ตอนหนูอยู่ ป.1 หนูถามยายว่าแม่ไม่รักหนูเหรอถึงไม่อยู่ด้วย ยายร้องไห้ หนูเลยไม่ถามอีกเลย"
    options:
      - text: "หนูไม่ผิดที่ถามนะ มิว"
        heart: 2
        reply: "จริงเหรอคะ… หนูนึกว่าหนูทำให้ยายเสียใจ ตั้งแต่นั้นหนูเลยยิ้มตลอด ยายจะได้ไม่ร้องไห้อีก"
        next:
          - text: "หนูไม่ต้องยิ้มตลอดก็ได้นะ เศร้าบ้างก็ได้"
            heart: 2
            reply: "เศร้าได้เหรอคะ… งั้นวันไหนหนูเศร้า หนูมาหาพี่ได้ไหม หนูจะไม่ร้องไห้นาน แค่แป๊บเดียว"
          - text: "แม่ไปทำงานเพราะรักหนูนะ"
            heart: 1
            reply: "ยายก็บอกแบบนั้นค่ะ หนูเข้าใจแล้ว แต่ใจหนูยังไม่ค่อยเข้าใจ หัวเข้าใจก่อนใจ ใช่ไหมคะ"
      - text: "แล้วตอนนี้หนูโอเคไหม"
        heart: 1
        reply: "โอเคค่ะ หนูมียาย มีโอ๊ต มีพี่ มีปลาหางนกยูงยี่สิบเอ็ดตัว… หนูนับแล้ว คนรักหนูเยอะกว่าที่หนูคิด"

  # ===== others =====
  - id: mew_o_oat
    topic: others
    npc: "พี่คะ โอ๊ตบอกทุกคนว่าเขาจับงูได้ จริงๆ มันคือเชือกฟางค่ะ หนูเห็นตอนเขาจับ เขาร้องกรี๊ดก่อนรู้ว่าเป็นเชือก"
    options:
      - text: "อย่าไปบอกใครนะ เดี๋ยวโอ๊ตอาย"
        heart: 2
        reply: "หนูบอกพี่คนเดียวค่ะ… กับยาย กับป้าแต๋ว ป้าแต๋วบอกว่าจะไม่บอกใคร แต่ป้าหัวเราะแปลกๆ"
        next:
          - text: "ป้าแต๋วรู้ ทั้งตำบลก็รู้แล้วล่ะ"
            heart: 1
            reply: "จริงด้วยค่ะ… หนูจะไปขอโทษโอ๊ต แล้วให้หนังยางเส้นสีม่วงเป็นของขวัญ เขาไม่ชอบสีม่วงแต่เขาจะรับ"
          - text: "ไม่เป็นไร โอ๊ตคงหัวเราะเองแหละ"
            heart: 0
            reply: "โอ๊ตไม่หัวเราะค่ะ โอ๊ตจะบอกว่าเชือกนั้นเคยเป็นงูมาก่อน"
      - text: "ฮ่าๆ เชือกฟางเหรอ"
        heart: 1
        reply: "เชือกฟางสีเขียวค่ะ คล้ายงูเขียวนิดนึง หนูก็ตกใจนิดนึง แต่หนูไม่กรี๊ด หนูแค่ถอยห้าก้าว"

  - id: mew_o_taew
    topic: others
    npc: "ป้าแต๋วรู้ทุกเรื่องในตำบลค่ะ แต่ป้าไม่รู้ว่ากดปุ่มไหนเปลี่ยนกล้องหน้ากล้องหลัง หนูต้องกดให้ทุกครั้ง"
    options:
      - text: "หนูเป็นผู้ช่วยป้าแต๋วเลยนะ"
        heart: 1
        reply: "ป้าจ้างหนูค่ะ! ไลฟ์ละอมยิ้มสองอัน ป้าบอกว่าเป็นค่าแรงขั้นต่ำของเด็ก… ขั้นต่ำคืออะไรคะ"
        next:
          - text: "คือน้อยที่สุดที่ต้องได้จ้ะ"
            heart: 1
            reply: "งั้นหนูได้น้อยที่สุดเหรอคะ! หนูจะขอขึ้นเป็นสามอัน ถ้าป้าไม่ให้หนูจะไลฟ์แต่เพดาน"
          - text: "อมยิ้มสองอันก็คุ้มแล้วมั้ง"
            heart: 0
            reply: "คุ้มค่ะ แต่ป้าพรบอกว่าป้าแต๋วเอาเปรียบเด็ก ป้าพรให้หนูสามอันถ้าหนูช่วยถือกล้องให้ป้าพรบ้าง"
      - text: "ป้าแต๋วรู้เรื่องหนูด้วยไหม"
        heart: 1
        reply: "รู้ค่ะ ป้ารู้ว่าหนูแอบซื้อลูกอมก่อนกินข้าว ป้าไม่บอกยาย แต่ป้าบอกว่า ‘ป้าไม่ได้พูดนะ แต่ฟันหนูจะรู้เอง’"

  - id: mew_o_toey
    topic: others
    npc: "ครูเต้ยให้คะแนนทุกอย่างเลยค่ะพี่ เมื่อวานครูให้คะแนนข้าวผัดที่ร้านพี่หน่อยว่าเก้าเต็มสิบ หักหนึ่งเพราะผักชีเยอะ"
    options:
      - text: "ครูเต้ยให้คะแนนพี่หรือยัง"
        heart: 1
        reply: "ให้แล้วค่ะ! ครูบอกว่าพี่ได้แปดเต็มสิบ หักสองเพราะพี่เดินเร็วเกิน ครูทักแล้วพี่ไม่ได้ยิน… ครูบอกว่าความลับนะ หนูเผลอพูด"
        next:
          - text: "งั้นพรุ่งนี้พี่จะเดินช้าๆ แล้วทักครูก่อน"
            heart: 2
            reply: "ดีค่ะ! พี่จะได้สิบเต็มสิบ หนูจะบอกครูว่าพี่ตั้งใจมาก… ไม่ หนูจะไม่บอก ให้ครูเห็นเอง"
          - text: "หักคะแนนเพราะเดินเร็วเนี่ยนะ"
            heart: 1
            reply: "ครูบอกว่าคนเดินเร็วจะพลาดของสวยๆ ข้างทาง แบบดอกหญ้าที่หนูเก็บไง"
      - text: "หนูได้กี่คะแนน"
        heart: 1
        reply: "หนูได้เก้าค่ะ หักหนึ่งเพราะพูดเร็ว ครูบอกว่าหนูพูดเร็วจนคำวิ่งชนกัน"

quests:
  - id: mew_q1
    npc: mew
    title: "ไลฟ์ป้าแต๋ว"
    desc: "น้องมิวเป็นตากล้องไลฟ์ขายน้ำพริกของป้าแต๋ว ขอให้ไปช่วยเป็นคนดู"
    start: { heart_min: 1, day_min: 3 }
    offer:
      npc: "พี่คะ! เย็นนี้ห้าโมงป้าแต๋วจะไลฟ์ขายน้ำพริก หนูเป็นตากล้อง พี่มาเป็นคนดูหน้าร้านได้ไหมคะ ถ้ามีคนดูเยอะป้าจะไม่ตื่นเต้น"
      options:
        - text: "ได้เลย พี่จะไปกดหัวใจเยอะๆ"
          accept: true
          heart: 2
          reply: "เย้! กดค้างไว้นะคะ หัวใจจะลอยเต็มจอ ป้าแต๋วจะคิดว่าดังแล้ว"
        - text: "ไปได้ แต่พี่ไม่ซื้อนะ"
          accept: true
          heart: 1
          reply: "ไม่ซื้อก็ได้ค่ะ ดูอย่างเดียวก็ช่วยแล้ว… แต่ถ้าซื้อป้าจะดีใจมาก มาก มาก"
        - text: "พี่ไม่ว่างจ้ะ"
          heart: 0
          reply: "ก็ได้ค่ะ… หนูจะไปชวนพี่ตั้ม แต่พี่ตั้มตื่นตอนสี่โมงเย็น ยังงัวเงียอยู่เลย"
    steps:
      - goal: { type: visit, place: taew_shop, from: "17:00", to: "18:30" }
        hint: "ไปที่ร้านป้าแต๋วช่วง 17:00–18:30 ดูไลฟ์กับน้องมิว"
        done:
          npc: "พี่มาแล้ว! ไลฟ์เริ่มแล้วค่ะ… ป้าแต๋ว ป้า! หันหน้ามาทางกล้อง! คนดูสี่คน พี่ คนนึงคือพี่ อีกสองคือป้าพร อีกคนคือยายหนู พี่ช่วยพิมพ์อะไรหน่อยค่ะ"
          options:
            - text: "พิมพ์ว่า ‘น้ำพริกน่ากินมาก{k} ส่งได้ไหม’"
              heart: 2
              set_flag: mew_q1_comment
              reply: "ป้าแต๋วอ่านออกไลฟ์ค่ะ! ‘ส่งได้จ้ะ ส่งถึงบ้านเลย เดินไปส่งเอง’ ป้ายิ้มจนลืมว่ากล้องถ่ายแต่คาง"
            - text: "บอกป้าแต๋วว่ากล้องถ่ายแต่คาง"
              heart: 1
              reply: "ป้าแต๋วก้มหน้ามาดูกล้องใกล้มาก ทั้งจอเป็นรูจมูกป้า! คนดูหัวเราะกันใหญ่ ป้าพรพิมพ์ ‘ฮ่าๆๆๆ’ ยาวสามบรรทัด"
      - goal: { type: pay, npc: taew, n: 50 }
        hint: "สั่งน้ำพริกกระปุกแรกจากไลฟ์ป้าแต๋ว จ่ายเงิน 50 บาท"
        done:
          npc: "ออเดอร์แรกในชีวิตป้า! ไลฟ์ห้าครั้ง ได้ออเดอร์แรกจากหลาน ป้าจะเก็บแบงก์นี้ใส่กรอบ… ไม่ได้ ป้าต้องใช้ทอนเงิน เอาเป็นถ่ายรูปไว้แล้วกัน"
          options:
            - text: "ป้าต้องขอบคุณมิวนะ{kq}"
              heart: 2
              set_flag: mew_q1_credit
              reply: "จริงด้วย! มิว มานี่ อมยิ้มสามอัน ไม่ใช่สองแล้ว เลื่อนขั้นเป็นตากล้องอาวุโส"
            - text: "อร่อยจริงนะ{kq}ป้า ไม่ใช่ซื้อเพราะเกรงใจ"
              heart: 1
              reply: "อร่อยจริงจ้ะ สูตรป้าเอง ใส่มะขามเปียกหน่อย ถ้าไม่อร่อยมาบอกป้าตรงๆ ป้าไม่โกรธ… ป้าโกรธนิดเดียว"
    reward: { heart: 2, items: { rubber_band: 1 }, set_flag: mew_q1_done, line: { from: taew, text: "ขอบคุณลูกค้าคนแรกนะจ๊ะ 🙏 ไลฟ์หน้าเย็นวันศุกร์ ตากล้องอาวุโสมิวคุมกล้องเหมือนเดิม ห้ามใครทักว่าเห็นแต่คางป้า" } }

  - id: mew_q2
    npc: mew
    title: "จดหมายที่ไม่เคยส่ง"
    desc: "น้องมิวเขียนจดหมายถึงแม่ทุกอาทิตย์แต่ไม่เคยส่ง อยากทำคลิปอ่านให้แม่ฟัง"
    start: { flag: mew_q1_done, heart_min: 3, day_min: 6 }
    offer:
      npc: "พี่คะ หนูมีจดหมายถึงแม่สิบเจ็ดฉบับ ไม่เคยส่งสักฉบับ หนูอยากอ่านอัดคลิปให้แม่ดู แต่มือถือยายถ่ายแล้วเบลอ พี่ช่วยถ่ายให้ได้ไหมคะ"
      options:
        - text: "ได้จ้ะ พี่ถ่ายให้"
          accept: true
          heart: 2
          reply: "ขอบคุณค่ะ! หนูจะวาดการ์ดถือไว้ด้วย แต่สีเทียนหนูเหลือแต่แท่งสั้นๆ… หนูวาดด้วยแท่งสั้นก็ได้ค่ะ"
        - text: "ทำไมไม่ส่งไปรษณีย์ล่ะ"
          accept: true
          heart: 1
          reply: "หนูไม่รู้ที่อยู่หอแม่ค่ะ แม่ย้ายหอบ่อย แต่มือถือแม่ไม่ย้าย คลิปไปถึงแน่นอน พี่ช่วยนะคะ"
        - text: "ไว้วันหลังนะ"
          heart: 0
          reply: "ค่ะ… หนูเก็บไว้ก่อนก็ได้ หนูเก็บมาตั้งนานแล้ว เก็บอีกนิดไม่เป็นไร"
    steps:
      - goal: { type: give, npc: mew, item: crayon_big, n: 1 }
        hint: "ซื้อสีเทียนกล่องใหญ่ที่ร้านป้าแต๋ว เอาไปให้น้องมิววาดการ์ดถึงแม่"
        done:
          npc: "กล่องใหญ่! มีสีม่วงสามเฉดเลยค่ะ หนูจะวาดรูปแม่กับหนูกับยาย ยืนหน้าบ้าน… พี่จะอยู่ในรูปด้วยไหมคะ"
          options:
            - text: "วาดพี่ด้วยก็ได้ ตัวเล็กๆ ข้างหลัง"
              heart: 2
              reply: "หนูจะวาดพี่ถือบัวรดน้ำค่ะ แม่จะได้รู้ว่ามีพี่คนนึงช่วยดูแลหนู"
            - text: "วาดแค่ครอบครัวหนูดีกว่า"
              heart: 1
              reply: "งั้นหนูวาดปลาหางนกยูงแทนพี่นะคะ ปลาตัวที่หางยาวที่สุด"
      - goal: { type: visit, place: sala, from: "15:00", to: "18:00" }
        hint: "ไปที่ศาลาช่วง 15:00–18:00 ถ่ายคลิปน้องมิวอ่านจดหมาย"
        done:
          npc: "‘แม่คะ วันนี้หนูกระโดดหนังยางถึงหูแล้ว… แม่คะ หนูไม่โกรธแม่นะ…’ พี่คะ หนูอ่านจบแล้ว เสียงหนูสั่นนิดนึง จะส่งเลยดีไหม หรือเก็บไว้ให้แม่ดูตอนกลับมาสงกรานต์"
          options:
            - text: "ส่งเลยจ้ะ แม่จะได้รู้ว่าหนูคิดถึง"
              heart: 2
              set_flag: mew_sent_letter
              reply: "ส่งแล้วค่ะ! ขึ้นว่าส่งแล้ว… ขึ้นว่าอ่านแล้ว! แม่อ่านแล้วพี่! แม่ยังไม่ตอบ หนูจะรอค่ะ หนูรอเก่ง"
            - text: "เก็บไว้ดูพร้อมแม่ตอนสงกรานต์ดีไหม"
              heart: 1
              set_flag: mew_kept_letters
              reply: "ดีค่ะ หนูจะได้นั่งดูกับแม่ แล้วเห็นหน้าแม่ตอนดู ไม่ใช่หน้าแม่ค้างในจอ… หนูจะเก็บไว้ในมือถือพี่นะคะ ห้ามลบ"
    sold_at: { crayon_big: taew_shop }
    reward: { heart: 2, items: { khanom_krok: 1 }, set_flag: mew_q2_done, line: { from: mew, text: "ขอบคุณพี่{player}ค่ะ 💜 หนูจะวาดรูปพี่ให้ใหม่ ตัวใหญ่กว่าเดิม" } }

  - id: mew_q3
    npc: mew
    title: "บ้านใหม่ของปลาหางนกยูง"
    desc: "บ่อปลาที่โรงเรียนแห้ง น้องมิวขอให้ช่วยหาที่อยู่ใหม่ให้ปลา 21 ตัว"
    start: { flag: story_well_dry, heart_min: 2 }
    offer:
      npc: "พี่คะ ปลาหางนกยูงยี่สิบเอ็ดตัวอยู่ในขันมาสามวันแล้ว ขันเล็กมาก ปลาว่ายชนกัน หนูอยากรู้ว่าน้ำหายไปไหน แล้วปลาควรไปอยู่ที่ไหนดี"
      options:
        - text: "ไปถามพี่ปาล์มกัน เขารู้เรื่องน้ำ"
          accept: true
          heart: 2
          reply: "พี่ปาล์มที่ถือตลับเมตรใช่ไหมคะ หนูเคยเห็นเขาวัดต้นมะม่วงหน้าโรงเรียน หนูจะไปด้วย… ไม่ได้ หนูต้องเข้าเรียน พี่ไปถามแทนนะคะ"
        - text: "พี่ช่วยหาบ้านให้ปลาเอง"
          accept: true
          heart: 1
          reply: "สัญญานะคะ! หนูบอกปลาทุกตัวแล้วว่าพี่จะช่วย ถ้าพี่ไม่ช่วย ปลาจะผิดหวังในตัวพี่"
        - text: "ปล่อยลงคลองไปเลยสิ"
          heart: 0
          reply: "คลองตื้นมากเลยค่ะ หนูไปดูแล้ว น้ำเหลือแค่ข้อเท้า ปลาจะอยู่ได้เหรอคะ… หนูจะคิดดูก่อน"
    steps:
      - goal: { type: talk, npc: palm }
        hint: "ไปถามปาล์มที่ อบต. ว่าน้ำใต้ดินหายไปไหน และปลาควรไปอยู่ที่ไหน"
        done:
          npc: "ปลาหางนกยูงของน้องมิวเหรอ ตามหลักวิชาการนะ น้ำใต้ดินเหมือนน้ำในแก้วใหญ่ ใครเสียบหลอดใหญ่ดูด แก้วก็พร่องเร็ว… บอกน้องแบบนี้พอ อย่าบอกว่าหลอดใหญ่ของใคร เดี๋ยวเด็กไปเขียนป้ายประท้วง ล้อเล่นๆ ส่วนปลา ใส่โอ่งรองน้ำฝนก็ได้นะ ปลากินลูกน้ำด้วย ได้สองต่อเลย"
          options:
            - text: "ปลาช่วยกินลูกน้ำได้ด้วยเหรอ{kq}"
              heart: 1
              reply: "ได้สิ หมอแอนชอบมาก กันไข้เลือดออก เราว่าน้องมิวกำลังทำโครงการสาธารณสุขโดยไม่รู้ตัวเนอะ"
            - text: "แล้วบ่อโรงเรียนจะมีน้ำอีกไหม{kq}"
              heart: 1
              reply: "ถ้าน้ำใต้ดินไม่ลดต่อ… เราวัดอยู่ทุกบ้าน ยังตอบไม่ได้ เราไม่อยากโกหกเด็กนะ แต่ก็ไม่อยากให้เด็กเศร้า เธอช่วยบอกแบบที่ดีที่สุดแล้วกัน"
      - goal: { type: visit, place: school, from: "15:00", to: "17:00" }
        hint: "หลังเลิกเรียน ไปหาน้องมิวที่โรงเรียน บอกเรื่องที่ปาล์มพูด"
        done:
          npc: "น้ำใต้ดินเหมือนน้ำในแก้ว แล้วมีคนดูดด้วยหลอดใหญ่… หนูเข้าใจแล้วค่ะ หนูจะไม่ถามว่าหลอดของใคร พี่ทำหน้าแบบนั้นแปลว่าไม่ควรถาม งั้นปลาจะไปอยู่ไหนดีคะ"
          options:
            - text: "แบ่งปลาไปอยู่ในโอ่งรองน้ำฝนทุกบ้าน ช่วยกินลูกน้ำ"
              heart: 2
              set_flag: mew_fish_jars
              reply: "บ้านละสองตัว! บ้านหนู บ้านโอ๊ต บ้านป้าแต๋ว บ้านป้าพร บ้านพี่… ปลาจะได้มีเพื่อนบ้านทั้งตำบล หนูจะไปเยี่ยมทุกบ้านทุกวันเสาร์ค่ะ"
            - text: "เลี้ยงรวมกันในถังเขียวที่ศาลา ทุกคนช่วยกันเติมน้ำฝน"
              heart: 1
              set_flag: mew_fish_sala
              reply: "ถังที่หนูวาดปลาทับโลโก้! ปลาจะได้อยู่ในถังที่มีรูปตัวเอง หนูจะเขียนป้าย ‘บ้านปลา ห้ามเอาไปใส่ข้าวเปลือก’ เพราะป้าพรเคยทำ"
    reward: { heart: 2, items: { color_paper: 2 }, set_flag: mew_q3_done, line: { from: mew, text: "ประกาศค่ะ 🐟 ปลาหางนกยูงย้ายบ้านแล้ว ใครเห็นลูกน้ำในโอ่งบอกหนูได้ หนูส่งปลาไปช่วยฟรีค่ะ" } }
