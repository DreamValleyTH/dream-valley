      - text: "{p}ช่วยสอนได้นะ{kq}"
        heart: 2
        reply: "อนุโมทนาโยม… อาตมาอยากให้เณรได้เห็นหน้าแม่ทุกวันอาทิตย์ อาตมาเลยต้องเก่งเรื่องนี้ให้ได้ ทั้งที่ไม่อยากแตะโทรศัพท์เท่าไหร่"
        next:
          - text: "ทำไมไม่ให้เณรถือเอง{kq}"
