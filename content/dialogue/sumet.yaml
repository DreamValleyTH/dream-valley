    options:
      - text: "{p}จะจำไว้ให้{k}"
        heart: 2
        reply: "… อาตมาไม่ได้เล่าเพื่อขอให้ใครรับปากนะโยม แต่ได้ยินแล้วอาตมาวางใจได้นิดหนึ่ง"
      - text: "พระก็กลัวเรื่องแบบนี้เหรอ{kq}"
        heart: 1
        reply: "พระก็ยังยึดอยู่โยม… อาตมาฝึกปล่อยวางทุกวัน แต่ต้นไม้ที่ปลูกกับมือ มันปล่อยยากกว่าความคิด"
        next:
          - text: "บางอย่างไม่ต้องปล่อยก็ได้มั้ง"
            heart: 1
            reply: "อาจจะใช่โยม… ปล่อยความกลัว แต่ไม่ปล่อยการดูแล อาตมาจะลองแยกสองอย่างนี้ดู"
          - text: "ให้เณรต้นดูแลต่อสิ"
            heart: 1
            reply: "เณรอยากเป็นหมอด้วยโยม… อาตมาไม่อยากให้เด็กต้องแบกป่าทั้งป่าแทนความฝันตัวเอง"

  - id: sumet_f_water_night
    topic: self
    when: { heart_min: 7 }
    npc: "บางคืนอาตมานั่งสมาธิไม่ลงนะโยม… คิดว่าถ้าบ่อวัดแห้ง คนทั้งตำบลจะไปตักน้ำที่ไหน อาตมาไม่เคยบอกใคร แม้แต่ลุงจำรัส"
    options:
      - text: "หลวงพ่อไม่ต้องแบกคนเดียว{k}"
        heart: 2
        reply: "… อาตมาสอนคนอื่นแบบนี้มาสามสิบปี เพิ่งได้ยินมีคนพูดกลับมาที่อาตมา ฟังแล้วแปลกดีนะโยม แต่เบาใจ"
        next:
          - text: "คืนไหนนอนไม่หลับ มานั่งคุยกันได้"
            heart: 2
            reply: "พระไม่ควรรบกวนญาติโยมกลางคืนหรอก… แต่ตอนเช้าบิณฑบาตผ่านหน้าบ้านโยม อาตมาจะหยุดคุยสักสองประโยค ได้ไหม"
          - text: "เราจะหาทางเรื่องน้ำด้วยกัน"
            heart: 2
            reply: "อนุโมทนาโยม… อาตมาจะเล่าเรื่องฝายเก่าให้ฟังวันหลังนะ อาตมาเก็บความฝันนั้นไว้นานเกินไปแล้ว"
      - text: "พระก็นอนไม่หลับได้เหรอ{kq}"
        heart: 1
        reply: "ได้โยม พระไม่ใช่หิน… แต่อาตมารู้ว่าคิดคนเดียวตอนดึก มันขยายใหญ่กว่าความจริงทุกครั้ง"

  # ===== others =====
  - id: sumet_o_jamrat
    topic: others
    npc: "ลุงจำรัสเปิดบัญชีวัดให้ใครดูก็ได้ทุกบรรทัดนะโยม… วันก่อนมีคนขอดู ลุงอ่านให้ฟังทุกบรรทัด สามชั่วโมง คนขอดูหลับไปก่อน"
    options:
      - text: "ลุงละเอียดมากเลยนะ"
        heart: 1
        reply: "ละเอียดเพราะลุงเคยรู้ว่าความเชื่อใจหายง่ายแค่ไหนโยม… ลุงไม่ได้เล่าเรื่องตัวเองบ่อยหรอก ถ้าวันหนึ่งลุงเล่า ฟังให้จบนะ"
        next:
          - text: "ลุงเคยเกิดอะไรขึ้นเหรอ{kq}"
            heart: 0
            reply: "อาตมาเล่าแทนลุงไม่ได้โยม เรื่องของใครให้เขาเล่าเอง… อาตมาบอกได้แค่ว่าลุงเป็นคนที่อาตมาภูมิใจที่สุดคนหนึ่ง"
          - text: "{p}จะฟังให้จบ{k}"
            heart: 1
            reply: "อนุโมทนาโยม… แต่ถ้าลุงเริ่มอ่านบัญชีย้อนหลังสามสิบปี โยมหลับได้ อาตมาอนุญาต"
      - text: "หลวงพ่อไม่เคยจับเงินเลยเหรอ{kq}"
        heart: 1
        reply: "ไม่จับโยม ทุกบาทผ่านลุงจำรัส… อาตมาสบายใจ ลุงก็สบายใจ ญาติโยมก็สบายใจ สามคนสบายใจดีกว่าคนเดียวรวย"

  - id: sumet_o_ton
    topic: others
    npc: "เณรต้นถามอาตมาเมื่อวานว่า ‘หลวงพ่อครับ ถ้าผมฝันผิด ลุงสมหมายจะเสียเงินไหมครับ’… อาตมาตอบยากที่สุดในพรรษานี้"
    options:
      - text: "หลวงพ่อตอบว่าไง{kq}"
        heart: 1
        reply: "อาตมาบอกว่า ‘ฝันของเณรไม่มีถูกไม่มีผิด ลุงเลือกเอง ลุงรับผลเอง’… เณรนิ่งไปนาน แล้วถามว่า ‘งั้นผมฝันถึงถ่านได้ใช่ไหมครับ’"
        next:
          - text: "เด็กคิดง่ายดีนะ"
            heart: 1
            reply: "ง่ายแต่ลึกโยม… เด็กรู้ว่าอะไรเป็นของตัวเอง ผู้ใหญ่บางคนลืมไปแล้ว"
          - text: "{p}จะช่วยดูแลเณรด้วย{k}"
            heart: 2
            reply: "อนุโมทนาโยม… เณรชอบโยมนะ เมื่อวานนับว่าโยมมาวัดกี่ครั้ง นับได้แม่นกว่าอาตมาอีก"
      - text: "ห้ามคนมาถามเลยสิ{k}"
        heart: 0
        reply: "ห้ามได้แต่ใจคนห้ามยากโยม… อาตมาเลือกสอนเณรให้รู้ว่าไม่ต้องแบกความหวังของใคร ดีกว่าสร้างรั้วรอบเด็ก"

  - id: sumet_o_bua
    topic: others
    npc: "ยายบัวมาถวายยาหม่องไพลอีกแล้วโยม… พร้อมเล่าเรื่องผีกองกอยแถวป่าไผ่หลังวัดให้ฟัง อาตมาทาเข่าไปฟังไป ขนลุกทั้งยาหม่องร้อนอยู่"
    options:
      - text: "หลวงพ่อเชื่อเรื่องผีของยายไหม{kq}"
        heart: 1
        reply: "อาตมาเชื่อว่ายายห่วงอาตมาจริงโยม… เรื่องผีไว้ทีหลัง อาตมาไม่เดินป่าไผ่ตอนค่ำ เพราะยายขอ ไม่ใช่เพราะกลัว… ครึ่งหนึ่งก็กลัว"
      - text: "ยายบัวกับยายเพียรสนิทกันไหม{kq}"
        heart: 1
        reply: "สนิทมากโยม… วันงานศพโยมเพียร ยายบัวนั่งข้างโลงทั้งคืน ไม่ร้องไห้สักหยด พอเช้ายายเดินไปนั่งริมคลองคนเดียว"
        next:
          - text: "ทำไมไปริมคลอง{kq}"
            heart: 1
            reply: "อาตมาไม่ได้ถามโยม… โยมลองถามยายบัวเองดูสักวัน ถือหมากไปด้วย ยายจะเล่าถ้ายายพร้อม"
          - text: "{p}จะไปเยี่ยมยายบัวบ่อยๆ"
            heart: 2
            reply: "ดีแล้วโยม… คนแก่ที่เสียเพื่อนไป ต้องการคนมานั่งด้วยมากกว่ายาบำรุง"
      - text: "ยาหม่องยายดีจริงเหรอ{kq}"
        heart: 0
        reply: "ดีโยม ร้อนจนอาตมาลืมปวด… หมอแอนบอกว่าดีจริง แต่ให้อาตมาพักเข่าด้วย อาตมาทำตามได้ครึ่งเดียว"

  - id: sumet_o_kla
    topic: others
    npc: "กล้ามาช่วยแปลงผักวัดตอนตีห้าครึ่ง แล้วรีบไปแปลงตัวเองต่อ… อาตมาบอกให้พักบ้าง กล้าบอกว่า ‘ผักไม่พักครับหลวงพ่อ’"
    options:
      - text: "กล้าขยันมากนะ{kq}"
        heart: 1
        reply: "ขยันโยม… ขยันจนอาตมาห่วง คนที่มีไฟมากต้องมีคนคอยเติมน้ำให้ ไม่งั้นไฟมันกินตัวเอง"
      - text: "ผักไม่พักจริงไหม{kq}"
        heart: 1
        reply: "ผักพักทุกคืนโยม ตอนมืดผักหยุดโต… อาตมาจะเอาเรื่องนี้ไปบอกกล้าพรุ่งนี้ ขอบใจที่ช่วยอาตมาหาคำตอบ"
        next:
          - text: "กล้าจะเถียงกลับแน่"
            heart: 1
            reply: "เถียงแน่โยม… แต่กล้าจะกลับไปนอนเร็วขึ้นสักชั่วโมง เขาเถียงด้วยปากแต่ทำตามด้วยใจ"
          - text: "หลวงพ่อเองก็ไม่ค่อยพักนะ"
            heart: 2
            reply: "… โยมจับได้แล้ว อาตมาจะไม่เอาเรื่องนี้ไปบอกกล้าก็แล้วกัน"
      - text: "กล้าเป็นพวกหัวรุนแรงหรือเปล่า{kq}"
        heart: 0
        reply: "ไม่ใช่โยม เขาแค่ใจร้อนกับความไม่ยุติธรรม… อาตมาเคยเป็นแบบนั้นตอนหนุ่ม ปล่อยให้เขาร้อนไปก่อน แล้วค่อยๆ เย็นเอง"

  - id: sumet_o_thongbai
    topic: others
    npc: "ป้าทองใบชิมแกงทุกหม้อในโรงครัววัดก่อนถวายนะโยม… อาตมาเคยถามว่าทำไม ป้าบอก ‘ถ้าจืดพระไม่บ่น แต่ป้าบ่นตัวเองทั้งคืน’"
    options:
      - text: "แกงป้าทองใบอร่อยไหม{kq}"
        heart: 1
        reply: "อร่อยโยม… แต่อาตมาไม่ควรพูดว่าอร่อย พระฉันเพื่อยังชีพ อาตมาขอพูดว่า ‘ฉันได้ทุกหม้อ’ ก็แล้วกัน"
      - text: "ป้าทองใบปากร้ายจริงเหรอ{kq}"
        heart: 1
        reply: "ปากไวโยม… แต่ทุกงานศพในตำบล ป้าทองใบเป็นคนแรกที่ไปตั้งหม้อ ไม่มีใครต้องขอ"
      - text: "{p}ไปช่วยครัวได้ไหม{kq}"
        heart: 2
        reply: "ได้โยม แต่ต้องทนเสียง ‘จืด!’ ให้ได้นะ… ป้าตะโกนคำนี้ใส่ทุกหม้อแม้แต่หม้อที่ป้าทำเอง"

  - id: sumet_o_ann
    topic: others
    npc: "หมอแอนขอใช้ศาลาตรวจสุขภาพผู้สูงอายุทุกเดือน… อาตมาให้ใช้ทั้งศาลา แล้วอาตมาก็ถูกตรวจด้วย หมอแอนบอกเข่าอาตมาแก่กว่าอายุสิบปี"
    options:
      - text: "หลวงพ่อจะพักเข่าไหม{kq}"
        heart: 1
        reply: "อาตมารับปากหมอแอนแล้วโยม… วันรุ่งขึ้นอาตมาลืม ถอนหญ้าแบบนั่งยองๆ ไปครึ่งแปลง หมอแอนเดินผ่านมาพอดี อาตมาอาย"
        next:
          - text: "{p}จะเอาม้านั่งเตี้ยมาถวาย"
            heart: 2
            reply: "อนุโมทนาโยม… ถ้ามีม้านั่ง อาตมาจะไม่มีข้ออ้างกับหมอแอนอีก อาตมาว่านั่นคือเหตุผลที่โยมจะเอามาให้"
          - text: "หมอแอนดุไหม{kq}"
            heart: 1
            reply: "ไม่ดุโยม หมอแอนแค่มองแล้วถอนหายใจ… แรงกว่าดุอีก"
      - text: "หมอแอนทำงานหนักจัง"
        heart: 1
        reply: "หนักโยม… บางคืนอาตมาเห็นไฟ รพ.สต. ยังเปิดอยู่ตอนอาตมาลุกมาทำวัตรเช้า อาตมาแผ่เมตตาไปทางนั้นทุกคืน"

quests:
  - id: sumet_q1
    npc: sumet
    title: "ต้นไม้ของเด็กๆ"
    desc: "พระอาจารย์ชวนปลูกกล้าไม้ในป่าชุมชนหลังวัดกับเด็กๆ"
    start: { heart_min: 1, day_min: 3 }
    offer:
      npc: "เสาร์นี้อาตมาจะพาเด็กๆ ปลูกต้นไม้ในป่าหลังวัดนะโยม… ขาดกล้าอีกสามต้น ถ้าโยมช่วยหามาได้ เด็กจะได้ปลูกครบทุกคน"
      options:
        - text: "ได้{k} {p}จะไปเอากล้าที่สหกรณ์"
          accept: true
          heart: 2
          reply: "อนุโมทนาโยม… กล้ามีกล้าไม้ให้ ไม่แพง แล้วเสาร์นี้มาช่วยขุดหลุมด้วยนะ เด็กขุดได้ลึกแค่ฝ่ามือ"
        - text: "ปลูกแล้วจะรอดเหรอ{kq} หน้าแล้งนะ"
          accept: true
          heart: 1
          reply: "รอดบ้างตายบ้างโยม… แต่ต้นที่รอดจะอยู่นานกว่าพวกเราทุกคน อาตมาคิดแค่นั้นก็มีแรงแล้ว"
        - text: "ไม่ว่าง{k}หลวงพ่อ"
          reply: "ไม่เป็นไรโยม ต้นไม้รอได้… ว่างเมื่อไหร่ค่อยมา"
    steps:
      - goal: { type: give, npc: sumet, item: tree_seedling, n: 3 }
        hint: "ซื้อกล้าไม้ 3 ต้นที่สหกรณ์สวนผัก แล้วนำไปถวายพระอาจารย์"
        done:
          npc: "กล้าประดู่สองต้น กล้ามะค่าหนึ่ง… โยมเลือกเองหรือกล้าเลือกให้ ต้นไม้พวกนี้อายุยืนกว่าวัดอีกนะโยม"
          options:
            - text: "กล้าเลือกให้{k}"
              heart: 1
              reply: "กล้ารู้ใจอาตมาดีโยม… ประดู่ ลุงจำรัสจะได้มีไม้ทำตู้บริจาคใบใหม่ในอีกห้าสิบปี ลุงคงรอไม่ไหวแต่ก็ดีใจ"
            - text: "{p}เลือกต้นที่โตช้าเองแหละ"
              heart: 2
              reply: "ทำไมล่ะโยม… อาตมาเดาว่าโยมอยากให้มีอะไรที่ไม่ต้องรีบ อาตมาเข้าใจ"
      - goal: { type: visit, place: temple, from: "06:00", to: "09:00" }
        hint: "ไปวัดตอนเช้าเพื่อช่วยเด็กๆ ปลูกต้นไม้ในป่าหลังวัด"
        done:
          npc: "เด็กๆ ตั้งชื่อต้นไม้ทุกต้นแล้วโยม… น้องโอ๊ตตั้งชื่อต้นมะค่าว่า ‘ไดโนเสาร์’ น้องมิวจะให้โยมตั้งชื่อต้นสุดท้าย"
          options:
            - text: "ชื่อ ‘ยายเพียร’ ได้ไหม{kq}"
              heart: 2
              set_flag: sumet_tree_gran
              reply: "ได้สิโยม… อาตมาจะให้เณรทำป้ายไม้เล็กๆ ปักไว้ ป้าแต๋วรู้เข้าคงมาไหว้ทุกวัน"
            - text: "ชื่อ ‘ถ่าน’ ตามหมาวัด"
              heart: 1
              set_flag: sumet_tree_than
              reply: "เณรต้นจะดีใจที่สุดในชีวิตโยม… ถ่านเองคงมานอนใต้ต้นทุกวัน มันรู้ว่าต้นไหนชื่อมัน"
            - text: "ให้เด็กตั้งเถอะ{k}"
              heart: 1
              reply: "น้องมิวตั้งว่า ‘ต้นของพี่’ โยม… เด็กๆ ตัดสินใจแทนโยมไปแล้ว อาตมาไม่แย้ง"
    sold_at: { tree_seedling: coop_garden }
    reward: { money: 0, heart: 2, items: { mango: 2 }, set_flag: sumet_q1_done, line: { from: sumet, text: "เจริญพร ป่าหลังวัดดงเย็นมีต้นไม้ใหม่ 24 ต้น ปลูกโดยเด็กๆ 23 คนกับญาติโยมอีกหลายท่าน อนุโมทนาทุกมือนะ 🌱 (ลุงจำรัสพิมพ์แทน)" } }

  - id: sumet_q2
    npc: sumet
    title: "หมุดสีส้มหลังวัด"
    desc: "มีหมุดรังวัดของบริษัทโผล่ริมป่าหลังวัด พระอาจารย์ต้องหาเอกสารที่ดินเก่า"
    start: { flag: sumet_q1_done, heart_min: 3, day_min: 6 }
    offer:
      npc: "เมื่อเช้าเณรเจอหมุดไม้ทาสีส้มปักอยู่ริมป่าหลังวัดสามหมุดนะโยม… คนเสื้อสะท้อนแสงมาปักเมื่อวาน อาตมาไม่อยากเดาอะไร แต่อยากรู้ให้แน่ว่าแนวเขตป่าอยู่ตรงไหน"
      options:
        - text: "{p}ช่วยหาเอกสารให้{k}"
          accept: true
          heart: 2
          reply: "อนุโมทนาโยม… เอกสารเก่าทั้งหมดอยู่ในหีบใต้ธรรมาสน์ ลุงจำรัสถือกุญแจ ไปขอลุงเปิดก่อนนะ ลุงจะจดว่าใครเปิดกี่โมง"
        - text: "บริษัทมาปักหมุดในที่วัดเหรอ{kq}"
          accept: true
          heart: 1
          reply: "อาจไม่ใช่ในที่วัดโยม อาจเป็นที่ติดกัน… อาตมาไม่อยากโกรธใครก่อนรู้ความจริง ช่วยอาตมาหาความจริงก่อนนะ"
        - text: "ถอนหมุดทิ้งเลยสิ{k}"
          reply: "ถอนได้ แต่ถ้าเราผิด เราจะแก้ยากโยม… ถ้าเปลี่ยนใจอยากช่วยหาเอกสาร มาบอกอาตมานะ"
    steps:
      - goal: { type: talk, npc: jamrat }
        hint: "ไปขอลุงจำรัสเปิดหีบเอกสารเก่าใต้ธรรมาสน์"
        done:
          npc: "หีบใต้ธรรมาสน์เหรอหลาน… ลุงเปิดได้ แต่ต้องเปิดตอนเย็นหลังทำวัตร ลุงต้องจดว่าเปิดวันไหน กี่โมง ใครอยู่ด้วย สองคนเป็นพยานกัน หลานมาตอนห้าโมงเย็นนะ"
          options:
            - text: "ได้{k}ลุง ห้าโมงตรง"
              heart: 1
              reply: "ห้าโมงตรง ไม่ใช่ห้าโมงสิบนะหลาน… ลุงจดไว้แล้ว หลานเป็นพยานคนที่สอง หลวงพ่อเป็นคนแรก"
            - text: "ทำไมต้องเปิดตอนเย็น{kq}"
              heart: 0
              reply: "ตอนเช้าคนมาเช่าผ้ายันต์ลุงไม่ว่าง ตอนบ่ายร้อนเหงื่อหยดใส่กระดาษเก่า… ตอนเย็นดีที่สุด ลุงคิดมาแล้ว"
      - goal: { type: visit, place: temple, from: "17:00", to: "19:00" }
        hint: "ไปวัดตอนห้าโมงเย็นเพื่อเปิดหีบเอกสารกับลุงจำรัส"
        done:
          npc: "นี่ไงโยม โฉนดป่าหลังวัด… ไม่ใช่ที่วัดตั้งแต่แรก เป็นที่ที่มีคนถวายเมื่อสิบสองปีก่อน ช่องผู้ถวายเขียนว่า ‘ไม่ประสงค์ออกนาม’… แล้วก็มีกระดาษอีกแผ่นพับซ้อนอยู่ข้างใน ลายมือเหมือนใครบางคน"
          options:
            - text: "ลายมือยาย{p}…"
              heart: 2
              reply: "อาตมาก็จำได้โยม… ลายมือที่เขียนชื่อในสมุดใส่บาตรทุกปีใหม่ อาตมาจะไม่อ่าน ให้โยมอ่านเองนะ มันเป็นของโยม"
            - text: "หลวงพ่ออ่านให้ฟังได้ไหม{kq}"
              heart: 1
              reply: "อาตมาว่าโยมควรอ่านเองนะ… อาตมาจะนั่งอยู่ข้างๆ ลุงจำรัสก็จะนั่งเงียบๆ ไม่จด ลุงสัญญาแล้ว"
      - goal: { type: talk, npc: sumet }
        hint: "อ่านหน้ากระดาษนั้นต่อหน้าพระอาจารย์"
        done:
          npc: "… โยมอ่านเสร็จแล้ว น้ำตาไหลไม่ต้องเช็ดนะโยม อาตมาก็ไหล ‘ที่นาแปลงนี้เป็นที่ตาเขา ตาชอบนั่งใต้ต้นไม้แต่นาไม่มีต้นไม้สักต้น ท่านสุเมธอยากปลูกป่า ฉันให้ท่านไป ไม่ต้องบอกใคร ป่าจะได้เก็บน้ำให้ทุกคนตอนแล้ง ตาคงได้ร่มสักที’… สิบสองปีที่อาตมาปลูก อาตมาปลูกในนาของตาโยม"
          options:
            - text: "ยายไม่เคยเล่าเลย"
              heart: 2
              reply: "โยมเพียรไม่อยากให้อาตมารู้สึกติดค้างโยม… อาตมาเคยถามลุงจำรัสว่าใครถวาย ลุงบอกว่าไม่รู้ ลุงไม่โกหกหรอก ลุงไม่รู้จริงๆ โยมเพียรเก่งเรื่องเงียบกว่าทุกคน"
            - text: "แล้วหมุดสีส้มล่ะ{kq}"
              heart: 1
              reply: "โฉนดชัดเจนโยม หมุดอยู่นอกเขตป่าสองเมตร… แต่อาตมาจะไปคุยกับคุณธนาเอง ว่าสองเมตรนั้นเขาจะใช้ทำอะไร ใกล้ต้นไม้ของตาเกินไป"
    reward: { money: 0, heart: 2, set_flag: diary_sumet, line: { from: sumet, text: "เจริญพร ญาติโยมที่ผ่านป่าหลังวัด ขอความกรุณาอย่าถอนหมุดใดๆ เอง อาตมาจะเป็นผู้ไปสอบถามเจ้าของหมุดเองนะ อนุโมทนา 🙏 (ลุงจำรัสพิมพ์แทน)" } }

  - id: sumet_q3
    npc: sumet
    title: "ชื่อที่ไม่อยากให้ใครรู้"
    desc: "ยายเพียรถวายที่ทำป่าโดยไม่ออกนาม… จะบอกตำบลไหม"
    start: { flag: diary_sumet, heart_min: 4 }
    offer:
      npc: "อาตมาคิดมาหลายคืนแล้วโยม… ญาติโยมควรรู้ไหมว่าป่าหลังวัดคือนาของตาโยม โยมเพียรไม่อยากให้ใครรู้ แต่ตอนนี้มีคนมาปักหมุดข้างๆ ความเงียบอาจไม่ได้ปกป้องอะไรแล้ว… อาตมาอยากให้โยมเป็นคนเลือก"
      options:
        - text: "ขอ{p}คิดก่อนนะ{kq}"
          accept: true
          heart: 1
          reply: "คิดให้เต็มที่โยม… ระหว่างคิด พรุ่งนี้เช้ามาใส่บาตรแล้วเดินเข้าป่าไปด้วยกันนะ ไปนั่งใต้ต้นแรกที่โยมเพียรเลือก"
        - text: "หลวงพ่อเลือกเถอะ{k}"
          accept: true
          heart: 0
          reply: "อาตมาเลือกแทนไม่ได้โยม… มันเป็นนาของตาโยม เป็นความเงียบของยายโยม อาตมาแค่ช่วยถือไว้มาสิบสองปี"
        - text: "เรื่องนี้หนักเกินไปสำหรับ{p}"
          reply: "อาตมาเข้าใจโยม… วางไว้ก่อน ป่ามันรอได้ ต้นไม้ไม่รีบ"
    steps:
      - goal: { type: give, npc: sumet, item: mango, n: 1 }
        hint: "นำมะม่วงจากต้นของยายไปถวายพระอาจารย์ตอนเช้า"
        done:
          npc: "มะม่วงต้นของโยมเพียร… อาตมาจะนำไปวางใต้ต้นแรกก่อนฉัน ให้ตาโยมกับยายโยมได้ชิมก่อน อาตมาถือว่าเป็นเจ้าของนาเจ้าเก่า"
          options:
            - text: "ขอบคุณ{k}หลวงพ่อ"
              heart: 1
              reply: "ไม่ต้องขอบใจโยม… อาตมาค้างคำขอบใจโยมเพียรมาสิบสองปี วันนี้ได้คืนนิดหนึ่ง"
            - text: "ยายชอบมะม่วงเปรี้ยวๆ แบบนี้"
              heart: 1
              reply: "อาตมารู้โยม… โยมเพียรเคยบอกว่าหวานเกินไปมันไม่จำ เปรี้ยวนิดๆ คนจะจำได้นาน"
      - goal: { type: visit, place: temple, from: "06:00", to: "08:00" }
        hint: "ไปวัดตอนเช้าตรู่ เดินเข้าป่าหลังวัดกับพระอาจารย์"
        done:
          npc: "ต้นนี้แหละโยม ต้นแรก… ตอนนั้นสูงแค่เข่าอาตมา โยมเพียรเดินมาดูทุกเย็นช่วงปีแรก อาตมานึกว่ายายมาเดินเล่น ที่แท้ยายมาเยี่ยมตา… โยมคิดออกหรือยังว่าจะเอาอย่างไร"
          options:
            - text: "ยังไม่แน่ใจ{k} ขอนั่งอีกหน่อย"
              heart: 1
              reply: "นั่งเถอะโยม อาตมาจะไปก่อน… ใต้ต้นนี้ไม่มีใครเร่งใคร ตาโยมคงชอบให้มีคนมานั่งนานๆ"
            - text: "คิดออกแล้ว{k}"
              heart: 1
              reply: "งั้นค่อยๆ บอกอาตมานะโยม ไม่ต้องรีบ… บอกตอนเรากลับไปถึงศาลาก็ได้"
      - goal: { type: talk, npc: sumet }
        hint: "บอกพระอาจารย์ว่าจะทำอย่างไรกับความลับของยาย"
        done:
          npc: "เจริญพร… บอกอาตมาได้แล้วโยม อาตมาฟังอยู่"
          options:
            - text: "ติดป้ายชื่อยายกับตาไว้ที่ต้นแรก"
              heart: 2
              set_flag: sumet_name_gran
              reply: "อนุโมทนาโยม… ป้ายไม้เล็กๆ ไม่ต้องใหญ่ ‘ป่านี้ปลูกในนาของตาและยายเพียร’ ใครผ่านมาจะได้รู้ว่าร่มนี้มีเจ้าของใจดี แล้วใครจะมาปักหมุดก็ต้องอ่านป้ายนี้ก่อน"
            - text: "เก็บไว้เป็นความลับเหมือนที่ยายอยากให้เป็น"
              heart: 2
              set_flag: sumet_keep_secret
              reply: "อาตมาเคารพใจโยม… และใจยายโยมด้วย ความลับนี้จะอยู่กับอาตมา ลุงจำรัส และโยม สามคนพอแล้ว ป่ามันรู้อยู่แล้วว่าใครให้"
            - text: "ใช้โฉนดนี้ขึ้นทะเบียนป่าชุมชนให้ถูกต้อง"
              heart: 1
              set_flag: sumet_forest_register
              reply: "ความคิดดีโยม… ถ้าขึ้นทะเบียนเป็นป่าชุมชน ไม่ว่าวันหน้าอาตมาจะอยู่หรือไม่อยู่ ใครก็ถางไม่ได้ อาตมาจะชวนปาล์มจาก อบต. มาช่วยเรื่องเอกสาร ไม่ต้องบอกชื่อยายก็ได้ ให้ป่าเป็นของทุกคนไปเลย"
    reward: { money: 0, heart: 2, items: { lotus_flower: 3 }, set_flag: sumet_q3_done }

  - id: sumet_q4
    npc: sumet
    title: "ฝายในฝัน"
    desc: "พระอาจารย์อยากซ่อมฝายเก่าที่หลวงตาเคยสร้าง ก่อนหน้าแล้งจะมาถึง"
    start: { flag: sumet_q3_done, heart_min: 6, day_min: 15 }
    offer:
      npc: "อาตมาเคยเล่าว่าฝันถึงฝายใช่ไหมโยม… ปีนี้น้ำใต้ดินลดเร็วมาก ถ้ามีฝายเก็บน้ำฝนไว้ในลำห้วย บ่อทั้งตำบลจะได้น้ำซึมกลับ อาตมาไม่อยากฝันอย่างเดียวแล้ว"
      options:
        - text: "เริ่มเลย{k}หลวงพ่อ {p}ช่วย"
          accept: true
          heart: 2
          reply: "อนุโมทนาโยม… ฝายแบบชาวบ้านใช้หิน ไม้ กับแรงคน ไม่ต้องใช้เงินมาก แต่ต้องมีคนเชื่อว่ามันจะเสร็จ"
        - text: "ฝายมันอยู่นอกตำบลนะ{kq}"
          accept: true
          heart: 1
          reply: "อยู่ท้ายห้วยโยม ไม่ไกล… โยมช่วยตรงนี้ก่อน รวบรวมหินกับปัจจัย ส่วนวันลงแรงทั้งตำบลจะไปพร้อมกัน"
        - text: "รอ อบต. ทำดีกว่า{k}"
          reply: "อาตมาก็รอมาสิบปีโยม… ไม่เป็นไร ถ้าเปลี่ยนใจ ฝันยังอยู่ที่เดิม"
    steps:
      - goal: { type: pay, npc: jamrat, n: 500 }
        hint: "ร่วมทำบุญกองทุนฝายกับลุงจำรัส 500 บาท"
        done:
          npc: "กองทุนฝาย ห้าร้อย ลุงลงบัญชีเล่มใหม่แล้ว เล่มนี้หน้าปกลุงเขียนว่า ‘ฝายหลวงตา’… หลานเป็นคนแรกนะ ลุงเป็นคนที่สอง ลุงหยอดไปร้อยหนึ่ง อย่าบอกใคร"
          options:
            - text: "ลุงหยอดด้วยเหรอ{kq}"
              heart: 1
              reply: "ลุงเกิดริมห้วยนั้นนะหลาน ตอนฝายหลวงตายังอยู่ ลุงเคยจับปลาซิวที่นั่นทุกเย็น… ลุงอยากให้หลานลุงได้จับบ้าง"
            - text: "ติดยอดหน้าศาลาด้วยนะ{kq}"
              heart: 1
              reply: "ติดทุกวันหลาน ตัวใหญ่ๆ ให้คนเห็นว่ายอดขึ้น… คนเห็นยอดขึ้นจะอยากหยอด ลุงรู้จิตวิทยาตู้บริจาคดี"
      - goal: { type: give, npc: sumet, item: stone, n: 10 }
        hint: "เก็บหินจากฟาร์ม 10 ก้อนไปให้พระอาจารย์ใช้ทำแนวฝาย"
        done:
          npc: "หินสิบก้อน… เณรต้นนับแล้วนับอีก ได้สิบเอ็ด เณรนับถ่านไปด้วย อาตมาจะกองไว้หน้าศาลา ใครเห็นจะได้รู้ว่าฝายเริ่มแล้ว หินก้อนแรกสำคัญที่สุด"
          options:
            - text: "ต้องใช้อีกเยอะไหม{kq}"
              heart: 1
              reply: "อีกหลายร้อยก้อนโยม… แต่ตอนนี้อาตมาเห็นป้าแต๋วแบกมาหนึ่งก้อน ลุงสมหมายแบกมาสองก้อน บอกว่าเลขสอง ดีแล้ว ใครแบกมาด้วยเหตุผลอะไรก็ได้"
            - text: "หินพวกนี้จากนายาย{k}"
              heart: 2
              reply: "งั้นฝายนี้ก็มีส่วนของโยมเพียรอีกแล้วโยม… ยายโยมอยู่ในทุกอย่างที่อาตมาทำเลยนะ อาตมาเพิ่งรู้ปีนี้เอง"
      - goal: { type: talk, npc: ton }
        hint: "ไปหาเณรต้น เณรมีอะไรจะบอก"
        done:
          npc: "พี่ครับ! เสี่ยเฮงมาที่วัดครับ บอกหลวงพ่อว่าจะให้รถบรรทุกหินฟรีสิบเที่ยว แต่ต้องติดป้ายชื่อร้านที่ฝายครับ… แล้วผู้ใหญ่ก็มาบอกว่า อบต. อาจมีงบปีหน้าครับ หลวงพ่อนั่งนิ่งนานมากเลยครับ ผมนับได้สามร้อยวินาที"
          options:
            - text: "ขอบใจนะเณร"
              heart: 1
              reply: "ไม่เป็นไรครับ… พี่ไปหาหลวงพ่อนะครับ หลวงพ่อนั่งนิ่งนานกว่านี้เดี๋ยวขาชาครับ"
            - text: "เณรอยากให้ทำแบบไหน{kq}"
              heart: 1
              reply: "ผมอยากให้ทุกคนไปแบกหินด้วยกันครับ มีข้าวเหนียวไก่ย่างเหมือนลงแขก… แต่ผมเป็นเณร ผมไม่ได้เลือกครับ"
      - goal: { type: talk, npc: sumet }
        hint: "ช่วยพระอาจารย์ตัดสินใจเรื่องวิธีสร้างฝาย"
        done:
          npc: "สามทางนะโยม… ลงแรงกันเองช้าแต่เป็นของทุกคน รับรถเสี่ยเฮงเร็วแต่มีป้าย รอ อบต. ไม่ต้องเหนื่อยแต่ไม่รู้เมื่อไหร่… อาตมาไม่เคยเลือกอะไรยากขนาดนี้ตั้งแต่บวช"
          options:
            - text: "วันลงแรงทั้งตำบล{k} ช้าแต่เป็นของเรา"
              heart: 2
              set_flag: sumet_weir_community
