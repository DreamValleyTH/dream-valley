# พระอาจารย์สุเมธ — เจ้าอาวาสวัดดงเย็น (อบอุ่น ไม่มีตลกร้าย ไม่พูดเรื่องเงิน/หวย) · ตัวหลัก 34–40 บท
convos:
  # ===== react =====
  - id: sumet_r_meet
    topic: react
    once: true
    when: { not_flag: met_sumet }
    npc: "เจริญพร หลานโยมเพียรใช่ไหม… โยมเพียรใส่บาตรอาตมาทุกเช้ามาสิบสองปี ข้าวเหนียวปั้นเท่ากำปั้นเด็ก ไม่เคยใหญ่ขึ้นหรือเล็กลงเลย"
    set_flag: met_sumet
    options:
      - text: "ยายใส่บาตรทุกวันเลยเหรอ{kq}"
        heart: 1
        reply: "ทุกวันที่ขายังเดินได้นะโยม… วันที่เดินไม่ไหว โยมเพียรฝากป้าแต๋วมาแทน แล้วฝากบอกอาตมาว่า ‘พรุ่งนี้มาเอง’"
        next:
          - text: "พรุ่งนี้{p}มาใส่บาตรแทนยาย{k}"
            heart: 2
            reply: "อนุโมทนาโยม… ไม่ต้องปั้นให้เท่ายายหรอกนะ ใจเท่ากันก็พอแล้ว"
          - text: "ยายมาวัดบ่อยไหม{kq}"
            heart: 1
            reply: "บ่อยนะโยม แต่ไม่ค่อยขึ้นศาลา ชอบนั่งใต้ต้นมะขามหลังวัด นั่งเฉยๆ… อาตมาไม่เคยถามว่าคิดอะไร คนบางคนมาวัดเพื่อเงียบ"
      - text: "นมัสการ{k}พระอาจารย์"
        heart: 1
        reply: "เจริญพร มาอยู่ใหม่ใช่ไหมโยม ไม่ต้องเกร็ง วัดนี้ไม่มีพิธีรีตองมาก มีแต่ใบมะขามให้กวาดเยอะ"
      - text: "{p}ไม่ค่อยได้เข้าวัด{k}"
        heart: 0
        reply: "ไม่เป็นไรโยม วัดไม่ได้นับว่าใครมากี่ครั้ง… ผ่านมาเมื่อไหร่ แวะมานั่งพักร่มโพธิ์ได้เสมอ"

  - id: sumet_r_fainted
    topic: react
    when: { fainted_recent: true }
    npc: "เจริญพร… หน้ายังซีดอยู่นะโยม มานั่งใต้โพธิ์ก่อน อาตมาจะให้เณรตักน้ำมาให้"
    options:
      - text: "ขอบคุณ{k} เมื่อคืนกลับดึกไป"
        heart: 1
        reply: "ดึกไปหน่อยไม่เป็นไร แต่ครั้งหน้าถ้ารู้ว่าไม่ทัน เลี้ยวเข้าวัดก่อนนะโยม ศาลามีเสื่อ ไม่ต้องบอกใคร"
      - text: "กลัวจนตัวสั่นเลย{k}"
        heart: 1
        reply: "กลัวไม่ใช่เรื่องน่าอายโยม… หายใจเข้ายาวๆ ช้าๆ แบบนี้ ความกลัวมันก็เหมือนน้ำขุ่น นิ่งแล้วตะกอนก็ลง"
        next:
          - text: "ทำแบบนั้นแล้วผีจะหายไหม{kq}"
            heart: 0
            reply: "ผีจะหายไหมอาตมาไม่รับปาก แต่ขาโยมจะไม่สั่นจนวิ่งลงคูน้ำ… นั่นช่วยได้มากแล้ว"
          - text: "หลวงพ่อเคยกลัวไหม{kq}"
            heart: 2
            reply: "เคยสิโยม ตอนบวชใหม่ อาตมาเดินจงกรมหลังโบสถ์แล้วได้ยินเสียงกอย กอย… วิ่งกลับกุฏิเร็วกว่าตอนเป็นเด็กเลี้ยงควายเสียอีก"
      - text: "ไม่เป็นไร{k} ไปทำงานต่อได้"
        heart: 0
        reply: "ไปได้โยม แต่ทำครึ่งเดียวของทุกวันนะ ร่างกายก็เหมือนควาย ไถหนักแล้วต้องให้มันพัก"

  - id: sumet_r_thana
    topic: react
    once: true
    when: { flag: story_thana_visit }
    npc: "ได้ยินว่าคุณธนาไปขอซื้อที่ของโยมเพียร… อาตมาไม่ได้มาถามว่าโยมจะตอบอย่างไรหรอก อาตมามาถามว่าใจโยมหนักไหม"
    options:
      - text: "หนัก{k} ไม่รู้จะทำยังไงดี"
        heart: 1
        reply: "ไม่ต้องรู้วันนี้โยม… ลองเดินรอบที่ดินยายสักรอบ ช้าๆ ตอนเช้า ดูว่าตรงไหนที่โยมไม่อยากเสียไป คำตอบมักซ่อนอยู่ตรงนั้น"
        next:
          - text: "หลวงพ่อว่ายายจะอยากให้ขายไหม{kq}"
            heart: 1
            reply: "อาตมาตอบแทนโยมเพียรไม่ได้หรอก… รู้แต่ว่าโยมเพียรรดน้ำต้นไม้ทุกต้นด้วยมือ คนที่อยากขายที่ไม่ค่อยรดน้ำทุกต้นนะโยม"
          - text: "{p}จะลองเดินดู{k}"
            heart: 1
            reply: "ดีแล้ว เดินแล้วเหนื่อยก็แวะมาวัด อาตมามีน้ำใบเตย ป้าทองใบต้มไว้"
      - text: "ไม่หนัก{k} {p}ไม่ขายอยู่แล้ว"
        heart: 1
        reply: "ใจนิ่งดีนะโยม… แต่ไม่ต้องโกรธเขานะ คนมาขอซื้อก็แค่ทำงานของเขา โยมทำงานของโยม รักษาสิ่งที่รัก"
      - text: "ถ้าราคาดี ขายก็ไม่ผิดนี่{kq}"
        heart: 0
        reply: "ไม่ผิดหรอกโยม ที่ดินเป็นของโยมแล้ว… อาตมาขอแค่อย่าตัดสินใจตอนเหนื่อยหรือตอนกลัว สองเวลานั้นคนเราขายของถูกเกินไปเสมอ"

  - id: sumet_r_meeting1
    topic: react
    once: true
    when: { flag: story_meeting1 }
    npc: "ประชุมที่ศาลาเมื่อวาน อาตมานั่งฟังอยู่ข้างหลัง ไม่ได้ออกเสียงหรอกโยม พระไม่โหวต… แต่อาตมาเห็นโยมยกมือ"
    options:
      - text: "หลวงพ่อเห็นด้วยไหม{kq}"
        heart: 1
        reply: "อาตมาเห็นด้วยกับการที่โยมยกมือนะ… โหวตอะไรนั้นเป็นใจของโยม การกล้ายกมือในที่ที่คนส่วนใหญ่นั่งเฉย อันนั้นอาตมาอนุโมทนา"
      - text: "คนนั่งหลับเยอะเลย{k}"
        heart: 1
        reply: "ประชุมยาวเกินไปก็เหมือนเทศน์ยาวนั่นแหละโยม… อาตมาเลยไม่ชอบเทศน์ยาว เข้าใจญาติโยมดี"
        next:
          - text: "กำนันหลับคนแรกเลย"
            heart: 0
            reply: "กำนันท่านตื่นมาทำนาตั้งแต่ตีสี่โยม… อาตมาไม่ว่าคนหลับ อาตมาห่วงคนที่ตื่นแต่ไม่ฟังมากกว่า"
          - text: "หลวงพ่อไม่ง่วงเหรอ{kq}"
            heart: 1
            reply: "ง่วงโยม อาตมานั่งทำสมาธิกันหลับ… ได้ผลครึ่งหนึ่ง อีกครึ่งเณรต้นสะกิด"
      - text: "เงินครึ่งหนึ่งไปศึกษาความเป็นไปได้ หลวงพ่อว่าไง{kq}"
        heart: 0
        reply: "อาตมาไม่ถนัดเรื่องงบโยม… แต่ถ้าศึกษาแล้ว ขอให้ศึกษาจนเห็นความทุกข์ของชาวบ้านจริงๆ ก็คงไม่เสียเปล่า"

  - id: sumet_r_well
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "บ่อหลายบ้านแห้งแล้วนะโยม… บ่อวัดยังมีน้ำอยู่ อาตมาให้ลุงจำรัสตั้งโอ่งไว้หน้าศาลา ใครขาดน้ำมาตักได้ ไม่ต้องขอ"
    options:
      - text: "แล้วน้ำวัดจะพอเหรอ{kq}"
        heart: 1
        reply: "ไม่รู้โยม… อาตมาให้ลุงจำรัสจดระดับน้ำทุกเช้า ถ้าลดลงมาก เราค่อยแบ่งกันให้ละเอียดขึ้น แบ่งกันใช้ดีกว่าเก็บไว้คนเดียวแล้วแห้งไปพร้อมกัน"
        next:
          - text: "{p}มาช่วยตักแจกได้นะ{kq}"
            heart: 2
            reply: "อนุโมทนาโยม คนแก่หลายบ้านแบกถังไม่ไหว ถ้าโยมช่วยหิ้วไปส่งได้ บุญนั้นหนักกว่าถังน้ำอีก"
          - text: "ทำไมบ่อวัดยังไม่แห้ง{kq}"
            heart: 1
            reply: "อาตมาว่าเพราะป่าหลังวัดนะโยม ต้นไม้เก็บน้ำไว้ใต้ดินให้… ปลูกไว้สิบปี เพิ่งเห็นผลก็ปีนี้"
      - text: "เป็นเพราะบริษัทใช่ไหม{kq}"
        heart: 0
        reply: "อาตมาไม่กล่าวหาใครโยม… แต่ถ้าใครสูบน้ำมากกว่าที่เขาบอก ความจริงมันจะปรากฏเหมือนน้ำลดแล้วเห็นตอ"

  - id: sumet_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "คนงานบริษัทมานิมนต์อาตมาไปทำบุญที่ดินเขา บอกว่ามีผีรบกวน… อาตมารับไปสวดให้นะโยม คนงานเขากลัวจริง"
    options:
      - text: "หลวงพ่อไปช่วยบริษัทเหรอ{kq}"
        heart: 1
        reply: "อาตมาไปช่วยคนงานโยม เขาเป็นลูกหลานตำบลข้างๆ มาทำงานหาเงินส่งแม่… ความกลัวของเขาไม่ได้มีโลโก้บริษัทติดอยู่"
        next:
          - text: "หลวงพ่อใจกว้างมาก"
            heart: 1
            reply: "ไม่ได้กว้างหรอกโยม อาตมาแค่จำได้ว่าตอนเป็นเด็กเลี้ยงควาย อาตมาก็กลัวผีแบบเขา ไม่มีใครมาสวดให้เลย"
          - text: "แล้วเห็นอะไรที่นั่นไหม{kq}"
            heart: 1
            reply: "เห็นท่อเยอะมากโยม… อาตมาสวดเสร็จ คนงานคนหนึ่งกระซิบว่า ‘หลวงพ่อ น้ำมันออกมาแรงกว่าที่เขาบอก’ อาตมาเก็บไว้ในใจ"
      - text: "ยายบัวว่าผีไม่ชอบคนดูดน้ำ"
        heart: 1
        reply: "ยายบัวพูดแบบชาวบ้าน อาตมาพูดแบบพระ… น้ำใต้ดินเป็นของแผ่นดิน ใครเอาไปมากเกินไป ใจคนทั้งตำบลมันก็ไม่สงบ จะเรียกว่าผีหรืออะไรก็ได้"

  - id: sumet_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ประชุมครั้งที่สอง ญาติโยมแตกเป็นสองฝ่าย… คืนนั้นอาตมาสวดแผ่เมตตานานกว่าทุกคืน ให้ทั้งสองฝ่ายเท่ากัน"
    options:
      - text: "หลวงพ่ออยู่ฝ่ายไหน{kq}"
        heart: 0
        reply: "อาตมาอยู่ฝ่ายที่อยากให้ตำบลนี้ยังทักทายกันได้ตอนตลาดนัดโยม… เถียงกันได้ แต่อย่าเลิกซื้อผักร้านเดียวกัน"
      - text: "คนทะเลาะกันหนักเลย{k}"
        heart: 1
        reply: "หนักโยม ป้าทองใบกับป้าพรไม่คุยกันมาสองวัน… อาตมาเลยให้สองคนช่วยกันทำแกงเลี้ยงพระหม้อเดียวกันวันพระ"
        next:
          - text: "แล้วได้ผลไหม{kq}"
            heart: 1
            reply: "แกงเค็มไปนิดโยม ต่างคนต่างใส่น้ำปลาไม่บอกกัน… แต่หลังล้างหม้อ สองคนนั่งบ่นแกงด้วยกันจนค่ำ อาตมาถือว่าสำเร็จ"
          - text: "หลวงพ่อฉลาดนะ"
            heart: 1
            reply: "ไม่ได้ฉลาดหรอกโยม เรียนมาจากโยมเพียร… ตอนชาวบ้านทะเลาะเรื่องน้ำปีก่อนๆ โยมเพียรชวนทุกคนมาตำน้ำพริกครกเดียวกัน"
      - text: "ถังน้ำแจกฟรีก็ดีนะ{kq}"
        heart: 0
        reply: "ดีโยม ถังใส่น้ำได้… อาตมาแค่ถามคุณธนาว่า ถ้าไม่มีน้ำจะใส่ถัง จะใส่อะไร เขายิ้มแล้วบอกว่าจะกลับไปศึกษาดู"

  - id: sumet_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ช่วงหาเสียงแล้ว มีคนจะถวายพัดลมสิบตัวพร้อมรูปตัวเองติดทุกตัว… อาตมาขอรับพัดลม แต่ขอไม่รับรูปนะโยม"
    options:
      - text: "เขายอมไหม{kq}"
        heart: 1
        reply: "ลุงจำรัสนั่งแกะสติกเกอร์ออกครึ่งวัน… พัดลมยังเย็นเหมือนเดิมโยม ลมมันไม่รู้หรอกว่าใครเป็นคนถวาย"
      - text: "หลวงพ่อจะบอกให้เลือกใครไหม{kq}"
        heart: 1
        reply: "ไม่บอกโยม อาตมาบอกได้อย่างเดียว ให้ฟังว่าใครสัญญาอะไร แล้วจดไว้ อีกสี่ปีจะได้เอามาเทียบ"
        next:
          - text: "ลุงจำรัสคงจดให้แล้วมั้ง"
            heart: 1
            reply: "จดแล้วโยม… ลุงซื้อสมุดเล่มใหม่สำหรับคำสัญญาโดยเฉพาะ หน้าแรกยังว่าง ไม่มีใครพูดอะไรที่จดได้เลย"
          - text: "{p}จะจดไว้เหมือนกัน{k}"
            heart: 2
            reply: "ดีแล้วโยม… คนที่จดคำสัญญาของคนอื่นไว้ ต้องจดของตัวเองด้วยนะ อาตมาเตือนเผื่อวันหน้าโยมลงสมัครเอง"
      - text: "การเมืองไม่เกี่ยวกับวัดหรอก{k}"
        heart: 0
        reply: "วัดไม่เลือกข้างโยม… แต่ญาติโยมทุกข้างก็มาวัดเดียวกัน อาตมาเลยต้องรักษาศาลานี้ให้ทุกคนนั่งได้"

  - id: sumet_r_lottery
    topic: react
    once: true
    when: { flag: bought_lottery }
    npc: "เจริญพร… อาตมาเห็นโยมถือสลากมาจากตลาด ไม่ได้ว่าอะไรนะ แค่จะบอกว่าอาตมาบอกเลขไม่เป็น ไม่ต้องถามเณรด้วยนะโยม"
    options:
      - text: "{p}ไม่ได้จะมาถาม{k}"
        heart: 1
        reply: "อนุโมทนาโยม… เณรต้นช่วงนี้นอนไม่ค่อยหลับ ชาวบ้านมาถามฝันทุกเช้า เด็กกลัวฝันผิด"
        next:
          - text: "{p}จะช่วยบอกคนอื่นให้เลิกถาม"
            heart: 2
            reply: "อาตมาขอบใจมากโยม… บอกเขาดีๆ นะ เขาไม่ได้ใจร้าย เขาแค่อยากมีความหวังสักงวด"
          - text: "เณรน่าสงสารนะ"
            heart: 1
            reply: "เด็กอายุสิบเอ็ดควรฝันถึงหมากับขนมนะโยม ไม่ใช่ฝันเผื่อคนทั้งตำบล"
      - text: "หลวงพ่อไม่เคยซื้อเลยเหรอ{kq}"
        heart: 0
        reply: "พระไม่ซื้อหรอกโยม… ตอนเป็นเด็กอาตมาเคยช่วยพ่อขูดต้นกล้วย พ่อไม่ถูกสักตัว แต่ได้กล้วยทอดกินทั้งบ้าน"

  - id: sumet_r_ton_quest
    topic: react
    once: true
    when: { flag: ton_q1_done }
