# น้องโอ๊ต (เด็ก ป.4) — convos + quests (เรื่องรอง: ว่าวตัวใหม่ ชื่อลูกควาย กล่องถึงพ่อ)
convos:
  # ===== react =====
  - id: oat_r_meet
    topic: react
    once: true
    when: { not_flag: met_oat }
    npc: "พี่ครับ! หยุดก่อน! อย่าเหยียบ! ตรงนั้นมีด้วงกว่างผมเดินอยู่… โอ๊ะ มันบินไปแล้ว สวัสดีครับ ผมชื่อโอ๊ต"
    set_flag: met_oat
    options:
      - text: "ขอโทษจ้ะ พี่ไม่เห็นเลย"
        heart: 1
        reply: "ไม่เป็นไรครับ มันบินเก่ง มันรอดแน่ ด้วงกว่างตัวนี้ผมตั้งชื่อว่าเจ้าแชมป์ เขามันยาวกว่านิ้วผม"
        next:
          - text: "เจ้าแชมป์ ชื่อเท่จัง"
            heart: 2
            reply: "ผมตั้งเองครับ! มิวบอกว่าชื่อเชย แต่มิวตั้งชื่อปลาว่าเจ้าจุ๋มจิ๋ม เชยกว่าอีก"
          - text: "เดี๋ยวพี่ช่วยหานะ"
            heart: 1
            reply: "ไม่ต้องครับ มันคงไปหากล้วยกิน ด้วงกว่างชอบกล้วยน้ำว้า ผมแอบเอาของแม่มาให้มันประจำ"
      - text: "พี่ไม่ได้เหยียบใช่ไหม"
        heart: 0
        reply: "ไม่ได้เหยียบครับ ถ้าเหยียบผมจะร้องไห้… ไม่ร้องครับ ผมผู้ชาย แต่จะเสียใจมากๆ"
      - text: "ด้วงกว่างอยู่กลางถนนได้ไง"
        heart: 1
        reply: "มันหลงทางครับ เหมือนพี่ตอนมาใหม่ๆ ไง ทุกคนบอกว่าพี่เดินหลงไปหลังวัดสองรอบ"

  - id: oat_r_meeting1
    topic: react
    once: true
    when: { flag: story_meeting1 }
    npc: "พี่ครับ ผมไปประชุมที่ศาลามาครับ ได้น้ำแดงสองแก้ว ขนมชั้นสามชิ้น แล้วก็ได้ฟังผู้ใหญ่ทะเลาะกันเรื่องถนน สนุกกว่าการ์ตูนอีก"
    options:
      - text: "สนุกตรงไหน"
        heart: 1
        reply: "ตอนเสี่ยเฮงพูดว่าถนนดีกับทุกคน แล้วป้าแต๋วบอก ‘ดีกับรถบรรทุกเสี่ยไง’ ทุกคนหัวเราะ เสี่ยหัวเราะด้วยแต่หน้าไม่ขำครับ"
        next:
          - text: "หนูจำเก่งจังเลย"
            heart: 2
            reply: "ผมจำทุกอย่างที่ตลกครับ เรื่องที่ไม่ตลกผมลืมหมด แม่บอกว่าเลยจำสูตรคูณไม่ได้"
          - text: "แล้วโอ๊ตเลือกอะไร"
            heart: 1
            reply: "ผมเลือกตลาดนัดครับ! แผงขนมครกแม่จะได้ใหญ่ขึ้น แต่ผมยังโหวตไม่ได้ ผมเลยยกมือตอนเขาให้ยกมือ ผู้ใหญ่บอกว่าไม่นับ"
      - text: "ไปทำไม เด็กไม่ต้องไปประชุมหรอก"
        heart: 0
        reply: "ไปเพราะน้ำแดงฟรีครับ… กับเพราะแม่ไปด้วย แม่ไปเพราะอยากได้ตลาดนัด"

  - id: oat_r_welldry
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "พี่ครับ คลองที่ผมเคยจับปลาซิว ตอนนี้ตื้นจนเห็นรองเท้าแตะที่ผมทำหายเมื่อปีที่แล้ว ผมไปเก็บมาแล้ว แต่ปลาซิวหายหมดเลยครับ"
    options:
      - text: "ปลาซิวคงไปหลบที่ลึกๆ"
        heart: 1
        reply: "ลุงพรานแดงบอกว่าไม่มีที่ลึกแล้วครับ ลุงพูดแล้วเงียบไปนาน ลุงไม่ค่อยพูดอยู่แล้ว แต่ครั้งนี้เงียบนานกว่าปกติ"
        next:
          - text: "เดี๋ยวฝนตกน้ำก็กลับมา"
            heart: 1
            reply: "จริงนะครับ! งั้นผมจะไหว้ขอฝนทุกเย็น ผมไหว้ศาลปู่ตาแล้วด้วย ปู่ตาน่าจะมีเส้นสายกับฝน"
          - text: "เป็นเพราะบริษัทดูดน้ำใช่ไหม"
            heart: 0
            reply: "ลุงพรานแดงก็พูดแบบนั้นครับ ผมถามแม่ แม่บอกให้ผมไปทำการบ้าน ผู้ใหญ่ชอบให้ทำการบ้านตอนคำถามยาก"
      - text: "รองเท้าแตะยังใส่ได้อยู่ไหม"
        heart: 1
        reply: "ใส่ได้ครับ! มีหอยติดอยู่สองตัว ผมเอาหอยไปปล่อยแล้ว รองเท้ายังเหม็นนิดหน่อย แม่ไม่ให้เข้าบ้าน"

  - id: oat_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "พี่ครับ ผมไม่กลัวผีที่ดินบริษัทเลยนะครับ ไม่เลย ผมแค่… ให้แม่เปิดไฟนอนเพราะผมอยากอ่านหนังสือการ์ตูน ทั้งคืน"
    options:
      - text: "อ่านการ์ตูนทั้งคืนเลยเหรอ"
        heart: 1
        reply: "ครับ… ผมอ่านเล่มเดิมสามรอบ ผมหลับไปตอนหน้าที่ผีโผล่ ไม่ใช่ผีจริงนะครับ ผีในการ์ตูน"
        next:
          - text: "กลัวผีไม่ใช่เรื่องน่าอายนะ"
            heart: 2
            reply: "จริงเหรอครับ… พี่ก็กลัวใช่ไหม ถ้าพี่กลัว ผมก็กลัวได้ ผมขอกลัวนิดเดียวพอ"
          - text: "พี่ไม่เชื่อหรอก โอ๊ตกลัวผีชัดๆ"
            heart: 0
            reply: "ไม่กลัวครับ! ผมแค่ระวัง แม่บอกว่าระวังกับกลัวคนละอย่าง"
      - text: "ยายบัวบอกว่าผีไม่ชอบคนดูดน้ำนะ"
        heart: 1
        reply: "งั้นผีอยู่ข้างปลาซิวผมครับ! ผมจะไม่กลัวผีตัวนี้แล้ว ผมจะกลัวผีตัวอื่นแทน"

  - id: oat_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "พี่ครับ ผมได้ถังเขียวมาใบนึง! ตีแล้วเสียงดังปึ้งๆ เหมือนกลองยาว ผมจะเอาไปตีตอนแห่เทียนพรรษา แม่บอกว่ามันเป็นถังใส่น้ำ"
    options:
      - text: "ถังกลองก็เท่ดีนะ"
        heart: 2
        reply: "ใช่ไหมครับ! ผมตีจังหวะแห่นาคได้ด้วย ปึ้ง ปึ้งปึ้ง ปึ้ง ลุงสมหมายได้ยินบอกว่าเป็นเลขหนึ่งสองหนึ่ง"
        next:
          - text: "ลุงสมหมายนี่นะ"
            heart: 1
            reply: "ลุงฟังอะไรก็เป็นเลขครับ ผมจามลุงยังจดเลย"
          - text: "ตีเบาๆ หน่อยนะ เดี๋ยวควายตกใจ"
            heart: 1
            reply: "ไอ้ทุยไม่ตกใจครับ มันเดินมาฟังด้วย ผมว่ามันชอบเพลงผม"
      - text: "เอาไปใส่น้ำให้แม่ดีกว่าไหม"
        heart: 1
        reply: "แม่มีถังสามใบแล้วครับ แต่ไม่มีน้ำใส่สักใบ… ผมเลยตีกลองได้ไง ถังว่างเสียงดังกว่าถังเต็ม ครูเต้ยสอน"

  - id: oat_r_dad
    topic: react
    once: true
    when: { flag: oat_q3_done }
    npc: "พี่ครับ! พ่อได้กล่องแล้ว! พ่อส่งรูปมา พ่อเอารูปวาดผมแปะไว้ที่เสาตึกชั้นสามสิบเอ็ด เพื่อนพ่อทั้งไซต์มาดู พ่อบอกว่ากล้วยตากหมดในห้านาที"
    options:
      - text: "พ่อคงภูมิใจในตัวโอ๊ตมาก"
        heart: 2
        reply: "พ่อบอกว่าภูมิใจครับ แล้วพ่อก็พูดว่า ‘ชั้นนี้ชั้นของโอ๊ต’ ตึกนั้นมีชั้นของผมแล้วครับพี่ ชั้นสามสิบเอ็ด"
        next:
          - text: "โตขึ้นโอ๊ตไปดูชั้นของตัวเองนะ"
            heart: 1
            reply: "ผมจะไปกับพ่อครับ แต่ผมจะกลับมาอยู่บ้าน ผมต้องเลี้ยงควาย ตึกไม่มีควาย"
          - text: "เพื่อนพ่อแย่งกล้วยตากกันเลยเหรอ"
            heart: 1
            reply: "ครับ! พ่อบอกว่าเพื่อนพ่อมาจากหลายจังหวัด ทุกคนบอกว่ากล้วยตากเหมือนของบ้านตัวเอง ผมว่ากล้วยตากทุกที่หน้าตาเหมือนกันแหละ"
      - text: "พ่อบอกว่าจะกลับมาเมื่อไหร่"
        heart: 1
        reply: "สงกรานต์ครับ เหมือนเดิม… แต่พ่อบอกว่าจะอยู่นานขึ้นสองวัน พ่อบอกว่าเห็นรูปวาดแล้วคิดถึงบ้านจนนอนไม่หลับ"

  # ===== news =====
  - id: oat_n_calf
    topic: news
    npc: "ข่าวใหญ่ครับพี่! อีแดงควายตาเผือกท้องโตมาก ตาบอกว่าอีกไม่นานจะคลอด ตาบอกให้ผมช่วยเฝ้าตอนกลางวัน กลางคืนตาเฝ้าเอง"
    options:
      - text: "โอ๊ตตื่นเต้นมากเลยนะ"
        heart: 1
        reply: "ตื่นเต้นจนนอนไม่หลับครับ ผมเอาฟางไปปูให้อีแดงทุกเช้า อีแดงเลียหัวผม หัวผมเหนียวไปทั้งวัน แม่ต้องสระสองรอบ"
        next:
          - text: "ควายเลียหัวแปลว่ารักนะ"
            heart: 2
            reply: "จริงเหรอครับ! งั้นอีแดงรักผม ผมจะบอกมิว มิวไม่เคยโดนควายเลีย"
          - text: "เดี๋ยวพี่ไปช่วยปูฟางด้วย"
            heart: 1
            reply: "มาตอนเช้านะครับ ตาเผือกไม่ชอบคนเยอะ แต่ตาไม่ว่าคนที่มาช่วยทำงาน"
      - text: "ควายท้องกี่เดือน"
        heart: 1
        reply: "สิบเดือนครับ! นานกว่าคนอีก ตาเผือกบอก ผมว่าลูกควายคงอยากอยู่ในท้องแม่นานๆ เพราะข้างนอกร้อน"

  - id: oat_n_market
    topic: news
    npc: "พี่ครับ ตลาดนัดวันเสาร์มีแผงขนมครกมาใหม่อีกแผง ขายหลุมละสองบาท ถูกกว่าแม่ผมบาทนึง แม่ผมนั่งเงียบทั้งเย็นเลยครับ"
    options:
      - text: "ขนมครกแม่โอ๊ตอร่อยกว่าแน่นอน"
        heart: 2
        reply: "ผมก็บอกแม่แบบนั้นครับ! ผมไปชิมของแผงใหม่มาแล้วด้วย ไม่ได้ซื้อนะ เขาแจกชิม หน้าไม่หอมกะทิเท่าแม่"
        next:
          - text: "โอ๊ตไปสืบให้แม่เลยเหรอ"
            heart: 1
            reply: "ครับ ผมเป็นสายลับขนมครก ผมแอบนับว่าแผงใหม่ขายได้กี่ถาด สามถาด แม่ผมขายได้ห้า แม่ยังชนะครับ"
          - text: "บอกแม่ไม่ต้องเครียดนะ"
            heart: 1
            reply: "ผมบอกแล้วครับ แม่หัวเราะแล้วกอดผมจนหายใจไม่ออก แม่บอกว่าผมคือลูกค้าประจำคนแรกของแม่"
      - text: "ถูกกว่าก็ดีสำหรับคนซื้อนะ"
        heart: 0
        reply: "ดีสำหรับคนซื้อครับ แต่แม่ผมเป็นคนขาย… ผมเป็นทั้งคนกินกับคนขาย ผมงง"

  - id: oat_n_teeth
    topic: news
    npc: "ฟันผมขึ้นแล้วครับพี่! ซี่ที่โยนขึ้นหลังคา ขึ้นมาใหม่แล้ว ผมบอกแล้วว่าโยนขึ้นหลังคาได้ผล มิวไม่เชื่อ"
    options:
      - text: "ไหนดูหน่อย"
        heart: 1
        reply: "อ้าาา… เห็นไหมครับ ซี่ใหญ่เลย ใหญ่กว่าซี่ข้างๆ อีก แม่บอกว่าเหมือนกระต่าย ผมว่าเหมือนเสือ"
      - text: "ฟันมันขึ้นเองอยู่แล้วนะ"
        heart: 0
        reply: "ไม่ใช่ครับ! มันขึ้นเพราะผมโยนแรง ซี่ที่มิวโยนไม่ถึงหลังคา ยังไม่ขึ้นเลย… ขึ้นแล้วครับ แต่ช้ากว่า"
        next:
          - text: "โอเค เชื่อแล้ว ของโอ๊ตขึ้นเร็วกว่า"
            heart: 1
            reply: "เห็นไหมครับ! ผมจะไปบอกมิวว่าพี่เชื่อผม"
          - text: "หมอฟันคงไม่เห็นด้วยนะ"
            heart: 1
            reply: "หมอแอนหัวเราะตอนผมเล่าครับ แต่หมอไม่ได้บอกว่าไม่จริง หมอบอกว่าแปรงฟันด้วย ผมเลยแปรงด้วย โยนด้วย"

  # ===== advice =====
  - id: oat_a_toss
    topic: advice
    npc: "พี่ครับ ทอยเส้นต้องย่อตัวนิดนึง ตาจ้องเส้น แล้วปล่อยเหรียญแบบนิ่มๆ อย่าโยนแรง เหรียญจะเด้งไปโดนขาครูเต้ย ผมเคยโดน… ครูเต้ยโดน"
    options:
      - text: "ครูเต้ยว่าไง"
        heart: 1
        reply: "ครูเก็บเหรียญคืนให้ แล้วบอกว่าทอยแรงได้สามคะแนน ทอยแม่นได้สิบ ครูให้คะแนนผมทุกครั้งเลยครับ แม้แต่ตอนผมโดนดุ"
      - text: "สอนพี่หน่อยได้ไหม"
        heart: 2
        reply: "ได้ครับ! แต่พี่ต้องใช้เหรียญตัวเอง เหรียญผมเป็นเหรียญนำโชค เหรียญสิบที่ลุงสมหมายให้ ลุงบอกว่ามีเลขเด็ดอยู่บนเหรียญ"
        next:
          - text: "เลขอะไรบนเหรียญ"
            heart: 1
            reply: "ปีที่ผลิตครับ ลุงจดไปแล้ว ผมไม่รู้ว่าลุงจะเอาไปทำอะไร ลุงบอกเด็กไม่ต้องรู้"
          - text: "พี่ใช้เหรียญห้าแทนได้ไหม"
            heart: 1
            reply: "ได้ครับ แต่เหรียญห้ากลิ้งเก่ง พี่ต้องปล่อยเบากว่าเดิมอีก เหมือนวางไข่"
      - text: "พี่ไม่ค่อยว่างเล่นหรอก"
        heart: 0
        reply: "พี่ไม่ต้องว่างทั้งวันครับ ทอยรอบเดียวห้านาที ผมจับเวลาให้"

  - id: oat_a_buffalo
    topic: advice
    npc: "พี่ครับ ถ้าพี่จะเดินผ่านคอกควายตาเผือก ห้ามเดินอ้อมหลังควายนะครับ ควายมองไม่เห็นข้างหลัง ตกใจจะเตะ ตาเผือกสอนผม"
    options:
      - text: "ขอบใจนะ พี่ไม่รู้เลย"
        heart: 2
        reply: "ไม่เป็นไรครับ คนกรุงเทพฯ ไม่รู้เรื่องควายเยอะ ผมจะสอนให้หมดเลย ควายมีกี่กระเพาะ… สี่ครับ พี่ยังไม่ทันตอบ"
      - text: "โอ๊ตเคยโดนเตะไหม"
        heart: 1
        reply: "เคยครับ ไม่แรง โดนแค่ลม แต่ผมล้มก้นจ้ำเบ้า ตาเผือกหัวเราะครั้งแรกในรอบปี ตาบอกว่าคุ้มแล้วที่ผมล้ม"
        next:
          - text: "ตาเผือกหัวเราะเป็นด้วยเหรอ"
            heart: 1
            reply: "เป็นครับ เสียงเหมือนควายไอ ผมได้ยินแค่ครั้งเดียว ผมอยากได้ยินอีกแต่ไม่อยากล้มอีก"
          - text: "เจ็บไหม"
            heart: 1
            reply: "ไม่เจ็บครับ เจ็บแต่ใจ เพราะมิวเห็น แล้วมิวเล่าให้ทั้งห้องฟัง"
      - text: "ควายไม่เตะคนหรอก"
        heart: 0
        reply: "เตะครับ! ควายใจดีแต่ไม่ได้ใจดีตลอด เหมือนแม่ผมตอนผมทำการบ้านไม่เสร็จ"

  - id: oat_a_bug
    topic: advice
    when: { time: evening }
    npc: "พี่ครับ ถ้าพี่อยากเห็นหิ่งห้อย ต้องไปริมคลองตอนหัวค่ำ ห้ามเปิดไฟฉาย หิ่งห้อยจะอาย แล้วก็กลับบ้านก่อนสามทุ่มด้วย"
    options:
      - text: "หิ่งห้อยอายไฟฉายเหรอ"
        heart: 1
        reply: "ครับ ไฟฉายสว่างกว่าไฟมัน มันเลยไม่อยากเปิดไฟแข่ง ผมว่ามันรู้ว่ามันแพ้"
      - text: "ช่วงนี้คลองตื้น หิ่งห้อยยังอยู่ไหม"
        heart: 1
        reply: "น้อยลงครับ ปีที่แล้วเยอะเหมือนดาวตก ปีนี้นับได้สิบสองตัว ผมนับทุกตัวเลย… เหมือนลุงสมหมาย แต่ผมไม่ได้เอาไปซื้ออะไรนะครับ"
        next:
          - text: "หิ่งห้อยต้องการน้ำสะอาดนะ"
            heart: 2
            reply: "งั้นถ้าคลองกลับมาสะอาด หิ่งห้อยก็กลับมาใช่ไหมครับ ผมจะเก็บขยะในคลองทุกวันเสาร์ ชวนมิวด้วย"
          - text: "สิบสองตัวก็ยังสวยนะ"
            heart: 1
            reply: "สวยครับ แต่ผมอยากให้มันมีเพื่อนเยอะๆ ตัวเดียวกะพริบอยู่ตรงนั้นดูเหงา"
      - text: "พี่ไม่ค่อยสนใจแมลงหรอก"
        heart: 0
        reply: "ไม่เป็นไรครับ แมลงก็ไม่ค่อยสนใจพี่เหมือนกัน… ยกเว้นยุง"

  # ===== smalltalk =====
  - id: oat_s_beetle
    topic: smalltalk
    npc: "พี่ว่าถ้าด้วงกว่างตัวใหญ่เท่าควาย มันจะไถนาได้ไหมครับ ผมว่าได้ แล้วมันไม่ต้องกินหญ้า กินกล้วยอย่างเดียว"
    options:
      - text: "ได้สิ แต่ต้องใช้กล้วยวันละร้อยหวี"
        heart: 2
        reply: "ร้อยหวี! ผมจะปลูกกล้วยทั้งตำบลเลยครับ แล้วด้วงกว่างยักษ์จะไถนาให้ทุกบ้าน ลุงสมหมายไม่ต้องใช้รถเกี่ยว"
        next:
          - text: "ลุงสมหมายต้องตกงานแน่"
            heart: 1
            reply: "ลุงไปเป็นคนนับกล้วยครับ ลุงชอบนับ"
          - text: "แล้วใครจะขี่ด้วงกว่าง"
            heart: 1
            reply: "ผมครับ! คนเดียวเท่านั้น มิวขอขี่ได้วันละรอบ"
      - text: "ด้วงมันบินได้ ไถนาไม่ได้หรอก"
        heart: 0
        reply: "บินได้ก็ไถได้ครับ บินไปไถไป เร็วกว่าควายด้วย พี่คิดแบบผู้ใหญ่เกินไปครับ"
      - text: "ควายยังดีที่สุด"
        heart: 1
        reply: "ก็จริงครับ… ควายไม่บินหนี ควายจำทางกลับบ้านได้ ด้วงกว่างผมบินหนีไปแล้วสองตัว"

  - id: oat_s_kite
    topic: smalltalk
    when: { time: noon }
    npc: "พี่ครับ ลมเที่ยงแรงดีครับ ถ้าผมมีว่าว ว่าวจะขึ้นสูงกว่ายอดเจดีย์วัดเลย แต่ผมไม่มีว่าวแล้ว มันขาดไปตอนพายุ"
    options:
      - text: "ไว้พี่ช่วยทำใหม่ให้"
        heart: 2
        reply: "จริงนะครับ! ผมรู้วิธีทำ ลุงพรานแดงสอน ต้องใช้ไม้ไผ่กับกระดาษ แล้วต้องมีหางยาวๆ ไม่งั้นมันหมุนติ้ว"
      - text: "ว่าวลอยไปตกที่ไหน"
        heart: 1
        reply: "ไม่รู้ครับ ผมวิ่งตามไปถึงรั้วบริษัท เข้าไปไม่ได้ ผมว่ามันตกในที่ดินบริษัท ตอนนี้ว่าวผมเป็นของบริษัทแล้ว"
        next:
          - text: "ไปขอคืนก็ได้นะ"
            heart: 1
            reply: "ผมไปบอกยามแล้วครับ ยามบอกต้องทำหนังสือขอ ผมทำหนังสือไม่เป็น ผมเขียนได้แต่เรียงความเรื่องควาย"
          - text: "ไม่เป็นไร ทำใหม่ดีกว่า"
            heart: 1
            reply: "ครับ ตัวใหม่ผมจะเขียนชื่อไว้ ‘ของโอ๊ต ห้ามเอาไป’ ถ้าตกในที่บริษัทอีก เขาจะได้รู้"
      - text: "ลมแรงขนาดนี้ระวังตัวปลิวนะ"
        heart: 0
        reply: "ผมไม่ปลิวหรอกครับ ผมกินข้าวสองจาน หนักแล้ว"

  - id: oat_s_dragon
    topic: smalltalk
    when: { rain: true }
    npc: "ฝนตกครับพี่ ผมจับลูกอ๊อดใส่ขวดได้เจ็ดตัว เดี๋ยวดูแป๊บเดียวแล้วปล่อย พี่ว่าลูกอ๊อดรู้ไหมว่าโตแล้วจะเป็นกบ"
    options:
      - text: "พี่ว่ามันไม่รู้ มันแค่ว่ายไปเรื่อยๆ"
        heart: 1
        reply: "งั้นมันคงตกใจมากตอนขางอก ตื่นมามีขาสองขา แล้วอีกวันมีอีกสองขา ผมคงร้องไห้ถ้าเป็นผม"
        next:
          - text: "โอ๊ตก็โตขึ้นทุกวันเหมือนกันนะ"
            heart: 2
            reply: "ใช่ครับ! เมื่อวานกางเกงผมสั้นขึ้น แม่บอกว่าผมโต ผมนึกว่ากางเกงหด"
          - text: "เป็นกบก็สนุกดี กระโดดได้ไกล"
            heart: 1
            reply: "กระโดดไกลกว่ามิวกระโดดหนังยางอีกครับ… อย่าบอกมิวนะ"
      - text: "รีบปล่อยมันนะ เดี๋ยวมันเหนื่อย"
        heart: 1
        reply: "ครับ ผมจะปล่อยตรงแอ่งน้ำเดิม ตาเผือกบอกว่าสัตว์ทุกตัวมีบ้านของมัน"

  - id: oat_s_drum
    topic: smalltalk
    npc: "พี่ครับ ผมจะเป็นมือกลองยาวงานบวชครั้งหน้า! ลุงที่ตีกลองบอกว่าผมตีผิดจังหวะ แต่ผิดแบบมีความสุข"
    options:
      - text: "ผิดแบบมีความสุขก็ดีนะ"
        heart: 2
        reply: "ใช่ครับ! คนเต้นหน้าขบวนก็เต้นผิดจังหวะเหมือนกัน เราผิดพร้อมกัน เลยเหมือนถูก"
      - text: "ซ้อมเยอะๆ นะ จะได้ไม่ผิด"
        heart: 1
        reply: "ผมซ้อมทุกวันครับ ซ้อมกับถังน้ำ กับหม้อ กับหัวโอ๊ตเอง แม่ยึดไม้ตีกลองไปแล้วสองคู่"
        next:
          - text: "หัวตัวเองเลยเหรอ"
            heart: 1
            reply: "เสียงดีนะครับ ป๊อกๆ แต่เจ็บนิดหน่อย ผมเลยเปลี่ยนไปตีหมอนแทน หมอนเสียงไม่ดีแต่ไม่เจ็บ"
          - text: "ซ้อมกับพี่ก็ได้นะ พี่ปรบมือให้"
            heart: 2
            reply: "ได้ครับ! พี่ปรบมือ ผมตี มิวเต้น เราจะเป็นวงดนตรีหมู่สี่"
      - text: "เสียงดังไปไหม"
        heart: 0
        reply: "กลองยาวต้องดังครับ ถ้าไม่ดังเรียกว่ากลองสั้น"

  # ===== self =====
  - id: oat_f_dad
    topic: self
    npc: "พ่อผมทำงานก่อสร้างที่กรุงเทพฯ ครับ ส่งรูปตึกมาให้ทุกอาทิตย์ ผมเก็บไว้ในกล่องรองเท้า ตึกในรูปสูงขึ้นทุกอาทิตย์ แต่พ่อในรูปดำขึ้นทุกอาทิตย์"
    options:
      - text: "พ่อทำงานกลางแดดทั้งวันเลยนะ"
        heart: 1
        reply: "ครับ พ่อบอกว่าบนตึกร้อนกว่าในนา เพราะไม่มีต้นมะขามให้หลบ ผมเลยวาดต้นมะขามส่งไปให้พ่อ พ่อแปะไว้ในเต็นท์คนงาน"
        next:
          - text: "โอ๊ตเป็นลูกที่น่ารักมาก"
            heart: 2
            reply: "แม่ก็บอกแบบนั้นครับ แต่แม่บอกตอนผมทำการบ้านเสร็จ ตอนไม่เสร็จแม่ไม่พูด"
          - text: "พ่อคงชอบรูปวาดโอ๊ต"
            heart: 1
            reply: "พ่อบอกว่าชอบครับ แต่พ่อบอกว่าต้นมะขามผมเหมือนบร็อคโคลี่ ผมไม่รู้จักบร็อคโคลี่"
      - text: "ตึกพ่อสูงกี่ชั้น"
        heart: 1
        reply: "สามสิบชั้นครับ! สูงกว่าเจดีย์วัดเราสิบเท่า… ผมคิดเอง ผมไม่เคยเห็นของจริง"

  - id: oat_f_brave
    topic: self
    when: { heart_min: 3 }
    npc: "พี่ครับ ผมบอกทุกคนว่าผมวิ่งเร็วที่สุด แต่จริงๆ มิววิ่งเร็วกว่า ผมแค่เริ่มวิ่งก่อนตอนครูยังไม่เป่านกหวีด"
    options:
      - text: "นั่นมันโกงนะโอ๊ต"
        heart: 1
        reply: "ผมรู้ครับ… ผมโกงทุกครั้งที่กลัวแพ้ แต่พอชนะแบบโกงผมก็ไม่ดีใจ ผมเลยไม่รู้จะโกงทำไม"
        next:
          - text: "งั้นลองวิ่งแบบไม่โกงครั้งหน้าไหม"
            heart: 2
            reply: "ถ้าผมแพ้ล่ะครับ… ก็แพ้ ใช่ไหมครับ แพ้แบบไม่โกงคงดีใจกว่าชนะแบบโกง ผมจะลองครับ"
          - text: "พี่ก็เคยโกงตอนเด็กๆ"
            heart: 1
            reply: "จริงเหรอครับ! พี่โกงอะไร… อย่าบอกครับ ผมจะได้ไม่เอาไปทำ"
      - text: "แพ้มิวก็ไม่เห็นเป็นไร"
        heart: 1
        reply: "ไม่เป็นไรสำหรับพี่ครับ สำหรับผมเป็นทุกวัน มิวชนะทุกอย่างเลย ยกเว้นทอยเส้น"

  - id: oat_f_future
    topic: self
    when: { heart_min: 5 }
    npc: "พี่ครับ… ครูเต้ยบอกว่าโตขึ้นเด็กเก่งๆ ต้องไปเรียนในเมือง ผมไม่อยากไป ผมอยากเลี้ยงควาย แต่ถ้าผมไม่ไป ผมจะเป็นเด็กไม่เก่งเหรอครับ"
    options:
      - text: "เลี้ยงควายเก่งก็เป็นคนเก่งนะ"
        heart: 2
        reply: "จริงเหรอครับ… ตาเผือกเลี้ยงควายมาทั้งชีวิต ทุกคนเรียกตาว่าครูสายปศุสัตว์ ตาเผือกเก่งใช่ไหมครับ งั้นผมก็เก่งได้"
        next:
          - text: "แต่ไปเรียนเรื่องสัตว์มาก่อนก็ได้นะ แล้วค่อยกลับมา"
            heart: 2
            reply: "เรียนเรื่องควายมีด้วยเหรอครับ! ผมจะไปเรียนแล้วกลับมาเป็นหมอควาย ตาเผือกจะได้ไม่ต้องพาควายไปถึงอำเภอ"
          - text: "ไม่ต้องรีบคิดตอนนี้ก็ได้"
            heart: 1
            reply: "ครับ ผมจะคิดตอนผมโตกว่านี้อีกนิด ตอนผมสูงเท่าหลังควาย"
      - text: "ในเมืองก็สนุกนะ"
        heart: 0
        reply: "สนุกแต่ไม่มีควายครับ พ่อบอกว่าในกรุงเทพฯ มีแต่หมาใส่เสื้อ"

  # ===== others =====
  - id: oat_o_mew
    topic: others
    npc: "พี่ครับ มิวบอกทุกคนว่าผมกลัวเชือกฟาง ผมไม่ได้กลัวเชือกฟาง ผมกลัวงูที่หน้าเหมือนเชือกฟาง มันไม่เหมือนกันนะครับ"
    options:
      - text: "จ้ะ ไม่เหมือนกัน"
        heart: 2
        reply: "ขอบคุณครับ! พี่เป็นคนแรกที่เข้าใจผม มิวให้หนังยางสีม่วงมาขอโทษด้วย ผมไม่ชอบสีม่วงแต่ผมเก็บไว้"
        next:
          - text: "เก็บไว้ทำไม ถ้าไม่ชอบสีม่วง"
            heart: 1
            reply: "…เพราะเพื่อนให้ครับ ผมเก็บของที่เพื่อนให้ทุกอย่าง มีฝาขวดจากมิว การ์ดไดโนเสาร์จากเณรต้น เหรียญสิบจากลุงสมหมาย อย่าบอกมิวนะครับ เดี๋ยวมิวได้ใจ"
          - text: "มิวขอโทษแล้ว ดีจัง"
            heart: 1
            reply: "ครับ มิวขอโทษเก่ง ผมขอโทษไม่เก่ง ผมเลยให้ขนมครกแทนคำขอโทษ แม่บอกว่าใช้ได้ผลกับทุกคนยกเว้นครู"
      - text: "ฮ่าๆ แล้วตกลงกลัวอะไร"
        heart: 0
        reply: "กลัวงูครับ… กับผี กับฟ้าผ่า กับแม่ตอนโกรธ แค่นี้ครับ ไม่เยอะ"

  - id: oat_o_phueak
    topic: others
    npc: "ตาเผือกไม่ค่อยพูดครับ แต่ตาพูดกับควายเยอะมาก ผมแอบได้ยินตาเล่าเรื่องยายเพียรให้ไอ้ทุยฟัง ตาบอกว่ายายเพียรเคยช่วยตาตามหาควายหายทั้งคืน"
    options:
      - text: "ตาเล่าว่ายังไงอีก"
        heart: 2
        reply: "ตาบอกว่ายายเพียรถือตะเกียงเดินหาด้วยทั้งคืน ผีออกยายก็ไม่กลับ เจอควายตอนตีสี่ที่หลังวัด ยายบอกว่า ‘ควายมันหลง คนจะทิ้งมันไม่ได้’ ตาพูดแล้วลูบหัวไอ้ทุย"
        next:
          - text: "ยายพี่ใจกล้าจัง"
            heart: 1
            reply: "ใจกล้ากว่าผมอีกครับ ผมยังกลัวผีอยู่เลย… แต่ถ้าควายผมหาย ผมจะไปหาเหมือนยายพี่ ถือไฟฉายนะ ไม่ใช่ตะเกียง"
          - text: "ขอบใจที่เล่าให้พี่ฟังนะ"
            heart: 1
            reply: "ไม่เป็นไรครับ แต่อย่าบอกตาว่าผมแอบฟัง ตาไม่ชอบคนแอบฟัง ตาชอบควายแอบฟัง"
      - text: "แอบฟังผู้ใหญ่ไม่ดีนะ"
        heart: 0
        reply: "ผมไม่ได้แอบครับ ผมนั่งอยู่บนหลังควายตัวที่ตาคุยด้วย ผมได้ยินเอง ไม่ได้ตั้งใจ… ตั้งใจนิดนึง"

  - id: oat_o_ball
    topic: others
    npc: "พี่บอลอู่ซ่อมรถช่วยผมเติมลมจักรยานฟรีทุกครั้งครับ แต่พี่บอลบอกว่าถ้าผมไม่ซ่อมยางรั่วเอง ครั้งหน้าพี่บอลอาจจะไม่อยู่แล้ว ผมไม่เข้าใจครับ"
    options:
      - text: "พี่บอลอาจจะไปทำงานที่อื่นจ้ะ"
        heart: 1
        reply: "ไปไหนครับ… ระยองเหรอ ผมได้ยินลุงสมหมายพูด ถ้าพี่บอลไป ใครจะเติมลมให้ผม ผมยังปะยางไม่เป็นเลย"
        next:
          - text: "ไปให้พี่บอลสอนปะยางสิ"
            heart: 2
            reply: "ดีครับ! ถ้าผมปะยางเป็น พี่บอลจะได้ไม่ห่วง… แต่ถ้าผมปะไม่เป็นสักที พี่บอลอาจจะไม่ไปก็ได้ ผมจะเรียนช้าๆ"
          - text: "ไม่ต้องห่วงหรอก ยังไม่แน่"
            heart: 1
            reply: "ครับ… ผมจะไหว้ปู่ตาให้พี่บอลอยู่ด้วย ปู่ตาน่าจะช่วยได้หลายเรื่อง"
      - text: "พี่บอลแค่อยากให้โอ๊ตทำเป็นเอง"
        heart: 1
        reply: "ผมทำเป็นแล้วครับ ทำเป็นเติมลม ยังไม่เป็นแค่เรื่องรั่ว… เรื่องรั่วยากกว่าเยอะ"

quests:
  - id: oat_q1
    npc: oat
    title: "ว่าวของโอ๊ต"
    desc: "ว่าวน้องโอ๊ตขาดลอยไปตกในที่ดินบริษัท ช่วยทำตัวใหม่"
    start: { heart_min: 1, day_min: 3 }
    offer:
      npc: "พี่ครับ ช่วยผมทำว่าวใหม่ได้ไหม ตัวเก่าลอยไปตกในที่บริษัท ยามไม่ให้เข้า ผมต้องการกระดาษสีกับไม้ ผมรู้วิธีทำ แต่ผมไม่มีเงินกับไม้"
      options:
        - text: "ได้เลย เดี๋ยวพี่หาให้"
          accept: true
          heart: 2
          reply: "เย้! กระดาษสีสองแผ่นนะครับ สีแดงกับสีเหลือง ส่วนไม้เอาไม้แห้งๆ ตรงๆ จะได้ไม่เบี้ยว"
        - text: "ทำไมไม่ซื้อว่าวสำเร็จเลยล่ะ"
          accept: true
          heart: 1
          reply: "ว่าวซื้อขึ้นไม่สูงครับ ลุงพรานแดงบอกว่าว่าวที่ทำเองรู้จักลม เอาเป็นทำเองนะครับ"
        - text: "ไว้หน้าหนาวค่อยทำ"
          heart: 0
          reply: "หน้าหนาวนานมากเลยครับ… ผมไปเล่นทอยเส้นรอก่อนก็ได้"
    steps:
      - goal: { type: give, npc: oat, item: color_paper, n: 2 }
        hint: "ซื้อกระดาษสี 2 แผ่นที่ร้านป้าแต๋ว เอาไปให้น้องโอ๊ต"
        done:
          npc: "สีแดงกับสีเหลือง! เหมือนสีป้ายร้านเสี่ยเฮงเลยครับ… ไม่เอา ไม่เหมือน เหมือนสีไก่ย่าง ผมจะวาดหน้าควายไว้ตรงกลางด้วย"
          options:
            - text: "หน้าควายบนว่าว เท่ดีนะ"
              heart: 2
              reply: "ควายบินได้ครับ! ตาเผือกเห็นต้องหัวเราะแน่ ผมจะได้ยินเสียงตาหัวเราะครั้งที่สองในชีวิต"
            - text: "วาดหน้ามิวไหม"
              heart: 1
              reply: "ไม่ครับ! ถ้าวาดหน้ามิว ว่าวจะชนะลมทุกครั้งเหมือนมิว ผมยังอยากชนะบ้าง"
      - goal: { type: give, npc: oat, item: wood, n: 1 }
        hint: "เอาไม้ฟืนตรงๆ 1 ท่อนไปให้น้องโอ๊ตทำโครงว่าว"
        done:
          npc: "ไม้ดีครับ! ผมเหลาเองได้ ลุงพรานแดงสอน แต่แม่ไม่ให้ผมจับมีด… พี่เหลาให้หน่อยได้ไหมครับ ผมจะบอกว่าต้องเหลาตรงไหน"
          options:
            - text: "ได้ พี่เหลาให้ โอ๊ตบอกทาง"
              heart: 2
              reply: "บางๆ ตรงกลางครับ ปลายหนาหน่อย… พี่เหลาเก่งกว่าลุงพรานแดงอีก อย่าบอกลุงนะครับ"
            - text: "เหลาด้วยกัน พี่จับมือโอ๊ตไว้"
              heart: 1
              reply: "แบบนี้แม่ไม่ว่าแน่ครับ มีผู้ใหญ่จับด้วย… ผมจะบอกแม่ว่าพี่จับแน่นมาก"
      - goal: { type: visit, place: sala, from: "16:00", to: "18:00" }
        hint: "ตอนเย็นไปปล่อยว่าวกับน้องโอ๊ตที่ลานศาลา"
        done:
          npc: "ขึ้นแล้วครับ! ขึ้นแล้ว! สูงกว่าหอกระจายข่าวแล้ว… มิวมาครับ มิวขอจับสายบ้าง ผมให้มิวจับไหมครับพี่"
          options:
            - text: "ให้มิวจับบ้างสิ เล่นด้วยกันสนุกกว่า"
              heart: 2
              set_flag: oat_kite_share
              reply: "ก็ได้ครับ… มิวจับแล้วว่าวขึ้นสูงกว่าเดิมอีก! ทำไมเป็นแบบนี้ทุกที… แต่มิวยิ้ม ผมก็ยิ้มด้วย"
            - text: "ว่าวโอ๊ต โอ๊ตตัดสินใจเองนะ"
              heart: 1
              set_flag: oat_kite_self
              reply: "ผมจับเองรอบนี้ครับ รอบหน้าให้มิว… มิวทำหน้างอ ผมจะให้มิวผูกหางว่าวแทน ผูกหางสำคัญที่สุด"
    sold_at: { color_paper: taew_shop }
    reward: { heart: 2, items: { marble: 2 }, set_flag: oat_q1_done, line: { from: taew, text: "เมื่อเย็นใครเห็นว่าวหน้าควายลอยเหนือศาลา ของน้องโอ๊ตนะจ๊ะ ป้าไม่ได้พูดนะ แต่สูงกว่าว่าวลูกกำนันอีก" } }

  - id: oat_q2
    npc: oat
    title: "ชื่อลูกควายตัวแรก"
    desc: "อีแดงควายตาเผือกคลอดลูก น้องโอ๊ตอยากได้สิทธิ์ตั้งชื่อ"
    start: { flag: oat_q1_done, heart_min: 3, day_min: 8 }
    offer:
      npc: "พี่ครับ! อีแดงคลอดแล้ว! ตาเผือกบอกว่าคนตั้งชื่อต้องเป็นคนที่ช่วยดูแลแม่มัน ผมช่วยมาตลอด แต่ตาบอกว่าผมต้องพิสูจน์ก่อน ช่วยผมพูดกับตาหน่อยครับ"
      options:
        - text: "ได้ พี่ไปคุยกับตาเผือกให้"
          accept: true
          heart: 2
          reply: "ขอบคุณครับ! ตาชอบข้าวจี่นะครับ ไปมือเปล่าตาจะไม่ค่อยพูด ไปพร้อมข้าวจี่ตาจะพูดสามประโยค"
        - text: "โอ๊ตอยากตั้งชื่อว่าอะไร"
          accept: true
          heart: 1
          reply: "ความลับครับ… ก็ได้ ‘เจ้าโอ๊ตน้อย’ ผมคิดไว้ตั้งแต่อีแดงท้อง อย่าบอกตาก่อนนะครับ"
        - text: "เรื่องของตาเผือกนะ"
          heart: 0
          reply: "ครับ… งั้นผมจะไปพิสูจน์เอง ผมจะตักหญ้าให้อีแดงทั้งอาทิตย์"
    steps:
      - goal: { type: give, npc: phueak, item: khao_jee, n: 2 }
        hint: "ซื้อข้าวจี่ 2 ไม้ที่ตลาดนัด เอาไปให้ตาเผือกที่ทุ่งเลี้ยงควาย แล้วพูดเรื่องโอ๊ต"
        done:
          npc: "ข้าวจี่… ไอ้โอ๊ตส่งเอ็งมาสินะ มันช่วยข้าทุกเช้า ปูฟางให้อีแดง โดนอีแดงเลียหัวทุกวันไม่บ่น ควายมันรู้ว่าใครดีกับมัน ข้าก็รู้ ไปบอกมันให้มาดูลูกควายตอนเย็น"
          options:
            - text: "ตาจะให้โอ๊ตตั้งชื่อใช่ไหม{kq}"
              heart: 1
              reply: "ข้ายังไม่ได้พูดสักคำว่าให้… แต่ก็ไม่ได้พูดว่าไม่ให้ เอ็งพูดมากเหมือนสมหมายเว้ย ไปๆ"
            - text: "โอ๊ตรักควายมากเลย{k}ตา"
              heart: 2
              reply: "ข้ารู้ เด็กรุ่นนี้ไม่มีใครรักควายแล้ว มีมันคนเดียว… ถ้าวันนึงข้าเลี้ยงไม่ไหว ข้าว่าข้ารู้แล้วว่าจะฝากควายไว้กับใคร"
      - goal: { type: visit, place: pasture, from: "15:00", to: "17:30" }
        hint: "ตอนเย็นไปทุ่งเลี้ยงควายกับน้องโอ๊ต ดูลูกควาย"
        done:
          npc: "พี่ครับ ตาเผือกบอกว่าผมตั้งชื่อได้! แต่มิวมาด้วย มิวบอกว่าชื่อ ‘เจ้าโอ๊ตน้อย’ หลงตัวเอง มิวอยากให้ชื่อ ‘เจ้าทองดี’ ผมควรเลือกอันไหนครับ"
          options:
            - text: "เจ้าโอ๊ตน้อย โอ๊ตคิดไว้นานแล้ว"
              heart: 1
              set_flag: oat_calf_oat
              reply: "เจ้าโอ๊ตน้อย! ตาเผือกเรียกชื่อแล้วมันหันมาครับพี่! มันรู้ชื่อมันแล้ว มิวทำหน้างอ แต่มิวลูบหัวมันก่อนใครเลย"
            - text: "เอาสองชื่อรวมกัน เจ้าทองโอ๊ต"
              heart: 2
              set_flag: oat_calf_both
              reply: "เจ้าทองโอ๊ต! ฟังแปลกแต่ผมชอบครับ มิวก็ชอบ ตาเผือกบอกว่าชื่อยาวไป ตาจะเรียกว่า ‘ไอ้โอ๊ต’ เหมือนเรียกผม… ผมดีใจกว่าเดิมอีก"
    sold_at: { khao_jee: market }
    reward: { heart: 2, items: { egg_chicken: 2 }, set_flag: oat_q2_done, line: { from: oat, text: "ลูกควายตัวใหม่ของตาเผือกมีชื่อแล้วครับ 🐃 ใครผ่านทุ่งเรียกชื่อมันได้ มันหันทุกครั้ง (ผมทดลองแล้วสิบสองรอบ)" } }

  - id: oat_q3
    npc: oat
    title: "กล่องถึงพ่อ"
    desc: "น้องโอ๊ตอยากส่งรูปวาดกับกล้วยตากไปให้พ่อที่ไซต์ก่อสร้างในกรุงเทพฯ"
    start: { flag: oat_q2_done, heart_min: 4, day_min: 12 }
    offer:
      npc: "พี่ครับ ผมวาดรูปหมู่บ้านเสร็จแล้ว มีบ้านผม ทุ่งควาย เจ้าโอ๊ตน้อย แล้วก็พี่ ผมอยากส่งไปให้พ่อพร้อมกล้วยตาก ลุงเชิดบอกว่าฝากรถเมล์เที่ยวเช้าไปส่งไปรษณีย์อำเภอได้"
      options:
        - text: "ได้เลย เดี๋ยวพี่ช่วยหากล้วยตาก"
          accept: true
          heart: 2
          reply: "ขอบคุณครับ! พ่อชอบกล้วยตากที่สุด พ่อบอกว่ากล้วยตากกรุงเทพฯ หวานเหมือนน้ำตาลไม่เหมือนกล้วย"
        - text: "มีพี่อยู่ในรูปด้วยเหรอ"
          accept: true
          heart: 1
          reply: "มีครับ พี่ตัวเล็กนิดเดียว ถือบัวรดน้ำ ผมลอกท่ามาจากรูปที่มิววาด… อย่าบอกมิวนะครับ"
        - text: "ส่งไลน์ไปให้พ่อก็ได้นี่"
          heart: 0
          reply: "พ่อมีไลน์ครับ แต่กล้วยตากส่งทางไลน์ไม่ได้… ผมจะคิดหาวิธีเองครับ"
    steps:
      - goal: { type: give, npc: oat, item: dried_banana, n: 1 }
        hint: "ซื้อกล้วยตาก 1 ถุงที่ตลาดนัด เอาไปให้น้องโอ๊ตใส่กล่อง"
        done:
          npc: "ถุงใหญ่เลยครับ! ผมแบ่งชิมชิ้นเดียว… สองชิ้น เพื่อดูว่าหวานพอไหม หวานครับ พ่อต้องชอบ พรุ่งนี้หกโมงเช้าเจอกันที่ป้ายรถเมล์นะครับ"
          options:
            - text: "ชิมสองชิ้นพอนะ ที่เหลือของพ่อ"
              heart: 1
              reply: "ครับ! ผมเอาเทปพันถุงไว้สามรอบแล้ว ผมจะได้แกะไม่ได้"
            - text: "เขียนจดหมายใส่ไปด้วยไหม"
              heart: 2
              reply: "ผมจะเขียนครับ! แต่ผมเขียนอะไรดี… ไว้ผมคิดตอนเช้า ผมคิดออกตอนเช้าดีกว่าตอนเย็น"
      - goal: { type: visit, place: bus_stop, from: "06:00", to: "06:40" }
        hint: "เช้าตรู่ไปป้ายรถเมล์กับน้องโอ๊ต ฝากกล่องกับลุงเชิดก่อนรถออก"
        done:
          npc: "ลุงเชิดรับกล่องแล้วครับ ลุงบอก ‘ขึ้นๆ ออกแล้วนะ’ กับกล่อง เหมือนกล่องเป็นคน… พี่ครับ ผมยังไม่ได้เขียนจดหมาย ผมรีบเขียนบนฝากล่องได้หนึ่งประโยค ผมควรเขียนว่าอะไรครับ"
          options:
            - text: "‘พ่อกลับมาเร็วๆ นะครับ’"
              heart: 1
              set_flag: oat_note_comehome
              reply: "ผมเขียนแล้วครับ ตัวโตมาก ลุงเชิดอ่านแล้วยิ้ม บอกว่าจะขับรถให้เร็วกว่าปกติ ทั้งที่ลุงขับเร็วกว่านี้ไม่ได้"
            - text: "‘ผมจะดูแลแม่ พ่อไม่ต้องห่วง’"
              heart: 2
              set_flag: oat_note_care
              reply: "ผมเขียนแล้วครับ… ตอนเขียนผมรู้สึกโตขึ้นนิดนึง เหมือนกางเกงสั้นลงอีก ลุงเชิดลูบหัวผมก่อนรถออก"
    sold_at: { dried_banana: market }
    reward: { heart: 3, items: { khanom_krok: 2 }, set_flag: oat_q3_done, line: { from: cherd, text: "กล่องน้องโอ๊ตถึงไปรษณีย์อำเภอแล้วนะจ้ะ ลุงถือไปส่งเองกับมือ ไม่ให้ใครแตะ กล้วยตากหอมทั้งรถเลย" } }
