      - text: "ยาเสี่ยเฮงได้ผลไวกว่านะ{kq}"
        heart: 0
        reply: "ไวกว่าครับ… พ่อผมก็ชอบความไว ฉีดไวมาสามสิบปี ตอนนี้มือสั่นไวมาก ถือแก้วน้ำไม่ได้ ผมขอโทษครับ ไม่ได้ตั้งใจพูดแรง"
        next:
          - text: "ไม่เป็นไร{k} {p}จะลองสะเดาก่อน"
