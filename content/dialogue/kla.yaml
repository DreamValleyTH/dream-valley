    reward: { money: 0, heart: 2, set_flag: kla_q4_done, line: { from: kla, text: "สหกรณ์ส่งผักให้โรงพยาบาลอำเภอครบสี่อาทิตย์ติดแล้วครับ 🥬 ขอบคุณสมาชิกทุกคน และสมาชิกหมายเลข 104 ที่ช่วยเติมกำสุดท้าย ใครอยากซื้อหุ้นเพิ่ม หุ้นละ 100 บาทเท่าเดิมครับ ไม่มีดอก ไม่มีปฏิทิน" } }

