  - id: kla_s_rain
    topic: smalltalk
    when: { rain: true }
    npc: "ฝนตกครับ! ผมยืนตากฝนมาห้านาทีแล้ว ไม่ได้บ้านะครับ ผมกำลังวัดว่าฝนตกกี่มิลลิเมตร… โอเค บ้านิดหนึ่ง"
    options:
      - text: "ได้กี่มิล{kq}"
        heart: 1
        reply: "สิบสองมิลครับ พอสำหรับผักหนึ่งวัน ไม่พอสำหรับบ่อหนึ่งปี… ผมจดใส่สมุดแล้ว สมุดเล่มนี้เปียกบ่อยกว่าผมอีก"
      - text: "เข้ามาหลบก่อน{k} เดี๋ยวไม่สบาย"
        heart: 2
        reply: "…ครับ ขอบคุณครับ ผมไม่ค่อยมีใครบอกให้หลบฝน ส่วนใหญ่บอกให้หลบไปไกลๆ เวลาผมเริ่มพูดเรื่องสหกรณ์"

