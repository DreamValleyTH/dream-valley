    npc: "ก่อนขายผลผลิตให้ใคร ถามสามข้อครับ ชั่งด้วยตาชั่งอะไร หักความชื้นเท่าไหร่ จ่ายเงินเมื่อไหร่ สามข้อนี้ตอบไม่ได้ อย่าขาย"
