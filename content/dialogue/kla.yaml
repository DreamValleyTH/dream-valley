    options:
      - text: "{p}ไม่เคยเบื่อพี่เลย{k}"
        heart: 2
        reply: "…ผมไม่รู้จะตอบยังไงครับ ผมเตรียมคำตอบสำหรับคำว่า ‘เบื่อ’ ไว้เยอะมาก แต่ไม่ได้เตรียมคำตอบสำหรับคำนี้ไว้เลย"
        next:
          - text: "งั้นไม่ต้องตอบ{k} นั่งดูหิ่งห้อยเงียบๆ ก็ได้"
            heart: 2
            reply: "ครับ… เงียบๆ ผมทำได้ ผมลองแล้ว ห้านาที… สี่นาทีครึ่ง แต่ผมจะพยายาม"
          - text: "บางทีก็เบื่อนิดนึง{k} แต่ไม่เดินเลี่ยงแน่นอน"
            heart: 2
            reply: "ฮ่า… ตรงดีครับ ตรงเหมือนตาชั่ง ผมชอบคำตอบนี้มากกว่าอันแรกอีก เพราะผมเชื่อมันได้"
      - text: "มีอะไรเปลี่ยนแล้วนะ{kq} หิ่งห้อยกลับมาแล้ว"
        heart: 2
        reply: "จริงครับ… ผมนับหิ่งห้อยทุกปี แต่ลืมนับว่ามันคือสิ่งที่เปลี่ยน ขอบคุณที่นับให้ผมครับ"

  - id: kla_f_mother
    topic: self
    when: { heart_min: 4 }
    npc: "แม่ผมเป็นสมาชิกหมายเลขสองครับ ผมเป็นหมายเลขหนึ่ง แม่บอกว่าแม่ยอมเป็นที่สองเพราะ ‘ลูกพูดมากกว่า’ ไม่ใช่เพราะลูกเก่งกว่า"
    options:
      - text: "แม่พี่ตลกดี{k}"
        heart: 1
        reply: "ตลกครับ แม่เป็นคนเดียวที่ผมเถียงไม่ชนะ แม่ใช้ตัวเลขน้อยกว่าผมแต่ใช้ความจริงมากกว่า"
      - text: "แม่พี่ห่วงพี่ไหม{kq}"
        heart: 2
        reply: "ห่วงครับ… แม่ถามผมทุกคืนว่า ‘กินข้าวยัง’ ‘มีแฟนยัง’ ข้อแรกผมโกหกบ่อย ข้อสองผมยังตอบไม่ได้… ทำไมผมเล่าเรื่องนี้ให้ฟังก็ไม่รู้ครับ"

  # ===== others =====
  - id: kla_o_heng
    topic: others
    npc: "เสี่ยเฮงไม่ใช่คนเลวครับ ผมต้องพูดให้ชัด… เสี่ยเป็นคนที่ทำทุกอย่างถูกตามกฎหมาย ซึ่งเป็นปัญหาของกฎหมาย ไม่ใช่ปัญหาของเสี่ย"
    options:
      - text: "พี่ยุติธรรมกับเสี่ยจังนะ{kq}"
        heart: 1
        reply: "ตาชั่งต้องเที่ยงกับทุกคนครับ แม้แต่เสี่ย… แต่ถ้าเสี่ยหักความชื้นสิบห้าเปอร์เซ็นต์ตอนแดดเปรี้ยงอีกครั้ง ผมจะเที่ยงน้อยลงนิดหนึ่ง"
      - text: "เสี่ยเคยช่วยใครไหม{kq}"
        heart: 1
        reply: "เคยครับ ตอนน้ำท่วม เสี่ยเอารถบรรทุกไปขนของให้ทั้งหมู่ ไม่คิดเงินสักบาท… แล้วเดือนต่อมาก็ปล่อยกู้ซ่อมบ้านดอกสามเปอร์เซ็นต์ คนเรามีหลายด้านครับ"
      - text: "พี่กลัวเสี่ยไหม{kq}"
        heart: 1
        reply: "ไม่กลัวเสี่ยครับ ผมกลัวว่าวันหนึ่งผมจะกลายเป็นเสี่ย… คนที่คิดทุกอย่างเป็นตัวเลข ผมก็คิดเป็นตัวเลขนะครับ แค่ตัวเลขผมยังไม่มีดอก"

  - id: kla_o_palm
    topic: others
    npc: "ปาล์มเพิ่งมาเก็บตัวอย่างแมลงที่แปลงผมครับ เจอแมงมุมสิบสองชนิด เธอดีใจจนพูดเร็วจนผมฟังไม่ทัน… ผมเพิ่งรู้ว่ามีคนพูดเร็วกว่าผม"
    options:
      - text: "พี่สองคนเข้ากันดีนะ{kq}"
        heart: 0
        reply: "เราเป็นเพื่อนร่วมรบครับ… ปาล์มรบในห้องประชุม อบต. ผมรบที่ลานเสี่ย เราเจอกันตรงกลางที่ถังน้ำโลโก้บริษัท"
      - text: "แมงมุมเยอะดีไหม{kq}"
        heart: 1
        reply: "ดีครับ แมงมุมกินเพลี้ย ปาล์มบอกว่าแปลงผมเป็น ‘ระบบนิเวศสมบูรณ์’ ผมจะพิมพ์คำนี้ติดหน้าสหกรณ์ ใต้ป้ายค่าไฟค้าง"

  - id: kla_o_may
    topic: others
    npc: "เมย์ขอกราฟระดับน้ำผมไปลงข่าว ผมให้ครับ แต่ขอให้เครดิตสหกรณ์ เธอเขียนว่า ‘ข้อมูลจากชาวนาหัวรั้นที่มีกราฟ’ … ผมว่าก็ถูกนะครับ"
    options:
      - text: "พี่ไม่โกรธเหรอ{kq}"
        heart: 1
        reply: "ไม่ครับ หัวรั้นเป็นคำที่แม่ผมใช้ทุกวัน ผมชินแล้ว อย่างน้อยเมย์ก็ใส่ ‘ที่มีกราฟ’ ต่อท้าย เป็นคำชมแบบเมย์"
      - text: "เมย์ไม่กลัวบริษัทเหรอ{kq}"
        heart: 1
        reply: "กลัวครับ มีรถขับตามเธอกลางคืน… เธอไม่เล่าให้ใครฟัง ผมรู้เพราะผมเห็นเองตอนกลับจากสหกรณ์ ผมเลยปั่นมอไซค์ตามรถคันนั้นไปจนสุดถนน มอไซค์ผมดับ รถเขาก็ไปแล้ว"

  - id: kla_o_sommai
    topic: others
    npc: "ลุงสมหมายมาถามผมว่าสหกรณ์จะซื้อรถเกี่ยวข้าวไหม ผมบอกยังไม่มีเงิน ลุงโล่งใจจนยิ้ม แล้วก็ถามต่อว่าเลขทะเบียนรถเกี่ยวสหกรณ์จะเป็นเลขอะไร"
    options:
      - text: "พี่อยากได้รถเกี่ยวไหม{kq}"
        heart: 1
        reply: "อยากครับ คิวรถเกี่ยวลุงยาวสามวัน ข้าวร่วงวันละสองเปอร์เซ็นต์… แต่ถ้าสหกรณ์ซื้อ ลุงจะเสียรายได้ ผมยังคิดไม่ออกว่าจะชวนลุงมาเป็นหุ้นส่วนยังไง"
        next:
          - text: "ชวนลุงมาขับให้สหกรณ์สิ{kq}"
            heart: 2
            reply: "…ผมไม่เคยคิดแบบนี้เลยครับ ให้ลุงเป็นคนขับ รถเป็นของทุกคน ลุงได้ค่าแรงประจำ ไม่ต้องรอคิว… ผมจะไปคุยกับป้าพรก่อน ป้าพรคือคนตัดสินใจจริง"
          - text: "ลุงคงอยากได้เลขรถมากกว่า{k}"
            heart: 1
            reply: "ใช่ครับ ผมว่าถ้าผมให้ลุงเลือกเลขทะเบียน ลุงจะยอมทุกอย่าง… นี่คือการต่อรองที่ผมไม่ได้เรียนมาจากมูลนิธิ"
      - text: "ลุงยังซื้อหวยทุกงวดเลยเหรอ{kq}"
        heart: 1
        reply: "ทุกงวดครับ ลุงบอกว่าเป็น ‘การลงทุนระยะยาว’ ป้าพรบอกว่า ‘ระยะยาวสามสิบปี กำไรติดลบ’ ผมไม่กล้าเข้าข้างใคร"

  - id: kla_o_taew
    topic: others
    npc: "ป้าแต๋วเป็นสมาชิกสหกรณ์ที่ทรงพลังที่สุดครับ ไม่ได้ส่งผักสักกำ แต่หาสมาชิกใหม่ได้สามสิบคน ด้วยวิธี ‘ป้าไม่ได้พูดนะ’"
    options:
      - text: "ป้าพูดว่าไงบ้าง{kq}"
        heart: 1
        reply: "ป้าบอกทุกคนว่า ‘ป้าไม่ได้พูดนะ แต่สหกรณ์ไอ้กล้าไม่หักความชื้น’ คนฟังรู้สึกว่าเป็นความลับ เลยรีบมาสมัคร… เป็นการตลาดที่ดีที่สุดที่ผมไม่ได้จ่าย"
      - text: "ป้าเล่าเรื่องพี่กับ{p}หรือเปล่า{kq}"
        heart: 1
        reply: "…ป้าเล่าอะไรครับ ผมไม่ได้ยินอะไรนะครับ ผมได้ยินแค่ว่าป้าถามว่าผมชอบกินอะไร แล้วป้าบอกว่า ‘เผื่อมีคนอยากรู้’ ใครอยากรู้ครับ"

quests:
  - id: kla_q1
    npc: kla
    title: "กองปุ๋ยชื่อความหวัง"
    desc: "กล้าชวนช่วยทำปุ๋ยหมักกองใหม่และส่งผักเช้าให้ร้านพี่หน่อยกับโรงเรียน"
    start: { heart_min: 0, day_min: 2 }
    offer:
      npc: "{player} ครับ ถ้าไม่รบกวน… ผมจะตั้งกองปุ๋ยหมักกองใหม่ ต้องการไส้เดือนช่วยย่อย ถ้าคุณขุดดินที่ฟาร์มแล้วเจอไส้เดือน เอามาให้ผมสักหกตัวได้ไหมครับ ลองคิดดูนะครับ ไส้เดือนหกตัวกลายเป็นหกร้อยตัวในสามเดือน"
      options:
        - text: "ได้{k} {p}จะขุดหาให้"
          accept: true
          heart: 1
          reply: "ขอบคุณครับ! ไส้เดือนตัวอ้วนๆ นะครับ ตัวที่ดิ้นแรงคือตัวที่ขยัน… ผมพูดเหมือนกำลังรับสมัครพนักงานเลย"
        - text: "เอาไส้เดือนไปทำอะไรนะ{kq} ไม่เข้าใจ"
          accept: true
          heart: 1
          reply: "มันกินเศษใบไม้แล้วถ่ายออกมาเป็นปุ๋ยครับ ปุ๋ยที่ดีที่สุดในโลก ไม่มีบริษัทไหนผลิตได้… ขอโทษครับ ผมตื่นเต้นเรื่องขี้ไส้เดือนไปหน่อย"
        - text: "ไส้เดือนเหรอ{kq} ไม่เอาดีกว่า"
          heart: 0
          reply: "ไม่เป็นไรครับ หลายคนรู้สึกแบบนี้ ไส้เดือนไม่โกรธหรอกครับ มันใจกว้างกว่าคนเยอะ"
    steps:
      - goal: { type: give, npc: kla, item: worm, n: 6 }
        hint: "ขุดหาไส้เดือน 6 ตัวที่ฟาร์ม แล้วเอาไปให้กล้าที่สวนสหกรณ์"
        done:
          npc: "หกตัว อ้วนทุกตัว! ผมจะปล่อยลงกองใหม่ตอนนี้เลย… กองนี้ยังไม่มีชื่อครับ {player} ตั้งให้ได้ไหม"
          options:
            - text: "ชื่อ ‘ความหวัง’ เหมือนกองแรกเลย{k}"
              heart: 1
              reply: "กองแรกชื่อนี้แล้วครับ… แต่ไม่เป็นไร ความหวังมีสองกองก็ดี ถ้ากองหนึ่งเน่า เรายังมีอีกกอง"
            - text: "ชื่อ ‘ยายเพียร’ {k}"
              heart: 2
              reply: "…ได้ครับ ยายเพียรเป็นสมาชิกหมายเลขเจ็ด ตอนนี้เป็นกองปุ๋ยหมายเลขสี่ ผมว่ายายคงหัวเราะ ยายชอบของที่ทำให้ดินดีขึ้น"
            - text: "ชื่อ ‘งบประมาณสอง’ {k}"
              heart: 1
              reply: "ฮ่า! กองงบประมาณกองแรกยังไม่ย่อยเลยครับ ตั้งชื่อเดียวกันไปเดี๋ยวมันจะหายไปครึ่งกองแบบไม่มีใครรู้"
      - goal: { type: visit, place: coop_garden, from: "06:00", to: "08:00" }
        hint: "ไปสวนสหกรณ์ตอนเช้า ช่วยกล้ามัดผักส่งร้านพี่หน่อยกับโรงเรียน"
        done:
          npc: "มาทันพอดีครับ! ผักบุ้งสามสิบกำ กะเพราสิบกำ มัดด้วยตอกนะครับ ไม่ใช้หนังยาง… เสร็จแล้ว ผมไปส่งร้านพี่หน่อย คุณไปส่งโรงเรียนได้ไหม ครูเต้ยจะติดดาวให้"
          options:
            - text: "ไปเลย{k} มัดผักสนุกดี"
              heart: 1
              reply: "สนุกใช่ไหมครับ! ผมบอกทุกคนว่ามัดผักสนุก ไม่มีใครเชื่อ คุณเป็นคนแรกที่พูดเองโดยผมไม่ต้องบังคับ"
            - text: "ทำไมไม่ใช้หนังยาง{kq} เร็วกว่า"
              heart: 0
              reply: "หนังยางตกในแปลงแล้วไม่ย่อยครับ ตอกไผ่ย่อย… อีกอย่างหนังยางร้านป้าแต๋วขึ้นราคาถุงละสองบาท ผมคิดไว้แล้ว"
            - text: "พี่กินข้าวเช้าหรือยัง{kq}"
              heart: 2
              reply: "…ยังครับ ไม่มีใครถามผมแบบนี้ตอนหกโมงเช้า นอกจากพี่หน่อย เดี๋ยวผมกินที่ร้านพี่หน่อยเลยครับ สัญญา"
    reward: { money: 150, heart: 1, items: { bio_ferment: 1 }, set_flag: kla_q1_done, line: { from: kla, text: "สหกรณ์ผักอินทรีย์บ้านดงเย็นมีกองปุ๋ยใหม่หนึ่งกองครับ ขอบคุณสมาชิกกิตติมศักดิ์คนใหม่ที่ช่วยหาไส้เดือนและมัดผัก 🌱 ผักวันนี้ส่งครบทุกที่ ไม่เหลือทิ้งสักกำครับ" } }

  - id: kla_q2
    npc: kla
    title: "ก่อนยกมือ"
    desc: "กล้าอยากรู้ว่าชาวบ้านคิดยังไงกับเรื่องน้ำจริงๆ ช่วยไปฟังป้าแต๋วกับตาเผือก"
    start: { flag: kla_q1_done, day_min: 4 }
    offer:
      npc: "ผมขออะไรอย่างหนึ่งได้ไหมครับ… ไม่ได้ขอให้ช่วยหาเสียงนะครับ ผมขอให้ช่วยฟัง ผมพูดเก่ง แต่ฟังไม่เก่ง คนเลยไม่เล่าความจริงให้ผมฟัง ช่วยไปถามป้าแต๋วกับตาเผือกว่าเขาอยากได้อะไรจากงบ อบต. จริงๆ"
      options:
        - text: "ได้{k} {p}ไปฟังให้"
          accept: true
          heart: 1
          reply: "ขอบคุณครับ… ห้ามพูดว่าผมฝากมานะครับ ถ้าป้าแต๋วรู้ว่าเป็นเรื่องผม ป้าจะเล่าเรื่องผมแทนเรื่องตัวเอง"
        - text: "พี่ไปถามเองก็ได้นี่{kq}"
          accept: true
          heart: 0
          reply: "ผมถามแล้วครับ ป้าแต๋วตอบว่า ‘แล้วแต่กล้าเลย’ ตาเผือกไม่ตอบ… ผมว่าคนตอบแบบนั้นเพราะผมถามแบบมีคำตอบในใจไว้แล้ว คุณยังไม่มี"
        - text: "{p}ไม่อยากยุ่งเรื่องการเมือง{k}"
          heart: 0
          reply: "เข้าใจครับ… แต่เรื่องน้ำไม่ใช่การเมืองนะครับ มันเป็นเรื่องที่การเมืองชอบมายุ่ง ไว้ถ้าเปลี่ยนใจบอกผมนะครับ"
    steps:
      - goal: { type: talk, npc: taew }
        hint: "ไปคุยกับป้าแต๋วที่ร้านชำ ถามว่าป้าอยากได้อะไรจากงบ อบต."
        done:
          npc: "ป้าอยากได้ตลาดนัดจ้ะหลาน ตลาดมาคนก็มา คนมาร้านป้าก็ขายได้… ป้าไม่ได้พูดนะ แต่บ่อหลังร้านป้าน้ำลดลงไปศอกนึงแล้ว ป้ายังไม่กล้าบอกใคร กลัวคนตกใจ"
          options:
            - text: "ถ้าบ่อแห้ง ตลาดก็ไม่มีน้ำล้างผักนะ{kq}ป้า"
              heart: 1
              reply: "ตายแล้ว… ป้าไม่ได้คิดเรื่องนั้นเลย ป้าคิดแต่เรื่องคนเดินผ่าน ป้าขอคิดก่อนนะหลาน ป้ายังไม่เปลี่ยนใจ แต่ป้าจะคิด"
            - text: "ป้าบอกพี่กล้าเรื่องบ่อด้วยได้ไหม{kq}"
              heart: 1
