  - id: kla_a_loan
    topic: advice
    npc: "ถ้าจะกู้ ให้คิดเป็นจำนวนวันทำงานครับ ไม่ใช่จำนวนบาท ดอกเดือนละห้าเปอร์เซ็นต์ เท่ากับทำงานฟรีให้คนปล่อยกู้เดือนละวันครึ่ง"
    options:
      - text: "คิดแบบนี้น่ากลัวกว่าเดิมอีก{k}"
        heart: 1
        reply: "ใช่ครับ ผมคิดแบบนี้แล้วนอนไม่หลับมาห้าปี… เดี๋ยว นั่นไม่ใช่คำแนะนำที่ดี เอาเป็นว่าคิดแบบนี้แล้วกู้น้อยลงครับ"
      - text: "พี่เคยกู้ไหม{kq}"
