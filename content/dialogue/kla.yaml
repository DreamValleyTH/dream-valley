    options:
      - text: "พี่ฝันอยากให้ที่นี่เป็นแบบนั้นเหรอ{kq}"
        heart: 1
        reply: "ฝันครับ แต่ผมเริ่มจากให้ตาชั่งเที่ยงก่อน… ฝันใหญ่ต้องมีอะไรเล็กๆ ที่ทำได้วันนี้ ไม่งั้นมันกลายเป็นป้ายไวนิล"
