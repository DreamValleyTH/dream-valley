    options:
      - text: "ซ่อมได้ไหม{kq}"
        heart: 1
        reply: "ช่างเปี๊ยกซ่อมให้ครับ เคาะสามที บอกว่า ‘หายแล้ว’ แล้วคิดค่าซ่อมห้าสิบ… ผมยังไม่แน่ใจว่าหายเพราะเคาะหรือเพราะห้าสิบ"
      - text: "ตั้งชื่อตาชั่งด้วยเหรอ{kq}"
        heart: 1
        reply: "ตั้งทุกอย่างครับ มอเตอร์ไซค์ชื่อ ‘ศรัทธา’ บอลตั้งให้ บอกว่าวิ่งได้ด้วยศรัทธาล้วนๆ… ผมเลยไม่กล้าเปลี่ยนชื่อ กลัวมันดับ"
      - text: "สองขีดเองนะ{kq}"
        heart: 0
        reply: "สองขีดคูณร้อยคน คูณห้าสิบสองอาทิตย์ เท่ากับหนึ่งพันกิโลต่อปีครับ… ผมคิดไว้แล้วตอนนอนไม่หลับ"

  - id: kla_s_rice
