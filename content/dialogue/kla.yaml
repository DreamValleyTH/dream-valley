            reply: "ขอบคุณครับ… ถ้าไม่ได้ผลจริงๆ มาบอกผม ผมมีชีวภัณฑ์ที่สหกรณ์ ราคาทุน ไม่มีดอก"
          - text: "พ่อพี่เป็นยังไงบ้าง{kq}"
            heart: 2
