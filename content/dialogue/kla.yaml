        reply: "สามแถวครับ แม่ถามว่าผมทำอะไร ผมบอกว่ากำลังเรียนรู้จากญี่ปุ่น แม่บอกว่า ‘ญี่ปุ่นเขาไม่ดายผักกาดตัวเอง’"
