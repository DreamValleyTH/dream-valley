    options:
      - text: "อยากไปดูจัง{k}"
        heart: 2
        reply: "มาได้ครับ ช่วงหกโมงครึ่งถึงทุ่มครึ่ง ก่อนผีออก… ผมจะไม่พูดเรื่องสหกรณ์เลย ผมสัญญา อาจจะพูดเรื่องหิ่งห้อยนิดหน่อย"
