    options:
      - text: "ไปกินข้าวมันไก่กันไหม{kq} {p}เลี้ยง"
        heart: 2
        reply: "…ห้ามบอกสมาชิกสหกรณ์นะครับ ถ้าป้าแต๋วเห็น เดี๋ยวทั้งตำบลรู้ว่าประธานสหกรณ์กินไก่ฟาร์ม… ผมไปครับ ผมไปแน่นอน"
      - text: "ข้าวกล้องก็อร่อยนะ{kq}"
        heart: 1
        reply: "อร่อยครับ ผมพูดแบบนี้กับตัวเองวันละสามมื้อ… ข้าวกล้องหอมนิลของสหกรณ์อร่อยจริง แต่ฝันมันไม่ฟังเหตุผล"
      - text: "ฝันแปลกจัง{k}"
        heart: 1
        reply: "ลุงสมหมายบอกว่าฝันถึงไก่ได้เลขเก้า ข้าวมันไก่ได้เลขเก้าสอง… ผมไม่ซื้อหวยครับ แต่ผมจดไว้ให้ลุงแล้ว"

  - id: kla_s_fireflies
