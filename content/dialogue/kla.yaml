# กล้า ♥ — สหกรณ์ผักอินทรีย์ (ฝั่งชุมชน) · convos + quests
convos:
  # ===== react =====
  - id: kla_r_meet
    topic: react
    once: true
    when: { not_flag: met_kla }
    npc: "สวัสดีครับ {player} ใช่ไหม หลานยายเพียร… ผมกล้า ทำสหกรณ์ผักตรงนี้ ยายคุณเป็นสมาชิกหมายเลขเจ็ด ซื้อหุ้นสามหุ้นทั้งที่ไม่เคยส่งผักให้สักกำ"
    set_flag: met_kla
    options:
      - text: "ยายซื้อหุ้นทำไม{kq} ถ้าไม่ได้ส่งผัก"
        heart: 1
        reply: "ผมก็ถามครับ ยายบอกว่า ‘ซื้อให้แกมีเพื่อน’ ตอนนั้นสมาชิกมีหกคน รวมผมกับแม่… ยายเป็นคนแรกที่ไม่ใช่ญาติ"
        next:
          - text: "งั้นหุ้นยายตอนนี้เป็นของ{p}ไหม{kq}"
            heart: 1
            reply: "ตามระเบียบต้องโอนครับ แต่ผมยังไม่ได้ทำ ผมยังไม่อยากลบชื่อยายออกจากสมุด… ไว้ค่อยเขียนต่อท้ายแทนดีไหมครับ"
          - text: "ยายคงเชื่อในตัวพี่{k}"
            heart: 2
            reply: "หรือยายแค่สงสารผมที่นั่งโต๊ะพับคนเดียว… ไม่เป็นไรครับ ไม่ว่าเพราะอะไร ผมก็ยังอยู่ได้ถึงวันนี้"
      - text: "สหกรณ์ทำอะไรบ้าง{kq}"
        heart: 1
        reply: "รับซื้อผักกับข้าวราคาตลาด ชั่งต่อหน้า ไม่หักความชื้นเกินจริง แบ่งกำไรคืนสมาชิก… ลองคิดดูนะครับ ถ้าชาวนาร้อยคนไม่โดนหักคนละสิบเปอร์เซ็นต์… ขอโทษครับ เจอกันครั้งแรกผมก็เทศน์แล้ว"
      - text: "{p}แค่ผ่านมา{k}"
        heart: 0
        reply: "ครับ ผ่านมาก็ดีครับ ส่วนใหญ่คนผ่านแล้วไม่หยุด… ถ้าวันไหนอยากหยุด มีน้ำใบเตยในกระติกนะครับ ไม่ใส่น้ำตาล"

  - id: kla_r_fainted
    topic: react
    when: { fainted_recent: true }
    npc: "{player} ครับ! ได้ยินว่าเมื่อคืนเป็นลมกลางทาง ค่ารักษาสิบเปอร์เซ็นต์ของเงินสดใช่ไหมครับ… ขอโทษ ผมถามเรื่องเงินก่อนถามอาการ ผมแย่จริงๆ"
    options:
      - text: "ไม่เป็นไรแล้ว{k} แค่หมดแรง"
        heart: 1
        reply: "หมดแรงแปลว่ากินไม่พอครับ ผมรู้เพราะผมก็เป็นบ่อย… พรุ่งนี้มาสหกรณ์ตอนเช้า ผมมีข้าวต้มข้าวกล้อง ไม่อร่อยแต่มีประโยชน์"
      - text: "พี่ก็เป็นลมบ่อยไม่ใช่เหรอ{kq}"
        heart: 1
        reply: "…ใครบอกครับ พี่หน่อยใช่ไหม สองครั้งเองครับ ครั้งหนึ่งเพราะแดด อีกครั้งเพราะอ่านใบแจ้งหนี้"
      - text: "ค่ารักษาแพงมาก{k}"
        heart: 0
        reply: "แพงครับ ถ้าฝากเงินไว้ที่ธนาคารเกษตรจะเสียน้อยกว่านี้ ผมไม่ได้สอนนะครับ ผมแค่… ใช่ ผมสอน"

  - id: kla_r_thana_refused
    topic: react
    once: true
    when: { flag: thana_refused }
    npc: "ผมได้ยินว่า {player} ไม่ขายที่ให้คุณธนา… ผมไม่รู้จะพูดยังไงครับ ผมนั่งยิ้มคนเดียวที่โรงคัดผักครึ่งชั่วโมง แม่นึกว่าผมโดนแดด"
    options:
      - text: "ที่ของยาย{p}ขายไม่ลง{k}"
        heart: 2
        reply: "ที่ดินแปลงนั้นติดคลองส่งน้ำ ถ้าบริษัทได้ไป เขาจะได้ทางเชื่อมจากบ่อบาดาลถึงคลอง… ขอโทษครับ ผมคิดเป็นแผนที่ก่อนคิดเป็นความรู้สึก ผมดีใจครับ จริงๆ"
      - text: "พี่ยิ้มทำไม{kq} ไม่ใช่ที่พี่"
        heart: 1
        reply: "เพราะทุกแปลงที่ไม่ขายคือรั้วที่ไม่ขยับครับ บ้านผมอยู่แปลงสุดท้ายก่อนถึงรั้ว ผมนับระยะเป็นเมตรทุกปี"
      - text: "ยังไม่แน่หรอก{k} ถ้าเขาเพิ่มราคา"
        heart: -1
        reply: "ครับ… เข้าใจครับ ผมไม่มีเงินจะไปสู้ราคาเขา ผมมีแต่กราฟระดับน้ำ ซึ่งไม่มีใครอยากได้เป็นค่าตอบแทน"

  - id: kla_r_thana_haggled
    topic: react
    once: true
    when: { flag: thana_haggled }
    npc: "{player} ถามราคาเพิ่มกับคุณธนาเหรอครับ… ไม่ต้องอธิบายครับ ผมเข้าใจ ใครๆ ก็ต้องรู้ราคาของตัวเอง"
    options:
      - text: "{p}แค่อยากรู้ว่าเขาให้ได้ถึงเท่าไหร่{k}"
        heart: 1
        reply: "ถ้าเขายอมเพิ่ม แปลว่าที่ตรงนั้นมีค่ากับเขามากกว่าที่เขาบอกครับ ลองคิดดูนะครับ คนซื้อไม่เคยจ่ายเกินของที่ไม่จำเป็น"
        next:
          - text: "แปลว่าที่ยายมีน้ำใต้ดินเยอะเหรอ{kq}"
            heart: 2
            reply: "ผมเดาว่าใช่ครับ บ่อบ้านยายไม่เคยแห้งเลยสักปี ผมมีตัวเลขห้าปี… ถ้าอยากดู ผมพาไปนั่งดูได้ ไม่เกินห้าชั่วโมง ล้อเล่นครับ ชั่วโมงเดียว"
          - text: "พี่ไม่ผิดหวังใน{p}ใช่ไหม{kq}"
            heart: 1
            reply: "ผมไม่มีสิทธิ์ผิดหวังครับ ผมไม่ได้เป็นคนจ่ายภาษีที่ดินแทน… แต่ถ้าถามความรู้สึก ผมหวังว่าตัวเลขเขาจะไม่สูงพอ"
      - text: "ที่ของ{p} {p}ทำอะไรก็ได้{k}"
        heart: -1
        reply: "ใช่ครับ ถูกต้องตามกฎหมายทุกอย่าง… แต่น้ำใต้ดินไม่รู้กฎหมายครับ มันไหลไปหาคนที่ดูดแรงที่สุด"

  - id: kla_r_vote_water
    topic: react
    once: true
    when: { flag: vote_water }
    npc: "{player} ยกมือให้ระบบน้ำ… ผมเห็นครับ ผมนับมือทุกมือ คุณเป็นมือที่สิบเก้า ผมจำได้เพราะผมเกือบร้องไห้ตอนมือที่สิบแปด"
    options:
      - text: "พี่พูดในประชุมดีมาก{k}"
        heart: 2
        reply: "ผมพูดเกินเวลาไปสิบสองนาทีครับ นายกฯ เคาะไมค์สามรอบ กำนันตื่นขึ้นมาสองรอบ… แต่ขอบคุณครับ ผมเอาไปบอกกอง ‘ความอดทน’ แล้ว"
      - text: "ทำไมต้องนับมือด้วย{kq}"
        heart: 1
        reply: "เพราะผู้ใหญ่นับมือแล้วได้ตัวเลขไม่เท่ากันสามรอบครับ ผมเลยนับเองเป็นรอบที่สี่ ได้ตัวเลขที่ห้า"
      - text: "{p}โหวตเพราะน้ำในบ่อตัวเอง{k}"
        heart: 1
        reply: "เหตุผลที่ดีที่สุดเลยครับ คนที่รักบ่อตัวเองคือคนที่จะดูแลบ่อคนอื่นต่อ ผมไม่ต้องการคนรักอุดมการณ์ ผมต้องการคนรักบ่อ"

  - id: kla_r_vote_road
    topic: react
    once: true
    when: { flag: vote_road }
    npc: "{player} โหวตถนน… ไม่เป็นไรครับ ถนนก็จำเป็น รถขนผักสหกรณ์ผมก็วิ่งถนนนั้น โช้คหักไปสองรอบแล้ว"
    options:
      - text: "ถนนพังจริงๆ{k} ลุงเชิดบ่นทุกวัน"
        heart: 1
        reply: "ใช่ครับ ผมไม่เถียง… ผมแค่กลัวว่าถนนดีขึ้นแล้วรถบรรทุกลานเสี่ยจะวิ่งเร็วขึ้น แล้วเสี่ยจะรับซื้อจากหมู่อื่นได้ไกลขึ้น ผมคิดไปไกลอีกแล้ว ขอโทษครับ"
      - text: "พี่โกรธ{p}หรือเปล่า{kq}"
        heart: 1
        reply: "ไม่โกรธครับ ประชาธิปไตยไม่ได้แปลว่าทุกคนต้องเห็นด้วยกับผม… ถึงผมจะหวังอย่างนั้นทุกครั้งก็ตาม"
        next:
          - text: "ครั้งหน้า{p}จะฟังพี่ก่อนโหวต{k}"
            heart: 1
            reply: "ฟังได้ครับ แต่อย่าเชื่อเพราะผมพูด ลองไปดูบ่อตัวเองก่อน ตัวเลขในบ่อไม่เคยหาเสียงให้ใคร"
          - text: "พี่ก็ต้องรู้จักแพ้บ้างนะ{kq}"
            heart: 0
            reply: "ผมแพ้บ่อยครับ แพ้เก่งด้วย… สิ่งที่ผมไม่ค่อยเก่งคือแพ้แล้วไม่พูดต่อ"
      - text: "ถนนดีขึ้นก็ขายผักได้ไกลขึ้นนะ{kq}"
        heart: 1
        reply: "จริงครับ ลองคิดดูนะครับ ขนส่งถูกลงกิโลละห้าสิบสตางค์… โอเค ผมยอมรับว่าเป็นตัวเลขที่ผมชอบ"

  - id: kla_r_vote_market
    topic: react
    once: true
    when: { flag: vote_market }
    npc: "{player} โหวตตลาดนัดเหมือนป้าแต๋วเลยครับ ป้าแต๋วเดินมาจับมือคุณหลังประชุมใช่ไหม ป้าจับแน่นจนผมเห็นจากอีกฝั่งศาลา"
    options:
      - text: "ตลาดนัดดีกับแม่ค้าทุกคนนะ{kq}"
        heart: 1
        reply: "ดีครับ สหกรณ์ก็จะได้มีแผงประจำ… ผมแค่คิดว่าถ้าไม่มีน้ำ ตลาดจะขายผักจากที่อื่นหมด แต่นั่นเป็นปัญหาของผม ไม่ใช่ของตลาด"
      - text: "ป้าแต๋วจับมือ{p}เจ็บเลย{k}"
        heart: 1
        reply: "ป้าจับมือผมแบบนั้นครั้งเดียว ตอนป้าสมัครสมาชิกสหกรณ์ แล้วป้าก็เล่าเรื่องผมให้ทั้งตำบลฟังสามวัน ระวังนะครับ"

  - id: kla_r_result
    topic: react
    once: true
    when: { flag: meeting1_result_water }
    npc: "ระบบน้ำชนะครับ… แล้วครึ่งหนึ่งของงบไปเป็น ‘โครงการศึกษาความเป็นไปได้’ ผมขอดูรายงานศึกษา เขาบอกว่ายังไม่ได้เริ่มศึกษา แต่เงินเบิกไปแล้ว"
    options:
      - text: "เบิกก่อนศึกษาได้ด้วยเหรอ{kq}"
        heart: 1
        reply: "ได้ครับ ถ้าศึกษาความเป็นไปได้ของการเบิก ซึ่งเป็นไปได้มาก… ผมตั้งชื่อกองปุ๋ยใหม่ว่า ‘ศึกษาความเป็นไปได้’ มันยังไม่ย่อยสักที"
        next:
          - text: "แล้วครึ่งที่เหลือพอทำอะไรได้{kq}"
            heart: 1
            reply: "พอวางท่อจากหอถังน้ำถึงหมู่สามครับ ไม่ถึงหมู่สี่ บ้านผมอยู่หมู่สี่… ไม่เป็นไรครับ อย่างน้อยหมู่สามก็ได้"
          - text: "เอาเรื่องนี้ไปให้เมย์ไหม{kq}"
            heart: 1
            reply: "เมย์รู้แล้วครับ เมย์รู้ก่อนผมด้วย เธอบอกว่าข่าวนี้ไม่ใช่ข่าว เพราะเกิดทุกปี ‘หมาไม่กัดคนไม่ใช่ข่าว’ เธอว่าอย่างนั้น"
      - text: "อย่างน้อยก็ชนะนะ{kq}"
        heart: 1
        reply: "ชนะครึ่งเดียวครับ ผมจะดีใจครึ่งเดียว อีกครึ่งเก็บไว้ดีใจตอนน้ำไหลจริง"

  - id: kla_r_well_dry
    topic: react
    when: { flag: story_well_dry }
    npc: "บ่อหลังร้านป้าแต๋วแห้ง บ่อลุงสมหมายก็แห้ง… รวมบ่อสมาชิกสหกรณ์อีกเจ็ดเป็นเก้า ผมเอาสีแดงจุดในแผนที่จนแผนที่เหมือนเป็นหัด"
    options:
      - text: "ทำไงดี{kq}พี่"
        heart: 1
        reply: "เก็บตัวเลขครับ ทุกบ่อ ทุกวัน เวลาเดียวกัน ถ้าเราไม่มีตัวเลข เราก็มีแค่ความรู้สึก แล้วความรู้สึกแพ้รายงานบริษัททุกครั้ง"
      - text: "บ่อของ{p}ยังมีน้ำอยู่{k}"
        heart: 1
        reply: "บ่อยายอยู่ลึกกว่าบ่อคนอื่นสามเมตรครับ ยายจ้างขุดเพิ่มเมื่อสิบปีก่อน ตอนนั้นใครๆ ก็หัวเราะ ตอนนี้ไม่มีใครหัวเราะแล้ว"
        next:
          - text: "ยายรู้ล่วงหน้าเหรอ{kq}"
            heart: 2
            reply: "ผมไม่รู้ครับ ยายบอกผมแค่ว่า ‘น้ำมันมีวันหมด คนก็มีวันโลภ’ ผมจดไว้หน้าแรกสมุดบัญชีสหกรณ์"
          - text: "แบ่งน้ำให้ป้าแต๋วได้ไหม{kq}"
            heart: 2
            reply: "ได้ครับ ถ้าคุณยอม… ผมจะต่อสายยางให้ แต่ช่วยจดลิตรไว้ด้วย ไม่ได้จะคิดเงินนะครับ ผมจะใช้เป็นข้อมูล"
      - text: "อาจเป็นเพราะแล้งก็ได้{k}"
        heart: 0
        reply: "ปีนี้ฝนน้อยกว่าเฉลี่ยห้าเปอร์เซ็นต์ครับ แต่น้ำบ่อลดลงสี่สิบ… ห้าไม่เท่ากับสี่สิบครับ ต่อให้คิดเลขแบบนายกฯ ก็ไม่เท่า"

  - id: kla_r_may
    topic: react
    once: true
    when: { flag: helped_may }
    npc: "เมย์บอกผมว่าคุณไปถ่ายรูปท่อกับเธอตอนกลางคืน… {player} ครับ มันอันตรายนะครับ ทั้งผีทั้งคนของบริษัท แต่… ขอบคุณครับ"
    options:
      - text: "พี่ก็อยากไปเองไม่ใช่เหรอ{kq}"
        heart: 1
        reply: "อยากครับ แต่เมย์ไม่ให้ไป เธอว่าผม ‘หน้าเหมือนคนฟ้องศาล’ คนของบริษัทจำหน้าผมได้หมด ส่วนคุณหน้ายังเหมือนคนกลับบ้านมาพักผ่อน"
      - text: "รูปชัดมาก{k} ท่อใหญ่กว่าที่คิด"
        heart: 1
        reply: "สิบสองนิ้วใช่ไหมครับ ผมเดาไว้ตั้งแต่แรก… ผมดีใจที่เดาถูก แล้วก็เสียใจที่เดาถูก สองอย่างพร้อมกัน"
      - text: "{p}กลัวแทบตาย{k}"
        heart: 2
        reply: "ผมก็กลัวครับ ผมกลัวทุกครั้งที่ไปยื่นหนังสือ กลัวทุกครั้งที่ขึ้นพูดในประชุม… ผมคิดว่าความกล้าคือกลัวแล้วยังเดินต่อ ไม่ใช่ไม่กลัว"

  - id: kla_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ถังน้ำโลโก้บริษัทสองร้อยใบ ผมนับแล้วครับ ถ้าเอาเงินค่าถังมาขุดบ่อหมู่บ้าน ได้บ่อลึกสองบ่อ แต่บ่อไม่มีที่ติดโลโก้"
    options:
      - text: "พี่รับถังมาด้วยไหม{kq}"
        heart: 0
        reply: "ไม่รับครับ… แม่ผมรับครับ แม่บอกว่า ‘ถังไม่มีอุดมการณ์ ถังมีแต่ก้น’ ตอนนี้แม่ใช้ใส่ข้าวเปลือก หันโลโก้เข้าฝา"
      - text: "ชาวบ้านแตกเป็นสองฝ่ายเลย{k}"
        heart: 1
        reply: "ใช่ครับ และผมไม่โกรธฝ่ายที่รับถัง คนที่บ่อแห้งมาสองอาทิตย์ ถังหนึ่งใบมีค่ามากกว่าคำพูดผมสองชั่วโมง"
        next:
          - text: "แล้วพี่จะทำยังไงต่อ{kq}"
            heart: 2
            reply: "ทำให้คำพูดผมมีค่ามากกว่าถังครับ… คือหยุดพูดแล้วขุดบ่อชุมชนจริงๆ ถ้าคุณว่าง เอาจอบมาด้วยนะครับ"
          - text: "พี่พูดสองชั่วโมงจริงเหรอ{kq}"
            heart: 1
            reply: "ชั่วโมงห้าสิบนาทีครับ ผมตัดออกไปสิบนาทีแล้ว พัฒนาการครับ"
      - text: "CSR แปลว่าอะไร{kq}"
        heart: 1
        reply: "ตามตำราคือความรับผิดชอบต่อสังคมครับ ตามที่เห็นคือ ‘เอาไปเยอะ คืนเป็นถัง’"

  - id: kla_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ป้ายหาเสียงขึ้นหมดแล้วครับ มีคนเอาป้ายมาติดรั้วสหกรณ์ผมด้วย ผมไม่รู้จักผู้สมัครคนนั้นเลย เขายิ้มกว้างมาก ผมเลยปลดออกแล้วเอาไปคลุมกองปุ๋ย"
    options:
      - text: "ได้ยินว่าคนอยากให้พี่ลงผู้ใหญ่บ้าน{k}"
        heart: 1
        reply: "ผมได้ยินเหมือนกันครับ จากป้าแต๋ว ซึ่งแปลว่าทั้งตำบลได้ยินก่อนผม… ผมไม่รู้ครับ ผมพูดเก่งในโรงคัดผัก แต่ในหอกระจายข่าว ผมกลัวไมค์หอน"
        next:
          - text: "พี่ลงเถอะ{k} {p}จะช่วยหาเสียง"
            heart: 2
            reply: "หาเสียงแบบไม่มีซองนะครับ… ซึ่งแปลว่าเราจะแพ้ ล้อเล่นครับ ไม่แน่ ถ้าคนแบบคุณมีเยอะพอ"
          - text: "ไม่ต้องลงหรอก{k} เหนื่อยเปล่า"
            heart: 0
            reply: "อาจจะจริงครับ… แต่ถ้าคนที่อยากทำไม่ลง คนที่อยากได้ก็ลงแทนทุกครั้ง"
      - text: "ป้ายคลุมปุ๋ยได้ด้วยเหรอ{kq}"
        heart: 1
        reply: "ไวนิลดีมากครับ กันฝนได้สามปี ป้ายหาเสียงคือของที่ทนที่สุดที่ อบต. เคยให้ชาวบ้าน"

  - id: kla_r_truck
    topic: react
    once: true
    when: { flag: sold_to_truck }
    npc: "ผมได้ยินว่าคุณขายพริกให้รถกระบะที่มาประกาศเสียงตามสาย… ราคาเขาดีกว่าสหกรณ์สิบห้าเปอร์เซ็นต์ ผมเช็กแล้วครับ"
    options:
      - text: "ขอโทษ{k}พี่ เงินช็อตจริงๆ"
        heart: 1
        reply: "ไม่ต้องขอโทษครับ ผมแค่อยากรู้ว่าเขาชั่งด้วยตาชั่งอะไร… ถ้าตาชั่งเขาเที่ยง ผมยินดีด้วย ถ้าไม่เที่ยง ผมยินดีจะชั่งให้ใหม่ฟรี"
      - text: "ทำไมสหกรณ์ให้ราคาไม่ได้เท่าเขา{kq}"
        heart: 1
        reply: "เพราะเขาซื้อรอบเดียวแล้วไป ผมซื้อทุกอาทิตย์ทั้งปีครับ ราคาดีวันเดียวกับราคาพอดีทั้งปี… ขอโทษครับ ประโยคนี้ผมพูดเป็นครั้งที่สามสิบแล้วในเดือนนี้"
      - text: "ป้าแต๋วเล่าอีกแล้วใช่ไหม{kq}"
        heart: 0
        reply: "ป้าไม่ได้เล่าครับ ป้า ‘ไม่ได้พูด’ ป้าแค่เปรยว่ามีคนหน้าตาแบบคุณยืนข้างรถกระบะ… ซึ่งก็คือเล่า"

  - id: kla_r_end_shared
    topic: react
    once: true
    when: { flag: kla_end_shared }
    npc: "สมาชิกยี่สิบสามคนลงชื่อค้ำร่วมแล้วครับ แม่เอาโฉนดของพ่อกลับมาใส่หีบแล้ว… พ่อถามว่ามีอะไรดีใจ ผมบอกว่าผักขายได้หมด พ่อไม่เชื่อ"
    options:
      - text: "ทำไมไม่บอกพ่อตรงๆ{kq}"
        heart: 1
        reply: "เพราะพ่อไม่เคยรู้ว่าโฉนดออกจากหีบครับ… บางเรื่องปล่อยให้พ่อคิดว่าลูกขายผักเก่งก็พอแล้ว"
      - text: "ดีใจด้วย{k}พี่ ไม่ต้องแบกคนเดียวแล้ว"
        heart: 2
        reply: "ยังแบกครับ แต่แบกยี่สิบสี่คน… รวมคุณด้วยนะครับ ผมเขียนชื่อคุณไว้ท้ายสุดในสมุด ตรงที่ยายคุณเคยอยู่"

  - id: kla_r_end_company
    topic: react
    once: true
    when: { flag: kla_end_company }
    npc: "สหกรณ์เซ็นสัญญากับบริษัทแล้วครับ ปุ๋ยของเขามาถึงเมื่อเช้า สามสิบกระสอบ… ผมยังไม่เปิดสักกระสอบ ผมนั่งมองมันมาสามชั่วโมงแล้ว"
    options:
      - text: "พี่ทำเพื่อนาของพ่อ{k} ไม่ผิดหรอก"
        heart: 2
        reply: "ผมรู้ครับ ผมบอกตัวเองทุกเช้า… นาพ่อยังอยู่ เงินกู้จ่ายครบ สมาชิกได้เงินเพิ่มยี่สิบเปอร์เซ็นต์ ตัวเลขดีทุกตัว ยกเว้นตัวที่ผมวัดไม่ได้"
        next:
          - text: "ตัวไหนวัดไม่ได้{kq}"
            heart: 1
            reply: "ตัวที่บอกว่าผมยังเป็นคนเดิมไหมครับ… ช่วยวัดให้ผมทีได้ไหม ถ้าวันไหนผมเปลี่ยนไป บอกผมตรงๆ"
          - text: "แปลงเล็กๆ ยังทำอินทรีย์ต่อได้นะ{kq}"
            heart: 2
            reply: "ผมแยกไว้แปลงหนึ่งครับ ไม่ได้อยู่ในสัญญา ผักกาดหอมกับกอง ‘ความหวัง’ … บริษัทซื้อได้ทุกอย่าง ยกเว้นแปลงนั้น"
      - text: "ไม่น่าเซ็นเลย{k}"
        heart: -1
        reply: "ครับ… ผมก็คิดแบบนั้นตอนสามทุ่ม แล้วคิดอีกแบบตอนตีสามที่แม่ร้องไห้เรื่องนา ผมไม่มีคำตอบที่ถูกครับ มีแต่คำตอบที่เลือกแล้ว"

  - id: kla_r_end_run
    topic: react
    once: true
    when: { flag: kla_end_run }
    npc: "ผมไปบอกผู้ใหญ่สมศักดิ์แล้วครับ ว่าถ้าท่านเกษียณ ผมจะลงสมัคร ท่านพูดว่า ‘ย้ำอีกครั้งนะ’ สามรอบ แล้วจับมือผมนานมาก"
    options:
      - text: "ผู้ใหญ่สนับสนุนพี่เหรอ{kq}"
        heart: 1
        reply: "ท่านไม่ได้บอกครับ ท่านแค่บอกว่าสำเนาบัตรต้องใช้สามชุด แล้วสอนผมจับไมค์ให้ห่างปากหนึ่งคืบไมค์จะไม่หอน… ผมว่านั่นแหละสนับสนุน"
      - text: "{p}จะเป็นหัวคะแนนให้ไม่มีซอง{k}"
        heart: 2
        reply: "หัวคะแนนไม่มีซองคนแรกของตำบลครับ ผมจะจดชื่อคุณไว้ในประวัติศาสตร์… ในสมุดบัญชีสหกรณ์ก่อนนะ ประวัติศาสตร์ยังไม่มีงบ"
      - text: "พี่ไม่กลัวเสี่ยเฮงเหรอ{kq}"
        heart: 1
        reply: "กลัวครับ เสี่ยมาแสดงความยินดีกับผมแล้วด้วย ยื่นปฏิทินให้หนึ่งอัน มีตารางดอกเบี้ย… ผมว่านั่นคือคำประกาศสงครามที่สุภาพที่สุดที่ผมเคยได้รับ"

  # ===== news =====
  - id: kla_n_hospital
    topic: news
    npc: "ข่าวดีครับ โรงพยาบาลอำเภอขอผักสหกรณ์เพิ่มอีกสามสิบเปอร์เซ็นต์ คนไข้กินผักบุ้งเราแล้วบอกว่าไม่มีกลิ่นยา… ผมไม่รู้ว่าคนไข้บอกหรือแม่ครัวบอก แต่ผมเลือกเชื่อแบบที่ดีกว่า"
    options:
      - text: "ผักพอส่งไหม{kq}"
        heart: 1
        reply: "ไม่พอครับ เราขาดอาทิตย์ละห้าสิบกำ ถ้า {player} ปลูกผักบุ้งไม่ใช้ยา ผมรับซื้อหมดเลย ราคาตลาดบวกห้าเปอร์เซ็นต์สำหรับสมาชิก"
      - text: "ยินดีด้วย{k}พี่"
        heart: 1
        reply: "ขอบคุณครับ ผมโทรบอกแม่ แม่ถามว่าโรงพยาบาลจ่ายเงินเมื่อไหร่ ผมบอกเก้าสิบวัน แม่วางสายไปเลย"
      - text: "ผักไม่มีกลิ่นยามีด้วยเหรอ{kq}"
        heart: 1
        reply: "มีครับ ลองดมผักที่ฉีดยาตอนเช้า มันมีกลิ่นเหมือนห้องเก็บของร้านเสี่ย… ผักเราไม่มีกลิ่นอะไรเลย ซึ่งผมว่าเป็นกลิ่นที่ดีที่สุด"

  - id: kla_n_heng_credit
    topic: news
    npc: "เสี่ยเฮงติดป้ายใหม่หน้าร้านครับ ‘งดเชื่อปุ๋ยผู้ขายให้สหกรณ์’ ผมถ่ายรูปไว้แล้ว เป็นป้ายที่สนับสนุนสหกรณ์ที่สุดที่ผมเคยเห็น"
    options:
      - text: "ทำไมป้ายนั้นช่วยสหกรณ์{kq}"
        heart: 1
        reply: "เพราะคนที่ไม่เคยรู้ว่ามีสหกรณ์ ตอนนี้รู้แล้วครับ สมาชิกใหม่สามคนบอกว่าเห็นป้ายเสี่ยเลยมาถาม… ผมควรส่งกระเช้าไปขอบคุณเสี่ยไหมครับ"
        next:
          - text: "ส่งผักอินทรีย์ไปสิ{kq}"
            heart: 2
            reply: "ฮ่า… ผมได้ยินมาว่าเสี่ยแอบซื้อข้าวอินทรีย์เรากินที่บ้าน ถ้าส่งไปเสี่ยจะโกรธหรือดีใจก็ไม่รู้ อาจจะทั้งสองอย่าง"
          - text: "อย่าไปยั่วเขาเลย{k}"
            heart: 1
            reply: "จริงครับ… ผมแค่ล้อเล่น ผมไม่ได้เกลียดเสี่ย ผมเกลียดตารางดอกเบี้ยในปฏิทินเสี่ย"
      - text: "แล้วคนที่ยังติดหนี้เสี่ยล่ะ{kq}"
        heart: 1
        reply: "นั่นแหละที่ผมกังวลครับ เขาต้องเลือกระหว่างราคาดีกับปุ๋ยเชื่อ… คนจนไม่เคยได้เลือกจริงๆ ระบบเลือกให้ตั้งแต่ก่อนหว่าน"

  - id: kla_n_members
    topic: news
    npc: "สมาชิกสหกรณ์ครบร้อยสามคนแล้วครับ เมื่อวานป้าพรมาสมัคร บอกว่าสมัครเพราะอยากได้ใบหุ้นไว้กันลุงสมหมายเอาเงินไปซื้อหวย หุ้นถอนยากกว่าเงินสด"
    options:
      - text: "ป้าพรฉลาดจัง{k}"
        heart: 1
        reply: "ฉลาดมากครับ ป้าซื้อสิบหุ้น ใส่ชื่อป้าคนเดียว ลุงสมหมายมาถามผมว่าหุ้นสหกรณ์มีเลขไหม ผมบอกมีแต่เลขที่สมาชิก ลุงจดไปแล้ว"
      - text: "ร้อยสามคนเยอะนะ{kq}"
        heart: 1
        reply: "เยอะครับ แต่ส่งผักจริงแค่สี่สิบ ที่เหลือเป็นสมาชิกใจ… ซึ่งก็ดีครับ ใจก็ต้องมีหุ้น"

  - id: kla_n_company_corn
    topic: news
    when: { day_min: 4 }
    npc: "บริษัทเปิดโครงการ ‘ข้าวโพดยั่งยืน’ แจกเมล็ด แจกปุ๋ย รับซื้อคืนราคาประกัน… ผมอ่านสัญญาแล้ว สิบสองหน้า หน้าที่สิบเอ็ดบอกว่าบริษัทคัดเกรดตกได้ตามดุลพินิจ"
    options:
      - text: "ดุลพินิจของใคร{kq}"
        heart: 1
        reply: "ของบริษัทครับ… ผมถามคุณธนาว่าดุลพินิจคืออะไร เขาบอกว่าเป็น ‘กระบวนการบริหารคุณภาพแบบยืดหยุ่น’ ผมว่ายืดหยุ่นทางเดียว"
      - text: "ราคาประกันก็ดีนะ{kq}"
        heart: 0
        reply: "ดีครับ ถ้าไม่ถูกคัดตก… ลองคิดดูนะครับ ราคาประกันร้อยเปอร์เซ็นต์ คูณด้วยผลผลิตที่เขายอมรับ ซึ่งเขาเป็นคนบอกเองว่ายอมรับเท่าไหร่"
      - text: "พี่อ่านสัญญาครบสิบสองหน้าเลยเหรอ{kq}"
        heart: 1
        reply: "สามรอบครับ แล้วถ่ายเอกสารแจกสมาชิก ค่าถ่ายเอกสารสี่ร้อยบาท ผมจ่ายเอง คุ้มที่สุดในเดือนนี้"

  - id: kla_n_palm_gauge
    topic: news
    when: { flag: story_well_dry }
    npc: "ปาล์มเอาเครื่องวัดระดับน้ำมาแล้วครับ เครื่องจริงจาก อบต. ไม่ใช่ไม้ไผ่ผม… ผลตรงกับไม้ไผ่ผมทุกบ่อ ผมดีใจที่ไม้ไผ่ผมแม่น แล้วก็เศร้าที่ไม้ไผ่ผมแม่น"
    options:
      - text: "ตัวเลขออกมาแล้วจะส่งไปที่ไหน{kq}"
        heart: 1
        reply: "ปาล์มส่งเข้า อบต. ครับ อบต. บอกว่า ‘รับทราบและจะนำเข้าที่ประชุม’ ประชุมครั้งหน้าคือสามเดือน… ผมจะส่งเมย์ด้วย เมย์ประชุมกับตัวเองทุกวัน"
      - text: "พี่กับปาล์มทำงานด้วยกันดีนะ{kq}"
        heart: 1
        reply: "ปาล์มเป็นคนเดียวใน อบต. ที่ใส่รองเท้าบูทครับ… เธอบอกว่าผมพูดยาว ผมบอกว่าเธอถ่ายรูปป้ายเยอะ เราเลยเสมอกัน"

  # ===== advice =====
  - id: kla_a_compost
    topic: advice
    npc: "ลองคิดดูนะครับ ปุ๋ยเคมีกระสอบละเกือบพัน ปุ๋ยหมักทำเองแทบไม่ต้องซื้อ ใบไม้ ฟาง ขี้วัวขี้ควาย รดน้ำให้ชื้น สองเดือนใช้ได้"
    options:
      - text: "ขี้ควายไปหาที่ไหน{kq}"
        heart: 1
        reply: "ตาเผือกครับ แต่ต้องทักตาก่อน ตาไม่ทักตอบ แต่ตาจะชี้ไปที่กองขี้ควายหลังคอก แปลว่าเอาไปได้ ผมทักตามาสามปี ตาชี้ให้ผมสามปี"
      - text: "สองเดือนนานไปนะ{kq}"
        heart: 0
        reply: "นานครับ… แต่ดินที่ใส่ปุ๋ยหมักจะให้ผลผลิตดีขึ้นทุกปี ส่วนดินที่ใส่ปุ๋ยเคมีต้องใส่มากขึ้นทุกปี อันหนึ่งดอกเบี้ยบวก อีกอันดอกเบี้ยเสี่ย"
      - text: "พี่ตั้งชื่อกองปุ๋ยว่าอะไรบ้าง{kq}"
        heart: 2
        reply: "ความหวัง ความอดทน งบประมาณ… แล้วก็กองใหม่ชื่อ ‘หลานยายเพียร’ ครับ เพิ่งตั้งเมื่อวาน… เอ่อ เพราะเป็นกองที่มาใหม่ ไม่มีความหมายอื่นครับ"

  - id: kla_a_sell
