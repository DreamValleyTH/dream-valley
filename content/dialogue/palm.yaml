            reply: "ใช่… ตามหลักวิชาการเรียกว่าแปลงนำร่อง ตามหลักใจเรียกว่ากล้าลองสักที"
      - text: "ทำไมต้องมีม้านั่ง{kq}"
        heart: 1
        reply: "เพราะคนจะเชื่อเรื่องผักตอนได้นั่งคุยกันใต้ร่มไม้ ไม่ใช่ตอนอ่านป้าย… ยายเราสอน ยายไม่เคยอ่านป้ายเลยสักป้าย"

  - id: palm_f_mom
    topic: self
    npc: "แม่โทรมาอีกแล้ว ถามว่าเมื่อไหร่จะย้ายไปทำงานจังหวัด เงินเดือนดีกว่า มีแอร์ เราบอกแม่ว่าที่ อบต. ก็มีแอร์ แม่ถามว่าเปิดได้ไหม เราเงียบ"
    options:
      - text: "แอร์ อบต. ยังเสียอยู่เหรอ{kq}"
        heart: 1
        reply: "เสียมาสามอาทิตย์ ทำเรื่องซ่อมแล้ว อยู่ระหว่างจัดซื้อจัดจ้าง เราเลยย้ายไปทำงานใต้ต้นมะขาม ลมดีกว่าแอร์อีก แต่ปลวกเยอะ"
      - text: "ปาล์มอยากไปไหม{kq}"
        heart: 2
        reply: "ไม่อยาก… ที่นี่มีแปลงที่เราดูแลอยู่สิบเอ็ดแปลง รวมแปลง{player}ด้วย ที่จังหวัดไม่มีแปลง มีแต่ห้องประชุมใหญ่กว่า"

  # ===== others =====
  - id: palm_o_kla
    topic: others
    npc: "กล้าเป็นคนที่มีอุดมการณ์ที่สุดในตำบล บางทีเราก็อิจฉา เขาไม่ต้องตอบ ‘รับทราบ’ กับใคร แต่เขาก็ไม่มีเงินเดือนนะ อิจฉาได้แค่ครึ่งเดียว"
    options:
      - text: "ปาล์มกับกล้าสนิทกันไหม{kq}"
        heart: 1
        reply: "สนิทแบบเพื่อนร่วมรบ เขาสู้ข้างนอก เราสู้ข้างใน เจอกันทีไรเถียงกันเรื่องปุ๋ยหมักสูตรใครดีกว่า… ไม่ใช่แบบนั้นนะ ไม่ได้คิดอะไร"
        next:
          - text: "ไม่ได้คิดอะไรจริงเหรอ{kq}"
            heart: 1
            reply: "จริง! กล้าชอบสหกรณ์มากกว่าคน เราชอบแมลงมากกว่าคน… ยกเว้นบางคน ไม่บอกว่าใคร"
          - text: "สูตรใครดีกว่า{kq}"
            heart: 1
            reply: "ของเรา! ตามหลักวิชาการ… ของกล้าเร็วกว่า แต่ของเราหอมกว่า ปุ๋ยหมักหอมได้นะ ถ้าใส่ใบเตย"
      - text: "กล้าดูจริงจังนะ{kq}"
        heart: 1
        reply: "จริงจังมาก เขาเคยประชุมสหกรณ์สามชั่วโมงเรื่องสีถุงใส่ผัก แต่ผลสรุปมีจริงนะ ไม่ใช่นัดประชุมใหม่ ต่างจาก อบต."

  - id: palm_o_wichai
    topic: others
    npc: "นายกฯ วิชัยใจดีนะ แค่ถามว่า ‘งบมาเมื่อไหร่’ ท่านจะตอบเรื่องอื่นสวยงามมาก เมื่อวานเราถามเรื่องเครื่องวัดระดับน้ำ ท่านพูดเรื่องวิสัยทัศน์ปี 2580"
    options:
      - text: "ปี 2580 เครื่องวัดจะมาเหรอ{kq}"
        heart: 1
        reply: "ไม่แน่ใจ แต่ป้ายวิสัยทัศน์ปี 2580 มาแล้ว ติดหน้า อบต. สวยมาก มีรูปเด็กวิ่งในทุ่งเขียว ทุ่งในรูปไม่ได้อยู่ในตำบลเรา เราเช็กแล้ว เป็นทุ่งจากเว็บรูปฟรี"
      - text: "นายกฯ ก็น่าสงสารนะ{kq}"
        heart: 1
        reply: "น่าสงสาร… เราเห็นท่านนั่งในรถหลวงหน้าป้ายตัวเองนานๆ บางที ไม่ได้คุยโทรศัพท์ แค่นั่ง เราว่าท่านเหนื่อย แต่ไม่มีใครให้ท่านพูดว่าเหนื่อย"
        next:
          - text: "ปาล์มเคยคุยกับนายกฯ ตรงๆ ไหม{kq}"
            heart: 1
            reply: "ครั้งเดียว ตอนขอเงินซื้อเมล็ดพันธุ์ เราพูดว่า ‘หลักการซื้อเมล็ดไม่ได้นะคะ’ ท่านเซ็นเลยสามวินาที เราว่าท่านอยากให้มีคนพูดแบบนั้นมานานแล้ว"
          - text: "อย่าเห็นใจมากนะ{kq}"
            heart: 0
            reply: "ไม่เห็นใจมากหรอก… แค่เห็นว่าเป็นคน ระบบนี้ทำให้ทุกคนหน้าเหมือนกันหมด เราไม่อยากลืมว่าข้างในยังมีคน"

  - id: palm_o_ann
    topic: others
    npc: "หมอแอนกับเราเป็นทีมแก้ข่าวปลอมในกลุ่ม LINE ล่าสุดมีคนแชร์ว่า ‘ราดน้ำปลาร้าที่โคนต้นไม้แก้โรคพืชทุกชนิด’ เราตอบไปยาวสามย่อหน้า มีคนกดหัวเราะสิบคน"
    options:
      - text: "ได้ผลจริงไหม{kq}"
        heart: 1
        reply: "ไม่! มันดึงมดมากินต้นไม้แทน แล้วกลิ่นติดทั้งแปลง… แต่ป้าแต๋วบอกว่าแมวส้มชอบมาก แมวส้มนอนโคนต้นมะม่วงทั้งวัน"
      - text: "ทำไมคนชอบแชร์ข่าวปลอม{kq}"
        heart: 2
        reply: "เพราะข่าวปลอมสั้นและให้ความหวัง ข่าวจริงยาวและบอกว่าต้องทำงานหนัก… เราเลยพยายามเขียนข่าวจริงให้สั้นลง ยังทำไม่ได้ เพราะเรื่องดินมันยาว"

  - id: palm_o_heng
    topic: others
    npc: "เสี่ยเฮงเรียกเราว่า ‘น้องปาล์มตัวขัดขวางเศรษฐกิจ’ เพราะชาวบ้านทำน้ำหมักเองแล้วยอดปุ๋ยเขาตก… เราเอาไปพิมพ์เป็นนามบัตรเลย ล้อเล่นๆ อยากพิมพ์มาก"
    options:
      - text: "ปาล์มไม่กลัวเสี่ยเหรอ{kq}"
        heart: 1
        reply: "กลัวนิดนึง เขาเป็นเจ้าหนี้ครึ่งตำบล ญาติเขาก็อยู่ใน อบต. … แต่ถ้ากลัวจนไม่บอกชาวบ้านเรื่องน้ำหมัก เราจะเรียนเกษตรมาทำไม"
      - text: "เสี่ยก็ช่วยคนตอนฉุกเฉินนะ{kq}"
        heart: 1
        reply: "ช่วยจริง ให้เชื่อง่ายมาก ง่ายจนคนลืมอ่านดอกเบี้ย เราไม่ได้ว่าเสี่ยเป็นคนร้ายนะ เสี่ยแค่ขายร่มตอนฝนตก แล้วคิดค่าเช่าตอนแดดออก"

  - id: palm_o_praew
    topic: others
    npc: "แพรวมาขอให้เราถ่ายรูปแปลงข้าวกล้องไปลงเพจ เราถ่ายไปสามสิบรูป แพรวเลือกรูปที่มีเราติดขอบรูปไปใช้ เขียนแคปชันว่า ‘นักวิชาการเกษตรรับรอง’ เรายังไม่ได้รับรองอะไรเลยนะ"
    options:
      - text: "แพรวเก่งการตลาดนะ{k}"
        heart: 1
        reply: "เก่งมาก เก่งจนเรากลัว… แต่ข้าวเขาดีจริง เราไปดูแปลงแล้ว ไม่มียา งั้นรับรองก็ได้ รับรองย้อนหลังแบบ อบต. เลย"
      - text: "ปาล์มกับแพรวสนิทกันไหม{kq}"
        heart: 1
        reply: "เริ่มสนิท… แพรวไม่ค่อยมีเพื่อนในตำบล เพราะทุกคนเห็นเป็นลูกกำนัน เราเห็นเป็นคนขายข้าวไม่มียา เลยคุยกันง่าย"
        next:
          - text: "ปาล์มเห็นคนจากดินที่เขาปลูกเลยนะ{k}"
            heart: 2
            reply: "ใช่! วิธีดูคนของเรา ดูว่าเขาทำอะไรกับดิน… {player}ผ่านตั้งแต่วันแรก ดินที่รองเท้าบอกหมด"
          - text: "แพรวคงดีใจที่มีเพื่อน{k}"
            heart: 1
            reply: "เราก็ดีใจ เพื่อนที่ไม่ใช่ข้าราชการ ไม่ต้องพูดภาษาราชการ คุยเรื่องข้าวได้ตรงๆ"

quests:
  - id: palm_q1
    npc: palm
    title: "สมาชิกใหม่ใต้โต๊ะ"
    desc: "ไส้เดือนในกล่องใต้โต๊ะปาล์มเหลือน้อย ขอไส้เดือนจากแปลงไปเติม"
    start: { heart_min: 2, day_min: 4 }
    offer:
      npc: "{player} ช่วยเราหน่อย ความลับนะ กล่องไส้เดือนใต้โต๊ะเรา หัวหน้าเผลอเอาน้ำยาถูพื้นราด… ตายไปครึ่งกล่อง เราต้องการสมาชิกใหม่สามตัว ตัวงามๆ จากแปลง{player}"
      options:
        - text: "ได้{k} ไส้เดือนแปลง{p}อ้วนมาก"
          accept: true
          heart: 1
          reply: "เย่! อ้วนแปลว่าดินดี ตามหลักวิชาการนะ เอามาใส่กระป๋องมีดินชื้นๆ ห้ามโดนแดด ไส้เดือนไม่ชอบแดดเหมือนเรา"
        - text: "หัวหน้าตั้งใจราดหรือเปล่า{kq}"
          accept: true
          heart: 1
          reply: "ไม่ได้ตั้งใจ… มั้ง เขาไม่รู้ว่ามีกล่องนี้ ซึ่งดี เพราะไส้เดือนตัวที่ตายมีชื่อเขาด้วย ช่วยเอามาเติมนะ ก่อนเราเสียใจจนเขียนรายงานไม่ได้"
        - text: "ขุดไส้เดือนเหนื่อยนะ{kq}"
          heart: 0
          reply: "ไม่เหนื่อยหรอก แค่พลิกใบไม้ชื้นๆ ก็เจอ… ไม่เป็นไร ไว้ว่างค่อยมา"
    steps:
      - goal: { type: give, npc: palm, item: worm, n: 3 }
        hint: "หาไส้เดือน 3 ตัวไปให้ปาล์มที่ อบต."
        done:
          npc: "สวยมาก! ตัวนี้ยาวสุด… ขอบคุณนะ เราจะตั้งชื่อ… เดี๋ยว {player} รู้ไหม วันนี้หัวหน้าสั่งให้เราเขียนรายงานว่าฝายที่คลองเสร็จแล้ว ทั้งที่มีแค่ป้าย เราเลยอยากได้อะไรที่มีชีวิตจริงๆ ใต้โต๊ะสักหน่อย"
          options:
            - text: "ตั้งชื่อไส้เดือนว่า ‘ฝาย’ เลย{k}"
              heart: 2
              set_flag: palm_q1_weir
              reply: "ฮ่าๆ ‘ฝาย’ ตัวนี้มีจริง! เวลาหัวหน้าถามว่าฝายอยู่ไหน เราจะชี้ใต้โต๊ะ… ล้อเล่นๆ แต่เราจะเรียกมันว่าฝายในใจ"
            - text: "ปาล์มจะเขียนรายงานนั้นไหม{kq}"
              heart: 1
              reply: "ยังไม่รู้… ขอคิดก่อน วันนี้ขอดูไส้เดือนให้ใจเย็นก่อน แล้วค่อยคิดเรื่องฝายที่ไม่มีอยู่จริง"
            - text: "แค่ไส้เดือนเองนะ{kq}"
              heart: 0
              reply: "แค่ไส้เดือน… ใช่ แต่บางวันแค่ไส้เดือนก็ช่วยให้เราไม่ลาออก"
    reward: { money: 100, heart: 1, items: { bio_ferment: 1 }, set_flag: palm_q1_done }

  - id: palm_q2
    npc: palm
    title: "ตลับเมตรตอนตีห้า"
    desc: "ปาล์มจะแอบวัดระดับน้ำบ่อบาดาลหมู่บ้านใต้หอถังน้ำตอนเช้ามืด ต้องมีคนช่วยถือเชือก"
    start: { flag: palm_q1_done, heart_min: 3, day_min: 10 }
    offer:
      npc: "{player} ตื่นเช้าไหวไหม เราจะไปวัดระดับน้ำบ่อบาดาลใต้หอถังน้ำตอนหกโมงเช้า ก่อนคนจะมาเห็น… หัวหน้าบอกให้หยุดวัด แต่ไม่ได้บอกว่าห้ามวัดตอนเช้ามืดนะ เราตีความตามตัวอักษร"
      options:
        - text: "ไหว{k} {p}ถือเชือกให้"
          accept: true
          heart: 2
          reply: "ขอบคุณ! เราจะเอากาแฟดริปไปสองแก้ว แก้วนึงของ{player} ค่าแรงถือเชือกเป็นกาแฟ ราคาตลาดยุติธรรม"
        - text: "ถ้าหัวหน้ารู้จะเป็นไรไหม{kq}"
          accept: true
          heart: 1
          reply: "อาจโดนเรียกไปคุยเรื่อง ‘ความเหมาะสม’ … เราโดนมาสามครั้งแล้ว ชินแล้ว ครั้งนี้มีเพื่อนไปด้วย ไม่น่ากลัวเท่า"
        - text: "หยุดวัดตามที่หัวหน้าบอกเถอะ{k}"
          heart: -1
          reply: "…อืม ถ้าทุกคนหยุดวัด น้ำมันก็จะหายไปเงียบๆ แบบไม่มีตัวเลข เราไปคนเดียวก็ได้"
    steps:
      - goal: { type: visit, place: water_tower, from: "05:30", to: "07:30" }
        hint: "ไปหอถังน้ำตอนเช้ามืด (05:30–07:30) ช่วยปาล์มวัดระดับน้ำ"
        done:
          npc: "สิบเจ็ดเมตรสี่สิบ… เดือนก่อนสิบสี่เมตรห้าสิบ น้ำลดเกือบสามเมตร {player}เห็นตัวเลขกับตาแล้วนะ ไม่ใช่เราคิดไปเอง… เราจะทำยังไงกับตัวเลขนี้ดี"
          options:
            - text: "ถ่ายรูปสมุดไว้ เผื่อมันหายเหมือนรายงาน{k}"
              heart: 2
              set_flag: palm_q2_copy
              reply: "ใช่! สำเนาสำรอง ตามหลักวิชาการเรียกว่าแบ็กอัป ตามหลักชีวิตเรียกว่ามีคนช่วยจำ… ถ่ายเลย เราไว้ใจ{player}"
            - text: "เอาไปให้กำนันดู กำนันมีเสียงกว่า{k}"
              heart: 1
              set_flag: palm_q2_prasert
              reply: "กำนัน… ใช่ บ่อกำนันก็ลดเหมือนกัน กำนันพูดดังกว่าเรา แล้วไม่มีหัวหน้าสั่งให้หยุด เดี๋ยวเราไปนะ"
            - text: "เก็บไว้ก่อน ยังไม่ถึงเวลา{k}"
              heart: 0
              reply: "อืม… เก็บไว้ก่อน เหมือนหัวหน้าพูด ฟังจากปาก{player}แล้วมันไม่แย่เท่าจากปากหัวหน้า แต่ก็ยังแย่อยู่"
    reward: { money: 120, heart: 2, set_flag: palm_q2_done }

  - id: palm_q3
    npc: palm
    title: "แปลงนำร่อง"
    desc: "ปาล์มอยากเริ่มแปลงสาธิตเล็กๆ ที่สวนสหกรณ์ ลงขันซื้อเมล็ดพันธุ์ แล้วรอดูต้นกล้า"
    start: { flag: palm_q2_done, heart_min: 5, day_min: 14 }
    offer:
      npc: "{player}… เราตัดสินใจแล้ว จะทำแปลงสาธิต เล็กๆ ก่อน สองคูณสามเมตร ที่สวนสหกรณ์ กล้ายกมุมให้ แต่เมล็ดพันธุ์ต้องซื้อเอง งบ อบต. ไม่ผ่าน… เราขอลงขันได้ไหม สามร้อยบาท เราออกครึ่ง{player}ออกครึ่ง"
      options:
        - text: "ได้{k} ลงขันเลย"
          accept: true
          heart: 2
          reply: "ตกลง! เราจะปักป้ายเล็กๆ ว่า ‘แปลงนำร่อง ทุนจากคนสองคน’ ป้ายเดียวในชีวิตเราที่มีของจริงอยู่ข้างหลัง"
        - text: "{p}ออกให้หมดเลยก็ได้{k}"
          accept: true
          heart: 1
          reply: "ไม่เอา! ต้องคนละครึ่ง ถ้า{player}ออกหมด มันจะเป็นแปลงของ{player} เราอยากให้เป็นแปลงของ ‘เรา’ … หมายถึงเราสองคน ภาษาไทยยากจัง"
        - text: "รองบ อบต. ดีกว่าไหม{kq}"
          heart: -1
          reply: "รองบ อบต. ก็ได้ป้ายก่อน แล้วผักมาปี 2580… ไม่เป็นไร เราลองหาทางอื่น"
    steps:
      - goal: { type: pay, npc: palm, n: 150 }
        hint: "ลงขันค่าเมล็ดพันธุ์ 150 บาทกับปาล์ม"
        done:
          npc: "ได้เงินครบแล้ว เราไปซื้อเมล็ดผักบุ้ง กะเพรา พริก กับถั่วฝักยาว แล้วหยอดเมล็ดกันเลยนะ… ตามหลักวิชาการ ต้นกล้าจะงอกในสามวัน ตามหลักใจ เราจะมาดูทุกเช้า"
          options:
            - text: "{p}จะมาดูด้วยทุกเช้า{k}"
              heart: 2
              reply: "ตกลง! ใครมาถึงก่อนรดน้ำ ใครมาทีหลังเลี้ยงกาแฟ… เราจะตื่นตีห้า ไม่ยอมแพ้"
            - text: "ถ้าไม่งอกล่ะ{kq}"
              heart: 1
              reply: "ก็หยอดใหม่ ดินไม่เคยปฏิเสธใครที่ลองซ้ำ ต่างจากระบบ"
      - goal: { type: days, n: 3 }
        hint: "รอ 3 วันให้ต้นกล้าในแปลงนำร่องงอก"
        done:
          npc: "{player}! งอกแล้ว! ผักบุ้งงอกก่อน กะเพราตามมา พริกยังดื้อ… เราถ่ายรูปไปยี่สิบรูป เป็นรูปแรกในโทรศัพท์ที่ไม่ใช่ป้าย"
          options:
            - text: "สวยมาก{k} สวยกว่าป้ายทุกป้าย"
              heart: 2
              set_flag: palm_q3_sprout
              reply: "ใช่ไหม! ต้นเล็กนิดเดียวแต่มีชีวิต… เราจะเอารูปนี้เป็นภาพพื้นหลังโทรศัพท์ ทุกครั้งที่หัวหน้าโทรมา เราจะเห็นผักบุ้งก่อน"
            - text: "ปาล์มดีใจจนตาแดงเลยนะ{kq}"
              heart: 2
              reply: "ไม่ได้ร้องนะ… แดดเช้ามันแยงตา ตามหลักวิชาการนะ แสงช่วงเช้ามีรังสียูวีน้อย แต่… ช่างหลักวิชาการเถอะ ร้องนิดนึง"
    reward: { money: 100, heart: 2, items: { heirloom_seed: 2 }, set_flag: palm_q3_done }

  - id: palm_q4
    npc: palm
    title: "จดหมายฉบับที่เจ็ด"
    desc: "ปาล์มต้องตัดสินใจว่าจะทำอะไรกับจดหมายลาออกฉบับที่เจ็ด รายงานระดับน้ำ และแปลงนำร่อง"
    start: { flag: palm_q3_done, heart_min: 7, day_min: 18 }
    offer:
      npc: "{player} เย็นนี้ว่างไหม มาที่แปลงนำร่องตอนพระอาทิตย์ตก เราเอาจดหมายลาออกฉบับที่เจ็ดมาด้วย กับรายงานระดับน้ำ… เราอยากตัดสินใจตรงที่มีผักงอก ไม่ใช่ใต้โต๊ะ อบต."
      options:
        - text: "{p}จะไป{k} ไม่ว่าปาล์มจะเลือกอะไร"
          accept: true
          heart: 2
          reply: "…ประโยคนี้ เราขอจดนะ หน้าพิเศษในสมุด หน้าที่ไม่เกี่ยวกับแปลงเลย"
        - text: "ให้{p}ช่วยเลือกเหรอ{kq}"
          accept: true
          heart: 1
          reply: "ไม่ได้ให้เลือกแทน… แค่อยากมีคนยืนข้างๆ ตอนเลือก ตามหลักวิชาการเรียกว่าพยาน ตามหลักใจเรียกว่า… ไว้ค่อยบอก"
        - text: "ปาล์มคิดเองดีกว่า{k}"
          heart: 0
          reply: "อืม ก็จริง… เราคิดเองมาตลอดแหละ แค่อยากลองไม่คิดคนเดียวสักครั้ง ไม่เป็นไร"
    steps:
      - goal: { type: visit, place: coop_garden, from: "17:00", to: "19:00" }
        hint: "ไปแปลงนำร่องที่สวนสหกรณ์ตอนเย็น (17:00–19:00)"
        done:
          npc: "พริกงอกแล้วนะ ตัวสุดท้าย ดื้อที่สุดแต่มาจนได้… {player} เราถือกระดาษสองแผ่น จดหมายลาออก กับรายงานบ่อน้ำ เราคิดไว้สามทาง ถ้าเป็น{player} จะให้เราทำอะไร"
          options:
            - text: "ลาออกมาทำแปลงสาธิตกับสหกรณ์เต็มตัวเลย{k} {p}ช่วยด้วย"
              heart: 2
              set_flag: palm_q_resign
              reply: "…ส่งเลยนะ! พรุ่งนี้เช้าเราจะวางบนโต๊ะหัวหน้า ฉบับที่เจ็ด ฉบับสุดท้าย แล้วมาที่นี่ ไม่มีป้าย มีแต่ผัก… กับ{player} ตามหลักวิชาการนะ นี่คือการตัดสินใจที่บ้าที่สุดในชีวิต ตามหลักใจ ถูกที่สุด"
            - text: "อยู่ อบต. ต่อ แต่ส่งรายงานบ่อน้ำถึงอำเภอเอง ไม่ผ่านหัวหน้า{k}"
              heart: 2
              set_flag: palm_q_stay
              reply: "ฉีกจดหมายลาออกเลยนะ… ไม่ เก็บไว้ เป็นฉบับที่แปดถ้าจำเป็น แต่พรุ่งนี้เราจะขึ้นรถลุงเชิดไปอำเภอ ถือรายงานไปเอง ถ้าโดนย้ายไปนับเก้าอี้… {player}สัญญาแล้วนะว่าจะไปช่วยนับ"
            - text: "ส่งตัวเลขให้เมย์ ให้คนทั้งประเทศได้เห็น{k}"
              heart: 1
              set_flag: palm_q_may
              reply: "เมย์… ตัวเลขเราจะไปอยู่ในข่าว ไม่มีชื่อเรา แต่ทุกคนใน อบต. จะรู้ว่าใครวัด… โอเค เราจะส่ง ตลับเมตรอันนี้ จะได้ทำงานที่มันเกิดมาทำสักที"
    reward: { money: 200, heart: 2, items: { heirloom_seed: 3 }, set_flag: palm_romance_open, line: { from: palm, text: "แปลงนำร่องหน้าสวนสหกรณ์งอกครบทุกแปลงแล้วนะคะ 🌱 ใครอยากมาดูว่าไม่ใช้เคมีก็รอด มานั่งม้านั่งได้เลย ตัวกลางจองแล้วค่ะ 😊" } }
