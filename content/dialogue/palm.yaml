    options:
      - text: "ใครเก็บไป{kq}"
        heart: 1
        reply: "ไม่มีใครรู้ เช้าวันนึงลูกเต็มต้น อีกเช้าหายเกลี้ยง ไม่มีใครเห็น… แต่บ้านญาติคนหนึ่งในฝ่ายพัสดุมีมะม่วงกวนขายในไลฟ์ ไม่ได้กล่าวหานะ"
      - text: "ตั้งชื่อเจ็บนะ{kq}"
        heart: 1
        reply: "เจ็บแต่ขำใช่ไหม เราทำงานกับระบบนี้ได้ด้วยการตั้งชื่อเล่นให้ทุกอย่าง เครื่องถ่ายเอกสารชื่อ ‘รับทราบ’ เพราะมันกินกระดาษแล้วไม่ทำอะไร"

