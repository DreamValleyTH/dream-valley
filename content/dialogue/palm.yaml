# ปาล์ม ♥ — convos + quests
convos:
  # ===== react =====
  - id: palm_r_meet
    topic: react
    once: true
    when: { not_flag: met_palm }
    npc: "อ้าว คนที่ย้ายมาอยู่บ้านยายเพียรใช่ไหม เราปาล์ม นักวิชาการเกษตร อบต. นะ… เดี๋ยวนะ ขอวัดอะไรแป๊บ ดินที่รองเท้า{player}สีดำดีมาก มาจากแปลงหลังบ้านใช่ไหม"
    set_flag: met_palm
    options:
      - text: "ทักทายด้วยดินที่รองเท้าเลยเหรอ{kq}"
        heart: 1
        reply: "เอ่อ… โทษที นิสัยเสีย เราเห็นดินก่อนเห็นหน้าคน ล้อเล่นๆ เห็นหน้าก่อน แต่จำดินได้แม่นกว่า"
        next:
          - text: "แล้วดิน{p}เป็นยังไงบ้าง{kq}"
            heart: 2
            reply: "ดีมาก! อินทรียวัตถุสูง ยายเพียรไม่ใช้ยามาหลายปีแน่ๆ ตามหลักวิชาการนะ… คนดูแลดินดีขนาดนี้ น่าจะเป็นคนใจเย็น หลานก็คงได้มาบ้าง หวังว่านะ"
          - text: "{p}ยังไม่ได้ทำอะไรกับแปลงเลย{k}"
            heart: 1
            reply: "ไม่เป็นไร ดินมันรอได้ แต่หญ้ารอไม่ได้นะ หญ้าโตไวกว่างบ อบต. อีก"
      - text: "สวัสดี{k}ปาล์ม ยินดีที่ได้รู้จัก"
        heart: 1
        reply: "ยินดีเหมือนกัน! ถ้ามีเรื่องแปลงหรือแมลงแปลกๆ ทักเรามาได้เลย เรื่องเอกสารก็ได้… แต่ขอเรื่องแมลงก่อนนะ เราชอบมากกว่า"
      - text: "นักวิชาการเกษตรทำอะไรบ้าง{kq}"
        heart: 0
        reply: "ตามหลักวิชาการนะ ส่งเสริมการเกษตร ตามความเป็นจริงนะ ถ่ายรูปป้ายโครงการ ส่งรายงาน แล้วก็แอบมาดูแปลงชาวบ้านตอนว่าง ซึ่งไม่ค่อยว่าง"

  - id: palm_r_thana
    topic: react
    once: true
    when: { flag: story_thana_visit }
    npc: "เราได้ข่าวว่าคุณธนาไปเสนอซื้อที่ยายเพียร… {player}โอเคไหม เราไม่ได้ถามในฐานะ อบต. นะ ถามในฐานะคนชอบดินแปลงนั้น"
    options:
      - text: "โอเค{k} แค่ตกใจกับราคา"
        heart: 1
        reply: "ราคาเขาสูงเพราะเขาไม่ได้ซื้อดิน เขาซื้อน้ำใต้ดิน ตามหลักวิชาการนะ ที่ดินแปลงนั้นอยู่บนชั้นน้ำที่ดีที่สุดในตำบล เราเคยเห็นแผนที่… อันที่บริษัทมาขอดูที่ อบต. นั่นแหละ"
        next:
          - text: "อบต. ให้เขาดูเหรอ{kq}"
            heart: 1
            reply: "เราไม่ให้! แต่หัวหน้าเราถ่ายเอกสารให้ เพราะเขามีหนังสือ ‘ขอความอนุเคราะห์’ หัวหน้าเราอนุเคราะห์ทุกคนที่มีหัวกระดาษสวย"
          - text: "ปาล์มห่วง{p}เหรอ{kq}"
            heart: 2
            reply: "ห่วงดินน่ะ… กับคนที่ดูแลดินด้วยนิดนึง ล้อเล่นๆ ห่วงทั้งคู่เท่ากัน ตามหลักวิชาการ"
      - text: "ไม่ต้องห่วง{k} {p}ไม่ขาย"
        heart: 2
        reply: "เย่! เอ๊ย หมายถึง ดีแล้ว เป็นทางเลือกที่ยั่งยืน… เรากำลังพูดเหมือนนายกฯ เลย ขอโทษ ดีใจจนภาษาราชการหลุด"

  - id: palm_r_vote_water
    topic: react
    once: true
    when: { flag: vote_water }
    npc: "เห็น{player}ยกมือโหวตระบบน้ำ! เราอยู่ข้างหลัง อยากปรบมือแต่ข้าราชการต้องวางตัวเป็นกลาง เลยปรบมือในใจ ดังมากเลยนะในใจ"
    options:
      - text: "ปาล์มก็อยากได้ระบบน้ำเหรอ{kq}"
        heart: 1
        reply: "อยากที่สุด เราเขียนข้อเสนอโครงการระบบน้ำมาสามปี สามเล่ม ตอนนี้ใช้รองขาโต๊ะที่ อบต. อยู่ โต๊ะไม่โยกแล้วนะ ก็นับว่ามีประโยชน์"
      - text: "ต่อไปไม่ต้องปรบในใจแล้ว{k} ปรบดังๆ เลย"
        heart: 2
        reply: "ถ้าเราปรบดังๆ หัวหน้าเราจะเรียกไปคุย ‘เรื่องความเหมาะสม’ … แต่ถ้า{player}ปรบด้วย เราจะแกล้งทำเป็นมือลั่นตามนะ"

  - id: palm_r_result_road
    topic: react
    once: true
    when: { flag: meeting1_result_road }
    npc: "ถนนชนะ… เราต้องไปถ่ายรูปป้ายโครงการถนนพรุ่งนี้ ป้ายเสร็จแล้วนะ เสร็จก่อนประกาศผลโหวตอีก ไม่รู้เขารู้ผลก่อนหรือพิมพ์ไว้สามแบบ"
    options:
      - text: "ปาล์มว่าเขาพิมพ์ไว้สามแบบไหม{kq}"
        heart: 1
        reply: "เราเห็นในโกดัง อบต. มีป้ายระบบน้ำกับป้ายตลาดนัดนอนอยู่ด้วย ใหม่เอี่ยม ห่อพลาสติก… ป้ายที่แพ้โหวตไปไหน? ไปรอเลือกตั้งรอบหน้า"
        next:
          - text: "งบป้ายสามแบบใครจ่าย{kq}"
            heart: 1
            reply: "งบประชาสัมพันธ์ ไม่ใช่งบโครงการ ตามหลักบัญชีนะ… ตามหลักสามัญสำนึก มันคือเงินเรา เราทุกคน"
          - text: "เอาป้ายที่แพ้มาทำแปลงผักดีกว่า{k}"
            heart: 2
            reply: "ไอเดียดีมาก! ไวนิลหนาๆ คลุมดินกันหญ้าได้เลย เราจะเสนอ… ไม่ เราจะไปขโมย ล้อเล่นๆ ไปขอยืม แบบไม่คืน"
      - text: "ถนนก็ดีนะ{k} รถจะได้วิ่งสะดวก"
        heart: 0
        reply: "ก็ดี ถ้ามันได้ทำจริง… ถนนสามร้อยเมตรหน้าลานเสี่ยเฮงจะสวยมาก รถบรรทุกจะวิ่งสะดวกมาก เราไม่ได้ประชดนะ… ประชดนิดนึง"

  - id: palm_r_well
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "บ่อหลังร้านป้าแต๋วแห้งแล้ว เราเอาตลับเมตรไปวัดมาเมื่อเช้า ระดับน้ำลดสองเมตรในเดือนเดียว ตามหลักวิชาการนะ… ไม่มีหลักไหนอธิบายได้นอกจากมีคนดูดออก"
    options:
      - text: "ปาล์มวัดด้วยตลับเมตรเหรอ{kq}"
        heart: 1
        reply: "ตลับเมตรต่อเชือกฟาง ผูกขวดน้ำถ่วงไว้ปลาย เครื่องวัดระดับน้ำจริงเราขอซื้อมาสามปี ยังอยู่ระหว่างจัดซื้อจัดจ้าง… วิทยาศาสตร์บ้านๆ แต่ตัวเลขไม่โกหกนะ"
        next:
          - text: "ตัวเลขนี้ส่งใครได้บ้าง{kq}"
            heart: 2
            reply: "ส่งหัวหน้าแล้ว หัวหน้าบอก ‘เก็บไว้ก่อน’ … เราเก็บไว้ในสมุดเราด้วย สมุดเล่มนี้ ไม่มีใครสั่งให้เราเก็บมันไว้ก่อนได้"
          - text: "{p}ช่วยวัดด้วยได้ไหม{kq}"
            heart: 2
            reply: "ได้สิ! ต้องมีคนถือเชือกอีกคน ตอนนี้เราถือเองแล้วจดเอง ตัวเลขเลยเลอะโคลนหมด"
      - text: "แล้วบ่อที่บ้าน{p}จะแห้งไหม{kq}"
        heart: 1
        reply: "บ่อยายเพียรลึกกว่า น่าจะอยู่ได้นานกว่า… แต่ไม่ได้แปลว่าไม่แห้งนะ เราจะไปวัดให้ ฟรี ค่าบริการเป็นมะม่วงหนึ่งลูก"

  - id: palm_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "คนงานบริษัทลาออกเพราะผี… ตามหลักวิชาการนะ ผีไม่มีจริง แต่ถ้าผีทำให้เครื่องสูบน้ำหยุดได้ เราขอยกเว้นหลักวิชาการชั่วคราวหนึ่งข้อ"
    options:
      - text: "ปาล์มกลัวผีไหม{kq}"
        heart: 1
        reply: "ไม่กลัว… แต่เราเช่าตะกรุดมาสองอัน เผื่อหลักวิชาการผิด อันหนึ่งของเรา อีกอันเผื่อใครสักคน"
        next:
          - text: "อีกอันเผื่อใคร{kq}"
            heart: 2
            reply: "เผื่อ… คนที่ชอบอยู่ข้างนอกจนสองทุ่มครึ่งน่ะ ไม่ได้บอกว่าใครนะ เอาไปไหม ไม่เอาก็ได้ เดี๋ยวเราห้อยเองสองอัน"
          - text: "เผื่อกล้าเหรอ{kq}"
            heart: 0
            reply: "กล้าไม่เชื่อเรื่องผี เขาเชื่อแต่สหกรณ์… ไม่ใช่ เผื่อคนอื่น ช่างเถอะ"
      - text: "ยายบัวบอกว่าผีไม่ชอบคนดูดน้ำ{k}"
        heart: 1
        reply: "ยายบัวพูดแล้วคนเชื่อมากกว่ารายงานเราสิบเท่า เราน่าจะให้ยายบัวช่วยอ่านรายงานระดับน้ำในที่ประชุม"

  - id: palm_r_may_evidence
    topic: react
    once: true
    when: { flag: story_may_evidence }
    npc: "เมย์ถามเราว่าท่อบริษัทวางลึกเท่าไหร่ เราบอกว่าไม่รู้ ซึ่งจริง… แต่เรารู้ว่าน้ำหายไปเท่าไหร่ อันนี้เราไม่ได้บอก เรากลัว"
    options:
      - text: "กลัวอะไร{kq}"
        heart: 1
        reply: "กลัวโดนย้ายไปเฝ้าคลังพัสดุ ที่นั่นไม่มีดิน ไม่มีแมลง มีแต่เก้าอี้พลาสติกสามร้อยตัว ข้าราชการที่พูดมากโดนส่งไปนับเก้าอี้"
        next:
          - text: "ถ้าโดนย้าย{p}จะไปช่วยนับ{k}"
            heart: 2
            reply: "ฮ่า… นับสองคนเสร็จเร็วขึ้นครึ่งนึง แล้วเหลือเวลาไปดูแปลงต่อ ตกลง ถ้าโดนย้ายจะเรียกนะ"
          - text: "ไม่ต้องบอกเมย์ก็ได้{k}"
            heart: 0
            reply: "อืม… ก็ได้มั้ง แต่ตัวเลขในสมุดมันมองเราทุกคืนเลยนะ"
      - text: "ตัวเลขนั้นสำคัญมากนะ{kq}"
        heart: 1
        reply: "รู้… รู้ว่าสำคัญ ถึงยังเก็บไว้ไม่ทิ้ง ขอเวลาอีกนิดนะ เราต้องรวบรวมความกล้าเหมือนรวบรวมเมล็ดพันธุ์ ทีละเม็ด"

  - id: palm_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ถังน้ำ CSR… เรานับแล้ว ทั้งตำบลได้สองร้อยใบ ใบละสิบห้าลิตร รวมสามพันลิตร บริษัทดูดออกไปวันละเท่าไหร่ไม่รู้ แต่ตามหลักวิชาการ… มากกว่าสามพันลิตรแน่นอน"
    options:
      - text: "แจกถังเพื่อให้รองน้ำที่ตัวเองดูดไป{k}"
        heart: 2
        reply: "ใช่! ประโยคนี้เราคิดในหัวทั้งประชุมแต่พูดไม่ได้ {player}พูดได้ เราขอยืมไปเขียนในสมุดนะ"
      - text: "ปาล์มเอาถังมาไหม{kq}"
        heart: 1
        reply: "เอามาใบนึง ทำเป็นกล่องเลี้ยงไส้เดือน โลโก้บริษัทหันเข้ากำแพง ไส้เดือนไม่อ่านโลโก้ แต่เราอ่าน"

  - id: palm_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ช่วงเลือกตั้งแล้ว… โครงการใหม่โผล่มาสิบโครงการในอาทิตย์เดียว ทุกโครงการต้องให้เราไปถ่ายรูปเปิดตัว เราถ่ายป้ายไปห้าสิบรูปวันนี้ ยังไม่ได้เห็นดินสักก้อน"
    options:
      - text: "พักบ้างนะ{kq}ปาล์ม"
        heart: 2
        reply: "พัก… คำนี้ไม่มีในระเบียบช่วงเลือกตั้ง แต่ถ้า{player}ชวนไปกินขนมครกตอนเย็น เราจะถือว่าเป็นการลงพื้นที่สำรวจตลาด"
        next:
          - text: "ไปกัน{k} สำรวจตลาดสองคน"
            heart: 2
            reply: "ได้! เราจะจดในสมุดว่า ‘ลงพื้นที่ร่วมกับเกษตรกรตัวอย่าง’ ไม่ได้โกหกนะ {player}เป็นเกษตรกรตัวอย่างจริงๆ… ตัวอย่างของเรา"
          - text: "ไปถ่ายรูปขนมครกลงรายงานด้วย{k}"
            heart: 1
            reply: "ฮ่าๆ รายงาน ‘โครงการขนมครกเพื่อความยั่งยืน’ นายกฯ จะชอบมาก ป้ายพร้อมใน 3 วัน"
      - text: "ปาล์มเลือกใคร{kq}"
        heart: 0
        reply: "ข้าราชการห้ามเลือกข้างนะ เราเลยยิ้มให้ป้ายทุกป้ายเท่ากัน… แต่ในคูหาเราเลือกคนที่ไม่ลืมทุ่งนาหลังวันเลือกตั้ง ถ้ามีนะ"

  - id: palm_r_snake
    topic: react
    once: true
    when: { flag: met_snake }
    npc: "ได้ยินว่าเจองูเขียวในแปลง! ตัวยาวไหม หางแดงไหม… ขอโทษ ถามผิดลำดับ {player}โดนกัดหรือเปล่า"
    options:
      - text: "ไม่โดน{k} แค่ตกใจ"
        heart: 1
        reply: "โล่งอก ทีนี้ถามต่อได้… หางแดงไหม ถ้าหางแดงคืองูเขียวหางไหม้ มีพิษ ต้องระวัง ถ้าไม่แดงอาจเป็นงูเขียวธรรมดา กินหนู มีประโยชน์ ตามหลักวิชาการนะ"
        next:
          - text: "ปาล์มห่วงงูหรือห่วง{p}{kq}"
            heart: 2
            reply: "…ห่วงคนก่อนสิ ถามมาได้ แล้วค่อยห่วงงู งูมันไม่มีใครห่วงเลยนะ เราเลยต้องห่วงเผื่อ"
          - text: "{p}ไม่ได้ดูหาง{k}"
            heart: 0
            reply: "ครั้งหน้าดูหางนะ… ไม่ใช่ ครั้งหน้าวิ่งก่อน ดูหางทีหลัง ลำดับนี้สำคัญ"
      - text: "ปาล์มไม่กลัวงูเหรอ{kq}"
        heart: 1
        reply: "กลัวนะ แต่ชอบมากกว่ากลัว เหมือนชอบงานที่ อบต. ไม่ใช่ อันนั้นกลัวมากกว่าชอบ"

  - id: palm_r_truck
    topic: react
    once: true
    when: { flag: sold_to_truck }
    npc: "เห็น{player}ขายพริกให้รถกระบะ… ไม่ว่ากันนะ แต่รอบหน้าลองถามราคาสหกรณ์ของกล้าก่อน เขาไม่หักความชื้นมั่ว ตาชั่งเราเพิ่งไปสอบเทียบมา"
    options:
      - text: "รถกระบะหักความชื้นด้วยเหรอ{kq}"
        heart: 1
