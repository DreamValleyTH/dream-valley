    options:
      - text: "ทำไมตั้งชื่อไนโตรเจน{kq}"
        heart: 1
        reply: "เพราะมันเป็นสิ่งจำเป็นที่สุดในชีวิตเรา เหมือนไนโตรเจนต่อพืช ฟังดูหวานใช่ไหม จริงๆ ตอนเก็บมามันสีเขียวเพราะตกบ่อปุ๋ย"
      - text: "พาไนมาเล่นที่ฟาร์มสิ{kq}"
