      - text: "วันนี้{p}เหนื่อย{k}"
        heart: 0
        reply: "โอเค ไม่เป็นไร พักเถอะ… ขนมครกยังอยู่พรุ่งนี้ เราก็ยังอยู่พรุ่งนี้"

