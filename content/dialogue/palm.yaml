            heart: 2
            reply: "วันนี้เป็นวันดีใจเหรอ… อืม เป็นแล้วตอนนี้ ไปกัน"
      - text: "ตอนนี้ปาล์มยังโกรธเสี่ยเฮงไหม{kq}"
        heart: 1
        reply: "ไม่โกรธเสี่ยหรอก เสี่ยก็ทำธุรกิจ เราโกรธระบบที่ปล่อยให้คนต้องกู้เสี่ย… เลยมาอยู่ในระบบ จะได้โกรธใกล้ๆ"

  - id: palm_f_letter
    topic: self
    when: { heart_min: 5 }
    npc: "เราเคยร่างจดหมายลาออกไว้ในลิ้นชักโต๊ะ อบต. ร่างไว้ตั้งแต่ปีแรก แก้มาเจ็ดรอบ ทุกครั้งที่ถูกสั่งให้เขียนรายงานว่าโครงการเสร็จทั้งที่มีแค่ป้าย"
    options:
      - text: "ล่าสุดแก้เมื่อไหร่{kq}"
