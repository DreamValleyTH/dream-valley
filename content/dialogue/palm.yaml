    options:
      - text: "ขอชิม{k}"
        heart: 2
        reply: "อ่ะ… ขมไหม ขมนิดนึงใช่ไหม ตั้งใจให้ขม เพราะวันนี้มีประชุม ถ้ากาแฟหวานแล้วประชุมก็หวาน มันจะหวานเกินไป"
        next:
