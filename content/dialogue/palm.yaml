          - text: "ขมมาก{k}"
            heart: 1
            reply: "ฮ่าๆ ตรงดี! คนส่วนใหญ่บอกว่าอร่อยเพราะเกรงใจ ข้าราชการไม่ค่อยมีใครพูดตรงกับเรา ขอบคุณที่ขม"
