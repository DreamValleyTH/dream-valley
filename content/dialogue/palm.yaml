        next:
          - text: "ตั้งชื่อตามหัวหน้าแล้วกัน{k}"
            heart: 1
            reply: "ไม่! {player}ไม่ใช่หัวหน้า {player}เป็นคนที่มาดูแปลงตอนเช้า… ชื่อ ‘เช้า’ แล้วกัน ไส้เดือนชื่อเช้า"
          - text: "แล้วปาล์มเป็นอะไร{kq}"
            heart: 2
            reply: "เราเป็นแมลงปอบินอยู่ข้างบน คอยดูว่าเช้าเป็นยังไงบ้าง… ฟังดูโรแมนติกแปลกๆ ไหม เพราะในธรรมชาติแมลงปอกินไส้เดือนไม่ได้นะ เราตรวจแล้ว"
      - text: "ไม่อยากเป็นแมลง{k}"
        heart: 0
        reply: "โอเค เป็นคนก็ดี คนเลือกได้ว่าจะเข้าประชุมไหม… อ้อ ไม่ได้ ช่างมัน แมลงดีกว่า"

  - id: palm_s_budget_tree
