        heart: 1
        reply: "ตีห้าครึ่งเป็นเวลาเดียวที่ไม่มีใครส่งไลน์งานมา ช่วงนั้นเป็นของเรา แล้วก็ของไก่ที่ขันข้างบ้าน"

  - id: palm_s_nitrogen
