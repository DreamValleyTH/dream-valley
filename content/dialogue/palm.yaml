        reply: "แดดทำลายสารในสะเดา แล้วแมลงศัตรูพืชหลายตัวออกหากินตอนเย็น ไปเจอกันพอดี ตามหลักวิชาการเรียกว่าจังหวะ ตามหลักบ้านๆ เรียกว่าดักรอ"
      - text: "ได้ผลจริงเหรอ{kq}"
        heart: 1
        reply: "ได้ผลช้ากว่ายาเคมี แต่ไม่ฆ่าแมลงดี ผึ้งยังอยู่ แมงมุมยังอยู่ แมงมุมกินแมลงร้ายให้เราฟรี ผู้ช่วยฟรีที่ดีที่สุดในแปลง"

  - id: palm_a_contract
    topic: advice
    npc: "ถ้ามีใครมาเสนอสัญญาปลูกพืชส่งโรงงาน อ่านข้อคัดเกรดให้ดีนะ บางสัญญาเขียนว่า ‘ผลผลิตต้องได้มาตรฐานตามที่บริษัทกำหนด’ แล้วไม่บอกว่ากำหนดอะไร"
    options:
      - text: "แบบนี้เขาจะกดราคาได้ตลอดเลย{k}"
        heart: 1
        reply: "ใช่! ตามหลักกฎหมายเรียกว่าข้อตกลงที่ไม่เป็นธรรม ตามหลักชาวบ้านเรียกว่าโดนหลอก เอามาให้เราอ่านก่อนเซ็นนะ ฟรี ไม่ต้องเขียนคำร้อง"
      - text: "ปาล์มเคยเห็นคนโดนเหรอ{kq}"
        heart: 2
        reply: "เห็น… พ่อเรา ปลูกข้าวโพดส่งโรงงาน โดนคัดเกรดตกทุกงวด เป็นหนี้ปุ๋ยเสี่ยเฮงจนต้องขายที่ครึ่งหนึ่ง เราเลยไปเรียนเกษตร จะได้อ่านสัญญาออก"
        next:
          - text: "ขอบคุณที่เล่า{k}"
            heart: 2
            reply: "ไม่ค่อยเล่าใครหรอก… แต่ถ้า{player}จะเซ็นอะไร เราอยากให้รู้ว่าเราไม่ได้ขี้บ่นเฉยๆ เราเคยเห็นมันจบยังไง"
          - text: "พ่อปาล์มเป็นยังไงบ้างตอนนี้{kq}"
            heart: 1
            reply: "ปลูกผักหลังบ้าน ขายตลาดนัด หนี้หมดแล้ว แต่ไม่เคยไปร้านเสี่ยเฮงอีกเลย เดินอ้อมทั้งที่ทางตรงใกล้กว่า"

  - id: palm_a_seedsave
    topic: advice
    npc: "เก็บเมล็ดจากต้นที่งามที่สุดไว้ปลูกรอบหน้านะ ไม่ต้องซื้อใหม่ แล้วพันธุ์จะชินกับดินเรา ปลูกไปสามรุ่นมันจะเป็นพริกพันธุ์บ้าน{player}เลย"
    options:
      - text: "ตั้งชื่อพันธุ์ได้ไหม{kq}"
        heart: 2
        reply: "ได้สิ! ตามหลักวิชาการต้องปลูกทดสอบห้ารุ่นถึงจะรับรอง แต่ตามหลักใจ ตั้งเลยก็ได้ เช่น ‘พริกยายเพียร’ … เราจดลงสมุดแล้วนะ"
      - text: "เมล็ดซื้อร้านเสี่ยเฮงงามกว่าไหม{kq}"
        heart: 0
        reply: "งามรุ่นเดียว เมล็ดลูกผสมเก็บไปปลูกต่อไม่ขึ้นเหมือนแม่ ต้องซื้อใหม่ทุกปี… เป็นธุรกิจที่ฉลาดมาก ฉลาดสำหรับคนขายนะ"

  # ===== smalltalk =====
  - id: palm_s_dragonfly
    topic: smalltalk
    npc: "ถ้าเกิดเป็นแมลงได้ {player}อยากเป็นอะไร เราอยากเป็นแมลงปอ กินยุงเป็นอาชีพ บินได้ทุกทิศ ไม่ต้องเข้าประชุม"
    options:
      - text: "{p}อยากเป็นผึ้ง ทำงานเป็นทีม{k}"
        heart: 1
