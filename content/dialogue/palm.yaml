      - text: "อาบน้ำให้มันหรือยัง{kq}"
        heart: 1
        reply: "อาบแล้วสามรอบ กลิ่นยังติด แม่เราบอกว่าบ้านเหมือนแปลงสาธิต เราบอกว่าก็ดีสิ แม่ไม่ขำ"

  - id: palm_s_market
