# คุณธนา 🖤 — ผู้จัดการโครงการบริษัท (company_office ตู้คอนเทนเนอร์ท้ายตลาด 09–17)
# เสียง: สุภาพ ลงท้ายครับ แทนตัวผม เรียกผู้เล่น คุณ{player} ศัพท์องค์กรกลบเรื่องแย่ ไม่เคยพูดคำว่าดูดน้ำ ลึกๆ เป็นลูกชาวนา
convos:
  # ===== react: ทักเองตามเหตุการณ์ =====
  - id: thana_r_end_help
    topic: react
    once: true
    when: { flag: thana_end_help }
    npc: "คุณ{player} ครับ เมื่อคืนปั๊มตัวที่สองเกิด ‘ขัดข้องทางเทคนิค’ ตั้งแต่สี่ทุ่มถึงตีห้า ช่างบอกว่าเหมือนมีคนไปกดปุ่มปิด… ระบบเรามีจุดอ่อนเยอะจริงๆ ครับ"
    options:
      - text: "จุดอ่อนนี้คนกดชื่ออะไร{kq}"
        heart: 1
        reply: "ในรายงานเขียนว่า ‘ไม่ทราบผู้กระทำ’ ครับ ผมเป็นคนเขียนรายงานเอง ลายมือผมสวยขึ้นเยอะช่วงนี้"
        next:
          - text: "ระวังตัวด้วยนะ{kq}"
            heart: 2
            reply: "ขอบคุณครับ ผมเพิ่งรู้ว่าการโกหกเจ้านายเพื่อคนอื่น นอนหลับง่ายกว่าโกหกคนอื่นเพื่อเจ้านายเยอะเลย"
          - text: "พรุ่งนี้ขัดข้องอีกได้ไหม{kq}"
            heart: 1
            reply: "ระบบเก่าครับ ขัดข้องได้ทุกคืน ถ้าไม่มีใครไปซ่อมเร็วเกิน… ช่างเราขี้เกียจมาก ผมเพิ่งจ้างคนที่ขี้เกียจที่สุดในอำเภอเลย"
      - text: "บ่อป้าแต๋วมีน้ำซึมขึ้นมานิดนึงแล้ว{k}"
        heart: 2
        reply: "จริงเหรอครับ… ผมไม่ได้ยินอะไรนะครับ ผมไม่ได้ยิน แต่ผมจะจำประโยคนี้ไว้ทั้งชีวิต"

  - id: thana_r_end_inside
    topic: react
    once: true
    when: { flag: thana_end_inside }
    npc: "รายงานขอเจาะบ่อที่สามของเรา ตอนนี้ติดอยู่ในขั้นตอนครับ ผมยื่นแบบฟอร์มผิดช่องไปสี่รอบ ท่านนายกฯ ชมว่าผมเริ่มเข้าใจระบบราชการแล้ว"
    options:
      - text: "ตั้งใจผิดใช่ไหม{kq}"
        heart: 1
        reply: "ผมไม่ได้พูดนะครับ ผมแค่เรียนรู้จากผู้เชี่ยวชาญ ท่านนายกฯ ทำให้เรื่องหนึ่งช้าได้สามปีโดยไม่ผิดระเบียบสักข้อ"
        next:
          - text: "คุณธนาเก่งขึ้นเยอะเลย{k}"
            heart: 1
            reply: "เป็นครั้งแรกในชีวิตที่ผมภูมิใจกับ KPI ที่ไม่ผ่านครับ"
          - text: "สำนักงานใหญ่ไม่สงสัยเหรอ{kq}"
            heart: 1
            reply: "สงสัยครับ แต่ผมส่งคำอธิบายไปสิบสองหน้า เต็มไปด้วยคำว่า stakeholder alignment ไม่มีใครอ่านจบ รวมทั้งผม"
      - text: "ช้าแต่ไม่หยุดนะ{kq}"
        heart: 0
        reply: "ใช่ครับ ผมรู้ ผมแค่ซื้อเวลาให้ตำบล… ซึ่งเป็นสิ่งเดียวที่ผมซื้อได้โดยไม่ต้องเบิก"

  - id: thana_r_end_double
    topic: react
    once: true
    when: { flag: thana_end_double }
    npc: "สวัสดีครับคุณ{player} บ่อที่สามได้รับอนุมัติแล้ว ผมได้โบนัสครับ ลูกสาวผมจะได้ไปเข้าค่ายภาษาที่เมืองนอก… ผมควรดีใจใช่ไหมครับ"
    options:
      - text: "ยินดีด้วย{k} ถ้าคุณธนาดีใจจริง"
        heart: 0
        reply: "ผมกำลังพยายามครับ ผมยิ้มหน้ากระจกมาสามวันแล้ว กระจกยังไม่เชื่อเลย"
        next:
          - text: "ยังไม่สายนะ{kq}"
            heart: 1
            reply: "…คุณ{player} อย่าพูดแบบนี้ตอนผมเพิ่งเซ็นสัญญาสามปีครับ มันทำให้ปากกาผมหนักขึ้น"
          - text: "งั้นก็ทำงานต่อไปเถอะ{k}"
            heart: -1
            reply: "ครับ… ผมจะ move forward ครับ คำนี้ผมพูดง่ายที่สุดในโลก"
      - text: "บ่อป้าแต๋วไม่ได้ไปค่ายนะ{kq}"
        heart: -1
        reply: "ผมสมควรโดนครับ… ผมจะส่งรถน้ำไปให้ฟรี ไม่ลงเพจ ไม่ติดโลโก้ ซึ่งไม่พอ ผมรู้"

  - id: thana_r_meet
    topic: react
    once: true
    when: { not_flag: met_thana }
    npc: "สวัสดีครับ ผมธนา ผู้จัดการโครงการครับ คุณคือคุณ{player} หลานคุณยายเพียรใช่ไหมครับ ผมเสียใจด้วยนะครับ ยายเป็นคนที่… มีจุดยืนชัดเจนมาก"
    set_flag: met_thana
    options:
      - text: "ยายไล่คุณกี่รอบ{kq}"
        heart: 1
        reply: "สามรอบครับ รอบสุดท้ายมีจอบมาด้วย ผมบันทึกในรายงานว่า ‘เจ้าของที่ยังไม่พร้อมเจรจา’ ฟังดูดีกว่า ‘เกือบโดนจอบ’"
        next:
          - text: "{p}ก็ไม่พร้อมเหมือนยาย{k}"
            heart: 1
            reply: "รับทราบครับ ผมเป็นคนอดทนครับ บริษัทเราก็อดทน แต่บริษัทอดทนด้วยเงิน ผมอดทนด้วยกระเพาะ"
          - text: "ยายดุขนาดนั้นเลยเหรอ{kq}"
            heart: 1
            reply: "ไม่ดุครับ ยายยื่นน้ำเย็นให้ผมก่อนไล่ด้วย ผมยังจำรสน้ำบ่อบ้านยายได้ เย็นกว่าน้ำขวดบริษัท"
      - text: "นามบัตรเหรอ{kq} รับไว้ก่อนแล้วกัน"
        heart: 0
        reply: "ขอบคุณครับ ด้านหลังมีเบอร์ผม ถ้าโทรหลังหกโมงเย็น ผมยังรับนะครับ ไม่ใช่เพราะขยัน เพราะนอนไม่ค่อยหลับ"
      - text: "ไม่ขายนะ บอกไว้ก่อน"
        heart: 0
        reply: "ผมยังไม่ได้ถามเลยครับ… แต่ผมจดลงสมุดแล้วว่าคุณตอบเร็วมาก ประสิทธิภาพเหมือนยายเลย"

  - id: thana_r_refused
    topic: react
    once: true
    when: { flag: thana_refused }
    npc: "เรื่องที่ดินวันก่อน ผมรายงานขึ้นไปแล้วครับว่าคุณ{player} ‘ยังไม่ align กับโอกาส’ เจ้านายถามว่าคืออะไร ผมบอกว่า คือเขาไม่ขายครับ"
    options:
      - text: "เจ้านายว่าไงบ้าง{kq}"
        heart: 1
        reply: "เขาบอกว่าให้ ‘รักษาความสัมพันธ์’ ไว้ครับ แปลว่าให้ผมมาทักคุณทุกอาทิตย์ จนกว่าคุณจะเบื่อแล้วขาย"
        next:
          - text: "งั้นทักไปเถอะ{k} {p}ไม่เบื่อง่าย"
            heart: 2
            reply: "ดีครับ ผมก็ไม่เบื่อคุยกับคุณ แค่นี้ก็ผ่าน KPI ข้อความสัมพันธ์แล้ว ถึงจะไม่ผ่านข้อที่ดินก็ตาม"
          - text: "ไม่ต้องทักก็ได้{k}"
            heart: -1
            reply: "เข้าใจครับ ผมจะทักห่างๆ แบบทุกสองอาทิตย์ ถือว่าเราเจรจากันได้ครึ่งทาง"
      - text: "คุณธนาโล่งใจหรือเปล่า{kq}"
        heart: 2
        reply: "…คำถามนี้ไม่มีในแบบฟอร์มครับ แต่ถ้ามี ผมจะติ๊กช่อง ‘ไม่ขอตอบ’ ด้วยลายมือที่ยิ้มนิดหนึ่ง"

  - id: thana_r_maybe
    topic: react
    once: true
    when: { flag: thana_maybe }
    npc: "คุณ{player} ครับ ขอโทษที่ตามนะครับ เรื่องที่คุณขอคิดดูก่อน เจ้านายผมให้ ‘กรอบเวลาที่ยืดหยุ่น’ คือสามสิบวันครับ ยืดหยุ่นได้ถึงสามสิบเอ็ด"
    options:
      - text: "{p}ยังคิดอยู่{k}"
        heart: 0
        reply: "คิดให้นานครับ… ผมพูดในฐานะคนนะ ไม่ใช่บริษัท บริษัทอยากให้คุณคิดเร็ว ผมอยากให้คุณคิดถูก"
        next:
          - text: "ถ้าเป็นคุณธนา จะขายไหม{kq}"
            heart: 2
            reply: "แม่ผมขายครับ ยี่สิบปีก่อน ได้เงินก้อนหนึ่ง หมดในสามปี ที่ดินผืนนั้นยังอยู่ แต่ไม่ใช่ของเราแล้ว… ผมตอบแบบนี้ได้ไหมครับ"
          - text: "ราคาจะขึ้นอีกไหม{kq}"
            heart: 0
            reply: "ราคาไม่ขึ้นครับ แต่บ่อแถวนี้อาจแห้งลง ซึ่งทำให้ราคา… ขอโทษครับ ผมพูดเหมือนขู่ ผมไม่ได้ตั้งใจ ผมตั้งใจเตือน"
      - text: "อย่าเร่ง{p}นะ{kq}"
        heart: 1
        reply: "ไม่เร่งครับ ผมแค่ส่งโบรชัวร์มาเพิ่มสองเล่ม ฉบับปรับปรุง ตัวหนังสือด้านหลังใหญ่ขึ้นหนึ่งพอยต์"

  - id: thana_r_haggled
    topic: react
    once: true
    when: { flag: thana_haggled }
    npc: "เรื่องราคาที่คุณถาม ผมเอาเข้าที่ประชุมแล้วครับ มีคนพูดว่า ‘หลานยายเพียรต่อรองเป็นด้วยเหรอ’ ผมเลยรู้ว่าบริษัทไม่รู้จักคุณ"
    options:
      - text: "สรุปได้เพิ่มเท่าไหร่{kq}"
        heart: 0
        reply: "เพิ่มได้แปดหมื่นครับ เป็นหนึ่งล้านสองแสนแปด รวมกระบอกน้ำสแตนเลสอีกหนึ่งใบ ผมเป็นคนขอใบนั้นเอง"
        next:
          - text: "ยังน้อยไปนะ{kq}"
            heart: 1
            reply: "จริงครับ ราคาที่ดินติดคลองตอนนี้มากกว่านี้ ผมไม่ได้บอกนะครับ ผมกระแอม"
          - text: "{p}แค่อยากรู้ราคา{k} ไม่ได้จะขาย"
            heart: 1
            reply: "ฉลาดครับ คุณเพิ่งทำ market research ฟรีจากบริษัทมูลค่าหมื่นล้าน ผมนับถือ"
      - text: "ล้อเล่น{k} ไม่ขายหรอก"
        heart: 1
        reply: "ผมว่าแล้วครับ… ผมดีใจนิดหนึ่ง แต่ห้ามบอกที่ประชุมนะครับ ผมจะเขียนว่า ‘ยังมีโอกาส’"

  - id: thana_r_vote_water
    topic: react
    once: true
    when: { flag: vote_water }
    npc: "ผมเห็นคุณยกมือให้ระบบน้ำครับ ในฐานะบริษัท ผมขอแสดงความยินดีที่ชุมชนใส่ใจน้ำ… ในฐานะคนที่ต้องรายงานเจ้านาย ผมเหงื่อออกนิดหน่อย"
    options:
      - text: "ทำไมต้องเหงื่อออก{kq}"
        heart: 1
        reply: "ระบบน้ำชุมชนต้องวัดระดับน้ำใต้ดินครับ ถ้ามีคนวัด ก็จะมีตัวเลข ถ้ามีตัวเลข… คุณเมย์จะมีพาดหัว"
        next:
          - text: "ตัวเลขจริงเป็นเท่าไหร่{kq}"
            heart: 1
            reply: "ผมขอตอบในภาพรวมครับ… ขอโทษครับ เคยชิน ภาพรวมคือ ไม่ดี ครับ"
          - text: "กลัวตัวเลขก็อย่าทำให้มันลดสิ{kq}"
            heart: 1
            reply: "ประโยคนี้ควรอยู่ในรายงานประจำปีเราครับ แต่จะไม่มีวันได้อยู่"
      - text: "คุณธนาอยากให้ชนะไหม{kq}"
        heart: 1
        reply: "ผมไม่มีสิทธิ์โหวตครับ แต่ถ้ามี ผมจะไปหลบหลังศาลาแล้วยกมือครึ่งเดียว"

  - id: thana_r_vote_road
    topic: react
    once: true
    when: { flag: vote_road }
    npc: "ขอบคุณที่สนับสนุนถนนลาดยางครับคุณ{player} รถบรรทุกของเรา… ขอโทษครับ รถทุกคันของชุมชนจะวิ่งสะดวกขึ้นมาก"
    options:
      - text: "{p}โหวตเพราะถนนพังจริงๆ นะ{kq}"
        heart: 0
        reply: "ผมเชื่อครับ ถนนพังจริง ผมเปลี่ยนโช้คมาสองรอบ บริษัทเบิกให้ แต่หลังผมเบิกไม่ได้"
        next:
          - text: "ไม่ได้โหวตเพื่อบริษัทนะ{kq}"
            heart: 1
            reply: "เข้าใจครับ ความตั้งใจเป็นของคุณ ผลประโยชน์ทางอ้อมเป็นของเรา ระบบมันออกแบบมาแบบนี้ ไม่ใช่ความผิดคุณ"
          - text: "บริษัทช่วยออกค่ายางบ้างสิ{kq}"
            heart: 1
            reply: "ไอเดียดีครับ เราจะช่วยออกค่าป้ายบอกว่าเราช่วย ป้ายใหญ่กว่าส่วนที่ช่วย"
      - text: "เสี่ยเฮงก็ดีใจเหมือนกันนะ{kq}"
        heart: 1
        reply: "ครับ เสี่ยโทรมาขอบคุณผมทั้งที่ผมไม่ได้ทำอะไร แบบนี้น่ากลัวกว่าโดนด่าอีกครับ"

  - id: thana_r_vote_market
    topic: react
    once: true
    when: { flag: vote_market }
    npc: "คุณโหวตตลาดนัดเหรอครับ ผมว่าน่ารักดีครับ ตลาดคือ community hub ที่ดี เราขอจองแผงหนึ่งได้ไหมครับ แจกน้ำดื่มบรรจุขวด"
    options:
      - text: "น้ำจากบ่อไหน{kq}"
        heart: 1
        reply: "…คุณกับคุณเมย์คุยกันบ่อยใช่ไหมครับ ถามเหมือนกันเป๊ะ ผมจะเอาคำถามนี้กลับไปหารือ… อีกครั้ง"
      - text: "ป้าแต๋วไม่ให้จองหรอก{k}"
        heart: 1
        reply: "ผมก็คิดอย่างนั้นครับ ป้าแต๋วบอกว่าแผงเต็มแล้ว ทั้งที่ตลาดยังไม่ได้สร้าง ผมนับถือการวางแผนระยะยาวแบบนี้"
        next:
          - text: "คุณธนามาเดินเที่ยวเฉยๆ ได้นะ{kq}"
            heart: 2
            reply: "ไม่ใส่สูทได้ไหมครับ… ถ้าได้ ผมจะซื้อขนมครกเยอะๆ ให้แม่ค้าคิดราคาคนบริษัทไปเลย ไม่ว่ากัน"
          - text: "บริษัทไม่ต้องมายุ่งดีกว่า{k}"
            heart: 0
            reply: "รับทราบครับ ผมจะรายงานว่าชุมชน ‘ยังไม่เปิดรับพาร์ทเนอร์’ ประโยคนี้ผมใช้บ่อยจนจะสลักไว้บนหลุมศพแล้ว"

  - id: thana_r_well_dry
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "เรื่องบ่อป้าแต๋วกับบ่อลุงสมหมาย บริษัทออกแถลงแล้วครับว่าเป็น ‘ความผันผวนทางอุทกธรณีวิทยาตามฤดูกาล’ ผมอ่านซ้อมมาสามรอบ ยังไม่คล่องปาก"
