        hint: "ไปถามป้าแต๋วที่ร้านชำเรื่องบ่อหลังร้านเมื่อก่อนกับตอนนี้"
        done:
          npc: "บ่อหลังร้านป้าน่ะหลาน สมัยลุงยังอยู่ หย่อนถังลงไปสามวาก็ถึงน้ำ เดี๋ยวนี้สิบวาได้แต่โคลน… คุณธนาให้มาถามเหรอ ฝากบอกเขาด้วย ป้าไม่ได้โกรธเขาคนเดียวหรอก ป้าโกรธทั้งตึกที่อยู่ข้างหลังเขา"
          options:
            - text: "{p}จะบอกให้ครบทุกคำเลย{k}"
              heart: 1
              reply: "บอกไปเลย บอกด้วยว่าป้าแถมลูกอมให้เขาเพราะสงสารนะ ไม่ใช่เพราะชอบ… ชอบนิดนึง"
            - text: "ป้าไม่โกรธเขาเหรอ{kq}"
              heart: 0
              reply: "โกรธ แต่คนที่ยังมาซื้อน้ำร้านป้าทุกวันทั้งที่รู้ว่าโดนนินทา ป้าว่าเขายังเหลือความเป็นคนอยู่ครึ่งตัว"
      - goal: { type: give, npc: thana, item: morning_glory, n: 2 }
        hint: "เอาผักบุ้งจากแปลง 2 กำไปให้คุณธนา (น้องฝนอยากได้รูป ‘ผักที่ยังโตได้ด้วยน้ำของหมู่บ้าน’)"
        done:
          npc: "ผักบุ้งสวยมากครับ ผมถ่ายส่งให้ลูกแล้ว พร้อมเรื่องบ่อป้าแต๋วสามวาสิบวา… ลูกตอบกลับมาว่า ‘ผักบุ้งต้องใช้น้ำเยอะไหมพ่อ ถ้าบ่อแห้งจะปลูกได้อีกกี่ปี’ ผมต้องตอบลูกว่าอะไรดีครับคุณ{player}"
          options:
            - text: "ตอบความจริงไปเลย{k}"
              heart: 2
              set_flag: thana_q1_truth
              reply: "…ครับ ผมจะพิมพ์ว่า ‘ไม่รู้ ถ้าบ่อแห้งต่อไปแบบนี้อาจไม่ได้ปลูกแล้ว’ ผมพิมพ์ช้ามาก นิ้วผมไม่เคยพิมพ์ประโยคแบบนี้"
            - text: "บอกว่าเดี๋ยวฝนก็มา{k}"
              heart: 0
              set_flag: thana_q1_soft
              reply: "ครับ… ประโยคนี้ผมใช้กับชาวบ้านทุกวัน ใช้กับลูกแล้วมันฟังน่าเกลียดกว่าเดิมนะครับ แต่ผมจะส่ง"
            - text: "ให้ลูกมาถามป้าแต๋วเองสิ{k}"
              heart: 1
              set_flag: thana_q1_truth
              reply: "ฮ่า… ถ้าลูกผมเจอป้าแต๋ว ภายในหนึ่งชั่วโมงลูกจะรู้เรื่องผมมากกว่าที่ผมเล่าในสิบสองปี ผมขอเก็บไว้เป็นแผนสำรองครับ"
    reward: { money: 200, heart: 2, set_flag: thana_q1_done, line: { from: thana, text: "ขอบคุณชุมชนบ้านดงเย็นที่ให้ข้อมูลประกอบรายงานเยาวชนครับ 🙏 (ส่วนตัว ไม่เกี่ยวกับบริษัท ย้ำ ส่วนตัว)" } }

  - id: thana_q2
    npc: thana
    title: "กราฟที่ไม่ได้อยู่ในรายงาน"
    desc: "คุณธนาทำงานดึกที่ตู้คอนเทนเนอร์ นอนไม่หลับ อยากให้ใครสักคนเห็นอะไรบางอย่าง"
    start: { flag: thana_q1_done, heart_min: 4, day_min: 12 }
    offer:
      npc: "คุณ{player} ครับ… คืนนี้ผมจะอยู่ที่ตู้คอนเทนเนอร์ถึงสองทุ่ม ถ้าว่างแวะมาได้ไหมครับ เอากาแฟเย็นมาสักแก้วยิ่งดี ผมไม่ได้กินกาแฟที่ไม่ได้ชงด้วยน้ำบ่อบริษัทมาสามวันแล้ว"
      options:
        - text: "ได้{k} สองทุ่มเจอกัน"
          accept: true
          heart: 1
          reply: "ขอบคุณครับ กลับก่อนสามทุ่มนะครับ บริษัทไม่มีนโยบายเรื่องผี แต่ผมมีนโยบายส่วนตัว ห้ามใครเป็นอะไรเพราะผมอีก"
        - text: "มีอะไรถึงต้องกลางคืน{kq}"
          accept: true
          heart: 0
          reply: "กลางวันกล้องวงจรปิดในตู้ส่งภาพตรงไปสำนักงานใหญ่ครับ กลางคืนมันส่งเหมือนกัน แต่ไม่มีใครดู ยามเราดูละครหลังข่าว"
        - text: "{p}ไม่เดินกลางคืน{k}"
          heart: 0
          reply: "เข้าใจครับ ฉลาดด้วย… ถ้าวันไหนเปลี่ยนใจ ผมอยู่ทุกคืนครับ ผมไม่มีที่อื่นให้ไป"
    steps:
      - goal: { type: have, item: iced_coffee, n: 1 }
        hint: "ซื้อกาแฟเย็น 1 แก้วจากร้านกาแฟ"
      - goal: { type: visit, place: company_office, from: "20:00", to: "21:00" }
        hint: "ไปหาคุณธนาที่ตู้คอนเทนเนอร์ท้ายตลาดช่วง 20:00–21:00"
        done:
          npc: "กาแฟอร่อยมากครับ… นี่ครับ หน้าจอนี้ ระดับน้ำใต้ดินตำบลย้อนหลังสองปี เส้นสีแดงคือบ่อเรา เส้นสีฟ้าคือบ่อชาวบ้านที่เราแอบวัด… คุณเห็นไหมครับ มันชันลงเหมือนกราฟกำไรเรา แค่กลับหัว"
          options:
            - text: "ถ่ายรูปได้ไหม{kq}"
              heart: 1
              set_flag: thana_q2_photo
              reply: "…ผมจะไปเข้าห้องน้ำห้านาทีครับ หน้าจอจะเปิดค้างไว้ ห้องน้ำเราอยู่ไกล ทางเดินมืด ผมเดินช้า"
            - text: "ทำไมให้{p}ดู{kq}"
              heart: 2
              set_flag: thana_q2_seen
              reply: "เพราะผมดูคนเดียวมาสองปีแล้วครับ คนที่รู้อะไรคนเดียวนานๆ จะเริ่มคิดว่าตัวเองบ้า ผมอยากให้มีคนยืนยันว่าผมไม่ได้บ้า… ผมแค่ผิด"
            - text: "คุณธนาก็รู้มาตลอดสินะ{kq}"
              heart: 0
              set_flag: thana_q2_seen
              reply: "ตั้งแต่วันแรกครับ วันที่ผมกดปุ่ม… คุณจะโกรธผมก็ได้ ผมเตรียมใจมาแล้ว กาแฟแก้วนี้คือค่าธรรมเนียมที่คุณต้องฟังผมสารภาพ"
    sold_at: { iced_coffee: coffee }
    reward: { money: 0, heart: 2, items: { honey: 1 }, set_flag: thana_q2_done }

  - id: thana_q3
    npc: thana
    title: "อีเมลจากสำนักงานใหญ่"
    desc: "สำนักงานใหญ่สั่งเร่งบ่อที่สาม คุณธนาลังเล ขอให้ช่วยถามคนที่เข้าใจเรื่องน้ำและข่าว"
    start: { flag: thana_q2_done, heart_min: 5, day_min: 18 }
    offer:
      npc: "อีเมลเมื่อเช้าครับ ‘เร่งบ่อที่สาม ภายในไตรมาสนี้ ไม่มีข้อยกเว้น’ สามบรรทัด ไม่มีคำว่าครับสักคำ… คุณ{player} ผมอยากรู้ว่าถ้าผมทำอะไรสักอย่าง มันจะช่วยได้จริงไหม หรือแค่ทำให้ผมรู้สึกดี"
      options:
        - text: "{p}จะไปถามคนที่รู้ให้{k}"
          accept: true
          heart: 1
          reply: "ขอบคุณครับ ถามคุณปาล์มที่ อบต. เรื่องข้อมูลน้ำ… แล้วก็… คุณเมย์ครับ ถามว่าถ้ามีแหล่งข่าวคนหนึ่ง เขาจะปกป้องได้ไหม ผมไม่ได้หมายถึงผมนะครับ แหล่งข่าวทั่วไป"
        - text: "คุณธนารู้คำตอบอยู่แล้วนี่{kq}"
          accept: true
          heart: 2
          reply: "รู้ครับ ผมแค่อยากได้ยินจากคนอื่นก่อน คนที่ตัดสินใจคนเดียวมาทั้งชีวิตก็อยากมีคนร่วมรับผิดบ้าง… ผมพูดตรงเกินไปไหมครับ"
        - text: "ทำตามสั่งไปเถอะ{k}"
          heart: -1
          reply: "…นั่นคือคำตอบที่ง่ายที่สุดครับ ผมขอเก็บไว้เป็นทางเลือกสุดท้าย ผมยังไม่พร้อมจะเป็นคนแบบนั้นเต็มตัว"
    steps:
      - goal: { type: talk, npc: palm }
        hint: "ไปถามปาล์มที่ อบต. ว่าถ้ามีข้อมูลระดับน้ำจริง ตำบลจะเอาไปทำอะไรได้"
        done:
          npc: "ข้อมูลระดับน้ำจริงเหรอ… ถ้ามีนะ อบต. ยื่นเรื่องให้กรมทรัพยากรน้ำบาดาลตรวจใบอนุญาตได้เลย แต่ต้องเป็นตัวเลขต่อเนื่อง ไม่ใช่รูปถ่ายใบเดียว… ใครมีอะไรเหรอ ไม่ต้องบอกก็ได้ บอกแค่ว่าเขายังโอเคไหม"
          options:
            - text: "เขายังไม่โอเคเท่าไหร่{k}"
              heart: 1
              reply: "งั้นบอกเขาว่าไม่ต้องรีบกระโดดคนเดียว ตำบลนี้มีคนรอรับเยอะกว่าที่เขาคิด"
            - text: "ถ้ามีจะช่วยได้แน่เหรอ{kq}"
              heart: 0
              reply: "แน่ไม่มีหรอก แต่ดีกว่าวัดด้วยเชือกผูกถังเหมือนตอนนี้เยอะ"
      - goal: { type: talk, npc: may }
        hint: "ไปถามเมย์ที่ร้านกาแฟว่าถ้ามีแหล่งข่าวจากในบริษัท เธอจะปกป้องเขาได้ไหม"
        done:
          npc: "แหล่งข่าวจากในบริษัท… {player} ไม่ต้องบอกว่าใคร เราเดาได้ คนที่สะกดชื่อตัวเองในอีเมลตอบกลับว่า ‘ไม่สะดวก’ ทุกครั้งแต่ยังเปิดอ่านทุกฉบับ… บอกเขาว่าเราไม่เคยเปิดเผยแหล่งข่าว ถึงจะโดนทนายส่งจดหมายมาสามฉบับแล้วก็ตาม"
          options:
            - text: "พี่เมย์ไม่โกรธเขาเหรอ{kq}"
              heart: 1
              reply: "โกรธ แต่ข่าวไม่ได้เขียนด้วยความโกรธ เขียนด้วยหลักฐาน ถ้าเขามีหลักฐาน เราจะโกรธเขาน้อยลงสามสิบเปอร์เซ็นต์ เราเป็นนักข่าวที่ยุติธรรม"
            - text: "ถ้าเขาโดนไล่ออกล่ะ{kq}"
              heart: 1
              reply: "นั่นแหละที่เราไม่ตอบแทนเขา คนเราต้องเลือกเองว่าจะจ่ายราคาอะไร เราจ่ายของเราไปแล้ว… บอกเขาว่ากินข้าวด้วย หน้าเขาซีดกว่าตั้มอีก"
      - goal: { type: days, n: 2 }
        hint: "ให้เวลาคุณธนาคิดสองวัน"
        done:
          npc: "ผมคิดมาสองคืนครับ คืนแรกเขียนจดหมายลาออกฉบับที่ห้า คืนที่สองฉีกทิ้ง… คุณ{player} ถ้าเป็นคุณ คุณจะเริ่มจากตรงไหนครับ"
          options:
            - text: "เริ่มจากความจริงชิ้นเล็กๆ ก่อน{k}"
              heart: 2
              set_flag: thana_q3_small
              reply: "ชิ้นเล็กๆ… เหมือนลดรอบปั๊มตอนกลางคืนทีละนิดใช่ไหมครับ ไม่มีใครดูกราฟตอนตีสาม นอกจากผม"
            - text: "เริ่มจากลูกสาว{k}"
              heart: 2
              set_flag: thana_q3_family
              reply: "…คุณพูดถูกครับ ถ้าผมตอบลูกไม่ได้ ผมก็ไม่มีสิทธิ์ตอบใครเลย"
    reward: { money: 0, heart: 1, set_flag: thana_q3_done }

  - id: thana_q4
    npc: thana
    title: "ก๋วยเตี๋ยวที่ไม่เบิกบริษัท"
    desc: "หลังประชุมครั้งที่สอง คุณธนานัดกินก๋วยเตี๋ยวร้านพี่หน่อย จะบอกว่าตัดสินใจอะไร"
    start: { flag: thana_q3_done, heart_min: 6, day_min: 22 }
    offer:
      npc: "คุณ{player} ครับ พรุ่งนี้เที่ยงว่างไหมครับ ร้านพี่หน่อย ผมเลี้ยง… ไม่ใช่สิ ผมจ่ายเงินตัวเอง ไม่เบิก ผมอยากเริ่มนับตั้งแต่มื้อนี้"
      options:
        - text: "ไปสิ{k} สั่งพิเศษเลยนะ"
          accept: true
          heart: 1
          reply: "สั่งได้ครับ ไข่สองฟองก็ได้ เป็นงบส่วนตัวที่ผมภูมิใจที่สุดเดือนนี้"
        - text: "จะบอกเรื่องอะไร{kq}"
          accept: true
          heart: 1
          reply: "เรื่องที่ผมพูดในห้องประชุมไม่ได้ครับ ร้านพี่หน่อยเสียงดังพอ ไม่มีใครได้ยินชัด… ยกเว้นพี่หน่อย แต่พี่หน่อยไม่เล่าใคร"
    steps:
      - goal: { type: visit, place: noi_noodle, from: "11:00", to: "13:00" }
        hint: "ไปร้านก๋วยเตี๋ยวพี่หน่อยช่วง 11:00–13:00"
        done:
          npc: "…ผมมีสามทาง ทางแรก ส่งตัวเลขระดับน้ำทั้งหมดให้สหกรณ์คุณกล้าแบบไม่ลงชื่อ แล้วแอบลดปั๊มตอนกลางคืน ถ้าโดนจับ ผมจบ ทางสอง อยู่ต่อ แล้วใช้ระบบเอกสารทำให้บ่อที่สามช้าที่สุดเท่าที่ทำได้ ทางสาม… ทำตามสั่ง รับโบนัส ส่งลูกเรียน แล้วเลิกคิด คุณ{player} ช่วยผมเลือกหน่อยครับ"
          options:
            - text: "ส่งตัวเลขให้กล้า แล้วลดปั๊มเถอะ{k}"
              heart: 2
              set_flag: thana_end_help
              reply: "…ครับ ผมเตรียมแฟลชไดรฟ์ไว้ในกระเป๋าเสื้อตั้งแต่เมื่อวานแล้ว มันหนักกว่าที่คิด หนักกว่าป้ายชื่อบริษัทอีก… พี่หน่อยครับ ขอน้ำซุปเพิ่มหน่อยครับ ผมต้องใช้ความกล้า"
            - text: "อยู่ข้างใน แล้วถ่วงเวลาไว้{k}"
              heart: 1
              set_flag: thana_end_inside
              reply: "ทางของคนขี้ขลาดที่ฉลาดหน่อยครับ… ผมชอบนะ อย่างน้อยผมได้อยู่ใกล้ปุ่ม แล้วผมจะเป็นคนที่ช้าที่สุดในบริษัท ด้วยความตั้งใจ"
            - text: "ทำตามสั่งเถอะ{k} คิดถึงลูกก่อน"
              heart: -1
              set_flag: thana_end_double
              reply: "ครับ… มีเหตุผลที่สุดครับ ทุกคนในชีวิตผมพูดประโยคนี้ ผมแค่หวังว่าคุณจะพูดอย่างอื่น… ไม่เป็นไรครับ ก๋วยเตี๋ยวอร่อยมาก ผมจะจำรสนี้ไว้"
    reward: { money: 0, heart: 2, set_flag: thana_q_done, line: { from: thana, text: "ขอบคุณร้านพี่หน่อยสำหรับก๋วยเตี๋ยวชามที่ดีที่สุดในชีวิตการทำงานครับ ใบเสร็จนี้ผมไม่เบิก 🍜" } }
