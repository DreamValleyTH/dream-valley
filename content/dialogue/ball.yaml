      - text: "พี่ตอบเขาหรือยัง"
        heart: 1
        reply: "ตอบว่า ‘เดี๋ยวดูให้’ ครับ เขาด่าว่าผมตอบเหมือนลูกค้าถามเรื่องรถ… ก็ผมตอบเป็นอยู่แค่นี้"

