          npc: "บอลส่งหลานมาเหรอ… ไอ้บอลนี่ ไม่เคยทวงลุงสักคำ ลุงเลยไม่เคยจ่ายสักบาท ลุงผิดเองหลาน ลุงรู้ หกพันลุงไม่มีวันนี้ แต่ลุงทำอะไรได้บ้างล่ะ"
          options:
            - text: "ผ่อนงวดละห้าร้อยได้ไหม{kq}ลุง เท่าค่าหวยงวดนึง"
              heart: 2
              set_flag: ball_q1_install
              reply: "เท่าค่าหวยงวดนึง… หลานพูดแบบนี้ลุงเจ็บนะ แต่ลุงยอม งวดละห้าร้อย สิบสองงวด ลุงจะให้ป้าพรเป็นคนถือเงินไปให้ ไม่งั้นมันจะเลี้ยวไปแผงเจ๊หงษ์"
            - text: "จ่ายพันนึงก่อน ที่เหลือหลังเกี่ยวข้าว"
              heart: 1
              set_flag: ball_q1_harvest
              reply: "พันนึงลุงมี… ซ่อนอยู่ในสมุดเลข ลุงจะไปเอามา ที่เหลือหลังเกี่ยว ลุงสัญญา ลุงสัญญามายี่สิบปีแต่ครั้งนี้มีหลานเป็นพยาน"
      - goal: { type: visit, place: garage, from: "17:00", to: "19:00" }
        hint: "ตอนเย็นแวะไปที่อู่บอล"
        done:
          npc: "ป้าพรเอาเงินมาให้แล้วครับ ใส่ซองผ้าลายดอกพิกุล ป้าบอก ‘ตาแก่ฝากมา ไม่ต้องขอบใจตาแก่ ขอบใจหลานยายเพียร’… ผมนั่งดูซองมาสิบนาทีแล้ว ยังไม่ได้เปิด"
          options:
            - text: "เปิดสิพี่ นี่ค่าแรงพี่นะ"
              heart: 2
              set_flag: ball_q1_opened
              reply: "…เงินค่าซ่อมก้อนแรกที่ได้ตรงตามตกลงในปีนี้ครับ ผมจะไม่เอาไปจ่ายเสี่ยวันนี้ ผมจะซื้อหมูปิ้งให้ยาย แล้วซื้อกาแฟเย็นสองแก้ว… แก้วนึงมีคนกินแล้ว"
            - text: "ใช้วิธีนี้กับใบเสร็จใบอื่นด้วยสิ"
              heart: 1
              set_flag: ball_q1_system
              reply: "ผ่อนเป็นงวดทุกใบ… ผมจะเขียนติดผนังอู่ ‘ค่าซ่อมผ่อนได้ ไม่มีดอกเบี้ย ไม่มีสติกเกอร์’ คนจะได้รู้ว่าที่นี่ไม่ใช่ร้านเสี่ย"
    reward: { money: 100, heart: 2, items: { iced_coffee: 1 }, set_flag: ball_q1_done, line: { from: sommai, text: "ใครค้างค่าซ่อมไอ้บอลอยู่ ไปผ่อนซะ ลุงเริ่มแล้ว 😤 ลุงยังทำได้ พวกเอ็งก็ทำได้" } }

  - id: ball_q2
    npc: ball
    title: "ปั๊มที่ดูดแต่ลม"
    desc: "ปั๊มน้ำทั้งตำบลดูดลม บอลซ่อมฟรีจนผ้าเช็ดมือหมด ไปช่วยดูปั๊มบ้านลุงสมหมาย"
    start: { flag: story_well_dry, heart_min: 2 }
    offer:
      npc: "ปั๊มเข้าอู่วันละสี่ตัวครับ ผ้าเช็ดมือผมหมดตั้งแต่เมื่อวาน ผมใช้เสื้อตัวเองเช็ดแทน ยายดุ… ช่วยซื้อผ้ามาให้หน่อย แล้วไปดูปั๊มบ้านลุงสมหมายกับผม ผมอยากให้มีคนเห็นด้วยตาว่ามันไม่ใช่ปั๊มเสีย"
      options:
        - text: "ได้{k} เดี๋ยวซื้อมาให้"
          accept: true
          heart: 2
          reply: "สามผืนพอครับ ร้านป้าแต๋ว ผืนละสามสิบ อย่าเอาสีขาว เปื้อนแล้วป้าพรเห็นจะบ่นว่าผมใช้ผ้าไม่คุ้ม"
        - text: "ทำไมต้องมีคนเห็นด้วย{kq}"
          accept: true
          heart: 1
          reply: "เพราะผมพูดคนเดียวไม่มีใครฟังครับ ช่างพูดอะไรคนก็คิดว่าจะขายอะไหล่ ถ้า{player}เห็นแล้วไปเล่า คนจะเชื่อ"
        - text: "พี่ซ่อมฟรีแบบนี้ไม่ไหวหรอก"
          heart: 0
          reply: "ไม่ไหวครับ… แต่ผมจะคิดเงินคนบ่อแห้งได้ไง ไว้ผมคิดออกค่อยว่ากัน"
    steps:
      - goal: { type: give, npc: ball, item: hand_towel, n: 3 }
        hint: "ซื้อผ้าเช็ดมือ 3 ผืนที่ร้านป้าแต๋ว เอาไปให้บอลที่อู่"
        done:
          npc: "สีน้ำเงิน… ดีครับ คราบน้ำมันไม่ค่อยเห็น ขอบคุณครับ… ยายบอกว่าคนที่ซื้อผ้าเช็ดมือให้ช่างคือคนที่เข้าใจช่าง ผมไม่รู้ว่ายายเอามาจากไหน แต่ผมเห็นด้วย"
          options:
            - text: "ยายพี่พูดถูก"
              heart: 2
              reply: "…อย่าไปบอกยายนะครับ ยายจะถามว่า{player}จะมากินข้าวบ้านเมื่อไหร่ ยายถามทุกคนที่ผมพูดถึงเกินสองครั้ง"
            - text: "ใช้ให้คุ้มนะ{kq}"
              heart: 1
              reply: "คุ้มครับ ผ้าผืนนึงผมใช้ได้หกเดือน ซักด้วยผงซักฟอกยายทุกคืน… ตอนนี้มีสามผืน ผมจะได้มีผืนสำรองครั้งแรกในชีวิต"
      - goal: { type: visit, place: house_sommai, from: "08:00", to: "12:00" }
        hint: "ตอนเช้าไปบ้านลุงสมหมาย ดูบอลตรวจปั๊มน้ำ"
        done:
          npc: "ฟังนะครับ… เสียงหวีด ดูดลม ผมถอดดูแล้ว ใบพัดดี ซีลดี มอเตอร์ดี ไม่มีอะไรเสียเลย ปั๊มทำงานสมบูรณ์ แค่ไม่มีน้ำให้ดูด… ผมซ่อมได้ทุกอย่าง ยกเว้นน้ำในดิน เมื่อเช้าคนบริษัทมาชวนผมเป็นช่างประจำ เงินเดือนเท่าระยอง ดูแลปั๊มสิบสองนิ้วตัวที่ทำแบบนี้"
          options:
            - text: "พี่ปฏิเสธเขาไปเลย"
              heart: 1
              set_flag: ball_q2_refuse_company
              reply: "…ผมจะปฏิเสธครับ ผมซ่อมปั๊มที่ดูดบ่อยายผมไม่ได้ มือผมจะสั่น ผมรู้ตัว แต่ผมไม่รู้ว่าปฏิเสธแล้วหนี้จะหายไปไหน"
            - text: "พี่ไม่ต้องตอบวันนี้ คิดให้รอบคอบก่อน"
              heart: 2
              set_flag: ball_q2_think
              reply: "…ขอบคุณครับ ทุกคนบอกให้ปฏิเสธทันที เหมือนการปฏิเสธมันฟรี {player}เป็นคนแรกที่รู้ว่ามันมีราคา"
            - text: "บันทึกเสียงปั๊มกับข้อมูลไว้ให้พี่เมย์กับพี่ปาล์ม"
              heart: 1
              set_flag: ball_q2_evidence
              reply: "ผมจดทุกตัวครับ สิบสองบ้าน วันที่ เสียง ระดับน้ำที่ปาล์มวัด… ถ้าวันนึงต้องมีคนพิสูจน์ว่าน้ำหายไปไหน ช่างก็เป็นพยานได้"
    sold_at: { hand_towel: taew_shop }
    reward: { heart: 2, items: { engine_oil: 1 }, set_flag: ball_q2_done, line: { from: ball, text: "ปั๊มที่ดูดลมไม่ใช่ปั๊มเสียครับ อย่าซื้อปั๊มใหม่ เสียเงินเปล่า สูบสิบนาที พักสามสิบนาที (สาม-สิบ) ปั๊มไหนเสียงหวีดเอามาที่อู่ ดูให้ฟรี" } }

  - id: ball_q3
    npc: ball
    title: "แม่แรงของพ่อ"
    desc: "บอลพร้อมจะเปิดผ้าใบคลุมแม่แรงตัวที่พ่อใช้วันสุดท้าย"
    start: { flag: ball_q2_done, heart_min: 5, day_min: 12 }
    offer:
      npc: "…{player} ผมจะเปิดผ้าใบหลังอู่ ตัวแม่แรงของพ่อ สามปีผมไม่กล้า ถ้ามีคนนั่งอยู่ข้างๆ ผมอาจจะกล้า… เย็นๆ หลังปิดอู่ได้ไหมครับ"
      options:
        - text: "ได้{k}พี่ {p}จะไปนั่งด้วย"
          accept: true
          heart: 2
          reply: "…ขอบคุณครับ เอากาแฟเย็นมาด้วยได้ไหม ผมจะไม่เก็บไว้ในตู้แช่จนน้ำแข็งละลายอีกแล้ว ครั้งนี้กินตอนเย็นๆ เลย"
        - text: "พี่แน่ใจนะ{kq} ไม่ต้องรีบ"
          accept: true
          heart: 2
          reply: "ไม่แน่ใจครับ แต่ถ้ารอแน่ใจ ผมจะรออีกสามปี… เย็นนี้นะครับ"
        - text: "ไม่อยากไปยุ่งเรื่องส่วนตัวพี่"
          heart: 0
          reply: "…ครับ ผมเข้าใจ เรื่องแบบนี้ไม่ควรขอใคร ผมขอโทษครับ"
    steps:
      - goal: { type: give, npc: ball, item: iced_coffee, n: 1 }
        hint: "ซื้อกาแฟเย็น 1 แก้วที่ร้านกาแฟ เอาไปให้บอล"
        done:
          npc: "น้ำแข็งยังไม่ละลาย… ครั้งแรกที่ผมได้กาแฟเย็นตอนยังเย็น ผมจะเก็บไว้กินตอนเปิดผ้าใบ ให้มันละลายไปพร้อมกับผม"
          options:
            - text: "อย่าให้มันละลายหมดนะ"
              heart: 1
              reply: "…ครับ ผมจะกินเร็วกว่าความกลัว ถ้าทำได้"
            - text: "เย็นนี้เจอกันที่อู่"
              heart: 1
              reply: "หลังหกโมงครับ ผมจะปิดประตูอู่ครึ่งนึง ไม่อยากให้ลุงสมหมายเข็นรถเกี่ยวมาตอนนั้น"
      - goal: { type: visit, place: garage, from: "18:00", to: "20:30" }
        hint: "ตอนเย็นไปที่อู่บอล นั่งเป็นเพื่อนตอนเขาเปิดผ้าใบ"
        done:
          npc: "(บอลดึงผ้าใบออก ฝุ่นฟุ้ง เงียบไปนาน) …มันแค่แม่แรงครับ เหล็กสนิมขึ้นนิดหน่อย สลักตัวล่างสึก ผมเห็นแล้ว สลักตัวนี้แหละ… ถ้าวันนั้นพ่อเปลี่ยนสลัก ผมควรทำยังไงกับมันดีครับ"
          options:
            - text: "ซ่อมด้วยกัน เปลี่ยนสลักให้ปลอดภัย แล้วใช้มันต่อ"
              heart: 2
              set_flag: ball_jack_fixed
              reply: "…ซ่อมด้วยกัน (บอลถอดสลัก ยื่นประแจเบอร์สิบสองให้ ถือไฟฉายให้ สองชั่วโมงไม่มีใครพูด) เสร็จแล้วครับ ผมยกรถกระบะยายขึ้นด้วยตัวนี้ได้ มันไม่ลื่น… พ่อคงชอบแบบนี้ ผมพูดถึงพ่อได้แล้วโดยไม่ต้องหยุดหายใจ"
            - text: "ไม่ต้องซ่อม เก็บไว้ ตั้งไว้ในที่ที่มองเห็นได้"
              heart: 1
              set_flag: ball_jack_kept
              reply: "ตั้งไว้ข้างป้ายสมพงษ์การช่าง… ไม่คลุมผ้าแล้ว ให้มันอยู่ตรงนั้น ผมมองมันได้ทุกเช้า ไม่ต้องใช้ แค่ไม่ต้องหลบ ผมว่าแค่นี้ก็พอแล้วครับ"
    sold_at: { iced_coffee: coffee }
    reward: { heart: 3, items: { wrench_set: 1 }, set_flag: ball_q3_done, line: { from: ball, text: "อู่บอลการช่าง เปิดพรุ่งนี้หกโมงเหมือนเดิมครับ" } }

  - id: ball_q4
    npc: ball
    title: "ใบสมัครในลิ้นชัก"
    desc: "หลังคุยกับนก บอลอยากให้ช่วยคิดว่าอู่จะอยู่ได้จริงไหม ก่อนระยองปิดรับ"
    start: { flag: nok_q3_done, heart_min: 6, day_min: 15 }
    offer:
      npc: "ระยองปิดรับอีกห้าวันครับ… หลังคืนนั้นที่นกพูด ผมคิดได้อย่างเดียว ผมไม่รู้ว่าอู่มันอยู่ได้จริงหรือแค่ผมไม่อยากปล่อย ช่วยผมดูตัวเลขหน่อยได้ไหม ผมดูคนเดียวแล้วตาลาย"
      options:
        - text: "ดูด้วยกัน แต่{p}อยากถามนกก่อนว่านกเห็นยังไง"
          accept: true
          heart: 2
          reply: "นกกลับมาเสาร์นี้ครับ… ถามได้ ผมอยากรู้เหมือนกันแต่ไม่กล้าถามเอง ผมถามนกได้แต่เรื่องยาง"
        - text: "ได้ ตัวเลขไม่โกหก"
          accept: true
          heart: 1
          reply: "ตัวเลขไม่โกหกครับ แต่มันก็ไม่ปลอบใจ… เอาเถอะ ผมเตรียมสมุดไว้แล้ว"
        - text: "ไปเลยพี่ ระยองดีกว่าแน่"
          heart: -1
          reply: "…อาจจะครับ ผมแค่อยากให้มีคนดูกับผมก่อน ไม่ใช่ตัดสินแทนผม"
    steps:
      - goal: { type: talk, npc: nok }
        hint: "ถามนกว่าคิดยังไงกับอู่ของบอล (นกกลับบ้านวันที่ 6–7 ของสัปดาห์)"
        done:
          npc: "บอลให้แกมาถามฉันเหรอ… ไอ้บ้า ถามเองไม่เป็น ฟังนะแก อู่บอลไม่ได้จนเพราะไม่มีงาน อู่บอลจนเพราะไม่มีใครจ่าย ทั้งตำบลรักบอล แต่รักแบบติดค้าง ถ้าทุกคนจ่ายจริง บอลรวยกว่าฉันนะ ฉันพูดในฐานะนักบัญชีไม่มีปริญญา"
          options:
            - text: "งั้นปัญหาไม่ใช่อู่ แต่เป็นระบบเก็บเงิน"
              heart: 2
              reply: "ใช่! แกพูดเหมือนกล้าเลย… ไม่ แกพูดเหมือนฉันตอนตรวจยอดผลิต ไปบอกบอล ถ้าบอลไม่ฟัง บอกว่านกพูด บอลกลัวฉันมากกว่ากลัวเสี่ย"
            - text: "นกอยากให้พี่บอลอยู่ใช่ไหม"
              heart: 1
              reply: "อยากแก… แต่ฉันอยากให้เขาอยู่เพราะอู่มันอยู่ได้ ไม่ใช่เพราะฉันอยาก แบบนั้นมันจะพังทั้งเขาทั้งฉัน"
      - goal: { type: days, n: 2 }
        hint: "รอสองวัน ให้บอลไล่ดูใบเสร็จค่าซ่อมทั้งลิ้นชัก"
      - goal: { type: visit, place: garage, from: "17:00", to: "19:00" }
        hint: "ตอนเย็นไปที่อู่ ดูตัวเลขกับบอล"
        done:
          npc: "ผมนับแล้วครับ… ถ้าใบเสร็จที่ค้างจ่ายครบ ถ้าคนผ่อนแบบลุงสมหมาย อู่ผมได้เดือนละหนึ่งหมื่นสอง ระยองได้สองหมื่น… ห่างกันแปดพัน แต่ระยองต้องจ่ายค่าหอ ค่ากิน ค่ารถกลับบ้าน เหลือห่างกันสามพัน… สามพันบาทกับอู่ของพ่อ ผมควรทำยังไงต่อครับ"
          options:
            - text: "ทำระบบสมาชิกอู่ เดือนละร้อยผ่านสหกรณ์พี่กล้า ซ่อมเล็กฟรี"
              heart: 2
              set_flag: ball_plan_member
              reply: "สมาชิกอู่… ร้อยบาทต่อบ้าน หมู่สี่มีเก้าสิบบ้าน… ถ้าสมัครครึ่งเดียวก็สี่พันห้า มากกว่าสามพัน ผม… ไม่เคยคิดว่าอู่จะเป็นสหกรณ์ได้ ไปคุยกับกล้าพรุ่งนี้ครับ"
            - text: "ไปสัมภาษณ์ที่ระยองก่อน เห็นของจริงแล้วค่อยเลือก"
              heart: 1
              set_flag: ball_plan_interview
              reply: "ไปดูของจริง… ผมฟังเสียงเครื่องทางโทรศัพท์มาสองปี ไม่เคยไปฟังจริง ใช่ครับ ผมจะไปสัมภาษณ์ แต่จะซื้อตั๋วไปกลับ ไม่ใช่เที่ยวเดียว"
            - text: "เก็บหนี้ที่ค้างทั้งตำบลให้หมดก่อน ให้มีทุนตั้งตัว"
              heart: 1
              set_flag: ball_plan_collect
              reply: "สี่สิบสองใบ… ถ้า{player}ไปกับผมทุกบ้าน ผมจะยืนข้างหลังแล้วพูดว่า ‘ครับ’ ทุกครั้ง ผมทำได้ ผมจะเริ่มจากบ้านที่ไม่มีคนป่วย"
    reward: { heart: 2, set_flag: ball_q4_done, line: { from: ball, text: "ใครยังมีใบเสร็จค่าซ่อมจากอู่บอล/สมพงษ์การช่างค้างอยู่ ไม่ต้องอาย มาคุยกันครับ ผ่อนได้ ไม่มีดอก ไม่มีสติกเกอร์" } }

  - id: ball_q5
    npc: ball
    title: "รถเมล์หกโมงเช้า"
    desc: "เช้าวันจันทร์ บอลถือกระเป๋าไปยืนที่ป้ายรถเมล์ ทางเลือกสุดท้ายของเขา"
    start: { flag: ball_q4_done, heart_min: 7, day_min: 20 }
    offer:
      npc: "…{player} วันจันทร์นี้ผมจะไปยืนที่ป้ายรถเมล์หกโมงเช้า กระเป๋าผมจัดแล้ว ผมยังไม่รู้ว่าจะขึ้นหรือไม่ขึ้น ไปยืนกับผมได้ไหมครับ ผมไม่อยากยืนหลังเสาคนเดียวอีกแล้ว"
      options:
        - text: "{p}จะไป ไม่ว่าพี่จะขึ้นหรือไม่ขึ้น"
          accept: true
          heart: 2
          reply: "…ไม่ว่าจะขึ้นหรือไม่ขึ้น ผมจะจำประโยคนี้ไปตลอด ไม่ว่าผมจะอยู่ที่ไหน"
        - text: "ก่อนไป {p}ขอสมัครสมาชิกอู่เป็นคนแรกก่อน"
          accept: true
          heart: 2
          reply: "สมาชิกคนแรก… ผมยังไม่ได้ตัดสินใจเลยนะครับ ถ้าผมไปแล้วสมาชิกคนแรกจะว่ายังไง… เอาไว้ก่อน รับไว้ก่อน ผมจะให้บัตรสมาชิกเขียนด้วยมือ"
        - text: "เรื่องนี้พี่ต้องเลือกเองคนเดียว"
          heart: 0
          reply: "…ครับ ผมรู้ ผมแค่ไม่อยากยืนคนเดียว ไม่ใช่ไม่อยากเลือกคนเดียว… ไม่เป็นไรครับ"
    steps:
      - goal: { type: pay, npc: ball, n: 300 }
        hint: "จ่ายค่าสมาชิกอู่ล่วงหน้า 3 เดือน (300 บาท) ให้บอล เป็นสมาชิกคนแรก"
        done:
          npc: "บัตรสมาชิกเลขที่หนึ่ง… ผมเขียนชื่อ{player}ด้วยปากกาเคมี ลายมือผมไม่สวย ตัว ล ผมเขียนเหมือนประแจ ผมจะเก็บเงินนี้ไว้ในซองแยก ไม่ว่าวันจันทร์จะเป็นยังไง เงินนี้ใช้กับอู่เท่านั้น"
          options:
            - text: "ตัว ล เหมือนประแจก็เข้ากับอู่ดี"
              heart: 1
              reply: "…ครับ ผมจะทำบัตรทุกใบแบบนี้ ถ้ามีใบที่สอง"
            - text: "เลขที่หนึ่ง {p}จะรักษาไว้อย่างดี"
              heart: 2
              reply: "เลขที่หนึ่งของลุงสมหมายคือรางวัลที่หนึ่ง เลขที่หนึ่งของผมคือ{player}… ผมไม่ได้หมายความแบบนั้น… ก็หมายความครับ ช่างเถอะ"
      - goal: { type: visit, place: bus_stop, from: "06:00", to: "06:30" }
        hint: "เช้าวันที่บอลนัด ไปที่ป้ายรถเมล์ก่อนรถเมล์หกโมงออก"
        done:
          npc: "(บอลยืนข้างเสาป้าย กระเป๋าใบใหญ่วางที่เท้า เจ้าเขียวจอดแล้ว ลุงเชิดตะโกน ‘ขึ้นๆ ออกแล้วนะ’ นกนั่งเบาะที่สามมองออกมาทางหน้าต่าง) …{player} ผมฟังเสียงเครื่องเจ้าเขียวมาทั้งชีวิต วันนี้ผมฟังไม่ออกเลยว่ามันบอกให้ผมขึ้นหรือไม่ขึ้น"
          options:
            - text: "ถ้าใจพี่ไม่อยากขึ้น พี่ไม่ต้องขึ้นก็ได้ อู่ไปต่อได้ เรามีตัวเลขแล้ว"
              heart: 2
              set_flag: ball_stays
              reply: "(รถเมล์ออกไปแล้ว บอลยังยืนอยู่ แล้วยกมือโบกให้หน้าต่างเบาะที่สาม) …เจ็ดปีผมยืนหลังเสาต้นนี้ วันนี้ผมยืนหน้าเสา ผมไม่ขึ้นครับ ไม่ใช่เพราะกลัว เพราะผมอยากได้ยินเสียงเครื่องที่ผมซ่อมสตาร์ทติดในตำบลนี้… กลับไปเปิดอู่กันครับ วันนี้อู่เปิดสาย"
            - text: "ไปเถอะพี่ ลองดูสักปี {p}ดูแลยายกับอู่ให้ เสาร์อาทิตย์กลับมาซ่อมด้วยกัน"
              heart: 2
              set_flag: ball_to_rayong
              reply: "(บอลยืนนิ่ง แล้วหยิบกระเป๋า) …ปีเดียวครับ ผมสัญญา กุญแจอู่ ผมฝากไว้… ยายจะถามว่า{player}จะมากินข้าวเมื่อไหร่ บอกยายว่าทุกวันเลยนะครับ (บอลขึ้นรถ นั่งเบาะที่สี่ หลังนก ทั้งสองคนหันมาโบกมือพร้อมกัน)"
            - text: "{p}จะไม่พูดอะไร พี่เลือกเอง"
              heart: 1
              reply: "…ครับ ขอบคุณที่ไม่พูด (ลุงเชิดบีบแตรรอบที่สอง บอลมองมือตัวเองนาน แล้วยื่นมือมา) ขอประแจเบอร์สิบสองในกระเป๋าเสื้อคุณหน่อยครับ ผมเห็นตั้งแต่มาถึง… หรือจะไหว้ลาผมก็ได้ แล้วแต่"
              next:
                - text: "(ยื่นประแจเบอร์สิบสองให้)"
                  heart: 2
                  set_flag: ball_stays
                  reply: "(บอลรับประแจ แล้ววางกระเป๋าลง รถเมล์ออกไป) …ถูกเบอร์ด้วย ผมประทับใจนะครับ กลับไปเปิดอู่กัน ประแจนี้ต้องมีที่แขวน"
                - text: "(ยกมือไหว้ลาแล้วยิ้ม)"
                  heart: 1
                  set_flag: ball_to_rayong
                  reply: "(บอลรับไหว้ แล้วหยิบกระเป๋าขึ้นรถ) …ปีเดียวครับ ฝากอู่ ฝากยาย เสาร์นี้ผมกลับมา ผมจะฟังเสียงมอไซค์{player}ได้ตั้งแต่ลงรถ"
    reward: { heart: 3, set_flag: ball_romance_open, line: { from: ball, text: "อู่บอลการช่าง (สมพงษ์การช่าง) ยังเปิดครับ สมาชิกเลขที่หนึ่งมีแล้ว รับสมัครเลขที่สองครับ" } }
