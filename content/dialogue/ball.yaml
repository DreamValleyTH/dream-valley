  - id: ball_n_rayong
    topic: news
    npc: "เพื่อนที่ระยองโทรมาอีกแล้ว บอกว่าโรงงานรับเพิ่มอีกยี่สิบตำแหน่ง ปิดรับสิ้นเดือน มีหอพักให้ มีรถรับส่ง มีโอทีเยอะ… เขาพูดคำว่า ‘มี’ ไปสิบเจ็ดครั้ง"
