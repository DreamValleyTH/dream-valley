# บอล ♥ (ช่างซ่อมรถ อู่ ‘บอลการช่าง’) — convos + quests (เรื่องรอง: ค่าซ่อมที่ค้าง แม่แรงของพ่อ ใบสมัครระยอง)
convos:
  # ===== react =====
  - id: ball_r_meet
    topic: react
    once: true
    when: { not_flag: met_ball }
    npc: "…ครับ มีอะไรเสีย ไม่มีเหรอ… เดินมาเสียงรองเท้าซ้ายลากนิดนึงนะครับ พื้นรองเท้าสึกด้านนอก เดินเยอะ ไม่ใช่คนกรุงเทพฯ แบบที่ป้าแต๋วเล่าแล้ว"
    set_flag: met_ball
    options:
      - text: "พี่ฟังเสียงรองเท้าก็รู้เลยเหรอ{kq}"
        heart: 1
        reply: "ฟังเสียงก็รู้… อะไรที่วิ่งได้ผมฟังได้หมด รถ คน หมา หมาวัดขาหลังขวาเจ็บ ผมฟังมาสองอาทิตย์แล้ว ยังไม่มีใครเชื่อ"
        next:
          - text: "แล้วพี่ซ่อมหมาให้ไหม{kq}"
            heart: 2
            reply: "…ผมทาน้ำมันเหลืองให้มันไปแล้ว มันเลียออกหมด หมามันไม่ฟังช่าง… เดี๋ยวดูให้อีกที ไม่คิดเงินมันหรอก มันไม่มีเงิน"
          - text: "{p}ชื่อ{player}{k} ฝากตัวด้วย"
            heart: 1
            reply: "บอลครับ อู่บอลการช่าง… ป้ายยังเขียนว่าสมพงษ์การช่าง ชื่อพ่อผม ผมยังไม่ได้ทาสีใหม่ เรียกอะไรก็ได้ครับ ผมหันทั้งสองชื่อ"
      - text: "พี่บอลใช่ไหม{kq} ป้าแต๋วเล่าถึง"
        heart: 1
        reply: "ป้าแต๋วเล่าเรื่องระยองใช่ไหม… ทั้งตำบลรู้เรื่องผมก่อนผมตัดสินใจอีก ช่างเถอะครับ มอไซค์ที่บ้านยายยังสตาร์ทติดไหม เดี๋ยวผมไปดูให้"
      - text: "รองเท้าสึกเพราะเดินในห้าง{k}"
        heart: 0
        reply: "ห้างไม่ได้ทำให้สึกแบบนี้ครับ แบบนี้เดินบนลูกรัง… เอาเถอะ แล้วแต่จะเล่าครับ"

  - id: ball_r_thana
    topic: react
    once: true
    when: { flag: story_thana_visit }
    npc: "รถเก๋งขาวคุณธนาผ่านอู่ไปบ้านยาย{player}เมื่อวาน ผมได้ยินเสียง ยางหน้าซ้ายสึกเบี้ยว ช่วงล่างเอียง คนขับเลี้ยวซ้ายบ่อย… วิ่งไปหาที่ดินคนอื่นบ่อย ผมเดานะ"
    options:
      - text: "พี่ฟังเสียงรถแล้วรู้นิสัยคนขับเลยเหรอ{kq}"
        heart: 1
        reply: "รู้ครับ รถมันเล่าทุกอย่าง รถครูเต้ยเบรกเบาๆ ใจเย็น รถเสี่ยเฮงเบรกกระชากทุกป้าย รถคุณธนาไม่เคยเบรกเลย ขับมาถึงก็จอด ไม่เคยลังเล"
        next:
          - text: "แปลว่าเขามั่นใจมาก"
            heart: 1
            reply: "แปลว่าเขาไม่เคยต้องหยุดให้ใคร… ระวังด้วยนะครับ คนไม่เคยเบรก ชนอะไรก็ไม่รู้ตัว"
          - text: "พี่ไม่ซ่อมรถให้เขาเหรอ{kq}"
            heart: 0
            reply: "เขาไม่เคยมา รถเขาเข้าศูนย์ในเมือง ใบเสร็จสวย ผมก็ไม่ได้อยากซ่อมครับ ผมซ่อมให้คนที่จะอยู่ที่นี่"
      - text: "เขาเสนอซื้อที่ยาย{k}"
        heart: 1
        reply: "ยาย{player}เคยไล่เขาสามรอบ รอบสุดท้ายยายถือจอบ ผมยังเป็นคนลับจอบให้ยายเลย… ไม่ได้ลับเพื่อไล่ใครนะ ยายบอกว่าจะถางหญ้า"

  - id: ball_r_result_road
    topic: react
    once: true
    when: { flag: meeting1_result_road }
    npc: "ถนนชนะ… ผมควรดีใจ งานเปลี่ยนโช้คจะลดลง แต่ได้ข่าวว่าครึ่งงบไปศึกษาความเป็นไปได้ อีกครึ่งเป็นผู้รับเหมาญาตินายกฯ ผมว่าโช้คยังต้องเปลี่ยนเหมือนเดิมครับ"
    options:
      - text: "พี่ไม่เชื่อว่าถนนจะดีเหรอ{kq}"
        heart: 1
        reply: "ผมเปลี่ยนโช้คให้รถผู้รับเหมาเจ้านี้ทุกปี เขาลงยางมะตอยบางจนรถเขาเองยังกระเด้ง… ปีหน้าก่อนเลือกตั้งเขาจะมาซ่อมอีก วนแบบนี้ ผมไม่ได้ใจร้าย ผมแค่จำได้"
        next:
          - text: "แบบนี้ต้องมีคนตรวจงาน"
            heart: 2
            reply: "ตรวจได้นะครับ ผมช่วยวัดความหนายางมะตอยได้ ใช้เวอร์เนียร์ในอู่… ถ้า{player}ไปกับเมย์ ผมให้ยืม ไม่คิดค่าเช่า"
          - text: "ก็ยังดีกว่าไม่มีถนน"
            heart: 0
            reply: "ดีกว่าครับ… ถนนบางๆ ก็ยังเป็นถนน เหมือนอู่ผม พังๆ ก็ยังเป็นอู่"
      - text: "พี่โหวตอะไร{kq}"
        heart: 1
        reply: "ระบบน้ำครับ ปั๊มชาวบ้านพังเพราะดูดลม ผมซ่อมฟรีจนอะไหล่หมดสต็อก ถนนผมซ่อมไม่ได้ น้ำผมก็ซ่อมไม่ได้ แต่น้ำมันเจ็บกว่า"

  - id: ball_r_welldry
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "สามวันนี้ปั๊มน้ำเข้าอู่สิบสองตัว ทุกตัวอาการเดียวกัน ดูดลม มอเตอร์ร้อน ไม่ใช่ปั๊มเสีย… น้ำมันหายไปจากใต้ดิน ผมเปลี่ยนซีลให้ ก็ได้แค่ให้มันดูดลมได้นานขึ้น"
    options:
      - text: "พี่คิดเงินชาวบ้านไหม{kq}"
        heart: 1
        reply: "ไม่คิดครับ ผมจะคิดค่าอะไร ค่าซ่อมปั๊มที่ไม่ได้เสียเหรอ… ซีลผมก็ซื้อเงินเชื่อเสี่ยเฮงมา หนี้ผมโตขึ้นเพราะน้ำในดินหาย ตลกดีครับ"
        next:
          - text: "พี่ช่วยคนอื่นแล้วตัวเองลำบาก"
            heart: 2
            reply: "พ่อผมทำแบบนี้ ผมก็ทำแบบนี้ อู่เราจนมาสองรุ่นแล้ว… แต่ไม่มีใครในตำบลต้องหาบน้ำเพราะปั๊มพัง ผมนับแบบนั้นแทน"
          - text: "ไปบอก อบต. ว่าปั๊มพังเพราะอะไร"
            heart: 1
            reply: "ผมเขียนรายการไปให้ปาล์มแล้ว สิบสองบ้าน วันที่ อาการ ปาล์มบอกว่าเป็นข้อมูลดีที่สุดที่เคยได้จากช่าง… ช่างคนเดียวที่ยังอยู่ในตำบล"
      - text: "ยาย{p}มีปั๊มเก่าตัวนึง ช่วยดูหน่อยได้ไหม{kq}"
        heart: 1
        reply: "เดี๋ยวดูให้ ปั๊มยาย{player}รุ่นเก่า ทนกว่ารุ่นใหม่ แต่ทนแค่ไหนก็ดูดน้ำที่ไม่มีไม่ได้ครับ"

  - id: ball_r_may
    topic: react
    once: true
    when: { flag: story_may_evidence }
    npc: "เมื่อคืนสามทุ่มกว่า เมย์เข็นรถมาเคาะอู่ ยางแบนสองเส้น ไม่ได้ตำตะปูนะครับ ปล่อยลม จุ๊บถูกขันออก… มีคนตั้งใจ ผมไม่ได้บอกเมย์ ผมเห็นหน้าเธอแล้วไม่อยากบอก"
    options:
      - text: "ต้องบอกพี่เมย์นะ{kq} เธอต้องระวัง"
        heart: 2
        reply: "…ครับ ผมจะบอก พร้อมเปลี่ยนจุ๊บกันขโมยให้ ต้องใช้ประแจพิเศษถึงจะขันออก ผมจะซ่อนประแจไว้ที่อู่ ใครอยากปล่อยลมเมย์ต้องผ่านผมก่อน"
        next:
          - text: "พี่บอลเท่มาก"
            heart: 1
            reply: "ไม่เท่ครับ จุ๊บละสามสิบบาท… แต่ถ้าเท่ก็ขอบคุณครับ"
          - text: "แจ้งดาบเสถียรด้วยไหม"
            heart: 0
            reply: "แจ้งแล้ว ดาบบอกว่า ‘ยางมันแบนเองได้นะบอล อากาศร้อน’ แล้วก็หลับต่อที่ร้านป้าแต๋ว ผมเลยไม่แจ้งอีก ผมแจ้งจุ๊บแทน"
      - text: "พี่ไม่กลัวเหรอ{kq}"
        heart: 1
        reply: "กลัวครับ ผมมียายคนเดียว… แต่ถ้าผมไม่ซ่อมรถให้เมย์ เมย์ต้องเดินกลับตอนดึก แบบนั้นผมกลัวกว่า"

  - id: ball_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "คุณธนาประกาศรับช่างประจำบริษัท เงินเดือนเท่าระยอง ใกล้บ้าน ได้นอนบ้านยายทุกคืน… หน้าที่คือดูแลปั๊มสิบสองนิ้วที่ดูดบ่อยายผม ตลกที่สุดในปีนี้ครับ"
    options:
      - text: "พี่จะรับไหม{kq}"
        heart: 0
        reply: "ไม่รู้ครับ… ทุกคนคิดว่าผมควรปฏิเสธทันที แต่หนี้เครื่องมือพ่อยังเหลือแปดหมื่น ยายเก้าสิบแล้ว ผมไม่ได้มีความกล้าเหลือเยอะขนาดนั้น"
        next:
          - text: "ไม่ว่าพี่เลือกอะไร {p}ไม่ตัดสินพี่"
            heart: 2
            reply: "…ผมรู้สึกเหมือนเครื่องที่เพิ่งได้คลายน็อตตัวที่ขันแน่นเกิน ขอบคุณครับ ผมยังไม่เลือกวันนี้ แต่ผมหายใจได้แล้ว"
          - text: "อย่ารับเลย มันคือปั๊มที่ดูดบ่อยายพี่"
            heart: 0
            reply: "ผมรู้ครับ… ผมรู้ดีที่สุดในตำบล ผมแค่ยังไม่รู้ว่าความรู้มันจ่ายหนี้ได้ไหม"
      - text: "ถังน้ำ CSR ล่ะ ได้ไหม{kq}"
        heart: 1
        reply: "ได้สามใบ ผมเจาะรูทำเป็นกระถางให้ยายปลูกพริก… ใช้งานได้ดีกว่าที่บริษัทตั้งใจไว้ครับ"

  - id: ball_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "รถแห่หาเสียงเข้าอู่ผมสามคันแล้ว ทุกค่าย เครื่องเสียงพังเพราะเปิดดังเกิน ผมรู้ว่าใครเปิดเพลงอะไร ใครพูดอะไรตอนไมค์ยังไม่ปิด… ผมเป็นช่างที่รู้ความลับการเมืองมากที่สุดในอำเภอครับ"
    options:
      - text: "ได้ยินอะไรบ้าง{kq}"
        heart: 1
        reply: "ได้ยินว่าเบอร์สองเรียกชาวบ้านว่า ‘ฐานเสียง’ ตอนไมค์ยังเปิด… ผมเลยซ่อมไมค์เขาช้าลงนิดนึง ไม่ได้แกล้งนะครับ ผมมือช้าเฉพาะตอนได้ยินอะไรแบบนั้น"
        next:
          - text: "พี่ควรเล่าให้พี่เมย์ฟัง"
            heart: 1
            reply: "เมย์จะเอาไปพาดหัว ‘ช่างตำบลเผย ไมค์ไม่ปิด’ แล้วอู่ผมจะไม่มีรถแห่มาซ่อมอีก… ซึ่งก็ดี เสียงดังมาก"
          - text: "เก็บไว้ดีกว่า เดี๋ยวพี่โดนหมายหัว"
            heart: 0
            reply: "ครับ ช่างต้องปากหนัก ผมพูดน้อยอยู่แล้ว ปากหนักเป็นของแถม"
      - text: "มีคนมาให้ซองพี่ไหม{kq}"
        heart: 1
        reply: "มา ผมบอกว่าจ่ายค่าซ่อมรถแห่ที่ค้างก่อนเถอะ คนถือซองเดินหนีเลยครับ วิธีไล่คนแจกซองที่ได้ผลที่สุด คือทวงหนี้"

  - id: ball_r_nok_truth
    topic: react
    once: true
    when: { flag: nok_told_truth }
    npc: "เมื่อคืนผมนอนไม่หลับ ฟังที่นกเล่าวนในหัว มือชา หักเงิน หอไม่มีหน้าต่าง… ยี่สิบปีนกเล่าทุกเรื่อง ยกเว้นเรื่องที่มันเจ็บที่สุด"
    options:
      - text: "นกไม่อยากให้พี่ห่วง"
        heart: 1
        reply: "ผมรู้ครับ แต่การไม่รู้มันแย่กว่า… ผมโกรธนกที่ไปก่อนตั้งสองปี ผมไม่รู้เลยว่าตอนนั้นนกร้องไห้ในห้องน้ำโรงงาน ผมโกรธคนที่กำลังเจ็บ"
        next:
          - text: "ตอนนี้พี่รู้แล้ว ยังไม่สาย"
            heart: 2
            reply: "…ผมจะเปลี่ยนน้ำมันเครื่องให้มอไซค์นกทุกเดือนเหมือนเดิม แต่ผมจะบอกนกด้วยว่าผมทำ ทำเงียบๆ มาเจ็ดปี มันไม่ได้ช่วยให้ใครรู้สึกดีขึ้นเลย"
          - text: "ฟังแล้วพี่ยังอยากไประยองไหม{kq}"
            heart: 1
            reply: "ยังไม่รู้ครับ แต่ตอนนี้ผมรู้ว่ากำลังเลือกอะไร ก่อนหน้านี้ผมเลือกจากภาพเงินเดือนสามเท่า ตอนนี้ผมเห็นหอที่ไม่มีหน้าต่างด้วย"
      - text: "พี่ก็ไม่เคยเล่าเรื่องแม่แรงให้นกฟังเหมือนกันนะ"
        heart: 1
        reply: "…จริงครับ เราสองคนเก็บเรื่องที่เจ็บที่สุดไว้คนละเรื่อง แล้วคุยกันแต่เรื่องยาง ยี่สิบปี… เสาร์นี้ผมจะเล่า ถ้าผมเริ่มประโยคได้"

  - id: ball_r_nok_begged
    topic: react
    once: true
    when: { flag: nok_begged_stay }
    npc: "นกขอให้ผมอยู่… ยี่สิบปีนกไม่เคยขออะไรผมเลย นอกจากสูบลมยาง ผมควรดีใจใช่ไหมครับ แต่ทำไมมันหนักเหมือนยกเครื่องคนเดียว"
    options:
      - text: "เพราะพี่กลัวว่าจะอยู่เพราะนก ไม่ใช่เพราะพี่เลือกเอง"
        heart: 2
        reply: "…ใช่ครับ ถ้าผมอยู่แล้วอู่เจ๊ง ผมจะโทษนก ผมไม่อยากเป็นคนแบบนั้น… {player}มองผมออกเร็วกว่าที่ผมมองตัวเองอีก"
        next:
          - text: "ลองหาเหตุผลของพี่เองดู"
            heart: 2
            reply: "เหตุผลของผมเอง… ยาย อู่พ่อ เสียงเครื่องยนต์ทุกคันในตำบล แล้วก็… ช่างเถอะครับ ข้อสุดท้ายผมยังไม่พูด"
          - text: "นกขอเพราะนกรักบ้านนี้"
            heart: 1
            reply: "ผมรู้ นกรักบ้านมากจนต้องไปทำงานไกลบ้าน… ผมเข้าใจนกมากขึ้นทุกวัน แต่ไม่ได้ทำให้ผมตัดสินใจง่ายขึ้นเลย"
      - text: "งั้นก็อยู่สิ ง่ายจะตาย"
        heart: -1
        reply: "ไม่มีอะไรง่ายครับ ถ้าง่ายผมเลือกไปแล้วตั้งแต่สองปีก่อน"

  - id: ball_r_nok_go
