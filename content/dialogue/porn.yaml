# ป้าพร — convos + quests (เรื่องรอง: ช่างเย็บผ้าที่บ่อแห้ง กับออเดอร์เสื้อบริษัท)
convos:
  # ===== react =====
  - id: porn_r_meet
    topic: react
    once: true
    when: { not_flag: met_porn }
    npc: "หยุดก่อนจ้ะ ยืนตรงๆ… ไหล่กว้างกว่าที่แต๋วเล่า แต๋วบอกหลานผอมเหมือนไม้ค้ำต้นพริก ป้าว่าไม้ไผ่ ใหญ่กว่านิดนึง"
    set_flag: met_porn
    options:
      - text: "ป้าวัดตัว{p}ทำไม{kq}"
        heart: 1
        reply: "ป้าช่างเย็บผ้า เห็นใครก็วัดตัวในใจหมด ตาแก่บ้านป้าเห็นใครก็ดูเลขเสื้อ ผัวเมียคู่นี้ไม่มีใครดูหน้าคนเลย"
        next:
          - text: "งั้นตัดเสื้อให้{p}สักตัวได้ไหม{kq}"
            heart: 2
            reply: "ได้สิ แขนยาวผ้าฝ้ายไว้ทำงาน คนใหม่ลดให้ห้าสิบ… ลดเพราะหน้าเหมือนยายนะ ไม่ได้ลดเพราะใจดี"
          - text: "ป้าคือป้าพรเพื่อนป้าแต๋วใช่ไหม{kq}"
            heart: 1
            reply: "เพื่อนเหรอ… ก็เรียกงั้นก็ได้ เรียกศัตรูที่กินข้าวด้วยกันทุกวันก็ได้ แล้วแต่วัน"
      - text: "ป้าแต๋วเล่าเรื่อง{p}ด้วยเหรอ{kq}"
        heart: 1
        reply: "เล่าตั้งแต่หลานลงรถเมล์ เล่าว่าหลานขโมยเยลลี่ตอนเด็ก ป้าบอกว่าแต๋วนั่นแหละแอบยัดใส่มือหลาน ป้าเห็น ป้ายืนอยู่ตรงนั้น"
      - text: "สวัสดี{k}ป้า"
        heart: 0
        reply: "สวัสดีจ้ะ ไหว้สวยเหมือนยาย ไปไหนก็ไปเถอะ แต่อย่าเดินผ่านแผงเจ๊หงษ์บ่อยนะ เดี๋ยวติดนิสัยตาแก่"

  - id: porn_r_kept
    topic: react
    once: true
    when: { flag: kept_for_taew }
    npc: "แต๋วมาอวดป้าตั้งแต่เช้าว่าหลานเก็บพริกไว้ขายให้แต๋ว ไม่ขายรถกระบะ อวดเหมือนลูกได้ทุนเรียนต่อ ป้าฟังจนข้าวต้มเย็น"
    options:
      - text: "ป้าว่า{p}โง่เหรอ{kq} ป้าแต๋วเล่าว่าป้าพูดงั้น"
        heart: 1
        reply: "ป้าพูดว่า ‘โง่แบบยายเพียร’ แต๋วตัดครึ่งหลังทิ้ง แต๋วตัดต่อข่าวเก่งกว่าช่างตัดต่อในทีวีอีก"
        next:
          - text: "โง่แบบยายเพียรเป็นยังไง{kq}"
            heart: 2
            reply: "โง่แบบที่เห็นแก่คนอื่นจนตัวเองขาดทุน ยายเพียรโง่แบบนี้มาทั้งชีวิต ป้าด่ายายทุกครั้ง แล้วก็แอบนับถือทุกครั้ง"
          - text: "ป้าก็รู้ว่าป้าแต๋วตัดต่อ ยังเถียงอีก"
            heart: 1
            reply: "เถียงสิ ถ้าไม่เถียงแต๋วจะเหงา คนเราต้องมีคนให้เถียงด้วยนะหลาน ตาแก่ไม่เถียงป้า ป้าเลยต้องไปเถียงแต๋ว"
      - text: "รอบหน้า{p}ขายให้ป้าบ้างก็ได้{k}"
        heart: 1
        reply: "ป้าไม่ได้ขายพริก ป้าซื้ออย่างเดียว… ได้ ป้าจะซื้อแพงกว่าแต๋วบาทนึง ให้แต๋วมันหน้าเขียว"

  - id: porn_r_haggled
    topic: react
    once: true
    when: { flag: thana_haggled }
    npc: "หลานถามคุณธนาว่าให้เพิ่มได้ไหมเหรอ ป้าได้ยินจากลุงเชิด… ไม่ได้ว่านะ ป้าแค่อยากรู้ว่าเขาให้เพิ่มเท่าไหร่ ป้าจะได้คำนวณเป็นค่าหวยตาแก่"
    options:
      - text: "{p}แค่ลองถามดู{k} ยังไม่ขาย"
        heart: 1
        reply: "ถามได้ ราคาก็ต้องรู้ไว้ แต่ป้าบอกอย่างนึง ราคาที่ดินมันขึ้นได้ ราคาบ่อแห้งมันขึ้นไม่ได้นะหลาน"
        next:
          - text: "หมายความว่าไง{kq}ป้า"
            heart: 1
            reply: "ตอนนี้เขาอยากได้ เขาให้แพง พอบ่อทั้งตำบลแห้ง ที่ทุกแปลงจะถูกลงเอง แล้วเขาจะมาซื้อทีหลัง ป้าเย็บผ้าขายมาสี่สิบปี เล่ห์แบบนี้ป้ารู้"
          - text: "ป้าคิดเยอะไปหรือเปล่า{kq}"
            heart: 0
            reply: "คนคุมเงินบ้านต้องคิดเยอะจ้ะ ตาแก่คิดน้อย ป้าก็ต้องคิดเผื่อสองคน"
      - text: "ล้านสองเท่ากับหวยกี่ใบ{kq}ป้า"
        heart: 1
        reply: "หมื่นสองพันใบ ตาแก่ซื้อมาสามสิบปีได้สักห้าพันใบ ยังไม่ถึงครึ่ง ป้าคิดแล้วโล่งใจ ยังมีอะไรใหญ่กว่าหนี้หวยตาแก่"

  - id: porn_r_result_road
    topic: react
    once: true
    when: { flag: meeting1_result_road }
    npc: "ถนนลาดยางชนะจ้ะ… แต่งบครึ่งนึงไปเป็น ‘ศึกษาความเป็นไปได้’ ป้าเพิ่งรู้ว่าความเป็นไปได้มันแพงกว่ายางมะตอย"
    options:
      - text: "ศึกษาอะไรตั้งเจ็ดแสน{kq}"
        heart: 1
        reply: "ศึกษาว่าถนนเป็นไปได้ไหม คำตอบคือเป็นไปได้ ป้าตอบให้ฟรีตอนนี้เลย เอาเงินคืนมาให้ป้าก็ได้"
        next:
          - text: "ป้าไปเป็นที่ปรึกษา อบต. เลยสิ{kq}"
            heart: 2
            reply: "ป้าไปแล้วใครจะเย็บผ้า ป้าคิดค่าที่ปรึกษาเป็นผ้าถุงคนละผืน ถูกกว่าบริษัทที่ปรึกษาตั้งเยอะ"
          - text: "ครึ่งที่เหลือพอทำถนนไหม{kq}"
            heart: 1
            reply: "พอทำถึงหน้าบ้านญาตินายกฯ จ้ะ แล้วก็หมด ป้าไม่ได้พูดเอง แต๋วพูด ป้าแค่ทวนให้ชัด"
      - text: "ก็ยังดีที่ได้ถนน{k}"
        heart: 0
        reply: "ดีจ้ะ ตาแก่จะได้ขี่มอไซค์ไปแผงเจ๊หงษ์เร็วขึ้น ทุกอย่างมันมีข้อเสีย"
      - text: "ป้าโหวตอะไร{kq}"
        heart: 1
        reply: "ป้าโหวตระบบน้ำ ตาแก่ก็น้ำ เป็นครั้งแรกในสี่สิบปีที่เราเห็นตรงกัน แล้วก็แพ้พร้อมกันด้วย โรแมนติกจริงๆ"

  - id: porn_r_welldry
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "บ่อแห้งแล้วหลาน ผ้าลูกค้าที่ต้องซักก่อนตัด ป้ากองไว้สามกอง ซักไม่ได้ ตัดก็ไม่ได้ ป้านั่งมองผ้ามาสองวันแล้ว"
    options:
      - text: "เอาผ้ามาซักบ้าน{p}ก็ได้นะ{kq}"
        heart: 2
        reply: "จริงนะหลาน… ป้าจะเอาไปตอนเช้าๆ แล้วปะเสื้อให้หลานทุกตัวที่ขาด ห้ามเถียง ป้าไม่ชอบเป็นหนี้ใคร"
        next:
          - text: "ไม่ต้องหรอก{k}ป้า"
            heart: 1
            reply: "ต้อง! หนี้น้ำใจนี่ป้าใช้คืนเร็วกว่าหนี้ธนาคารอีก ตาแก่ต่างหากที่ไม่ชอบใช้"
          - text: "เอาเสื้อตัวนี้ก่อนเลย{k} ขาดตรงศอก"
            heart: 1
            reply: "ถอดมาเลย… ขาดแบบนี้ไปเกี่ยวตะปูมาใช่ไหม บ้านยายมีตะปูโผล่ตรงประตูครัว ป้าเกี่ยวมาสิบปีแล้ว"
      - text: "ลุงว่าไงบ้าง{kq}"
        heart: 1
        reply: "ตาแก่เงียบ ตาแก่เงียบแปลว่าเครียด ป้าเลยต้องพูดแทนสองคน… ตาแก่บอกจะขุดบ่อลึก ป้ายังไม่ได้บอกว่าเงินขุดบ่ออยู่ไหน"
      - text: "คงเพราะหน้าแล้ง{k}"
        heart: -1
        reply: "หน้าแล้งปีไหนก็ไม่แห้งแบบนี้จ้ะ ป้าอยู่มาหกสิบปี บ่อป้าแห้งครั้งแรกก็ปีที่มีปั๊มใหญ่ข้างคลอง ป้าไม่ได้โง่"

  - id: porn_r_may
    topic: react
    once: true
    when: { flag: helped_may }
    npc: "หลาน! แต๋วบอกว่าหลานออกไปถ่ายรูปท่อบริษัทกลางคืนกับเมย์ หลานรู้ไหมว่าข้างนอกสามทุ่มมีอะไร ผีก็มี คนของบริษัทก็มี"
    options:
      - text: "ไม่เป็นไร{k}ป้า ระวังตัวแล้ว"
        heart: 1
        reply: "ไม่เป็นไรของหลานคือป้านอนไม่หลับทั้งคืนนะ… ได้รูปไหม ชัดไหม ถ้าไม่ชัดป้าโกรธสองเท่า"
        next:
          - text: "ชัด{k} เห็นท่อลงคลองเลย"
            heart: 2
            reply: "ดี… ดีมาก ป้าจะเย็บถุงผ้าให้เมย์ใส่กล้อง ถุงหนาๆ ตกน้ำไม่เปียก แต่หลานห้ามไปอีก ได้ยินไหม"
          - text: "ไม่ค่อยชัดเลย{k}"
            heart: 0
            reply: "เสี่ยงตายได้รูปเบลอ… เหมือนตาแก่ซื้อหวยเลย หลานกลับบ้านเลย ป้าต้มข้าวต้มไว้ให้แล้ว"
      - text: "ต้องมีคนทำ{k}"
        heart: 1
        reply: "ต้องมีคนทำ แต่ไม่ต้องเป็นหลานทุกเรื่อง… ยายเพียรก็พูดประโยคนี้ ป้าด่ายายด้วยประโยคเดียวกันนี่แหละ"

  - id: porn_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ถังน้ำ CSR ที่ตาแก่หอบมา ป้าเย็บผ้าคลุมทับโลโก้แล้ว ลายดอกพิกุล ตอนนี้มันเป็นถังของป้า ไม่ใช่ถังของบริษัท"
    options:
      - text: "ป้าเย็บคลุมโลโก้ทำไม{kq}"
        heart: 1
        reply: "ป้าไม่อยากเห็นทุกเช้า เขาเอาน้ำป้าไปแล้วยังจะให้ป้าโฆษณาให้อีก เสื้อทุกตัวที่ป้าเย็บยังไม่มียี่ห้อป้าเลย"
        next:
          - text: "ป้ารับเย็บคลุมถังให้คนอื่นด้วยไหม{kq}"
            heart: 2
            reply: "หลานนี่หัวการค้า… ใบละยี่สิบ ทั้งหมู่สี่มีห้าสิบถัง ได้พันนึง พอซื้อน้ำได้ห้าสิบถัง วนกลับมาที่บริษัทอีก ป้าเวียนหัว"
          - text: "ลายดอกพิกุลสวยดี{k}"
            heart: 1
            reply: "สวยกว่าโลโก้ใบไม้สีเขียวของเขาเยอะ ใบไม้อะไรไม่รู้ ต้นไม้แถวนี้ไม่มีใบแบบนั้นสักต้น"
      - text: "อย่างน้อยก็ได้ถังฟรี{k}"
        heart: 0
        reply: "ฟรีจ้ะ ถังฟรี น้ำไม่ฟรี บ่อไม่ฟรี ฟรีแค่ส่วนที่ไม่มีประโยชน์"

  - id: porn_r_sommai_bank
    topic: react
    once: true
    when: { flag: sommai_end_bank }
    npc: "หลาน ตาแก่เอาสมุดบัญชีมาวางบนจักรป้า หน้าแรกเขียนว่า ‘ออมแทนหวย’ ลายมือไก่เขี่ย ป้านั่งดูจนลืมเย็บผ้า"
    options:
      - text: "ป้าดีใจไหม{kq}"
        heart: 1
        reply: "ดีใจ… แต่ไม่บอกแกหรอก บอกแล้วแกจะได้ใจ ป้าทำลาบหมูให้ แกคงเข้าใจเอง ถ้าไม่เข้าใจก็ช่างแก"
        next:
          - text: "ลุงเข้าใจ{k} ลุงเล่าให้ฟังแล้ว"
            heart: 2
            reply: "แกเล่าเหรอ… ตาแก่นี่ ปากไวกว่าแต๋วอีก เอาเถอะ หลานช่วยแกเปิดกล่องใช่ไหม ป้าขอบใจนะ ป้าพูดครั้งเดียว"
          - text: "ป้าบอกลุงตรงๆ ก็ได้นะ{kq}"
            heart: 1
            reply: "สี่สิบปีป้าบอกตรงแต่เรื่องด่า เรื่องดีป้าพูดไม่เป็น… ก็ได้ ป้าจะลองพูดสักคำ คืนนี้ ตอนไฟดับ"
      - text: "ลุงจะทำได้นานแค่ไหน{kq}"
        heart: 0
        reply: "ไม่รู้จ้ะ แต่ป้าจะไปยืนหน้าแผงเจ๊หงษ์ทุกวันที่หนึ่งกับสิบหกเหมือนเดิม ไม่ใช่ไม่ไว้ใจนะ แค่ช่วยแกถือความหวังไว้"

  - id: porn_r_end_class
    topic: react
    once: true
    when: { flag: porn_end_class }
    npc: "หลาน วันเสาร์ที่ศาลามีคนมาเรียนเย็บผ้าห้าคน! น้องมิวมาด้วย ร้อยด้ายไม่เข้าสักรอบแต่หัวเราะทั้งวัน ป้าว่าป้าชอบสอนมากกว่าเย็บเองอีก"
    options:
      - text: "ป้าเป็นครูแล้วนะ{kq}"
        heart: 2
        reply: "ครูอะไร ครูเต้ยมาฟังแล้วยังให้คะแนนป้าแปดเต็มสิบ หักสองแต้มเพราะป้าดุ… ป้าว่าแปดก็สูงแล้วสำหรับคนดุ"
      - text: "ลุงไปเรียนด้วยไหม{kq}"
        heart: 1
        reply: "ไปนั่งนับว่าเข็มทิ่มนิ้วใครกี่ที ป้าเลยให้แกเป็นคนร้อยด้าย ตาแกดีกว่าป้า สี่สิบปีเพิ่งได้ใช้ตาดีๆ ของแกทำอย่างอื่นนอกจากดูเลข"
        next:
          - text: "ลุงคงภูมิใจ{k}"
            heart: 1
            reply: "ภูมิใจจนเอาไปเล่าที่อู่บอล บอลบอกว่า ‘ลุงร้อยด้ายได้แต่ร้อยหนี้ไม่เป็น’ ตาแก่ขำทั้งวัน"
          - text: "ป้าสองคนน่ารักนะ{k}"
            heart: 1
            reply: "พูดอะไรของหลาน… ไปๆ วันเสาร์หน้ามาเรียนด้วย ป้าจะสอนเย็บกระดุมให้ คนทำนาต้องเย็บกระดุมเองเป็น"

  # ===== news =====
  - id: porn_n_heng
    topic: news
    npc: "ได้ยินไหมหลาน เสี่ยเฮงจะเพิ่ม ‘ค่าธรรมเนียมจดบัญชี’ ในปุ๋ยเชื่อ ป้าถามว่าจดอะไร เสี่ยบอกว่าจดดอกเบี้ย… ต้องจ่ายค่าจดดอกเบี้ยด้วย"
    options:
      - text: "เก็บค่าจดดอกเบี้ยเนี่ยนะ{kq}"
        heart: 1
        reply: "เนี่ยแหละ ป้าว่าปีหน้าคงมีค่าธรรมเนียมยิ้ม เสี่ยยิ้มให้ทีนึงคิดห้าบาท"
        next:
          - text: "ป้าเลิกเชื่อปุ๋ยเสี่ยไปเลยสิ{kq}"
            heart: 1
            reply: "เลิกแล้ว ปีนี้ใช้ปุ๋ยหมักสหกรณ์ไอ้กล้า ตาแก่บ่นว่าเหม็น ป้าบอกเหม็นแต่ไม่มีดอกเบี้ย แกเงียบเลย"
