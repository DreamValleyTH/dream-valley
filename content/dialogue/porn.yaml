            reply: "ถามได้ แต่อย่าถามตรงๆ บอลจะเงียบเป็นเครื่องดับ ถามเรื่องรถก่อน แล้วค่อยเลี้ยวเข้าเรื่อง"

quests:
  - id: porn_q1
    npc: porn
    title: "ด้ายสองหลอด"
    desc: "ป้าพรงอนป้าแต๋ว ไม่ยอมไปซื้อด้ายที่ร้านชำเอง"
    start: { heart_min: 1, day_min: 2 }
    offer:
      npc: "หลาน ช่วยป้าหน่อย ด้ายสีขาวหมดพอดี ร้านเดียวที่มีคือร้านแต๋ว ป้ายังไม่ไปร้านแต๋วจนกว่าแต๋วจะขอโทษเรื่องที่บอกทั้งตำบลว่าป้าย้อมผมเอง"
      options:
        - text: "ได้{k} {p}ไปซื้อให้"
          accept: true
          heart: 1
          reply: "สองหลอดนะ สีขาว ห้ามเอาสีครีม แต๋วจะยัดสีครีมให้ แล้วบอกว่าขาวเหมือนกัน แต๋วตาบอดสีเฉพาะเวลาขายของ"
        - text: "ป้าย้อมผมเองจริงไหม{kq}"
          accept: true
          heart: 0
          reply: "ย้อมเองสิ! แต่ไม่ต้องบอกทั้งตำบล… ไปซื้อด้ายมาเถอะ อย่าถามเยอะ ป้าเริ่มหงุดหงิดหลานแล้ว"
        - text: "ไปคืนดีกับป้าแต๋วเองดีกว่านะ{kq}"
          heart: 0
          reply: "คืนดีก็ได้ แต่ไม่ใช่วันนี้ วันนี้ป้ายังโกรธอยู่ ความโกรธป้าต้องอยู่ครบสามวัน ไม่งั้นมันไม่คุ้ม"
    steps:
      - goal: { type: talk, npc: taew }
        hint: "ไปร้านชำป้าแต๋ว (ป้าแต๋วอาจถามว่าซื้อให้ใคร)"
        done:
          npc: "ด้ายสีขาวสองหลอด… หลาน ป้าไม่ได้พูดนะ แต่ในตำบลนี้มีคนเดียวที่ใช้ด้ายขาวหลอดละยี่สิบแบบนี้ พรใช่ไหม พรยังโกรธป้าอยู่ใช่ไหม"
          options:
            - text: "ป้าพรยังโกรธอยู่{k} ป้าขอโทษไปไหม{kq}"
              heart: 1
              set_flag: porn_q1_sorry
              reply: "ขอโทษก็ได้… ฝากบอกพรว่า ‘ผมสวยดี เหมาะกับคนอายุหกสิบ’ อย่าตัดครึ่ง บอกให้ครบ แล้วแถมด้ายครีมไปอีกหลอด บอกว่าแต๋วให้"
            - text: "{p}ซื้อใช้เอง{k}"
              heart: 0
              reply: "หลานเย็บผ้าเป็นด้วยเหรอ… ก็ได้จ้ะ ป้าเชื่อ ป้าเชื่อแบบที่ป้าเชื่อลุงสมหมายว่าซื้อหวยใบเดียว"
      - goal: { type: give, npc: porn, item: sewing_thread, n: 2 }
        hint: "เอาด้ายเย็บผ้า 2 หลอดไปให้ป้าพร"
        done:
          npc: "สีขาวจริงด้วย แต๋วไม่ยัดสีครีมมา… แปลก แต๋วฝากอะไรมาหรือเปล่า หน้าหลานเหมือนคนถือข่าว"
          options:
            - text: "ป้าแต๋วฝากบอกว่าผมป้าเหมาะกับวัยหกสิบ{k}"
              heart: 2
              set_flag: porn_q1_peace
              reply: "…เหมาะกับวัยหกสิบ หมายความว่าแก่หรือหมายความว่าสวย แต๋วนี่พูดสองแง่ตลอด… เอาเถอะ พรุ่งนี้ป้าจะเอาขนมบวชไปให้ ไม่ได้ไปง้อนะ ไปส่งขนม"
            - text: "ไม่มี{k} ป้าแต๋วไม่ได้ว่าอะไร"
              heart: 0
              reply: "ไม่ว่าอะไรเลยเหรอ… แต๋วไม่พูดคือแต๋วเสียใจ ไม่ได้การ ป้าต้องไปเองแล้ว เดี๋ยวแต๋วนอนไม่หลับ"
    sold_at: { sewing_thread: taew_shop }
    reward: { money: 60, heart: 1, items: { kluay_buat_chee: 1 }, set_flag: porn_q1_done, line: { from: porn, text: "แต๋ว พรุ่งนี้ขนมบวชชีหม้อใหญ่ ไม่ได้ทำให้ใครโดยเฉพาะนะ ใครอยากกินก็มา" } }

  - id: porn_q2
    npc: porn
    title: "กระปุกในจักร"
    desc: "ป้าพรอยากย้ายเงินเก็บลับไปไว้ที่ปลอดภัยกว่าช่องกระสวย"
    start: { flag: porn_q1_done, heart_min: 3, day_min: 5 }
    offer:
      npc: "หลาน ป้ามีเงินเก็บลับอยู่ในจักร ไว้เป็นค่าเทอมหลานสาว เมื่อคืนตาแก่ถามว่าจักรมีช่องอะไรบ้าง… ป้าว่าแกเริ่มสงสัยแล้ว ช่วยป้าหาที่เก็บใหม่หน่อย"
      options:
        - text: "ไปถามพี่กล้าเรื่องสหกรณ์ไหม{kq}"
          accept: true
          heart: 2
          reply: "ไอ้กล้าพูดเรื่องเปอร์เซ็นต์ทีไรป้าปวดหัว หลานไปถามแทนป้าก่อน แล้วค่อยมาแปลเป็นภาษาคนให้ป้าฟัง"
        - text: "{p}ช่วยได้{k} แต่ลุงอาจแค่ถามเฉยๆ นะ{kq}"
          accept: true
          heart: 1
          reply: "ตาแก่ไม่เคยถามอะไรเฉยๆ ถามเรื่องจักรแปลว่าแกขาดเงินซื้อเลข ไปเถอะ ช่วยป้าคิด"
        - text: "เก็บไว้ในจักรแหละ{k}ปลอดภัยแล้ว"
          heart: 0
          reply: "ปลอดภัยจนกว่าตาแก่จะว่างจัด ซึ่งก็คือหน้าแล้ง… เอาเถอะ ป้าเปลี่ยนไปซ่อนในกล่องกระดุมก่อน"
    steps:
      - goal: { type: talk, npc: kla }
        hint: "ไปถามกล้าที่สวนผักสหกรณ์ เรื่องการฝากเงินกับสหกรณ์"
        done:
          npc: "ป้าพรจะฝากสหกรณ์เหรอครับ ดีมากเลย ลองคิดดูนะครับ ถ้าป้าเก็บในบ้าน ดอกเบี้ยศูนย์เปอร์เซ็นต์ ฝากสหกรณ์ได้ปันผล แล้วเงินก็หมุนช่วยพี่น้องในตำบลกู้ไปซื้อปุ๋ยแทนเสี่ยเฮง… ขอโทษครับ ผมเทศน์อีกแล้ว"
          options:
            - text: "แล้วถอนยากไหม{kq}"
              heart: 1
              reply: "ถอนได้ครับ แต่ต้องเซ็นเจ้าของบัญชี ลุงสมหมายถอนแทนไม่ได้ ผมว่าอันนี้ป้าพรจะชอบที่สุด"
            - text: "ถ้าสหกรณ์เจ๊งล่ะ{kq}"
              heart: 0
              reply: "ถามดีครับ เรามีบัญชีให้สมาชิกดูทุกเดือน ติดบอร์ดที่ศาลา ใครสงสัยมาตรวจได้ ผมว่าโปร่งใสกว่า อบต. นิดนึง… ประมาณเจ็ดสิบเปอร์เซ็นต์ครับ"
      - goal: { type: visit, place: coop_garden, from: "08:00", to: "11:00" }
        hint: "ตอนเช้าไปเป็นพยานให้ป้าพรสมัครสหกรณ์ที่สวนผัก"
        done:
          npc: "ป้าเอากระปุกมาแล้ว… นับแล้วได้สามหมื่นสองพัน สิบปี ทีละยี่สิบทีละห้าสิบ หลาน ป้าจะฝากหมดเลยดีไหม หรือแบ่งไว้บ้าง"
          options:
            - text: "ฝากสหกรณ์หมดเลย{k} ลุงถอนไม่ได้"
              heart: 2
              set_flag: porn_save_coop
              reply: "หมดเลย… มือป้าสั่นนะหลาน สิบปีมันอยู่ในจักรป้า ตอนนี้มันไปอยู่ในสมุดเล่มเล็ก ไอ้กล้ายิ้มจนป้าอยากเย็บปากมันเลย"
            - text: "แบ่งครึ่ง ฝากธนาคารครึ่งนึงด้วย{k}"
              heart: 1
              set_flag: porn_save_split
              reply: "ไข่ไม่ใส่ตะกร้าใบเดียว ยายเพียรก็พูดแบบนี้… ได้ ครึ่งนี้ฝากไอ้กล้า อีกครึ่งพรุ่งนี้ไปธนาคาร ตาแก่ไม่รู้ทั้งสองที่"
    reward: { heart: 2, items: { khanom_krok: 2 }, set_flag: porn_q2_done, line: { from: porn, text: "ใครยังเก็บเงินไว้ใต้ที่นอน มาคุยกับป้า ป้าจะเล่าให้ฟังว่าใต้ที่นอนบ้านป้าเคยเจอใครแอบล้วงบ้าง 😑" } }

  - id: porn_q3
    npc: porn
    title: "เสื้อสองร้อยตัว"
    desc: "บริษัทจ้างป้าพรเย็บเสื้อพนักงาน 200 ตัว ทั้งที่บ่อป้าแห้งเพราะบริษัท"
    start: { flag: story_well_dry, heart_min: 3 }
    offer:
      npc: "หลาน… คุณธนาส่งคนมาจ้างป้าเย็บเสื้อพนักงานสองร้อยตัว ตัวละสองร้อย สี่หมื่นบาท ปักโลโก้ ‘เพื่อชุมชนยั่งยืน’ ที่อก บ่อป้าแห้งเพราะใคร ป้ายังไม่ได้ถามเลย ไปถามแทนป้าหน่อย"
      options:
        - text: "{p}ไปคุยกับคุณธนาให้{k}"
          accept: true
          heart: 1
          reply: "ไปถามเขาว่าเสื้อสองร้อยตัวต้องซักก่อนตัด ป้าไม่มีน้ำ เขาจะเอาน้ำที่ไหนให้ป้า… ถามแค่นั้นแหละ ดูหน้าเขาด้วย"
        - text: "สี่หมื่นเลยเหรอ{kq} เยอะนะ"
          accept: true
          heart: 0
          reply: "เยอะจ้ะ เท่าค่าเทอมหลานสาวป้าปีครึ่ง ป้าถึงไม่กล้าตอบเอง ไปคุยกับเขาก่อน แล้วมาช่วยป้าคิด"
        - text: "เรื่องของป้า{k} {p}ไม่ยุ่งดีกว่า"
          heart: -1
          reply: "ก็ได้จ้ะ… ป้าแค่อยากมีคนที่ไม่ใช่ตาแก่ช่วยคิด ตาแก่เสนอให้เอาสี่หมื่นไปซื้อเลขหมด ป้าเลยไม่ปรึกษาแกแล้ว"
    steps:
      - goal: { type: visit, place: company_office, from: "09:00", to: "16:00" }
        hint: "ไปคุยกับคุณธนาที่ออฟฟิศบริษัท (ตู้คอนเทนเนอร์ท้ายตลาด)"
        done:
          npc: "ที่ออฟฟิศ คุณธนายิ้มรับ: ‘เรื่องน้ำซักผ้าใช่ไหมครับ ผมรับ feedback ไว้ครับ เรามีโครงการถังน้ำ CSR อยู่แล้ว เดี๋ยวผมให้ทีมส่งถังเพิ่มให้ป้าพรสองใบ เป็น win-win ครับ ป้าได้งาน ชุมชนได้เสื้อ’"
          options:
            - text: "ถังไม่มีน้ำจะ win ยังไง{kq}"
              heart: 1
              set_flag: porn_q3_asked_water
              reply: "คุณธนาเงียบไปสามวินาที ยิ้มกว้างขึ้น ‘ผมจะ escalate ให้ครับ’ แล้วยื่นนามบัตรมาให้ใบนึง ป้าพรคงอยากรู้ว่า escalate แปลว่าอะไร"
            - text: "รับทราบ{k} เดี๋ยวไปบอกป้าพร"
              heart: 0
              reply: "คุณธนาส่งแบบเสื้อมาด้วยหนึ่งแผ่น โลโก้ใบไม้สีเขียวใหญ่เต็มหน้าอก ข้างล่างเขียน ‘เราเติบโตไปพร้อมชุมชน’ ตัวเล็กกว่าโลโก้สิบเท่า"
      - goal: { type: talk, npc: porn }
        hint: "กลับไปบอกป้าพร แล้วช่วยป้าตัดสินใจ"
        done:
          npc: "ถังสองใบ… ป้าขอน้ำ เขาให้ถัง หลาน ป้าจะรับงานนี้ดีไหม สี่หมื่นนะ ค่าเทอมหลานสาวป้า แต่ป้าต้องเย็บใบไม้สีเขียวสองร้อยใบลงบนอกคนที่มาดูดน้ำบ่อป้า"
          options:
            - text: "รับเถอะ{k}ป้า เงินคือเงิน ค่าเทอมสำคัญ"
              heart: 1
              set_flag: porn_took_order
              reply: "…ป้าจะรับ แต่ป้าจะเย็บตะเข็บด้านในด้วยด้ายสีฟ้า สีบ่อน้ำ ไม่มีใครเห็น แต่ป้ารู้ คนใส่ไปทุกวันจะมีบ่อป้าติดตัวไปด้วย"
            - text: "รับ ถ้าเขาเอารถน้ำมาเติมบ่อหมู่สี่ทุกอาทิตย์{k}"
              heart: 2
              set_flag: porn_bargain_water
              reply: "ต่อรองกับบริษัท… ป้าไม่เคยคิด ป้าต่อรองแต่กับแม่ค้าผ้า ได้ ป้าจะเขียนลงกระดาษ ให้แพรวช่วยพิมพ์ เขาไม่ยอมป้าไม่เย็บ ดูซิใครต้องการใครมากกว่ากัน"
            - text: "อย่ารับเลย{k} ป้าไม่สบายใจ"
              heart: 1
              set_flag: porn_refused_order
              reply: "ไม่สบายใจจริงๆ หลาน… ป้าไม่รับ ค่าเทอมป้าเย็บผ้าถุงขายเพิ่มเอา ช้าหน่อยแต่ป้านอนหลับ ตาแก่ต้องบ่นว่าป้าโง่ แต่ป้าโง่แบบยายเพียรได้"
    reward: { heart: 2, items: { cotton_handwoven: 1 }, set_flag: porn_q3_done, line: { from: porn, text: "ใครจะสั่งตัดผ้าเดือนนี้มาที่บ้านป้าพรนะ ราคาเท่าเดิม แต่ซักก่อนตัดไม่ได้ ใครมีน้ำเอามาด้วยคนละถัง 🙏" } }

  - id: porn_q4
    npc: porn
    title: "เข็มที่มีสองรู"
    desc: "ตาป้าพรเริ่มมองไม่ชัด ป้ากลัวว่าจะเย็บผ้าไม่ได้อีก"
    start: { flag: porn_q3_done, heart_min: 6, day_min: 20 }
    offer:
      npc: "หลาน ป้าพร้อมแล้ว… เมื่อวานป้าเย็บกระดุมชุดนักเรียนเด็กข้างบ้านกลับด้าน ป้าไม่เคยเย็บผิดตั้งแต่อายุสิบห้า พาป้าไปหาหมอแอนหน่อย ห้ามบอกตาแก่"
      options:
        - text: "ไป{k}ป้า {p}ไปด้วย"
          accept: true
          heart: 2
          reply: "หลานไปคุยกับหมอแอนก่อนนะ บอกว่าป้ากลัวเข็มฉีดยา ป้าไม่ได้กลัว ป้าแค่ไม่ชอบ"
        - text: "ทำไมไม่บอกลุง{kq}"
          accept: true
          heart: 1
          reply: "บอกแกแล้วแกจะเครียด เครียดแล้วแกจะซื้อหวยเพิ่มเพื่อหาค่ารักษาป้า ป้าเลยไม่บอก ไปเถอะหลาน"
        - text: "ป้าคงแค่เหนื่อย{k}"
          heart: -1
          reply: "หวังว่างั้นจ้ะ… ป้าก็อยากเชื่อแบบหลาน ไว้ป้าค่อยไปเองก็ได้"
    steps:
      - goal: { type: talk, npc: ann }
        hint: "ไปคุยกับหมอแอนที่ รพ.สต. เรื่องตาของป้าพร"
        done:
          npc: "ป้าพรเหรอคะ ดีแล้วที่พามานะคะ อาการแบบนี้แอนว่าน่าจะต้อกระจกระยะแรกค่ะ ต้องตัดแว่นก่อน แล้วนัดตรวจที่อำเภอ บัตรทองใช้ได้ค่ะ บอกป้าว่าผ่าตาสมัยนี้ไม่น่ากลัวแล้วนะคะ"
          options:
            - text: "ป้ากลัวค่าใช้จ่าย{k}"
              heart: 1
              reply: "บัตรทองครอบคลุมค่ะ ค่ารถไปอำเภอ รพ.สต. มีรถรับส่งผู้สูงอายุทุกวันพุธค่ะ แอนจะลงชื่อให้ป้าเลยนะคะ"
