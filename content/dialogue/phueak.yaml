# ตาเผือก — คนเลี้ยงควายฝูงสุดท้าย · convos + quests
convos:
  # ===== react =====
  - id: phueak_r_vote_water
    topic: react
    once: true
    when: { flag: vote_water }
    npc: "…เอ็งยกมือเรื่องน้ำ ตาเห็น ตานั่งแถวหลังสุด ข้างเสาศาลา"
    options:
      - text: "ตาไปประชุมด้วยเหรอ{kq}"
        heart: 1
        reply: "ไป ครั้งแรกในสิบปี… คนหันมามองตาทั้งศาลา เหมือนเห็นควายเดินขึ้นศาลา ตาก็ยกมือ แล้วก็กลับ"
        next:
          - text: "ทุกคนดีใจที่ตามานะ{kq}"
            heart: 1
            reply: "ดีใจหรือตกใจ ตาแยกไม่ออก… ผู้ใหญ่นับมือตาสองรอบ คงนึกว่าตายกผิด"
          - text: "ตายกมือให้ควายใช่ไหม{kq}"
            heart: 2
            reply: "เจ็ดตัว ยกได้มือเดียว ตาเลยยกสูงๆ ให้มันนับเจ็ด"
      - text: "{p}โหวตเพราะอยากให้ปลักควายตามีน้ำ{k}"
        heart: 2
        reply: "…เอ็งคิดถึงควายตาด้วยเหรอ อืม ไอ้ทุยมันจะรู้ ตาจะบอกมัน"

  - id: phueak_r_well_dry
    topic: react
    when: { flag: story_well_dry }
    npc: "ปลักแห้งแล้วหลาน… ควายยืนมองปลักเหมือนคนมองบ้านไฟไหม้ ไม่ร้อง แค่ยืน"
    options:
      - text: "ทำยังไงดี{kq}ตา"
        heart: 1
        reply: "ต้อนไปคลองวันละสองรอบ คลองก็ตื้นลงทุกวัน… ควายเดินไกลขึ้น ตาก็เดินไกลขึ้น ขาตาไม่ได้หนุ่มเหมือนขาควาย"
        next:
          - text: "{p}ช่วยต้อนควายได้นะ{kq}"
            heart: 2
            reply: "ต้อนเป็นเหรอ… เดินข้างหลัง อย่าเดินข้างหน้า อย่าตะโกน ควายไม่ชอบคนรีบ เย็นนี้ห้าโมงลองดู"
          - text: "ตาไม่เหนื่อยเหรอ{kq}"
            heart: 1
            reply: "เหนื่อย… แต่ควายเหนื่อยกว่า มันไม่ได้เลือกให้ปลักแห้ง ตาก็ไม่ได้เลือก คนเลือกไม่ได้อยู่ที่นี่"
      - text: "{p}จะหาบน้ำมาช่วย{k}"
        heart: 2
        reply: "ควายเจ็ดตัว ตัวละห้าถัง… เอ็งหาบไม่ไหวหรอก แต่ตาจำไว้ว่าเอ็งพูด"
      - text: "บริษัททำใช่ไหม{kq}"
        heart: 1
        reply: "ตาไม่รู้เรื่องใต้ดิน ตารู้เรื่องควาย… ควายตาไม่เคยยืนมองปลักแห้งแบบนี้มาหกสิบปี มันรู้ก่อนคน"

  - id: phueak_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "คนงานบริษัทเห็นผีใช่ไหม… ควายตาหันหน้าไปทางรั้วบริษัททุกคืนมาเดือนนึงแล้ว ตาไม่ได้บอกใคร"
    options:
      - text: "ควายเห็นผีได้เหรอ{kq}"
        heart: 1
        reply: "ควายเห็นทุกอย่างที่คนไม่อยากเห็น… มันไม่ร้อง มันไม่วิ่ง มันแค่ยืนหันไปทางนั้น เหมือนยืนไว้อาลัย"
        next:
          - text: "ไว้อาลัยใคร{kq}"
            heart: 1
            reply: "ตาไม่รู้… ยายบัวว่าแม่ธรณีเสียใจ ตาว่าน้ำมันหายไปไหนสักแห่ง ควายมันรู้ว่าหายไปตรงนั้น"
          - text: "{p}ขนลุกแล้ว{k}"
            heart: 0
            reply: "ขนลุกก็กลับบ้านก่อนสามทุ่ม อย่าเดินผ่านรั้วนั้น ตาบอกแค่นี้"
      - text: "ตาไม่กลัวเหรอ{kq}"
        heart: 1
        reply: "ควายไม่กลัว ตาก็ไม่กลัว… ตาเลี้ยงควายมาหกสิบปี ตากลัวอย่างเดียว คือวันที่ไม่มีควายให้เลี้ยง"

  - id: phueak_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "รถแห่ผ่านทุ่งตาสามรอบแล้ววันนี้ อีแดงวิ่งชนรั้วหนึ่งรอบ ตาจะเลือกคนที่เปิดลำโพงเบาที่สุด"
    options:
      - text: "มีคนไหนเปิดเบาไหม{kq}"
        heart: 1
        reply: "ยังไม่มี… คันหนึ่งเปิดเพลงลูกทุ่ง ไอ้ทุยฟังแล้วหยุดเคี้ยว คันนั้นตาเกือบเลือก แล้วมันก็พูดเรื่องถนนต่อ ไอ้ทุยเดินหนี"
      - text: "ป้ายมาติดที่ทุ่งตาด้วยไหม{kq}"
        heart: 1
        reply: "ติดที่ต้นมะขาม ตาปลดออก ไม่ใช่ตาไม่ชอบเขา ต้นมะขามนั่นมีของตาฝังอยู่ใต้ ไม่ให้ใครตอกตะปู"
      - text: "ตาจะไปเลือกตั้งไหม{kq}"
        heart: 1
        reply: "ไป… ปลักแห้งแล้ว ตาไม่ไปไม่ได้แล้ว"

  - id: phueak_r_lottery
    topic: react
    once: true
    when: { flag: bought_lottery }
    npc: "ลุงสมหมายบอกว่าเอ็งซื้อหวย… เลขจากไอ้ด่างจามหรือเปล่า"
    options:
      - text: "ใช่{k} ลุงบอกว่าจามสองที"
        heart: 1
        reply: "…จามสองทีเพราะฝุ่นฟาง ไม่ใช่เพราะเลข อย่าบอกลุงนะ แกจะเสียใจ แกรักไอ้ด่างเพราะคิดว่ามันวิเศษ"
        next:
          - text: "{p}จะเก็บเป็นความลับ{k}"
            heart: 2
            reply: "ดี… บางคนต้องมีอะไรให้เชื่อ ลุงเชื่อควาย ตาก็เชื่อควาย คนละแบบ"
          - text: "แต่ลุงเสียเงินทุกงวดนะ{kq}"
            heart: 0
            reply: "ป้าพรคุมเงินแล้ว ลุงเสียได้แค่ค่าหวยกับค่าฟางให้ไอ้ด่าง… ไอ้ด่างได้ฟางดีที่สุดในตำบล มันควรจามต่อไป"
      - text: "ไม่ใช่{k} {p}ซื้อเลขตัวเอง"
        heart: 1
        reply: "ดี เลขตัวเองไม่ต้องไปโทษควาย"

  - id: phueak_o_noi_cup
    topic: others
    once: true
    when: { flag: noi_cup_told }
    npc: "…เอ็งบอกหน่อยแล้วใช่ไหม ถ้วยเมื่อเช้ามีไข่ลวกฟองนึง มันไม่ได้ทักตา ตาก็ไม่ได้ทักมัน… ไข่อร่อย"
    options:
      - text: "ขอโทษ{k}ตา {p}บอกไปแล้ว"
        heart: 1
        reply: "ไม่ต้องขอโทษ… มันวางไข่ไว้ แปลว่ามันไม่ได้โกรธ ตาก็ไม่ได้โกรธ ต่างคนต่างเงียบ ดีแล้ว"
      - text: "ตาไปขอบคุณพี่หน่อยหรือยัง{kq}"
        heart: 1
        reply: "…ตาล้างถ้วยให้สะอาดกว่าเดิม มันคงรู้ ตาพูดได้แค่นั้นหลาน"

  - id: phueak_r_end_greet
    topic: react
    once: true
    when: { flag: phueak_end_greet }
    npc: "…หวัดดีหลาน"
    options:
      - text: "หวัดดี{k}ตา {p}มาตามสัญญา"
        heart: 2
        reply: "เออ… วันที่สิบห้าแล้วนะ ตานับ ยายเอ็งนับไปถึงสามพันกว่า เอ็งยังอีกไกล"
      - text: "ตาทักก่อนอีกแล้ว{k}"
        heart: 1
        reply: "ตาซ้อมกับควายทุกเช้า ไอ้ทุยมันเบื่อแล้ว มันอยากให้เอ็งมาเร็วๆ"

  - id: phueak_r_end_calf
    topic: react
    once: true
    when: { flag: phueak_end_calf }
    npc: "ลูกควายเอ็งกินหญ้าเก่งขึ้นนะหลาน… เมื่อวานมันเดินตามเอ็งกลับบ้านครึ่งทาง ตาต้องไปตามกลับ"
    options:
      - text: "มันจำ{p}ได้แล้ว{k}"
        heart: 2
        reply: "จำได้ ควายจำคนที่ป้อนหญ้าตอนเช้า… พออายุสองปีค่อยพาไปอยู่บ้านเอ็ง ตอนนี้มันยังต้องกินนมแม่"
      - text: "ตาไม่เหงาเหรอ{kq} ถ้ามันไปอยู่กับ{p}"
        heart: 2
        reply: "เหงา… แต่ตาไม่อยากให้มันเป็นควายตัวสุดท้ายที่ตาเลี้ยง ตาอยากให้มันเป็นควายตัวแรกที่เอ็งเลี้ยง"

  - id: phueak_r_end_pasture
    topic: react
    once: true
    when: { flag: phueak_end_pasture }
    npc: "ปาล์มมาปักหมุดทุ่งหญ้าแล้ว ปักตามแผนที่ที่ยายเอ็งไปยื่นไว้เมื่อสิบปีก่อน… รั้วบริษัทถอยไปสามเมตร"
    options:
      - text: "สามเมตรเองเหรอ{kq}"
        heart: 1
        reply: "สามเมตรคือหญ้าวันนึงของควายเจ็ดตัว… ตาไม่เคยได้อะไรคืนจากรั้วนั้นเลย สามเมตรก็เยอะแล้วหลาน"
      - text: "ยายช่วยตาไว้นะ{kq}"
        heart: 2
        reply: "ยายเอ็งช่วยควายตา… แล้วไม่บอกตาสักคำ ทักตาทุกเช้าแต่ไม่บอกเรื่องนี้ คนอะไร… ตาจะไปไหว้ยายเอ็งที่หิ้งพระ ถ้าเอ็งให้เข้าบ้าน"

  # ===== news =====
  - id: phueak_n_fence
    topic: news
    npc: "รั้วบริษัทขยับมาอีกเสาหนึ่ง… เมื่อวานยังอยู่ตรงต้นสะเดา วันนี้อยู่ข้างหน้ามัน"
    options:
      - text: "ตาไปบอกใครหรือยัง{kq}"
        heart: 1
        reply: "บอกผู้ใหญ่ ผู้ใหญ่บอก ‘ย้ำอีกครั้งนะ ต้องทำหนังสือ’ ตาเขียนหนังสือไม่คล่อง… ไอ้กล้าบอกจะเขียนให้"
      - text: "รั้วขยับเองได้ด้วยเหรอ{kq}"
        heart: 1
        reply: "ขยับตอนกลางคืน… ตาไม่เห็นคนทำ แต่เห็นรอยล้อรถตอนเช้า ควายตาไม่มีล้อ"
      - text: "เสาเดียวเองนะ{kq}ตา"
        heart: -1
        reply: "เสาเดียววันนี้ เสาเดียวพรุ่งนี้… ปีหนึ่งมีสามร้อยหกสิบห้าวันนะหลาน"
        next:
          - text: "{p}ขอโทษ{k} คิดไม่ถึง"
            heart: 1
            reply: "ไม่เป็นไร… คนส่วนใหญ่คิดไม่ถึง ควายคิดถึง มันเดินไปดมเสาใหม่ทุกเช้า"
          - text: "งั้นนับเสาไว้เลย{k} เป็นหลักฐาน"
            heart: 2
            reply: "…ตานับอยู่แล้ว สิบเจ็ดเสา ตาจำได้ทุกต้นว่าเคยเป็นหญ้าแปลงไหน เอ็งไปบอกไอ้กล้า มันชอบตัวเลข"

  - id: phueak_n_heng_buy
    topic: news
    npc: "เสี่ยเฮงมาอีกแล้ว มาขอซื้อควายตา เพิ่มราคาอีกตัวละสองพัน ตาบอกไม่ขาย เสี่ยหัวเราะ บอกว่า ‘ตาเฒ่าดื้อกว่าไอ้กล้าอีก’"
    options:
      - text: "เสี่ยจะเอาควายไปทำอะไร{kq}"
        heart: 1
        reply: "ขายต่อ… ไปที่ที่ควายไม่ได้กลับมา ตารู้ เสี่ยไม่พูด แต่ตารู้"
        next:
          - text: "ถ้าวันหนึ่งตาเลี้ยงไม่ไหวล่ะ{kq}"
            heart: 1
            reply: "…ตาจะหาคนเลี้ยงต่อ ไม่ใช่คนซื้อ คนเลี้ยงกับคนซื้อไม่เหมือนกัน คนเลี้ยงรู้ชื่อควาย"
          - text: "เสี่ยให้ราคาเท่าไหร่{kq}"
            heart: 0
            reply: "พอซื้อรถไถมือสองได้ครึ่งคัน… รถไถไม่รู้ทางกลับบ้าน ไม่ร้องเตือนเวลาผีมา ครึ่งคันก็ไม่เอา"
      - text: "ตาดื้อกว่าพี่กล้าจริงไหม{kq}"
        heart: 1
        reply: "ไอ้กล้ามันดื้อเพราะอ่านหนังสือเยอะ ตาดื้อเพราะเลี้ยงควาย… ควายดื้อกว่าหนังสือ"

  - id: phueak_n_odaeng
    topic: news
    when: { not_flag: phueak_q1_done }
    npc: "อีแดงท้องโตแล้ว นอนตะแคงทั้งบ่าย ใกล้แล้วหลาน… ลุงสมหมายมาถามวันคลอดทุกวัน จะเอาไปซื้อหวย"
    options:
      - text: "ตาบอกวันคลอดลุงไหม{kq}"
        heart: 1
        reply: "ตาบอกผิดวันไปสามวัน… ลุงจะได้ซื้อเลขผิด แล้วไม่มาวนคอกตอนอีแดงเจ็บท้อง"
      - text: "{p}อยากเห็นลูกควายจัง{k}"
        heart: 1
        reply: "มาตอนเช้า… แต่อย่าเข้าใกล้อีแดง มันขี้หงุดหงิดตอนท้อง เหมือนเมียตาตอนท้องลูกคนแรก"

  - id: phueak_n_dust
    topic: news
    npc: "ไร่อ้อยฝั่งโน้นเผาอีกแล้ว ควายไอทั้งคอก หมอแอนเอาหน้ากากมาให้ตาสิบอัน ตาเอาใส่ให้ควายไม่ได้"
    options:
      - text: "ลองชุบผ้าเปียกคลุมคอกไหม{kq}"
        heart: 2
        reply: "…เออ ผ้าเปียกกันฝุ่นได้ ตาไม่ได้คิด เอ็งหัวไวนะหลาน เหมือนยายเอ็ง"
      - text: "ทำไมเขาต้องเผา{kq}"
        heart: 1
        reply: "เผาแล้วตัดง่าย โรงงานรับซื้อ… เขาประหยัดเวลา ควายตาจ่ายเป็นปอด"

  - id: phueak_n_oat
    topic: news
    npc: "น้องโอ๊ตมาที่ทุ่งอีกแล้ว หนีเรียนบ่าย มาป้อนหญ้าไอ้ทุย… ตาส่งมันกลับโรงเรียน มันร้องไห้ ไอ้ทุยก็ร้องตาม"
    options:
      - text: "ตาใจแข็งจัง{k}"
        heart: 1
        reply: "ไม่ใจแข็ง… ตาเดินไปส่งมันถึงประตูโรงเรียน บอกครูเต้ยว่าตาพามาสาย ครูเต้ยไม่เชื่อ แต่ก็ไม่ว่า"
      - text: "น้องโอ๊ตคงชอบควายมาก{k}"
        heart: 1
        reply: "ชอบ… มันเป็นคนเดียวในตำบลที่ถามชื่อควายตาทุกตัว ตาบอกหมดเจ็ดชื่อ มันจำได้หมด ลูกตาจำไม่ได้สักตัว"

  # ===== advice =====
  - id: phueak_a_feed
    topic: advice
    npc: "สัตว์ต้องกินเช้า… ก่อนคนกิน คนหิวยังพูดได้ สัตว์หิวมันพูดไม่ได้"
    options:
      - text: "{p}ให้อาหารไก่ก่อนกินข้าวทุกวัน{k}"
        heart: 1
        reply: "ดี… ยายเอ็งก็ทำแบบนี้ ให้ไก่ก่อน ให้หมาก่อน ยายกินทีหลังสุด ยายผอมเพราะอย่างนี้"
      - text: "ถ้า{p}ตื่นสายล่ะ{kq}"
        heart: 0
        reply: "ไก่จะยืนรอหน้าประตู มองเอ็งเหมือนเจ้าหนี้มองลูกหนี้… ตื่นเช้าเถอะหลาน"

  - id: phueak_a_manure
    topic: advice
    npc: "ขี้ควายหมักกับฟางสามเดือน ใส่แปลงผัก ดีกว่าปุ๋ยกระสอบ… ไม่ต้องเชื่อเสี่ย ไม่ต้องจ่ายดอก"
    options:
      - text: "ขอขี้ควายตาได้ไหม{kq}"
        heart: 1
        reply: "…กองหลังคอก เอาไปได้ ไม่ต้องขอทุกครั้ง แค่ทักตาก่อน ตาไม่ทักตอบ แต่ตาได้ยิน"
        next:
          - text: "ทำไมต้องทักก่อน{kq}"
            heart: 1
            reply: "เพราะคนที่ทัก คือคนที่เห็นว่าตาอยู่ตรงนี้… ขี้ควายตาให้คนที่เห็นตา"
          - text: "{p}จะทักทุกครั้ง{k}"
            heart: 2
            reply: "อืม… ไอ้กล้ามันทักมาสามปี ตาชี้ให้มันสามปี เอ็งเริ่มนับวันนี้"
      - text: "ขี้ควายเหม็นไหม{kq}"
        heart: 0
        reply: "เหม็นสามวัน แล้วก็หอม… หอมแบบดิน คนกรุงเทพฯ ไม่รู้จัก"

  - id: phueak_a_night
    topic: advice
    when: { time: evening }
    npc: "ดูควายก่อนกลับบ้าน… ถ้าควายหันหน้าไปทางป่า หูตั้ง อย่าเดินทางนั้น"
    options:
      - text: "ควายรู้จริงเหรอ{kq}"
        heart: 1
        reply: "สามสิบปีก่อน ไอ้ทุยตัวแม่หันหน้าไปทางคลอง ตาไม่เชื่อ เดินไป… เจอผีพรายนั่งริมตลิ่ง ตาวิ่งกลับมาเร็วกว่าควาย"
      - text: "แล้วถ้าไม่มีควายให้ดูล่ะ{kq}"
        heart: 1
        reply: "ดูหมาก็ได้ หมาหอนยาวๆ แปลว่ามีอะไร… แต่หมาโกหกบ้าง ควายไม่โกหก"

  - id: phueak_a_slow
    topic: advice
    when: { heart_min: 2 }
    npc: "เอ็งเดินเร็วเกินไปหลาน… ตาเห็นเอ็งวิ่งไปวิ่งมาทั้งวัน ควายเดินช้า แต่ไถนาเสร็จทุกแปลง"
    options:
      - text: "งานเยอะจริงๆ{k}ตา"
        heart: 1
        reply: "งานเยอะก็ทำวันละแปลง… วันที่เอ็งวิ่ง ตาเห็นเอ็งทำหกแปลงพังสามแปลง วันที่ช้า สามแปลงดีหมด"
      - text: "ตาไม่เคยรีบเลยเหรอ{kq}"
        heart: 1
        reply: "รีบครั้งเดียว ตอนเมียตาไม่สบาย ตาวิ่งไปอำเภอ… วิ่งไม่ทัน ตั้งแต่นั้นตาไม่รีบอีก รีบไปก็ไม่ทันอยู่ดี"

  # ===== smalltalk =====
  - id: phueak_s_greet
    topic: smalltalk
    npc: "…"
    options:
      - text: "สวัสดี{k}ตา อากาศดีนะ{kq}"
        heart: 1
        set_flag: phueak_greeted
        reply: "(ตาเผือกไม่ตอบ แต่พยักหน้าทีเดียว แล้วยื่นใบหญ้าให้ไอ้ทุยกิน… ไอ้ทุยหันมามองเอ็ง)"
      - text: "ตา{k} ตาเผือกใช่ไหม{kq}"
        heart: 0
        reply: "…ใช่ เผือก ควายชื่อทุย นั่นแดง นั่นด่าง ของลุงสมหมาย จำไว้"
      - text: "(ยืนดูควายเฉยๆ ไม่พูดอะไร)"
        heart: 1
        reply: "(ยืนกันสองคนกับควายเจ็ดตัวจนลมพัดผ่านทุ่งสองรอบ ตาเผือกพูดขึ้นเบาๆ) …เอ็งยืนนิ่งเป็น ดี"

  - id: phueak_s_leaf
    topic: smalltalk
    npc: "(ตาเผือกเป่าใบไม้เป็นเพลง ควายทั้งฝูงหยุดเคี้ยว)"
    options:
      - text: "เพลงอะไร{kq}ตา เพราะจัง"
        heart: 2
        reply: "เพลงที่เมียตาร้องตอนดำนา… ตาจำเนื้อไม่ได้แล้ว จำได้แต่ทำนอง ควายจำได้ด้วย มันฟังทุกครั้ง"
        next:
          - text: "สอน{p}เป่าบ้างได้ไหม{kq}"
            heart: 1
            reply: "ใบตองไม่ได้ ต้องใบมะยม พับครึ่ง เป่าตรงขอบ… เอ็งเป่าแล้วเหมือนเป็ดสำลักน้ำ ไม่เป็นไร ตาครั้งแรกเหมือนวัวเรอ"
          - text: "ควายฟังเพลงรู้เรื่องด้วยเหรอ{kq}"
            heart: 1
            reply: "รู้เรื่องมากกว่าคนฟังหอกระจายข่าว"
      - text: "(ปรบมือ)"
        heart: 1
        reply: "อย่าปรบ อีแดงตกใจ… แต่ตาขอบใจ"

  - id: phueak_s_school
    topic: smalltalk
    npc: "สมัยตาเด็ก ขี่ควายไปโรงเรียน ผูกไว้ใต้ต้นจามจุรี เลิกเรียนควายหายไปครึ่งตัว… หมายถึงมันเดินไปกินหญ้าครึ่งทาง"
    options:
      - text: "ครูไม่ว่าเหรอ{kq} เอาควายไปโรงเรียน"
        heart: 1
        reply: "ครูก็ขี่ควายมาสอน… ควายครูตัวใหญ่กว่า ควายตาเลยเกรงใจ"
      - text: "เดี๋ยวนี้ไม่มีใครขี่ควายแล้วนะ{kq}"
        heart: 1
        reply: "เหลือน้องโอ๊ต ขี่ไอ้ทุยรอบคอกเมื่อวาน ตาจับไว้ทั้งรอบ… มันบอกว่าขี่เก่ง ตาว่าไอ้ทุยเดินเก่ง"

  - id: phueak_s_names
    topic: smalltalk
    when: { heart_min: 2 }
    npc: "หลานจำชื่อควายตาได้กี่ตัวแล้ว"
    options:
      - text: "ไอ้ทุย อีแดง ไอ้ด่าง{k}"
        heart: 1
        reply: "สามตัว… อีกสี่ตัว อีคำ ไอ้เพชร อีบุญ ไอ้หมอก เอ็งจำไม่ได้ไม่เป็นไร มันจำเอ็งได้แล้ว"
      - text: "ควายหน้าเหมือนกันหมดเลย{k}"
        heart: -1
        reply: "คนกรุงเทพฯ หน้าเหมือนกันหมดในสายตาควายเหมือนกัน"
      - text: "ทำไมตาตั้งชื่อเหมือนคน{kq}"
        heart: 1
        reply: "มันอยู่กับตามากกว่าคน… ตาเรียกชื่อมันทุกวัน วันละสิบรอบ มันตอบตาทุกรอบ คนไม่ค่อยตอบ"

  # ===== self =====
  - id: phueak_f_age8
    topic: self
    npc: "ตาจูงควายตั้งแต่แปดขวบ พ่อให้เชือกเส้นแรก… เชือกนั้นยังอยู่ ผูกไว้ที่เสาคอก ขาดไปครึ่งแล้ว ตาไม่เปลี่ยน"
    options:
      - text: "ทำไมไม่เปลี่ยน{kq}"
        heart: 1
        reply: "เชือกเส้นใหม่ไม่รู้จักควายตา"
      - text: "หกสิบปีแล้วเหรอ{kq}"
        heart: 1
        reply: "หกสิบสอง… ตานับเป็นรุ่นควาย ไอ้ทุยตอนนี้เป็นรุ่นที่เจ็ด ตาเลี้ยงมาเจ็ดชั่วควาย"
        next:
          - text: "แล้วรุ่นที่แปดล่ะ{kq}"
            heart: 1
            reply: "…ยังไม่รู้ใครเลี้ยง ลูกตาอยู่กรุงเทพฯ ไม่กลับ ตาไม่โทษมัน ที่กรุงเทพฯ ไม่มีควาย มันลืมกลิ่นแล้ว"
          - text: "ตาจำได้ทุกรุ่นเลยเหรอ{kq}"
            heart: 1
            reply: "จำได้ทุกตัว… จำวันเกิดลูกตัวเองไม่ได้ ลูกตาบ่นทุกปีทางโทรศัพท์ ตาก็บอกว่าวันเดียวกับไอ้ทุยรุ่นห้า มันวางสาย"

  - id: phueak_f_wife
    topic: self
    when: { heart_min: 3 }
    npc: "เมียตาชื่อสาย… เสียไปสิบปีแล้ว เขาเป็นคนพูดแทนตาทุกอย่าง ทักแทน ขอบใจแทน ด่าแทน"
    options:
      - text: "ยายสายคงเป็นคนน่ารัก{k}"
        heart: 2
        reply: "พูดเก่งกว่าป้าแต๋ว… ใครผ่านบ้านต้องหยุดคุย ตายืนข้างหลัง พยักหน้า ห้าสิบปีตาพยักหน้าอย่างเดียว"
        next:
          - text: "พอยายไม่อยู่ ตาเลยไม่ทักใครเหรอ{kq}"
            heart: 2
            reply: "…ตาไม่รู้จะเริ่มประโยคยังไง ทุกประโยคเมียตาเป็นคนเริ่ม ตาแค่พูดคำสุดท้าย"
          - text: "ตาคิดถึงยายสายไหม{kq}"
            heart: 1
            reply: "ทุกเช้า… ตอนต้อนควายออก เมียตาเคยยืนตรงประตูคอก ตายังเหลียวไปดูทุกเช้า สิบปีแล้ว"
      - text: "ขอโทษ{k}ที่ถาม"
        heart: 0
        reply: "ไม่ต้องขอโทษ… ไม่มีใครถามเรื่องเมียตามานาน ถามก็ดี ตาจะได้พูดชื่อเขา"

  - id: phueak_f_greeting
    topic: self
    when: { heart_min: 5 }
    npc: "หลาน… คนในตำบลว่าตาหยิ่ง ไม่ทักใคร ตาไม่ได้หยิ่ง ตาจำได้ทุกคนว่าใครทักตาบ้าง"
    options:
      - text: "ใครทักตาบ้าง{kq}"
        heart: 1
        reply: "ไอ้กล้าทักทุกเช้า สามปี น้องโอ๊ตทักทุกวันที่หนีเรียน พรานแดงทักแบบด่า ป้าทองใบทักแล้วยัดข้าวห่อใส่มือ… กับยายเอ็ง ทักทุกเช้าสิบปี ไม่เคยขาด"
        next:
          - text: "ยาย{p}ทักตาทุกวันเลยเหรอ{kq}"
            heart: 2
            reply: "ทุกวัน… ‘เผือก วันนี้ฟ้าดี’ ‘เผือก ไอ้ทุยอ้วนขึ้น’ ตาไม่เคยตอบสักคำ ยายเอ็งก็ทักต่อ… ตาค้างคำตอบยายเอ็งไว้สามพันกว่าคำ"
          - text: "ทำไมตาไม่ทักตอบล่ะ{kq}"
            heart: 1
            reply: "…ตาคิดว่าพรุ่งนี้จะตอบ ทุกวัน แล้ววันหนึ่งพรุ่งนี้ก็ไม่มี"
      - text: "{p}ก็ทักตาทุกวันนะ{kq}"
        heart: 2
        reply: "รู้… ตานับอยู่"

  - id: phueak_f_tamarind
    topic: self
    when: { heart_min: 7 }
    npc: "ต้นมะขามที่ตานั่งทุกวัน… ข้างใต้มีควายตัวแรกของตาฝังอยู่ ชื่อไอ้เงิน ตาร้องไห้ครั้งเดียวในชีวิตตอนฝังมัน"
    options:
      - text: "ตาไม่ร้องไห้ตอนยายสายเสียเหรอ{kq}"
        heart: 1
        reply: "…ตาไม่ร้อง ตาไปนั่งใต้ต้นมะขามสามวัน ไม่ได้ร้อง แค่นั่ง ไอ้เงินมันคงร้องแทนตา"
      - text: "ตาให้{p}นั่งด้วยได้ไหม{kq}"
        heart: 2
        reply: "…นั่งได้ ตรงนั้น รากโผล่ นั่งสบาย ยายเอ็งเคยนั่งตรงนั้น ตาไม่ให้ใครนั่งมาสิบปี"
      - text: "ไอ้เงินคงเป็นควายที่ดีมาก{k}"
        heart: 1
        reply: "ดีที่สุด… พาตากลับบ้านตอนตาเมาครั้งเดียวในชีวิต ตาหลับบนหลังมัน ตื่นมาอยู่หน้าคอก เมียตายืนด่า"

  # ===== others =====
  - id: phueak_o_daeng
    topic: others
    npc: "พรานแดงเพื่อนตา… เมื่อวานมันมาบอกว่าเห็นรอยผีกองกอยข้างคอก ตาบอกควายตาไม่ร้อง มันบอกหมามันหนีไปนอนใต้เตียง"
    options:
      - text: "ใครถูก{kq}"
        heart: 1
        reply: "ไม่มีใครถูก… ควายตาไม่กลัว หมามันกลัว แต่ทั้งคู่ไม่ได้ไปดู ตากับพรานแดงก็ไม่ได้ไปดู"
      - text: "ตากับลุงแดงเพื่อนกันนานแค่ไหน{kq}"
        heart: 1
        reply: "หกสิบปี… คุยกันวันละสามประโยค รวมแล้วหกหมื่นกว่าประโยค พอแล้ว"

  - id: phueak_o_sommai
    topic: others
    npc: "ลุงสมหมายฝากไอ้ด่างไว้กับตา จ่ายเป็นข้าวเปลือก… แต่มาเยี่ยมไอ้ด่างทุกเย็น เอากระดาษกับปากกามาด้วย"
    options:
      - text: "มาจดเลขใช่ไหม{kq}"
        heart: 1
        reply: "จดทุกอย่าง ไอ้ด่างจามกี่ที ขี้กี่กอง หันไปทางไหน… ไอ้ด่างเป็นควายที่ถูกจดบันทึกมากที่สุดในประเทศ"
      - text: "ลุงสมหมายรักควายจัง{k}"
        heart: 1
        reply: "รักจริง… ปีก่อนไอ้ด่างป่วย ลุงนั่งเฝ้าทั้งคืน ไม่ได้ถามเลขสักคำ ตาเลยรู้ว่าลุงรักมัน ไม่ใช่รักเลข"

  - id: phueak_o_kla
    topic: others
    npc: "ไอ้กล้ามันทักตาทุกเช้า สามปี… แล้วก็พูดต่ออีกสิบนาที เรื่องปุ๋ย เรื่องน้ำ เรื่องสหกรณ์ ตาพยักหน้าทุกประโยค"
    options:
      - text: "ตาฟังเขารู้เรื่องไหม{kq}"
        heart: 1
        reply: "ครึ่งเดียว อีกครึ่งตาฟังแค่เสียง… เสียงมันเหมือนพ่อมันตอนหนุ่ม ก่อนพ่อมันป่วย ตาชอบฟัง"
      - text: "พี่กล้าพูดเยอะจริงๆ{k}"
        heart: 1
        reply: "มันพูดแทนคนที่ไม่พูด… คนอย่างตา ตาไม่ว่ามัน"

  - id: phueak_o_thongbai
    topic: others
    npc: "ทองใบผ่านทุ่งทุกเช้าตอนเข้าป่า ยัดข้าวห่อใส่มือตาแล้วเดินไป ไม่รอตาพูด… สิบปีแล้ว"
    options:
      - text: "ป้ารู้ว่าตาไม่ชอบพูดเลยไม่รอ{k}"
        heart: 1
        reply: "รู้… ทองใบรู้ทุกอย่าง ทั้งเห็ด ทั้งคน ข้าวห่อทองใบเค็มนิดเดียวทุกครั้ง พอดีกับคนเดินทุ่งทั้งวัน"
      - text: "ข้าวห่ออะไร{kq}"
        heart: 1
        reply: "ข้าวเหนียวกับปลาทูทอด… บางวันมีน้ำพริก ทองใบบอกว่าจืด ตาว่าไม่จืด ตาไม่เคยบอกทองใบ"

quests:
  - id: phueak_q1
    npc: phueak
    title: "อีแดงจะคลอด"
    desc: "ควายของตาเผือกใกล้คลอด ตาต้องการฟางแห้ง และคนช่วยเฝ้าตอนเช้า"
    start: { heart_min: 0, day_min: 3 }
    offer:
      npc: "…หลาน อีแดงใกล้คลอด ต้องการฟางแห้งรองพื้น ร้านเสี่ยมี ตาไม่เข้าร้านเสี่ย… สหกรณ์ไอ้กล้าก็มี ตาไม่อยากฟังมันพูดสิบนาที"
      options:
        - text: "{p}ไปซื้อมาให้{k}"
          accept: true
          heart: 1
          reply: "สามก้อน… ตาให้เงิน เอ็งไม่รับก็ได้ แต่ตาให้"
        - text: "ฟังพี่กล้าพูดสิบนาทีแลกฟางได้ไหม{kq}"
          accept: true
          heart: 1
          reply: "…ได้ ถ้าเอ็งทนได้ ตาทนไม่ได้"
        - text: "ไว้ก่อน{k}ตา"
          heart: 0
          reply: "อืม… อีแดงรอได้ ลูกมันรอไม่ได้"
    steps:
      - goal: { type: give, npc: phueak, item: hay_dry, n: 3 }
        hint: "ซื้อหญ้าแห้ง 3 ก้อนที่สวนสหกรณ์ เอาไปให้ตาเผือกที่ทุ่ง"
        done:
          npc: "…ก้อนแน่นดี ไอ้กล้ามันพูดกี่นาที"
          options:
            - text: "สิบห้านาที{k} ทั้งเรื่องฟางทั้งเรื่องน้ำ"
              heart: 1
              reply: "ห้านาทีเกินคือส่วนที่มันพูดถึงตา… มันห่วงตา ตารู้ เอ็งไม่ต้องบอกมัน"
            - text: "ไม่ได้พูดเลย{k} พี่กล้ารีบไปส่งผัก"
              heart: 1
              reply: "วันนี้มันรีบ… ดีแล้ว พรุ่งนี้มันจะมาพูดชดเชยกับตา"
      - goal: { type: visit, place: pasture, from: "07:00", to: "08:30" }
        hint: "ไปทุ่งเลี้ยงควายตอนเช้า ช่วยตาเผือกดูอีแดง"
        done:
          npc: "(ตาเผือกนั่งใต้ต้นมะขาม ไม่หันมา อีแดงนอนตะแคงบนฟางที่เอ็งซื้อมา หายใจแรง)"
          options:
            - text: "อรุณสวัสดิ์{k}ตา {p}มาช่วยดู"
              heart: 2
              reply: "…อืม นั่งตรงนั้น อย่าพูดดัง อีแดงเจ็บมาตั้งแต่ตีสี่ ใกล้แล้ว"
            - text: "(นั่งลงข้างๆ เงียบๆ)"
              heart: 1
              reply: "…ดี เงียบเป็น สัตว์คลอดลูกไม่ต้องการคนพูด ต้องการคนอยู่"
      - goal: { type: days, n: 2 }
        hint: "รอ 2 วัน แล้วกลับไปหาตาเผือกที่ทุ่ง"
        done:
          npc: "ตัวเมีย… ยืนได้ตั้งแต่ชั่วโมงแรก ดูดนมแม่เก่ง ตาไม่เคยให้ใครตั้งชื่อควายตา… เอ็งตั้งให้มันได้ไหม"
          options:
            - text: "อีเพียร{k} ตามชื่อยาย"
              heart: 2
              set_flag: phueak_calf_pian
              reply: "…อีเพียร อืม ยายเอ็งคงหัวเราะ ยายเอ็งเคยบอกตาว่า ‘ถ้าฉันตายแล้วเกิดเป็นควาย ขอเป็นควายบ้านเผือก’ ตานึกว่ายายพูดเล่น"
            - text: "อีฟ้า{k} เพราะเกิดตอนฟ้าใส"
              heart: 1
              set_flag: phueak_calf_fa
              reply: "อีฟ้า… ดี ชื่อสั้น เรียกง่าย ตะโกนข้ามทุ่งได้ไกล"
            - text: "ตาตั้งเองดีกว่า{k} {p}ไม่กล้า"
              heart: 0
              reply: "…งั้นอีบัวทอง ตามชื่อแม่ตา เอ็งไม่กล้า ตาก็กล้าแทน"
    sold_at: { hay_dry: coop_garden }
    reward: { money: 0, heart: 2, items: { heirloom_seed: 2 }, set_flag: phueak_q1_done }

  - id: phueak_q2
    npc: phueak
    title: "ปลักแห้ง"
    desc: "ปลักควายแห้ง ลูกควายตัวใหม่ไม่มีที่นอนแช่น้ำ ช่วยตาเผือกทำปลักใหม่ริมคลอง"
    start: { flag: phueak_q1_done, day_min: 11 }
    offer:
      npc: "ปลักแห้งแล้วหลาน… ลูกควายร้อน ผิวแตก ตาจะขุดปลักใหม่ริมคลอง ต้องเอาหินมากั้นขอบ ไม่งั้นดินพัง… ตาแบกหินไม่ไหวแล้ว"
      options:
        - text: "{p}จะขนหินมาให้{k}"
          accept: true
          heart: 2
          reply: "แปดก้อน ก้อนเท่าหัวควาย… ไม่ใช่ หัวลูกควาย พอแล้ว"
        - text: "บริษัทบอกว่าจะทำบ่อให้ควายไม่ใช่เหรอ{kq}"
          accept: true
          heart: 1
          reply: "ทำแล้ว อยู่ในรั้ว มีกุญแจ… ควายตาไม่มีกุญแจ เอาหินมาเถอะหลาน"
        - text: "{p}ยุ่งอยู่{k}ตา"
          heart: 0
          reply: "อืม… ทุกคนยุ่ง ควายไม่ยุ่ง ควายแค่ร้อน"
    steps:
      - goal: { type: give, npc: phueak, item: stone, n: 8 }
        hint: "เก็บหิน 8 ก้อนจากฟาร์ม เอาไปให้ตาเผือกทำขอบปลัก"
        done:
          npc: "แปดก้อน… ตาเรียงเสร็จแล้ว ขาดแค่น้ำ เย็นนี้ต้อนควายไปคลองด้วยกันนะหลาน ตาจะเปิดร่องน้ำเข้าปลัก"
          options:
            - text: "ไปแน่{k}ตา"
              heart: 1
              reply: "ห้าโมงเย็น… อย่ามาสาย ควายไม่รอ"
            - text: "ตาเรียงหินเองหมดเลยเหรอ{kq}"
              heart: 1
              reply: "ไอ้กล้ามาช่วยยกสองก้อน แล้วพูดเรื่องระดับน้ำใต้ดินอีกสี่สิบนาที… ตาเรียงที่เหลือเองเร็วกว่า"
      - goal: { type: visit, place: canal, from: "16:00", to: "18:00" }
        hint: "ไปที่คลองส่งน้ำตอนเย็น ช่วยตาเผือกต้อนควายลงปลักใหม่"
        done:
          npc: "(ลูกควายเดินลงปลักใหม่เป็นตัวแรก นอนแช่โคลนแล้วถอนหายใจยาว ตาเผือกยืนมองนาน) …มันไม่ได้แช่น้ำมาสิบวัน ดูมันสิหลาน"
          options:
            - text: "ถ้าคลองแห้งอีก{p}จะขุดปลักให้ที่ฟาร์ม{k}"
              heart: 2
              set_flag: phueak_q2_farm
              reply: "…ที่ยายเอ็งมีบ่อลึกสามเมตร ยายเอ็งขุดตอนคนหัวเราะ ตาไม่ได้หัวเราะ ตาจำได้… ถ้าถึงวันนั้น ตาจะพาควายไปหา ตาจะทักเอ็งก่อน"
            - text: "ไปขอคุณธนาเปิดรั้วบ่อให้ควายเข้าไหม{kq}"
              heart: 1
              set_flag: phueak_q2_ask
              reply: "ไปขอเถอะ ตาไม่ไป ตาพูดภาษาเขาไม่ได้… เขาพูดภาษาควายไม่ได้เหมือนกัน"
            - text: "(นั่งลงริมคลองดูควายเงียบๆ)"
              heart: 1
              reply: "…นั่งจนตะวันตกดิน ตาเผือกเป่าใบไม้หนึ่งเพลง แล้วลุกขึ้น ‘กลับบ้านหลาน สามทุ่มผีออก’"
    reward: { money: 0, heart: 2, items: { hay_dry: 2 }, set_flag: phueak_q2_done, line: { from: kla, text: "ปลักควายใหม่ของตาเผือกริมคลองส่งน้ำมีน้ำแล้วนะครับ 🐃 รบกวนทุกคนอย่าทิ้งขยะลงคลองช่วงนี้ ควายนอนแช่อยู่ครับ ตาเผือกไม่ได้ฝากมาบอก ผมบอกเอง" } }

  - id: phueak_q3
    npc: phueak
    title: "คนที่ทักทุกเช้า"
    desc: "ตาเผือกเก็บหน้าสมุดของยายเพียรไว้ในกระบอกไม้ไผ่ใต้ต้นมะขามมาสิบปี"
    start: { flag: phueak_q2_done, heart_min: 4, day_min: 13 }
    offer:
      npc: "…หลาน พรุ่งนี้เช้ามาที่ทุ่ง ก่อนแปดโมง ตามีของจะให้ ของยายเอ็ง ตาเก็บไว้นานแล้ว"
      options:
        - text: "ของยายเหรอ{kq} {p}มาแน่"
          accept: true
          heart: 2
          reply: "…อืม ก่อนแปดโมง ตอนหญ้ายังมีน้ำค้าง ยายเอ็งชอบตอนนั้น"
        - text: "ทำไมตาไม่ให้ตอนนี้เลย{kq}"
          accept: true
          heart: 1
          reply: "ตอนนี้ไม่ใช่เวลา… ของยายเอ็งต้องให้ตอนเช้า ยายเอ็งมาตอนเช้าทุกวัน"
        - text: "ไว้วันหลังนะ{kq}ตา"
          heart: 0
          reply: "ตารอสิบปีแล้ว… รออีกได้ ตารอเก่ง"
    steps:
      - goal: { type: visit, place: pasture, from: "07:00", to: "08:00" }
        hint: "ไปทุ่งเลี้ยงควายตอนเช้า ก่อนแปดโมง"
        done:
          npc: "…หวัดดีหลาน"
          options:
            - text: "ตาทัก{p}ก่อน{k}… ครั้งแรกเลย"
              heart: 2
              reply: "ตาซ้อมกับไอ้ทุยมาสามวัน… ประโยคแรกในสิบปี ยากกว่าไถนาทั้งทุ่ง"
            - text: "หวัดดี{k}ตา วันนี้ฟ้าดีนะ{kq}"
              heart: 2
              reply: "…ยายเอ็งพูดประโยคนั้นทุกเช้า ‘เผือก วันนี้ฟ้าดี’ ตาไม่เคยตอบ… ฟ้าดี หลาน วันนี้ฟ้าดี"
      - goal: { type: talk, npc: phueak }
        hint: "นั่งกับตาเผือกใต้ต้นมะขาม ฟังเรื่องของยาย"
        done:
          npc: "(ตาเผือกดึงกระบอกไม้ไผ่ออกจากโคนต้นมะขาม ข้างในมีกระดาษพับสามทบ ลายมือยายเพียร) …ยายเอ็งทำหล่นไว้วันที่ไปอำเภอ ตาเก็บได้ ตาอ่านไม่คล่อง ไอ้กล้าอ่านให้ตาฟังครั้งเดียว ตาจำได้ทุกคำ… เอ็งอ่านเองเถอะ"
          set_flag: diary_phueak
          options:
            - text: "(อ่านออกเสียง) ‘วันนี้ไปอำเภอ เอาสร้อยแม่ไปขาย จ่ายค่ารังวัดทุ่งหญ้าหลังคลองให้เป็นที่สาธารณะ ใครจะมาล้อมรั้วต้องผ่านศพฉันก่อน…’"
              heart: 2
              reply: "…อ่านต่อ"
              next:
                - text: "‘…ไม่ต้องบอกเผือก เขาจะเสียใจที่ไม่มีเงินช่วย วันนี้ทักเผือกเป็นวันที่สามพันหกร้อย เขาไม่ตอบ แต่ไอ้ทุยหันมา ถ้าฉันไม่อยู่ ใครจะทักเผือก’"
                  heart: 2
                  reply: "…สร้อยแม่ยายเอ็ง ตาไม่รู้มาสิบปี ไอ้กล้าอ่านจบ ตาเดินไปนั่งใต้ต้นมะขามสามวัน เหมือนตอนเมียตาตาย… ข้างหลังมีสูตรหมักขี้ควายกับฟางที่ยายเอ็งจด ยายเอ็งจดผิดสองอย่าง ตาแก้ให้แล้ว"
                - text: "ยายทักตาวันที่สามพันหกร้อย… ตาเก็บกระดาษนี้ไว้ทำไม{kq}"
                  heart: 2
                  reply: "เพราะมันเป็นคำทักเดียวที่ตาตอบได้… ตาตอบมันทุกเช้า ในใจ สิบปี ตอนนี้ตาตอบออกเสียงได้แล้ว ให้เอ็งเก็บไว้"
            - text: "(เปิดกระดาษ ยังไม่อ่าน) ตาบอกเลย{k}ว่าข้างในยายเขียนอะไร"
              heart: 1
              reply: "…ยายเอ็งขายสร้อยแม่ไปจ่ายค่ารังวัด ให้ทุ่งหญ้าหลังคลองเป็นของทุกคน รั้วบริษัทถึงหยุดอยู่ที่ต้นสะเดา… แล้วยายเอ็งเขียนว่า ‘ถ้าฉันไม่อยู่ ใครจะทักเผือก’ ตาจำได้แค่นั้น ที่เหลือเป็นสูตรหมักขี้ควาย"
      - goal: { type: talk, npc: phueak }
        hint: "ตอบตาเผือกว่าจะทำอะไรต่อ"
        done:
          npc: "…ยายเอ็งทำให้ควายตามีที่กิน ทำให้ตามีคนทัก ตาไม่มีอะไรตอบแทนยายเอ็งแล้ว… ตาจะตอบแทนเอ็งแทน เอ็งอยากได้อะไร"
          options:
            - text: "ให้{p}มาทักตาทุกเช้า{k} ต่อจากยาย"
              heart: 2
              set_flag: phueak_end_greet
              reply: "…ทุกเช้า ก่อนแปดโมง เอ็งทัก ตาจะตอบ ตาจะไม่ค้างคำตอบใครอีกแล้ว"
            - text: "สอน{p}เลี้ยงลูกควายตัวนั้น{k}"
              heart: 2
              set_flag: phueak_end_calf
              reply: "…ลูกควายตัวนั้นเกิดบนฟางที่เอ็งซื้อมา มันเป็นของเอ็งตั้งแต่วันแรกแล้ว ตาจะสอนจนมันโต พอสองปีพามันไปอยู่บ้านยายเอ็ง ควายฝูงสุดท้ายของตาจะไม่ใช่ฝูงสุดท้าย"
            - text: "เอาหน้านี้ไปยื่น อบต. รักษาทุ่งหญ้าไว้{k}"
              heart: 2
              set_flag: phueak_end_pasture
              reply: "…ยายเอ็งสู้ไว้แล้วครั้งหนึ่ง เอ็งสู้ต่อ ตาจะไปด้วย ตาจะยืนข้างหลังเหมือนยืนข้างหลังเมียตา ตาพูดไม่เป็น แต่ตายืนเป็น"
    reward: { money: 0, heart: 2, items: { hay_dry: 1 }, set_flag: phueak_q3_done }
