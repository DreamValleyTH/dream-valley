          - text: "แล้วพรานกันยังไง{kq}"
            heart: 1
            reply: "นอนขดเท้าเข้าใต้ผ้าห่มจ้ะ อย่าให้เท้าโผล่… แล้วจุดไฟกองใหญ่ไว้ทั้งคืน ได้ยินเสียงกอยใกล้ขึ้น ให้หยุดหายใจแรงๆ แล้วนับจังหวะมัน มันกระโดดลงพื้นทีไร ให้หลบตอนนั้น"
          - text: "ชายป่าใกล้หมู่บ้านนะ{kq}"
            heart: 1
            reply: "ใกล้จ้ะ… เพราะฉะนั้นถ้าได้ยินเสียงกอย กอย แถวท้ายหมู่บ้าน อย่าเดินไปดูนะหลาน พรานแดงยังไม่ค้างป่าแล้วเลย"
      - text: "พรานแดงเชื่อผีด้วยเหรอ{kq}"
        heart: 0
        reply: "พรานทุกคนเชื่อจ้ะ คนเข้าป่าลึกไม่มีใครไม่เชื่อ… คนไม่เชื่อมักไม่ได้กลับมาเล่า"

  - id: bua_o_taew
    topic: others
    npc: "แต๋วมาเล่าข่าวให้ยายฟังทุกเย็น ข่าวเดียวกันวันละสามฉบับ ฉบับเช้า ฉบับบ่าย ฉบับเย็น… ฉบับเย็นผีเยอะที่สุด"
    options:
      - text: "ทำไมฉบับเย็นผีเยอะ{kq}"
        heart: 1
        reply: "เพราะแต๋วเล่าตอนใกล้ค่ำจ้ะ ใจมันเริ่มกลัว… เรื่องเดียวกัน ตอนเช้ามีคนเห็นแสง ตอนเย็นแสงนั้นมีหน้า มีผม แล้วยิ้มให้"
      - text: "ป้าแต๋วกลัวผีขนาดนั้นทำไมชอบเล่า{kq}"
        heart: 1
        reply: "แต๋วเล่าเพราะกลัวจ้ะหลาน… คนกลัวต้องพูดออกมา ไม่งั้นมันค้างอยู่ในอก แต๋วพูดทั้งวัน แต๋วเลยไม่เคยค้างอะไรไว้เลย"
        next:
          - text: "ยายพูดเหมือนจิตแพทย์เลย"
            heart: 1
            reply: "จิตแพทย์คืออะไรจ๊ะ… หมอใจหรือ ยายก็เป็นหมอใจมาห้าสิบปีแล้ว ไม่มีใบประกาศ มีแต่หมาก"
          - text: "ป้าแต๋วมาหายายทุกวันเลยเหรอ{kq}"
            heart: 1
            reply: "ทุกวันตั้งแต่เพียรไปจ้ะ… ก่อนหน้านั้นแต๋วไปหาเพียร เพียรไปแล้ว แต๋วเลยเลื่อนมาหายาย ยายรู้ว่าแต๋วกลัวยายเหงา ยายก็กลัวแต๋วเหงา"

quests:
  - id: bua_q1
    npc: bua
    title: "ยาหม่องสำหรับคนเดินกลางคืน"
    desc: "ยายบัวจะทำยาหม่องไพลแจกคนที่ต้องเดินทางตอนค่ำ"
    start: { heart_min: 1, day_min: 3 }
    offer:
      npc: "หลานเอ๊ย ช่วงนี้คนโดนผีจับบ่อย ยายอยากทำยาหม่องไพลแจกคนที่ต้องกลับบ้านค่ำ… ทาแล้วใจมันกล้าขึ้น ไพลยายหมดแล้ว ฟืนก็หมด ช่วยยายหน่อยได้ไหมจ๊ะ"
      options:
        - text: "ได้{k}ยาย ต้องใช้อะไรบ้าง"
          accept: true
          heart: 2
          reply: "ไพลสองหัวจากตลาด แผงหลังนะหลาน แล้วก็ไม้ฟืนสามท่อน ยายต้องเคี่ยวไฟอ่อนทั้งบ่าย… ระหว่างเคี่ยวยายเล่าเรื่องให้ฟัง"
        - text: "ยาหม่องกันผีได้จริงเหรอ{kq}"
          accept: true
          heart: 1
          reply: "กันผีไม่ได้หรอกจ้ะ กันใจสั่นได้… คนใจไม่สั่นวิ่งหนีผีได้ไกลกว่า ยายทำมาห้าสิบปี เชื่อยาย"
        - text: "ซื้อที่ร้านขายยาก็ได้นะ{kq}"
          reply: "ได้จ้ะ ยาเภสัชมดก็ดี… แต่ของยายมันมีคำอวยพรอยู่ในนั้นด้วย ไม่เป็นไรหลาน ไว้ว่างค่อยมาช่วย"
    steps:
      - goal: { type: give, npc: bua, item: plai, n: 2 }
        hint: "ซื้อไพล 2 หัวที่ตลาด แล้วเอาไปให้ยายบัว"
        done:
          npc: "ไพลแผงหลังจริงด้วย หัวแน่น กลิ่นแรง… หลานเลือกเป็นนะ หรือป้าคนขายเลือกให้ ช่างเถอะ ไพลดีก็คือไพลดี"
          options:
            - text: "ป้าคนขายฝากสวัสดียายด้วย"
              heart: 1
              reply: "แม่ของป้าคนนั้นเคยมาขอยาแก้ไข้ยายตอนเขายังอุ้มลูกอยู่จ้ะ… ตลาดนี้เป็นญาติกันหมด ด้วยไข้ด้วยยา"
            - text: "{p}เลือกเองนะ{k}ยาย"
              heart: 1
              reply: "เก่งจ้ะ… มือหมอยามันเริ่มขึ้นมาแล้ว ยายเห็น"
      - goal: { type: give, npc: bua, item: wood, n: 3 }
        hint: "เอาไม้ฟืน 3 ท่อนไปให้ยายบัวใช้เคี่ยวยา"
        done:
          npc: "ไฟติดแล้ว… หลานรู้ไหมว่าทำไมยายทำยาหม่องให้คนเดินกลางคืน เมื่อก่อนไม่ต้องทำเยอะ ที่สะพานข้ามคลองมีตะเกียงจุดทุกคืน คนข้ามไม่ค่อยโดนอะไร ตั้งแต่เพียรไป ตะเกียงดวงนั้นก็ดับ ยายไม่รู้ทำไมมันดับพร้อมกัน"
          options:
            - text: "ใครเป็นคนจุดตะเกียง{kq}"
              heart: 1
              reply: "ยายเชื่อว่าตาเขาจุดจ้ะ… ตาเขาตายไปสี่สิบปีแล้ว ยายไม่เคยไปดูใกล้ๆ สักครั้ง กลัวเขาจะหายไป แล้วเขาก็หายไปจริงๆ ตอนนี้"
            - text: "ยายอยากให้{p}ไปดูไหม{kq}"
              heart: 1
              set_flag: bua_q1_curious
              reply: "หลานจะไปดูให้ยายหรือ… ยายไม่กล้าขอนะ ผีพรายแถวนั้นดุ แต่ถ้าหลานไป ไปก่อนสามทุ่ม แล้วเดินกลางสะพานนะจ๊ะ"
    sold_at: { plai: market }
    reward: { money: 100, heart: 2, items: { herbal_tea: 1 }, set_flag: bua_q1_done, line: { from: bua, text: "ยายบัวทำยาหม่องไพลไว้สามสิบกะปุก ใครต้องกลับบ้านค่ำมาเอาได้ฟรีจ้า ทาขมับ ทาข้อเท้า อย่าทาตา (หลานยายเพียรช่วยพิมพ์ ยายพิมพ์ไม่เป็น)" } }

  - id: bua_q2
    npc: bua
    title: "ตะเกียงริมสะพาน"
    desc: "ตะเกียงที่หัวสะพานดับตั้งแต่ยายเพียรเสีย ใครเป็นคนจุดมาตลอด"
    start: { flag: bua_q1_done, heart_min: 3, day_min: 6 }
    offer:
      npc: "หลานยังอยากไปดูสะพานให้ยายอยู่ไหมจ๊ะ… เมื่อคืนลูกยายโทรมาจากกรุงเทพฯ ถามว่าตะเกียงยังจุดอยู่ไหม ยายโกหกลูกว่ายังจุด ยายโกหกลูกครั้งแรกในชีวิต"
      options:
        - text: "ไป{k}ยาย คืนนี้เลย"
          accept: true
          heart: 2
          reply: "ไปตอนสองทุ่มนะหลาน กลับก่อนสามทุ่ม… ดูที่เสาหัวสะพานฝั่งวัด ตะเกียงเคยแขวนอยู่ตรงนั้น ถ้ามีอะไรเรียกชื่อครั้งเดียว อย่าขาน"
        - text: "ตอนกลางวันไปไม่ได้เหรอ{kq}"
          accept: true
          heart: 1
          reply: "กลางวันก็เห็นแค่เสา หลานเอ๊ย… ของบางอย่างต้องดูตอนที่มันเคยอยู่ ไปช่วงหัวค่ำนะ ยังไม่ถึงเวลาผีออก"
        - text: "{p}กลัวผีพราย{k}"
          reply: "ยายเข้าใจจ้ะ ยายก็กลัว กลัวมาสี่สิบปี… ไว้หลานกล้าเมื่อไหร่ค่อยไปนะ"
    steps:
      - goal: { type: visit, place: canal, from: "20:00", to: "20:45" }
        hint: "ไปที่สะพานข้ามคลองช่วงสองทุ่ม ดูเสาหัวสะพานฝั่งวัด (กลับก่อนสามทุ่ม!)"
        done:
          npc: "(ที่เสาหัวสะพานมีตะขอเหล็กเก่าขึ้นสนิม คราบเขม่าดำบนเสาเป็นวงซ้อนกันหนาเตอะ… ใต้เสามีกระป๋องน้ำมันก๊าดเก่าวางคว่ำอยู่ ข้างกระป๋องมีไม้ขีดห่อพลาสติกกันชื้นไว้อย่างดี)"
          options:
            - text: "(เก็บไม้ขีดกับกระป๋องกลับไปให้ยายดู)"
              heart: 1
              reply: "(ระหว่างเดินกลับ น้ำในคลองกระเพื่อมเบาๆ ทั้งที่ลมไม่พัด… ไม่มีเสียงเรียกชื่อ)"
            - text: "(ทิ้งไว้ที่เดิม แล้วรีบเดินกลับกลางสะพาน)"
              heart: 0
              reply: "(ไม้ขีดห่อพลาสติกยังวางอยู่ตรงนั้น เหมือนมีคนตั้งใจเตรียมไว้ใช้คืนพรุ่งนี้… แต่คืนพรุ่งนี้ไม่เคยมาถึง)"
      - goal: { type: talk, npc: taew }
        hint: "ถามป้าแต๋วว่าใครเคยซื้อน้ำมันก๊าดเป็นประจำ"
        done:
          npc: "น้ำมันก๊าดเหรอหลาน… ทั้งตำบลมีคนซื้ออยู่คนเดียว ทุกวันเสาร์ ขวดละลิตรมาสามสิบปี ป้าไม่ได้พูดนะ… ยายเพียรไง ป้าถามว่าเอาไปทำอะไร บ้านก็มีไฟฟ้าแล้ว ยายบอกว่า ‘ไว้จุดไล่ยุง’ ไล่ยุงอะไรสามสิบปีหลาน"
          options:
            - text: "ป้าไม่เคยสงสัยเลยเหรอ{kq}"
              heart: 1
              reply: "สงสัยสิ! แต่ยายเพียรมองป้าแบบที่แปลว่า ‘อย่าถาม’… ป้าเลยไม่ถาม ป้าเก็บความสงสัยไว้สามสิบปี ป้าเก่งไหมล่ะ"
            - text: "ป้าเก็บความลับนี้ไว้ก่อนนะ{kq}"
              heart: 1
              reply: "ป้ายังไม่รู้เลยว่าความลับคืออะไร… แต่ถ้าหลานขอ ป้าจะทำหน้าไม่รู้ ป้าทำเก่งขึ้นแล้วนะ ฝึกกับป้าพรมา"
      - goal: { type: talk, npc: bua }
        hint: "กลับไปบอกยายบัวว่าเจออะไรที่สะพาน"
        done:
          npc: "กระป๋องน้ำมันก๊าด… ไม้ขีดห่อพลาสติก เพียรห่อไม้ขีดแบบนี้ทุกกล่องเพราะกลัวชื้น… หลานเอ๊ย ยายมีของอย่างหนึ่ง เพียรฝากยายไว้ก่อนเข้าโรงพยาบาล บอกว่า ‘ถ้าหลานถามเรื่องตะเกียง ค่อยให้’ ยายอ่านหนังสือไม่ออก ยายไม่เคยรู้ว่าข้างในเขียนอะไร… หลานอ่านเองนะ อ่านในใจก็ได้"
          options:
            - text: "(อ่านในใจ)"
              heart: 2
              set_flag: bua_q2_read_silent
              reply: "(หน้าสมุดบันทึกของยายเขียนว่า: ‘คืนน้ำหลากปีนั้น ลูกบัวตกคลองที่หัวสะพาน ฉันกระโดดลงไปดึงขึ้นมาได้ แล้ววิ่งหนีกลับบ้านทั้งตัวเปียก เพราะได้ยินบัวร้องว่าตาเขากลับมาช่วยลูก บัวเพิ่งเสียผัว ให้บัวเชื่อแบบนั้นเถอะ ฉันจะจุดตะเกียงที่สะพานทุกคืนแทนเขา จะได้ไม่มีเด็กคนไหนตกอีก ถ้าฉันไม่อยู่แล้ว หลานเอ๊ย ช่วยยายจุดต่อด้วยนะ’)"
            - text: "(อ่านในใจช้าๆ แล้วจับมือยายไว้)"
              heart: 2
              set_flag: bua_q2_held_hand
              reply: "(หน้าสมุดเขียนว่า: ‘คืนน้ำหลากปีนั้น ลูกบัวตกคลองที่หัวสะพาน ฉันกระโดดลงไปดึงขึ้นมาได้ แล้ววิ่งหนีกลับบ้านทั้งตัวเปียก เพราะได้ยินบัวร้องว่าตาเขากลับมาช่วยลูก บัวเพิ่งเสียผัว ให้บัวเชื่อแบบนั้นเถอะ ฉันจะจุดตะเกียงที่สะพานทุกคืนแทนเขา ถ้าฉันไม่อยู่แล้ว หลานเอ๊ย ช่วยยายจุดต่อด้วยนะ’… ยายบัวบีบมือตอบเบาๆ ไม่ถามสักคำว่าในนั้นเขียนอะไร)"
    reward: { money: 0, heart: 2, set_flag: diary_bua }

  - id: bua_q3
    npc: bua
    title: "ไฟดวงที่ไม่มีใครจุด"
    desc: "ยายเพียรขอให้หลานจุดตะเกียงที่สะพานต่อ… แล้วจะบอกยายบัวว่าอย่างไร"
    start: { flag: diary_bua, heart_min: 4 }
    offer:
      npc: "หลานเอ๊ย… ไม่ว่าหลานอ่านอะไรในกระดาษนั้น ยายขออย่างเดียวนะ ลูกยายจะโทรมาอีกวันอาทิตย์ ยายอยากตอบลูกได้โดยไม่ต้องโกหก ว่าตะเกียงที่สะพานยังจุดอยู่"
      options:
        - text: "{p}จะจุดให้เอง{k}ยาย"
          accept: true
          heart: 2
          reply: "จริงหรือหลาน… จุดก่อนสองทุ่มนะ แล้วรีบกลับ ยายจะนั่งดูจากใต้ถุนบ้าน มองเห็นไฟริบๆ จากตรงนี้พอดี"
        - text: "ต้องจุดทุกคืนเลยเหรอ{kq}"
          accept: true
          heart: 1
          reply: "ไม่ต้องทุกคืนจ้ะ… ขอแค่คืนที่ลูกยายโทรมา กับคืนที่น้ำขึ้น ยายจะบอกหลานเองว่าคืนไหน"
        - text: "ไม่อยากไปสะพานตอนกลางคืนแล้ว{k}"
          reply: "ไม่เป็นไรจ้ะหลาน… ยายจะบอกลูกว่ามันดับไปแล้ว ลูกยายโตแล้ว เขาคงเข้าใจ"
    steps:
      - goal: { type: visit, place: canal, from: "19:00", to: "20:30" }
        hint: "ไปจุดตะเกียงที่หัวสะพานฝั่งวัดช่วงหัวค่ำ"
        done:
          npc: "(ไส้ตะเกียงติดไฟช้าๆ แสงส้มสะท้อนในน้ำคลอง… ไกลออกไปทางบ้านยายบัว มีไฟตะเกียงอีกดวงหนึ่งยกขึ้นลงสามครั้ง เหมือนมีคนโบกตอบ)"
          options:
            - text: "(โบกไฟตอบยายสามครั้ง)"
              heart: 2
              reply: "(ไฟฝั่งบ้านยายนิ่งไปนาน แล้วค่อยๆ ลดลงวางกับพื้น… คืนนั้นน้ำในคลองไม่กระเพื่อมสักครั้ง)"
            - text: "(รีบเดินกลับก่อนสามทุ่ม)"
              heart: 1
              reply: "(ระหว่างเดินกลับ ได้ยินเสียงอะไรบางอย่างในน้ำว่ายเลี่ยงออกไปจากแสงตะเกียง… ไม่มีเสียงเรียกชื่อ)"
      - goal: { type: days, n: 1 }
        hint: "รอวันอาทิตย์ที่ลูกยายบัวจะโทรมา"
      - goal: { type: talk, npc: bua }
        hint: "ไปหายายบัวหลังลูกโทรมา"
        done:
          npc: "ลูกยายโทรมาแล้วจ้ะ… ยายบอกว่า ‘ยังจุดอยู่ลูก’ ยายไม่ได้โกหก ลูกยายร้องไห้ในโทรศัพท์ บอกว่าจะกลับมาสงกรานต์นี้ จะมาดูตะเกียงกับตา… หลานเอ๊ย ยายต้องรู้ไหมว่าใครจุดตะเกียงมาตลอดสี่สิบปี หลานบอกยายได้นะ หรือไม่บอกก็ได้"
          options:
            - text: "ยายเพียรจุดมาตลอด{k} ตั้งแต่คืนที่ช่วยลูกยาย"
              heart: 2
              set_flag: bua_told_truth
              reply: "… เพียรเองหรือ ยายควรรู้นะ ยายควรรู้ตั้งแต่สี่สิบปีก่อน แต่เพียรรู้ว่าตอนนั้นยายต้องการตามากกว่าเพื่อน… เพียรเอ๊ย ไม่ยอมให้ขอบใจสักคำ ทั้งชีวิต ยายจะไปจุดธูปด่าเพียรคืนนี้ ด่าทั้งน้ำตา"
            - text: "ตาคงยังเฝ้ายายอยู่{k}"
              heart: 2
              set_flag: bua_kept_belief
              reply: "จริงหรือหลาน… ยายรู้ว่าหลานใจดี ยายแก่แล้วแต่ไม่ได้โง่นะ… ยายจะเชื่อแบบที่หลานบอก เพราะเพียรก็อยากให้ยายเชื่อแบบนี้ ใช่ไหมจ๊ะ ไม่ต้องตอบ"
            - text: "ตากับยายเพียรช่วยกันเฝ้ายายอยู่"
              heart: 2
              set_flag: bua_both_kept
              reply: "สองคน… ยายชอบคำตอบนี้ที่สุดจ้ะ ตาเฝ้าอยู่ในใจ เพียรเฝ้าอยู่ที่สะพาน แล้วตอนนี้หลานก็จุดไฟต่อ ยายมีคนเฝ้าสามคนแล้ว ยายจะกลัวผีอะไรอีก"
    reward: { money: 0, heart: 3, items: { plai: 2 }, set_flag: bua_q3_done, line: { from: bua, text: "ตะเกียงที่หัวสะพานฝั่งวัดกลับมาจุดแล้วจ้า ข้ามสะพานตอนค่ำเดินกลางๆ นะลูกหลาน อย่าชะโงกดูน้ำ 🏮 (หลานยายเพียรพิมพ์ให้ ยายบัวพูดเอง)" } }

  - id: bua_q4
    npc: bua
    title: "ตำรายาที่ไม่มีใครจด"
    desc: "ยายบัวกลัวลืมสูตรยาห้าสิบปี จะส่งต่อวิชาให้ใคร"
    start: { flag: bua_q3_done, heart_min: 6, day_min: 14 }
    offer:
      npc: "หลานเอ๊ย… เมื่อเช้ายายต้มยาแก้ไข้ ยายลืมว่าใส่บอระเพ็ดไปแล้วหรือยัง ยายยืนหน้าหม้อนานมาก… ยายว่าถึงเวลาแล้วนะ ยายต้องส่งวิชาให้ใครสักคน ช่วยยายหน่อยได้ไหมจ๊ะ"
      options:
        - text: "ได้{k} เริ่มเมื่อไหร่ดี"
          accept: true
          heart: 2
          reply: "ตีห้าครึ่งพรุ่งนี้จ้ะ ตอนน้ำค้างยังอยู่บนใบ ใบไม้บอกตัวเองชัดที่สุดตอนนั้น… เอาขมิ้นชันมาด้วยนะ แล้วถ้ามีน้ำผึ้งป่า ยายจะสอนสูตรที่ไม่เคยสอนใคร"
        - text: "{p}จดได้ แต่ไม่รู้ว่าจะเป็นหมอยาไหวไหม"
          accept: true
          heart: 1
          reply: "ไม่ต้องเป็นหมอยาจ้ะ… จดไว้ก่อน วันหนึ่งใครอยากรู้จะได้มีที่ให้เปิด ยายไม่อยากให้มันตายไปพร้อมยาย"
        - text: "ยายยังจำได้อีกนาน{k}"
          reply: "หลานใจดีจ้ะ… แต่หม้อยาไม่ใจดีเหมือนหลาน ไว้หลานพร้อมแล้วค่อยมานะ"
    steps:
      - goal: { type: give, npc: bua, item: turmeric, n: 2 }
        hint: "ซื้อขมิ้นชัน 2 แง่งที่ตลาดไปให้ยายบัว"
        done:
          npc: "ขมิ้นชัน… ยายสอนสูตรแรกนะ ขมิ้นตำกับปูนแดงนิดหนึ่ง ทาแผลน้ำกัดเท้า… หลานจดหรือยัง จดว่า ‘นิดหนึ่ง’ นะ นิดหนึ่งคือปลายเล็บก้อย ไม่ใช่เล็บโป้ง"
          options:
            - text: "จดแล้ว{k} ปลายเล็บก้อย"
              heart: 1
              reply: "ดีจ้ะ… ตาของยายไม่เคยบอกว่านิดหนึ่งคือเท่าไหร่ ยายเดามาสิบปี หลานไม่ต้องเดาแล้ว"
            - text: "วาดรูปใบไม้ประกอบด้วยได้ไหม{kq}"
              heart: 2
              reply: "ได้สิจ๊ะ… ยายอ่านไม่ออก แต่ดูรูปได้ หลานวาดแล้วยายชี้ให้ว่าถูกไหม เราสองคนทำหนังสือที่ยายอ่านได้ด้วย"
      - goal: { type: give, npc: bua, item: honey, n: 1 }
        hint: "หาน้ำผึ้งป่าไปให้ยายบัว สำหรับสูตรที่ไม่เคยสอนใคร"
        done:
          npc: "น้ำผึ้งป่า… สูตรนี้ยายไม่เคยสอนใคร ยาแก้ไอเด็ก มะขามป้อมเคี่ยวกับน้ำผึ้ง ยายทำให้ลูกยายทุกคน ทำให้หลานด้วยตอนหลานสามขวบไอทั้งคืนที่บ้านเพียร… หลานจำไม่ได้หรอก แต่ยายจำได้"
          options:
            - text: "ยายเคยรักษา{p}ด้วยเหรอ{kq}"
              heart: 2
              reply: "หลายครั้งจ้ะ… เพียรอุ้มหลานมาเคาะประตูยายตอนตีสอง ไม่ได้ร้องไห้ แต่มือสั่น เพียรมือสั่นครั้งเดียวในชีวิตที่ยายเห็น คือตอนหลานไข้ขึ้น"
            - text: "ทำไมสูตรนี้ไม่เคยสอนใคร{kq}"
              heart: 1
              reply: "เพราะยายทำให้แต่คนที่ยายรักจ้ะ… สูตรนี้มันไม่ได้มีแค่มะขามป้อมกับน้ำผึ้ง ยายเลยไม่รู้จะสอนส่วนที่เหลือยังไง"
      - goal: { type: visit, place: house_bua, from: "06:00", to: "07:30" }
        hint: "ไปบ้านยายบัวตอนเช้าตรู่ เรียนดูใบไม้ตอนน้ำค้างยังอยู่"
        done:
          npc: "ดูนะหลาน… ใบย่านางตอนเช้าห่อเข้า ใบฟ้าทะลายโจรตั้งตรง ใบบัวบกเปิดหาแดด ใบไม้บอกเราว่ามันพร้อมให้เก็บไหม… สามสิบเจ็ดสูตรที่ยายสอนวันนี้ หลานจดได้ครบหรือยัง"
          options:
            - text: "ครบ{k} รวมสูตรที่สามสิบแปดด้วย"
              heart: 2
              reply: "สามสิบแปดหรือ… ยายยังหาส่วนผสมสุดท้ายไม่เจอนะหลาน หลานเขียนว่าอะไรลงไป… ‘ถามยายบัว’ หรือ ฮ่าๆ หลานเอ๊ย ยายจะอยู่ให้หลานถามนานๆ"
            - text: "เยอะมาก{k} มือหงิกเลย"
              heart: 1
              reply: "ยายท่องจากปากตามาหนึ่งปีจ้ะ หลานจดเช้าเดียว… หลานโชคดีกว่ายายเยอะ ไปนวดมือด้วยยาหม่องยายเสีย"
      - goal: { type: talk, npc: bua }
        hint: "ตัดสินใจกับยายบัวว่าตำรายานี้จะไปอยู่ที่ไหน"
        done:
          npc: "สมุดเล่มนี้ตอนนี้มีทุกอย่างที่ยายรู้แล้วจ้ะหลาน… ยายอยากให้หลานเลือกว่ามันจะอยู่ที่ไหน ยายแก่แล้ว ยายเลือกไม่เก่ง"
          options:
            - text: "{p}จะเก็บไว้แล้วเรียนต่อจากยายเอง"
              heart: 2
              set_flag: bua_heir
              reply: "หลานจะเป็นหมอยาต่อจากยายหรือ… ยายรอคำนี้มาสิบปี ไม่ต้องเก่งเหมือนยาย ขอแค่ตอนใครเคาะประตูตีสอง หลานเปิดก็พอ เหมือนที่ยายเปิดให้เพียร"
            - text: "ถ่ายเอกสารให้หมอแอนไว้ที่ รพ.สต. ด้วย"
              heart: 2
              set_flag: bua_share_ann
              reply: "ดีจ้ะ… หนูแอนจะได้รู้ว่ายาไหนของยายใช้คู่กับยาหมอได้ ยาไหนห้าม คนไข้จะได้ไม่ต้องเลือกระหว่างหมอกับยาย"
            - text: "ให้ห้องสมุดวัด ใครอยากเรียนก็ได้เรียน"
              heart: 1
              set_flag: bua_book_temple
              reply: "ห้องสมุดท่านสุเมธหรือ… ดีจ้ะ เณรต้นจะได้อ่าน ครูเต้ยจะได้พาเด็กมาดู ยายไม่อยากให้วิชาเป็นของคนเดียว ป้ายายถูกไล่เพราะคนไม่รู้ ยายอยากให้คนรู้เยอะๆ"
    sold_at: { turmeric: market }
    reward: { money: 0, heart: 3, items: { plai: 2, turmeric: 1 }, set_flag: bua_q4_done, line: { from: bua, text: "ยายบัวขอบใจทุกคนที่มาหายายห้าสิบปีนะจ๊ะ ตอนนี้สูตรยายมีคนจดไว้แล้ว ยายตายไปก็ไม่หาย 🌿 (ยายบัวพูด หลานพิมพ์ ห้ามแก้คำยาย)" } }
