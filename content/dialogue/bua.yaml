            heart: 2
            reply: "ใช่จ้ะ… เปรตไม่ได้น่ากลัว เปรตน่าสงสาร เป็นคนที่ตอนมีชีวิตไม่เคยแบ่งใคร วันสารทหลานกรวดน้ำให้ยายเพียรด้วยนะ แล้วแบ่งให้ใครก็ไม่รู้ที่ไม่มีลูกหลานด้วย"
          - text: "ถ้าเจอเปรตต้องทำไง{kq}"
            heart: 1
            reply: "เดินใต้เสาไฟจ้ะ เปรตไม่เข้าแสงไฟ… แล้วอย่าเผลอกินของต่อหน้าเปรต ยายว่ามันจะเดินตามเราไปถึงบ้าน"
      - text: "{p}ช่วยกวนได้นะ{kq}"
        heart: 2
        reply: "ดีจ้ะ กวนกระยาสารทต้องใช้แรงสองคน… หลานกวน ยายเล่าเรื่องผี กวนเสร็จหลานจะแขนแข็งแรงกับขนลุกไปพร้อมกัน"

  - id: bua_n_ton
    topic: news
    npc: "ยายเห็นลุงสมหมายไปยืนรอเณรต้นหน้ากุฏิแต่เช้าอีกแล้ว… ยายเลยไปยืนรอด้วย เล่าเรื่องผีปอบให้ลุงฟังจนลุงลืมถามเลข"
    options:
      - text: "ยายช่วยเณรเลย"
        heart: 2
        reply: "เด็กมันกลัวฝันผิดจ้ะหลาน ยายเห็นแล้วสงสาร… ยายเลยบอกลุงว่าฝันเด็กห้ามเอามาตีเลข ไม่งั้นผีเด็กวัดจะตามไปนั่งข้างหมอนลุง ลุงหน้าซีดเลย"
        next:
          - text: "ผีเด็กวัดมีจริงเหรอ{kq}"
            heart: 0
            reply: "ยายแต่งเองจ้ะหลาน… ยายแต่งเรื่องผีครั้งแรกในชีวิต ขอแค่ครั้งนี้ อย่าบอกใครนะ ยายอาย"
          - text: "ลุงสมหมายจะเลิกไหม{kq}"
            heart: 1
            reply: "ไม่เลิกหรอกจ้ะ ลุงเปลี่ยนไปถามถ่านหมาวัดแทน… หมามันฝันไม่บอกใคร ปลอดภัยดี"
      - text: "ลุงสมหมายไม่กลัวผีเหรอ{kq}"
        heart: 1
        reply: "กลัวที่สุดในตำบลจ้ะ แต่อยากถูกหวยมากกว่ากลัว… คนเรามีความอยากอย่างเดียวที่ชนะความกลัวได้ ลุงสมหมายมีเรื่องหวยนี่แหละ"

  # ===== advice =====
  - id: bua_a_name_call
    topic: advice
    when: { time: evening }
    npc: "หลานเอ๊ย จำไว้นะ… ตอนกลางคืนถ้ามีเสียงเรียกชื่อหลานครั้งเดียว ห้ามขานรับ คนเรียกจริงเขาเรียกสองครั้งเสมอ"
    options:
      - text: "ถ้าขานรับแล้วจะเป็นไง{kq}"
        heart: 1
        reply: "ผีมันจะรู้ว่าหลานอยู่ตรงไหนจ้ะ… สมัยยายสาวๆ มีหนุ่มคนหนึ่งขานรับเสียงแม่เรียกจากชายป่า แม่เขานอนอยู่บ้าน เขาเดินตามเสียงไป สามวันถึงเจอ นั่งยิ้มอยู่บนต้นไม้สูง ลงไม่ได้ จำใครไม่ได้"
        next:
          - text: "แล้วเขาหายไหม{kq}"
            heart: 1
            reply: "หายจ้ะ ตายายทำขวัญเรียกขวัญเจ็ดวัน… แต่เขาไม่กล้าออกจากบ้านหลังพระอาทิตย์ตกอีกเลยทั้งชีวิต แต่งงานมีลูกหลานก็ยังไม่ออก"
          - text: "แล้วถ้าเป็นเสียงยายเรียกล่ะ{kq}"
            heart: 2
            reply: "ยายจะเรียกสองครั้งเสมอจ้ะหลาน… ‘หลานเอ๊ย หลานเอ๊ย’ ถ้าได้ยินครั้งเดียว ไม่ใช่ยายแน่ ยายรักหลานพอจะเปลืองเสียงเพิ่มอีกคำ"
      - text: "ยายขู่ให้{p}กลัวหรือเปล่า{kq}"
        heart: 0
        reply: "ยายไม่ได้ขู่ ยายเตือนจ้ะ… ไม่เชื่อก็ไม่เป็นไร แค่อย่าขานรับ ทำง่ายกว่าเชื่ออีก"

  - id: bua_a_whistle
    topic: advice
    npc: "อย่าผิวปากตอนกลางคืนนะหลาน… โบราณว่าผิวปากเรียกลม เรียกงู เรียกของที่ไม่ใช่คน ยายเห็นคนกรุงเทพฯ มาเที่ยวผิวปากริมคลองตอนค่ำ ยายใจหายแทน"
    options:
      - text: "แล้วเขาเป็นอะไรไหม{kq}"
        heart: 1
        reply: "คืนนั้นเขาบอกว่ามีเสียงผิวปากตอบมาจากกลางคลอง ทำนองเดียวกันทุกตัวโน้ต… กลางคลองไม่มีเรือสักลำนะหลาน เขาเก็บกระเป๋ากลับกรุงเทพฯ ตั้งแต่ตีห้า"
      - text: "{p}ชอบผิวปากเวลาทำงาน{k}"
        heart: 1
        reply: "กลางวันผิวได้จ้ะหลาน ยายไม่ว่า… ตะวันตกเมื่อไหร่ เปลี่ยนเป็นฮัมเพลงแทน ฮัมเบาๆ ผีมันไม่ตอบเสียงฮัม"
        next:
          - text: "ทำไมฮัมได้แต่ผิวไม่ได้{kq}"
            heart: 0
            reply: "ยายก็ไม่รู้จ้ะหลาน แม่ยายบอกมาแบบนี้ ยายก็ทำตาม… บางเรื่องไม่ต้องรู้ว่าทำไม ทำตามแล้วยังมีชีวิตอยู่ก็พอ"
          - text: "งั้นฮัมเพลงรำวงก็ได้"
            heart: 1
            reply: "ได้สิจ๊ะ ยายร้องให้ฟังก็ได้ รำวงยายเก่งนะ… เสียงยายไม่เพราะ ผีได้ยินยังเดินหนี"

  - id: bua_a_bridge
    topic: advice
    when: { rain: true }
    npc: "ฝนตกน้ำคลองขึ้นแบบนี้ ข้ามสะพานกลางคืนห้ามหันกลับไปดูน้ำนะหลาน… ผีพรายเป็นคนตายน้ำ ต้องหาตัวแทนก่อนถึงจะไปเกิดได้"
    options:
      - text: "หาตัวแทนคือยังไง{kq}"
        heart: 1
        reply: "คือดึงคนลงไปแทนตัวเองจ้ะ… คนตายน้ำตรงไหน ปีต่อมามักมีคนตายตรงนั้นอีก ยายนับได้สามรายที่โค้งคลองหลังวัด ตั้งแต่ยายเด็ก"
        next:
          - text: "ยายพูดแล้วขาสั่นเลย"
            heart: 1
            reply: "สั่นก็เดินกลางสะพานไว้จ้ะ ห่างราวทั้งสองข้าง… ผีพรายขึ้นมาได้แค่ริมตลิ่ง ถ้าหลานอยู่กลาง มือมันเอื้อมไม่ถึง"
          - text: "สะพานนั้นมีไฟไหม{kq}"
            heart: 1
            reply: "เมื่อก่อนมีตะเกียงดวงหนึ่งจุดทุกคืนจ้ะหลาน… ยายไม่รู้ว่าใครจุด ยายคิดเอาเองมาตลอดว่าตาเขาจุด ตั้งแต่เพียรไปมันก็ไม่มีใครจุดอีก"
      - text: "{p}จะเลี่ยงสะพานตอนกลางคืน{k}"
        heart: 1
        reply: "ดีที่สุดจ้ะ… อ้อมไปทางวัดไกลกว่าหน่อย แต่ไกลกว่าดีกว่าเปียก"

  - id: bua_a_laundry
    topic: advice
    when: { time: evening }
    npc: "ตะวันจะตกแล้ว ผ้าที่ตากไว้หลานเก็บหรือยัง… ผ้าห้ามตากข้ามคืนนะหลาน ยายบอกตั้งแต่วันก่อนแล้วนะ"
    options:
      - text: "ลืม{k} เดี๋ยวรีบไปเก็บ"
        heart: 1
        reply: "รีบไปจ้ะ… ถ้าเก็บมาแล้วผ้าเย็นเฉียบทั้งที่แดดเพิ่งหมด อย่าใส่ผืนนั้นนะหลาน ซักใหม่ตากใหม่ตอนเช้า"
      - text: "ผ้ามันยังไม่แห้งเลย{k}"
        heart: 0
        reply: "ไม่แห้งก็ผึ่งไว้ใต้ชายคาในบ้านจ้ะ… ผ้าไม่แห้งยังซักใหม่ได้ ผ้าที่มีอะไรมาเช็ดปาก ซักไม่ออกนะหลาน"
      - text: "ยายห่วง{p}จังเลย"
        heart: 2
        reply: "ห่วงสิจ๊ะ เพียรฝากไว้… ไม่ได้ฝากด้วยปากหรอก เพียรฝากด้วยการตายก่อนยาย ยายเลยต้องห่วงแทน"

  - id: bua_a_friend_house
    topic: advice
    npc: "ถ้าคืนไหนต้องนอนบ้านคนอื่น ก่อนนอนให้ไหว้บอกเจ้าที่บ้านเขาก่อนนะหลาน บอกชื่อ บอกว่ามาจากไหน ขออาศัยคืนเดียว"
    options:
      - text: "ไม่บอกแล้วจะโดนอำเหรอ{kq}"
        heart: 1
        reply: "โดนจ้ะ… ตื่นมาตัวแข็ง ขยับไม่ได้ เห็นคนแก่นั่งทับหน้าอก หน้าตาเหมือนรูปถ่ายบนหิ้งบ้านนั้นเป๊ะ ยายโดนมาแล้วตอนไปนอนบ้านญาติ ยายจำหน้าได้ เป็นปู่ทวดเขา"
        next:
          - text: "แล้วยายทำไง{kq}"
            heart: 1
            reply: "ยายท่องในใจว่า ‘หลานบัว ลูกแม่ทองดี มาขออาศัย’… สามรอบ น้ำหนักบนอกก็เบาลง ยายลืมตาเห็นแต่เพดาน ตั้งแต่นั้นยายบอกเจ้าที่ทุกบ้านที่ไปนอน"
          - text: "{p}จะจำไว้{k}"
            heart: 1
            reply: "จำแล้วต้องทำนะหลาน… คนรุ่นใหม่จำเก่ง แต่ไม่ค่อยทำ ยายเห็นมา"
      - text: "บ้านยายเพียรต้องบอกไหม{kq}"
        heart: 1
        reply: "บ้านเพียรเป็นบ้านหลานแล้วจ้ะ ไม่ต้องขออาศัย… แต่ทักทายก็ดีนะ เข้าบ้านบอก ‘หลานกลับมาแล้ว’ เจ้าที่เขาชอบคนมีมารยาท"

  # ===== smalltalk =====
  - id: bua_s_betel
    topic: smalltalk
    npc: "หมากวันนี้ฝาดกว่าทุกวันนะหลาน… เจ๊หงษ์บอกว่าพลูจากสวนใหม่ ยายว่าเจ๊เปลี่ยนสวนเพราะถูกกว่า ยายเคี้ยวมาเจ็ดสิบปี ลิ้นยายจำได้หมด"
    options:
      - text: "ยายเคี้ยวหมากตั้งแต่กี่ขวบ{kq}"
        heart: 1
        reply: "สิบสองจ้ะ… ปีเดียวกับที่ยายเห็นกระสือ แม่บอกว่าเคี้ยวหมากแล้วฟันแข็ง ผีไม่กล้ากัด ยายเคี้ยวมาจนป่านนี้ ฟันยังอยู่สิบสี่ซี่ ผีก็ไม่เคยกัดจริงๆ"
      - text: "{p}ซื้อพลูมาฝากได้นะ{kq}"
        heart: 2
        reply: "ดีจ้ะหลาน… เลือกใบที่ขอบไม่เหลือง หลังใบเงาๆ แล้วอย่าซื้อเจ๊หงษ์แผงหน้านะ แผงหลังของป้าคนหน้าคมๆ พลูหอมกว่า"
        next:
          - text: "ยายรู้ทุกแผงในตลาดเลยเหรอ{kq}"
            heart: 1
            reply: "รู้จ้ะ ยายเดินตลาดมาก่อนตลาดจะมีหลังคา… บางแผงยายรู้ตั้งแต่แม่ของแม่ค้ายังขายอยู่"
          - text: "เคี้ยวแล้วปากแดงไม่เป็นไรเหรอ{kq}"
            heart: 0
            reply: "แดงแล้วสวยจ้ะ สมัยก่อนไม่ต้องทาปาก… หนูแอนบอกให้ยายบ้วนปากบ่อยๆ ยายบ้วนวันละครั้งเพื่อหนูแอน"
      - text: "หมากรสชาติเป็นยังไง{kq}"
        heart: 1
        reply: "ฝาด เผ็ดนิดๆ แล้วหัวจะโล่ง… ลองไหมจ๊ะ ยายห่อให้คำเล็กๆ คนรุ่นหลานลองแล้วหน้าเหมือนกินบอระเพ็ดทุกคน"

  - id: bua_s_thongkham
    topic: smalltalk
    npc: "ทองคำแมวยายคาบตุ๊กแกมาวางหน้าประตูเมื่อเช้า… ยายบอกขอบใจแล้ว ทองคำมองยายเหมือนยายไม่รู้จักบุญคุณ"
    options:
      - text: "ทองคำให้ของขวัญยาย"
        heart: 1
        reply: "ใช่จ้ะ แมวมันให้ของที่มันรัก… เหมือนคนแหละหลาน บางทีของที่เขาให้เราไม่ได้อยากได้ แต่เราต้องดูว่าเขาให้ด้วยใจแค่ไหน"
      - text: "ตุ๊กแกมีผีไหม{kq}"
        heart: 1
        reply: "โบราณว่าตุ๊กแกร้องเจ็ดครั้งจะมีโชค ร้องสามครั้งจะมีแขก… ตัวนี้ยังไม่ได้ร้องสักครั้ง ทองคำจับไปก่อน ยายเลยไม่รู้ว่าพลาดอะไรไป"
        next:
          - text: "ลุงสมหมายรู้คงเสียดาย"
            heart: 1
            reply: "ยายไม่บอกลุงหรอกจ้ะ… ลุงจะมาสัมภาษณ์ทองคำว่าจับตุ๊กแกตอนกี่โมง"
          - text: "ทองคำเก่งจัง"
            heart: 1
            reply: "เก่งแต่ขี้เกียจจ้ะ จับได้ตัวเดียวแล้วนอนทั้งวัน… แมวมันรู้จักพอ ยายชอบตรงนี้"
      - text: "แมวยายดุไหม{kq}"
        heart: 0
        reply: "ดุกับหมาจ้ะ ดีกับคน… ถ่านหมาวัดยังไม่กล้าเดินผ่านหน้าบ้านยายเลย"

  - id: bua_s_ramwong
    topic: smalltalk
    when: { time: evening }
    npc: "ได้ยินไหมหลาน หอกระจายข่าวเปิดเพลงรำวงตอนห้าโมงเย็น… มือยายขยับเองเลย สมัยสาวๆ ยายรำวงงานวัดจนรองเท้าขาด"
    options:
      - text: "ยายรำให้ดูหน่อย{k}"
        heart: 2
        reply: "อุ๊ย… ดูนะหลาน มือจีบ ข้อมือพลิก เท้าก้าวตามกลอง… โอ๊ย เข่ายาย ดูได้แค่ท่อนเดียวจ้ะ ท่อนสองเข่ายายไม่ยอม"
        next:
          - text: "สวยมาก{k}ยาย"
            heart: 2
            reply: "จริงหรือหลาน… ตาเขาก็พูดแบบนี้ตอนงานวัดปีที่เจอกัน แล้วก็รำผิดจังหวะเหยียบเท้ายายตลอดเพลง"
          - text: "ยายรำกับใคร{kq}"
            heart: 1
            reply: "กับเพียรจ้ะ… ตอนหนุ่มๆ ไม่กล้ามาขอ เราสองคนเลยรำกันเอง แล้วหนุ่มทั้งงานต้องมายืนรอคิว ยายกับเพียรรำกันจนหมดเพลง ไม่ให้ใครเลย"
      - text: "ทำไมเลิกรำล่ะ{kq}"
        heart: 1
        reply: "เข่ามันเลิกก่อนยายจ้ะ… แต่ใจยายยังรำอยู่ ทุกเย็นห้าโมงใจยายรำอยู่ใต้ถุนบ้าน ไม่มีใครเห็น"

  - id: bua_s_drama
    topic: smalltalk
    npc: "ละครหลังข่าวเมื่อคืน นางร้ายโดนผีหลอก… ยายดูแล้วขำ ผีในละครไม่เหมือนจริงเลยหลาน ผีจริงไม่ใส่ชุดขาวเดินช้าๆ หรอก"
    options:
      - text: "ผีจริงเป็นยังไง{kq}"
        heart: 1
        reply: "ผีจริงมาตอนเราไม่ได้มองจ้ะ… หางตาเราเห็นมีคนยืนข้างประตู หันไปไม่มี หันกลับมาก็ไม่มี แต่ประตูที่ปิดไว้แง้มอยู่นิ้วหนึ่ง แค่นั้นแหละ ไม่ต้องมีเพลงประกอบ"
        next:
          - text: "ยายพูดแล้วคืนนี้นอนไม่หลับเลย"
            heart: 1
            reply: "งั้นก่อนนอนปิดประตูให้สนิทแล้วลงกลอนจ้ะหลาน… ผีไม่เปิดกลอน ผีแค่แง้มประตูที่ไม่ได้ลงกลอน ยายลองมาแล้ว"
          - text: "ยายเจอแบบนั้นบ่อยไหม{kq}"
            heart: 1
            reply: "บ่อยจ้ะ ยายไม่หันไปดูแล้ว… ยายพูดลอยๆ ว่า ‘ยายรู้แล้ว ไปเถอะ’ แล้วก็ดูละครต่อ"
      - text: "ยายดูจบไหมเมื่อคืน{kq}"
        heart: 0
        reply: "ไม่จบจ้ะ สามทุ่มยายปิดไฟ… ยายไม่เคยดูละครจบสักเรื่อง ยายแต่งตอนจบเองทุกเรื่อง ของยายดีกว่าทุกเรื่อง"

  - id: bua_s_knee
    topic: smalltalk
    when: { time: morning }
    npc: "เช้านี้เข่ายายดังกรอบแกรบสามทีตอนลุก… ยายนับทุกเช้า วันไหนดังสามทีฝนไม่ตก วันไหนดังสี่ทีฝนจะตก ยายแม่นกว่าหอกระจายข่าว"
    options:
      - text: "วันนี้ฝนไม่ตกใช่ไหม{kq}"
        heart: 1
        reply: "ไม่ตกจ้ะ เชื่อเข่ายาย… ถ้าตกยายจะยอมให้หลานหัวเราะเข่ายายได้หนึ่งอาทิตย์"
      - text: "ไปให้หมอแอนดูเข่าไหม{kq}"
        heart: 1
        reply: "หนูแอนดูแล้วจ้ะ บอกว่าเข่ายายแก่… ยายบอกว่ายายก็แก่ทั้งตัว ไม่ใช่แค่เข่า หนูแอนหัวเราะแล้วให้ยาทามาหลอดหนึ่ง ยายทาคู่กับยาหม่องยาย"
        next:
          - text: "ยาไหนได้ผลกว่า{kq}"
            heart: 1
            reply: "ทาคู่กันได้ผลที่สุดจ้ะ… ยายบอกหนูแอนว่าเป็นการแพทย์ผสม หนูแอนบอกว่าห้ามเอาไปโพสต์ในกลุ่ม LINE"
          - text: "{p}นวดให้ไหม{kq}"
            heart: 2
            reply: "หลานนวดเป็นหรือจ๊ะ… มานี่ ยายสอนจุดให้ กดตรงนี้ ใต้ลูกสะบ้าสองนิ้ว อ๊ะ… ตรงนั้นแหละ หลานมือดีนะ มือหมอยาเลย"
      - text: "ยายนับเข่าทุกวันเลยเหรอ{kq}"
        heart: 0
        reply: "นับจ้ะ คนแก่ไม่มีอะไรทำตอนเช้า… นับเข่า นับหมาก นับคนที่ยังอยู่"

  - id: bua_s_rice_soup
    topic: smalltalk
    npc: "ยายต้มข้าวต้มปลาไว้หม้อใหญ่ ต้มทีไรก็ต้มเผื่อสองคน… ติดมือจ้ะหลาน ห้าสิบปีต้มเผื่อเพียรทุกเช้า"
    options:
      - text: "งั้น{p}ช่วยกินส่วนของยายเพียรให้{k}"
        heart: 2
        reply: "มาสิจ๊ะ… ถ้วยใบนี้ของเพียร ถ้วยลายไก่ เพียรใช้ใบนี้ทุกเช้า กินเลย ไม่ต้องเกรงใจ เพียรไม่ว่าหรอก เพียรจะดีใจที่หลานได้กินแทน"
        next:
          - text: "อร่อยมาก{k}ยาย"
            heart: 2
            reply: "เพียรก็พูดคำนี้ทุกเช้า… พูดทั้งที่ยายใส่เกลือลืมบ้าง ใส่ขิงมากไปบ้าง ยายเพิ่งรู้ว่าเพียรโกหกเก่ง หลานก็โกหกเก่งเหมือนยายเลย"
          - text: "ยายเพียรชอบใส่อะไรเพิ่ม{kq}"
            heart: 1
            reply: "ใส่พริกไทยเยอะๆ จ้ะ… ยายไม่กินเผ็ด เพียรเลยพกพริกไทยป่นมาเองในกระดาษพับ ทุกเช้าห้าสิบปี"
      - text: "ยายไม่ต้องต้มเผื่อแล้วนะ"
        heart: 0
        reply: "ยายรู้จ้ะหลาน… แต่มือยายยังไม่รู้"

  # ===== self =====
  - id: bua_f_healer
    topic: self
    npc: "ยายไม่ได้อยากเป็นหมอยาหรอกหลาน ยายอยากเป็นแม่ค้าขายผ้า… แต่ตายายป่วยตอนยายสิบหก ไม่มีใครรู้สูตรยาต่อ ยายเลยต้องรู้"
    options:
      - text: "ยายเรียนจากใคร{kq}"
