# ยายบัว — หมอพื้นบ้าน รู้เรื่องผี (อบอุ่น ไม่มีตลกร้าย เล่าผีให้ขนลุกแล้วปิดด้วยวิธีเอาตัวรอด) · ตัวหลัก 34–40 บท
convos:
  # ===== react =====
  - id: bua_r_meet
    topic: react
    once: true
    when: { not_flag: met_bua }
    npc: "หลานเอ๊ย… หลานเพียรใช่ไหม มานี่ ยายขอดูหน้าหน่อย คิ้วเหมือนเพียรเลย คิ้วคนดื้อ ยายบัวจ้ะ เพื่อนยายหลานมาตั้งแต่ยังนุ่งผ้าถุงตัวเดียวกันได้"
    set_flag: met_bua
    options:
      - text: "ยายบัว ยายเพียรพูดถึงบ่อย{k}"
        heart: 1
        reply: "พูดว่าไงจ๊ะ ว่ายายบ่นใช่ไหม… เพียรน่ะชอบบอกใครต่อใครว่ายายบ่น ตัวเองบ่นกว่ายายอีก บ่นอยู่ทุกวันว่าหลานไม่กินข้าว"
        next:
          - text: "ยายรู้ด้วยเหรอว่า{p}ไม่กินข้าว"
            heart: 1
            reply: "เพียรรู้จ้ะ หลานโทรมาเสียงแหบทุกที เพียรบอกยายว่า ‘เสียงคนกินมาม่าสามมื้อ’… ยายไม่รู้จักมาม่าดีหรอก แต่ยายเชื่อเพียร"
          - text: "ยายสองคนสนิทกันมากเลยนะ"
            heart: 1
            reply: "สนิทจนทะเลาะกันได้ทุกเรื่องจ้ะ… แล้วก็คืนดีกันทุกเย็น ห้าสิบกว่าปี ยายยังไม่ชินเลยว่าเย็นนี้ไม่มีใครมาคืนดีด้วย"
      - text: "ยายเป็นหมอผีใช่ไหม{kq}"
        heart: 0
        reply: "หมอยาจ้ะหลาน หมอยา… ผีน่ะยายรู้จัก แต่ไม่ได้เลี้ยง ใครพูดว่ายายเลี้ยงผีให้มาพูดต่อหน้ายาย ยายจะให้ดูแมวทองคำ แมวยายดุกว่าผี"
      - text: "สวัสดี{k}ยาย"
        heart: 1
        reply: "สวัสดีจ้ะ… ไหว้สวยเหมือนเพียรสอน เพียรสอนหลานไหว้ตั้งแต่ยังเดินไม่แข็ง ไหว้แล้วล้มทุกที"

  - id: bua_r_fainted
    topic: react
    when: { fainted_recent: true }
    npc: "หลานเอ๊ย… มานี่ นั่งลง ยายเป่ากระหม่อมให้ก่อน เฟี้ยว… ขวัญเอ๋ยขวัญมา เมื่อคืนเจอตัวไหน บอกยายมาเลย"
    options:
      - text: "ไม่ทันเห็น{k} มันมาข้างหลัง"
        heart: 1
        reply: "ข้างหลังหรือ… ถ้าได้ยินเสียงฝีเท้าแต่หันไปไม่เห็นใคร นั่นผีปอบจ้ะ มันชอบเดินตามระยะเท่าเดิม อย่าหยุดเดิน เก็บแรงไว้วิ่งตอนเสียงมันเร็วขึ้น"
        next:
          - text: "ยายรู้ได้ไงเนี่ย{kq}"
            heart: 1
            reply: "ยายโดนมาแล้วสามหน หลานเอ๊ย… หนแรกยายวิ่งตั้งแต่ได้ยินเสียง หมดแรงกลางทุ่ง หนที่สองยายเดินเฉยๆ แล้ววิ่งตอนมันใกล้ รอดมาเคี้ยวหมากได้จนป่านนี้"
          - text: "ไม่อยากฟังแล้ว{k} กลัว"
            heart: 0
            reply: "กลัวก็ดีจ้ะ คืนนี้จะได้กลับบ้านก่อนสามทุ่ม… ยายพูดเพราะรักนะหลาน ไม่ได้พูดให้ขนลุกเล่น"
      - text: "มันลอยได้ด้วย{k}"
        heart: 1
        reply: "ลอยแล้วมีแสงวูบวาบหรือ… กระสือจ้ะ มันข้ามรั้วได้ แต่มันชอบหายแล้วโผล่ ตอนมันหายให้รีบเปลี่ยนทาง มันจำทางเก่าได้ จำทางใหม่ไม่ทัน"
      - text: "ไม่มีผีหรอก{k} {p}แค่เหนื่อย"
        heart: -1
        reply: "จ้ะ ไม่มีก็ไม่มี… แต่คนเหนื่อยไม่ได้มีรอยมือเย็นๆ ที่ข้อเท้านะหลาน ยายเห็นตั้งแต่หลานเดินเข้ามาแล้ว"

  - id: bua_r_thana
    topic: react
    once: true
    when: { flag: story_thana_visit }
    npc: "เขามาขอซื้อที่เพียรแล้วหรือหลาน… ยายจะบอกอะไรอย่างหนึ่ง ที่ดินทุกผืนมีเจ้าของสองคน คนที่มีโฉนดกับคนที่อยู่ใต้ธรณีประตู"
    options:
      - text: "ใต้ธรณีประตูคือใคร{kq}"
        heart: 1
        reply: "เจ้าที่จ้ะหลาน… โบราณเขาห้ามเหยียบธรณีประตูเพราะเจ้าที่นั่งอยู่ตรงนั้น บ้านเพียร ธรณีประตูสึกเป็นร่องเพราะเพียรก้าวข้ามทุกวันห้าสิบปี ไม่เคยเหยียบสักครั้ง"
        next:
          - text: "แล้วเจ้าที่จะว่าไงถ้าขาย{kq}"
            heart: 1
            reply: "ยายไม่รู้หรอกหลาน… แต่ยายเห็นบ้านที่ขายให้บริษัทไปแล้วสองหลัง เจ้าของใหม่ไม่ไหว้ใคร ตอนนี้ไม่มีใครกล้าเข้าไปนอนสักคน คนงานบอกว่าได้ยินเสียงคนเดินบนเรือนทั้งคืน"
          - text: "{p}จะก้าวข้ามธรณีประตูเหมือนยายเพียร"
            heart: 2
            reply: "ดีแล้วจ้ะ… เจ้าที่บ้านเพียรรู้จักหลานตั้งแต่เด็ก หลานคลานผ่านธรณีประตูนั่นทุกวัน ไม่ต้องกลัว เขาจำได้"
      - text: "ยายจะให้{p}ขายไหม{kq}"
        heart: 0
        reply: "ยายไม่บอกหรอกหลาน ที่ของหลานแล้ว… ยายบอกได้แค่ว่าก่อนเซ็นอะไร ให้ไปจุดธูปบอกเพียรที่หิ้งก่อน เพียรเขาจะตอบหรือไม่ตอบก็ได้ แต่หลานจะได้ยินใจตัวเอง"

  - id: bua_r_well
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "บ่อยายตักขึ้นมามีแต่โคลนแล้วหลาน… สมัยก่อนเขาว่าบ่อทุกบ่อมีแม่ย่านางบ่อเฝ้า ใครถ่มน้ำลายลงบ่อ น้ำจะหนีไป… ตอนนี้ไม่มีใครถ่ม น้ำก็ยังหนี"
    options:
      - text: "น้ำหนีไปไหน{kq}"
        heart: 1
        reply: "ไปตามท่อใหญ่ๆ นั่นแหละมั้งหลาน… ยายเห็นคนงานเอาท่อมาวางตั้งแต่หน้าแล้งปีก่อน ท่อมันยาวกว่าคลองเสียอีก"
        next:
          - text: "ยายขาดน้ำใช้หรือเปล่า{kq}"
            heart: 2
            reply: "ท่านสุเมธให้ตักบ่อวัดได้จ้ะ แต่ขายายเดินหิ้วถังไม่ค่อยไหว… หลานจะช่วยยายหิ้วสักถังสองถังหรือ ยายจะต้มน้ำใบเตยไว้ให้"
          - text: "{p}จะไปบอกหมอแอนให้"
            heart: 1
            reply: "หนูแอนรู้แล้วจ้ะ มาเอาน้ำบ่อยายไปตรวจตั้งแต่เมื่อวาน… หนูแอนบอกว่าต้มก่อนกิน ยายต้มทุกอย่างอยู่แล้ว ยายเป็นหมอยา"
      - text: "แม่ย่านางบ่อมีจริงเหรอ{kq}"
        heart: 1
        reply: "ยายเคยเห็นนะหลาน ตอนเด็ก ผู้หญิงนุ่งผ้าแถบนั่งหวีผมที่ขอบบ่อตอนเดือนหงาย… ยายวิ่งไปบอกแม่ แม่ตีก้นยายเพราะออกจากบ้านตอนกลางคืน ไม่ได้ตีเพราะยายโกหก"

  - id: bua_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "ได้ยินแล้วใช่ไหมหลาน คนงานบริษัทเห็นผู้หญิงยืนบนกองท่อ… ยายบอกแล้ว ผีไม่ชอบคนดูดน้ำจากแม่ธรณี"
    options:
      - text: "ยายว่าผีตนไหน{kq}"
        heart: 1
        reply: "ยืนนิ่งไม่ไล่ใคร ผมยาวถึงเข่า… ยายว่าแม่ย่านางที่เฝ้าน้ำใต้ดินจ้ะ เขาไม่ได้มาหลอก เขามาดูว่าใครเอาของเขาไป… คนงานเห็นแล้ววิ่งทิ้งรองเท้าไว้หกคู่ ยายเห็นกองรองเท้าแล้วสงสาร"
        next:
          - text: "ยายสงสารคนงานเหรอ{kq}"
            heart: 2
            reply: "สงสารสิหลาน เด็กพวกนั้นมาหาเงินส่งแม่ ไม่ได้เป็นคนวางท่อเอง… ยายเอายาหม่องไปให้ทุกคนแล้ว บอกให้ไปขอขมาก่อนเข้างาน"
          - text: "ผีจะทำร้ายคนไหม{kq}"
            heart: 1
            reply: "ผีเฝ้าน้ำไม่ทำร้ายใครง่ายๆ หรอกจ้ะ เขาแค่ทำให้ใจคนไม่สงบ… คนใจไม่สงบนั่นแหละที่ทำร้ายกันเอง"
      - text: "หรือคนแกล้งแต่งผีไล่คนงาน{kq}"
        heart: 0
        reply: "ก็อาจเป็นได้จ้ะ… แต่ถ้าคนแกล้ง ทำไมยายได้กลิ่นดอกจำปีตอนเดินผ่านกองท่อเมื่อวาน แถวนั้นไม่มีต้นจำปีสักต้นนะหลาน"
      - text: "ยายพูดแล้วขนลุกเลย"
        heart: 1
        reply: "ขนลุกก็ดีจ้ะ ขนลุกคือร่างกายบอกให้ระวัง… คืนนี้อย่าเดินผ่านที่ดินบริษัทนะหลาน เลี่ยงไปทางวัด"

  - id: bua_r_may
    topic: react
    once: true
    when: { flag: helped_may }
    npc: "หลานไปถ่ายรูปท่อตอนกลางคืนกับเด็กนักข่าวมาใช่ไหม… ยายรู้นะ หลานมีหนามหญ้าเจ้าชู้ติดขากางเกงเต็มเลย หญ้านั่นขึ้นแค่ริมรั้วบริษัท"
    options:
      - text: "ยายอย่าบอกใครนะ{kq}"
        heart: 1
        reply: "ยายไม่บอกหรอกหลาน ยายเก็บความลับมาทั้งชีวิต… แต่คราวหน้าก่อนไป มาเอาด้ายสายสิญจน์ยายผูกข้อมือไปด้วย ที่ตรงนั้นมีของเยอะ"
        next:
          - text: "ของอะไร{kq}"
            heart: 1
            reply: "ตรงนั้นเมื่อก่อนเป็นป่าช้าเก่าจ้ะ ก่อนวัดย้ายที่เผาศพ… คนงานขุดเจอไหกระดูกไปสองใบแล้ว ไม่ได้บอกใคร ยายรู้เพราะยายได้กลิ่นธูปลอยมาตอนตีสาม"
          - text: "ขอบคุณ{k}ยาย"
            heart: 1
            reply: "ไม่ต้องขอบใจจ้ะ… เพียรก็กล้าแบบนี้แหละ กล้าแล้วยายต้องคอยผูกข้อมือตามหลังทุกที"
      - text: "ยายจะห้าม{p}ไหม{kq}"
        heart: 0
        reply: "ยายห้ามใครได้เสียที่ไหนหลาน ห้ามเพียรมาห้าสิบปียังไม่ได้สักเรื่อง… ยายขอแค่ให้กลับบ้านมาทุกครั้ง"

  - id: bua_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ยายได้ถังน้ำของบริษัทมาใบหนึ่งแล้วหลาน… ยายเอามาปลูกฟ้าทะลายโจร ใส่ดินเต็มถัง โลโก้หันเข้ากำแพง ต้นมันงามดีนะ"
    options:
      - text: "ยายเอาไปปลูกต้นไม้เลยเหรอ{kq}"
        heart: 1
        reply: "ก็น้ำไม่มีจะใส่จ้ะ จะให้ยายใส่อะไร… ถังมันดี ไม่รั่ว ยายไม่โกรธถังหรอก ถังไม่ได้ดูดน้ำบ่อยาย"
      - text: "ยายไปประชุมด้วยไหม{kq}"
        heart: 1
        reply: "ไปนั่งแถวหน้าจ้ะ ยายบอกแล้วว่าจะไป… คุณธนาพูดนานมาก ยายเคี้ยวหมากหมดสามคำ แล้วยายก็ถามเขาคำเดียว"
        next:
          - text: "ยายถามว่าอะไร{kq}"
            heart: 2
            reply: "ยายถามว่า ‘พ่อหนุ่มไหว้เจ้าที่ก่อนเจาะดินหรือยัง’… ทั้งศาลาเงียบ เขาบอกว่าจะไปศึกษาดู ยายว่าคงไม่ได้ไหว้"
          - text: "ยายอยู่ฝ่ายไหน{kq}"
            heart: 1
            reply: "ยายอยู่ฝ่ายบ่อยายจ้ะหลาน… ใครเอาน้ำกลับมาให้บ่อยายได้ ยายอยู่ฝ่ายนั้น"

  - id: bua_r_snake
    topic: react
    once: true
    when: { flag: met_snake }
    npc: "เจองูที่บ้านเพียรหรือหลาน… โบราณเขาว่างูเข้าบ้านใหม่คือญาติที่ตายไปแล้วมาเยี่ยม อย่าตีเขานะ ไล่เขาออกไปดีๆ"
    options:
      - text: "งั้นงูตัวนั้นคือยายเพียรเหรอ{kq}"
        heart: 1
        reply: "ยายไม่รู้หรอกจ้ะ… แต่ถ้าเป็นงูเขียว ตัวเล็กๆ เลื้อยช้าๆ ไม่ยอมไปไหน ยายว่าใช่ เพียรก็ไม่ยอมไปไหนง่ายๆ เหมือนกัน"
        next:
          - text: "{p}พูดกับมันดีๆ แล้ว"
            heart: 2
            reply: "ดีจ้ะ… คืนนี้จุดธูปบอกยายเพียรด้วยนะว่าหลานไม่ได้ไล่ แค่บ้านยังรกอยู่ ไว้ถางหญ้าเสร็จค่อยมาเยี่ยมใหม่"
          - text: "ยายเชื่อจริงๆ เหรอ{kq}"
            heart: 0
            reply: "ยายเชื่อครึ่งหนึ่งจ้ะ อีกครึ่งยายรู้ว่าหญ้ารก… เชื่อทั้งสองอย่างได้ หลานจะได้ถางหญ้าด้วยใจดี"
      - text: "ยายมียาแผลงูไหม{kq}"
        heart: 1
        reply: "มีจ้ะ ยายต้มรากไม้เจ็ดชนิด ทาแล้วเย็นดี… แต่ถ้าโดนงูพิษจริงไปหาหนูแอนนะหลาน ยายกับหนูแอนตกลงกันไว้แล้ว ยายรักษาความกลัว หนูแอนรักษาพิษ"

  - id: bua_r_kitten
    topic: react
    once: true
    when: { flag: kitten_promise }
    npc: "จะรับลูกแมวป้าแต๋วไปเลี้ยงหรือหลาน… ดีจ้ะ บ้านเพียรมีแมวแล้วผีไม่ค่อยกล้าเข้า แมวมันเห็นผีก่อนคน"
    options:
      - text: "แมวเห็นผีจริงเหรอ{kq}"
        heart: 1
        reply: "จริงจ้ะ ทองคำแมวยายบางคืนนั่งจ้องมุมห้องนิ่งๆ ขนฟูทั้งตัว ไม่กะพริบตา… คืนแบบนั้นยายลุกขึ้นจุดตะเกียงแล้วสวดบทเดียวที่ยายจำได้ ทองคำค่อยหันมาเลียมือยาย"
        next:
          - text: "แล้วมุมนั้นมีอะไร{kq}"
            heart: 1
            reply: "ยายไม่เคยไปดูจ้ะหลาน… บางอย่างไม่ต้องไปดู รู้ว่ามีก็พอ แล้วยายก็ย้ายตู้กับข้าวไปตั้งตรงนั้น ตั้งแต่นั้นทองคำก็ไม่จ้องอีก"
          - text: "{p}จะเลี้ยงให้ดี{k}"
            heart: 1
            reply: "ดีแล้ว แต่ระวังข้อเดียวนะหลาน… โบราณห้ามให้แมวดำกระโดดข้ามศพ ถ้าวันไหนในตำบลมีงานศพ ขังแมวไว้ในบ้านก่อน"
      - text: "ยายชอบแมวเหรอ{kq}"
        heart: 1
        reply: "ชอบจ้ะ แมวไม่ถามอะไรยาย ไม่ขอเลขด้วย… ทองคำนั่งฟังยายเล่าเรื่องผีทุกคืน ไม่เคยกลัว ไม่เคยหลับ"

  - id: bua_r_ann_decided
    topic: react
    once: true
    when: { flag: ann_q4_done }
    npc: "หนูแอนมาหายายเมื่อเช้า เอาข้าวต้มมาให้ แล้วนั่งเคี้ยวหมากกับยายคำหนึ่ง… หน้าเบ้ทั้งคำ ยายรู้เลยว่าหนูแอนตัดสินใจได้แล้ว ใจคนเบาแล้วถึงกล้าลองของขม"
    options:
      - text: "ยายรู้ด้วยว่าแอนกำลังคิดเรื่องอะไร{kq}"
        heart: 1
        reply: "ยายไม่รู้ว่าเรื่องอะไรหรอกหลาน ยายรู้แต่หน้าคนกำลังจะทิ้งบ้าน… ยายเห็นมาทั้งตำบล หน้าแบบนั้นมันมองไกลแต่ไม่กะพริบ"
      - text: "ขอบคุณที่ยายช่วยแอนคิดนะ"
        heart: 2
        reply: "ยายไม่ได้ช่วยอะไรหรอกจ้ะ ยายแค่เล่าเรื่องเก่าที่ไม่เคยเล่า… หลานเก็บความลับยายได้ดีนะ ยายรู้ หนูแอนไม่ได้พูดอะไรเรื่องแม่เลย"
        next:
          - text: "{p}คิดว่ายายควรเล่าเองมากกว่า"
            heart: 2
            reply: "สักวันจ้ะหลาน… คนแก่เล่าเรื่องที่ตัวเองช่วยใครไม่ค่อยเป็น เพียรก็เป็น ยายก็เป็น เป็นโรคเดียวกันทั้งตำบล"
          - text: "เรื่องนี้ไม่ใช่ของ{p}ที่จะเล่า"
            heart: 1
            reply: "หลานรู้จักขอบเขตดีนะ… เหมือนเพียรไม่มีผิด"

  - id: bua_r_lamp_after
    topic: react
    once: true
    when: { flag: bua_q3_done }
    npc: "เมื่อคืนยายนั่งมองตะเกียงที่สะพานจนสองทุ่มครึ่งนะหลาน… แล้วยายก็เข้านอน หลับสนิทเป็นคืนแรกตั้งแต่เพียรไป"
    options:
      - text: "ดีใจด้วย{k}ยาย"
        heart: 1
        reply: "ยายก็ดีใจจ้ะ… คืนนี้ยายจะต้มข้าวต้มเผื่อหลานหม้อหนึ่ง ไม่ใส่พริก ห้ามเติมพริกต่อหน้ายายนะ"
      - text: "ยายไม่กลัวผีพรายที่สะพานแล้วเหรอ{kq}"
        heart: 1
        reply: "กลัวจ้ะ ยายกลัวทั้งชีวิต… แต่ที่ไหนมีไฟ ผีพรายไม่ขึ้นมาใกล้ตลิ่ง แล้วที่ไหนมีคนจุดไฟให้ ใจคนก็ไม่จม"
        next:
          - text: "{p}จะจุดให้ทุกคืนที่ทำได้"
            heart: 2
            reply: "ไม่ต้องทุกคืนจ้ะหลาน… จุดคืนที่หลานนึกถึงยายก็พอ ยายจะรู้ว่าคืนไหนหลานนึกถึง"
          - text: "ยายพูดเหมือนกลอนเลย"
            heart: 1
            reply: "ยายแก่แล้วพูดอะไรก็เป็นกลอนจ้ะหลาน… ฟังไว้ก่อน ยายตายไปจะได้มีคนจำได้สักวรรค"

  # ===== news =====
  - id: bua_n_light
    topic: news
    when: { time: morning }
    npc: "เมื่อคืนตีสองยายลุกไปปัสสาวะ เห็นแสงลอยวูบวาบแถวป่าช้าเก่าหลังบริษัท ลอยต่ำๆ แล้วหายไปในพงหญ้า… ยายว่ากระสือออกหากินแล้วหลาน"
    options:
      - text: "กระสือกินอะไร{kq}"
        heart: 1
        reply: "ของคาวของสกปรกจ้ะ… สมัยยายเด็ก บ้านไหนมีคนเพิ่งคลอด เขาเอาหนามพุทรากับหนามไผ่ไปสุมใต้ถุนเรือน กระสือลงมากินของคาวแล้วไส้ห้อยไปติดหนาม ขึ้นไม่ได้ ตอนเช้าเห็นเป็นเลือดเป็นทาง"
        next:
          - text: "ยายเคยเห็นไส้ติดหนามไหม{kq}"
            heart: 1
            reply: "ยายเห็นแต่หนามมีรอยเลือดจ้ะ… แม่ยายบอกว่าคืนนั้นได้ยินเสียงคนร้องไห้ใต้ถุนจนไก่ขัน แล้วก็เงียบไป ยายไม่กล้าถามต่อจนป่านนี้"
          - text: "แล้ว{p}ต้องทำยังไง{kq}"
            heart: 1
            reply: "เก็บผ้าที่ตากไว้ก่อนค่ำทุกวันนะหลาน… กระสือชอบเอาผ้าที่ตากข้ามคืนมาเช็ดปาก เช้ามาผ้ามีคราบเหม็นคาว ซักไม่ออก ต้องเผาทิ้ง"
      - text: "อาจเป็นไฟฉายคนงานก็ได้{k}"
        heart: 0
        reply: "ไฟฉายไม่ดับเองกลางพงหญ้าหรอกหลาน… แต่ยายก็ไม่เถียง คืนนี้ถ้าหลานเห็นไฟฉายลอยต่ำๆ ไม่มีเสียงเดิน หลานบอกยายด้วยนะว่าคนงานคนนั้นเดินยังไง"

  - id: bua_n_pob
    topic: news
    npc: "ตำบลข้างๆ เขาลือกันว่ามีผีปอบเข้ายายแก่คนหนึ่ง… ยายไปดูมาแล้วนะหลาน ยายแก่คนนั้นเป็นไข้ป่าจ้ะ ไม่ใช่ปอบ ยายส่งให้หนูแอนไปแล้ว"
    options:
      - text: "ทำไมคนถึงว่าเป็นปอบ{kq}"
        heart: 1
        reply: "แกพูดเพ้อตอนไข้ขึ้น เรียกชื่อคนตายไปแล้ว ตาขวาง… สมัยก่อนเขาว่าปอบคือคนเรียนวิชาแล้วผิดครู ผีมันเลยหิว ไปกินตับคนป่วย พอคนป่วยเพ้อ คนก็ว่าปอบมาเข้า"
        next:
          - text: "แล้วปอบจริงมีไหม{kq}"
            heart: 1
            reply: "มีจ้ะ… ยายเคยเห็นหมอผีใช้หวายหางกระเบนฟาดคนที่ปอบเข้า แล้วคนนั้นพูดเสียงแหบๆ บอกชื่อตัวเองว่าเป็นใคร ชื่อที่พูดออกมาเป็นชื่อคนที่ยืนดูอยู่ในงาน ยายยังจำหน้าเขาได้ตอนหน้าซีด"
          - text: "ดีที่ยายไปดูนะ"
            heart: 2
            reply: "ยายต้องไปจ้ะหลาน… คนที่ถูกหาว่าเป็นปอบ เมื่อก่อนถูกไล่ออกจากหมู่บ้าน ไม่มีใครให้ข้าวให้น้ำ ยายเห็นมาแล้ว ไม่อยากเห็นอีก"
      - text: "ยายไม่กลัวติดไข้เหรอ{kq}"
        heart: 0
        reply: "หนูแอนให้ยายใส่หน้ากากจ้ะ ยายใส่แล้วเคี้ยวหมากไม่ได้ ยายเลยทนได้แค่ครึ่งชั่วโมง… ทนเพื่อคนป่วยได้ ทนนานกว่านี้ไม่ไหว"

  - id: bua_n_herbs_dying
    topic: news
    npc: "สมุนไพรริมคลองยายตายไปอีกแถวหนึ่งแล้วหลาน… ว่านหางจระเข้ยังอยู่ ไพลยังอยู่ แต่บัวบกตายหมด บัวบกมันชอบดินชื้น ดินตอนนี้แห้งเหมือนข้าวตาก"
    options:
      - text: "{p}ช่วยรดน้ำให้ได้ไหม{kq}"
        heart: 2
        reply: "ได้จ้ะ… แต่รดตอนเช้านะ ตอนเย็นรดแล้วน้ำค้างตัว ว่านบางตัวรากเน่า ยายจะสอนว่าต้นไหนกินน้ำมาก ต้นไหนกินน้อย เหมือนคนแหละหลาน"
      - text: "ปลูกใหม่ได้ไหม{kq}"
        heart: 1
        reply: "ปลูกได้จ้ะ แต่บัวบกเส้นที่ตาย ยายเอามาจากบ้านแม่ตอนแต่งงาน… อายุมันห้าสิบกว่าปี ปลูกใหม่ได้ต้น แต่ไม่ได้เส้นเดิม"
        next:
          - text: "ยายเศร้าไหม{kq}"
            heart: 1
            reply: "เศร้าจ้ะ… แต่ยายแบ่งไหลให้หนูแอนไปปลูกที่ รพ.สต. ไว้เมื่อปีก่อน ยังเหลืออยู่ที่นั่น ของดีต้องแบ่งไว้หลายที่ ยายเพิ่งรู้คุณค่าก็วันนี้"
          - text: "เดี๋ยว{p}หาต้นมาให้ใหม่"
            heart: 1
            reply: "ขอบใจจ้ะหลาน… ต้นใหม่ก็ดี ยายจะตั้งชื่อตามหลาน แล้วรดน้ำทุกเช้า"

  - id: bua_n_tree_cloth
    topic: news
    npc: "เด็กๆ ไปผูกผ้าสามสีที่ต้นตะเคียนหลังโบสถ์ ขอให้สอบได้… ยายเห็นแล้วใจหาย หลานเอ๊ย ต้นนั้นไม่ใช่ต้นที่ขอเล่นๆ ได้"
    options:
      - text: "ทำไมล่ะยาย{kq}"
        heart: 1
        reply: "นางตะเคียนต้นนั้นเขาเป็นสาวจ้ะ ขอแล้วต้องแก้บน… ถ้าสอบได้แล้วไม่ไปแก้ เขาจะมาร้องไห้ข้างหน้าต่างคนบน ร้องเบาๆ เหมือนผู้หญิงสะอื้น ตั้งแต่ตีหนึ่งถึงไก่ขัน"
        next:
          - text: "แก้บนด้วยอะไร{kq}"
            heart: 1
            reply: "ชุดไทยกับแป้งหอม ลิปสติกแดงๆ แท่งหนึ่งจ้ะ… นางเป็นสาว ชอบสวย ยายจะไปบอกครูเต้ยให้เด็กๆ แก้บนด้วยการไปกวาดใบไม้ใต้ต้นแทน นางคงไม่ว่า เด็กตั้งใจ"
          - text: "ยายเคยได้ยินเสียงร้องนั้นไหม{kq}"
            heart: 1
            reply: "เคยจ้ะ… ตอนตาเขายังอยู่ ตาเขาบนขอให้ยายคลอดง่าย แล้วลืมแก้ สามคืนติดยายได้ยินเสียงสะอื้นใต้หน้าต่าง คืนที่สี่ตาเขาวิ่งเอาผ้าไปแก้บนตอนตีสาม ยายยังขำตาเขาอยู่เลย"
      - text: "เด็กแค่ขอเล่นๆ{k}"
        heart: 0
        reply: "ผีไม่รู้หรอกจ้ะหลานว่าเล่นหรือจริง… ผู้ใหญ่ต้องรู้แทนเด็ก"

  - id: bua_n_festival
    topic: news
    npc: "สารทไทยปีนี้ยายจะกวนกระยาสารทหม้อใหญ่นะหลาน… วันสารทเปรตขึ้นมาขอส่วนบุญ ยายทำเผื่อเปรตด้วย"
    options:
      - text: "เปรตเป็นยังไง{kq}"
        heart: 1
        reply: "ตัวสูงเท่าต้นตาล ผอมเห็นซี่โครง ปากเท่ารูเข็ม กินอะไรไม่ได้นอกจากส่วนบุญที่ลูกหลานกรวดน้ำให้… ตอนดึกๆ จะได้ยินเสียงหวีดเบาๆ วี้ด… นั่นเปรตหิวจ้ะ"
        next:
