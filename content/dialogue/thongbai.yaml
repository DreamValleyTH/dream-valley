# ป้าทองใบ — แม่ครัวงานบุญ ผู้เชี่ยวชาญของป่า · convos + quests
convos:
  # ===== react =====
  - id: thongbai_r_meeting1
    topic: react
    once: true
    when: { flag: story_meeting1 }
    npc: "ประชุมเมื่อวานป้าต้มข้าวต้มมัดไปสองร้อยห่อ เหลือกลับมาสามห่อ… คนกินหมดแต่ไม่มีใครฟังกันเลยนะหลาน ปากเคี้ยวอย่างเดียว"
    options:
      - text: "ป้าว่าใครพูดดีที่สุด{kq}"
        heart: 1
        reply: "ไอ้กล้าพูดดีแต่ยาวเหมือนแกงจืดที่เติมน้ำไม่หยุด… นายกฯ พูดยาวกว่าแต่ไม่มีเนื้อ แกงจืดยังมีหมูสับ"
        next:
          - text: "แล้วป้าโหวตอะไร{kq}"
            heart: 1
            reply: "ความลับจ้ะ… ใบ้ให้ว่าป้าล้างผักวันละสามกะละมัง ถ้าไม่มีน้ำ ป้าก็แกงไม่ได้ หลานคิดเอาเอง"
          - text: "กำนันหลับจริงเหรอ{kq}"
            heart: 1
            reply: "หลับสองรอบ ตื่นมากินข้าวต้มมัดสี่ห่อ แล้วหลับต่อ ป้านับ… ห่อที่ห้าป้าไม่ให้ ป้ากลัวกำนันไม่ตื่นอีกเลย"
      - text: "เหลือสามห่อให้{p}ได้ไหม{kq}"
        heart: 2
        reply: "แหม! ตาไวนะหลาน เอาไปเลยสองห่อ อีกห่อป้าเก็บให้ตาเผือก แกไม่มาประชุมมาสิบปี เมื่อวานมา ป้าตกใจจนลืมยื่นข้าวต้มมัดให้แก"

  - id: thongbai_r_well_dry
    topic: react
    when: { flag: story_well_dry }
    npc: "บ่อหลังบ้านป้าแห้งเหลือแต่โคลนหลาน… ป้าต้องซื้อน้ำถังมาล้างผัก ล้างทีป้าต้องคิดว่าล้างสองน้ำหรือสามน้ำ ป้าไม่เคยต้องคิดเรื่องนี้มาหกสิบปี"
    options:
      - text: "มาใช้บ่อบ้านยาย{p}ได้นะ{kq}ป้า"
        heart: 2
        reply: "…จริงเหรอหลาน บ่อยายเพียรลึก ป้ารู้ ยายเพียรเคยให้ป้าตักไปแกงงานบุญตอนแล้งปีห้าสอง ป้าไม่เคยลืม ป้าจะเอาแกงมาแลกทุกครั้งนะ"
        next:
          - text: "ยายให้ป้าตักน้ำด้วยเหรอ{kq}"
            heart: 1
            reply: "ทั้งหน้าแล้งจ้ะ ยายเปิดประตูหลังบ้านทิ้งไว้ ใครมาตักก็ได้ ไม่ต้องขอ… ตอนนั้นป้านึกว่ายายใจดีเฉยๆ ตอนนี้ป้ารู้ว่ายายขุดบ่อลึกไว้เผื่อคนอื่นด้วย"
          - text: "ไม่ต้องแลกแกงก็ได้{k}ป้า"
            heart: 2
            reply: "ไม่ได้จ้ะ ต้องแลก… ป้าไม่ได้ใช้หนี้หลาน ป้าแค่อยากให้หลานกินแกงทุกวัน คนอยู่บ้านคนเดียวชอบกินแค่บะหมี่ซอง ป้ารู้"
      - text: "ล้างน้ำเดียวก็ได้มั้ง{kq}"
        heart: -1
        reply: "แหม หลานเอ๊ย ผักบุ้งตลาดล้างน้ำเดียว ยาฆ่าแมลงยังอยู่ครบ ป้าเลี้ยงพระนะ ไม่ได้เลี้ยงหนอน"
      - text: "เห็ดปีนี้จะขึ้นไหม{kq}"
        heart: 1
        reply: "ขึ้นครึ่งเดียวจ้ะ ดินในป่าแห้งข้างใต้ ฝนตกข้างบนก็ไม่ช่วย เห็ดมันอยู่ข้างใต้นะหลาน คนอยู่ข้างบนไม่ค่อยรู้"

  - id: thongbai_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ป้าได้ถังโลโก้บริษัทมาสองใบ ใบนึงล้างผัก ใบนึงหมักปลาร้า… ปลาร้าในถังบริษัท ป้าว่าเหมาะดี กลิ่นแรงพอๆ กัน"
    options:
      - text: "ป้ารับถังเขามาด้วยเหรอ{kq}"
        heart: 0
        reply: "รับสิหลาน ถังไม่ผิด คนแจกต่างหาก… ป้ารับถัง แต่ป้าไม่ยกมือให้ใคร ถังกับมือคนละเรื่องกัน"
      - text: "ปลาร้าในถังบริษัทอร่อยไหม{kq}"
        heart: 1
        reply: "ยังไม่รู้จ้ะ ต้องหมักสามเดือน… ป้าจะเอาไปตำส้มตำให้คุณธนากินวันงานกฐิน ให้เขารู้ว่าถังเขาทำอะไรได้บ้าง"
        next:
          - text: "คุณธนาจะกินไหม{kq}"
            heart: 1
            reply: "กินสิ เขากินแกงป้าทุกงาน กินเผ็ดได้ด้วยนะ ลูกชาวนาแน่ๆ คนเมืองจริงไม่กินพริกห้าเม็ดหน้าตาเฉย"
          - text: "ป้าแสบจัง{k}"
            heart: 1
            reply: "แสบแบบพริกจ้ะ แสบแล้วอร่อย ไม่ได้แสบแบบน้ำกรด"

  - id: thongbai_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ผู้สมัครสองคนมาจ้างป้าทำกับข้าวงานเลี้ยงหาเสียงวันเดียวกัน! ป้าตั้งหม้อสองหม้อ แกงเดียวกัน สูตรเดียวกัน ป้าไม่เลือกข้าง ป้าเลือกพริก"
    options:
      - text: "สองฝ่ายรู้ไหมว่าแกงเหมือนกัน{kq}"
        heart: 1
        reply: "ไม่รู้จ้ะ ฝ่ายหนึ่งบอกว่าแกงป้าอร่อยกว่าอีกฝ่าย… ป้ายิ้มแล้วตักให้เพิ่ม หม้อเดียวกันแท้ๆ การเมืองนี่ลิ้นก็ลำเอียงนะหลาน"
      - text: "ป้าจดชื่อคนที่ไม่จ่ายด้วยไหม{kq}"
        heart: 1
        reply: "จดแล้วจ้ะ ป้าจดทุกงาน ซองงานบุญ ค่ากับข้าวงานหาเสียง เล่มเดียวกัน… ใครค้างป้า ป้าจะแกงจืดให้กินงานหน้า"
      - text: "ป้าอยากได้ใครเป็นนายกฯ{kq}"
        heart: 1
        reply: "คนที่ทำให้ป่ามีน้ำจ้ะ ป่าแห้งเห็ดไม่ขึ้น เห็ดไม่ขึ้นป้าไม่มีอะไรแกง ป้าไม่มีอะไรแกง คนก็ไม่มาวัด… มันผูกกันหมด"

  - id: thongbai_r_wang
    topic: react
    once: true
    when: { flag: loan_wang }
    npc: "หลาน… ลุงหวังมากินข้าวบ้านป้าเมื่อวาน จ่ายแบงก์ร้อยใหม่เอี่ยม ป้าถามว่าไปเอามาจากไหน แกบอก ‘หลานยายเพียรใจดี’ ป้าก็เข้าใจเลย"
    options:
      - text: "ลุงบอกว่าเป็นค่าเทอมลูก{k}"
        heart: 1
        reply: "ค่าเทอมจริงครึ่งนึงจ้ะ อีกครึ่งเป็นค่าแกงป้ากับเหล้าขาวร้านป้าแต๋ว… ป้าไม่ว่าแกนะ แกเหงาตั้งแต่เมียไปทำงานเมือง แต่หลานอย่าให้ยืมบ่อย"
      - text: "ป้าคืนเงินให้{p}ได้ไหม{kq}"
        heart: 1
        reply: "แหม ป้ารับค่าแกงไปแล้ว คืนไม่ได้จ้ะ… แต่ป้าจะตักแกงให้หลานฟรีสามถ้วย ถือว่าหักหนี้ลุงหวังให้ ป้ายุติธรรมนะ"

  - id: thongbai_r_end_stall
    topic: react
    once: true
    when: { flag: thongbai_end_stall }
    npc: "แผงข้าวแกงป้าขายหมดก่อนเก้าโมงอีกแล้วหลาน! พี่หน่อยมายืนต่อคิวด้วย บอกว่ามาสำรวจคู่แข่ง แล้วซื้อไปสองถุง"
    options:
      - text: "ป้าขายดีจัง{k} ยินดีด้วย"
        heart: 2
        reply: "ป้าเพิ่งรู้ว่าแกงที่ทำให้คนแปลกหน้ากินแล้วได้เงิน มันอร่อยกว่าแกงงานบุญนิดนึง… อย่าบอกพระอาจารย์นะ"
      - text: "พี่หน่อยว่าไงบ้าง{kq}"
        heart: 1
        reply: "บอกว่า ‘จืด’ ป้าโกรธจนหัวเราะ สามสิบปีป้าบอกคนอื่นว่าจืด เพิ่งโดนคืน… พี่หน่อยซื้อเพิ่มอีกถุงก่อนกลับนะ"

  - id: thongbai_r_end_line
    topic: react
    once: true
    when: { flag: thongbai_end_line }
    npc: "หลาน! กลุ่ม LINE สั่งแกงป้ายี่สิบถุงเมื่อคืน ป้าพิมพ์ตอบเองแล้วนะ แต่ป้ากดผิดส่งสติกเกอร์หมีเต้นไปสิบสองตัว"
    options:
      - text: "สติกเกอร์หมีก็น่ารักดีนะ{kq}"
        heart: 1
        reply: "ป้าแต๋วบอกว่าน่ารักเหมือนกัน ตอนนี้ป้าส่งหมีเต้นทุกครั้งที่แกงเสร็จ คนในกลุ่มรู้เลยว่าแกงพร้อม… ป้าว่าป้าคิดระบบใหม่ได้โดยบังเอิญ"
      - text: "เดี๋ยว{p}ช่วยรับออเดอร์{k}"
        heart: 2
        reply: "ดีจ้ะ หลานพิมพ์ ป้าแกง… ห้ามรับเกินสามสิบถุงนะ ป้าแกงได้แค่นั้นถ้าจะให้ไม่จืด"

  - id: thongbai_r_end_temple
    topic: react
    once: true
    when: { flag: thongbai_end_temple }
    npc: "ป้าเอาสมุดสูตรแม่ไปไว้ที่ครัววัดแล้วหลาน ผูกเชือกไว้กับเสา ห้ามใครเอากลับบ้าน… พระอาจารย์ให้ทำตู้กระจกให้ ป้าบอกไม่ต้อง สมุดต้องเปื้อนน้ำมัน มันถึงจะเป็นสมุดครัว"
    options:
      - text: "มีใครมาเรียนบ้างหรือยัง{kq}"
        heart: 1
        reply: "เณรต้นมาอ่านทุกเย็น ท่องสูตรแกงเหมือนท่องบทสวด… ป้าบอกว่าอ่านอย่างเดียวไม่ได้ ต้องชิม เณรต้นบอกว่าเณรชิมหลังเที่ยงไม่ได้ ป้าลืมไปเลย"
      - text: "ป้าไม่เสียดายเหรอ{kq}"
        heart: 2
        reply: "เสียดายจ้ะ… แต่ยายเพียรเติมแกงให้ป้าโดยไม่บอกใคร ป้าก็จะทิ้งสูตรไว้ให้คนที่ป้าไม่รู้จัก ให้เขาแกงไม่จืด โดยไม่ต้องรู้ว่าป้าเป็นใคร"

  # ===== news =====
  - id: thongbai_n_poison
    topic: news
    npc: "หมู่ห้ามีคนเก็บเห็ดระโงกหินไปแกงทั้งบ้านหลาน! ตอนนี้นอนโรงพยาบาลอำเภอสามคน… ป้าบอกแล้วบอกอีก ขาวทั้งดอก มีถ้วยหุ้มโคน ห้ามเก็บ!"
    options:
      - text: "เขาไม่รู้เหรอ{kq} ว่าเห็ดพิษ"
        heart: 1
        reply: "รู้จ้ะ แต่ดูคลิปสั้นในโทรศัพท์แล้วนึกว่าเป็นระโงกไข่ไก่ คลิปบอกว่า ‘เด็ดสดๆ อร่อยมาก’ คนทำคลิปไม่ได้นอนโรงพยาบาลนะหลาน"
        next:
          - text: "ป้าน่าจะทำคลิปสอนบ้าง{k}"
            heart: 2
            reply: "ป้าเหรอ… ป้าพูดเร็ว กล้องตามไม่ทัน แต่ถ้าหลานถือกล้องให้ ป้าจะลองนะ ป้าจะพูดช้าลง… ป้าลองแล้ว พูดช้าลงไม่ได้"
          - text: "ระโงกไข่ไก่กับระโงกหินต่างกันยังไง{kq}"
            heart: 1
            reply: "ระโงกไข่ไก่หมวกเหลือง ระโงกหินขาวทั้งดอก ผ่าดูโคนต้องเหลือง… ไม่แน่ใจไม่เก็บ ไม่แน่ใจไม่กิน ไม่แน่ใจมาถามป้า"
      - text: "หมอแอนไปช่วยไหม{kq}"
        heart: 1
        reply: "ไปจ้ะ หมอแอนโพสต์เตือนในกลุ่มไปสามรอบ คนแชร์คลิปเดิมสิบรอบ ข่าวจริงวิ่งช้ากว่าข่าวปลอมเหมือนหอยทากแข่งกับมอไซค์"

  - id: thongbai_n_pork
    topic: news
    when: { time: morning }
    npc: "หมูขึ้นอีกแล้วหลาน กิโลละร้อยหกสิบ! งานบุญหน้าป้าต้องแกงใส่หมูน้อยลง ใส่หน่อไม้เพิ่ม ใครถามป้าจะบอกว่าแกงสูตรรักษ์สุขภาพ"
    options:
      - text: "ป้าฉลาดจัง{k}"
        heart: 1
        reply: "ฉลาดแบบคนจนจ้ะหลาน คนรวยเขาเรียกว่าบริหารต้นทุน คนจนเรียกว่าเติมหน่อไม้"
      - text: "ให้{p}ช่วยออกค่าหมูไหม{kq}"
        heart: 2
        reply: "แหม! หลานพูดแล้วนะ ป้าจะไม่ประกาศชื่อหลานหรอก ป้ารู้หลานอาย… แต่ป้าจะตักหมูให้หลานเพิ่มสองชิ้นตอนแจกแกง"
      - text: "ทำไมหมูขึ้นบ่อยจัง{kq}"
        heart: 1
        reply: "ป้าไม่รู้จ้ะ เสี่ยเฮงบอกว่าเพราะค่าอาหารหมู ค่าอาหารหมูขึ้นเพราะข้าวโพด ข้าวโพดขึ้นเพราะ… ป้าฟังไม่จบ ป้าไปตำน้ำพริกก่อน"

  - id: thongbai_n_fake_news
    topic: news
    npc: "ในกลุ่ม LINE มีคนแชร์ว่ากินหน่อไม้ดิบรักษาเบาหวาน! ป้าโทรหาหมอแอนเลย หมอแอนบอกว่ากินหน่อไม้ดิบแล้วไม่ต้องรักษาอะไรอีกเลย เพราะไปนอนโรงพยาบาลก่อน"
    options:
      - text: "ใครแชร์{kq}"
        heart: 1
        reply: "บัญชีชื่อ ‘สุขภาพดีวิถีไทย’ รูปโปรไฟล์เป็นดอกบัว… ป้าแต๋วบอกว่าไม่มีใครในตำบลรู้จัก แต่ป้าแต๋วรู้จักทุกคน แปลว่าเป็นบัญชีผี"
      - text: "ป้าเตือนในกลุ่มด้วยไหม{kq}"
        heart: 1
        reply: "เตือนแล้วจ้ะ ป้าพิมพ์ ‘ห้ามกินหน่อไม้ดิบต้มเทน้ำทิ้งสองรอบ’ แต่ลืมเว้นวรรค คนอ่านแล้วงงว่าห้ามต้มหรือห้ามกิน ป้าเลยส่งรูปหม้อตามไปสามรูป"

  - id: thongbai_n_pakwan
    topic: news
    when: { day_min: 4 }
    npc: "ผักหวานป่าหลังวัดแตกยอดแล้วหลาน… แต่มีคนไปหักกิ่งมาทั้งกิ่ง เอาไปขายในเมือง ต้นมันโกร๋นเลย ป้าเห็นแล้วจะร้องไห้"
    options:
      - text: "ป้ารู้ไหมว่าใคร{kq}"
        heart: 1
        reply: "รู้จ้ะ แต่ป้าไม่บอก… ป้าจะไปยืนหน้าต้นผักหวานทุกเช้าจนกว่าเขาจะเลิก ป้าไม่ต้องด่า ป้าแค่ยืน คนทำผิดกลัวคนยืนมากกว่าคนด่า"
      - text: "ทำไมห้ามหักกิ่ง{kq}"
        heart: 1
        reply: "หักกิ่งต้นมันตกใจ ปีหน้าแตกยอดน้อย เด็ดแค่ยอดอ่อน ต้นมันยังยิ้มได้… ป้าพูดเหมือนต้นไม้มีหน้า แต่มีจริงนะหลาน ป้าเห็น"

  - id: thongbai_n_jamrat
    topic: news
    npc: "ลุงจำรัสแอบชิมแกงก่อนพระฉันอีกแล้ว คราวนี้ใช้ช้อนชาแทนช้อนโต๊ะ บอกว่า ‘ลดขนาดตามที่ป้าขอ’ แต่ชิมสิบรอบ"
    options:
      - text: "ป้าตีมือลุงไหม{kq}"
        heart: 1
        reply: "ตีสิ ตีสิบรอบเท่ากัน… ลุงหัวเราะทุกครั้ง แล้วจดในสมุดบัญชีวัดว่า ‘ตรวจคุณภาพอาหาร สิบครั้ง ผ่าน’"
      - text: "ลุงคงชอบแกงป้ามาก{k}"
        heart: 1
        reply: "ชอบจ้ะ ลุงเลิกเหล้ามาสิบห้าปี เปลี่ยนมาติดแกงป้าแทน… ป้าว่าดีกว่ากันเยอะ ถึงจะเผ็ดพอๆ กัน"

  # ===== advice =====
  - id: thongbai_a_paste
    topic: advice
    npc: "ตำพริกแกงนะหลาน ใส่ของแข็งก่อน ตะไคร้ ข่า ผิวมะกรูด ตำจนละเอียด แล้วค่อยใส่หอม กระเทียม พริก กะปิใส่ท้ายสุด… ใส่ผิดลำดับ ตำทั้งวันก็ไม่เนียน"
    options:
      - text: "ทำไมกะปิใส่ท้ายสุด{kq}"
        heart: 1
        reply: "กะปิเหนียว ใส่ก่อนมันพาทุกอย่างติดสาก ตำไม่ลง… เหมือนคนพูดมากในที่ประชุม ให้พูดท้ายสุด คนอื่นจะได้พูดก่อน"
      - text: "ซื้อพริกแกงสำเร็จรูปง่ายกว่านะ{kq}"
        heart: -1
        reply: "แหม! พริกแกงซองเค็มกับจืดในซองเดียวนะหลาน… ไม่ว่ากัน วันไหนหลานเหนื่อยก็ใช้ไป แต่อย่าเอามาให้ป้าชิม"
      - text: "ป้าสอนตำได้ไหม{kq}"
        heart: 2
        reply: "ได้จ้ะ แต่หลานต้องตำจนเหงื่อหยด ถ้าป้ายังเห็นตะไคร้เป็นเส้น ตำใหม่… ยายเพียรตำครั้งแรกก็โดนป้าให้ตำใหม่สามรอบนะ"

  - id: thongbai_a_spoil
    topic: advice
    when: { time: noon }
    npc: "แกงกะทิอย่าทิ้งไว้ข้ามคืนนอกตู้นะหลาน หน้าร้อนแบบนี้บูดก่อนไก่ขัน… ถ้าจะเก็บต้องอุ่นให้เดือดทุกเช้าเย็น"
    options:
      - text: "อุ่นบ่อยไม่เละเหรอ{kq}"
        heart: 1
        reply: "เละนิดแต่อร่อยขึ้นนะ แกงอุ่นวันที่สองอร่อยกว่าวันแรก วันที่สามเริ่มเหนื่อย วันที่สี่ให้หมา… อย่าให้หมานะ ป้าพูดเล่น ทิ้งไปเถอะ"
      - text: "{p}มีตู้เย็นแล้ว{k}"
        heart: 1
        reply: "ดีจ้ะ แต่ระวังไฟดับ ตู้เย็นดับทีแกงเสียทั้งตู้… บ้านยายเพียรไฟดับบ่อย ยายเลยแกงหม้อเล็กๆ กินให้หมดทุกวัน"

  - id: thongbai_a_taste
    topic: advice
    npc: "ชิมแกงต้องชิมจากหลังทัพพีนะหลาน ไม่ใช่เป่าแล้วซด… หลังทัพพีบางๆ ลิ้นได้รสทั้งเค็มทั้งเผ็ดพร้อมกัน ไม่ลวกปาก"
    options:
      - text: "ป้าคิดเองเหรอ{kq}"
        heart: 1
        reply: "แม่ป้าสอนจ้ะ แม่ป้าชิมจากหลังทัพพีมาห้าสิบปี ลิ้นแม่ไม่เคยพอง… ป้าชิมแบบนี้ทุกหม้อที่เดินผ่าน รวมหม้อคนอื่นด้วย"
      - text: "ชิมหม้อคนอื่นด้วยเหรอ{kq}"
        heart: 1
        reply: "หน้าที่ป้าจ้ะ งานบุญมีสิบหม้อ ถ้าหม้อไหนจืด คนจะจำว่า ‘แกงวัดดงเย็นจืด’ ไม่มีใครจำว่าใครปรุง… ป้าเลยต้องชิมทุกหม้อ ป้าไม่ได้ขี้บ่นนะ ป้ารักษาชื่อวัด"

  - id: thongbai_a_khaojee
    topic: advice
    when: { time: morning }
    npc: "ข้าวจี่ปิ้งไฟอ่อนนะหลาน ปั้นข้าวเหนียวแน่นๆ ทาเกลือนิดนึง ปิ้งจนกรอบนอก แล้วค่อยทาไข่ ทาไข่ก่อนไข่ไหม้ ข้าวยังไม่กรอบ"
    options:
      - text: "ทาไข่กี่รอบ{kq}"
        heart: 1
        reply: "สองรอบจ้ะ รอบแรกบางๆ ให้ติด รอบสองให้ฟู… ตาเผือกชอบข้าวจี่ป้า แกไม่เคยบอก แต่แกกินหมดทุกไม้ที่ป้ายัดใส่มือ"
      - text: "ข้าวจี่ห่อไปนาได้ไหม{kq}"
        heart: 1
        reply: "ได้จ้ะ ดีด้วย ไม่บูดง่าย ไม่หก กินมือเดียว อีกมือถือจอบ… ยายจันทร์ห่อข้าวจี่ไปนาทุกวัน ยายจันทร์เดินไม่เคยเมื่อยเลย"

  # ===== smalltalk =====
  - id: thongbai_s_sniff
    topic: smalltalk
    npc: "หลานรู้ไหม ป้าดมหม้อแล้วบอกได้ว่าขาดอะไร… เมื่อวานป้าเดินผ่านบ้านลุงสมหมาย ดมกลิ่นแล้วตะโกนเข้าไปว่า ‘ขาดใบมะกรูด!’ ป้าพรตะโกนกลับว่า ‘ต้มบะหมี่ซองย่ะ’"
    options:
      - text: "บะหมี่ซองขาดใบมะกรูดจริงไหม{kq}"
        heart: 1
        reply: "ขาดสิ! บะหมี่ซองใส่ใบมะกรูดสองใบ ใส่ไข่ ใส่ผักบุ้ง อร่อยขึ้นสามเท่า ป้าพรเลยเดินมาขอใบมะกรูดหลังบ้านป้า… นั่นไง ป้าถูก"
        next:
          - text: "{p}จะลองใส่ใบมะกรูดในบะหมี่ซองบ้าง{k}"
            heart: 1
            reply: "ลองเลยจ้ะ ฉีกใบก่อนใส่นะ ไม่ฉีกกลิ่นไม่ออก… แล้วอย่าเอามาให้ป้าดม ป้าจะบ่นว่าขาดตะไคร้"
          - text: "ป้าไปตะโกนใส่บ้านคนอื่นแบบนี้บ่อยไหม{kq}"
            heart: 1
            reply: "ทุกบ้านที่เดินผ่านจ้ะ… ตำบลนี้เลยทำกับข้าวปิดหน้าต่างกันหมด ยกเว้นบ้านยายเพียร ยายเปิดหน้าต่างรอให้ป้าตะโกน"
      - text: "ป้าดมหม้อ{p}ได้ไหม{kq}"
        heart: 1
        reply: "ได้จ้ะ แต่ถ้าดมแล้วป้าทำหน้าแบบนี้… (ป้าย่นจมูก) แปลว่าหลานต้องมาเรียนกับป้า ไม่มีข้อแม้"
      - text: "ป้าเหมือนหมาดมกลิ่นเลย{k}"
        heart: 0
        reply: "แหม! หมาดมเจอแต่กระดูก ป้าดมเจอความจืด… แต่ก็ใกล้เคียง ป้ายอมรับ"

  - id: thongbai_s_foam
    topic: smalltalk
    npc: "ป้าเกลียดกล่องโฟมที่สุดในโลกหลาน… งานบุญคราวก่อน อบต. ส่งกล่องโฟมมาให้ห้าร้อยใบ พิมพ์ชื่อโครงการ ‘ลดขยะชุมชน’ ไว้ข้างกล่อง"
    options:
      - text: "ป้าใช้ไหม{kq}"
        heart: 1
        reply: "ไม่ใช้จ้ะ ป้าห่อใบตองหมด ไอ้กล้ามาช่วยตัดใบตองสามร้อยใบ… กล่องโฟมเก็บไว้ในโกดังวัด ลุงจำรัสจดว่า ‘สนับสนุนโครงการลดขยะ ไม่ใช้ห้าร้อยใบ’"
      - text: "ลดขยะแต่แจกโฟม{k} ตลกดี"
        heart: 1
        reply: "ตลกจ้ะ ป้าหัวเราะจนต้องนั่ง… คนทำโครงการไม่ได้มาล้างหม้อในงานบุญหรอกหลาน เลยไม่รู้ว่าขยะหน้าตาเป็นยังไง"

  - id: thongbai_s_rain
    topic: smalltalk
    when: { rain: true }
    npc: "ฝนตกแล้วหลาน! พรุ่งนี้ตีห้าป้าเข้าป่า… หลานอย่าบอกใครนะ ป้าแต๋วรู้เมื่อไหร่ ทั้งตำบลไปเหยียบเห็ดป้าตายหมด"
    options:
      - text: "พา{p}ไปด้วยได้ไหม{kq}"
        heart: 2
        reply: "ได้จ้ะ แต่ต้องสาบานก่อนว่าจะไม่บอกจุด… สาบานกับต้นเต็งต้นใหญ่ ถ้าผิดคำสาบาน เห็ดจะไม่ขึ้นให้หลานอีกเลย ป้าว่ามันน่ากลัวกว่าผี"
      - text: "ป้าไม่กลัวผีในป่าตอนตีห้าเหรอ{kq}"
        heart: 1
        reply: "กลัวจ้ะ แต่ป้ากลัวเห็ดหมดมากกว่า… ตีห้าผีเริ่มกลับบ้านแล้ว ป้าเดินสวนกับมันพอดี ต่างคนต่างรีบ"

  - id: thongbai_s_coriander
    topic: smalltalk
    npc: "ผักชีกิโลละแปดสิบแล้วหลาน! ป้าปลูกเองหลังบ้านสามกระถาง ป้าพรมาขอทีละสามต้น ป้าแต๋วมาขอทีละห้าต้น… ป้าเหลือหนึ่งกระถาง"
    options:
      - text: "ป้าคิดเงินเขาสิ{kq}"
        heart: 1
        reply: "คิดเงินเพื่อนได้ยังไงหลาน… ป้าคิดเป็นเรื่องเล่า ป้าแต๋วจ่ายเป็นข่าวลือ ป้าพรจ่ายเป็นเรื่องลุงสมหมาย ป้าได้กำไรทุกวัน"
      - text: "{p}จะปลูกผักชีมาให้ป้า{k}"
        heart: 2
        reply: "แหม! ปลูกให้ป้าจริงนะ ผักชีชอบดินร่วน แดดครึ่งวัน ไม่ชอบน้ำขัง… เหมือนป้าเลย ป้าก็ไม่ชอบน้ำขัง ป้าชอบน้ำแกง"

  # ===== self =====
  - id: thongbai_f_ledger
    topic: self
    npc: "หลานได้ยินเขาว่าป้าจดยอดซองทุกงานใช่ไหม… จดจริงจ้ะ แต่ไม่ได้จดเพื่อนินทานะ"
    options:
      - text: "แล้วป้าจดไว้ทำไม{kq}"
        heart: 1
        reply: "จดว่างานไหนเงินพอค่ากับข้าว งานไหนไม่พอ… งานไหนไม่พอ ป้าก็ควักเอง แล้วจดไว้ว่าปีหน้าต้องแกงหม้อเล็กลง ไม่ได้จดว่าใครใส่น้อย"
        next:
          - text: "แต่คนเขาว่าป้าจดคนใส่น้อยนะ{kq}"
            heart: 1
            reply: "ก็ปล่อยให้ว่าไปจ้ะ คนกลัวป้าจด เขาก็ใส่ซองเพิ่ม เงินพอค่าหมู… ป้าไม่แก้ข่าว ข่าวนี้มีประโยชน์"
          - text: "ป้าควักเงินตัวเองบ่อยไหม{kq}"
            heart: 2
            reply: "บ่อยกว่าที่หลานคิดจ้ะ… แต่บางงานมีคนแอบจ่ายค่าหมูให้ป้าก่อน ป้าไม่เคยรู้ว่าใคร คนขายหมูบอกว่า ‘จ่ายแล้ว’ แค่นั้น"
      - text: "ป้าจดของ{p}ไว้ด้วยไหม{kq}"
        heart: 0
        reply: "จดสิหลาน… บรรทัดหลานเขียนว่า ‘มาช่วยหั่นหอม’ ป้าจดแรงด้วยนะ แรงนับเป็นเงินได้"

  - id: thongbai_f_husband
    topic: self
    when: { heart_min: 3 }
    npc: "สามีป้าชอบแกงป่าเผ็ดๆ หลาน… เขาเสียไปสิบปีแล้ว ป้ายังแกงเผ็ดทุกวันพระ ตั้งไว้ถ้วยนึงข้างรูปเขา แล้วป้าก็กินเองหมด เขากินเผ็ดไม่ไหวแล้ว"
    options:
      - text: "ลุงเป็นคนยังไง{kq}"
        heart: 1
        reply: "เงียบ กินเก่ง ไม่เคยชมแกงป้าสักครั้ง… แต่เติมข้าวสามจานทุกมื้อ ผู้ชายบ้านนี้ชมด้วยจานจ้ะหลาน"
      - text: "ป้าคงคิดถึงลุงมาก{k}"
        heart: 2
        reply: "คิดถึงตอนตำพริกจ้ะ… เขาชอบนั่งดูป้าตำ ไม่พูดอะไร พอป้าตำเสร็จเขาลุกไปหุงข้าว สามสิบปีแบบนั้น ตอนนี้ป้าตำเสร็จ ไม่มีใครลุก"
        next:
          - text: "{p}จะมานั่งดูป้าตำบ้าง{k}"
            heart: 2
            reply: "แหม… มาจ้ะ แต่หลานต้องลุกไปหุงข้าวด้วยนะ อย่ามานั่งเฉยๆ ป้าไม่ได้ต้องการคนดู ป้าต้องการคนหุงข้าว"
          - text: "ลุงรู้ไหมว่าป้ายังแกงให้{kq}"
            heart: 1
            reply: "รู้มั้งจ้ะ ยายบัวบอกว่าเขามาทุกวันพระ ชิมแล้วบ่นว่าเผ็ด… ป้าเลยลดพริกลงเม็ดนึง เผื่อเขามาจริง"

  - id: thongbai_f_daughter
    topic: self
    when: { heart_min: 5 }
    npc: "ลูกสาวป้าขายของออนไลน์อยู่กรุงเทพฯ หลาน… เมื่อวานโทรมาบอกว่าขายน้ำพริกแม่ได้สามร้อยกระปุก ป้าเพิ่งรู้ว่าลูกเอาสูตรป้าไปขาย"
    options:
      - text: "ป้าโกรธไหม{kq}"
        heart: 1
        reply: "โกรธนิดนึงจ้ะ… แล้วก็ดีใจมาก แปลว่าลูกจำสูตรป้าได้ ป้านึกว่าลูกไม่เคยดูป้าตำ ที่แท้ลูกดูทุกครั้ง แค่ไม่พูด เหมือนพ่อมันเลย"
        next:
          - text: "ลูกป้าทำน้ำพริกจืดไหม{kq}"
            heart: 2
            reply: "ป้าขอให้ส่งมาชิมกระปุกนึงแล้ว… ถ้าจืด ป้าจะนั่งรถลุงเชิดไปกรุงเทพฯ ไปสอนใหม่ ป้าไม่เคยไปกรุงเทพฯ เลยนะ ป้าตื่นเต้น"
          - text: "ป้าน่าจะทำขายเองด้วยนะ{kq}"
            heart: 1
            reply: "ป้าคิดมานานแล้วจ้ะ… ร้านข้าวแกงเล็กๆ ในตลาดนัด แต่ป้าไม่กล้า ถ้าขายไม่ได้ ป้าจะรู้ว่าแกงป้าอร่อยแค่ในงานบุญที่คนกินฟรี"
      - text: "ลูกป้าเก่งจัง{k}"
        heart: 1
        reply: "เก่งจ้ะ เก่งกว่าป้า… แต่ป้าอยากให้ลูกกลับมากินแกงป้ามากกว่าขายแกงป้า ป้าไม่รู้จะพูดยังไงให้ไม่เหมือนคนแก่บ่น"

  - id: thongbai_f_sugar
    topic: self
    when: { heart_min: 7 }
    npc: "หลาน… ป้าจะสารภาพ ที่ป้าบ่นทุกคนว่าแกงจืด จริงๆ ป้ากลัว กลัวว่าหมดรุ่นป้าแล้วจะไม่มีใครแกงแบบนี้ ป้าบ่นเพื่อให้คนอยากมาเรียน แต่ไม่มีใครมา คนหนีหมด"
    options:
      - text: "{p}จะมาเรียน{k} บ่นได้เต็มที่"
        heart: 2
        reply: "จริงนะหลาน… ป้าจะบ่นเต็มที่ ป้าจะบ่นจนหลานแกงเก่งกว่าป้า แล้วหลานค่อยบ่นป้าคืน ป้ารอวันนั้น"
      - text: "ป้าลองชมคนอื่นบ้างสิ{kq}"
        heart: 1
        reply: "ชม… ป้าลองแล้วจ้ะ ชมพี่หน่อยไปครั้งนึง พี่หน่อยตกใจจนทำทัพพีหล่น แล้วถามว่าป้าไม่สบายหรือเปล่า… ป้าว่าป้าบ่นต่อดีกว่า"
        next:
          - text: "แล้วป้ายังแอบใส่น้ำตาลอยู่ไหม{kq}"
            heart: 2
            reply: "…หลานรู้ได้ไง! ใครบอก! …นิดเดียวจ้ะ ช้อนชาเดียวต่อหม้อ มันกลมกล่อม ห้ามบอกใครเด็ดขาด ป้าด่าคนใส่น้ำตาลมาสามสิบปี"
          - text: "พี่หน่อยน่ารักดีนะ{kq}"
            heart: 1
            reply: "น่ารักจ้ะ… อย่าบอกพี่หน่อยว่าป้าพูด ป้าจะเสียฟอร์ม"

  # ===== others =====
  - id: thongbai_o_noi
    topic: others
    npc: "พี่หน่อยน่ะเก่งนะหลาน… น้ำซุปเคี่ยวหกชั่วโมง ใจเย็นกว่าป้าสิบเท่า แต่ใส่ผงปรุงรสนิดนึง ป้ารู้ ป้าดมได้"
    options:
      - text: "พี่หน่อยบอกว่าไม่ใส่นะ{kq}"
        heart: 1
        reply: "ไม่ใส่ในน้ำซุปจ้ะ ใส่ในลูกชิ้น… ลูกชิ้นครึ่งนึงพี่หน่อยซื้อมา ป้ารู้ แต่ป้าไม่พูด ทุกคนต้องมีความลับในครัวคนละนิด"
      - text: "ป้ากับพี่หน่อยใครแกงเก่งกว่า{kq}"
        heart: 1
        reply: "ป้าแกงเก่งกว่า พี่หน่อยต้มเก่งกว่า… แต่ถ้าหลานไปบอกพี่หน่อยว่าป้าพูดครึ่งหลัง ป้าจะปฏิเสธต่อหน้าพระ"

  - id: thongbai_o_daeng
    topic: others
    npc: "พรานแดงเอาปลาช่อนมาให้ป้าสามตัวเมื่อเช้า ไม่พูดสักคำ วางแล้วเดินไป… ป้าตะโกนตามว่า ‘หม้อแรกเหมือนเดิมนะ’ แกยกมือทีเดียว แค่นั้น"
    options:
      - text: "ลุงแดงพูดน้อยจัง{k}"
        heart: 1
        reply: "พูดน้อยแต่ทำเยอะจ้ะ ปลาที่แกให้ป้าสามสิบปี ถ้าคิดเป็นเงินซื้อบ้านได้หลังนึง… แกไม่เคยคิด ป้าก็ไม่เคยถาม"
      - text: "ป้ากับลุงแดง…{k} มีอะไรกันหรือเปล่า"
        heart: 0
        reply: "แหม! หลานเอ๊ย คิดอะไร ป้าอายุหกสิบห้า พรานแดงเจ็ดสิบสอง เรามีแต่ปลากับหม้อจ้ะ… ปลากับหม้ออยู่ด้วยกันมาสามสิบปี ก็พอแล้ว"

  - id: thongbai_o_bua
    topic: others
    npc: "ยายบัวบอกป้าว่าอย่าเข้าป่าทางเหนือพรุ่งนี้ ป้าถามว่าทำไม ยายบอก ‘เห็ดขึ้นเต็มแต่ไม่มีใครเก็บ เอ็งไม่สงสัยเหรอ’… ป้าเลยไปทางใต้ ขนลุกทั้งวัน"
    options:
      - text: "ป้าเชื่อยายบัวทุกเรื่องเลยเหรอ{kq}"
        heart: 1
        reply: "เรื่องผีเชื่อหมดจ้ะ เรื่องแกงไม่เชื่อ ยายบัวไม่กินเผ็ด ลิ้นยายบัวเชื่อไม่ได้"
      - text: "แล้วใครเก็บเห็ดทางเหนือ{kq}"
        heart: 1
        reply: "ไม่มีใครเก็บจ้ะ… ป้าเห็นจากไกลๆ เห็ดขึ้นเป็นวงกลมรอบต้นตะเคียน วงกลมเป๊ะเหมือนมีคนนั่งล้อมวงกินข้าว ป้าไม่เข้าไปนั่งด้วยหรอก"

  - id: thongbai_o_kla
    topic: others
    npc: "ไอ้กล้าใส่ซองเป็นข้าวสารอินทรีย์ห้ากิโลทุกงาน… ป้าบ่นมันทุกงาน แต่หุงกินหมดทุกงาน ข้าวมันหอมจริงนะหลาน อย่าบอกมัน"
    options:
      - text: "ทำไมไม่ชมเขาตรงๆ{kq}"
        heart: 1
        reply: "ชมไปมันจะพูดเรื่องสหกรณ์อีกสี่สิบนาที… ป้าชมด้วยการหุงหมด มันรู้"
      - text: "พี่กล้ากินข้าวที่วัดบ่อยไหม{kq}"
        heart: 1
        reply: "บ่อยจ้ะ มากินตอนบ่ายสาม ข้าวเที่ยงยังไม่ได้กิน… ป้าตักให้ทุกครั้ง แล้วด่าทุกครั้ง มันกินไปขอโทษไป ป้าว่าเด็กคนนี้ต้องมีคนคอยตักข้าวให้"
        next:
          - text: "ป้าจะหาคนตักข้าวให้เขาเหรอ{kq}"
            heart: 1
            reply: "ป้าไม่หาหรอกจ้ะ… ป้าแค่มองว่าใครชอบไปยืนที่สหกรณ์นานๆ หลานไปยืนบ่อยนะ ป้าเห็น"
          - text: "เขาเหนื่อยจริงๆ{k}"
            heart: 1
            reply: "เหนื่อยแบบยายเพียรตอนสาวๆ จ้ะ ทำให้คนอื่นจนลืมกินเอง… ป้าตักข้าวให้ยายเพียรมาสามสิบปีแบบเดียวกัน"

  - id: thongbai_o_porn
    topic: others
    npc: "ป้าพรมาบ่นเรื่องลุงสมหมายทุกเย็นหลาน… เมื่อวานลุงเอาเงินค่าปุ๋ยไปซื้อหวยอีก ป้าตำส้มตำใส่พริกเจ็ดเม็ดให้ป้าพรกิน กินแล้วหายโกรธ เพราะเผ็ดจนลืมโกรธ"
    options:
      - text: "ส้มตำแก้โกรธได้จริงเหรอ{kq}"
        heart: 1
        reply: "ได้จ้ะ เผ็ดจนน้ำตาไหล คนร้องไห้แล้วใจเบา… ป้าใช้สูตรนี้มาสามสิบปี ทั้งกับป้าพร ทั้งกับตัวเอง"
      - text: "ลุงสมหมายถูกหวยบ้างไหม{kq}"
        heart: 1
        reply: "ถูกเลขท้ายสองตัวปีละครั้งจ้ะ ได้พันนึง แล้วเอาไปเลี้ยงทั้งวงจนหมด… ป้าพรบอกว่าถูกหวยคือการเสียเงินแบบมีความสุข"

quests:
  - id: thongbai_q1
    npc: thongbai
    title: "เห็ดหลังฝนแรก"
    desc: "ป้าทองใบต้องการเห็ดโคนไปแกงถวายพระ และอยากรู้ว่าหลานยายเพียรตาถึงเรื่องเห็ดแค่ไหน"
    start: { heart_min: 1, day_min: 3 }
    offer:
      npc: "หลาน! วันพระนี้ป้าจะแกงเห็ดถวายพระ แต่เข่าป้าเดินป่าไม่ไหวสองวันติด… หลานไปหาเห็ดโคนมาให้ป้าสามดอกได้ไหม ป้าจะบอกจุดให้ แต่สาบานก่อนนะว่าไม่บอกใคร"
      options:
        - text: "สาบาน{k}ป้า {p}ไม่บอกใครแน่นอน"
          accept: true
          heart: 2
          reply: "ดี… ตามทางชายป่าไปจนเจอจอมปลวกใหญ่ เห็ดโคนชอบขึ้นรอบจอมปลวกหลังฝน ป้าบอกแค่นี้ ที่เหลือหลานหาเอง ใช้ตาไม่ใช่ใช้เท้า"
        - text: "เห็ดพิษหน้าตาเป็นยังไง{kq} {p}กลัวเก็บผิด"
          accept: true
          heart: 1
          reply: "ถามก่อนเก็บนี่ดีมาก! เห็ดโคนก้านยาว หมวกแหลมเหมือนหมวกเจ๊ก ไม่มีถ้วยที่โคน ถ้าเจอขาวทั้งดอกมีถ้วยหุ้มโคน วางลงแล้วเดินหนีเลย"
        - text: "ป้าซื้อตลาดก็ได้นะ{kq}"
          heart: 0
          reply: "เห็ดโคนตลาดกิโลละสี่ร้อยจ้ะหลาน… แล้วไม่รู้ว่าเก็บมาจากไหน ไว้หลานว่างค่อยมาบอกป้าก็ได้"
    steps:
      - goal: { type: give, npc: thongbai, item: mushroom, n: 3 }
        hint: "หาเห็ดโคน 3 ดอก เอาไปให้ป้าทองใบ"
        done:
          npc: "เอามาดูซิ… (ป้าพลิกทีละดอก ดม ส่องโคน) ดอกนี้ดี ดอกนี้ดี ดอกนี้… ดีมากจ้ะหลาน! ไม่ช้ำสักดอก ขุดลึกถึงโคน หลานเก็บเป็นนะ ใครสอน"
          options:
            - text: "ป้าสอนไง{kq} บอกว่าใช้ตาไม่ใช้เท้า"
              heart: 2
              reply: "แหม! ปากหวานเหมือนยายเพียร… ยายเพียรเก็บเห็ดน้อยที่สุดในหมู่บ้าน แต่เก็บดีที่สุด ไม่เคยเก็บดอกที่ยังไม่บาน ยายบอกให้มันโตอีกวัน"
            - text: "{p}ขุดด้วยมือ{k} กลัวเห็ดเจ็บ"
              heart: 1
              reply: "เห็ดไม่เจ็บหรอกหลาน แต่ใยใต้ดินมันเจ็บ ถ้าขุดด้วยมือ ใยยังอยู่ ปีหน้ามันขึ้นที่เดิม… หลานรู้โดยไม่ต้องสอน ป้าชอบ"
      - goal: { type: visit, place: temple, from: "06:00", to: "08:00" }
        hint: "ไปครัววัดดงเย็นตอนเช้า ช่วยป้าทองใบแกงเห็ดก่อนพระฉัน"
        done:
          npc: "มาพอดีหลาน! หั่นตะไคร้ซอยบางๆ … ช้าๆ ไม่ต้องรีบ… นั่น! ลุงจำรัสถือช้อนมาอีกแล้ว หลานยืนบังหม้อไว้เลย ห้ามให้ชิมก่อนพระฉัน"
          options:
            - text: "(ยืนบังหม้อ) ขอโทษ{k}ลุง รอพระฉันก่อน"
              heart: 2
              reply: "ฮ่า! ลุงจำรัสหน้าเหวอเลย สามสิบปีไม่เคยมีใครกล้าบังหม้อ นอกจากป้า… หลานผ่านแล้ว พรุ่งนี้มาคุมหม้อแกงจืดฟักทองได้เลย"
            - text: "ให้ลุงชิมคำเดียวเถอะ{k}ป้า"
              heart: 0
              reply: "คำเดียวของลุงจำรัสคือช้อนเท่าทัพพีนะหลาน… ก็ได้ คำเดียว แต่หลานต้องจดในสมุดบัญชีวัดให้ด้วยว่า ‘มัคนายกชิมก่อนพระ หนึ่งครั้ง’"
            - text: "ป้าชิมก่อนหรือยัง{kq} จืดไหม"
              heart: 1
              reply: "แหม ถามเหมือนป้าเลย… ชิมแล้วจ้ะ ไม่จืด เห็ดหลานหวานมาก ป้าไม่ต้องเติมอะไร วันนี้ป้าไม่มีอะไรจะบ่น ป้าเหงาปากนิดนึง"
    reward: { money: 120, heart: 2, items: { het_pho: 1 }, set_flag: thongbai_q1_done, line: { from: thongbai, text: "วันพระนี้แกงเห็ดโคนถวายพระหมดหม้อจ้ะ 🍄 ขอบใจหลานยายเพียรที่ช่วยหาเห็ดกับบังหม้อ ลุงจำรัสไม่ต้องโกรธนะ ป้าเก็บก้นหม้อไว้ให้แล้ว" } }

  - id: thongbai_q2
    npc: thongbai
    title: "หม้อที่ไม่จืด"
    desc: "ป้าทองใบท้าพี่หน่อยแข่งแกงเขียวหวานงานบุญ ให้พระอาจารย์สุเมธเป็นคนชิม"
    start: { flag: thongbai_q1_done, heart_min: 3, day_min: 6 }
    offer:
      npc: "หลาน ป้าท้าพี่หน่อยแข่งแกงเขียวหวานงานบุญวันพระหน้าแล้ว! ป้าจะชนะให้ได้ ป้าต้องการพริกขี้หนูสดๆ จากแปลงหลาน พริกตลาดมันเผ็ดแบบเหนื่อยๆ"
      options:
        - text: "ได้{k}ป้า {p}เก็บให้"
          accept: true
          heart: 1
          reply: "หกเม็ดนะ เม็ดแดงๆ สุกพอดี… แล้วไปสืบหน่อยว่าพี่หน่อยจะใส่อะไร ป้าไม่ได้ขี้โกงนะ ป้าเรียกว่าวิจัยตลาด"
        - text: "{p}อยู่ข้างพี่หน่อยด้วยนะ{kq}"
          accept: true
          heart: 1
          reply: "แหม! สองหน้าเหรอหลาน… ก็ได้ จะไปช่วยใครก็ช่วย แต่พริกต้องมาให้ป้านะ พริกไม่มีฝ่าย"
        - text: "แข่งกันทำไม{kq} ทำด้วยกันไม่ดีกว่าเหรอ"
          heart: 0
          reply: "ทำด้วยกันแล้วไม้พายตีกันจ้ะ เณรต้นยังเล่าไม่จบเลย… ไว้หลานอยากช่วยค่อยมาบอกป้า"
    steps:
      - goal: { type: give, npc: thongbai, item: chili, n: 6 }
        hint: "เก็บพริก 6 เม็ดจากแปลง เอาไปให้ป้าทองใบ"
        done:
          npc: "พริกหลานเผ็ดถึงใจ! ป้าดมแล้วจามสามที… ดีจ้ะ แกงเขียวหวานต้องเผ็ดก่อนหวาน ไม่ใช่หวานก่อนเผ็ดแบบร้านในอำเภอ"
          options:
            - text: "ป้าจะใส่น้ำตาลไหม{kq}"
              heart: 1
              reply: "…ใส่นิดนึงจ้ะ แกงเขียวหวานไม่ใส่ได้ไง ชื่อมันฟ้อง แต่ป้าใส่นิดเดียว ป้าไม่ใช่คนใส่น้ำตาลนะ ป้าเป็นคนบาลานซ์"
            - text: "ป้าว่าจะชนะไหม{kq}"
              heart: 1
              reply: "ป้าแพ้พี่หน่อยเรื่องกระยาสารท ชนะเรื่องแกงทุกปี… ปีนี้พระอาจารย์ชิม ท่านไม่ชอบหวาน ป้าได้เปรียบ แต่พี่หน่อยฉลาด ป้าไม่ประมาท"
      - goal: { type: talk, npc: noi }
        hint: "แวะร้านพี่หน่อย ดูว่าพี่หน่อยเตรียมแกงยังไง"
        done:
          npc: "น้องมาสืบให้ป้าทองใบใช่ไหม… พี่รู้จ้ะ ป้าส่งคนมาสืบทุกปี ปีที่แล้วส่งเณรต้นมา ไม่เป็นไร พี่บอกให้เลย พี่จะใช้มะเขือเปราะจากสวนกล้า กะทิคั้นสด แล้วชิมก่อนแล้วค่อยเติม… บอกป้าครบทุกคำเลยนะ"
          options:
            - text: "{p}ไม่บอกป้าหรอก{k} ไม่ยุติธรรม"
              heart: 2
              reply: "น้องน่ารักจัง… แต่บอกไปเถอะ ป้าจะได้ไม่นอนไม่หลับ ป้าทองใบนอนไม่หลับทีไร แกงเค็มทุกที พี่อยากแข่งกับป้าตอนป้าดีที่สุด"
            - text: "พี่หน่อยกลัวแพ้ไหม{kq}"
              heart: 1
              reply: "กลัวจ้ะ แต่พี่กลัวชนะมากกว่า… ถ้าพี่ชนะ ป้าจะเงียบไปหนึ่งอาทิตย์ ป้าเงียบทีไรพี่เหงา ร้านพี่ไม่มีคนมาบอกว่าจืด"
      - goal: { type: visit, place: temple, from: "09:00", to: "11:00" }
        hint: "ไปวัดดงเย็นช่วงสายวันงานบุญ ดูพระอาจารย์สุเมธชิมแกงสองหม้อ"
        done:
          npc: "(พระอาจารย์สุเมธชิมหม้อป้า แล้วชิมหม้อพี่หน่อย ยิ้ม แล้วบอกว่า ‘อาตมาขอให้โยมสองคนเทรวมกันหม้อเดียว แล้วแจกญาติโยมพร้อมกัน’ …ป้าทองใบหันมาหาเอ็ง) หลาน! ท่านตัดสินแบบนี้ได้ไง หลานว่าหม้อไหนอร่อยกว่า พูดมาเลย"
          options:
            - text: "หม้อป้า{k} เผ็ดก่อนหวาน"
              heart: 1
              set_flag: thongbai_q2_win
              reply: "นั่นไง! ป้าบอกแล้ว… (ป้าหันไปมองพี่หน่อย พี่หน่อยยิ้ม) ช่างเถอะ ป้าชนะในใจหลานก็พอ เทรวมกันก็ได้ ตามที่ท่านว่า"
            - text: "หม้อพี่หน่อย{k} กะทิหอมกว่า"
              heart: 1
              set_flag: thongbai_q2_lose
              reply: "…กะทิคั้นสด ป้าคั้นเมื่อวาน เพราะเข่าป้าลุกตอนตีสามไม่ไหว ป้ายอมรับจ้ะ หลานลิ้นตรง ป้าชอบคนลิ้นตรงมากกว่าคนเข้าข้างป้า"
            - text: "เทรวมกันอร่อยที่สุด{k} ท่านพูดถูก"
              heart: 2
              set_flag: thongbai_q2_together
              reply: "แหม… หลานพูดเหมือนพระ ป้าเถียงไม่ได้ (ป้าชิมหม้อรวม แล้วเงียบไปนาน) …ไม่จืด ไม่จืดเลยหลาน ป้ากับพี่หน่อยแกงหม้อเดียวกันครั้งแรกในรอบสิบห้าปี ไม่มีไม้พายตีกัน"
    reward: { money: 0, heart: 2, items: { green_curry: 2 }, set_flag: thongbai_q2_done }

  - id: thongbai_q3
    npc: thongbai
    title: "หน้าที่สอดอยู่ในสมุดแม่"
    desc: "ป้าทองใบเจอหน้ากระดาษลายมือยายเพียรสอดอยู่ในสมุดสูตรแกงของแม่ ป้าไม่กล้าอ่านคนเดียว"
    start: { flag: thongbai_q2_done, heart_min: 4, day_min: 9 }
    offer:
      npc: "หลาน… ป้าเปิดสมุดสูตรแกงของแม่ป้าเมื่อคืน มีกระดาษแผ่นนึงสอดอยู่ ลายมือยายเพียร ป้าจำได้ ยายยืมสมุดป้าไปตอนงานศพลุงแกแล้วเอามาคืน… ป้ายังไม่กล้าอ่าน เย็นนี้มาบ้านป้าได้ไหม อ่านให้ป้าฟังหน่อย"
      options:
        - text: "{p}จะไป{k}ป้า"
          accept: true
          heart: 2
          reply: "สี่โมงเย็นนะหลาน ป้าจะตำน้ำพริกรอ… ป้าต้องทำอะไรสักอย่างกับมือ ไม่งั้นป้านั่งไม่ติด"
        - text: "ทำไมป้าไม่อ่านเอง{kq}"
          accept: true
          heart: 1
          reply: "ป้ากลัวจ้ะ… กลัวว่ายายเพียรเขียนว่าแกงป้าจืด ฮ่า ป้าพูดเล่น ป้าแค่ไม่อยากเป็นคนเดียวที่รู้ ถ้ามันเป็นเรื่องที่ทำให้ร้องไห้"
        - text: "ไว้วันหลังนะ{kq}ป้า"
          heart: 0
          reply: "จ้ะ… มันอยู่ในสมุดมาสิบปีแล้ว อยู่ต่ออีกวันก็ได้"
    steps:
      - goal: { type: visit, place: house_thongbai, from: "16:00", to: "18:00" }
        hint: "ไปบ้านป้าทองใบช่วงเย็น อ่านหน้าสมุดของยายเพียรให้ป้าฟัง"
        done:
          npc: "(ป้าทองใบยื่นกระดาษพับให้ มือป้ายังมีกลิ่นพริก) …อ่านเลยหลาน ป้าตำต่อ ป้าฟังอยู่"
          set_flag: diary_thongbai
          options:
            - text: "(อ่าน) ‘วันงานศพผัวทองใบ ทองใบยังมาแกงเองทุกหม้อ ไม่ร้องสักแหมะ แต่ลืมใส่ทุกอย่าง ฉันแอบเติมน้ำปลา มะขามเปียก พริก ให้ทุกหม้อก่อนยกออกไปตั้ง…’"
              heart: 2
              reply: "(เสียงสากหยุด)"
              next:
                - text: "‘…ไม่ทันเติมหม้อก้นครัวหม้อเดียว ขอให้ทองใบชิมแต่หม้อที่ยกออกไป อย่าให้เขารู้ว่ามือตก แขกทั้งงานบอกว่าแกงอร่อย ทองใบยิ้มครั้งเดียวทั้งงาน’"
                  heart: 2
                  reply: "…ป้าชิมหม้อก้นครัวตอนดึก จืดสนิท ป้านึกว่าทั้งงานกินแกงจืดแล้วไม่มีใครกล้าบอก ป้าอายมาสิบปี… ยายเพียรเติมให้ทุกหม้อ แล้วไม่บอกป้าสักคำ คนอะไร… (ป้าเช็ดตาด้วยแขนเสื้อ) หอมมันแรงจ้ะ หอมมันแรง"
                - text: "ป้า… ข้างหลังมีสูตรแกงไข่มดแดงของยายด้วย{k}"
                  heart: 2
                  reply: "สูตรยายเพียร… ยายเขียนว่า ‘ใส่มะขามเปียกแทนมะนาว อย่างที่ทองใบชอบ’ ป้าไม่เคยบอกใครว่าป้าชอบ ยายรู้ได้ไง… ยายรู้ทุกอย่าง แล้วไม่เคยพูด"
            - text: "ป้าอ่านเองเถอะ{k} {p}นั่งข้างๆ"
              heart: 1
              reply: "(ป้าอ่านเงียบๆ นานมาก แล้ววางกระดาษลงบนครก) …ยายเพียรแอบเติมแกงให้ป้าทุกหม้อในงานศพลุง ป้าลืมใส่ทุกอย่าง ป้านึกว่าทั้งงานกินแกงจืด ป้าอายมาสิบปี… ที่แท้แขกได้กินแกงยายเพียร ไม่ใช่แกงป้า"
      - goal: { type: give, npc: thongbai, item: ant_egg, n: 2 }
        hint: "หาไข่มดแดง 2 ห่อ เอาไปให้ป้าทองใบแกงตามสูตรยายเพียร"
        done:
          npc: "แกงไข่มดแดงสูตรยายเพียร… มะขามเปียกแทนมะนาว ป้าทำตามทุกตัวอักษร ไม่เติมอะไรของป้าเลย ชิมสิหลาน หลังทัพพีนะ"
          options:
            - text: "ไม่จืด{k}ป้า อร่อยมาก"
              heart: 2
              reply: "ไม่จืดใช่ไหม… ครั้งแรกในชีวิตที่ป้าแกงตามสูตรคนอื่นแล้วไม่บ่น ป้าจะทำทุกวันพระแทนแกงเผ็ด ลุงแกคงไม่ว่า ลุงแกกินเผ็ดไม่ไหวแล้ว"
            - text: "เหมือนรสที่ยายเคยทำให้กิน{k}"
              heart: 2
              reply: "จริงเหรอหลาน… งั้นป้าแกงได้รสยายเพียรแล้ว ยายเติมแกงให้ป้าครั้งหนึ่ง ป้าจะแกงรสยายให้หลานไปตลอด ถือว่าใช้หนี้"
    reward: { money: 0, heart: 2, items: { red_ant_egg: 1 }, set_flag: thongbai_q3_done }

  - id: thongbai_q4
    npc: thongbai
    title: "แผงแรกในตลาดนัด"
    desc: "ป้าทองใบอยากลองขายข้าวแกงในตลาดนัดมาทั้งชีวิตแต่ไม่กล้า ช่วยป้าตั้งแผงแรก"
    start: { flag: thongbai_q3_done, heart_min: 6, day_min: 12 }
    offer:
      npc: "หลาน… ป้าคิดมาสามคืนแล้ว ยายเพียรทำให้คนอื่นโดยไม่หวังอะไร ป้าทำงานบุญมาสามสิบปีก็เหมือนกัน… แต่ป้าอยากลองทำอะไรให้ตัวเองบ้างสักครั้ง ร้านข้าวแกงเล็กๆ ในตลาดนัด หลานช่วยป้าไหม"
      options:
        - text: "ช่วยแน่นอน{k} ป้าทำได้"
          accept: true
          heart: 2
          reply: "โอ้ย หลานพูดแล้วป้าใจฟู… ต้องไปเช่าแผงกับ อบต. ก่อน ค่าแผงวันละสี่สิบ ค่าไฟอีกยี่สิบ ทั้งที่แผงไม่มีปลั๊ก ป้าถามแล้ว เขาบอกว่าเป็น ‘ค่าไฟส่วนกลาง’"
        - text: "ป้าไม่กลัวขายไม่ได้เหรอ{kq}"
          accept: true
          heart: 1
          reply: "กลัวจ้ะ กลัวมาสามสิบปี… แต่ยายเพียรไม่กลัวอะไรเลยตอนทำให้ป้า ป้าจะลองไม่กลัวสักวันนึง วันเดียวพอ"
        - text: "ป้าทำงานวัดอย่างเดียวก็ดีแล้ว{k}"
          heart: -1
          reply: "…ดีจ้ะ ป้ารู้ หลานห่วงป้า แต่อย่าตัดสินแทนป้านะหลาน ไว้หลานเปลี่ยนใจค่อยมาบอก"
    steps:
      - goal: { type: pay, npc: thongbai, n: 180 }
        hint: "ช่วยป้าทองใบจ่ายค่าเช่าแผงตลาดนัดสามวัน (180 บาท)"
        done:
          npc: "ใบเสร็จ อบต. มาแล้วหลาน… ค่าแผงสามวัน ค่าไฟส่วนกลางสามวัน ค่าธรรมเนียมจัดการขยะ แผงป้าห่อใบตองหมด ไม่มีขยะสักชิ้น… ช่างเถอะ ป้าจะแกงให้คุ้มค่าไฟที่ไม่มีไฟ"
          options:
            - text: "ใบเสร็จนี้เก็บไว้เป็นที่ระลึก{k}"
              heart: 1
              reply: "เก็บจ้ะ ใบเสร็จแรกในชีวิตที่ป้าจ่ายเพื่อตัวเอง… ป้าจะแปะไว้ในสมุดสูตรแม่ หน้าเดียวกับกระดาษยายเพียร"
            - text: "ค่าไฟส่วนกลางคืออะไร{kq}"
              heart: 1
              reply: "ป้าถามแล้วจ้ะ เขาบอกเป็นไฟเสาส่องสว่างตลาด… ตลาดนัดวายตอนบ่ายสอง ไฟเสาเปิดตอนหกโมงเย็น ไฟส่องให้ใครดูหมาวิ่งก็ไม่รู้"
      - goal: { type: visit, place: market, from: "07:00", to: "10:00" }
        hint: "ไปตลาดนัดตอนเช้า ช่วยป้าทองใบขายข้าวแกงวันแรก"
        done:
          npc: "(แผงป้าทองใบมีหม้อแกงสี่หม้อ ป้ายมือเขียนว่า ‘ข้าวแกงป้าทองใบ ไม่จืด’ คิวยาวถึงแผงเจ๊หงษ์… สองชั่วโมงขายหมด) หลาน! หมดแล้ว! ป้ายังไม่ทันได้บ่นใครเลย… ป้าต้องตัดสินใจแล้วว่าจะทำยังไงต่อ หลานว่าไง"
          options:
            - text: "ขายประจำทุกวันตลาดนัดเลย{k} ป้า"
              heart: 2
              set_flag: thongbai_end_stall
              reply: "ทุกพุธทุกเสาร์… ป้าจะแกงสี่หม้อ ห้ามเกิน เข่าป้ายังอยู่ งานวัดป้าก็ยังทำ แต่วันตลาดนัด ป้าเป็นแม่ค้า ป้าทองใบแม่ค้า ฟังแล้วแปลกดีนะหลาน"
            - text: "รับออเดอร์ทางกลุ่ม LINE ทำตามสั่ง{k} ไม่ต้องยืนทั้งวัน"
              heart: 2
              set_flag: thongbai_end_line
              reply: "รับสั่งก่อนแล้วแกงตามจำนวน ไม่เหลือทิ้ง ไม่ต้องยืนตากแดด… หลานต้องสอนป้าพิมพ์นะ ป้าพิมพ์ทีไรเป็นสติกเกอร์หมี"
            - text: "เอาสมุดสูตรไปไว้ครัววัด{k} สอนคนรุ่นใหม่ให้แกงต่อ"
              heart: 2
              set_flag: thongbai_end_temple
              reply: "…ขายวันนี้วันเดียวป้ารู้แล้วหลาน ว่าแกงป้าขายได้ ป้าไม่ต้องรู้อะไรอีก ที่เหลือป้าอยากให้คนแกงต่อ สมุดแม่ป้า กระดาษยายเพียร จะอยู่ในครัววัด ใครอยากเรียนมาเรียน ป้าจะบ่นให้ทุกคนฟรี"
    reward: { money: 250, heart: 2, items: { kaeng_pa: 2 }, set_flag: thongbai_q4_done, line: { from: thongbai, text: "ขอบใจทุกคนที่มาอุดหนุนแผงข้าวแกงป้าวันแรกนะ หมดเกลี้ยงก่อนสิบโมง 🍛 ใครยังไม่ได้กินไม่ต้องเสียใจ ป้ายังแกงต่อ ไม่จืดแน่นอน" } }
