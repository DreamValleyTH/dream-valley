# กำนันประเสริฐ — convos + quests
convos:
  # ===== react =====
  - id: prasert_r_meet
    topic: react
    once: true
    when: { not_flag: met_prasert }
    npc: "เฮ้ย! หลานยายเพียรใช่ไหม หน้าเหมือนยายตอนโกรธเลย กำนันประเสริฐ จำไว้ เรื่องอะไรในตำบลมาหากำนันก่อน"
    set_flag: met_prasert
    options:
      - text: "สวัสดี{k}กำนัน ยายเคยพูดถึงกำนันบ่อย"
        heart: 1
        reply: "พูดดีหรือพูดร้าย… ไม่ต้องตอบ ยายเพียรด่ากำนันต่อหน้าทุกครั้ง แต่ลับหลังฝากขนมมาให้แพรว แบบนี้แหละคนรุ่นนั้น"
        next:
          - text: "ยายด่ากำนันเรื่องอะไร{kq}"
            heart: 1
            reply: "เรื่องถนนบ้าง เรื่องน้ำบ้าง เรื่องไก่ขันเสียงดังบ้าง ข้อสุดท้ายกำนันไม่รับนะโว้ย ไก่มันขันตามธรรมชาติ"
          - text: "ฝากขนมอะไรให้แพรว{kq}"
            heart: 1
            reply: "ขนมชั้น ทุกวันพระ แพรวกินจนอายุสิบห้า แล้วก็มาบอกว่าลดน้ำหนัก ยายเพียรเสียใจไปทั้งเดือน"
      - text: "มีเรื่องอะไรต้องมาหากำนันบ้าง{kq}"
        heart: 0
        reply: "ทุกเรื่อง! ที่ดิน เอกสาร ทะเลาะกับเพื่อนบ้าน ไก่หาย… เรื่องผีไม่ต้องนะ ไปหายายบัว"
      - text: "ไก่กำนันขันดังจริงด้วย ได้ยินถึงบ้าน{p}เลย"
        heart: 0
        reply: "ถึงเลยเหรอ! ดี! เจ้าประดู่มันเสียงดีที่สุดในอำเภอ ได้ยินถึงก็ถือว่าได้บุญหูนะโว้ย"

  - id: prasert_r_intro
    topic: react
    once: true
    when: { flag: story_town_intro }
    npc: "ได้ยินสมศักดิ์ประกาศชื่อหลานไหม ‘ยินดีต้อนรับหลานยายเพียร’ สามรอบ รอบที่สามไมค์หอน ไก่กำนันขันรับเลย"
    options:
      - text: "อายจะแย่{k}กำนัน คนทั้งตลาดหันมามอง"
        heart: 1
        reply: "อายทำไม ตอนกำนันได้เป็นกำนัน สมศักดิ์ประกาศห้ารอบ รอบที่ห้าเขาลืมว่าประกาศอะไร พูดชื่อเฉยๆ ห้ารอบ"
      - text: "ผู้ใหญ่ประกาศแบบนี้ทุกคนเลยเหรอ{kq}"
        heart: 1
        reply: "ทุกคนที่ย้ายมา ทุกคนที่ตาย ทุกคนที่ควายหาย เสียงเดียวกันหมด ฟังไม่ออกหรอกว่าข่าวดีหรือข่าวร้าย ต้องฟังให้จบ"
      - text: "ไม่ได้ยิน{k}"
        heart: 0
        reply: "ไม่ได้ยินได้ไง สามรอบนะโว้ย… อ้อ อยู่ที่ฟาร์มนี่ เสียงไปไม่ถึงไร่ ก็ดี ไม่งั้นจะได้ยินชื่อตัวเองทั้งวัน"

  - id: prasert_r_thana_refused
    topic: react
    once: true
    when: { flag: thana_refused }
    npc: "ได้ข่าวว่าไล่คุณธนากลับไปแล้วเหรอ ทั้งตำบลรู้แล้วโว้ย ป้าแต๋วรู้ก่อนรถเขาจะออกจากทางลูกรังอีก"
    options:
      - text: "{p}แค่บอกว่าไม่ขาย{k} ไม่ได้ไล่"
        heart: 1
        reply: "ไม่ได้ไล่ แต่หน้าเขาตอนขับผ่านบ้านกำนันเหมือนโดนไล่ ดีแล้ว ยายเพียรไล่เขามาสามรอบ หลานรอบที่สี่ ครบสูตร"
        next:
          - text: "กำนันว่า{p}ทำถูกไหม{kq}"
            heart: 2
            reply: "…กำนันว่าถูก แต่กำนันพูดดังๆ ไม่ได้ กำนันยังไม่ได้ตอบเขาเรื่องที่กำนันเลย คนตอบช้ามันพูดเรื่องคนอื่นไม่ถนัด"
          - text: "เขาจะกลับมาอีกไหม{kq}"
            heart: 0
            reply: "มาแน่ คนบริษัทเขาไม่เคยมารอบเดียว รอบหน้าราคาขึ้นนิด ยิ้มกว้างขึ้นหน่อย ระวังรอยยิ้มรอบที่ห้า"
      - text: "กำนันก็โดนเสนอเหมือนกันไม่ใช่เหรอ{kq}"
        heart: 0
        reply: "ใครบอก! …ป้าแต๋ว ใช่ไหม กำนันจะไปซื้อไข่ร้านอื่นสักอาทิตย์ ประท้วงเงียบๆ"

  - id: prasert_r_thana_maybe
    topic: react
    once: true
    when: { flag: thana_maybe }
    npc: "หลานบอกคุณธนาว่าขอคิดก่อนเหรอ… ดี คิดได้ คิดนานๆ คิดจนเขาเบื่อ กำนันก็ใช้วิธีนี้อยู่"
    options:
      - text: "กำนันก็ยังคิดอยู่เหรอ{kq}"
        heart: 1
        reply: "คิดตอนตีสาม คิดตอนอาบน้ำไก่ คิดตอนนั่งประชุม… ตอนประชุมคิดจนหลับ คนเลยว่ากำนันหลับ ไม่ใช่นะ คิดลึก"
        next:
          - text: "คิดลึกแล้วได้คำตอบหรือยัง{kq}"
            heart: 1
            reply: "ได้แล้วสามคำตอบ ตอนเช้าไม่ขาย ตอนเย็นขาย ตอนตีสามไม่รู้ ไก่ยังตัดสินใจเร็วกว่ากำนัน"
          - text: "ถ้ากำนันขาย{p}ก็คงลำบาก"
            heart: 1
            reply: "รู้… รู้ดี อย่าพูดซ้ำ สมศักดิ์พูดซ้ำคนเดียวในตำบลก็พอแล้ว"
      - text: "{p}แค่อยากรู้ราคาตลาดก่อน{k}"
        heart: 0
        reply: "ราคาตลาดที่ดินแถวนี้ไร่ละไม่กี่หมื่น เขาให้หลานเกินเท่าตัว คนให้เกินเท่าตัว ไม่ได้ซื้อที่หรอก เขาซื้ออะไรที่อยู่ใต้ที่"

  - id: prasert_r_thana_haggled
    topic: react
    once: true
    when: { flag: thana_haggled }
    npc: "ได้ยินว่าต่อราคากับคุณธนาเหรอ เก่งนะโว้ย คนตำบลนี้ต่อราคาได้แค่ปลาทูกับเจ๊หงษ์"
    options:
      - text: "แค่อยากรู้ว่าเขายอมได้ถึงเท่าไหร่{k}"
        heart: 1
        reply: "แล้วเขาขึ้นให้ไหม… ขึ้นเหรอ ขึ้นไม่ต้องคิดเลยเหรอ อืม กำนันไม่ชอบ คนจ่ายง่ายแปลว่ามันได้มากกว่านั้นอีกหลายเท่า"
      - text: "กำนันได้ราคาเท่าไหร่{kq}"
        heart: 0
        reply: "ไม่บอก! …ก็ได้ บอกนิดนึง มากพอที่กำนันจะซื้อไก่สวยงามได้ทั้งอำเภอ แล้วไม่มีน้ำให้มันกิน"
        next:
          - text: "ไก่ไม่มีน้ำกินก็ไม่สวยนะ{kq}"
            heart: 2
            reply: "นั่นแหละ! พูดเหมือนแพรวเลย เมื่อคืนแพรวพูดประโยคนี้ กำนันเถียงไม่ออก วันนี้หลานพูดอีก กำนันเริ่มรำคาญความจริง"
          - text: "ซื้อไก่ทั้งอำเภอก็ได้แชมป์ทุกปีสิ{kq}"
            heart: 0
            reply: "แชมป์ไม่มีคู่แข่งมันไม่สนุกโว้ย เหมือนเลือกตั้งที่มีผู้สมัครคนเดียว ชนะแล้วยังต้องแจกซองอยู่ดี"

  - id: prasert_r_meeting1
    topic: react
    once: true
    when: { flag: story_meeting1 }
    npc: "ประชุมเมื่อวาน… ใครถ่ายรูปกำนันหลับลงกลุ่ม LINE บอกมาเลย กำนันไม่ได้หลับ กำนันหลับตาฟัง"
    options:
      - text: "{p}ไม่ได้ถ่าย{k} แต่เห็นกำนันกรน"
        heart: 1
        reply: "กรนก็คือการหายใจแบบมีจังหวะ… นายกฯ พูดสี่สิบนาที กำนันฟังนาทีที่สามสิบเก้า สรุปได้เท่ากับคนที่ฟังทั้งหมด"
      - text: "แพรวถ่าย{k}"
        heart: 0
        reply: "แพรว! ลูกตัวเองแท้ๆ… ยอดไลก์เท่าไหร่ เดี๋ยวกำนันไปดู ถ้าไม่ถึงร้อยกำนันจะเสียใจสองต่อ"
      - text: "นายกฯ พูดอะไรบ้าง{kq} {p}ก็ฟังไม่ทัน"
        heart: 1
        reply: "สรุปได้สามข้อ หนึ่ง เรารับทราบ สอง เราจะขับเคลื่อน สาม ข้อหนึ่งกับข้อสองยังเป็นจริงอยู่ กำนันจดไว้ตั้งแต่ปี 60"

  - id: prasert_r_result_road
    topic: react
    once: true
    when: { flag: meeting1_result_road }
    npc: "ถนนชนะโหวต… เสี่ยเฮงยิ้มทั้งวัน แต่ฟังให้ดีนะ งบล้านห้า ครึ่งหนึ่งไปเป็น ‘ศึกษาความเป็นไปได้’ อีกครึ่งเป็นถนน… สามร้อยเมตร"
    options:
      - text: "ศึกษาความเป็นไปได้ของถนนต้องใช้เงินตั้งเจ็ดแสนห้าเลยเหรอ{kq}"
        heart: 1
        reply: "ต้องศึกษาว่าถนนมันเป็นไปได้ไหมไง ทั้งที่ถนนเส้นนี้ซ่อมมาแล้วหกรอบ ก่อนเลือกตั้งทุกรอบ ถนนมันคงยังไม่แน่ใจในตัวเอง"
        next:
          - text: "ใครเป็นคนศึกษา{kq}"
            heart: 1
            reply: "บริษัทที่ปรึกษาจากอำเภอ ชื่อยาวสามบรรทัด เจ้าของนามสกุลคุ้นๆ… กำนันไม่ได้พูดนะ ป้าแต๋วพูด กำนันแค่พยักหน้า"
          - text: "ถนนสามร้อยเมตรไปถึงไหน{kq}"
            heart: 0
            reply: "จากหน้าลานเสี่ยเฮง ไปถึง… หน้าลานเสี่ยเฮงอีกฝั่ง กำนันวัดแล้ว พอดีเป๊ะ เหมือนมีคนวัดไว้ก่อน"
      - text: "{p}ก็โหวตถนนนะ{k}"
        heart: 0
        reply: "ไม่ผิดหรอก ถนนก็จำเป็น แค่อย่าแปลกใจถ้าปีหน้ามันเป็นหลุมที่เดิม หลุมมันจำบ้านมันได้"

  - id: prasert_r_result_water
    topic: react
    once: true
    when: { flag: meeting1_result_water }
    npc: "ระบบน้ำชนะ! กำนันดีใจนะโว้ย… จนได้อ่านหนังสือ อบต. งบแบ่งไปศึกษาความเป็นไปได้ครึ่งนึง เหลือพอทำป้าย ‘โครงการระบบน้ำ’ กับท่อสองเส้น"
    options:
      - text: "ท่อสองเส้นไปไหน{kq}"
        heart: 1
        reply: "เส้นนึงเข้าวัด ดีแล้ว อีกเส้นเข้า… ยังไม่รู้ ผู้รับเหมาบอกว่าแล้วแต่ความเป็นไปได้ ความเป็นไปได้ตัวนี้มีลูกเมียไหมก็ไม่รู้ กินงบเก่งจัง"
      - text: "ป้ายใหญ่ไหม{kq}"
        heart: 1
        reply: "ใหญ่กว่าบ่อน้ำ มีรูปนายกฯ ยิ้มเห็นฟันหกซี่ ยืนข้างก๊อกน้ำที่ยังไม่มีน้ำ ถ่ายตอนไหนกำนันก็ไม่รู้"
      - text: "อย่างน้อยก็ได้เริ่ม{k}"
        heart: 1
        reply: "ใช่ พูดแบบนี้แหละถูก กำนันแก่แล้วขี้บ่น หลานยังหนุ่มยังสาวมองแง่ดีไว้ ไก่หนุ่มขันเช้ากว่าไก่แก่"

  - id: prasert_r_well
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "บ่อหลังร้านป้าแต๋วแห้ง แล้วบ่อลุงสมหมายอีก… บ่อบ้านกำนันยังไม่แห้งนะ หลานรู้ไหมว่าทำไม"
    options:
      - text: "เพราะบ่อกำนันลึกกว่า{kq}"
        heart: 0
        reply: "ลึกกว่าก็ส่วนหนึ่ง… อีกส่วนเพราะบริษัทยังรอคำตอบจากกำนันอยู่ เขาไม่อยากให้กำนันโกรธก่อนเซ็น กำนันรู้ทัน แต่รู้ทันแล้วก็ยังนอนไม่หลับ"
        next:
          - text: "แบบนี้กำนันต้องพูดแทนชาวบ้านแล้ว{k}"
            heart: 2
            reply: "พูดแล้ว พูดที่อำเภอ เขาบอกให้ทำหนังสือ กำนันทำ เขาบอกรับทราบ สมศักดิ์บอกว่ารับทราบครั้งที่สี่ฟรี"
          - text: "กำนันกลัวอะไร{kq}"
            heart: 1
            reply: "กลัวลูกสาวมองกำนันเหมือนมองคนอื่นที่ขายตำบล… กำนันพูดมากไปแล้ว ไปๆ ไปตักน้ำ"
      - text: "ปาล์มเอาเครื่องวัดมาแล้วนะ{kq}"
        heart: 1
        reply: "เห็นแล้ว ตลับเมตรกับเชือกฟาง เครื่องวัดของ อบต. เครื่องจริงเขาสั่งไปสามปี ยังอยู่ระหว่างจัดซื้อจัดจ้าง ปาล์มเลยใช้มือตัวเอง"

  - id: prasert_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ถังน้ำ CSR โลโก้บริษัทตัวเท่าหัวคน กำนันได้มาสามใบ แจกกำนันก่อนชาวบ้าน… กำนันเอาไปรองน้ำให้ไก่ ไก่ไม่ยอมกิน"
    options:
      - text: "ไก่มันรู้เรื่องเหรอ{kq}"
        heart: 1
        reply: "ไก่มันไม่รู้ แต่มันเห็นกำนันหน้าบึ้งตอนตักน้ำใส่ มันอ่านหน้ากำนันเก่งกว่าลูกบ้าน"
      - text: "กำนันอยู่ฝั่งไหนในที่ประชุม{kq}"
        heart: 1
        reply: "กำนันนั่งตรงกลาง ฝั่งซ้ายกล้า ฝั่งขวาเสี่ยเฮง กำนันเลยหันไปทางไหนก็โดนมอง เลยมองพื้น พื้นศาลาสวยนะ สมศักดิ์ถูทุกเช้า"
        next:
          - text: "มองพื้นไม่ได้ตลอดไปนะ{kq}กำนัน"
            heart: 2
            reply: "…รู้ แพรวพูดประโยคนี้เป๊ะ สงสัยนัดกันมา"
          - text: "{p}ก็จะมองพื้นเหมือนกัน{k}"
            heart: 0
            reply: "อย่า หลานยังหนุ่มยังสาว มองพื้นเป็นงานคนแก่ เดี๋ยวหลังค่อมเหมือนกำนัน"

  - id: prasert_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ป้ายหาเสียงเต็มเสาไฟแล้ว เสาหน้าบ้านกำนันมีห้าป้าย ซ้อนกันจนเสาไม่เหลือที่ให้ไฟฟ้า"
    options:
      - text: "กำนันลงสมัครไหม{kq}"
        heart: 1
        reply: "ไม่ลง! กำนันเป็นกำนันพอแล้ว แต่ทุกคนมาขอให้กำนันช่วยคนละนิด คนละนิดรวมกันเป็นงานเต็มเวลา"
      - text: "ถนนจะซ่อมก่อนเลือกตั้งอีกไหม{kq}"
        heart: 2
        reply: "ซ่อมแน่! รถบดถนนมาจอดหน้า อบต. แล้ว จอดสวยๆ ให้คนเห็น ยังไม่ได้บด เดี๋ยวบดอาทิตย์ก่อนเลือกตั้ง พอดีกับหน้าฝน หายไปพร้อมกัน"
      - text: "เห็นแล้วปวดหัว{k}"
        heart: 0
        reply: "ปวดหัวน่ะดี อีกหน่อยรถแห่มา ปวดหูด้วย คืนก่อนวันเลือกตั้งอย่าออกจากบ้าน หมามันหอนไม่ใช่เพราะผีอย่างเดียว"

  - id: prasert_r_praew_brand
    topic: react
    once: true
    when: { flag: praew_q_stay, heart_min: 3 }
    npc: "แพรวบอกว่าจะไม่กลับกรุงเทพฯ แล้ว ทำแบรนด์ที่นี่ต่อ… หลานรู้เรื่องนี้ก่อนกำนันใช่ไหม ไม่ต้องปฏิเสธ หน้าหลานฟ้อง"
    options:
      - text: "แพรวตัดสินใจเอง{k}กำนัน"
        heart: 2
        reply: "รู้… ลูกกำนันตัดสินใจเองมาตั้งแต่ห้าขวบ ตอนนั้นเลือกจะไม่กินผัก ตอนนี้เลือกจะขายผัก กำนันตามไม่ทัน"
      - text: "กำนันดีใจไหม{kq}"
        heart: 2
        reply: "ดีใจจนไม่รู้จะทำหน้ายังไง เลยไปอาบน้ำไก่สองรอบ เจ้าประดู่งงทั้งเย็น"

  - id: prasert_r_land_result
    topic: react
    once: true
    when: { flag: prasert_q4_done }
    npc: "หลานเห็นไหม กำนันนอนถึงตีห้าแล้ว ไม่ได้ตื่นตีสามเหมือนเดิม เจ้าประดู่ต้องขันปลุกกำนันแทน มันงงใหญ่"
    options:
      - text: "ดีใจด้วย{k}กำนัน"
        heart: 1
        reply: "ตัดสินใจแล้วมันโล่ง ถึงจะถูกหรือผิดก็ยังไม่รู้ แต่โล่ง… คนตำบลนี้ตัดสินใจกันช้าเพราะกลัวโล่งผิดเรื่อง"
      - text: "แพรวว่ายังไงบ้าง{kq}"
        heart: 1
        reply: "แพรวกอดกำนันครั้งแรกตั้งแต่จบมหาลัย แล้วก็ถ่ายรูปลงเพจ เขียนว่า ‘พ่อ’ คำเดียว กำนันอ่านสามรอบ… ติดสมศักดิ์มาแล้ว"

  - id: prasert_r_headman
    topic: react
    once: true
    when: { flag: heard_headman_rumor }
    npc: "ป้าแต๋วไปลือว่าหลานจะลงผู้ใหญ่บ้านแทนสมศักดิ์เหรอ กำนันได้ยินจากสามทาง ทางที่สามคือไก่ ไก่ไม่พูดหรอก แต่มันมองหน้ากำนันแปลกๆ"
    options:
      - text: "{p}ยังไม่ได้คิดเลย{k}"
        heart: 1
        reply: "ไม่ได้คิดก็ดี ข่าวลือในตำบลนี้มันคิดแทนคนเก่ง อีกสามวันหลานจะได้ยินว่าหลานจะลงนายกฯ อีกอาทิตย์จะได้ยินว่าหลานแต่งงานแล้ว"
      - text: "ถ้า{p}ลง กำนันจะช่วยไหม{kq}"
        heart: 2
        reply: "ช่วยแบบกำนัน คือไม่แจกซอง ไปงานศพทุกงานให้ ส่วนที่เหลือหลานต้องเดินเอง กำนันเดินช่วยได้ครึ่งทาง หลังไม่ดี"
        next:
          - text: "ไม่แจกซองแล้วจะชนะเหรอ{kq}"
            heart: 1
            reply: "ไม่รู้… ยังไม่เคยมีใครลอง ทุกคนกลัวคืนหมาหอนกันหมด ถ้าหลานลองแล้วชนะ กำนันจะเลี้ยงปลาช่อนเผาทั้งตำบล"
          - text: "ครึ่งทางก็พอแล้ว{k}"
            heart: 1
            reply: "พูดแบบนี้แหละ คนจะเลือก คนที่ขอครึ่งเดียว คนในตำบลกลัวคนขอเต็ม"

  # ===== news =====
  - id: prasert_n_amphoe
    topic: news
    npc: "เพิ่งกลับจากประชุมกำนันผู้ใหญ่บ้านที่อำเภอ ข้าวกล่องไข่พะโล้ ประชุมสามชั่วโมง เรื่องเดียวที่ทุกคนจำได้คือไข่พะโล้"
    options:
      - text: "ประชุมเรื่องอะไร{kq}"
        heart: 1
        reply: "เรื่องให้ทุกตำบลส่งรายงานเรื่องการส่งรายงาน กำนันไม่ได้ล้อเล่นนะโว้ย หัวข้อมันจริงๆ ปาล์มต้องพิมพ์ทั้งคืน"
        next:
          - text: "ปาล์มน่าสงสาร{k}"
            heart: 1
            reply: "สงสารสิ เด็กมันเรียนมาเรื่องดิน มาจบที่เรื่องกระดาษ กำนันเลยเอาไข่พะโล้กลับมาฝากมันใบนึง"
          - text: "แล้วใครอ่านรายงาน{kq}"
            heart: 0
            reply: "คนทำรายงานสรุปรายงานไง อ่านกันเองวนไป เหมือนไก่ไล่จิกหางตัวเอง"
      - text: "ไข่พะโล้อร่อยไหม{kq}"
        heart: 1
        reply: "เค็ม! เค็มเหมือนงบตำบลที่เขาหักไปก่อนถึงเรา กำนันกินแล้วต้องไปดื่มน้ำร้านพี่หน่อยสามแก้ว"

  - id: prasert_n_chicken_contest
    topic: news
    npc: "งานวัดปีนี้ประกวดไก่สวยงามเพิ่มรุ่นใหม่ ‘ไก่ขวัญใจมหาชน’ ให้คนโหวตในกลุ่ม LINE กำนันว่างานนี้มีบัญชีอวตาร"
    options:
      - text: "กำนันจะส่งเจ้าประดู่ไหม{kq}"
        heart: 1
        reply: "ส่งสิ! แต่ถ้าไก่เสี่ยเฮงได้ยี่สิบโหวตในห้านาที จากบัญชีชื่อ ‘รักเฮง01’ ถึง ‘รักเฮง20’ กำนันจะประท้วง"
      - text: "เดี๋ยว{p}ช่วยโหวตให้{k}"
        heart: 2
        reply: "ดี! โหวตคนละครั้งนะ ห้ามสร้างบัญชีใหม่ กำนันเป็นกำนัน ต้องชนะใสสะอาด… อย่างน้อยใสกว่าเสี่ย"
      - text: "ประกวดไก่ทางมือถือ แปลกนะ{kq}"
        heart: 0
        reply: "นายกฯ คิดเอง บอกว่าเป็นการ ‘ขับเคลื่อนไก่สู่ดิจิทัล’ ไก่มันยังไม่รู้เลยว่าตัวเองอยู่ในมือถือ"

  - id: prasert_n_road_crew
    topic: news
    npc: "รถผู้รับเหมามาตักลูกรังหน้าทางเข้าหมู่สามอีกแล้ว ตักออกแล้วเกลี่ยกลับที่เดิม ทำแบบนี้ทุกปี เรียกว่า ‘ปรับปรุงผิวจราจร’"
    options:
      - text: "ผู้รับเหมาเจ้าไหน{kq}"
        heart: 1
        reply: "เจ้าประจำ น้องเขยของลูกพี่ลูกน้องของภรรยาคนที่… เอาเป็นว่าญาติกันหมดทั้งอำเภอ ตำบลนี้ใครไม่ใช่ญาตินายกฯ ก็เป็นญาติกำนัน"
        next:
          - text: "แล้วญาติกำนันได้งานไหม{kq}"
            heart: 1
            reply: "ได้! ได้ไปช่วยถือป้าย ‘ขออภัยในความไม่สะดวก’ วันละสามร้อย กำนันญาติเยอะแต่ญาติจน"
          - text: "แจ้งใครได้บ้าง{kq}"
            heart: 0
            reply: "แจ้ง อบต. อบต. รับทราบ แจ้งอำเภอ อำเภอส่งเรื่องคืน อบต. เรื่องมันเดินทางมากกว่ารถเมล์ลุงเชิด"
      - text: "อย่างน้อยถนนก็เรียบขึ้น{k}"
        heart: 0
        reply: "เรียบสามวัน ฝนตกทีเดียวกลับเป็นโจ๊กเหมือนเดิม ถนนเราเหมือนคำสัญญาหาเสียง ดูดีช่วงสั้นๆ"

  - id: prasert_n_fund_meeting
    topic: news
    when: { time: morning }
    npc: "เช้านี้กำนันไปตรวจกองทุนหมู่บ้านกับสมศักดิ์ สมุดบัญชีตรงทุกบาท… สมุดนะ ไม่ใช่เงิน เงินไปอยู่ในสมุดคนอื่น"
    options:
      - text: "หมายความว่ายังไง{kq}"
        heart: 1
        reply: "คนกู้ไปแล้วยังไม่คืนสามราย หนึ่งในนั้นบอกว่าเอาไปลงทุนพระเครื่องวัดเจริญทรัพย์ฯ ราคาตก ตอนนี้ถือพระไว้ไหว้ขอให้ราคาขึ้น"
      - text: "สมศักดิ์ว่ายังไงบ้าง{kq}"
        heart: 1
        reply: "ว่าสามรอบ รอบแรกพูดดี รอบสองพูดแรง รอบสามพูดเสียงสั่น สมศักดิ์ใจอ่อนกว่าหน้า กำนันเลยต้องเป็นคนพูดแรงแทน"
      - text: "{p}ยังไม่อยากกู้อะไร{k}"
        heart: 1
        reply: "ดี ไม่กู้ได้ก็อย่ากู้ แต่ถ้าต้องกู้ กู้กองทุนนะ อย่ากู้เสี่ยเฮง ดอกเสี่ยมันตื่นเช้ากว่าไก่กำนันอีก"

  - id: prasert_n_company_dinner
    topic: news
    when: { day_min: 8 }
    npc: "คุณธนาชวนกำนันกินข้าวร้านปลาเผาที่อำเภอ กำนันกินไปสองตัว ยังไม่ได้ตอบเรื่องที่ดิน… ปลาไม่ผิดนะโว้ย ปลามันไม่รู้เรื่อง"
    options:
      - text: "กินฟรีแบบนี้ไม่เกรงใจเหรอ{kq}"
        heart: 1
        reply: "เกรงใจ! เลยจ่ายค่าน้ำแข็งเอง สามสิบบาท กำนันมีศักดิ์ศรี… ศักดิ์ศรีราคาสามสิบบาท"
        next:
          - text: "ครั้งหน้าอย่าไปดีกว่า{k}"
            heart: 2
            reply: "หลานพูดเหมือนแพรว แพรวพูดเหมือนแม่แพรว ทั้งบ้านกำนันมีแต่คนพูดถูก กำนันเลยต้องเป็นคนผิดคนเดียว"
          - text: "ปลาเผาร้านนั้นอร่อยไหม{kq}"
            heart: 0
            reply: "อร่อย… อร่อยจนรู้สึกผิด ปลาช่อนเผาบ้านเรายังอร่อยกว่า เพราะไม่มีใครมานั่งยิ้มรอคำตอบ"
      - text: "เขาคุยอะไรกับกำนันบ้าง{kq}"
        heart: 1
        reply: "คุยเรื่อง ‘วิสัยทัศน์’ สี่สิบนาที เรื่องราคาห้านาที เรื่องน้ำศูนย์นาที กำนันจับเวลา เพราะกำนันฟังนายกฯ มาเยอะ เลยจับทางคนพูดสวยได้"

  - id: prasert_a_papers
    topic: advice
    npc: "ฟังนะ ใครเอากระดาษมาให้เซ็น อ่านทุกบรรทัด ตัวเล็กๆ ข้างล่างอ่านสองรอบ ตัวที่เล็กที่สุดอ่านสามรอบ ตรงนั้นแหละเขาซ่อนที่ดินไว้"
    options:
      - text: "กำนันเคยเซ็นพลาดเหรอ{kq}"
        heart: 1
        reply: "เคย! ตอนเป็นผู้ใหญ่บ้านใหม่ๆ เซ็นรับของ ‘ครุภัณฑ์โต๊ะสิบตัว’ ได้มาสองตัว อีกแปดตัวอยู่ในกระดาษ ป่านนี้ยังนั่งไม่ได้"
        next:
          - text: "แล้วกำนันทำยังไง{kq}"
            heart: 1
            reply: "เอาไปนั่งอ่านทีละตัว… ไม่ใช่ กำนันจำมาตลอดชีวิต ทุกวันนี้เซ็นอะไรกำนันอ่านช้ากว่าที่พูดสิบเท่า"
          - text: "โต๊ะหายไปไหน{kq}"
            heart: 0
            reply: "ไปอยู่ในรายงานว่าได้รับครบ รายงานนั้นสวยมาก มีลายเซ็นกำนันด้วย กำนันเกลียดลายเซ็นตัวเองไปสามปี"
      - text: "เอามาให้กำนันดูก่อนได้ไหม{kq}"
        heart: 2
        reply: "ได้! มาตอนเช้า ก่อนเก้าโมง กำนันอารมณ์ดี หลังเที่ยงกำนันอ่านอะไรก็ไม่ชอบไปหมด"

  - id: prasert_a_chicken
    topic: advice
    npc: "อยากเลี้ยงไก่ใช่ไหม หน้าหลานบอก เริ่มจากไก่พื้นบ้านก่อน ไก่สวยงามมันเลี้ยงยาก เอาแต่ใจเหมือนลูกสาวคนแถวนี้"
    options:
      - text: "ลูกสาวคนแถวนี้ใครเหรอ{kq}"
        heart: 1
        reply: "ไม่บอก! …ก็คนที่ชอบเอาไม้เซลฟี่มาไล่ไก่กำนันน่ะ ไก่กำนันเห็นไม้เซลฟี่วิ่งกระเจิง"
      - text: "ไก่พื้นบ้านให้อะไรกิน{kq}"
        heart: 1
        reply: "ข้าวเปลือก ข้าวโพด หนอน ปลวก กินข้าวโพดหวานจากแปลงหลานก็ได้ แต่อย่าให้เยอะ เดี๋ยวมันติดหวานแล้วเมินข้าวเปลือก"
      - text: "เลี้ยงไก่ได้เงินไหม{kq}"
        heart: 0
        reply: "ได้ไข่ ได้ขี้ไก่ใส่ผัก ได้เสียงขันปลุก เงินน่ะได้นิดหน่อย แต่คนเลี้ยงไก่ไม่ค่อยเครียดนะ… ยกเว้นกำนัน"

  - id: prasert_a_company_sign
    topic: advice
    when: { flag: story_thana_visit }
    npc: "คุณธนามาหาหลานแล้วใช่ไหม จำไว้นะ เขาพูดว่า ‘ง่าย’ กี่ครั้ง ให้นับ ถ้าเกินสามครั้ง เรื่องนั้นไม่ง่ายสำหรับเรา"
    options:
      - text: "เขาพูดว่าง่ายห้าครั้ง{k}"
        heart: 1
        reply: "ห้าครั้ง! กับกำนันเขาพูดเจ็ดครั้ง ยิ่งที่ใหญ่ยิ่งง่ายเยอะ อีกหน่อยที่ทั้งอำเภอเขาคงพูดว่าง่ายทั้งวัน"
      - text: "แล้วกำนันจะขายไหม{kq}"
        heart: 0
        reply: "ถามตรงจริงนะ… กำนันยังไม่รู้ ถ้ารู้แล้วจะบอกหลานเป็นคนที่สอง คนแรกต้องเป็นแพรว"
      - text: "{p}ไม่ได้นับ{k}"
        heart: 0
        reply: "ครั้งหน้านับ กำนันฝึกนับตอนนายกฯ พูดคำว่า ‘บูรณาการ’ ทำให้ประชุมไม่ง่วง"

  - id: prasert_a_dont_burn
    topic: advice
    npc: "เกี่ยวข้าวเสร็จ ฟางอย่าเผานะ เผาทีควันมาบ้านกำนัน ไก่กำนันไอ ไก่ไอแล้วขนไม่เงา ไม่ได้แชมป์ กำนันเดือดร้อน"
    options:
      - text: "ฟางเอาไปทำอะไรดี{kq}"
        heart: 1
        reply: "ให้ตาเผือกเลี้ยงควาย ไถกลบก็ได้ ปาล์มบอกว่าเป็นปุ๋ย กำนันไม่รู้หลักวิชาการหรอก รู้แค่ว่าควันมันทำไก่ไอ"
      - text: "กำนันห่วงไก่มากกว่าคนเหรอ{kq}"
        heart: 1
        reply: "ห่วงทั้งคู่! แต่คนบ่นได้ ไก่บ่นไม่ได้ คนที่บ่นไม่ได้กำนันต้องห่วงมากกว่า… ประโยคนี้กำนันได้จากพระอาจารย์สุเมธ"

  - id: prasert_a_neighbors
    topic: advice
    npc: "อยู่ตำบลนี้ ทะเลาะกับใครก็ได้ แต่อย่าทะเลาะกับสามคน ป้าแต๋ว ป้าทองใบ แล้วก็หมาบ้านลุงสมหมาย"
    options:
      - text: "ทำไมสามคนนั้น{kq}"
        heart: 1
        reply: "ป้าแต๋วเล่าทั้งตำบล ป้าทองใบจำทุกซอง หมาลุงสมหมายจำทุกขา… ส่วนกำนัน ทะเลาะได้ กำนันลืมเร็ว"
      - text: "แล้วทะเลาะกับกำนันได้ไหม{kq}"
        heart: 2
        reply: "ได้! ทะเลาะกับกำนันแปลว่ากล้า กำนันชอบคนกล้า แพรวทะเลาะกับกำนันทุกมื้อเย็น กำนันยังให้ค่าขนมอยู่เลย"

  # ===== smalltalk =====
  - id: prasert_s_praduu
    topic: smalltalk
    npc: "เจ้าประดู่วันนี้อารมณ์ไม่ดี เมื่อเช้ามันเห็นตัวเองในกระจกรถ แล้วตีกระจกไปสามที มันคิดว่ามีไก่หล่อกว่ามัน"
    options:
      - text: "ไก่หลงตัวเองเหมือนเจ้าของเลย{k}"
        heart: 2
        reply: "ฮ่า! ปากแบบนี้ไปเป็นนักข่าวกับเมย์ได้เลย… กำนันไม่หลงตัวเอง กำนันรู้ตัวว่าหล่อ คนละเรื่องกัน"
      - text: "กระจกรถเป็นไงบ้าง{kq}"
        heart: 1
        reply: "ร้าว รถกระบะกำนัน กระจกข้างร้าวเพราะไก่ ไปอู่บอล บอลหัวเราะจนต้องลดค่าซ่อมให้"
        next:
          - text: "บอลยังจะไประยองอยู่ไหม{kq}"
            heart: 1
            reply: "ยังลังเล คนลังเลซ่อมรถเก่งนะ เพราะมันคิดทุกน็อต ถ้าบอลไป กระจกร้าวรอบหน้ากำนันต้องเอาเทปพันเอง"
          - text: "บอลคิดค่าซ่อมแพงไหม{kq}"
            heart: 0
            reply: "ไม่แพง แต่บอลขอค่าเล่าเรื่อง เดี๋ยวบอลก็ไปเล่าให้ทั้งตำบลฟังว่ากำนันแพ้ไก่ตัวเอง"
      - text: "ไก่ก็มีอารมณ์เหรอ{kq}"
        heart: 1
        reply: "มีสิ ไก่มีอารมณ์มากกว่าคนที่ อบต. ตอนประชุมอีก อย่างน้อยไก่ไม่พอใจมันก็ขัน คนไม่พอใจในห้องประชุมก็แค่ ‘รับทราบ’"

  - id: prasert_s_shout
    topic: smalltalk
    npc: "หลานรู้ไหมทำไมกำนันพูดเสียงดัง สมัยก่อนประชุมไม่มีไมค์ ใครพูดเบาไม่มีใครฟัง เสียงดังเลยกลายเป็นนิสัย"
    options:
      - text: "ตอนนี้มีไมค์แล้วนะ{kq}"
        heart: 1
        reply: "มีไมค์แต่ไมค์อยู่ในมือนายกฯ ตลอด กำนันก็ต้องตะโกนแข่งกับไมค์ ชนะทุกที แต่ไม่มีใครจดว่ากำนันพูดอะไร"
      - text: "{p}ว่ากำนันพูดเบาๆ ก็ได้{k}"
        heart: 0
        reply: "ลองแล้ว! แพรวบอกให้พูดเบา กำนันพูดเบาไปหนึ่งวัน ทั้งตำบลนึกว่ากำนันป่วย หมอแอนมาวัดความดันถึงบ้าน"
      - text: "เสียงดังแบบนี้ไม่ต้องใช้หอกระจายข่าวเลย{k}"
        heart: 2
        reply: "นั่นแหละ! สมศักดิ์กลัวกำนันแย่งงานมาสิบปี ตอนเกษียณเขาคงยกไมค์ให้กำนันแทนคนอื่น… ล้อเล่น กำนันไม่เอา ย้ำสามรอบไม่ไหว"

  - id: prasert_s_coffee
    topic: smalltalk
    when: { time: morning }
    npc: "กาแฟโบราณหน้าร้านป้าแต๋ว แก้วละยี่สิบห้า กำนันกินมาสามสิบปี ราคาขึ้นมาสิบห้าบาท รสชาติไม่เปลี่ยนเลย คุ้มที่สุดในตำบล"
    options:
      - text: "ร้านกาแฟแพรวล่ะ{kq}"
        heart: 1
        reply: "กาแฟแพรวแก้วละห้าสิบห้า มีฟองเป็นรูปหัวใจ กำนันกินแล้วรู้สึกต้องยิ้ม กาแฟโบราณไม่ต้องยิ้มก็กินได้"
        next:
          - text: "แต่กำนันก็ไปกินทุกวันใช่ไหม{kq}"
            heart: 2
            reply: "…ใครบอก ป้าแต๋ว? กำนันไปนั่งเฉยๆ ให้ร้านดูมีลูกค้า ลูกค้าเห็นกำนันนั่งก็กล้าเข้า แพรวไม่ต้องจ่ายค่าโฆษณา"
          - text: "ฟองรูปหัวใจก็น่ารักดี{k}"
            heart: 1
            reply: "น่ารักสำหรับหลาน กำนันกินแล้วมันมองหน้ากำนัน กำนันกินไม่ลง เลยคนให้มันเป็นรูปไก่"
      - text: "ป้าแต๋วชงอร่อยจริง{k}"
        heart: 1
        reply: "อร่อยเพราะใส่ข่าวลือมาด้วย กาแฟแก้วนึงได้ข่าวสามเรื่อง ร้านกาแฟในเมืองไม่มีแบบนี้"

  - id: prasert_s_rowing
    topic: smalltalk
    npc: "สมัยหนุ่มกำนันพายเรือเก่ง ตอนนี้แขนยังดี แต่หลังไม่ดี หมอแอนบอกให้เลิกยกกระสอบ กำนันเลยให้ลูกน้องยกแล้วกำนันชี้"
    options:
      - text: "ชี้ก็เป็นงานนะ{k}"
        heart: 1
        reply: "ใช่! นายกฯ ชี้มาสองวาระ ยังไม่มีใครว่า… มีแต่เมย์ว่า"
      - text: "กำนันไปกายภาพที่ รพ.สต. หรือยัง{kq}"
        heart: 1
        reply: "ไปแล้ว หมอแอนให้ยืดหลังวันละสิบรอบ กำนันยืดตอนรอไก่กินข้าว ไก่กินเร็ว กำนันยืดได้รอบเดียว"
      - text: "เดี๋ยว{p}ช่วยยกให้{k}"
        heart: 2
        reply: "ดีเลย ยกเสร็จกินข้าวบ้านกำนัน แพรวทำแกงส้ม… แพรวไม่ได้ทำ แพรวสั่งร้านพี่หน่อย แต่ใส่ชามบ้านเรา"

  - id: prasert_s_rain_chicken
    topic: smalltalk
    when: { rain: true }
    npc: "ฝนตกแบบนี้ไก่สวยงามต้องเข้าเล้าหมด ขนเปียกแล้วเหมือนผ้าขี้ริ้ว กำนันต้องเป่าไดร์ให้ทีละตัว ไดร์ของแพรวนะ อย่าบอกแพรว"
    options:
      - text: "แพรวไม่รู้เหรอ{kq}"
        heart: 1
        reply: "รู้ เพราะไดร์มีขนไก่ติดทุกครั้ง แพรวซื้อไดร์ใหม่มาแล้วสามอัน กำนันก็ยืมทั้งสามอัน"
      - text: "{p}ไม่เคยเห็นใครเป่าผมให้ไก่เลย{k}"
        heart: 1
        reply: "เป่าขน! ไม่ใช่ผม ไก่ไม่มีผม… ไก่แชมป์ต้องดูแลแบบแชมป์ คนก็เหมือนกัน หลานต้องดูแลตัวเองแบบแชมป์ด้วย เข้าบ้านไปเลย ฝนตก"

  # ===== self =====
  - id: prasert_f_twelve_years
    topic: self
    npc: "กำนันเป็นกำนันมาสิบสองปี คนชอบถามว่ามีความสุขไหม กำนันตอบว่ามีไก่ มีลูกสาว มีคนมาเคาะประตูทุกวัน… อันสุดท้ายแล้วแต่วัน"
    options:
      - text: "ใครมาเคาะประตูบ่อยที่สุด{kq}"
        heart: 1
        reply: "สมศักดิ์ มาถามว่ากำนันได้รับหนังสือหรือยัง สามรอบ ส่วนรอบที่สี่ป้าแต๋ว มาถามว่าสมศักดิ์มาทำไม"
      - text: "กำนันเหนื่อยไหม{kq}"
        heart: 2
        reply: "เหนื่อย แต่ไม่มีใครถาม หลานถามคนแรกในเดือนนี้ กำนันเลยต้องตอบช้าๆ ให้มันมีค่า… เหนื่อย จบ"

  - id: prasert_f_wife
    topic: self
    when: { heart_min: 3 }
    npc: "แม่แพรวเป็นครูประถม ลายมือสวยที่สุดในอำเภอ กำนันเขียนจดหมายจีบไปสิบฉบับ แม่แพรวส่งกลับมาพร้อมแก้คำผิดด้วยปากกาแดง"
    options:
      - text: "แล้วจีบติดได้ยังไง{kq}"
        heart: 2
        reply: "ฉบับที่สิบเอ็ด กำนันเขียนผิดคำเดียวโดยตั้งใจ เขาแก้แล้วเขียนข้างล่างว่า ‘ตั้งใจเขียนผิดใช่ไหม’ กำนันตอบว่าใช่ เขาหัวเราะ จบ"
        next:
          - text: "ยังเก็บจดหมายไว้ไหม{kq}"
            heart: 2
            reply: "เก็บในกล่องเหล็กใต้หิ้ง ปากกาแดงยังอยู่ แดงจนวันนี้ แพรวไม่รู้ว่ามีกล่องนี้ อย่าเพิ่งบอกนะ วันนึงกำนันจะให้แพรวเอง"
          - text: "กำนันโรแมนติกกว่าที่คิดนะ{kq}"
            heart: 1
            reply: "อย่าพูดดังโว้ย! ชื่อเสียงนักเลงกำนันสร้างมาสามสิบปี พังเพราะคำว่าโรแมนติกคำเดียวได้"
      - text: "กำนันคงคิดถึงเขามาก{k}"
        heart: 1
        reply: "คิดถึงตอนแพรวทำหน้าดุ… แพรวทำหน้าดุเหมือนแม่ไม่มีผิด กำนันเลยแพ้ทุกที"

  - id: prasert_f_ticket
    topic: self
    when: { heart_min: 5 }
    npc: "สมัยหนุ่มกำนันเกือบไปทำงานต่างประเทศนะ ตั๋วอยู่ในมือแล้ว พ่อล้มป่วยพอดี กำนันเลยฉีกตั๋ว… ไม่ใช่ เก็บไว้ ยังอยู่"
    options:
      - text: "เสียดายไหม{kq}"
        heart: 2
        reply: "ตอนนั้นเสียดาย ตอนนี้… ถ้ากำนันไปแล้วใครจะอยู่ตรงนี้ บริษัทคงซื้อตำบลไปหมดแล้วตั้งแต่ไม่มีคนดื้อ"
        next:
          - text: "แต่ตอนนี้กำนันก็กำลังคิดจะขายนะ{kq}"
            heart: 2
            reply: "…นั่นแหละที่กำนันนอนไม่หลับ หนุ่มๆ กำนันอยู่เพื่อไม่ให้ใครขาย แก่แล้วกำลังจะเป็นคนขายเอง ตลกนะโว้ย ตลกไม่ออก"
          - text: "เก็บตั๋วไว้ทำไม{kq}"
            heart: 1
            reply: "ไว้เตือนตัวเองว่าเคยเลือกแล้วครั้งนึง เลือกแล้วต้องไม่บ่น… กำนันบ่นทุกวันแต่ไม่บ่นเรื่องนี้"
      - text: "จะไปเที่ยวตอนนี้ก็ยังทันนะ{kq}"
        heart: 1
        reply: "ไปแล้วใครอาบน้ำไก่ แพรวไม่อาบให้ แพรวไลฟ์ไก่ได้ แต่ไม่จับไก่"

  - id: prasert_f_land
    topic: self
    when: { heart_min: 7 }
    npc: "หลาน กำนันจะเล่าเรื่องจริงนะ ที่สองร้อยไร่ของกำนัน ครึ่งนึงเป็น ส.ป.ก. ถ้าเขาเปลี่ยนเป็นโฉนดได้ บริษัทจะได้ทั้งหมด แล้วบ่อทั้งตำบลจะเหลือแต่ฝุ่น"
    options:
      - text: "กำนันรู้แล้วทำไมยังลังเล{kq}"
        heart: 2
        reply: "เพราะเงินมันเยอะจนแพรวไม่ต้องลำบากไปทั้งชาติ… แล้วแพรวก็บอกว่า ‘หนูไม่อยากได้ชาติแบบนั้น’ ลูกกำนันพูดแรงกว่ากำนันอีก"
        next:
          - text: "แพรวพูดถูกนะ{kq}กำนัน"
            heart: 2
            reply: "ถูก… ถูกจนกำนันอยากขอเวลานอก แต่ไม่มีใครให้ ขอบใจที่ฟังนะหลาน กำนันพูดเรื่องนี้กับไก่มาสามเดือนแล้ว"
          - text: "{p}ช่วยคิดด้วยได้ไหม{kq}"
            heart: 1
            reply: "ได้ แต่อย่าคิดแทน กำนันต้องตัดสินเอง คนเป็นกำนันโทษคนอื่นไม่ได้ แม้แต่โทษไก่"
      - text: "เรื่องนี้ใหญ่เกินกว่า{p}จะออกความเห็น{k}"
        heart: 0
        reply: "ไม่ใหญ่เกินหรอก บ่อหลานก็อยู่ในตำบลนี้ ทุกคนมีส่วน… แค่กำนันมีส่วนเยอะกว่าเพื่อน หนักกว่าเพื่อน"

  - id: prasert_f_kamnan_ways
    topic: self
    npc: "รู้ไหม กำนันไม่เคยซื้อเสียงนะโว้ย… กำนันแค่ไปงานศพทุกงาน ไปงานบวชทุกงาน ใส่ซองเท่ากันทุกงาน สิบสองปีหมดเงินไปเท่ารถกระบะสองคัน"
    options:
      - text: "แบบนี้ก็คือซื้อเสียงทางอ้อมหรือเปล่า{kq}"
        heart: 1
        reply: "ฮ่า! ถามแบบเมย์เลย… ไม่ใช่ ซื้อเสียงคือให้แล้วขอ กำนันให้แล้วไม่ขอ แต่ทุกคนรู้ว่ากำนันมา คนจำหน้าคนที่มามากกว่าจำเงิน"
      - text: "กำนันใส่ซองเท่าไหร่{kq}"
        heart: 0
        reply: "ห้าร้อย ทุกงาน จะงานคนรวยคนจน ห้าร้อย ป้าทองใบจดไว้หมดว่ากำนันไม่เคยขาด ป้าทองใบคือกรรมการการเลือกตั้งตัวจริงของตำบล"

  # ===== others =====
  - id: prasert_o_somsak
    topic: others
    npc: "สมศักดิ์จะเกษียณแล้ว เขาซ้อมพูดอำลาทุกคืน กำนันได้ยินจากบ้าน เพราะเขาซ้อมผ่านไมค์ ทั้งตำบลได้ยินหมด แต่ทำเป็นไม่ได้ยิน"
    options:
      - text: "ทุกคนได้ยินจริงเหรอ{kq}"
        heart: 1
        reply: "ได้ยินสิ ป้าแต๋วจำได้ทั้งประโยค ประโยคสุดท้ายเขาไม่เคยพูดจบ ร้องไห้ทุกรอบ ทั้งตำบลเลยต้องทำเป็นไม่รู้ว่าเขาร้อง"
        next:
          - text: "น่ารักดีนะ ทั้งตำบลช่วยกันแกล้งไม่รู้{k}"
            heart: 2
            reply: "ตำบลเราเก่งเรื่องนี้ ทำเป็นไม่รู้เรื่องดีๆ เก่งพอๆ กับทำเป็นไม่รู้เรื่องไม่ดี… อย่างหลังกำนันไม่ภูมิใจ"
          - text: "กำนันจะเอายังไงกับเขา{kq}"
            heart: 1
            reply: "กำนันจะไปยืนข้างเขาวันอำลา ถ้าเขาพูดไม่จบ กำนันพูดต่อให้ เสียงดังกว่าด้วย"
      - text: "ใครจะเป็นผู้ใหญ่คนต่อไป{kq}"
        heart: 0
        reply: "ใครก็ได้ที่ไม่ต้องย้ำสามรอบแล้วคนยังฟัง… หลานลองไหม ล้อเล่น ยัง ยังเร็วไป"

  - id: prasert_o_wichai
    topic: others
    npc: "นายกฯ วิชัยโทรมาถามกำนันว่าเห็นด้วยกับโครงการไหม กำนันถามว่าโครงการอะไร เขาบอกว่า ‘โครงการที่กำลังจะมีครับ’"
    options:
      - text: "แล้วกำนันตอบว่าไง{kq}"
        heart: 1
        reply: "กำนันตอบว่า ‘เห็นด้วยในหลักการ’ เขาดีใจมาก… ประโยคนี้กำนันได้จากเขาเอง ใช้คืนเขาได้ผลเป๊ะ"
      - text: "นายกฯ ก็น่าสงสารนะ{kq}"
        heart: 1
        reply: "น่าสงสาร… กำนันเห็นเขานั่งในรถหลวงคนเดียวหน้าป้ายโครงการ มองนานๆ เหมือนจะคุยกับป้าย คนพูดวนมานานๆ มันคงเหงา"
      - text: "นายกฯ กับกำนันใครใหญ่กว่า{kq}"
        heart: 0
        reply: "ใหญ่คนละแบบ นายกฯ ใหญ่บนป้าย กำนันใหญ่ในงานศพ… อย่าเอาไปเล่านะ ป้ายนายกฯ ใหญ่จริงๆ"

  - id: prasert_o_praew
    topic: others
    npc: "หลานเห็นแพรวไหม ลูกกำนันไลฟ์ขายข้าวกล้องในทุ่งตั้งแต่เช้า ตากแดดจนหน้าดำ กำนันห้ามไม่ได้ ห้ามทีไรยอดวิวขึ้น"
    options:
      - text: "ยอดวิวขึ้นเพราะกำนันห้ามเหรอ{kq}"
        heart: 1
        reply: "แพรวไลฟ์ตอนกำนันห้ามไง! คนชอบดูพ่อลูกเถียงกัน ยอดขายดีกว่าตอนแพรวพูดเรื่องข้าวอีก กำนันกลายเป็นดาราโดยไม่ได้ค่าตัว"
      - text: "แพรวเก่งนะ{kq}กำนัน"
        heart: 2
        reply: "เก่ง… เก่งกว่ากำนัน กำนันรู้ แต่บอกไม่ได้ ถ้าบอกแพรวจะเถียงว่าไม่จริง แล้วเราก็ทะเลาะกันอีก เถียงกันจนรักกันแบบนี้แหละ"
        next:
          - text: "{p}จะบอกแพรวให้ไหม{kq}"
            heart: 1
            reply: "อย่า! …ก็ได้ บอกแบบไม่บอกว่ากำนันพูด บอกว่าได้ยินมาจากไก่"
          - text: "กำนันบอกเองดีกว่า{k}"
            heart: 2
            reply: "…หลานนี่ร้าย พูดเหมือนแม่แพรว กำนันจะลอง วันเกิดแพรว กำนันจะเขียนการ์ด ไม่มีคำผิดสักคำ"
      - text: "แพรวคงอยากให้คนเรียกชื่อมากกว่าเรียกลูกกำนัน{k}"
        heart: 1
        reply: "…กำนันก็เรียกเขาว่าลูกกำนันต่อหน้าคนอื่นบ่อย ติดปาก อืม จะพยายาม ‘แพรว’ ‘แพรว’ ฝึกก่อน"

  - id: prasert_o_thana
    topic: others
    npc: "คุณธนาน่ะพูดเพราะนะ เพราะจนกำนันต้องแปลในหัว ‘พัฒนาร่วมกัน’ แปลว่าเขาพัฒนา เราร่วม ‘ผลประโยชน์ทุกฝ่าย’ แปลว่าฝ่ายเขามีหลายคน"
    options:
      - text: "กำนันแปลเก่งนะ{k}"
        heart: 2
        reply: "ฝึกจากนายกฯ วิชัยมาสองวาระ คุณธนาก็ภาษาเดียวกัน แต่ใส่สูทแพงกว่า แปลยากกว่านิด"
      - text: "แล้วเขาพูดเรื่องน้ำว่าไง{kq}"
        heart: 1
        reply: "เขาไม่พูดเรื่องน้ำเลย เขาพูดเรื่อง ‘ทรัพยากร’ กำนันถามว่าทรัพยากรนี่น้ำในบ่อไหม เขายิ้ม ยิ้มแปลว่าใช่ กำนันแปลยิ้มได้แล้ว"

  - id: prasert_o_sathian
    topic: others
    npc: "ดาบเสถียรน่ะ ใครว่าขี้เกียจ กำนันว่าเป็นคนฉลาดที่สุดในตำบล รู้ว่าเรื่องไหนลุกแล้วโดนย้าย เรื่องไหนนอนแล้วรอด"
    options:
      - text: "ดาบเคยโดนย้ายเหรอ{kq}"
        heart: 1
        reply: "โดนมาจากอำเภอ เพราะขยันกับคนผิดคน กำนันรู้ว่าเป็นใคร แต่คนนั้นยังมีป้ายอยู่ที่อำเภอ ชื่อเขาสะกดยากด้วย"
      - text: "แต่บางเรื่องก็ควรลุกนะ{kq}"
        heart: 2
        reply: "ใช่ แล้ววันไหนดาบลุก กำนันจะลุกด้วย สัญญาเลย… อย่าเพิ่งเล่าให้ดาบฟัง เดี๋ยวดาบลุกวันนี้ กำนันยังไม่พร้อม"
      - text: "ดาบนอนเปลทั้งวันจริงเหรอ{kq}"
        heart: 0
        reply: "ทั้งวัน แต่หูไม่นอน เรื่องในตำบลดาบรู้หมด รู้ช้ากว่าป้าแต๋วสิบนาที แต่ถูกกว่าป้าแต๋วเก้าในสิบ"

  - id: prasert_o_kla
    topic: others
    npc: "กล้ามาหากำนันเมื่อวาน ถือเอกสารมาสามแฟ้ม ขอให้กำนันไม่ขายที่ แล้วเสนอให้สหกรณ์เช่าแทน… เด็กมันพูดจบแล้วเหงื่อท่วม กำนันชอบ"
    options:
      - text: "กำนันจะให้สหกรณ์เช่าไหม{kq}"
        heart: 1
        reply: "ค่าเช่าที่เขาเสนอน้อยกว่าบริษัทยี่สิบเท่า… แต่บ่อชาวบ้านไม่แห้ง กำนันคิดเลขสองแบบอยู่ แบบเงินกับแบบน้ำ ยังไม่ลงตัว"
      - text: "ทำไมกำนันชอบ{kq}"
        heart: 1
        reply: "เพราะเด็กมันกลัวกำนันแต่ยังมา คนที่กลัวแล้วมาน่านับถือกว่าคนไม่กลัว อีกอย่าง มันไม่ขอให้กำนันฝากงานให้ใคร"
        next:
          - text: "คนส่วนใหญ่มาฝากงานเหรอ{kq}"
            heart: 1
            reply: "ทุกวัน! ฝากลูกเข้า อบต. ฝากหลานเป็น รปภ. บริษัท ฝากเมียขายของในงานวัด กำนันเป็นตู้ฝากของที่ไม่มีกุญแจ"
          - text: "กล้ากับแพรวสนิทกันไหม{kq}"
            heart: 0
            reply: "ไม่สนิท กล้ามองแพรวเหมือนมองกำนัน แพรวมองกล้าเหมือนมองข้อสอบ กำนันไม่ยุ่ง ยุ่งแล้วโดนทั้งสองคน"

quests:
  - id: prasert_q1
    npc: prasert
    title: "กาแฟหกโมงเช้า"
    desc: "กำนันอยากรู้ว่าชาวบ้านลือเรื่องที่ดินกำนันว่ายังไง แต่ไม่อยากให้ใครรู้ว่าอยากรู้"
    start: { heart_min: 2, day_min: 6, flag: story_thana_visit }
    offer:
      npc: "หลาน มาช่วยกำนันหน่อย พรุ่งนี้หกโมงมานั่งกินกาแฟหน้าร้านป้าแต๋วกับกำนัน ไม่ต้องพูด แค่ฟัง ถ้ากำนันนั่งคนเดียวคนจะไม่กล้านินทากำนันต่อหน้า"
      options:
        - text: "ได้เลย{k} {p}ชอบฟังนินทาอยู่แล้ว"
          accept: true
          heart: 1
          reply: "ดี! ตรงดี กำนันเลี้ยงกาแฟ ทำหน้าเหมือนคนไม่รู้อะไร… หน้าหลานทำได้ หน้ากำนันทำไม่ได้"
        - text: "กำนันอยากรู้เรื่องอะไร{kq}"
          accept: true
          heart: 1
          reply: "อยากรู้ว่าคนเขาคิดว่ากำนันจะขายที่ไหม ถ้าเขาคิดว่าขาย แปลว่าหน้ากำนันมันฟ้อง ต้องไปแก้หน้า"
        - text: "ไว้ก่อนนะ{kq}กำนัน {p}ตื่นไม่ไหว"
          heart: -1
          reply: "หกโมงตื่นไม่ไหว… คนกรุงเทพฯ นี่นะ ไก่กำนันยังตื่นตีสี่ ไว้ตื่นไหวแล้วค่อยมาบอก"
    steps:
      - goal: { type: visit, place: taew_shop, from: "06:00", to: "08:00" }
        hint: "ไปนั่งกินกาแฟหน้าร้านป้าแต๋วกับกำนันตอนเช้า (06:00–08:00)"
        done:
          npc: "ได้ยินไหม ป้าพรว่ากำนันขายแน่ ลุงสมหมายว่าไม่ขาย ป้าแต๋วว่า ‘ป้าไม่ได้พูดนะ แต่กำนันยังซื้อไข่ร้านป้าอยู่ แปลว่ายังไม่รวย’… หลานว่าหน้ากำนันฟ้องไหม"
          options:
            - text: "ฟ้อง{k} หน้ากำนันเหมือนคนนอนไม่หลับ"
              heart: 1
              reply: "นอนไม่หลับจริง… ตาคล้ำเหมือนไก่ตีแพ้ ขอบใจที่พูดตรง กำนันจะไปถามแพรวว่ามีครีมทาตาไหม"
            - text: "คนส่วนใหญ่ไม่อยากให้กำนันขาย{k}"
              heart: 2
              reply: "อืม… ไม่อยากให้ขาย แต่ไม่มีใครเสนอซื้อแทนนะโว้ย ล้อเล่น กำนันได้ยินแล้ว จดไว้ในใจ"
            - text: "กาแฟอร่อยดี{k}"
              heart: 0
              reply: "หลานนี่ไม่ฟังอะไรเลยเหรอ… เออ ก็ดี คนไม่ฟังนินทาอยู่ได้นานในตำบลนี้"
    reward: { money: 100, heart: 1, set_flag: prasert_q1_done }

  - id: prasert_q2
    npc: prasert
    title: "ไก่ไม่ยอมกิน"
    desc: "ไก่สวยงามของกำนันเบื่ออาหารตั้งแต่บ่อหน้าบ้านน้ำลด กำนันขอข้าวโพดหวานจากแปลงผู้เล่น"
    start: { flag: prasert_q1_done, heart_min: 3, day_min: 10 }
    offer:
      npc: "เจ้าประดู่ไม่ยอมกินข้าวเปลือกมาสองวัน แพรวบอกให้พาไปหาหมอ หมอที่ไหนรักษาไก่ หมอแอนก็ไม่รับ… หลานมีข้าวโพดหวานไหม สามฝัก"
      options:
        - text: "มี{k} เดี๋ยวเอามาให้"
          accept: true
          heart: 1
          reply: "ดี! ข้าวโพดหลานปลูกเอง ไม่ใส่ยาแรงใช่ไหม ไก่กำนันท้องอ่อน เหมือนกำนัน"
        - text: "ไก่เบื่ออาหารเพราะอะไร{kq}"
          accept: true
          heart: 1
          reply: "กำนันว่าเพราะน้ำ บ่อหน้าบ้านน้ำลด ขุ่นขึ้น ไก่กินน้ำแล้วทำหน้าไม่พอใจ… เอาข้าวโพดมาก่อน แล้วค่อยคุยเรื่องน้ำ"
        - text: "ไก่ไม่กินก็ให้มันอดไปสิ{kq}"
          heart: -2
          reply: "อด! แชมป์สามสมัยจะให้อด… ไปเลยไป อย่ามาให้เจ้าประดู่เห็นหน้า"
    steps:
      - goal: { type: give, npc: prasert, item: corn, n: 3 }
        hint: "เอาข้าวโพดหวาน 3 ฝักไปให้กำนันที่บ้านกำนัน"
        done:
          npc: "กินแล้ว! กินเกลี้ยง เจ้าประดู่ขันขอบคุณ… แต่หลานดูนี่ กำนันตักน้ำบ่อมาให้ดู ขุ่นเหมือนกาแฟเย็น บ่อนี้ใสมาสามสิบปี เพิ่งขุ่นปีนี้"
          options:
            - text: "เอาไปให้ปาล์มตรวจดีไหม{kq}"
              heart: 2
              set_flag: prasert_q2_palm
              reply: "ปาล์ม… ดี เด็กมันมีตลับเมตร กำนันจะให้ไปวัด แต่ถ้าตัวเลขออกมาไม่ดี กำนันไม่รู้จะทำหน้ายังไงกับคุณธนาตอนกินปลาเผาครั้งหน้า"
            - text: "กำนันรู้อยู่แล้วว่าเพราะอะไร{k}"
              heart: 1
              reply: "รู้… ทุกคนรู้ ไม่มีใครพูด กำนันก็ไม่พูด ไก่เป็นตัวเดียวที่บอกตรงๆ ด้วยการไม่กิน"
            - text: "ต้มก่อนก็กินได้มั้ง{k}"
              heart: 0
              reply: "ต้มแล้วไก่กินได้ บ่อมันหายขุ่นไหมล่ะ… ไม่ได้ว่าหลานนะ กำนันว่าตัวเอง"
    reward: { money: 150, heart: 1, items: { egg_chicken: 4 }, set_flag: prasert_q2_done }

  - id: prasert_q3
    npc: prasert
    title: "แขกตอนหนึ่งทุ่ม"
    desc: "คุณธนาจะมากินข้าวบ้านกำนันตอนค่ำ กำนันอยากมีพยานนั่งด้วยที่ไม่ใช่แพรว"
    start: { flag: prasert_q2_done, heart_min: 4, day_min: 13 }
    offer:
      npc: "คืนนี้คุณธนาจะมากินข้าวบ้านกำนัน ถ้าแพรวนั่งด้วย สองคนนั้นจะยิ้มใส่กันจนกับข้าวเย็น… หลานมานั่งได้ไหม นั่งเฉยๆ กินแกงไป ฟังไป"
      options:
        - text: "ได้{k} {p}จะนั่งกินอย่างเดียว"
          accept: true
          heart: 1
          reply: "ดี กินเยอะๆ เขาจะได้รู้สึกว่าบ้านกำนันมีคนเยอะ คนเยอะแปลว่าเสียงเยอะ เสียงเยอะเขาซื้อยาก"
        - text: "ทำไมไม่ให้แพรวนั่ง{kq}"
          accept: true
          heart: 1
          reply: "เพราะแพรวจะถามคำถามแบบเมย์ แล้วคุณธนาจะตอบแบบนายกฯ แล้วกำนันจะต้องตัดสินว่าใครชนะ กำนันไม่อยากเป็นกรรมการในบ้านตัวเอง"
        - text: "{p}ไม่อยากยุ่ง{k}"
          heart: 0
          reply: "ไม่อยากยุ่งก็ไม่เป็นไร… แต่บ่อหลานก็อยู่ในตำบลนะ วันนึงก็ต้องยุ่งอยู่ดี"
    steps:
      - goal: { type: visit, place: kamnan_house, from: "19:00", to: "20:30" }
        hint: "ไปบ้านกำนันตอนหนึ่งทุ่มถึงสองทุ่มครึ่ง นั่งกินข้าวด้วยตอนคุณธนามา (กลับก่อนสามทุ่ม!)"
        done:
          npc: "เขากลับแล้ว… หลานได้ยินใช่ไหม ‘ถ้ากำนันเซ็นก่อนเลือกตั้ง ถนนหมู่สามจะเสร็จทันที’ เขารู้ว่าถนนจะเสร็จก่อนนายกฯ อีก… หลานว่ากำนันควรตอบเขาว่าไง"
          options:
            - text: "บอกเขาว่าไม่ขาย ถ้าบ่อชาวบ้านยังไม่กลับมา{k}"
              heart: 2
              set_flag: prasert_q3_firm
              reply: "ไม่ขายถ้าบ่อยังไม่กลับ… ประโยคนี้ดี มีเงื่อนไข เขาแก้ไม่ได้ เพราะเขารู้ว่าบ่อไม่กลับ กำนันจะจดไว้"
            - text: "ขอเวลาอีกหน่อยก็ได้{k}"
              heart: 1
              set_flag: prasert_q3_soft
              reply: "เวลา… กำนันขอมาสามเดือนแล้ว เขาให้ เพราะเขารู้ว่ายิ่งรอยิ่งแห้ง ยิ่งแห้งคนยิ่งอยากขาย คนมีเงินรอเก่งกว่าคนมีบ่อ"
            - text: "ถนนเสร็จทันทีก็ดีนะ{kq}"
              heart: -1
              set_flag: prasert_q3_road
              reply: "ดีสิ ถนนสวย รถบรรทุกบริษัทจะได้วิ่งสบาย… หลานคิดอีกทีนะ กำนันก็คิดอีกที"
    reward: { money: 200, heart: 2, set_flag: prasert_q3_done }

  - id: prasert_q4
    npc: prasert
    title: "หมุดหลักเขต"
    desc: "หมุดหลักเขตที่ดินกำนันหายไปหลังบริษัทมารังวัด กำนันจะปักใหม่ แล้วตัดสินใจเรื่องที่ดินให้จบ"
    start: { flag: prasert_q3_done, heart_min: 6, day_min: 18 }
    offer:
      npc: "หลาน หมุดหลักเขตที่กำนันหายไปห้าหลัก ช่างรังวัดบริษัทมาวัดแล้วเอาไปด้วย บอกว่า ‘ยืมไปอ้างอิง’ หมุดมันอ้างอิงอะไรได้… กำนันจะปักใหม่ด้วยหิน ช่วยหาหินมาห้าก้อน"
      options:
        - text: "ได้{k} ปักใหม่ให้รู้ว่าที่ใคร"
          accept: true
          heart: 2
          reply: "นั่นแหละ! ที่ใครก็ปักหินคนนั้น ปักแล้วกำนันจะตอบเขาให้จบ หลานอยู่ด้วยนะวันนั้น"
        - text: "หินห้าก้อนพอเหรอ{kq} ที่ตั้งสองร้อยไร่"
          accept: true
          heart: 1
          reply: "พอ! ปักแค่มุมที่ติดบริษัท มุมอื่นไก่กำนันเฝ้าอยู่"
        - text: "ไว้ก่อนนะ{kq}"
          heart: 0
          reply: "ไว้ก่อนได้ หินมันไม่หนี… แต่ช่างรังวัดมันมาอีกอาทิตย์หน้า"
    steps:
      - goal: { type: give, npc: prasert, item: stone, n: 5 }
        hint: "หาหิน 5 ก้อนเอาไปให้กำนันทำหมุดหลักเขต"
        done:
          npc: "หินดี! หนักดี กำนันจะทาสีแดงทุกก้อน เขียนว่า ‘ที่กำนัน ห้ามยืม’ เย็นนี้มาที่บ้าน กำนันจะโทรหาคุณธนาต่อหน้าหลาน"
          options:
            - text: "{p}จะไป{k}"
              heart: 1
              reply: "ห้าโมงนะ ก่อนไก่เข้าเล้า กำนันอยากให้ไก่ได้ยินด้วย"
            - text: "ทาสีแดงไม่เยอะไปเหรอ{kq}"
              heart: 0
              reply: "ไม่เยอะ! สีแดงคนเห็นแต่ไกล ช่างรังวัดเห็นแล้วจะได้รู้ว่ากำนันโกรธ หินมันพูดไม่ได้ สีพูดแทน"
      - goal: { type: visit, place: kamnan_house, from: "17:00", to: "19:00" }
        hint: "ไปบ้านกำนันตอนห้าโมงถึงหนึ่งทุ่ม ฟังกำนันตอบบริษัท"
        done:
          npc: "โทรศัพท์อยู่ในมือแล้ว… หลาน กำนันขอถามครั้งสุดท้าย ถ้าเป็นที่หลาน หลานจะทำยังไง กำนันจะทำตามคำที่หลานพูด ไม่ใช่เพราะหลานพูดถูก แต่เพราะกำนันเหนื่อยจะตัดสินคนเดียวแล้ว"
          options:
            - text: "ให้สหกรณ์ของกล้าเช่าทำเกษตร บ่อชาวบ้านจะได้ไม่แห้ง{k}"
              heart: 2
              set_flag: prasert_land_coop
              reply: "ค่าเช่าน้อยกว่ายี่สิบเท่า… แต่กำนันได้นอน ฮัลโหล คุณธนาเหรอ กำนันขอตอบว่าที่นี้มีคนเช่าแล้ว คนเช่าเป็นเด็กเหงื่อท่วมคนนึง ครับ ขอบคุณครับ… วางแล้ว! หลาน มือกำนันสั่น"
            - text: "บอกเขาว่าไม่ขาย จนกว่าบ่อทุกบ่อในตำบลจะกลับมา{k}"
              heart: 2
              set_flag: prasert_land_wait
              reply: "ฮัลโหล คุณธนา กำนันจะขายวันที่บ่อหลังร้านป้าแต๋วมีน้ำเต็ม… ไม่ครับ ไม่ใช่การปฏิเสธ เป็นเงื่อนไข คุณชอบเงื่อนไขไม่ใช่เหรอ… วางแล้ว เขาเงียบไปสิบวิ คนพูดเก่งเงียบสิบวิ กำนันชนะแล้ว"
            - text: "เซ็นแค่บันทึกความเข้าใจก่อน ยังไม่ต้องขายจริง{k}"
              heart: -1
              set_flag: prasert_land_mou
              reply: "MOU… เขาก็พูดคำนี้ ‘ยังไม่ผูกมัดครับกำนัน’ …ได้ กำนันจะเซ็นแค่ ‘เข้าใจ’ กำนันเข้าใจหมดแล้วแหละ เข้าใจจนเจ็บ หลานไปเถอะ กำนันอยากอยู่กับไก่สักพัก"
    reward: { money: 500, heart: 2, items: { egg_chicken: 6 }, set_flag: prasert_q4_done, line: { from: prasert, text: "📢 แจ้งชาวตำบล หมุดหลักเขตที่กำนันปักใหม่แล้ว สีแดง ใครยืมไปอ้างอิงอีก กำนันไปทวงถึงบริษัท 🐓 ขอบใจหลานยายเพียรที่ช่วยหาหิน" } }
