# เมย์ 🖤 — นักข่าวอิสระ (coffee ร้านกาแฟ 09–20)
# เสียง: พูดเร็ว ประชด แทนตัวเรา ลงท้าย ค่ะ/นะ/อะ เรียกผู้เล่น {player} ชอบพูดเป็นพาดหัว ถือมือถืออัดเสียง งบน้อย ใจจริงห่วงชาวบ้าน
# ปมหนัก: จดหมายทนายบริษัท รถไม่เปิดไฟขับตามตอนกลางคืน
convos:
  # ===== react =====
  - id: may_r_end_publish
    topic: react
    once: true
    when: { flag: may_end_publish }
    npc: "{player} บทความขึ้นแล้ว ยอดแชร์สี่หมื่น เพจโตจากแปดพันเป็นสามหมื่นในสองวัน… แล้วเมื่อเช้าป้าพรเดินผ่านร้านกาแฟ ไม่มองหน้าเราเลย"
    options:
      - text: "ลุงสมหมายเป็นไงบ้าง{kq}"
        heart: 1
        reply: "ลุงไม่ออกจากบ้านสามวัน รถเกี่ยวจอดนิ่ง ไม่มีใครจ้าง… ข่าวถูกทุกตัวอักษรนะ แต่ถูกแล้วมันก็ยังทับคนได้ เรารู้อยู่แล้ว แค่ไม่เคยเห็นใกล้ขนาดนี้"
        next:
          - text: "ไปขอโทษลุงด้วยกันไหม{kq}"
            heart: 2
            reply: "…ไป ขอโทษในฐานะคน ไม่ถอนข่าวในฐานะนักข่าว สองอย่างนี้อยู่ด้วยกันได้ใช่ไหม บอกเราหน่อยว่าได้"
          - text: "พี่เมย์ทำถูกแล้ว{k}"
            heart: 1
            reply: "ถูกในทางวิชาชีพ ส่วนทางอื่นเราไม่แน่ใจ… ขอบคุณที่พูดนะ เราจะเอาไปแปะไว้ข้างจดหมายทนายฉบับที่สี่ที่เพิ่งมา"
      - text: "ทนายบริษัทว่าไง{kq}"
        heart: 1
        reply: "ส่งจดหมายมาฉบับใหม่ คราวนี้ไม่ได้ฟ้องเนื้อหา ฟ้องว่าเราใช้รูปตู้คอนเทนเนอร์โดยไม่ขออนุญาต ตู้คอนเทนเนอร์มีลิขสิทธิ์ด้วย เพิ่งรู้"

  - id: may_r_end_protect
    topic: react
    once: true
    when: { flag: may_end_protect }
    npc: "พาดหัว: ‘ใบอนุญาตบ่อที่สองมีพยานที่ไม่รู้ตัวว่าเป็นพยาน’ ไม่มีชื่อลุง เบลอลายเซ็นแล้ว… บรรณาธิการบอกว่าข่าวเบาไป เราบอกว่าเราไม่ได้ทำข่าวเพื่อชั่งน้ำหนักคน"
    options:
      - text: "ลุงสมหมายรู้ไหม{kq}"
        heart: 1
        reply: "รู้ ลุงเอาปลาช่อนแดดเดียวมาวางหน้าห้องเช่าเราสองตัว ไม่พูดอะไร ป้าพรยืนอยู่ปลายซอยโบกมือ… เราว่านี่คือคำวิจารณ์ข่าวที่ดีที่สุดที่เคยได้"
        next:
          - text: "ยอดแชร์น้อยลงไหม{kq}"
            heart: 0
            reply: "น้อยลงครึ่งหนึ่ง แต่คนในตำบลแชร์เยอะขึ้น ทุกคนรู้ว่าใครโดนหลอก แล้วก็รู้ว่าใครเป็นคนหลอก แบบนี้เราว่ากำไร"
          - text: "พี่เมย์ใจดีกว่าที่คิดนะ{kq}"
            heart: 2
            reply: "อย่าบอกใคร ภาพลักษณ์นักข่าวปากร้ายเราสร้างมาแปดเดือน ถ้าพังเพราะปลาช่อนสองตัว น่าอายมาก"
      - text: "ข่าวเบาก็ยังเป็นข่าวนะ{kq}"
        heart: 1
        reply: "ใช่ แล้ว อบต. ก็ต้องเรียกตรวจใบอนุญาตอยู่ดี ข่าวไม่ต้องดังที่สุด แค่ต้องดังพอให้คนที่ควรได้ยิน ได้ยิน"

  - id: may_r_end_hold
    topic: react
    once: true
    when: { flag: may_end_hold }
    npc: "แฟ้มทั้งหมดอยู่ในโฟลเดอร์ ‘ยังไม่ถึงเวลา’ แล้วนะ… เมื่อคืนเรานอนหลับเต็มคืนเป็นครั้งแรกในสามเดือน ไม่มีไฟหน้ารถตามมา ไม่รู้ว่าดีใจหรือละอาย"
    options:
      - text: "ปลอดภัยไว้ก่อนดีแล้ว{k}"
        heart: 1
        reply: "ใช่… คนตายเขียนข่าวไม่ได้ คนติดคุกก็เขียนได้แค่จดหมาย เราแค่ไม่อยากให้ ‘ยังไม่ถึงเวลา’ กลายเป็น ‘ไม่มีวันถึงเวลา’"
        next:
          - text: "{p}จะเตือนพี่เมย์เองเมื่อถึงเวลา{k}"
            heart: 2
            reply: "สัญญานะ แต่อย่ามาเตือนตอนตีสอง เราจะเผลอพิมพ์ทั้งคืนแล้วกดส่งตอนง่วง… ซึ่งอาจเป็นวิธีที่ดีที่สุดก็ได้"
          - text: "บางเรื่องก็ไม่ต้องเป็นข่าว{k}"
            heart: -1
            reply: "บ่อแห้งทั้งตำบลไม่ใช่ ‘บางเรื่อง’ นะ {player}… ไม่เป็นไร เราพูดกับตัวเองมากกว่าพูดกับ {player}"
      - text: "พี่เมย์ยังโอเคไหม{kq}"
        heart: 2
        reply: "โอเคแบบคนที่เพิ่งยอมแพ้หนึ่งยกแต่ยังไม่ออกจากสังเวียน… ค่าเช่าห้องชนะไปหนึ่งยก ทนายชนะไปหนึ่งยก เราขอพักกินข้าวเวฟก่อน"

  - id: may_r_refused
    topic: react
    once: true
    when: { flag: thana_refused }
    npc: "พาดหัว: ‘หลานยายเพียรปฏิเสธข้อเสนอ 1.2 ล้าน’ ป้าแต๋วตีพิมพ์ไปแล้วเมื่อเช้า ด้วยปาก ยอดเข้าถึงทั้งตำบลภายในชั่วโมงเดียว เราแพ้ป้าอีกแล้ว"
    options:
      - text: "ข่าวไวขนาดนั้นเลยเหรอ{kq}"
        heart: 1
        reply: "ไวกว่าเน็ตบ้านเรา คุณธนาเดินออกจากฟาร์ม {player} ยังไม่ถึงตลาด ป้าก็โทรบอกยายบัวแล้ว เราจดเวลาไว้ เผื่อทำวิจัย"
        next:
          - text: "พี่เมย์จะเขียนข่าวไหม{kq}"
            heart: 1
            reply: "เขียน แต่ไม่ใส่ชื่อ เราจะเขียนว่า ‘เจ้าของที่ดินรายหนึ่ง’ เพราะเจ้าของที่ดินรายหนึ่งในประเทศนี้โดนเสนอซื้อทุกวัน ข่าวมันใหญ่กว่า {player}"
          - text: "ไม่ต้องเขียนนะ{kq}"
            heart: 0
            reply: "ไม่เขียนก็ได้ แต่เราจดไว้นะ วันที่ ราคา คำพูด ‘ทุกอย่างจะง่ายขึ้นสำหรับทุกคน’ เผื่อวันหนึ่งความง่ายนี้มีคนต้องจ่าย"
      - text: "{p}แค่ไม่อยากขายที่ยาย{k}"
        heart: 1
        reply: "แค่นั้นก็เป็นข่าวดีแล้ว ข่าวดีที่ไม่มีใครคลิก… เราคลิกเอง สองรอบ"

  - id: may_r_maybe
    topic: react
    once: true
    when: { flag: thana_maybe }
    npc: "ได้ยินว่า {player} บอกคุณธนาว่า ‘ขอคิดดูก่อน’ ประโยคนี้ในพจนานุกรมบริษัทแปลว่า ‘กลับมาอีกห้ารอบพร้อมกระเช้า’ นะ บอกไว้ก่อน"
    options:
      - text: "{p}คิดจริงๆ นะ{k}"
        heart: 0
        reply: "ไม่ว่ากัน ที่ดินของ {player} แต่ระหว่างคิด จดระดับน้ำในบ่อทุกเช้าให้เราหน่อยได้ไหม จะได้รู้ว่ากำลังคิดเรื่องที่ดินแบบไหน มีน้ำหรือไม่มีน้ำ"
        next:
          - text: "ได้{k} จดให้"
            heart: 2
            reply: "ขอบคุณ ใช้เชือกผูกก้อนหินหย่อนลงไป ทำเครื่องหมายด้วยหนังยาง เครื่องมือวิจัยระดับนักข่าวงบสามร้อยสี่สิบบาท"
          - text: "ไม่มีเวลาหรอก{k}"
            heart: 0
            reply: "เข้าใจ บริษัทก็หวังให้ทุกคนไม่มีเวลาแบบนี้แหละ"
      - text: "พี่เมย์จะห้ามเหรอ{kq}"
        heart: 1
        reply: "เราไม่ห้ามใคร เราแค่ถาม ถามจนคนรำคาญ บางทีความรำคาญคือรูปแบบหนึ่งของความห่วงใยในวิชาชีพเรา"

  - id: may_r_haggled
    topic: react
    once: true
    when: { flag: thana_haggled }
    npc: "{player} ถามราคาเพิ่มกับคุณธนาเหรอ! เขาให้ตัวเลขไหม ขอตัวเลขเถอะ เราขอเขามาแปดเดือน ได้แต่คำว่า ‘ภาพรวม’"
    options:
      - text: "เขาบอกว่าคุยในห้องแอร์{k}"
        heart: 1
        reply: "ห้องแอร์ห้องนั้นคือตู้คอนเทนเนอร์ที่แอร์เสียครึ่งปีนะ เราเคยแอบมอง… โอเค ถ้าเขาบอกตัวเลขเมื่อไหร่ ส่งมา เราจะเทียบกับราคาที่เขาซื้อแปลงข้างๆ"
        next:
          - text: "เทียบไปทำไม{kq}"
            heart: 1
            reply: "เพราะเขาซื้อแปลงติดคลองถูกกว่าแปลงไม่ติดคลอง ซึ่งไม่มีเหตุผล นอกจากว่าเจ้าของแปลงติดคลองติดหนี้ใครบางคนอยู่"
          - text: "{p}ถามเล่นๆ ไม่ได้จะขาย{k}"
            heart: 1
            reply: "ถามเล่นๆ แต่ได้ข้อมูลจริง นี่คือนักข่าวสายสืบสวนโดยกำเนิด สนใจอาชีพที่ไม่มีเงินเดือนไหม"
      - text: "ทำไมต้องรู้ตัวเลข{kq}"
        heart: 1
        reply: "คนที่พูดเป็นตัวเลขต้องรับผิดชอบตัวเลข คนพูดภาพรวมรับผิดชอบแค่บรรยากาศ"

  - id: may_r_vote_water
    topic: react
    once: true
    when: { flag: vote_water }
    npc: "เราเห็นนะ {player} ยกมือให้ระบบน้ำ ถ่ายไว้แล้วด้วย มือ {player} อยู่ในเฟรมเดียวกับกล้า ส่วนเสี่ยเฮงหันมาจดชื่อ"
    options:
      - text: "เสี่ยจดชื่อ{p}เหรอ{kq}"
        heart: 1
        reply: "จดในสมุดเล่มเดียวกับบัญชีลูกหนี้ เราไม่ได้ว่าเสี่ยจะทำอะไรนะ แค่สังเกตว่ามันเป็นสมุดเล่มเดียวกัน"
        next:
          - text: "{p}ไม่กลัวหรอก{k}"
            heart: 1
            reply: "ดี แต่ไม่กลัวไม่ได้แปลว่าไม่ระวัง เราเองไม่กลัว แล้วก็ระวังจนกินข้าวเวฟร้านเดียวทุกวัน"
          - text: "พี่เมย์จะลงรูปนี้ไหม{kq}"
            heart: 0
            reply: "ไม่ลงหน้าใครหรอก เรามีจรรยาบรรณ… รูปนี้เก็บไว้ดูเองตอนท้อ ว่ายังมีคนยกมือเรื่องที่ไม่ทำเงิน"
      - text: "กลัวงบหายเหมือนทุกปี{k}"
        heart: 1
        reply: "หายแน่ คำถามคือหายเท่าไหร่ เราตั้งเงินพนันไว้กับตั้มว่าครึ่งหนึ่งจะไปเป็นค่า ‘ศึกษาความเป็นไปได้’ ตั้มบอกเจ็ดสิบเปอร์เซ็นต์ ตั้มมองโลกแง่ร้ายกว่าเรา"

  - id: may_r_vote_road
    topic: react
    once: true
    when: { flag: vote_road }
    npc: "{player} โหวตถนนเหรอ… ไม่ว่ากันนะ ถนนพังจริง แค่อยากบอกว่าถนนเส้นนั้นลาดยางมาแล้วสามรอบในเอกสาร รอบนี้จะเป็นรอบแรกในโลกจริงหรือเปล่า"
    options:
      - text: "สามรอบในเอกสารเลยเหรอ{kq}"
        heart: 1
        reply: "สามรอบ สามผู้รับเหมา นามสกุลเดียวกันสองราย ญาติท่านนายกฯ ทั้งคู่ เราไม่ได้กล่าวหานะ ทะเบียนบ้านกล่าวหาเอง"
        next:
          - text: "พี่เมย์มีเอกสารด้วย{kq}"
            heart: 1
            reply: "มีครึ่งเดียว อีกครึ่งอยู่ในตู้ที่กุญแจไปงานบวชมาสามอาทิตย์ งานบวชที่ยาวที่สุดในพุทธศาสนา"
          - text: "{p}ไม่รู้เรื่องนี้เลย{k}"
            heart: 1
            reply: "ไม่มีใครรู้ เพราะไม่มีใครอ่านประกาศจัดซื้อ มันติดบอร์ดหน้า อบต. ใต้ป้ายไวนิลยินดีต้อนรับ ต้องยกป้ายขึ้นถึงจะเห็น"
      - text: "เสี่ยเฮงขอให้โหวต{k}"
        heart: 0
        reply: "เสี่ยขอแลกกับอะไร ไม่ต้องตอบ… ถ้ามีอะไรติดค้างกัน เขียนวันที่ไว้นะ ทุกวันที่สำคัญหมด"

  - id: may_r_vote_market
    topic: react
    once: true
    when: { flag: vote_market }
    npc: "โหวตตลาดนัดเหรอ น่ารักดี ตลาดนัดคือที่เดียวในตำบลที่ข่าวลือกับขนมครกวิ่งเร็วพอๆ กัน ถ้ามีจริงเราจะไปตั้งแผงรับฟังเรื่องร้องเรียน"
    options:
      - text: "แผงรับเรื่องร้องเรียนขายอะไร{kq}"
        heart: 1
        reply: "ขายความสนใจ ราคาฟรี คนมาเล่า เราจด… ป้าแต๋วบอกว่าเป็นการแย่งลูกค้า ป้าจะตั้งแผงข้างๆ แบบเดียวกัน แต่ฟังแล้วเล่าต่อเร็วกว่า"
      - text: "ป้าแต๋วอยากได้ตลาดมาก{k}"
        heart: 1
        reply: "ป้าอยากได้ตลาดเพราะคนมารวมกัน ป้าไม่ได้อยากขายของเยอะขึ้นหรอก ป้าอยากฟังเยอะขึ้น เหมือนเราเลย แค่ป้าไม่ต้องหาคนจ่ายค่าเรื่อง"
        next:
          - text: "พี่เมย์กับป้าแต๋วควรร่วมงานกัน{k}"
            heart: 2
            reply: "เราเสนอแล้ว ป้าขอส่วนแบ่งเป็นเครดิตชื่อท้ายข่าว ‘ข้อมูลจากร้านชำแห่งหนึ่ง’ ป้าบอกให้ใส่ ‘ร้านชำป้าแต๋ว’ ไปเลย คนจะได้มาซื้อ"
          - text: "ตลาดก็ศึกษาความเป็นไปได้ครึ่งนึงนะ{kq}"
            heart: 1
            reply: "ทุกโครงการศึกษาความเป็นไปได้ครึ่งหนึ่ง ความเป็นไปได้ในตำบลนี้คงเป็นสิ่งที่ถูกศึกษามากที่สุดในประเทศ แต่ไม่เคยเป็นไปได้สักที"

  - id: may_r_well_dry
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "บ่อป้าแต๋วกับบ่อลุงสมหมายแห้งห่างกันสามวัน เราปักหมุดในแผนที่แล้ว {player} ลากเส้นต่อจุดดู มันชี้ไปที่ไหน… เดาถูก รางวัลคือความหดหู่หนึ่งชิ้น"
    options:
      - text: "จะเอาไปลงข่าวเลยไหม{kq}"
        heart: 1
