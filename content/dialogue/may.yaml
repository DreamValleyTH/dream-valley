          - text: "อ่านครบสี่สิบเจ็ดหน้าไหม{kq}"
            heart: 0
            reply: "อ่านถึงหน้าสิบ แล้วข้ามไปอ่านภาคผนวก ภาคผนวกกล้าใส่รูปผักสวยมาก เขาแอบอวดผักในรายงานบ่อแห้ง"
      - text: "กล้าชอบพี่เมย์หรือเปล่า{kq}"
        heart: 0
        reply: "ไม่ใช่! กล้าชอบสเปรดชีต ส่วนเราเป็นคนรับสเปรดชีต ความสัมพันธ์ของเราคือไฟล์แนบ"

  - id: may_o_ann
    topic: others
    npc: "หมอแอนแอบเอาชุดตรวจคุณภาพน้ำของ รพ.สต. มาให้ยืม บอกว่า ‘เอาไปตรวจน้ำบ่อชาวบ้าน เพื่อสุขภาพอนามัย’ แล้วขยิบตา หมอแอนขยิบตาไม่เป็น ตาปิดทั้งสองข้าง"
    options:
      - text: "หมอแอนก็เป็นพวกเราด้วย{kq}"
        heart: 1
        reply: "หมออยู่ฝ่ายสุขภาพ บ่อแห้งน้ำขุ่น เด็กท้องเสีย มันก็เรื่องสุขภาพ… หมอบอกว่าหมอไม่ได้อยู่ฝ่ายไหน หมออยู่ฝ่ายเด็กท้องเสีย"
        next:
          - text: "ผลตรวจน้ำเป็นไง{kq}"
            heart: 1
            reply: "บ่อหกจากสิบบ่อ ตะกอนเกินมาตรฐาน บ่อบ้านลุงสมหมายมีสนิมเหล็กสูงจนหมอห้ามอาบ ป้าพรบอกว่าไม่ได้อาบมาสองวันแล้ว เลยไม่มีใครกล้าเข้าใกล้"
          - text: "อย่าเอาหมอแอนไปเดือดร้อนนะ{kq}"
            heart: 2
            reply: "ไม่เอ่ยชื่อหมอแน่นอน หมอแก้ข่าวปลอม เราขุดข่าวจริง ถ้าหมอโดนย้าย ตำบลนี้จะไม่มีใครแก้ข่าวน้ำมะนาวโซดาอีกเลย"
      - text: "หมอแอนขยิบตาไม่เป็นจริงเหรอ{kq}"
        heart: 1
        reply: "ไม่เป็นเลย ทำครั้งหนึ่งดูเหมือนจามช้าๆ เราบอกว่าน่ารัก หมอโกรธ บอกว่ากำลังทำหน้าจริงจัง"

quests:
  - id: may_q1
    npc: may
    title: "แผนที่บ่อแห้ง"
    desc: "เมย์กำลังทำแผนที่บ่อแห้งทั้งตำบล ขอให้ช่วยเก็บข้อมูลที่เครื่องวัดใต้สะพานกับบ้านลุงสมหมาย"
    start: { heart_min: 2, day_min: 10, flag: story_well_dry }
    offer:
      npc: "{player} ว่างไหม เรามีงานขุดคุ้ยระดับเริ่มต้น ไม่อันตราย ไม่ต้องเจอยาม ได้ค่าตอบแทนเป็นความรู้สึกดีและเงินนิดหน่อยที่เราขูดจากกระปุกหมู"
      options:
        - text: "ได้{k} บอกมาเลย"
          accept: true
          heart: 1
          reply: "หนึ่ง ใต้สะพานคลองส่งน้ำมีเสาวัดระดับน้ำของกรมชลฯ ไปดูตอนเช้าว่าน้ำอยู่ขีดไหน สอง ถามลุงสมหมายว่าบ่อแห้งวันไหน จำวันที่ได้ไหม สาม เราต้องการแฟ้มใหม่ แฟ้มเก่าเราเปียกฝนจนข้อมูลหายครึ่ง ครึ่งที่สำคัญ"
        - text: "ไม่อันตรายแน่นะ{kq}"
          accept: true
          heart: 0
          reply: "แน่ อันตรายสุดคือลุงสมหมายจะชวนซื้อหวยเลขวันที่บ่อแห้ง ถ้าโดนชวน ให้ปฏิเสธอย่างสุภาพ หรือซื้อหนึ่งใบแล้วบอกเรา เราจะได้ทำสถิติ"
        - text: "ไว้วันหลังนะ{kq}"
          heart: 0
          reply: "ได้ แต่บ่อไม่รอนะ… ขอโทษ เราประชดเป็นนิสัย ไม่ได้ตั้งใจกดดัน ว่างเมื่อไหร่ก็มาร้านกาแฟ"
    steps:
      - goal: { type: visit, place: canal, from: "06:00", to: "09:00" }
        hint: "ไปดูเสาวัดระดับน้ำใต้สะพานคลองส่งน้ำตอนเช้า (06:00–09:00)"
        done:
          npc: "(เสาวัดระดับน้ำขึ้นตะไคร่สูงเหนือผิวน้ำเกือบเมตร มีขีดสีแดงเขียนด้วยปากกาเมจิกว่า ‘ปีที่แล้ว’ ลายมือเหมือนของกล้า)"
          options:
            - text: "ถ่ายรูปไว้ให้พี่เมย์"
              heart: 0
              reply: "(ถ่ายแล้ว ในรูปมีกบตัวหนึ่งนั่งอยู่บนขีด ‘ปีที่แล้ว’ เหมือนตั้งใจเป็นสเกลวัด)"
      - goal: { type: talk, npc: sommai }
        hint: "ไปถามลุงสมหมายที่บ้านว่าบ่อแห้งวันไหน"
        done:
          npc: "บ่อลุงแห้งวันไหนเหรอ… จำได้แม่นเลย วันหวยออกพอดี! ลุงถูกเลขท้ายสองตัว สองร้อยบาท กลับมาตักน้ำอาบฉลอง ได้แต่โคลน ได้เงินสองร้อย เสียบ่อหนึ่งบ่อ เมย์เขาจะเอาไปเขียนเหรอ บอกเขาว่าลุงไม่ได้เศร้านะ ลุง… เออ เศร้านิดนึง"
          options:
            - text: "ลุงจำวันได้แม่นมากเลย{k}"
              heart: 1
              reply: "แม่นสิ วันหวยออกลุงไม่เคยลืม วันเกิดเมียลุงยังลืมได้ อย่าบอกป้าพรนะ"
            - text: "ลุงยังเหลือน้ำใช้ไหม{kq}"
              heart: 1
              reply: "ตักจากโอ่งน้ำฝน กับไปขอบ่อวัด หลวงพ่อให้ตักฟรี ไม่ต้องทำบุญ แต่ลุงก็ทำ ใส่ซองยี่สิบ เขียนเลขท้ายไว้ข้างซองด้วย เผื่อหลวงพ่อเห็น"
      - goal: { type: give, npc: may, item: folder, n: 1 }
        hint: "ซื้อแฟ้มเอกสารที่ร้านชำป้าแต๋ว แล้วเอาไปให้เมย์ที่ร้านกาแฟ"
        done:
          npc: "แฟ้มใหม่! สีฟ้าด้วย… เอาล่ะ ขีดแดงของกล้าบอกว่าคลองลดเกือบเมตรในหนึ่งปี ลุงสมหมายบอกวันที่ บวกบ่อป้าแต๋ว เราได้สามจุดแล้ว สามจุดคือรูปแบบ {player} รู้ไหมว่าเพิ่งทำอะไรไป"
          options:
            - text: "ช่วยพี่เมย์ทำข่าว{kq}"
              heart: 1
              reply: "ไม่ใช่ ช่วยตำบลจดความจำ ข่าวเป็นแค่วิธีที่ความจำไปถึงคนที่อยู่ไกล… โห ประโยคนี้ดี จะเอาไปใช้ในบทความ ไม่ให้เครดิตนะ"
            - text: "ทำให้ตัวเองโดนหมายหัวด้วย{kq}"
              heart: 0
              reply: "นิดหน่อย แต่ไม่ใส่ชื่อ {player} ไว้ที่ไหนเลย ในแฟ้มนี้ {player} ชื่อ ‘แหล่งข่าว ก.’ ฟังดูเท่กว่าชื่อจริงด้วย"
    sold_at: { folder: taew_shop }
    reward: { money: 120, heart: 2, set_flag: may_q1_done, line: { from: may, text: "แผนที่บ่อแห้งบ้านดงเย็น อัปเดต: 3 จุด 📍 ใครบ่อเริ่มขุ่น จดวันที่แล้วทักมาได้นะคะ ไม่ใส่ชื่อ 🙏" } }

  - id: may_q2
    npc: may
    title: "รถที่ไม่เปิดไฟ"
    desc: "มีรถไม่เปิดไฟขับตามเมย์ทุกคืน เธอขอให้ช่วยเดินเป็นเพื่อนจากร้านกาแฟกลับห้องเช่า"
    start: { flag: may_q1_done, heart_min: 3, day_min: 14 }
    offer:
      npc: "{player}… เราขออะไรที่ไม่เกี่ยวกับข่าวได้ไหม คืนนี้เดินเป็นเพื่อนเรากลับห้องหน่อย ร้านกาแฟปิดสองทุ่ม ช่วงนี้มีกระบะสีดำไม่เปิดไฟขับตามเราสามคืนแล้ว… ไม่ต้องตกใจนะ เราพูดเรื่องนี้ได้แบบเรียบๆ แล้ว ฝึกมา"
      options:
        - text: "ได้{k} สองทุ่มเจอที่ร้าน"
          accept: true
          heart: 2
          reply: "ขอบคุณ… ไม่ต้องทำอะไรนะ แค่เดินข้างๆ แล้วคุยเรื่องไร้สาระ เช่นละครหลังข่าว คนที่ขับตามจะได้รู้ว่าเราไม่ได้อยู่คนเดียว"
        - text: "แจ้งตำรวจหรือยัง{kq}"
          accept: true
          heart: 1
          reply: "แจ้งแล้ว แฟ้มสีฟ้า ใต้แฟ้มสีเหลือง ใต้ปิ่นโต… ถ้า {player} ช่วยไปพูดกับดาบอีกเสียงด้วยจะดีมาก แต่คืนนี้เดินกลับด้วยกันก่อนนะ"
        - text: "{p}ไม่กล้าออกกลางคืน{k}"
          heart: 0
          reply: "เข้าใจ… จริงๆ นะ เราก็ไม่กล้า แค่ไม่มีทางเลือก ไม่เป็นไร เราจะเดินเร็วๆ"
    steps:
      - goal: { type: visit, place: coffee, from: "19:30", to: "20:30" }
        hint: "ไปรับเมย์ที่ร้านกาแฟช่วง 19:30–20:30 แล้วเดินไปส่งห้องเช่า"
        done:
          npc: "(เดินไปได้ครึ่งทาง ไฟหน้ารถดับคันหนึ่งจอดนิ่งอยู่ท้ายตลาด เมย์พูดเรื่องพระเอกความจำเสื่อมเสียงดังขึ้นเรื่อยๆ จนถึงประตูห้องเช่า) …เห็นไหม มันจอดตรงนั้นทุกคืน ป้ายทะเบียนติดฝุ่นพอดีจนอ่านไม่ออก ฝุ่นที่ตั้งใจมาก"
          options:
            - text: "{p}จะเดินมาส่งทุกคืนเลย{k}"
              heart: 2
              set_flag: may_q2_walk
              reply: "ทุกคืนไม่ได้ {player} มีฟาร์มต้องดูแล… แต่คืนไหนว่างก็มานะ เราจะซื้อขนมครกรอ ถือเป็นค่าจ้างบอดี้การ์ดระดับตำบล"
            - text: "พรุ่งนี้ไปหาดาบด้วยกัน{k}"
              heart: 1
              set_flag: may_q2_police
              reply: "ได้ คราวนี้มีพยานสองคน ดาบจะได้ลงบันทึกในแฟ้มที่อยู่เหนือปิ่นโต"
            - text: "พี่เมย์หยุดสืบสักพักดีไหม{kq}"
              heart: 0
              set_flag: may_q2_stop
              reply: "…คนที่ขับรถคันนั้นก็อยากให้เราคิดแบบนี้แหละ {player} ไม่ผิดที่ถาม แต่ถ้าเราหยุดตอนนี้ เขาจะรู้ว่าวิธีนี้ได้ผล แล้วจะใช้กับคนต่อไป"
      - goal: { type: talk, npc: sathian }
        hint: "ไปแจ้งดาบเสถียรเรื่องรถไม่เปิดไฟอีกเสียง"
        done:
          npc: "เรื่องเมย์อีกแล้วเหรอ… เออ ดาบรู้แล้ว ไม่ต้องเล่า กระบะดำ ฝุ่นเกาะทะเบียน ดาบจดไว้แล้วเหมือนกัน ในซองบุหรี่ (หยิบซองบุหรี่ยับๆ ออกมา มีตัวเลขเขียนไว้ครึ่งเดียว) อีกครึ่งรถมันวิ่งเร็ว ดาบวิ่งไม่ทัน ดาบอายุห้าสิบแปด บอกเมย์ว่าดาบไม่ได้หลับนะ ดาบแค่… ต้องเกษียณให้ได้"
          options:
            - text: "ดาบช่วยได้แค่นี้เหรอ{kq}"
              heart: 0
              reply: "ได้แค่นี้ในเครื่องแบบ นอกเครื่องแบบ… ดาบจะไปนั่งร้านป้าแต๋วตอนสองทุ่มบ่อยขึ้น ร้านป้ามองเห็นท้ายตลาดพอดี ไปนั่งเฉยๆ ไม่ได้ทำอะไรนะ จดไว้ด้วย ไม่ได้ทำอะไร"
            - text: "ขอบคุณ{k}ดาบ"
              heart: 1
              reply: "ขอบคุณทำไม ดาบยังไม่ได้ทำอะไร… บอกเมย์ด้วยว่ากินข้าวให้ตรงเวลา คนผอมๆ วิ่งหนีใครไม่ไหวหรอก"
    reward: { money: 0, heart: 2, items: { honey: 1 }, set_flag: may_q2_done }

  - id: may_q3
    npc: may
    title: "สมุดในถังขยะหลังตู้"
    desc: "เมย์ได้เบาะแสว่าบริษัททิ้งสมุดจดมิเตอร์ไว้หลังตู้คอนเทนเนอร์ ต้องไปเอาตอนค่ำ"
    start: { flag: may_q2_done, heart_min: 4, day_min: 19 }
    offer:
      npc: "ข่าวด่วนแบบกระซิบ ตั้มบอกว่ายามบริษัทมาซื้อบุหรี่ตอนดึก บ่นว่าต้องเอาสมุดจดมิเตอร์เก่าไปทิ้งถังขยะหลังตู้ ‘ตามนโยบายลดกระดาษ’… {player} บริษัทลดกระดาษด้วยการทิ้งหลักฐาน รักษ์โลกมาก ไปด้วยกันไหม ก่อนรถขยะมาตอนเช้า"
      options:
        - text: "ไป{k} แต่กลับก่อนสามทุ่มนะ"
          accept: true
          heart: 2
          reply: "ดีล ไปถามตั้มก่อนว่ากล้องหน้าร้านเห็นอะไรบ้าง แล้วเจอกันหลังตู้ตอนสองทุ่ม ถังขยะไม่ใช่ทรัพย์สินส่วนบุคคล เราเช็กกฎหมายแล้ว… เช็กแบบรีบๆ"
        - text: "คุ้ยขยะผิดกฎหมายไหม{kq}"
          accept: true
          heart: 1
          reply: "ขยะที่ทิ้งแล้วถือว่าสละสิทธิ์ ทนายเพื่อนเราบอก ตอบตอนตีสอง ด้วยสติกเกอร์ยกนิ้ว เราถือว่าเป็นความเห็นทางกฎหมาย"
        - text: "{p}ไม่เอาด้วยนะ{k}"
          heart: -1
          reply: "โอเค… เราไปเองก็ได้ ถ้าพรุ่งนี้ไม่เห็นเราที่ร้านกาแฟ อย่าเพิ่งตกใจ อาจแค่ตื่นสาย"
    steps:
      - goal: { type: talk, npc: tam }
        hint: "ไปถามตั้มที่ร้าน 24 ชม. (ช่วงเย็นถึงดึก) ว่ากล้องหน้าร้านเห็นอะไร"
        done:
          npc: "กล้องหน้าร้านเห็นกระบะดำครับ ออกจากประตูหลังบริษัททุกคืนสองทุ่มสิบห้า ตามหลังมอเตอร์ไซค์พี่เมย์ห้านาที ทุกคืน ตรงเวลากว่ารถเมล์ลุงเชิด ผมเซฟไฟล์ไว้แล้ว ชื่อไฟล์ ‘ผีไม่ซื้อของ’ จะได้ไม่มีใครเปิด"
          options:
            - text: "ตั้มเก่งมาก{k}"
              heart: 1
              reply: "ไม่เก่งครับ ผมแค่ว่าง กะดึกมีเวลาดูกล้องเยอะกว่าดูลูกค้า… ฝากบอกพี่เมย์ว่าซื้อข้าวเวฟร้านผมต่อไปนะ ลูกค้าประจำผมมีแค่พี่เมย์กับผี"
            - text: "ไม่กลัวโดนบริษัทเล่นงานเหรอ{kq}"
              heart: 0
              reply: "บริษัทไม่รู้ว่าผมมีปริญญาครับ เขาคิดว่าผมเป็นแค่เด็กร้าน 24 ชม. คนที่ไม่มีใครสนใจ เก็บหลักฐานได้ดีที่สุด"
      - goal: { type: visit, place: company_office, from: "20:00", to: "21:00" }
        hint: "ไปเจอเมย์หลังตู้คอนเทนเนอร์บริษัทช่วง 20:00–21:00"
        done:
          npc: "(ในถังขยะมีสมุดจดมิเตอร์สามเล่ม กับสำเนาใบขออนุญาตเจาะบ่อที่สองหนึ่งชุด เมย์ส่องไฟฉายมือถือ อ่านไปมือสั่นไป) …{player} ดูช่องพยานสิ ลายเซ็นนี้… ‘สมหมาย’ ลุงสมหมาย คนที่บ่อแห้งวันหวยออก ลุงเป็นพยานให้บ่อที่ทำให้บ่อตัวเองแห้ง"
          options:
            - text: "ลุงคงไม่รู้ว่าเซ็นอะไร{k}"
              heart: 1
              set_flag: may_q3_doubt
              reply: "เราก็คิดแบบนั้น… แต่ ‘คิดว่า’ ไม่ใช่ข้อเท็จจริง ต้องไปถามลุง ถ้าลุงรู้แล้วเซ็น ข่าวเป็นแบบหนึ่ง ถ้าไม่รู้ ข่าวเป็นอีกแบบ… และไม่ว่าแบบไหน ป้าพรจะเกลียดเรา"
            - text: "รีบไปก่อน{k} ยามมาแล้ว"
              heart: 1
              set_flag: may_q3_run
              reply: "ไป! (วิ่งออกมาถึงร้านป้าแต๋ว ดาบเสถียรนั่งอยู่ในร้าน เงยหน้ามองแล้วก้มกินข้าวต่อ) …ดาบอยู่ตรงนั้นจริงด้วย ไม่ได้ทำอะไร แต่อยู่ตรงนั้น"
    reward: { money: 0, heart: 2, set_flag: may_q3_done }

  - id: may_q4
    npc: may
    title: "พาดหัวที่ต้องเลือก"
    desc: "จดหมายทนายฉบับที่สามมาถึง เมย์ต้องเลือกว่าจะลงข่าวทั้งหมด ปกป้องลุงสมหมาย หรือเก็บไว้ก่อน"
    start: { flag: may_q3_done, heart_min: 5, day_min: 22 }
    offer:
      npc: "{player} เราเขียนเสร็จแล้ว สามพันคำ มีสมุดมิเตอร์ มีไฟล์ตั้ม มีแผนที่บ่อ มีลายเซ็นลุงสมหมาย… แล้วเมื่อเช้าจดหมายทนายฉบับที่สามก็มาถึง บรรณาธิการบอกให้ตัดเรื่องบริษัทออก เราอยากคุยกับลุงก่อนตัดสินใจ ไปเป็นเพื่อนหน่อยได้ไหม"
      options:
        - text: "ไปด้วย{k} ลุงไว้ใจ{p}"
          accept: true
          heart: 2
          reply: "ขอบคุณ… ลุงไว้ใจ {player} มากกว่าเราแน่ เราเป็นคนแปลกหน้าที่ถือมือถืออัดเสียง {player} เป็นหลานยายเพียร"
        - text: "ทำไมต้องถามลุงก่อน{kq}"
          accept: true
          heart: 1
          reply: "เพราะข่าวที่ไม่ถามคนในข่าวก่อน คือข่าวที่บริษัททำ เราไม่อยากเป็นแบบนั้น แม้แต่ครั้งเดียว"
    steps:
      - goal: { type: talk, npc: sommai }
        hint: "ไปถามลุงสมหมายเรื่องลายเซ็นพยานในใบขออนุญาตบ่อที่สอง"
        done:
          npc: "…ลายเซ็นลุงจริง สองปีก่อน คนบริษัทมาบอกว่าเป็นใบ ‘สำรวจความคิดเห็นชุมชน’ ให้เซ็นแล้วได้ห้าพัน ตอนนั้นลุงติดหนี้เจ๊หงษ์ค่าหวยเยอะ… ลุงไม่ได้อ่าน ลุงอ่านแต่ตัวเลขห้าพัน หลานจะให้เมย์เขียนชื่อลุงก็เขียนไป ลุงผิดเอง แต่อย่าให้ป้าพรอ่านก่อนลุงเล่าเองนะ"
          options:
            - text: "ลุงไม่ได้ผิดคนเดียวหรอก{k}"
              heart: 2
              reply: "หลานพูดเหมือนยายเพียรเลย ยายเคยด่าลุงว่าโง่ แล้วก็บอกว่า ‘แต่คนที่หลอกคนโง่ บาปกว่า’ …ลุงคิดถึงยายจัง"
            - text: "ลุงน่าจะอ่านก่อนนะ{k}"
              heart: 0
              reply: "รู้แล้ว รู้ช้าไปสองปีกับบ่อหนึ่งบ่อ ค่าเรียนแพงนะหลาน แพงกว่าหวยทุกงวดที่ลุงเคยซื้อรวมกัน"
      - goal: { type: pay, npc: may, n: 300 }
        hint: "ช่วยเมย์ 300 บาท เป็นค่าพิมพ์เอกสารแจกทุกบ้าน (เผื่อเพจโดนลบ)"
        done:
          npc: "สามร้อย… ซื้อกระดาษได้สองรีม พิมพ์ได้ทุกบ้านในตำบล ถ้าเพจโดนลบ กระดาษยังอยู่ใต้ประตูบ้านทุกหลัง ทนายลบกระดาษไม่ได้ ขอบคุณนะ {player} เราจดไว้ในบัญชีหนี้น้ำใจ หน้าที่สามแล้ว ทั้งหน้าเป็นชื่อ {player}"
          options:
            - text: "ไม่ต้องคืน{k}"
              heart: 1
              reply: "ต้องคืน แต่คืนเป็นอย่างอื่น เช่น ข่าวที่ทำให้บ่อบ้าน {player} ไม่แห้ง ถ้าทำได้"
      - goal: { type: days, n: 1 }
        hint: "รอหนึ่งวัน แล้วไปหาเมย์ที่ร้านกาแฟ"
        done:
          npc: "เรานั่งอยู่หน้าจอทั้งคืน ปุ่มส่งอยู่ตรงนี้ {player} มีสามแบบ แบบแรก ลงทั้งหมด รวมชื่อลุง ข่าวแรงสุด ตรงสุด แต่ลุงพัง แบบสอง เบลอชื่อลุง เล่าว่าชาวบ้านถูกหลอกให้เซ็น ข่าวเบาลง แต่อาจโดนบรรณาธิการไม่ลง เราต้องลงเพจตัวเอง แล้วรับคดีคนเดียว แบบสาม… เก็บทั้งหมดไว้ในโฟลเดอร์ ‘ยังไม่ถึงเวลา’ รถจะหยุดตาม จดหมายจะหยุดมา เราจะนอนหลับ ช่วยเราเลือกหน่อย"
          options:
            - text: "ลงทั้งหมดเลย{k} ความจริงต้องครบ"
              heart: 1
              set_flag: may_end_publish
              reply: "…ครบทุกตัวอักษร ชื่อลุงด้วย เราจะไปบอกลุงก่อนกดส่งหนึ่งชั่วโมง เป็นความสุภาพเดียวที่ข่าวแบบนี้ให้ได้ (กดส่ง) …ขึ้นแล้ว ตอนนี้เราขอนั่งเงียบๆ สักพักนะ"
            - text: "เบลอชื่อลุง แล้วเล่นบริษัทอย่างเดียว{k}"
              heart: 2
              set_flag: may_end_protect
              reply: "คนตัวเล็กไม่ใช่เป้า เป้าคือคนที่หลอกคนตัวเล็ก… ใช่ เราเขียนเรื่องนี้เพราะพ่อ แล้วเราจะไม่เขียนแบบที่ทำให้ลูกลุงสมหมายต้องมาเขียนเรื่องพ่อตัวเองอีกคน (กดส่ง) ลงเพจเรา แปดพันคน พอแล้ว"
            - text: "เก็บไว้ก่อน{k} ชีวิตพี่เมย์สำคัญกว่า"
              heart: 1
              set_flag: may_end_hold
              reply: "…ประโยคนี้ไม่มีใครเคยพูดกับเรา ทุกคนพูดว่า ‘ข่าวสำคัญกว่า’ หรือ ‘เลิกเถอะ’ ไม่มีใครพูดว่าชีวิตเราสำคัญ… โอเค ลากไฟล์ใส่โฟลเดอร์แล้ว ไม่ได้ลบนะ แค่ยังไม่ถึงเวลา"
    reward: { money: 0, heart: 2, items: { honey: 1 }, set_flag: may_q_done, line: { from: may, text: "ขอบคุณทุกคนในบ้านดงเย็นที่เล่า จด และกล้าพูดค่ะ ข่าวบางข่าวไม่ได้เขียนคนเดียว 📰💚" } }
