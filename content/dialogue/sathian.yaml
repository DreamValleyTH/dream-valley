# ดาบเสถียร — convos + quests
convos:
  # ===== react =====
  - id: sathian_r_meet
    topic: react
    once: true
    when: { not_flag: met_sathian }
    npc: "…หน้าใหม่ หลานยายเพียรใช่ไหม ดาบเสถียร ตำรวจประจำตำบล มีอะไรจะแจ้งไหม… ไม่มีเหรอ ดี ดาบชอบคนไม่มีอะไรจะแจ้ง"
    set_flag: met_sathian
    options:
      - text: "สวัสดี{k}ดาบ ไม่มีอะไร แค่มาทัก"
        heart: 1
        reply: "ทักเฉยๆ… เออ หายาก ส่วนใหญ่คนมาหาดาบต้องมีเรื่อง ไม่ก็มาขอเลขทะเบียนรถของกลาง นั่งก่อนไหม เปลมีสองตัว ตัวที่สองเพิ่งซื้อ ยังไม่มีใครนั่ง"
        next:
          - text: "ซื้อเปลตัวที่สองไว้ทำไม{kq}"
            heart: 1
            reply: "ไว้ให้คนที่ไม่รำคาญดาบ ผ่านมาสองปี ยังว่าง… นั่งได้นะ ทดลองใช้ฟรี ไม่ต้องลงบันทึกประจำวัน"
          - text: "ดาบทำงานในเปลเหรอ{kq}"
            heart: 0
            reply: "ทำงานความคิด ความคิดต้องใช้ท่านอน ตำราไม่ได้เขียนไว้ แต่ดาบพิสูจน์มาสิบสองปี"
      - text: "ดาบดูง่วงๆ นะ{kq}"
        heart: 0
        reply: "ไม่ได้ง่วง หน้าดาบเป็นแบบนี้ตั้งแต่ติดยศดาบ หน้ามันปรับตัวเข้ากับตำแหน่ง"
      - text: "{p}จะแจ้งความ{k}"
        heart: 0
        reply: "…แน่ใจนะ เอกสารมันเยอะนะ ลองดูใต้เตียงหรือยัง ถ้าไม่เจอ ไปให้ผู้ใหญ่ประกาศ ถ้ายังไม่เจออีก ค่อยมา… พรุ่งนี้"

  - id: sathian_r_intro
    topic: react
    once: true
    when: { flag: story_town_intro }
    npc: "ได้ยินผู้ใหญ่ประกาศชื่อหลานสามรอบเมื่อเช้า ดาบตื่นรอบที่สอง หลับต่อรอบที่สาม รอบแรกดาบไม่ได้ยิน ดาบเชื่อว่ามันเกิดขึ้นจริง"
    options:
      - text: "ดาบตื่นกี่โมง{kq}"
        heart: 1
        reply: "แล้วแต่ผู้ใหญ่ ผู้ใหญ่คือนาฬิกาปลุกของทั้งตำบล ดาบไม่ต้องซื้อนาฬิกาปลุก ดาบเกลียดนาฬิกาปลุก ผู้ใหญ่อย่างน้อยเปิดเพลงก่อน"
      - text: "ได้ยินแล้วรู้สึกยังไง{kq}"
        heart: 1
        reply: "รู้สึกว่าตำบลนี้มีคนเพิ่มหนึ่งคน คดีน่าจะเพิ่มศูนย์จุดหนึ่งคดี… ล้อเล่น หลานหน้าตาไม่เหมือนคนทำคดี เหมือนคนโดนคดีมากกว่า"

  - id: sathian_r_thana
    topic: react
    once: true
    when: { flag: thana_refused }
    npc: "ได้ข่าวว่าหลานไม่ขายที่ให้บริษัท… ดาบไม่ได้แสดงความเห็นนะ ตำรวจต้องเป็นกลาง แต่ดาบนอนหลับสบายขึ้นเมื่อคืน ไม่เกี่ยวกันหรอก บังเอิญ"
    options:
      - text: "ดาบดีใจเหรอ{kq}"
        heart: 2
        reply: "ดาบไม่ดีใจ ดาบเป็นกลาง… ความเป็นกลางของดาบยิ้มนิดนึง อย่าบอกใคร"
      - text: "เขาจะกลับมาอีกไหม{kq}"
        heart: 1
        reply: "มาแน่ บริษัทไม่ใช่ขโมย ขโมยมาครั้งเดียวแล้วหนี บริษัทมาเรื่อยๆ จนเจ้าของเหนื่อย แล้วเจ้าของขายเอง ไม่มีกฎหมายข้อไหนจับความเหนื่อยได้"
        next:
          - text: "แล้วดาบจะช่วยยังไง{kq}"
            heart: 1
            reply: "ดาบจะ… คิด ในเปล ถ้าเขาทำผิดกฎหมายเมื่อไหร่ ดาบลุก ตอนนี้เขายังทำถูกกฎหมาย ถูกจนน่ากลัว"
          - text: "{p}จะไม่เหนื่อย{k}"
            heart: 2
            reply: "พูดตอนนี้ง่าย… แต่ดาบเชื่อ ยายเพียรก็พูดแบบนี้ ไม่เหนื่อยจนวันสุดท้าย ดาบเป็นพยาน"

  - id: sathian_r_meeting1
    topic: react
    once: true
    when: { flag: story_meeting1 }
    npc: "ประชุมประชาคมวันนั้นดาบไปรักษาความสงบ ยืนท้ายศาลา ข้างหม้อน้ำแดง สงบมาก ไม่มีใครตีกัน มีแต่กำนันหลับ นายกฯ พูด แล้วดาบก็ดื่มน้ำแดงไปสามแก้ว"
    options:
      - text: "ดาบได้โหวตไหม{kq}"
        heart: 1
        reply: "ดาบยกมือครึ่งเดียว ผู้ใหญ่นับไม่ได้ว่ายกหรือไม่ยก ดาบตั้งใจ ตำรวจโหวตครึ่งเดียว ปลอดภัยที่สุด"
      - text: "ไม่มีใครตีกันจริงเหรอ{kq}"
        heart: 1
        reply: "ป้าแต๋วกับเสี่ยเฮงเถียงกันเรื่องถนนกับตลาด ดาบเกือบลุก แต่ป้าพรเอาขนมชั้นยัดปากป้าแต๋วไว้ก่อน ป้าพรทำงานเร็วกว่าตำรวจ"
      - text: "น้ำแดงสามแก้วเยอะไปนะ{kq}"
        heart: 0
        reply: "หมอแอนก็ว่างั้น ยืนวัดน้ำตาลดาบท้ายศาลาเลย ประชุมเรื่องงบ หมอวัดเรื่องดาบ ทุกคนทำงานหนักวันนั้น"

  - id: sathian_r_result_market
    topic: react
    once: true
    when: { flag: meeting1_result_market }
    npc: "ตลาดนัดชนะ… ดาบได้รับมอบหมายให้ดูแลความปลอดภัยตลาดนัด ภารกิจคือยืนข้างแผงลูกชิ้นทอดทุกเย็นวันเสาร์ ดาบรับภารกิจนี้ด้วยความเต็มใจที่สุดในชีวิตราชการ"
    options:
      - text: "งบครึ่งนึงไปศึกษาความเป็นไปได้ด้วยนะ{kq}"
        heart: 1
        reply: "รู้ ดาบอ่านหนังสือแล้ว ศึกษาว่าตลาดจะเป็นไปได้ไหม ตลาดมีมาตั้งแต่ดาบยังไม่เกิด… ดาบอยากศึกษาความเป็นไปได้ว่าเงินห้าแสนจะหายไปได้ยังไงเร็วขนาดนี้ แต่ดาบไม่มีงบศึกษา"
        next:
          - text: "ดาบสืบได้ไหม{kq}"
            heart: 1
            reply: "สืบได้ แต่ถ้าสืบเจอ คนที่โดนย้ายคือดาบ ดาบเคยสืบเจอมาแล้วครั้งนึง ตอนนี้ดาบอยู่ตำบลนี้ไง"
          - text: "ลูกชิ้นทอดก็ดีนะ{k}"
            heart: 2
            reply: "ดีที่สุด ภารกิจเดียวในชีวิตที่ดาบไม่อยากให้มันจบ… ไปด้วยไหมเสาร์นี้ ดาบซื้อเผื่อ ไม่ใช่สินบนนะ"
      - text: "ดาบดูแลตลาดได้ดีแน่{k}"
        heart: 1
        reply: "ดีแน่ ตลาดนัดไม่ค่อยมีอาชญากรรม มีแต่เจ๊หงษ์กับกระดาษใต้ถาด ซึ่งดาบไม่เห็น"

  - id: sathian_r_well
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "บ่อหลังร้านป้าแต๋วแห้ง ป้าแต๋วมาแจ้งความว่า ‘น้ำหาย’ ดาบรับแจ้ง… แล้วนั่งมองแบบฟอร์มชั่วโมงนึง ไม่มีช่องให้กรอกว่าทรัพย์สินที่หายคือน้ำใต้ดิน"
    options:
      - text: "แล้วดาบกรอกว่าอะไร{kq}"
        heart: 2
        reply: "ดาบเขียนในช่องหมายเหตุว่า ‘น้ำ ปริมาณไม่ทราบ ผู้ต้องสงสัยมีท่อ’ … ดาบเก็บไว้ในลิ้นชักแล้ว ไม่ได้ส่ง แต่ไม่ได้ทิ้ง"
        next:
          - text: "ส่งไปเถอะ{k}ดาบ"
            heart: 1
            reply: "ส่งไปแล้วจะมีคนอ่าน คนอ่านจะโทรหาคนที่มีท่อ คนที่มีท่อจะโทรหาคนที่ย้ายดาบได้… ดาบรู้เส้นทางนี้ ดาบเดินมาแล้ว"
          - text: "ดาบเก็บเรื่องอื่นไว้ในลิ้นชักอีกไหม{kq}"
            heart: 1
            reply: "เยอะ… ใต้เปลด้วย ไว้หลานสนิทกับดาบกว่านี้ ดาบจะเล่า ตอนนี้ดาบจะนอนทับมันไปก่อน"
      - text: "ไม่มีกฎหมายคุ้มครองน้ำเหรอ{kq}"
        heart: 1
        reply: "มี ใบอนุญาตเจาะบ่อบาดาล บริษัทมีครบ ออกโดยคนที่มีหน้าที่ออก ทุกอย่างถูกกฎหมาย… ดาบเกลียดคำว่าถูกกฎหมายในประโยคแบบนี้"

  - id: sathian_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "รปภ. บริษัทมาแจ้งความว่าโดนผีหลอก ดาบรับแจ้ง… เป็นครั้งแรกที่ดาบยิ้มตอนรับแจ้งความ ช่องผู้ต้องหาดาบเขียนว่า ‘เจ้าที่’"
    options:
      - text: "ดาบจะสืบไหม{kq}"
        heart: 1
        reply: "สืบแล้ว ดาบไปถามยายบัว ยายบอกว่าผีไม่ชอบคนดูดน้ำ ดาบจดคำให้การไว้ ปิดคดีด้วยเหตุผลว่า ‘ผู้ต้องหาอยู่นอกเขตอำนาจ’"
      - text: "ดาบเชื่อเรื่องผีไหม{kq}"
        heart: 1
        reply: "ดาบเห็นผีโพงเดินผ่านโรงพักเมื่อคืนก่อน มันพยักหน้าให้ ดาบพยักหน้าคืน เราไม่ยุ่งกัน… ผีกับดาบมีข้อตกลง ดาบไม่ตรวจกลางคืน ผีไม่หลอกโรงพัก"
        next:
          - text: "ข้อตกลงนี้ใครเสนอ{kq}"
            heart: 1
            reply: "ไม่มีใครเสนอ มันเกิดเอง เหมือนข้อตกลงส่วนใหญ่ในตำบลนี้ ไม่มีกระดาษ แต่ทุกคนรู้"
          - text: "ดาบกลัวผีใช่ไหม{kq}"
            heart: 0
            reply: "ดาบไม่กลัว ดาบเคารพ ความเคารพทำให้ดาบปิดไฟโรงพักตอนสองทุ่มครึ่งตรง"

  - id: sathian_r_helped_may
    topic: react
    once: true
    when: { flag: helped_may }
    npc: "หลานไปถ่ายรูปท่อกับเมย์เมื่อคืน… ดาบไม่เห็นนะ ดาบหลับ แต่หลับแบบหูยังเปิด รถกระบะสีเทาไม่มีทะเบียนหน้า วิ่งผ่านโรงพักสองรอบหลังสามทุ่ม"
    options:
      - text: "ดาบรู้ว่ารถของใคร{kq}"
        heart: 1
        reply: "ดาบรู้ว่ารถไม่มีทะเบียนหน้า แปลว่ามีคนไม่อยากให้รู้ว่ารถของใคร ซึ่งก็บอกอะไรบางอย่างแล้ว… อย่าออกไปตอนกลางคืนคนเดียวอีกนะ หลาน"
        next:
          - text: "ดาบห่วง{p}เหรอ{kq}"
            heart: 2
            reply: "ดาบห่วงการเขียนรายงานถ้าหลานเป็นอะไรไป… ไม่ใช่ ดาบห่วงจริง ดาบพูดตรงหนึ่งครั้งต่อเดือน ครั้งนี้ใช้ไปแล้ว"
          - text: "ดาบช่วยตามรถได้ไหม{kq}"
            heart: 1
            reply: "ตามได้… ด้วยมอเตอร์ไซค์ที่ไฟหน้าติดบ้างไม่ติดบ้าง ตอนกลางคืนที่ผีออก ดาบจะคิดในเปลก่อนนะ"
      - text: "ดาบจะไปบอกใครไหม{kq}"
        heart: 1
        reply: "ดาบไม่บอกใคร ดาบไม่เห็นอะไร… ดาบนอนหลับลึกมากเมื่อคืน หลับลึกจนจำทะเบียนหลังได้สองตัวท้าย"

  - id: sathian_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ประชุมรอบสอง คนแตกเป็นสองฝั่ง ดาบยืนตรงกลางข้างผู้ใหญ่ ยืนกลางแบบตำรวจ คือหันหน้าเข้ากำแพง ไม่มองฝั่งไหน"
    options:
      - text: "ดาบหันหน้าเข้ากำแพงทั้งประชุมเลยเหรอ{kq}"
        heart: 1
        reply: "ครึ่งประชุม อีกครึ่งดาบหันไปมองหม้อน้ำแดง น้ำแดงไม่มีฝั่ง"
      - text: "ถังน้ำ CSR ดาบได้ไหม{kq}"
        heart: 1
        reply: "ได้หนึ่งใบ ดาบเอามาใส่น้ำแข็งแช่ชาเย็นในโรงพัก โลโก้บริษัทหันเข้าหาเปล ทุกครั้งที่ดาบนอนจะเห็นโลโก้ ดาบเลยนอนตะแคงอีกข้าง"
        next:
          - text: "ทำไมไม่หันโลโก้ออก{kq}"
            heart: 1
            reply: "ดาบอยากเห็นมันทุกวัน จะได้ไม่ลืมว่าทำไมดาบยังเก็บแฟ้มไว้ใต้เปล"
          - text: "ชาเย็นในถังบริษัท ประชดดีนะ{kq}"
            heart: 2
            reply: "ไม่ได้ประชด ประหยัด… แต่ถ้าหลานเห็นว่าประชด ดาบไม่ห้าม เสรีภาพในการตีความ"

  - id: sathian_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ช่วงเลือกตั้งแล้ว ป้ายหาเสียงโดนกรีดสามป้าย มีคนมาแจ้ง ดาบรับเรื่อง… ป้ายให้การไม่ได้ ผู้เสียหายเป็นรูปคนยิ้ม ดาบสอบปากคำไม่ได้"
    options:
      - text: "คืนหมาหอนดาบจะออกตรวจไหม{kq}"
        heart: 1
        reply: "ดาบเข้าเวร… ในโรงพัก ปิดไฟ ได้ยินหมาหอนเยอะมาก แต่ดาบไม่ใช่ตำรวจหมา ใครถือซองเดินผ่านมืดๆ ดาบไม่เห็น เพราะปิดไฟ ระบบมันออกแบบมาดี"
        next:
          - text: "ระบบออกแบบให้ดาบไม่เห็นเหรอ{kq}"
            heart: 2
            reply: "ระบบออกแบบให้ทุกคนไม่เห็น ดาบแค่ทำตามแบบได้เก่งที่สุด… หลานถามคำถามที่ทำให้ดาบนอนไม่หลับอีกแล้ว"
          - text: "ถ้า{p}เห็นจะแจ้งดาบนะ{k}"
            heart: 1
            reply: "แจ้งได้… แจ้งตอนเช้า ดาบจะรับเรื่อง แล้วเรื่องจะไปอยู่ในถาด ถาดนั้นมีเรื่องคืนหมาหอนสามรอบเลือกตั้งแล้ว"
      - text: "ดาบเลือกใคร{kq}"
        heart: 0
        reply: "ดาบเป็นกลาง กลางแบบยืนกลางถนน ไม่มองซ้ายไม่มองขวา… แล้วโดนรถแห่ทั้งสองฝั่งบีบแตรใส่"

  - id: sathian_r_kitten
    topic: react
    once: true
    when: { flag: kitten_promise }
    npc: "หลานจะเอาลูกแมวร้านป้าแต๋วไปเลี้ยงเหรอ… ตัวที่หน้าเหมือนดาบไหม ป้าแต๋วบอกทั้งตำบลว่าหน้าเหมือนดาบ ดาบไปดูมาแล้ว ไม่เหมือน มันหลับเก่งกว่า"
    options:
      - text: "ตัวที่หน้าเหมือนดาบนั่นแหละ{k}"
        heart: 2
