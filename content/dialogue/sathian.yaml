      - text: "ผีปอบยืนหน้าตู้ทำไม{kq}"
        heart: 1
        reply: "ตั้มบอกว่ามันมาดูยอด… ดาบไม่ถามต่อ ดาบปิดคดีด้วยเหตุผลว่าผู้ต้องหาไม่มีบัตร"
      - text: "ตั้มไม่กลัวเหรอ{kq}"
        heart: 1
        reply: "ตั้มไม่กลัวอะไรเลย ตื่นทั้งคืน พูดหน้าตาย เป็นพยานที่ดีที่สุดในตำบล แต่ไม่เคยอยากให้การ ดาบกับตั้มเข้าใจกัน เราสองคนเห็นทุกอย่างแล้วเงียบ"

  # ===== smalltalk =====
  - id: sathian_s_hammock
    topic: smalltalk
    npc: "เปลตัวนี้ดาบผูกมาสิบสองปี เปลี่ยนเชือกไปสามเส้น เส้นล่าสุดดาบซื้อร้านเสี่ยเฮง เสี่ยบอกว่าเชือกนี้เหนียวกว่าดอกเบี้ย ดาบไม่แน่ใจว่าชมเชือกหรือชมดอกเบี้ย"
    options:
      - text: "เปลนอนสบายไหม{kq}"
        heart: 1
        reply: "สบายที่สุดในอำเภอ ดาบสำรวจมาแล้ว เปลโรงพักอำเภอผูกตึงเกิน เปลบ้านกำนันผูกต่ำเกิน เปลดาบพอดีเหมือนชะตากรรม"
        next:
          - text: "ขอลองนอนได้ไหม{kq}"
            heart: 2
            reply: "ได้ ตัวที่สอง ตัวนั้นยังไม่มีใครนอน… เป็นเกียรตินะ หลานเป็นคนแรกในสองปี ลงบันทึกประจำวันเลย"
          - text: "ดาบสำรวจเปลทั้งอำเภอเลยเหรอ{kq}"
            heart: 1
            reply: "สมัยหนุ่มดาบสำรวจคดี ตอนนี้สำรวจเปล ทักษะเดียวกัน ความละเอียดเท่ากัน ผลกระทบน้อยกว่า"
      - text: "ดาบผูกเปลในเวลาราชการได้เหรอ{kq}"
        heart: 0
        reply: "ระเบียบไม่ได้ห้ามผูกเปล ระเบียบห้ามละทิ้งหน้าที่ ดาบไม่ได้ละทิ้ง ดาบนอนอยู่ตรงหน้าที่พอดี"

  - id: sathian_s_siren
    topic: smalltalk
    npc: "ไซเรนรถสายตรวจเปิดไม่ติดมาสองปี ดาบทำเรื่องขอซ่อม ได้คำตอบว่าอยู่ระหว่างจัดซื้อจัดจ้าง ดาบเลยใช้ปากร้อง ‘หวอ’ เอง ประหยัดงบหลวง"
    options:
      - text: "ดาบร้องหวอจริงเหรอ{kq}"
        heart: 1
        reply: "จริง ครั้งเดียว ตอนวัวเจ้าโชคเดินกลางถนน ดาบร้องหวอ วัวหันมามอง แล้วเดินต่อ วัวไม่เคารพไซเรนปาก"
      - text: "ลองร้องให้ฟังหน่อย{k}"
        heart: 2
        reply: "…หวอ… หวอ… ดาบร้องเบาๆ เดี๋ยวหมาหอนตาม แล้วผู้ใหญ่จะประกาศว่ามีเหตุ แล้วดาบต้องออกไปดูเหตุที่ดาบก่อเอง"
      - text: "ไม่ต้องใช้ไซเรนก็ได้มั้ง{k}"
        heart: 0
        reply: "ไม่ต้องใช้จริง ตำบลนี้ไม่มีอะไรต้องรีบ… ยกเว้นตอนน้ำท่วม ตอนนั้นดาบอยากมีไซเรนมาก"

  - id: sathian_s_iced_tea
    topic: smalltalk
    when: { time: noon }
    npc: "เที่ยงแล้ว ชาเย็นแก้วที่สองของวัน หลักฐานชิ้นสำคัญ ดาบเก็บรักษาไว้ในมือตลอด ไม่ให้ใครแตะ… หลานจะเอาไหม ดาบซื้อเผื่อ เผื่อเหงา"
    options:
      - text: "เอา{k} ขอบคุณดาบ"
        heart: 2
        reply: "ดี แก้วนี้หวานน้อย หมอแอนสั่ง… หมอแอนสั่งดาบ ไม่ได้สั่งหลาน แต่ดาบให้หลานแก้วหวานน้อย ดาบกินแก้วหวานปกติ แบบนี้หมอแอนไม่รู้"
      - text: "ดาบซื้อเผื่อทุกวันเลยเหรอ{kq}"
        heart: 1
        reply: "ทุกวัน ถ้าไม่มีใครมา ดาบกินเองสองแก้ว เลยต้องหนีหมอแอนสองเท่า"

  - id: sathian_s_retire
    topic: smalltalk
    npc: "ถ้าดาบเกษียณ ดาบจะเปิดร้านให้เช่าเปล ชั่วโมงละสิบบาท มีชาเย็นขาย มีป้ายว่า ‘ที่นี่ไม่รับแจ้งความ’ ลูกค้าคนแรกคือดาบเอง"
    options:
      - text: "{p}จะเป็นลูกค้าคนที่สอง{k}"
        heart: 2
        reply: "ดี ลดราคาให้ ชั่วโมงละห้าบาท แต่ห้ามเล่าเรื่องคดีให้ดาบฟัง ถ้าเล่าคิดเพิ่มยี่สิบ"
      - text: "แบบนี้ก็ทำงานอยู่ดีนะ{kq}"
        heart: 1
        reply: "งานที่ดาบเลือกเอง ต่างกันมาก… งานตอนนี้มีคนเลือกให้ดาบ ว่าคดีไหนทำได้ คดีไหนนอนได้"

  - id: sathian_s_rain
    topic: smalltalk
    when: { rain: true }
    npc: "ฝนตก… ดาบเลื่อนการตรวจตราออกไปก่อน ฝนแบบนี้ไม่มีใครออกไปขโมย ดาบเลยไม่ออกไปจับ ตรรกะสมบูรณ์ ตรรกะที่ดาบใช้มาสิบสองฤดูฝน"
    options:
      - text: "ถ้ามีคนขโมยตอนฝนตกล่ะ{kq}"
        heart: 1
        reply: "ขโมยตอนฝนตกเป็นขโมยที่ขยัน ขโมยที่ขยันขนาดนั้น ดาบให้เกียรติ… ล้อเล่น ดาบจะไปตอนฝนหยุด รอยเท้ายังชัด ดินเปียกเป็นพยานที่ดี"
      - text: "นั่งฟังเสียงฝนด้วยกันไหม{kq}"
        heart: 2
        reply: "นั่ง… หลังคาสังกะสีโรงพักเสียงดีที่สุดในตำบล ดาบไม่เคยบอกใคร มันเป็นเหตุผลที่ดาบไม่ย้ายโรงพัก"

  # ===== self =====
  - id: sathian_f_years
    topic: self
    npc: "ดาบเป็นตำรวจมายี่สิบหกปี ติดยศดาบมาสิบห้าปี ยศมันชอบดาบ ไม่ยอมไปไหน ดาบก็ไม่ไล่"
    options:
      - text: "ทำไมไม่ได้เลื่อนยศ{kq}"
        heart: 1
        reply: "การเลื่อนยศต้องมีคนเซ็น คนที่ต้องเซ็นจำชื่อดาบได้ จำด้วยเหตุผลที่ไม่ดี… หลานถามเรื่องที่ดาบจะเล่าตอนสนิทกว่านี้ ใจเย็นนะ"
      - text: "ดาบรักงานตำรวจไหม{kq}"
        heart: 1
        reply: "รัก… รักแบบคนที่เคยรักมาก แล้วโดนทิ้ง แล้วยังไม่ยอมไปไหน เปลนี้คือบ้านหลังสุดท้ายของความรักนั้น"

  - id: sathian_f_transfer
    topic: self
    when: { heart_min: 3 }
    npc: "สมัยดาบอยู่โรงพักอำเภอ ดาบทำคดีบ่อบาดาลเถื่อน สืบจนถึงเจ้าของบริษัทเจาะบ่อ เตรียมส่งสำนวน… อาทิตย์ต่อมาดาบได้คำสั่งย้ายมาที่นี่ ‘เพื่อความสงบเรียบร้อย’"
    options:
      - text: "ความสงบของใคร{kq}"
        heart: 2
        reply: "ของคนที่ดาบเกือบจับ… หลานถามตรงเหมือนเมย์ ดาบชอบคนถามตรง แต่ดาบตอบตรงได้แค่ตอนไม่มีใครฟัง ตอนนี้มีหลานคนเดียว ดาบเลยตอบ"
        next:
          - text: "บริษัทนั้นยังอยู่ไหม{kq}"
            heart: 2
            reply: "อยู่ เปลี่ยนชื่อ ตอนนี้รับเหมาเจาะบ่อให้บริษัทคุณธนา ดาบเห็นโลโก้บนรถบรรทุกตีสอง… โลโก้ใหม่ แต่ทะเบียนรถคันเก่า"
          - text: "ดาบเสียใจไหม{kq}"
            heart: 1
            reply: "เสียใจที่ไม่ได้ส่งสำนวน ไม่เสียใจที่ได้มาที่นี่ ที่นี่มีหมอแอน มีชาเย็น มีเปล… และมีคนที่ยังถามคำถามแบบนี้"
      - text: "ดาบเลยเลิกขยันตั้งแต่นั้นเหรอ{kq}"
        heart: 1
        reply: "ดาบไม่ได้เลิก ดาบเปลี่ยนเป้า ขยันกับคดีเล็กไม่มีความหมาย ขยันกับคดีใหญ่แล้วโดนย้าย ดาบเลยขยันนอน รอวันที่มีคนยืนข้างดาบ"

  - id: sathian_f_kids
    topic: self
    when: { heart_min: 5 }
    npc: "ลูกคนโตดาบอยากเป็นตำรวจ ดาบเกลี้ยกล่อมให้ไปเป็นหมอ บอกว่าหมอได้ช่วยคนแน่นอน ตำรวจได้ช่วยคนบางครั้ง แล้วแต่ว่าช่วยใคร"
    options:
      - text: "ทำไมไม่อยากให้ลูกเป็นตำรวจ{kq}"
        heart: 2
        reply: "เพราะดาบไม่อยากให้ลูกต้องเลือกระหว่างความถูกต้องกับเปล… ดาบเลือกเปลมาสิบสองปี ลูกดาบควรได้เลือกอย่างอื่น"
        next:
          - text: "ลูกคงอยากเป็นตำรวจแบบที่ดาบเคยเป็น{k}"
            heart: 2
            reply: "…เขาเก็บรูปดาบตอนรับเหรียญกล้าหาญไว้ในกระเป๋านักเรียน ดาบเพิ่งเห็นเมื่อวาน รูปนั้นดาบหน้าไม่ง่วงเลย"
          - text: "ให้เขาเลือกเองเถอะ{k}"
            heart: 1
            reply: "เมียดาบก็พูดแบบนี้… ดาบรู้ว่าต้องให้เขาเลือก ดาบแค่อยากให้ตำรวจตอนเขาโตดีกว่าตอนนี้ ไม่งั้นดาบต้องลุกจากเปลไปทำให้มันดีขึ้นเอง"
      - text: "ลูกคนเล็กล่ะ{kq}"
        heart: 1
        reply: "คนเล็กเรียนกับครูเต้ย อยากเป็นไก่ ครูเต้ยบอกว่าเป็นไก่ไม่ได้ เขาร้องไห้ทั้งวัน ดาบบอกว่าเป็นได้ ถ้าตื่นเช้าได้ เขาเลิกอยากเป็นทันที"

  - id: sathian_f_medal
    topic: self
    when: { heart_min: 7 }
    npc: "หลาน ดาบเก็บเหรียญความกล้าหาญไว้ในลิ้นชักกับหนังยาง ใต้เปลมีแฟ้มคดีที่ถูกสั่งปิดสี่แฟ้ม ทุกคืนดาบนอนทับมัน จะได้ไม่ลืม… ดาบไม่เคยบอกใครเรื่องนี้"
    options:
      - text: "ดาบอยากเปิดแฟ้มเหล่านั้นอีกไหม{kq}"
        heart: 2
        reply: "อยากทุกคืน แต่คนเปิดคนเดียวคือคนโดนย้ายคนเดียว ถ้ามีพยานสักคน… ดาบไม่ได้ขอนะ ดาบแค่บอกว่าถ้ามี"
        next:
          - text: "ถ้าวันนั้นมาถึง {p}จะเป็นพยาน{k}"
            heart: 2
            reply: "…ดาบได้ยินแล้ว ห้ามถอนคำพูดนะ ดาบจะลงบันทึกประจำดาบว่าวันนี้มีคนพูดประโยคนี้ เป็นครั้งแรกในสิบสองปี"
          - text: "นอนทับไว้ปลอดภัยกว่า{k}"
            heart: 0
            reply: "ปลอดภัย… ใช่ ปลอดภัยสำหรับดาบ ไม่ปลอดภัยสำหรับบ่อหลังร้านป้าแต๋ว ดาบเลือกมาตลอดว่าความปลอดภัยของใครสำคัญกว่า"
      - text: "ทำไมเก็บเหรียญไว้กับหนังยาง{kq}"
        heart: 1
        reply: "หนังยางยืดได้หดได้ เหมือนความกล้าหาญ ใช้บ่อยมันหย่อน ไม่ใช้เลยมันกรอบ ดาบเก็บไว้ด้วยกันให้มันคุยกัน"

  - id: sathian_f_wife
    topic: self
    npc: "เมียดาบบ่นว่าดาบไม่ทำอะไร ดาบไม่เถียง ดาบกลัวเมีย… แต่ทุกเช้าดาบไปส่งลูกถึงโรงเรียนก่อนครูเต้ยเปิดประตู ไม่เคยสายสักวันในยี่สิบปี"
    options:
      - text: "ดาบตรงเวลาแค่เรื่องนี้เหรอ{kq}"
        heart: 2
        reply: "เรื่องเดียวที่สำคัญพอให้ดาบตื่น ที่เหลือมันรอได้ ลูกรอไม่ได้ เด็กยืนหน้าประตูโรงเรียนคนเดียว ดาบไม่ยอม"
      - text: "เมียดาบรู้ไหมว่าดาบดีแค่ไหน{kq}"
        heart: 1
        reply: "รู้ แต่ไม่พูด ดาบก็ไม่พูด เราสองคนเก่งเรื่องไม่พูด แต่งงานมายี่สิบปีเลยไม่ค่อยทะเลาะ"

  # ===== others =====
  - id: sathian_o_hong
    topic: others
    npc: "เจ๊หงษ์น่ะ ทุกงวดดาบเดินผ่านแผงเจ๊ เจ๊ยิ้ม ดาบยิ้ม แล้วเราก็ไม่รู้อะไรกันทั้งคู่ ความสัมพันธ์ที่มั่นคงที่สุดในตำบล"
    options:
      - text: "ถ้าวันนึงต้องจับเจ๊ล่ะ{kq}"
        heart: 1
        reply: "วันนั้นดาบจะซื้อกล้วยทอดเจ๊ก่อนห้าถุง แล้วค่อยจับ เจ๊จะเข้าใจ… ดาบหวังว่าวันนั้นจะไม่มา เพราะเจ๊เป็นคนเลี้ยงข้าวคนแก่หลายบ้านด้วยเงินใต้ถาดนั่นแหละ"
        next:
          - text: "เงินผิดกฎหมายไปช่วยคน แปลกดีนะ{kq}"
            heart: 2
            reply: "ตำบลนี้แปลกแบบนี้ทั้งตำบล เงินถูกกฎหมายไปทำป้าย เงินผิดกฎหมายไปซื้อข้าวคนแก่ ดาบอยู่ตรงกลาง ไม่รู้จะจับข้างไหน เลยนอน"
          - text: "ดาบไม่ควรปล่อยนะ{kq}"
            heart: 0
            reply: "ไม่ควร… ดาบรู้ แต่ถ้าดาบจับเจ๊ก่อนจับคนใหญ่ ดาบจะเป็นตำรวจแบบที่ดาบเกลียด"
      - text: "เจ๊แซวดาบบ่อยไหม{kq}"
        heart: 1
        reply: "ทุกวัน เจ๊ถามว่า ‘มาซื้อหรือมาตรวจ’ ดาบตอบว่ามาซื้อทุกวัน วันไหนดาบตอบว่ามาตรวจ เจ๊จะรู้ว่ามีเรื่อง"

  - id: sathian_o_tam
    topic: others
    npc: "ตั้มร้าน 24 ชม. เป็นพยานที่ดีที่สุดในตำบล ตื่นทั้งคืน จำทุกอย่าง แต่ไม่เคยอยากให้การ เมื่อคืนตั้มแจ้งว่ามีผีปอบยืนหน้าตู้ ATM ดาบรับทราบ ปิดคดี"
    options:
      - text: "ตั้มเห็นรถบรรทุกตีสองด้วยไหม{kq}"
        heart: 1
        reply: "เห็น ตั้มนับได้เท่าดาบ หกคัน เราสองคนไม่เคยคุยเรื่องนี้กัน แต่เราสองคนรู้ว่าอีกคนรู้ ตำบลนี้คุยกันแบบนี้"
        next:
          - text: "ทำไมไม่คุยกัน{kq}"
            heart: 2
            reply: "ถ้าคุยกัน มันจะเป็นข้อมูล ถ้ามันเป็นข้อมูล ต้องมีคนทำอะไรกับมัน… ตั้มจบปริญญา ดาบติดยศ เราสองคนรู้ดีว่าคนที่ทำอะไรกับข้อมูลจบยังไง"
          - text: "ตั้มน่าจะเป็นตำรวจได้นะ{k}"
            heart: 1
            reply: "ดาบเคยบอกตั้ม ตั้มตอบว่า ‘ผมอยากทำงานที่ผีมาซื้อของ ไม่ใช่งานที่คนมาซื้อตำรวจ’ ดาบเถียงไม่ได้ ดาบเลยซื้อขนมจีบเขาสองกล่อง"
      - text: "ตั้มพูดตลกหน้าตายนะ{k}"
        heart: 1
        reply: "หน้าตายเหมือนดาบ แต่ตั้มอายุน้อยกว่าดาบยี่สิบปี หน้าตายเร็วไป ดาบห่วง"

  - id: sathian_o_ann
    topic: others
    npc: "หมอแอนมาตามดาบไปวัดความดันทุกเดือน ดาบหนีทางหลังโรงพักได้ทุกครั้ง… เกือบทุกครั้ง เดือนนี้หมอดักรอที่เปล หมอรู้ทางหนีดาบหมดแล้ว"
    options:
      - text: "ความดันดาบเท่าไหร่{kq}"
        heart: 1
        reply: "ร้อยห้าสิบ หมอบอกว่าให้เลิกชาเย็น ดาบบอกว่าชาเย็นคือหลักฐานชิ้นสำคัญ หมอไม่ขำ หมอแอนเป็นคนเดียวที่ไม่ขำมุกดาบ ดาบเลยกลัว"
      - text: "หมอแอนใจดีที่ตามดาบ{k}"
        heart: 2
        reply: "ใจดี… ขยันด้วย ขยันกับทุกคนเท่ากัน ไม่เลือกว่าใครใหญ่ใครเล็ก ดาบอิจฉา งานหมอไม่มีคนสั่งปิดแฟ้ม"

  - id: sathian_o_thana
    topic: others
    npc: "คุณธนาจ้าง รปภ. มาเฝ้ารั้วบริษัทหกคน เงินเดือนดีกว่าดาบ ขยันกว่าดาบ ตั้งด่านตรวจหน้ารั้วด้วย ตรวจชาวบ้านที่เดินผ่าน… ดาบยังไม่เคยตั้งด่านตรวจใคร"
    options:
      - text: "รปภ. ตรวจชาวบ้านได้เหรอ{kq}"
        heart: 1
        reply: "ไม่ได้ ไม่มีอำนาจ แต่ไม่มีใครรู้ว่าไม่ได้ เพราะเขาใส่ชุดเหมือนตำรวจกว่าดาบ ดาบใส่เสื้อยืดใต้เครื่องแบบที่ไม่ติดกระดุมเม็ดบน"
        next:
          - text: "ดาบไปบอกเขาสิ{kq}"
            heart: 2
            reply: "…ดาบจะไป พรุ่งนี้ ไม่ใช่พรุ่งนี้แบบดาบ พรุ่งนี้จริงๆ ดาบจะติดกระดุมเม็ดบนด้วย หลานเป็นพยานนะ"
          - text: "ช่างเขาเถอะ{k}"
            heart: -1
            reply: "ช่างเขา… คำนี้ดาบพูดมาสิบสองปี ได้ยินจากปากหลานแล้วมันฟังแย่กว่าตอนดาบพูดเองอีก"
      - text: "คุณธนาส่งกาแฟมาให้ดาบด้วยใช่ไหม{kq}"
        heart: 0
        reply: "ส่ง ดาบกิน แต่ไม่ได้แถมใจไปด้วยนะ ยังไม่ได้แถม… ดาบนับลังทุกเดือน วันไหนดาบลืมนับ วันนั้นดาบแถมใจไปแล้ว"

  - id: sathian_o_somsak
    topic: others
    npc: "ผู้ใหญ่สมศักดิ์ส่งหนังสือเรื่องไก่ขันเสียงดังมาให้ดาบสามรอบ ฉบับเดิม ดาบอ่านรอบเดียว ตอบรอบเดียวว่า ‘ไก่ไม่ใช่ผู้ต้องหา’ ผู้ใหญ่ไม่พอใจแต่ยอมรับตามระเบียบ"
    options:
      - text: "ไก่กำนันใช่ไหม{kq}"
        heart: 1
        reply: "ใช่ ผู้ใหญ่ไม่กล้าฟ้องกำนัน เลยฟ้องไก่ ดาบเข้าใจ ระบบในตำบลนี้ทุกคนฟ้องไก่ ไม่มีใครฟ้องเจ้าของไก่"
      - text: "ผู้ใหญ่จะเกษียณแล้วนะ{kq}"
        heart: 2
        reply: "รู้… ดาบจะคิดถึงหนังสือสามฉบับ ปีน้ำท่วม 54 ผู้ใหญ่ประกาศสิบเอ็ดรอบ ดาบแบกยายบัวเดินน้ำ ได้ยินเสียงผู้ใหญ่ตลอดทาง เป็นเสียงที่ทำให้ดาบไม่หยุดเดิน"

quests:
  - id: sathian_q1
    npc: sathian
    title: "ป้ายหาย"
    desc: "ป้ายโครงการฝายของนายกฯ หายไป นายกฯ กดดันให้ดาบสืบ ดาบส่งผู้เล่นไปดูที่คลองแทน"
    start: { heart_min: 1, day_min: 5 }
    offer:
      npc: "หลาน… มีคดี นายกฯ โทรมาสามรอบ ป้ายโครงการฝายที่คลองหายไป นายกฯ บอกว่าเป็นคดีสำคัญ ดาบบอกว่ารับทราบ… ดาบยืมคำเขา หลานช่วยไปดูที่คลองแทนดาบหน่อย ดาบเดินไม่ไหว เปลไม่ยอมปล่อย"
      options:
        - text: "ได้{k} {p}ไปสืบให้"
          accept: true
          heart: 1
          reply: "ดี ตอนเย็นนะ แดดเบา ขโมยป้ายต้องใช้แรงสองคน ดูรอยเท้าคู่ ถ้าเจอรอยกีบวัวด้วย คือเจ้าโชค ปิดคดีได้เลย"
        - text: "คดีป้ายหายสำคัญจริงเหรอ{kq}"
          accept: true
          heart: 1
          reply: "สำคัญสำหรับนายกฯ ป้ายนั้นมีรูปเขายิ้มหกซี่ ฝายไม่มี ป้ายมี ตอนนี้ป้ายก็ไม่มี เหลือแต่ความว่างเปล่าที่ถูกต้องตามความเป็นจริง"
        - text: "ดาบไปเองสิ{k}"
          heart: -1
          reply: "…ดาบไปเองได้ พรุ่งนี้ หรือมะรืน ป้ายมันไม่หนีไปไหนแล้ว มันหนีไปแล้ว"
    steps:
      - goal: { type: visit, place: canal, from: "16:00", to: "18:30" }
        hint: "ไปดูที่คลองส่งน้ำตอนเย็น หาร่องรอยป้ายโครงการฝาย"
        done:
          npc: "เจอแล้วใช่ไหม… ดาบเดาไว้แล้ว ป้ายพาดอยู่บนคลองเป็นสะพานให้เด็กเดินข้ามไปโรงเรียน หน้านายกฯ หงายขึ้น เด็กเหยียบหน้าผากทุกเช้า… หลานว่าดาบควรทำยังไง"
          options:
            - text: "ปล่อยไว้เถอะ{k} ป้ายแรกที่ใช้งานได้จริง"
              heart: 2
              set_flag: sathian_q1_bridge
              reply: "ดาบจะเขียนรายงานว่า ‘ป้ายถูกนำไปใช้ประโยชน์สาธารณะโดยชุมชน’ … นายกฯ อาจโกรธ อาจจะชอบด้วย ประโยคนี้มีคำว่าสาธารณะ เขาชอบคำนี้"
            - text: "เอาคืนนายกฯ เถอะ{k} เดี๋ยวดาบโดนว่า"
              heart: 0
              set_flag: sathian_q1_return
              reply: "เอาคืนก็ได้… เด็กจะเดินอ้อมไปสะพานเก่าที่ผุ ดาบจะไปยืนเฝ้าสะพานเก่าตอนเช้าแทน ไม่ได้ขยันนะ เผื่อมีเด็กตก ดาบไม่อยากเขียนรายงานแบบนั้น"
            - text: "ทำสะพานจริงให้เด็กดีกว่า{k}"
              heart: 2
              set_flag: sathian_q1_bridge
              reply: "สะพานจริงต้องรองบ… ดาบจะเขียนในรายงานแนบท้ายว่า ‘ขอเสนอให้งบป้ายครั้งหน้าซื้อไม้กระดานแทน’ ดาบเขียนข้อเสนอครั้งแรกในสิบปี มือดาบไม่ชิน"
    reward: { money: 120, heart: 1, set_flag: sathian_q1_done }

  - id: sathian_q2
    npc: sathian
    title: "เวรดึก"
    desc: "ดาบจะซุ่มนับรถบรรทุกบริษัทจากโรงพักตอนค่ำ ต้องมีเสบียงลูกชิ้นทอดกับคนช่วยนั่งเป็นพยาน"
    start: { flag: sathian_q1_done, heart_min: 3, day_min: 11 }
    offer:
      npc: "หลาน ดาบจะทำอะไรที่ไม่เคยทำมาสิบสองปี ซุ่มตอนกลางคืน ไม่ใช่นอนนับรถ นั่งนับ ตาเปิด… ต้องมีลูกชิ้นทอดสามไม้ ดาบไม่ได้ติดสินบนตัวเองนะ ลูกชิ้นคือเครื่องมือทำงาน"
      options:
        - text: "ได้{k} ลูกชิ้นทอดสามไม้จากตลาด"
          accept: true
          heart: 1
          reply: "ดี เจ้าข้างแผงเจ๊หงษ์ ซอสเยอะ ซอสคือกำลังใจ… แล้วคืนนั้นมานั่งด้วยนะ หนึ่งทุ่มครึ่ง ก่อนสามทุ่มกลับ ดาบไม่ให้หลานโดนผีจับในคดีของดาบ"
        - text: "ดาบจะนับรถทำไม{kq}"
          accept: true
          heart: 1
          reply: "รถบริษัทวิ่งเกินเวลาที่ใบอนุญาตกำหนด ใบอนุญาตบอกหกโมงเช้าถึงหกโมงเย็น ถ้าดาบนับรถหลังหกโมงได้ ดาบมีเรื่องถูกกฎหมายให้จับ… เรื่องเล็ก แต่เป็นประตู"
        - text: "ดาบนอนนับเหมือนเดิมก็ได้{k}"
          heart: 0
          reply: "นอนนับไม่นับเป็นหลักฐาน… ศาลไม่รับคำให้การของคนที่หลับตา ดาบเพิ่งรู้ตัวว่าสิบสองปีดาบให้การแบบหลับตามาตลอด"
    steps:
      - goal: { type: give, npc: sathian, item: meatball_fried, n: 3 }
        hint: "ซื้อลูกชิ้นทอด 3 ไม้ที่ตลาด แล้วเอาไปให้ดาบที่โรงพัก"
        done:
          npc: "ลูกชิ้นมาแล้ว ซอสเยอะ ดีมาก หลานเข้าใจงานตำรวจ… คืนนี้หนึ่งทุ่มครึ่ง มาที่โรงพัก ดาบจะเปิดไฟดวงเดียว ดวงที่ยังติด"
          options:
            - text: "{p}จะมาตรงเวลา{k}"
              heart: 1
              reply: "ตรงเวลา… คำนี้ดาบใช้กับลูกอย่างเดียว คืนนี้ใช้กับหลานด้วย"
            - text: "ดาบจะไม่หลับใช่ไหม{kq}"
              heart: 1
              reply: "ดาบสัญญา… ถ้าหลับ ให้หลานเอาลูกชิ้นไม้สุดท้ายจิ้มแก้มดาบ"
      - goal: { type: visit, place: police, from: "19:30", to: "21:00" }
        hint: "ไปโรงพักตอนหนึ่งทุ่มครึ่ง นั่งซุ่มนับรถบรรทุกกับดาบ (กลับก่อนสามทุ่ม!)"
        done:
          npc: "สามคัน หลังหกโมง ไม่มีทะเบียนหน้าสองคัน… ดาบจดแล้ว ตาเปิด มีพยาน หลาน ดูนี่ ดาบจะให้ดูอะไร ใต้เปลมีแฟ้มคดีบ่อเถื่อนเก่าที่อำเภอ รถคันที่สามเมื่อกี้ ทะเบียนหลังตรงกับรถในแฟ้มนี้"
          options:
            - text: "แปลว่าเป็นคนเดิม{kq}"
              heart: 2
              set_flag: sathian_q2_match
              reply: "คนเดิม ชื่อบริษัทใหม่ ดาบรอมาสิบสองปีให้มันวนกลับมา… มันกลับมาจริง ดาบไม่รู้จะดีใจหรือกลัว ดาบเลยกินลูกชิ้นไม้สุดท้าย"
            - text: "ดาบเก็บแฟ้มนี้มาสิบสองปีเลยเหรอ{kq}"
              heart: 1
              reply: "นอนทับมันทุกคืน ทับจนมันแบนเท่าเปล… กลับบ้านเถอะหลาน ใกล้สามทุ่มแล้ว ดาบจะนั่งต่ออีกหน่อย ตาเปิด ครั้งแรกในรอบหลายปี"
    sold_at: { meatball_fried: market }
    reward: { money: 150, heart: 2, set_flag: sathian_q2_done }

  - id: sathian_q3
    npc: sathian
    title: "บันทึกประจำวันหน้าที่ว่าง"
    desc: "หลังเมย์เริ่มหาหลักฐานท่อ ดาบลังเลว่าจะลงบันทึกประจำวันเรื่องรถบรรทุกกลางคืนจริงๆ หรือไม่"
    start: { flag: sathian_q2_done, heart_min: 4, day_min: 16 }
    offer:
      npc: "หลาน ดาบมีหน้าว่างในบันทึกประจำวัน คืนที่เราซุ่มกัน ดาบยังไม่ได้เขียน… ดาบจะรอดูว่าเมย์เจออะไร ถ้าเมย์เจอ ดาบจะไม่ใช่คนเดียว รอกับดาบหน่อยนะ"
      options:
        - text: "{p}รอด้วย{k}"
          accept: true
          heart: 1
          reply: "รอเป็นงานที่ดาบถนัดที่สุด ครั้งนี้รอแบบมีความหมาย ต่างกันนิดเดียว แต่ดาบรู้สึก"
        - text: "เขียนเลยสิ{k} ไม่ต้องรอเมย์"
          accept: true
          heart: 1
          reply: "เขียนคนเดียวโดนย้ายคนเดียว… ดาบขี้ขลาด หลานพูดได้ ดาบไม่โกรธ แต่ขอรออีกนิด"
        - text: "ไม่อยากยุ่งแล้ว{k}"
          heart: 0
          reply: "เข้าใจ ดาบก็ไม่อยากยุ่งมาสิบสองปี เพิ่งเริ่มอยาก… ช่างมัน ดาบรอคนเดียวได้"
    steps:
      - goal: { type: flag, flag: story_may_evidence }
        hint: "รอจนเมย์เริ่มหาหลักฐานท่อบริษัท แล้วกลับไปหาดาบ"
        done:
          npc: "เมย์มาหาดาบเมื่อเช้า ถือรูปท่อมาด้วย ถามว่าคืนนั้นมีลงบันทึกไหม ดาบบอกว่ามีหน้าว่าง… หลาน ดาบควรเขียนอะไรลงหน้านั้น"
          options:
            - text: "เขียนตามจริง วันที่ เวลา ทะเบียน{k}"
              heart: 2
              set_flag: sathian_q3_log
              reply: "‘เวลา 19.52 น. รถบรรทุกไม่มีทะเบียนหน้าผ่านหน้าสถานี พยานหนึ่งคน’ … ดาบเขียนแล้ว ลายมือสั่นนิดหน่อย ลายมือคนไม่ได้เขียนความจริงนาน"
            - text: "เขียนแค่ ‘มีเสียง’ เหมือนเดิม{k}"
              heart: -1
              set_flag: sathian_q3_blank
              reply: "มีเสียง… ได้ ปลอดภัย ดาบเขียนแล้ว… หน้านี้จะเหมือนหน้าอื่นๆ สิบสองปี ดาบหวังว่าหลานจะพูดอีกแบบ แต่ไม่เป็นไร"
            - text: "ให้เมย์ถ่ายรูปหน้านั้นไปด้วย{k}"
              heart: 1
              set_flag: sathian_q3_log
              reply: "เขียนแล้วให้ถ่าย… บันทึกประจำวันโรงพักจะไปอยู่ในข่าว แหล่งข่าวผู้ง่วงนอน ดาบขอใช้ชื่อนั้นนะ"
    reward: { money: 150, heart: 2, set_flag: sathian_q3_done }

  - id: sathian_q4
    npc: sathian
    title: "ลุกจากเปล"
    desc: "ดาบต้องตัดสินใจว่าจะทำอะไรกับแฟ้มคดีใต้เปลที่โยงถึงบริษัทรับเหมาเจาะบ่อ"
    start: { flag: sathian_q3_done, heart_min: 6, day_min: 20 }
    offer:
      npc: "หลาน… ดาบเอาแฟ้มทั้งสี่ออกมาจากใต้เปลแล้ว วางบนโต๊ะ ฝุ่นหนาเท่าเปล พรุ่งนี้เช้ามาที่โรงพักนะ ดาบจะตัดสินใจ… ดาบไม่อยากตัดสินใจคนเดียว ดาบตัดสินใจคนเดียวครั้งสุดท้ายตอนโดนย้าย"
      options:
        - text: "{p}จะไปตั้งแต่เช้า{k}"
          accept: true
          heart: 2
          reply: "แปดโมง ดาบจะตื่นก่อนหลาน… อันนี้เป็นคำสัญญาที่ยากที่สุดที่ดาบเคยพูด"
        - text: "ดาบพร้อมแล้วเหรอ{kq}"
          accept: true
          heart: 1
