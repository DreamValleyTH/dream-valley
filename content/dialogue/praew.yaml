          - text: "แพรวเลยไม่เชื่อใครง่ายๆ ใช่ไหม{kq}"
            heart: 2
            reply: "ใช่ค่ะ ใครดีกับแพรว แพรวจะถามในใจก่อนว่า ‘อยากได้อะไรจากพ่อ’ … กับ{player}แพรวเลิกถามไปตั้งแต่เดือนแรก เพราะ{player}ไม่เคยขออะไรเลย นอกจากเกลือ"
          - text: "พ่อแพรวไม่ช่วยเขา พ่อแพรวดีนะ{k}"
            heart: 1
            reply: "ใช่ค่ะ… พ่อไม่ช่วยเพราะเห็นว่าไม่ถูก ไม่ได้รู้ว่าเขาคบแพรวเพราะอะไร แพรวไม่เคยเล่าให้พ่อฟัง กลัวพ่อขับรถเข้ากรุงเทพฯ ไปพร้อมไก่"
      - text: "ลืมเขาไปเถอะ{k}"
        heart: 0
        reply: "ลืมแล้วค่ะ… ลืมหน้า แต่ยังจำความรู้สึกตอนรู้ความจริงได้ ความรู้สึกนั้นลืมยากกว่าหน้า"

  - id: praew_f_father_doubt
    topic: self
    when: { heart_min: 7 }
    npc: "{player}… ถ้าวันหนึ่งพ่อแพรวทำเรื่องผิด แพรวจะยืนข้างความจริงหรือข้างพ่อ แพรวถามตัวเองทุกคืน ยังตอบไม่ได้ แพรวอยากให้{player}รู้ว่าแพรวยังไม่มีคำตอบ"
    options:
      - text: "ยืนข้างความจริงก็คือช่วยพ่อนะ{k}"
        heart: 2
        reply: "…ถ้าพ่อทำผิด แล้วแพรวช่วยให้พ่อหยุดก่อนผิดไปมากกว่านี้ นั่นก็คือข้างพ่อด้วย แพรวไม่เคยคิดว่ามันเป็นข้างเดียวกันได้"
        next:
          - text: "{p}จะอยู่ไม่ว่าแพรวเลือกข้างไหน{k}"
            heart: 2
            reply: "ประโยคนี้แพรวจะจำไปจนแก่ค่ะ… แล้วถ้าแพรวลืม {player}ต้องพูดอีกรอบ ไม่ใช่สามรอบนะ รอบเดียวพอ"
          - text: "แพรวไม่ต้องเลือกตอนนี้{k}"
            heart: 1
            reply: "ขอบคุณค่ะ… ทุกคนอยากให้แพรวเลือกเร็วๆ บริษัท พ่อ เมย์ ทั้งตำบล มี{player}คนเดียวที่ให้แพรวรอได้"
      - text: "พ่อแพรวไม่ทำผิดหรอก{k}"
        heart: 0
        reply: "ทุกคนพูดแบบนี้ค่ะ… แล้วก็ไม่มีใครอยู่ตอนมันเกิดขึ้น แพรวไม่ได้ว่า{player}นะ แค่เหนื่อยกับประโยคนี้"

  - id: praew_f_mother
    topic: self
    npc: "แม่แพรวเสียตอนแพรวสิบสอง พ่อเลยเลี้ยงแพรวแบบเลี้ยงหมู่บ้าน คือสั่งการ แต่รักนะ แพรวรู้ ทุกปีวันเกิดแม่ พ่อแอบซื้อหวยเลขวันเกิดแม่ ไม่เคยถูก ไม่เคยหยุด"
    options:
      - text: "แพรวรู้เรื่องหวยด้วยเหรอ{kq}"
        heart: 2
        reply: "รู้ค่ะ พ่อซ่อนสลากในกล่องเหล็กใต้หิ้ง กล่องเดียวกับจดหมายที่แม่เขียนตอนจีบพ่อ พ่อคิดว่าแพรวไม่รู้ แพรวรู้ตั้งแต่สิบห้า… แพรวไม่เคยเปิดจดหมาย รอให้พ่อเปิดให้"
      - text: "พ่อแพรวคงรักแม่มาก{k}"
        heart: 1
        reply: "รักค่ะ… พ่อไม่เคยมีใครใหม่ ไก่ทุกตัวแม่ตั้งชื่อครึ่งนึง ตัวที่แม่ตั้ง พ่อไม่เคยขาย ตายก็ฝังใต้ต้นมะขาม"

  # ===== others =====
  - id: praew_o_father
    topic: others
    npc: "พ่อแพรวเป็นกำนันที่รักลูกบ้านนะคะ แค่บางทีรักนักลงทุนด้วย ซึ่งแพรวไม่แน่ใจว่ารักเท่ากันไหม"
    options:
      - text: "แพรวลองถามพ่อตรงๆ ไหม{kq}"
        heart: 2
        reply: "ถามแล้วค่ะ พ่อตอบว่า ‘พ่อรักลูกที่สุด’ … ไม่ได้ตอบคำถาม แต่ตอบเรื่องที่สำคัญกว่า แพรวเลยถามต่อไม่ลง"
        next:
          - text: "พ่อแพรวตอบวนเหมือนนายกฯ เลย{k}"
            heart: 1
            reply: "อย่าบอกพ่อนะคะ พ่อจะเสียใจมากที่สุดในชีวิต พ่อเกลียดการเหมือนนายกฯ มากกว่าเกลียดการแพ้ประกวดไก่"
          - text: "แบบนี้ก็ตอบแล้วนะ{k}"
            heart: 2
            reply: "…ใช่ค่ะ พ่อรักแพรวมากกว่าเงิน แพรวต้องเชื่อแบบนั้น แล้วช่วยให้พ่อจำได้ด้วย"
      - text: "กำนันคงห่วงแพรว{k}"
        heart: 1
        reply: "ห่วงจนน่ารำคาญค่ะ แพรวไลฟ์ในทุ่ง พ่อส่งลูกน้องมาถือร่มให้ ลูกน้องพ่อติดในกล้องทุกไลฟ์ คนดูถามว่าเป็นแฟนแพรวเหรอ ลุงคนนั้นอายุหกสิบสอง"

  - id: praew_o_nok
    topic: others
    npc: "นกกลับมาวันหยุดนี้ค่ะ! แพรวจะจ้างนกเป็นนางแบบผ้าทอ ค่าตัวส้มตำปูปลาร้าสองจาน นกเป็นนางแบบที่ถูกและดีที่สุด แต่ยิ้มเฉพาะตอนได้ส้มตำ"
    options:
      - text: "นกกับบอลยังไงกัน{kq}"
        heart: 1
        reply: "โอ๊ย เรื่องนี้แพรวรู้ แต่แพรวไม่บอกค่ะ แพรวเป็นเพื่อนนก… แพรวบอกได้แค่ว่าทุกครั้งที่นกกลับมา บอลซ่อมรถเสร็จเร็วผิดปกติ"
        next:
          - text: "บอลจะไประยองแล้วนะ{kq}"
            heart: 1
            reply: "นั่นแหละค่ะ ถ้าบอลไป นกจะกลับมาเจอแต่อู่ปิด… แพรวกำลังคิดว่าจะทำอะไรได้บ้าง เช่นจ้างบอลเป็นคนส่งของร้านแพรว แพรวมีเงินจ้างแค่วันละสามร้อย"
          - text: "แพรวชอบเป็นแม่สื่อเหรอ{kq}"
            heart: 0
            reply: "ไม่ได้เป็นแม่สื่อค่ะ แพรวเป็นนักการตลาด แพรวดูออกว่าสินค้าไหนควรวางคู่กัน"
      - text: "แพรวคิดถึงนกนะ{kq}"
        heart: 2
        reply: "คิดถึงค่ะ… นกเป็นคนเดียวที่ด่าแพรวต่อหน้าแล้วแพรวรู้สึกว่าโดนรัก แปลกไหมคะ"

  - id: praew_o_chan
    topic: others
    npc: "ยายจันทร์ทอผ้าเก่งที่สุดในอำเภอ ผ้าผืนหนึ่งทอสามเดือน แพรวตั้งราคาให้ยายสามพัน ยายตกใจ บอกว่า ‘แพงขนาดนั้นใครจะซื้อ’ ขายหมดในสองวันค่ะ"
    options:
      - text: "ยายจันทร์คงดีใจ{k}"
        heart: 1
        reply: "ยายเอาเงินไปซื้อเส้นไหมเพิ่ม แล้วชวนเด็กในหมู่บ้านมาหัดทอสองคน แพรวว่านี่แหละกำไรจริงของร้าน ไม่มีในบัญชี"
        next:
          - text: "แพรวช่วยยายมากเลยนะ{k}"
            heart: 2
            reply: "ยายช่วยแพรวมากกว่าค่ะ ยายเรียกแพรวว่า ‘หนูแพรว’ ตั้งแต่วันแรก ไม่เคยเรียกลูกกำนันเลย ยายบอกว่ายายไม่รู้จักกำนัน… ยายรู้จัก แต่ยายเลือกไม่รู้"
          - text: "เด็กที่มาหัดทอเป็นใคร{kq}"
            heart: 1
            reply: "น้องมิวกับน้องโอ๊ตค่ะ มิวทอเก่ง โอ๊ตทอได้สามเส้นแล้วไปจับกบ ยายบอกว่าโอ๊ตจะเป็นช่างทอที่ดีถ้ากบหมดตำบล"
      - text: "แพงไปไหมสามพัน{kq}"
        heart: 0
        reply: "ไม่แพงค่ะ สามเดือน วันละแปดชั่วโมง คิดค่าแรงแล้วยายได้วันละสามสิบบาท… แพรวควรตั้งหมื่น แต่ยายจะเป็นลม"

  - id: praew_o_may
    topic: others
    npc: "เมย์นักข่าวมาสัมภาษณ์แพรวเรื่องร้านค้าออนไลน์ ถามคำถามดีมากสิบข้อ ข้อสุดท้ายถามเรื่องที่ดินพ่อ แพรวรู้ทันค่ะ แต่แพรวชอบเมย์"
    options:
      - text: "ทำไมชอบ{kq}"
        heart: 1
        reply: "เพราะเมย์ไม่เกรงใจแพรวค่ะ ถามตรงๆ ตอบไม่ได้ก็จด ‘ไม่ตอบ’ ไม่แต่งเติม… คนที่ไม่เกรงใจแพรวในตำบลนี้นับนิ้วได้ ห้านิ้ว รวมหมาลุงสมหมาย"
      - text: "แพรวตอบเรื่องที่ดินไหม{kq}"
        heart: 1
        reply: "แพรวตอบว่า ‘ลูกกำนันขอไม่ตอบค่ะ’ เมย์ยิ้มแล้วถามว่า ‘แล้วแพรวล่ะคะ’ … แพรวเกือบตอบ แพรวอยากตอบมาก"
        next:
          - text: "ถ้าตอบ แพรวจะตอบว่าอะไร{kq}"
            heart: 2
            reply: "แพรวจะตอบว่า ‘แพรวไม่อยากให้พ่อขาย แต่แพรวไม่อยากให้พ่อเป็นคนผิดในข่าวด้วย’ … สองอย่างนี้มันขัดกันไหมคะ"
          - text: "ดีแล้วที่ไม่ตอบ{k}"
            heart: 0
            reply: "ดีสำหรับพ่อค่ะ ไม่แน่ใจว่าดีสำหรับแพรว"

  - id: praew_o_kla
    topic: others
    npc: "กล้าเกลียดบริษัทมาก เวลาเจอแพรวก็มองแบบสงสัยว่าแพรวอยู่ข้างไหน… ซึ่งแพรวก็อยากรู้เหมือนกัน วันก่อนกล้าซื้อข้าวกล้องแพรวสองถุง จ่ายเงินแล้วไม่พูดสักคำ"
    options:
      - text: "อาจเป็นวิธีขอโทษของกล้า{k}"
        heart: 2
        reply: "…แพรวไม่เคยคิดแบบนั้น คนในตำบลนี้ขอโทษด้วยการซื้อของจริงๆ ด้วย พ่อแพรวขอโทษแม่ด้วยการซื้อไก่ แพรวว่าแพรวเข้าใจกล้ามากขึ้นนิดนึง"
      - text: "กล้าก็มีเหตุผลที่สงสัยนะ{kq}"
        heart: 1
        reply: "มีค่ะ… พ่อแพรวกินข้าวกับคุณธนาบ่อยกว่ากินข้าวกับแพรว ใครเห็นก็ต้องสงสัย แพรวไม่โกรธกล้า แพรวโกรธที่ตัวเองไม่มีคำตอบให้กล้า"

quests:
  - id: praew_q1
    npc: praew
    title: "ไลฟ์หนึ่งทุ่ม"
    desc: "แพรวอยากขายผักบุ้งจากแปลงคนรุ่นใหม่ในไลฟ์ ขอผักบุ้งแล้วมาช่วยถือไม้เซลฟี่ที่ร้านกาแฟ"
    start: { heart_min: 1, day_min: 3 }
    offer:
      npc: "{player} มาช่วยแพรวหน่อยได้ไหมคะ ไลฟ์คืนนี้แพรวอยากขาย ‘ผักบุ้งจากคนรุ่นใหม่ที่กลับบ้าน’ … ต้องมีผักบุ้งจริงสามกำ กับคนกลับบ้านจริงหนึ่งคน ช่วยถือไม้เซลฟี่ด้วย ค่าแรงเป็นข้าวผัด"
      options:
        - text: "ได้{k} แต่{p}ไม่เคยออกไลฟ์นะ"
          accept: true
          heart: 1
          reply: "ไม่ต้องออกค่ะ ถือกล้องอย่างเดียว… ออกนิดนึงก็ได้ ตอนชูผักบุ้ง มือ{player}จะติดกล้อง มือเปื้อนดินขายดีกว่าหน้าแพรวอีก"
        - text: "ข้าวผัดใส่ไข่ดาวด้วยนะ{kq}"
          accept: true
          heart: 2
          reply: "ต่อรองเก่งนะคะ! ได้ ไข่ดาวไม่สุก แพรวทอดเอง… แพรวทอดไข่ไม่เป็น แพรวสั่งร้านพี่หน่อย แต่แพรวถือมาให้เอง"
        - text: "ให้ลูกน้องกำนันถือไม่ได้เหรอ{kq}"
          heart: -1
          reply: "ลุงคนนั้นติดกล้องทุกไลฟ์แล้วค่ะ คนดูถามว่าเป็นแฟนแพรวเหรอ… ไม่เป็นไรค่ะ แพรวหาคนอื่นก็ได้"
    steps:
      - goal: { type: give, npc: praew, item: morning_glory, n: 3 }
        hint: "เอาผักบุ้ง 3 กำจากแปลงไปให้แพรว"
        done:
          npc: "สดมากค่ะ! ใบเขียว ก้านกรอบ มีดินติดราก… อย่าล้างนะคะ ดินคือหลักฐาน เย็นนี้หนึ่งทุ่มที่ร้านกาแฟ อย่ามาสาย ไลฟ์ไม่รอใคร"
          options:
            - text: "{p}จะไปตรงเวลา{k}"
              heart: 1
              reply: "ดีค่ะ แพรวจะเตรียมสคริปต์ให้ ไม่ต้องอ่าน แค่พยักหน้าตอนแพรวพูดว่า ‘จริงไหมคะ’"
            - text: "ดินติดรากขายได้เหรอ{kq}"
              heart: 1
              reply: "ขายได้ค่ะ คนเมืองซื้อผักล้างสะอาดจนลืมว่าผักขึ้นจากดิน แพรวขายความจำค่ะ ไม่ได้ขายแค่ผัก"
      - goal: { type: visit, place: coffee, from: "19:00", to: "20:30" }
        hint: "ไปร้านกาแฟตอนหนึ่งทุ่ม ช่วยแพรวถือไม้เซลฟี่ไลฟ์ขายผักบุ้ง"
        done:
          npc: "ไลฟ์จบแล้วค่ะ! ขายผักบุ้งหมดสามกำในหกนาที… แต่{player}เห็นคอมเมนต์ไหม ‘ลูกกำนันขายผักเองเลยเหรอ’ สิบห้าคอมเมนต์ แพรวยิ้มตอบทุกคอมเมนต์ ยิ้มจนเจ็บแก้ม"
          options:
            - text: "{p}พิมพ์ตอบไปแล้ว ‘คนขายชื่อแพรว’{k}"
              heart: 2
              set_flag: praew_q1_name
              reply: "…{player}พิมพ์ตอนไหนคะ แพรวไม่เห็น… ‘คนขายชื่อแพรว’ มีคนกดหัวใจยี่สิบคน มากกว่าผักบุ้งอีก แพรวขอแคปหน้าจอเก็บไว้นะคะ"
            - text: "อย่างน้อยก็ขายหมด{k}"
              heart: 1
              reply: "ใช่ค่ะ ขายหมด… แพรวควรดีใจที่ขายหมด แพรวดีใจ แค่ดีใจไม่สุดเท่าที่ควร ไว้ไลฟ์หน้าแพรวจะดีใจให้สุด"
            - text: "กล้องสั่นไปหน่อย ขอโทษ{k}"
              heart: 2
              reply: "สั่นมากค่ะ! คนดูถามว่าแผ่นดินไหวเหรอ แพรวหัวเราะจนพูดไม่ออก… แพรวไม่ได้หัวเราะในไลฟ์มาสามเดือนแล้วนะคะ"
    reward: { money: 120, heart: 1, items: { kaprao: 1 }, set_flag: praew_q1_done }

  - id: praew_q2
    npc: praew
    title: "ชื่อบนป้าย"
    desc: "แพรวอยากใส่ชื่อยายจันทร์บนป้ายสินค้าผ้าทอแทนคำว่า ‘ร้านลูกกำนัน’ ไปขออนุญาตยายด้วยกัน"
    start: { flag: praew_q1_done, heart_min: 3, day_min: 7 }
    offer:
      npc: "{player} แพรวจะทำป้ายสินค้าใหม่ แทนที่จะเขียน ‘ร้านแพรวพรรณ’ แพรวอยากเขียนว่า ‘ทอโดยยายจันทร์ บ้านดงเย็น’ ตัวใหญ่ แต่แพรวไม่กล้าไปขอยายคนเดียว ยายชอบถามว่า ‘พ่อหนูรู้หรือยัง’"
      options:
        - text: "ไปด้วย{k} ยายจันทร์ต้องดีใจแน่"
          accept: true
          heart: 1
          reply: "หวังว่านะคะ… ยายอาจจะบอกว่าชื่อยายไม่สำคัญ คนรุ่นยายชอบพูดแบบนี้ แต่ชื่อยายสำคัญที่สุดในผ้าทุกผืน"
        - text: "แล้วชื่อแพรวจะอยู่ตรงไหน{kq}"
          accept: true
          heart: 2
          reply: "ตัวเล็กๆ ด้านหลังค่ะ ‘จัดจำหน่ายโดยแพรว’ ไม่มีคำว่ากำนัน… แพรวคิดไว้นานแล้ว แค่ไม่มีใครถาม"
        - text: "ชื่อร้านลูกกำนันขายดีกว่ามั้ง{k}"
          heart: -2
          reply: "…ขายดีกว่าค่ะ แพรวรู้ แพรวเกลียดที่มันจริง แพรวไปเองก็ได้ย่ะ"
    steps:
      - goal: { type: visit, place: house_chan, from: "09:00", to: "12:00" }
        hint: "ไปบ้านยายจันทร์ตอนเช้ากับแพรว ขออนุญาตใส่ชื่อยายบนป้ายสินค้า"
        done:
          npc: "ยายบอกว่า ‘ใส่ชื่อยายทำไมลูก ยายแก่แล้ว’ แล้วยายก็เดินเข้าไปหยิบผ้าซิ่นผืนเก่าสุดที่ยายทอตอนสาวออกมาให้ถ่ายรูปประกอบ… {player}เห็นไหมคะ ยายยิ้มจนตาหยี"
          options:
            - text: "ยายดีใจจะแย่{k} แค่ไม่พูด"
              heart: 2
              set_flag: praew_q2_chan
              reply: "คนรุ่นยายกับคนรุ่นพ่อแพรวเหมือนกันเลยค่ะ ดีใจแต่ไม่พูด แพรวต้องอ่านจากมือ มือยายสั่นตอนส่งผ้าให้ แพรวจะใส่ชื่อยายตัวใหญ่ที่สุด"
            - text: "ใส่ชื่อแพรวด้านหลังด้วยนะ{kq}"
              heart: 2
              set_flag: praew_q2_chan
              reply: "ยายก็พูดแบบนี้ค่ะ! ยายบอกว่า ‘ใส่ชื่อหนูแพรวด้วย ไม่ใส่ชื่อพ่อหนู’ … ยายพูดเหมือนอ่านใจแพรว ยายอายุแปดสิบ ยังเข้าใจแพรวกว่าคนรุ่นเดียวกันอีก"
            - text: "ยายถามเรื่องพ่อแพรวไหม{kq}"
              heart: 1
              reply: "ไม่ถามเลยค่ะ… ยายถามว่า ‘หนูกินข้าวหรือยัง’ แพรวเกือบร้องไห้ เพราะไม่มีใครถามแพรวแบบนี้มานานแล้ว"
    reward: { money: 150, heart: 2, items: { khao_lam: 2 }, set_flag: praew_q2_done }

  - id: praew_q3
    npc: praew
    title: "แฟ้มบนโต๊ะพ่อ"
    desc: "แพรวเจอแฟ้มของบริษัทคุณธนาบนโต๊ะทำงานพ่อ ขอให้มาอยู่ด้วยตอนตัดสินใจว่าจะเปิดอ่านหรือไม่"
    start: { flag: praew_q2_done, heart_min: 5, day_min: 14 }
    offer:
      npc: "{player}… คืนนี้พ่อไปประชุมที่อำเภอ กลับดึก แฟ้มสีน้ำเงินของบริษัทคุณธนาวางอยู่บนโต๊ะพ่อ แพรวเดินผ่านมาห้ารอบแล้ว มาอยู่กับแพรวได้ไหมคะ ก่อนสามทุ่ม แพรวไม่อยากตัดสินใจคนเดียว"
      options:
        - text: "{p}จะไป{k}"
          accept: true
          heart: 2
          reply: "ขอบคุณค่ะ… แพรวจะเปิดไฟสปอตไลต์ทุกดวง ผีจะได้ไม่เข้ามา คนในบ้านจะได้ไม่คิดว่าแพรวทำอะไรลับๆ แม้ว่าแพรวจะกำลังทำอะไรลับๆ"
        - text: "แพรวแน่ใจนะ{kq}"
          accept: true
          heart: 1
          reply: "ไม่แน่ใจค่ะ ถึงอยากให้มีคนอยู่ด้วย คนที่ไม่ใช่เมย์ ไม่ใช่พ่อ"
        - text: "เรื่องในบ้าน{p}ไม่ยุ่งดีกว่า{k}"
          heart: -1
          reply: "…เข้าใจค่ะ ทุกคนไม่อยากยุ่งเรื่องในบ้านกำนัน แพรวชินแล้ว"
    steps:
      - goal: { type: visit, place: kamnan_house, from: "19:30", to: "21:00" }
        hint: "ไปบ้านกำนันตอนค่ำ (19:30–21:00) อยู่กับแพรวตอนเธอตัดสินใจเรื่องแฟ้มของพ่อ (กลับก่อนสามทุ่ม!)"
        done:
          npc: "แฟ้มอยู่นี่ค่ะ… ป้ายข้างหน้าเขียนว่า ‘สัญญาจะซื้อจะขาย (ร่าง) – ที่ดินกำนันประเสริฐ’ ยังไม่มีลายเซ็นพ่อ แค่ร่าง… {player} แพรวควรทำยังไง"
          options:
            - text: "อ่านให้รู้ว่าเขียนอะไร แล้วคุยกับพ่อ{k}"
              heart: 2
              set_flag: praew_q3_read
              reply: "…หน้าสาม ‘ผู้ขายยินยอมให้ผู้ซื้อเจาะบ่อบาดาลได้ไม่จำกัดจำนวน’ ไม่จำกัด… แพรวจะรอพ่อกลับ แพรวจะนั่งรอตรงนี้ ไม่ใช่ในฐานะลูกที่แอบดู ในฐานะลูกที่อ่านแล้ว และอยากคุย"
            - text: "ไม่ต้องเปิด รอถามพ่อตรงๆ{k}"
              heart: 2
              set_flag: praew_q3_ask
              reply: "ใช่ค่ะ… แพรวควรเป็นลูกที่ถาม ไม่ใช่ลูกที่แอบดู แพรวจะวางแฟ้มไว้กลางโต๊ะกินข้าว พรุ่งนี้เช้าพ่อจะเห็นพร้อมแกงส้ม แล้วเราจะคุยกัน"
            - text: "ถ่ายรูปไว้ส่งเมย์{k}"
              heart: 0
              set_flag: praew_q3_may
              reply: "…แพรวถ่ายแล้วค่ะ แต่ยังไม่ส่ง แพรวจะเก็บไว้ในโทรศัพท์ ถ้าพ่อเซ็น แพรวจะส่ง ถ้าพ่อไม่เซ็น แพรวจะลบ… นี่เป็นสัญญาที่แพรวทำกับตัวเอง"
    reward: { money: 150, heart: 2, set_flag: praew_q3_done }

  - id: praew_q4
    npc: praew
    title: "แบรนด์ชื่อแพรว"
    desc: "แพรวเปิดบูธแบรนด์ของตำบลที่ตลาด ทั้งที่บริษัทโฆษณาในกรุงเทพฯ โทรมาเสนองานกลับเงินเดือนสองเท่า"
    start: { flag: praew_q3_done, heart_min: 7, day_min: 18 }
    offer:
      npc: "{player} แพรวจะเปิดบูธแบรนด์ใหม่ที่ตลาดค่ะ ผ้ายายจันทร์ ข้าวสหกรณ์ แล้วก็มะม่วงกวนสูตรใหม่ ขาดแค่มะม่วง… แล้วก็ มีเรื่องนึง บริษัทเก่าแพรวในกรุงเทพฯ โทรมาเมื่อวาน เสนองานกลับ เงินเดือนสองเท่า"
      options:
        - text: "{p}จะเอามะม่วงมาให้ แล้วค่อยคุยกัน{k}"
          accept: true
          heart: 2
          reply: "ค่ะ… มะม่วงก่อน เรื่องใหญ่ทีหลัง แพรวชอบที่{player}ไม่รีบให้แพรวตอบ"
        - text: "เงินเดือนสองเท่าเลยเหรอ{kq}"
          accept: true
          heart: 1
          reply: "สองเท่าค่ะ… ขายครีมยี่ห้อเดิม แพรวยังไม่ได้ตอบเขา แพรวขอทำบูธนี้ให้เสร็จก่อน แล้วค่อยรู้ว่าแพรวอยากอยู่ตรงไหน"
        - text: "ไปกรุงเทพฯ เลยดีกว่า{k}"
          heart: -1
          reply: "…ทุกคนก็คิดว่าแพรวควรไป ลูกกำนันต้องไปได้ดี ไม่เป็นไรค่ะ"
    steps:
      - goal: { type: give, npc: praew, item: mango, n: 3 }
        hint: "เอามะม่วง 3 ลูกจากต้นหลังบ้านยายไปให้แพรวทำมะม่วงกวน"
        done:
          npc: "มะม่วงต้นหลังบ้านยายเพียร… ป้าแต๋วบอกว่ายายปลูกตอนแม่{player}เกิด แพรวจะเขียนเรื่องนี้ไว้ข้างกล่อง ถ้า{player}อนุญาต แพรวไม่ขายเรื่องใครโดยไม่ถาม"
          options:
            - text: "เขียนได้{k} ยายคงชอบ"
              heart: 2
              reply: "ขอบคุณค่ะ… แพรวจะกวนเองสามชั่วโมง ไม่ให้ใครช่วย ให้มันเป็นมะม่วงกวนที่แพรวทำเองจริงๆ กล่องแรกในชีวิต"
            - text: "เขียนแค่ ‘มะม่วงบ้านดงเย็น’ พอ{k}"
              heart: 1
              reply: "ได้ค่ะ… เรื่องบางเรื่องเก็บไว้ในบ้านดีกว่า แพรวเข้าใจ แพรวก็มีเรื่องแบบนั้น"
      - goal: { type: days, n: 2 }
        hint: "รอ 2 วันให้แพรวกวนมะม่วงและเตรียมบูธ"
        done:
          npc: "มะม่วงกวนเสร็จแล้วค่ะ! สิบกล่อง ไหม้ไปสองกล่อง แพรวกินเอง… พรุ่งนี้บ่ายสี่โมงเปิดบูธที่ตลาด มานะคะ แพรวจะตอบบริษัทกรุงเทพฯ วันนั้น"
          options:
            - text: "{p}จะไปเป็นลูกค้าคนแรก{k}"
              heart: 2
              reply: "ลูกค้าคนแรกต้องจ่ายเต็มราคานะคะ ไม่มีส่วนลดคนรู้จัก… ล้อเล่น ไม่ต้องจ่าย ห้ามจ่ายด้วย"
            - text: "ไหม้สองกล่อง แพรวกินหมดเลยเหรอ{kq}"
              heart: 1
              reply: "กินค่ะ… กินไปร้องไห้ไป ไม่ใช่เพราะไหม้ เพราะมันอร่อยทั้งที่ไหม้ เหมือนชีวิตแพรวตอนนี้"
      - goal: { type: visit, place: market, from: "16:00", to: "18:30" }
        hint: "ไปบูธของแพรวที่ตลาดตอนบ่ายสี่โมงถึงหกโมงครึ่ง"
        done:
          npc: "ขายหมดค่ะ… ผ้ายาย ข้าว มะม่วงกวน หมดในชั่วโมงเดียว ไม่มีใครเรียกแพรวว่าลูกกำนันเลยสักคน ป้ายเขียนชื่อคนทำทุกชิ้น… {player} บริษัทโทรมาอีกแล้ว แพรวต้องตอบเขาตอนนี้ แพรวควรทำยังไงคะ"
          options:
            - text: "อยู่ที่นี่ ทำแบรนด์นี้ต่อ ใส่ชื่อแพรวเต็มๆ{k}"
              heart: 2
              set_flag: praew_q_stay
              reply: "…‘ขอบคุณค่ะ แพรวไม่กลับแล้วค่ะ แพรวมีแบรนด์ของแพรวแล้ว’ วางสายแล้วค่ะ! แพรวจะตั้งชื่อแบรนด์ใหม่ ‘แพรว ดงเย็น’ ชื่อแพรวอยู่หน้า ชื่อตำบลอยู่หลัง ไม่มีกำนันอยู่ตรงไหนเลย"
            - text: "ไปทำงานกรุงเทพฯ แต่กลับมาทำแบรนด์ทุกเสาร์อาทิตย์{k}"
              heart: 1
              set_flag: praew_q_bkk
              reply: "ครึ่งๆ… แพรวจะเก็บเงินเดือนสองเท่าไว้ใช้หนี้กล่องพัสดุ แล้วจ้างตั้มช่วยไลฟ์ตอนบ่ายก่อนเขาเข้ากะ ยายจันทร์ทอต่อ… แต่แพรวต้องกลับมาทุกศุกร์ รถทัวร์สามทุ่ม ลุงเชิดไปรับที่อำเภอ {player}รอแพรวด้วยนะคะ"
            - text: "ชวนพ่อมาไลฟ์ด้วย แล้วถามเรื่องที่ดินต่อหน้าทุกคน{k}"
              heart: 1
              set_flag: praew_q_truth
              reply: "…แพรวโทรเรียกพ่อมาแล้วค่ะ พ่อเดินมาถือไก่มาด้วย แพรวเปิดไลฟ์ ถามว่า ‘พ่อจะขายที่ไหมคะ’ พ่อเงียบสิบวินาที ยอดวิวขึ้นเป็นพัน แล้วพ่อตอบว่า ‘ไม่ขายแล้ว ลูกสั่ง’ … แพรวไม่ได้สั่ง แต่แพรวจะรับไว้ค่ะ"
    reward: { money: 300, heart: 2, items: { cotton_handwoven: 1 }, set_flag: praew_romance_open, line: { from: praew, text: "ขอบคุณทุกคนที่มาอุดหนุนบูธวันนี้นะคะ 💛 ผ้า ข้าว มะม่วงกวน หมดเกลี้ยง ป้ายทุกชิ้นมีชื่อคนทำค่ะ ส่วนคนขาย… ชื่อแพรวค่ะ ไม่ใช่ลูกกำนัน 😊" } }
