# แพรว ♥ — convos + quests
convos:
  # ===== react =====
  - id: praew_r_meet
    topic: react
    once: true
    when: { not_flag: met_praew }
    npc: "อ้าว คนที่ย้ายมาจากกรุงเทพฯ ใช่ไหมคะ ทั้งตำบลพูดถึง… แพรวค่ะ ไม่ต้องไหว้นะ แพรวไม่ใช่กำนัน แพรวแค่อยู่บ้านเดียวกับกำนัน"
    set_flag: met_praew
    options:
      - text: "สวัสดี{k}แพรว"
        heart: 2
        reply: "…เรียกชื่อแพรวเลย ไม่มี ‘คุณ’ ไม่มี ‘ลูกกำนัน’ แพรวขอจดไว้ก่อนนะคะ คนแรกในเดือนนี้"
        next:
          - text: "ปกติคนเรียกแพรวว่าอะไร{kq}"
            heart: 1
            reply: "‘ลูกกำนัน’ ค่ะ เก้าในสิบคน อีกหนึ่งคนเรียก ‘หนูลูกกำนัน’ ยาวกว่าเดิม แพรวว่าแพรวมีชื่อนะคะ พ่อตั้งให้เองด้วย"
          - text: "ชื่อเพราะดี{k}"
            heart: 1
            reply: "แม่ตั้งค่ะ ไม่ใช่พ่อ พ่อจะตั้งว่า ‘ประดู่’ ตามไก่ ดีที่แม่ชนะ"
      - text: "ลูกกำนันใช่ไหม{kq}"
        heart: -1
        reply: "ใช่ค่ะ… ทั้งตำบลรู้ ไม่ต้องย้ำก็ได้ ผู้ใหญ่สมศักดิ์ย้ำให้แล้ว"
      - text: "ถือไม้เซลฟี่ตลอดเลยเหรอ{kq}"
        heart: 1
        reply: "ตลอดค่ะ ไลฟ์ได้ทุกเมื่อ ไล่หมาได้ทุกที่ อุปกรณ์อเนกประสงค์ของแม่ค้าออนไลน์ชนบท"

  - id: praew_r_intro
    topic: react
    once: true
    when: { flag: story_town_intro }
    npc: "เมื่อเช้าผู้ใหญ่ประกาศชื่อ{player}สามรอบ แพรวอัดเสียงไว้นะคะ เอาไปทำเสียงเรียกเข้าโทรศัพท์ได้ ‘ยินดีต้อนรับหลานยายเพียร’ ซ้ำสามที ปลุกแพรวตื่นแน่"
    options:
      - text: "ลบเถอะ{k} {p}อาย"
        heart: 1
        reply: "ไม่ลบค่ะ ของหายาก ตอนแพรวกลับมา ผู้ใหญ่ประกาศว่า ‘ลูกกำนันกลับมาแล้ว’ ไม่มีชื่อแพรวเลยสักรอบ… {player}ได้ชื่อตัวเอง ดีกว่าแพรวอีก"
        next:
          - text: "ผู้ใหญ่ลืมชื่อแพรวเหรอ{kq}"
            heart: 1
            reply: "ไม่ลืมค่ะ ผู้ใหญ่คิดว่าประกาศชื่อพ่อมีน้ำหนักกว่า… แพรวไม่โกรธผู้ใหญ่ แพรวโกรธระบบที่ทำให้ผู้ใหญ่คิดแบบนั้น"
          - text: "งั้น{p}จะเรียกชื่อแพรวสามรอบแทน{k}"
            heart: 2
            reply: "…ลองดูสิคะ ไม่ต้อง! ไม่ต้องจริงๆ คนเดินผ่านอยู่ แพรวอายย่ะ"
      - text: "แพรวอัดเสียงทุกประกาศเลยเหรอ{kq}"
        heart: 1
        reply: "ทุกประกาศที่ตลกค่ะ แพรวมีคลิปผู้ใหญ่ย้ำร้อยกว่าคลิป วันนึงจะตัดต่อเป็นเพลง ยอดวิวน่าจะดีกว่าไลฟ์ขายข้าว"

  - id: praew_r_thana
    topic: react
    once: true
    when: { flag: story_thana_visit }
    npc: "คุณธนาไปฟาร์ม{player}แล้วใช่ไหมคะ เมื่อคืนเขามาบ้านแพรวด้วย คุยกับพ่อถึงสี่ทุ่ม แพรวได้ยินคำว่า ‘ง่าย’ ผ่านผนังสิบเอ็ดครั้ง"
    options:
      - text: "แพรวนับด้วยเหรอ{kq}"
        heart: 1
        reply: "นับค่ะ แพรวเคยทำงานบริษัทโฆษณา คำว่า ‘ง่าย’ คือคำที่ลูกค้าเราใช้ตอนจะขายของยากที่สุด… แพรวรู้ภาษานี้ แพรวเคยพูดเอง"
        next:
          - text: "แพรวคิดว่าพ่อจะขายไหม{kq}"
            heart: 2
            reply: "ไม่รู้ค่ะ… แพรวไม่กล้าถาม กลัวคำตอบ กลัวมากกว่าตอนรอผลสอบ ตอนรอผลสอบอย่างน้อยรู้ว่าเราทำอะไรไป"
          - text: "แพรวเคยขายของยากแบบไหน{kq}"
            heart: 1
            reply: "ครีมหน้าใสที่แพรวไม่ได้ใช้ ขายดีมาก ดีจนแพรวรู้สึกแย่ เลยลาออกกลับบ้านมาขายของที่เชื่อ… แต่บ้านก็มีคนขายของที่ไม่เชื่อมานั่งในห้องรับแขก"
      - text: "{p}ไม่ขายนะ{k}"
        heart: 2
        reply: "ดีค่ะ… แพรวไม่ได้พูดในฐานะลูกกำนันนะ พูดในฐานะคนที่อยากให้ตำบลนี้ยังมีแปลงผักให้แพรวถ่ายรูปขาย ทุกคนมีผลประโยชน์ของตัวเองค่ะ แพรวยอมรับ"

  - id: praew_r_meeting1
    topic: react
    once: true
    when: { flag: story_meeting1 }
    npc: "รูปพ่อหลับในประชุมที่ว่อนในกลุ่ม LINE… แพรวถ่ายเองค่ะ แต่แพรวไม่ได้โพสต์ แพรวส่งให้ป้าแต๋วดูคนเดียว คนเดียวจริงๆ"
    options:
      - text: "ส่งให้ป้าแต๋วก็เท่ากับโพสต์นะ{kq}"
        heart: 2
        reply: "รู้ค่ะ! รู้หลังส่งไปแล้วสามวินาที แพรวเรียนการตลาดมาสี่ปี ยังไม่เข้าใจระบบกระจายข่าวของป้าแต๋วเลย มันเร็วกว่าแอดโฆษณาที่จ่ายเงินอีก"
      - text: "พ่อรู้หรือยัง{kq}"
        heart: 1
        reply: "รู้ค่ะ พ่อไม่โกรธ พ่อถามว่ายอดไลก์เท่าไหร่ แพรวบอกสองร้อย พ่อดีใจ… พ่อแพรวเป็นแบบนี้แหละ อยากดังแต่ไม่ยอมรับ"
        next:
          - text: "เหมือนแพรวเลย{k}"
            heart: 2
            reply: "…ไม่เหมือนย่ะ! แพรวยอมรับว่าอยากดัง พ่อไม่ยอมรับ ต่างกันตั้งเยอะ… โอเค เหมือนนิดนึง"
          - text: "กำนันน่ารักดี{k}"
            heart: 1
            reply: "น่ารักตอนหลับค่ะ ตอนตื่นพ่อเสียงดังจนไก่ตื่น แต่พ่อก็เป็นพ่อเดียวที่แพรวมี"

  - id: praew_r_result_road
    topic: react
    once: true
    when: { flag: meeting1_result_road }
    npc: "ถนนชนะโหวต แพรวไลฟ์บรรยากาศประชุมด้วยนะคะ มีคอมเมนต์ถามว่า ‘ถนนเส้นนี้ซ่อมกี่รอบแล้ว’ แพรวตอบไม่ได้ แพรวนับไม่ทัน"
    options:
      - text: "พ่อแพรวว่ายังไง{kq}"
        heart: 1
        reply: "พ่อบอกว่าหกรอบ ทุกรอบก่อนเลือกตั้ง พ่อพูดตอนกินข้าวเย็นเสียงดังมาก แต่ในที่ประชุมพ่อหลับ… แพรวยังไม่รู้ว่าพ่อหลับจริงหรือหลับแบบคนเลือกจะไม่เห็น"
        next:
          - text: "ถามพ่อตรงๆ ดูสิ{kq}"
            heart: 2
            reply: "แพรวจะถาม… ไม่ใช่วันนี้ วันนี้พ่ออาบน้ำไก่อยู่ เวลาพ่ออาบน้ำไก่ แพรวถามอะไรพ่อก็ตอบว่า ‘เดี๋ยว’"
          - text: "ไม่ต้องคิดมากหรอก{k}"
            heart: 0
            reply: "แพรวคิดมากเป็นอาชีพค่ะ นักการตลาดต้องคิดว่าคนอื่นคิดอะไร… แต่กับพ่อตัวเอง แพรวไม่อยากคิด อยากรู้เลย"
      - text: "แพรวโหวตอะไร{kq}"
        heart: 1
        reply: "ตลาดนัดค่ะ แพรวอยากให้แม่ค้าในตำบลมีที่ขายถาวร… แต่ถนนชนะ ก็โอเค อย่างน้อยรถส่งพัสดุแพรวจะไม่ติดหลุม ถ้ามันได้ทำจริงนะคะ"

  - id: praew_r_well
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "บ่อหลังร้านป้าแต๋วแห้ง บ่อลุงสมหมายแห้ง… บ่อบ้านแพรวยังเต็มค่ะ แพรวเปิดก๊อกเมื่อเช้าแล้วรู้สึกผิดจนอาบน้ำไม่ลง"
    options:
      - text: "ไม่ใช่ความผิดแพรวนะ{kq}"
        heart: 2
        reply: "รู้ค่ะ… แต่ทำไมบ่อบ้านกำนันยังไม่แห้ง แพรวตอบตัวเองได้สองแบบ แบบแรกบ่อเราลึก แบบที่สองแพรวไม่อยากพูด"
        next:
          - text: "แบบที่สองคืออะไร{kq}"
            heart: 2
            reply: "…ว่าเขายังไม่อยากให้พ่อโกรธ ก่อนพ่อเซ็น แพรวพูดออกมาแล้ว แพรวรู้สึกเหมือนลูกที่ไม่ดีเลยค่ะ"
          - text: "แบ่งน้ำให้ป้าแต๋วไหม{kq}"
            heart: 2
            reply: "แบ่งแล้วค่ะ! แพรวเอารถกระบะพ่อขนถังน้ำไปให้ป้าแต๋ววันละสองถัง พ่อไม่รู้ว่ากุญแจรถหายไปไหนทุกเช้า"
      - text: "ช่วงนี้ประหยัดน้ำหน่อยนะ{kq}"
        heart: 1
        reply: "ประหยัดค่ะ แพรวงดสระผมสองวัน ไลฟ์ใส่หมวก คนดูถามว่าแพรวเปลี่ยนลุคเหรอ แพรวบอกว่าลุค ‘รักษ์น้ำ’ ยอดวิวขึ้นด้วย"

  - id: praew_r_helped_may
    topic: react
    once: true
    when: { flag: helped_may }
    npc: "{player}… ไปถ่ายรูปท่อกับเมย์เมื่อคืนใช่ไหมคะ ไม่ต้องตอบ แพรวรู้ เพราะแพรวก็เคยส่งข้อมูลให้เมย์ครั้งนึง แล้วไม่ได้นอนทั้งคืนเหมือนกัน"
    options:
      - text: "แพรวส่งอะไรให้เมย์{kq}"
        heart: 2
        reply: "เรื่องเล็กมากค่ะ เวลาที่รถบริษัทมาจอดหน้าบ้านพ่อ… แพรวรู้สึกเหมือนทรยศพ่อ แล้วก็รู้สึกเหมือนช่วยพ่อ สองอย่างพร้อมกัน นอนไม่หลับเลย"
        next:
          - text: "แพรวช่วยพ่อจริงๆ นะ{k}"
            heart: 2
            reply: "หวังว่านะคะ… ถ้าพ่อพลาดเรื่องนี้ แพรวอยากให้พ่อพลาดก่อนเซ็น ไม่ใช่หลังเซ็น"
          - text: "ไม่ต้องบอกพ่อก็ได้{k}"
            heart: 0
            reply: "ไม่บอกค่ะ… แต่วันนึงพ่อจะรู้ ในตำบลนี้ไม่มีอะไรที่พ่อไม่รู้ ยกเว้นว่าแพรวเหงาแค่ไหน"
      - text: "ระวังตัวด้วยนะ{kq}แพรว"
        heart: 1
        reply: "{player}นั่นแหละระวัง แพรวมีไฟสปอตไลต์สิบดวงหน้าบ้าน {player}มีแต่หลอดไฟยายเพียรดวงเดียว"

  - id: praew_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ถังน้ำ CSR… บริษัทจ้างแพรวไลฟ์งานแจกถังด้วยนะคะ เสนอเงินห้าพัน แพรวปฏิเสธ แล้วไลฟ์เองฟรี โฟกัสกล้องไปที่บ่อแห้งข้างหลังแทนถัง"
    options:
      - text: "แพรวกล้ามาก{k}"
        heart: 2
        reply: "กล้าตอนกดไลฟ์ค่ะ ตอนพ่อเห็นไลฟ์ แพรวไม่กล้าเลย พ่อไม่พูดอะไรทั้งมื้อเย็น แล้วก่อนนอนพ่อมาเคาะประตู บอกว่า ‘มุมกล้องดี’ แล้วเดินไป"
        next:
          - text: "แปลว่าพ่อเห็นด้วย{kq}"
            heart: 2
            reply: "แพรวก็คิดแบบนั้นค่ะ… พ่อแพรวพูดไม่เป็น แต่ชมมุมกล้องเป็น แพรวจะเก็บประโยคนั้นไว้ทั้งชีวิต"
          - text: "หรือพ่อประชด{kq}"
            heart: 0
            reply: "พ่อประชดไม่เป็นค่ะ พ่อเป็นคนตรง ถ้าไม่ชอบพ่อตะโกน… พ่อไม่ตะโกนคือดีมากแล้ว"
      - text: "ห้าพันน่าเสียดายนะ{kq}"
        heart: -1
        reply: "เสียดายค่ะ แพรวมีหนี้ค่ากล่องพัสดุสามหมื่น… แต่ถ้ารับ แพรวจะกลายเป็นคนแบบที่แฟนเก่าแพรวคิดว่าแพรวเป็น แพรวไม่ยอมย่ะ"

  - id: praew_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ช่วงเลือกตั้งแล้ว บ้านแพรวมีแขกทั้งวัน ทุกคนมาขอให้พ่อ ‘ช่วยดูแล’ แพรวชงกาแฟจนจำได้ว่าใครใส่น้ำตาลกี่ช้อน แพรวรู้จักผู้สมัครทุกคนจากน้ำตาล"
    options:
      - text: "ใครใส่น้ำตาลเยอะสุด{kq}"
        heart: 1
        reply: "นายกฯ วิชัยค่ะ สามช้อน แต่ใส่ทีละช้อนแล้วคนนาน ทุกช้อนพูดว่า ‘ในส่วนของน้ำตาล’ … ล้อเล่นค่ะ แต่คนนานจริง"
      - text: "แพรวจะเลือกใคร{kq}"
        heart: 1
        reply: "แพรวจะเลือกตามใจค่ะ ใครมาบอกว่าพ่อแพรวฝากให้เลือกใคร ไม่ต้องเชื่อนะ… พ่อไม่ได้ฝาก พ่อไม่กล้า เพราะรู้ว่าแพรวจะเลือกตรงข้ามทันที"
        next:
          - text: "คืนหมาหอนแพรวออกจากบ้านไหม{kq}"
            heart: 1
            reply: "ไม่ออกค่ะ ไม่อยากเห็นว่าใครเดินถือซองผ่านหน้าบ้าน… ไม่อยากเห็นว่าใครเดินถือซองออกจากบ้านด้วย"
          - text: "พ่อแพรวน่ากลัวกว่าแพรวอีกนะ{kq}"
            heart: 0
            reply: "ในตำบลพ่อน่ากลัวกว่า ในบ้านแพรวน่ากลัวกว่า เราแบ่งเขตกันค่ะ"

  - id: praew_r_truck
    topic: react
    once: true
    when: { flag: sold_to_truck }
    npc: "{player}ขายพริกให้รถกระบะเหรอคะ… ราคาเขาเท่าไหร่ แพรวไม่ได้ถามเพื่อประชดนะ ถามเพื่อทำราคาในไลฟ์"
    options:
      - text: "แพรวรับซื้อพริกด้วยเหรอ{kq}"
        heart: 1
        reply: "รับค่ะ! ถ้าเป็นพริกจากแปลงไม่มียา แพรวเอาไปทำน้ำพริกขายในชื่อ ‘พริกแปลงยายเพียร’ ได้ราคากว่ารถกระบะแน่นอน ขายเรื่องราวค่ะ ไม่ได้ขายแค่พริก"
        next:
          - text: "ขายเรื่องราวของยาย{p}ได้ด้วยเหรอ{kq}"
            heart: 2
            reply: "ได้ค่ะ ถ้าเรื่องจริงและเจ้าของยอม… แพรวไม่ขายเรื่องใครโดยไม่ถาม แพรวเคยโดนคนอื่นขายเรื่องแพรวมาแล้ว"
          - text: "ไว้รอบหน้า{p}เก็บให้แพรว{k}"
            heart: 1
