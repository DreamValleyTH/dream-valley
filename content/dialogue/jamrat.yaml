# ลุงมัคนายกจำรัส — มัคนายกวัดดงเย็น (ละเอียดยิบ ตรงเวลา ขำแห้งๆ) · ตัวรอง 24–30 บท
convos:
  # ===== react =====
  - id: jamrat_r_meet
    topic: react
    once: true
    when: { not_flag: met_jamrat }
    npc: "หลานยายเพียรหรือ… รอเดี๋ยว ลุงขอจดก่อน วันที่เท่าไหร่ เวลาเท่าไหร่ ‘หลานยายเพียรมาวัดครั้งแรก’ เอ้อ เรียบร้อย ลุงชื่อจำรัส มัคนายก"
    set_flag: met_jamrat
    options:
      - text: "ลุงจดทุกคนที่มาวัดเลยเหรอ{kq}"
        heart: 1
        reply: "ไม่ทุกคนหรอกหลาน จดแค่คนที่สำคัญ… ยายเพียรใส่บาตรทุกเช้า ลุงจดไว้ครบทุกวัน หลานเป็นคนต่อจากยาย ลุงเลยเปิดหน้าใหม่ให้"
        next:
          - text: "ยายใส่บาตรกี่วัน{kq}"
            heart: 1
            reply: "สี่พันสามร้อยสิบสองวันในสมุดลุง… ขาดไปสิบเก้าวันตอนยายเข้าโรงพยาบาล ลุงไม่นับเป็นขาด ลุงเขียนว่า ‘ฝากป้าแต๋ว’"
          - text: "ลุงละเอียดจัง"
            heart: 0
            reply: "ละเอียดไม่เสียหาย หลาน ไม่ละเอียดสิเสียหาย… ลุงเห็นมากับตา"
      - text: "ลุงคือคนเช่าเครื่องรางใช่ไหม{kq}"
        heart: 1
        reply: "ผ้ายันต์ 99 ตะกรุด 79 สายสิญจน์ 49… ลุงไม่ได้ให้เช่านะหลาน วัดให้เช่า ลุงแค่นั่งโต๊ะ เงินเข้าตู้ ลุงจดสมุด หลวงพ่อไม่แตะ"
      - text: "ไม่ต้องจดก็ได้{k}ลุง"
        heart: 0
        reply: "ต้องจดหลาน ไม่งั้นวันหนึ่งหลานจะถามว่ามาวัดครั้งแรกวันไหน แล้วลุงตอบไม่ได้… ลุงจะนอนไม่หลับ"

  - id: jamrat_r_fainted
    topic: react
    when: { fainted_recent: true }
    npc: "เมื่อคืนหลานไม่ได้เช่าอะไรสักชิ้น ลุงเปิดสมุดดูแล้ว… ลุงคำนวณให้ฟังนะ ค่า รพ.สต. ของหลานเมื่อคืน เท่ากับผ้ายันต์สี่ผืนครึ่ง"
    options:
      - text: "ลุงคำนวณด้วยเหรอ{kq}"
        heart: 1
        reply: "ลุงเป็นเสมียนสหกรณ์มาสามสิบปีหลาน ตัวเลขมันเดินเข้าหัวลุงเอง… ไม่ได้ซ้ำเติมนะ ลุงแค่อยากให้หลานเห็นภาพ"
        next:
          - text: "คืนนี้เช่าผ้ายันต์แน่{k}"
            heart: 1
            reply: "ดี ลุงจดชื่อจองไว้แล้ว มาก่อนสองทุ่ม… สองทุ่มหนึ่งนาทีลุงปิดโต๊ะ ลุงเสียใจแทนได้แต่ลุงเปิดโต๊ะใหม่ไม่ได้"
          - text: "ครึ่งผืนเช่าได้ไหม{kq}"
            heart: 0
            reply: "ไม่ได้หลาน ผ้ายันต์ไม่มีครึ่งผืน… ถ้ามีครึ่งผืน ผีก็จับครึ่งตัว ลุงไม่อยากรับผิดชอบครึ่งตัวที่เหลือ"
      - text: "ไม่ต้องห่วง{k}ลุง"
        heart: 0
        reply: "ลุงไม่ได้ห่วงหลาน ลุงห่วงตัวเลข… ก็ได้ ห่วงหลานด้วยนิดหนึ่ง ลุงชงน้ำขิงให้แก้วหนึ่ง ไม่คิดแต้ม"

  - id: jamrat_r_thana
    topic: react
    once: true
    when: { flag: story_thana_visit }
    npc: "คุณธนาเอาเครื่องกรองน้ำมาถวายวัดเมื่อเช้า พร้อมขอถ่ายรูปกับหลวงพ่อ… หลวงพ่อรับเครื่องกรอง ไม่รับรูป ลุงจดว่า ‘เครื่องกรองน้ำหนึ่งเครื่อง ผู้ถวายขอรูปแต่ไม่ได้รูป’"
    options:
      - text: "ลุงจดแบบนั้นจริงเหรอ{kq}"
        heart: 1
        reply: "จดจริงหลาน ช่องหมายเหตุมีไว้ใช้… แล้วได้ข่าวว่าเขาไปขอซื้อที่ยายหลานด้วย ลุงจดไว้ในใจ ไม่ได้จดในสมุดวัด เรื่องที่ดินไม่ใช่บัญชีวัด"
        next:
          - text: "ลุงว่าไง{kq}"
            heart: 1
            reply: "ลุงไม่ว่าไงหลาน… ลุงบอกได้อย่างเดียว ก่อนเซ็นอะไรให้อ่านตัวเล็กข้างล่างทุกบรรทัด ลุงเป็นเสมียนมา เงินมันหายในตัวเล็กเสมอ"
          - text: "เครื่องกรองน้ำใช้ได้ไหม{kq}"
            heart: 0
            reply: "ใช้ได้ดี กรองเร็ว… แต่ลุงจดหมายเหตุอีกบรรทัดว่าบ่อวัดลดเร็วขึ้นตั้งแต่เดือนที่เขามา ตัวเลขสองบรรทัดอยู่ใกล้กัน ใครอ่านก็คิดเอาเอง"
      - text: "หลวงพ่อไม่ยอมถ่ายรูปเหรอ{kq}"
        heart: 0
        reply: "หลวงพ่อบอก ‘อาตมาไม่ค่อยขึ้นกล้อง’… ลุงว่าท่านขึ้นกล้องดี แต่ท่านไม่อยากขึ้นป้าย"

  - id: jamrat_r_well
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "บ่อวัดลดลงสิบสองเซนติเมตรในสองอาทิตย์หลาน… ลุงจดทุกเช้าหกโมงตรงด้วยไม้วัดอันเดิม ปีก่อนช่วงเดียวกันลดแค่สาม"
    options:
      - text: "ลุงเอาตัวเลขไปให้ใครดูหรือยัง{kq}"
        heart: 1
        reply: "ให้ปาล์ม อบต. แล้ว ปาล์มถ่ายรูปไปทุกหน้า… แล้วเด็กนักข่าวเมย์มาขอดูอีก ลุงให้ดู ลุงไม่หวงตัวเลข ตัวเลขไม่ใช่ของลุง ตัวเลขเป็นของบ่อ"
        next:
          - text: "ลุงไม่กลัวมีปัญหาเหรอ{kq}"
            heart: 1
            reply: "ลุงจดความจริงหลาน ไม่ได้จดความเห็น… ถ้าความจริงทำให้ใครมีปัญหา ปัญหานั้นไม่ได้เริ่มที่สมุดลุง"
          - text: "{p}ขอถ่ายเก็บไว้ด้วยได้ไหม{kq}"
            heart: 1
            reply: "ได้หลาน หน้าสามสิบสองถึงสามสิบเก้า… ถ่ายให้ชัดนะ ลายมือลุงสวยที่สุดในตำบล อย่าให้มันเบลอ"
      - text: "หน้าแล้งน้ำก็ลดเป็นธรรมดา{k}"
        heart: 0
        reply: "ธรรมดาคือสามเซนต์หลาน สิบสองไม่ธรรมดา… ลุงไม่เถียงด้วยปาก ลุงเถียงด้วยสมุดยี่สิบปี"

  - id: jamrat_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "สามวันนี้ผ้ายันต์เช่าหมดตั้งแต่สิบโมงเช้าหลาน… คนงานบริษัทมาเช่ากันเป็นแถว ลุงต้องทำบัญชีหน้าใหม่ หัวข้อ ‘ลูกค้าจากที่ดินบริษัท’"
    options:
      - text: "เงินเข้าวัดเยอะเลยสิ{k}"
        heart: 0
        reply: "เยอะหลาน… ลุงไม่ดีใจหรอกนะ ลุงดีใจตอนคนเช่าเพราะไปงานบวช ไม่ใช่เพราะกลัวจนนอนไม่หลับ"
      - text: "ผ้ายันต์หมด แล้ว{p}จะเช่าอะไรดี{kq}"
        heart: 1
        reply: "ตะกรุด 79 ยังเหลือ สายสิญจน์ 49 ยังเหลือ… หลานวิ่งเร็วไหม ถ้าวิ่งเร็วเอาตะกรุด ถ้าชอบหลบเอาสายสิญจน์ ถ้าไม่เร็วไม่หลบ ลุงว่ากลับบ้านก่อนสามทุ่ม ฟรี"
        next:
          - text: "แบบฟรีดีที่สุด{k}"
            heart: 1
            reply: "ลุงก็ว่างั้น… แต่อย่าบอกใครนะว่าลุงแนะนำแบบฟรี เดี๋ยวตู้บริจาคน้อยใจ"
          - text: "เอาตะกรุด{k} วิ่งเร็ว"
            heart: 1
            reply: "เจ็ดสิบเก้า ลุงจดแล้ว คืนอัตโนมัติหกโมงเช้า… วิ่งให้เร็วจริงนะหลาน ตะกรุดทำให้ผีช้าลง ไม่ได้ทำให้หลานเร็วขึ้น"
      - text: "เขาว่าเห็นผีบนกองท่อจริงไหม{kq}"
        heart: 0
        reply: "ลุงไม่เห็นหลาน ลุงจดได้แต่สิ่งที่ลุงเห็น… ลุงเห็นคนงานมือสั่นตอนนับเหรียญจ่าย อันนั้นลุงเชื่อ"

  - id: jamrat_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "เลือกตั้งมาแล้วหลาน… สัปดาห์เดียวมีคนขอถ่ายรูปคู่ตู้บริจาคสามคน ถวายพัดลมติดชื่อสองราย ถวายผ้าป่าพร้อมไวนิลหนึ่งราย ลุงจดแยกหมวดใหม่แล้ว"
    options:
      - text: "หมวดอะไร{kq}"
        heart: 1
        reply: "หมวด ‘ทำบุญช่วงเลือกตั้ง’ หลาน… ลุงจะเทียบกับปีที่ไม่มีเลือกตั้ง ปีก่อนหมวดนี้ไม่มีใครเลย ลุงว่าสถิติมันเล่าเรื่องได้เอง"
        next:
          - text: "ลุงนี่นักวิจัยเลยนะ"
            heart: 1
            reply: "ลุงเป็นเสมียน หลาน… นักวิจัยได้เงินเดือนมากกว่า แต่จดไม่สวยเท่าลุง"
          - text: "ไวนิลลุงเอาไปทำอะไร{kq}"
            heart: 1
            reply: "พลิกด้านหลังมาปูรองตากพริกให้ป้าทองใบ… ด้านหลังไม่มีหน้าใคร พริกแห้งดี ลุงจดว่า ‘ไวนิลหนึ่งผืน ใช้ประโยชน์แล้ว’"
      - text: "ลุงยอมให้ถ่ายรูปไหม{kq}"
        heart: 0
        reply: "ไม่ยอมหลาน ตู้บริจาคไม่ใช่เวทีหาเสียง… ลุงยืนบังตู้ไว้ ทุกรูปเลยได้หน้าลุงแทน ลุงไม่ได้ตั้งใจ ลุงแค่ยืนตรงนั้นพอดี"

  - id: jamrat_r_lottery
    topic: react
    once: true
    when: { flag: bought_lottery }
    npc: "เห็นหลานถือสลากมา… ลุงไม่ว่า ลุงแค่จะบอกว่าลุงสมหมายซื้อมาสามสิบปี ลุงจดไว้ว่าถูกสามครั้ง รวมได้น้อยกว่าที่จ่ายไปสี่หมื่นกว่า"
    options:
      - text: "ลุงจดหวยลุงสมหมายด้วยเหรอ{kq}"
        heart: 1
        reply: "ลุงสมหมายเป็นคนขอให้จดเองหลาน บอกจะได้รู้ว่ารวยขึ้นเท่าไหร่… ลุงจดไปสามสิบปี ลุงสมหมายไม่เคยขอดูอีกเลย"
        next:
          - text: "ลุงบอกเขาหรือยัง{kq}"
            heart: 0
            reply: "ลุงเคยจะบอก เขายกมือห้าม บอกว่า ‘อย่าเพิ่งจำรัส งวดนี้กูมีเลขดี’… สามสิบปีที่ไม่เคยได้บอก"
          - text: "{p}ซื้อใบเดียวเอง{k}"
            heart: 1
            reply: "ใบเดียวไม่เป็นไรหลาน… ลุงสมหมายก็เริ่มที่ใบเดียว"
      - text: "ลุงไม่เคยซื้อเลยเหรอ{kq}"
        heart: 0
        reply: "ลุงเคยติดเหล้า หลาน… คนที่เคยติดอะไรสักอย่าง ไม่อยากเริ่มติดอย่างที่สอง ลุงซื้อสมุดบัญชีแทน ติดสมุดไม่เสียหาย"

  - id: jamrat_r_after_debt
    topic: react
    once: true
    when: { flag: jamrat_q3_done }
    npc: "หลาน… ลุงเปิดสมุดเล่มที่สามสิบเอ็ดแล้ว หน้าแรกลุงไม่ได้จดตัวเลข ลุงจดว่า ‘หนี้ยายเพียร ปิดบัญชีแล้วด้วยวิธีที่หลานเลือก’ ลุงไม่เคยจดอะไรที่ไม่มีตัวเลขมาก่อนเลย"
    options:
      - text: "ลุงรู้สึกยังไงบ้าง{kq}"
        heart: 1
        reply: "เบา หลาน… เหมือนวันที่นับตู้ครบทุกบาท แต่นี่ไม่มีบาทสักบาท ลุงเพิ่งรู้ว่าบัญชีลงตัวได้ด้วยของที่ไม่ใช่เงิน"
        next:
          - text: "ยายคงดีใจ{k}"
            heart: 1
            reply: "ยายเพียรคงด่าลุงว่าจดอะไรเยอะแยะ… ลุงจะจดต่อ เพราะลุงอยากให้มีคนรู้ว่ายายทำอะไรไว้ แม้ยายไม่อยากให้ใครรู้"
          - text: "ลุงยังจดแต้มบุญให้{p}เหมือนเดิมนะ"
            heart: 1
            reply: "เหมือนเดิมทุกแต้มหลาน ไม่มีส่วนลด ไม่มีแถม… ความยุติธรรมคือสิ่งเดียวที่ลุงให้หลานได้ แล้วลุงก็ให้เต็ม"
      - text: "ไม่ต้องพูดถึงแล้ว{k}ลุง"
        heart: 0
        reply: "ได้หลาน ลุงปิดสมุด… แต่ลุงไม่ลืมนะ คนเป็นเสมียน ปิดสมุดได้ ปิดความจำไม่ได้"

  # ===== news =====
  - id: jamrat_n_charoensap
    topic: news
    npc: "วัดเจริญทรัพย์มหามงคลในอำเภอออกพระรุ่น ‘รวยไม่หยุด’ แล้วหลาน… ลุงไปทำธุระผ่านมา คนต่อคิวยาวถึงร้านทอง ราคาขึ้นวันละสองรอบ"
    options:
      - text: "พระรุ่นนี้กันผีได้ไหม{kq}"
        heart: 1
        reply: "กันผีไม่ได้หลาน กันเงินไม่ให้อยู่ในกระเป๋าได้… ลุงเห็นคนซื้อแล้วโดนผีจับมานอน รพ.สต. สามคน ถือพระไว้ในมือแน่นเลย"
        next:
          - text: "ทำไมคนยังซื้อ{kq}"
            heart: 0
            reply: "เพราะเขาไม่ได้ซื้อพระหลาน เขาซื้อราคาพรุ่งนี้… ลุงเป็นเสมียนมา ลุงรู้ว่าของที่ราคาขึ้นวันละสองรอบ วันหนึ่งมันลงวันละสามรอบ"
          - text: "ผ้ายันต์วัดเราดีกว่าเยอะ"
            heart: 1
            reply: "ผ้ายันต์วัดเราเก้าสิบเก้า กันได้หนึ่งครั้ง คืนหกโมงเช้า ไม่มีราคาพรุ่งนี้… ไม่มีใครรวยจากผ้ายันต์ แต่ก็ไม่มีใครจนจากผ้ายันต์"
      - text: "ลุงอยากได้สักองค์ไหม{kq}"
        heart: -1
        reply: "หลานเอามาให้ลุง ลุงจะคืนนะ… ลุงจดบัญชีวัดเรา ไม่ได้จดราคาตลาดพระ"

  - id: jamrat_n_kitchen_roof
    topic: news
    npc: "หลังคาโรงครัวซ่อมเสร็จแล้วหลาน… ช่างเปี๊ยกนัดพรุ่งนี้มาสิบสี่ครั้ง มาจริงครั้งที่สิบห้า ลุงจดไว้ครบทุกนัด"
    options:
      - text: "ลุงเอาสมุดให้ช่างดูไหม{kq}"
        heart: 1
        reply: "ไม่ให้หลาน… เขาไม่คิดค่าแรงวัดสักบาท ลุงจดนัดไว้ดูเองเล่นๆ เวลาเครียด ลุงเปิดหน้านั้นแล้วหัวเราะ"
      - text: "ป้าทองใบหายบ่นแล้วสิ{kq}"
        heart: 1
        reply: "ไม่หายหลาน ป้าย้ายไปบ่นเรื่องเตาแทน… ลุงจดว่า ‘หลังคาเสร็จ เรื่องบ่นย้ายที่’"
        next:
          - text: "ซ่อมเตาต่อเลยไหม{kq}"
            heart: 1
            reply: "ลุงไม่กล้าหลาน ถ้าซ่อมเตาเสร็จ ป้าจะบ่นเรื่องอะไรต่อ ลุงกลัวจะเป็นเรื่องลุง"
          - text: "ลุงก็บ่นช่างเปี๊ยกเหมือนกันนะ"
            heart: 0
            reply: "ลุงไม่ได้บ่นหลาน ลุงจด… การจดคือการบ่นที่มีวันที่กำกับ"

  - id: jamrat_n_points
    topic: news
    npc: "เดือนนี้ลุงมีของแลกแต้มบุญใหม่หลาน… หมอนอิงผ้าทอยายจันทร์ แลกได้ห้าสิบแต้ม มีแค่สามใบ ยายจันทร์ทอช้า ทอดีแต่ช้า"
    options:
      - text: "{p}มีแต้มกี่แต้มแล้ว{kq}"
        heart: 1
        reply: "ลุงเปิดดู… ยังไม่พอหลาน ใส่บาตรอีกสักหน่อย ช่วยงานวัดอีกนิด… ลุงกันไว้ให้ใบหนึ่ง ไม่ได้ลำเอียงนะ ลุงจดชื่อจองให้ทุกคนที่ถามก่อนเหมือนกัน"
        next:
          - text: "มีใครถามก่อนบ้าง{kq}"
            heart: 0
            reply: "ป้าแต๋วกับป้าพร… สองคนถามพร้อมกัน ลุงต้องดูนาฬิกาว่าใครถามก่อน ป้าแต๋วเร็วกว่าครึ่งวินาที ป้าพรยังไม่หายโกรธ"
          - text: "ลุงใจดีจัง"
            heart: 1
            reply: "ไม่ใจดีหลาน ยุติธรรม… ลุงชอบคำนี้มากกว่า"
      - text: "แต้มบุญเอาไปแลกของได้จริงเหรอ{kq}"
        heart: 0
        reply: "ได้หลาน แต่ลุงเตือนตามที่หลวงพ่อสั่ง… บุญไม่ได้อยู่ในแต้ม แต้มอยู่ในสมุดลุง บุญอยู่ในใจหลาน ลุงจดได้แค่อันแรก"

  - id: jamrat_n_one_baht
    topic: news
    npc: "เหรียญบาทที่ลุงเจอเกินในตู้ ลุงประกาศหาเจ้าของมาครบสิบปีพอดีวันนี้หลาน… ยังไม่มีใครมาเอา ลุงเริ่มคิดว่าผีหยอด"
    options:
      - text: "ผีหยอดเงินด้วยเหรอ{kq}"
        heart: 1
        reply: "ยายบัวบอกว่าเป็นไปได้ ผีที่ติดค้างบุญมาใช้คืน… ลุงไม่รู้หรอก แต่ลุงจดไว้ในหมวด ‘ไม่ทราบที่มา’ หมวดนี้มีรายการเดียวในสามสิบปี"
        next:
          - text: "แล้วลุงจะทำไงกับมัน{kq}"
            heart: 1
            reply: "เก็บต่อหลาน… ถ้าวันไหนลุงตาย ให้ใส่ไว้ในโลงลุงด้วย ลุงจะไปถามเจ้าของเองข้างโน้น"
          - text: "ยกให้เณรต้นไปซื้อขนมสิ"
            heart: 0
            reply: "ไม่ได้หลาน ไม่ใช่เงินของลุงจะยกให้ใคร… แต่ลุงซื้อขนมครกให้เณรด้วยเงินลุงเองได้ ลุงซื้อทุกวันพระ อย่าบอกหลวงพ่อนะ"
      - text: "ลุงเก็บมาสิบปีเพื่อบาทเดียวเลยเหรอ{kq}"
        heart: 0
        reply: "บาทเดียวหลาน แต่เป็นบาทที่ไม่ใช่ของลุง… ของที่ไม่ใช่ของเรา บาทเดียวก็หนักนะ"

  - id: jamrat_n_daughter_call
    topic: news
    when: { time: evening }
    npc: "วันอาทิตย์นี้ลูกสาวลุงโทรมาจากระยองตามเดิมหลาน… ลุงจดเวลาไว้ ห้าโมงสิบสองนาที คุยได้แปดนาทีครึ่ง นานที่สุดในเดือนนี้"
    options:
      - text: "คุยเรื่องอะไรกัน{kq}"
        heart: 1
        reply: "เขาถามลุงกินข้าวหรือยัง ลุงถามเขากินข้าวหรือยัง… แล้วก็เงียบกันสองนาที ลุงจดสองนาทีนั้นไว้ด้วย ลุงชอบสองนาทีนั้นที่สุด"
        next:
          - text: "ทำไมชอบตอนเงียบ{kq}"
            heart: 2
            reply: "เพราะเขาไม่วางหลาน… คนไม่มีอะไรจะพูดแต่ไม่ยอมวาง แปลว่ายังอยากอยู่ด้วยกัน ลุงคิดแบบเสมียน แต่ลุงว่าถูก"
          - text: "ลุงบอกคิดถึงลูกหรือยัง{kq}"
            heart: 0
            reply: "ยัง… หลาน ลุงพูดตัวเลขได้ทั้งวัน แต่คำนี้มันไม่ใช่ตัวเลข ลุงไม่รู้จะลงช่องไหน"
      - text: "ลุงจดเวลาคุยกับลูกด้วยเหรอ{kq}"
        heart: 0
        reply: "จดหลาน… ไม่จดแล้วลุงจะรู้ได้ไงว่าเดือนนี้คุยนานกว่าเดือนก่อน"

  # ===== advice =====
  - id: jamrat_a_household
    topic: advice
    npc: "หลานจดรายจ่ายทุกวันหรือเปล่า… ลุงสอนให้ฟรี สามช่อง ‘จ่ายอะไร จ่ายเท่าไหร่ จำเป็นไหม’ ช่องสุดท้ายสำคัญที่สุด"
    options:
      - text: "ช่องสุดท้ายตอบยังไง{kq}"
        heart: 1
        reply: "ตอบตามจริงหลาน… ลุงจดของตัวเองมาสิบห้าปี ช่องนั้นลุงเขียน ‘ไม่จำเป็น’ ไปสามร้อยกว่าครั้ง ส่วนใหญ่เป็นขนมครกให้เณร ลุงไม่เลิกนะ ลุงแค่รู้ตัว"
        next:
          - text: "รู้ตัวแล้วยังซื้ออยู่ดี"
            heart: 1
            reply: "ใช่หลาน… แต่ลุงซื้อด้วยความรู้ตัว นั่นคือความต่างระหว่างใช้เงินกับเงินหาย"
          - text: "{p}จะลองจด{k}"
            heart: 1
            reply: "ดี เริ่มพรุ่งนี้เช้า… จดได้เจ็ดวันติดกัน เอามาให้ลุงดู ลุงจะให้คะแนนแบบครูเต้ย แต่ลุงให้เป็นเลขทศนิยม"
      - text: "ขี้เกียจจด{k}ลุง"
        heart: 0
        reply: "ขี้เกียจจดวันนี้ ขยันงงพรุ่งนี้หลาน… ลุงเห็นมาทั้งตำบล"

  - id: jamrat_a_amulet_choice
    topic: advice
    when: { time: evening }
    npc: "ใกล้สองทุ่มแล้วหลาน ลุงจะช่วยเลือกให้นะ… คืนนี้จะไปทางไหน มีสะพานไหม มีต้นไม้ใหญ่ไหม มีเสาไฟไหม บอกลุงมาทีละข้อ"
    options:
      - text: "มีสะพาน{k}"
        heart: 1
        reply: "สะพานมีผีพราย ไม่ต้องเช่าอะไร เดินกลางสะพาน อย่าชะโงกดูน้ำ… ลุงประหยัดเงินให้หลานไปเก้าสิบเก้าบาท จดเป็นแต้มบุญของลุงได้ไหม ไม่ได้หรอก ล้อเล่น"
      - text: "ผ่านดงไม้ใหญ่{k}"
        heart: 1
        reply: "นางตะเคียนวาร์ปไปมาระหว่างต้นไม้หลาน… เอาสายสิญจน์ 49 ผีมองเห็นไม่ไกล เดินห่างจากต้นไม้หน่อย"
        next:
          - text: "ลุงรู้เรื่องผีเยอะนะ"
            heart: 1
            reply: "ลุงไม่รู้เรื่องผีหลาน ลุงรู้สถิติ… คนที่เช่าสายสิญจน์แล้วเดินผ่านดงไม้ใหญ่ กลับมาคืนครบทุกคน ลุงจดไว้สองปีแล้ว"
          - text: "สายสิญจน์เส้นเดียวพอเหรอ{kq}"
            heart: 0
            reply: "เช่าได้วันละครั้งหลาน กฎวัด… ถ้ากลัวมาก ไปนอนศาลาวัดเลย ฟรี ลุงปูเสื่อให้"
      - text: "ไม่บอกได้ไหม{k} ลับ"
        heart: 0
        reply: "ได้หลาน… งั้นลุงแนะนำผ้ายันต์ ครอบคลุมทุกความลับ เก้าสิบเก้า"

  - id: jamrat_a_debt
    topic: advice
    npc: "ถ้าจะกู้เงินใคร หลานถามเขาเป็นตัวเลขนะ ดอกเท่าไหร่ต่อเดือน ต่อปี ค่าปรับเท่าไหร่ ถ้าเขาตอบเป็นคำว่า ‘ไม่เยอะหรอก’ อย่ากู้"
    options:
      - text: "เสี่ยเฮงตอบแบบนั้นทุกที"
        heart: 1
        reply: "ลุงไม่ได้พูดชื่อใครนะหลาน… ลุงแค่สอนว่าคนที่จะเอาเงินเรา ชอบพูดเป็นคำ คนที่จะให้เงินเรา ชอบพูดเป็นตัวเลข"
      - text: "ลุงเคยกู้นอกระบบไหม{kq}"
        heart: 1
        reply: "เคย… ตอนลุงยังกินเหล้า กู้มาซื้อเหล้า ดอกเบี้ยวิ่งแซงลุงไปไกล ลุงตามไม่ทัน มีคนช่วยปิดให้… ลุงยังไม่รู้เลยว่าใคร"
        next:
          - text: "ลุงไม่รู้จริงๆ เหรอว่าใครช่วย{kq}"
            heart: 1
            reply: "ไม่รู้หลาน… เจ้าหนี้บอกว่ามีคนเอาเงินมาให้ตอนกลางคืน บอกว่า ‘ไม่ต้องบอกจำรัส’ ลุงตามหามาตลอด"
          - text: "ดีที่ลุงรอดมาได้{k}"
            heart: 1
            reply: "รอดเพราะคนอื่นหลาน… ลุงเลยจดบัญชีวัดละเอียด เผื่อวันหนึ่งได้ใช้คืนให้ใครสักคน"
      - text: "{p}ไม่กู้ใครแน่{k}"
        heart: 0
        reply: "พูดตอนนี้ง่ายหลาน… พูดอีกทีตอนหน้าแล้งตอนผักตายหมด ลุงจะจดไว้ว่าหลานเคยพูด"

  - id: jamrat_a_alms_time
    topic: advice
    when: { time: morning }
    npc: "จะใส่บาตรต้องมาก่อนหกโมงห้านาทีนะหลาน หลวงพ่อเดินผ่านหน้าร้านป้าแต๋วหกโมงสิบ ผ่านทางเข้าบ้านหลานหกโมงสิบเจ็ด ลุงจับเวลามาแล้ว"
    options:
      - text: "ลุงจับเวลาพระด้วยเหรอ{kq}"
        heart: 1
        reply: "จับเพื่อญาติโยมหลาน ไม่ได้จับพระ… หลวงพ่อเดินตรงเวลาที่สุดในตำบล รองจากรถเมล์ลุงเชิดแค่นาทีเดียว"
      - text: "หกโมงสิบเจ็ด{p}จำแล้ว"
        heart: 1
        reply: "ดี… ถ้าวันไหนหลวงพ่อมาหกโมงยี่สิบ แปลว่าท่านแวะดูนกที่ป่าหลังวัด ไม่ต้องตกใจ ลุงจดเหตุผลไว้แล้ว"

  # ===== smalltalk =====
  - id: jamrat_s_handwriting
    topic: smalltalk
    npc: "ลุงเปลี่ยนปากกาใหม่หลาน หมึกน้ำเงินเข้มกว่าเดิม… ตัวเลขเลขเจ็ดของลุงสวยขึ้นมากเลย หลานดูสิ"
    options:
      - text: "สวยจริง{k} เหมือนพิมพ์"
        heart: 2
        reply: "ใช่ไหมล่ะ! ลุงฝึกเลขเจ็ดสามสิบปี… เลขแปดลุงยังไม่พอใจ มันอ้วนไป"
        next:
          - text: "เลขแปดอ้วนก็น่ารักนะ"
            heart: 1
            reply: "น่ารักไม่ได้หลาน บัญชีต้องเรียบร้อย… แต่ก็ได้ ลุงจะยอมให้มันอ้วนนิดหนึ่ง เฉพาะวันพระ"
          - text: "สอน{p}เขียนบ้างได้ไหม{kq}"
            heart: 1
            reply: "ได้หลาน หัดเลขหนึ่งก่อน ตรงๆ ไม่เอียง… คนส่วนใหญ่เขียนเลขหนึ่งเอียง แล้วชีวิตก็เอียงตาม"
      - text: "ก็เหมือนเลขเจ็ดทั่วไป{k}"
        heart: -1
        reply: "หลานยังไม่เห็นหรอก… หางมันโค้งสามองศา ไม่เป็นไร ลุงรู้อยู่คนเดียวก็พอ"
      - text: "ลุงซื้อปากการ้านไหน{kq}"
        heart: 0
        reply: "ร้านป้าแต๋ว ด้ามละสิบ… ป้าบอกว่าด้ามนี้ครูเต้ยซื้อสีแดงไปยี่สิบด้าม ลุงซื้อสีน้ำเงินด้ามเดียว ใช้ได้สามเดือน"

  - id: jamrat_s_box
    topic: smalltalk
    npc: "ตู้บริจาคไม้ประดู่ใบนี้ เมื่อเช้ามีคนหยอดกระดุมมาหนึ่งเม็ดหลาน… ลุงจดว่า ‘กระดุมหนึ่ง สีขาว สี่รู’"
    options:
      - text: "จดกระดุมด้วยเหรอ{kq}"
        heart: 1
        reply: "จดทุกอย่างที่อยู่ในตู้หลาน ปีก่อนมีฟันปลอมหนึ่งชุด… เจ้าของมาขอคืนสามวันต่อมา ลุงมีหลักฐานว่าวันที่เท่าไหร่ เขาขอบใจลุงมาก"
        next:
          - text: "ฟันปลอมไปอยู่ในตู้ได้ไง{kq}"
            heart: 1
            reply: "เขาไอตอนก้มหยอดเหรียญหลาน… ลุงจดในหมายเหตุว่า ‘ศรัทธาแรง’"
          - text: "กระดุมใครหยอด{kq}"
            heart: 0
            reply: "ลุงว่าเณรต้น… เณรบอกว่ากระดุมหลุดจากอังสะ เณรอยากทำบุญแต่ไม่มีเงิน ลุงจดในช่องผู้บริจาคว่า ‘เณร’ ถูกต้องทุกประการ"
      - text: "ลุงซีเรียสเกินไปไหม{kq}"
        heart: 0
        reply: "ซีเรียสพอดีหลาน… ตู้นี้ไม่เคยมีใครสงสัยมายี่สิบปี เพราะลุงซีเรียสแทนทุกคนไปแล้ว"

  - id: jamrat_s_rain
    topic: smalltalk
    when: { rain: true }
    npc: "ฝนตก ลุงยกตู้เข้าชายคาแล้วหลาน… ตู้ไม้ประดู่เก่าแล้ว เปียกฝนมันบวม ลุงก็เก่าแล้ว เปียกฝนลุงปวดเข่า เราสองคนต้องหลบฝนพร้อมกัน"
    options:
      - text: "ลุงกับตู้เป็นเพื่อนกันเลย"
        heart: 1
        reply: "ยี่สิบปีหลาน… ลุงคุยกับตู้มากกว่าคุยกับคนบางคน ตู้ไม่เถียง ไม่ขอเลข ไม่ขอลดราคา"
      - text: "ไปเอายาหม่องยายบัวมาทาเข่าสิ{k}"
        heart: 1
        reply: "ยายบัวให้ลุงมาแล้วหลาน ลุงทาแล้วจดว่าทาวันไหน หายวันไหน… ยังไม่หาย ลุงจดต่อ ยายบัวบอกว่าจดจนหายเลย ลุงชอบหมอแบบนี้"

  - id: jamrat_s_ton_count
    topic: smalltalk
    npc: "เณรต้นช่วยลุงนับเหรียญบาทเก่งขึ้นแล้วหลาน… วันนี้นับได้สามร้อยสิบสองเหรียญ ผิดแค่สองเหรียญ ลุงให้เณรนับใหม่ เณรได้สามร้อยสิบสี่ ลุงงง"
    options:
      - text: "ใครนับถูก{kq}"
        heart: 1
        reply: "เณรถูกหลาน… ลุงนับผิดเอง ลุงไม่ได้นับผิดมาสามปี ลุงจดลงสมุดว่า ‘วันที่ลุงแก่ลง’ แล้วซื้อขนมครกให้เณรหนึ่งถาด"
        next:
          - text: "ลุงยอมรับว่าผิดด้วย น่ารักจัง"
            heart: 2
            reply: "บัญชีที่ดีต้องยอมรับรายการผิดหลาน… คนที่ไม่เคยยอมรับว่าผิด บัญชีเขาลงตัวเกินไป ลุงไม่เชื่อบัญชีแบบนั้น"
          - text: "ลุงยังเก่งอยู่{k}"
            heart: 1
            reply: "ลุงรู้หลาน ลุงแค่แก่… เก่งกับแก่อยู่ด้วยกันได้ ดูยายบัวสิ"
      - text: "เณรนับเหรียญได้ด้วยเหรอ{kq}"
        heart: 0
        reply: "เณรไม่แตะเงินถวายหลาน เณรนับเหรียญที่ลุงเทลงถาดให้ดู ลุงนับซ้ำ… สองคนนับเป็นพยานกัน ลุงสอนเณรเรื่องนี้ตั้งแต่วันแรก"

  # ===== self =====
  - id: jamrat_f_clerk
    topic: self
    npc: "รู้ไหมหลาน ลุงเป็นเสมียนสหกรณ์มาสามสิบปี จดบัญชีให้ทั้งตำบล รู้ว่าใครเป็นหนี้เท่าไหร่ ไม่เคยเล่าให้ใครฟังสักบาท"
    options:
      - text: "ป้าแต๋วไม่เคยถามลุงเหรอ{kq}"
        heart: 1
        reply: "ถามทุกวันหลาน… ลุงตอบว่า ‘ลุงจำไม่ได้’ ทุกวัน สามสิบปี ป้าแต๋วบอกว่าลุงเป็นเสมียนที่ความจำแย่ที่สุดในประวัติศาสตร์"
        next:
          - text: "ลุงยอมให้คนคิดว่าความจำแย่เลยเหรอ{kq}"
            heart: 2
            reply: "ยอมหลาน… ความลับคนอื่นสำคัญกว่าชื่อเสียงเรื่องความจำของลุง ป้าแต๋วรู้ทุกเรื่องในตำบล ยกเว้นเรื่องเงิน เพราะลุงอยู่ตรงนั้น"
          - text: "ตอนนี้ลุงยังจำได้ไหม{kq}"
            heart: 0
            reply: "จำได้หมดหลาน… แต่หลานก็ไม่ได้ข้อมูลจากลุงเหมือนกัน ลุงยุติธรรม"
      - text: "ทำไมลุงเลิกเป็นเสมียน{kq}"
        heart: 0
        reply: "เกษียณหลาน… แล้วก็มีเรื่องที่ลุงยังไม่อยากเล่า ไว้วันหลัง"

  - id: jamrat_f_drink
    topic: self
    when: { heart_min: 3 }
    npc: "ลุงเลิกเหล้ามาสิบห้าปีแล้วหลาน… ลุงจดทุกวันที่ไม่ได้กิน ห้าพันกว่าวันแล้ว เขียนเป็นขีดๆ เต็มสมุดสามเล่ม"
    options:
      - text: "ลุงเก่งมาก{k}"
        heart: 2
        reply: "ไม่เก่งหลาน… ลุงแค่กลัวขีดมันขาด วันไหนอยากกิน ลุงเปิดสมุดดูขีด ห้าพันขีดมันหนักกว่าเหล้าขวดเดียว"
        next:
          - text: "ลุงเลิกได้ยังไง{kq}"
            heart: 1
            reply: "มีคนลากลุงมาวัดหลาน… มากวาดลาน มานับเหรียญ มาจดบัญชี มือลุงไม่ว่างจับแก้ว ลุงเพิ่งรู้ว่ามือว่างเป็นศัตรูของคนติดเหล้า"
          - text: "{p}ขอขีดในสมุดลุงสักขีดได้ไหม{kq}"
            heart: 2
            reply: "… ได้หลาน วันนี้ขีดที่ห้าพันสามร้อยสิบสอง หลานขีดเลย ลุงจะจดว่า ‘ขีดโดยหลานยายเพียร’ เป็นขีดเดียวที่คนอื่นขีดให้"
      - text: "ลุงเคยติดเหล้าด้วยเหรอ{kq}"
        heart: 0
        reply: "หนักหลาน… หนักจนลืมว่าลูกสาวลุงจบ ป.6 วันไหน ลุงจดได้ทุกอย่างในโลก ยกเว้นวันนั้น"

  - id: jamrat_f_daughter
    topic: self
    when: { heart_min: 5 }
    npc: "ลูกสาวลุงไม่เคยถามเรื่องตอนลุงกินเหล้าเลยหลาน… ไม่ถามสักคำ สิบห้าปี ลุงไม่รู้ว่าเขาลืมหรือเขาให้อภัย"
    options:
      - text: "ลุงอยากรู้ไหม{kq}"
        heart: 1
        reply: "อยากหลาน… แต่ลุงกลัวคำตอบ ถ้าเขาบอกว่าลืม ลุงเสียใจ ถ้าเขาบอกว่ายังไม่ให้อภัย ลุงเสียใจกว่า ลุงเลยถามเรื่องกินข้าวแทน"
        next:
          - text: "บางทีเขาก็รอให้ลุงพูดก่อน"
            heart: 2
            reply: "… ลุงไม่เคยคิดแบบนั้นหลาน ลุงคิดว่าคนผิดต้องรอคนถูกเปิดปาก ลุงคงจดบัญชีความรู้สึกผิดช่องมาสิบห้าปี"
          - text: "การที่เขาโทรมาทุกอาทิตย์ก็คือคำตอบแล้ว"
            heart: 2
            reply: "… หลานพูดเหมือนนักบัญชีเลย ดูจากรายการ ไม่ต้องดูคำอธิบาย ลุงจะจำไว้"
      - text: "เรื่องเก่าช่างมันเถอะ{k}ลุง"
        heart: 0
        reply: "เรื่องเก่าไม่หายไปไหนหลาน มันแค่อยู่หน้าเก่าของสมุด… ลุงเปิดไม่บ่อยแล้ว แต่มันยังอยู่"

  - id: jamrat_f_transparency
    topic: self
    when: { heart_min: 2 }
    npc: "ลุงติดบัญชีวัดหน้าศาลาทุกเดือน ทุกบาท ตัวหนังสือใหญ่… มีคนถามว่าทำไมต้องละเอียดขนาดนั้น ลุงตอบไม่ได้ทุกครั้ง"
    options:
      - text: "จริงๆ แล้วเพราะอะไร{kq}"
        heart: 1
        reply: "เพราะลุงเคยเป็นคนที่ทำเงินคนอื่นหายหลาน… ตอนนั้นไม่มีใครติดบัญชีให้ใครดู ทุกคนไว้ใจลุง แล้วลุงทำให้เขาผิดหวัง ตอนนี้ลุงไม่อยากให้ใครต้องไว้ใจลุง ลุงอยากให้เขาเห็นเอง"
        next:
          - text: "ลุงทำเงินหายเท่าไหร่{kq}"
            heart: 0
            reply: "ไว้วันหลังหลาน… วันนี้ลุงพูดมาเกินบัญชีแล้ว"
          - text: "ตอนนี้ทุกคนไว้ใจลุงแล้วนะ"
            heart: 2
            reply: "ไว้ใจบัญชีหลาน ไม่ใช่ลุง… แต่ก็ได้ ลุงขอรับคำนี้ไว้ จดไว้ในใจ ไม่ได้จดในสมุด"
      - text: "ละเอียดดีแล้ว{k}"
        heart: 1
        reply: "ดีแล้วจริงหลาน… วัดเจริญทรัพย์ในอำเภอไม่ติดบัญชีสักใบ แต่ติดป้ายราคาพระทุกองค์ ลุงว่าเราติดถูกอย่างแล้ว"

  # ===== others =====
  - id: jamrat_o_sumet
    topic: others
    npc: "หลวงพ่อสุเมธไม่เคยถามลุงว่าเงินวัดมีเท่าไหร่หลาน… ลุงต้องเดินไปบอกเอง ท่านฟังแล้วถามว่า ‘แล้วลุงกินข้าวหรือยัง’"
    options:
      - text: "หลวงพ่อห่วงลุงมากกว่าเงิน"
        heart: 1
        reply: "ใช่หลาน… ตอนลุงยังเมา ท่านไม่เคยถามว่าลุงกินเหล้ากี่ขวด ท่านถามว่ากินข้าวหรือยัง ถามทุกวัน วันหนึ่งลุงตอบว่ายัง ท่านพาลุงไปโรงครัว ลุงไม่เคยออกจากวัดอีกเลย"
        next:
          - text: "หลวงพ่อพาลุงมาวัดเหรอ{kq}"
            heart: 1
            reply: "ท่านพามา… แต่ท่านบอกว่ามีคนขอให้ท่านพามา ท่านไม่บอกว่าใคร ลุงถามสิบห้าปี ท่านก็ยิ้มทุกที"
          - text: "ข้าวโรงครัววัดอร่อยไหม{kq}"
            heart: 0
            reply: "วันนั้นอร่อยที่สุดในชีวิตหลาน… แกงจืดป้าทองใบ จืดสนิท ลุงกินสามชาม"
      - text: "หลวงพ่อไม่ห่วงเงินวัดเลยเหรอ{kq}"
        heart: 0
        reply: "ท่านห่วงคนหลาน ลุงห่วงเงิน… แบ่งงานกันแบบนี้มายี่สิบปี วัดไม่เคยขาดทั้งสองอย่าง"

  - id: jamrat_o_ton
    topic: others
    npc: "เมื่อเช้ามีคนมาถามเณรต้นว่าฝันอะไร ลุงยืนบังเณรไว้ แล้วตอบแทนว่า ‘เณรฝันว่าหลวงพ่อให้กวาดลานเพิ่ม’… คนนั้นจดเลขกลับไปเลยหลาน"
    options:
      - text: "เขาเอาไปตีเป็นเลขอะไร{kq}"
        heart: 1
        reply: "ไม่รู้หลาน แต่ลุงบอกเลขลานวัดให้ไปด้วย ลานวัดกว้างสี่สิบคูณสามสิบเมตร… ถ้าถูกขอให้มาช่วยกวาดสักวันก็พอ"
        next:
          - text: "ลุงก็ให้เลขเหมือนกันนี่"
            heart: 0
            reply: "ลุงให้ขนาดลานหลาน ไม่ได้ให้เลขหวย… ลุงเป็นเสมียน ลุงให้ข้อมูลจริงเท่านั้น เขาเอาไปใช้ผิดประเภทเอง"
          - text: "ลุงปกป้องเณรดีมาก"
            heart: 2
            reply: "เณรเป็นเด็กหลาน… เด็กไม่ควรต้องแบกเลขของผู้ใหญ่ ลุงแบกตัวเลขมาทั้งชีวิตแล้ว ลุงรู้ว่ามันหนัก"
      - text: "ทำไมคนชอบมาถามเณร{kq}"
        heart: 0
        reply: "เพราะเณรใสหลาน คนเชื่อว่าคนใสฝันแม่น… ลุงว่าเณรใสเพราะไม่มีใครเอาความอยากไปใส่หัวเณรต่างหาก"

  - id: jamrat_o_sommai
    topic: others
    npc: "ลุงสมหมายมาหยอดตู้ห้าบาททุกครั้งที่ลุงไล่ออกจากหน้ากุฏิเณร… เดือนนี้หยอดไปสี่สิบห้าบาท ลุงจดแยกไว้ในหมวด ‘ค่าปรับสมหมาย’"
    options:
      - text: "ลุงสองคนเป็นเพื่อนกันไหม{kq}"
        heart: 1
        reply: "เพื่อนกันมาหกสิบปีหลาน… ตอนลุงเมา สมหมายแบกลุงกลับบ้านทุกคืน ไม่เคยบ่นสักคำ แต่ขอเลขทะเบียนรถที่ลุงเกือบโดนชนไปซื้อทุกงวด"
        next:
          - text: "ลุงสมหมายใจดีนะ"
            heart: 1
            reply: "ใจดีหลาน… ใจดีจนลุงยอมให้ปรับห้าบาทแทนปรับยี่สิบ ห้ามบอกเขานะว่าลุงลดให้"
          - text: "ถูกไหมเลขทะเบียนรถ{kq}"
            heart: 0
            reply: "ไม่ถูกหลาน… แต่สมหมายบอกว่าเลขนั้นช่วยให้ลุงรอด ลุงก็นับว่าถูกอยู่ดี"
      - text: "ลุงสมหมายไม่เข็ดเลยเหรอ{kq}"
        heart: 0
        reply: "ไม่เข็ดหลาน ลุงจดไว้ว่าโดนไล่สามร้อยสิบครั้ง กลับมาสามร้อยสิบเอ็ดครั้ง… ครั้งที่เกินคือวันที่เขามาขอโทษ"

  - id: jamrat_o_piak
    topic: others
    npc: "ช่างเปี๊ยกซ่อมของวัดยี่สิบปีไม่เคยคิดค่าแรงสักบาทหลาน… ลุงจดชื่อไว้หน้าแรกสมุดบุญทุกเล่ม เขาไม่เคยรู้"
    options:
      - text: "ทำไมไม่บอกเขา{kq}"
        heart: 1
        reply: "บอกแล้วเขาจะอายหลาน แล้วเขาจะคิดค่าแรงเพื่อไม่ให้อาย… คนบางคนให้แล้วไม่อยากเห็นว่าถูกจด ลุงเคารพแบบนั้น"
      - text: "ช่างนัดช้าแต่ใจดีนะ"
        heart: 1
        reply: "ช้าแต่ไม่เคยไม่มาหลาน… ลุงจดไว้ นัดสามร้อยครั้ง มาจริงสามร้อยครั้ง แค่วันไม่ตรงนัดสักครั้ง"
        next:
          - text: "แปลว่ามาครบทุกนัดนะ"
            heart: 1
            reply: "ใช่หลาน… บัญชีช่างเปี๊ยกลงตัวทุกรายการ แค่คอลัมน์วันที่ยุ่งหน่อย"
          - text: "ลุงจดทุกอย่างจริงๆ"
            heart: 0
            reply: "เกือบทุกอย่างหลาน… มีเรื่องเดียวที่ลุงไม่จด แต่ลุงจะไม่บอกว่าเรื่องอะไร"

  - id: jamrat_o_bua
    topic: others
    npc: "ยายบัวมาเช่าสายสิญจน์ทุกวันพระ แต่ไม่เคยใช้… ยายเอาไปผูกข้อมือหลานคนอื่นในตำบลหมด ลุงจดว่า ‘เช่าหนึ่ง ใช้สิบสาม’ บัญชีไม่ลงตัวแต่ลุงไม่ว่า"
    options:
      - text: "ยายบัวใจดีจัง"
        heart: 1
        reply: "ใจดีกว่าบัญชีหลาน… ลุงเลยแอบไม่เก็บค่าเช่ายายบัวมาสามปี ลุงหยอดตู้แทนเอง ลุงจดไว้ในบัญชีส่วนตัว ไม่ใช่บัญชีวัด อย่าบอกยายนะ"
        next:
          - text: "ลุงก็ใจดีเหมือนกัน"
            heart: 2
            reply: "ลุงไม่ใจดีหลาน ลุงแค่ยุติธรรมกับคนที่ใจดีกับคนอื่น… อันนั้นต่างกันนิดหนึ่ง"
          - text: "ยายบัวรู้แน่ๆ"
            heart: 1
            reply: "รู้หลาน… ยายบัวรู้ทุกอย่าง แต่ยายทำเป็นไม่รู้ เราสองคนแกล้งไม่รู้กันมาสามปี เป็นเพื่อนที่ดีแบบนี้"
      - text: "สายสิญจน์ใช้แบบนั้นได้เหรอ{kq}"
        heart: 0
        reply: "ได้หลาน… กฎวัดคือเช่าวันละครั้ง คืนหกโมงเช้า ไม่มีกฎว่าห้ามแบ่งความหวังดี ลุงตรวจระเบียบแล้ว"

quests:
  - id: jamrat_q1
    npc: jamrat
    title: "นับเหรียญมีพยาน"
    desc: "ลุงจำรัสต้องการพยานนับตู้บริจาคตอนเช้า"
    start: { heart_min: 1, day_min: 3 }
    offer:
      npc: "หลาน ลุงมีเรื่องขอ… พรุ่งนี้หกโมงเช้าลุงต้องเปิดนับตู้ประจำเดือน เณรต้นไปสอบนักธรรม พยานลุงไม่มี นับคนเดียวผิดกฎลุง มาเป็นพยานให้ลุงได้ไหม"
      options:
        - text: "ได้{k}ลุง หกโมงตรง"
          accept: true
          heart: 2
          reply: "หกโมงตรง ไม่ใช่หกโมงสองนาที… ลุงจดชื่อพยานไว้แล้ว เอ้อ แล้วถ้าผ่านร้านป้าแต๋ว ซื้อปากกาน้ำเงินมาให้ลุงสองด้าม ด้ามเก่าหมึกจะหมด"
        - text: "นับคนเดียวก็ได้นี่{kq}"
          accept: true
          heart: 0
          reply: "ได้ แต่ถ้าวันหนึ่งมีคนถามว่าลุงนับถูกไหม ลุงจะตอบว่า ‘ถูก เพราะลุงบอกเอง’ หลานว่าฟังขึ้นไหม… มาเถอะหลาน"
        - text: "หกโมงเช้าไม่ไหว{k}"
          reply: "ไม่เป็นไรหลาน ลุงจดไว้ว่า ‘หลานยายเพียร ตื่นไม่ไหว’… ล้อเล่น ลุงไม่จดเรื่องนี้หรอก"
    steps:
      - goal: { type: visit, place: temple, from: "06:00", to: "07:00" }
        hint: "ไปวัดตอนหกโมงเช้า เป็นพยานนับตู้บริจาคกับลุงจำรัส"
        done:
          npc: "สามพันสี่ร้อยสิบสองบาท กระดุมหนึ่ง หนังยางสองเส้น ลูกแก้วหนึ่งลูก… ตรงกับที่ลุงนับ หลานเซ็นพยานตรงนี้ ลายมือเรียบร้อยนะ หลานเป็นพยานคนที่สองร้อยเก้าสิบในสมุดลุง"
          options:
            - text: "ลูกแก้วใครหยอด{kq}"
              heart: 1
              reply: "น้องโอ๊ตหลาน… เขามาสารภาพแล้ว บอกว่าอยากทำบุญด้วยของที่รักที่สุด ลุงจดในช่องผู้บริจาคว่า ‘โอ๊ต ของรักที่สุด หนึ่งชิ้น’ ลุงไม่กล้าเอาไปขาย"
            - text: "ลุงมีพยานมาตั้งสองร้อยเก้าสิบคนเลยเหรอ{kq}"
              heart: 1
              reply: "สองร้อยเก้าสิบคนในยี่สิบปีหลาน ทั้งตำบลเคยเป็นพยานลุง… ยายเพียรเป็นพยานบ่อยที่สุด สี่สิบเจ็ดครั้ง ยายมาตรงเวลาทุกครั้ง แต่ยายเซ็นเบี้ยวทุกครั้ง"
      - goal: { type: give, npc: jamrat, item: red_pen, n: 2 }
        hint: "ซื้อปากกา 2 ด้ามที่ร้านป้าแต๋วไปให้ลุงจำรัส"
        done:
          npc: "ปากกาแดง… หลาน ลุงบอกน้ำเงิน ร้านป้าแต๋วไม่มีน้ำเงินเหรอ ครูเต้ยกวาดไปหมดเหรอ… ช่างเถอะ ลุงจะใช้แดงจดรายการพิเศษ ลุงไม่เคยมีรายการพิเศษมาก่อน"
          options:
            - text: "รายการพิเศษคืออะไร{kq}"
              heart: 1
              reply: "ลุงยังไม่รู้หลาน… ลุงจะเก็บปากกาแดงไว้จนกว่าจะมีเรื่องที่ควรจดสีแดง ลุงว่าคงมีสักวัน"
            - text: "ขอโทษ{k}ลุง ป้าแต๋วเหลือแต่แดง"
              heart: 1
              reply: "ไม่ต้องขอโทษหลาน ป้าแต๋วเหลือแต่แดงเพราะครูเต้ยซื้อแดง ป้าเลยสั่งแดงเยอะ… ตลาดมันเล่าเรื่องได้หมด ถ้าจดดีๆ"
    sold_at: { red_pen: taew_shop }
    reward: { money: 80, heart: 2, items: { khanom_krok: 2 }, set_flag: jamrat_q1_done, line: { from: jamrat, text: "📒 บัญชีตู้บริจาควัดดงเย็นเดือนนี้ รับ 3,412 บาท กระดุม 1 หนังยาง 2 ลูกแก้ว 1 ติดประกาศหน้าศาลาแล้ว พยาน: หลานยายเพียร ✔️ (ลุงจำรัส)" } }

  - id: jamrat_q2
    npc: jamrat
    title: "สมุดสหกรณ์เล่มเปียก"
    desc: "หลังคาห้องเก็บของรั่ว สมุดบัญชีเก่าของลุงจำรัสเปียก ต้องช่วยกันตากก่อนหมึกเลือน"
    start: { flag: jamrat_q1_done, heart_min: 3, day_min: 7 }
    offer:
      npc: "หลาน… ห้องเก็บของหลังโรงครัวรั่ว ลังสมุดสหกรณ์เก่าของลุงเปียกทั้งลัง ลุงเก็บสำเนาไว้ทุกเล่มตั้งแต่เป็นเสมียน ถ้าไม่รีบตาก หมึกจะเลือนหมด ลุงมือสั่นจนพลิกหน้ากระดาษไม่ได้"
      options:
        - text: "ไปเลย{k}ลุง {p}ช่วยตาก"
          accept: true
          heart: 2
          reply: "ตากกลางลานวัดตอนแดดยังไม่แรง สิบโมงถึงบ่ายสองนะหลาน… พลิกทีละหน้า อย่าดึง กระดาษสามสิบปีมันขาดง่ายกว่าใจคน"
        - text: "สมุดเก่าแล้ว ทิ้งไปก็ได้มั้ง{kq}"
          accept: true
          heart: 0
          reply: "ทิ้งไม่ได้หลาน… ในนั้นมีหนี้ที่ลุงยังไม่รู้ว่าใครใช้คืนให้ มาช่วยลุงเถอะ แล้วลุงจะเล่าให้ฟัง"
        - text: "วันนี้ไม่ว่าง{k}"
          reply: "ไม่เป็นไรหลาน ลุงจะค่อยๆ พลิกเอง ช้าหน่อย… หมึกมันจะรอลุงไหมก็ไม่รู้"
    steps:
      - goal: { type: visit, place: temple, from: "10:00", to: "14:00" }
        hint: "ไปวัดช่วงสายถึงบ่าย ช่วยลุงจำรัสตากสมุดบัญชีเก่ากลางลาน"
        done:
          npc: "เล่มที่สิบเจ็ด… หลานพลิกช้าๆ นะ เล่มนี้ลุงไม่ค่อยอยากเปิด… หลานเจออะไร กระดาษพับอยู่ในหน้าที่ลุงจดว่า ‘ฝากคืนเงินขาดบัญชี หนึ่งหมื่นสองพันบาท ผู้ฝาก ไม่ประสงค์ออกนาม’ ลุงไม่เคยเห็นกระดาษแผ่นนั้นเลย"
          options:
            - text: "เงินขาดบัญชีอะไร{kq}ลุง"
              heart: 1
              reply: "… คืนหนึ่งลุงเมา ถือกล่องเงินสหกรณ์กลับบ้าน ตื่นมากล่องเหลือครึ่ง ลุงไม่รู้ว่าทำหายหรือมีคนเอาไป อีกสามวันจะมีคนมาตรวจบัญชี ลุงนั่งรอติดคุก แล้ววันที่สองมีคนเอาเงินมาฝากคืนครบทุกบาท ไม่ทิ้งชื่อ"
            - text: "ลายมือนี้… ยาย{p}"
              heart: 2
              reply: "ยายเพียรหรือ… ลุงเคยเห็นลายมือยายเซ็นพยานสี่สิบเจ็ดครั้ง เบี้ยวแบบนี้ไม่มีใครเลียนได้… หลานอ่านให้ลุงฟังได้ไหม ลุงตาพร่า ไม่ใช่เพราะแก่"
      - goal: { type: talk, npc: jamrat }
        hint: "อ่านหน้ากระดาษให้ลุงจำรัสฟัง"
        done:
          npc: "(หน้าสมุดของยายเขียนว่า: ‘ไอ้รัสเมาทำเงินสหกรณ์หาย หมื่นสอง ถ้าตรวจเจอมันติดคุก ลูกสาวมันยังเล็ก ฉันขายควายคู่ของตาไปแล้ว เอาเงินไปฝากคืนตอนกลางคืน ไม่ต้องให้มันรู้ มันต้องเลิกเหล้าเพราะตัวมันเอง ไม่ใช่เพราะติดหนี้ใคร ฝากท่านที่วัดช่วยชวนมันมากวาดลาน มือมันจะได้ไม่ว่าง’)… หลาน… ควายคู่ของตา ยายขายควายคู่สุดท้าย ตอนนั้นทั้งตำบลลือว่ายายขายเพราะเป็นหนี้"
          options:
            - text: "ยายไม่เคยบอกใครเลย"
              heart: 2
              reply: "ไม่บอกใครเลยหลาน… ลุงเจอยายทุกเช้าตอนใส่บาตร สิบห้าปี ยายไม่เคยมองลุงแบบคนที่ลุงติดหนี้สักครั้ง ยายมองลุงแบบ… แบบคนธรรมดา ลุงเพิ่งรู้ว่านั่นเป็นของขวัญที่แพงที่สุด"
            - text: "ลุงไม่ได้ติดหนี้ยายหรอก{k} ยายให้"
              heart: 1
              reply: "ให้หรือ… ลุงจดบัญชีมาทั้งชีวิตหลาน ลุงไม่รู้จะลงรายการที่ไม่มีคนทวงยังไง ลุงจะลองเขียนด้วยปากกาแดงที่หลานซื้อมา ลุงรู้แล้วว่ามันมีไว้จดอะไร"
    reward: { money: 0, heart: 2, set_flag: diary_jamrat }

  - id: jamrat_q3
    npc: jamrat
    title: "หนี้ที่ไม่มีใครทวง"
    desc: "ลุงจำรัสยืนยันจะคืนเงินหนึ่งหมื่นสองพันให้หลานยายเพียร"
    start: { flag: diary_jamrat, heart_min: 4 }
    offer:
      npc: "หลาน… ลุงถอนเงินเก็บมาแล้ว หนึ่งหมื่นสองพันบาทถ้วน ลุงนับสามรอบ ยายเพียรไม่อยู่แล้ว เงินนี้ต้องไปที่หลาน บัญชีลุงค้างมาสิบห้าปี ลุงขอปิดมันนะ"
      options:
        - text: "ขอ{p}คิดสองวันได้ไหม{kq}"
          accept: true
          heart: 1
          reply: "ได้หลาน… สองวัน ลุงจดไว้แล้ว ลุงจะเก็บซองไว้ในตู้ประดู่ ตู้นี้ไม่เคยทำของหาย"
        - text: "ลุงไม่ต้องคืนหรอก{k}"
          accept: true
          heart: 1
          reply: "ต้องคืนหลาน หรือไม่ก็ต้องทำอะไรสักอย่าง… ลุงไม่ยอมให้บัญชีค้าง ไปคิดมาก่อนว่าหลานจะให้ลุงทำอะไร ลุงรอ"
        - text: "ไม่อยากคุยเรื่องนี้{k}"
          reply: "ได้หลาน… ลุงรอได้ ลุงรอมาสิบห้าปีแล้ว รออีกหน่อยไม่เป็นไร"
    steps:
      - goal: { type: days, n: 2 }
        hint: "ใช้เวลาสองวันคิดว่าจะให้ลุงจำรัสปิดบัญชีนี้อย่างไร"
      - goal: { type: talk, npc: jamrat }
        hint: "ไปบอกลุงจำรัสว่าคิดได้แล้ว"
        done:
          npc: "ครบสองวันแล้วหลาน… ซองอยู่นี่ หนึ่งหมื่นสองพัน ลุงฟังอยู่ หลานว่ามาเลย"
          options:
            - text: "เอาเงินนี้ใส่กองทุนรถผู้ป่วยของหมอแอนในชื่อยาย"
              heart: 2
              set_flag: jamrat_donate_car
              reply: "ในชื่อยายเพียร… ลุงจะเขียนในบัญชีกองทุนรถว่า ‘ยายเพียร ผ่านจำรัส หนึ่งหมื่นสองพัน’ ยายไม่อยากให้ใครรู้ แต่คราวนี้ยายห้ามลุงไม่ได้แล้ว ลุงขอเป็นครั้งเดียวที่ดื้อกับยาย"
            - text: "เก็บไว้เถอะ{k} แต่โทรบอกลูกสาวว่าคิดถึงนะ"
              heart: 2
              set_flag: jamrat_call_daughter
              reply: "… หลานคิดค่าใช้หนี้แพงกว่าหมื่นสองนะ ลุงรู้ไหม คำนี้ลุงไม่ได้พูดมาสิบห้าปี… วันอาทิตย์นี้ห้าโมงสิบสอง ลุงจะพูด ถ้าลุงพูดไม่ออก หลานมานั่งข้างลุงได้ไหม"
            - text: "{p}รับไว้{k} ยายคงอยากให้ลุงได้ปิดบัญชี"
              heart: 1
              set_flag: jamrat_repaid
              reply: "ขอบใจหลาน… ลุงนับให้ดูอีกรอบ หนึ่งหมื่นสองพันถ้วน ลุงขีดเส้นใต้สองเส้นแล้ว บัญชีปิด… แปลกนะหลาน ลุงคิดว่าจะโล่ง แต่ลุงกลับอยากเปิดบัญชีใหม่ ชื่อ ‘ของที่ยายเพียรให้ตำบล’ ลุงจะตามจดให้ครบ"
      - goal: { type: visit, place: temple, from: "17:00", to: "18:00" }
        hint: "แวะไปหาลุงจำรัสที่วัดตอนเย็นวันอาทิตย์"
        done:
          npc: "หลานมาพอดี… ลุงเพิ่งวางโทรศัพท์ ลูกสาวลุงโทรมาห้าโมงสิบสอง คุยได้สิบเอ็ดนาที นานที่สุดในปีนี้ ลุงเล่าเรื่องยายเพียรให้เขาฟังทั้งหมด เขาเงียบไปนาน แล้วเขาบอกว่า ‘พ่อ หนูรู้ตั้งแต่เด็กว่าพ่อพยายาม’"
          options:
            - text: "ดีใจด้วย{k}ลุง"
              heart: 2
              reply: "ลุงจดไว้แล้วหลาน สีแดง… ‘ลูกบอกว่ารู้ว่าพ่อพยายาม’ ไม่มีตัวเลขสักตัว แต่เป็นบรรทัดที่ลงตัวที่สุดในสมุดลุง"
            - text: "ลุงร้องไห้หรือเปล่า{kq}"
              heart: 1
              reply: "ลุงไม่ได้ร้องหลาน… ลุงเหงื่อออกที่ตา อากาศร้อน ลุงจดอุณหภูมิไว้ด้วย สามสิบสี่องศา เห็นไหม ร้อนจริง"
    reward: { money: 0, heart: 3, items: { khanom_krok: 3 }, set_flag: jamrat_q3_done, line: { from: jamrat, text: "📕 วันนี้ลุงเปิดสมุดเล่มใหม่ ชื่อ ‘ของที่ยายเพียรให้ตำบล’ ใครรู้เรื่องที่ยายเคยช่วยไว้แล้วไม่บอกใคร มาเล่าให้ลุงจดได้ที่โต๊ะเช่าเครื่องราง 06:00–20:00 ตรงเวลา (ลุงจำรัส)" } }
