# ป้าแต๋ว — quests (เรื่องรอง: สมุดเชื่อ ลูกสาวในกรุงเทพฯ ข้อเสนอซื้อร้าน → diary_taew) + convos เพิ่มเติม (taew_x_*)
# ตัวละครที่ตั้งชื่อใหม่ในไฟล์นี้: ลุงบุญส่ง (สามีป้าแต๋วที่เสียไปราวสิบสองปีก่อน) · ฝ้าย (ลูกสาวป้าแต๋ว ทำงานบริษัทในกรุงเทพฯ)
# ความลับในหน้าสมุดยาย: ก่อนลุงบุญส่งตาย เขาฝากเงินขายควายสองหมื่นไว้กับยายเพียร ขอให้ใช้หนี้หน้าที่ป้าแต๋ว “ฉีก” จากสมุดเชื่อ
#   ยายเลยไม่เคยรับเงินทอนร้านป้าแต๋วเลยสิบสองปี (เงินลุงหมดตั้งแต่ปีที่ห้า ที่เหลือยายจ่ายเอง) ป้าแต๋วไม่เคยรู้
# ธงฉากจบ: taew_end_stay (เปิดร้านต่อ) · taew_end_together (เปิดต่อ ลูกสาวช่วยทางออนไลน์ กลับบ้านบ่อยขึ้น) · taew_end_bangkok (ไปอยู่กับลูก ให้คนในตำบลเช่าร้าน ไม่ขายบริษัท)

quests:
  - id: taew_q1
    npc: taew
    title: "สมุดเชื่อเล่มแดง"
    desc: "ป้าแต๋วขอให้ช่วยรวมยอดสมุดเชื่อ เพราะบริษัทขอดู ‘บัญชีร้าน’"
    start: { heart_min: 2, day_min: 4, flag: story_town_intro }
    offer:
      npc: "หลาน… มาใกล้ๆ ป้าหน่อย คนของคุณธนามาขอดู ‘บัญชีร้าน’ บอกจะประเมินมูลค่ากิจการให้ฟรี ป้ามีบัญชีที่ไหนล่ะ ป้ามีแต่สมุดเชื่อเล่มแดง เปื้อนน้ำปลาครึ่งเล่ม ช่วยป้ารวมยอดหน่อยได้ไหม ป้าบวกในหัวเก่ง แต่บวกบนกระดาษแล้วมือสั่น"
      options:
        - text: "ได้{k}ป้า {p}เอาเครื่องคิดเลขมาด้วย"
          accept: true
          heart: 1
          reply: "ดีจ้ะ เย็นนี้หลังห้าโมงนะ ร้านเงียบแล้ว… แต่ต้องเสร็จก่อนมืดนะหลาน ป้าไม่นั่งนับเงินตอนมืด เดี๋ยวมีคนมานับด้วย คนที่ไม่มีเท้าน่ะ"
        - text: "ป้าจะขายร้านจริงเหรอ{kq}"
          accept: true
          heart: 1
          reply: "ใครบอกว่าขาย! ป้าแค่… อยากรู้ว่ามันมีราคาเท่าไหร่ คนแก่ก็อยากรู้ว่าตัวเองมีราคาไหมนะหลาน มาเย็นนี้นะ ก่อนมืด"
        - text: "ไม่ต้องให้บริษัทดูหรอก{k}"
          heart: 0
          reply: "ป้าก็คิดงั้น… แต่ป้าอยากรู้เองด้วย ไว้หลานว่างค่อยมาช่วยแล้วกันนะ ป้ารอได้ สมุดมันไม่หนีไปไหน หนี้ก็ไม่หนี คนติดหนี้นั่นแหละหนี"
    steps:
      - goal: { type: visit, place: taew_shop, from: "17:00", to: "19:00" }
        hint: "ไปช่วยป้าแต๋วรวมยอดสมุดเชื่อที่ร้านชำ ช่วง 17:00–19:00 (ก่อนมืด ป้ากลัวผี)"
        done:
          npc: "รวมได้เท่าไหร่หลาน… สามหมื่นสองพันสี่ร้อย! คนทั้งตำบลติดป้าสามหมื่นสอง แต่ลิ้นชักป้ามีพันแปด ตามสมุดป้ารวยนะ ตามลิ้นชักป้าจน… เอ๊ะ ตรงนี้ทำไมหน้ามันหายล่ะ อ๋อ… หน้าที่ป้าฉีกเองแหละ ไม่ต้องนับ"
          options:
            - text: "ป้าฉีกหน้าไหนไปบ้าง{kq}"
              heart: 1
              reply: "บ้านที่เขาไม่มีจริงๆ น่ะหลาน ลูกเข้าโรงพยาบาลบ้าง ข้าวเสียบ้าง ป้าฉีกแล้วเผาไปพร้อมธูปเลย ไม่ต้องมาค้างใจกัน… อย่าไปบอกใครนะ คนจะแห่มาเชื่อแล้วรอให้ป้าฉีก"
              next:
                - text: "ฉีกแบบนี้ร้านไม่เจ๊งเหรอ{kq}"
                  heart: 1
                  reply: "แปลกนะหลาน ป้าฉีกมาสิบกว่าปี ร้านก็ไม่เจ๊ง ป้าก็งงเหมือนกัน ป้าว่าแมวส้มมันกวักเงินให้ ตอนกลางคืน"
                - text: "ป้าใจดีเกินไปแล้ว{k}"
                  heart: 1
                  reply: "ลุงเขาก็ว่างั้น… สมัยลุงยังอยู่ เขาแย่งสมุดไปถือเองเลย บอก ‘แต๋วถือ ร้านจะกลายเป็นมูลนิธิ’"
            - text: "ทวงสักหน่อยไหม{kq} สามหมื่นเลยนะ"
              heart: 0
              reply: "ทวงได้ ทวงแบบป้า… คือเดินไปบ้านเขา ถามว่ากินข้าวหรือยัง แล้วก็คุยเรื่องอื่นสามชั่วโมง แล้วก็กลับ เขาจะรู้เอง"
            - text: "อย่าให้บริษัทดูเลย{k} เขาจะรู้ว่าป้ามีลูกหนี้ทั้งตำบล"
              heart: 1
              reply: "นั่นสิ! เขาจะรู้ว่าใครติดใครเท่าไหร่ ข้อมูลแบบนี้เขาเอาไปทำอะไรก็ได้ ป้าไม่ให้แล้ว… ป้ามีขอบเขตนะหลาน ข่าวน่ะป้าเล่า หนี้น่ะป้าไม่เล่า"
              set_flag: taew_q1_hid_ledger
      - goal: { type: talk, npc: sommai }
        hint: "ป้าแต๋วฝากไปถามลุงสมหมายแบบเนียนๆ เรื่องค่าเหล้าที่ค้างไว้ปีโน้น (ห้ามให้ป้าพรได้ยิน)"
        done:
          npc: "ค่าเหล้าปีน้ำท่วมน่ะเหรอหลาน สามร้อยสี่สิบ… ลุงจำได้ เลขสวย สามสี่ ลุงซื้อไปงวดนั้นด้วย… แต่ยายเพียรจ่ายให้ลุงไปแล้วนี่ ยายบอก ‘เรื่องนี้อย่าบอกแต๋วนะสมหมาย’ เฮ้ย… ลุงบอกไปแล้วว่ะ"
          options:
            - text: "ยายจ่ายให้ลุงเหรอ{kq} ยังไง"
              heart: 1
              reply: "ยายไม่ได้ให้ลุงเป็นเงินหรอก ยายบอกว่า ‘หนี้แต๋วฉันจัดการแล้ว เลิกหลบหน้ามันได้แล้ว’ ลุงก็เลยเลิกหลบ… หลบแต่ป้าพรอย่างเดียวพอ"
            - text: "ลุงพูดหลุดแล้วนะ{kq}"
              heart: 0
              reply: "หลุดแล้วก็หลุดไป ยายเพียรตายแล้ว ยายคงไม่ลุกมาตีลุงหรอก… ใช่ไหมหลาน ยายไม่ลุกมาใช่ไหม"
            - text: "เดี๋ยว{p}ไม่บอกป้าแต๋วก็ได้{k}"
              heart: 1
              reply: "บอกเถอะหลาน ป้าแต๋วจะรู้อยู่ดี ป้าแต๋วรู้ทุกอย่างก่อนลุงจะรู้ตัวว่าพูด อย่าให้ป้ารู้จากคนอื่นเลย มันเสียน้ำใจ"
      - goal: { type: talk, npc: taew }
        hint: "กลับไปเล่าให้ป้าแต๋วฟังที่ร้านชำ"
        done:
          npc: "ยายเพียรจ่าย? ไม่จริงหรอกหลาน ยายไม่เคยจ่ายอะไรเกินร้านป้าเลย นอกจาก… เอ๊ะ ยายไม่เคยเอาเงินทอน! สิบกว่าปี ซื้อน้ำปลาขวดเดียวยื่นแบงก์ร้อย แล้วเดินออกไปเลย ป้านึกว่ายายเกลียดเหรียญ…"
          options:
            - text: "ยายอาจจะตั้งใจไม่เอาก็ได้นะ{kq}"
              heart: 2
              reply: "ตายแล้ว… ถ้าจริงป้าจะทำยังไง ป้าเคยบ่นลับหลังยายว่าคนอะไรหยิ่ง ไม่รับเงินทอน… ป้าขอนั่งก่อนนะหลาน ขาป้าอ่อน"
            - text: "ยายอาจแค่ขี้ลืม{k}"
              heart: 0
              reply: "ยายเพียรขี้ลืม? ยายจำได้ว่าป้ายืมจอบไปเมื่อปีสองห้าสี่สองยังไม่คืน… ไม่ใช่ขี้ลืมแน่ๆ หลาน"
            - text: "ป้าเก็บเรื่องนี้ไว้ก่อนดีไหม{kq}"
              heart: 1
              reply: "ป้าเก็บได้… เรื่องนี้ป้าเก็บได้จริงๆ ไม่ใช่แบบที่ป้าบอกว่าเก็บได้ทุกที"
    reward: { money: 100, heart: 1, items: { salted_egg: 2 }, set_flag: taew_q1_done, line: { from: taew, text: "ใครติดสมุดเชื่อป้าไม่ต้องตกใจนะจ๊ะ ป้าไม่ได้ทวง ป้าแค่นับ 🙏 ส่วนบริษัทที่ขอดูบัญชี ป้าไม่มีบัญชีจ้ะ มีแต่ความทรงจำ 💚" } }

  - id: taew_q2
    npc: taew
    title: "วิดีโอคอลห้านาที"
    desc: "บริษัทโทรไปหาลูกสาวป้าแต๋วที่กรุงเทพฯ ป้าอยากเห็นหน้าลูกตอนคุยเรื่องนี้"
    start: { flag: taew_q1_done, heart_min: 3, day_min: 7 }
    offer:
      npc: "หลาน ฝ้ายลูกป้าส่ง LINE มาว่า ‘แม่ คนบริษัทโทรหาหนูด้วยนะ’ เขาไปเอาเบอร์ลูกป้ามาจากไหน! ป้าอยากคุยกับลูกเห็นหน้าเห็นตา ไม่ใช่เห็นสติกเกอร์หมีส่ายก้น หลานเคยบอกจะสอนป้าวิดีโอคอลใช่ไหม"
      options:
        - text: "สอนเลย{k} คืนนี้โทรหาฝ้ายกัน"
          accept: true
          heart: 1
          reply: "ดีจ้ะ แต่เน็ตป้าหมดตั้งแต่ไลฟ์ขายน้ำปลาพริกคราวก่อน ไปเติมที่ร้านตั้มให้ป้าหน่อย ร้อยนึงพอ… ป้าจะไปเองก็ได้ แต่ตั้มเปิดร้านตอนเย็น ป้าไม่ชอบเดินตอนเย็น"
        - text: "บริษัทโทรหาลูกป้าเหรอ{kq} มันเกินไปแล้ว"
          accept: true
          heart: 2
          reply: "ใช่ไหมล่ะ! ป้าไม่ได้พูดนะ แต่เขาว่ากันว่าบริษัทโทรหาลูกหลานทุกบ้านที่ไม่ยอมขาย ลูกอยู่ไกล พูดง่ายกว่าแม่ที่หูไวแบบป้า… ช่วยป้าเติมเน็ตก่อนนะ ที่ร้านตั้ม"
        - text: "ป้าโทรธรรมดาก็ได้นี่{kq}"
          heart: 0
          reply: "โทรธรรมดาลูกบอก ‘ประชุมอยู่แม่’ ทุกที ป้าอยากเห็นว่าประชุมจริงหรือนอนอยู่… ไว้หลานว่างค่อยสอนนะ"
    steps:
      - goal: { type: pay, npc: tam, n: 100 }
        hint: "ไปเติมเน็ตให้ป้าแต๋ว 100 บาทที่ร้าน 24 ชม. ของตั้ม (เปิด 16:00 เป็นต้นไป)"
        done:
          npc: "เติมเน็ตให้เบอร์ป้าแต๋วนะครับ… เบอร์นี้เติมทีไรหมดในสามวันครับ ป้าเปิดคลิปหมอดูทั้งคืน ผมเห็นจากใบเสร็จครับ ผมไม่ได้แอบดู ระบบมันโชว์เอง"
          options:
            - text: "ป้าเขาจะวิดีโอคอลหาลูก{k}"
              heart: 1
              reply: "ดีครับ… แม่ผมก็อยากวิดีโอคอลหาผม แต่ผมอยู่ตรงนี้ เดินไปห้านาทีก็ถึง เลยโทรด่าธรรมดาครับ ประหยัดเน็ต"
            - text: "ตั้มรู้เยอะกว่าป้าแต๋วอีกนะ{kq}"
              heart: 1
              reply: "ผมรู้ แต่ผมไม่เล่าครับ ต่างกันแค่นั้น… ร้อยบาทครับ ได้เน็ตเจ็ดวัน หรือคลิปหมอดูสามวันครับ"
      - goal: { type: visit, place: taew_shop, from: "19:00", to: "20:30" }
        hint: "ไปร้านป้าแต๋วตอน 19:00–20:30 ช่วยวิดีโอคอลหาฝ้าย (ฝ้ายเลิกงานดึก)"
        done:
          npc: "ติดแล้ว! ฝ้าย… ฝ้ายได้ยินแม่ไหม หน้าลูกค้างเลยหลาน… อ้อ ไม่ได้ค้าง ฝ้ายนิ่งเอง… ฝ้ายบอกว่า ‘แม่ ขายเถอะ เจ็ดแสนห้า มาอยู่คอนโดกับหนู แม่จะได้พัก’ … คอนโดลูกป้าหกตารางวานะหลาน ป้ากับตู้แช่ยังเข้าไม่หมดเลย"
          options:
            - text: "ฝ้ายเป็นห่วงป้านะ{kq}"
              heart: 1
              set_flag: taew_q2_daughter_side
              reply: "ป้ารู้… ฝ้ายพูดเสร็จก็ร้องไห้ บอก ‘หนูไม่อยากให้แม่อยู่คนเดียวตอนบ่อแห้ง’ ลูกป้าอยู่กรุงเทพฯ ยังรู้เรื่องบ่อ ข่าวป้าเร็วจริงๆ"
              next:
                - text: "ป้าอยากไปไหม{kq} ถามใจตัวเองดู"
                  heart: 2
                  reply: "ใจป้าน่ะเหรอหลาน ใจป้าอยู่สองที่ ครึ่งนึงอยู่คอนโดหกตารางวา อีกครึ่งนั่งอยู่หน้าตู้แช่นี่ ป้าแบ่งตัวไม่เป็น"
                - text: "ลองไปอยู่ดูสักเดือนก่อนไหม{kq}"
                  heart: 1
                  reply: "สักเดือน… ร้านใครเฝ้า ข่าวใครเล่า ป้าพรจะเหงาตาย… ป้าพูดเหมือนตัวเองสำคัญเนอะ ไม่ใช่หรอก ป้ากลัวตัวเองจะเหงาตายมากกว่า"
            - text: "ร้านนี้ลุงสร้างมากับมือนะ{kq}ป้า"
              heart: 1
              set_flag: taew_q2_shop_side
              reply: "ใช่… ฝ้ายก็รู้ แต่ฝ้ายบอก ‘พ่อไม่อยู่แล้วแม่ ร้านไม่ใช่พ่อ’ ป้าไม่เถียง ป้ากดวางสายผิดปุ่ม… ตั้งใจหรือเปล่าป้าก็ไม่แน่ใจ"
            - text: "ฝ้ายรู้เบอร์บริษัทได้ไง{kq}"
              heart: 1
              set_flag: taew_q2_suspicious
              reply: "เขาโทรหาฝ้ายก่อน บอกเป็น ‘ฝ่ายดูแลผู้มีส่วนได้ส่วนเสีย’ พูดเพราะมากจนฝ้ายนึกว่าคอลเซ็นเตอร์ธนาคาร… ป้าว่าน่ากลัวกว่าผีโพงอีกนะหลาน ผีโพงยังไม่รู้เบอร์ลูกป้า"
      - goal: { type: days, n: 2 }
        hint: "รอ 2 วัน ให้ป้าแต๋วกับฝ้ายได้คิด"
        done:
          npc: "ฝ้ายส่งสติกเกอร์มาสิบเจ็ดอัน แล้วพิมพ์ว่า ‘แม่ หนูขอโทษ หนูแค่อยากให้แม่สบาย’… สิบเจ็ดอันนะหลาน ป้านับ หมีส่ายก้นสิบเอ็ด กระต่ายร้องไห้หก ป้าว่าลูกป้าเสียใจจริง"
          options:
            - text: "ตอบลูกไปว่าคิดถึง{k}"
              heart: 2
              reply: "ป้าพิมพ์ไปแล้ว ‘แม่ก็คิดถึง’ แต่ป้าพิมพ์ผิดเป็น ‘แม่ก็คิดถุง’ ลูกขำทั้งคืน… ก็ดี ลูกขำได้ ป้าค่อยหายใจออก"
            - text: "ป้ายังโกรธฝ้ายไหม{kq}"
              heart: 1
              reply: "แม่ที่ไหนโกรธลูกได้นานหลาน ป้าโกรธเก่งแต่บริษัท ลูกป้าน่ะโดนเขาพูดใส่หู ป้าเข้าใจ"
    reward: { money: 80, heart: 2, set_flag: taew_q2_done, line: { from: taew, text: "ป้าวิดีโอคอลเป็นแล้วนะทุกคน 📱 เห็นหน้าลูกชัดมาก ชัดจนเห็นว่าผอม ส่งน้ำพริกไปสามกระปุกแล้ว ใครเป็นคนให้เบอร์ลูกป้ากับบริษัท ป้าจะหาให้เจอ 🔍" } }

  - id: taew_q3
    npc: taew
    title: "เจ็ดแสนห้ากับบ่อแห้ง"
    desc: "ป้าแต๋วฝากไปถามคุณธนาว่าบริษัทจะเอาร้านชำไปทำอะไร แล้วไปขอคำตอบที่ศาลปู่ตา"
    start: { flag: taew_q2_done, heart_min: 4, day_min: 14 }
    offer:
      npc: "หลาน บ่อหลังร้านป้าแห้งสนิทแล้ว หย่อนถังลงไปได้แต่โคลนกับกบหนึ่งตัว กบก็ดูงงๆ… แล้วบริษัทก็มาขอซื้อร้านป้าพอดีเป๊ะ ป้าไม่ได้พูดนะ แต่มันพอดีเกินไป ไปถามคุณธนาให้ป้าหน่อย ว่าจะเอาร้านป้าไปขายอะไร ป้าไม่กล้าเข้าตู้คอนเทนเนอร์ แอร์เย็นเหมือนห้องเก็บศพ"
      options:
        - text: "{p}ไปถามให้{k} ถามตรงๆ เลย"
          accept: true
          heart: 1
          reply: "ถามตรงๆ แต่ยิ้มนะหลาน คุณธนาเขายิ้มตลอด เราต้องยิ้มสู้ ใครเลิกยิ้มก่อนคนนั้นแพ้"
        - text: "บ่อป้าแห้งก่อนใครเลยนะ{kq}"
          accept: true
          heart: 1
          reply: "ใช่! บ่อป้าแห้งก่อนบ่อลุงสมหมายสามวัน ป้าเป็นคนแรกในตำบลอีกแล้ว ครั้งนี้ป้าไม่อยากเป็นเลย… ไปถามคุณธนาให้ป้านะ"
        - text: "ป้าไปเองเถอะ{k} {p}ไม่อยากยุ่ง"
          heart: -1
          reply: "จ้ะ… ป้าเข้าใจ เรื่องบริษัทใครก็ไม่อยากยุ่ง ป้ารอคนกล้าๆ สักคนก่อนแล้วกัน"
    steps:
      - goal: { type: talk, npc: thana }
        hint: "ไปถามคุณธนาที่ตู้คอนเทนเนอร์ท้ายตลาดว่าบริษัทจะซื้อร้านป้าแต๋วไปทำอะไร"
        done:
          npc: "ป้าแต๋วให้มาถามใช่ไหมครับ… ผมตอบแบบบริษัทได้ว่า ‘ยกระดับพื้นที่ค้าปลีกชุมชน’ แต่ถ้าตอบแบบคน… บริษัทไม่ได้อยากได้ร้านครับ อยากได้ที่หลังร้าน ตรงบ่อ ถ้าบ่อเป็นของบริษัท บ่อแห้งก็ไม่ใช่ข่าวครับ เป็นแค่ทรัพย์สินที่ไม่มีน้ำ"
          options:
            - text: "คุณพูดตรงแบบนี้ได้ด้วยเหรอ{kq}"
              heart: 1
              set_flag: taew_q3_thana_truth
              reply: "ผมเพิ่งพูดครั้งแรกครับ รู้สึกเหมือนถอดเนกไทในห้องประชุม… ฝากบอกป้าด้วยว่าอย่ารีบเซ็นครับ ผมพูดในนามส่วนตัว ถ้าใครถาม ผมไม่ได้พูด"
            - text: "งั้นป้าแต๋วไม่ขายแน่{k}"
              heart: 0
              reply: "ครับ ผมเดาไว้แล้ว… ผมจะเขียนในรายงานว่า ‘stakeholder ยังไม่พร้อม’ เป็นคำที่ผมเขียนบ่อยที่สุดในตำบลนี้ ป้าแต๋วคนที่สิบเจ็ดครับ"
            - text: "ถ้าป้าขอแปดแสนล่ะ{kq}"
              heart: 0
              set_flag: taew_q3_haggled
              reply: "…ผมคิดว่าบริษัทจะให้ครับ ซึ่งยิ่งน่ากลัว คุณ{player} ของที่เขายอมจ่ายเพิ่มง่ายๆ แปลว่ามันมีค่ากว่าที่เขาบอกเสมอครับ"
      - goal: { type: visit, place: shrine, from: "17:30", to: "19:00" }
        hint: "ป้าแต๋วอยากขอคำตอบจากศาลปู่ตา ไปจุดธูปช่วง 17:30–19:00 (ป้าจะยืนรอห่างๆ)"
        done:
          npc: "ป้ายืนตรงเสาไฟนี่แหละหลาน ห่างศาลสิบวา ใกล้กว่านี้ป้าไม่ไหว… ถามปู่ไปเลยว่าขายหรือไม่ขาย ถ้าตุ๊กแกร้องคี่แปลว่าไม่ขาย คู่แปลว่าขาย ป้าตั้งกติกาเอง… ร้องแล้ว! กี่ทีหลาน ป้านับได้เจ็ด หรือแปด ป้าตกใจจนลืมนับ"
          options:
            - text: "เจ็ด{k} คี่ ปู่บอกไม่ขาย"
              heart: 1
              set_flag: taew_q3_omen_keep
              reply: "เจ็ด! ป้าก็ว่าเจ็ด… ป้าว่าแปดนิดนึงแต่เจ็ดดีกว่า ไหว้ขอบคุณปู่ก่อนกลับนะหลาน แล้วรีบเดิน ฟ้าเริ่มม่วงแล้ว ม่วงแบบนี้ไม่ดี"
            - text: "แปด{k} คู่ ปู่บอกขาย"
              heart: 0
              set_flag: taew_q3_omen_sell
              reply: "แปดเหรอ… ปู่คงอยากให้ป้าไปอยู่กับลูก ปู่ใจดีนะ ปู่คงเห็นป้านั่งคนเดียวทุกคืน… ป้าขอกลับไปคิดก่อน ไม่ใช่ปู่ไม่ดีนะ ป้าแค่ยังไม่พร้อมจะเชื่อตุ๊กแก"
            - text: "ป้า… มันคือตุ๊กแกเฉยๆ นะ{kq}"
              heart: 1
              set_flag: taew_q3_omen_honest
              reply: "ป้ารู้หลาน ป้ารู้ว่าตุ๊กแก… แต่คนแก่ตัดสินใจเองไม่ได้ ต้องมีอะไรมาช่วยถือความรับผิดชอบ ถ้าเลือกผิดจะได้โทษตุ๊กแก… ไม่ใช่ เดินๆ กลับก่อน คุยกันที่ร้าน"
      - goal: { type: talk, npc: taew }
        hint: "กลับไปหาป้าแต๋วที่ร้านชำ เล่าเรื่องที่คุณธนาพูด"
        done:
          npc: "เขาอยากได้บ่อ ไม่ได้อยากได้ร้าน… ป้าเปิดร้านสามสิบปี ที่มีค่าที่สุดคือหลุมแห้งๆ หลังบ้าน ตลกดีนะหลาน… หลาน ป้ามีของอย่างนึง ยายเพียรฝากไว้ ยายสั่งว่า ‘เปิดเมื่อแต๋วคิดจะปิดร้าน’ ป้าไม่เคยเปิด ตอนนี้ป้าคิดแล้ว… ป้าว่าถึงเวลาแล้ว"
          options:
            - text: "เปิดด้วยกันนะ{kq}ป้า"
              heart: 2
              reply: "จ้ะ แต่ไม่เปิดตอนเย็น ไม่เปิดที่ร้าน… พรุ่งนี้เช้าหลังใส่บาตร เปิดที่วัด มีพระ มีแดด ถ้าในซองมีอะไรน่ากลัว ป้าจะได้วิ่งเข้าโบสถ์ทันที"
            - text: "ป้ากลัวอะไรในซอง{kq}"
              heart: 1
              reply: "ป้ากลัวว่ามันมีอะไรที่ป้าไม่อยากรู้… หรือกลัวว่ามันไม่มีอะไรเลย ยายแค่แกล้ง ยายเพียรแกล้งเป็นนะหลาน แกล้งหน้านิ่งๆ ด้วย"
    reward: { money: 150, heart: 2, items: { khanom_pia: 1 }, set_flag: taew_q3_done, line: { from: taew, text: "ใครเห็นตุ๊กแกศาลปู่ตาร้องเมื่อวานเย็น ร้องกี่ทีบอกป้าด้วยนะ ป้าได้ข้อมูลไม่ตรงกัน 🦎🙏" } }

  - id: taew_q4
    npc: taew
    title: "ซองที่ยายฝากไว้"
    desc: "เปิดซองที่ยายเพียรฝากป้าแต๋วไว้ แล้วช่วยป้าตัดสินใจเรื่องร้าน"
    start: { flag: taew_q3_done, heart_min: 5, day_min: 16 }
    offer:
      npc: "หลาน… ซองนี้แหละ สีน้ำตาล ยายเขียนหน้าซองด้วยปากกาแดงว่า ‘แต๋ว ห้ามแกะก่อน’ ป้าเก็บไว้ใต้ลิ้นชักเงินทอนสองปีแล้ว บางคืนป้าหยิบมาดม… อย่าขำ กลิ่นยายยังอยู่ พรุ่งนี้เช้าไปเปิดที่วัดด้วยกันนะ"
      options:
        - text: "ไป{k} {p}จะไปก่อนป้าอีก"
          accept: true
          heart: 2
          reply: "ตีห้าครึ่งนะ ไม่ใช่ห้าโมงแบบคราวก่อน… ป้าจะใส่บาตรเผื่อยายด้วย ไข่เค็มฟองโตๆ ให้ยายรู้ว่ามีคนมาเปิดซองแล้ว"
        - text: "ป้าแน่ใจนะ{kq} ไม่เปิดก็ได้"
          accept: true
          heart: 1
          reply: "ไม่แน่ใจสักนิด แต่ถ้ารอให้แน่ใจ ป้าคงแน่ใจตอนตายพอดี… ไปเช้านะหลาน ไปเช้าๆ ตอนผีหลับ"
        - text: "ไว้ก่อนเถอะ{k}ป้า"
          heart: 0
          reply: "จ้ะ… ซองมันรอได้ รอมาสองปีแล้ว รออีกนิดคงไม่เป็นไร ป้าแค่ไม่แน่ใจว่าป้าจะรอได้นานเท่าซอง"
    steps:
      - goal: { type: visit, place: temple, from: "06:00", to: "08:00" }
        hint: "ไปเจอป้าแต๋วที่วัดช่วง 06:00–08:00 หลังใส่บาตร เปิดซองของยายเพียร"
        done:
          npc: "ข้างในเป็นหน้าสมุดยาย… ป้าอ่านนะ ‘บุญส่งมาหาฉันก่อนเข้าโรงพยาบาล ฝากเงินขายควายสองหมื่น บอกว่า แต๋วมันใจอ่อน ฉีกสมุดเชื่อทุกปี ผมไม่อยู่ ร้านจะเจ๊ง ฝากพี่เพียรด้วย อย่าให้มันรู้ มันไม่ยอมแน่… ฉันเลยไม่เอาเงินทอนแต๋วอีกเลย หน้าที่มันฉีก ฉันจ่ายครบทุกหน้า เงินบุญส่งหมดตั้งแต่ปีที่ห้า ที่เหลือเงินฉันเอง ไม่ต้องคืน ถ้าแต๋วอ่านอยู่แปลว่ามันคิดจะปิดร้าน… อย่าปิดเพราะคิดว่าขาดทุนนะแต๋ว มันไม่เคยขาดทุน’ … ข้างหลังมีรายชื่อหลาน ทุกบ้านที่ป้าฉีก ยายจดไว้หมด"
          options:
            - text: "ลุงกับยายรักร้านนี้มากเลยนะ{kq}"
              heart: 2
              reply: "ไม่ใช่รักร้านหรอกหลาน… รักคนเฝ้าร้าน ป้าเพิ่งรู้วันนี้ว่าสิบสองปีที่ป้านึกว่าตัวเองเก่ง ที่จริงมีคนสองคนแอบเติมลิ้นชักให้ คนนึงตายไปแล้ว อีกคนก็ตาย… ขอป้าร้องตรงนี้แป๊บนึงนะ ต่อหน้าพระไม่เป็นไร"
              next:
                - text: "ร้องเลย{k}ป้า {p}นั่งอยู่ตรงนี้"
                  heart: 2
                  reply: "…ขอบใจนะหลาน ยายหลานตอนเห็นป้าร้องไห้งานศพลุง ยายก็นั่งเฉยๆ แบบนี้แหละ ไม่พูดอะไรเลย นั่งจนป้าหยุดเอง"
                - text: "ยายจดรายชื่อละเอียดกว่าป้าอีกนะ{kq}"
                  heart: 1
                  reply: "ฮ่า… ใช่ ลายมือยายสวยกว่าป้าด้วย ลุงสมหมายสามร้อยสี่สิบ ตาเผือกพันสอง… บ้านลุงหวังสองพันแปด ยายเขียนข้างๆ ว่า ‘ไอ้หวังเอาไปซื้อเหล้า แต่ลูกมันได้ไปโรงเรียน ช่างมัน’"
            - text: "ยายรู้ว่าป้าจะคิดปิดร้านได้ไง{kq}"
              heart: 1
              reply: "ยายบอกท้ายหน้าว่า ‘ถ้าวันไหนบริษัทมาขอซื้อร้าน แต๋วจะลังเล เพราะมันกลัวเป็นภาระลูก’… ยายรู้จักป้าดีกว่าป้ารู้จักตัวเองอีกนะหลาน น่าโมโหจริงๆ"
            - text: "ป้าจะคืนเงินให้{p}ไหม{kq}"
              heart: -1
              reply: "…หลานถามจริงเหรอ ยายเขียนว่าไม่ต้องคืน แต่ถ้าหลานอยากได้ ป้าจะผ่อนให้ทีละเงินทอน… ล้อเล่นจ้ะ ป้ารู้ว่าหลานล้อ หน้าหลานเหมือนยายตอนแกล้งป้า"
      - goal: { type: give, npc: taew, item: khanom_pia, n: 2 }
        hint: "ซื้อขนมเปี๊ยะ 2 ชิ้นที่ตลาด ให้ป้าแต๋วไปตั้งหน้ารูปลุงบุญส่งกับรูปยายเพียร"
        done:
          npc: "สองชิ้นพอดี ชิ้นนึงของลุง ชิ้นนึงของยาย ลุงชอบไส้ถั่ว ยายชอบไส้ฟัก ป้าซื้อผิดไส้ทั้งสองคนเลยนะหลาน… ไม่เป็นไร ทั้งคู่ไม่เคยบ่นป้าเรื่องนี้ บ่นแต่เรื่องป้าใจอ่อน"
          options:
            - text: "เขาคงยิ้มอยู่ตอนนี้{k}"
              heart: 1
              reply: "ลุงคงยิ้ม ยายคงทำหน้านิ่งแล้วพูดว่า ‘ช้า’ … สองปีกว่าจะเปิดซอง ยายว่าช้าแน่ๆ"
            - text: "ป้าจะเล่าเรื่องนี้ให้ใครฟังไหม{kq}"
              heart: 1
              reply: "ไม่เล่าจ้ะ… เรื่องนี้ป้าไม่เล่าในกลุ่ม LINE เด็ดขาด รายชื่อพวกนั้นคือคนที่ลำบาก ป้าไม่อยากให้ใครรู้ว่าเขาเคยลำบาก ยายก็คิดแบบเดียวกัน ถึงจดไว้ในสมุดตัวเอง"
      - goal: { type: days, n: 1 }
        hint: "ให้ป้าแต๋วคิดหนึ่งคืน แล้วกลับไปฟังคำตอบที่ร้านชำ"
        done:
          npc: "ป้าคิดทั้งคืนเลยหลาน ไม่ได้ดูละครด้วย พระเอกจะความจำเสื่อมรอบที่สี่ก็ช่างมัน… ฝ้ายโทรมาเมื่อเช้า ป้าเล่าเรื่องลุงให้ฟัง ลูกร้องไห้กว่าป้าอีก แล้วถามว่า ‘แม่จะเอายังไง’ … หลานว่าป้าควรเอายังไงดี ป้าจะฟังหลานนะ ครั้งนี้ไม่ฟังตุ๊กแก"
          options:
            - text: "เปิดร้านต่อ{k}ป้า ลุงกับยายจ่ายค่าเปิดร้านไว้ล่วงหน้าแล้ว"
              heart: 2
              set_flag: taew_end_stay
              reply: "จ่ายล่วงหน้าสิบสองปี… จริงของหลาน ป้าจะเปิดต่อ บริษัทให้ล้านป้าก็ไม่ขาย บ่อแห้งก็ให้มันแห้งอยู่ในชื่อป้า ใครมาดูจะได้รู้ว่าแห้งเพราะใคร… แล้วป้าจะฉีกสมุดต่อนะ แต่คราวนี้ป้าจะจดเหมือนยาย"
            - text: "เปิดต่อ{k} แต่ให้ฝ้ายช่วยทางออนไลน์ แล้วกลับบ้านบ่อยขึ้น"
              heart: 2
              set_flag: taew_end_together
              reply: "ฝ้ายเสนอเหมือนหลานเลย! บอกจะทำ LINE ร้านให้ ลูกค้าสั่งของแล้วป้าส่ง ฝ้ายจะกลับทุกเดือน ไม่ใช่ปีละครั้ง… ป้าไม่เชื่อหรอกว่าทุกเดือน แต่สองเดือนครั้งป้าก็ดีใจแล้ว ป้าจะได้มีลูกน้องเป็นลูกตัวเอง สั่งได้เต็มปาก"
            - text: "ไปอยู่กับฝ้ายเถอะ{k} แต่อย่าขายบริษัท ให้คนในตำบลเช่าร้านแทน"
              heart: 1
              set_flag: taew_end_bangkok
              reply: "…ป้าก็คิดอย่างนี้ตอนตีสาม ไปอยู่กับลูกสักพัก ร้านให้คนในตำบลเช่า ค่าเช่าถูกๆ ขอแค่ห้ามขายบริษัท ห้ามทิ้งสมุดเชื่อ แล้วก็ห้ามไล่แมวส้ม… ป้าจะกลับมาทุกวันพระ หลานไม่ต้องห่วง ห่วงคอนโดฝ้ายดีกว่า ป้าไปอยู่ ข่าวลือจะตามไปทั้งตึก"
    sold_at: { khanom_pia: market }
    reward: { money: 300, heart: 3, items: { salted_egg: 3 }, set_flag: diary_taew, line: { from: taew, text: "ใครเคยติดสมุดเชื่อป้าหน้าที่ฉีกไปแล้ว ไม่ต้องจ่ายนะจ๊ะ มีคนจ่ายให้ครบแล้ว ใครจ่าย ป้าไม่บอก 🙏 ร้านป้าแต๋วไม่ขายใครทั้งนั้นจ้ะ 💚" } }

convos:
  - id: taew_x_town_intro
    topic: react
    once: true
    when: { flag: story_town_intro }
    npc: "ได้ยินผู้ใหญ่ประกาศชื่อหลานไหม ‘ยินดีต้อนรับหลานยายเพียร’ สามรอบ รอบที่สามไมค์หอนตรงคำว่า ‘ยาย’ เลยกลายเป็น ‘ยินดีต้อนรับหลานหวีดดดเพียร’… ป้าเป็นคนบอกผู้ใหญ่เองนะว่าหลานกลับมา"
    options:
      - text: "ป้าบอกผู้ใหญ่เหรอ{kq} ว่าแล้วเชียว"
        heart: 1
        reply: "ก็ใครจะรู้ก่อนป้าล่ะหลาน ลุงเชิดขับรถเมล์มาส่งหลานยังไม่ทันเลี้ยวรถ ป้าโทรหาผู้ใหญ่แล้ว ผู้ใหญ่ยังถามว่า ‘แน่ใจนะแต๋ว’ ป้าบอก ‘ฉันเคยไม่แน่ใจเหรอ’"
      - text: "อายจะตาย{k} ทั้งตำบลได้ยิน"
        heart: 1
        reply: "อายทำไม ประกาศชื่อแปลว่าคนเขาดีใจ ถ้าเขาไม่ดีใจเขาไม่ประกาศหรอก เขาเล่าในกลุ่ม LINE แทน… แบบนั้นสิน่าอาย"
        next:
          - text: "ในกลุ่มเล่าว่าไงบ้าง{kq}"
            heart: 1
            reply: "ป้าพรส่งรูปหลานเดินถือกระเป๋าลงกลุ่ม แคปชั่นว่า ‘ผอมกว่ายาย’ มีคนกดหัวใจสี่สิบคน ป้ากดสองรอบ"
          - text: "งั้นช่างมันเถอะ{k}"
            heart: 0
            reply: "ช่างมันจ้ะ อีกสามวันก็มีเรื่องใหม่ ตำบลเราข่าวหมุนเร็ว เหมือนพัดลมร้านป้า เบอร์สาม"
      - text: "ไมค์หอนทุกครั้งเลยเหรอ{kq}"
        heart: 0
        reply: "ไม่ทุกครั้งหรอก หอนเฉพาะตอนสำคัญ อบต. ตั้งงบซ่อมสามปีแล้ว ป้ายติดหน้าหอแล้วด้วย ‘โครงการปรับปรุงระบบเสียงตามสาย’ ป้ายสวยกว่าเสียงอีก"

  - id: taew_x_refused
    topic: react
    once: true
    when: { flag: thana_refused }
    npc: "หลาน! หลานไม่ขายให้คุณธนาจริงเหรอ ป้าได้ยินจากแม่ค้าที่ได้ยินจากคนขับรถเขา ว่าหลานพูดว่า ‘ไม่ขาย’ ชัดถ้อยชัดคำเหมือนยายเลย"
    options:
      - text: "จริง{k} ที่ยาย{p}ไม่ขาย"
        heart: 2
        reply: "โอ๊ย ป้าขนลุก! ยายเพียรพูดประโยคนี้หน้าประตูบ้านสามรอบ รอบสุดท้ายถือจอบ หลานไม่ได้ถือจอบใช่ไหม ดีแล้ว ยุคนี้เขาถ่ายคลิป"
      - text: "ป้ารู้แม้แต่คำพูด{p}เลยเหรอ{kq}"
        heart: 1
        reply: "รู้แค่คำสำคัญจ้ะ ส่วนน้ำเสียงป้าเติมเอง ป้าเติมให้หลานดูเท่นะ ไม่ได้เติมให้ดูแย่ ป้าเลือกข้างแล้ว"
        next:
          - text: "เลือกข้าง{p}เหรอ{kq}"
            heart: 1
            reply: "เลือกข้างบ่อน้ำจ้ะ บ่อหลังร้านป้าเริ่มลดแล้ว ใครอยู่ข้างบ่อ ป้าอยู่ข้างนั้น"
          - text: "อย่าเติมเยอะนะ{kq}ป้า"
            heart: 0
            reply: "เติมนิดเดียว ใส่ว่าหลานมองตาเขาแล้วพูดช้าๆ… ไม่ได้มองเหรอ งั้นป้าจะเล่าว่ามองแล้วกัน"
      - text: "ยังไม่แน่หรอก{k} ราคาเขาก็สูงนะ"
        heart: 0
        reply: "จ้ะ ยังไม่แน่ก็ไม่แน่ ป้าไม่ว่าหรอก… แต่ป้าเล่าในกลุ่มไปแล้วว่าหลานไม่ขาย ถ้าเปลี่ยนใจบอกป้าก่อนนะ ป้าจะได้ลบทัน"

  - id: taew_x_haggled
    topic: react
    once: true
    when: { flag: thana_haggled }
    npc: "ป้าไม่ได้พูดนะ แต่เขาว่ากันว่าหลานถามคุณธนาว่า ‘ได้มากกว่านี้ไหม’ … ตายแล้วหลาน ต่อราคาที่ยายเหมือนต่อราคาไข่ร้านป้าเลย"
    options:
      - text: "{p}แค่อยากรู้ว่าเขาให้ได้แค่ไหน{k}"
        heart: 1
        reply: "อ๋อ หยั่งเชิงเหรอ ฉลาดนะหลาน… แล้วเขาว่าไง อย่าบอกตัวเลขนะ ป้าเดา… ล้านห้า? ไม่บอกก็ไม่เป็นไร ป้าดูจากหน้าหลานแล้ว ไม่ถึง"
      - text: "ถ้าได้ราคาดีก็น่าคิดนะ{kq}ป้า"
        heart: -1
        reply: "น่าคิดจ้ะ ป้าก็คิด… คิดว่ายายเพียรจะว่ายังไง ยายต่อราคาแม่ค้าทุกเจ้า ยกเว้นเรื่องเดียว ที่ดิน ยายไม่ต่อ ยายไม่ขาย"
        next:
          - text: "{p}ยังไม่ได้ตัดสินใจ{k}"
            heart: 1
            reply: "ไม่ต้องรีบ ของที่ขายแล้วซื้อคืนไม่ได้นะหลาน ไม่เหมือนไข่ ไข่ป้ายังรับคืนถ้าแตกมาจากร้าน"
          - text: "ยายไม่อยู่แล้ว{k}ป้า"
            heart: 0
            reply: "…จ้ะ ยายไม่อยู่แล้ว ป้ารู้ ป้าแค่ยังพูดถึงยายเหมือนยายนั่งอยู่หลังร้าน ขอโทษนะหลาน ป้าไม่ได้บังคับ"
      - text: "ป้าเชื่อข่าวลือเร็วไปนะ{kq}"
        heart: 0
        reply: "ป้าเชื่อเร็ว แต่ป้าก็เลิกเชื่อเร็วนะ ถ้าไม่จริงบอกป้า ป้าจะเล่าใหม่ว่าหลานถามเพื่อทดสอบเขา ฟังดูเท่กว่า"

  - id: taew_x_vote_market
    topic: react
    once: true
    when: { flag: vote_market }
    npc: "หลานยกมือให้ตลาดนัด! ป้าเห็นนะ ป้านับมือทุกมือ ตลาดได้สิบเก้า ถนนยี่สิบหก ระบบน้ำยี่สิบสาม… มือเสี่ยเฮงนับสองเพราะยกสองมือ ใครจะไปห้ามเขาได้"
    options:
      - text: "ป้าอยากได้ตลาดนี่{kq} {p}เลยช่วย"
        heart: 2
        reply: "หลานนี่… ป้าไม่ได้อยากได้เพื่อร้านป้านะ ป้าอยากได้ที่ให้คนแก่ได้มานั่งรวมกันวันเสาร์ ได้คุย ได้ขายผักคนละกำ… แล้วก็ได้ฟังข่าวด้วย นิดหน่อย"
      - text: "ยกสองมือได้ด้วยเหรอ{kq}"
        heart: 1
        reply: "ได้สิ ประธานที่ประชุมหลับอยู่ กำนันตื่นมาตอนนับเสร็จ บอก ‘เอกฉันท์นะ’ ทั้งศาลาเงียบ เพราะไม่มีใครกล้าบอกว่าไม่ใช่"
        next:
          - text: "แล้วผลจะออกยังไง{kq}"
            heart: 0
            reply: "พรุ่งนี้ประกาศจ้ะ แต่ป้าบอกเลย ไม่ว่าอะไรชนะ ครึ่งนึงจะไปเป็น ‘ศึกษาความเป็นไปได้’ ทำเล่มรายงานสวยๆ ปกมัน ป้าเห็นมาสามรอบแล้ว ปกมันทุกรอบ"
          - text: "{p}ว่าจะไปฟ้องอำเภอ{k}"
            heart: 0
            reply: "ไปฟ้องอำเภอ อำเภอก็ตั้งกรรมการศึกษาความเป็นไปได้อีกเล่มนะหลาน ปกมันกว่าเดิม"
      - text: "{p}ยกมือมั่วๆ{k} ง่วง"
        heart: 0
        reply: "ง่วงก็ยังยกถูกข้างนะหลาน ป้าถือว่าหลานใจถึงตลาด ใจไม่ได้หลับ"

  - id: taew_x_well_dry
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "หลาน… บ่อหลังร้านป้าแห้งแล้ว เมื่อเช้าป้าหย่อนถังลงไป ได้โคลนครึ่งถังกับกบหนึ่งตัว กบมันมองป้าเหมือนจะถามว่า ‘น้ำไปไหน’ ป้าก็ไม่รู้จะตอบมันยังไง"
    options:
      - text: "ป้ามีน้ำใช้พอไหม{kq}"
        heart: 2
        reply: "พอจ้ะ ป้ารองน้ำประปาใส่โอ่งไว้ ประปามาวันเว้นสองวัน… ขอบใจที่ถามนะหลาน คนอื่นถามแต่ว่า ‘บริษัทใช่ไหม’ ไม่มีใครถามว่าป้าอาบน้ำหรือยัง"
        next:
          - text: "แล้วป้าอาบหรือยัง{kq}"
            heart: 1
            reply: "อาบแล้วจ้ะ ขันเดียว อาบแบบสมัยสาวๆ ตอนไปเที่ยวทะเล น้ำจืดหาย… ป้าพูดเล่นนะ อย่าบอกหมอแอน เดี๋ยวหมอมาตรวจ"
          - text: "{p}ตักน้ำบ่อยายมาให้{k}"
            heart: 2
            reply: "บ่อยายยังมีเหรอ ดีแล้ว… ตักมาโอ่งเดียวพอ ป้าจะเก็บไว้ไหว้ศาลพระภูมิ ส่วนอาบน้ำป้าใช้ประปา ประปามันน่าเชื่อถือน้อยกว่าแต่เกรงใจหลาน"
      - text: "บริษัทแน่ๆ เลย{k}"
        heart: 1
        reply: "ป้าไม่ได้พูดนะ… แต่สามสิบปีไม่เคยแห้ง เขามาเจาะบ่อได้สองเดือนก็แห้ง แล้วคนของเขายังมาซื้อน้ำขวดร้านป้าอีก ป้าก็ขายให้ ป้าแต่งตัวเป็นแม่ค้า ไม่ได้แต่งเป็นตำรวจ"
      - text: "ป้าเป็นคนแรกในตำบลอีกแล้วนะ{kq}"
        heart: 0
        reply: "ใช่… ป้าชอบเป็นคนแรกที่รู้ข่าว แต่ไม่ชอบเป็นคนแรกที่เป็นข่าวเลยหลาน มันคนละความรู้สึกกัน"

  - id: taew_x_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "หลาน! คนงานบริษัทลาออกสามคนแล้ว เขาว่าเห็นผู้หญิงผมยาวยืนอยู่ข้างท่อตอนตีสอง ป้าไม่ได้พูดนะ ป้าพูดไม่ได้ ป้าขนลุกจนพูดไม่ออก… แต่เขาว่ากันว่าใส่ผ้าถุงลายเดียวกับที่ป้าขาย"
    options:
      - text: "ป้ากลัวเหรอ{kq}"
        heart: 1
        reply: "กลัวสิ! ป้าเลื่อนเวลาเข้ามุ้งจากสามทุ่มเป็นสองทุ่มครึ่งแล้ว ละครดูได้แค่ไตเติ้ล… ยายบัวบอกผีไม่ชอบคนดูดน้ำจากแม่ธรณี ป้าว่าดีแล้ว แต่อย่าเดินผ่านร้านป้าล่ะกัน"
        next:
          - text: "ป้าไม่ได้ดูดน้ำ ไม่ต้องกลัวหรอก{k}"
            heart: 1
            reply: "นั่นสิ… แต่ป้าขายน้ำขวดให้คนบริษัท ผีเขาจะนับรวมไหมหลาน ป้าว่าพรุ่งนี้ป้าใส่บาตรเพิ่มอีกชุด กันไว้"
          - text: "ผ้าถุงลายป้าขายดีขึ้นไหม{kq}"
            heart: 0
            reply: "ตายแล้ว ไม่ขายแล้วจ้ะ! ป้าเก็บลงหลังร้านหมดเลย ใครจะกล้าใส่ลายเดียวกับผี… ป้าพรมาขอซื้อตัวนึง บอกจะใส่ไปไล่ตาแก่ตอนตีสอง"
      - text: "อาจเป็นคนแกล้งก็ได้นะ{kq}"
        heart: 1
        reply: "ป้าก็คิดนะ… ถ้าเป็นคนแกล้ง ป้าขอบคุณเขา ถ้าเป็นผี ป้าก็ขอบคุณเขา ป้าขอบคุณทั้งสองทาง ป้าไม่อยากมีศัตรูทั้งสองโลก"
      - text: "{p}จะไปดูตอนดึกเอง{k}"
        heart: 0
        reply: "อย่าเชียวนะหลาน! ป้าสั่ง! ถ้าหลานไป ป้าจะไม่นอนทั้งคืน แล้วป้าไม่นอนทั้งคืนเท่ากับป้ากลัวทั้งคืน มันทรมานคนแก่นะ"

  - id: taew_x_helped_may
    topic: react
    once: true
    when: { flag: helped_may }
    npc: "(กระซิบ) หลาน… มานี่ ป้ารู้แล้วนะว่าเมื่อคืนหลานไปกับเมย์ ไปถ่ายรูปท่อ ไม่ต้องตกใจ ป้ารู้คนเดียว… กับแมวส้ม"
    options:
      - text: "ป้าอย่าเล่าให้ใครฟังนะ{kq} อันตรายจริงๆ"
        heart: 2
        reply: "เรื่องนี้ป้าไม่เล่า สาบานต่อหน้ารูปลุงเลย ป้าเล่าเรื่องหวย เรื่องละคร เรื่องผมป้าพร แต่เรื่องที่ทำให้คนเจ็บตัว ป้าไม่เล่า… ป้าจะเล่าในกลุ่มว่าหลานนอนหลับเร็วเมื่อคืน เผื่อมีคนถาม"
        next:
          - text: "ขอบคุณ{k}ป้า"
            heart: 1
            reply: "ไม่ต้องขอบคุณ… กลับดึกอย่างนั้นอีก ไปพักร้านตั้มก่อนนะหลาน ไฟสว่าง ตั้มไม่ถามอะไร ป้าถามเยอะเกิน"
          - text: "ป้ารู้ได้ไง{kq}"
            heart: 0
            reply: "รองเท้าหลานมีโคลนสีแดง โคลนแดงมีแค่แถวที่ดินบริษัท แล้วหลานหาวสามรอบตั้งแต่มายืนตรงนี้ ป้าดูละครสืบสวนนะหลาน ไม่ได้ดูแต่ละครตบ"
      - text: "{p}ไม่ได้ไปไหนนะ{kq}"
        heart: 0
        reply: "จ้ะ ไม่ได้ไป ป้าไม่ได้ถาม ป้าไม่ได้รู้ ป้าแค่จะบอกว่าเมย์เขามาซื้อถ่านไฟฉายร้านป้าสี่ก้อน… ไม่ได้ไปก็ดีแล้ว ปลอดภัย"
      - text: "ป้าเป็นห่วงเมย์ไหม{kq}"
        heart: 1
