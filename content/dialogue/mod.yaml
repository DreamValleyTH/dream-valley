        reply: "อยากครับ แต่ที่โน่นผมจะขายยาให้คนที่ไม่เคยเห็นหน้า ที่นี่ผมรู้ว่าใครโกหกเรื่องกินยาจากแววตา ผมไม่อยากเสียทักษะนี้"

  - id: mod_f_mistake
    topic: self
    when: { heart_min: 7 }
    npc: "ผมจะบอกอะไรที่ไม่เคยบอกใครครับ ปีแรกที่เปิดร้าน ผมจ่ายยาผิดขนาดให้เด็กคนหนึ่ง แม่เขากลับมาถามเพราะเม็ดยาสีไม่เหมือนเดิม ทันก่อนเด็กกินครับ ทันพอดี"
    options:
      - text: "แต่ไม่มีใครเป็นอะไรนะ{kq}"
        heart: 2
        reply: "ไม่มีครับ เด็กคนนั้นตอนนี้เรียนมหาวิทยาลัย เขาไม่รู้เรื่องนี้ด้วยซ้ำ แต่ผมนับยาสองรอบทุกครั้งตั้งแต่วันนั้น สิบปีแล้ว ผมไม่เคยนับรอบเดียวอีกเลย"
        next:
          - text: "นั่นทำให้ภก.เป็นภก.ที่ดี{k}"
            heart: 2
            reply: "…ผมไม่รู้จะทำหน้ายังไงครับ หน้าผมมีแบบเดียว แต่ข้างในตอนนี้มีหลายแบบมาก ขอบคุณครับ"
          - text: "ภก.เล่าให้{p}ทำไม{kq}"
            heart: 1
            reply: "เพราะคุณถามผมว่าเหนื่อยไหม เมื่อวันก่อน คนที่ถามคำถามนี้ ควรได้รู้ว่าทำไมผมไม่ค่อยหลับ"
      - text: "ทุกคนพลาดได้{k}"
        heart: 1
        reply: "ใช่ครับ แต่ทุกคนไม่ได้ถือขวดยา ผมรู้ว่าคุณพูดเพื่อให้ผมรู้สึกดีขึ้น มันได้ผลประมาณสิบเปอร์เซ็นต์ ซึ่งสูงกว่าที่ผมคาด"

  # ===== others =====
  - id: mod_o_ann
    topic: others
    npc: "หมอแอนกับผมเป็นทีมครับ เธอแก้ข่าวในกลุ่ม ผมกดไลก์ เราแพ้ทุกสัปดาห์ แต่สถิติเราดีขึ้น เมื่อก่อนแพ้ศูนย์ต่อสิบ ตอนนี้แพ้หนึ่งต่อสิบ"
    options:
      - text: "ภก.ชอบหมอแอนเหรอ{kq}"
        heart: 1
        reply: "ผมนับถือหมอแอนครับ ในระดับเดียวกับที่นับถือยาฆ่าเชื้อที่ยังไม่ดื้อ เป็นของมีค่าที่หายากขึ้นทุกปี"
        next:
          - text: "แค่นับถือเหรอ{kq}"
            heart: 0
            reply: "คุณถามคำถามแบบป้าแต๋วครับ ผมจะตอบแบบเภสัชกร ข้อมูลไม่เพียงพอต่อการวินิจฉัย"
          - text: "บอกเธอบ้างสิ{k}"
            heart: 1
            reply: "ผมบอกแล้วครับ ผมบอกว่า ‘หมอทำงานดีมาก’ เธอบอกว่า ‘มดก็ด้วย’ แล้วเราก็กลับไปพิมพ์แก้ข่าว นั่นเป็นบทสนทนาที่อบอุ่นที่สุดของเราปีนี้"
      - text: "หมอแอนเหนื่อยไหม{kq}"
        heart: 1
        reply: "เหนื่อยมากครับ ผมจ่ายวิตามินให้เธอฟรี เธอไม่กิน เป็นคนไข้ที่แย่ที่สุดของผม และคนทำงานที่ดีที่สุดในตำบล"

  - id: mod_o_tam
    topic: others
    npc: "ตั้มมาซื้อวิตามินบีอีกแล้วครับ ผมบอกเขาว่าที่เขาขาดคือวิตามินดี ซึ่งได้จากแดด เขาบอกว่าแดดไม่ได้อยู่ในตารางงาน ผมจดคำนี้ไว้ เป็นอาการที่ไม่มีในตำรา"
    options:
      - text: "พี่ตั้มกับภก.สนิทกันไหม{kq}"
        heart: 1
        reply: "เราสองคนเป็นคนเดียวในตำบลที่ตื่นหลังเที่ยงคืนโดยไม่ได้หนีผีครับ เราไม่ค่อยคุยกัน แต่เวลาไฟร้านเขากะพริบ ผมรู้ว่าเขายังโอเค"
      - text: "ภก.ห่วงพี่ตั้มนะ{k}"
        heart: 1
        reply: "ผมห่วงทุกคนที่ทำงานกะดึกครับ ร่างกายคนไม่ได้ออกแบบมาให้มองไฟนีออนแทนดวงอาทิตย์ แต่ระบบออกแบบมาให้มีคนทำ"

  - id: mod_o_bua
    topic: others
    npc: "ยายบัวกับผมไม่ได้เป็นคู่แข่งกันครับ ยายส่งคนไข้มาหาผมเวลาเกินมือยาย ผมส่งคนไปหายายเวลาเขาต้องการคนนั่งฟัง ซึ่งผมทำไม่เก่ง"
    options:
      - text: "ภก.เชื่อสมุนไพรยายไหม{kq}"
        heart: 1
        reply: "ผมเชื่อขมิ้นชันกับไพลครับ มีงานวิจัย ผมไม่เชื่อน้ำมนต์ แต่ผมเชื่อว่าคนที่ได้น้ำมนต์จากยายแล้วสบายใจ จะกินยาผมครบกว่า เราเลยทำงานด้วยกันได้"
      - text: "ภก.เคยไปให้ยายบัวรักษาไหม{kq}"
        heart: 1
        reply: "ครั้งหนึ่งครับ ผมปวดหลัง ยายนวดสิบนาทีหาย ผมไม่บอกใคร เพราะผมขายยาแก้ปวดหลังอยู่"

  - id: mod_o_sommai
    topic: others
    npc: "ลุงสมหมายมาวัดน้ำตาลเมื่อเช้าครับ สองร้อยสิบ ผมถามว่ากินยาไหม ลุงบอกว่ากินน้ำมะพร้าวต้มใบเตยแทน ตามคลิป ผมถามว่าคลิปใคร ลุงบอกว่าคลิปที่มีคนไลก์เยอะ"
    options:
      - text: "สองร้อยสิบสูงไหม{kq}"
        heart: 1
        reply: "สูงครับ สูงพอจะเป็นเลขท้ายสามตัวที่ลุงจะแทงงวดหน้า ผมพูดเล่นนะครับ แต่ผมกลัวว่ามันจะไม่ใช่เรื่องเล่น"
        next:
          - text: "{p}ไปบอกป้าพรให้{k}"
            heart: 2
            reply: "ได้ผลที่สุดครับ ป้าพรเป็นยาที่ลุงกลัวที่สุด ผมจ่ายป้าพรให้ลุงเป็นยาเสริม"
          - text: "เดี๋ยวลุงก็รู้เอง{k}"
            heart: -1
            reply: "เบาหวานไม่สอนแบบให้สอบซ่อมครับ มันสอนแบบตัดนิ้วเท้า ผมจะไปบ้านลุงเองเย็นนี้"
      - text: "คลิปที่ไลก์เยอะก็ต้องจริงสิ{k}"
        heart: -1
        reply: "ถ้าไลก์ทำให้จริง ผมจะไปขอไลก์ให้หมอแอน แล้วให้ทั้งตำบลหายป่วยครับ"

  - id: mod_o_heng
    topic: others
    npc: "ร้านผมกับร้านเสี่ยเฮงใช้ผนังด้านเดียวกันครับ ตอนเช้าผมได้ยินเสียงเครื่องคิดเลขเขา ตอนเย็นผมได้กลิ่นยาฆ่าแมลงเขา ผมขายยาแก้แพ้เพิ่มทุกปี เราเป็นหุ้นส่วนที่ไม่มีสัญญา"
    options:
      - text: "ภก.ไม่ชอบเสี่ยเหรอ{kq}"
        heart: 1
        reply: "ผมไม่ชอบสินค้าบางอย่างของเขาครับ ตัวเขาผมเฉยๆ เขาซื้อยาลดความดันกับผมทุกเดือน และไม่เคยต่อราคา เป็นสิ่งเดียวในชีวิตที่เขาไม่ต่อ"
      - text: "เสี่ยป่วยเหรอ{kq}"
        heart: 0
        reply: "ผมบอกไม่ได้ครับ ความลับคนไข้ แต่ถ้าคุณเห็นเขากดเครื่องคิดเลขแล้วหน้าแดง ให้เขานั่งพัก"

quests:
  - id: mod_q1
    npc: mod
    title: "ข่าวปลอมสัปดาห์ที่แปด"
    desc: "ภก.มดอยากไปอธิบายเรื่องน้ำผึ้งมะนาวล้างไตให้คนแก่ที่ศาลาฟัง"
    start: { heart_min: 1, day_min: 3 }
    offer:
      npc: "คุณครับ ข่าวในกลุ่มบอกว่าน้ำผึ้งผสมมะนาวโซดาดื่มตอนตีห้า ‘ล้างไต’ ได้ ป้าสามคนดื่มแล้วปวดท้อง ผมอยากไปอธิบายที่ศาลาตอนเย็น แต่ผมพูดต่อหน้าคนเยอะๆ ไม่เก่ง ช่วยผมหน่อยได้ไหมครับ"
      options:
        - text: "ได้{k}ภก. ต้องทำอะไรบ้าง{kq}"
          accept: true
          heart: 1
          reply: "ไปคุยกับหมอแอนก่อนครับ ขอเอกสารที่อ่านง่าย แล้วหาน้ำผึ้งมาสักขวด ผมจะใช้สาธิตว่ามันคือน้ำผึ้ง ไม่ใช่ยา คนเชื่อสิ่งที่เห็นมากกว่าที่ฟัง"
        - text: "ล้างไตจริงไหม{kq}"
          accept: true
          heart: 0
          reply: "ไตล้างตัวเองได้ทุกวันครับ ไม่ต้องการความช่วยเหลือจากโซดา ช่วยผมพูดประโยคนี้ให้ดังกว่ากลุ่ม LINE ได้ไหมครับ"
        - text: "ให้หมอแอนไปเถอะ{k}"
          heart: 0
          reply: "หมอแอนไปมาเจ็ดครั้งแล้วครับ คนเริ่มจำได้ว่าหมอมาเมื่อไหร่ก็มีเรื่องห้าม ไม่เป็นไร ผมจะพิมพ์แก้ข่าวแทน"
    steps:
      - goal: { type: talk, npc: ann }
        hint: "ไปขอเอกสารอ่านง่ายจากหมอแอนที่ รพ.สต."
        done:
          npc: "มดส่งมาเหรอจ๊ะ ดีใจจัง มดไม่ค่อยขอให้ใครช่วยหรอกนะ… เอกสารนี่หมอทำไว้แล้ว ตัวหนังสือใหญ่ๆ มีรูปไตยิ้มด้วย ป้าๆ ชอบรูปยิ้ม"
          options:
            - text: "ภก.มดบอกว่าพูดต่อหน้าคนไม่เก่ง{k}"
              heart: 1
              reply: "มดพูดเก่งนะ แค่พูดเหมือนอ่านฉลาก ถ้าหลานช่วยหัวเราะตรงมุกของมดสักสองที คนจะรู้ว่าตรงนั้นคือมุก"
            - text: "รูปไตยิ้มน่ารักดี{k}"
              heart: 1
              reply: "หมอวาดเองตอนตีหนึ่งจ้ะ ตอนนั้นข่าวปลอมเรื่องที่เจ็ดเพิ่งเด้งขึ้นมา ไตเลยยิ้มแบบเหนื่อยๆ นิดนึง"
      - goal: { type: give, npc: mod, item: honey, n: 1 }
        hint: "เอาน้ำผึ้ง 1 ขวดไปให้ภก.มดใช้สาธิต"
        done:
          npc: "ขอบคุณครับ น้ำผึ้งแท้ ผมจะยกขวดนี้ขึ้นแล้วบอกว่า ‘นี่คือน้ำผึ้ง มันอร่อย มันไม่ล้างอะไรเลย’ ผมซ้อมประโยคนี้หน้ากระจกมาสามคืนแล้ว"
          options:
            - text: "ลองพูดให้ฟังหน่อย{k}"
              heart: 1
              reply: "นี่คือน้ำผึ้ง มันอร่อย มันไม่ล้างอะไรเลย… คุณหัวเราะไหมครับ หมอแอนบอกว่าตรงนี้ควรมีคนหัวเราะ"
            - text: "ภก.จะพูดได้ดีแน่{k}"
              heart: 1
              reply: "ความน่าจะเป็นประมาณหกสิบเปอร์เซ็นต์ครับ ถ้าคุณยืนอยู่หน้าสุด เพิ่มเป็นเจ็ดสิบ"
      - goal: { type: visit, place: sala, from: "16:00", to: "18:00" }
        hint: "ไปศาลาตอนเย็น (16:00–18:00) ยืนข้างภก.มดตอนอธิบาย"
        done:
          npc: "จบแล้วครับ ป้าคนหนึ่งถามว่าน้ำผึ้งขวดนี้ขายเท่าไหร่ อีกคนถามว่าผมแต่งงานหรือยัง ไม่มีใครถามเรื่องไตเลย… แต่ตอนผมพูดว่า ‘มันไม่ล้างอะไรเลย’ มีคนหัวเราะครับ"
          options:
            - text: "{p}หัวเราะเอง{k}"
              heart: 2
              set_flag: mod_q1_laughed
              reply: "ผมรู้ครับ แต่หลังจากคุณ มีอีกสามคนหัวเราะตาม นั่นคือข้อมูลที่ผมจะใช้ ความจริงต้องมีคนหัวเราะนำ"
            - text: "ภก.ตอบป้าไหมว่าแต่งงานหรือยัง{kq}"
              heart: 1
              reply: "ผมตอบว่าข้อมูลไม่เพียงพอต่อการวินิจฉัยครับ ป้าหัวเราะดังกว่าตอนมุกไตอีก ผมไม่เข้าใจ"
    reward: { money: 150, heart: 2, items: { herbal_tea: 1 }, set_flag: mod_q1_done, line: { from: mod, text: "ข้อเท็จจริง: น้ำผึ้งมะนาวโซดาไม่ล้างไต ไตล้างตัวเองได้ทุกวัน ไม่ต้องช่วย 🫘 ใครปวดท้องหลังดื่ม แวะร้านยาได้ครับ (ภก.มด)" } }

  - id: mod_q2
    npc: mod
    title: "ขวดไม่มีเลขทะเบียน"
    desc: "ลุงสมหมายหยุดยาเบาหวานมากินยาน้ำ ‘รวมใจชาวบ้าน’ ที่แจกช่วงหาเสียง"
    start: { flag: mod_q1_done, heart_min: 3, day_min: 9 }
    offer:
      npc: "คุณครับ ลุงสมหมายหยุดยาเบาหวานมาหนึ่งสัปดาห์ กินยาน้ำ ‘รวมใจชาวบ้าน’ แทน ที่แจกตามบ้านพร้อมสติกเกอร์ผู้สมัคร ลุงไม่ฟังผม เพราะผม ‘ขายยา’ คุณไม่ได้ขายอะไร ลุงอาจฟังคุณ"
      options:
        - text: "{p}จะไปคุยกับลุงให้{k}"
          accept: true
          heart: 1
          reply: "ไปหาป้าพรก่อนครับ ป้าพรเห็นทุกอย่างในบ้านนั้น แล้วค่อยไปหาลุง ยุทธศาสตร์ผ่านคนในครอบครัว ได้ผลกว่ายุทธศาสตร์ผ่านเภสัชกร"
        - text: "ยาน้ำนั่นอันตรายเหรอ{kq}"
          accept: true
          heart: 0
          reply: "ตัวมันอาจไม่อันตรายครับ แต่การหยุดยาจริงอันตราย น้ำตาลลุงขึ้นไปสองร้อยสิบแล้ว ผมกลัวว่าจะได้เห็นสามร้อย"
        - text: "เรื่องของลุงเขา{k}"
          heart: -2
          reply: "ครับ เรื่องของลุง จนกว่าจะเป็นเรื่องของหมอแอนที่ต้องตัดนิ้วเท้า ผมจะไปเอง"
    steps:
      - goal: { type: talk, npc: porn }
        hint: "ไปคุยกับป้าพรเรื่องลุงสมหมายหยุดยา"
        done:
          npc: "ขวดนั่นเหรอ! ป้าจะเททิ้งแล้วแต่ลุงเอาไปซ่อนในโรงรถเกี่ยว ลุงบอกว่าคนแจกบอกว่าผู้สมัครกินเองทุกวัน ป้าถามว่าผู้สมัครเป็นเบาหวานไหม ลุงไม่รู้ ป้าก็ไม่รู้ ไม่มีใครรู้อะไรเลยสักอย่าง"
          options:
            - text: "ป้าช่วยพูดกับลุงหน่อย{k}"
              heart: 1
              reply: "ป้าพูดมาสามสิบปี ลุงฟังแต่ควายกับคลิป หลานไปพูดเถอะ ถ้าลุงไม่ฟัง หลานพยักหน้าให้ป้าทีนึง ป้าจะเข้าไปช่วยด้วยเสียง"
            - text: "ป้าขอขวดไปให้ภก.มดดูได้ไหม{kq}"
              heart: 1
              reply: "เอาไปเลย ป้าไปขโมยจากโรงรถให้ ถ้าลุงถาม บอกว่าผีเอาไป เดือนนี้อะไรหายก็โทษผีได้หมด"
      - goal: { type: talk, npc: sommai }
        hint: "ไปคุยกับลุงสมหมายเรื่องกลับมากินยาเบาหวาน"
        done:
          npc: "ภก.มดส่งมาใช่ไหม… ลุงรู้หรอก แต่ขวดนั่นคนแจกบอกว่าสมุนไพรไทยแท้ ลุงเป็นคนไทย ลุงก็อยากกินของไทย ผิดตรงไหนหลาน"
          options:
            - text: "ไม่ผิด{k} แต่ยาจริงลุงก็ต้องกินด้วย ไม่งั้นป้าพรต้องดูแลลุงไปทั้งชาติ"
              heart: 2
              set_flag: mod_q2_porn_card
              reply: "…ป้าพรต้องดูแลลุง… ป้าพรไม่ได้อยากดูแลลุง ป้าพรอยากด่าลุง ถ้าลุงป่วยหนักป้าจะด่าไม่ได้ ป้าจะเศร้า… ได้ๆ ลุงกินยา แต่ขวดนั่นลุงเก็บไว้ดู"
            - text: "ลุงรู้ไหมว่าในขวดมีอะไร{kq}"
              heart: 1
              set_flag: mod_q2_asked
              reply: "ไม่รู้ ฉลากเขียนว่าสมุนไพรสิบเจ็ดชนิด ลุงนับรูปบนฉลากได้สามรูป อีกสิบสี่ชนิดคงซ่อนอยู่… ลุงก็สงสัยเหมือนกันแหละ ลองกินยาภก.ก่อนก็ได้ ห้าวันนะ"
            - text: "ลุงเลือกเองแล้วกัน{k}"
              heart: -1
              reply: "ลุงก็เลือกขวดนี้แหละ ฟรีด้วย ภก.คิดเงินลุง ขวดนี้ไม่คิด ใครรักลุงมากกว่ากัน"
      - goal: { type: days, n: 3 }
        hint: "รอ 3 วัน แล้วกลับไปหาภก.มด"
        done:
          npc: "ลุงสมหมายมาวัดน้ำตาลเมื่อเช้าครับ ร้อยแปดสิบ ลดลงสามสิบ ลุงกลับมากินยาแล้ว… และผมส่งขวดนั้นไปตรวจแล็บที่จังหวัดแล้ว ผลจะออกสัปดาห์หน้า"
          options:
            - text: "ภก.คิดว่ามันคืออะไร{kq}"
              heart: 1
              reply: "ผมเดาว่าน้ำตาลผสมสีผสมกลิ่นครับ แต่ผมเป็นเภสัชกร ผมไม่เดาในที่สาธารณะ ผมรอแล็บ ส่วนในใจผมเดาไปแล้วสามรอบ"
            - text: "ดีใจด้วย{k}ภก."
              heart: 1
              reply: "ผมดีใจครับ หน้าผมอาจไม่บอก แต่ผมเพิ่งเปิดกาแฟแก้วที่สาม ครั้งแรกในรอบปี"
    reward: { money: 200, heart: 2, set_flag: mod_q2_done, line: { from: mod, text: "⚠️ ยาน้ำที่ไม่มีเลขทะเบียน อย่าใช้แทนยาที่หมอสั่ง ใครหยุดยาไปแล้ว แวะวัดน้ำตาล/ความดันฟรีที่ร้านยาได้ครับ ไม่ต้องซื้ออะไร (ภก.มด)" } }

  - id: mod_q3
    npc: mod
    title: "ร้านยาตอนสี่ทุ่ม"
    desc: "ภก.มดต้องเปิดร้านตอนดึกให้เด็กที่ไข้ขึ้น — แต่เขากลัวผี"
    start: { flag: mod_q2_done, heart_min: 5, day_min: 14 }
    offer:
      npc: "คุณครับ… บ้านหลังคลองโทรมาว่าลูกเขาไข้ขึ้นทุกคืน ยาลดไข้หมด ร้านตั้มมีแต่ยาผู้ใหญ่ คืนนี้ผมจะเปิดร้านให้ตอนสี่ทุ่ม… ผมกลัวผีครับ ผมยอมรับ มาอยู่เป็นเพื่อนผมได้ไหม"
      options:
        - text: "ได้{k} {p}จะไปเป็นเพื่อน"
          accept: true
          heart: 2
          reply: "ขอบคุณครับ ผมจะเปิดไฟทุกดวง แล้วเปิดวิทยุ ผีอาจไม่ชอบเพลงลูกทุ่ง ไม่มีงานวิจัย แต่ผมอยากเชื่อ"
        - text: "ภก.กลัวผีด้วยเหรอ{kq}"
          accept: true
          heart: 1
          reply: "กลัวครับ ผมกลัวทุกอย่างที่ไม่มีฉลาก ผีไม่มีฉลาก ไม่รู้ขนาด ไม่รู้ผลข้างเคียง มาช่วยผมนะครับ"
        - text: "ให้เขามาเอาพรุ่งนี้เช้าเถอะ{k}"
          heart: -1
          reply: "ไข้เด็กไม่รอพรุ่งนี้ครับ ผมไปคนเดียวก็ได้ ผมแค่จะเดินเร็วกว่าปกติ"
    steps:
      - goal: { type: visit, place: pharmacy, from: "21:30", to: "23:30" }
        hint: "ไปอยู่เป็นเพื่อนภก.มดที่ร้านยาตอนกลางคืน (21:30–23:30)"
        done:
          npc: "แม่เด็กมารับยาไปแล้วครับ… ผมนั่งตัวสั่นอยู่หลังเคาน์เตอร์ตลอดเวลาที่เขามา แต่มือผมนับยาไม่สั่น ผมนับสองรอบ ผมเป็นคนนับสองรอบเสมอ"
          options:
            - text: "ทำไมต้องนับสองรอบเสมอ{kq}"
              heart: 2
              set_flag: mod_q3_told
              reply: "เพราะครั้งหนึ่งผมนับรอบเดียวครับ และเกือบทำให้เด็กคนหนึ่งได้ยาเกินขนาด… คืนนี้ผมเลยต้องมาเอง ไม่ว่าจะกลัวแค่ไหน ผมติดหนี้เด็กทุกคนในตำบลไปแล้วหนึ่งครั้ง"
            - text: "ภก.กล้ากว่าที่คิดนะ{k}"
              heart: 1
              reply: "ผมไม่ได้กล้าครับ ผมแค่กลัวสิ่งหนึ่งมากกว่าอีกสิ่งหนึ่ง กลัวผีน้อยกว่ากลัวไข้เด็ก นั่นไม่ใช่ความกล้า มันคือการจัดลำดับความเสี่ยง"
      - goal: { type: give, npc: mod, item: herbal_tea, n: 1 }
        hint: "เอาชาสมุนไพรจากยายบัวไปให้ภก.มด เขายังนอนไม่หลับตั้งแต่คืนนั้น"
        done:
          npc: "ชาสมุนไพรยายบัว… ผมดื่มแล้วหลับครั้งแรกในสามวันครับ ระหว่างนอนไม่หลับ ผมเปิดอีเมลบริษัทยาที่กรุงเทพฯ อีกรอบ เขาขยายเวลาให้ตอบถึงสิ้นเดือน"
          options:
            - text: "ภก.จะไปไหม{kq}"
              heart: 1
              reply: "ผมไม่รู้ครับ คืนนั้นผมกลัวผีตัวสั่น แต่ผมรู้สึกมีประโยชน์ที่สุดในรอบปี ที่กรุงเทพฯ ผมจะไม่กลัวผี และอาจไม่รู้สึกแบบนั้นอีกเลย"
            - text: "ไม่ต้องรีบตอบ{k}"
              heart: 1
              reply: "ครับ ผมจะไม่รีบ ผมจะชั่งน้ำหนักทั้งสองข้างเหมือนชั่งผงยา ช้าๆ ไม่ให้หก"
    sold_at: { herbal_tea: house_bua }
    reward: { money: 200, heart: 2, set_flag: mod_q3_done, line: { from: mod, text: "ร้านยาเปิดถึงสองทุ่มตามปกติครับ ถ้าเด็กไข้สูงกลางดึก โทรมาได้ ผมจะเปิดให้ (ขอให้มีคนเดินมาเป็นเพื่อนด้วยจะดีมาก) 🌙" } }

  - id: mod_q4
    npc: mod
    title: "ใบอนุญาตกับคนไข้"
    desc: "ผลแล็บออกแล้ว ยาน้ำ ‘รวมใจชาวบ้าน’ คือน้ำตาลผสมสี — ภก.มดต้องเลือกว่าจะทำยังไง"
    start: { flag: mod_q3_done, heart_min: 6, day_min: 20 }
    offer:
      npc: "ผลแล็บออกแล้วครับ น้ำตาลยี่สิบเปอร์เซ็นต์ สีผสมอาหาร กลิ่นใบเตย ไม่มีสมุนไพรสักชนิด ผู้แจกจ่ายเป็นบริษัทของหลานภรรยาท่านนายก ผมถือกระดาษแผ่นเดียวที่หนักที่สุดในชีวิต"
      options:
        - text: "{p}อยู่ข้างภก.{k}"
          accept: true
          heart: 2
          reply: "ขอบคุณครับ ผมต้องการคนยืนข้างๆ และผมต้องการเงินค่าส่งตรวจซ้ำอีกขวดเพื่อยืนยัน ผมออกครึ่งหนึ่งแล้ว ร้านผมเหลือเงินพอแค่ครึ่งเดียว"
        - text: "ภก.จะทำยังไงต่อ{kq}"
          accept: true
          heart: 1
          reply: "ผมยังไม่รู้ครับ ผมมีสามทาง ทุกทางมีผลข้างเคียง ผมอยากได้ความเห็นที่สอง เหมือนก่อนผ่าตัด"
        - text: "เรื่องการเมืองอย่ายุ่งดีกว่า{k}"
          heart: -1
          reply: "ผมไม่ได้ยุ่งการเมืองครับ ผมยุ่งกับน้ำตาลในเลือดลุงสมหมาย ถ้าการเมืองมาอยู่ในขวดยา ผมก็ต้องยุ่ง"
    steps:
      - goal: { type: pay, npc: mod, n: 300 }
        hint: "ช่วยภก.มดออกค่าส่งตรวจซ้ำ 300 บาท"
        done:
          npc: "ผมออกใบเสร็จให้ครับ เขียนว่า ‘ค่าความจริง ครึ่งหนึ่ง’ ล้อเล่นครับ เขียนว่า ‘ค่าตรวจวิเคราะห์’ แต่ในใจผมเขียนแบบแรก"
          options:
            - text: "ขอใบเสร็จแบบแรกได้ไหม{kq}"
              heart: 2
              reply: "ได้ครับ ผมจะเขียนด้วยปากกาสีเขียว ฉลากสีเขียวในร้านผมแปลว่า ‘ปลอดภัย’ ผมอยากให้มันปลอดภัย"
            - text: "ไม่ต้องคืนนะ{k}"
              heart: 1
              reply: "ผมจะคืนเป็นวิตามินครับ ทีละกระปุก ทุกเดือน ไม่ว่าคุณจะต้องการหรือไม่ นั่นคือดอกเบี้ยแบบเภสัชกร"
      - goal: { type: talk, npc: may }
        hint: "ไปปรึกษาเมย์ที่ร้านกาแฟ ว่าถ้าเรื่องนี้เป็นข่าวจะเกิดอะไรขึ้น"
        done:
          npc: "ผลแล็บแบบนี้เป็นข่าวแน่นอนค่ะ แต่ภก.มดต้องรู้ไว้ ภายในสามวันหลังข่าวออก จะมีคนร้องเรียนใบอนุญาตเขา จะมีบัญชีอวตารโพสต์ว่าเขาขายยาแพง จะมีคนบอกว่าเขาอยู่ฝ่ายตรงข้าม หนูโดนมาแล้วทุกอย่าง… ฝากถามเขาว่าพร้อมไหม"
          options:
            - text: "เขาไม่พร้อมหรอก{k} แต่เขาคงทำ"
              heart: 1
              reply: "คนที่ทำทั้งที่ไม่พร้อมคือแหล่งข่าวที่ดีที่สุดค่ะ คนที่พร้อมเกินไปมักมีอะไรจะขาย"
            - text: "พี่เมย์ช่วยปกป้องเขาได้ไหม{kq}"
              heart: 1
              reply: "หนูปกป้องตัวเองยังไม่ค่อยได้เลยค่ะ แต่หนูไม่ใส่ชื่อเขาได้ ถ้าเขาต้องการ แล็บพูดแทนเขาได้"
      - goal: { type: talk, npc: mod }
        hint: "กลับไปหาภก.มด ให้เขาตัดสินใจ"
        done:
          npc: "ผมคิดครบสามทางแล้วครับ ให้ผลแล็บกับเมย์ลงข่าว ส่งเรื่องตามช่องทางราชการผ่านหมอแอนแล้วรอ หรือไม่ทำอะไรใหญ่ แค่คุยกับคนไข้ทีละคน คุณว่าทางไหนครับ"
          options:
            - text: "ให้พี่เมย์ลงข่าว{k} คนทั้งอำเภอควรรู้"
              heart: 2
              set_flag: mod_end_may
              reply: "ครับ… ผมจะใส่ชื่อจริงด้วย ถ้าแล็บพูดแทนผมได้ ผมก็ควรยืนข้างแล็บได้ ส่วนอีเมลบริษัทยา ผมตอบไปแล้วเมื่อเช้า ว่าปีนี้ผมยังไม่ไป"
            - text: "ส่งเรื่องตามช่องทาง{k} ปลอดภัยกว่า"
              heart: 1
              set_flag: mod_end_official
              reply: "ครับ หมอแอนจะส่งสาธารณสุขอำเภอ เขาจะออกเลขรับ แล้วผมจะทำแผ่นพับแจกเอง ระหว่างรอระบบ ผมจะเป็นระบบเล็กๆ ของตัวเองไปก่อน"
            - text: "ภก.รับงานกรุงเทพฯ ไปเถอะ{k} ไม่ต้องเจ็บตัว"
              heart: 0
              set_flag: mod_end_city
              reply: "…ครับ ผมจะส่งผลแล็บให้หมอแอนเก็บไว้ แล้วไปกรุงเทพฯ สิ้นเดือน ปลากัดพาราเซตามอลผมฝากตั้มเลี้ยง เขาตื่นตอนกลางคืน มันก็ตื่นตอนกลางคืน"
    reward: { money: 300, heart: 2, set_flag: mod_q4_done, line: { from: mod, text: "ผลตรวจยาน้ำไม่มีทะเบียนที่แจกในตำบล: น้ำตาล สี กลิ่น ไม่มีสมุนไพร 🧪 ใครมีขวดอยู่ นำมาแลกยาสามัญฟรีที่ร้านยาได้ครับ (ภก.มด)" } }
