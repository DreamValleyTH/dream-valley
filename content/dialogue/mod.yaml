# เภสัชกรมด — convos + quests (ตัวรอง 🖤)
convos:
  # ===== react =====
  - id: mod_r_meet
    topic: react
    once: true
    when: { not_flag: met_mod }
    npc: "สวัสดีครับ คุณคือหลานยายเพียร ผมจำได้ ยายคุณซื้อยาความดันกับผมทุกเดือน กินครบทุกเม็ด เป็นคนไข้ที่ดีที่สุดในประวัติร้าน"
    set_flag: met_mod
    options:
      - text: "ยายเป็นความดันเหรอ{kq}"
        heart: 1
        reply: "ครับ สิบสองปี คุมได้ดีมาก ยายบอกผมว่า ‘ถ้าหยุดยา มดจะเสียลูกค้า’ ผมไม่แน่ใจว่าเป็นมุกหรือห่วงผมจริงๆ"
        next:
          - text: "ห่วงจริงแหละ{k}"
            heart: 1
            reply: "ผมคิดแบบนั้นครับ ยายเอากล้วยมาฝากทุกครั้ง ผมไม่เคยได้ของจากคนไข้คนอื่น นอกจากใบสั่งยาที่อ่านไม่ออก"
          - text: "{p}อาจจะเป็นความดันด้วยไหม{kq}"
            heart: 1
            reply: "พันธุกรรมมีผลครับ แต่แกงเค็มมีผลมากกว่า นั่งวัดฟรีได้ ผมจะทำหน้าเฉยๆ ไม่ว่าตัวเลขจะออกมาเท่าไหร่"
      - text: "ร้านเงียบจัง{k}"
        heart: 0
        reply: "ร้านยาที่เงียบคือร้านยาที่ดีครับ แปลว่าวันนี้ไม่มีใครป่วยหนัก หรือทุกคนไปเชื่อกลุ่ม LINE แทนผม"
      - text: "ไม่ได้ป่วยอะไร{k} แค่แวะ"
        heart: 0
        reply: "ดีครับ ลูกค้าที่ไม่ป่วยคือลูกค้าที่ผมชอบที่สุด แต่ทำเงินให้ผมน้อยที่สุด"

  - id: mod_r_fainted
    topic: react
    when: { fainted_recent: true }
    npc: "หมอแอนส่งประวัติมาให้ผมแล้วครับ เมื่อคืนคุณหมดสติข้างทาง แรงเหลือครึ่ง วันนี้ห้ามยกของหนัก ผมพูดในฐานะเภสัชกร และในฐานะคนที่ไม่อยากเจอคุณที่ รพ.สต. อีก"
    options:
      - text: "{p}ไม่เป็นไรแล้ว{k}"
        heart: 0
        reply: "คนไข้ทุกคนพูดประโยคนี้ครับ ผมจดสถิติไว้ ประโยคนี้แม่นยำเท่ากับพยากรณ์อากาศช่วงสงกรานต์"
      - text: "มียาบำรุงไหม{kq}"
        heart: 1
        reply: "มีครับ ชื่อว่าข้าวสองมื้อกับนอนก่อนสามทุ่ม ราคาถูกมาก แต่ไม่ค่อยมีใครซื้อ"
        next:
          - text: "ขอซื้อ{k}"
            heart: 2
            reply: "ขายครับ ฟรี แต่ผมจะถามทุกครั้งที่เจอว่ากินครบไหม คิดเป็นค่าบริการทางสังคม"
          - text: "ภก.ขำไม่เป็นเลยนะ{kq}"
            heart: 1
            reply: "ผมขำเป็นครับ แค่หน้าไม่บอก ตอนนี้ข้างในผมหัวเราะอยู่ เบาๆ เหมือนเสียงตู้เย็น"

  - id: mod_r_snake
    topic: react
    once: true
    when: { flag: met_snake }
    npc: "ได้ข่าวว่าเจองูที่ทางเดิน ผมขอแจ้งไว้ก่อนครับ ร้านผมไม่มีเซรุ่มแก้พิษงู ถ้าโดนกัด อย่าวิ่ง อย่าดูด อย่าขันชะเนาะ ไป รพ.สต. ทันที"
    options:
      - text: "ยายบัวมียาทาแผลงูนะ{k}"
        heart: 0
        reply: "ผมเคารพยายบัวครับ ยายทาได้ แต่ทาแล้วไปโรงพยาบาลด้วย ยาของยายดีต่อใจ เซรุ่มดีต่อเลือด เราต้องการทั้งสองอย่าง"
      - text: "แล้วร้านภก.มีอะไรเกี่ยวกับงูบ้าง{kq}"
        heart: 1
        reply: "มีผ้าพันแผลยืดกับความกังวลครับ อย่างหลังผมมีเยอะมาก แจกฟรี"

  - id: mod_r_well_dry
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "ตั้งแต่บ่อแห้ง คนมาซื้อผงเกลือแร่กับยาแก้ท้องเสียเพิ่มสามเท่าครับ น้ำที่เหลือในบ่อขุ่นมาก ผมกำลังมีกำไรจากเรื่องที่ผมไม่อยากให้เกิด"
    options:
      - text: "ภก.รู้ไหมว่าบ่อแห้งเพราะอะไร{kq}"
        heart: 1
        reply: "ผมไม่ใช่นักธรณีวิทยาครับ แต่ผมนับได้ว่าคนท้องเสียเริ่มเยอะขึ้นสัปดาห์เดียวกับที่รถเจาะบาดาลเข้าไซต์ สถิติไม่ใช่หลักฐาน แต่มันชี้นิ้วได้"
        next:
          - text: "ภก.บอกพี่เมย์ได้นะ{k}"
            heart: 1
            reply: "ผมให้ตัวเลขยอดขายยาได้ครับ ไม่ระบุชื่อคนไข้ ข้อมูลคนป่วยเป็นของคนป่วย ไม่ใช่ของข่าว"
          - text: "แล้วชาวบ้านควรทำยังไง{kq}"
            heart: 1
            reply: "ต้มน้ำก่อนดื่มครับ ไฟฟรีกว่ายาเสมอ และอย่าเชื่อข่าวในกลุ่มว่าใส่สารส้มแล้วดื่มได้เลย สารส้มทำให้ใส ไม่ได้ทำให้สะอาด"
      - text: "ภก.ได้กำไรก็ดีแล้วนี่{kq}"
        heart: -1
        reply: "กำไรจากท้องเสียของคนรู้จัก ผมไม่นับเป็นกำไรครับ ผมนับเป็นหนี้ที่ระบบติดตำบล"

  - id: mod_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "ตั้งแต่ข่าวผีไซต์บาดาล ยานอนหลับขายดีขึ้นครับ ผมไม่ขายให้ใครที่ไม่มีใบสั่ง ผมแนะนำให้ปิดกลุ่ม LINE ก่อนนอนแทน ได้ผลกว่าและไม่มีผลข้างเคียง"
    options:
      - text: "ภก.เชื่อเรื่องผีไหม{kq}"
        heart: 1
        reply: "ผมเชื่อในความกลัวครับ ความกลัวทำให้ความดันขึ้นจริง ใจสั่นจริง นอนไม่หลับจริง ผีจะจริงไหมผมไม่รู้ แต่อาการจริงทุกอย่าง"
      - text: "คนงานบริษัทมาซื้อยาด้วยไหม{kq}"
        heart: 1
        reply: "มาครับ ซื้อยาดม ยาหม่อง และถามว่ามีพระเครื่องขายไหม ผมบอกว่าร้านยาขายแต่ของที่มีงานวิจัยรองรับ เขาเลยไปวัดในอำเภอ"
        next:
          - text: "วัดในอำเภอมีงานวิจัยเหรอ{kq}"
            heart: 1
            reply: "มีครับ วิจัยว่าคนกลัวจ่ายได้เท่าไหร่ ผลวิจัยแม่นมาก ราคาพระเครื่องรุ่นกันผีขึ้นสามเท่าในสัปดาห์เดียว"
          - text: "ภก.ใจร้ายจัง{k}"
            heart: 0
            reply: "ผมให้ยาดมฟรีไปหนึ่งขวดครับ ใจร้ายของผมมีส่วนลด"

  - id: mod_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ผมเอาน้ำจากถัง CSR ของบริษัทไปให้หมอแอนส่งตรวจ ผลออกมาว่าน้ำสะอาดครับ ถังสะอาด น้ำสะอาด สิ่งเดียวที่ไม่สะอาดคือที่มาของความจำเป็นต้องแจกถัง"
    options:
      - text: "ภก.พูดแบบนี้ในที่ประชุมได้ไหม{kq}"
        heart: 1
        reply: "ผมพูดไปแล้วครับ นายกตอบว่า ‘เรารับทราบ’ ผมตอบว่า ‘ผมก็รับทราบว่าท่านรับทราบ’ จากนั้นไม่มีใครพูดอะไร เป็นสามนาทีที่ซื่อสัตย์ที่สุดของการประชุม"
      - text: "ได้ถังฟรีก็ดีกว่าไม่ได้{k}"
        heart: 0
        reply: "จริงครับ เหมือนยาแก้ปวดดีกว่าไม่มียา แต่ถ้ามีคนเหยียบเท้าคุณอยู่ ยาแก้ปวดไม่ใช่คำตอบแรก"

  - id: mod_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ผู้สมัครคนหนึ่งสัญญาว่าจะสร้างโรงพยาบาลในตำบล ผมจดลงสมุดแล้วครับ เป็นคำสัญญาโรงพยาบาลครั้งที่เจ็ด ผมตั้งใจจะทำกราฟ"
    options:
      - text: "กราฟอะไร{kq}"
        heart: 1
        reply: "จำนวนคำสัญญาโรงพยาบาลเทียบกับจำนวนเตียงที่ได้จริงครับ เส้นแรกขึ้นทุกสี่ปี เส้นที่สองเป็นเส้นตรงที่ศูนย์ เป็นกราฟที่ดูง่ายที่สุดในอาชีพผม"
        next:
          - text: "เอาไปให้พี่เมย์ลงข่าวสิ{k}"
            heart: 1
            reply: "ผมคิดอยู่ครับ แต่เมย์บอกว่ากราฟเส้นตรงที่ศูนย์ไม่ได้รับความสนใจ คนอยากเห็นกราฟที่มีขึ้นมีลง ความจริงที่นิ่งๆ ไม่เป็นข่าว"
          - text: "ภก.ลงสมัครเองเลยสิ{kq}"
            heart: 1
            reply: "ผมสัญญาได้อย่างเดียวคือยาลดไข้มีในร้านทุกวัน ซึ่งคงไม่ชนะการเลือกตั้ง แต่ผมทำได้จริง"
      - text: "ผู้สมัครแจกยาสามัญประจำบ้านด้วยนะ{k}"
        heart: 1
        reply: "ผมเห็นแล้วครับ ล็อตนั้นหมดอายุเดือนหน้า ผมจะเตรียมป้ายรับคืนยาหมดอายุไว้หน้าร้าน ฟรี เป็นโครงการของผมเอง ไม่มีป้ายใหญ่กว่าตัวโครงการ"

  - id: mod_r_end_may
    topic: react
    once: true
    when: { flag: mod_end_may }
    npc: "ข่าวของเมย์ออกแล้วครับ ‘ยาน้ำสมุนไพรแจกฟรีช่วงหาเสียง ที่แท้น้ำตาลผสมสี’ มีคนส่งเรื่องร้องเรียนใบอนุญาตผมไปที่สภาเภสัชฯ สองฉบับ ผมกำลังเขียนคำชี้แจง ผมรู้สึก… ดีกว่าที่คิดครับ"
    options:
      - text: "ภก.กลัวไหม{kq}"
        heart: 2
        reply: "กลัวครับ มือผมสั่นตอนพิมพ์ แต่ลุงสมหมายกลับมากินยาเบาหวานแล้ว ระดับน้ำตาลลดลงสามสิบ ผมเอาตัวเลขนั้นติดไว้ข้างจอ อ่านทุกครั้งที่มือสั่น"
      - text: "{p}จะไปเป็นพยานให้{k}"
        heart: 2
        reply: "ขอบคุณครับ ผมไม่เคยมีพยานมาก่อน ปกติผมเป็นพยานให้คนอื่นว่าเขากินยาครบหรือเปล่า"

  # ===== news =====
  - id: mod_n_soda
    topic: news
    npc: "ข่าวปลอมสัปดาห์นี้ครับ ‘ดื่มน้ำบาดาลลึกสองร้อยเมตรทำให้อายุยืน’ โพสต์จากบัญชีชื่อ ‘รักษ์น้ำ รักษ์ชุมชน’ รูปโปรไฟล์เป็นดอกบัว สมัครเมื่อวาน"
    options:
      - text: "บัญชีอวตารบริษัทเหรอ{kq}"
        heart: 1
        reply: "ผมไม่กล่าวหาใครครับ ผมแค่สังเกตว่าบัญชีนี้กดไลก์ทุกโพสต์ของคุณธนา และไม่เคยกดไลก์หมอแอนเลย ดอกบัวมีรสนิยมชัดเจน"
        next:
          - text: "{p}จะช่วยแก้ข่าวในกลุ่ม{k}"
            heart: 2
            reply: "ขอบคุณครับ พิมพ์สั้นๆ นะครับ คนอ่านข้อความยาวไม่จบ แต่อ่านข่าวปลอมจบทุกบรรทัด ผมยังไม่เข้าใจกลไกนี้"
          - text: "ทำไมคนเชื่อง่ายจัง{kq}"
            heart: 1
            reply: "เพราะข่าวปลอมให้ความหวังครับ ความจริงให้แค่ข้อมูล คนเหนื่อยอยากได้ความหวังมากกว่าข้อมูล ผมเข้าใจ แต่ไม่ยอม"
      - text: "อายุยืนจริงหรือเปล่า{kq}"
        heart: 0
        reply: "น้ำลึกสองร้อยเมตรอาจมีแร่ธาตุบางชนิดเกินมาตรฐานครับ ดื่มแล้วอาจอายุยืนพอจะได้เห็นผลข้างเคียง"

  - id: mod_n_avatar_drink
    topic: news
    npc: "มีขวดยาน้ำสมุนไพรชื่อ ‘รวมใจชาวบ้าน’ แจกตามบ้าน ฉลากเขียนว่ารักษาเบาหวาน ความดัน ไต และ ‘เสริมดวง’ ไม่มีเลขทะเบียน มีแต่สติกเกอร์ยิ้มของผู้สมัครคนหนึ่ง"
    options:
      - text: "เสริมดวงด้วยเหรอ{kq}"
        heart: 1
        reply: "ครับ เป็นสรรพคุณข้อเดียวที่ผมพิสูจน์ไม่ได้ว่าไม่จริง ผู้ผลิตฉลาดมาก ใส่ข้อที่ตรวจไม่ได้ไว้ท้ายสุด"
      - text: "อันตรายไหม{kq}"
        heart: 1
        reply: "ตัวขวดอาจไม่อันตรายครับ ที่อันตรายคือคนที่หยุดยาจริงเพราะเชื่อขวดนี้ ผมเจอสองคนแล้วในสัปดาห์นี้"
        next:
          - text: "ใครบ้าง{kq}"
            heart: 0
            reply: "ผมบอกชื่อไม่ได้ครับ แต่คนหนึ่งมีรถเกี่ยวข้าว และมีภรรยาที่ด่าเสียงดังที่สุดในหมู่บ้าน คุณไม่ได้ยินจากผมนะครับ"
          - text: "ต้องแจ้งใคร{kq}"
            heart: 1
            reply: "แจ้งสาธารณสุขอำเภอครับ เขาจะรับเรื่อง ออกเลขรับ และส่งต่อจังหวัด ถึงตอนนั้นการเลือกตั้งน่าจะจบไปแล้วสองครั้ง"

  - id: mod_n_bp_machine
    topic: news
    npc: "รพ.สต. ได้งบซื้อเครื่องวัดความดันใหม่สองเครื่องครับ ป้ายโครงการกว้างสามเมตร เครื่องกว้างฝ่ามือ ผมวัดแล้ว ป้ายใหญ่กว่าเครื่องประมาณยี่สิบเท่า"
    options:
      - text: "ป้ายแพงกว่าเครื่องไหม{kq}"
        heart: 1
        reply: "ผมไม่เห็นใบเสร็จครับ แต่ป้ายมีรูปนายกยิ้ม ส่วนเครื่องไม่มีรูปใครยิ้ม ผมว่าเครื่องคงไม่อยากยิ้มด้วย"
      - text: "ดีแล้วนี่{kq} ได้เครื่องใหม่"
        heart: 0
        reply: "ดีครับ ผมไม่ได้บ่นเครื่อง ผมบ่นสัดส่วน ถ้าเป็นยา ผมเรียกว่าใส่สารแต่งสีมากกว่าตัวยา"

  - id: mod_n_wednesday
    topic: news
    npc: "หมอดูในกลุ่ม LINE ประกาศว่าเดือนนี้ห้ามกินยาวันพุธ เพราะดาวพุธถอยหลัง ป้าสามคนมาถามผมแล้วว่าวันพุธต้องกินยาย้อนหลังไหม"
    options:
      - text: "ภก.ตอบว่าไง{kq}"
        heart: 1
