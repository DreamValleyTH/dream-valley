# หมอแอน — พยาบาล รพ.สต. (อบอุ่น ไม่มีตลกร้าย) · ตัวหลัก 34–40 บท
convos:
  # ===== react =====
  - id: ann_r_meet
    topic: react
    once: true
    when: { not_flag: met_ann }
    npc: "สวัสดีค่ะ หลานยายเพียรใช่ไหมคะ แอนจำหน้าได้จากรูปบนตู้เย็นยาย… ยายติดรูปหลานไว้ข้างตารางกินยา"
    set_flag: met_ann
    options:
      - text: "ยายติดรูป{p}ไว้ด้วยเหรอ{kq}"
        heart: 1
        reply: "ติดไว้ตรงกลางเลยค่ะ ยายบอกว่ามองรูปหลานแล้วจำได้ว่าต้องกินยาความดัน… แอนว่าวิธีนี้ได้ผลกว่าตารางอีก"
        next:
          - text: "ยายกินยาตรงเวลาไหม{kq}"
            heart: 1
            reply: "ตรงกว่าคนไข้ทั้งตำบลค่ะ ยายถือตลับยามาให้แอนนับทุกเดือน แล้วก็ถือมะม่วงมาด้วยทุกครั้ง แอนไม่เคยได้ปฏิเสธ"
          - text: "{p}ไม่รู้เลยว่ายายป่วย"
            heart: 1
            reply: "ยายไม่อยากให้ใครห่วงค่ะ… ไม่เป็นไรนะคะ ตอนนี้หลานมาอยู่แล้ว ย้ายสิทธิ์บัตรทองมาที่นี่ด้วยนะ แอนจะได้ดูแลต่อ"
      - text: "หมอแอนใช่ไหม{kq} ป้าแต๋วพูดถึงบ่อย"
        heart: 0
        reply: "พยาบาลค่ะ ไม่ใช่หมอ… แต่เรียกหมอก็ได้ค่ะ แก้มาเจ็ดปีไม่มีใครเปลี่ยน แอนยอมแล้ว"
      - text: "{p}แข็งแรงดี ไม่ต้องมาหาหรอก{k}"
        heart: 0
        reply: "ดีใจค่ะ แต่คนที่บอกว่าแข็งแรงดี มักเป็นคนที่แอนเจอตอนตีสองนะคะ… ล้อเล่นค่ะ ยินดีที่ได้รู้จัก"

  - id: ann_r_fainted
    topic: react
    when: { fainted_recent: true }
    npc: "{player}… นั่งลงก่อนค่ะ แอนขอวัดความดันหน่อย เมื่อคืนตัวเย็นมากเลยนะ แอนห่มผ้าให้สามผืน"
    options:
      - text: "ขอบคุณ{k} จำอะไรไม่ได้เลย"
        heart: 1
        reply: "ไม่ต้องจำค่ะ จำแค่ว่าคืนนี้กลับบ้านก่อนสามทุ่ม… แล้วก็กินข้าวเช้าด้วย แอนเห็นท้องร้องตอนวัดชีพจร"
        next:
          - text: "ได้ยินด้วยเหรอ{kq}"
            heart: 1
            reply: "ได้ยินชัดกว่าหัวใจอีกค่ะ แอนเลยรู้ว่าไม่เป็นอะไรมาก คนหิวยังมีแรงร้อง"
          - text: "ค่ารักษาเท่าไหร่{kq}"
            heart: 0
            reply: "ระบบหักไปแล้วค่ะ แอนขอโทษนะ… แต่น้ำขิงแก้วนี้ไม่อยู่ในระบบ ดื่มเถอะค่ะ"
      - text: "ผีมันมาจากไหนไม่รู้{k}"
        heart: 0
        reply: "คนที่มานอนตรงนี้พูดประโยคนี้ทุกคนค่ะ แอนจดไว้ในสมุดแล้ว ยังไม่มีใครรู้สักคน"
      - text: "ไม่เป็นไรหรอก{k} ไปทำงานต่อได้"
        heart: -1
        reply: "แรงเหลือครึ่งเดียวนะคะ ไปได้ แต่ไปช้าๆ… ถ้าเป็นลมกลางแปลงผักอีก แอนจะให้ป้าแต๋วเฝ้าทั้งวันเลย"

  - id: ann_r_thana
    topic: react
    once: true
    when: { flag: story_thana_visit }
    npc: "ได้ยินว่าคุณธนาไปที่ฟาร์มยายแล้วใช่ไหมคะ… แอนไม่ได้จะถามเรื่องที่ดินนะ แอนถามว่านอนหลับไหมคะเมื่อคืน"
    options:
      - text: "ไม่ค่อยหลับ{k} คิดทั้งคืน"
        heart: 1
        reply: "เป็นปกติค่ะ ตัวเลขล้านกว่าบาทมันดังกว่าเสียงจิ้งหรีด… ก่อนนอนลองจดสิ่งที่คิดลงกระดาษ ให้กระดาษมันคิดแทนสักคืน"
      - text: "หลับดี{k} {p}ไม่สนเขาหรอก"
        heart: 1
        reply: "ดีมากค่ะ แอนอยากได้สูตรนี้ไปแจกคนไข้ความดัน หลายคนได้จดหมายจากบริษัทแล้วความดันขึ้นทั้งบ้าน"
      - text: "หมอแอนว่าควรขายไหม{kq}"
        heart: 0
        reply: "แอนตอบไม่ได้ค่ะ แอนรู้แต่ว่าที่ดินยาย ยายเดินทุกเช้าจนเข่าดี… แต่ละคนก็มีคำตอบของตัวเองนะคะ"

  - id: ann_r_meeting1
    topic: react
    once: true
    when: { flag: story_meeting1 }
    npc: "ประชุมที่ศาลาเมื่อวาน แอนไปตั้งโต๊ะวัดความดันหน้าศาลาค่ะ ได้คนไข้ใหม่สามคน… แล้วก็วัดกำนันตอนหลับไปหนึ่งที"
    options:
      - text: "วัดตอนหลับได้ด้วยเหรอ{kq}"
        heart: 1
        reply: "ได้สิคะ ความดันกำนันตอนหลับดีกว่าตอนตื่นเยอะเลย แอนว่าจะแนะนำให้หลับทุกประชุม… ไม่สิ ไม่แนะนำค่ะ"
      - text: "แล้วหมอแอนโหวตอะไร{kq}"
        heart: 1
        reply: "แอนอยากได้ระบบน้ำค่ะ น้ำสะอาดลดท้องเสียได้มากกว่ายาทุกตัวในตู้ แต่ขอแอบบอกแค่ {player} นะคะ"
        next:
          - text: "{p}ก็โหวตระบบน้ำ{k}"
            heart: 2
            reply: "จริงเหรอคะ! งั้นเราเป็นพวกเดียวกัน… คำนี้ฟังดูเป็นการเมืองจัง แอนขอเปลี่ยนเป็นทีมเดียวกันค่ะ"
          - text: "{p}ว่าถนนก็สำคัญนะ{kq}"
            heart: 0
            reply: "สำคัญค่ะ รถพยาบาลก็วิ่งถนน… แอนแค่หวังว่าถนนเส้นใหม่จะไม่มีหลุมตรงหน้า รพ.สต. อีก"
      - text: "นายกฯ พูดนานไหม{kq}"
        heart: 0
        reply: "นานจนแอนวัดความดันครบสามสิบคนค่ะ แล้วท่านก็ยังไม่ถึงประเด็น แอนเลยวัดรอบสองให้คนเดิม"

  - id: ann_r_well
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "สามวันนี้คนท้องเสียมา รพ.สต. เก้าคนค่ะ ทุกคนใช้น้ำก้นบ่อ… บ่อบ้านยายหลานยังมีน้ำอยู่ไหมคะ"
    options:
      - text: "ยังมี{k} แต่ลดลงเยอะ"
        heart: 1
        reply: "ต้มก่อนดื่มนะคะ ต้มให้เดือดจริงๆ ไม่ใช่แค่อุ่น แล้วถ้าบ้านไหนแถวนั้นขาดน้ำ บอกแอนด้วย แอนมีน้ำดื่มสำรองไว้แจกผู้สูงอายุ"
        next:
          - text: "{p}ช่วยขนไปแจกได้นะ{kq}"
            heart: 2
            reply: "ขอบคุณค่ะ… แอนกำลังคิดว่าจะขี่มอเตอร์ไซค์ขนกี่รอบ ทีนี้ลดได้ครึ่งหนึ่งแล้ว"
          - text: "ต้มทุกครั้งเลยเหรอ{kq} เปลืองแก๊ส"
            heart: 0
            reply: "เปลืองแก๊สถูกกว่าเปลืองน้ำเกลือค่ะ… แอนพูดตามตรงนะคะ ไม่ได้ขู่"
      - text: "เขาว่าเพราะบริษัทสูบน้ำ จริงไหม{kq}"
        heart: 0
        reply: "แอนไม่รู้ค่ะ แอนรู้แค่ตัวเลขคนป่วย… แอนจดไว้ทุกวัน ส่งรายงานไปอำเภอแล้ว ใครอยากรู้ ตัวเลขอยู่ตรงนี้"
      - text: "บ่อ{p}ไม่เป็นไร{k}"
        heart: 0
        reply: "ดีค่ะ งั้นช่วยเตือนคนอื่นด้วยนะคะ แอนพูดคนเดียว เสียงไม่ดังเท่าผู้ใหญ่สมศักดิ์"

  - id: ann_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "เมื่อคืนคนงานบริษัทวิ่งมาเคาะ รพ.สต. สองคนค่ะ ตัวสั่น บอกเห็นผู้หญิงยืนบนกองท่อ… แอนให้นอนพักทั้งคืน"
    options:
      - text: "เขาเห็นผีจริงเหรอ{kq}"
        heart: 1
        reply: "แอนไม่รู้ค่ะ แต่ชีพจรเขาเต้นร้อยสามสิบจริง ความกลัวน่ะของจริงเสมอ ไม่ว่าผีจะจริงไหม"
        next:
          - text: "หมอแอนไม่กลัวเหรอ{kq}"
            heart: 1
            reply: "กลัวค่ะ… แอนเปิดไฟทุกดวงแล้วนั่งถักโครเชต์ข้างเตียงเขาจนเช้า ได้ถุงยาดมเพิ่มอีกใบเลย"
          - text: "ยายบัวว่าผีไม่ชอบคนดูดน้ำ"
            heart: 1
            reply: "ยายบัวก็บอกแอนแบบนั้นค่ะ… แอนไม่เถียงยายหรอก แอนแค่เพิ่มว่าคนก็ไม่ชอบเหมือนกัน"
      - text: "เขาลาออกกันหรือยัง{kq}"
        heart: 0
        reply: "คนหนึ่งขอใบรับรองแพทย์ไปลาออกค่ะ แอนเขียนได้แค่ว่า ‘นอนไม่หลับ’ แอนเขียนว่าผีไม่ได้ ไม่มีช่องให้กรอก"
      - text: "แกล้งทำมากกว่ามั้ง{kq}"
        heart: -1
        reply: "แอนว่าไม่นะคะ ไม่มีใครแกล้งทำแล้วเหงื่อท่วมเสื้อสามตัวได้หรอกค่ะ"

  - id: ann_r_may
    topic: react
    once: true
    when: { flag: helped_may }
    npc: "เมย์มาขอยานอนหลับค่ะ แอนไม่ให้ แต่ให้นั่งคุยครึ่งชั่วโมงแทน… {player} ไปช่วยเธอถ่ายรูปตอนกลางคืนใช่ไหมคะ"
    options:
      - text: "ใช่{k} เป็นห่วงเธอเหมือนกัน"
        heart: 2
        reply: "แอนก็ห่วงค่ะ ทั้งสองคนเลย… ครั้งหน้าก่อนออกไปตอนดึก บอกแอนสักคำได้ไหมคะ แอนจะเปิดไฟหน้า รพ.สต. รอ"
      - text: "หมอแอนรู้ได้ไง{kq}"
        heart: 0
        reply: "รองเท้าหลานเปื้อนดินแดงแถวหลังรั้วบริษัทค่ะ ดินแบบนั้นมีที่เดียว… แอนไม่ได้สืบนะคะ แอนแค่ล้างแผลคนในตำบลมาเจ็ดปี"
      - text: "อย่าบอกใครนะ{kq}"
        heart: 1
        reply: "ความลับคนไข้แอนเก็บเก่งที่สุดในตำบลค่ะ ป้าแต๋วลองถามแอนมาสามปี ยังไม่ได้อะไรสักเรื่อง"

  - id: ann_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "บริษัทจะแจกถังน้ำพร้อมโลโก้ใช่ไหมคะ… แอนไม่ได้ว่าอะไรนะ ถังน้ำมีประโยชน์ แค่แอนอยากให้มีฝาปิดด้วย"
    options:
      - text: "ทำไมต้องมีฝา{kq}"
        heart: 1
        reply: "ไม่มีฝา ยุงลายวางไข่ค่ะ เดือนหน้าแอนจะได้คนไข้ไข้เลือดออกพร้อมโลโก้บริษัท… แอนพูดไปขำไปแต่ไม่ขำนะคะ"
        next:
          - text: "งั้น{p}ช่วยไปบอกเขาให้{k}"
            heart: 2
            reply: "ขอบคุณค่ะ ฝาเดียวช่วยได้หลายคน… บอกด้วยนะคะว่าแอนไม่ได้รับถัง แอนรับแค่คำแนะนำ"
          - text: "เอาผ้าปิดก็ได้มั้ง{kq}"
            heart: 1
            reply: "ได้ค่ะ ผ้ามุ้งเก่าตัดเป็นวงแล้วรัดหนังยาง ใช้ได้ดีเลย ยายเพียรก็ทำแบบนี้กับโอ่งทุกใบ"
      - text: "หมอแอนอยู่ฝ่ายไหน{kq}"
        heart: 0
        reply: "ฝ่ายคนไข้ค่ะ ทุกครั้งเลย… ชาวบ้านทะเลาะกันแล้วความดันขึ้นทั้งสองฝ่าย แอนวัดให้ทั้งสองฝ่ายเหมือนกัน"

  - id: ann_r_snake
    topic: react
    once: true
    when: { flag: met_snake }
    npc: "ได้ยินว่าเจองูที่ฟาร์ม! ไม่โดนกัดใช่ไหมคะ ขอดูขาหน่อย… ไม่ต้องอายค่ะ แอนดูขามาทั้งตำบลแล้ว"
    options:
      - text: "ไม่โดน{k} มันเลื้อยหนีไปก่อน"
        heart: 1
        reply: "ดีค่ะ งูมันกลัวเรามากกว่าที่เรากลัวมัน… ถ้าวันไหนโดนกัด อย่ากรีด อย่าดูด อย่าขันชะเนาะแน่น นิ่งไว้แล้วมาหาแอน"
      - text: "ยายบัวให้ยาทาแผลงูมาแล้ว"
        heart: 0
        reply: "ยาของยายทาแล้วเย็นดีค่ะ แต่ถ้าโดนงูพิษจริงต้องมาที่นี่ด้วยนะคะ ยายบัวกับแอนตกลงกันไว้แล้ว ยายรู้"
      - text: "จำสีมันได้ด้วย{k} เขียวๆ"
        heart: 1
        reply: "เก่งมากค่ะ จำสีได้ช่วยแอนเยอะ… แต่งูเขียวมีหลายแบบนะคะ ถ่ายรูปไว้ดีที่สุด ถ่ายจากไกลๆ นะ"

  - id: ann_r_lottery
    topic: react
    once: true
    when: { flag: bought_lottery }
    npc: "เห็นถือสลากมาด้วย… แอนไม่ว่านะคะ แอนแค่สังเกตว่าวันหวยออก คนมาวัดความดันสูงขึ้นทุกงวด"
    options:
      - text: "ซื้อเล่นๆ ใบเดียว{k}"
        heart: 1
        reply: "ใบเดียวพอค่ะ ใบเดียวความดันยังปกติ… ลุงสมหมายซื้อสิบใบ แอนต้องวัดให้สองรอบ"
      - text: "ถ้าถูกจะซื้อเครื่องวัดความดันให้ รพ.สต."
        heart: 2
        reply: "ตายแล้ว แอนจะลุ้นด้วยเลยค่ะ… ไม่สิ พยาบาลลุ้นหวยไม่ได้ แอนจะแค่ภาวนาเงียบๆ"
      - text: "เป็นเรื่องส่วนตัว{k}"
        heart: -1
        reply: "ขอโทษค่ะ แอนติดสังเกตคนจนเป็นนิสัย… แอนเงียบแล้วค่ะ"

  - id: ann_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ป้ายหาเสียงขึ้นทับป้ายรณรงค์ไข้เลือดออกของแอนหมดเลยค่ะ เหลือแต่คำว่า ‘ยุง’ โผล่อยู่ใต้หน้าผู้สมัคร"
    options:
      - text: "งั้นผู้สมัครก็ช่วยรณรงค์ไปในตัว"
        heart: 1
        reply: "แอนก็คิดอย่างนั้นค่ะ ถือว่าเขาเป็นอาสาสมัครกันยุงคนใหม่… แค่เขาไม่รู้ตัว"
      - text: "เดี๋ยว{p}ช่วยติดป้ายใหม่ให้{k}"
        heart: 2
        reply: "ขอบคุณค่ะ ติดที่ต้นไม้ก็ได้ เสาไฟเต็มหมดแล้ว… ติดสูงๆ นะคะ ป้ายเขาขึ้นเร็วกว่ายุงอีก"
      - text: "หมอแอนจะเลือกใคร{kq}"
        heart: 0
        reply: "แอนจะฟังว่าใครพูดถึงรถรับส่งผู้ป่วยค่ะ… ยังไม่มีใครพูดถึงเลย แอนเลยยังไม่มีคนในใจ"

  - id: ann_r_stays
    topic: react
    once: true
    when: { flag: ann_q4_done }
    npc: "แอนตื่นมาเช้านี้แล้วรู้สึกเบา… ไม่ได้เบาเพราะน้ำหนักนะคะ เบาเพราะตัดสินใจแล้ว ขอบคุณที่ช่วยแอนคิดนะคะ"
    options:
      - text: "แอนตัดสินใจเองนะ{p}แค่ฟัง"
        heart: 1
        reply: "ฟังก็คือช่วยค่ะ… คนไข้หลายคนหายครึ่งหนึ่งตั้งแต่มีคนฟัง แอนเพิ่งรู้ว่าพยาบาลก็เหมือนกัน"
        next:
          - text: "งั้นคราวหน้า{p}ฟังอีกนะ"
            heart: 1
            reply: "จองไว้แล้วนะคะ ทุกวันศุกร์ห้าโมงเย็น ร้านก๋วยเตี๋ยวพี่หน่อย แอนเลี้ยงน้ำใบเตย"
          - text: "ขอค่าฟังเป็นยาดมสักหลอด"
            heart: 1
            reply: "ได้ค่ะ ยาดมฟรีตลอดชีพเลย… แอนเพิ่งรู้ว่าแอนให้ยาดมฟรีทุกคนอยู่แล้ว งั้นแถมกลิ่นใหม่ให้นะคะ"
      - text: "ยังจะคิดถึงเงินเดือนสามเท่าไหม{kq}"
        heart: 0
        reply: "คิดค่ะ ตอนจ่ายค่าไฟ… แต่ตอนตาเผือกเดินมาส่งข้าวเหนียวให้ แอนไม่คิดเลยค่ะ"

  # ===== news =====
  - id: ann_n_sticker
    topic: news
    npc: "สติกเกอร์ ‘บ้านปลอดลูกน้ำ’ ของ อสม. หายไปสิบสองแผ่นค่ะ… เจอแล้ว อยู่บนหัวเตียงน้องโอ๊ต เขาสะสม"
    options:
      - text: "แล้วบ้านน้องโอ๊ตปลอดลูกน้ำไหม{kq}"
        heart: 1
        reply: "ไม่ปลอดค่ะ! มีกะลาสามใบหลังบ้าน แอนเลยทำสัญญากับเขา คว่ำกะลาหนึ่งใบได้สติกเกอร์หนึ่งแผ่น ตอนนี้เขาคว่ำของทั้งซอย"
        next:
          - text: "ฉลาดมาก{k} ได้ผู้ช่วยเพิ่ม"
            heart: 1
            reply: "ใช่ไหมคะ ผู้ช่วยอายุแปดขวบ ค่าจ้างเป็นสติกเกอร์ คุ้มที่สุดในงบ รพ.สต."
          - text: "{p}ขอสติกเกอร์บ้างได้ไหม{kq}"
            heart: 1
            reply: "ได้ค่ะ คว่ำกะลาที่ฟาร์มยายก่อนนะคะ แอนจะไปตรวจเอง… ยายเพียรมีกะลาเยอะมาก ยายเก็บไว้ตักน้ำ"
      - text: "เด็กก็ชอบสะสมแบบนี้แหละ{k}"
        heart: 1
        reply: "ใช่ค่ะ ปีหน้าแอนจะทำสติกเกอร์ให้น่ารักน้อยลง… ไม่สิ ทำให้น่ารักขึ้นแล้วแลกด้วยการคว่ำกะลาดีกว่า"

  - id: ann_n_fakenews
    topic: news
    npc: "เช้านี้ในกลุ่มแชร์ว่า ‘ต้มตะไคร้ใบเตยดื่มตอนตีสาม เบาหวานหายในเจ็ดวัน’ แชร์ไปสี่สิบรอบแล้วค่ะ"
    options:
      - text: "ทำไมต้องตีสาม{kq}"
        heart: 1
        reply: "แอนก็อยากรู้ค่ะ… น่าจะเพราะตีสามไม่มีใครตื่นมาเถียง น้ำตะไคร้ดื่มได้นะคะ หอมดี แต่ยาเบาหวานต้องกินต่อ"
      - text: "ใครแชร์คนแรก{kq}"
        heart: 0
        reply: "บัญชีชื่อ ‘สุขภาพดีวิถีไทย99’ ค่ะ ไม่มีรูปหน้า แอนตามไปดู โพสต์อื่นขายหม้อทอดไร้น้ำมัน"
      - text: "{p}จะช่วยแชร์โพสต์แก้ให้{k}"
        heart: 2
        reply: "ขอบคุณค่ะ! แอนเขียนสั้นๆ แล้ว มีรูปการ์ตูนตะไคร้ใส่แว่นด้วย ป้าแต๋วบอกน่ารักเลยแชร์ต่อ… คราวนี้แชร์ถูกอัน"

  - id: ann_n_lice
    topic: news
    npc: "อาทิตย์นี้มีเหาในห้อง ป.3 ค่ะ แอนเพิ่งไปตรวจหัวเด็กมายี่สิบคน… แล้วครูเต้ยก็เกาหัวตลอดการตรวจ"
    options:
      - text: "ครูเต้ยติดด้วยเหรอ{kq}"
        heart: 1
        reply: "ไม่ติดค่ะ ครูเกาเพราะคิดไปเอง แอนตรวจให้แล้ว สะอาดมาก… แต่ครูก็ยังเกาอยู่ดี จิตวิทยาค่ะ"
        next:
          - text: "ฟังแล้ว{p}ก็คันหัวเลย"
            heart: 1
            reply: "เห็นไหมคะ! มันติดต่อทางการเล่า ไม่ใช่ทางเส้นผม… ไม่ต้องห่วงค่ะ"
          - text: "แล้วรักษายังไง{kq}"
            heart: 1
            reply: "สระด้วยยาเหา หวีเสนียดทุกวัน ซักปลอกหมอนตากแดดค่ะ ใบน้อยหน่าที่ยายบัวใช้ก็ได้ผล แต่อย่าให้เข้าตานะคะ"
      - text: "เด็กๆ อายไหม{kq}"
        heart: 1
        reply: "แอนบอกเด็กว่าเหาเลือกหัวคนสะอาดค่ะ เด็กเลยภูมิใจกันใหญ่ น้องมิวถามว่าทำไมเหาไม่เลือกหนู"

  - id: ann_n_heatstroke
    topic: news
    when: { time: noon }
    npc: "เมื่อวานมีคนเป็นลมแดดที่ป้ายรถเมล์ค่ะ ลุงเชิดจอดรถรอ ไม่ยอมออกจนแอนมาถึง… ช้าไปสิบนาทีเป็นครั้งแรกในชีวิตลุง"
    options:
      - text: "ลุงเชิดเสียสถิติเลย"
        heart: 1
        reply: "ลุงบอกว่าไม่นับค่ะ เพราะรถยังไม่ได้ออก… แอนว่าลุงคือคนที่ใจดีที่สุดที่ยังทำหน้าดุได้"
      - text: "คนที่เป็นลมเป็นไงบ้าง{kq}"
        heart: 1
        reply: "ปลอดภัยค่ะ เป็นคนงานบริษัทที่ยืนรอรถตั้งแต่สิบเอ็ดโมง แอนเลยขอผู้ใหญ่ทำหลังคาป้ายรถเมล์… ผู้ใหญ่ย้ำว่าจะเสนอ สามรอบ"
        next:
          - text: "เสนอแล้วจะได้เมื่อไหร่{kq}"
            heart: 0
            reply: "แอนไม่ถามต่อแล้วค่ะ ระหว่างนี้แอนเอาร่มสนามเก่าของ รพ.สต. ไปปักไว้ก่อน ใครยืมได้ ขอแค่คืน"
          - text: "เอาร่มไปปักไว้ก่อนดีไหม{kq}"
            heart: 2
            reply: "คิดเหมือนแอนเลยค่ะ! พรุ่งนี้ช่วยแอนแบกได้ไหมคะ ร่มมันหนักกว่าที่คิด"

  - id: ann_n_car
    topic: news
    npc: "รถ รพ.สต. เสียค่ะ ยางแบนสองเส้น บอลบอกพรุ่งนี้เสร็จ… วันนี้ถ้ามีคนป่วยหนัก แอนต้องขอยืมรถชาวบ้าน"
    options:
      - text: "ถ้าจำเป็นใช้ของ{p}ได้เลย{k}"
        heart: 2
        reply: "ขอบคุณนะคะ แอนจดชื่อไว้ในสมุดแล้ว… สมุด ‘คนที่แอนโทรหาได้ตอนตีสอง’ ตอนนี้มีเจ็ดชื่อค่ะ"
      - text: "ยางแบนสองเส้นพร้อมกันได้ไง{kq}"
        heart: 0
        reply: "ตกหลุมหน้าวัดค่ะ หลุมเดิมที่ทุกคนรู้จัก… มันอยู่ตรงนั้นนานจนแอนเรียกชื่อมันได้แล้ว"
      - text: "ทำไมไม่ซื้อรถเพิ่ม{kq}"
        heart: 0
        reply: "แอนเขียนโครงการขอไปสามปีแล้วค่ะ… ปีนี้ได้ตอบกลับมาว่า ‘อยู่ระหว่างการพิจารณา’ แอนถือว่าใกล้แล้ว"

  - id: ann_n_elderly
    topic: news
    npc: "วันพระนี้แอนจะไปตรวจผู้สูงอายุที่ศาลาวัดค่ะ พระอาจารย์ให้ใช้ทั้งศาลา ยายบัวขอเป็นคิวแรก แล้วก็ขอเป็นคนตรวจคนอื่นต่อ"
    options:
      - text: "ยายบัวจะตรวจอะไร{kq}"
        heart: 1
        reply: "ตรวจขวัญค่ะ ยายบอกว่าแอนตรวจตัว ยายตรวจขวัญ ใครขวัญอ่อนยายผูกข้อมือให้… คนมาเยอะขึ้นเท่าตัวเลย"
      - text: "{p}ไปช่วยยกเก้าอี้ได้นะ{kq}"
        heart: 2
        reply: "ดีมากค่ะ เณรต้นอาสาแล้ว แต่ยกได้ทีละตัว แล้วนับดังๆ ทุกตัว… มีคนช่วยอีกคน เณรจะได้นับเร็วขึ้น"
        next:
          - text: "แล้วต้องเตรียมอะไรอีก{kq}"
            heart: 1
            reply: "น้ำดื่ม ใบเตยต้ม แล้วก็ความอดทนค่ะ ตาเผือกจะถามเรื่องควายทุกปี แอนตอบไม่ได้สักข้อ"
          - text: "ขอวัดความดันด้วยคน"
            heart: 1
            reply: "ได้ค่ะ คิวสุดท้ายนะคะ… ล้อเล่น คนหนุ่มสาวมาตรวจแอนดีใจที่สุด ไม่ค่อยมีใครมา"

  # ===== advice =====
  - id: ann_a_spray
    topic: advice
    npc: "ถ้าจะฉีดยาฆ่าแมลงในแปลง ใส่หน้ากาก ถุงมือ เสื้อแขนยาว แล้วยืนเหนือลมนะคะ… ปีที่แล้วมีคนฉีดทวนลม มานอนที่นี่ทั้งคืน"
    options:
      - text: "{p}ไม่ค่อยใช้ยาฆ่าแมลง{k}"
        heart: 2
        reply: "ดีที่สุดเลยค่ะ กล้าที่สหกรณ์มีน้ำหมักไล่แมลง กลิ่นแรงหน่อย แต่ไม่ต้องมาหาแอน"
      - text: "ทวนลมคือยังไง{kq}"
        heart: 1
        reply: "คือลมพัดยาเข้าหน้าเราค่ะ ลองยกนิ้วชุบน้ำลายดูลมก่อน ยายเพียรทำแบบนี้ทุกครั้ง แอนเห็นแล้วนึกว่ายายกำลังให้พรแปลงผัก"
      - text: "ใส่หมดแบบนั้นร้อนตายเลย"
        heart: 0
        reply: "ร้อนค่ะ แต่ร้อนแล้วหายตอนอาบน้ำ พิษสารเคมีไม่หายตอนอาบน้ำนะคะ… ฉีดตอนเช้าตรู่ แดดยังไม่แรง"

  - id: ann_a_back
    topic: advice
    when: { heart_min: 1 }
    npc: "เห็นแบกฟืนเมื่อวาน… ขอแนะนำหน่อยนะคะ ย่อเข่าลง หลังตรง ยกด้วยขา ไม่ใช่ด้วยหลัง หลังมีอันเดียว เปลี่ยนไม่ได้"
    options:
      - text: "ยกด้วยขาแล้วขาเมื่อยแทน"
        heart: 1
        reply: "ขาเมื่อยพักคืนเดียวหายค่ะ หลังพังพักเดือนเดียวยังไม่หาย… แอนเลือกให้ขาเมื่อยดีกว่า"
      - text: "ทำมาแบบนี้ตลอดไม่เห็นเป็นไร"
        heart: 0
        reply: "ลุงสมหมายก็พูดประโยคเดียวกันค่ะ ปีที่แล้ว ตอนนี้ลุงมาประคบร้อนทุกวันพุธ"
      - text: "แบกครึ่งเดียว เดินสองรอบดีไหม{kq}"
        heart: 2
        reply: "ดีที่สุดเลยค่ะ ได้ออกกำลังด้วย หลังได้พักด้วย… ถ้าคนทั้งตำบลคิดแบบนี้ แอนว่างวันพุธแน่"

  - id: ann_a_water
    topic: advice
    when: { time: noon }
    npc: "จิบน้ำหรือยังคะ ปากแห้งแบบนั้นแอนเห็นจากตรงนี้เลย… พกขวดไว้ข้างแปลงนะคะ จิบทุกครั้งที่ย้ายแถว"
    options:
      - text: "ขอบคุณ{k} ลืมทุกที"
        heart: 1
        reply: "ไม่เป็นไรค่ะ ลืมกันทุกคน… ผูกขวดไว้กับจอบเลยก็ได้ ยายเพียรผูกกระบอกไม้ไผ่ไว้กับด้ามเสียม"
      - text: "ดื่มกาแฟเย็นแทนได้ไหม{kq}"
        heart: 0
        reply: "กาแฟทำให้ปัสสาวะบ่อยค่ะ น้ำในตัวยิ่งออก… ดื่มได้ค่ะ แต่ดื่มน้ำเปล่าตามสักแก้ว นะคะ"

  - id: ann_a_sleep
    topic: advice
    when: { time: evening }
    npc: "คืนนี้เข้านอนเร็วหน่อยนะคะ แอนสังเกตว่าคนที่นอนดึกตอนเช้าทำงานช้ากว่า แล้วก็หงุดหงิดกับไก่ง่ายกว่า"
    options:
      - text: "หงุดหงิดกับไก่ด้วยเหรอ{kq}"
        heart: 1
        reply: "ลุงสมหมายด่าไก่ทุกเช้าที่นอนดึกค่ะ วันที่นอนเร็วลุงทักไก่ว่าอรุณสวัสดิ์… แอนสังเกตมาสองเดือน"
      - text: "นอนไม่หลับทำไงดี{kq}"
        heart: 1
        reply: "วางโทรศัพท์ไกลๆ เตียงค่ะ ไกลจนต้องลุกเดินไปหยิบ… ส่วนใหญ่ขี้เกียจลุกแล้วก็หลับไปเอง"
        next:
          - text: "ถ้าคิดเรื่องงานกรุงเทพฯ ล่ะ{kq}"
            heart: 2
            reply: "อันนั้นยากกว่าค่ะ… ลองนับลมหายใจแทนนับงาน หายใจเข้าสี่ ค้างไว้สี่ ออกหก แอนใช้ทุกคืนที่คิดถึงคนไข้"
          - text: "นับควายตาเผือกก็ได้มั้ง"
            heart: 1
            reply: "ได้ค่ะ ตาเผือกมีแปดตัว นับจบเร็วไป… นับซ้ำก็ได้นะคะ ควายไม่ว่า"

  - id: ann_a_clinicfee
    topic: advice
    npc: "เคล็ดลับนะคะ ก่อนค่ำเอาเงินสดไปฝากธนาคารไว้ ถ้าโดนผีจับมานอนที่นี่ ค่ารักษามันคิดจากเงินในกระเป๋าค่ะ"
    options:
      - text: "หมอแอนบอกความลับระบบเลยเหรอ{kq}"
        heart: 1
        reply: "ไม่ใช่ความลับค่ะ เขียนอยู่ในประกาศหน้าห้อง ตัวหนังสือเล็กมาก… แอนแค่อ่านให้ฟังแบบตัวใหญ่"
      - text: "ตู้ ATM อยู่กลางแจ้ง ตอนกลางคืนก็มีผีอีก"
        heart: 1
        reply: "นั่นแหละค่ะ ไปฝากตอนกลางวัน… แอนเจอคนโดนผีจับหน้าตู้ ATM สองคนแล้ว ถือบัตรค้างไว้ในมือทั้งคืน"
      - text: "{p}ไม่ค่อยมีเงินสดอยู่แล้ว{k}"
        heart: 0
        reply: "งั้นไม่ต้องห่วงเรื่องค่ารักษาค่ะ… แต่ห่วงเรื่องข้าวเย็นแทนนะคะ แวะกินก๋วยเตี๋ยวพี่หน่อยก่อนกลับ"

  # ===== smalltalk =====
  - id: ann_s_para
    topic: smalltalk
    npc: "พาราแมว รพ.สต. ขึ้นไปนอนบนตาชั่งน้ำหนักทั้งเช้าค่ะ คนไข้มาชั่งทีไรได้น้ำหนักเพิ่มสี่กิโล"
    options:
      - text: "งั้นทุกคนอ้วนขึ้นเท่ากันหมด"
        heart: 1
        reply: "ใช่ค่ะ ป้าแต๋วตกใจมาก บอกว่าจะเลิกกินโอเลี้ยง… แอนเลยยังไม่บอกเรื่องพาราค่ะ ขอให้ป้าเลิกไปก่อนสักอาทิตย์"
        next:
          - text: "หมอแอนแอบใช้แมวรักษาคนเลย"
            heart: 1
            reply: "แมวบำบัดค่ะ ฟรีด้วย ไม่ต้องเบิกงบ… แต่พาราขอค่าตอบแทนเป็นปลาทูวันละตัว"
          - text: "บอกป้าเถอะ{k} สงสาร"
            heart: 1
            reply: "พรุ่งนี้บอกค่ะ… ถ้าป้าเลิกได้จริงอาทิตย์นี้ แอนจะบอกด้วยว่าป้าเก่งแค่ไหน"
      - text: "พาราอายุเท่าไหร่แล้ว{kq}"
        heart: 1
        reply: "สามขวบค่ะ เกิดวันเดียวกับที่ รพ.สต. ได้ตู้เย็นใหม่ แอนจำวันได้เพราะมันนอนในกล่องตู้เย็นเลย"

  - id: ann_s_crochet
    topic: smalltalk
    npc: "แอนถักโครเชต์ได้ใบที่สามแล้วค่ะ ใบนี้กลมกว่าเดิม… ยายจันทร์มาดูแล้วบอกว่า ‘ดีขึ้นแล้วนะหมอ จากแย่มากเป็นแย่’"
    options:
      - text: "ยายจันทร์ชมแล้วนะนั่น"
        heart: 1
        reply: "แอนก็คิดอย่างนั้นค่ะ! ยายจันทร์ชมใครว่า ‘แย่’ ถือว่าให้กำลังใจที่สุดแล้ว"
      - text: "ถักให้{p}ใบนึงได้ไหม{kq}"
        heart: 2
        reply: "ได้ค่ะ แต่ต้องรอใบที่ห้านะคะ ใบที่สี่จะเบี้ยวอยู่… แอนอยากให้ใบที่ดีที่สุด"
      - text: "ทำไมถึงหัดถัก{kq}"
        heart: 1
        reply: "ตอนนั่งเฝ้าคนไข้กลางคืนค่ะ มือว่างแล้วใจคิดมาก… มือยุ่งแล้วใจเงียบลง แอนว่าเป็นยาที่ไม่ต้องสั่ง"

  - id: ann_s_lime
    topic: smalltalk
    npc: "ต้นมะนาวในกระถางของแอนออกลูกแรกแล้วค่ะ! ลูกเดียว ลูกเท่าลูกแก้ว แอนยังไม่กล้าเด็ด"
    options:
      - text: "จะเก็บไว้ทำอะไร{kq}"
        heart: 1
        reply: "ไม่รู้เลยค่ะ… บีบใส่น้ำได้สามหยด แอนอาจจะแค่มองมันไปเรื่อยๆ ก็ได้ มองแล้วรู้สึกว่าเราดูแลอะไรรอด"
      - text: "เดี๋ยว{p}สอนใส่ปุ๋ยให้{k}"
        heart: 2
        reply: "จริงเหรอคะ! แอนรดน้ำอย่างเดียวมาสองปี… ต้นมันอดทนกับแอนมาก"
      - text: "ซื้อมะนาวที่ตลาดถูกกว่านะ{kq}"
        heart: 0
        reply: "ถูกกว่าค่ะ แต่มะนาวที่ตลาดไม่ได้รอแอนกลับบ้านทุกเย็นนะคะ"

  - id: ann_s_noodle
    topic: smalltalk
    when: { time: evening }
    npc: "เย็นนี้แอนจะไปกินก๋วยเตี๋ยวพี่หน่อยค่ะ สั่งน้ำใสทุกครั้ง พี่หน่อยใส่พริกให้ทุกครั้ง แอนตักออกทุกครั้ง"
    options:
      - text: "ทำไมไม่บอกพี่หน่อยว่าไม่เอาพริก{kq}"
        heart: 1
        reply: "บอกมาสามปีแล้วค่ะ พี่หน่อยบอกว่า ‘ไม่ใส่พริกมันไม่มีวิญญาณ’… แอนเลยตักวิญญาณออกเองทุกวัน"
      - text: "ไปด้วยกันไหม{kq}"
        heart: 2
        reply: "ไปค่ะ! แอนเลี้ยงนะคะ… ไม่ต้องแย่งจ่าย แอนเพิ่งได้เงินเวรดึก มันเป็นเงินที่อยากใช้กับเรื่องดีๆ"
        next:
          - text: "งั้นรอบหน้า{p}เลี้ยงคืน"
            heart: 1
            reply: "ตกลงค่ะ แอนจดไว้แล้ว… แอนจดเก่งกว่าลุงจำรัสนิดหนึ่งนะ แต่อย่าบอกลุง"
          - text: "ขอพริกของแอนด้วย{k}"
            heart: 1
            reply: "ได้เลยค่ะ! ในที่สุดพริกที่แอนตักออกก็มีบ้านแล้ว"

  - id: ann_s_ferris
    topic: smalltalk
    npc: "ปีนี้งานกาชาด แอนจะขอเพื่อนเฝ้าเต็นท์แทนสักชั่วโมงค่ะ… แอนอยากขึ้นชิงช้าสวรรค์ แต่กลัวความสูง"
    options:
      - text: "กลัวแล้วจะขึ้นทำไม{kq}"
        heart: 1
        reply: "เพราะทุกปีแอนมองมันจากเต็นท์ค่ะ เห็นคนข้างบนหัวเราะ… แอนอยากรู้ว่ามองลงมาเห็นเต็นท์แอนตัวเล็กแค่ไหน"
        next:
          - text: "ขึ้นด้วยกันไหม{kq} จะได้ไม่กลัว"
            heart: 2
            reply: "จริงนะคะ! ถ้าแอนบีบแขนแรงไปก็ขอโทษไว้ก่อนเลย… แอนบีบแรงมาก แอนวัดความดันมาเจ็ดปี"
          - text: "เดี๋ยว{p}เฝ้าเต็นท์ให้"
            heart: 2
            reply: "ไม่ได้ค่ะ ถ้ามีคนเป็นลมคุณจะทำไง… ก็ได้ค่ะ ยาดมอยู่กล่องซ้าย พลาสเตอร์กล่องขวา ทุกอย่างอยู่ในกล่องขวา"
      - text: "ข้างบนลมแรงนะ{kq}"
        heart: 0
        reply: "อย่าพูดสิคะ… แอนจะเตรียมยาดมขึ้นไปสองหลอด"

  - id: ann_r_gran_donation
    topic: react
    once: true
    when: { flag: jamrat_donate_car }
    npc: "ลุงจำรัสเอาเงินหนึ่งหมื่นสองพันมาใส่กองทุนรถค่ะ… ในชื่อยายเพียร ลุงไม่ยอมบอกว่าทำไม บอกแค่ว่า ‘ยายเพียรจ่ายมานานแล้ว ลุงแค่ส่งต่อ’"
    options:
      - text: "ยายช่วยลุงไว้เมื่อนานมาแล้ว{k}"
        heart: 2
        reply: "อย่างนั้นเหรอคะ… แอนไม่ถามต่อนะคะ เรื่องของลุง แต่แอนจะเขียนชื่อยายเพียรไว้ข้างประตูรถ คู่กับชื่อตาบุญ สองคนที่แอนอยากให้นั่งไปด้วยทุกเที่ยว"
        next:
          - text: "ยายคงเขินแย่"
            heart: 1
            reply: "ยายเขินแน่ค่ะ… แต่ยายเอาข้าวต้มมาวางหน้า รพ.สต. ตั้งหลายปีโดยไม่บอกแอน แอนขอเอาคืนยายบ้างสักครั้ง"
          - text: "ยอดกองทุนตอนนี้เท่าไหร่{kq}"
            heart: 1
            reply: "สองหมื่นสี่พันกว่าค่ะ… ลุงจำรัสนับให้สามรอบ แอนนับเองอีกรอบ แล้วนั่งยิ้มกับตัวเลขอยู่คนเดียวนานเลยค่ะ"
      - text: "เงินเยอะเลยนะ{kq}"
        heart: 0
        reply: "เยอะค่ะ… แต่ที่แอนตกใจไม่ใช่ตัวเลข แอนตกใจที่ลุงจำรัสร้องไห้ตอนยื่นซอง ลุงบอกว่าเหงื่อออกที่ตา"

  # ===== self =====
  - id: ann_f_why
    topic: self
    npc: "มีคนถามแอนว่าทำไมเป็นพยาบาล… ตอนเด็กแอนอยากเป็นแม่ค้าขายลูกชิ้นทอดค่ะ จริงๆ นะ"
    options:
      - text: "แล้วเปลี่ยนใจเพราะอะไร{kq}"
        heart: 1
        reply: "ยายแอนป่วย แอนนั่งดูพยาบาลที่อำเภอเช็ดตัวให้ยายช้าๆ เหมือนยายเป็นคนสำคัญที่สุด… แอนอยากทำให้คนอื่นรู้สึกแบบนั้นบ้าง"
        next:
          - text: "ยายแอนหายไหม{kq}"
            heart: 1
            reply: "หายค่ะ ยายอยู่ถึงแปดสิบแปด… แล้วยังบ่นว่าแอนเย็บแผลสวยน้อยกว่ายายเย็บผ้า"
          - text: "แอนทำแบบนั้นได้แล้วนะ"
            heart: 2
            reply: "ขอบคุณค่ะ… วันไหนแอนเหนื่อย แอนจะนึกถึงประโยคนี้นะคะ"
      - text: "ขายลูกชิ้นก็ดีนะ{kq} ได้กินด้วย"
        heart: 1
        reply: "ใช่ค่ะ แต่แอนคงกินหมดก่อนขายได้… เดี๋ยวนี้แอนเลยแค่ซื้อลูกชิ้นทอดหน้าโรงเรียนไม้ละห้าบาท แล้วนึกถึงความฝันเก่า"

  - id: ann_f_midwife
    topic: self
    when: { heart_min: 3 }
    npc: "ยายแอนเป็นหมอตำแยค่ะ ทำคลอดเด็กในตำบลนี้มาหลายรุ่น… ยายเคยบอกว่าตอนทำคลอดแม่หลาน ยายเพียรยืนถือตะเกียงให้ทั้งคืน"
    options:
      - text: "ยายเพียรอยู่ตอน{p}เกิดด้วยเหรอ{kq}"
        heart: 2
        reply: "ไม่ใช่ตอนหลานค่ะ ตอนแม่หลานเกิด… ยายแอนบอกว่ายายเพียรมือนิ่งที่สุด ตะเกียงไม่สั่นเลยสักครั้ง แต่ตอนเด็กร้อง ยายเพียรร้องไห้ก่อนใคร"
        next:
          - text: "เล่าอีกได้ไหม{kq}"
            heart: 1
            reply: "แอนรู้แค่นั้นค่ะ… แต่ยายบัวน่าจะรู้มากกว่า ไปถามยายบัวนะคะ ถือหมากไปด้วย ยายจะเล่ายาว"
          - text: "{p}ไม่เคยรู้เรื่องนี้เลย"
            heart: 1
            reply: "ในตำบลนี้มีเรื่องของยายเพียรอีกเยอะค่ะ ยายไม่เล่าเอง เลยต้องให้คนอื่นค่อยๆ เล่าแทน"
      - text: "หมอตำแยยังมีอยู่ไหม{kq}"
        heart: 0
        reply: "ไม่มีแล้วค่ะ ตอนนี้ไปคลอดโรงพยาบาลอำเภอกันหมด ปลอดภัยกว่า… แต่บางคืนแอนก็คิดถึงมือที่ไม่ต้องใช้ใบสั่ง"

  - id: ann_f_lost
    topic: self
    when: { heart_min: 5 }
    npc: "มีคนไข้คนหนึ่งค่ะ ตาบุญ ชอบมาวัดความดันแล้วเล่ามุกเดิมทุกครั้ง… คืนหนึ่งแอนส่งตาไปอำเภอไม่ทัน รถมีคันเดียว"
    options:
      - text: "ไม่ใช่ความผิดแอนนะ"
        heart: 2
        reply: "แอนรู้ค่ะ ทุกคนบอกแบบนั้น… แต่แอนยังจำมุกตาได้ทั้งมุก วันไหนเล่าได้โดยไม่ร้องไห้ แอนจะเล่าให้ฟังนะคะ"
      - text: "แอนเล่าให้ใครฟังบ้างหรือยัง{kq}"
        heart: 1
        reply: "ยายบัวคนเดียวค่ะ… ตอนนี้ก็สองคนแล้ว ขอบคุณที่ไม่รีบพูดอะไรนะคะ"
        next:
          - text: "มุกของตาบุญว่าไง{kq}"
            heart: 2
            reply: "ตาถามว่า ‘หมอ ความดันผมเท่าไหร่’ แอนบอก ‘ร้อยสี่สิบ’ ตาบอก ‘ถูกกว่าค่ารถเมล์ไปอำเภออีก’… เห็นไหมคะ ไม่ขำเลย แต่แอนหัวเราะทุกครั้ง"
          - text: "เลยอยากได้รถอีกคันใช่ไหม{kq}"
            heart: 1
            reply: "ใช่ค่ะ… แอนไม่อยากให้ใครต้องรอรถอีก แค่นั้นเอง"
      - text: "พยาบาลก็ต้องชินกับเรื่องแบบนี้ไหม{kq}"
        heart: 0
        reply: "ไม่ชินค่ะ ถ้าวันไหนแอนชิน แอนคงต้องเลิกเป็นพยาบาลแล้ว"

  - id: ann_f_scared
    topic: self
    when: { heart_min: 4, time: evening }
    npc: "จะบอกความลับนะคะ… ทุกคืนที่มีคนเคาะประตูตอนห้าทุ่ม แอนนับหนึ่งถึงสามก่อนเปิดทุกครั้ง เผื่อไม่ใช่คน"
    options:
      - text: "ถ้าไม่ใช่คนจะทำไง{kq}"
        heart: 1
        reply: "แอนก็ไม่รู้ค่ะ… แต่แอนเตรียมยาดมไว้ในกระเป๋าเสื้อ ถ้าผีเป็นลม แอนพร้อม"
      - text: "แอนกล้ามากเลยนะ"
        heart: 2
        reply: "ไม่กล้าค่ะ แอนแค่กลัวคนข้างนอกจะหนาวมากกว่ากลัวผี… สองอย่างนี้สู้กันทุกคืน คนข้างนอกชนะทุกที"
      - text: "ผีจะมาเคาะประตูทำไม{kq}"
        heart: 0
        reply: "ยายบัวบอกว่าผีบางตัวมาขอส่วนบุญค่ะ… แอนเลยวางข้าวต้มไว้หน้าประตูหนึ่งถ้วยทุกวันพระ ไม่ได้บอกใครนะคะ"

  - id: ann_f_offer
    topic: self
    when: { heart_min: 7, not_flag: ann_q4_done }
    npc: "เพื่อนแอนที่เรียนด้วยกันได้เป็นหัวหน้าพยาบาลโรงพยาบาลใหญ่แล้วค่ะ… เขาถามว่าแอนยังวัดความดันตาเผือกอยู่อีกเหรอ"
    options:
      - text: "แอนตอบว่าไง{kq}"
        heart: 1
        reply: "แอนตอบว่า ‘ใช่ แล้วตาเผือกให้ข้าวเหนียวด้วย’… เพื่อนหัวเราะ แอนก็หัวเราะ แต่กลับบ้านมาแอนนั่งนิ่งนานเลย"
        next:
          - text: "แอนอิจฉาเขาเหรอ{kq}"
            heart: 1
            reply: "นิดหนึ่งค่ะ… แต่ถ้าแอนเป็นเขา ตาเผือกจะวัดกับใคร คิดแค่นี้แอนก็นอนหลับได้"
          - text: "งานแอนไม่ได้เล็กกว่าเขาเลย"
            heart: 2
            reply: "… ขอบคุณค่ะ แอนจะจำไว้ แล้วจะบอกตาเผือกด้วยว่ามีคนชม"
      - text: "เพื่อนแอนพูดไม่ดีเลย"
        heart: 0
        reply: "เขาไม่ได้คิดร้ายหรอกค่ะ แค่ไม่เคยเห็นตาเผือกยิ้มตอนความดันลด… ถ้าเห็น เขาจะเข้าใจ"

  # ===== others =====
  - id: ann_o_bua
    topic: others
    npc: "ยายบัวโทรมาตอนหกโมงเช้า บอกว่าฝันเห็นแอนใส่ชุดขาวยืนริมคลอง ยายให้แอนผูกข้อมือด่วน… แอนบอกยายว่าแอนใส่ชุดขาวทุกวันค่ะ"
    options:
      - text: "แล้วไปผูกไหม{kq}"
        heart: 1
        reply: "ผูกค่ะ ยายสบายใจ แอนก็สบายใจ… แล้วยายแถมยาหม่องมาให้อีกกระปุก ข้อมือแอนตอนนี้หอมไพลทั้งวัน"
      - text: "ยายบัวห่วงแอนมากนะ"
        heart: 1
        reply: "ยายห่วงทุกคนค่ะ แต่แอนแอบดีใจที่ยายโทรหาแอนก่อนป้าแต๋ว… ปกติป้าแต๋วรู้ก่อนเสมอ"
      - text: "ฝันก็แค่ฝัน{k}"
        heart: 0
        reply: "แอนก็คิดอย่างนั้นค่ะ แต่ข้อมือที่ผูกแล้ว แอนไม่แกะนะ… พยาบาลก็มีใจนะคะ"

  - id: ann_o_mod
    topic: others
    npc: "เภสัชมดส่งข้อความมาตอนตีหนึ่งว่า ‘หมอแอนนอนได้แล้ว’… เขารู้ได้ไงว่าแอนยังไม่นอน แล้วเขาเองทำไมยังไม่นอน"
    options:
      - text: "สองคนนี้นอนดึกเหมือนกันเลย"
        heart: 1
        reply: "ร้านขายยากับ รพ.สต. ไฟเปิดสองหลังสุดท้ายในตำบลค่ะ… กับร้าน 24 ชม. ของตั้ม แต่ตั้มไม่นับ ตั้มทำงาน"
      - text: "เภสัชมดห่วงแอนนะ{kq}"
        heart: 1
        reply: "ห่วงแบบเภสัชค่ะ ข้อความถัดไปเขาส่งวิธีกินเมลาโทนินมาครบทุกข้อ พร้อมผลข้างเคียงสามบรรทัด"
        next:
          - text: "แอนตอบเขาว่าไง{kq}"
            heart: 1
            reply: "แอนตอบว่า ‘เภสัชก็นอนได้แล้ว’… แล้วเราก็ไม่มีใครนอนสักคน จนไก่ลุงสมหมายขัน"
          - text: "ส่งยาดมไปแทนคำขอบคุณสิ"
            heart: 1
            reply: "ดีค่ะ! เขาจะได้คิดค่าลิขสิทธิ์มุกน้อยลง… ไม่รู้สิคะ เขาคงคิดเพิ่ม"
      - text: "สองคนนี้ทำงานหนักไป"
        heart: 0
        reply: "จริงค่ะ… ถ้าเห็นเราสองคนนั่งหลับหน้าร้าน อย่าปลุกนะคะ ปล่อยไว้สักสิบนาที"

  - id: ann_o_somsak
    topic: others
    npc: "ผู้ใหญ่สมศักดิ์ยอมมาวัดความดันแล้วค่ะ! มีเงื่อนไขว่าแอนต้องย้ำค่าความดันให้ฟังสามรอบ"
    options:
      - text: "ความดันผู้ใหญ่เท่าไหร่{kq}"
        heart: 0
        reply: "อันนี้ความลับคนไข้ค่ะ… บอกได้แค่ว่าแอนย้ำสามรอบแล้วผู้ใหญ่เงียบไปนาน แล้วถามว่าเลิกน้ำปลาพริกได้ไหม"
      - text: "หมอแอนใช้วิธีของผู้ใหญ่กับผู้ใหญ่เลย"
        heart: 1
        reply: "ใช่ค่ะ ย้ำอีกครั้งนะคะ ย้ำอีกครั้ง… อุ๊ย ติดมาแล้วค่ะ อยู่ตำบลนี้นานไป"
      - text: "ทำไมผู้ใหญ่ไม่ยอมมาตั้งแต่แรก{kq}"
        heart: 1
        reply: "ท่านกลัวว่าถ้าป่วย จะต้องเกษียณก่อนวัย… แอนบอกว่าความดันสูงยังประกาศหอกระจายข่าวได้ค่ะ แค่ประกาศช้าลงหน่อย"

  - id: ann_o_toey
    topic: others
    npc: "ครูเต้ยมาขอพลาสเตอร์ลายดาวไปสิบแผ่นค่ะ บอกว่าเด็กล้ม… แอนเห็นครูแปะเองที่นิ้ว ครูทำแฟ้มจนนิ้วถลอก"
    options:
      - text: "ครูเต้ยทำงานหนักจัง"
        heart: 1
        reply: "หนักกว่าแอนอีกค่ะ แอนยังมีวันหยุด ครูมีแต่แฟ้มหยุด… ถ้าเจอครู ช่วยชวนครูกินข้าวให้ตรงเวลาหน่อยนะคะ"
        next:
          - text: "ได้{k} {p}จะชวนไปกินก๋วยเตี๋ยว"
            heart: 1
            reply: "ดีค่ะ บอกพี่หน่อยว่าไม่ใส่พริกนะคะ ครูเต้ยกินเผ็ดแล้วจามสิบครั้ง เด็กๆ นับเสียงดังกันทั้งร้าน"
          - text: "ครูไม่ฟังแอนเหรอ{kq}"
            heart: 0
            reply: "ฟังค่ะ ครูให้แอนสิบเต็มสิบทุกครั้งที่แอนเตือน แล้วก็กลับไปทำแฟ้มต่อ"
      - text: "ทำไมพลาสเตอร์ต้องลายดาว{kq}"
        heart: 1
        reply: "ครูบอกว่าแผลจะได้รู้สึกว่าทำดีค่ะ… แอนฟังแล้วอยากแปะพลาสเตอร์ลายดาวให้ตัวเองบ้าง"

  - id: ann_o_ton
    topic: others
    npc: "เณรต้นมาถามแอนว่า ‘หมอครับ ความฝันเป็นโรคไหมครับ’… มีคนมาถามเลขจากความฝันเณรอีกแล้วค่ะ"
    options:
      - text: "แอนตอบเณรว่าไง{kq}"
        heart: 1
        reply: "แอนบอกว่าความฝันไม่ใช่โรค เป็นของของเณรคนเดียว ไม่ต้องแบ่งให้ใคร… เณรยิ้มกว้างมาก แล้วถามว่าแบ่งให้ถ่านได้ไหม"
        next:
          - text: "ถ่านคือใคร{kq}"
            heart: 0
            reply: "หมาวัดค่ะ ตัวดำๆ ชอบนอนขวางบันได… แอนบอกว่าแบ่งให้หมาได้ค่ะ หมาไม่ซื้อหวย"
          - text: "เดี๋ยว{p}ช่วยไล่คนพวกนั้นให้"
            heart: 2
            reply: "ไม่ต้องไล่ค่ะ แค่บอกเขาเบาๆ ว่าเด็กเขากลัวฝันผิด… คนที่นี่ใจดีนะคะ แค่บางทีลืมว่าเณรอายุสิบเอ็ด"
      - text: "เณรน่ารักจัง"
        heart: 1
        reply: "น่ารักมากค่ะ ตอนเข่าแตกเณรนั่งสมาธิไม่ร้องสักแอะ… แต่ตอนแอนแปะพลาสเตอร์ลายดาว เณรน้ำตาซึมเพราะดีใจ"

  - id: ann_o_sumet
    topic: others
    npc: "พระอาจารย์สุเมธเข่าไม่ดีค่ะ แอนให้ท่านพักแปลงผัก ท่านรับปาก… วันรุ่งขึ้นแอนเห็นท่านนั่งยองๆ ถอนหญ้าอยู่"
    options:
      - text: "พระก็ดื้อได้เหมือนกันนะ{kq}"
        heart: 1
        reply: "แอนไม่กล้าใช้คำนั้นค่ะ… แอนขอใช้ว่า ‘ท่านขยันเกินคำแนะนำ’ ก็แล้วกัน"
      - text: "เอาเก้าอี้เตี้ยไปถวายดีไหม{kq}"
        heart: 2
        reply: "ดีมากเลยค่ะ! ท่านจะได้นั่งถอนหญ้าแทนนั่งยอง เข่าจะได้พัก… ช่างเปี๊ยกน่าจะทำให้ได้ วันนี้แอนไปถามเลย"
      - text: "ยาหม่องยายบัวช่วยไหม{kq}"
        heart: 1
        reply: "ช่วยค่ะ ยายบัวกับแอนแบ่งงานกัน ยายดูแลเข่าข้างซ้าย แอนดูแลเข่าข้างขวา… ล้อเล่นค่ะ เราดูแลด้วยกันทั้งสองข้าง"

quests:
  - id: ann_q1
    npc: ann
    title: "ตะไคร้ตอนตีสาม"
    desc: "ช่วยหมอแอนหยุดข่าวปลอมสุขภาพที่แชร์ว่อนกลุ่ม LINE"
    start: { heart_min: 1, day_min: 3 }
    offer:
      npc: "ข่าวตะไคร้ใบเตยตีสามยังไม่หยุดค่ะ… ลุงคนหนึ่งเลิกกินยาเบาหวานไปแล้ว แอนพิมพ์แก้คนเดียวไม่ทัน ช่วยแอนหน่อยได้ไหมคะ"
      options:
        - text: "ได้เลย{k} ต้องทำอะไรบ้าง"
          accept: true
          heart: 1
          reply: "คนที่แชร์เร็วที่สุดในตำบลคือป้าแต๋ว คนที่เสียงดังที่สุดคือผู้ใหญ่สมศักดิ์… ถ้าสองคนนี้อยู่ข้างเรา ข่าวจริงจะวิ่งทันข่าวปลอมค่ะ"
        - text: "ข่าวปลอมมันไม่หมดหรอก{k}"
          accept: true
          heart: 0
          reply: "ไม่หมดค่ะ แต่ลุงคนนั้นต้องกลับมากินยา… แค่คนเดียวก็คุ้มแล้ว ไปด้วยกันนะคะ"
        - text: "ไว้ก่อนนะ{kq} ยังไม่ว่าง"
          reply: "ได้ค่ะ ถ้าว่างเมื่อไหร่แวะมานะคะ ข่าวมันรอได้… แต่ลุงรอนานไม่ได้"
    steps:
      - goal: { type: talk, npc: taew }
        hint: "ไปขอให้ป้าแต๋วช่วยแชร์โพสต์แก้ข่าวของหมอแอน"
        done:
          npc: "โพสต์แก้ข่าวเหรอหลาน… ป้าแชร์ข่าวตะไคร้ไปห้ากลุ่มแล้วนะ ป้าไม่ได้ตั้งใจ ป้านึกว่าตะไคร้มันดีทุกเวลา"
          options:
            - text: "ป้าแชร์โพสต์แก้ห้ากลุ่มเหมือนกันได้ไหม{kq}"
              heart: 1
              reply: "ได้สิ! ห้ากลุ่ม บวกกลุ่มแม่บ้าน บวกกลุ่มรำวงอีกสองกลุ่ม ป้าจะให้มันเร็วกว่าข่าวปลอม… ป้าไม่ได้พูดนะ แต่ป้าเร็วที่สุดในอำเภอ"
            - text: "ป้าเกือบทำให้ลุงเขาป่วยหนักนะ{kq}"
              heart: -1
              reply: "โธ่… ป้ารู้แล้วหลาน ป้ารู้สึกผิดตั้งแต่เมื่อวาน ป้าจะแชร์แก้ทุกกลุ่ม แล้วจะเดินไปบอกลุงเขาเองด้วย"
      - goal: { type: talk, npc: somsak }
        hint: "ขอให้ผู้ใหญ่สมศักดิ์ประกาศแก้ข่าวทางหอกระจายข่าว"
        done:
          npc: "แก้ข่าวตะไคร้ ผู้ใหญ่จะประกาศรอบหกโมงเย็น ย้ำอีกครั้งนะ รอบหกโมงเย็น… หมอแอนเขียนมาให้แล้วใช่ไหม ผู้ใหญ่อ่านตามกระดาษ ไม่เติม"
          options:
            - text: "อ่านสามรอบเลยนะ{kq}ผู้ใหญ่"
              heart: 1
              reply: "สามรอบเป็นมาตรฐาน หลานพูดถูกระเบียบ… ผู้ใหญ่จะเพิ่มรอบที่สี่ให้ด้วย เพราะเรื่องสุขภาพ"
            - text: "ไมค์อย่าหอนตรงคำว่ายานะ{kq}"
              heart: 0
              reply: "ผู้ใหญ่จะเคาะไมค์ก่อนสองที ถ้ามันหอนตรงไหน ผู้ใหญ่จะย้ำตรงนั้นอีกครั้ง"
      - goal: { type: talk, npc: ann }
        hint: "กลับไปบอกหมอแอนที่ รพ.สต."
        done:
          npc: "ลุงคนนั้นกลับมากินยาแล้วค่ะ! เขาบอกว่าได้ยินผู้ใหญ่ประกาศสี่รอบ แล้วป้าแต๋วก็มาเคาะประตูบ้านอีก… หนีไม่ได้เลย"
          options:
            - text: "ดีใจด้วย{k} ทีมนี้แรงจริง"
              heart: 1
              reply: "แรงมากค่ะ แอนจะจดไว้ว่า ทีมแก้ข่าว: หมอ หนึ่ง ผู้ใหญ่ หนึ่ง ป้าแต๋ว หนึ่ง หลานยายเพียร หนึ่ง"
            - text: "ครั้งหน้าให้{p}ช่วยอีกนะ"
              heart: 2
              set_flag: ann_q1_partner
              reply: "แอนจะทักไปเป็นคนแรกเลยค่ะ… ตอนนี้แอนมีคนที่โทรหาได้ตอนตีสองเพิ่มอีกหนึ่งชื่อแล้ว"
    reward: { money: 120, heart: 2, items: { honey: 1 }, set_flag: ann_q1_done, line: { from: ann, text: "📢 ต้มตะไคร้ใบเตยดื่มตีสาม ‘ไม่ได้’ ทำให้เบาหวานหายนะคะ ดื่มได้เพราะหอม แต่ยาต้องกินต่อค่ะ 🙏 ขอบคุณป้าแต๋ว ผู้ใหญ่ และ {player} ที่ช่วยกันค่ะ 💚" } }

  - id: ann_q2
    npc: ann
    title: "เวรดึกกับข้าวต้มหนึ่งถ้วย"
    desc: "หมอแอนเหนื่อยจากเวรดึกติดกัน ลองเอาข้าวเย็นไปนั่งเป็นเพื่อนสักคืน"
    start: { flag: ann_q1_done, heart_min: 3, day_min: 6 }
    offer:
      npc: "ขอโทษนะคะ หน้าแอนดูไม่ดีใช่ไหม… สามคืนแล้วมีคนโดนผีจับมานอนทุกคืน แอนยังไม่ได้กินข้าวเย็นเลยค่ะ ไม่เป็นไรนะ เดี๋ยวก็หิวไปเอง"
      options:
        - text: "เย็นนี้{p}เอาข้าวต้มมาให้{k}"
          accept: true
          heart: 2
          reply: "ไม่ต้องลำบากค่ะ… ก็ได้ค่ะ ข้าวต้มปลาร้านพี่หน่อยนะคะ แอนจะไม่เกรงใจแล้ว"
        - text: "ไม่หิวไปเองหรอก กินเถอะ"
          accept: true
          heart: 1
          reply: "ใช้คำแนะนำของแอนกับแอนเลยนะคะ… โดนเข้าแล้วค่ะ"
        - text: "พยาบาลก็ต้องรู้จักดูแลตัวเองสิ"
          heart: -1
          reply: "ใช่ค่ะ… แอนรู้ แค่ทำไม่ทัน ไม่เป็นไรนะคะ"
    steps:
      - goal: { type: give, npc: ann, item: khao_tom_pla, n: 1 }
        hint: "ซื้อข้าวต้มปลาที่ร้านพี่หน่อย แล้วเอาไปให้หมอแอน"
        done:
          npc: "ยังร้อนอยู่เลย… พี่หน่อยไม่ใส่พริก! คุณบอกพี่หน่อยใช่ไหมคะ สามปีแอนไม่เคยได้ข้าวต้มที่ไม่มีวิญญาณเลย"
          options:
            - text: "บอกแล้ว{k} พี่หน่อยบ่นนิดหน่อย"
              heart: 1
              reply: "นิดหน่อยของพี่หน่อยคือสิบนาทีค่ะ… ขอบคุณที่ยืนฟังแทนแอนนะคะ"
            - text: "กินเลย{k} ไม่ต้องพูด"
              heart: 1
              reply: "ค่ะ… ค่ะ แอนกินแล้ว ห้ามมองนะคะ แอนกินเร็วมาก ติดนิสัยกินระหว่างเวร"
      - goal: { type: visit, place: clinic, from: "19:00", to: "20:30" }
        hint: "ไปนั่งเป็นเพื่อนหมอแอนที่ รพ.สต. ช่วงหัวค่ำ (กลับก่อนสามทุ่ม)"
        done:
          npc: "เงียบดีนะคะคืนนี้… รู้ไหมคะ ตอนแอนมาใหม่ๆ มีคนแก่คนหนึ่งเอาข้าวต้มมาวางหน้า รพ.สต. ทุกคืนที่แอนอยู่เวร ไม่เคาะ ไม่เรียก วางแล้วกลับ"
          options:
            - text: "ใครเหรอ{kq}"
              heart: 1
              reply: "แอนแอบดูอยู่สองอาทิตย์ค่ะ… ยายเพียร ยายถือไม้เท้าเดินมาตอนหนึ่งทุ่ม แล้วกลับก่อนสองทุ่ม ยายไม่เคยบอกว่าเป็นยาย แอนก็ไม่เคยถาม"
              set_flag: ann_q2_heard_gran
              next:
                - text: "ยายไม่เคยเล่าให้{p}ฟังเลย"
                  heart: 2
                  reply: "ยายไม่เล่าเรื่องแบบนี้หรอกค่ะ… วันนี้คุณมานั่งตรงนี้ แอนเลยรู้สึกเหมือนยายส่งคนมาแทน แอนขอร้องไห้แป๊บนึงนะคะ"
                - text: "แอนกินข้าวต้มยายหมดทุกถ้วยไหม{kq}"
                  heart: 1
                  reply: "หมดค่ะ แม้แต่ถ้วยที่ใส่พริก… ยายใส่พริกคืนเดียว แล้วไม่ใส่อีกเลย ยายสังเกตเก่งกว่าแอนอีก"
            - text: "แอนต้องหยุดพักบ้างนะ"
              heart: 1
              reply: "แอนรู้ค่ะ… คืนนี้แอนจะปิดไฟห้องหนึ่งดวงแล้วนอนสักสามชั่วโมง ถ้ามีคนเคาะ ประตูยังเปิดอยู่"
    sold_at: { khao_tom_pla: noi_noodle }
    reward: { money: 0, heart: 2, items: { herbal_tea: 1 }, set_flag: ann_q2_done, line: { from: ann, text: "คืนนี้เตียงหายไวกับเตียงได้กลับบ้านว่างทั้งสองเตียงค่ะ 🌙 ขอบคุณข้าวต้มไม่มีพริกนะคะ" } }

  - id: ann_q3
    npc: ann
    title: "รถคันที่สองของ รพ.สต."
    desc: "รวมแรงทั้งตำบลเพื่อกองทุนรถรับส่งผู้ป่วย"
    start: { flag: ann_q2_done, heart_min: 4, day_min: 10 }
    offer:
      npc: "แอนตัดสินใจแล้วค่ะ จะไม่รอโครงการที่ ‘อยู่ระหว่างการพิจารณา’ อีก… แอนจะเปิดกองทุนรถรับส่งผู้ป่วยเอง ช่วยแอนเริ่มได้ไหมคะ"
      options:
        - text: "เริ่มเลย{k} {p}ช่วยเต็มที่"
          accept: true
          heart: 2
          reply: "ขอบคุณค่ะ! อย่างแรก แอนอยากขอใช้ศาลาวัดตั้งแผงการกุศล ต้องไปกราบเรียนพระอาจารย์ก่อน"
        - text: "เงินเยอะนะ{kq} รถคันหนึ่ง"
          accept: true
          heart: 0
          reply: "เยอะค่ะ… รถมือสองคันละสามแสน แอนรู้ว่าไม่ได้ภายในเดือนนี้ แต่ถ้าไม่เริ่มวันนี้ ปีหน้ามันก็ยังเป็นศูนย์"
        - text: "ไปขอ อบต. ดีกว่าไหม{kq}"
          reply: "ขอแล้วค่ะ… สามปี ไว้ถ้าคุณเปลี่ยนใจ แอนจะรอนะคะ"
    steps:
      - goal: { type: talk, npc: sumet }
        hint: "ขออนุญาตพระอาจารย์สุเมธใช้ศาลาวัดตั้งแผงการกุศล"
        done:
          npc: "เจริญพร หมอแอนจะทำกองทุนรถพาคนป่วยหรือ อนุโมทนาด้วยนะโยม ศาลาใช้ได้ตลอด อาตมาจะให้ลุงจำรัสตั้งกล่องรับบริจาคแยกไว้ จดบัญชีให้เปิดเผย"
          options:
            - text: "ขอบพระคุณ{k}หลวงพ่อ"
              heart: 1
              reply: "ไม่ต้องขอบใจอาตมาหรอกโยม รถคันนั้นพาคนแก่ไปหาหมอได้ทันเวลา บุญเกิดตรงนั้นเอง"
            - text: "หลวงพ่อช่วยบอกญาติโยมในวันพระได้ไหม{kq}"
              heart: 1
              reply: "ได้ อาตมาจะพูดหลังให้ศีล สั้นๆ ไม่เทศน์ยาว คนจะได้มีแรงไปหยอดกล่อง"
      - goal: { type: give, npc: ann, item: corn, n: 5 }
        hint: "เก็บข้าวโพดหวาน 5 ฝักไปให้หมอแอนต้มขายที่แผงการกุศล"
        done:
          npc: "ข้าวโพดยายเพียร! คนรู้จักหมดเลยค่ะ ป้าทองใบรับต้มให้ บอกว่าต้มข้าวโพดยายเพียรต้องเติมเกลือแค่หยิบมือเดียว ยายสั่งไว้"
          options:
            - text: "ขายฝักละเท่าไหร่ดี{kq}"
              heart: 1
              reply: "ป้าทองใบบอกยี่สิบ ป้าแต๋วบอกสามสิบ ลุงจำรัสบอก ‘ตามแต่ศรัทธา’… แอนเลยเขียนป้ายว่ายี่สิบ แต่ใครให้เกินแอนไม่ทอน"
            - text: "เอาไปเลย{k} ไม่ต้องคิดเงิน"
              heart: 1
              reply: "ขอบคุณค่ะ… แอนจะเขียนหน้าแผงว่า ‘ข้าวโพดหลานยายเพียร’ คนจะซื้อเพราะคิดถึงยาย"
      - goal: { type: pay, npc: jamrat, n: 300 }
        hint: "หยอดเงินเข้ากล่องกองทุนรถผู้ป่วยกับลุงจำรัสที่วัด 300 บาท"
        done:
          npc: "สามร้อย ลุงลงบัญชีกองทุนรถผู้ป่วยแล้ว หน้าสอง บรรทัดเจ็ด ชื่อหลานยายเพียร… ยอดรวมตอนนี้หนึ่งหมื่นสองพันสี่ร้อยยี่สิบบาท ลุงนับสามรอบ"
          options:
            - text: "ใครให้เยอะสุด{kq}ลุง"
              heart: 0
              reply: "ลุงบอกไม่ได้ ความลับผู้บริจาค… แต่คนที่ให้เหรียญบาทเยอะสุดคือเณรต้น เณรหยอดทีละเหรียญ แล้วนับดังๆ ทุกเหรียญ"
            - text: "ติดประกาศหน้าศาลาด้วยนะ{kq}"
              heart: 1
              reply: "ติดแล้วหลาน ลุงเขียนตัวใหญ่ ใครผ่านต้องเห็น ความโปร่งใสต้องอ่านได้จากหน้าวัด"
      - goal: { type: talk, npc: ann }
        hint: "กลับไปคุยกับหมอแอนเรื่องเงินที่ยังขาด"
        done:
          npc: "หนึ่งหมื่นสองค่ะ… ยังขาดอีกเยอะ วันนี้ผู้จัดการบริษัทคุณธนาโทรมาเสนอจ่ายส่วนที่เหลือทั้งหมด ขอแค่ติดโลโก้บนรถ แอนควรรับไหมคะ"
          options:
            - text: "อย่ารับ{k} ค่อยๆ รวบรวมจากชุมชน"
              heart: 2
              set_flag: ann_car_community
              reply: "แอนก็อยากให้เป็นแบบนั้นค่ะ ช้าหน่อยแต่เป็นรถของทุกคน… แอนจะทำแผงทุกวันพระ ปีหน้าเราจะได้รถค่ะ แอนเชื่อ"
            - text: "รับเถอะ{k} คนป่วยรอไม่ได้"
              heart: 1
              set_flag: ann_car_company
              reply: "แอนก็คิดแบบนั้นค่ะ… คนป่วยไม่ได้ถามว่ารถยี่ห้ออะไร โลโก้ใครก็ช่าง แต่แอนจะขอเขียนชื่อตาบุญไว้ข้างประตูด้วย"
            - text: "เอาเรื่องเข้าสภาตำบลดูอีกที"
              heart: 1
              set_flag: ann_car_council
              reply: "ได้ค่ะ… คราวนี้แอนจะไม่ไปคนเดียว มีเงินหนึ่งหมื่นสองกับรายชื่อคนบริจาคไปด้วย เขาจะบอกว่าไม่มีคนต้องการไม่ได้แล้ว"
    reward: { money: 200, heart: 2, set_flag: ann_q3_done, line: { from: ann, text: "🚑 กองทุนรถรับส่งผู้ป่วย รพ.สต. ตอนนี้มี 12,420 บาทแล้วค่ะ ขอบคุณทุกบาท ทุกฝักข้าวโพด และทุกเหรียญของเณรต้นค่ะ 💚" } }

  - id: ann_q4
    npc: ann
    title: "ซองจดหมายจากกรุงเทพฯ"
    desc: "หมอแอนได้ข้อเสนองานเงินเดือนสามเท่า ช่วยเธอคิดว่าจะเลือกอะไร"
    start: { flag: ann_q3_done, heart_min: 6, day_min: 14 }
    offer:
      npc: "แอนมีเรื่องอยากปรึกษาค่ะ… โรงพยาบาลเอกชนในกรุงเทพฯ ส่งจดหมายมา เงินเดือนสามเท่า มีหอพัก มีวันหยุด แอนอ่านไปแล้วสิบรอบ ช่วยแอนคิดหน่อยได้ไหมคะ"
      options:
        - text: "ได้{k} คิดด้วยกันนะ"
          accept: true
          heart: 2
          reply: "ขอบคุณค่ะ แอนไม่อยากให้ใครตัดสินแทน แค่อยากมีคนนั่งข้างๆ ตอนแอนคิด"
        - text: "ไปเลย{k} โอกาสแบบนี้หายาก"
          accept: true
          heart: 0
          reply: "หายากจริงค่ะ… แต่แอนขอคิดก่อนสองวันนะคะ แอนรู้ว่าคุณหวังดี"
        - text: "เรื่องของแอน{p}ไม่อยากยุ่ง"
          heart: -1
          reply: "เข้าใจค่ะ… ขอโทษที่เอามาให้คิดนะคะ"
    steps:
      - goal: { type: days, n: 2 }
        hint: "ให้เวลาหมอแอนคิดสองวัน"
        done:
          npc: "สองวันนี้แอนเขียนข้อดีข้อเสียลงกระดาษค่ะ ข้อดีของกรุงเทพฯ ยาวกว่า… แต่ข้อเสียมีบรรทัดเดียวที่แอนอ่านแล้วนอนไม่หลับ ‘ตาเผือกจะวัดความดันกับใคร’"
          options:
            - text: "ตาเผือกหาคนวัดได้ แอนหาตัวเองได้ไหม{kq}"
              heart: 1
              reply: "… คำถามนี้ยากกว่าข้อสอบใบประกอบวิชาชีพอีกค่ะ แอนขอเก็บไว้คิดนะคะ"
            - text: "บรรทัดเดียวก็หนักได้เท่าทั้งหน้า"
              heart: 2
              reply: "ใช่ค่ะ… แอนอยากไปถามยายบัว ยายเคยเกือบไปกรุงเทพฯ ครั้งหนึ่ง แต่ไม่เคยเล่าว่าทำไมไม่ไป"
      - goal: { type: talk, npc: bua }
        hint: "ไปถามยายบัวว่าเคยเลือกเรื่องแบบนี้ยังไง"
        done:
          npc: "หนูแอนจะไปกรุงเทพฯ หรือจ๊ะ… ยายเคยจะไปนะหลาน ตอนตาเขาตาย ยายจะไปรับจ้างซักผ้า แต่คืนก่อนไป เด็กบ้านริมคลองไข้ขึ้น ยายต้มยาทั้งคืน เช้ามารถเมล์ออกไปแล้ว ยายก็เลยอยู่มาจนป่านนี้"
          options:
            - text: "ยายเสียดายไหม{kq}"
              heart: 1
              reply: "ตอนนั้นเสียดายจ้ะ… แต่เด็กคนนั้นโตมาเป็นแม่ของหนูแอน ยายไม่เคยบอกใคร หลานเก็บไว้นะ จะบอกหนูแอนก็ได้ ถ้าหลานคิดว่ามันช่วย"
              set_flag: ann_q4_bua_secret
            - text: "ยายว่าแอนควรอยู่ไหม{kq}"
              heart: 0
              reply: "ยายไม่บอกหรอกหลาน ใครเลือกแทนใครไม่ได้… บอกหนูแอนว่า ไปก็ได้ อยู่ก็ได้ แต่ให้เลือกตอนกินข้าวอิ่ม คนหิวเลือกผิดบ่อย"
      - goal: { type: visit, place: clinic, from: "07:00", to: "08:00" }
        hint: "ไปหาหมอแอนที่ รพ.สต. ตอนเช้าก่อนเปิด"
        done:
          npc: "มาแต่เช้าเลย… แอนเขียนอีเมลตอบไว้แล้วค่ะ ยังไม่ได้กดส่ง แอนอยากได้ยินอีกครั้งก่อน คุณคิดว่าแอนควรทำยังไงคะ"
          options:
            - text: "อยู่ที่นี่{k} แต่ต้องมีวันหยุดจริงๆ ด้วย"
              heart: 2
              set_flag: ann_stays_rest
              reply: "แอนจะอยู่ค่ะ… แล้วแอนจะส่งเรื่องขอพยาบาลมาช่วยอีกคน ระหว่างนี้วันอาทิตย์แอนจะปิดโทรศัพท์ครึ่งวัน ถ้าแอนไม่ทำ คุณมาดุแอนได้นะคะ"
            - text: "ไปเรียนต่อสักสามเดือน แล้วกลับมาเก่งขึ้น"
              heart: 1
              set_flag: ann_training
              reply: "แอนถามเขาได้ว่ามีอบรมระยะสั้นไหม… ถ้าแอนไป แอนจะกลับมาพร้อมวิชาฉุกเฉินที่ตำบลนี้ไม่มี ตาบุญคงชอบ"
            - text: "อยู่เถอะ{k} ที่นี่คือที่ของแอน"
              heart: 2
              set_flag: ann_stays
              reply: "… ค่ะ แอนกดลบอีเมลแล้ว ไม่ได้กดส่งนะคะ กดลบ แอนจะอยู่ตรงนี้ ใกล้คนไข้ของแอน… แล้วก็ใกล้คนที่เอาข้าวต้มมาให้"
    reward: { money: 0, heart: 3, items: { herbal_tea: 2 }, set_flag: ann_q4_done, line: { from: ann, text: "แจ้งข่าวค่ะ 🙏 แอนยังเป็นพยาบาล รพ.สต. บ้านดงเย็นเหมือนเดิมนะคะ ใครยังไม่ได้วัดความดันเดือนนี้ แอนรออยู่ค่ะ 💚" } }
