# ลุงสมหมาย — convos + quests (เรื่องรอง: กล่องสังกะสีกับหน้าสมุดยายเพียร → diary_sommai)
convos:
  # ===== react =====
  - id: sommai_r_meet
    topic: react
    once: true
    when: { not_flag: met_sommai }
    npc: "เฮ้ย ใครวะ… อ้าว! หลานยายเพียร! ลุงเห็นหลังไวๆ นึกว่ายายลุกมาเดิน เดินเหมือนกันเปี๊ยบ ขาแข้งแบบนี้ทำนาเก่งแน่"
    set_flag: met_sommai
    options:
      - text: "ลุงสมหมายใช่ไหม{kq} ยายเคยเล่าถึงลุง"
        heart: 1
        reply: "ยายเล่าว่าไง… เรื่องรถเกี่ยวหรือเรื่องหวย ถ้าเรื่องหวยไม่ต้องบอก ลุงเดาได้"
        next:
          - text: "เรื่องหวย{k}"
            heart: 1
            reply: "นั่นไง! ยายเพียรด่าลุงมาสามสิบปี ด่าเสร็จก็ถามว่างวดนี้ได้เลขอะไร ด่าไปจดไป คนแก่สมัยก่อนเขาเป็นงี้"
          - text: "เรื่องรถเกี่ยว{k} ว่าลุงเกี่ยวสะอาดที่สุด"
            heart: 2
            reply: "จริงเหรอ… ยายไม่เคยชมลุงต่อหน้าเลยนะ ชมลับหลังนี่ยายถนัด เออ ลุงดีใจว่ะหลาน"
      - text: "{p}เดินเหมือนยายจริงเหรอ{kq}"
        heart: 1
        reply: "เหมือน! ก้าวยาวๆ หลังตรง เหมือนจะไปทวงหนี้ใคร ยายเดินท่านี้ไปไล่คนบริษัทมาแล้วนะ"
      - text: "สวัสดี{k} {p}รีบนิดนึง"
        heart: 0
        reply: "ไปเถอะๆ คนหนุ่มสาวมันรีบทั้งนั้น… เดี๋ยว! วันนี้วันที่เท่าไหร่หลาน… ช่างเถอะ ลุงไปดูปฏิทินร้านแต๋วเอง"

  - id: sommai_r_lottery
    topic: react
    once: true
    when: { flag: bought_lottery }
    npc: "หลาน! เจ๊หงษ์กระซิบลุงว่าหลานซื้อหวยแล้ว เลขอะไร ไม่ต้องบอกหมด บอกแค่ตัวท้าย… ตัวเดียวพอ"
    options:
      - text: "ซื้อเล่นๆ{k} ใบเดียวเอง"
        heart: 1
        reply: "ใบเดียวนี่แหละอันตราย ใบแรกลุงก็ซื้อเล่น ตอนนี้ลุงมีสมุดจดเลขยี่สิบเล่ม อย่าเป็นแบบลุงนะ… แต่ถ้าถูกบอกลุงก่อนใคร"
        next:
          - text: "ลุงเตือน{p}แต่ยังถามเลขอยู่เลย"
            heart: 1
            reply: "ก็สองเรื่องมันไม่เกี่ยวกันนี่หลาน เตือนก็ส่วนเตือน เลขก็ส่วนเลข"
          - text: "งั้น{p}เลิกเลยดีไหม{kq}"
            heart: 1
            reply: "…ป้าพรจ้างหลานมาใช่ไหม พูดเหมือนกันทุกคำ"
      - text: "ห้ามบอกป้าพรนะ{kq}"
        heart: 1
        reply: "ป้าพรรู้ก่อนลุงอีก แต๋วส่งข่าวไวกว่าหอกระจายข่าว ป่านนี้ป้ากำลังซ้อมบทเทศน์หลานอยู่"
      - text: "ซื้อเลขบ้านยาย{k}"
        heart: 1
        reply: "บ้านเลขที่ยายเหรอ! เฮ้ย ทำไมลุงไม่เคยคิด สามสิบปีเดินผ่านทุกวัน… หลานนี่มีแววนะ ไม่ได้ชมนะ เตือน"

  - id: sommai_r_thana
    topic: react
    once: true
    when: { flag: story_thana_visit }
    npc: "ได้ข่าวว่าคุณธนาขับรถเก๋งขาวไปบ้านหลาน เสนอล้านสองใช่ไหม… ลุงไม่ได้ถามไปแทงนะ ลุงถามเพราะห่วงจริงๆ"
    options:
      - text: "{p}ยังไม่ขาย{k}"
        heart: 2
        reply: "ดีแล้ว… เขามาปักหมุดแดงข้างนาลุงอีกสองหมุด ลุงถอนทิ้งไปหมุดนึง อีกหมุดเก็บไว้ดูว่ามีเลขอะไร"
        next:
          - text: "ถอนหมุดเขาไม่โดนเรื่องเหรอ{kq}"
            heart: 1
            reply: "ลุงบอกดาบเสถียรว่าควายเหยียบ ดาบบอก ‘ควายมันคงไม่ชอบบริษัท’ แล้วก็หลับต่อ คดีปิด"
          - text: "หมุดมีเลขด้วยเหรอ{kq}"
            heart: 0
            reply: "มีสิ หมุดสามสิบเจ็ด ลุงซื้อไปแล้วงวดก่อน ไม่ออก บริษัทนี่ไม่ให้อะไรใครจริงๆ"
      - text: "ล้านสองก็เยอะนะ{kq}ลุง"
        heart: -1
        reply: "เยอะ… แต่หลาน ขายนาได้ครั้งเดียว ขายแล้วไม่มีงวดหน้า หวยยังมีงวดหน้าเลย"
      - text: "ลุงรู้ได้ไงว่าล้านสอง{kq}"
        heart: 1
        reply: "ลุงเชิดเห็นรถเก๋งตอนขับผ่าน บอกแต๋ว แต๋วบอกป้าพร ป้าพรบอกลุงตอนกินข้าว ข่าวตำบลนี้วิ่งเร็วกว่ารถเก๋งเขาอีก"

  - id: sommai_r_meeting1
    topic: react
    once: true
    when: { flag: story_meeting1 }
    npc: "ประชุมเมื่อวานหลานนั่งแถวไหน ลุงนั่งหลังสุด นับได้ว่านายกฯ พูด ‘ในส่วนของ’ ไปสี่สิบเอ็ดที ลุงเอาสี่หนึ่ง"
    options:
      - text: "กำนันหลับจริงด้วย{k}"
        heart: 1
        reply: "หลับตั้งแต่ ‘ในส่วนของ’ ครั้งที่สาม ตื่นอีกทีตอนน้ำแดงมาพอดี คนแก่ร่างกายรู้จังหวะ"
      - text: "ลุงโหวตอะไร{kq}"
        heart: 1
        reply: "ลุงโหวตระบบน้ำ บ่อบ้านลุงสูบแล้วมีลมปนมาสองอาทิตย์แล้ว ถนนลาดยางมันสวยนะ แต่รถเกี่ยวกินถนนไม่ได้"
        next:
          - text: "{p}ก็โหวตน้ำเหมือนกัน{k}"
            heart: 1
            reply: "พวกเดียวกัน! ไปกินโอเลี้ยงร้านแต๋วกัน ลุงเลี้ยง… หลานออกไปก่อนนะ ลุงลืมกระเป๋า"
          - text: "แต่ถนนเข้านาก็พังจริงนะ{kq}"
            heart: 0
            reply: "พังจริง ซ่อมทุกปีก่อนเลือกตั้ง ปีไหนไม่มีเลือกตั้งหลุมมันก็นอนรอ ไม่หนีไปไหน หลุมยังซื่อสัตย์กว่าบางคน"
      - text: "ฟังไม่รู้เรื่องเลย{k}"
        heart: 0
        reply: "ไม่ต้องรู้เรื่องหรอก ลุงประชุมมาสามสิบปีไม่เคยรู้เรื่องสักครั้ง สุดท้ายเงินมันก็ไปของมันเอง"

  - id: sommai_r_welldry
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "หลาน… บ่อบ้านลุงแห้งแล้ว เมื่อเช้ากดปั๊ม มีแต่เสียงฟี้ๆ เหมือนคนแก่หายใจ ป้าพรยืนถือกะละมังข้างๆ ไม่พูดสักคำ ลุงกลัวกว่าตอนป้าด่าอีก"
    options:
      - text: "แล้วลุงจะเอาน้ำที่ไหนใช้{kq}"
        heart: 1
        reply: "ซื้อเป็นถัง ถังละยี่สิบ วันละสามถัง… เท่ากับหวยเดือนละสองใบ ป้าพรคำนวณให้ฟังแล้ว ป้าใช้หน่วยหวยวัดทุกอย่าง"
        next:
          - text: "บ้าน{p}ยังมีน้ำ มาตักไปได้นะ{kq}"
            heart: 2
            reply: "หลาน… ลุงไม่อยากรบกวน แต่ป้าพรจะดีใจมาก ลุงจะเข็นถังไปตอนเช้ามืด ไม่ใช่อายนะ กลัวทั้งหมู่บ้านแห่ตาม"
          - text: "ต้องไปแจ้ง อบต.{k}"
            heart: 1
            reply: "แจ้งแล้ว นายกฯ บอก ‘รับทราบปัญหาในส่วนของน้ำ’ แล้วให้กรอกแบบฟอร์มสามแผ่น ลุงว่าจะเอาแบบฟอร์มหย่อนลงบ่อ เผื่อมันซับน้ำขึ้นมาได้"
      - text: "เป็นเพราะบริษัทหรือเปล่า{kq}"
        heart: 1
        reply: "ลุงไม่กล้าพูดเต็มปาก แต่ปั๊มบริษัทข้างคลองติดเครื่องวันแรก บ่อแต๋วแห้งวันที่สาม บ่อลุงวันที่ห้า สาม ห้า… เจ็ดต่อไปบ้านใครหลาน"
      - text: "ลุงเลยได้เลขสามห้าเจ็ดเหรอ{kq}"
        heart: 0
        reply: "…หลานคิดว่าลุงไม่ได้คิดเหรอ คิดแล้ว ไม่ซื้อ ลุงไม่อยากถูกหวยเพราะบ่อแห้ง มันบาป"

  - id: sommai_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "คนงานบริษัทลาออกไปสองคนแล้วนะหลาน บอกเห็นผู้หญิงผมยาวนั่งบนท่อน้ำ ยายบัวว่าแม่ธรณีไม่พอใจ… ลุงควรไปขอเลขไหม"
    options:
      - text: "อย่าไปเลย{k}ลุง กลางคืนอันตราย"
        heart: 1
        reply: "ลุงก็ไม่กล้าหรอก แค่พูดให้ดูกล้า ป้าพรบอกถ้าจะไปให้หอบหมอนไปด้วย นอนข้างผีเลย ไม่ต้องกลับ"
      - text: "ผีอยู่ข้างชาวบ้านแฮะ{k}"
        heart: 2
        reply: "นั่นแหละที่ลุงชอบ! ผีตำบลเรายังรู้ว่าใครดูดน้ำ อบต. ยังไม่รู้เลย"
        next:
          - text: "ลุงอย่าพูดดังสิ{kq}"
            heart: 0
            reply: "ผีได้ยินไม่เป็นไรหรอก ผีไม่ฟ้องหมิ่นประมาท บริษัทนั่นแหละฟ้อง"
          - text: "หรือผีอยากได้ระบบน้ำเหมือนกัน{kq}"
            heart: 1
            reply: "ถ้าผีโหวตได้ ระบบน้ำชนะขาด ผีบ้านดงเย็นมีมากกว่าคนมาเข้าประชุมอีก"
      - text: "ผีไม่มีจริงหรอก{k}"
        heart: 0
        reply: "ไม่มีจริง แต่คนงานวิ่งหนีจริง รั้วพังจริง ลุงว่าของไม่มีจริงนี่ทำงานได้ดีกว่าบางหน่วยงานนะ"

  - id: sommai_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ได้ถังน้ำ CSR มาใบนึง โลโก้บริษัทใหญ่กว่าตัวถัง ป้าพรเอาไปใส่ข้าวเปลือกให้ไก่ ลุงพลิกดูข้างใต้ ได้เลขล็อตผลิตมาแปดหลัก"
    options:
      - text: "ลุงรับถังเขาด้วยเหรอ{kq}"
        heart: 0
        reply: "รับสิหลาน เขาเอาน้ำใต้ดินลุงไป ลุงเอาถังเขามา ยังขาดทุนอยู่ดี ถังใส่ได้ยี่สิบลิตร บ่อลุงเคยมีเป็นแสน"
      - text: "ถังไม่มีประโยชน์ถ้าไม่มีน้ำใส่นะ{kq}"
        heart: 2
        reply: "เออ! ลุงพูดประโยคนี้กลางประชุม ทั้งศาลาฮากันลั่น คุณธนายิ้มแต่ตาไม่ยิ้ม ลุงว่าลุงพูดถูกที่สุดในชีวิต"
        next:
          - text: "ลุงเก่งมาก{k}"
            heart: 1
            reply: "ป้าพรก็ชม ชมครั้งแรกในรอบห้าปี ลุงจดวันที่ไว้แล้ว จะเอาไปแทงด้วย"
          - text: "ระวังเขาจำหน้าลุงไว้นะ{kq}"
            heart: 1
            reply: "จำไปเถอะ หน้าลุงก็หน้าคนแก่ธรรมดา ทั้งตำบลหน้าแบบนี้ห้าสิบคน เขาแยกไม่ออกหรอก"
      - text: "เลขแปดหลักเอาไปทำอะไร{kq}"
        heart: 1
        reply: "ตัดเหลือสองตัวท้าย ไม่ใช่ความโลภนะหลาน ลุงเรียกว่า ‘ทวงคืน’"

  - id: sommai_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ป้ายหาเสียงขึ้นเต็มเสาไฟแล้วหลาน เบอร์หนึ่งยิ้ม เบอร์สองยิ้ม เบอร์สามยิ้มกว้างสุด ลุงว่าเบอร์สามหนี้เยอะสุด"
    options:
      - text: "ลุงจะเลือกใคร{kq}"
        heart: 1
        reply: "ลุงจะเลือกคนที่มาหน้าบ้านลุงตอนบ่อแห้ง… เอ้า ไม่มีใครมาสักคน งั้นลุงคิดใหม่"
        next:
          - text: "เลือกคนที่สัญญาเรื่องน้ำ{k}"
            heart: 1
            reply: "ลุงจะจดสัญญาเขาไว้ในสมุดเลข หน้าแรกเลย ถ้าไม่ทำ ลุงจะอ่านให้ฟังทุกวันที่หนึ่งกับสิบหก"
          - text: "ลุงลงสมัครเองเลยสิ{kq}"
            heart: 1
            reply: "ลุงเหรอ นโยบายลุงมีข้อเดียว ‘ออกเลขให้ประชาชนทุกงวด’ ป้าพรบอกจะลงแข่งกับลุง"
      - text: "ป้ายเยอะจนบังทางเลย{k}"
        heart: 0
        reply: "บังป้ายทะเบียนรถเมล์ลุงเชิดด้วย ลุงเสียเลขไปสามเช้าแล้ว ยังไม่ทันได้เป็นนายกฯ ก็ทำลุงเสียหายแล้ว"
      - text: "เบอร์ผู้สมัครลุงจดยัง{kq}"
        heart: 1
        reply: "จดตั้งแต่ป้ายแรกขึ้น หนึ่งสองสาม ซื้อไปแล้ว ถ้าออก ลุงถือว่าการเมืองให้อะไรลุงสักครั้งในชีวิต"

  - id: sommai_r_end_bank
    topic: react
    once: true
    when: { flag: sommai_end_bank }
    npc: "หลาน ลุงไปธนาคารมาแล้ว เปิดบัญชีชื่อ ‘ออมแทนหวย’ ฝากงวดละร้อยเท่าเดิม น้องพนักงานถามว่าทำไมตั้งชื่องี้ ลุงบอกว่ายายคนนึงสอนไว้"
    options:
      - text: "ลุงทำได้แล้ว{k}"
        heart: 2
        reply: "ยังหรอก เพิ่งสองงวด เมื่อวานเดินผ่านแผงเจ๊หงษ์ ขาลุงเลี้ยวเองเลย ต้องเอามือดึงขากลับ"
      - text: "ป้าพรว่าไงบ้าง{kq}"
        heart: 1
        reply: "ป้าไม่ว่าอะไร เอาสมุดบัญชีไปเปิดดู แล้วเข้าครัว ทำลาบหมูมาจานใหญ่ ไม่ใช่วันหวยออกนะ ทำเฉยๆ ลุงงงทั้งคืน"
        next:
          - text: "ป้าดีใจแต่ไม่พูดไง{k}"
            heart: 1
            reply: "สี่สิบปีลุงเพิ่งรู้ว่าลาบหมูแปลว่าดีใจได้ด้วย ลุงนึกว่าแปลว่าปลอบใจอย่างเดียว"
          - text: "ลาบหมูนี่แบ่ง{p}ได้ไหม{kq}"
            heart: 1
            reply: "มาสิ ป้าบอกว่าคนช่วยเปิดกล่องมีสิทธิ์ครึ่งจาน ลุงได้แค่ก้นจาน"

  - id: sommai_r_end_ticket
    topic: react
    once: true
    when: { flag: sommai_end_ticket }
    npc: "งวดนี้ลุงซื้อใบเดียวจริงๆ นะหลาน เลขวันเกิดยายเพียร ไม่ออก… แต่ลุงไม่หงุดหงิดเลย แปลกดี เหมือนซื้อให้ยายถือไว้"
    options:
      - text: "ใบเดียวจริงนะ{kq}"
        heart: 1
        reply: "จริง! ป้าพรค้นกระเป๋าลุงสามรอบ เจอใบเดียวกับใบเสร็จค่าโอเลี้ยง ป้ายังไม่เชื่อ บอกว่าลุงคงฝากเจ๊หงษ์ไว้"
      - text: "ถ้าออก ลุงจะเอาไปทำอะไร{kq}"
        heart: 2
        reply: "ทำบุญให้ยายทั้งหมด แล้วซื้อสร้อยทองเส้นนึงไปถวายวัด… ยายขายสร้อยเพราะลุง ลุงอยากให้ยายมีสร้อยคืนสักเส้น"
        next:
          - text: "ยายคงดีใจ{k}"
            heart: 1
            reply: "คงด่าก่อนแล้วค่อยดีใจ ยายเป็นงั้น"
          - text: "ไม่ต้องรอถูกหวยก็ทำบุญได้นะ{kq}"
            heart: 1
            reply: "…เออจริง ทำไมลุงต้องรอเลข พรุ่งนี้ลุงไปใส่บาตรพระอาจารย์สุเมธ ใส่เผื่อยายด้วย"

  # ===== news =====
  - id: sommai_n_queue
    topic: news
    npc: "คิวรถเกี่ยวปีนี้ยาวถึงหลังร้านแต๋ว แต่ครึ่งคิวเป็นคนที่ปีที่แล้วยังค้างลุง ลุงเกี่ยวให้ก่อน ทวงทีหลัง ทวงไม่ได้ก็ไปทวงชาติหน้า"
    options:
      - text: "ลุงก็ค้างพี่บอลอยู่ไม่ใช่เหรอ{kq}"
        heart: 1
        reply: "…หลานรู้ได้ไง บอลไม่ใช่คนพูดมาก อ๋อ แต๋วใช่ไหม ช่างเถอะ ลุงค้างบอล คนอื่นค้างลุง เศรษฐกิจตำบลเราเป็นวงกลม"
        next:
          - text: "แล้วใครเป็นคนจ่ายจริงๆ{kq}"
            heart: 1
            reply: "เสี่ยเฮงไง เสี่ยไม่เคยค้างใคร มีแต่คนค้างเสี่ย วงกลมนี้มีรูรั่วอยู่ที่ร้านปุ๋ย"
          - text: "{p}ช่วยไปทวงให้ไหม{kq}"
            heart: 1
            reply: "อย่าเลย หลานหน้าใหม่ ทวงแล้วคนจะเล่าว่าหลานยายเพียรใจดำ ให้ลุงทวงเอง… ปีหน้า"
      - text: "ขอ{p}จองคิวด้วย{k}"
        heart: 1
        reply: "จองได้ ลุงจดชื่อหลานไว้หน้าแรก หน้าเดียวกับเลขงวดหน้า ลุงจะได้ไม่ลืมทั้งสองอย่าง"

  - id: sommai_n_scale
    topic: news
    npc: "ลานเสี่ยเฮงเปลี่ยนตาชั่งใหม่ บอลเป็นคนติด ข้าวลุงชั่งเครื่องใหม่หายไปสามกิโล ไม่รู้ข้าวหดหรือตาชั่งหิว"
    options:
      - text: "ลุงลองไปชั่งที่สหกรณ์พี่กล้าเทียบดูสิ{kq}"
        heart: 2
        reply: "เออ ความคิดดี ถ้าตรงกันลุงจะขอโทษตาชั่ง ถ้าไม่ตรง ลุงจะไปบอกแต๋ว ทั้งตำบลจะรู้ก่อนเสี่ยปิดร้าน"
      - text: "พี่บอลตั้งให้เขาโกงหรือเปล่า{kq}"
        heart: -1
        reply: "บอลน่ะเหรอ ไอ้นี่ซื่อจนอู่จะเจ๊ง ไม่มีทาง เสี่ยต่างหากที่ซื้อเครื่องมาพร้อมความสามารถพิเศษ"
      - text: "สามกิโลเอง{k}ลุง"
        heart: 0
        reply: "สามกิโลคูณทุกคนในตำบลคูณทุกปี หลานลองคิดดู เสี่ยได้ข้าวฟรีพอหุงกินทั้งชาติ"

  - id: sommai_n_tree
    topic: news
    npc: "ข่าวร้ายหลาน วัดทำรั้วไม้ไผ่ล้อมต้นตะเคียนหลังวัดแล้ว ลุงจำรัสบอกว่าไม่ได้กันผี กันคนแอบขูด ลุงว่าเขาพูดถึงใครสักคน"
    options:
      - text: "ก็พูดถึงลุงนั่นแหละ{k}"
        heart: 1
        reply: "ไม่จริง! ทั้งตำบลขูดกันทั้งนั้น ลุงแค่ขูดบ่อยสุด… กับขูดแรงสุด… ก็ได้ ลุงยอม"
      - text: "ต้นไม้มันเจ็บนะ{kq}ลุง"
        heart: 2
        reply: "เออ… พระอาจารย์ก็ว่างั้น ท่านไม่ดุสักคำ ท่านแค่ลูบเปลือกที่ลุงขูดแล้วบอก ‘ต้นนี้อายุมากกว่าโยมสามเท่า’ ลุงอายจนเดินถอยหลังออกมา"
        next:
          - text: "แล้วลุงจะหาเลขจากไหนต่อ{kq}"
            heart: 0
            reply: "ยังมีควาย จิ้งจก ทะเบียนรถ ฟ้าร้อง… โลกนี้เลขเยอะหลาน ไม่ต้องไปเจ็บต้นไม้"
          - text: "ลุงไปขอโทษต้นไม้ยัง{kq}"
            heart: 1
            reply: "ขอแล้ว เอาน้ำแดงไปวาง นางตะเคียนคงงงว่าลุงมาขอโทษหรือมาติดสินบน"
      - text: "ป้าพรคงดีใจ{k}"
        heart: 1
        reply: "ดีใจจนต้มขนมบวชแจกเพื่อนบ้าน บอกว่าฉลองวันที่ตาแก่โดนล้อมคอก"

  - id: sommai_n_coop
    topic: news
    npc: "ป้าพรจะเอาเงินออมไปฝากสหกรณ์ไอ้กล้า ลุงไม่ได้ค้านนะ ลุงแค่ถามว่าสหกรณ์มันออกรางวัลไหม ป้าเดินหนีเลย"
    options:
      - text: "สหกรณ์ไม่ใช่หวย{k}ลุง"
        heart: 1
        reply: "รู้แล้วหลาน ลุงแค่ถาม ไอ้กล้ามันอธิบายดอกเบี้ยให้ลุงฟังครึ่งชั่วโมง ลุงจำได้แค่ว่ามันพูด ‘เปอร์เซ็นต์’ สิบเจ็ดครั้ง"
        next:
          - text: "ลุงก็นับอีกแล้ว{k}"
            heart: 1
            reply: "ก็มันว่างหูไง สิบเจ็ด ลุงซื้อไปแล้ว ถ้าออกลุงจะสมัครสหกรณ์ด้วย ถือว่ามันนำโชค"
          - text: "ฝากที่สหกรณ์ปลอดภัยกว่าใต้ที่นอนนะ{kq}"
            heart: 1
            reply: "ใต้ที่นอนบ้านลุงไม่ปลอดภัยจริง ลุงหาเจอทุกที… ไม่ใช่ลุงเอานะ ลุงแค่ยืม"
      - text: "ลุงไม่ฝากด้วยเหรอ{kq}"
        heart: 0
        reply: "ลุงไม่มีเงินออมหลาน ลุงมีสลากออม ออมไว้ในลิ้นชักทุกงวด ไม่เคยได้ดอก"

  # ===== advice =====
  - id: sommai_a_harvest
    topic: advice
    npc: "ปีหน้าถ้าหลานทำนา อย่าดูแค่สีรวงนะ เด็ดเมล็ดมากัดดู ถ้ากัดแล้วกรอบ แข็ง ไม่มีน้ำนม ค่อยเรียกลุง"
    options:
      - text: "ถ้ายังมีน้ำนมล่ะ{kq}"
        heart: 1
        reply: "รออีกสามสี่วัน เกี่ยวตอนเมล็ดยังนิ่ม ข้าวหักครึ่งเวลาสี เสี่ยเฮงจะยิ้มกว้าง แล้วหลานจะร้องไห้"
      - text: "กัดข้าวดิบเลยเหรอ{kq}"
        heart: 1
        reply: "กัดสิ ชาวนาตัวจริงต้องกัด ลุงกัดมาสี่สิบปี ฟันลุงเหลือยี่สิบซี่ ไม่เกี่ยวกันนะ… อาจจะเกี่ยว"
      - text: "จ้างลุงอย่างเดียวพอ{k}"
        heart: 0
        reply: "จ้างได้ แต่ต้องรู้เองด้วยหลาน วันที่ลุงขับไม่ไหวแล้ว จะได้มีคนกัดข้าวแทนลุง"

  - id: sommai_a_heat
    topic: advice
    when: { time: noon }
    npc: "เที่ยงๆ อย่างนี้หลานอย่าฝืน ลุงเคยฝืนเกี่ยวตอนแดดเปรี้ยง ตื่นมาเจอหมอแอนกับป้าพรยืนคู่กัน ลุงอยากหลับต่อเลย"
    options:
      - text: "งั้นทำงานช่วงไหนดี{kq}"
        heart: 1
        reply: "เช้ามืดถึงสิบโมง กับบ่ายสามเป็นต้นไป กลางวันนั่งใต้ต้นไม้ นับมดก็ได้ ลุงนับประจำ"
      - text: "ลุงก็ฝืนตลอดไม่ใช่เหรอ{kq}"
        heart: 1
        reply: "ก็ใช่ไง ลุงถึงรู้ว่ามันไม่ดี คนเตือนเก่งที่สุดคือคนที่เคยโง่มาก่อน"
        next:
          - text: "เข้าใจแล้ว{k} ขอบคุณที่โง่มาก่อน"
            heart: 1
            reply: "ฮ่าๆ ไอ้หลานนี่ปากเหมือนป้าพร ไปๆ ไปกินน้ำ"
          - text: "ลุงอย่าฝืนอีกนะ{kq}"
            heart: 2
            reply: "ไม่ฝืนแล้ว… ปีนี้ซ่อมแอร์รถเกี่ยวแล้วด้วย บอลซ่อมให้ ยังไม่ได้จ่าย แต่แอร์มันไม่รู้"

  - id: sommai_a_longkhaek
    topic: advice
    npc: "หลาน ถ้าวันไหนมีคนชวนลงแขก ไปเถอะนะ ถึงจะจ้างรถลุงได้ก็ไป ลงแขกไม่ได้ไปเกี่ยวข้าวอย่างเดียว ไปเก็บคนไว้"
    options:
      - text: "เก็บคนยังไง{kq}"
        heart: 1
        reply: "วันที่หลานป่วย วันที่บ้านน้ำท่วม คนที่มาช่วยคือคนที่หลานเคยไปเกี่ยวข้าวให้ ไม่ใช่คนที่หลานเคยจ่ายเงิน"
      - text: "ลุงพูดแล้วรถเกี่ยวลุงจะไม่มีงานนะ{kq}"
        heart: 1
        reply: "รถลุงมีงานเยอะพอแล้ว ลุงพูดเพราะลุงคิดถึงหม้อแกงกลางนา สมัยลงแขกกินข้าวหกสิบคน เดี๋ยวนี้ลุงกินข้าวเวฟคนเดียวในห้องเครื่อง"
      - text: "เหนื่อยฟรีนะ{kq}ลุง"
        heart: -1
        reply: "ไม่ฟรีหลาน มันคือฝากเงินไว้ในใจคน ดอกเบี้ยดีกว่าเสี่ยเฮงอีก"

  - id: sommai_a_lotto
    topic: advice
    npc: "หลานจะซื้อหวยนะ ลุงไม่ห้าม แต่ให้ซื้อหลังกินข้าวอิ่ม คนหิวซื้อเยอะ คนอิ่มซื้อพอดี ลุงทดลองมาแล้ว"
    options:
      - text: "ลุงซื้อตอนอิ่มหรือหิว{kq}"
        heart: 1
        reply: "ลุงซื้อตอนหิวตลอด เพราะป้าพรทำข้าวช้า… เดี๋ยวลุงไปบอกป้าให้ทำข้าวเร็วขึ้น เพื่อเศรษฐกิจครัวเรือน"
      - text: "ไม่ซื้อเลยดีกว่าไหม{kq}"
        heart: 1
        reply: "ดีกว่าแน่นอน ลุงรู้ แต่คำแนะนำที่ดีที่สุดมันไม่มีใครทำตาม ลุงเลยให้คำแนะนำที่สองแทน"
        next:
          - text: "แล้วคำแนะนำที่สามล่ะ{kq}"
            heart: 1
            reply: "ห้ามยืมเงินคนอื่นมาซื้อ ข้อนี้ลุงทำได้นะ… เกือบทุกงวด"
          - text: "ลุงซื่อสัตย์ดี{k}"
            heart: 1
            reply: "ลุงโกหกไม่เป็น ป้าพรจับได้ทุกที ฝึกมาสี่สิบปียังไม่ผ่าน"

  # ===== smalltalk =====
  - id: sommai_s_tongkham
    topic: smalltalk
    npc: "หลานเคยฟังรถเกี่ยวร้องเพลงไหม เจ้าทองคำลุงเวลาเกียร์สามมันร้องหงิงๆ เหมือนเพลงรำวงที่ลุงเคยร้อง"
    options:
      - text: "ลุงร้องให้ฟังหน่อยสิ{kq}"
        heart: 2
        reply: "เอาจริงเหรอ… ‘ดวงจันทร์วันเพ็ญ…’ หยุดๆ ป้าพรได้ยินจะหาว่าลุงจีบสาว ป้ายังหึงเพลงนี้อยู่เลย"
        next:
          - text: "ป้าหึงเพลงเหรอ{kq}"
            heart: 1
            reply: "เพลงนี้ลุงร้องตอนป้ายังไม่สนลุง สาวงานวัดกรี๊ดกันทั้งแถว ป้ายืนกอดอกอยู่คนเดียว ลุงเลยชอบป้า"
          - text: "เสียงลุงยังดีอยู่นะ{k}"
            heart: 1
            reply: "ดีกว่าเจ้าทองคำนิดเดียว เจ้าทองคำมันยังไม่ต้องกินยาแก้ไอ"
      - text: "นั่นเสียงลูกปืนแตกหรือเปล่า{kq}"
        heart: 0
        reply: "หลานพูดเหมือนบอลเลย ช่างกับหมอมันไม่มีหัวใจศิลปะ"

  - id: sommai_s_dang
    topic: smalltalk
    npc: "ไอ้ด่างควายลุงมันแอบไปยืนจ้องบ่อแห้งบ้านลุงทั้งเช้า ลุงว่ามันเศร้า ตาเผือกบอกมันแค่หาที่เกาหลัง"
    options:
      - text: "ควายก็เศร้าเป็นนะ{kq}"
        heart: 1
        reply: "เป็นสิ ปีที่แม่มันตาย มันไม่กินหญ้าสามวัน ลุงไปนั่งกินข้าวข้างมันทุกมื้อ มันเลยยอมกินตาม"
      - text: "แล้วมันจามอีกไหม{kq}"
        heart: 1
        reply: "ไม่จามแล้ว ตาเผือกพามันไปหาหมอปศุสัตว์ หายหวัดแล้ว ลุงเสียทั้งค่ายาทั้งแหล่งเลข"
      - text: "ลุงคิดมากไป{k}"
        heart: 0
        reply: "คนเลี้ยงควายไม่คิดมากไม่ได้หรอกหลาน มันพูดไม่ได้ เราก็ต้องเดาให้มันทั้งชีวิต"

  - id: sommai_s_dream
    topic: smalltalk
    when: { time: morning }
    npc: "เมื่อคืนลุงฝันว่าหลานขี่รถเกี่ยวลุงไปกลางตลาดนัด เจ๊หงษ์วิ่งหนี แผงส้มกระจาย ลุงตื่นมาหัวเราะจนป้าพรตี"
    options:
      - text: "ฝันนี้ได้เลขอะไร{kq}"
        heart: 1
        reply: "หลานถามเองนะ! ส้มกระจายเก้าลูก เจ๊หงษ์วิ่งสองรอบ เก้าสอง ลุงไม่ได้ชวนนะ หลานถามเอง"
      - text: "{p}ขับรถเกี่ยวไม่เป็นนะ{kq}"
        heart: 1
        reply: "ในฝันหลานขับเก่งกว่าลุงอีก เข้าโค้งไม่ลดเกียร์ ลุงยังทำไม่ได้ ไว้หน้าหนาวลุงสอนให้"
        next:
          - text: "สอนจริงนะ{kq}"
            heart: 2
            reply: "จริง ลุงอยากมีคนขับเจ้าทองคำต่อ ลูกลุงมันไม่เอา หลานเอาไหม ไม่ต้องตอบตอนนี้"
          - text: "ไม่เอาดีกว่า{k} กลัวชนแผงเจ๊หงษ์"
            heart: 0
            reply: "ชนแผงเจ๊หงษ์ทั้งตำบลปรบมือนะหลาน"
      - text: "ป้าพรตีลุงทำไม{kq}"
        heart: 1
        reply: "ป้าบอกว่าคนหัวเราะตอนตีสามมีสองแบบ คนบ้ากับคนถูกหวย ลุงไม่ใช่แบบที่สอง"

  - id: sommai_s_rain
    topic: smalltalk
    when: { rain: true }
    npc: "ฝนตกแบบนี้ลุงชอบนั่งใต้ถุนนับฟ้าแลบ… ไม่ใช่เพื่อเลขนะหลาน นับจริงๆ นับแล้วใจมันสงบ"
    options:
      - text: "นับไปถึงไหนแล้ว{kq}"
        heart: 1
        reply: "สามสิบสอง… ก็ได้ ลุงจดไว้ด้วย จดเฉยๆ ไม่ได้แทง ยัง"
      - text: "{p}นั่งนับด้วยได้ไหม{kq}"
        heart: 2
        reply: "มาเลย ตรงนี้ไม่เปียก ป้าพรต้มน้ำขิงไว้ เอามาจิบด้วย นั่งเงียบๆ ไม่ต้องคุยก็ได้ ลุงชอบนั่งกับคนที่เงียบเป็น"
      - text: "ลุงไม่ไปซ่อมรถเกี่ยวเหรอ{kq}"
        heart: 0
        reply: "ฝนตกบอลก็ไม่ซ่อม อู่มันรั่ว น้ำหยดหน้าบอล บอลหน้าบูดกว่าฟ้าอีก"

  # ===== self =====
  - id: sommai_f_rumvong
    topic: self
    npc: "รู้ไหมหลาน ลุงเจอป้าพรครั้งแรกตอนลุงร้องรำวงงานวัดดงเย็น ลุงร้องผิดคีย์ทั้งเพลงเพราะมัวมองป้า"
    options:
      - text: "แล้วป้าว่าไง{kq}"
        heart: 1
        reply: "ป้าเดินมาบอกว่า ‘ร้องเพี้ยนเหมือนวัวโดนมดกัด’ ลุงตกหลุมรักตรงนั้นเลย ไม่มีใครกล้าด่าลุงต่อหน้าแบบนั้นมาก่อน"
        next:
          - text: "ลุงชอบคนด่าเหรอ{kq}"
            heart: 1
            reply: "ลุงชอบคนพูดจริง คนอื่นชมลุงหมด ป้าคนเดียวที่ฟังจริงๆ ถึงได้รู้ว่าเพี้ยน"
          - text: "โรแมนติกมาก{k}ลุง"
            heart: 1
            reply: "อย่าไปบอกป้านะ ป้าจะบอกว่าลุงเล่าเกิน ป้าจำว่าลุงร้องเพี้ยนแค่ครึ่งเพลง"
      - text: "ลุงร้องเพลงอะไร{kq}"
        heart: 1
        reply: "รำวงดงเย็น เพลงประจำหมู่ เดี๋ยวนี้ไม่มีใครร้องแล้ว เด็กๆ ร้องแต่เพลงในติ๊กต็อก ลุงฟังไม่ทัน"

  - id: sommai_f_loan
    topic: self
    when: { heart_min: 3 }
    npc: "หลานรู้ไหม ปีที่ลุงผ่อนรถเกี่ยว มีอยู่ปีนึงลุงผ่อนไม่ไหวสามงวด ธนาคารส่งจดหมายมา ลุงนึกว่าเจ้าทองคำต้องไปแล้ว"
    options:
      - text: "แล้วรอดมาได้ยังไง{kq}"
        heart: 1
        reply: "ธนาคารบอกว่ามีโครงการพักหนี้ ลุงได้พักสามงวดพอดี ฟ้าเมตตาครั้งเดียวในชีวิต ลุงอวดทั้งตำบลเลย ว่ารัฐบาลช่วยลุง"
        next:
          - text: "โชคดีจังเลย{k}"
            heart: 1
            reply: "โชคดีแปลกๆ นะ คนอื่นในตำบลไม่มีใครได้สักคน ลุงถามใครก็ไม่มีใครรู้จักโครงการนั้น… ช่างมันเถอะ"
          - text: "ทำไมผ่อนไม่ไหวล่ะ{kq}"
            heart: 0
            reply: "…ปีนั้นลุงเอาเงินค่างวดไปซื้อเลขชุดเดียวหมด ห้าพัน ไม่ออกสักตัว ป้าพรไม่พูดกับลุงสองเดือน อย่าถามต่อเลยหลาน"
      - text: "ลุงคงเครียดมาก{k}"
        heart: 1
        reply: "เครียดจนนอนในห้องเครื่องรถเกี่ยวสามคืน กลัวมีคนมาลากไปตอนลุงหลับ ป้าพรเอาข้าวมาส่งทุกมื้อ ทั้งที่ยังโกรธ"

  - id: sommai_f_son
    topic: self
    when: { heart_min: 5 }
    npc: "ลูกชายลุงอยู่ระยอง โรงงานเดียวกับที่ชวนบอลไปนั่นแหละ ลุงยังไม่ได้บอกบอลว่าลูกลุงเหนื่อยแค่ไหน ไม่อยากให้เขาเลือกเพราะคำพูดคนแก่"
    options:
      - text: "ลูกลุงเหนื่อยแค่ไหน{kq}"
        heart: 1
        reply: "กะละสิบสองชั่วโมง กลับห้องก็หลับ โทรมาลุงก็ถามแค่เรื่องหวย ลุงรู้ว่ามันถามเพราะไม่รู้จะคุยอะไรกับพ่อ"
        next:
          - text: "ลองถามเขาเรื่องอื่นดูไหม{kq}"
            heart: 2
            reply: "เรื่องอื่น… ลุงลองถามเรื่องข้าวเมื่องวดก่อน มันเงียบไปพักนึง แล้วบอกว่าคิดถึงกลิ่นฟาง ลุงวางสายแล้วนั่งเฉยๆ ครึ่งชั่วโมง"
          - text: "บอกพี่บอลไปเถอะ{k}"
            heart: 1
            reply: "ลุงจะบอกแค่ว่าไปได้ แต่อย่าลืมกลับมาซ่อมเจ้าทองคำ… แล้วจ่ายค่าซ่อมที่ค้าง ลุงหมายถึงลุงจะจ่ายนะ"
      - text: "ลุงอยากให้เขากลับมาไหม{kq}"
        heart: 1
        reply: "อยาก แต่ไม่พูด ถ้าพูดแล้วมันกลับมาไม่มีงาน ลุงก็กลายเป็นคนพามันมาลำบาก พ่อแม่ตำบลนี้เงียบกันทุกบ้านแหละหลาน"

  - id: sommai_f_fence
    topic: self
    when: { heart_min: 7 }
    npc: "หลาน… ลุงนอนไม่หลับมาหลายคืน ลุงฝันว่าขับเจ้าทองคำไปทั้งทุ่ง เจอแต่รั้วลวดหนาม ไม่มีนาให้เกี่ยวสักแปลง ฝันนี้ลุงไม่ได้เลขอะไรเลย"
    options:
      - text: "ตราบใดที่{p}ยังทำนา ลุงก็มีนาให้เกี่ยว{k}"
        heart: 2
        reply: "…พูดแบบนี้ลุงจะร้องนะหลาน ลุงจะจองคิวหลานไว้ตลอดชีวิต ไม่ต้องจองทุกปี"
      - text: "ลุงกลัวอะไรที่สุด{kq}"
        heart: 1
        reply: "กลัวว่าวันที่ลุงขับไม่ไหว จะไม่มีใครฟังเสียงรถเกี่ยวแล้วรู้ว่าข้าวสุกแล้ว คนรุ่นใหม่ฟังแต่เสียงแจ้งเตือนโทรศัพท์"
        next:
          - text: "{p}จะฝึกฟัง{k}"
            heart: 2
            reply: "ฟังเสียงรวงข้าวตอนลมพัดนะ ข้าวสุกมันเสียงแห้งๆ เหมือนคนกระซิบ หลานลองหน้าหนาวนี้"
          - text: "ยังมีพี่บอลกับพี่กล้านะ{kq}"
            heart: 1
            reply: "นั่นสิ ถ้าพวกมันอยู่กันหมด ลุงก็นอนหลับ… ถ้ามันไป ลุงก็ต้องอยู่นานขึ้นอีกหน่อย"
      - text: "ลุงคิดมากไป{k} ฝันไม่จริง"
        heart: 0
        reply: "หวังว่างั้นหลาน ปกติฝันลุงไม่เคยจริงสักเรื่อง ลุงไม่เคยดีใจที่ฝันไม่จริงเท่าตอนนี้"

  # ===== others =====
  - id: sommai_o_porn
    topic: others
    npc: "ป้าพรกับแต๋วทะเลาะกันอีกแล้ว เรื่องใครเป็นคนบอกเรื่องลุงซื้อหวยห้าใบก่อน ลุงคือผู้เสียหายนะ แต่ไม่มีใครถามความเห็นลุงเลย"
    options:
      - text: "ลุงซื้อห้าใบจริงเหรอ{kq}"
        heart: 0
        reply: "สี่ใบครึ่ง อีกครึ่งใบลุงหารกับลุงเชิด… ไม่ต้องคิด มันไม่สำคัญ"
      - text: "เดี๋ยวก็ดีกัน{k}"
        heart: 1
        reply: "ดีกันพรุ่งนี้เช้า แต๋วจะเอาปาท่องโก๋มาฝาก ป้าพรจะบอกว่าไม่กิน แล้วกินหมดถุง เป็นงี้มาสี่สิบปี"
        next:
          - text: "ลุงรู้ใจป้าดีนะ{k}"
            heart: 1
            reply: "ลุงไม่รู้ใจป้าหรอก ลุงแค่จำสถิติ ลุงเก่งเรื่องสถิติ ถามเรื่องหวยก็ได้"
          - text: "ทำไมป้ากับป้าแต๋วไม่เลิกคบกัน{kq}"
            heart: 1
            reply: "เลิกไม่ได้ ถ้าเลิก จะเหลือใครให้เถียงด้วยล่ะ ลุงเถียงไม่เป็น ลุงยอมตลอด"

  - id: sommai_o_ball
    topic: others
    npc: "หลาน ลุงได้ยินว่าบอลไปซื้อกระเป๋าใบใหญ่ ถ้ามันไประยองจริง ลุงต้องลากเจ้าทองคำไปซ่อมถึงอำเภอ ค่าลากแพงกว่าค่าซ่อมอีก"
    options:
      - text: "ลุงเลยไม่อยากให้พี่บอลไปเหรอ{kq}"
        heart: 0
        reply: "ไม่ใช่เรื่องเงินหรอก… ก็ส่วนนึง แต่ไอ้บอลมันเห็นลุงเป็นเพื่อนพ่อมัน ทุกครั้งที่มันซ่อมรถลุง มันเล่าเรื่องพ่อมันให้ฟัง ลุงกลัวมันไม่มีใครฟัง"
      - text: "ลุงจ่ายค่าซ่อมพี่บอลหรือยัง{kq}"
        heart: 1
        reply: "หลานนี่! ถามเหมือนป้าพร… ยัง หกพัน ลุงรู้ ลุงจำได้ทุกบาท เหมือนจำเลข"
        next:
          - text: "ผ่อนให้เขาทีละนิดก็ได้นะ{kq}"
            heart: 2
            reply: "ทีละนิด… งวดละห้าร้อยเท่าค่าหวยที่ลุงซื้อ ลุงคิดแล้วเจ็บ แต่ถ้ามันทำให้บอลอยู่ต่อ ลุงยอม"
          - text: "หรือรอถูกหวยก่อน{kq}"
            heart: 0
            reply: "หลานประชดลุงใช่ไหม… ลุงรู้ตัวแล้ว ไม่ต้องย้ำ"

  - id: sommai_o_phueak
    topic: others
    npc: "ตาเผือกน่ะเลี้ยงไอ้ด่างให้ลุงมายี่สิบปี ไม่เคยขอเพิ่มสักบาท ลุงเลยแอบซื้อหวยเผื่อตาทุกงวด ใบละครึ่ง ตายังไม่รู้"
    options:
      - text: "ตาเผือกไม่ชอบหวยนะ{kq}"
        heart: 1
        reply: "ไม่ชอบ ลุงถึงไม่บอก ถ้าถูกขึ้นมาลุงจะซื้อควายให้ตาตัวนึงแล้วบอกว่าเก็บได้"
      - text: "ลุงใจดีนะ{k}"
        heart: 1
        reply: "ใจดีงวดละห้าสิบบาท ไม่เคยออกสักงวด ใจดีแบบไม่มีผลลัพธ์ ป้าพรเรียกว่า ‘ใจดีลมๆ’"
        next:
          - text: "ซื้อหญ้าแห้งให้ควายแทนดีกว่าไหม{kq}"
            heart: 2
            reply: "…เออ หญ้าแห้งถึงควายแน่ หวยไม่แน่ หลานพูดเหมือนตาเผือกเลย พูดน้อยแต่เจ็บ"
          - text: "บอกตาสักวันเถอะ{k}"
            heart: 1
            reply: "บอกตอนถูกแล้วกัน ถ้าไม่ถูกก็ให้ตาไม่รู้ไปตลอด ดีกับทุกฝ่าย"

  - id: sommai_o_hong
    topic: others
    npc: "เจ๊หงษ์นะหลาน ปากเจ๊ร้าย แต่ปีที่ลุงป่วย เจ๊เอาส้มมาเยี่ยมสามกิโล แล้วกระซิบว่าเลขงวดนี้เจ๊ไม่รับเลขลุง เพราะ ‘คนป่วยห้ามเสียเงิน’"
    options:
      - text: "เจ๊หงษ์ใจดีกว่าที่คิด{k}"
        heart: 1
        reply: "ใจดีเฉพาะตอนเราใกล้ตาย ตอนแข็งแรงเจ๊กินเรียบ แต่ลุงว่านั่นแหละความยุติธรรมแบบเจ๊"
      - text: "ดาบเสถียรไม่จับเหรอ{kq}"
        heart: 1
        reply: "ดาบมาซื้อส้มเจ๊ทุกเช้า ยืนข้างกระดาษจดเลขพอดี ดาบมองฟ้าแล้วบอกว่า ‘วันนี้ฝนน่าจะตก’ ทุกวัน แม้แต่หน้าแล้ง"
        next:
          - text: "ดาบเสถียรเลี่ยงงานเก่ง{k}"
            heart: 1
            reply: "เลี่ยงเก่งจนได้ใบประกาศ ลุงเห็นแขวนในป้อม ‘ตำบลปลอดคดี’ สามปีซ้อน ไม่มีคดีเพราะไม่มีใครรับแจ้ง"
          - text: "อย่าพูดดังสิ{kq}ลุง"
            heart: 0
            reply: "ดังไม่ได้ ดาบหลับอยู่ร้านแต๋ว เดี๋ยวตื่น"
      - text: "ลุงยังซื้อกับเจ๊อยู่เหรอ{kq}"
        heart: 0
        reply: "บางงวด… อย่าบอกป้าพรนะ ป้าเคยไปยืนกอดอกหน้าแผงเจ๊ทั้งเช้า ลูกค้าเจ๊หายหมด เจ๊ยังไม่หายแค้น"

quests:
  - id: sommai_q1
    npc: sommai
    title: "เลขจากต้นตะเคียน"
    desc: "ลุงสมหมายชวนไปเป็นเพื่อนตอนขูดต้นตะเคียนหลังวัด"
    start: { heart_min: 1, day_min: 3 }
    offer:
      npc: "หลาน ช่วยลุงหน่อย เย็นนี้ลุงจะไปขูดต้นตะเคียนหลังวัด ป้าพรไม่ได้ห้ามนะ ป้าบอก ‘ไปคนเดียวเดี๋ยวไม่มีใครหามกลับ’ ลุงเลยต้องมีเพื่อน"
      options:
        - text: "ไปด้วย{k} แต่ต้องกลับก่อนมืดนะ{kq}"
          accept: true
          heart: 1
          reply: "ได้! เย็นนี้เจอกันหลังวัด แวะตลาดซื้อดอกไม้มาไหว้นางเขาหน่อยนะ ไปมือเปล่าเหมือนไปทวงหนี้"
        - text: "{p}ไปเป็นพยานว่าลุงไม่ได้ขูดแรง{k}"
          accept: true
          heart: 1
          reply: "ดีเลย มีพยาน ป้าพรจะได้เชื่อว่าลุงขูดเบาๆ แค่พอเห็นเลข ไม่ได้ทำร้ายต้นไม้"
        - text: "ไม่ไปหรอก{k} กลัว"
          heart: 0
          reply: "กลัวก็ดีแล้ว คนกลัวอายุยืน… ลุงไปชวนตาเผือกก็ได้ ตาไม่กลัวอะไรเลย แต่ตาก็ไม่เคยยอมไป"
    steps:
      - goal: { type: give, npc: sommai, item: rose_mon, n: 3 }
        hint: "ซื้อดอกกุหลาบมอญ 3 ดอกที่ตลาดนัด เอาไปให้ลุงสมหมาย (ไว้ไหว้นางตะเคียน)"
        done:
          npc: "สามดอกพอดี ดอกละสิบ เท่ากับหวยสามสิบบาท… ป้าพรสอนให้ลุงคิดแบบนี้ ลุงเกลียดมาก แต่หยุดคิดไม่ได้แล้ว"
          options:
            - text: "ลุงคิดเป็นหวยตลอดเลย{k}"
              heart: 0
              reply: "ไม่ใช่ลุงคิด ป้าพรคิด ลุงแค่ติดมา เหมือนติดหวัด"
            - text: "ไหว้แล้วนางให้เลขจริงเหรอ{kq}"
              heart: 1
              reply: "ไม่รู้ แต่ไหว้แล้วนางไม่โกรธแน่ ลุงไม่อยากได้เลขแล้วได้ไข้แถม"
      - goal: { type: visit, place: temple, from: "17:00", to: "19:00" }
        hint: "ไปเจอลุงสมหมายที่ต้นตะเคียนหลังวัด ช่วง 17:00–19:00"
        done:
          npc: "เห็นไหมหลาน ตรงเปลือกนี่ เหมือนเลขแปด… หรือรอยมดวะ ลุงลูบแป้งแล้ว หลานช่วยอ่านหน่อย ตาลุงไม่ดีตอนแสงเย็น"
          options:
            - text: "{p}อ่านได้สี่กับหก{k}"
              heart: 1
              set_flag: sommai_q1_read
              reply: "สี่หก! จดเลย… หลานอ่านให้แล้วนะ ถ้าออกลุงแบ่งครึ่ง ถ้าไม่ออกหลานไม่ต้องรับผิดชอบ ลุงรับเอง… แล้วป้าพรก็รับต่อจากลุง"
            - text: "{p}ว่ามันคือรอยมดจริงๆ{k}ลุง"
              heart: 1
              set_flag: sommai_q1_honest
              reply: "…นั่นสิ มดมันเดินทุกวัน ลุงมาขูดทุกเดือน ใครโง่กว่ากัน… ไม่ต้องตอบ กลับกันเถอะ ฟ้าจะมืดแล้ว"
            - text: "ลุงมองอะไรก็เป็นเลขหมดแหละ{k}"
              heart: 0
              reply: "ก็คนมันหวังนี่หลาน คนหวังมองอะไรก็เห็นทาง… แต่บางทีมันก็แค่รอยมด ลุงรู้"
    sold_at: { rose_mon: market }
    reward: { money: 50, heart: 1, items: { peanut_roast: 1 }, set_flag: sommai_q1_done, line: { from: sommai, text: "งวดนี้ลุงมีพยานอ่านเลขแล้วนะทุกคน 🙏 ถ้าออกเลี้ยงก๋วยเตี๋ยวพี่หน่อยทั้งหมู่ ถ้าไม่ออก ห้ามถาม" } }

  - id: sommai_q2
    npc: sommai
    title: "สมุดเลขเล่มสุดท้าย"
    desc: "ลุงสมหมายขอฝากสมุดเลขกับกล่องสังกะสีเก่าไว้ที่บ้านยาย"
    start: { flag: sommai_q1_done, heart_min: 2, day_min: 6 }
    offer:
      npc: "หลาน… ป้าพรเผาสมุดเลขลุงไปอีกเล่ม ลุงเหลือเล่มเดียวกับกล่องสังกะสีใบเก่า ขอฝากไว้บ้านหลานได้ไหม บ้านยายเพียรป้าไม่กล้าค้น"
      options:
        - text: "ได้{k} แต่{p}ขอคุยกับป้าพรก่อนนะ{kq}"
          accept: true
          heart: 1
          reply: "…ได้ คุยดีๆ นะ ป้าพรตอนนี้เหมือนหม้อความดัน เปิดผิดจังหวะระเบิดทั้งครัว"
        - text: "ฝากได้{k} {p}จะไม่เปิดดู"
          accept: true
          heart: 1
          reply: "เปิดดูก็ได้ ไม่มีอะไรหรอก มีแต่เลข… กับของเก่าๆ ลุงไม่ได้เปิดกล่องนั้นมาสิบปีแล้ว"
        - text: "ไม่อยากมีเรื่องกับป้าพร{k}"
          heart: 0
          reply: "เข้าใจ ลุงก็ไม่อยาก ลุงเอาไปซ่อนห้องเครื่องรถเกี่ยวก็ได้ ร้อนหน่อย เลขจะได้สุก"
    steps:
      - goal: { type: talk, npc: porn }
        hint: "ไปคุยกับป้าพรก่อน เรื่องสมุดเลขของลุง"
        done:
          npc: "ตาแก่ส่งหลานมาใช่ไหม ป้ารู้ หน้าหลานเหมือนคนถือซองมาขอบริจาค… ป้าไม่ได้เกลียดสมุดหรอกหลาน ป้าเกลียดว่าเงินค่าไฟเดือนก่อนอยู่ในสมุดเล่มนั้น"
          options:
            - text: "ลุงยอมตั้งงบงวดละร้อย{k}ป้า"
              heart: 2
              set_flag: sommai_q2_budget
              reply: "งวดละร้อย… ตาแก่สัญญากับหลาน ไม่ได้สัญญากับป้า ป้าว่าแกจะรักษาสัญญากับหลานมากกว่า เอาเถอะ ป้าลองดู"
            - text: "ป้าเผาสมุดลุงแรงไปไหม{kq}"
              heart: 0
              reply: "แรงเหรอ… เผาไปเล่มเดียว ป้ามีไฟแช็กอันเดียว ถ้ามีสองอันก็สองเล่ม"
      - goal: { type: visit, place: house_sommai, from: "17:00", to: "19:00" }
        hint: "ตอนเย็นไปรับกล่องสังกะสีที่บ้านลุงสมหมาย"
        done:
          npc: "นี่แหละกล่อง ลุงเก็บตั้งแต่ปีที่เจ้าทองคำเกือบโดนยึด… อย่าเพิ่งเปิดนะ ลุงยังไม่พร้อม ข้างในมีแต่เรื่องที่ลุงไม่อยากจำ"
          options:
            - text: "ปีที่เกือบโดนยึดเหรอ{kq}"
              heart: 1
              set_flag: sommai_q2_box
              reply: "ปีนั้นลุงผ่อนไม่ไหวสามงวด แล้วธนาคารก็พักหนี้ให้ตามโครงการ ลุงโชคดีครั้งเดียวในชีวิต… ไว้ลุงเล่าวันหลัง"
            - text: "{p}จะเก็บไว้อย่างดี{k}"
              heart: 1
              reply: "วางไว้ใกล้รูปยายนะหลาน ยายจะได้ช่วยดู… ยายเคยช่วยลุงดูอะไรหลายอย่าง ลุงเพิ่งนึกออก"
    reward: { heart: 2, items: { boiled_peanut: 1 }, set_flag: sommai_q2_done, line: { from: sommai, text: "สมุดเลขเล่มสุดท้ายไปอยู่ที่ปลอดภัยแล้ว แม่ไม่ต้องหานะ 🙏 (ส่งผิดกลุ่ม ขอโทษครับ)" } }

  - id: sommai_q3
    npc: sommai
    title: "บ่อลุงลึกแค่ไหน"
    desc: "บ่อบ้านลุงสมหมายแห้ง ลุงจะเอาเงินไปขุดบ่อลึก ช่วยหาทางก่อน"
    start: { flag: story_well_dry, heart_min: 3 }
    offer:
      npc: "หลาน ลุงจะจ้างขุดบ่อลึกลงอีกสิบเมตร ช่างคิดแปดพัน ลุงมีห้าพัน อีกสามพัน… ลุงว่างวดนี้น่าจะมา หลานว่าไง"
      options:
        - text: "อย่าเพิ่ง{k}ลุง ให้{p}ช่วยหาทางก่อน"
          accept: true
          heart: 2
          reply: "ทางอื่น… ลุงรู้จักแต่ทางไปแผงเจ๊หงษ์ เอาก็ได้ ลองดู"
        - text: "ไปถามพี่ปาล์มที่ อบต. ก่อนดีไหม{kq}"
          accept: true
          heart: 1
          reply: "ปาล์มเขามีเครื่องวัดน้ำนี่ ลุงลืมไปเลย เอา ไปถามกัน"
        - text: "ลุงลองดูก็ได้{k}"
          heart: -1
          reply: "…หลานเชียร์ลุงเหรอ ป้าพรได้ยินคงเป็นลม เอาเถอะ ลุงคิดอีกทีก่อน"
    steps:
      - goal: { type: talk, npc: palm }
        hint: "ไปหาปาล์มที่ อบต. ขอให้มาวัดระดับน้ำบ่อบ้านลุงสมหมาย"
        done:
          npc: "บ่อลุงสมหมายเหรอ ตามหลักวิชาการนะ ต้องวัดตอนเช้าก่อนใครสูบ… แต่ตามหลักบ้านๆ คือไปตอนลุงยังไม่ตื่นมาจดเลข เจอกันที่บ้านลุงตอนเช้านะ"
          options:
            - text: "ฝากด้วยนะ{kq} ลุงจะเอาเงินไปขุดแล้ว"
              heart: 1
              reply: "อย่าเพิ่งขุดเลย เราเห็นมาสามบ้านแล้ว ขุดลึกตามน้ำไม่ทันหรอก เดี๋ยวเราวัดให้ดูเป็นตัวเลข ลุงชอบตัวเลขนี่เนอะ"
            - text: "วัดแล้วจะรู้ไหมว่าเพราะบริษัท{kq}"
              heart: 1
              reply: "รู้ว่าน้ำลดเท่าไหร่ ส่วนเพราะใคร… ต้องวัดหลายบ้าน เราจดไว้ทุกบ้านแหละ ห้ามบอกนายกฯ นะว่าเราจด ล้อเล่นๆ… ครึ่งนึง"
      - goal: { type: visit, place: house_sommai, from: "07:00", to: "10:00" }
        hint: "ตอนเช้าไปที่บ้านลุงสมหมาย ดูปาล์มวัดระดับน้ำ"
        done:
          npc: "ปาล์มหย่อนสายวัดลงไป บอกว่าน้ำลดสิบสองเมตรในเดือนเดียว ขุดลงอีกสิบเมตรก็ไล่ไม่ทัน… สิบสอง หลาน ลุงไม่ซื้อเลขนี้หรอก"
          options:
            - text: "เงินห้าพันเก็บไว้ก่อนนะ{kq}ลุง"
              heart: 2
              set_flag: sommai_q3_saved
              reply: "เออ… เก็บไว้ ป้าพรจะได้นอนหลับ ลุงจะไปตักน้ำบ้านหลานแทน หลานพูดเองนะว่าให้มาตักได้"
            - text: "เอาผลวัดไปให้พี่เมย์ดีไหม{kq}"
              heart: 1
              set_flag: sommai_q3_may
              reply: "นักข่าวเหรอ… ได้ ลุงไม่กลัว ลุงแก่แล้ว บริษัทจะเอาอะไรจากลุง เอารถเกี่ยวไปเหรอ เอาไปเลย ผ่อนต่อด้วย"
            - text: "หรือขายนาให้บริษัทไปเลย{kq}"
              heart: -2
              set_flag: sommai_q3_sell_talk
              reply: "หลาน… ลุงคิดแล้วเมื่อคืน คิดจนไก่ขัน ไม่ขายหรอก ถ้าลุงขาย ยายเพียรลุกมาตีลุงแน่"
    reward: { heart: 2, items: { dry_well_water: 1 }, set_flag: sommai_q3_done, line: { from: sommai, text: "บ่อบ้านลุงลด 12 เมตรในเดือนเดียว ปาล์มวัดให้แล้ว ใครอยากรู้บ่อตัวเองไปถามปาล์ม อย่ามาถามลุง ลุงไม่แทงเลขนี้ 😤" } }

  - id: sommai_q4
    npc: sommai
    title: "กล่องสังกะสีของลุง"
    desc: "ลุงสมหมายพร้อมเปิดกล่องเก่าแล้ว ข้างในมีอะไรเกี่ยวกับยายเพียร"
    start: { flag: sommai_q3_done, heart_min: 5, day_min: 16 }
    offer:
      npc: "หลาน… กล่องที่ฝากไว้ ลุงพร้อมเปิดแล้ว บ่อแห้งทำให้ลุงคิดว่า อะไรที่ไม่ดูวันนี้ พรุ่งนี้มันอาจไม่อยู่ให้ดู มาเปิดด้วยกันนะ"
      options:
        - text: "เปิดด้วยกัน{k}ลุง"
          accept: true
          heart: 1
          reply: "เย็นนี้ที่บ้านลุงนะ ป้าพรจะต้มน้ำขิงไว้ ป้าบอกว่ากล่องเก่าๆ ฝุ่นเยอะ ลุงว่าป้ากลัวลุงร้องไห้แล้วไม่มีอะไรจิบ"
        - text: "ลุงแน่ใจนะ{kq}"
          accept: true
          heart: 1
          reply: "ไม่แน่ใจ แต่ถ้ารอให้แน่ใจ ลุงจะรออีกสิบปี เอากล่องมาเย็นนี้เถอะ"
        - text: "รอให้ลุงพร้อมจริงๆ ก่อนไหม{kq}"
          heart: 0
          reply: "ก็ได้หลาน ลุงรอได้ รอมาสิบปีแล้ว อีกสองสามวันไม่เป็นไร"
    steps:
      - goal: { type: visit, place: house_sommai, from: "17:00", to: "20:00" }
        hint: "เอากล่องสังกะสีไปเปิดกับลุงสมหมายที่บ้านตอนเย็น"
        done:
          npc: "…ใบเสร็จธนาคารสามใบ ชื่อลุง แต่ลายมือคนจ่ายไม่ใช่ลุง แล้วนี่… กระดาษพับสี่ ลายมือยายเพียร หลาน ทำไมกระดาษยายมาอยู่ในกล่องลุง"
          options:
            - text: "อ่านด้วยกันนะ{kq}ลุง"
              heart: 1
              reply: "หลานเก็บไว้ก่อน ลุงยังไม่กล้าอ่าน ใบเสร็จนี่มันปีนั้น… ไปธนาคารกับลุงหน่อย ลุงต้องรู้ก่อนว่าเรื่องจริงเป็นยังไง"
            - text: "ใบเสร็จนี่ปีที่รถเกือบโดนยึดใช่ไหม{kq}"
              heart: 1
              reply: "ปีนั้นแหละ… ธนาคารบอกว่ามีโครงการพักหนี้ ลุงเชื่อมาสิบปี อวดคนทั้งตำบลว่ารัฐบาลช่วยลุง ไปธนาคารกับลุงหน่อย"
      - goal: { type: visit, place: bank, from: "09:00", to: "15:00" }
        hint: "ไปธนาคารเกษตรกับลุงสมหมาย ถามเรื่องใบเสร็จเก่าสามใบ"
        done:
          npc: "พนักงานคนเก่าเกษียณแล้ว น้องคนใหม่เปิดประวัติให้ดู ไม่มีโครงการพักหนี้ปีนั้นหลาน ไม่มีเลย… มีแต่ ‘ชำระแทนโดย นางเพียร’ สามงวด"
          options:
            - text: "ยายไม่อยากให้ลุงรู้{k}"
              heart: 2
              reply: "ยายขายสร้อยทองเส้นเดียวที่มี ลุงเห็นยายไม่ใส่สร้อยตั้งแต่ปีนั้น ลุงนึกว่ายายกลัวโจร… ลุงมันโง่ว่ะหลาน"
            - text: "ลุงร้องไห้ได้นะ{k}"
              heart: 1
              reply: "ลุงไม่ได้ร้อง ธนาคารเขาแอร์เย็น ฝุ่นเข้าตา… ธนาคารมีฝุ่นได้ไง ช่างเถอะ"
      - goal: { type: days, n: 1 }
        hint: "ให้ลุงสมหมายอยู่กับตัวเองสักวัน"
      - goal: { type: talk, npc: sommai }
        hint: "ไปหาลุงสมหมาย อ่านหน้าสมุดของยายด้วยกัน"
        done:
          npc: "ลุงอ่านจบแล้ว ยายเขียนว่า ‘สมหมายมันไม่ได้โง่ มันแค่หวังเก่ง คนหวังเก่งต้องมีคนช่วยถือความหวังไว้ให้บ้าง ไม่งั้นมันหนักจนล้ม อย่าบอกมัน เดี๋ยวมันเอาไปแทง’… หลาน ลุงควรทำยังไงกับตัวเองดี"
          options:
            - text: "เอาเงินค่าหวยไปฝากธนาคารแทน{k} ทุกงวดเหมือนเดิม"
              heart: 2
              set_flag: sommai_end_bank
              reply: "ฝากแทนหวย… งวดละร้อยเท่าเดิม แต่ไม่มีวันไม่ถูก ได้ ลุงจะเปิดบัญชีพรุ่งนี้ ตั้งชื่อ ‘ออมแทนหวย’ ป้าพรต้องหัวเราะแน่"
            - text: "ลุงไม่ต้องเลิกหรอก ซื้อใบเดียวพอ แบบที่ยายถือหวังให้ลุง"
              heart: 1
              set_flag: sommai_end_ticket
              reply: "ใบเดียวต่องวด เลขวันเกิดยาย ถ้าออกลุงทำบุญให้ยายหมด ถ้าไม่ออก ถือว่าลุงถือความหวังแทนยายบ้าง… ยายถือให้ลุงมาสิบปีแล้ว"
            - text: "ลุงคืนเงินยายให้{p}ก็ได้นะ{kq}"
              heart: -1
              reply: "…หนี้ก็ต้องคืน หลานพูดถูก แต่ยายไม่ได้ให้ลุงยืมหรอก ยายให้ ถ้าลุงคืนหลาน ยายคงด่าว่าลุงไม่อ่านหนังสือ หลานว่าลุงควรเอาเงินไปทางไหนดี"
              next:
                - text: "งั้นฝากธนาคารแทนหวยก็แล้วกัน{k}"
                  heart: 1
                  set_flag: sommai_end_bank
                  reply: "เอา ฝากทุกงวด เปิดบัญชีพรุ่งนี้ ป้าพรได้ยินคงทำลาบหมู"
                - text: "ซื้อใบเดียวแทนยายก็พอ{k}"
                  heart: 1
                  set_flag: sommai_end_ticket
                  reply: "ใบเดียว เลขวันเกิดยาย ลุงสัญญา… ลุงจะให้ป้าพรถือใบนั้นด้วย ลุงจะได้ซื้อเพิ่มไม่ได้"
    reward: { money: 200, heart: 3, set_flag: diary_sommai, line: { from: sommai, text: "ขอบคุณยายเพียรครับ 🙏 สิบปีเพิ่งรู้ ใครเคยได้ ‘โครงการพักหนี้’ ปีนั้นเหมือนลุง ลองไปถามธนาคารดูนะ อาจไม่ใช่รัฐบาลก็ได้" } }
