          - text: "ครูคนนั้นยังอยู่ไหม{kq}"
            heart: 1
            reply: "เกษียณแล้วจ้ะ อยู่อำเภอข้างๆ ครูส่งการ์ดปีใหม่ไปทุกปี… ปีนี้ครูจะเขียนว่าครูมีนักเรียนสี่สิบสองคนที่ครูไม่ยอมแพ้"
      - text: "ครูเต้ยดูเรียนเก่งมาตลอดนะ"
        heart: 0
        reply: "ครูดูเก่งเพราะครูพกปากกาแดงจ้ะ… ปากกาแดงทำให้คนดูฉลาดขึ้นยี่สิบเปอร์เซ็นต์ ครูวัดมาแล้ว"

  - id: toey_f_letter
    topic: self
    when: { heart_min: 3 }
    npc: "ครูมีซองจดหมายซองหนึ่งในลิ้นชัก เขียนถึงเด็กๆ ไว้… ไม่มีใครรู้นะ ครูเพิ่งเผลอพูดออกมาเอง"
    options:
      - text: "เขียนว่าอะไร{kq}"
        heart: 1
        reply: "ครูบอกไม่ได้จ้ะ… บอกได้แค่ว่าเขียนไว้เผื่อวันที่ครูต้องบอกลาเด็ก ครูหวังว่าจะเก่าจนกระดาษเหลือง โดยไม่ได้เปิด"
        next:
          - text: "{p}ช่วยให้มันไม่ได้เปิดนะ"
            heart: 2
            reply: "… ครูไม่รู้จะให้คะแนนประโยคนี้เท่าไหร่ ครูไม่มีคะแนนพอจ้ะ"
          - text: "ทำไมต้องบอกลา{kq}"
            heart: 1
            reply: "ถ้าเด็กไม่ถึงเกณฑ์ โรงเรียนอาจถูกยุบจ้ะ… ครูไม่อยากพูดเรื่องนี้ตอนนี้ ครูยิ้มอยู่ ขอยิ้มต่ออีกนิด"
      - text: "ครูไม่ต้องเล่าก็ได้{k}"
        heart: 1
        reply: "ขอบใจจ้ะ… ที่ไม่ถาม ครูเลยอยากเล่ามากขึ้น แปลกดีนะ ไว้วันหลังนะจ๊ะ"

  - id: toey_f_debt
    topic: self
    when: { heart_min: 5 }
    npc: "ทุกวันที่ยี่สิบห้า ครูจะไม่เปิดดูสลิปเงินเดือนจ้ะ… ครูรู้อยู่แล้วว่าสหกรณ์หักไปก่อนครูจะเห็น"
    options:
      - text: "หนี้อะไรเหรอ{kq} ถ้าเล่าได้"
        heart: 1
        reply: "ค่ารักษาแม่จ้ะ… แม่ป่วยสองปี ครูกู้ทุกที่ที่ครูกู้ได้ แม่จากไปแล้ว หนี้ยังอยู่ ครูไม่เสียใจที่กู้ ครูแค่เหนื่อยบางเดือน"
        next:
          - text: "ครูทำเพื่อแม่ดีที่สุดแล้ว"
            heart: 2
            reply: "… ขอบใจจ้ะ ไม่มีใครเคยพูดประโยคนี้กับครูเลย ทุกคนถามแค่ว่า ‘เท่าไหร่’"
          - text: "มีอะไรให้{p}ช่วยไหม{kq}"
            heart: 1
            reply: "ช่วยแล้วจ้ะ… ที่ฟัง ครูไม่ได้อยากได้เงิน ครูอยากได้คนรู้ว่าทำไมครูซื้อขนมชั้นชิ้นเดียวแทนสองชิ้น"
      - text: "ครูใช้เงินเก่งนะ ยังซื้อของให้เด็กได้"
        heart: 0
        reply: "เพราะเด็กไม่รู้ว่าครูมีหนี้จ้ะ… และครูอยากให้เขาไม่ต้องรู้"

  - id: toey_f_transfer
    topic: self
    when: { heart_min: 7 }
    npc: "เขตพื้นที่ถามครูว่าถ้ายุบรวม ครูอยากย้ายไปโรงเรียนไหน… ครูเขียนคำตอบไม่ได้สามวันแล้ว ช่องคำตอบมันเล็กเกินไป"
    options:
      - text: "ครูอยากอยู่ที่นี่ใช่ไหม{kq}"
        heart: 2
        reply: "ใช่จ้ะ… แต่ครูก็กลัวว่าถ้าอยู่เพราะ ‘ไม่อยากไป’ มันไม่พอ ครูต้องอยู่เพราะ ‘อยากอยู่’ แล้วตอนนี้ครูมีเหตุผลเพิ่มมาหนึ่งข้อ"
        next:
          - text: "เหตุผลข้อไหน{kq}"
            heart: 2
            reply: "… ข้อที่ยืนอยู่ตรงหน้าครูจ้ะ ครูพูดแล้วนะ ห้ามขอให้พูดซ้ำ ครูไม่ใช่ผู้ใหญ่สมศักดิ์"
          - text: "ไม่ว่าครูไปไหน{p}ก็ไปหาได้"
            heart: 2
            reply: "ไกลนะจ๊ะ… รถเมล์ลุงเชิดไปไม่ถึง แต่ครูจะจำไว้ว่ามีคนพูดแบบนี้"
      - text: "เขียนว่าไม่ย้ายไปเลย"
        heart: 1
        reply: "ระเบียบไม่มีช่องนั้นจ้ะ… แต่ครูจะเขียนตัวเล็กๆ ข้างช่อง ครูดื้อเงียบเก่งนะ"

  - id: toey_f_shoes
    topic: self
    when: { heart_min: 4, time: evening }
    npc: "ครูไปตลาดนัดซื้อรองเท้านักเรียนมาสองคู่ เบอร์สามสิบสามกับสามสิบห้า… ไม่ได้ซื้อให้ใครเป็นพิเศษ ซื้อเผื่อ"
    options:
      - text: "เผื่อใคร{kq}"
        heart: 1
        reply: "เผื่อเด็กที่รองเท้าขาดแล้วไม่กล้าบอกพ่อแม่จ้ะ… ครูจะบอกว่ามีคนลืมไว้ ของหายมีคนเก็บได้ เด็กเชื่อครูทุกครั้ง"
        next:
          - text: "ครูโกหกเพื่อเด็กเหรอ{kq}"
            heart: 1
            reply: "ครูเรียกว่าบทเรียนจ้ะ… บทเรียนว่าโลกนี้มีของดีหล่นอยู่บ้าง เด็กควรได้เรียนวิชานี้ก่อนโต"
          - text: "ครั้งหน้า{p}ช่วยออกครึ่งหนึ่ง"
            heart: 2
            reply: "… ครั้งหน้าเราไปเลือกด้วยกันนะจ๊ะ แล้วต้องโกหกเด็กด้วยกันนะ"
      - text: "ครูใจดีเกินไปแล้ว"
        heart: 0
        reply: "ไม่เกินจ้ะ คู่ละสองร้อย ใจดีได้แค่สองคู่ต่อเดือน… ครูคำนวณแล้ว"

  # ===== others =====
  - id: toey_o_mew_oat
    topic: others
    npc: "น้องมิวกับน้องโอ๊ตทะเลาะกันเรื่องว่าผีกลัวดาวทองไหม… ครูต้องเป็นกรรมการ ครูตัดสินว่าผีไม่ได้เรียนกับครู"
    options:
      - text: "สองคนนั้นทะเลาะกันบ่อยไหม{kq}"
        heart: 1
        reply: "ทุกวันจ้ะ แต่ตอนกลับบ้านจับมือกันเดินทุกวันด้วย… เหมือนป้าแต๋วกับป้าพรตอนเด็กแหละ ครูว่า"
      - text: "ใครชนะ{kq}"
        heart: 1
        reply: "เสมอจ้ะ ได้ดาวคนละดวง… น้องโอ๊ตเอาดาวไปแปะบนประตูบ้าน บอกว่าทดลองว่าผีจะเข้าไหม ครูรอผลการทดลองอยู่"
        next:
          - text: "ผลทดลองออกมาว่าไง{kq}"
            heart: 1
            reply: "ยังไม่มีผีมาจ้ะ น้องโอ๊ตสรุปว่าได้ผลร้อยเปอร์เซ็นต์… ครูไม่กล้าบอกว่าบ้านเขาอยู่ติดเสาไฟ"
          - text: "เด็กสองคนนี้ฉลาดจัง"
            heart: 1
            reply: "ฉลาดคนละแบบจ้ะ มิวฉลาดตอบ โอ๊ตฉลาดถาม… โลกต้องการทั้งสองแบบ ครูต้องดูแลให้ทั้งสองแบบโตไป"
      - text: "เด็กเล่นแบบนี้ไม่เสียการเรียนเหรอ{kq}"
        heart: 0
        reply: "ไม่เสียจ้ะ เขาเถียงกันด้วยเหตุผล ครูถือว่าเป็นวิชาวิทยาศาสตร์นอกเวลา"

  - id: toey_o_somsak
    topic: others
    npc: "ผู้ใหญ่สมศักดิ์พูดหน้าเสาธงเรื่องความปลอดภัยทางน้ำ… ย้ำเรื่องห้ามเล่นน้ำในคลองสามรอบ เด็ก ป.1 เข้าใจว่าให้ไปเล่นสามรอบ"
    options:
      - text: "แล้วเด็กไปเล่นจริงไหม{kq}"
        heart: 1
        reply: "ไปยืนที่ริมคลองสามคนจ้ะ ครูวิ่งไปตามทัน เด็กบอก ‘ผู้ใหญ่บอกให้ทำสามรอบ’… ครูต้องอธิบายคำว่า ‘ย้ำ’ ใหม่ทั้งชั้น"
      - text: "ผู้ใหญ่พูดนานเหมือนเดิมไหม{kq}"
        heart: 1
        reply: "นานจ้ะ แต่ครูเริ่มชอบแล้ว… ระหว่างที่ผู้ใหญ่ย้ำ ครูได้นับหัวเด็กครบสามรอบเหมือนกัน"
      - text: "ผู้ใหญ่ก็หวังดี{k}"
        heart: 1
        reply: "หวังดีมากจ้ะ ผู้ใหญ่มาทุกวันจันทร์ตรงเวลา ไม่เคยขาด… ครูนับถือคนที่มาตรงเวลาให้เด็กเสมอ"

  - id: toey_o_kla
    topic: others
    when: { heart_min: 2 }
    npc: "กล้าส่งผักมาแล้ววางไว้หน้าห้องครัวแล้วรีบกลับทุกวันจ้ะ… ครูไม่เคยทันจ่ายเงินหรือขอบใจเลย"
    options:
      - text: "เขาอายเหรอ{kq}"
        heart: 1
        reply: "ครูว่าเขาไม่อยากให้ครูรู้สึกติดหนี้จ้ะ… ครูเลยแอบวางขนมชั้นไว้บนมอเตอร์ไซค์เขาแทน เราเล่นซ่อนแอบกันด้วยของกิน"
      - text: "กล้าเป็นคนดีนะ"
        heart: 1
        reply: "ดีจ้ะ ดีแบบใจร้อนนิดหนึ่ง… เวลาพูดเรื่องสหกรณ์เขาพูดเร็วจนเด็ก ป.2 ตามไม่ทัน แต่ผักเขาพูดแทนได้ทุกอย่าง"
        next:
          - text: "ครูชอบกล้าเหรอ{kq}"
            heart: 0
            reply: "ชอบแบบเพื่อนร่วมงานจ้ะ… ครูตอบชัดเจนนะ ห้ามเอาไปเล่าให้ป้าแต๋วฟังเด็ดขาด"
          - text: "{p}จะไปบอกเขาให้ว่าครูขอบใจ"
            heart: 1
            reply: "ฝากด้วยนะจ๊ะ บอกว่าเด็กกินผักบุ้งหมดทุกจาน… อันนี้ไม่จริงร้อยเปอร์เซ็นต์ แต่จริงเก้าสิบ"

  - id: toey_o_ann
    topic: others
    npc: "หมอแอนมาตรวจฟันเด็กวันนี้จ้ะ… เด็กคนหนึ่งร้องไห้ หมอแอนเลยให้ตรวจฟันครูก่อนเป็นตัวอย่าง ครูต้องอ้าปากต่อหน้าเด็กทั้งห้อง"
    options:
      - text: "ฟันครูเป็นไงบ้าง{kq}"
        heart: 1
        reply: "หมอแอนบอกว่า ‘ฟันผุหนึ่งซี่ เพราะขนมชั้น’… ทั้งห้องหัวเราะ ครูได้เป็นบทเรียนเรื่องน้ำตาลไปเลยจ้ะ"
        next:
          - text: "ครูเสียสละเพื่อการศึกษาเลย"
            heart: 2
            reply: "ใช่จ้ะ ครูให้ตัวเองดาวทองหนึ่งดวง… แปะไว้ที่ฟันซี่นั้นไม่ได้ ก็แปะที่สมุดแทน"
          - text: "ลดขนมชั้นบ้างนะ{kq}"
            heart: 0
            reply: "ไม่ได้จ้ะ ขนมชั้นคือแม่… ครูจะแปรงฟันให้นานขึ้นแทน ตกลงกับหมอแอนแล้ว"
      - text: "หมอแอนกับครูสนิทกันไหม{kq}"
        heart: 1
        reply: "สนิทจ้ะ เราสองคนเป็นผู้หญิงทำงานที่กลับบ้านดึกที่สุดในตำบล… บางคืนเราโทรหากันว่า ‘ยังไม่นอนเหรอ’ แล้วก็ไม่มีใครนอน"

  - id: toey_o_sumet
    topic: others
    npc: "พระอาจารย์สุเมธยกห้องสมุดบนศาลาให้เด็กใช้ทุกเย็นจ้ะ… เณรต้นเป็นบรรณารักษ์ จดชื่อคนยืมด้วยลายมือที่ลุงจำรัสบอกว่าเหมือนไก่เขี่ย"
    options:
      - text: "อ่านออกไหม{kq}"
        heart: 1
        reply: "ครูอ่านออกจ้ะ ครูอ่านลายมือเด็กมาเจ็ดปี… ไก่เขี่ยของเณรต้นถือว่าเป็นไก่ที่ตั้งใจมาก"
      - text: "หลวงพ่อช่วยโรงเรียนเยอะนะ"
        heart: 1
        reply: "เยอะมากจ้ะ ท่านไม่เคยขออะไรคืน ขอแค่ให้เด็กไหว้หมาวัดก่อนเข้าห้องสมุด… ไม่ใช่สิ ให้ระวังเหยียบหมาวัด ถ่านนอนขวางบันไดประจำ"
        next:
          - text: "ไปช่วยจัดหนังสือกันไหม{kq}"
            heart: 2
            reply: "ไปจ้ะ! วันเสาร์บ่าย ครูจะทำป้ายหมวดหมู่ใหม่… หมวดสัตว์ เณรต้นขอให้มีหมวดย่อย ‘หมา’ แยกต่างหาก"
          - text: "ถ่านเป็นบรรณารักษ์ด้วยไหม{kq}"
            heart: 1
            reply: "เป็นยามจ้ะ… นอนเฝ้าทุกเย็น ไม่เคยกัดใคร ไม่เคยตื่นด้วย"

  - id: toey_o_cherd
    topic: others
    npc: "ลุงเชิดจอดรถเมล์เที่ยวเช้าหน้าโรงเรียนทุกวันจ้ะ ทั้งที่ไม่ใช่ป้าย… ลุงบอกว่า ‘เด็กไม่ใช่ผู้โดยสาร เด็กเป็นสัมภาระสำคัญ’"
    options:
      - text: "ลุงไม่เก็บค่ารถเด็กเหรอ{kq}"
        heart: 1
        reply: "ลุงเก็บจ้ะ เด็กจ่ายเป็นรูปวาดเจ้าเขียวคนละรูป… ลุงติดรูปไว้บนรถครบทุกที่นั่งแล้ว ตอนนี้ติดเพดาน"
      - text: "ลุงเชิดใจดีนะ"
        heart: 1
        reply: "ใจดีแต่ตรงเวลาจ้ะ เด็กมาสายหนึ่งนาทีลุงไม่รอ… ลุงบอกว่าสอนเรื่องเวลาไปด้วย ครูเลยไม่ต้องสอนวิชานี้เลย"
      - text: "แบบนี้ผิดกฎไหม{kq}"
        heart: 0
        reply: "ครูไม่ถามจ้ะ… ครูแค่โบกมือขอบคุณทุกเช้า ระเบียบบางข้อเขียนไว้ก่อนจะมีลุงเชิด"

quests:
  - id: toey_q1
    npc: toey
    title: "นิทานวันพฤหัส"
    desc: "ครูเต้ยหาคนอ่านนิทานให้เด็กๆ ฟัง และกล่องสีเทียนกล่องใหม่"
    start: { heart_min: 1, day_min: 3 }
    offer:
      npc: "พฤหัสนี้คาบสุดท้ายครูต้องส่งแฟ้มที่เขตจ้ะ เด็กจะว่างหนึ่งคาบ… ถ้ามีใครมาอ่านนิทานให้ฟังแทนครู ครูจะให้ดาวทองล่วงหน้าเลยนะ"
      options:
        - text: "{p}อ่านให้{k} ชอบอ่านอยู่แล้ว"
          accept: true
          heart: 2
          reply: "ดีใจจัง! ครูให้สิบเต็มสิบ… แล้วถ้าแวะร้านป้าแต๋วได้ ซื้อสีเทียนกล่องใหญ่มาสักกล่องได้ไหมจ๊ะ กล่องเก่าเหลือแต่สีขาว"
        - text: "อ่านเป็นแต่ไม่เก่งนะ{kq}"
          accept: true
          heart: 1
          reply: "ไม่ต้องเก่งจ้ะ เด็กไม่ได้ฟังเสียง เด็กฟังว่ามีคนมาหา… อ่านผิดก็หัวเราะด้วยกันได้"
        - text: "เด็กเยอะ ไม่ไหวหรอก{k}"
          reply: "ไม่เป็นไรจ้ะ ครูเข้าใจ… เด็กสี่สิบสองคนก็เยอะจริงๆ ครูนับทุกวัน"
    steps:
      - goal: { type: give, npc: toey, item: crayon_big, n: 1 }
        hint: "ซื้อสีเทียนกล่องใหญ่ที่ร้านป้าแต๋ว แล้วเอาไปให้ครูเต้ย"
        done:
          npc: "สีเทียนกล่องใหญ่! หกสิบสี่สี… ครูนับแล้ว เด็กๆ จะได้วาดฟ้าด้วยสีฟ้าสักที เทอมนี้ฟ้าในรูปเด็กเป็นสีม่วงทั้งโรงเรียน"
          options:
            - text: "ทำไมฟ้าเป็นสีม่วง{kq}"
              heart: 1
              reply: "เพราะสีฟ้าหมดตั้งแต่เดือนแรกจ้ะ เด็กใช้สีม่วงแทน… ครูให้คะแนนเต็มทุกรูป ครูไม่หักคะแนนเพราะความจน"
            - text: "ครั้งหน้า{p}ซื้อมาอีก{k}"
              heart: 1
              reply: "ครูไม่ได้ขอนะจ๊ะ… แต่ครูจะจดชื่อ {player} ไว้ในใบเกียรติบัตร ‘ผู้สนับสนุนสีฟ้า’"
      - goal: { type: visit, place: school, from: "13:00", to: "15:00" }
        hint: "ไปโรงเรียนช่วงบ่ายเพื่ออ่านนิทานให้เด็กๆ ฟัง"
        done:
          npc: "ครูกลับมาทันตอนจบพอดี… เด็กทั้งห้องนั่งนิ่งเลยนะจ๊ะ ครูไม่เคยเห็นห้อง ป.3 นิ่งแบบนี้ตั้งแต่วันหยุดยาว"
          options:
            - text: "น้องโอ๊ตถามคำถามเยอะมากเลย{k}"
              heart: 1
              reply: "เขาถามกี่ข้อจ๊ะ… สิบสี่ข้อ! ทำลายสถิติที่ถามครูเลย ครูให้ {player} ดาวทองความอดทนเพิ่มอีกหนึ่ง"
            - text: "{p}เปลี่ยนตอนจบเหมือนยายด้วย"
              heart: 2
              set_flag: toey_q1_like_gran
              reply: "จริงเหรอ… เด็กๆ เลยปรบมือกันใหญ่ใช่ไหม ครูได้ยินมาจากทางเดิน ยายเพียรคงยิ้มอยู่นะจ๊ะ"
            - text: "เหนื่อยกว่าทำงานในแปลงอีก"
              heart: 0
              reply: "ใช่ไหมจ๊ะ… ครูทำแบบนี้ทุกวันวันละหกคาบ ตอนนี้ {player} รู้แล้วว่าทำไมครูหลับเร็ว"
    sold_at: { crayon_big: taew_shop }
    reward: { money: 100, heart: 2, items: { khanom_chan: 2 }, set_flag: toey_q1_done, line: { from: toey, text: "ขอบคุณนักอ่านรับเชิญประจำวันพฤหัสค่ะ ⭐ เด็ก ป.3 ฝากบอกว่าเรื่องสนุกกว่าครูเล่าอีก (ครูให้ความซื่อสัตย์นี้สิบเต็มสิบ) 📚" } }

  - id: toey_q2
    npc: toey
    title: "หลังคาห้อง ป.4"
    desc: "ห้อง ป.4 รั่วเจ็ดจุด เขตบอกปีหน้า ครูเต้ยตัดสินใจไม่รอ"
    start: { flag: toey_q1_done, heart_min: 3, day_min: 7 }
    offer:
      npc: "เขตตอบมาอีกแล้วจ้ะ ‘ปีงบประมาณถัดไป’… ครูตัดสินใจแล้ว ครูจะซ่อมเองด้วยเงินเก็บ แต่ครูไม่รู้ว่าต้องเริ่มจากตรงไหน"
      options:
        - text: "ไปหาช่างเปี๊ยกกัน{k}"
          accept: true
          heart: 1
          reply: "ช่างเปี๊ยกใช่ไหมจ๊ะ… ครูกลัวเขาคิดแพง ครูไม่ได้เก็บเงินไว้เยอะนะ ครูมีซองฉุกเฉินซองเดียว"
        - text: "{p}ช่วยหาไม้มาด้วย{k}"
          accept: true
          heart: 2
          reply: "ไม้ฟืนจากฟาร์มยายใช้ทำโครงรองได้ไหมนะ… ครูไม่รู้เรื่องช่าง ครูรู้แค่ว่าห้องที่ไม่รั่วเด็กจะไม่ต้องย้ายไปเรียนโรงอาหาร"
        - text: "ครูไม่ควรใช้เงินตัวเองนะ{kq}"
          reply: "ครูรู้จ้ะ… แต่ถ้ารอ เด็กรุ่นนี้จะจบไปก่อนหลังคาจะซ่อม ไว้ถ้าเปลี่ยนใจมาบอกครูนะ"
    steps:
      - goal: { type: talk, npc: piak }
        hint: "ไปปรึกษาช่างเปี๊ยกที่ร้านช่างเรื่องหลังคาโรงเรียน"
        done:
          npc: "หลังคาโรงเรียนเหรอ… ผมเรียนห้องนั้นตอน ป.4 นะ ตอนนั้นก็รั่วแล้ว ค่าแรงไม่เอา ขอแค่ค่าสังกะสีกับไม้โครง แล้วถ้าฝนไม่ตกก็พรุ่งนี้"
          options:
            - text: "ค่าของเท่าไหร่{kq}ช่าง"
              heart: 0
              reply: "สังกะสีเก้าแผ่น ผมมีเหลือจากงานหลังคาศาลาวัดสามแผ่น… ส่วนที่ขาดสักสี่ร้อย ไม้โครงหามาได้ผมไม่คิดเลย"
            - text: "ช่างจำห้องนั้นได้ด้วยเหรอ{kq}"
              heart: 1
              reply: "จำได้สิ ผมนั่งตรงจุดที่หยดดังที่สุด… ครูสมัยนั้นให้ผมถือกะละมังทั้งคาบ นี่แหละผมเลยเป็นช่างหลังคา"
      - goal: { type: give, npc: piak, item: wood, n: 6 }
        hint: "เก็บไม้ฟืน 6 ท่อนไปให้ช่างเปี๊ยกทำไม้โครง"
        done:
          npc: "ไม้ยายเพียรเนื้อแน่นดี แห้งพอด้วย ยายคงตากไว้นาน… เอาไปทำโครงได้หกช่วงพอดี"
          options:
            - text: "ใช้ได้ไหม{kq}ช่าง"
              heart: 1
              reply: "ใช้ได้ดีกว่าไม้จากร้านอีก ไม้ร้านมันเปียกกลาง… ยายเพียรเคยเอาไม้มาให้ผมซ่อมเล้าไก่โรงเรียนเหมือนกันนะ ตอนนั้นผมยังเด็กฝึกงาน"
            - text: "ไม้ยายจะได้อยู่บนหัวเด็กๆ"
              heart: 1
              reply: "ใช่ ยายคุ้มหัวเด็กๆ ไปอีกหลายปี… ผมพูดแบบนี้ครูเต้ยร้องไห้แน่ อย่าบอกครูนะ"
      - goal: { type: pay, npc: piak, n: 400 }
        hint: "จ่ายค่าสังกะสีส่วนที่ขาดให้ช่างเปี๊ยก 400 บาท ก่อนครูเต้ยจะควักเงินเอง"
        done:
          npc: "ได้ครบแล้ว พรุ่งนี้เริ่ม ถ้าฝนไม่ตก… ครูเต้ยรู้หรือยังว่าใครจ่าย ถ้ายังผมไม่บอกนะ ผมปากหนักกว่าป้าแต๋วเยอะ"
          options:
            - text: "อย่าบอกครูนะ{kq}"
              heart: 1
              set_flag: toey_q2_secret
              reply: "ได้ ผมจะบอกว่ามีคนลืมเงินไว้ ของหายมีคนเก็บได้… ครูชอบพูดแบบนี้กับเด็กไม่ใช่เหรอ ใช้กลับไปที่ครูบ้าง"
            - text: "บอกได้{k} ครูจะได้ไม่ต้องควักเงิน"
              heart: 0
              set_flag: toey_q2_told
              reply: "ได้ เดี๋ยวผมบอก… แต่ครูจะไปซื้อขนมชั้นมาให้คุณทั้งถาดแน่ ทำใจไว้"
      - goal: { type: talk, npc: toey }
        hint: "ไปดูหลังคาใหม่ที่โรงเรียนกับครูเต้ย"
        done:
          npc: "ฝนตกเมื่อคืนแล้วห้อง ป.4 แห้งสนิทเลยจ้ะ… เด็กๆ เสียใจนิดหนึ่ง จุดที่ชื่อ ‘ผู้ใหญ่สมศักดิ์’ หายไปแล้ว ครูจะติดป้ายขอบคุณที่ผนัง ควรเขียนชื่อใครดีจ๊ะ"
          options:
            - text: "เขียนว่า ‘ชุมชนบ้านดงเย็น’ ก็พอ"
              heart: 2
              set_flag: toey_roof_community
              reply: "ครูชอบที่สุดเลยจ้ะ… ทุกคนได้เป็นเจ้าของหลังคา เด็กจะได้รู้ว่าเวลาไม่มีใครมาช่วย เราก็ช่วยกันเองได้"
            - text: "เขียนชื่อยายเพียร ไม้ของยาย"
              heart: 2
              set_flag: toey_roof_gran
              reply: "‘หลังคานี้มีไม้ของยายเพียร’… ครูจะให้เด็ก ป.4 เขียนป้ายเอง ลายมือเบี้ยวๆ ยายคงชอบแบบนั้นมากกว่า"
            - text: "เขียนว่า ‘เขตพื้นที่ ปีงบประมาณถัดไป’"
              heart: 1
              set_flag: toey_roof_joke
              reply: "… {player}! ครูขำจนน้ำตาไหล ครูเขียนไม่ได้หรอก แต่ครูจะเขียนลงในใจไว้ทุกครั้งที่เดินผ่าน"
    reward: { money: 0, heart: 2, items: { khanom_chan: 3 }, set_flag: toey_q2_done, line: { from: toey, text: "☔ ข่าวดีจากโรงเรียนบ้านดงเย็น ห้อง ป.4 ไม่รั่วแล้วนะคะ! ขอบคุณช่างเปี๊ยกและทุกมือที่ช่วยกันค่ะ เด็กๆ ส่งดาวทองให้ทุกคน ⭐⭐⭐" } }

  - id: toey_q3
    npc: toey
    title: "เคาะประตูหาเด็ก"
    desc: "นักเรียนจะต่ำกว่าเกณฑ์ ครูเต้ยต้องหาทางให้เด็กหมู่ 4 ไม่ต้องย้ายไปเรียนในอำเภอ"
    start: { flag: toey_q2_done, heart_min: 5, day_min: 12 }
    offer:
      npc: "พ่อแม่หมู่ 4 จะย้ายลูกไปเรียนอำเภอสามบ้าน… เขาไม่ได้ไม่ชอบโรงเรียนนะจ๊ะ เขาบอกว่าถนนเข้าหมู่ 4 ไกล ไม่มีใครมาส่ง ครูไม่รู้จะทำยังไงแล้ว"
      options:
        - text: "ถ้ามีรถรับส่งเด็กก็จบใช่ไหม{kq}"
          accept: true
          heart: 2
          reply: "… ใช่จ้ะ แต่โรงเรียนไม่มีรถ ไม่มีงบจ้างรถ… {player} คิดอะไรอยู่ หน้าเหมือนน้องโอ๊ตตอนจะถามคำถามที่สิบห้าเลย"
        - text: "ไปเคาะประตูชวนด้วยกัน{k}"
          accept: true
          heart: 1
          reply: "ครูเตรียมตารางเดินบ้านไว้แล้วจ้ะ… ครูเดินคนเดียวมาสามปี เดินสองคนคงไม่เหนื่อยเท่า"
        - text: "บางทีย้ายไปก็ดีกว่านะ{kq}"
          reply: "อาจจะดีจ้ะ… ครูไม่ได้บังคับใคร แต่ถ้าเปลี่ยนใจอยากช่วย ครูยังอยู่ตรงนี้"
    steps:
      - goal: { type: talk, npc: cherd }
        hint: "ถามลุงเชิดว่ารถเมล์เที่ยวหกโมงแวะรับเด็กหมู่ 4 ได้ไหม"
        done:
          npc: "เด็กหมู่ 4 เหรอหลาน… เที่ยวหกโมงลุงอ้อมไปหมู่ 4 ได้ เพิ่มสิบนาที แต่ลุงออกหกโมงตรงนะ ใครมาไม่ทันลุงไม่รอ ขึ้นๆ ออกแล้ว"
          options:
            - text: "ค่ารถเด็กเท่าไหร่{kq}ลุง"
              heart: 1
              reply: "ลุงเก็บเป็นรูปวาดเหมือนเดิม… เพดานเจ้าเขียวยังว่างอีกครึ่ง ลุงอยากได้รูปทะเล ลุงไม่เคยเห็นทะเล"
            - text: "ลุงเหนื่อยเพิ่มไหม{kq}"
              heart: 1
              reply: "สิบนาทีเอง… รถว่างก็ไม่มีใครคุยกับลุง มีเด็กขึ้นมาคุยแจ้วๆ ลุงตื่นดีกว่ากินกาแฟอีก"
      - goal: { type: talk, npc: taew }
        hint: "ขอให้ป้าแต๋วช่วยกระจายข่าวรถรับส่งเด็กให้พ่อแม่หมู่ 4"
        done:
          npc: "รถเมล์ลุงเชิดรับเด็กหมู่ 4 เหรอหลาน! ป้าบอกแม่น้องเก่งให้ภายในห้านาที แม่น้องเก่งบอกบ้านข้างๆ ภายในสามนาที… ป้าไม่ได้พูดนะ ป้าแค่ส่งต่อ"
          options:
            - text: "ป้านี่สุดยอดจริงๆ"
              heart: 1
              reply: "ข่าวดีป้าส่งเร็วกว่าข่าวร้ายอีกนะหลาน คนชอบคิดว่าป้าส่งแต่ข่าวร้าย… อันนั้นป้าแค่ส่งดังกว่า"
            - text: "ป้าบอกด้วยว่าครูเต้ยดีใจมาก"
              heart: 1
              reply: "บอกแล้ว ป้าบอกว่าครูเต้ยร้องไห้… ครูยังไม่ได้ร้องเหรอ เดี๋ยวก็ร้อง ป้ารู้จักครู"
      - goal: { type: visit, place: school, from: "07:00", to: "08:00" }
        hint: "ไปที่โรงเรียนตอนเช้าเพื่อดูเด็กหมู่ 4 ลงจากรถเมล์"
        done:
          npc: "สี่สิบหก… สี่สิบหกคนจ้ะ ครูนับสามรอบ เด็กหมู่ 4 มาครบ แล้วยังมีน้องสองคนที่ไม่เคยเรียนเลยมาด้วย เพราะรถเมล์มันผ่านหน้าบ้าน"
          options:
            - text: "ครูร้องไห้แล้วนะ"
              heart: 1
              reply: "ครูไม่ได้ร้องจ้ะ ฝุ่นเข้าตา… ฝุ่นเข้าทั้งสองข้างพร้อมกันพอดี"
            - text: "เกินเกณฑ์แล้วใช่ไหม{kq}"
              heart: 2
              set_flag: toey_school_safe_year
              reply: "เกินสี่คนจ้ะ… ปีนี้โรงเรียนรอดแล้ว ปีหน้าเราค่อยสู้ใหม่ ครูไม่เคยคิดว่าจะพูดคำว่า ‘เรา’ ได้เต็มปากแบบนี้"
            - text: "ลุงเชิดต่างหากที่เก่ง"
              heart: 1
              reply: "ลุงเชิดเก่ง ป้าแต๋วเก่ง… แต่คนคิดคือ {player} ครูไม่ยอมให้หลบคะแนนนี้นะจ๊ะ"
    reward: { money: 150, heart: 2, items: { color_paper: 3 }, set_flag: toey_q3_done, line: { from: toey, text: "🚌 ตั้งแต่พรุ่งนี้ รถเมล์ลุงเชิดเที่ยว 6 โมงรับเด็กหมู่ 4 มาโรงเรียนนะคะ ออกตรงเวลา ลุงไม่รอ! ค่ารถเป็นรูปวาดทะเลหนึ่งรูปค่ะ 🌊" } }

  - id: toey_q4
    npc: toey
    title: "แฟ้มที่สิบสาม"
    desc: "คืนก่อนวันประเมินโรงเรียน ครูเต้ยมีเรื่องที่ไม่เคยบอกใคร"
    start: { flag: toey_q3_done, heart_min: 7, day_min: 16 }
    offer:
      npc: "พรุ่งนี้เขตมาประเมินจ้ะ ครูทำแฟ้มครบสิบสองแฟ้มแล้ว… เหลือแฟ้มที่สิบสาม ‘แผนพัฒนาตนเองของครู’ ครูเขียนไม่ออก ครูไม่รู้ว่าตัวเองอยากพัฒนาไปเป็นอะไร… มานั่งเป็นเพื่อนครูได้ไหมจ๊ะ"
      options:
        - text: "ได้{k} เดี๋ยว{p}เอาขนมชั้นไปด้วย"
          accept: true
          heart: 2
          reply: "ขนมชั้นเหรอ… ครูไม่ได้ขอนะ แต่ครูจะไม่ปฏิเสธ คืนนี้ครูต้องการน้ำตาลกับเพื่อน อย่างละหนึ่ง"
        - text: "ครูนอนเถอะ แฟ้มรอได้"
          accept: true
          heart: 1
          reply: "แฟ้มรอไม่ได้จ้ะ เขาจะมาแปดโมง… แต่ถ้ามีคนมานั่งด้วย ครูอาจเขียนเสร็จก่อนสามทุ่ม แล้วได้นอนจริงๆ"
        - text: "คืนนี้ไม่ว่าง{k}"
          reply: "ไม่เป็นไรจ้ะ ครูทำคนเดียวมาเจ็ดปีแล้ว… ขอให้คืนนี้ {player} ได้นอนเต็มอิ่มนะ"
    steps:
      - goal: { type: give, npc: toey, item: khanom_chan, n: 1 }
        hint: "ซื้อขนมชั้นที่ตลาดไปให้ครูเต้ย"
        done:
          npc: "สิบชั้น… ชั้นละสี ครูนับ ไม่ใช่ของแม่หรอก แต่หวานน้อยกว่าที่ครูทำ… นิดหนึ่ง"
          options:
            - text: "นิดหนึ่งที่ครูหามาตลอดเหรอ{kq}"
              heart: 2
              reply: "… อาจจะใช่จ้ะ หรืออาจจะเพราะมีคนซื้อมาให้ ครูไม่รู้ว่าอันไหน ครูขอเชื่อทั้งสองอย่างนะ"
            - text: "กินเลย{k} แล้วค่อยเขียน"
              heart: 1
              reply: "ครูให้คำแนะนำนี้สิบเต็มสิบจ้ะ… ครูชอบคนสั่งครูได้ ไม่มีใครกล้าสั่งครูเลยมาเจ็ดปี"
      - goal: { type: visit, place: school, from: "17:00", to: "20:00" }
        hint: "ไปนั่งเป็นเพื่อนครูเต้ยทำแฟ้มที่โรงเรียนตอนหัวค่ำ (กลับก่อนสามทุ่ม)"
        done:
          npc: "ครูเขียนได้แล้วหนึ่งบรรทัดจ้ะ ‘ครูอยากเป็นครูที่ไม่ต้องแบกทุกอย่างคนเดียว’… อ่านแล้วไม่เหมือนแผนพัฒนาเลยใช่ไหม"
          options:
            - text: "เหมือนที่สุดแล้ว{k}"
              heart: 2
              reply: "… งั้นครูจะส่งบรรทัดนี้จริงๆ นะ ถ้าเขตให้ศูนย์ ครูยอม ครูให้ตัวเองสิบ"
            - text: "เขียนต่อสิ แล้วจะทำยังไง"
              heart: 1
              reply: "บรรทัดที่สอง ‘ขอความช่วยเหลือเมื่อต้องการ’… ครูเขียนแล้วมือสั่น ครูไม่เคยขอใครเลยนะจ๊ะ"
      - goal: { type: talk, npc: toey }
