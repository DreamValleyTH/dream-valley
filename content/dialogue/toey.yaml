  - id: toey_a_elders
    topic: advice
    npc: "ถ้าจะขอให้ผู้ใหญ่ในตำบลช่วยอะไร ไปตอนเขากินข้าวเสร็จนะจ๊ะ ห้ามไปตอนเขาหิว… ครูเรียนรู้จากการขอผักกล้าตอนเที่ยง"
    options:
      - text: "ตอนนั้นเกิดอะไรขึ้น{kq}"
        heart: 1
        reply: "กล้าบอก ‘ไม่ได้’ ตอนเที่ยงห้านาที แล้วบอก ‘ได้’ ตอนบ่ายโมง โดยที่ครูยังไม่ได้ถามรอบสองเลยจ้ะ"
      - text: "ใช้กับเด็กได้ด้วยไหม{kq}"
        heart: 1
        reply: "ใช้ได้จ้ะ เด็กหิวไม่ฟังอะไรทั้งนั้น… ผู้ใหญ่ก็คือเด็กที่ตัวโตแล้วต้องทำงานนั่นแหละ"
      - text: "ฟังดูเหมือนจิตวิทยาหลอกคน{k}"
        heart: 0
        reply: "ไม่ใช่หลอกจ้ะ เรียกว่าเคารพเวลาอาหารของเขา… ครูให้ความระแวงนี้หกเต็มสิบนะ"

  - id: toey_a_read
    topic: advice
    when: { time: evening }
    npc: "เย็นๆ ถ้าเหนื่อยจนนอนไม่หลับ ลองอ่านหนังสือนิทานเด็กดูนะจ๊ะ… ประโยคสั้น จบดี ไม่มีใครตาย ครูอ่านทุกคืนที่แฟ้มไม่จบ"
    options:
      - text: "ครูมีเล่มไหนแนะนำ{kq}"
        heart: 1
        reply: "‘กระต่ายน้อยหาบ้าน’ จ้ะ อ่านจบในสามนาที กระต่ายหาบ้านเจอในหน้าสุดท้าย… ครูอ่านแล้วนึกถึง {player} ไม่รู้ทำไม"
        next:
          - text: "เพราะ{p}เพิ่งหาบ้านเจอเหรอ{kq}"
            heart: 2
            reply: "ใช่จ้ะ… กระต่ายในเล่มนั้นก็มีคนรอที่บ้านเหมือนกัน ยายเพียรคงรออยู่นะ"
          - text: "ขอยืมได้ไหม{kq}"
            heart: 1
            reply: "ได้จ้ะ คืนวันพฤหัส แล้วต้องเล่าให้ครูฟังด้วยว่าชอบหน้าไหน… ครูเป็นครู ครูต้องถามทุกครั้ง"
      - text: "{p}ไม่ใช่เด็กแล้วนะ{k}"
        heart: 0
        reply: "ผู้ใหญ่ก็อ่านนิทานได้จ้ะ นิทานไม่ได้เช็กบัตรประชาชน"

  # ===== smalltalk =====
  - id: toey_s_score_cat
    topic: smalltalk
    npc: "แมวส้มป้าแต๋วเดินเข้ามาในห้องเรียนตอนครูสอนคณิต นั่งฟังจนจบคาบ… ครูให้แมวสิบเต็มสิบ ฟังดีกว่าเด็กบางคน"
    options:
      - text: "แล้วเด็กว่าไง{kq}"
        heart: 1
        reply: "น้องโอ๊ตยกมือถามว่าแมวต้องทำการบ้านไหม… ครูบอกว่าแมวมีการบ้านคือจับหนูในห้องสมุด แมวทำได้ดีกว่าเด็กทำการบ้านอีก"
      - text: "ครูให้คะแนนแมวด้วยเหรอ{kq}"
        heart: 1
        reply: "ครูให้คะแนนทุกอย่างจ้ะ ฝนวันนี้ได้เจ็ด ก๋วยเตี๋ยวพี่หน่อยได้เก้า… {player} อยากรู้ไหมว่าตัวเองได้เท่าไหร่"
        next:
          - text: "อยากรู้{k}"
            heart: 1
            reply: "ความลับจ้ะ… แต่บอกได้ว่าคะแนนขึ้นทุกครั้งที่มาคุยกับครู อาทิตย์นี้ขึ้นมาสองคะแนนแล้ว"
          - text: "ไม่อยากรู้ กลัวได้น้อย"
            heart: 1
            reply: "ไม่น้อยหรอกจ้ะ ครูไม่ให้ใครน้อยกว่าห้า ห้าคือ ‘พยายามต่อนะ’ ครูชอบคำนี้"
      - text: "แมวเข้าห้องเรียนได้ด้วยเหรอ{kq}"
        heart: 0
        reply: "ระเบียบไม่ได้เขียนห้ามแมวนะจ๊ะ… ครูตรวจแล้ว เขียนห้ามแค่สุนัข"

  - id: toey_s_handwriting
    topic: smalltalk
    npc: "ลุงจำรัสเขียนป้ายห้องเรียนให้ครูจ้ะ ตัวสวยมาก… สวยจนเด็กไม่กล้าเขียนชื่อตัวเองใต้ป้าย กลัวลายมือตัวเองดูแย่"
    options:
      - text: "ครูเขียนสวยไหม{kq}"
        heart: 1
        reply: "ครูเขียนแบบครูจ้ะ ชัด กลม อ่านง่าย ไม่สวย… เด็กเขียนตามครูหมดทั้งโรงเรียน ทั้งตำบลเลยลายมือหน้าตาเหมือนกัน"
      - text: "ให้เด็กเขียนป้ายเองดีกว่านะ"
        heart: 2
        reply: "ดีมากเลยจ้ะ! ป้ายลายมือเด็กสี่สิบสองแบบ เบี้ยวทุกตัว ครูชอบเบี้ยวๆ… แต่ห้ามบอกลุงจำรัสว่าครูเปลี่ยนป้ายนะ"
        next:
          - text: "ลุงจะน้อยใจเหรอ{kq}"
            heart: 1
            reply: "ลุงจะจดลงสมุดว่า ‘ป้ายไม้หนึ่งแผ่น เลิกใช้’ แล้วถามครูว่าวันที่เท่าไหร่… ลุงไม่น้อยใจ ลุงแค่ละเอียด"
          - text: "เก็บป้ายลุงไว้หน้าห้องสมุดสิ"
            heart: 1
            reply: "ความคิดดีจ้ะ ทุกคนได้ที่ของตัวเอง… {player} คิดแบบครูเลยนะ ครูเริ่มกลัวแล้ว"

  - id: toey_s_karaoke
    topic: smalltalk
    npc: "ปีใหม่นี้ อบต. จะจัดคาราโอเกะอีกแล้วจ้ะ… เด็กๆ ลงชื่อให้ครูร้องโดยที่ครูไม่รู้ ตอนนี้ครูอยู่ในรายชื่อลำดับที่หนึ่ง"
    options:
      - text: "ครูจะร้องเพลงอะไร{kq}"
        heart: 1
        reply: "ครูร้องได้เพลงเดียวจ้ะ เพลงที่ใช้สอนเด็กรำวง… ครูร้องแล้วทั้งงานรำตามกันหมด คะแนนคาราโอเกะมันไม่นับคนรำ"
      - text: "ร้องคู่กันไหม{kq}"
        heart: 2
        reply: "… ร้องคู่เหรอจ๊ะ ครูขอซ้อมที่บ้านพักครูก่อน ห้ามให้เด็กได้ยิน ถ้าเด็กได้ยิน ครูจะเป็นข่าวหน้าเสาธง"
        next:
          - text: "ซ้อมวันไหนดี{kq}"
            heart: 1
            reply: "หลังเลิกเรียนวันศุกร์จ้ะ ครูชงชาไว้สองแก้ว… แก้วหนึ่งไว้แก้เจ็บคอ อีกแก้วไว้แก้เขิน"
          - text: "เด็กได้ยินก็ไม่เป็นไรหรอก"
            heart: 1
            reply: "เป็นจ้ะ น้องมิวจะแต่งเพลงล้อ ครูรู้จักน้องมิวดี… แต่ถ้าเป็นข่าวเรื่องนี้ ครูก็ไม่ว่าหรอก"
      - text: "ครูร้องเพลงไม่เพราะเหรอ{kq}"
        heart: 0
        reply: "ไม่เพราะแต่ดังจ้ะ… ครูพูดหน้าเสาธงมาเจ็ดปี เสียงครูไปถึงหลังโรงเรียนโดยไม่ต้องใช้ไมค์"

  - id: toey_s_khanomchan
    topic: smalltalk
    npc: "เมื่อคืนครูทำขนมชั้นได้เก้าชั้นจ้ะ สูตรแม่ต้องได้สิบ… ชั้นที่สิบครูหลับไปก่อน ตื่นมามันเป็นชั้นที่เก้าครึ่ง"
    options:
      - text: "ชั้นที่เก้าครึ่งอร่อยไหม{kq}"
        heart: 1
        reply: "อร่อยจ้ะ แต่ไม่ใช่ของแม่… ของแม่หวานน้อยกว่านิดหนึ่ง ครูยังหาไม่เจอว่านิดหนึ่งนั้นคือเท่าไหร่"
        next:
          - text: "ไว้{p}ช่วยชิมได้นะ"
            heart: 2
            reply: "ได้จ้ะ ครูจะทำเผื่อ… ถ้า {player} บอกว่าเหมือนของแม่ ครูก็ยังไม่เชื่อหรอก แต่ครูจะดีใจ"
          - text: "บางทีนิดหนึ่งนั้นคือแม่เอง"
            heart: 2
            reply: "… ครูไม่เคยคิดแบบนั้น ครูขอเก็บประโยคนี้ไว้ในสมุดการบ้านของครูนะจ๊ะ"
      - text: "ซื้อที่ตลาดก็ได้นะ{kq}"
        heart: 0
        reply: "ได้จ้ะ ตลาดมีขายชิ้นละสามสิบ… แต่ขนมชั้นที่ครูทำเอง ทำให้ครูได้คุยกับแม่ทุกชั้น"

  - id: toey_s_ghostnovel
    topic: smalltalk
    when: { time: noon }
    npc: "พักเที่ยงครูอ่านนิยายผีจ้ะ ตอนนี้ถึงตอนที่นางเอกได้ยินเสียงเรียกชื่อตอนกลางคืน… ครูหยุดอ่านแล้ว เดี๋ยวคืนนี้นอนไม่หลับ"
    options:
      - text: "ยายบัวบอกว่าเรียกครั้งเดียวห้ามขาน"
        heart: 1
        reply: "ใช่! ยายบัวเล่าให้เด็ก ป.4 ฟัง ตอนนี้เด็กเรียกชื่อกันสองรอบทุกครั้ง… ครูเรียกชื่อเช็กชื่อตอนเช้าก็ต้องเรียกสองรอบแล้วจ้ะ"
      - text: "เล่าต่อให้ฟังหน่อย{k}"
        heart: 1
        reply: "ไม่ได้จ้ะ ครูจะเล่าตอนกลางวันเท่านั้น… พรุ่งนี้เที่ยงมาฟังนะ ครูให้คะแนนความกล้าคนฟังด้วย"
      - text: "ครูอ่านเรื่องผีทั้งที่กลัวทำไม{kq}"
        heart: 1
        reply: "เพราะตอนอ่านจบ ทุกอย่างในชีวิตจริงดูไม่น่ากลัวแล้วจ้ะ แม้แต่แฟ้มประเมิน"

  - id: toey_s_rain_count
    topic: smalltalk
    npc: "รู้ไหมจ๊ะ ครูมีสมุดจดว่าฝนตกกี่วันต่อปี จดมาเจ็ดปี… ไม่ได้ใช้ทำอะไร ครูชอบเห็นตัวเลขเรียงกัน"
    options:
      - text: "แล้วปีนี้ตกเยอะไหม{kq}"
        heart: 1
        reply: "น้อยกว่าทุกปีจ้ะ… ครูเพิ่งรู้ว่าสมุดนี้ใช้ได้ ปาล์มขอถ่ายเอกสารไปแล้ว บอกว่าเป็นข้อมูลชั้นดี ครูได้ดาวทองจากปาล์มหนึ่งดวง"
      - text: "เหมือนลุงจำรัสเลยนะ"
        heart: 1
        reply: "ลุงจำรัสจดเงิน ครูจดฝนจ้ะ… ถ้ารวมสมุดลุงกับสมุดครู ตำบลเราจะมีประวัติศาสตร์ครบเลย ทั้งเงินและน้ำ"
        next:
          - text: "{p}จดอะไรบ้างดี{kq}"
            heart: 1
            reply: "จดว่าแต่ละวันยิ้มกี่ครั้งดีไหมจ๊ะ… ไม่ต้องให้ใครดู เปิดดูเองตอนเหนื่อย"
          - text: "{p}ไม่ชอบจดอะไรเลย"
            heart: 0
            reply: "ไม่เป็นไรจ้ะ บางคนจำด้วยใจ… แต่ใจลืมบ่อยนะ ครูเตือนในฐานะครู"

  # ===== self =====
  - id: toey_f_why_teach
    topic: self
    npc: "ตอนเด็กครูไม่ได้เรียนเก่งนะจ๊ะ ครูอ่านหนังสือออกตอน ป.3… ช้ากว่าเพื่อนสองปี"
    options:
      - text: "จริงเหรอ{kq} ไม่น่าเชื่อเลย"
        heart: 1
        reply: "จริงจ้ะ ครูประจำชั้นนั่งอ่านกับครูทุกเย็นหลังเลิกเรียน หนึ่งปีเต็ม… วันที่ครูอ่านประโยคแรกจบ ครูเขาร้องไห้ก่อนครูอีก"
        next:
