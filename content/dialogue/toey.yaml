# ครูเต้ย — ครูโรงเรียนบ้านดงเย็น ♥ (อ่อนโยน ให้คะแนนทุกอย่าง) · ตัวหลัก 34–40 บท
convos:
  # ===== react =====
  - id: toey_r_meet
    topic: react
    once: true
    when: { not_flag: met_toey }
    npc: "อ๊ะ ขอโทษจ้ะ ครูเดินอ่านสมุดการบ้านไม่ดูทาง… {player} ใช่ไหม หลานยายเพียร ยายเคยมาเล่านิทานให้เด็กฟังทุกปีใหม่นะ"
    set_flag: met_toey
    options:
      - text: "ยายมาเล่านิทานด้วยเหรอ{kq}"
        heart: 1
        reply: "ทุกปีเลยจ้ะ เรื่องเดิมทุกปี ‘ปลาบู่ทอง’ แต่ยายเปลี่ยนตอนจบทุกปี ปีสุดท้ายเอื้อยเปิดร้านขายข้าวมันไก่ เด็กๆ ปรบมือกันใหญ่"
        next:
          - text: "ฟังเหมือนยายเลย{k}"
            heart: 1
            reply: "ครูให้ยายสิบเต็มสิบทุกปี หักไม่ลงเลย… ถ้า {player} อยากมาเล่าต่อจากยาย ห้องเรียนว่างทุกวันพฤหัสนะจ๊ะ"
          - text: "แล้วปีนี้ใครเล่า{kq}"
            heart: 1
            reply: "ยังไม่มีใครจ้ะ ปีใหม่ที่ผ่านมาครูเล่าเอง เด็กบอกว่าครูเล่าตรงตามหนังสือเกินไป ครูได้เจ็ดเต็มสิบ"
      - text: "ครูเต้ยใช่ไหม{kq} ได้ยินชื่อมาเยอะ"
        heart: 1
        reply: "ได้ยินจากป้าแต๋วใช่ไหมจ๊ะ… ไม่ต้องตอบ ครูรู้คำตอบอยู่แล้ว ครูให้คะแนนความซื่อสัตย์ล่วงหน้าเลย"
      - text: "ไม่เป็นไร{k} ระวังตกท่อนะ"
        heart: 0
        reply: "ท่อตรงนี้ครูตกมาแล้วสองครั้งจ้ะ ครั้งที่สามจะเป็นบทเรียนที่แพงที่สุด… ขอบใจนะ"

  - id: toey_r_fainted
    topic: react
    when: { fainted_recent: true }
    npc: "ครูได้ข่าวแล้ว… ไม่ต้องอธิบาย เด็กๆ เล่ากันสามฉบับ ฉบับน้องมิวผีมีปีก ฉบับน้องโอ๊ตผีขับรถเกี่ยวข้าว เป็นอะไรมากไหมจ๊ะ"
    options:
      - text: "ไม่มาก{k} อายมากกว่า"
        heart: 1
        reply: "ไม่ต้องอายจ้ะ ครูเคยหลับคาโต๊ะทำแฟ้มจนผีเดินผ่านหน้าห้อง ยามมาปลุกตอนตีหนึ่ง… เราทั้งคู่ต้องกลับบ้านเร็วขึ้นนะ"
      - text: "ฉบับไหนใกล้ความจริงสุด{kq}"
        heart: 1
        reply: "ฉบับของครูเองจ้ะ ‘ผู้ใหญ่คนหนึ่งลืมดูนาฬิกา’ ไม่สนุกเท่าของเด็กๆ แต่ได้คะแนนความจริงเต็ม"
        next:
          - text: "{p}ขอคะแนนความกล้าด้วย{k}"
            heart: 1
            reply: "ความกล้าได้แปดจ้ะ ความรอบคอบได้สาม… ครูจะไม่ให้ดาวทองเรื่องนี้ แต่จะให้ข้าวต้มแทนนะ"
          - text: "อย่าเอาไปสอนเด็กนะ{kq}"
            heart: 0
            reply: "สายไปแล้วจ้ะ เด็ก ป.4 เขียนเรียงความเรื่องนี้ส่งครูแล้ว หัวข้อ ‘บทเรียนจากผู้ใหญ่ที่กลับบ้านดึก’"
      - text: "ครูอย่าห่วงเลย{k}"
        heart: 0
        reply: "ครูห่วงเด็กสี่สิบสองคนทุกวันจ้ะ ห่วงเพิ่มอีกคนไม่หนักขึ้นหรอก… ไม่ได้ห่วงมากนะ ห่วงเท่าเด็กคนหนึ่ง"

  - id: toey_r_thana
    topic: react
    once: true
    when: { flag: story_thana_visit }
    npc: "คุณธนาไปฟาร์มยายแล้วใช่ไหมจ๊ะ… บริษัทเพิ่งไปเสนอพ่อแม่น้องเก่งให้ไปทำงานกับบ้านพัก เด็กจะย้ายโรงเรียน ครูเลยฟังเรื่องนี้แล้วใจไม่ค่อยดี"
    options:
      - text: "{p}ยังไม่ได้ขายนะ{k}"
        heart: 2
        reply: "ครูไม่ได้ถามเรื่องนั้นนะจ๊ะ… แต่ได้ยินแล้วครูหายใจโล่งขึ้นจริงๆ ครูให้คำตอบนี้สิบเต็มสิบ"
      - text: "น้องเก่งจะย้ายจริงเหรอ{kq}"
        heart: 1
        reply: "ยังไม่แน่จ้ะ แม่น้องเก่งบอกว่าขอคิดดู… ครูเลยไปบ้านเขาทุกเย็นช่วงนี้ ไม่ได้ไปตื๊อนะ แค่ไปส่งการบ้าน การบ้านเยอะเป็นพิเศษ"
        next:
          - text: "ครูไปส่งการบ้านทุกเย็นเลยเหรอ{kq}"
            heart: 1
            reply: "ทุกเย็นจ้ะ ครูให้การบ้านน้องเก่งเพิ่มเพื่อจะได้มีเหตุผลไป… ห้ามบอกน้องเก่งนะ เขาคิดว่าครูดุ"
          - text: "เด็กไปเรียนในอำเภอก็ดีนะ{kq}"
            heart: 0
            reply: "ดีก็มีจ้ะ แต่ ป.2 ต้องตื่นตีห้านั่งรถชั่วโมงหนึ่ง… ครูไม่ได้ห้าม ครูแค่อยากให้เขามีทางเลือกที่ใกล้บ้าน"
      - text: "ราคาที่เขาเสนอก็ดีนะ{kq}"
        heart: -1
        reply: "อาจจะดีจ้ะ… ครูไม่เก่งเรื่องราคาที่ดิน ครูเก่งแค่นับหัวเด็ก แล้วตัวเลขนั้นลดลงทุกครั้งที่บริษัทซื้อที่"

  - id: toey_r_meeting1
    topic: react
    once: true
    when: { flag: story_meeting1 }
    npc: "ครูพาเด็ก ป.6 ไปดูประชุมที่ศาลาเป็นวิชาหน้าที่พลเมือง… เด็กนับได้ว่านายกฯ พูดคำว่า ‘นะครับ’ ไปสองร้อยสิบสามครั้ง"
    options:
      - text: "เด็กได้เรียนอะไรบ้าง{kq}"
        heart: 1
        reply: "การนับเลขจ้ะ… กับความอดทน น้องมิวจดว่า ‘ผู้ใหญ่ประชุมนานกว่าเด็กสอบ’ ครูให้ข้อนี้สิบเต็มสิบ"
        next:
          - text: "แล้วครูได้เรียนอะไร{kq}"
            heart: 1
            reply: "ได้เรียนว่าเด็ก ป.6 นั่งนิ่งได้นานกว่าผู้ใหญ่บางคน… แล้วก็ได้เห็น {player} ยกมือโหวต ครูชอบนะ คนกล้ายกมือ"
          - text: "ปีหน้าพามาอีกนะ"
            heart: 1
            reply: "ปีหน้าครูจะให้เด็กเขียนคำถามไปถามนายกฯ ด้วย… ครูอยากรู้ว่านายกฯ จะตอบเด็กยาวแค่ไหน"
      - text: "กำนันหลับเด็กเห็นไหม{kq}"
        heart: 1
        reply: "เห็นจ้ะ น้องโอ๊ตถามว่ากำนันหลับเพราะเห็นด้วยหรือเปล่า… ครูตอบว่าไปถามกำนันเองนะ แล้วรีบพาเด็กกลับ"
      - text: "พาเด็กไปทำไม น่าเบื่อจะตาย"
        heart: 0
        reply: "น่าเบื่อจ้ะ แต่เด็กต้องรู้ว่างบหนึ่งล้านห้ามาจากไหนและไปไหน… ครึ่งหนึ่งไปไหนครูก็ยังตอบเด็กไม่ได้"

  - id: toey_r_well
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "โครงงานวิทยาศาสตร์ ป.5 วัดระดับบ่อหลังโรงเรียนทุกวันมาสามสัปดาห์… กราฟมันลงอย่างเดียวเลยจ้ะ เด็กถามครูว่าน้ำไปไหน"
    options:
      - text: "ครูตอบเด็กว่าไง{kq}"
        heart: 1
        reply: "ครูบอกว่าครูยังไม่รู้ แต่เราจะวัดต่อจนรู้… ครูสอนให้เด็กพูดว่าไม่รู้ได้ แต่ห้ามหยุดหาคำตอบ"
        next:
          - text: "เอากราฟไปให้เมย์ดูไหม{kq}"
            heart: 2
            reply: "ความคิดดีจ้ะ! เด็กๆ จะตื่นเต้นมากที่ได้เป็นแหล่งข่าว… ครูให้ความคิดนี้สิบเต็มสิบ แต่ต้องปิดชื่อเด็กนะ"
          - text: "ปาล์มเอาเครื่องวัดมาแล้วนะ"
            heart: 1
            reply: "ใช่จ้ะ ตัวเลขของปาล์มกับของเด็กตรงกันเกือบเป๊ะ ปาล์มบอกว่าเด็ก ป.5 วัดแม่นกว่าลูกน้องบางคน"
      - text: "เด็กไม่มีน้ำล้างมือแล้วทำไง{kq}"
        heart: 1
        reply: "ครูซื้อน้ำถังมาจ้ะ… ไม่ต้องทำหน้าแบบนั้น ครูซื้อไหว แค่เดือนนี้ไม่ซื้อกาแฟเย็น ร่างกายครูจะได้ขอบคุณ"
      - text: "หน้าแล้งก็แห้งทุกปีแหละ{k}"
        heart: -1
        reply: "ปีก่อนๆ ไม่แห้งเร็วขนาดนี้จ้ะ… เด็กมีตัวเลขย้อนหลังสามปี ครูเชื่อตัวเลขของเด็ก"

  - id: toey_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "ข่าวผีที่ดินบริษัทมาถึงโรงเรียนแล้วจ้ะ เช้านี้ทั้งห้อง ป.3 วาดรูปผู้หญิงยืนบนท่อน้ำ… ครูให้วาดเรื่องครอบครัว"
    options:
      - text: "ครูจะห้ามเด็กเล่าเรื่องผีไหม{kq}"
        heart: 1
        reply: "ไม่ห้ามจ้ะ ครูเปลี่ยนเป็นวิชาเขียนเรียงความเลย หัวข้อ ‘ถ้าผีพูดได้ ผีจะบอกอะไร’… ส่วนใหญ่ผีบอกว่า ‘คืนน้ำมา’"
        next:
          - text: "เด็กเข้าใจเรื่องน้ำดีกว่าผู้ใหญ่อีก"
            heart: 2
            reply: "ครูก็คิดอย่างนั้นจ้ะ… ครูจะติดเรียงความไว้หน้าห้อง ใครผ่านมาจะได้อ่าน รวมถึงคนที่ใส่เสื้อสะท้อนแสงด้วย"
          - text: "แล้วน้องโอ๊ตเขียนว่าไง{kq}"
            heart: 1
            reply: "ผีของน้องโอ๊ตบอกว่า ‘ขอข้าวเหนียวมะม่วงด้วย’ ครูให้คะแนนความซื่อตรงต่อความต้องการของตัวเองเต็มสิบ"
      - text: "ครูกลัวไหม{kq}"
        heart: 1
        reply: "กลางวันไม่กลัวจ้ะ กลางคืนครูทำแฟ้มในห้องที่ไฟสว่างที่สุด แล้วเปิดวิทยุเสียงดัง… ครูกลัวนะ แค่ไม่ให้เด็กรู้"

  - id: toey_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ถังน้ำโลโก้บริษัทมาถึงโรงเรียนแล้วจ้ะ เด็กได้คนละใบ… ตอนนี้วงกลองยาวของ ป.4 มีกลองสี่สิบใบ ทุกใบมีโลโก้"
    options:
      - text: "เอามาตีกลองเลยเหรอ{kq}"
        heart: 1
        reply: "ครูไม่ได้สอนนะจ้ะ เด็กคิดเอง… เสียงดีด้วย ครูให้ความคิดสร้างสรรค์เต็มสิบ ส่วนโลโก้ ครูให้เด็กเอาสติกเกอร์ดาวแปะทับ"
        next:
          - text: "ดาวทองแปะทับโลโก้ ครูนี่ร้ายเงียบนะ"
            heart: 2
            reply: "ครูไม่ได้ร้าย ครูแค่ให้รางวัลถังที่ทำหน้าที่ดี… ถังไม่ผิดอะไรจ้ะ ถังได้ดาวไป"
          - text: "บริษัทเห็นจะโกรธไหม{kq}"
            heart: 0
            reply: "ถ้าโกรธเพราะเด็กแปะดาว ครูคงต้องจัดอบรมเรื่องอารมณ์ให้บริษัทจ้ะ"
      - text: "ครูว่ารับดีหรือไม่รับดี{kq}"
        heart: 0
        reply: "ครูรับเพราะเด็กต้องใช้น้ำจ้ะ… แต่ครูสอนเด็กไว้ข้อหนึ่ง ใครให้อะไรเรา ต้องถามด้วยว่าทำไมเขาให้"

  - id: toey_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ประกาศเลือกตั้งแล้ว โรงเรียนเป็นหน่วยเลือกตั้งอีกแล้วจ้ะ… ผู้สมัครคนแรกมาขอถ่ายรูปกับเด็กตั้งแต่ป้ายยังไม่แห้ง"
    options:
      - text: "ครูให้ถ่ายไหม{kq}"
        heart: 1
        reply: "ครูให้ถ่ายกับหลังคาห้อง ป.4 ที่รั่วจ้ะ บอกว่าเด็กไม่ว่าง หลังคาว่าง… เขาถ่ายแล้วรีบไป ไม่รู้จะเอารูปไปทำอะไร"
      - text: "ปีนี้จะมีใครสัญญาเรื่องหลังคาไหม{kq}"
        heart: 1
        reply: "ครูเตรียมกระดาษไว้แล้วจ้ะ ‘ข้าพเจ้าสัญญาว่าจะซ่อมหลังคา’ มีช่องให้เซ็น… ปีก่อนมีคนอ่านแล้วบอกว่าลืมปากกา"
        next:
          - text: "{p}จะเป็นพยานให้{k}"
            heart: 2
            reply: "ครูขอบใจมากจ้ะ… มีพยานแล้ว ปากกาแดงครูก็มียี่สิบด้าม ไม่มีใครลืมได้อีกแล้ว"
          - text: "ครูลงสมัครเองเลยสิ"
            heart: 1
            reply: "ครูไม่มีเวลาหาเสียงจ้ะ แฟ้มยังไม่เสร็จ… แต่ถ้ามีนักเรียนเลือก ครูได้สี่สิบสองเสียงแน่นอน เด็กโหวตไม่ได้ก็ตาม"

  - id: toey_r_kitten
    topic: react
    once: true
    when: { flag: kitten_promise }
    npc: "ได้ข่าวว่าจะรับลูกแมวป้าแต๋วไปเลี้ยงใช่ไหมจ๊ะ! เด็ก ป.2 ประชุมกันแล้ว ส่งรายชื่อมาให้ครูยี่สิบสามชื่อ ให้เลือกหนึ่ง"
    options:
      - text: "มีชื่ออะไรบ้าง{kq}"
        heart: 1
        reply: "ส้มตำ มะม่วง ดาวทอง ครูใหญ่… ครูใหญ่ห้ามนะจ้ะ ผู้อำนวยการจะน้อยใจ แล้วก็มี ‘ยายเพียร’ ด้วย น้องมิวเสนอ"
        next:
          - text: "ชื่อดาวทองน่ารักดี"
            heart: 2
            reply: "ครูดีใจมาก! ครูจะประกาศหน้าเสาธงพรุ่งนี้ เด็กที่เสนอชื่อนี้จะได้ดาวทองจริงหนึ่งดวง ซ้อนกันสองชั้นเลย"
          - text: "ขอคิดชื่อเองนะ{kq}"
            heart: 0
            reply: "ได้จ้ะ แต่ครูต้องบอกเด็กๆ ยังไงดี… ครูจะบอกว่าเจ้าของแมวกำลังทำการบ้าน"
      - text: "ข่าวไปถึงโรงเรียนแล้วเหรอ{kq}"
        heart: 0
        reply: "ป้าแต๋วบอกมิว มิวบอกทั้งชั้น ทั้งชั้นบอกครู… ระบบส่งข่าวของตำบลเราเร็วกว่าอินเทอร์เน็ตโรงเรียนจ้ะ"

  - id: toey_r_rain
    topic: react
    when: { rain: true, heart_min: 2 }
