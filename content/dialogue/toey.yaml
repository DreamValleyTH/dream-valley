            reply: "… ซองของตัวเองเหรอจ๊ะ ครูไม่เคยคิดเลย ครูจะลองนะ ซองเล็กๆ ไว้ซื้อขนมชั้นให้ตัวเองเดือนละครั้ง"
          - text: "เดี๋ยว{p}บริจาคสีเทียนให้"
            heart: 1
            reply: "ขอบใจจ้ะ… แต่ครูไม่ได้เล่าเพื่อขอนะ ครูเล่าเพราะอยากให้ {player} เห็นว่าครูก็ไม่เก่งทุกเรื่อง"
      - text: "{p}จดบัญชีในโทรศัพท์ได้ไหม{kq}"
        heart: 1
