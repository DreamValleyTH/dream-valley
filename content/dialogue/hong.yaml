# เจ๊หงษ์ — convos + quests (ตัวรอง 🖤)
convos:
  # ===== react =====
  - id: hong_r_meet
    topic: react
    once: true
    when: { not_flag: met_hong }
    npc: "เอ้า หน้าใหม่! หลานยายเพียรใช่ไหมย่ะ ยายเธอซื้อกล้วยหอมเจ๊ทุกวันพุธ หวีละสามสิบ ต่อเหลือยี่สิบห้าทุกครั้ง เจ๊ยอมคนเดียวทั้งตลาด"
    set_flag: met_hong
    options:
      - text: "ทำไมเจ๊ยอมยายล่ะ{kq}"
        heart: 1
        reply: "เพราะยายต่อแล้วจ่ายสามสิบทุกที บอกว่า ‘ห้าบาทนั่นค่าที่เจ๊ยิ้มให้’ คนแบบนี้เจ๊ไม่เคยเจออีกเลยย่ะ"
        next:
          - text: "งั้น{p}ขอต่อแบบยายได้ไหม{kq}"
            heart: 1
            reply: "ต่อได้ แต่ต้องยิ้มให้เจ๊ก่อน… ยิ้มแห้งไปหน่อยนะ ห้าบาทยังไม่ลดย่ะ"
          - text: "ยายชอบกล้วยหอมเหรอ{kq}"
            heart: 1
            reply: "ชอบที่ไหน ถวายพระครึ่ง เลี้ยงแมวแถวบ้านครึ่ง ตัวเองไม่ได้กินสักลูก เจ๊ด่ายายทุกอาทิตย์"
      - text: "ผลไม้เจ๊น่ากินจัง{k}"
        heart: 1
        reply: "ปากหวานเหมือนมะม่วงเจ๊เลย แต่ไม่ลดนะ ปากหวานไม่ใช่สกุลเงินย่ะ"
      - text: "{p}แค่เดินดู{k}"
        heart: 0
        reply: "ดูได้ อย่าจับ จับแล้วช้ำ ช้ำแล้วต้องซื้อ กฎตลาดเจ๊บอกเลย"

  - id: hong_r_lottery
    topic: react
    once: true
    when: { flag: bought_lottery }
    npc: "(กระซิบ) ได้ข่าวว่าน้องซื้อสลากพัฒนาตำบลจากแม่ค้าเร่ ใบละร้อย… ทำไมไม่มาถามเจ๊ก่อนย่ะ"
    options:
      - text: "เจ๊ขายหวยเหรอ{kq}"
        heart: 0
        reply: "เจ๊ขายผลไม้ย่ะ ใครพูด! …แต่ถ้าถามว่าที่ไหนจ่ายสูงกว่ารัฐ เจ๊ก็พอรู้ นิดๆ"
        next:
          - text: "ของรัฐถูกกฎหมายนะ{kq}เจ๊"
            heart: 1
            reply: "ถูกกฎหมายแล้วไง รัฐกินส่วนแบ่งเกือบครึ่ง ไม่มีดาบไปจับ เจ๊กินน้อยกว่าแต่ต้องแบ่งเงาะให้ดาบทุกวันพุธ ใครเป็นเจ้ามือที่ใจร้ายกว่าย่ะ"
          - text: "{p}ไม่เล่นหรอก{k}"
            heart: 1
            reply: "ดี คนไม่เล่นคือคนที่เจ๊ชอบที่สุดในตลาด เพราะเขามาซื้อผลไม้จริงๆ"
      - text: "ซื้อเล่นๆ ใบเดียว{k}"
        heart: 0
        reply: "ใบเดียวพอนะน้อง อย่าให้เป็นสองใบ สองใบกลายเป็นสิบใบไวกว่ามะละกอสุก"

  - id: hong_r_result_market
    topic: react
    once: true
    when: { flag: meeting1_result_market }
    npc: "ตลาดนัดชนะโหวต! เจ๊กรี๊ดกลางศาลาจนกำนันตื่น… แต่ครึ่งงบไปศึกษาความเป็นไปได้ ศึกษาอะไร มาถามเจ๊ก็ได้ฟรีย่ะ"
    options:
      - text: "เจ๊จะได้แผงใหม่ไหม{kq}"
        heart: 1
        reply: "ได้หลังคาครึ่งตลาด อีกครึ่งรองบปีหน้า แผงเจ๊อยู่ครึ่งที่ไม่มีหลังคาพอดี ฟ้าลิขิตย่ะ"
        next:
          - text: "{p}จะช่วยเจ๊กางผ้าใบ{k}"
            heart: 2
            reply: "น่ารัก! เจ๊แถมส้มห้าลูก… ผ้าใบเจ๊หนักนะ อย่ามาบ่นทีหลังย่ะ"
          - text: "ขอย้ายไปฝั่งมีหลังคาสิ{kq}"
            heart: 0
            reply: "ฝั่งนั้นญาติฝ่ายนายกจองไว้ตั้งแต่ก่อนสร้าง เจ๊เพิ่งรู้ว่าแผงจองได้ก่อนมีตลาด เก่งจริงๆ"
      - text: "เจ๊ดีใจเกินไปแล้ว{k}"
        heart: 0
        reply: "ดีใจได้วันเดียวแหละ พรุ่งนี้ป้ายโครงการมาแล้วจะใหญ่กว่าแผงเจ๊อีก"

  - id: hong_r_well_dry
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "สวนมะม่วงหลังตำบลน้ำไม่พอ ลูกลีบเท่าไข่ไก่ เจ๊เลยขายเป็น ‘มะม่วงจิ๋วพรีเมียม’ แพงขึ้นกิโลละสิบ คนก็ซื้อนะย่ะ"
    options:
      - text: "เจ๊ขึ้นราคามะม่วงลีบเหรอ{kq}"
        heart: 1
        reply: "ไม่ใช่ขึ้นย่ะ ปรับตามตลาด เสี่ยเฮงสอน เขาเรียกว่าการตลาด เจ๊กำลังเรียนจากคนที่เจ๊ด่าทุกวัน"
      - text: "บ่อป้าแต๋วก็แห้งนะ{k}"
        heart: 1
        reply: "รู้ ป้าแต๋วมาอาบน้ำบ้านเจ๊สองวันแล้ว อาบไปเล่าข่าวไป เจ๊ได้ข่าวฟรีแต่ค่าน้ำขึ้น"
      - text: "แบบนี้ก็หลอกลูกค้าสิ{kq}"
        heart: -1
        reply: "หลอกตรงไหน ลีบจริง จิ๋วจริง เจ๊บอกตรงๆ บนป้าย บริษัทที่ดูดน้ำไปยังไม่เคยติดป้ายบอกใครเลยย่ะ"

  - id: hong_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "คนงานบริษัทเจอผีที่ไซต์บาดาล เช้านี้คนมาถามเจ๊สิบเจ็ดคนว่าผีหน้าตาเป็นยังไง เลขอะไร… เจ๊ขายผลไม้ ไม่ได้ขายผีย่ะ"
    options:
      - text: "แล้วคนแทงเลขอะไรกัน{kq}"
        heart: 0
        reply: "สามสิบสองทั้งตำบล ผียืนตรงเสาต้นที่สองติดกันสามคืน… เจ๊ไม่รู้นะ เจ๊ไม่ได้รับ"
        next:
          - text: "ถ้าออกสามสิบสองเจ๊ทำไง{kq}"
            heart: 1
            reply: "…ขายสร้อยเส้นสุดท้าย แล้วเปลี่ยนไปขายผลไม้อย่างเดียวจริงๆ ซะที อย่าถามต่อเลยน้อง เจ๊ใจไม่ดี"
          - text: "เจ๊บอกว่าไม่ได้รับนี่{kq}"
            heart: 0
            reply: "ใช่ ไม่ได้รับ เจ๊พูดผิด หูน้องก็ฟังผิด เราลืมกันไปทั้งคู่นะยะ"
      - text: "เจ๊กลัวผีไหม{kq}"
        heart: 1
        reply: "กลัวผีน้อยกว่ากลัวคนแทงเลขเดียวกันทั้งตำบลย่ะ ผีหลอกได้คืนเดียว เลขเดียวกันหลอกเจ๊ได้ทั้งชาติ"

  - id: hong_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ถังน้ำที่บริษัทแจกมีเลขซีเรียลข้างถัง คนเอามาถามเจ๊ทั้งเช้า ‘เจ๊ ถังผมเลขเจ็ดสอง’ น้ำไม่มีแต่เลขมี ชีวิตชาวบ้านแท้ๆ ย่ะ"
    options:
      - text: "เจ๊รับถังมาด้วยไหม{kq}"
        heart: 1
        reply: "รับ ใส่มะม่วงสวยดี โลโก้บริษัทเจ๊เอาป้ายราคาแปะทับ ‘สามกิโลร้อย’ ตัวใหญ่กว่าโลโก้อีก"
      - text: "เจ๊อยู่ฝ่ายไหน{kq}"
        heart: 1
        reply: "ฝ่ายคนซื้อผลไม้ย่ะ บริษัทไม่เคยซื้อมะม่วงเจ๊กินสักลูก ซื้อแต่กระเช้าไปแจก แจกแล้วถ่ายรูป เจ๊ได้กำไรครั้งเดียว เขาได้ภาพลักษณ์ทั้งปี"
        next:
          - text: "เจ๊ก็ได้เงินจากเขานะ{kq}"
            heart: 0
            reply: "ได้ แล้วไง เงินมันไม่มีสีย่ะ แต่ถ้ามีสี เงินบริษัทคงสีเหมือนน้ำในบ่อตอนนี้ ขุ่นๆ"
          - text: "ไม่ต้องขายกระเช้าให้เขาสิ{kq}"
            heart: 1
            reply: "ไม่ขายเขาก็ไปซื้อในอำเภอ เจ๊ไม่ได้อะไร ผลไม้เจ๊ช้ำทิ้ง… เจ๊จะขึ้นราคากระเช้าเขาสามสิบเปอร์เซ็นต์ อันนี้คือการประท้วงของแม่ค้า"

  - id: hong_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ผู้สมัครนายกสองคนเดินตลาดวันเดียวกัน ยิ้มทุกแผง ซื้อมะม่วงคนละลูก แล้วกระซิบเจ๊ว่า ‘งวดนี้ช่วยดูเสียงในตลาดหน่อย’ เจ๊ขายผลไม้นะย่ะ ไม่ได้ขายเสียง"
    options:
      - text: "เขารู้ว่าเจ๊มีเครือข่ายเหรอ{kq}"
        heart: 1
        reply: "เครือข่ายอะไร… คนมาหาเจ๊ทุกงวดสามร้อยคน เจ๊รู้จักทุกบ้าน หัวคะแนนยังรู้น้อยกว่าเจ๊ย่ะ"
        next:
          - text: "เจ๊จะช่วยใคร{kq}"
            heart: 1
            reply: "ช่วยคนที่สัญญาว่าจะไม่ไล่แผงเจ๊ ยังไม่มีใครสัญญาเลย ทั้งคู่อยากทำตลาดใหม่ ค่าแผงเดือนละพันห้า"
          - text: "อย่าไปยุ่งเลย{k}เจ๊"
            heart: 1
            reply: "เจ๊ไม่ยุ่ง แต่การเมืองมันมายุ่งกับเจ๊ จะให้ทำไงล่ะน้อง ปิดแผงหนีเหรอ"
      - text: "ได้ขายมะม่วงสองลูกก็ยังดี{k}"
        heart: 0
        reply: "สองลูกกับคำขอหนึ่งคำ เจ๊ขาดทุนทุกเลือกตั้งย่ะ"

  - id: hong_r_end_quit
    topic: react
    once: true
    when: { flag: hong_end_quit }
    npc: "เจ๊ปิดโพยมาสามอาทิตย์แล้วนะน้อง ไม่มีใครมากระซิบหน้าแผงเลย ตลาดเงียบขึ้น… แต่มะม่วงขายดีขึ้น คนมาซื้อของจริงๆ ซะที"
    options:
      - text: "เจ๊คิดถึงไหม{kq}"
        heart: 1
        reply: "คิดถึงเงินย่ะ แต่ไม่คิดถึงคืนที่นอนนับว่าถ้าเลขนั้นออกจะจ่ายไหวไหม เจ๊หลับครบแปดชั่วโมงครั้งแรกในรอบสิบปี"
      - text: "ลุงสมหมายว่าไงบ้าง{kq}"
        heart: 1
        reply: "ไปแทงกับเจ้ามือตำบลข้างๆ เจ้านั้นจ่ายช้ากว่าเจ๊สามวัน ลุงมาบ่นที่แผงเจ๊ เจ๊ขายส้มให้ลุงไปปลอบใจ ได้เงินอยู่ดี"

  # ===== news =====
  - id: hong_n_porkstall
    topic: news
    npc: "แผงหมูปิ้งไม้ละห้าบาทปิดไปแล้ว อยู่ได้สามอาทิตย์ เจ๊ไม่ได้ทำอะไรนะย่ะ เจ๊แค่ซื้อหมูปิ้งเขาทุกวันแล้วบอกคนทั้งตลาดว่าเค็ม"
    options:
      - text: "เจ๊ใจร้ายจัง{k}"
        heart: 0
        reply: "ใจร้ายตรงไหน มันเค็มจริง เจ๊ซื้อมาสิบเก้าวัน เค็มทุกวัน เจ๊ซื่อสัตย์ต่อลิ้นตัวเองย่ะ"
      - text: "เจ๊ซื้อทุกวันเลยเหรอ{kq}"
        heart: 1
        reply: "ซื้อทุกวัน อร่อยด้วยแหละ ถึงจะเค็ม… ตอนเขาปิดเจ๊แอบเสียดาย เจ๊ไม่ได้อยากให้เขาปิด เจ๊แค่อยากให้เขาขึ้นราคา"
        next:
          - text: "ไปขอโทษเขาสิ{kq}เจ๊"
            heart: 1
            reply: "เจ๊ส่งกระเช้าผลไม้ไปให้แล้ว พร้อมการ์ดเขียนว่า ‘น้ำจิ้มดี หมูเค็ม’ ถือว่าขอโทษแบบแม่ค้าย่ะ"
          - text: "การค้าก็แบบนี้แหละ{k}"
            heart: 0
            reply: "ใช่ แต่เจ๊ก็ไม่อยากเป็นแบบเสี่ยเฮงนะ… พูดแล้วขนลุก"

  - id: hong_n_cut_fruit
    topic: news
    npc: "ร้าน 24 ชม. ของตั้มจะเอาผลไม้ตัดแต่งใส่กล่องมาขาย กล่องละสามสิบห้า ฝรั่งครึ่งลูก… ครึ่งลูกนะย่ะ อีกครึ่งไปไหน"
    options:
      - text: "สะดวกดีนะ{kq}"
        heart: 0
        reply: "สะดวกกับใคร ฝรั่งเจ๊ลูกละสิบห้า เจ๊ผ่าให้ฟรีด้วย คนกรุงเทพฯ ชอบซื้อความสะดวก จ่ายแพงกว่าสองเท่า แล้วบ่นว่าค่าครองชีพสูง"
      - text: "พี่ตั้มเป็นคนตัดเหรอ{kq}"
        heart: 1
        reply: "ไม่ใช่ ตัดมาจากโรงงานในเมือง ตั้มบอกเจ๊ว่าฝรั่งเดินทางไกลกว่าตั้มอีก ตั้มนี่พูดตรงดีนะ เจ๊ชอบ"

  - id: hong_n_vendor
    topic: news
    npc: "แม่ค้าเร่สลากพัฒนาตำบลคนใหม่มาแล้ว ใส่เสื้อกั๊กมีตรา อบต. เดินผ่านแผงเจ๊ทุกชั่วโมง ยิ้มให้เจ๊แบบผู้ชนะย่ะ"
    options:
      - text: "เขาเป็นคู่แข่งเจ๊เหรอ{kq}"
        heart: 1
        reply: "คู่แข่งเหรอ เขามีกฎหมายหนุนหลัง เจ๊มีแค่เงาะกับความจำดี ไม่ใช่คู่แข่งหรอก เขาคือรถถัง เจ๊คือแผงผลไม้"
        next:
          - text: "แล้วเจ๊สู้ยังไง{kq}"
            heart: 1
            reply: "จ่ายไว เขาจ่ายรางวัลต้องไปขึ้นเงินที่ อบต. รอสามวันกับสำเนาบัตรสามชุด เจ๊จ่ายภายในชั่วโมง… เจ๊พูดเรื่องอะไรอยู่นะ ไม่รู้แล้ว"
          - text: "เจ๊เลิกแข่งเถอะ{k}"
            heart: 1
            reply: "เจ๊ไม่ได้แข่งย่ะ เจ๊ขายผลไม้ ใครแข่งกับเขาก็ไม่รู้นะ"
      - text: "เขายิ้มสวยดี{k}"
        heart: 0
        reply: "ยิ้มสวยเพราะไม่ต้องหลบดาบไงย่ะ ลองมายืนแผงเจ๊สักงวดสิ ยิ้มจะเหลือครึ่งปาก"

  - id: hong_n_crackdown
    topic: news
    npc: "ข่าวในกลุ่ม LINE ว่าตำรวจอำเภอจะกวาดล้างหวยใต้ดินทั้งอำเภอวันศุกร์หน้า ประกาศล่วงหน้าตั้งเจ็ดวัน ใจดีจะตาย"
    options:
      - text: "ทำไมประกาศล่วงหน้าล่ะ{kq}"
        heart: 1
        reply: "จะได้มีตัวเลขผลงานพอดีๆ ไง จับได้สองสามรายพอถ่ายรูป ใครยังไม่ปิดภายในเจ็ดวันนี่โง่เองย่ะ เจ๊ไม่ได้หมายถึงใครนะ"
      - text: "เจ๊กังวลไหม{kq}"
        heart: 0
        reply: "กังวลเรื่องอะไร เจ๊ขายผลไม้ วันศุกร์หน้าเจ๊จะขายผลไม้แบบตั้งใจเป็นพิเศษ ยิ้มกว้างเป็นพิเศษ"

  - id: hong_n_durian
    topic: news
    when: { time: morning }
    npc: "ทุเรียนล็อตแรกมาแล้ว! หมอนทองกิโลละร้อยแปดสิบ ไม่ต่อนะย่ะ เจ๊ไม่ได้ใจร้าย ทุเรียนมันใจร้าย ราคามันขึ้นเอง"
    options:
      - text: "แพงจัง{k}เจ๊"
        heart: 0
        reply: "แพงเพราะมันมาจากภาคตะวันออก ผ่านพ่อค้าสามทอด ทอดละสิบบาท เจ๊เป็นทอดสุดท้าย ได้น้อยสุดแต่โดนด่าเยอะสุดย่ะ"
      - text: "ขอชิมก่อนได้ไหม{kq}"
        heart: 1
        reply: "ชิมได้หนึ่งพู ห้ามทำหน้าคิดนาน คนทำหน้าคิดนานแล้วไม่ซื้อ เจ๊จำหน้าไว้หมด"
      - text: "เสี่ยเฮงชอบทุเรียนนะ{k}"
        heart: 1
        reply: "รู้ เสี่ยมาซื้อทุกล็อตแรก ต่อทุกครั้ง เจ๊ไม่ลดทุกครั้ง เป็นความสัมพันธ์ที่มั่นคงที่สุดในตลาดย่ะ"

  # ===== advice =====
  - id: hong_a_stall
    topic: advice
    npc: "ถ้าน้องจะเอาผักมาตั้งแผงตลาดนัด เจ๊สอนให้ฟรีครั้งเดียว ผักต้องพรมน้ำ กองต้องสูง ป้ายราคาต้องเขียนลายมือ คนเชื่อลายมือมากกว่าป้ายพิมพ์"
    options:
      - text: "ทำไมต้องลายมือ{kq}"
        heart: 1
        reply: "ลายมือแปลว่ามีคนตั้งราคาเอง ต่อได้ คนชอบความรู้สึกว่าต่อได้ แม้เจ๊จะไม่ลดก็ตามย่ะ"
      - text: "เจ๊ไม่กลัว{p}แย่งลูกค้าเหรอ{kq}"
        heart: 1
        reply: "น้องขายผัก เจ๊ขายผลไม้ ลูกค้าคนเดียวกันซื้อสองแผง ตลาดคึกเจ๊ก็ขายดี ตลาดเงียบเจ๊ก็ตายพร้อมน้อง เข้าใจไหมย่ะ"
        next:
          - text: "เจ๊ใจดีกว่าที่คิด{k}"
            heart: 2
            reply: "อย่าพูดดังย่ะ ทั้งตลาดคิดว่าเจ๊ปากร้าย ภาพลักษณ์นี้เจ๊สร้างมายี่สิบห้าปี"
          - text: "งั้นเจ๊ช่วยกองผักให้หน่อย{kq}"
            heart: 0
            reply: "กองให้ได้ กองละสิบบาท ค่าวิชา… ล้อเล่นย่ะ ฟรีครั้งแรก ครั้งที่สองเริ่มคิด"

  - id: hong_a_math
    topic: advice
    npc: "น้องจะเล่นเลขใช่ไหม เจ๊คิดเลขให้ฟัง แทงร้อย ถูกได้เจ็ดพัน โอกาสหนึ่งในร้อย แทงร้อยงวดเสียหมื่น ได้คืนเจ็ดพัน ใครได้สามพันย่ะ"
    options:
      - text: "เจ้ามือได้{k}"
        heart: 1
        reply: "เก่ง ตอบถูกได้มะม่วงหนึ่งลูก เจ๊บอกทุกคนแบบนี้ ไม่มีใครฟังสักคน เขาคิดว่าเขาคือคนที่ถูกงวดแรก"
      - text: "ทำไมเจ้ามือสอนให้คนไม่เล่น{kq}"
        heart: 1
        reply: "เจ๊ไม่ใช่เจ้ามือย่ะ เจ๊เป็นแม่ค้าที่รู้คณิตศาสตร์… แล้วเจ๊ไม่อยากให้คนที่เจ๊ชอบเป็นแบบลุงสมหมาย"
        next:
          - text: "เจ๊ชอบ{p}เหรอ{kq}"
            heart: 2
            reply: "ชอบแบบลูกค้าย่ะ อย่าคิดไปไกล… ชอบแบบหลานด้วยนิดนึง หน้าน้องเหมือนลูกคนกลางเจ๊ตอนเรียนจบใหม่ๆ"
          - text: "ลุงสมหมายแทงหนักเหรอ{kq}"
            heart: 0
            reply: "งวดละพันห้า ป้าพรไม่รู้ว่าพันห้า ป้าพรคิดว่าห้าร้อย อย่าบอกนะย่ะ เจ๊ขายผลไม้ ไม่ได้ขายความลับ"
      - text: "เจ๊พูดเหมือนแอปเงินด่วนเลย"
        heart: -1
        reply: "อย่าเอาเจ๊ไปเทียบกับของในโทรศัพท์ย่ะ เจ๊มีหน้าให้ด่า มีแผงให้มาหา มันไม่มีอะไรเลยนอกจากเบอร์โทรทวง"

  - id: hong_a_buy_late
    topic: advice
    npc: "อยากได้ผลไม้ถูก มาตอนบ่ายสามวันเสาร์ แม่ค้าทุกแผงอยากกลับบ้าน ต่อได้หมดยกเว้นเจ๊ เจ๊ไม่อยากกลับบ้าน บ้านเจ๊ไม่มีใคร"
    options:
      - text: "บ้านเจ๊ไม่มีใครเหรอ{kq}"
        heart: 2
        reply: "ลูกสามคนอยู่กรุงเทพฯ หมด เจ๊อยู่กับแมวกับโพย… เอ๊ย กับสมุดบัญชี บ่ายสามที่ตลาดยังมีคนคุย ที่บ้านมีแต่พัดลม"
        next:
          - text: "{p}มาคุยกับเจ๊ตอนบ่ายสามก็ได้{k}"
            heart: 2
            reply: "มาได้ แต่ต้องซื้ออะไรติดมือนะย่ะ เจ๊ไม่ได้ให้นั่งฟรี… ล้อเล่น นั่งฟรี วันเสาร์บ่ายสามนะ จำไว้"
          - text: "เจ๊พูดเหมือนป้าแต๋วเลย{k}"
            heart: 0
            reply: "ไม่เหมือนย่ะ ป้าแต๋วพูดเรื่องคนอื่น เจ๊พูดเรื่องตัวเองครั้งเดียวแล้วเสียใจทันที"
      - text: "บ่ายสามผลไม้ช้ำหมดแล้วสิ{kq}"
        heart: 0
        reply: "ช้ำนิดๆ หวานกว่า เจ๊บอกเลย ผลไม้กับคนเหมือนกัน ผ่านแดดมาทั้งวันแล้วหวานขึ้น"

  - id: hong_a_gold
    topic: advice
    npc: "เก็บเงินน่ะน้อง เจ๊แนะนำทอง ธนาคารล้มได้ บัญชีโดนแฮกได้ ทองอยู่ในคอ ผีจับก็ไม่หาย เว้นแต่ขายเอง"
    options:
      - text: "เจ๊มีทองเยอะเหรอ{kq}"
        heart: 1
        reply: "เคยมี ขายจ่ายคนถูกเลขไปหลายเส้นแล้ว เหลือเส้นเดียวที่แม่เจ๊ให้ เส้นนี้ขายไม่ได้ ขายแล้วเจ๊จะไม่มีอะไรให้ลูก"
      - text: "ทองราคาขึ้นลงนะ{kq}เจ๊"
        heart: 0
        reply: "ขึ้นลงแต่ไม่หาย หุ้นหาย คริปโตหาย ทองแค่น้อยใจแป๊บนึง เดี๋ยวก็กลับมา"

  # ===== smalltalk =====
  - id: hong_s_lipstick
    topic: smalltalk
    npc: "น้องว่าลิปเจ๊วันนี้เป็นไง แดงเลือดหมู ซื้อร้านตั้ม หนึ่งร้อยเก้าสิบเก้า ตั้มบอกว่าเป็นสีที่คนซื้อน้อยที่สุดในร้าน เจ๊เลยต้องซื้อ"
    options:
      - text: "สวย{k}เจ๊ เข้ากับแผงด้วย"
        heart: 2
        reply: "ใช่ไหม! แดงเหมือนแอปเปิลกองหน้าแผงพอดี ลูกค้าเห็นปากเจ๊แล้วอยากกินแอปเปิล การตลาดย่ะ"
      - text: "ทำไมต้องซื้อสีที่คนซื้อน้อย{kq}"
        heart: 1
        reply: "สีที่ไม่มีใครเลือก มันเหงา เจ๊รู้จักความรู้สึกนั้นดี… เอ๊ย พูดไปเรื่อย ทาลิปแล้วเจ๊ปากไวย่ะ"

  - id: hong_s_voice
    topic: smalltalk
    npc: "รู้ไหมเสียงเจ๊ได้ยินถึงหน้าวัด ผู้ใหญ่สมศักดิ์มาขอให้เจ๊ไปประกาศหอกระจายข่าวแทนตอนไมค์เสีย เจ๊ประกาศรอบเดียวคนเข้าใจหมด ไม่ต้องย้ำสามรอบย่ะ"
    options:
      - text: "เจ๊ประกาศว่าอะไร{kq}"
        heart: 1
        reply: "‘ประชุมสองโมง ใครไม่มาไม่ได้น้ำแดง’ จบ คนมาครบทุกบ้าน ผู้ใหญ่ทำหน้าเหมือนเสียตำแหน่ง"
      - text: "เจ๊ลงผู้ใหญ่บ้านสิ{kq}"
        heart: 1
        reply: "เจ๊ลงแล้วใครจะขายผลไม้ แล้วใครจะ… ช่างเถอะ เจ๊มีงานอื่นต้องทำตอนกลางคืนย่ะ งานบัญชี"
        next:
          - text: "งานบัญชีอะไร{kq}"
            heart: 0
            reply: "บัญชีผลไม้! ถามมากนะยะ ซื้อเงาะไปกิโลนึงเป็นค่าถามเลย"
          - text: "ผู้ใหญ่บ้านเสียงดังแบบเจ๊ก็ดีนะ{k}"
            heart: 1
            reply: "ดีสิ ประชุมจะสั้นลงครึ่งนึง แต่นายกคงไม่ชอบ ประชุมสั้นเขาพูดไม่ทันจบประโยคแรก"

  - id: hong_s_cat
    topic: smalltalk
    npc: "แมวที่ขโมยปลาทูเจ๊เดือนก่อนกลับมาแล้ว พาลูกมาสามตัว นั่งเรียงหน้าแผงมองเจ๊ เหมือนมาทวงหนี้ย่ะ"
    options:
      - text: "เจ๊ให้ปลาเขาไหม{kq}"
        heart: 1
        reply: "ให้สิ จะทำไงได้ สี่ตัวมองแบบนั้น เจ๊ใจแข็งกับคนได้ แต่กับแมวเจ๊แพ้ตั้งแต่ตัวแรกเหลียวหน้า"
      - text: "แมวเก่งกว่าลูกหนี้เสี่ยเฮงอีก{k}"
        heart: 1
        reply: "ใช่! แมวไม่ต้องเซ็นอะไรเลย มองอย่างเดียวได้ปลาทั้งตัว เจ๊ควรไปเรียนกับแมว"

  - id: hong_s_kids
    topic: smalltalk
    npc: "ดูนี่ รูปรับปริญญาลูกเจ๊สามคน เจ๊ใช้เป็นหน้าจอโทรศัพท์ ทุกครั้งที่มีคนโทรมาสั่ง… สั่งผลไม้ เจ๊ก็เห็นหน้าลูก"
    options:
      - text: "ลูกเจ๊หน้าเหมือนเจ๊เลย{k}"
        heart: 2
        reply: "ปากเหมือนเจ๊ทั้งสามคน คนโตเป็นพยาบาล คนกลางทำบัญชี คนเล็กทำธนาคาร เถียงเก่งทุกคน เจ๊ภูมิใจตรงนี้แหละ"
        next:
          - text: "เจ๊เลี้ยงคนเดียวเก่งมาก{k}"
            heart: 2
            reply: "…ไม่ได้เก่งหรอก แค่ไม่มีทางเลือก คนไม่มีทางเลือกดูเหมือนคนเก่งเสมอนั่นแหละย่ะ"
          - text: "ลูกเจ๊มาเยี่ยมบ่อยไหม{kq}"
            heart: 1
            reply: "สงกรานต์กับปีใหม่ คนเล็กโทรมาทุกคืน ถามว่าแม่ขายดีไหม เจ๊ตอบว่าดี… ซึ่งก็จริง ส่วนนึง"
      - text: "เจ๊ใช้รูปลูกบังโทรศัพท์จากใคร{kq}"
        heart: 0
        reply: "จากคนที่ชอบชะโงกดูหน้าจอเจ๊ไง ป้าแต๋วนั่นแหละ เห็นหน้าลูกเจ๊แล้วป้าก็ถอย"

  - id: hong_s_noon
    topic: smalltalk
    when: { time: noon }
    npc: "เที่ยงแล้ว เจ๊นั่งยองๆ หน้าแผงมาหกชั่วโมง เข่าเจ๊ร้องเพลงลูกทุ่งได้สามเพลงแล้วย่ะ"
    options:
      - text: "ไปหาภก.มดสิ{kq}เจ๊"
        heart: 1
        reply: "ไปแล้ว ภก.บอกให้เลิกนั่งยอง เจ๊ถามว่าแล้วจะขายผลไม้ท่าไหน ภก.บอกว่า ‘ท่ามีเก้าอี้ครับ’ เจ๊ซื้อเก้าอี้แล้ว นั่งไม่ได้ เหมือนไม่ใช่แม่ค้า"
      - text: "{p}เฝ้าแผงให้ เจ๊ไปพัก{k}"
        heart: 2
        reply: "จริงเหรอ! ห้ามลดราคาใครนะ ห้ามคุยกับใครที่มากระซิบ ใครถามเลข บอกว่าเจ๊ไม่อยู่ เข้าใจไหมย่ะ"

  # ===== self =====
  - id: hong_f_market
    topic: self
    npc: "เจ๊ตั้งแผงตลาดนี้มาตั้งแต่ยังเป็นลานดินหลังวัด ตอนนั้นมีแผงเจ๊กับแผงแม่เสี่ยเฮงขายโจ๊ก ตอนนี้เจ๊อยู่ที่เดิม เสี่ยไปไกลแล้ว"
    options:
      - text: "เจ๊อิจฉาเสี่ยเหรอ{kq}"
        heart: 1
        reply: "อิจฉาตรงที่เขามีโกดัง เจ๊มีแค่ผ้าใบรั่ว แต่เจ๊ไม่ต้องหักความชื้นใคร เจ๊นอนหลับได้… เกือบทุกคืน"
      - text: "เจ๊ไม่อยากเปลี่ยนไปทำอย่างอื่นเหรอ{kq}"
        heart: 1
        reply: "เคยอยาก ตอนสาวๆ อยากเป็นนักร้อง เสียงดังขนาดนี้ไม่ต้องใช้ไมค์ แต่ร้องแล้วคนต่อราคา เลยมาขายของแทน"

  - id: hong_f_husband
    topic: self
    when: { heart_min: 3 }
    npc: "ผัวเจ๊ไปทำงานต่างประเทศตอนลูกคนเล็กสามขวบ ส่งเงินมาสองปี แล้วก็ส่งแต่จดหมาย แล้วก็ไม่ส่งอะไรเลย เจ๊ไม่รู้ว่าเขาอยู่ไหน และไม่อยากรู้แล้วย่ะ"
    options:
      - text: "เจ๊เสียใจไหม{kq}"
        heart: 2
        reply: "เสียใจปีแรก โกรธปีที่สอง ปีที่สามไม่มีเวลาทั้งสองอย่าง ต้องขายผลไม้ ความเสียใจมันไม่จ่ายค่าเทอมให้ใครย่ะ"
        next:
          - text: "เจ๊เข้มแข็งมาก{k}"
            heart: 1
            reply: "เข้มแข็งตอนกลางวัน กลางคืนนับโพย… นับเงินแล้วร้องไห้บ้างเป็นบางคืน ไม่บอกใครนะ"
          - text: "เขาอาจจะมีเหตุผล{k}"
            heart: -1
            reply: "เหตุผลอะไรก็ช่าง ลูกสามคนไม่ได้กินเหตุผลย่ะ เปลี่ยนเรื่องเถอะ"
      - text: "ขอโทษที่ถาม{k}"
        heart: 1
        reply: "ไม่ได้ถาม เจ๊เล่าเอง อย่าขอโทษย่ะ ขอโทษแล้วเจ๊รู้สึกเหมือนต้องเศร้า"

  - id: hong_f_start
    topic: self
    when: { heart_min: 5 }
    npc: "(เสียงเบา) เลขน่ะ เจ๊เริ่มจากรับแทงให้เพื่อนบ้านสามคน ค่าเทอมลูกคนโตขาดสี่พัน เดือนเดียวก็พอ… ตอนนี้สิบห้าปีแล้วย่ะ"
    options:
      - text: "ทำไมไม่เลิกตอนลูกจบ{kq}"
        heart: 2
        reply: "คิดทุกวัน แต่ถ้าเจ๊เลิก คนก็ไปแทงกับเจ้ามือตำบลข้างๆ ที่จ่ายช้าแล้วเบี้ยว เจ๊บอกตัวเองว่าเจ๊เป็นเจ้ามือที่ดีที่สุดในบรรดาเจ้ามือ… มันฟังดูโง่ใช่ไหมย่ะ"
        next:
          - text: "ไม่โง่หรอก{k} แต่เจ๊เหนื่อยแล้ว"
            heart: 2
            reply: "…ใช่ เจ๊เหนื่อยแล้ว น้องเป็นคนแรกที่พูดคำนี้กับเจ๊ ไม่ได้พูดว่าเจ๊ผิด พูดว่าเจ๊เหนื่อย"
          - text: "ฟังดูเหมือนข้ออ้าง{k}"
            heart: 0
            reply: "ข้ออ้างก็ใช่ เจ๊รู้ คนทุกคนมีข้ออ้างของตัวเองแหละย่ะ เจ๊แค่ไม่ได้ซ่อนมันเก่งเท่านักการเมือง"
      - text: "เจ๊บอก{p}ทำไม{kq}"
        heart: 1
        reply: "ไม่รู้สิ น้องไม่เคยมาถามเลข แต่มาซื้อมะม่วงทุกอาทิตย์ คนแบบนี้เจ๊อยากเล่าให้ฟัง"

  - id: hong_f_daughter
    topic: self
    when: { heart_min: 7 }
    npc: "ลูกคนเล็กเจ๊ทำธนาคาร เขาเพิ่งเล่าว่าธนาคารมีอบรมเรื่องฟอกเงินจากการพนัน เขาพูดว่า ‘แม่ ในต่างจังหวัดเยอะเลยนะ คนทำหวยใต้ดิน’ เจ๊หัวเราะไปด้วย หัวเราะแห้งที่สุดในชีวิต"
    options:
      - text: "เจ๊กลัวเขารู้ใช่ไหม{kq}"
        heart: 2
        reply: "กลัวกว่าดาบ กลัวกว่าผู้กำกับ กลัวกว่าทุกอย่าง ลูกเจ๊ภูมิใจว่าแม่ขายผลไม้ส่งเรียน ถ้ารู้ว่าส่งด้วยอะไร… เจ๊ไม่อยากเห็นหน้าเขาตอนนั้น"
        next:
          - text: "เขาอาจจะเข้าใจ{k}"
            heart: 1
            reply: "อาจจะ ถ้าเจ๊เลิกก่อนเขารู้ เขาจะไม่ต้องเข้าใจอะไรเลย ง่ายกว่าย่ะ"
          - text: "บอกเขาเองดีกว่าให้คนอื่นบอก{k}"
            heart: 1
            reply: "ในตำบลที่มีป้าแต๋ว… น้องพูดถูก เจ๊มีเวลาไม่นานหรอก"
      - text: "เปลี่ยนเรื่องไหม{kq}เจ๊"
        heart: 1
        reply: "เปลี่ยน ซื้อส้มสักกิโลสิ ส้มหวานกว่าเรื่องนี้เยอะย่ะ"

  # ===== others =====
  - id: hong_o_sathian
    topic: others
    npc: "ดาบเสถียรยืนแผงเจ๊วันพุธ กินเงาะไปครึ่งกิโล แล้วบอกว่ากำลัง ‘เฝ้าระวัง’ เจ๊ว่าดาบเฝ้าระวังเงาะเจ๊ได้ดีที่สุดในประเทศ"
    options:
      - text: "ดาบรู้เรื่องเจ๊ไหม{kq}"
        heart: 1
        reply: "รู้หรือไม่รู้ ดาบเลือกไม่รู้ทุกวันพุธ เป็นการตัดสินใจที่ดาบทำได้สม่ำเสมอที่สุดในชีวิตราชการย่ะ"
        next:
          - text: "แบบนี้เรียกว่าส่วยหรือเปล่า{kq}"
            heart: 0
            reply: "เงาะครึ่งกิโลเรียกส่วยเหรอ ส่วยจริงเขาใส่ซองไปอำเภอย่ะ ดาบได้แค่เงาะ ดาบน่าสงสารที่สุดในสายโซ่"
          - text: "ดาบใจดีนะ{k}"
            heart: 1
            reply: "ดาบขี้เกียจ แต่ขี้เกียจแบบใจดี เจ๊รักดาบแบบน้องชายที่ไม่ได้เรื่อง"
      - text: "ดาบไม่ได้จ่ายเงินเลยเหรอ{kq}"
        heart: 0
        reply: "จ่ายพรุ่งนี้ทุกวัน พรุ่งนี้ของดาบยาวกว่าปฏิทินเสี่ยเฮงอีก"

  - id: hong_o_sommai
    topic: others
    npc: "ลุงสมหมายมาเมื่อเช้า ควายลุงจามสามทีติดกัน ลุงเลยขอเลขสามตัว เจ๊บอกลุงพาควายไปหาหมอก่อนเถอะ จามสามทีแล้วยังไม่หายมันไม่ใช่เลข มันคือไข้หวัดย่ะ"
    options:
      - text: "ป้าพรรู้ไหม{kq}"
        heart: 1
        reply: "รู้ เดี๋ยวบ่ายนี้ป้าพรจะมาด่าเจ๊ที่แผง เสร็จแล้วซื้อส้มสองกิโล ทุกงวดเป็นแบบนี้ เจ๊กับป้าพรมีความสัมพันธ์ทางการค้าแบบรุนแรง"
      - text: "เจ๊ไม่รับลุงไปเลยสิ{k}"
        heart: 1
        reply: "เจ๊เคยไม่รับ ลุงไปแทงตำบลข้างๆ โดนโกงสองพัน กลับมานั่งร้องไห้หน้าแผงเจ๊ เจ๊เลยต้องรับ อย่างน้อยเจ๊ไม่โกง"

  - id: hong_o_taew
    topic: others
    npc: "ป้าแต๋วกับเจ๊ดูละครหลังข่าวด้วยกันทุกคืน ป้าร้องไห้ตอนนางเอกร้อง เจ๊ด่าพระเอก ป้าพรโทรมาบอกตอนจบ เป็นทีมที่ดีที่สุดในตำบลย่ะ"
    options:
      - text: "ป้าแต๋วรู้ความลับเจ๊ไหม{kq}"
        heart: 1
        reply: "ป้าแต๋วรู้ทุกอย่าง แต่เรื่องเจ๊ ป้าไม่เคยพูด สิบห้าปีไม่เคยหลุดสักคำ ป้าแต๋วปากมากเฉพาะเรื่องที่ไม่ทำร้ายใครย่ะ"
      - text: "เจ๊ชอบดูละครเรื่องอะไร{kq}"
        heart: 1
        reply: "เรื่องที่ผัวหนีแล้วเมียรวย เจ๊ดูแล้วจดเทคนิค ยังรวยไม่ได้สักที ละครโกหก"

  - id: hong_o_heng
    topic: others
    npc: "เสี่ยเฮงชอบพูดว่าเจ๊ขายความหวัง เสี่ยขายตอนความหวังหมด เจ๊ว่าเสี่ยพูดผิด เจ๊ขายผลไม้ ส่วนเสี่ยขายปุ๋ยที่ทำให้ความหวังโตช้าลงย่ะ"
    options:
      - text: "เจ๊กับเสี่ยไม่ถูกกันเหรอ{kq}"
        heart: 1
        reply: "ถูกกันดี เสี่ยมาซื้อทุเรียน เจ๊ไปซื้อยาฆ่ามด เราต่อราคากันสิบนาทีทุกครั้งแล้วจ่ายเต็มทุกครั้ง เพื่อนแท้ในวงการเงิน"
      - text: "เสี่ยใจดีกว่าที่คิดนะ{kq}"
        heart: 1
        reply: "รู้ เจ๊รู้มานานแล้ว เสี่ยกับเจ๊เป็นพวกเดียวกัน ทำตัวเลวให้คนกลัว แต่ไม่กล้าเลวจริง… อย่าเอาไปพูดย่ะ เสียราคาทั้งคู่"

  - id: hong_o_ton
    topic: others
    npc: "ชาวบ้านไปขอเลขเณรต้นอีกแล้ว เจ๊ไล่หมดเลย เณรเขาตั้งใจเรียนธรรมะ จะไปกวนทำไม อยากได้เลขมาถามเจ๊สิ… เอ๊ย อยากได้ผลไม้มาถามเจ๊"
    options:
      - text: "เจ๊ปกป้องเณรเหรอ{kq}"
        heart: 2
        reply: "เด็กควรได้เป็นเด็ก ลูกเจ๊โตมากับแม่ที่กระซิบเลขทั้งวัน เจ๊ไม่อยากให้เด็กคนไหนโตแบบนั้นอีกย่ะ"
      - text: "เณรให้เลขแม่นไหม{kq}"
        heart: 0
        reply: "ไม่เคยถูกสักงวด เพราะเณรให้แต่เลขหน้าพระธรรมที่เพิ่งท่อง ใครแทงตามก็ได้บุญแทนเงิน คุ้มกว่า"

quests:
  - id: hong_q1
    npc: hong
    title: "สมุดเล่มเขียวปลิว"
    desc: "ลมพัดสมุดเล่มเขียวของเจ๊หงษ์หายไป — ได้ข่าวว่าดาบเสถียรเก็บได้"
    start: { heart_min: 2, day_min: 3 }
    offer:
      npc: "น้อง! ช่วยเจ๊หน่อย ลมเมื่อเช้าพัดสมุดเล่มเขียวเจ๊ปลิวไป ในนั้นเป็น… บัญชีผลไม้ ใช่ บัญชีผลไม้ ป้าแต๋วบอกว่าเห็นดาบเสถียรเก็บไป เจ๊ไปเองไม่ได้ย่ะ"
      options:
        - text: "ได้{k}เจ๊ เดี๋ยว{p}ไปถามดาบให้"
          accept: true
          heart: 1
          reply: "ดีมาก ทำหน้าปกติๆ นะ บอกว่าเป็นสมุดจดราคาเงาะ ถ้าดาบเปิดดูแล้วถามว่าทำไมเงาะมีเลขสามหลัก บอกว่าเงาะพันธุ์ใหม่"
        - text: "บัญชีผลไม้จริงเหรอ{kq}"
          accept: true
          heart: 0
          reply: "จริงที่สุดในโลก ถามมากเจ๊ขึ้นราคาเงาะ ไปเร็วๆ ก่อนดาบตื่นเต็มตา"
        - text: "เจ๊ไปเองเถอะ{k}"
          heart: -1
          reply: "เจ๊ไปเอง ดาบก็ต้องทำหน้าจริงจัง ทำหน้าจริงจังแล้วต้องทำงาน ไม่ดีกับทุกคนย่ะ ช่างเถอะ"
    steps:
      - goal: { type: talk, npc: sathian }
        hint: "ไปถามดาบเสถียรที่ป้อมตำรวจหรือร้านป้าแต๋ว เรื่องสมุดเล่มเขียว"
        done:
          npc: "สมุดเล่มเขียวเหรอ ดาบเก็บได้หน้าตลาด ดาบยังไม่ได้เปิดดูเลยนะ ดาบอ่านหนังสือตอนกลางวันไม่ค่อยออก ตาพร่า… เอาไปคืนเจ๊เขาเถอะ บอกว่าดาบไม่เห็นตัวเลขอะไรทั้งนั้น"
          options:
            - text: "ขอบคุณ{k}ดาบ ดาบใจดีนะ"
              heart: 1
              reply: "ดาบไม่ได้ใจดี ดาบประหยัดพลังงาน เปิดสมุดก็ต้องทำบันทึก ทำบันทึกก็ต้องส่งอำเภอ ส่งอำเภอก็ต้องตื่น"
            - text: "ดาบไม่จับเจ๊เหรอ{kq}"
              heart: 0
              reply: "จับเจ๊แล้วใครจะขายเงาะวันพุธ… หมายถึงจับต้องมีหลักฐาน ดาบไม่เห็นหลักฐาน ดาบเห็นแต่สมุดสีเขียว จบนะ"
      - goal: { type: visit, place: market, from: "06:00", to: "10:00" }
        hint: "เอาสมุดไปคืนเจ๊หงษ์ที่แผงตลาดตอนเช้า (06:00–10:00)"
        done:
          npc: "ได้คืนแล้ว! โอ๊ย เจ๊นึกว่าคืนนี้ต้องนอนคุก… นอนไม่หลับ เจ๊หมายถึงนอนไม่หลับ น้องเปิดดูไหมย่ะ"
          options:
            - text: "ไม่ได้เปิด{k} แต่เจ๊น่าจะเลิกจดเป็นเล่มนะ"
              heart: 2
              set_flag: hong_q1_warned
              reply: "…เจ๊รู้ จดเป็นเล่มก็เหมือนเขียนคำสารภาพเก็บไว้ในกระเป๋า แต่ถ้าไม่จด เจ๊จำไม่ได้ว่าใครถูกเท่าไหร่ แล้วเจ๊ไม่เคยเบี้ยวใคร"
            - text: "เปิดดูนิดเดียว{k} เงาะพันธุ์ใหม่เยอะจัง"
              heart: 1
              reply: "ปากดีนะยะ! …ช่างเถอะ ใครๆ ก็รู้ เจ๊แค่ไม่อยากให้มันเป็นหลักฐาน เอาเงาะไปกิโลนึง ปิดปากด้วยเงาะ"
    reward: { money: 150, heart: 1, items: { tangerine: 3 }, set_flag: hong_q1_done, line: { from: hong, text: "ขอบคุณคนเก็บสมุดบัญชีผลไม้ของเจ๊ได้นะคะ 🍊 พรุ่งนี้ส้มเขียวหวานลด 5 บาททั้งแผง (ไม่เกี่ยวกัน แค่อารมณ์ดี)" } }

  - id: hong_q2
    npc: hong
    title: "แผงที่มีแต่ผลไม้"
    desc: "ลูกสาวเจ๊หงษ์จะกลับบ้านวันเสาร์ เจ๊อยากให้แผงดูเป็นแผงผลไม้ล้วนๆ"
    start: { flag: hong_q1_done, heart_min: 3, day_min: 7 }
    offer:
      npc: "น้อง… ลูกคนเล็กเจ๊จะกลับบ้านเสาร์นี้ เขาอยากมาช่วยเจ๊ขายของที่ตลาด เจ๊ดีใจจะแย่ แต่… ถ้ามีคนเดินมากระซิบเลขต่อหน้าเขา เจ๊ตายแน่ย่ะ ช่วยเจ๊หน่อย"
      options:
        - text: "ให้{p}ช่วยอะไร{kq}เจ๊"
          accept: true
          heart: 1
          reply: "สองอย่าง เอามะม่วงมาเติมแผงให้เต็ม แผงเต็มคนจะคุยเรื่องผลไม้ แล้วไปบอกลุงสมหมายว่าเสาร์นี้ห้ามมาแผงเจ๊ ห้ามเด็ดขาด"
        - text: "เจ๊บอกลูกตรงๆ ไม่ดีกว่าเหรอ{kq}"
          accept: true
          heart: 0
          reply: "ไม่ใช่เสาร์นี้ย่ะ เสาร์นี้เจ๊อยากเป็นแม่ค้าผลไม้ธรรมดาๆ สักวัน ช่วยเจ๊ก่อน แล้วค่อยเทศน์ทีหลัง"
        - text: "ไม่เกี่ยวกับ{p}นะ{kq}"
          heart: -1
          reply: "ไม่เกี่ยวก็ได้ย่ะ เจ๊แค่นึกว่าเราสนิทกันพอแล้ว… ช่างเถอะ"
    steps:
      - goal: { type: give, npc: hong, item: mango, n: 5 }
        hint: "เอามะม่วง 5 ลูกไปเติมแผงเจ๊หงษ์"
        done:
          npc: "มะม่วงต้นยายเพียรใช่ไหม! กลิ่นเหมือนเดิมเลย ลูกเจ๊เคยกินตอนเด็ก ยายแบ่งมาให้หน้าแผงทุกปี เขาต้องจำได้แน่ย่ะ"
          options:
            - text: "งั้นบอกเขาว่ามะม่วงยาย{k}"
              heart: 2
              reply: "จะบอก แล้วจะบอกว่าหลานยายเป็นคนเอามาให้ เขาจะถามว่าใคร เจ๊จะบอกว่าคนที่ช่วยเจ๊ไม่ให้… ไม่ๆ บอกแค่ว่าหลานยาย"
            - text: "คิดราคาเท่าไหร่{kq}เจ๊"
              heart: 0
              reply: "ห้ามคิด! เจ๊ไม่เอาเงินจากน้องรอบนี้ เดี๋ยวขายได้เจ๊แบ่งให้ ครึ่งต่อครึ่ง ยุติธรรมกว่าลอตเตอรี่ทุกใบย่ะ"
      - goal: { type: talk, npc: sommai }
        hint: "ไปขอลุงสมหมายว่าเสาร์นี้อย่าเพิ่งไปแผงเจ๊หงษ์"
        done:
          npc: "เสาร์นี้ไม่ให้ไปแผงเจ๊เหรอ… งวดนี้ควายผมฝันแรงนะหลาน มันเดินวนสามรอบแล้วนอนหันหัวไปทางตลาด… ก็ได้ๆ ลูกเจ๊กลับมาทั้งที ลุงไปซื้อเงาะเฉยๆ ไม่พูดอะไร ยืนมองเจ๊อย่างมีความหมายพอ"
          options:
            - text: "ไม่ต้องยืนมองด้วย{k}ลุง"
              heart: 1
              reply: "ไม่มองก็ได้ ลุงจะมองควายแทน ควายลุงมองเจ๊เอง ลุงไม่รับผิดชอบนะ"
            - text: "ขอบคุณ{k}ลุง ลุงใจดี"
              heart: 1
              reply: "ลุงไม่ได้ใจดี ป้าพรบอกว่าถ้าลุงไปแผงเจ๊วันลูกเจ๊อยู่ ป้าจะไปเล่าให้ลูกเจ๊ฟังว่าลุงแทงเท่าไหร่ทั้งชาติ ลุงกลัวป้ามากกว่าควาย"
    reward: { money: 200, heart: 2, items: { tangerine: 2 }, set_flag: hong_q2_done, line: { from: hong, text: "📸 วันนี้ลูกสาวมาช่วยขายของที่แผง ขายหมดตั้งแต่สิบโมง! ขอบคุณลูกค้าทุกคนค่ะ 🥭❤️ (คนที่เดินมาถามอย่างอื่น เจ๊ไม่รู้จักนะ)" } }

  - id: hong_q3
    npc: hong
    title: "เลขสามสิบสอง"
    desc: "ทั้งตำบลแทงเลขผีตัวเดียวกัน ถ้าออก เจ๊หงษ์เจ๊ง"
    start: { flag: hong_q2_done, heart_min: 4, day_min: 15 }
    offer:
      npc: "(กระซิบ) น้อง เจ๊มีปัญหา ทั้งตำบลแทงสามสิบสอง เลขผีไซต์บาดาล ถ้าออก เจ๊ต้องจ่ายสามแสน เจ๊มีแสนเดียว… เจ๊ไม่รู้จะคุยกับใคร"
      options:
        - text: "เจ๊ปิดรับเลขนั้นสิ{kq}"
          accept: true
          heart: 1
          reply: "ปิดแล้ว แต่ที่รับไปแล้วก็คือรับไปแล้ว เจ๊ไม่เบี้ยว… ป้าแต๋วเสนอทางหนึ่ง ให้ป้าปล่อยข่าวว่าผีจริงๆ ยืนเสาต้นที่สามไม่ใช่ที่สอง คนจะแห่ไปแทงยี่สิบสามแทน น้องไปคุยกับป้าแต๋วหน่อย"
        - text: "เจ๊ทำเอง เจ๊ก็รับผลเองสิ{k}"
          accept: true
          heart: 0
          reply: "ใช่ เจ๊รับ… แต่ช่วยไปฟังป้าแต๋วหน่อย ป้ามีแผน แผนแบบป้าแต๋ว เจ๊ไม่กล้าฟังคนเดียว"
        - text: "{p}ไม่ยุ่งเรื่องหวย{k}"
          heart: 0
          reply: "ดีแล้ว เจ๊ไม่โกรธ คนไม่ยุ่งเรื่องหวยคือคนที่ฉลาดที่สุดในตำบลย่ะ"
    steps:
      - goal: { type: talk, npc: taew }
        hint: "ไปฟังแผนของป้าแต๋วที่ร้านชำ"
        done:
          npc: "ป้าไม่ได้พูดนะ แต่ถ้าป้าเล่าในร้านว่าคนงานเห็นผีที่เสาต้นที่สามไม่ใช่ต้นที่สอง ภายในเย็นนี้คนจะย้ายไปยี่สิบสามครึ่งตำบล เจ๊หงษ์จะรอด… หลานว่าป้าควรเล่าไหม ป้าเล่าเรื่องจริงมาสามสิบปี เรื่องโกหกนี่ป้าไม่ค่อยถนัด"
          options:
            - text: "อย่าเลย{k}ป้า ให้เจ๊รับผลที่ทำเอง"
              heart: 1
              set_flag: hong_q3_truth
              reply: "นั่นสิ… ป้าก็คิดแบบนั้น ป้าแค่สงสารเจ๊ ถ้าออกจริง ป้าจะเอาเงินเก็บไปช่วยเจ๊ครึ่งนึง อย่าบอกเจ๊ล่ะ"
            - text: "เล่าเลย{k}ป้า ช่วยเจ๊ก่อน"
              heart: 0
              set_flag: hong_q3_rumor
              reply: "ได้… ป้าจะเล่าให้ป้าพรฟังคนแรก ป้าพรเล่าเร็วกว่าป้าอีก ข่าวลือนี่แหละนะหลาน ฆ่าคนก็ได้ ช่วยคนก็ได้ วันนี้ใช้ช่วย"
      - goal: { type: days, n: 2 }
        hint: "รอหวยออกอีก 2 วัน"
        done:
          npc: "ออกแล้ว… เจ็ดศูนย์ ไม่ใช่สามสิบสอง ไม่ใช่ยี่สิบสาม ไม่มีใครถูกเลย ผีไม่ได้ให้เลขใคร… เจ๊รอดย่ะ แต่เจ๊นั่งตัวสั่นอยู่หลังแผงตั้งแต่ตีห้า"
          options:
            - text: "เจ๊รอดแล้ว{k} เลิกตอนนี้เลยดีไหม{kq}"
              heart: 2
              reply: "…สองคืนที่ผ่านมา เจ๊นอนไม่หลับเลย คิดแต่ว่าถ้าลูกรู้ว่าแม่ขายสร้อยยายจ่ายคนแทงหวย… น้องพูดถูก ให้เจ๊คิดอีกนิด"
            - text: "โชคดีนะ{k}เจ๊"
              heart: 0
              reply: "โชคดีงวดนี้ งวดหน้าก็มีผีตัวใหม่ เลขใหม่ ความหวังใหม่ ทั้งตำบลไม่เคยเหนื่อยหวังเลยย่ะ แต่เจ๊เหนื่อยแล้ว"
    reward: { money: 200, heart: 2, set_flag: hong_q3_done, line: { from: hong, text: "งวดนี้ผลไม้ขายดีมาก ขอบคุณทุกคนค่ะ 🙏 ปล. ผีไม่ได้ให้เลขใคร อย่าเชื่อข่าวลือ (ป้าแต๋วฝากบอกด้วย)" } }

  - id: hong_q4
    npc: hong
    title: "แผงเดียวของเจ๊"
    desc: "ลูกสาวเจ๊หงษ์ขอย้ายมาทำงานธนาคารสาขาอำเภอ — เจ๊ต้องตัดสินใจเรื่องโพย"
    start: { flag: hong_q3_done, heart_min: 6, day_min: 20 }
    offer:
      npc: "น้อง ลูกคนเล็กเจ๊ขอย้ายมาสาขาอำเภอแล้ว จะมาอยู่บ้านกับเจ๊ เจ๊ดีใจจนร้องไห้… แล้วก็กลัวจนร้องไห้อีกรอบ อยู่บ้านเดียวกัน ความลับเก็บไม่อยู่หรอกย่ะ"
      options:
        - text: "{p}อยู่ข้างเจ๊เสมอ{k}"
          accept: true
          heart: 2
          reply: "พูดซึ้งแบบนี้เจ๊ลดราคาไม่ได้นะ… ขอบใจย่ะ มาช่วยเจ๊ตั้งแผงพรุ่งนี้เช้า เจ๊จะคิดดังๆ ให้น้องฟัง"
        - text: "ถึงเวลาแล้วนะ{kq}เจ๊"
          accept: true
          heart: 1
          reply: "รู้ ทุกคนรู้ ยกเว้นลูกเจ๊ มาหาเจ๊ที่แผงตอนเช้า เจ๊ต้องการคนยืนข้างๆ ตอนคิดเรื่องนี้"
        - text: "เจ๊ตัดสินใจเองเถอะ{k}"
          heart: 0
          reply: "ก็จริง… เจ๊ตัดสินใจเองมาทั้งชีวิต ทำไมครั้งนี้มันหนักจังก็ไม่รู้"
    steps:
      - goal: { type: visit, place: market, from: "06:00", to: "08:00" }
        hint: "ไปช่วยเจ๊หงษ์ตั้งแผงตอนเช้ามืด (06:00–08:00)"
        done:
          npc: "ตั้งแผงมายี่สิบห้าปี วันนี้มือเจ๊สั่นครั้งแรก… ลูกถามเมื่อคืนว่า ‘แม่ มีอะไรไม่สบายใจหรือเปล่า’ เจ๊บอกว่ามะม่วงราคาตก เขาไม่เชื่อ ลูกเจ๊ฉลาดเกินไปย่ะ"
          options:
            - text: "เขาฉลาดเหมือนเจ๊{k}"
              heart: 1
              reply: "ฉลาดแต่ไม่ต้องเหนื่อยเหมือนเจ๊ นั่นแหละที่เจ๊ทำทั้งหมดก็เพื่อสิ่งนี้"
            - text: "เจ๊ซื้อลิปให้ตัวเองสักแท่งไหม{kq} วันพิเศษ"
              heart: 1
              reply: "ลิป… เจ๊ทาสีแดงวันลูกรับปริญญาทุกคน ถ้าน้องเอามาให้ เจ๊จะทาวันที่คุยกับลูก จะได้ดูเข้มแข็งย่ะ"
      - goal: { type: give, npc: hong, item: lipstick_red, n: 1 }
        hint: "ซื้อลิปสติกสีแดงที่ร้าน 24 ชม. ไปให้เจ๊หงษ์"
        done:
          npc: "แดงเลือดหมู สีเดิม… น้องจำได้ด้วย เจ๊ทาแล้วนะ ดูเป็นไง เหมือนแม่ค้าที่พร้อมจะพูดความจริงไหมย่ะ"
          options:
            - text: "เหมือนแม่ที่ลูกภูมิใจ{k}"
              heart: 2
              reply: "…อย่าทำให้เจ๊ร้องไห้ ลิปเลอะ ราคาร้อยเก้าสิบเก้านะ"
            - text: "เหมือนเจ๊หงษ์คนเดิม{k}"
              heart: 1
              reply: "คนเดิมนี่แหละที่ต้องตัดสินใจ เจ๊ไม่ได้อยากเป็นคนใหม่ เจ๊แค่อยากเป็นคนเดิมที่ไม่ต้องกระซิบ"
      - goal: { type: talk, npc: hong }
        hint: "ฟังการตัดสินใจของเจ๊หงษ์"
        done:
          npc: "เจ๊คิดครบแล้ว มีสามทาง ปิดโพยเงียบๆ แล้วลูกไม่มีวันรู้ หรือปิดโพยแล้วบอกลูกทุกอย่าง หรือ… ทำต่อแต่เก็บให้มิดกว่าเดิม น้องว่าไงย่ะ บอกมาตรงๆ"
          options:
            - text: "ปิดโพยเงียบๆ{k} ความลับนี้ตายไปกับเจ๊"
              heart: 1
              set_flag: hong_end_quit
              reply: "ตายไปกับเจ๊… ได้ เจ๊จะเผาสมุดเล่มเขียวคืนนี้ แล้วพรุ่งนี้เจ๊จะเป็นแม่ค้าผลไม้ที่ขายแพงที่สุดในตำบล แบบสุจริตย่ะ"
            - text: "ปิดโพยแล้วบอกลูก{k} เขาควรรู้ว่าแม่สู้มายังไง"
              heart: 2
              set_flag: hong_end_confess
              reply: "บอกทุกอย่าง… รวมถึงค่าเทอมเขาเอง เจ๊กลัวที่สุดในชีวิต แต่เจ๊จะบอกคืนนี้ ทาลิปไว้แล้ว ถ้าร้องไห้ก็ร้องแบบปากแดง"
              next:
                - text: "{p}ไปนั่งเป็นเพื่อนไหม{kq}"
                  heart: 2
                  reply: "ไม่ต้องย่ะ เรื่องแม่ลูกต้องคุยกันสองคน… แต่พรุ่งนี้เช้ามาแผงเจ๊นะ ไม่ว่าผลจะเป็นยังไง เจ๊อยากเห็นหน้าคนที่รู้แล้วยังมาซื้อมะม่วง"
                - text: "เขาจะเข้าใจ{k}เจ๊"
                  heart: 1
                  reply: "หวังว่างั้น ถ้าไม่เข้าใจ เจ๊ก็มีเวลาที่เหลือทั้งชีวิตทำให้เขาเข้าใจ ดีกว่ามีเวลาทั้งชีวิตซ่อน"
            - text: "ทำต่อเถอะ เก็บให้มิดกว่าเดิม"
              heart: -1
              set_flag: hong_end_keep
              reply: "มิดกว่าเดิม… ได้ย่ะ เจ๊ทำได้ เจ๊ทำมาสิบห้าปี แต่เจ๊นึกว่าน้องจะพูดอย่างอื่น ซื้อเงาะไปเถอะ วันนี้เจ๊ไม่อยากคุยแล้ว"
    sold_at: { lipstick_red: store24 }
    reward: { money: 300, heart: 2, items: { fruit_basket: 1 }, set_flag: hong_q4_done, line: { from: hong, text: "📢 แผงผลไม้เจ๊หงษ์ เปิดทุกพุธ-เสาร์ 06.00–14.00 ขายผลไม้อย่างเดียว ย้ำ ผลไม้อย่างเดียว 🍊🥭🍌 ไม่ต้องมากระซิบนะคะ" } }
