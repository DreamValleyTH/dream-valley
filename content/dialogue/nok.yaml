# นก ♥ (สาวโรงงาน กลับบ้านวันที่ 6–7 ของสัปดาห์) — convos + quests (เรื่องรอง: ร้านส้มตำหน้าวัด หนี้เสี่ยเฮง สัญญากับบอล)
convos:
  # ===== react =====
  - id: nok_r_meet
    topic: react
    once: true
    when: { not_flag: met_nok }
    npc: "อ้าว! แกคือหลานยายเพียรที่แม่ฉันเล่าใช่ป่ะ ที่ลาออกจากกรุงเทพฯ มาทำนา… จริงดิ ลาออกได้จริงดิ ทำยังไง สอนหน่อย ฉันจดเลย"
    set_flag: met_nok
    options:
      - text: "ก็ยื่นใบลาออก แล้วขึ้นรถทัวร์กลับมา"
        heart: 1
        reply: "พูดง่ายเหมือนสั่งข้าวผัด ฉันพกใบลาออกในกระเป๋ามาสามปีแล้วนะแก ยังไม่เคยหยิบออกมาให้หัวหน้าดูสักที"
        next:
          - text: "พกไว้ก็ยังดี วันนึงก็ได้ใช้"
            heart: 2
            reply: "แกเป็นคนแรกที่ไม่บอกให้ฉันฉีกทิ้ง… เออ ฉันชื่อนก กลับบ้านแค่เสาร์อาทิตย์ จำหน้าไว้นะ เดี๋ยววันจันทร์ฉันก็หายแล้ว"
          - text: "{p}ก็กลัวนะ แต่มันเหนื่อยเกินแล้ว"
            heart: 2
            reply: "เหนื่อยเกินแล้ว… ประโยคนี้แหละ ฉันพูดกับตัวเองทุกคืนแต่ไม่เคยพูดดังๆ แกพูดแทนฉันแล้ว ขอบใจนะแก"
      - text: "นกใช่ไหม ป้าแต๋วเล่าถึงอยู่เหมือนกัน"
        heart: 1
        reply: "ป้าแต๋วเล่าว่าไง ว่าฉันผอมใช่ป่ะ ทั้งตำบลทักแค่สองเรื่อง ผอมกับเมื่อไหร่จะแต่ง ฉันตอบแบบเดียวกันว่า ‘หลังโอที’"
      - text: "ไม่ได้ลาออกเพื่อมาทำนาหรอก มันเกิดเรื่องขึ้น"
        heart: 0
        reply: "อ๋อ… เรื่องยายใช่ป่ะ ขอโทษนะแก ฉันพูดไวไป แม่ฉันไปงานยายแก แม่บอกว่ายายแกเคยให้แม่ยืมเงินค่าเทอมฉันตอน ม.6"

  - id: nok_r_lottery
    topic: react
    once: true
    when: { flag: bought_lottery }
    npc: "ได้ข่าวว่าแกซื้อหวยแล้ว… ฉันไม่ว่าหรอกนะ แค่บอกไว้ แม่ฉันเสียเงินกับหวยมาครึ่งชีวิต หนี้เสี่ยเฮงครึ่งนึงมาจากใบเล็กๆ แบบนั้นแหละแก"
    options:
      - text: "ซื้อใบเดียวเอง ไม่ซื้อแล้ว"
        heart: 1
        reply: "ใบเดียวก็พอ แม่ฉันก็เริ่มที่ใบเดียว… ไม่ได้ขู่นะแก ฉันแค่เห็นมาเยอะ ถ้าถูกก็ดีใจด้วยจริงๆ นะ"
        next:
          - text: "นกไม่เคยซื้อเลยเหรอ"
            heart: 1
            reply: "ไม่เคยสักใบ ทุกครั้งที่เห็นแผงลอตเตอรี่ ฉันคิดเป็นโอทีทันที ร้อยบาทเท่ากับโอทีชั่วโมงครึ่ง ฉันยังไม่เคยเห็นใครถูกเท่ากับที่ฉันทำโอทีเลย"
          - text: "แม่นกยังซื้ออยู่ไหม"
            heart: 0
            reply: "เลิกแล้วตอนฉันร้องไห้ใส่ครั้งนึง ตอนนั้นฉันกลับบ้านมาเจอแม่ซื้อสิบใบด้วยเงินที่ฉันโอนให้ ฉันไม่เคยร้องไห้ต่อหน้าแม่มาก่อน ตั้งแต่นั้นแม่ไม่ซื้ออีกเลย"
      - text: "ซื้อเล่นๆ ขำๆ"
        heart: 0
        reply: "ขำได้ตราบที่ยังขำอยู่นะแก ลุงสมหมายก็ซื้อขำๆ มาสามสิบปี ตอนนี้ขำคนเดียว ป้าพรไม่ขำด้วยแล้ว"

  - id: nok_r_refused
    topic: react
    once: true
    when: { flag: thana_refused }
    npc: "แกปฏิเสธคุณธนาจริงดิ! ทั้งตำบลพูดกันว่าหลานยายเพียรไล่รถเก๋งขาวไปแบบสุภาพ แม่ฉันยังไม่กล้าตอบเขาเลย เขามาบ้านฉันสองรอบแล้ว"
    options:
      - text: "บอกแม่ว่าไม่ต้องรีบตอบ ปล่อยให้เขารอไป"
        heart: 2
        reply: "รอไป… ใช่ บริษัทเขารอได้ คนจนต่างหากที่ชอบรีบ ฉันจะบอกแม่แบบนั้น ขอบใจนะแก"
        next:
          - text: "ถ้าเขามาอีก โทรหา{p}ก็ได้"
            heart: 2
            reply: "แกจะไปช่วยแม่ฉันเหรอ… เออ แม่ฉันจะดีใจมาก แม่ฉันชอบแกตั้งแต่ได้ยินว่าแกกินข้าวเหนียวมะม่วงสามห่อในงานยาย"
          - text: "ถ้าแม่อยากขาย นกจะว่าไง"
            heart: 0
            reply: "ฉันจะไม่มีบ้านให้กลับไงแก… แต่ถ้าขายแล้วหนี้หมด แม่ไม่ต้องลำบาก ฉันก็ไม่รู้จะเถียงยังไง ฉันเลยไม่เถียง ฉันแค่นอนไม่หลับ"
      - text: "ไม่ได้ไล่ แค่บอกว่ายังไม่ขาย"
        heart: 1
        reply: "ป้าแต๋วเล่าว่าแกไล่ ป้าพรเล่าว่าแกด่า ลุงสมหมายเล่าว่าแกถือจอบ ฉันเลือกเชื่อแบบลุงสมหมาย มันมันส์ดี"

  - id: nok_r_welldry
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "บ่อแม่ฉันแห้งแล้วแก แม่ซื้อน้ำถังละยี่สิบ วันละสามถัง เดือนนึงพันแปด เท่ากับโอทีสิบสองชั่วโมง ฉันต้องทำโอทีให้บริษัทนึง เพื่อจ่ายค่าน้ำที่อีกบริษัทนึงดูดไป"
    options:
      - text: "ฟังแล้วโกรธแทนเลย"
        heart: 1
        reply: "โกรธแล้วได้น้ำไหมแก… ไม่ได้ ฉันเลยไม่โกรธ ฉันคำนวณ ฉันคำนวณจนรู้ว่าทุกหยดน้ำที่แม่ใช้ ฉันต้องกดชิ้นส่วนกี่ชิ้น"
        next:
          - text: "ให้แม่มาตักน้ำบ้าน{p}ก่อนก็ได้"
            heart: 2
            reply: "จริงดิ… แม่จะเกรงใจแน่ แต่ฉันจะบังคับ ฉันจะบอกแม่ว่าแกเป็นคนบังคับ แม่จะได้ไม่เกรงใจฉัน"
          - text: "เดี๋ยว{p}ไปช่วยพี่เมย์หาหลักฐาน"
            heart: 1
            reply: "เมย์นักข่าวน่ะเหรอ… ระวังตัวนะแก ฉันได้ยินว่ามีรถขับตามเมย์ตอนกลางคืน ฉันไม่อยากกลับมาแล้วเจอแกในข่าว"
      - text: "นกไม่ต้องจ่ายคนเดียวนะ"
        heart: 2
        reply: "ใครจะจ่ายล่ะแก น้องชายยังเรียน แม่ขายพริกได้วันละไม่กี่ร้อย… ขอบใจนะที่พูด แต่ประโยคนี้มันไม่จ่ายค่าน้ำแทนฉันหรอก"

  - id: nok_r_ghost
    topic: react
    once: true
    when: { flag: story_ghost_rumor }
    npc: "แก ได้ยินป่ะ คนงานบริษัทลาออกเพราะผี! ที่โรงงานฉันคนลาออกเพราะหัวหน้า ที่นี่ลาออกเพราะผี ฉันว่าผีที่นี่ยังใจดีกว่าหัวหน้าฉันนะ ไล่คนแต่ไม่หักเงิน"
    options:
      - text: "ผีตำบลเรามีสหภาพแรงงานหรือเปล่า"
        heart: 2
        reply: "ฮ่าๆๆ สหภาพผีบ้านดงเย็น! เรียกร้องน้ำใต้ดินคืน ไม่งั้นนั่งบนท่อทุกคืน ฉันจะสมัครเป็นสมาชิก เงินเดือนเท่าไหร่ก็ได้"
        next:
          - text: "นกกลัวผีไม่ใช่เหรอ"
            heart: 1
            reply: "กลัวผีกระสือ ผีที่ปกป้องน้ำไม่กลัว แยกประเภทชัดเจน ชีวิตในโรงงานสอนให้แยกชิ้นส่วนเก่ง"
          - text: "พูดเบาๆ เดี๋ยวบริษัทได้ยิน"
            heart: 0
            reply: "บริษัทได้ยินก็ดี เขาจะได้รู้ว่าแม้แต่ผีก็ไม่อยากทำงานให้เขา"
      - text: "นกเชื่อเรื่องผีเหรอ"
        heart: 1
        reply: "เชื่อครึ่งนึง อีกครึ่งเชื่อว่ายายบัวปล่อยข่าว ยายบัวเก่งนะแก ปล่อยข่าวครั้งเดียว คนงานหนีสองคน ได้ผลกว่าประชุม อบต. สามครั้ง"

  - id: nok_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "คุณธนามาประกาศในประชุมว่าจะรับคนในตำบลเข้าทำงาน แม่ฉันได้รับเลือกเป็น ‘ผู้ช่วยดูแลรั้ว’ เดือนละเก้าพัน แม่ถามฉันว่าควรรับไหม ฉันตอบไม่ได้เลยแก"
    options:
      - text: "เก้าพันช่วยเรื่องหนี้ได้เยอะนะ"
        heart: 0
        reply: "ช่วยได้… แม่จะยืนเฝ้ารั้วที่กั้นนาลุงข้างบ้านไว้ แม่จะยืนข้างท่อที่ดูดบ่อตัวเอง เงินเดือนเก้าพัน ค่าน้ำเดือนละพันแปด เหลือเจ็ดพันสอง ฉันคิดแล้วอยากอ้วก"
      - text: "ให้แม่ตัดสินใจเอง แต่บอกแม่ว่านกจะไม่โกรธไม่ว่าแม่เลือกอะไร"
        heart: 2
        reply: "…นั่นแหละที่แม่อยากได้ยิน แม่ไม่ได้อยากให้ฉันเลือก แม่อยากรู้ว่าฉันจะไม่โกรธ แกเข้าใจแม่ฉันมากกว่าฉันอีก"
        next:
          - text: "เพราะ{p}ก็เคยเป็นลูกที่อยู่ไกลเหมือนกัน"
            heart: 2
            reply: "จริงดิ… งั้นแกรู้ใช่ป่ะ ว่าลูกที่อยู่ไกลชอบตัดสินใจแทนแม่ ทั้งที่ไม่ได้อยู่ด้วย ฉันจะหยุดทำแบบนั้นแล้ว"
          - text: "ถ้าแม่รับ ค่อยหางานอื่นทีหลังก็ได้"
            heart: 1
            reply: "ใช่ งานไม่ใช่สัญญาทาส… ยกเว้นงานฉัน ที่ติดสัญญาทุนฝึกงานอีกปีนึง ช่างมันเถอะ"
      - text: "อย่ารับเลย"
        heart: 1
        reply: "ฉันก็อยากพูดแบบนั้น แต่ฉันอยู่ชลบุรี ฉันพูดง่าย แม่อยู่ที่นี่ แม่ต้องกินข้าวทุกวัน"

  - id: nok_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ป้ายหาเสียงเต็มเสาไฟเลยแก ฉันหาป้ายรถเมล์ไม่เจอ เกือบขึ้นรถแห่หาเสียงไปชลบุรีแล้ว… เลือกตั้งฉันต้องลากลับมา ค่ารถไปกลับเท่าค่าแรงสองวัน แต่ฉันจะกลับ"
    options:
      - text: "ทำไมนกต้องกลับมาเลือกเอง"
        heart: 1
        reply: "เพราะคนที่ชนะจะตัดสินว่าบ่อแม่ฉันจะมีน้ำไหม ว่าเสี่ยเฮงจะคิดดอกได้แค่ไหน ว่าฉันจะได้กลับบ้านไหม สองวันค่าแรงมันถูกกว่าสี่ปีที่ต้องทนนะแก"
        next:
          - text: "นกพูดเหมือนนักการเมืองเลย"
            heart: 1
            reply: "อย่าด่ากันสิแก ฉันพูดเหมือนคนจ่ายภาษี นักการเมืองพูดเหมือนคนใช้ภาษี คนละฝั่ง"
          - text: "{p}จะจดว่าใครสัญญาอะไรไว้ให้"
            heart: 2
            reply: "จดใส่สมุดแบบลุงสมหมายจดเลขเลยนะ ทุกงวด เอ้ย ทุกเดือน แล้วส่งให้ฉันอ่านตอนพักโอที ฉันจะได้มีอะไรให้โกรธนอกจากหัวหน้า"
      - text: "รถแห่เปิดเพลงทั้งวันเลย"
        heart: 0
        reply: "เพลงเดียวกับเลือกตั้งรอบที่แล้ว แค่เปลี่ยนชื่อในเนื้อร้อง ฉันร้องตามได้ทุกคำ น่าเศร้าดีแก"

  - id: nok_r_ball_stays
    topic: react
    once: true
    when: { flag: ball_stays }
    npc: "แก… บอลไม่ขึ้นรถเมล์ ฉันมองจากหน้าต่างรถ เห็นเขายืนหลังเสาเหมือนทุกวันจันทร์ แต่วันนี้เขาโบกมือ เจ็ดปีเขาไม่เคยโบกมือ ฉันร้องไห้จนลุงเชิดต้องจอดซื้อทิชชู่"
    options:
      - text: "พี่บอลเลือกเองนะ ไม่มีใครบังคับ"
        heart: 2
        reply: "ฉันรู้… นั่นแหละที่ทำให้ฉันร้องไห้ เขาเลือกอยู่ ทั้งที่เขามีทางไปแล้ว ฉันไม่เคยกล้าเลือกแบบนั้น"
        next:
          - text: "วันนึงนกก็จะเลือกได้"
            heart: 2
            reply: "ถ้าวันนั้นมาถึง ฉันจะให้บอลยืนหลังเสาอีกรอบ แล้วฉันจะลงจากรถไปหาเขา… แบบในละครป่ะ ป้าแต๋วจะเล่าทั้งตำบลแน่"
          - text: "แล้วสัญญาตอนเด็กล่ะ"
            heart: 1
            reply: "เขารักษาไว้คนเดียวมาตลอด ฉันผิดสัญญาก่อน เขาก็ยังรอ… ฉันติดหนี้เขาเยอะกว่าหนี้เสี่ยเฮงอีกนะแก"
      - text: "นกดีใจหรือเสียใจ"
        heart: 1
        reply: "ดีใจจนเจ็บ เจ็บเพราะคนที่ยังติดอยู่ในโรงงานคือฉัน ไม่ใช่เขา… แต่ดีใจมากกว่า เยอะกว่า"

  - id: nok_r_ball_rayong
    topic: react
    once: true
    when: { flag: ball_to_rayong }
    npc: "บอลขึ้นรถเมล์คันเดียวกับฉันเมื่อเช้า… นั่งเบาะที่สี่ หลังฉันพอดี ทั้งทางไม่พูดสักคำ ถึงอำเภอเขาบอกว่า ‘เดี๋ยวกูซ่อมมอไซค์แกตอนกลับมาเสาร์หน้า’ แล้วก็แยกไปคนละทาง"
    options:
      - text: "พี่บอลจะกลับมาเสาร์อาทิตย์เหมือนนกแล้วนะ"
        heart: 2
        reply: "ใช่… ตอนนี้เราเป็นนกสองตัวที่บินกลับรังวันเสาร์ ฉันไม่รู้ว่าจะดีใจหรือเศร้า เขาเลือกเอง ฉันต้องเคารพ"
        next:
          - text: "{p}จะดูแลอู่กับยายพี่บอลให้"
            heart: 2
            reply: "แกจะทำจริงดิ… บอลบอกฉันว่าแกสัญญาไว้ เขาถึงกล้าไป ขอบใจนะแก ที่ทำให้เพื่อนฉันกล้า"
          - text: "นกเล่าให้พี่บอลฟังเรื่องโรงงานหรือยัง"
            heart: 1
            reply: "เล่าหมดแล้ว มือชา หักเงิน หอพักไม่มีหน้าต่าง เขายังไปอยู่ดี… บางคนต้องไปเห็นเอง ฉันก็เคยเป็น"
      - text: "นกโกรธพี่บอลไหม"
        heart: 0
        reply: "ไม่โกรธ เคยโกรธแล้วตอนฉันเป็นคนไปก่อน ตอนนั้นเขาโกรธฉันสองปี ตอนนี้ฉันเข้าใจแล้วว่ามันรู้สึกยังไง… เจ็บแปลกๆ เหมือนเหยียบเลโก้"

  - id: nok_r_shop
    topic: react
    once: true
    when: { flag: nok_quit_factory }
    npc: "แก! วันนี้ฉันตื่นเจ็ดโมง ไม่มีเสียงหวอ ไม่มีบัตรตอก ไม่มีรถเมล์หกโมง ฉันตำส้มตำไปสามสิบครก มือไม่ชาเลย มือฉันกลับมาเป็นของฉันแล้ว"
    options:
      - text: "ยินดีด้วยนะ นก"
        heart: 2
        reply: "ยินดีด้วยกับแกด้วย ครกแรกฉันตำให้แก แม่ยังไม่ได้กินเลย อย่าบอกแม่… แม่รู้แล้ว แม่ยืนมองอยู่"
        next:
          - text: "ขายดีไหม"
            heart: 1
            reply: "สามสิบครกขาดทุนสิบสองบาท! มะละกอแพง ฉันคิดราคาผิด แต่ฉันหัวเราะทั้งวัน ขาดทุนสิบสองบาทยังมีความสุขกว่ากำไรโอที"
          - text: "ไม่กลัวแล้วเหรอ"
            heart: 2
            reply: "กลัวทุกเช้า แต่กลัวแบบตื่นเต้น ไม่ใช่กลัวแบบห่อเหี่ยว ฉันเพิ่งรู้ว่าความกลัวมีสองแบบ"
      - text: "ลูกค้าคนแรกคือใคร"
        heart: 1
        reply: "ลุงสมหมาย สั่งปูปลาร้าแล้วถามว่าครกนี้เลขที่เท่าไหร่ ฉันบอกครกที่หนึ่ง ลุงจดลงสมุดทันที แล้วจ่ายเกินสิบบาท บอกว่าเป็น ‘ค่าเลข’ ป้าพรยืนกอดอกอยู่ข้างหลัง"

  # ===== news =====
  - id: nok_n_layoff
    topic: news
    npc: "แก โรงงานฉันประกาศ ‘ปรับโครงสร้าง’ อีกแล้ว ปีนี้ไลน์ฉันหายไปสิบคน หัวหน้าบอกว่าคนที่เหลือเป็นครอบครัวเดียวกัน ครอบครัวที่ทำงานแทนสิบคนที่หายไป"
    options:
      - text: "นกจะโดนไหม"
        heart: 1
        reply: "ไม่รู้แก ฉันทำยอดดี แต่ฉันอายุยี่สิบห้าแล้ว เขาชอบเด็กสิบแปดที่มือไวกว่า ฉันกลายเป็นคนแก่ในโรงงานตอนอายุยี่สิบห้า"
        next:
          - text: "ถ้าโดน ก็กลับมาเปิดร้านเลย"
            heart: 2
            reply: "แกพูดเหมือนการโดนไล่ออกเป็นข่าวดี… มันก็อาจเป็นจริงๆ นะ ได้เงินชดเชยด้วย ฉันจะสวดขอให้โดน ไม่ ไม่สวด แค่คิด"
          - text: "ลองหางานใกล้บ้านไว้ไหม"
            heart: 1
            reply: "ใกล้บ้านมีงานอะไรล่ะ เฝ้ารั้วบริษัท ขายของร้าน 24 ชม. แบบตั้ม หรือเปิดร้านเอง… ข้อสุดท้ายน่าสนใจที่สุดแต่น่ากลัวที่สุด"
      - text: "ครอบครัวเดียวกันแต่ไม่ขึ้นเงินเดือน"
        heart: 1
        reply: "ใช่! ครอบครัวแบบที่พ่อแม่กินสเต๊กแล้วลูกกินมาม่า ฉันพูดในไลน์ผลิต หัวหน้าได้ยิน ฉันโดนย้ายไปยืนตรงแอร์ไม่ถึง"

  - id: nok_n_bus
    topic: news
    npc: "ลุงเชิดบอกว่ารถเมล์อาจตัดเที่ยวหกโมงเย็นเพราะคนนั่งน้อย ถ้าตัดจริงฉันต้องลงรถที่อำเภอแล้วนั่งวินเข้ามา ค่าวินแพงกว่าค่ารถเมล์อีก"
    options:
      - text: "ทำไมคนนั่งน้อยล่ะ"
        heart: 1
        reply: "คนหนุ่มสาวไปทำงานไกลหมด ไม่มีใครเข้าออกอำเภอทุกวันแล้ว เหลือแต่ฉันกับคนแก่ไปหาหมอ… ตำบลเรามันค่อยๆ เงียบลงแก ฟังแล้วใจหาย"
        next:
          - text: "ถ้าคนกลับมาเยอะ รถเมล์ก็ไม่ต้องตัด"
            heart: 2
            reply: "แกพูดเหมือนกล้าเลย กล้าพูดแบบนี้ทุกวัน ‘ลองคิดดูนะครับ’ ฉันเคยหัวเราะ ตอนนี้ฉันเริ่มคิดตาม"
          - text: "{p}ไปรับนกที่อำเภอก็ได้"
            heart: 2
            reply: "จริงดิ… แกจะขับไปตั้งยี่สิบกิโลเพื่อรับฉัน… ไม่ต้องหรอก ฉันเกรงใจ… แต่ถ้าแกว่างก็… ไม่ ฉันเกรงใจ… โทรมาก่อนนะ"
      - text: "อบต. ไม่ช่วยอุดหนุนเหรอ"
        heart: 0
        reply: "อบต. มีงบศึกษาความเป็นไปได้ไง เขาจะศึกษาว่ารถเมล์เป็นไปได้ไหม ศึกษาเสร็จรถเมล์คงพังพอดี"

  - id: nok_n_praew
    topic: news
    npc: "แพรวจะไลฟ์ขายผ้าทอยายจันทร์ แล้วให้ฉันเป็นคนพูด เพราะฉันขายของเก่งกว่า เมื่อคืนไลฟ์ได้ยอดยี่สิบผืน แพรวกรี๊ดจนกำนันตื่น"
    options:
      - text: "นกขายเก่งจริงเหรอ"
        heart: 1
        reply: "ฉันขายแบบโรงงาน บอกตรงๆ ว่าผ้าผืนนี้ทอสามเดือน เท่ากับโอทีสี่ร้อยชั่วโมง คนฟังแล้วซื้อเพราะสงสารยายจันทร์ ได้ผลกว่าคำว่า ‘ผ้าสวยมากค่ะ’"
        next:
          - text: "นกเปิดร้านออนไลน์เองได้นะ"
            heart: 2
            reply: "ขายส้มตำออนไลน์เหรอแก ส่งไปถึงชลบุรีปลาร้าคงระเบิดในรถไปรษณีย์… แต่ขายน้ำพริกได้นะ เออ จดไว้ก่อน"
          - text: "แพรวจ่ายนกเท่าไหร่"
            heart: 0
            reply: "จ่ายเป็นหมูกระทะหนึ่งมื้อ ฉันกินไปเท่ากับค่าแรงสองวัน แพรวขาดทุน ฉันกำไร เพื่อนกันต้องแบบนี้"
      - text: "นกกับแพรวสนิทกันมากเลยนะ"
        heart: 1
        reply: "ปีนต้นมะม่วงหลังโรงเรียนด้วยกันจนครูทำโทษคู่ แพรวเป็นลูกกำนัน ฉันเป็นลูกแม่ค้า แต่ตอนห้อยหัวลงจากกิ่งมะม่วง เราหน้าเหมือนกันหมด"

  - id: nok_n_heng
    topic: news
    npc: "เสี่ยเฮงส่งไลน์มาหาแม่ฉัน สติกเกอร์ ‘สวัสดีวันจันทร์’ ดอกไม้สีชมพู แล้วตามด้วย ‘ยอดดอกเดือนนี้นะจ๊ะ’ สวัสดีวันจันทร์ที่มีใบแจ้งหนี้แนบมาด้วย ฉันขนลุก"
    options:
      - text: "เสี่ยเฮงทวงหนี้แบบสุภาพเลยนะ"
        heart: 1
        reply: "สุภาพจนน่ากลัว คนอื่นทวงด้วยเสียงดัง เสี่ยทวงด้วยดอกไม้ เหมือนพวงหรีด"
      - text: "หนี้ยังเหลือเท่าไหร่"
        heart: 1
        reply: "ฉันถามเสี่ยทุกครั้ง เสี่ยบอกตัวเลขไม่เหมือนกันสักครั้ง กดเครื่องคิดเลขแล้วบอกว่า ‘ประมาณนี้นะหนู’ หนี้ฉันมันประมาณ แต่ดอกมันแน่นอน"
        next:
          - text: "ขอใบแจ้งยอดละเอียดดูสิ"
            heart: 2
            reply: "ฉันไม่เคยกล้าขอ… แม่บอกว่าอย่าทำให้เสี่ยโกรธ เสี่ยโกรธแล้วไม่ให้เชื่อปุ๋ย แต่แม่ไม่ได้เชื่อปุ๋ยมาสามปีแล้ว เอ้อ ทำไมฉันยังกลัวอยู่"
          - text: "ไปถามสหกรณ์พี่กล้าดีไหม"
            heart: 1
            reply: "กล้าบอกว่ามีโครงการรีไฟแนนซ์หนี้นอกระบบ แต่ต้องเป็นสมาชิกก่อนหกเดือน ฉันกลับบ้านแค่เสาร์อาทิตย์ จะไปสมัครยังไง… เออ เสาร์เขาเปิดนี่หว่า"
      - text: "สติกเกอร์ดอกไม้สวยดีนะ"
        heart: 0
        reply: "สวยแกเอาไปเลย ฉันจะบล็อกเสี่ยในมือถือแม่ แต่แม่จะปลดบล็อกเพราะกลัวพลาดสวัสดีวันพุธ"

  - id: nok_n_somtum
    topic: news
    when: { time: evening }
    npc: "แก ข่าวด่วน ตลาดนัดมีแผงส้มตำมาใหม่ ใส่ผงชูรสเหมือนใส่ทราย คนต่อคิวยาวเลย ฉันไปชิมแล้ว อร่อย… อร่อยกว่าของฉัน ฉันเจ็บใจมาก"
    options:
      - text: "ของนกมีเสน่ห์คนละแบบ"
        heart: 2
        reply: "เสน่ห์อะไรแก เสน่ห์ขาดทุนเหรอ… ล้อเล่น ฉันชอบคำนี้ ‘เสน่ห์คนละแบบ’ จดไว้ใช้ตอนเปิดร้าน ป้ายร้านเขียนว่า ‘อร่อยน้อยกว่าแต่มีเสน่ห์’"
      - text: "ไปถามสูตรเขาสิ"
        heart: 1
        reply: "ถามแล้ว เขาบอกว่าสูตรลับ ฉันเลยยืนดูเขาตำสิบครก จำได้หมด ผงชูรสสองช้อน น้ำตาลปี๊บช้อนครึ่ง… ฉันจะไม่ใส่ผงชูรสเยอะขนาดนั้นหรอก แต่จะลองลดมะนาว"
        next:
          - text: "นกจำสูตรเหมือนจำขั้นตอนในโรงงานเลย"
            heart: 1
            reply: "เจ็ดปีในไลน์ผลิตไม่ได้เสียเปล่านะแก ทุกอย่างคือขั้นตอน ส้มตำก็คือขั้นตอน แค่ขั้นตอนนี้ฉันชิมได้"
          - text: "แบบนี้เรียกว่าขโมยสูตรนะ"
            heart: 0
            reply: "เรียกว่าวิจัยตลาดจ้า ภาษาโรงงานเรียกว่า benchmark หัวหน้าสอนฉันมา ฉันเอามาใช้ครั้งแรกในชีวิต"

  - id: nok_n_brother
    topic: news
    when: { heart_min: 3 }
    npc: "น้องชายฉันส่งรูปฝึกงานมา ใส่เสื้อเชิ้ตผูกไท ทำงานบริษัทในเมือง หน้าเหมือนพ่อตอนหนุ่ม ฉันดูรูปแล้วร้องไห้ในห้องน้ำโรงงาน"
    options:
      - text: "นกส่งน้องเรียนจนจบเลยนะ"
        heart: 2
        reply: "อีกเทอมเดียว… เจ็ดปีที่ฉันตอกบัตร มีผลลัพธ์อยู่ในรูปนี้รูปเดียว ฉันดูแล้วคุ้ม แต่มือฉันชาตอนถือมือถือดู ตลกดีป่ะ"
        next:
          - text: "น้องรู้ไหมว่านกเหนื่อยแค่ไหน"
            heart: 1
            reply: "ไม่รู้ และฉันไม่อยากให้รู้ ฉันอยากให้เขาคิดว่าพี่สาวเขาเป็นซุปเปอร์ฮีโร่ ไม่ใช่สาวโรงงานที่ร้องไห้ในห้องน้ำ"
          - text: "พอน้องจบ นกจะได้กลับบ้านแล้ว"
            heart: 2
            reply: "ถ้ากล้าพอนะแก… เมื่อก่อนฉันโทษหนี้ โทษน้อง ตอนนี้ไม่มีอะไรให้โทษแล้ว เหลือแค่ฉันกับความกล้า น่ากลัวกว่าเดิมอีก"
      - text: "เสื้อเชิ้ตใครซื้อให้"
        heart: 1
        reply: "ฉันซื้อเอง สามตัว ตัวละสี่ร้อย เท่ากับโอทีแปดชั่วโมง แต่ใส่แล้วหล่อกว่าโอทีแปดชั่วโมงเยอะ"

  # ===== advice =====
  - id: nok_a_meals
    topic: advice
    npc: "แก กินข้าวเช้ายัง อย่ากินกาแฟซองแทนข้าวนะ ฉันทำมาสองปี ได้โรคกระเพาะเป็นโบนัสประจำปี ยาลดกรดกินเหมือนลูกอม"
    options:
      - text: "กินแล้ว ข้าวต้มที่บ้าน"
        heart: 1
        reply: "ดี! ข้าวต้มคือของขวัญจากจักรวาล ที่หอฉันมีแต่มาม่าต้มกับไข่ ไข่ใส่ก่อนน้ำเดือดด้วย เละทุกรอบ"
      - text: "ยังเลย ยุ่งอยู่"
        heart: 1
        reply: "ยุ่งแค่ไหนก็กินได้แก ฉันยุ่งกว่าแกยังกินข้าวเหนียวหมูปิ้งระหว่างเดินไปตอกบัตร… อ่ะ เอาข้าวเหนียวไปครึ่งนึง กินเลย ต่อหน้าฉัน"
        next:
          - text: "ขอบใจนะนก"
            heart: 2
            reply: "ไม่ต้องขอบใจ กินให้หมด ฉันจะยืนดู เหมือนแม่ฉันยืนดูฉันกินตอนเด็ก ฉันเพิ่งเข้าใจว่าทำไมแม่ชอบยืนดู"
          - text: "นกห่วง{p}ขนาดนี้เลยเหรอ"
            heart: 1
            reply: "ห่วงคนที่ทำงานหนักทุกคนแหละ… แกด้วย มากกว่าคนอื่นนิดนึง อย่าถามว่าทำไม กินไป"
      - text: "นกก็ต้องกินให้ครบนะ"
        heart: 2
        reply: "ฉันรู้แต่ฉันไม่ทำ… แกเตือนฉันกลับแบบนี้ ฉันจะพยายาม ส่งรูปข้าวให้แกดูทุกมื้อเลยดีไหม แกจะได้เบื่อ"

  - id: nok_a_payday
    topic: advice
    npc: "ถ้าแกจ้างคนมาช่วยงาน จ่ายเงินตรงวันนะแก วันเดียวที่ช้า คนเขาวางแผนชีวิตไว้หมดแล้ว ค่าไฟ ค่าเทอม ค่านม ฉันเคยโดนบริษัทเลื่อนจ่ายสามวัน ฉันกินมาม่าซองเดียวแบ่งสองมื้อ"
    options:
      - text: "{p}จะจ่ายตรงเวลา สัญญา"
        heart: 2
        reply: "ดี คนจะรักแก คนจะกลับมาช่วยแก แล้วแกจะไม่ต้องจ้างคนแปลกหน้า… เหมือนที่ยายแกทำ ยายแกจ่ายค่าจ้างแม่ฉันก่อนเย็นทุกครั้ง"
        next:
          - text: "แม่นกเคยทำงานให้ยายเหรอ"
            heart: 2
            reply: "ช่วยเก็บมะม่วงหน้าสวนยายทุกปี ยายจ่ายสองร้อยแถมมะม่วงอีกถุง ปีที่ฉันเข้า ม.1 ยายจ่ายสามร้อย บอกว่าปีนี้มะม่วงดก ปีนั้นมะม่วงไม่ดกเลยนะแก"
          - text: "ถ้าเงินไม่พอจ่ายล่ะ"
            heart: 1
            reply: "บอกเขาตรงๆ ก่อนวันจ่าย อย่าให้เขามารู้ตอนยื่นมือ คนจนรับข่าวร้ายได้ แต่รับความหวังที่หลุดมือไม่ได้"
      - text: "ช้าวันเดียวไม่เป็นไรมั้ง"
        heart: -1
        reply: "สำหรับคนจ่ายไม่เป็นไรแก สำหรับคนรอมันเป็นสามมื้อ ฉันพูดจากประสบการณ์ ไม่ได้ว่าแกนะ"

  - id: nok_a_back
    topic: advice
    when: { time: noon }
    npc: "แกยกของหนักแล้วหลังงอแบบนั้นเดี๋ยวหลังพังนะ ย่อเข่าแล้วยก ใช้ขา อย่าใช้หลัง ที่โรงงานมีป้ายติดทุกเสา ไม่มีใครทำ ฉันทำคนเดียวเลยยังยืนตรงได้"
    options:
      - text: "ลองแล้ว ง่ายกว่าเดิมจริง"
        heart: 2
        reply: "เห็นป่ะ! ฉันเป็นครูได้นะเนี่ย ครูนกสอนวิธียกกระสอบ ค่าเรียนเป็นส้มตำ"
      - text: "นกไม่ปวดหลังเลยเหรอ"
        heart: 1
        reply: "ปวดสิ ปวดคอกับมือ งานฉันไม่ได้ยกของ งานฉันกดชิ้นส่วนเล็กๆ วันละหมื่นครั้ง ของเล็กกว่ากระสอบแต่เจ็บกว่า"
        next:
          - text: "หมื่นครั้งเลยเหรอ"
            heart: 1
            reply: "นับแล้ว เคยนับตอนเบื่อ หมื่นสองพันสี่ร้อย ฉันว่าลุงสมหมายคงอยากรู้เลขนี้ ฉันไม่บอกหรอก"
          - text: "นกไปให้หมอดูหรือยัง"
            heart: 1
            reply: "ไปแล้ว… อย่าเพิ่งถาม ไว้ฉันพร้อมเล่า ฉันบอกแกคนแรกแน่"
      - text: "ไม่เป็นไร {p}ยังหนุ่มยังสาว"
        heart: 0
        reply: "ฉันก็พูดแบบนี้ตอนสิบแปด ตอนนี้ยี่สิบห้าลุกจากเตียงมีเสียงกร๊อบ ยังหนุ่มยังสาวมันมีวันหมดอายุนะแก"

  - id: nok_a_money
    topic: advice
    npc: "แกส่งเงินให้พ่อแม่ไหม ส่งดีนะ แต่เก็บของตัวเองไว้ด้วย อย่าส่งหมดแบบฉัน ฉันส่งหมดจนวันที่ป่วย ไม่มีเงินไปหาหมอ ต้องยืมเพื่อนในไลน์ผลิต"
    options:
      - text: "นกเก็บเงินเปิดร้านไว้ใช่ไหม"
        heart: 1
        reply: "กระปุกควายใต้เตียงบ้านแม่… แกรู้ได้ไง ฉันบอกแกเหรอ เออ ฉันบอกแก ฉันบอกแกหลายอย่างเกินไปแล้ว"
        next:
          - text: "{p}เก็บความลับเก่งนะ"
            heart: 2
            reply: "ฉันรู้ ถึงได้บอก… แกเป็นกระปุกควายของฉัน ใส่ความลับไปเรื่อยๆ ไม่มีใครเปิดได้ ขอโทษที่เปรียบเป็นควายนะ ควายของฉันน่ารักนะ"
          - text: "เก็บได้เท่าไหร่แล้ว"
            heart: 1
            reply: "สามหมื่นแปด… พอค่าเพิงกับครกกับเดือนแรก ไม่พอเดือนที่สอง ฉันเลยไม่กล้าเปิด เดือนที่สองมันน่ากลัวที่สุด"
      - text: "พ่อแม่{p}ไม่ได้ต้องการเงินขนาดนั้น"
        heart: 1
        reply: "ดีจังแก… ไม่ใช่ประชดนะ ดีจริงๆ ดีที่มีคนในตำบลนี้ไม่ต้องส่งเงินกลับบ้าน แกเก็บเวลาไว้ให้ตัวเองได้"

  - id: nok_a_bus
    topic: advice
    when: { time: evening }
    npc: "แก ถ้าวันไหนแกต้องไปกรุงเทพฯ ขึ้นรถเมล์ลุงเชิดเที่ยวหกโมงเช้านะ นั่งเบาะที่สามหลังคนขับ ลมเข้าพอดี แดดไม่ส่อง แล้วลุงเชิดจะเล่าข่าวให้ฟังทั้งทาง"
    options:
      - text: "เบาะนั้นของนกไม่ใช่เหรอ"
        heart: 1
        reply: "ของฉันวันจันทร์ วันอื่นของแก แบ่งกัน… ถ้าวันไหนแกนั่งวันจันทร์ ก็นั่งข้างฉันละกัน เบาะมันนั่งได้สองคน"
        next:
          - text: "วันจันทร์หน้า{p}ไปส่งที่ป้ายนะ"
            heart: 2
            reply: "จริงดิ… ตีห้าครึ่งนะแก ไม่ใช่หกโมง ลุงเชิดไม่รอใคร ถ้าแกมาสาย ฉันจะโบกมือให้แกจากหน้าต่าง ไม่ใช่จากป้าย"
          - text: "ไว้ไปพร้อมกันสักวัน"
            heart: 1
            reply: "ไปไหนล่ะแก ฉันไปโรงงาน แกไปไหน… ไปส่งฉันถึงอำเภอแล้วนั่งกลับมาก็ได้ ฉันพูดเล่น… ครึ่งนึง"
      - text: "{p}ไม่อยากกลับไปกรุงเทพฯ แล้ว"
        heart: 1
        reply: "ดีแล้วแก อย่ากลับ ถ้าแกกลับ ฉันจะไม่มีใครให้คิดว่า ‘มีคนทำได้จริงๆ นะ’"

  # ===== smalltalk =====
  - id: nok_s_karaoke
    topic: smalltalk
    npc: "เมื่อคืนฉันร้องคาราโอเกะร้านป้าแต๋วอีกแล้ว เพลงลูกทุ่งคิดถึงบ้าน ร้องทั้งที่อยู่บ้าน ป้าแต๋วบอกว่าร้องเพราะขึ้นนิดนึง จากเครื่องตอกบัตรเป็นเครื่องปั๊มน้ำ"
    options:
      - text: "ร้องให้ฟังหน่อยสิ"
        heart: 2
        reply: "ไม่ร้อง! ร้องแล้วแกจะหนี… ก็ได้ ท่อนเดียว ‘คิดถึงบ้านนา…’ พอ แกหน้าแดงทำไม ฉันร้องไม่ดีขนาดนั้นเลยเหรอ"
        next:
          - text: "เพราะดีนะ ไม่ได้ล้อ"
            heart: 2
            reply: "แกพูดจริงดิ… ที่โรงงานไม่มีใครชมฉันเลยนอกจากตอนยอดผลิตเกิน ชมเสียงร้องครั้งแรกในรอบเจ็ดปี ฉันจะจำไว้นะ"
          - text: "เหมือนเครื่องปั๊มน้ำจริงด้วย"
            heart: 0
            reply: "ไอ้นี่! ป้าแต๋วพูดฉันยังพอทน แกพูดนี่เจ็บนะ… ล้อเล่น เครื่องปั๊มน้ำช่วงนี้หายากนะแก ฉันถือว่าชม"
      - text: "ร้องเพลงคิดถึงบ้านตอนอยู่บ้านเนี่ยนะ"
        heart: 1
        reply: "ก็คิดถึงล่วงหน้าไง พรุ่งนี้ต้องไปแล้ว ฉันคิดถึงบ้านตั้งแต่วันเสาร์บ่าย ทุกอาทิตย์"

  - id: nok_s_shopname
    topic: smalltalk
    npc: "แกช่วยคิดชื่อร้านส้มตำหน่อย ฉันมีสามชื่อ ‘ส้มตำนกน้อยกลับรัง’ ‘ตำแหลกโอทีศูนย์’ ‘ครกเดียวในตำบล’ แกเลือกเลย"
    options:
      - text: "นกน้อยกลับรัง อบอุ่นดี"
        heart: 2
        reply: "แม่ก็เลือกอันนี้ แม่บอกว่าเชยแต่น่ารัก เหมือนฉัน… ไม่ แม่บอกว่าเชย ฉันเติมคำว่าน่ารักเอง"
      - text: "ตำแหลกโอทีศูนย์ ขำดี"
        heart: 1
        reply: "ใช่ป่ะ! คนโรงงานเห็นต้องหัวเราะ แต่คนในตำบลไม่รู้จักโอที เขาจะนึกว่าโอทีเป็นชื่อปลาร้า"
        next:
          - text: "ปลาร้ายี่ห้อโอที ฟังดูแพง"
            heart: 1
            reply: "ฮ่าๆๆ ปลาร้าโอที ทำเพิ่มชั่วโมงละห้าสิบบาท ฉันจะเอาไปเป็นเมนูพิเศษ"
          - text: "ใช้ทั้งสามชื่อเลย ป้ายใหญ่ๆ"
            heart: 1
            reply: "ป้ายใหญ่เท่าป้ายหาเสียงเลยดิ แต่หน้าฉันไม่ยิ้มนะ ฉันจะถือครกแทน"
      - text: "ครกเดียวในตำบล แต่ตลาดนัดมีเจ้าใหม่แล้วนะ"
        heart: 0
        reply: "นั่นแหละที่เศร้า… ‘ครกที่สองในตำบล’ ก็ได้ ซื่อสัตย์ดี"

  - id: nok_s_frog
    topic: smalltalk
    when: { rain: true }
    npc: "ฝนตกแล้วแก กบร้องเต็มทุ่ง ฉันจะอัดเสียงไว้ฟังที่หอ บางคืนฉันนอนไม่หลับ ฟังเสียงกบแล้วหลับเลย เพื่อนร่วมห้องนึกว่าฉันบ้า"
    options:
      - text: "{p}อัดเพิ่มส่งไปให้ตอนนกอยู่หอก็ได้"
        heart: 2
        reply: "แกจะอัดเสียงกบส่งให้ฉันจริงดิ… นี่มันของขวัญที่ประหลาดที่สุดแต่ดีที่สุดในชีวิตฉันเลยนะ ส่งมาทุกคืนที่ฝนตกนะแก"
        next:
          - text: "ได้ ทุกคืนที่ฝนตก"
            heart: 2
            reply: "สัญญานะ… ฉันจะตั้งชื่อไฟล์ว่า ‘บ้าน’ แล้วกดฟังวนทั้งคืน เพื่อนจะได้รู้ว่าฉันบ้าจริงๆ"
          - text: "อัดเสียงควายด้วยไหม"
            heart: 1
            reply: "ควายตาเผือกเหรอ ไม่เอา ควายร้องตอนตีห้าเหมือนเสียงหวอโรงงาน ฉันจะตกใจตื่นไปตอกบัตร"
      - text: "เสียงกบนอนหลับได้จริงเหรอ"
        heart: 1
        reply: "ได้สิ มันเป็นเสียงที่ไม่มีใครต้องการอะไรจากเรา เสียงหัวหน้า เสียงเครื่องจักร เสียงแจ้งเตือน ทุกเสียงอยากได้อะไรจากฉันหมด มีแต่กบที่ร้องเฉยๆ"

  - id: nok_s_mango
    topic: smalltalk
    npc: "ต้นมะม่วงหลังโรงเรียนยังอยู่ป่ะแก ต้นที่ฉันกับแพรวปีนจนโดนทำโทษ บอลก็ปีนนะ แต่บอลปีนไม่ขึ้น เลยยืนข้างล่างรับมะม่วงที่เราโยนลงมา"
    options:
      - text: "ยังอยู่ ลูกดกด้วย"
        heart: 1
        reply: "จริงดิ! เสาร์นี้ไปปีนกันป่ะ… ไม่ปีน ฉันยี่สิบห้าแล้ว ฉันยืนรับเหมือนบอลก็ได้ ให้แกปีน"
        next:
          - text: "ได้ {p}ปีนเอง"
            heart: 2
            reply: "ตกลง แต่ห้ามตกนะ ฉันไม่อยากใช้วันหยุดนั่งเฝ้าแกที่ รพ.สต. ทั้งวัน… จริงๆ ก็ได้นะ แต่ไม่อยาก"
          - text: "ชวนพี่บอลไปยืนรับด้วย"
            heart: 1
            reply: "บอลจะบอกว่ากิ่งนั้นรับน้ำหนักได้สามสิบโล แล้วยืนคำนวณจนมะม่วงตกใส่หัว เป็นแบบนี้ตั้งแต่เด็ก"
      - text: "พี่บอลปีนไม่ขึ้นเหรอ"
        heart: 1
        reply: "ปีนขึ้นครั้งนึง แล้วลงไม่ได้ นั่งบนกิ่งจนมืด ฉันกับแพรวต้องวิ่งไปตามพ่อเขามา พ่อเขาเอาบันไดมาพาดแล้วหัวเราะทั้งทาง บอลไม่ปีนต้นไม้อีกเลยจนทุกวันนี้"

  - id: nok_s_homeday
    topic: smalltalk
    when: { time: morning }
    npc: "เช้าวันเสาร์มันหอมนะแก หอมข้าวต้มแม่ หอมควันไฟหลังบ้าน หอมดินเปียก วันจันทร์ที่หอมีแต่กลิ่นน้ำยาถูพื้น"
    options:
      - text: "งั้นนกต้องหายใจลึกๆ เก็บไว้"
        heart: 2
        reply: "ฉันทำทุกเช้าวันเสาร์เลยแก หายใจจนแม่ถามว่าเป็นหอบหรือเปล่า ฉันบอกว่าเก็บแบตอยู่"
      - text: "ไปตลาดเช้าด้วยกันไหม"
        heart: 2
        reply: "ไป! ปาท่องโก๋น้ำเต้าหู้หน้าวัด ฉันเลี้ยง แกจ่ายค่าแรงด้วยการฟังฉันบ่นเรื่องหัวหน้าไลน์สิบห้านาที ยุติธรรมป่ะ"
        next:
          - text: "ยุติธรรม บ่นได้เลย"
            heart: 2
            reply: "แกนี่ตามใจฉันเกินไปนะ… หัวหน้าไลน์ฉันชื่อเดียวกับควายตาเผือก ฉันเริ่มบ่นจากตรงนั้นทุกครั้ง หัวเราะก่อนแล้วค่อยโกรธ"
          - text: "ฟังได้ห้านาทีพอ"
            heart: 1
            reply: "ห้านาทีก็ได้ ฉันพูดเร็ว ห้านาทีของฉันเท่ากับสิบห้านาทีของแก"
      - text: "หอมดินเปียกก็คือกลิ่นปุ๋ยคอกนะ"
        heart: 0
        reply: "แกทำลายบรรยากาศ… แต่ก็จริง ปุ๋ยคอกก็ยังหอมกว่าน้ำยาถูพื้น ฉันยืนยัน"

  - id: nok_s_scooter
    topic: smalltalk
    npc: "มอไซค์ฉันจอดทิ้งไว้ทั้งอาทิตย์ ทุกวันเสาร์ต้องเข็นไปให้บอลสูบลม บอลบ่นเหมือนพ่อ ‘แกจอดยังไงยางถึงแบนสองล้อพร้อมกัน’ ฉันบอกว่ามันคิดถึงฉัน"
    options:
      - text: "พี่บอลห่วงนกนะ"
        heart: 1
        reply: "ห่วงยาง ไม่ได้ห่วงฉัน… ก็ห่วงฉันด้วยแหละ เขาไม่พูดหรอก แต่เขาเปลี่ยนน้ำมันเครื่องให้ทุกเดือนทั้งที่ฉันไม่ได้ขี่"
        next:
          - text: "แบบนี้เรียกว่าห่วงแบบช่าง"
            heart: 1
            reply: "ห่วงแบบช่าง! ฉันจะไปบอกบอล เขาจะหน้าแดงแล้วบอกว่า ‘น้ำมันเครื่องมันเสื่อมตามเวลา ไม่เกี่ยวกับคนขี่’"
          - text: "นกห่วงพี่บอลด้วยใช่ไหม"
            heart: 1
            reply: "เพื่อนตั้งแต่จำความได้แก ห่วงอยู่แล้ว ห่วงแบบที่ไม่ต้องตั้งชื่อ… แกถามแบบนี้ทำไม แกคิดอะไร"
      - text: "นกขี่ไม่บ่อยก็ขายไปสิ"
        heart: 0
        reply: "ขายแล้วฉันจะมีอะไรรอฉันวันเสาร์ล่ะแก… มอไซค์คันนี้กับบ่อแม่ เป็นสองอย่างที่รอฉันทุกอาทิตย์ บ่อแห้งไปแล้วอันนึง"

  # ===== self =====
  - id: nok_f_ot
    topic: self
    npc: "รู้ป่ะแก ทำไมฉันนับทุกอย่างเป็นโอที เพราะฉันรู้ว่าชั่วโมงนึงของฉันแลกได้เท่าไหร่ ของทุกอย่างในโลกเลยมีราคาเป็นชีวิตฉัน ข้าวเหนียวหมูปิ้งเท่ากับยี่สิบนาทีของชีวิตฉัน"
    options:
      - text: "งั้นเวลาที่นกคุยกับ{p}ล่ะ ราคาเท่าไหร่"
        heart: 2
        reply: "…แกถามแบบนี้ได้ไง ฉันไม่เคยคิด เวลาที่คุยกับแกไม่มีใครจ่ายฉันเลยนะ แต่ฉันไม่รู้สึกว่าขาดทุน… แปลก ฉันต้องไปคิดก่อน"
        next:
          - text: "แปลว่ามันไม่มีราคาไง"
            heart: 2
            reply: "ไม่มีราคา… ฉันจะไม่นับเป็นโอทีอีกแล้วแก บางอย่างฉันจะเก็บไว้ไม่นับ เริ่มจากตรงนี้"
          - text: "ไม่ต้องคิดก็ได้"
            heart: 1
