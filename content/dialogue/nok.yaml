            heart: 1
            reply: "จับขาตั้งก็ได้ บอลบอกว่าสายมันหลวม ฉันว่ามันหลวมเพราะมันเหนื่อยประกาศเรื่องแย่ๆ มายี่สิบปี"
          - text: "พูดแบบนี้ระวังโดนหาว่าหัวรุนแรงนะ"
            heart: 0
            reply: "หัวรุนแรงอะไรแก ฉันแค่อยากได้ค่าแรงพอซื้อน้ำใช้ คนที่อยากได้น้ำใช้ไม่ใช่หัวรุนแรง เป็นคนกระหายน้ำ"
      - text: "ผู้ใหญ่ประกาศสามรอบทุกเรื่องเลยเหรอ"
        heart: 1
        reply: "ทุกเรื่องแก ตอนฉันสอบติดทุน ผู้ใหญ่ประกาศสามรอบ ตอนฉันไม่ไปเรียน ไม่มีใครประกาศ… ไม่เป็นไร ผ่านมาแล้ว"

quests:
  - id: nok_q1
    npc: nok
    title: "ส้มตำจานทดลอง"
    desc: "นกฝึกตำส้มตำทุกวันหยุด อยากได้พริกสวนยายเพียรกับคนชิมที่พูดตรง"
    start: { heart_min: 1, day_min: 6 }
    offer:
      npc: "แก ฉันขอพริกในแปลงยายแกหน่อยได้ป่ะ พริกตลาดมันเผ็ดแบบโรงงาน พริกสวนยายเพียรมันเผ็ดแบบมีความหลัง แล้วแกต้องมาชิมด้วย ห้ามโกหก"
      options:
        - text: "ได้ เดี๋ยวเอาไปให้ แล้วจะชิมแบบไม่เกรงใจ"
          accept: true
          heart: 2
          reply: "นั่นแหละที่ฉันต้องการ! แม่บอกอร่อยทุกครั้ง พ่อบอกเผ็ดทุกครั้ง ฉันไม่ได้ข้อมูลอะไรเลย เหมือนแบบสอบถามพนักงานโรงงาน"
        - text: "พริกเผ็ดแบบมีความหลังคืออะไร"
          accept: true
          heart: 1
          reply: "คือเผ็ดแล้วนึกถึงบ้าน แกลองกินพริกตลาดกับพริกสวนเทียบกัน จะรู้เลย… เอามาห้าเม็ดพอนะแก ไม่ต้องเยอะ"
        - text: "พริกยังไม่ค่อยออกเลย"
          heart: 0
          reply: "ไม่เป็นไร ไว้มีแล้วค่อยเอามา ฉันกลับมาทุกเสาร์อยู่แล้ว ฉันรอเก่ง รอวันเสาร์มาเจ็ดปี"
    steps:
      - goal: { type: give, npc: nok, item: chili, n: 5 }
        hint: "เก็บพริกจากแปลงผัก 5 เม็ด เอาไปให้นก (นกกลับบ้านวันที่ 6–7 ของสัปดาห์)"
        done:
          npc: "ห้าเม็ดพอดี! ฉันจะตำสองสูตร สูตรโรงงานกับสูตรแม่ เย็นนี้มาที่บ้านฉันนะ ชิมทั้งสองครก แล้วบอกว่าอันไหนดีกว่า ห้ามบอกว่าดีทั้งคู่"
          options:
            - text: "เย็นนี้ไปแน่"
              heart: 1
              reply: "ห้าโมงนะแก ก่อนหอกระจายข่าว ฉันอยากให้แกชิมตอนยังหิว คนหิวชิมแม่นกว่า"
            - text: "สูตรโรงงานคืออะไร"
              heart: 1
              reply: "ตำเร็ว ใส่ทุกอย่างตามสัดส่วนเป๊ะ ไม่ชิม ไม่ปรับ เหมือนงานฉัน… สูตรแม่คือชิมทุกขั้น ปรับไปเรื่อยๆ ช้ากว่าสามเท่า"
      - goal: { type: visit, place: nok_house, from: "17:00", to: "19:00" }
        hint: "ตอนเย็นไปบ้านนก ชิมส้มตำสองครก"
        done:
          npc: "ครกซ้ายสูตรโรงงาน ครกขวาสูตรแม่… ชิมเลยแก ตอบตรงๆ นะ อันไหนดีกว่า แล้วขาดอะไร"
          options:
            - text: "ครกขวา แต่เค็มไปนิด ลดปลาร้าลงหน่อย"
              heart: 2
              set_flag: nok_q1_honest
              reply: "นี่แหละ! ฉันจดเลย ลดปลาร้าครึ่งช้อน… แม่ยืนฟังอยู่ข้างหลัง แม่บอกว่าแม่บอกแบบนี้มาสามปีแล้ว ฉันไม่เคยฟังแม่ ฟังแกครั้งเดียวฉันจด"
            - text: "อร่อยทั้งคู่เลย"
              heart: 0
              set_flag: nok_q1_nice
              reply: "แกผิดกฎ! ฉันบอกแล้วห้ามตอบแบบนี้… ช่างเถอะ หน้าแกตอนกินครกขวามันบอกฉันแล้ว ปากแกโกหก หน้าแกไม่โกหก"
            - text: "ครกซ้าย เร็วและเป๊ะ เหมาะขายเยอะๆ"
              heart: 1
              set_flag: nok_q1_factory
              reply: "จริงดิ… แกพูดเหมือนนักธุรกิจ ครกซ้ายขายได้วันละร้อยครก ครกขวาขายได้วันละสามสิบ แต่ครกขวาคนกลับมากินซ้ำ ฉันจะคิดดู ขอบใจที่ตอบไม่เหมือนคนอื่น"
    reward: { heart: 2, items: { somtum_poo_plara: 1 }, set_flag: nok_q1_done, line: { from: nok, text: "วันนี้มีคนชิมส้มตำฉันแล้วพูดตรงๆ ครั้งแรก 😤 ใครอยากเป็นหนูทดลองคนต่อไป เสาร์หน้ามาที่บ้านนะ ฟรี แต่ต้องพูดความจริง" } }

  - id: nok_q2
    npc: nok
    title: "ดอกเบี้ยโตไวกว่าคน"
    desc: "นกขอให้ไปเป็นเพื่อนตอนไปขอดูยอดหนี้จริงที่ร้านเสี่ยเฮง"
    start: { flag: nok_q1_done, heart_min: 3, day_min: 10 }
    offer:
      npc: "แก ฉันจะไปขอดูยอดหนี้แม่ที่ร้านเสี่ยเฮง เจ็ดปีแล้วไม่เคยเห็นตัวเลขจริงสักครั้ง ไปด้วยกันป่ะ ฉันกลัวว่าพอเห็นหน้าเสี่ยแล้วฉันจะยิ้มแล้วกลับบ้านเหมือนทุกครั้ง"
      options:
        - text: "ไปด้วย {p}จะยืนข้างๆ ไม่ให้นกยิ้ม"
          accept: true
          heart: 2
          reply: "ดีมาก ถ้าฉันเริ่มยิ้ม แกเหยียบเท้าฉันเลย เหยียบแรงๆ ฉันใส่รองเท้าผ้าใบมา"
        - text: "เอาสมุดจ่ายเงินของแม่ไปด้วยนะ"
          accept: true
          heart: 1
          reply: "มีแต่สลิปโอนในมือถือฉัน เจ็ดปีแปดสิบสี่สลิป ฉันไม่เคยลบสักใบ ฉันเก็บไว้เพราะไม่รู้ว่าจะเก็บไว้ทำไม… ตอนนี้รู้แล้ว"
        - text: "เรื่องหนี้ในครอบครัว {p}ไม่อยากยุ่ง"
          heart: 0
          reply: "เข้าใจแก… ไม่เป็นไร ฉันไปคนเดียวก็ได้ หรือไม่ไปก็ได้ ฉันไม่ไปมาเจ็ดปีแล้ว อีกปีนึงก็ไม่เป็นไร"
    steps:
      - goal: { type: talk, npc: heng }
        hint: "ไปร้านปุ๋ยเสี่ยเฮงกับนก ขอดูยอดหนี้ของแม่นก"
        done:
          npc: "อ้าว หนูนก มากับน้อง{player}ด้วย ยอดเหรอ… เฮียกดให้ดูนะน้อง ต้นสามหมื่น ดอกค้างสองหมื่นสอง ค่าธรรมเนียมจดบัญชีอีกสามพัน ค่าทวงถามสองพัน ฮ่าๆ เฮียไม่ได้ทวงด้วยเสียงนะ เฮียทวงด้วยสติกเกอร์ สติกเกอร์ก็มีต้นทุน"
          options:
            - text: "ขอเป็นใบแจ้งยอดลายลักษณ์อักษรได้ไหม{kq}เสี่ย"
              heart: 2
              set_flag: nok_q2_statement
              reply: "เสี่ยหยุดกดเครื่องคิดเลขไปสามวินาที แล้วยิ้มกว้างขึ้น ‘ได้สิน้อง เดี๋ยวเฮียพิมพ์ให้… ค่าพิมพ์ฟรี’ นกเหยียบเท้าตัวเองก่อนจะยิ้ม"
            - text: "ค่าทวงถามด้วยสติกเกอร์เนี่ยนะ"
              heart: 1
              reply: "‘สติกเกอร์เฮียซื้อมาชุดละสามสิบเก้าบาทนะน้อง ใช้กับลูกหนี้ร้อยคน ก็ต้องเฉลี่ย’ เสี่ยพูดหน้าตาเฉย นกหันมามองแล้วกระซิบ ‘ฉันจ่ายค่าสติกเกอร์สวัสดีวันจันทร์มาเจ็ดปี’"
      - goal: { type: talk, npc: kla }
        hint: "เอาตัวเลขไปปรึกษากล้าที่สวนผักสหกรณ์ เรื่องย้ายหนี้มาสหกรณ์"
        done:
          npc: "ลองคิดดูนะครับ ต้นสามหมื่น ถ้าย้ายมาสหกรณ์ ดอกปีละหกเปอร์เซ็นต์ ผ่อนสามปีจบ ค่าธรรมเนียมจดบัญชีศูนย์ ค่าสติกเกอร์ก็ศูนย์ครับ… แต่ต้องมีคนค้ำ และนกต้องเป็นสมาชิก… ขอโทษครับ ผมเทศน์อีกแล้ว นกจะเลือกทางไหนครับ"
          options:
            - text: "ย้ายมาสหกรณ์ {p}ช่วยค้ำให้"
              heart: 2
              set_flag: nok_debt_coop
              reply: "นกหันมามองนานมาก ‘แกค้ำให้ฉันจริงดิ… ฉันจะไม่ทำให้แกต้องจ่ายแทนสักบาท ฉันสาบาน’ กล้ายิ้มแล้วหยิบใบสมัครออกมา นกมือสั่นตอนเซ็น ไม่ใช่เพราะพังผืด"
            - text: "เอาเงินกระปุกควายจ่ายต้นให้จบไปเลย"
              heart: 1
              set_flag: nok_debt_savings
              reply: "นกเงียบไปนาน ‘เงินเปิดร้าน… ถ้าจ่าย หนี้หมด แต่ร้านต้องรออีกสองปี’ แล้วก็พยักหน้า ‘หนี้หมดก่อนดีกว่า ฉันจะได้ฝันแบบไม่มีดอกเบี้ยตามหลัง’"
            - text: "ให้นกกับแม่ตัดสินใจกันเองดีกว่า"
              heart: 1
              reply: "นกพยักหน้า ‘ใช่ หนี้แม่ แม่ต้องรู้ด้วย ฉันจะตัดสินแทนแม่ไม่ได้แล้ว’ กล้ายื่นใบสมัครให้เก็บไว้ก่อน ‘ไม่รีบครับ สหกรณ์ไม่มีดอกเบี้ยระหว่างคิด’"
    reward: { heart: 2, items: { iced_coffee: 1 }, set_flag: nok_q2_done, line: { from: nok, text: "วันนี้ฉันเห็นตัวเลขหนี้จริงครั้งแรกในเจ็ดปี 📄 ใครเป็นหนี้นอกระบบ ขอใบแจ้งยอดนะ ขอได้จริง ฉันเพิ่งรู้" } }

  - id: nok_q3
    npc: nok
    title: "สัญญาใต้ต้นมะม่วง"
    desc: "นกรู้ว่าบอลกรอกใบสมัครไประยองแล้ว อยากให้ช่วยพาไปคุยกันสามคน"
    start: { flag: nok_q2_done, heart_min: 4, day_min: 13 }
    offer:
      npc: "แก… ป้าแต๋วบอกว่าบอลกรอกใบสมัครระยองเสร็จแล้ว บอลไม่บอกฉัน ฉันอยากคุยกับเขา แต่ถ้าไปคนเดียวเราสองคนจะคุยเรื่องยางรถแล้วกลับบ้าน ไปด้วยกันนะ"
      options:
        - text: "ไป แต่นกต้องพูดเรื่องจริงนะ ไม่ใช่เรื่องยาง"
          accept: true
          heart: 2
          reply: "ฉันจะพยายาม… ถ้าฉันพูดเรื่องยาง แกพูดว่า ‘นก’ เสียงดังๆ ครั้งเดียว ฉันจะรู้ตัว"
        - text: "{p}ไปถามพี่บอลก่อนว่าเขาพร้อมคุยไหม"
          accept: true
          heart: 1
          reply: "ดี… ไปถามก่อน บอลไม่ชอบถูกจู่โจม เขาเหมือนเครื่องยนต์ ต้องอุ่นเครื่องก่อน"
        - text: "เรื่องของนกกับพี่บอลนะ"
          heart: 0
          reply: "ก็จริง… แต่ฉันกับบอลไม่เคยคุยเรื่องสำคัญได้โดยไม่มีคนที่สาม ตอนเด็กมีแพรว ตอนนี้แพรวยุ่ง… ไม่เป็นไร ฉันลองเอง"
    steps:
      - goal: { type: talk, npc: ball }
        hint: "ไปที่อู่ บอกบอลว่านกอยากคุยด้วย"
        done:
          npc: "นกส่งมาใช่ไหม… ฟังเสียงก็รู้ เดินเร็วแบบนี้ คนมีธุระแทนคนอื่น ใบสมัครอยู่ในลิ้นชักจริง ยังไม่ส่ง… บอกนกว่ามาได้ เย็นนี้ ผมปิดอู่ช้าหน่อย"
          options:
            - text: "พี่บอลจะบอกนกไหมว่าจะไปหรือเปล่า"
              heart: 1
              reply: "ผมยังไม่รู้เองเลย จะบอกคนอื่นได้ไง… แต่ผมจะฟังนกพูด นกพูดอะไรผมฟังหมด ฟังมายี่สิบปีแล้ว"
            - text: "นกเสียใจที่ได้ยินจากป้าแต๋วนะ"
              heart: 2
              reply: "…ผมรู้ ผมผิด ผมไม่รู้จะเริ่มประโยคยังไง เลยไม่เริ่มเลย ป้าแต๋วเริ่มแทนผม ป้าแต๋วเริ่มประโยคเก่งที่สุดในตำบล"
      - goal: { type: visit, place: garage, from: "18:00", to: "19:30" }
        hint: "ตอนเย็นไปที่อู่บอล พร้อมนก"
        done:
          npc: "(นกนั่งบนเก้าอี้พลาสติก บอลนั่งบนยางรถ เงียบไปนาน) …บอล ฉันขอโทษเรื่องตอนสิบแปด ที่ฉันไปก่อน ฉันผิดสัญญา… แล้วตอนนี้แกจะไปบ้าง แก… ฉันควรพูดอะไรต่อดี"
          options:
            - text: "เล่าความจริงเรื่องโรงงานให้พี่บอลฟังทั้งหมด แล้วให้เขาเลือกเอง"
              heart: 2
              set_flag: nok_told_truth
              reply: "นกเล่าทั้งหมด มือชา หักเงิน หอไม่มีหน้าต่าง ร้องไห้ในห้องน้ำ บอลฟังจนจบไม่พูดสักคำ แล้วบอกว่า ‘ขอบใจที่ไม่โกหกว่ามันสบาย’ นกหันมายิ้มทั้งน้ำตา"
            - text: "บอกพี่บอลตรงๆ ว่านกอยากให้เขาอยู่"
              heart: 1
              set_flag: nok_begged_stay
              reply: "‘อยู่เถอะบอล ฉันขอ ถ้าแกไปฉันจะไม่มีบ้านให้กลับ’ บอลก้มหน้าลงนาน ‘แกขอแบบนี้กูจะไปได้ไงวะ… แต่ถ้ากูอยู่เพราะแกขอ กูจะโกรธแกทีหลังไหม กูไม่รู้’"
            - text: "บอกพี่บอลว่าไปเถอะ นกจะไม่โกรธ"
              heart: 1
              set_flag: nok_said_go
              reply: "‘ไปเถอะบอล ฉันไม่โกรธ ฉันเคยไปก่อน ฉันไม่มีสิทธิ์ห้าม’ บอลมองนกนาน ‘แกพูดเหมือนกูจะไปตายนะ… ระยองมีรถเมล์กลับบ้านนะเว้ย’ นกหัวเราะทั้งที่ตาแดง"
    reward: { heart: 3, set_flag: nok_q3_done, line: { from: nok, text: "เมื่อคืนคุยกับเพื่อนรักใต้หลังคาอู่รั่ว ฝนหยดใส่หัวทั้งคืน ไม่มีใครลุก 🌧️ ขอบใจคนที่นั่งอยู่ด้วยนะ" } }

  - id: nok_q4
    npc: nok
    title: "มือขวาที่ชา"
    desc: "นกยอมให้หมอแอนดูมือ แต่ยังไม่กล้าบอกแม่"
    start: { flag: nok_q3_done, heart_min: 5, day_min: 16 }
    offer:
      npc: "แก… เมื่อคืนมือฉันชาจนถือแก้วน้ำไม่อยู่ แก้วตกแตกต่อหน้าแม่ ฉันบอกแม่ว่ามือลื่น แม่เชื่อ… ฉันไม่อยากโกหกแม่แล้ว พาฉันไปหาหมอแอนหน่อย"
      options:
        - text: "ไปตอนนี้เลย {p}ไปด้วย"
          accept: true
          heart: 2
          reply: "แกพูดเหมือนแม่ฉันเลย ‘ไปตอนนี้’ ไม่ใช่ ‘ไว้ค่อยไป’… โอเค ไปแก ก่อนที่ฉันจะเปลี่ยนใจ"
        - text: "นกกล้ามากที่ยอมไป"
          accept: true
          heart: 1
          reply: "ไม่ได้กล้าแก กลัวว่าถ้าไม่ไป วันนึงจะตำส้มตำไม่ได้ ความกลัวแบบนี้มันพาฉันไปหาหมอได้ ความกล้าไม่เคยพาไป"
        - text: "พักผ่อนเยอะๆ ก็หาย"
          heart: -1
          reply: "ฉันพักทุกเสาร์อาทิตย์มาเจ็ดปีแล้วแก มันไม่หาย… ไม่เป็นไร ฉันไปเองก็ได้"
    steps:
      - goal: { type: talk, npc: ann }
        hint: "ไปคุยกับหมอแอนที่ รพ.สต. เรื่องมือของนก"
        done:
          npc: "นกเป็นพังผืดกดทับเส้นประสาทข้อมือค่ะ หมอที่โรงงานพูดถูกนะคะ ระยะนี้ยังรักษาได้โดยไม่ต้องผ่า แต่ต้องพักมือจากงานซ้ำๆ และใส่ที่ดามตอนกลางคืน ร้านเภสัชกรมดมีขายค่ะ… ส่วนเรื่องงาน แอนช่วยเขียนใบรับรองแพทย์ให้ขอเปลี่ยนแผนกได้นะคะ"
          options:
            - text: "ใบรับรองแพทย์ช่วยได้จริงเหรอ{kq}"
              heart: 1
              reply: "ตามกฎหมายแรงงาน บริษัทต้องพิจารณาค่ะ จะได้ไม่ได้แอนไม่รับปาก แต่มีกระดาษดีกว่าไม่มีนะคะ นกยิ้มครั้งแรกตั้งแต่เข้ามาค่ะ"
            - text: "นกจะยังตำส้มตำได้ไหม{kq}"
              heart: 2
              reply: "ได้ค่ะ ถ้ารักษาตอนนี้ แต่ตำวันละสามสิบครกต้องสลับมือนะคะ แอนจะสอนท่าบริหารข้อมือให้ นกถามว่าตำมือซ้ายแล้วรสชาติจะเปลี่ยนไหม แอนว่าไม่เปลี่ยนค่ะ"
      - goal: { type: pay, npc: mod, n: 290 }
        hint: "ไปร้านขายยาเภสัชกรมด ซื้อที่ดามข้อมือให้นก (290 บาท)"
        done:
          npc: "ที่ดามข้อมือไซซ์ S ครับ ราคาสองร้อยเก้าสิบ… ยาแก้ปวดมือที่ดีที่สุดคือเลิกกดชิ้นส่วนหมื่นครั้งต่อวันครับ แต่ผมขายอันนั้นไม่ได้ ขายได้แค่ที่ดาม"
          options:
            - text: "ขอบคุณ{k} ฝากบอกวิธีใส่ด้วย"
              heart: 1
              reply: "ใส่ตอนนอนครับ ไม่ต้องแน่นมาก ถ้านิ้วม่วงแปลว่าแน่นไป… บอกนกด้วยว่าห้ามใส่ไปตอกบัตรแล้วบอกหัวหน้าว่าเล่นบาส ใช้ไม่ได้ทุกรอบ"
            - text: "ลดหน่อยได้ไหม{kq}"
              heart: 0
              reply: "ลดไม่ได้ครับ แต่แถมยาหม่องให้หนึ่งขวด ยาหม่องไม่ช่วยพังผืด ช่วยให้รู้สึกว่ามีคนใส่ใจ"
      - goal: { type: talk, npc: nok }
        hint: "เอาที่ดามข้อมือไปให้นก แล้วคุยเรื่องจะบอกแม่"
        done:
          npc: "ที่ดามไซซ์ S… แกจำขนาดข้อมือฉันได้ไง ช่างเถอะ… แก ฉันควรบอกแม่ไหม ถ้าบอก แม่จะร้องไห้ ถ้าไม่บอก ฉันจะร้องไห้คนเดียวที่หอต่อ"
          options:
            - text: "บอกแม่เถอะ ให้แม่ได้เหนื่อยแทนนกบ้าง"
              heart: 2
              set_flag: nok_told_mom
              reply: "…ฉันบอกแล้วแก เมื่อกี้ แม่ไม่ร้องไห้ แม่จับมือฉันนวดทั้งชั่วโมง แล้วบอกว่า ‘หยุดส่งเงินมาแล้วเก็บไว้เปิดร้าน แม่จะรับงานเฝ้ารั้วเอง’ เราสองคนแย่งกันเหนื่อยอีกแล้ว แต่ครั้งนี้มันอุ่นๆ"
            - text: "รอให้รักษาจนดีขึ้นก่อน แล้วค่อยเล่าเป็นข่าวดี"
              heart: 1
              set_flag: nok_hid_mom
              reply: "เล่าตอนมันดีแล้ว… ใช่ แม่จะได้ไม่ต้องเห็นตอนมันแย่ ฉันจะใส่ที่ดามตอนแม่หลับ ถ้าแม่จับได้ ฉันจะบอกว่าแกเป็นคนแนะนำ"
    reward: { heart: 2, items: { herbal_tea: 1 }, set_flag: nok_q4_done, line: { from: ann, text: "ใครทำงานใช้มือซ้ำๆ ทั้งวัน แล้วมีอาการชาตอนกลางคืน แวะมา รพ.สต. นะคะ รักษาเร็วไม่ต้องผ่า 🙏 ไม่ต้องรอให้แก้วตกแตกก่อนค่ะ" } }

  - id: nok_q5
    npc: nok
    title: "ส้มตำนกน้อยกลับรัง"
    desc: "นกพร้อมเปิดร้านส้มตำหน้าวัด ช่วยเตรียมร้านและตัดสินใจเรื่องโรงงาน"
    start: { flag: nok_q4_done, heart_min: 7, day_min: 20 }
    offer:
      npc: "แก… ฉันจะเปิดร้าน ไม่ใช่ในสมุดแล้ว ของจริง หน้าวัดดงเย็น ต้องขอพระอาจารย์ ต้องให้ช่างเปี๊ยกทำเพิง แล้ววันแรกแกต้องนั่งเก้าอี้ ‘ที่นั่งประจำ’ ตัวนั้น แกช่วยฉันนะ"
      options:
        - text: "ช่วย ทุกขั้นตอน"
          accept: true
          heart: 2
          reply: "ทุกขั้นตอน… ขั้นตอนแรกคือแกไปขอพระอาจารย์แทนฉันก่อนได้ป่ะ ฉันกลัวพระ ไม่ใช่กลัวท่านดุ กลัวท่านใจดีแล้วฉันร้องไห้กลางวัด"
        - text: "ที่นั่งประจำนั่นของ{p}จริงเหรอ"
          accept: true
          heart: 2
          reply: "บอกแล้วอย่าถาม… ถ้าแกไม่นั่ง ฉันจะเขียนชื่อแกติดไว้ แล้วให้ทั้งตำบลรู้ว่าเก้าอี้ตัวนี้ว่างเพราะใคร เลือกเอา"
        - text: "รอให้น้องจบก่อนดีไหม"
          heart: 0
          reply: "ฉันพูดว่า ‘รอก่อน’ มาห้าปีแล้วแก… ไม่เป็นไร ฉันรอได้อีก แต่ฉันไม่แน่ใจว่าความกล้าฉันจะรอได้"
    steps:
      - goal: { type: talk, npc: sumet }
        hint: "ไปกราบขออนุญาตพระอาจารย์สุเมธ ใช้ลานหน้าวัดตั้งร้านส้มตำของนก"
        done:
          npc: "หนูนกจะกลับมาตั้งร้านหน้าวัดหรือโยม อนุโมทนาด้วย ลานหน้าวัดเป็นของชาวบ้าน ไม่ต้องเสียค่าเช่า ขอแค่รักษาความสะอาด แล้ววันพระเหลือส้มตำไว้ให้ป้าทองใบชิมสักครก ป้าทองใบจะได้ช่วยติชม… คนที่กลับบ้านได้ ถือว่าได้บุญแล้วนะโยม เจริญพร"
          options:
            - text: "กราบขอบพระคุณ{k}หลวงพ่อ"
              heart: 1
              reply: "ฝากบอกหนูนกด้วยว่า ต้นมะม่วงหลังโรงเรียนที่หนูนกเคยปีน อาตมายังรดน้ำอยู่ทุกหน้าแล้ง… มันยังรอคนกลับมาเก็บลูกนะโยม"
            - text: "นกกลัวว่าจะเจ๊ง{k}หลวงพ่อ"
              heart: 1
              reply: "ชาวนาก็กลัวน้ำท่วมทุกปี แต่ก็ยังหว่านข้าว ความกลัวไม่ได้แปลว่าไม่ควรเริ่ม แปลว่าเรารู้ว่ามันสำคัญ บอกหนูนกตามนี้นะโยม"
      - goal: { type: pay, npc: piak, n: 1500 }
        hint: "จ่ายค่าแรงช่างเปี๊ยกทำเพิงร้านส้มตำหน้าวัด (1,500 บาท ช่วยนกออก)"
        done:
          npc: "เพิงร้านส้มตำใช่ไหมเว้ย พี่ทำให้ หลังคาสังกะสีใหม่ เสาไม้ฐานรากแน่น ฝนตกไม่รั่วเหมือนอู่ไอ้บอล… ค่าแรงพันห้า วัสดุพี่เอาของเหลือจากงานวัดมาใช้ ไม่คิด ของวัดก็ต้องกลับไปช่วยคนกลับบ้านบ้าง"
          options:
            - text: "ทำโต๊ะห้าตัวด้วยได้ไหม{kq}พี่"
              heart: 1
              reply: "ห้าตัว… หนูนกวาดแบบไว้ในสมุดใช่ไหม พี่เห็นแล้ว ไอ้บอลเอามาให้ดูเมื่อวาน มันว่าเห็นนกลืมไว้ที่อู่ พี่ว่ามันแอบถ่ายเอกสาร"
            - text: "ขอเก้าอี้แข็งแรงตัวนึง เขียนว่าที่นั่งประจำ"
              heart: 2
              reply: "ฮ่า! ได้เลย พี่ใช้ไม้สักเศษจากศาลาเก่า แข็งที่สุดในร้าน นั่งได้ถึงแก่ ได้ฉากทุกมุม พี่รับประกันตลอดชีพ… ชีพใครก็แล้วแต่"
      - goal: { type: visit, place: temple, from: "08:00", to: "12:00" }
        hint: "เช้าวันเปิดร้าน ไปที่หน้าวัดดงเย็น นั่งที่นั่งประจำ"
        done:
          npc: "ครกแรกของร้านจริง… ของแก ฉันตำมือซ้ายสลับมือขวาตามที่หมอแอนสอน ชิมเลย… แก ฉันต้องตัดสินใจวันนี้ หัวหน้าโทรมาถามว่าวันจันทร์ฉันจะเข้างานไหม ฉันควรตอบว่าอะไร"
          options:
            - text: "ลาออกเถอะ นก กลับบ้านถาวร {p}อยู่ตรงนี้"
              heart: 2
              set_flag: nok_quit_factory
              reply: "…ฉันพิมพ์แล้ว ‘หนูขอลาออกค่ะ’ ส่งแล้ว มือไม่ชาเลยแก มือสั่น แต่ไม่ชา… ฉันกลับรังแล้ว นกน้อยกลับรังแล้วจริงๆ"
            - text: "เปิดร้านเสาร์อาทิตย์ไปก่อน ให้มือหายดีและน้องจบก่อน"
              heart: 1
              set_flag: nok_weekend_shop
              reply: "เสาร์อาทิตย์ก่อน… ใช่ ไม่ต้องกระโดดทีเดียว ฉันจะกลับรังทีละวัน ทุกวันเสาร์ฉันจะมีที่ให้กลับมาจริงๆ แล้ว ไม่ใช่แค่บ้านแม่ แต่เป็นร้านของฉัน… กับที่นั่งประจำของแก"
    reward: { money: 0, heart: 3, items: { somtum_poo_plara: 2 }, set_flag: nok_romance_open, line: { from: nok, text: "ร้าน ‘ส้มตำนกน้อยกลับรัง’ เปิดแล้วจ้า 🦜🌶️ หน้าวัดดงเย็น โต๊ะห้าตัว เก้าอี้ไม้สักหนึ่งตัวมีเจ้าของแล้ว ห้ามนั่ง" } }
