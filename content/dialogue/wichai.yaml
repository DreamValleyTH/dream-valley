# นายกฯ วิชัย — convos + quests
convos:
  # ===== react =====
  - id: wichai_r_meet
    topic: react
    once: true
    when: { not_flag: met_wichai }
    npc: "สวัสดีครับ คุณคือหลานยายเพียรใช่ไหมครับ ผมวิชัย นายก อบต. ครับ ในนามขององค์การบริหารส่วนตำบล ผมขอต้อนรับคุณกลับสู่บ้านเกิดอย่างเป็นทางการและไม่เป็นทางการครับ"
    set_flag: met_wichai
    options:
      - text: "ขอบคุณ{k}นายกฯ ยินดีที่ได้รู้จัก"
        heart: 1
        reply: "ยินดีเช่นกันครับ นี่นามบัตรผมครับ ด้านหลังเป็นปฏิทินปี 2565 ยังใช้ได้ครับ วันที่ตรงกันบางเดือน"
        next:
          - text: "ปฏิทินเก่าไปไหม{kq}"
            heart: 1
            reply: "เก่าในเชิงปี แต่ใหม่ในเชิงการใช้งานครับ ผมพิมพ์ไว้สองหมื่นใบ ยังเหลือหมื่นเก้า… ประชาชนเริ่มไม่รับนามบัตรแล้วครับ รับแต่ข้าวกล่อง"
          - text: "ไม่มีชื่อพรรคด้วยแฮะ{k}"
            heart: 0
            reply: "ท้องถิ่นเราไม่มีพรรคครับ เรามีแต่ ‘ทีม’ ทีมผมชื่อทีมพัฒนาอย่างยั่งยืน ทีมคู่แข่งชื่อทีมยั่งยืนอย่างพัฒนา ประชาชนสับสนบ้างครับ"
      - text: "นายกฯ มาต้อนรับทุกคนที่ย้ายมาเหรอ{kq}"
        heart: 1
        reply: "ทุกคนที่มีสิทธิ์เลือกตั้งครับ… หมายถึงทุกคนครับ ทุกคนมีค่าเท่ากัน บางคนมีค่าในเดือนเลือกตั้งมากกว่าเล็กน้อยครับ"
      - text: "{p}รีบนิดนึง{k}"
        heart: 0
        reply: "เข้าใจครับ ผมเองก็รีบทุกวัน แต่ไม่ได้ไปไหน… เชิญครับ อบต. เปิดแปดโมงครึ่ง ผมเข้าเก้าโมงครึ่ง เผื่อเวลาให้งานมาถึงก่อนผม"

  - id: wichai_r_intro
    topic: react
    once: true
    when: { flag: story_town_intro }
    npc: "ผมได้ยินผู้ใหญ่สมศักดิ์ประกาศต้อนรับคุณครับ สามรอบ ผมรู้สึกว่าเป็นประกาศที่ชัดเจนที่สุดของหอกระจายข่าวเดือนนี้ เพราะไม่มีเรื่องงบประมาณ"
    options:
      - text: "ประกาศเรื่องงบไม่ชัดเหรอ{kq}"
        heart: 1
        reply: "ชัดครับ ชัดในระดับที่เหมาะสม คือได้ยินว่ามีงบ แต่ไม่ได้ยินว่าไปไหน ไมค์หอนตรงตัวเลขพอดีครับ ทุกครั้ง ผมไม่ได้สั่งนะครับ"
      - text: "ผู้ใหญ่ใจดีมาก{k}"
        heart: 1
        reply: "ใจดีมากครับ ทำหนังสือมาหาผมบ่อยที่สุดในตำบล ผมเก็บไว้ในแฟ้มสีน้ำเงิน แฟ้มที่สามแล้วครับ ผมกำลังขออนุมัติซื้อแฟ้มที่สี่"

  - id: wichai_r_thana
    topic: react
    once: true
    when: { flag: story_thana_visit }
    npc: "ผมทราบว่าคุณธนาไปพบคุณที่ฟาร์มครับ ผมขอชี้แจงว่า อบต. ไม่มีส่วนเกี่ยวข้อง และไม่มีส่วนไม่เกี่ยวข้องเช่นกันครับ เราอยู่ตรงกลาง"
    options:
      - text: "อยู่ตรงกลางคืออะไร{kq}"
        heart: 1
        reply: "คือรับทราบทั้งสองฝ่ายครับ ฝ่ายบริษัทส่งหนังสือมา ผมรับทราบ ฝ่ายชาวบ้านส่งหนังสือมา ผมก็รับทราบ ความยุติธรรมคือรับทราบเท่ากันครับ"
        next:
          - text: "แต่บริษัทได้ใบอนุญาต ชาวบ้านได้แค่รับทราบนะ{kq}"
            heart: 2
            reply: "…ข้อสังเกตนี้คมมากครับ คมจนผมขอไม่ตอบในวันนี้ ผมจะนำไปพิจารณาตอนกลางคืน ซึ่งผมนอนไม่ค่อยหลับอยู่แล้วครับ"
          - text: "นายกฯ คิดว่า{p}ควรขายไหม{kq}"
            heart: 0
            reply: "ผมในฐานะนายกฯ เคารพการตัดสินใจของประชาชนครับ ผมในฐานะคนเกิดที่นี่… ผมขอไม่ใส่สองฐานะพร้อมกันครับ มันหนัก"
      - text: "นายกฯ ก็ได้ตะกร้าผลไม้จากเขาใช่ไหม{kq}"
        heart: 0
        reply: "ได้ครับ ทุกบ้านที่มีป้ายได้ครับ ผมแจกต่อให้ รพ.สต. หมดแล้ว มีรูปถ่ายประกอบครับ… รูปนั้นผมโพสต์ลงเพจแล้ว ยอดไลก์ดีครับ"

  - id: wichai_r_meeting1
    topic: react
    once: true
    when: { flag: story_meeting1 }
    npc: "ประชุมประชาคมวันนั้น ผมพูดเปิดสี่สิบนาทีครับ ทีมงานบอกว่าสั้นที่สุดในวาระที่สอง ผมภูมิใจ… คุณได้ยินช่วงไหนบ้างครับ"
    options:
      - text: "ช่วงที่นายกฯ พูดว่า ‘ขับเคลื่อน’ ครั้งที่สิบสอง{k}"
        heart: 1
        reply: "คุณนับด้วยหรือครับ! ทีมงานผมนับได้สิบเอ็ด… ผมจะให้ทีมงานไปเรียนนับจากคุณครับ หรือผมจะลดลงเหลือสิบ ขึ้นอยู่กับว่าอันไหนง่ายกว่า"
      - text: "ช่วงที่กำนันกรน{k}"
        heart: 1
        reply: "กำนันไม่ได้กรนครับ กำนันกำลังแสดงความเห็นด้วยในเชิงลึก ผมบันทึกไว้แบบนั้นครับ ในรายงานการประชุมฉบับที่ผมเซ็น"
      - text: "ไม่ได้ฟังเลย{k}"
        heart: 0
        reply: "ไม่เป็นไรครับ ผมเองฟังตัวเองไม่ครบเหมือนกัน ช่วงนาทีที่ยี่สิบผมลืมว่ากำลังพูดถึงอะไร ผมเลยพูดคำว่าบูรณาการไปห้าทีจนนึกออก"

  - id: wichai_r_vote_road
    topic: react
    once: true
    when: { flag: vote_road }
    npc: "คุณโหวตถนนหรือครับ ขอบคุณที่สนับสนุนการพัฒนาโครงสร้างพื้นฐานครับ เสี่ยเฮงก็ขอบคุณคุณด้วย ผ่านผมครับ เขาฝากมา"
    options:
      - text: "ทำไมเสี่ยเฮงต้องขอบคุณ{p}{kq}"
        heart: 1
        reply: "เพราะรถบรรทุกจะวิ่งสะดวกขึ้นครับ ซึ่งเป็นประโยชน์ต่อเศรษฐกิจฐานราก… ฐานรากที่มีลานรับซื้ออยู่ปลายถนนพอดีครับ ผมพูดตามข้อเท็จจริง"
      - text: "{p}อยากให้ถนนหมู่สามดีขึ้นจริงๆ{k}"
        heart: 2
        reply: "ผมก็อยากครับ จริงๆ นะครับ ครั้งนี้ผมไม่วน… ผมอยากมาตั้งแต่วาระแรก แต่ถนนมันไกลจาก อบต. แค่สามกิโล ไกลจากงบประมาณหลายสิบกิโลครับ"

  - id: wichai_r_result
    topic: react
    once: true
    when: { flag: meeting1_result_water }
    npc: "ผลโหวตออกแล้วครับ ระบบน้ำ ผมขอแสดงความยินดีกับทุกฝ่าย ทั้งฝ่ายที่ชนะ และฝ่ายที่ได้งบศึกษาความเป็นไปได้ครับ"
    options:
      - text: "ฝ่ายที่ได้งบศึกษาคือใคร{kq}"
        heart: 1
        reply: "บริษัทที่ปรึกษาที่ผ่านกระบวนการคัดเลือกอย่างโปร่งใสครับ โปร่งใสมากจนมองทะลุไปเห็นนามสกุลกรรมการผู้จัดการ… ผมขอพูดเท่านี้ครับ ผมพูดเกินมาครึ่งประโยคแล้ว"
        next:
          - text: "นามสกุลอะไร{kq}"
            heart: 1
            reply: "นามสกุลที่พบได้ทั่วไปในตำบลเรา และในบ้านผมครับ… ผมขอตัวไปตัดริบบิ้นก่อนนะครับ ริบบิ้นไม่ถามคำถามครับ"
          - text: "แบ่งครึ่งงบไปศึกษา ชาวบ้านจะได้อะไร{kq}"
            heart: 1
            reply: "ได้ป้ายครับ ป้ายระบบน้ำสวยมาก มีรูปหยดน้ำยิ้ม ส่วนท่อจะตามมาตามความเป็นไปได้ที่ศึกษาแล้วครับ"
      - text: "ยินดีด้วย{k}นายกฯ"
        heart: 0
        reply: "ขอบคุณครับ ผมยินดีกับทุกผลอย่างเท่ากันครับ ผมเตรียมสุนทรพจน์ไว้สามแบบ ใช้ได้แบบเดียว อีกสองแบบผมจะใช้ปีหน้าครับ เปลี่ยนแค่คำนาม"

  - id: wichai_r_well
    topic: react
    once: true
    when: { flag: story_well_dry }
    npc: "ผมทราบเรื่องบ่อแห้งครับ อบต. ได้ตั้งคณะทำงานศึกษาสาเหตุบ่อแห้งแล้ว ประชุมนัดแรกเดือนหน้า ระหว่างนี้ผมขอให้ประชาชนรองน้ำฝนไว้ครับ ซึ่งยังไม่มีฝนครับ"
    options:
      - text: "สาเหตุก็ชัดอยู่แล้วนี่{kq}"
        heart: 1
        reply: "ชัดในทางสามัญสำนึกครับ แต่ยังไม่ชัดในทางเอกสาร ผมทำงานกับเอกสารครับ สามัญสำนึกไม่มีเลขที่หนังสือ"
        next:
          - text: "งั้นให้ปาล์มทำเอกสารเลขที่ให้สิ{kq}"
            heart: 2
            reply: "ปาล์มทำแล้วครับ รายงานระดับน้ำ ผมอ่านแล้ว… ผมสั่งให้ ‘เก็บไว้ก่อน’ ครับ ผมไม่ภูมิใจคำสั่งนี้ คืนนั้นผมกินข้าวไม่หมดจาน"
          - text: "คณะทำงานกี่คน{kq}"
            heart: 0
            reply: "เจ็ดคนครับ มีเบี้ยประชุมคนละห้าร้อย ศึกษาไปสามครั้ง ค่าเบี้ยเท่ากับขุดบ่อใหม่ได้หนึ่งบ่อพอดีครับ ผมเพิ่งคำนวณตอนพูดนี่แหละ"
      - text: "บ่อปลาคาร์ฟนายกฯ ยังโอเคไหม{kq}"
        heart: 0
        reply: "ระดับน้ำลดลงสองคืบครับ ปลาคาร์ฟของผมชื่อ ‘ศูนย์เด็กเล็ก’ เริ่มว่ายวน… มันวนเหมือนผมเลยครับ ผมเพิ่งสังเกต"

  - id: wichai_r_may_evidence
    topic: react
    once: true
    when: { flag: helped_may }
    npc: "ผม… ไม่ได้ยินอะไรนะครับ ว่าคุณช่วยคุณเมย์ถ่ายรูปท่อบริษัทตอนกลางคืน ผมไม่ได้ยินอย่างเป็นทางการครับ แต่ผมได้ยินอย่างไม่เป็นทางการจากสามแหล่ง"
    options:
      - text: "นายกฯ จะห้าม{p}ไหม{kq}"
        heart: 1
        reply: "ผมไม่มีอำนาจห้ามประชาชนถ่ายรูปท่อครับ ท่อไม่อยู่ในระเบียบห้ามถ่าย… ผมจะบอกแค่ว่า ระวังรถที่ขับตามตอนกลางคืนนะครับ ข้อนี้ผมพูดในฐานะคนครับ ไม่ใช่นายกฯ"
        next:
          - text: "นายกฯ รู้เรื่องรถขับตามด้วยเหรอ{kq}"
            heart: 2
            reply: "…ผมรู้ว่ามีครับ ผมไม่รู้ว่าของใคร และผมไม่อยากรู้ว่าของใคร เพราะถ้ารู้แล้วผมต้องรับทราบ แล้วผมรับทราบเรื่องนี้ไม่ไหวครับ"
          - text: "ขอบคุณที่เตือน{k}"
            heart: 1
            reply: "ไม่ต้องขอบคุณครับ ผมเตือนแบบไม่มีป้าย ไม่มีรูป ไม่มีเพจ ครั้งแรกในวาระที่สองครับ รู้สึกแปลกดี"
      - text: "นายกฯ จะอยู่ข้างไหน{kq}"
        heart: 0
        reply: "ข้างที่ผมยังเป็นนายกฯ อยู่ได้ครับ… ประโยคนี้ฟังดูแย่ใช่ไหมครับ ผมได้ยินตัวเองพูดแล้วก็รู้สึกแย่ ผมขอถอนคำพูดเป็นการภายในครับ"

  - id: wichai_r_meeting2
    topic: react
    once: true
    when: { flag: story_meeting2 }
    npc: "ประชุมครั้งที่สองครับ คุณธนาแจกถังน้ำ CSR ผมได้รับเชิญให้ถ่ายรูปรับมอบ ผมยืนถือถังยิ้มเห็นฟันหกซี่ แล้วมีคนตะโกนว่า ‘ถังเปล่านะนายก’ ผมยิ้มต่อครับ ยิ้มเหมือนไม่ได้ยิน"
    options:
      - text: "นายกฯ ได้ยินไหม{kq}"
        heart: 2
        reply: "ได้ยินครับ ได้ยินชัดที่สุดในการประชุม ผมคิดถึงประโยคนั้นทั้งคืน ถังเปล่า… ผมถือถังเปล่ามาสองวาระครับ เพิ่งมีคนบอก"
      - text: "รูปนั้นลงเพจหรือยัง{kq}"
        heart: 0
        reply: "ลงแล้วครับ ทีมงานลบเสียงตะโกนออกไม่ได้ เลยลงเป็นภาพนิ่ง ภาพนิ่งไม่มีเสียงครับ ข้อดีของภาพนิ่ง"
      - text: "ชาวบ้านแตกเป็นสองฝ่ายแล้วนะ{kq}"
        heart: 1
        reply: "ครับ… ผมเห็นแล้ว และผมยืนตรงกลางเหมือนเดิม แต่วันนั้นตรงกลางมันว่างครับ มีแต่ผมกับผู้ใหญ่สมศักดิ์ ผู้ใหญ่กวาดศาลา ผมถือถัง"

  - id: wichai_r_act1
    topic: react
    once: true
    when: { flag: act1_done }
    npc: "ประกาศเลือกตั้งนายก อบต. ออกแล้วครับ ผมขอชี้แจงว่าโครงการที่เริ่มพร้อมกันสิบสองโครงการในเดือนนี้ เป็นความบังเอิญเชิงนโยบายครับ"
    options:
      - text: "ถนนหมู่สามก็บังเอิญซ่อมเดือนนี้เหรอ{kq}"
        heart: 1
        reply: "บังเอิญที่สุดครับ เหมือนทุกสี่ปี ถนนเส้นนั้นมีรอบของมัน เหมือนดอกไม้บานตามฤดู ฤดูของมันคือก่อนเลือกตั้งสามสัปดาห์ครับ"
        next:
          - text: "แล้วคืนหมาหอนล่ะ{kq}"
            heart: 1
            reply: "ผมไม่ทราบเรื่องหมาครับ ผมเป็นนายก อบต. ไม่ใช่ปศุสัตว์อำเภอ… แต่ถ้าคุณได้ยินหมาหอนหน้าบ้านคืนนั้น ไม่ใช่หมาผมนะครับ หมาผมเป็นหมาเงียบ"
          - text: "นายกฯ ลงสมัครอีกไหม{kq}"
            heart: 1
            reply: "อยู่ระหว่างการพิจารณาครับ… ป้ายผมพิมพ์เสร็จแล้วครับ แต่ยังอยู่ระหว่างการพิจารณา สองอย่างนี้ไม่ขัดกันครับ"
      - text: "บัญชีอวตารในกลุ่ม LINE ของนายกฯ หรือเปล่า{kq}"
        heart: 0
        reply: "‘ชาวบ้านธรรมดา99’ ไม่ใช่ของผมครับ ผมยืนยัน… ของผมชื่อ ‘รักบ้านเกิด2512’ ครับ ไม่ใช่ เดี๋ยวนะครับ ผมขอถอนประโยคหลัง"

  - id: wichai_r_lottery
    topic: react
    once: true
    when: { flag: bought_lottery }
    npc: "เห็นคุณซื้อสลากพัฒนาตำบลครับ ขอบคุณที่ร่วมพัฒนาครับ รายได้ส่วนหนึ่งเข้ากองทุนพัฒนาตำบล อีกส่วนหนึ่ง… พัฒนาไปแล้วครับ"
    options:
      - text: "พัฒนาไปที่ไหน{kq}"
        heart: 1
        reply: "พัฒนาเป็นป้ายประชาสัมพันธ์การขายสลากครับ เราต้องลงทุนในการบอกให้คนรู้ว่ามีการพัฒนา ไม่งั้นจะพัฒนาเงียบเกินไปครับ"
      - text: "นายกฯ ซื้อด้วยไหม{kq}"
        heart: 1
        reply: "ซื้อครับ ทุกงวด ผมไม่เคยถูกครับ แต่ผมถูกเลือกตั้งสองครั้ง โอกาสน้อยกว่าอีก ผมเลยเชื่อว่าโชคผมใช้ไปกับเรื่องนั้นหมดแล้ว"

  - id: wichai_r_sathian_sign
    topic: react
    once: true
    when: { flag: sathian_q1_bridge }
    npc: "ผมได้รับรายงานจากดาบเสถียรครับ ป้ายโครงการฝายของผมที่หายไป ถูกชาวบ้านเอาไปพาดคลองเป็นสะพาน… ดาบแนะนำให้ผมปล่อยไว้ เพราะเป็นป้ายแรกที่ใช้งานได้จริง"
    options:
      - text: "นายกฯ จะเอาคืนไหม{kq}"
        heart: 2
        reply: "ผมไปดูมาแล้วครับ เด็กๆ เดินข้ามบนหน้าผมทุกเช้าไปโรงเรียน ผมว่า… ผมว่าผมปล่อยไว้ครับ หน้าผมไม่เคยพาใครข้ามอะไรได้มาก่อน"
      - text: "ทำป้ายใหม่ก็ได้นี่{kq}"
        heart: 0
        reply: "ทำได้ครับ งบป้ายเรามีเสมอ… แต่ครั้งนี้ผมขอให้งบป้ายไปซื้อไม้กระดานมาทำสะพานจริงแทน ผมเพิ่งสั่งเมื่อเช้า ทีมงานผมยังตกใจอยู่"

  - id: wichai_r_after
    topic: react
    once: true
    when: { flag: wichai_q4_done }
    npc: "คุณครับ ตั้งแต่วันนั้นมีคนเดินมาหาผมที่ อบต. มากขึ้นครับ ไม่ได้มาร้องเรียน มาถามคำถาม แล้วรอฟังคำตอบ ผมไม่ชินเลยครับ คนรอฟังคำตอบผม"
    options:
      - text: "นายกฯ ตอบตรงหรือเปล่า{kq}"
        heart: 2
        reply: "ตอบตรงได้ครึ่งนึงครับ อีกครึ่งผมตอบว่า ‘ไม่รู้ครับ’ ซึ่งเป็นคำตอบตรงที่สุดที่ผมเคยพูด ทีมงานผมจะลาออกสองคนครับ"
      - text: "ดีใจด้วย{k}"
        heart: 1
        reply: "ขอบคุณครับ ผมขอบคุณแบบไม่มีป้ายนะครับ… ผมกำลังหัดทำอะไรแบบไม่มีป้าย ยากกว่าที่คิดครับ"

  # ===== news =====
  - id: wichai_n_feasibility
    topic: news
    npc: "ข่าวดีครับ อบต. อนุมัติโครงการศึกษาความเป็นไปได้ในการปรับปรุงกระบวนการศึกษาความเป็นไปได้แล้วครับ เพื่อให้การศึกษาครั้งต่อไปเป็นไปได้มากขึ้น"
    options:
      - text: "ฟังแล้วงงมาก{k}"
        heart: 1
        reply: "ผมก็งงครับ ผมอ่านในที่ประชุมสามรอบ ที่ประชุมปรบมือทุกรอบ ผมเลยคิดว่ามันคงดี ในระบบนี้ ถ้าคนปรบมือ แปลว่ามันดีครับ"
        next:
          - text: "แล้วถ้าไม่มีใครปรบมือล่ะ{kq}"
            heart: 2
            reply: "ยังไม่เคยเกิดขึ้นครับ ถ้าเกิดขึ้นสักวัน ผมคงต้องอธิบายจริงๆ ว่าโครงการทำอะไร… ผมขอให้คุณอย่าเป็นคนแรกที่ไม่ปรบนะครับ ผมยังไม่พร้อม"
          - text: "งบเท่าไหร่{kq}"
            heart: 1
            reply: "สามแสนครับ ถูกกว่าการศึกษาครั้งก่อนที่ห้าแสน ผมนับเป็นผลงานประหยัดงบสองแสนครับ ป้ายผลงานกำลังพิมพ์ครับ"
      - text: "ใครได้งานศึกษา{kq}"
        heart: 0
        reply: "บริษัทที่มีประสบการณ์ในการศึกษาความเป็นไปได้ครับ ประสบการณ์มาจากการได้งานศึกษาจาก อบต. เรามาสามครั้ง ประสบการณ์สะสมครับ"

  - id: wichai_n_signs
    topic: news
    npc: "เดือนนี้ อบต. มีพิธีเปิดป้ายโครงการสี่ป้ายครับ ป้ายเสร็จครบทั้งสี่ ตัวโครงการเสร็จไป… ผมขอตอบเป็นเปอร์เซ็นต์นะครับ เกือบศูนย์เปอร์เซ็นต์ครับ"
    options:
      - text: "ทำไมทำป้ายก่อน{kq}"
        heart: 1
        reply: "เพราะป้ายทำเสร็จในสามวันครับ ตัวโครงการต้องรองบงวดสอง งวดสองต้องรอรายงานงวดหนึ่ง รายงานงวดหนึ่งต้องมีรูป รูปต้องมีป้าย… ระบบเป็นวงกลมครับ ผมอยู่ตรงกลางวง"
      - text: "ป้ายไหนสวยที่สุด{kq}"
        heart: 1
        reply: "ป้ายศูนย์พัฒนาเด็กเล็กครับ พื้นสีฟ้า มีรูปผมกอดเด็ก เด็กในรูปเป็นหลานผมครับ ตัวศูนย์ยังเป็นที่ดินเปล่า เด็กจริงๆ ยังไปเรียนตำบลข้างๆ"
        next:
          - text: "แบบนี้ไม่น่าภูมิใจนะ{kq}"
            heart: 2
            reply: "…ไม่ครับ ผมไม่ได้ภูมิใจ ผมแค่ยิ้มเก่ง คนชอบสับสนสองอย่างนี้ รวมถึงผมด้วยครับ"
          - text: "หลานนายกฯ น่ารักดี{k}"
            heart: 0
            reply: "น่ารักครับ เขาถามผมว่า ‘ลุงอยู่ในป้ายทำไม ทำไมไม่อยู่ในโรงเรียน’ ผมตอบเขาไม่ได้ครับ ผมตอบผู้ใหญ่ได้ทุกคำถาม ยกเว้นเด็ก"

  - id: wichai_n_online
    topic: news
    npc: "อบต. เปิดระบบยื่นคำร้องออนไลน์แล้วครับ ตำบลเราเข้าสู่ยุคดิจิทัลเต็มตัว ยื่นได้ยี่สิบสี่ชั่วโมงครับ แล้วมาพิมพ์ใบยืนยันที่ อบต. ในเวลาราชการ"
    options:
      - text: "งั้นจะออนไลน์ไปทำไม{kq}"
        heart: 1
        reply: "เพื่อให้คำร้องไปรอเราก่อนครับ คำร้องรอที่ อบต. ได้สบายกว่าประชาชนรอ เราห่วงใยประชาชนครับ ให้กระดาษเหนื่อยแทน"
      - text: "ระบบล่มบ่อยไหม{kq}"
        heart: 1
        reply: "ล่มเฉพาะเวลามีคนใช้ครับ เวลาไม่มีคนใช้ระบบเสถียรมาก ผมตรวจสอบเองตอนตีสองครับ ทำงานได้สมบูรณ์"
      - text: "ผู้ใหญ่สมศักดิ์ใช้เป็นไหม{kq}"
        heart: 1
        reply: "ผู้ใหญ่ยื่นออนไลน์มาแล้วสามครั้งครับ เรื่องเดียวกัน หินคลุก แล้วพิมพ์ใบยืนยันมาให้ผมสามชุด ผมรับทราบสามครั้งเหมือนเดิมครับ ระบบไม่ได้เปลี่ยนผลลัพธ์ แค่เปลี่ยนช่องทาง"

  - id: wichai_n_training
    topic: news
    npc: "อบต. จัดอบรมอาชีพเสริมครับ หัวข้อ ‘การทำน้ำพริกเพื่อความยั่งยืน’ หนึ่งวัน มีข้าวกล่อง เกียรติบัตร และรูปถ่ายหมู่กับผมครับ"
    options:
      - text: "มีคนไปกี่คน{kq}"
        heart: 1
        reply: "ลงชื่อหกสิบคนครับ มาจริงสิบสองคน ข้าวกล่องหกสิบกล่องครับ ส่วนที่เหลือผมแจกงานศพสามงานเย็นนั้น ทุกคนชมว่า อบต. ใส่ใจ"
        next:
          - text: "แบบนี้เปลืองงบไหม{kq}"
            heart: 1
            reply: "ในรายงานเรามีผู้เข้าร่วมหกสิบคนครับ ลายเซ็นครบ… บางลายเซ็นคล้ายกันมาก ผมไม่ได้ตรวจลายมือครับ ผมไม่ใช่ผู้เชี่ยวชาญด้านลายมือ"
          - text: "น้ำพริกอร่อยไหม{kq}"
            heart: 1
            reply: "อร่อยครับ วิทยากรคือป้าแต๋ว ป้าแต๋วได้ค่าวิทยากรแปดร้อย แล้วขายน้ำพริกให้ผู้เข้าอบรมได้อีกสองพัน ป้าแต๋วคือคนเดียวที่ได้ผลลัพธ์เชิงรูปธรรมครับ"
      - text: "{p}จะไปอบรม{k}"
        heart: 1
        reply: "ยินดีต้อนรับครับ มาลงชื่อก่อนเจ็ดโมง ถ้ามาสาย เกียรติบัตรจะพิมพ์ชื่อผิด ปีก่อนเกียรติบัตรครึ่งนึงเขียนว่า ‘ผู้เข้าร่วม’ เฉยๆ ครับ"

  - id: wichai_n_company_meet
    topic: news
    when: { day_min: 6 }
    npc: "บริษัทของคุณธนาขอเข้าพบผมอีกครั้งครับ เราหารือกันในบรรยากาศที่ดี ผลการหารือคือเราจะหารือกันต่อในบรรยากาศที่ดีกว่าเดิมครับ"
    options:
      - text: "หารือเรื่องอะไร{kq}"
        heart: 1
        reply: "เรื่องความร่วมมือครับ เขาร่วม เรามือ… ไม่ใช่ครับ ผมพูดผิด เขาเสนอสนับสนุนงบทำป้ายต้อนรับเข้าตำบล มีโลโก้บริษัทเล็กๆ ที่มุมป้าย เล็กๆ ประมาณครึ่งป้ายครับ"
      - text: "นายกฯ รับไหม{kq}"
        heart: 1
        reply: "ผมบอกว่าอยู่ระหว่างการพิจารณาครับ… ครั้งนี้ผมพูดจริงนะครับ ผมพิจารณาจริงๆ ทุกคืน ผมพิจารณาจนภรรยาผมไปนอนอีกห้อง"
      - text: "อย่ารับนะ{kq}นายกฯ"
        heart: 2
        reply: "…ผมได้ยินคำนี้จากคุณ ผู้ใหญ่สมศักดิ์ ปาล์ม และหลานผมอายุเจ็ดขวบครับ ผมจะนับว่าเป็นเสียงประชาคมสี่เสียง มากกว่าที่ผมเคยได้จากการประชุมจริง"

  # ===== advice =====
  - id: wichai_a_petition
    topic: advice
    npc: "ถ้าคุณจะยื่นเรื่องที่ อบต. นะครับ ผมแนะนำว่าอย่ายื่นเรื่องเดียว ยื่นสามเรื่อง เรื่องที่สามจะได้รับการพิจารณาครับ เพราะเรื่องแรกกับเรื่องที่สองจะถูกรับทราบไปก่อน"
    options:
      - text: "ทำไมเป็นแบบนั้น{kq}"
        heart: 1
        reply: "เจ้าหน้าที่จะรู้สึกผิดตอนรับทราบเรื่องที่สามครับ ความรู้สึกผิดคือเครื่องมือบริหารที่ไม่มีในหลักสูตร ผมเรียนรู้เองครับ"
      - text: "นายกฯ ใช้วิธีนี้กับข้างบนด้วยไหม{kq}"
        heart: 2
        reply: "ใช้ครับ ผมยื่นขอถนนหมู่สามไปที่จังหวัดสามครั้ง ทุกครั้งเขารับทราบ… เพราะข้างบนเขาก็ยื่นสามเรื่องเหมือนกันครับ ระบบนี้ทุกคนรู้วิธีเดียวกัน เลยไม่มีใครได้ใช้"
      - text: "ยื่นเรื่องเดียวแต่ชัดๆ ไม่ได้เหรอ{kq}"
        heart: 1
        reply: "ได้ครับ ถ้าคุณมีคุณเมย์ยืนข้างๆ ตอนยื่น เรื่องเดียวก็พอครับ เจ้าหน้าที่ผมกลัวกล้องมากกว่ากลัวผมครับ"

  - id: wichai_a_photo
    topic: advice
    npc: "เคล็ดลับนะครับ ถ้าคุณจะทำอะไรดีๆ ให้ตำบล ถ่ายรูปไว้ด้วยครับ ไม่ใช่เพื่อโอ้อวด แต่เพื่อพิสูจน์ ในระบบเรา ถ้าไม่มีรูป มันไม่ได้เกิดขึ้นครับ"
    options:
      - text: "แต่ถ้ามีแต่รูปไม่มีงานล่ะ{kq}"
        heart: 2
        reply: "…นั่นเรียกว่าโครงการครับ ผมทำมาสองวาระ… ผมเพิ่งพูดอะไรออกไปครับ ผมขอให้คุณลืมประโยคนี้ แต่ผมเองจะจำ"
      - text: "นายกฯ ถ่ายรูปวันละกี่รูป{kq}"
        heart: 1
        reply: "ทีมงานถ่ายวันละสามร้อยครับ ลงเพจวันละสาม ที่เหลืออยู่ในฮาร์ดดิสก์ สามแสนรูป ผมเป็นคนที่มีรูปมากที่สุดในอำเภอ แต่ไม่มีรูปกับแม่ผมสักรูปที่ไม่ใช่งานพิธี"

  - id: wichai_a_vote
    topic: advice
    when: { day_min: 5, heart_min: 1 }
    npc: "ถ้าคุณอยากให้ประชาคมโหวตตามที่คุณต้องการ ผมแนะนำแบบตรงๆ นะครับ ไปคุยกับชาวบ้านทีละบ้าน คะแนนเสียงมาจากหน้าบ้าน ไม่ใช่หน้าป้าย… ผมรู้ เพราะผมมีแต่หน้าป้าย"
    options:
      - text: "ไปหาป้าแต๋วบ้านเดียวพอไหม{kq}"
        heart: 1
        reply: "ฉลาดครับ ป้าแต๋วเท่ากับสามสิบบ้าน แต่ป้าแต๋วไม่ขายเสียงนะครับ ป้าแต๋วขายข่าว ต้องมีข่าวไปแลก"
      - text: "ทำไมนายกฯ ไม่ไปหน้าบ้านบ้าง{kq}"
        heart: 2
        reply: "ผมไปครับ ช่วงเลือกตั้ง… คนเปิดประตูมาเห็นผมแล้วถามว่า ‘ถึงเวลาแล้วเหรอ’ ผมไม่เคยกล้าไปตอนไม่ใช่เวลาครับ กลัวเขาถามว่ามาทำไม"

  - id: wichai_a_words
    topic: advice
    npc: "คุณอยากรู้ไหมครับ ว่าจะตอบคำถามยากๆ ยังไงไม่ให้ผิด ผมสอนฟรีครับ ขึ้นต้นด้วย ‘ในส่วนของ’ ตามด้วยคำถาม แล้วจบด้วย ‘เป็นสิ่งที่เราให้ความสำคัญ’ ครับ"
    options:
      - text: "ลองดู ‘ในส่วนของถนน เป็นสิ่งที่เราให้ความสำคัญ’{k}"
        heart: 1
        reply: "ยอดเยี่ยมครับ! คุณพร้อมลงสมัครแล้ว… ผมล้อเล่นครับ อย่าใช้นะครับ ใช้แล้วติด ผมติดมาสิบปี เวลาภรรยาถามว่ากินอะไร ผมยังตอบว่าในส่วนของอาหาร"
        next:
          - text: "แล้วถ้าอยากเลิกต้องทำยังไง{kq}"
            heart: 2
            reply: "ผมก็กำลังหาอยู่ครับ… ผมลองพูดกับหลานผม เด็กไม่ยอมรับ ‘ในส่วนของ’ เขาถามซ้ำจนผมต้องตอบ เด็กคือนักข่าวที่ดีที่สุดครับ ดีกว่าคุณเมย์อีก"
          - text: "ฟังดูเก่งมาก{k}"
            heart: 0
            reply: "ฟังดูเก่งครับ ไม่ได้เก่ง ความต่างนี้ผมต้องใช้เวลาสองวาระถึงเข้าใจ"
      - text: "{p}ตอบตรงๆ ดีกว่า{k}"
        heart: 2
        reply: "ดีกว่าครับ ผมเห็นด้วยร้อยเปอร์เซ็นต์ ครั้งนี้ไม่มีในส่วนของ… ผมอิจฉาคนที่ตอบตรงได้ครับ ผมพูดจริง"

  - id: wichai_a_ghost
    topic: advice
    when: { time: evening }
    npc: "เย็นแล้วครับ ผมแนะนำให้คุณกลับบ้านก่อนสามทุ่ม อบต. ไม่มีงบไฟถนนทางเข้าหมู่สอง มีแต่งบป้าย ‘ระวังผี’ ซึ่งมองไม่เห็นตอนกลางคืน เพราะไม่มีไฟครับ"
    options:
      - text: "ป้ายระวังผีแต่ไม่มีไฟ{k}"
        heart: 1
        reply: "ครับ เราเสนอเพิ่มป้ายเล็กใต้ป้ายใหญ่ว่า ‘ป้ายนี้จะเห็นได้ในเวลากลางวัน’ อยู่ระหว่างการพิจารณาครับ"
      - text: "นายกฯ กลัวผีไหม{kq}"
        heart: 2
        reply: "กลัวมากครับ ผมเช่าผ้ายันต์ที่วัดดงเย็นทุกวัน ทั้งที่ไม่เคยอยู่นอกบ้านหลังสองทุ่ม… ผมชอบผ้ายันต์ เพราะมันทำงานโดยไม่ต้องมีป้าย"

  # ===== smalltalk =====
  - id: wichai_s_koi
    topic: smalltalk
    npc: "ปลาคาร์ฟของผมมีสิบสองตัวครับ ตั้งชื่อตามโครงการที่ยังไม่เสร็จ วันนี้ผมซื้อเพิ่มสองตัว… ผมไม่ได้ภูมิใจกับตัวเลขนี้นะครับ"
    options:
      - text: "ตัวไหนอายุมากสุด{kq}"
        heart: 1
        reply: "‘ถนนหมู่สาม’ ครับ อยู่มาแปดปี ตัวใหญ่ที่สุด อ้วนที่สุด กินเก่งที่สุด… คล้ายงบที่หายไปกับมันครับ"
        next:
          - text: "ถ้าโครงการเสร็จ ปลาจะเป็นยังไง{kq}"
            heart: 2
            reply: "ผมสัญญากับตัวเองว่าจะปล่อยมันลงคลองครับ ปล่อยไปแล้วหนึ่งตัว ชื่อ ‘ศาลาหมู่ห้า’ … ผู้ใหญ่หมู่ห้าทาสีเองครับ อบต. แค่ส่งป้าย"
          - text: "ปลาคาร์ฟลงคลองจะรอดเหรอ{kq}"
            heart: 0
            reply: "ไม่แน่ใจครับ ปาล์มบอกว่าไม่ควร ผมเลยเลื่อนไปก่อน… การเลื่อนผมทำได้ดีมากครับ"
      - text: "ทำไมไม่ตั้งชื่อตามโครงการที่เสร็จแล้ว{kq}"
        heart: 1
        reply: "จะได้ปลาตัวเดียวครับ ปลาตัวเดียวในบ่อมันเหงาครับ"

  - id: wichai_s_smile
    topic: smalltalk
    npc: "ผมฝึกยิ้มถ่ายรูปหน้ากระจกทุกเช้าครับ หันสี่สิบห้าองศา เห็นฟันหกซี่ เช้านี้ผมเห็นเจ็ดซี่ ผมกังวลทั้งวัน"
    options:
      - text: "เจ็ดซี่ก็ดูยิ้มกว้างดีนะ{kq}"
        heart: 1
        reply: "กว้างเกินไปครับ เจ็ดซี่ดูเหมือนดีใจจริง ช่วงนี้ผมยังไม่มีเหตุผลให้ดีใจจริง ทีมงานแนะนำให้กลับไปหกซี่"
      - text: "ลองยิ้มแบบไม่นับฟันดูสิ{kq}"
        heart: 2
        reply: "…ไม่นับฟันเหรอครับ ผมไม่เคยคิด ผมจะลองครับ ถ้าออกมาแปลก ผมจะโทษคุณ… ในใจนะครับ ไม่โทษในที่ประชุม"
      - text: "นายกฯ ยิ้มทั้งวันไม่เมื่อยเหรอ{kq}"
        heart: 1
        reply: "เมื่อยครับ ตอนเย็นแก้มผมกระตุก ภรรยาผมนวดให้ เธอบอกว่าผมยิ้มให้ป้ายมากกว่ายิ้มให้เธอ ผมรับทราบครับ แล้วก็ยิ้มให้เธอ… หกซี่"

  - id: wichai_s_karaoke
    topic: smalltalk
    when: { time: evening }
    npc: "เย็นนี้มีคาราโอเกะที่ศาลาหมู่สองครับ ผมได้รับเชิญให้ร้องเปิด ผมร้องเพลงเดียวสามรอบตามคำเรียกร้องครับ คำเรียกร้องของทีมงานผมเอง"
    options:
      - text: "นายกฯ ร้องเพลงอะไร{kq}"
        heart: 1
        reply: "เพลงลูกทุ่งเก่าครับ เนื้อร้องว่า ‘จะรอจนกว่าจะได้กลับ’ ผมเลือกเพราะทำนองดีครับ ไม่ใช่เพราะคนฟังจะคิดถึงถนนนะครับ"
      - text: "คนอื่นได้ร้องไหม{kq}"
        heart: 1
        reply: "ได้ครับ ตามคิวที่ผมจัด ผมเชื่อว่าไมค์คาราโอเกะเป็นเครื่องมือประชาธิปไตย ทุกคนมีสิทธิ์ถือ… หลังผมครับ"
        next:
          - text: "แบบนี้ไม่ค่อยประชาธิปไตยนะ{kq}"
            heart: 2
            reply: "ฮ่า… คุณจับได้ครับ ประชาธิปไตยแบบท้องถิ่นครับ ทุกคนเท่ากัน แต่คนถือไมค์เท่ากว่าเล็กน้อย"
          - text: "{p}ขอร้องต่อจากนายกฯ{k}"
            heart: 1
            reply: "ยินดีครับ คิวที่สองเป็นของคุณ ถ้าคุณร้องดีกว่าผม ทีมงานผมจะบอกว่าไมค์มีปัญหานะครับ อย่าถือสา"
      - text: "{p}ไม่ค่อยชอบคาราโอเกะ{k}"
        heart: 0
        reply: "ไม่เป็นไรครับ ผมเองก็ไม่ชอบครับ แต่เป็นหน้าที่ ผมไม่เคยได้ร้องเพลงที่ตัวเองชอบตั้งแต่เป็นนายกฯ"

  - id: wichai_s_ribbon
    topic: smalltalk
    npc: "คุณรู้ไหมครับ กรรไกรตัดริบบิ้นที่ผมใช้ เป็นกรรไกรอันเดียวกันมาสองวาระ คมมากครับ เพราะใช้ตัดแต่ริบบิ้น ไม่เคยตัดอะไรที่มีน้ำหนัก"
    options:
      - text: "ฟังดูเหมือนเปรียบเทียบอะไรบางอย่างนะ{kq}"
        heart: 2
        reply: "…ผมไม่ได้ตั้งใจเปรียบเทียบครับ แต่พอคุณทักแล้วผมรู้สึกว่ามันใช่ คืนนี้ผมจะเอากรรไกรไปตัดกิ่งไม้หน้าบ้านดู เผื่อมันจะรู้สึกมีค่าขึ้น"
      - text: "ขอดูกรรไกรได้ไหม{kq}"
        heart: 1
        reply: "ได้ครับ ด้ามสีทอง สลักชื่อผม ทีมงานผมสั่งทำให้ เห็นไหมครับ… ชื่อผมสะกดผิดหนึ่งตัว ผมใช้มาสองวาระไม่มีใครทัก จนวันนี้"

  - id: wichai_s_rain
    topic: smalltalk
    when: { rain: true }
    npc: "ฝนตกครับ ผมยืนอยู่หน้า อบต. ดูน้ำขังครับ เรามีคณะทำงานศึกษาน้ำขังหน้า อบต. ซึ่งประชุมในห้อง อบต. ซึ่งน้ำกำลังจะเข้าครับ"
    options:
      - text: "คณะทำงานจะว่ายน้ำไปประชุมเหรอ{kq}"
        heart: 1
        reply: "เราจะย้ายไปประชุมที่ศาลาผู้ใหญ่สมศักดิ์ครับ หลังคาศาลารั่วสี่จุด แต่ผู้ใหญ่มีกะละมัง ผู้ใหญ่บริหารจัดการน้ำได้ดีกว่าเราครับ"
      - text: "ไปหลบฝนก่อน{k}นายกฯ"
        heart: 1
        reply: "ขอบคุณครับ ผมกำลังจะหลบ แต่ทีมงานบอกให้รอถ่ายรูป ‘นายกฯ ลงพื้นที่ตรวจน้ำท่วม’ ก่อนครับ ผมเปียกในนามของประชาชนครับ"

  # ===== self =====
  - id: wichai_f_term
    topic: self
    npc: "ผมเป็นนายกฯ วาระที่สองครับ กฎหมายให้ติดต่อกันไม่เกินสองวาระ ผมอ่านข้อนี้บ่อยมาก บางคืนก็อ่านด้วยความโล่งใจครับ"
    options:
      - text: "โล่งใจเหรอ{kq}"
        heart: 1
        reply: "ครับ… ถ้ากฎหมายไม่ห้าม ผมคงต้องลงไปเรื่อยๆ จนแก่ ทีมงานไม่ให้ผมหยุดครับ ผมเป็นป้ายที่ยังพูดได้ ป้ายแบบนี้หายาก"
      - text: "หมดวาระแล้วจะทำอะไร{kq}"
        heart: 1
        reply: "ผมยังไม่ได้วางแผนครับ ซึ่งแปลก เพราะผมเขียนแผนพัฒนาสามปีมาแปดเล่ม แต่ไม่มีแผนชีวิตตัวเองสักหน้า"

  - id: wichai_f_teacher
    topic: self
    when: { heart_min: 3 }
    npc: "ตอนหนุ่มผมอยากเป็นครูครับ พ่อผมบอกว่าครูไม่มีป้ายชื่อตัวใหญ่ ผมเลยเรียนรัฐศาสตร์… ตอนนี้ป้ายผมใหญ่มาก และผมยังอยากเป็นครูครับ"
    options:
      - text: "ไปสอนที่โรงเรียนครูเต้ยบ้างก็ได้นะ{kq}"
        heart: 2
        reply: "ผมเคยแอบไปนั่งฟังสภาเด็กของครูเต้ยครับ เด็กถามผมว่า ‘นายกทำงานอะไร’ ผมตอบไม่ได้สามนาที เด็กคนหนึ่งตอบแทนว่า ‘ถ่ายรูป’ ผมให้คะแนนเต็มครับ"
        next:
          - text: "เด็กพูดตรงดีนะ{k}"
            heart: 1
            reply: "ตรงที่สุดครับ ผมอยากให้สภา อบต. เป็นแบบนั้นบ้าง แต่ถ้าเป็นแบบนั้น ผมคงไม่ได้เป็นนายกฯ… ผมคิดเรื่องนี้ทั้งทางกลับบ้านครับ"
          - text: "นายกฯ จะสอนวิชาอะไร{kq}"
            heart: 2
            reply: "วิชาพูดตรงครับ… ผมคงสอบตกวิชาตัวเอง แต่ครูที่เคยสอบตกสอนดีนะครับ เขารู้ว่าตรงไหนยาก"
      - text: "เป็นนายกฯ ก็สอนคนได้นะ{kq}"
        heart: 1
        reply: "ผมสอนคนพูดวนได้ครับ ซึ่งไม่ใช่สิ่งที่ผมอยากสอน… ขอบคุณที่ปลอบนะครับ ผมรับไว้แบบไม่รับทราบ"

  - id: wichai_f_mother_sign
    topic: self
    when: { heart_min: 5 }
    npc: "ป้ายหาเสียงแผ่นแรกในชีวิตผม แม่ทำจากกระดาษลังครับ เขียนด้วยถ่านไม้ว่า ‘วิชัย คนบ้านเรา’ ผมยังเก็บไว้ใต้เตียง เป็นป้ายเดียวที่ผมไม่ได้จ่ายเงินทำ"
    options:
      - text: "ป้ายนั้นสวยที่สุดเลย{k}"
        heart: 2
        reply: "สวยที่สุดครับ… และเป็นป้ายเดียวที่ไม่มีคำว่าพัฒนา ไม่มีคำว่ายั่งยืน มีแค่ว่าผมเป็นคนบ้านเรา ตอนนั้นผมเชื่อแบบนั้นจริงๆ"
        next:
          - text: "ตอนนี้นายกฯ ยังเป็นคนบ้านเราไหม{kq}"
            heart: 2
            reply: "…คำถามนี้ผมจะไม่ตอบวนครับ ผมไม่แน่ใจครับ ผมว่าผมกลายเป็นคน อบต. ไปแล้ว คนบ้านเรากับคน อบต. ระยะทางสามกิโล แต่ไกลกันมาก"
          - text: "แม่นายกฯ ยังอยู่ไหม{kq}"
            heart: 1
            reply: "อยู่ครับ อายุแปดสิบสอง แม่ดูข่าวผมในเพจทุกวัน แล้วโทรมาถามว่า ‘ถนนบ้านตาเผือกเสร็จหรือยังลูก’ ผมตอบแม่ว่ารับทราบไม่ได้ครับ แม่ตีผม"
      - text: "ทำไมเก็บไว้ใต้เตียง{kq}"
        heart: 1
        reply: "ถ้าแขวนไว้ ผมต้องมองมันทุกวันครับ ผมยังไม่กล้า"

  - id: wichai_f_drawer
    topic: self
    when: { heart_min: 7 }
    npc: "คุณครับ ในลิ้นชักห้องทำงานผมมีสุนทรพจน์หนึ่งฉบับ ผมเขียนตอนหาเสียงวาระแรก ทุกย่อหน้าตอบคำถามตรงๆ ผมล็อกไว้ แปดปีแล้ว ยังไม่เคยเปิด"
    options:
      - text: "ทำไมไม่เปิด{kq}"
        heart: 2
        reply: "เพราะถ้าเปิดแล้วอ่าน ผมจะรู้ว่าผมเลิกเป็นคนที่เขียนมันตั้งแต่เมื่อไหร่ครับ… ผมกลัววันที่ตัวเองหายไป มากกว่ากลัวแพ้เลือกตั้ง"
        next:
          - text: "เปิดพร้อม{p}ก็ได้นะ{kq}"
            heart: 2
            reply: "…พร้อมคุณเหรอครับ ผมขอเก็บคำนี้ไว้ก่อนนะครับ ไม่ใช่รับทราบ เก็บไว้จริงๆ"
          - text: "กุญแจอยู่ไหน{kq}"
            heart: 1
            reply: "พวงเดียวกับกุญแจรถหลวงครับ ผมถือมันทุกวัน หนักกว่าที่คิด"
      - text: "อาจเป็นเรื่องดีที่ไม่ได้อ่าน{k}"
        heart: 0
        reply: "อาจจะครับ… ผมก็บอกตัวเองแบบนี้ทุกคืน และทุกคืนมันฟังดูเหมือนคำแถลงของผมเอง"

  - id: wichai_f_wife
    topic: self
    npc: "ภรรยาผมบอกว่าผมพูดวนแม้แต่ตอนขอโทษครับ เมื่อวานผมลืมวันครบรอบแต่งงาน ผมขอโทษไปสิบห้านาที เธอสรุปให้ผมว่า ‘ลืม’ คำเดียว"
    options:
      - text: "ภรรยานายกฯ สรุปเก่งนะ{k}"
        heart: 1
        reply: "เก่งที่สุดในตำบลครับ ถ้าเธอเป็นนายกฯ ประชุมจะจบในห้านาที แล้วทุกคนจะรู้ว่าต้องทำอะไร… ซึ่งน่ากลัวกว่าเดิมสำหรับข้าราชการบางคนครับ"
      - text: "แล้วนายกฯ ชดเชยยังไง{kq}"
        heart: 1
        reply: "ผมไปซื้อดอกดาวเรืองมาให้ เธอถามว่า ‘ป้ายอยู่ไหน’ ผมงงครับ แล้วผมก็เข้าใจว่าเธอแซว ผมหัวเราะ เธอหัวเราะ ผมว่านั่นคือการบูรณาการที่แท้จริง"

  # ===== others =====
  - id: wichai_o_may
    topic: others
    npc: "คุณเมย์มาถามผมว่างบถนนปี 64 ไปไหนครับ ผมตอบได้ดีมาก สิบห้านาที เธอฟังจนจบแล้วพูดว่า ‘แปลว่าไม่รู้ใช่ไหมคะ’ ผมเถียงไม่ได้ เพราะถูก"
    options:
      - text: "นายกฯ ไม่รู้จริงเหรอ{kq}"
        heart: 1
        reply: "ผมรู้ว่ามันลงมา ผมรู้ว่ามันไม่ถึงถนน ส่วนตรงกลางผมไม่รู้ครับ ตรงกลางเป็นที่ที่ทุกคนในระบบไม่รู้พร้อมกัน… ผมไม่ได้ปกป้องตัวเองนะครับ ผมเล่าเฉยๆ"
        next:
          - text: "ถ้าไม่รู้ ก็ช่วยเมย์หาสิ{kq}"
            heart: 2
            reply: "…คุณเป็นคนที่สองที่พูดแบบนี้ คนแรกคือหลานผมเจ็ดขวบ ผมเริ่มคิดว่าตัวเองตามหลังเด็กประถมอยู่หนึ่งก้าว"
          - text: "เมย์เก่งนะ{kq}"
            heart: 1
            reply: "เก่งมากครับ ผมนับถือ นับถือแบบหลบทางเธอทุกครั้งที่เจอที่ตลาดครับ"
      - text: "นายกฯ กลัวเมย์ไหม{kq}"
        heart: 1
        reply: "กลัวครับ แต่ไม่ได้กลัวเธอ ผมกลัวคำถามที่ตอบไม่ได้ เธอแค่เป็นคนเดียวที่ถามมันออกมาดังๆ"

  - id: wichai_o_heng
    topic: others
    npc: "เสี่ยเฮงสนับสนุนป้ายอวยพรปีใหม่ให้ผมทุกปีครับ ขอแค่โลโก้ร้านเขาเท่ากับชื่อผม ปีนี้โลโก้เขาใหญ่กว่าชื่อผมนิดหน่อยครับ ทีมงานผมวัดได้สามเซนต์"
    options:
      - text: "นายกฯ ยอมเหรอ{kq}"
        heart: 1
        reply: "ผมทำหนังสือขอให้แก้ครับ เสี่ยตอบกลับว่า ‘รับทราบ’ ผมเพิ่งรู้ว่ามันรู้สึกยังไงเวลาได้ยินคำนี้ครับ… ผมจะใช้คำนี้น้อยลง"
      - text: "ญาติเสี่ยได้งานรับเหมาถนนด้วยใช่ไหม{kq}"
        heart: 0
        reply: "ผู้รับเหมาถนนเป็นญาติของเสี่ยครับ และเป็นญาติของผมด้วย ตำบลเราเล็ก ทุกคนเป็นญาติกัน ผมพูดเรื่องนี้ในทุกการสอบสวนครับ ยังไม่มีการสอบสวนครับ"
        next:
          - text: "ญาติกันก็ควรระวังกว่าเดิมนะ{kq}"
            heart: 2
            reply: "…ภรรยาผมพูดประโยคนี้เป๊ะครับ เธอพูดมาสองวาระแล้ว ผมรับทราบมาสองวาระ ผมคิดว่าถึงเวลาเปลี่ยนจากรับทราบเป็นอย่างอื่นแล้วครับ"
          - text: "ช่างมันเถอะ{k}"
            heart: -1
            reply: "ครับ ช่างมัน… ประโยคนี้ช่วยให้ผมอยู่มาสองวาระครับ ผมไม่แน่ใจว่าควรขอบคุณมันไหม"

  - id: wichai_o_palm
    topic: others
    npc: "ปาล์มเป็นคนทำงานจริงที่สุดใน อบต. ครับ ผมพูดในที่ประชุมบ่อยๆ ว่า ‘ปาล์มจัดการเลยครับ’ ผมเพิ่งรู้ว่าผมพูดประโยคนี้วันละสิบครั้ง ปาล์มจัดการวันละสิบเรื่อง"
    options:
      - text: "ปาล์มเหนื่อยแย่เลย{k}"
        heart: 1
        reply: "ครับ… เมื่อวานผมเห็นเธอนั่งใต้ต้นมะขามหน้า อบต. เขียนอะไรในสมุดแล้วฉีกทิ้ง ผมไม่กล้าถาม ผมกลัวว่าเป็นจดหมายลาออก แล้วผมต้องรับทราบ"
        next:
          - text: "นายกฯ ควรช่วยปาล์มบ้างนะ{kq}"
            heart: 2
            reply: "ผมเซ็นงบเมล็ดพันธุ์ให้เธอแล้วครับ ภายในสามวินาที ไม่ผ่านคณะกรรมการ… ผมรู้สึกเหมือนทำผิด แต่รู้สึกดีมากครับ ผมจะลองทำผิดแบบนี้อีก"
          - text: "ถ้าปาล์มลาออกจะทำไง{kq}"
            heart: 0
            reply: "อบต. จะเหลือแต่คนรับทราบครับ แล้วผมจะต้องจัดการเอง… ผมไม่รู้วิธีจัดการครับ ผมรู้แต่วิธีพูดว่าปาล์มจัดการ"
      - text: "ปาล์มส่งรายงานบ่อน้ำแล้วใช่ไหม{kq}"
        heart: 0
        reply: "ส่งครับ… อยู่ในลิ้นชักผม ลิ้นชักเดียวกับสุนทรพจน์ของผม ลิ้นชักนั้นเก็บแต่ความจริงครับ ล็อกไว้ทั้งสองอย่าง"

  - id: wichai_o_thana
    topic: others
    npc: "คุณธนามีวิสัยทัศน์ครับ ภาษาเขาสวยกว่าผมอีก เขาเรียกการดูดน้ำว่า ‘การบริหารทรัพยากรใต้ดินอย่างมีประสิทธิภาพ’ ผมจดไว้ในสมุดคำศัพท์ครับ"
    options:
      - text: "นายกฯ จดศัพท์ของเขาไปใช้เหรอ{kq}"
        heart: 1
        reply: "จดครับ… แต่ผมรู้สึกแปลกๆ ทุกครั้งที่จด ศัพท์ผมวนเพื่อเอาตัวรอด ศัพท์เขาวนเพื่อเอาของคนอื่น ผมยังไม่แน่ใจว่าอันไหนแย่กว่ากันครับ"
      - text: "เขาเก่งกว่านายกฯ อีกนะ{kq}"
        heart: 1
        reply: "เก่งกว่าครับ เขาวนแล้วได้ใบอนุญาต ผมวนแล้วได้แค่วาระที่สอง… อันนี้ผมพูดตลกนะครับ แต่ผมฟังแล้วไม่ตลกเลย"

  - id: wichai_o_somsak
    topic: others
    npc: "ผู้ใหญ่สมศักดิ์ทำหนังสือขอหินคลุกมาฉบับที่สี่แล้วครับ ผมตอบว่า ‘รับทราบด้วยความห่วงใยอย่างยิ่ง’ ผมเพิ่มคำว่า ‘อย่างยิ่ง’ เพราะผมห่วงใยจริงๆ ครับ แต่หินไม่มี"
    options:
      - text: "ทำไมหินไม่มี{kq}"
        heart: 1
        reply: "หินมีครับ อยู่ที่ลานเสี่ยเฮง กองสูงสองเมตร รอถนนเส้นที่ผ่านลานเสี่ยก่อน… ผมเพิ่งพูดว่าอะไรครับ ผมขอถอนครับ ผมเหนื่อย"
      - text: "ผู้ใหญ่จะเกษียณแล้วนะ{kq}"
        heart: 2
        reply: "ผมรู้ครับ… ผมอยากให้หินคลุกถึงหมู่สามก่อนผู้ใหญ่เกษียณ เป็นของขวัญ ผมไม่เคยให้ของขวัญที่ไม่มีป้าย ผมกำลังคิดว่าจะทำยังไง"

  - id: wichai_o_sathian
    topic: others
    npc: "ดาบเสถียรกับผมยึดหลักเดียวกันครับ ไม่รีบร้อนตัดสินใจในทุกเรื่อง ต่างกันตรงที่ดาบนอนตอนไม่ตัดสินใจ ผมประชุมครับ"
    options:
      - text: "อันไหนดีกว่ากัน{kq}"
        heart: 1
        reply: "ของดาบดีกว่าครับ ประหยัดงบเบี้ยประชุม และดาบตื่นมายังรู้ว่าเรื่องอะไรสำคัญ ผมประชุมเสร็จบางทียังไม่รู้"
      - text: "ได้ยินว่าดาบเคยขยันมาก{k}"
        heart: 1
        reply: "ผมได้ยินเหมือนกันครับ ได้ยินว่าขยันกับคนผิดคน คนนั้นตอนนี้นั่งตำแหน่งสูงกว่าผม… ผมเลยเลือกขยันน้อยๆ ครับ ไม่ใช่เพราะขี้เกียจ เพราะกลัว"

quests:
  - id: wichai_q1
    npc: wichai
    title: "นับป้าย"
    desc: "นายกฯ อยากรู้ว่าป้ายโครงการในตำบลกี่ป้ายที่มีของจริงอยู่ข้างหลัง ขอให้ไปดูป้ายฝายที่คลองกับป้ายประปาที่หอถังน้ำ"
    start: { heart_min: 1, day_min: 5 }
    offer:
      npc: "คุณครับ ผมขอความช่วยเหลือแบบไม่เป็นทางการ คุณเมย์ถามผมว่าป้ายโครงการกี่ป้ายที่มีโครงการจริง ผมตอบไม่ได้ครับ… ผมไม่กล้าไปดูเอง ถ้าผมไปคนจะถ่ายรูป ช่วยไปดูป้ายฝายที่คลองกับป้ายระบบประปาที่หอถังน้ำให้หน่อยได้ไหมครับ"
      options:
        - text: "ได้{k} {p}จะไปดูให้"
          accept: true
          heart: 1
          reply: "ขอบคุณครับ อย่าบอกใครนะครับว่าผมให้ไปดู ถ้ามีคนถาม บอกว่าคุณเดินเล่น ซึ่งเป็นความจริงครึ่งหนึ่ง ผมถนัดความจริงครึ่งหนึ่งครับ"
        - text: "นายกฯ ไม่รู้จริงเหรอว่ามีอะไรหลังป้าย{kq}"
          accept: true
          heart: 1
          reply: "ผมรู้ในรายงานครับ รายงานบอกว่าเสร็จร้อยเปอร์เซ็นต์ แต่รายงานมีรูปแค่ป้าย… ผมอยากรู้ด้วยตาคนอื่นครับ ตาผมเชื่อรายงานจนชินแล้ว"
        - text: "ให้ทีมงานไปดูสิ{k}"
          heart: 0
          reply: "ทีมงานจะไปถ่ายรูปป้ายกลับมาครับ… เหมือนเดิม นั่นแหละปัญหา"
    steps:
      - goal: { type: visit, place: canal, from: "16:00", to: "18:30" }
        hint: "ไปดูป้ายโครงการฝายที่คลองส่งน้ำตอนเย็น"
        done:
          npc: "คุณไปดูมาแล้วใช่ไหมครับ… ป้ายฝายอยู่ครบ แต่ฝายไม่มี มีแต่กระสอบทรายสามใบที่ชาวบ้านวางเอง ผมเดาถูกไหมครับ"
          options:
            - text: "ถูก{k} กระสอบทรายสามใบกับป้ายใหญ่หนึ่งป้าย"
              heart: 1
              reply: "ป้ายใหญ่กว่าฝายครับ… ฝายในรายงานยาวสิบสองเมตร ผมเซ็นรับงานเองครับ ผมจำลายเซ็นตัวเองได้ สวยมาก"
            - text: "ป้ายมีรูปนายกฯ ยิ้มด้วย{k}"
              heart: 1
              reply: "หกซี่ใช่ไหมครับ… ผมยิ้มให้ฝายที่ไม่มีอยู่จริง ผมรู้สึกเหมือนยิ้มให้ผี"
      - goal: { type: visit, place: water_tower, from: "06:00", to: "09:00" }
        hint: "ไปดูป้ายระบบประปาที่หอถังน้ำตอนเช้า"
        done:
          npc: "หอถังน้ำครับ… ป้ายบอกว่า ‘ระบบประปาหมู่บ้านแบบผิวดินขนาดใหญ่ เสร็จสมบูรณ์’ คุณเห็นอะไรครับ"
          options:
            - text: "ถังมีน้ำครึ่งเดียว ก๊อกตันสองตัว แต่ยังใช้ได้{k}"
              heart: 2
              set_flag: wichai_q1_half
              reply: "ครึ่งเดียว… ครึ่งเดียวก็ยังดีกว่าฝายครับ ผมจะเขียนบอกคุณเมย์ว่า ‘สองป้าย ของจริงครึ่งหนึ่ง’ ผมไม่เคยเขียนตัวเลขที่ไม่ใช่ร้อยเปอร์เซ็นต์มาก่อน มือผมสั่นครับ"
            - text: "นายกฯ ไปดูเองดีกว่า{k}"
              heart: 1
              set_flag: wichai_q1_go
              reply: "…ได้ครับ พรุ่งนี้เช้าผมจะไปเอง ไม่พาช่างภาพ ถ้ามีใครเห็นผมยืนมองถังน้ำคนเดียว ช่วยบอกเขาว่าผมไม่ได้เป็นบ้านะครับ ผมแค่มาสาย"
    reward: { money: 150, heart: 1, set_flag: wichai_q1_done }

  - id: wichai_q2
    npc: wichai
    title: "กาแฟสองแก้ว"
    desc: "นายกฯ อยากลองพูดตรงๆ สักเรื่อง แต่ต้องการความกล้า ซื้อกาแฟเย็นจากร้านกาแฟไปนั่งคุยกับเขา"
    start: { flag: wichai_q1_done, heart_min: 3, day_min: 9 }
    offer:
      npc: "คุณครับ ผมอยากลองอะไรครับ ผมอยากลองตอบคำถามตรงๆ สักเรื่องกับคนจริง ไม่ใช่กระจก… แต่ผมต้องมีกาแฟครับ กาแฟเย็นร้านแพรวสองแก้ว แก้วนึงของผม แก้วนึงของคุณ ผมจะคืนเงินให้ครับ ไม่ผ่านงบ อบต."
      options:
        - text: "ได้{k} {p}จะเอากาแฟไปให้"
          accept: true
          heart: 1
          reply: "ขอบคุณครับ หวานน้อยนะครับ หมอแอนบอกน้ำตาลผมสูง… ผมไม่ได้บอกใครเรื่องน้ำตาลนะครับ นี่ก็นับเป็นความจริงข้อแรก"
        - text: "นายกฯ อยากให้ถามเรื่องอะไร{kq}"
          accept: true
          heart: 1
          reply: "เรื่องอะไรก็ได้ครับ ยกเว้น… ไม่ครับ ไม่มียกเว้น ถ้ามียกเว้นมันก็คือการแถลงข่าว"
        - text: "นายกฯ ไปซื้อเองก็ได้นี่{kq}"
          heart: 0
          reply: "ถ้าผมไปร้านกาแฟ คุณแพรวจะไลฟ์ครับ ผมไม่อยากเป็นคอนเทนต์ของลูกกำนันตอนกำลังจะพูดความจริง"
    steps:
      - goal: { type: give, npc: wichai, item: iced_coffee, n: 2 }
        hint: "ซื้อกาแฟเย็น 2 แก้วที่ร้านกาแฟ แล้วเอาไปให้นายกฯ ที่ อบต."
        done:
          npc: "ครับ… ผมดื่มแล้ว ถามมาเลยครับ ผมพร้อม หัวใจเต้นเร็วครับ อาจเป็นกาแฟ หรืออาจเป็นความจริง"
          options:
            - text: "งบถนนหมู่สามไปไหน{kq}"
              heart: 2
              set_flag: wichai_q2_road
              reply: "…งบลงมาหนึ่งล้านสองครับ ถูกหักเป็นค่าศึกษาความเป็นไปได้สี่แสน ไปบริษัทที่ปรึกษาของน้องเขยผม อีกห้าแสนไปผู้รับเหมาซึ่งเป็นญาติเสี่ยเฮง ส่วนที่เหลือทำป้ายกับถนนสามร้อยเมตร… ผมพูดออกมาแล้วครับ ผมพูดออกมาแล้ว"
            - text: "นายกฯ มีความสุขไหม{kq}"
              heart: 2
              set_flag: wichai_q2_happy
              reply: "ไม่ครับ… ผมไม่เคยมีใครถามคำถามนี้ในห้องนี้ ผมไม่มีความสุขมาสองวาระ ผมมีแต่ภาพถ่ายที่ดูมีความสุข สามแสนรูปครับ"
            - text: "ทำไมบ่อปลาคาร์ฟนายกฯ มีสิบสองตัว{kq}"
              heart: 1
              reply: "ฮ่า… คุณใจดีครับ ถามเรื่องง่ายให้ผมก่อน เพราะโครงการค้างสิบสองโครงการครับ ตอบตรงแล้ว รู้สึกโล่งแปลกๆ ครับ"
    sold_at: { iced_coffee: coffee }
    reward: { money: 150, heart: 2, set_flag: wichai_q2_done }

  - id: wichai_q3
    npc: wichai
    title: "สภาเด็ก"
    desc: "นายกฯ จะไปตอบคำถามสภาเด็กของครูเต้ยที่โรงเรียน ขอให้ไปนั่งเป็นกำลังใจ"
    start: { flag: wichai_q2_done, heart_min: 4, day_min: 13 }
    offer:
      npc: "ครูเต้ยเชิญผมไปตอบคำถามสภาเด็กครับ บ่ายสองโมง ผมตอบผู้ใหญ่ได้ทุกคำถาม แต่เด็กไม่ยอมรับ ‘ในส่วนของ’ ครับ… คุณไปนั่งข้างหลังได้ไหมครับ ถ้าผมเริ่มวน คุณไอให้ผมหนึ่งที"
      options:
        - text: "ได้{k} {p}จะไอดังๆ"
          accept: true
          heart: 1
          reply: "ไอเบาๆ ก็พอครับ เด็กจะคิดว่าคุณป่วย แล้วครูเต้ยจะพาคุณไปหาหมอแอน ผมจะเหลือคนเดียว"
        - text: "นายกฯ กลัวเด็กเหรอ{kq}"
          accept: true
          heart: 1
          reply: "กลัวที่สุดครับ เด็กถามแล้วรอคำตอบ ผู้ใหญ่ถามแล้วรอข้าวกล่อง ต่างกันมากครับ"
        - text: "{p}ไม่ว่าง{k}"
          heart: 0
          reply: "ไม่เป็นไรครับ ผมจะไปคนเดียว… ผมจะเอาข้าวกล่องไปด้วยเผื่อเด็กเปลี่ยนใจ ล้อเล่นครับ ผมจะไม่เอาไป ผมจะลอง"
    steps:
      - goal: { type: visit, place: school, from: "14:00", to: "15:30" }
        hint: "ไปโรงเรียนตอนบ่ายสองถึงบ่ายสามครึ่ง นั่งดูนายกฯ ตอบคำถามสภาเด็ก"
        done:
          npc: "เด็กผู้หญิงแถวหน้าถามผมว่า ‘ทำไมถนนหน้าบ้านหนูเป็นหลุมตั้งแต่หนูเกิด’ ผมเริ่มพูดว่า ‘ในส่วนของ…’ แล้วคุณไอ… ผมเลยตอบว่า ‘เพราะลุงยังทำไม่ได้ครับ ขอโทษนะ’ เด็กปรบมือครับ ปรบมือให้คำขอโทษ"
          options:
            - text: "นายกฯ ทำได้ดีมาก{k}"
              heart: 2
              reply: "ผมไม่เคยได้รับเสียงปรบมือแบบนี้ครับ ไม่ใช่ปรบเพราะต้องปรบ ปรบเพราะเขาอยากปรบ… ผมขอยืนตรงนี้แป๊บนะครับ ลมเข้าตา ผมยืมประโยคผู้ใหญ่สมศักดิ์ครับ"
            - text: "แต่ขอโทษแล้วต้องทำต่อด้วยนะ{kq}"
              heart: 2
              reply: "ครับ… ครูเต้ยก็พูดแบบนี้หลังเลิกสภา แล้วเด็กคนนั้นเดินมาให้ลูกอมผมหนึ่งเม็ด บอกว่า ‘ให้ลุงตอนทำเสร็จ แต่ให้ก่อน’ ผมจะเก็บไว้ในลิ้นชักครับ ข้างสุนทรพจน์"
            - text: "ครูเต้ยว่าไงบ้าง{kq}"
              heart: 1
              reply: "ครูเต้ยบอกว่า ‘นายกฯ ตอบดีกว่าปีที่แล้วเยอะค่ะ ปีที่แล้วเด็กหลับสามคน’ ผมรับคำวิจารณ์นี้ด้วยความยินดีครับ"
    reward: { money: 200, heart: 2, set_flag: wichai_q3_done }

  - id: wichai_q4
    npc: wichai
    title: "สุนทรพจน์ในลิ้นชัก"
    desc: "นายกฯ จะเปิดลิ้นชักในวันประชุมประชาคม แต่ยังไม่รู้จะทำยังไงกับสุนทรพจน์ที่ตอบทุกคำถามตรงๆ"
    start: { flag: wichai_q3_done, heart_min: 6, day_min: 19 }
    offer:
      npc: "คุณครับ… ผมเปิดลิ้นชักแล้วครับ เมื่อคืน สุนทรพจน์ยังอยู่ กระดาษเหลือง ลายมือผมตอนสามสิบเอ็ด อ่านแล้วผมไม่รู้จักคนเขียน… พรุ่งนี้มีประชุมประชาคม ผมอยากให้คุณมาครับ ผมยังไม่รู้ว่าจะทำอะไรกับมัน แต่ผมอยากให้มีคนที่รู้อยู่ในห้อง"
      options:
        - text: "{p}จะไป{k} ไม่ว่านายกฯ จะเลือกอะไร"
          accept: true
          heart: 2
          reply: "ขอบคุณครับ ไม่ว่าผมจะเลือกอะไร… ประโยคนี้ผมเคยใช้ในแถลงการณ์ แต่วันนี้ได้ยินจากคุณแล้วมันมีความหมายครับ"
        - text: "อ่านมันเถอะ{k}นายกฯ"
          accept: true
          heart: 1
          reply: "ผมอาจจะอ่านครับ หรือผมอาจจะไม่อ่าน… ผมยังวนอยู่ครับ ให้ผมวนอีกคืนเดียว"
        - text: "ไม่อยากเห็นนายกฯ เดือดร้อน{k}"
          heart: 0
          reply: "ขอบคุณครับ… ผมเดือดร้อนอยู่แล้วครับ แค่เดือดร้อนเงียบๆ มาแปดปี"
    steps:
      - goal: { type: visit, place: sala, from: "09:00", to: "11:30" }
        hint: "ไปประชุมประชาคมที่ศาลาตอนเช้า (09:00–11:30)"
        done:
          npc: "ทุกคนนั่งแล้วครับ กำนันยังไม่หลับ ผู้ใหญ่ปูเสื่อเพิ่ม คุณเมย์นั่งแถวหน้า… กระดาษอยู่ในกระเป๋าเสื้อผม คุณครับ ผมขอถามคุณครั้งสุดท้ายแบบไม่วน ผมควรทำยังไงครับ"
          options:
            - text: "อ่านออกไมค์เลย{k} ให้ทั้งตำบลได้ยิน"
              heart: 2
              set_flag: wichai_q_honest
              reply: "…‘พี่น้องครับ ถนนหมู่สามยังไม่ได้ทำ เพราะงบถูกแบ่งไปศึกษาความเป็นไปได้ให้บริษัทที่ผมรู้จัก ผมขอโทษ ผมจะขอให้ตรวจสอบ เริ่มจากโครงการของผมเอง’ …ศาลาเงียบครับ แล้วผู้ใหญ่สมศักดิ์ปรบมือเป็นคนแรก ผมขอให้คุณช่วยปรบเป็นคนที่สองครับ"
            - text: "ให้เมย์เอาไปลงข่าวทั้งฉบับ{k}"
              heart: 1
              set_flag: wichai_q_may
              reply: "ผมยื่นกระดาษให้คุณเมย์ตอนพักครับ เธออ่านหน้าแรกแล้วมองผมนานมาก บอกว่า ‘นายกฯ รู้ไหมคะว่านี่คืออะไร’ ผมตอบว่า ‘รู้ครับ’ …สองคำที่ตรงที่สุดในชีวิตผม"
            - text: "เก็บไว้ก่อน รอให้พร้อมกว่านี้{k}"
              heart: 0
              set_flag: wichai_q_circle
              reply: "ครับ… ผมจะกล่าวเปิดสี่สิบนาทีเหมือนเดิม คำว่าขับเคลื่อนสิบสองครั้ง แต่ผมจะพกกระดาษไว้ในกระเป๋าเสื้อทุกวันจากนี้ไปครับ ใกล้หัวใจ ไม่ใช่ในลิ้นชักแล้ว"
    reward: { money: 300, heart: 2, items: { mango_sticky: 1 }, set_flag: wichai_q4_done, line: { from: wichai, text: "เรียนพี่น้องชาวตำบลบ้านดงเย็นครับ ผมขอบคุณทุกท่านที่มาประชุมวันนี้ วันนี้ผมขอโพสต์สั้นครับ ขอบคุณครับ 🙏 (โพสต์นี้ไม่มีรูปประกอบครับ)" } }
