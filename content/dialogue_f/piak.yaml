# ช่างเปี๊ยก — บทคุยเฉพาะผู้เล่นหญิง (gender: f) · ห้าวแต่ใจดี ศัพท์ช่าง ยอมรับฝีมือคนที่ทำจริง
convos:
  - id: piak_f_r_roof
    topic: react
    once: true
    when: { gender: f, flag: story_first_rain }
    npc: "ได้ข่าวว่าหลังคาครัวยายรั่ว เดี๋ยวพี่ขึ้นไปดูให้นะ ผู้หญิงอย่าขึ้นหลังคาเลย กระเบื้องเก่า ลื่น… อ้าว นี่ขึ้นไปแล้วเหรอ"
    options:
      - text: "ขึ้นไปแล้ว{k} เปลี่ยนกระเบื้องไปสามแผ่น"
        heart: 2
        reply: "สามแผ่น! ซ้อนถูกทางไหมนั่น… (เงยหน้ามอง) เออ ถูก ได้แนวด้วย ใครสอนวะ"
        next:
          - text: "ดูคลิปเอา{k}"
            heart: 1
            reply: "คลิป! พี่เรียนกับพ่อสิบปี เด็กเรียนคลิปสิบนาที… ได้แนวเท่ากันอีก พี่เสียใจกับชีวิตนิดนึง แต่ดีใจด้วยเว้ย"
          - text: "ยายสอนตอนเด็ก{k}"
            heart: 2
            reply: "ยายเพียรขึ้นหลังคาเองจนอายุเจ็ดสิบ พ่อพี่ห้ามไม่ได้ พี่ก็ห้ามไม่ได้… งั้นพี่ไม่ห้ามหลานแล้ว ขออย่างเดียว อย่าขึ้นตอนฝนตก ตอนนั้นใครขึ้นก็ตกเท่ากัน"
      - text: "ยังไม่ได้ขึ้น{k} รอพี่อยู่"
        heart: 1
        reply: "ดี พรุ่งนี้เช้าพี่ไป ขึ้นไปดูด้วยกัน พี่สอนเปลี่ยนครั้งเดียว ครั้งหน้าไม่ต้องรอพี่ ช่างในตำบลมีคนเดียว คิวยาวกว่ารถเมล์ลุงเชิด"
      - text: "ทำไมผู้หญิงขึ้นไม่ได้{kq}"
        heart: 1
        reply: "…ขึ้นได้ พี่พูดไปตามปาก พ่อพี่พูดงี้ พี่ก็พูดงี้ กระเบื้องมันไม่ได้ถามว่าใครเหยียบนะ มันถามว่าเหยียบตรงแปหรือเปล่า"

  - id: piak_f_n_hiring
    topic: news
    when: { gender: f, day_min: 8 }
    npc: "บริษัทติดประกาศรับคนงานสร้างโกดังเพิ่ม เขียนตัวเบ้อเริ่มว่า ‘ช่างปูน เฉพาะชาย วันละแปดร้อย’ ข้างล่างตัวเล็กเขียน ‘แม่บ้านทำความสะอาด หญิง วันละสามร้อย’… ปูนถุงเดียวกัน คนผสมได้เงินไม่เท่ากัน"
    options:
      - text: "แต่ที่ตำบลนี้ผู้หญิงก็ผสมปูนนะ{kq}"
        heart: 1
        reply: "ผสม! ทีมพี่มีป้าสองคนจากหมู่สี่ ผสมปูนเนียนกว่าพี่อีก พี่จ่ายเท่าผู้ชาย ไม่งั้นป้าไม่มา แล้วงานพี่จะช้ากว่านี้"
        next:
          - text: "พี่เปี๊ยกจ่ายเท่ากันตั้งแต่แรกเลยเหรอ{kq}"
            heart: 1
            reply: "…ปีแรกไม่เท่า ป้าเลยผสมปูนเหลวให้พี่หนึ่งกระบะ เทพื้นไปสามวันไม่แข็ง ตั้งแต่นั้นพี่จ่ายเท่า บทเรียนราคาแพงเว้ย"
          - text: "{p}ไปสมัครแม่บ้านแล้วผสมปูนเลยดีไหม{kq}"
            heart: 1
            reply: "ฮ่าๆ เอาเลย แต่ระวังนะ เขาจะให้ผสมปูนในราคาแม่บ้าน… บริษัทใหญ่เก่งเรื่องนี้ ทำสองอย่าง ได้เงินครึ่งอย่าง"
      - text: "แปดร้อยก็เยอะนะ{k}"
        heart: 0
        reply: "เยอะ ช่างตำบลไปแล้วสามคน งานวัดพี่ทำคนเดียว… ถ้าได้แปดร้อยทุกคนพี่ไม่ว่าเลย นี่ได้แปดร้อยแค่ครึ่งตำบล"

  - id: piak_f_a_drill
    topic: advice
    when: { gender: f }
    npc: "จะใช้สว่านเองใช่ไหม ฟังพี่ จับสองมือ ยืนให้มั่น ห้ามใส่ถุงมือผ้าตอนเจาะ มันพันดอกสว่าน… พี่ไม่ได้สอนเพราะเป็นผู้หญิงนะเว้ย พี่สอนทุกคน บอลยังโดนสว่านพันถุงมือมาแล้ว"
    options:
      - text: "บอลโดนจริงเหรอ{kq}"
        heart: 1
        reply: "จริง ถุงมือหมุนไปสามรอบ บอลร้องเหมือนแพะ แล้วบอกทุกคนว่าเป็นเสียงเครื่อง… อย่าไปบอกบอลนะว่าพี่เล่า"
      - text: "{p}ยืมสว่านพี่ได้ไหม{kq}"
        heart: 1
        reply: "ได้ แต่คืนด้วยนะ ตาเผือกยืมไปสามปียังไม่คืน บอกว่าใช้เจาะคอกควาย… คอกควายเจาะสามปีเว้ย"
      - text: "{p}ใช้สว่านเป็นตั้งแต่อยู่กรุงเทพฯ{k}"
        heart: 1
        reply: "เออ งั้นดี ห้องเช่าใช่ไหม เจาะผนังแขวนรูปแล้วโดนหักเงินมัดจำ… พี่รู้ พี่เคยเป็นคนรับจ้างอุดรู"

  - id: piak_f_s_wife_measure
    topic: smalltalk
    when: { gender: f }
    npc: "บอกให้นะ เมียพี่วัดเก่งกว่าพี่ ตลับเมตรแม่นสุดในบ้าน แต่ลูกค้ามาทีไรก็ถาม ‘ช่างวัดเองใช่ไหม’ พี่ก็พยักหน้า… ความจริงเมียพี่วัด พี่ตอก"
    options:
      - text: "บอกลูกค้าไปตรงๆ สิ{k}"
        heart: 1
        reply: "บอกแล้วครั้งนึง ลูกค้าขอให้พี่วัดซ้ำ พี่วัดเพี้ยนไปสองเซน เมียพี่ยืนหัวเราะ… ตั้งแต่นั้นพี่พยักหน้าอย่างเดียว ปลอดภัยกว่า"
      - text: "พี่เปี๊ยกยอมรับด้วยเหรอ{kq}"
        heart: 1
        reply: "ยอมรับกับหลานคนเดียว ในตำบลเขาเชื่อว่าพี่วัดแม่น พี่ไม่อยากให้ฐานรากชื่อเสียงทรุด"

  - id: piak_f_f_coop
    topic: self
    when: { gender: f, heart_min: 4 }
    npc: "พี่ยอมรับนะ ตอนหลานบอกว่าจะซ่อมเล้าไก่เอง พี่คิดในใจว่าเดี๋ยวก็มาเรียกพี่ เตรียมคิดค่าแรงไว้แล้ว… เมื่อวานพี่แวะไปดู ได้ฉาก ได้ดิ่ง พี่ยืนดูนานจนไก่ไล่"
    options:
      - text: "พี่เปี๊ยกชมเหรอ{kq} {p}ฟังไม่ผิดใช่ไหม"
        heart: 2
        reply: "ชม แต่ชมครั้งเดียวนะ พี่ไม่ชมใครเกินปีละสองครั้ง ครั้งแรกปีนี้ให้ลุงเชิดตอนถอยเจ้าเขียวเข้าซอยแคบ… หลานเป็นครั้งที่สอง ปีนี้หมดโควตาแล้ว"
        next:
          - text: "งั้นปีหน้าขอจองไว้ก่อน{k}"
            heart: 1
            reply: "จองได้ จดในสมุดหน้าเดียวกับตาเผือก… ไม่เอา หน้านั้นซวย พี่ขึ้นหน้าใหม่ให้"
          - text: "พี่คิดว่า{p}จะทำไม่ได้เหรอ{kq}"
            heart: 1
            reply: "คิด… พี่ขอโทษ ไม่ได้คิดว่าหลานทำไม่เป็นนะ พี่คิดว่าผู้หญิงไม่ชอบงานพวกนี้ ทั้งที่เมียพี่วัดเก่งกว่าพี่อีก พี่ควรรู้ตั้งนานแล้วเว้ย"
      - text: "จริงๆ ก็เกือบล้ม{k} แต่แก้ทัน"
        heart: 1
        reply: "นั่นแหละช่าง ช่างไม่ใช่คนไม่พลาด ช่างคือคนแก้ทันก่อนเจ้าของบ้านเห็น… ผ่านแล้ว ยินดีต้อนรับเข้าวงการปวดหลังเว้ย"

  - id: piak_f_o_payao_stage
    topic: others
    when: { gender: f, flag: story_posters }
    npc: "คุณนายพเยาว์จ้างพี่ทำเวทีปราศรัย… คนสั่งงาน คนตรวจงาน คนจ่ายเงิน คุณนายคนเดียว นายกมาถ่ายรูปตอนเสร็จ ยืนกลางเวที ชี้ขึ้นฟ้าเหมือนสร้างเอง"
    options:
      - text: "คุณนายจ่ายตรงไหม{kq}"
        heart: 1
        reply: "ตรง! ตรงกว่าลูกค้าผู้ชายทุกคนในตำบล ตรวจงานเองด้วย เอาตลับเมตรมาเอง… พี่ชอบลูกค้ามีตลับเมตร ไม่เถียงด้วยปาก เถียงด้วยตัวเลข"
      - text: "นายกเขาถนัดถ่ายรูป{k}"
        heart: 1
        reply: "ถนัดสุดในอำเภอ… ศาลาหลังวัดปู่พี่สร้าง นายกมีรูปยืนหน้าศาลาสามรูป ไม่มีรูปปู่พี่สักรูปเว้ย"
