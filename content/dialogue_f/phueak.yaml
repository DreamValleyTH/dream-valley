# ตาเผือก — บทคุยเฉพาะผู้เล่นหญิง (gender: f) · พูดช้า สั้น เปรียบกับควาย เปลี่ยนความคิดได้ช้าๆ แต่จริงใจ
convos:
  - id: phueak_f_r_rope
    topic: react
    once: true
    when: { gender: f, day_min: 3 }
    npc: "…เขาว่าเอ็งอยากหัดเลี้ยงควาย ตาคิดทั้งคืน… ผู้หญิงจูงควายไม่ไหวหรอกหลาน"
    options:
      - text: "ยายสายเคยจูงควายไหม{kq}"
        heart: 2
        reply: "…จูง อีแดงรุ่นแม่ ตัวดุสุดในคอก ฟังเมียตาคนเดียว (เงียบนาน) …ตาพูดผิดเว้ย ไม่ใช่ไม่ไหว ตาแค่ไม่เคยเห็นผู้หญิงรุ่นเอ็งจูง"
        next:
          - text: "งั้นให้{p}ลองจูงอีแดงดู{k}"
            heart: 2
            reply: "…พรุ่งนี้ตีห้า อย่าดึงเชือก ให้มันเห็นหน้าเอ็งก่อน… ถ้ามันเดินตาม ตาไม่พูดอะไรอีก"
          - text: "ตาคิดทั้งคืนเลยเหรอ{kq}"
            heart: 1
            reply: "ทั้งคืน… ควายไม่คิดนาน เห็นหญ้าก็กิน ตาคิดนานกว่าควายเยอะ ตาแก่แล้ว"
      - text: "ไม่ลองจะรู้ได้ไง{kq}"
        heart: 1
        reply: "…ก็จริง ไอ้ทุยยังไม่รู้เลยว่ามันไถนาได้ จนตาใส่แอก… มาตีห้า"
      - text: "ไม่เลี้ยงก็ได้{k}"
        heart: 0
        reply: "…อืม ตาก็ไม่ได้ว่าอะไร ควายไม่บังคับใคร"

  - id: phueak_f_n_palm_vaccine
    topic: news
    when: { gender: f, day_min: 5 }
    npc: "ปาล์มมาฉีดวัคซีนควายเมื่อเช้า… ลุงสมหมายถามว่า อบต. ไม่มีเจ้าหน้าที่ผู้ชายเหรอ ควายมันแรง ปาล์มไม่ตอบ เดินไปจับอีแดงเลย… อีแดงยืนนิ่ง"
    options:
      - text: "อีแดงไม่เคยยอมใครเหรอ{kq}"
        heart: 1
        reply: "…ไม่เคย ลุงสมหมายโดนเตะมาสองที ปีที่แล้ว… วันนี้ลุงยืนห่างปาล์มห้าวา ถือสำลีให้อย่างเดียว"
      - text: "ควายไม่สนหรอกว่าใครเป็นผู้หญิงผู้ชาย{k}"
        heart: 2
        reply: "…ถูก ควายดูมือ ไม่ดูหน้า… คนดูหน้าก่อนดูมือ เลยโดนเตะ"

  - id: phueak_f_a_hold
    topic: advice
    when: { gender: f }
    npc: "จับเชือกควาย อย่าพันข้อมือ… ควายตกใจ มันลากไปทั้งตัว ผู้ชายตัวใหญ่ก็ลากไปเหมือนกัน ตาเคยเห็นไอ้พรานแดงไถลไปกับไอ้ทุยครึ่งทุ่ง"
    options:
      - text: "ลุงพรานแดงไถลไปจริงเหรอ{kq}"
        heart: 1
        reply: "…จริง ร้องดังกว่าควาย ห้ามบอกมันนะ ตาเล่าเอ็งคนเดียว"
      - text: "แล้วต้องจับยังไง{kq}"
        heart: 2
        reply: "…กำหลวมๆ ยืนข้างไหล่มัน ไม่ใช่ข้างหน้า ข้างหน้าเป็นที่ของหญ้า… ลองดู"
        next:
          - text: "แบบนี้ใช่ไหม{kq}"
            heart: 2
            reply: "(พยักหน้า) …ไอ้ทุยไม่หันมามองเอ็ง แปลว่ามันไม่รำคาญ ควายไม่รำคาญ คือควายยอมรับ"
          - text: "{p}กลัวมันเหยียบ{k}"
            heart: 1
            reply: "…กลัวดีแล้ว คนไม่กลัวควายโดนเหยียบก่อน… ยืนให้มันเห็นหน้าไว้ มันไม่เหยียบคนที่มันเห็น"
      - text: "{p}ยังไม่จับดีกว่า{k}"
        heart: 0
        reply: "…ก็ได้ ยืนดูก่อน ตาก็ยืนดูพ่อตาเป็นปีกว่าจะได้จับ"

  - id: phueak_f_s_single
    topic: smalltalk
    when: { gender: f }
    npc: "…เอ็งมีคู่ยัง ตาถามเพราะลุงสมหมายฝากถาม ตาไม่ได้อยากรู้"
    options:
      - text: "ยัง{k} ตาจะหาให้เหรอ{kq}"
        heart: 1
        reply: "…ตาหาคู่ให้ควายยังไม่ได้ ไอ้ทุยโสดมาหกปี"
      - text: "เรื่องของ{p}{k}ตา"
        heart: 0
        reply: "…นั่นแหละ ตาก็จะตอบลุงสมหมายแบบนี้"
      - text: "ตาอยากให้{p}มีไหม{kq}"
        heart: 1
        reply: "…ตาอยากให้เอ็งมีคนพูดแทน เวลาเอ็งพูดไม่ออก… จะผัวหรือเพื่อนก็ได้ คนเดียวก็พอ"

  - id: phueak_f_f_sai_scale
    topic: self
    once: true
    when: { gender: f, heart_min: 4 }
    npc: "สมัยสายยังอยู่… ไอ้เฮงกดราคาข้าวเปลือกตาไม่ได้สักบาท สายต่อเอง ยืนจ้องตาชั่ง… พอสายไม่อยู่ ตาขายเอง ราคาตกสองบาททุกปี ตาพูดไม่เป็น"
    options:
      - text: "ปีนี้ให้{p}ไปยืนจ้องตาชั่งแทนยายสายไหม{kq}"
        heart: 2
        reply: "…(มองนาน) เอ็งจะไปเหรอ… สายยืนข้างซ้ายของตาชั่ง ยืนตรงนั้นนะ ไอ้เฮงมันเห็นข้างซ้ายแล้วจะนึกออก"
        next:
          - text: "{p}จะจ้องให้เฮียกลัวเลย{k}"
            heart: 2
            reply: "…ไม่ต้องให้กลัว ให้มันจำได้ก็พอ… ราคาขึ้นมาสองบาท ตาซื้อขนมให้เอ็ง"
          - text: "ยายสายจ้องยังไง{kq}"
            heart: 1
            reply: "…ไม่พูด จ้องอย่างเดียว แล้วพูดตัวเลขที่จดมาจากหอกระจายข่าว… เหมือนยายเอ็ง สองคนนั้นเรียนมาด้วยกัน"
      - text: "เฮียเฮงแกล้งตาเหรอ{kq}"
        heart: 1
        reply: "…มันไม่แกล้ง มันค้าขาย คนพูดไม่เป็นก็เสียเปรียบ… ตาเสียเปรียบมาสิบปี ชินแล้ว"

  - id: phueak_f_o_kla_mornings
    topic: others
    when: { gender: f, day_min: 8 }
    npc: "ไอ้กล้ามันทักตาทุกเช้า… ช่วงนี้มันถามถึงเอ็งทุกเช้าด้วย ตาไม่ตอบ"
    options:
      - text: "พี่กล้าถามว่าอะไร{kq}"
        heart: 1
        reply: "…‘หลานยายเพียรมาทุ่งไหมครับ’ ทุกเช้า… ตาบอก ‘มา’ มันยิ้ม ตาบอก ‘ไปแล้ว’ มันก็ยิ้ม… ตาไม่เข้าใจ"
      - text: "ไม่เกี่ยวกับ{p}หรอก{k}"
        heart: 0
        reply: "…อืม ตาก็ว่างั้น ควายตายังไม่เชื่อ"
