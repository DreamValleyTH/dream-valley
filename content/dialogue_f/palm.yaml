convos:
  - id: palm_f_heavy_sack
    topic: react
    once: true
    when: { gender: f, day_min: 3 }
    npc: "เมื่อเช้าเห็น{player}แบกกระสอบปุ๋ยหมักคนเดียว ลุงสมหมายยืนมองแล้วบอกว่า ‘ผู้หญิงยกของหนักเดี๋ยวไม่มีลูกนะ’… ตามหลักวิชาการนะ ไม่จริง แต่หลังเคลื่อนได้ ทั้งผู้หญิงทั้งผู้ชาย เท่ากัน"
    options:
      - text: "ขอบคุณที่แก้ข่าวให้นะ{kq}ปาล์ม"
        heart: 1
        reply: "เราแก้ไปแล้วรอบนึงต่อหน้าลุงสมหมาย ลุงตอบว่า ‘ข้าราชการไม่มีลูกจะรู้อะไร’… ตรรกะแน่นมาก เราเถียงไม่ได้ เลยจดลงสมุดไว้ หัวข้อ ‘ความเชื่อที่ต้องใช้เวลา’"
      - text: "แล้วลุงสมหมายยกเองหรือเปล่า{kq}"
        heart: 1
        reply: "ไม่ ลุงสมหมายยืนดูเฉยๆ ถือแก้วกาแฟ… ตามหลักวิชาการนะ คนที่ยืนดูคือคนที่ปลอดภัยที่สุดในแปลง และมีความเห็นมากที่สุดด้วย"
      - text: "{p}ยกท่าถูกนะ{k} ย่อเข่า หลังตรง"
        heart: 1
        reply: "ถูกเป๊ะ! หมอแอนสอนใช่ไหม… เราเห็นแล้วจดลงสมุดเลย ‘เกษตรกรหลานยายเพียร ท่ายกถูกต้อง’ ให้ดาวด้วย ยืมสติกเกอร์ครูเต้ยมา"

  - id: palm_f_drone
    topic: news
    when: { gender: f }
    npc: "อบต. ส่งรายชื่อเกษตรกรไปอบรมโดรนพ่นยาที่อำเภอ สิบคน ผู้ชายสิบคน… เราเลยแอบใส่ชื่อ{player}เป็นคนที่สิบเอ็ด ล้อเล่นๆ… ไม่ได้ล้อเล่น ใส่ไปแล้ว"
    options:
      - text: "ใส่เลย{k} {p}อยากบินโดรน"
        heart: 2
        reply: "เย้! ตามหลักวิชาการนะ ผู้หญิงบินโดรนแม่นกว่า ไม่มีงานวิจัยรองรับ เราแค่อยากให้มันจริง… อบรมวันพุธ ข้าวกล่องฟรี ไม่ใช่ไข่พะโล้ด้วย"
      - text: "{p}ไม่ได้อยากไป{k}"
        heart: 0
        reply: "อ้าว… โอเค เราขีดชื่อออก แต่ขีดเส้นบางๆ นะ เผื่อเปลี่ยนใจ ปากกาเราลบได้"
      - text: "พ่นยาเหรอ{kq} {p}ทำอินทรีย์นะ"
        heart: 1
        reply: "จริงด้วย! โดรนพ่นน้ำหมักสะเดาก็ได้นะ… เรายังไม่ได้บอกวิทยากร เดี๋ยวเขาตกใจ เราจะยกมือถามตอนท้าย ช่วงที่ทุกคนรีบกลับ"

  - id: palm_f_tape_measure
    topic: advice
    when: { gender: f, flag: story_palm_visit }
    npc: "สังเกตไหม เวลาเราไปแปลง{player}ด้วยกัน คนผ่านมาถามเราว่า ‘เจ้าของแปลงอยู่ไหน’ ทั้งที่เจ้าของยืนข้างๆ เรา… ตามหลักวิชาการนะ วิธีแก้มีวิธีเดียว"
    options:
      - text: "วิธีอะไร{kq}"
        heart: 1
        reply: "ถือตลับเมตรไว้เอง! คนในตำบลฟังคนถือตลับเมตร ไม่ใช่ฟังผู้ชาย เราทดลองมาสองปีแล้ว… วันไหนเราลืมตลับเมตร ไม่มีใครฟังเราเหมือนกัน"
      - text: "ช่างเขาเถอะ{k} แปลงเป็นของ{p}ก็พอ"
        heart: 1
        reply: "จริง… แต่วันหนึ่งที่ดินแปลงนี้จะต้องมีคนเซ็น ต้องมีคนเถียงในประชุม เราอยากให้ทุกคนจำหน้า{player}ได้ก่อนวันนั้นนะ"
      - text: "ก็เพราะปาล์มตัวสูงกว่าไง"
        heart: 0
        reply: "…ตามหลักวิชาการนะ อันนี้ก็เป็นตัวแปรหนึ่ง เราจดไว้ด้วย เดี๋ยวลองนั่งยองๆ ตอนมีคนผ่านมาดู"

  - id: palm_f_flowers
    topic: smalltalk
    when: { gender: f, heart_min: 4, time: evening }
    npc: "{player}ชอบดอกอะไร… เราถามตามหลักวิชาการนะ จะปลูกแปลงดอกไม้ข้างแปลงทดลอง ดึงผึ้งมาช่วยผสมเกสร ไม่ได้จะเอาไปให้ใครนะ ไม่ได้จะให้"
    options:
      - text: "ดอกดาวเรือง{k} ยายปลูกไว้หน้าบ้าน"
        heart: 2
        reply: "ดาวเรือง! ไล่ไส้เดือนฝอยได้ด้วย ดีมาก ตามหลักวิชาการเลย… เราจะปลูกสามแถว แถวหนึ่งตรงทางเดินไปฟาร์ม{player} ผึ้งจะได้รู้ทาง ผึ้งนะ ไม่ใช่เรา"
        next:
          - text: "ผึ้งหรือปาล์ม{kq}"
            heart: 2
            reply: "ผึ้ง… (หน้าแดง) …ผึ้งก็ต้องมีคนพาไปบ้าง ล้อเล่นๆ… ครึ่งนึง"
          - text: "ช่วยปลูกนะ{kq} {p}รดน้ำให้"
            heart: 1
            reply: "ได้ เราขุด {player}รด แบ่งงานตามความถนัด… ซึ่งจริงๆ {player}ขุดเก่งกว่าเรา เราเห็นแล้ว แต่ให้เราขุดเถอะ เราอยากดูมีประโยชน์"
      - text: "ดอกกะเพรา{k} กินได้ด้วย"
        heart: 1
        reply: "ฮ่าๆ เกษตรกรตัวจริง! ดอกกะเพราผึ้งชอบจริงนะ… โอเค แปลงดอกไม้ของเราจะเป็นแปลงกะเพรา ไม่โรแมนติก แต่ผัดได้"
      - text: "ปาล์มจะให้ใครล่ะ{kq}"
        heart: 1
        reply: "ไม่ให้ใคร! บอกแล้วไง… ผึ้ง ให้ผึ้ง ผึ้งตัวเดียว ตัวที่ถามเยอะ"

  - id: palm_f_mom_asks
    topic: self
    when: { gender: f, heart_min: 5 }
    npc: "แม่เราโทรมาอีกแล้ว ไม่ได้ถามเรื่องย้ายงานนะรอบนี้… ถามว่า ‘ลูกเกษตรกรที่ลูกพูดถึงทุกวันน่ะ ผู้หญิงใช่ไหม ทำนาเองเหรอ เก่งจัง พามากินข้าวบ้างสิ’"
    options:
      - text: "ปาล์มพูดถึง{p}ทุกวันเลยเหรอ{kq}"
        heart: 2
        reply: "ไม่ทุกวัน… วันเว้นวัน ตามหลักวิชาการนะ ถือว่าบ่อย… แม่เราจับได้ เพราะเราเล่าเรื่องดินแปลง{player}ละเอียดกว่าเล่าเรื่องตัวเองอีก"
        next:
          - text: "ไปกินข้าวกับแม่ปาล์มก็ได้นะ{kq}"
            heart: 2
            reply: "จริงเหรอ! แม่เราทำแกงเขียวหวานเก่ง… แต่ต้องเตือนก่อน แม่จะถามสามคำถาม จะขายที่ไหม จะอยู่ยาวไหม แล้วก็ ‘ลูกปาล์มดีกับหนูไหม’ ข้อสุดท้ายตอบตามจริงได้เลยนะ"
          - text: "แล้วปาล์มตอบแม่ว่ายังไง{kq}"
            heart: 1
            reply: "เราตอบว่า ‘ใช่ ทำนาเอง เก่งมาก’ แล้วรีบวาง… ลืมตอบข้อสุดท้าย แม่เลยโทรมาอีกสามรอบ"
      - text: "แม่ปาล์มคงอยากให้ปาล์มมีแฟนแล้วล่ะ"
        heart: 1
        reply: "อยากมาสามปีแล้ว… แต่แม่ไม่เคยถามแบบนี้มาก่อนนะ ถามว่า ‘เก่งจัง’ แม่ไม่ค่อยชมใครง่ายๆ แม่เป็นชาวนา ชมแต่ฝน"
      - text: "บอกแม่ว่าแค่เพื่อนร่วมงาน{k}"
        heart: -1
        reply: "อ๋อ… โอเค ได้ ตามนั้น… เราจะบอกแม่ว่าเพื่อนร่วมงาน (จดลงสมุดเงียบๆ)"

  - id: palm_f_form_nai
    topic: others
    when: { gender: f }
    npc: "ยายจันทร์ทายฝนแม่นกว่ากรมอุตุฯ นะ เราอยากเขียนลงรายงานว่าใช้ภูมิปัญญาท้องถิ่น… แต่ช่องผู้ให้ข้อมูลในแบบฟอร์มพิมพ์ไว้แล้วว่า ‘หัวหน้าครัวเรือน (นาย)…’"
    options:
      - text: "ก็ขีดคำว่านายออกสิ{kq}"
        heart: 2
        reply: "เราขีดแล้ว! เขียนตัวใหญ่ข้างๆ ว่า ‘นาง จันทร์’ … รายงานถูกตีกลับว่า ‘แก้ไขแบบฟอร์มราชการไม่ได้’ เราเลยถ่ายเอกสารใหม่ แล้วขีดอีก ส่งไปรอบที่สามแล้ว"
        next:
          - text: "ส่งรอบสี่ด้วยนะ{kq} {p}เป็นกำลังใจ"
            heart: 2
            reply: "ส่งแน่! ตามหลักวิชาการนะ ถ้าส่งไปสิบรอบ คนตรวจจะเหนื่อยก่อนเรา… เรียนมาจากผู้ใหญ่สมศักดิ์ ส่งหนังสือฉบับเดิมจนเขาตอบ"
          - text: "ยายจันทร์รู้ไหม{kq}ว่ามีเรื่องแบบนี้"
            heart: 1
            reply: "รู้ ยายหัวเราะ บอกว่า ‘ยายทอผ้ามาหกสิบปี ไม่มีใครเขียนชื่อยายบนผ้าสักผืน แบบฟอร์มจะเขียนทำไม’… แล้วยายก็ทายว่าพรุ่งนี้ฝนตกบ่ายสาม ตกจริงบ่ายสามสิบห้า"
      - text: "ใส่ชื่อผู้ชายสักคนในบ้านยายจันทร์แทนไปก็ได้นี่{kq}"
        heart: -1
        reply: "ผู้ชายบ้านนั้นคือหลานที่ไปทำงานระยอง ไม่เคยทายฝนถูกสักครั้ง… ถ้าเราใส่ชื่อเขา เท่ากับรายงานโกหก เราไม่ทำนะ ทั้งตามหลักวิชาการ และตามหลักยายจันทร์"
      - text: "แบบฟอร์มเก่าแค่ไหนเนี่ย"
        heart: 1
        reply: "พิมพ์ปีเดียวกับที่ อบต. ซื้อเครื่องถ่ายเอกสาร… ทั้งสองอย่างยังใช้อยู่ ทั้งสองอย่างควรเปลี่ยนนานแล้ว"
