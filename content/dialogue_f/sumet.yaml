convos:
  - id: sumet_f_alms_distance
    topic: react
    once: true
    when: { gender: f, flag: story_alms_first }
    npc: "เจริญพร… เช้านี้โยมใส่บาตรครั้งแรกใช่ไหม โยมยืนชิดเข้ามานิดหนึ่ง อาตมาเลยถอยครึ่งก้าว ไม่ต้องตกใจนะโยม ไม่ใช่โยมทำผิด ระยะนั้นเป็นศีลของพระ ไม่ใช่ความผิดของโยม"
    options:
      - text: "ขอโทษ{k}หลวงพ่อ {p}ไม่รู้ธรรมเนียม"
        heart: 1
        reply: "ไม่ต้องขอโทษโยม… ยายโยมเพียรก็ยืนชิดเหมือนกันวันแรกที่อาตมามาอยู่วัดนี้ ยายบอกว่า ‘ขอโทษเจ้าค่ะ ตาไม่ดี’ ตาดีมาก ยายแค่อยากดูหน้าพระใหม่ให้ชัด"
        next:
          - text: "ถ้า{p}จะถวายของ ต้องทำยังไง{kq}"
            heart: 2
            reply: "วางบนผ้ารับประเคนนะโยม อาตมาจะจับชายผ้าอีกด้าน หรือถ้าไม่มีผ้า วางไว้ตรงหน้าแล้วอาตมาหยิบเอง… ยายโยมเพียรทำคล่องมาก ไม่เคยทำของหกสักครั้งในสิบสองปี"
          - text: "ทำไมพระต้องเว้นระยะกับผู้หญิง{kq}"
            heart: 1
            reply: "เป็นวินัยที่พระรับไว้เองโยม ให้ใจไม่วอกแวก… มันเป็นการบ้านของพระ ไม่ใช่ภาระของโยม โยมไม่ต้องหดตัว ไม่ต้องหลบหน้า ยืนตรงๆ อย่างที่โยมยืนก็พอ"
      - text: "หลวงพ่อถอยเร็วมาก{k} {p}ยังไม่ทันเห็น"
        heart: 1
        reply: "ฝึกมาตั้งแต่บวชโยม… ถ่านหมาวัดยังถอยไม่ทันอาตมาเลย ข้าวเหนียวโยมปั้นแน่นดีนะ ใหญ่กว่ายายนิดหนึ่ง อาตมาไม่ว่า"
      - text: "{p}ไม่ค่อยเข้าใจธรรมเนียมพวกนี้{k}"
        heart: 0
        reply: "ไม่เป็นไรโยม ค่อยๆ เรียนไป… ถ้าไม่แน่ใจ ถามลุงจำรัสหรือป้าทองใบ สองคนนี้รู้ธรรมเนียมวัดดีกว่าอาตมาอีก"

  - id: sumet_f_herb_garden
    topic: advice
    when: { gender: f, day_min: 4 }
    npc: "แปลงสมุนไพรหลังกุฏิ ครึ่งหนึ่งยายโยมเพียรปลูกไว้นะโยม ไพล ขมิ้น ฟ้าทะลายโจร ใบย่านาง… อาตมาจำได้แค่ชื่อ จำไม่ได้ว่าต้นไหนแก้อะไร ยายจดไว้ให้ป้าทองใบเล่มหนึ่ง"
    options:
      - text: "{p}จะไปขอดูสมุดกับป้าทองใบ{k}"
        heart: 2
        reply: "ดีแล้วโยม… ป้าทองใบรอให้มีคนมาถามมาหลายปีแล้ว ลูกหลานแกไม่มีใครสนใจ แกบอกอาตมาว่า ‘วิชาผู้หญิงมันตายเงียบๆ หลวงพ่อ ไม่มีใครจัดงานศพให้’"
      - text: "ฟ้าทะลายโจรหลวงพ่อฉันบ้างไหม{kq}"
        heart: 1
        reply: "ฉันตอนเจ็บคอโยม ขมจนลืมเจ็บ… หมอแอนบอกว่าดีจริง แต่ให้ฉันน้ำเยอะๆ ด้วย อาตมาทำได้ครึ่งเดียวเหมือนทุกเรื่อง"
      - text: "ซื้อยาที่ร้านเภสัชมดง่ายกว่า{k}"
        heart: 0
        reply: "ง่ายกว่าโยม อาตมาไม่ว่า… แต่ต้นไม้ไม่ได้มีไว้แทนยาอย่างเดียว มีไว้ให้คนสองรุ่นได้นั่งคุยกันด้วย"

  - id: sumet_f_mother_farmer
    topic: self
    when: { gender: f, heart_min: 3 }
    npc: "คนชอบถามอาตมาว่าใครสอนอาตมาทำนา ทุกคนเดาว่าพ่อ… ไม่ใช่นะโยม แม่อาตมาสอน แม่ดำนาเร็วที่สุดในหมู่บ้าน แต่เวลาอำเภอมานับ ‘เกษตรกรดีเด่น’ เขาเขียนชื่อพ่อทุกปี"
    options:
      - text: "แม่หลวงพ่อน้อยใจไหม{kq}"
        heart: 1
        reply: "แม่หัวเราะโยม… แม่บอกว่า ‘เกียรติบัตรกินไม่ได้ ข้าวกินได้’ แล้วก็ดำนาต่อ อาตมาตอนเก้าขวบไม่เข้าใจ อาตมาตอนนี้เข้าใจครึ่งหนึ่ง อีกครึ่งหนึ่งยังคิดว่าน่าจะมีชื่อแม่บ้าง"
        next:
          - text: "หลวงพ่อยังคิดถึงแม่ไหม{kq}"
            heart: 2
            reply: "ทุกคืนที่สวดมนต์โยม… อาตมาไม่ได้ขอให้แม่ไปสวรรค์นะ อาตมาขอให้ที่ที่แม่อยู่มีนาให้ดำ แม่คงเบื่อถ้าต้องอยู่เฉยๆ"
          - text: "{p}ก็ทำนาเองเหมือนกัน{k}"
            heart: 2
            reply: "อาตมาเห็นโยม… ครั้งแรกที่เห็นโยมก้มดำกล้าในแปลง อาตมานึกถึงแม่ ไม่ใช่เพราะหน้าเหมือน เพราะโยมไม่เงยหน้ามาดูว่าใครมอง แม่ก็ไม่เคยเงย"
      - text: "ทำไมเขาเขียนชื่อพ่อ{kq}"
        heart: 1
        reply: "แบบฟอร์มเขามีช่องเดียวโยม ช่อง ‘หัวหน้าครัวเรือน’… คนออกแบบฟอร์มคงไม่เคยดำนา อาตมาไม่โกรธเขา อาตมาแค่อยากให้เขามาดำนาสักวัน"
      - text: "เป็นเรื่องธรรมดาสมัยก่อน{k}"
        heart: 0
        reply: "ธรรมดาโยม… อะไรที่ธรรมดามากๆ บางทีก็ควรหยุดดูสักครั้งว่าธรรมดาเพราะถูก หรือธรรมดาเพราะไม่มีใครถาม"

  - id: sumet_f_temple_committee
    topic: news
    when: { gender: f }
    npc: "ปีนี้อาตมาตั้งญาติโยมผู้หญิงเป็นกรรมการวัดสองคนนะโยม ป้าทองใบกับยายจันทร์… มีคนมาบอกว่าไม่เคยมีมาก่อน อาตมาบอกว่า โรงครัววัดไม่เคยขาดผู้หญิงสักวัน แต่โต๊ะกรรมการไม่เคยมีสักคน อาตมาว่าอย่างหลังแปลกกว่า"
    options:
      - text: "อนุโมทนา{k}หลวงพ่อ"
        heart: 2
        reply: "อนุโมทนาด้วยโยม… ประชุมกรรมการครั้งแรก ป้าทองใบถามเรื่องงบค่ากับข้าวงานกฐินสิบข้อ ลุงจำรัสตอบได้สิบข้อ ลุงจำรัสบอกอาตมาว่าเป็นประชุมที่ดีที่สุดในรอบยี่สิบปี"
      - text: "มีคนไม่พอใจไหม{kq}"
        heart: 1
        reply: "มีบ้างโยม… อาตมาไม่ได้ไปเถียงใคร อาตมาแค่ชวนเขามาช่วยล้างหม้อหลังงานบุญหนึ่งคืน คืนเดียวเขาก็เข้าใจแล้วว่าใครทำงานวัดมาตลอด"
      - text: "วัดอื่นก็คงไม่มีเหมือนกัน{k}"
        heart: 0
        reply: "อาตมาไม่รู้เรื่องวัดอื่นโยม… อาตมารู้เรื่องโรงครัววัดเรา ข้าวทุกจานที่อาตมาฉันมาสิบสองปีที่วัดนี้ มาจากมือผู้หญิงเกือบทุกจาน"

  - id: sumet_f_sweeping
    topic: smalltalk
    when: { gender: f, time: morning }
    npc: "เมื่อวานโยมมากวาดใบมะขามลานวัดใช่ไหม อาตมาให้เณรต้นไปช่วย… เณรกลับมาขอโทษอาตมาว่า ‘หลวงพ่อครับ ผมกวาดช้ากว่าพี่เขาครึ่งหนึ่ง ผมจะฝึกใหม่ครับ’"
    options:
      - text: "เณรต้นช่วยเยอะ{k} ไม่ได้ช้าเลย"
        heart: 1
        reply: "อาตมาบอกเณรแบบนั้นแล้วโยม… เณรบอกว่า ‘แต่พี่เขากวาดเป็นเส้นตรงครับ ของผมเป็นวงกลม’ อาตมาไปดู เป็นวงกลมจริง วงกลมสวยด้วย"
      - text: "{p}แค่ว่างเลยมาช่วย{k}"
        heart: 1
        reply: "ความว่างที่ใช้ทำประโยชน์ เป็นความว่างที่ดีนะโยม… ใบมะขามพรุ่งนี้ก็ร่วงอีก โยมไม่ต้องมาทุกวัน มาเมื่อใจอยากมาก็พอ"
      - text: "หลวงพ่อไม่ต้องให้เณรมาช่วยก็ได้{k}"
        heart: 0
        reply: "อาตมาไม่ได้ส่งเณรไปช่วยโยมหรอก อาตมาส่งเณรไปเรียนจากโยม… เณรได้วิชากวาดเส้นตรงกลับมา อาตมาได้ลานวัดสะอาดสองเท่า"

  - id: sumet_f_chan_weaving
    topic: others
    when: { gender: f, heart_min: 2 }
    npc: "ยายจันทร์มาถามอาตมาเมื่อวานโยม ว่ามีใครในตำบลจะรับวิชาทอผ้าลายนาคต่อไหม ลูกหลานไปทำงานไกลกันหมด… อาตมาบอกยายว่า ‘ลองถามหลานโยมเพียรดู’ ยายเงียบไปนาน แล้วยิ้ม"
    options:
      - text: "{p}อยากเรียน{k} แต่กลัวทำไม่ได้"
        heart: 2
        reply: "ยายจันทร์บอกว่าวันแรกยายเองก็ทอผิดสามแถวโยม… ยายบอกให้อาตมาบอกโยมว่า ‘มาเด้อ ผิดได้ ด้ายบ่ว่า’ อาตมาพูดสำเนียงยายไม่เหมือน แต่ใจความครบ"
        next:
          - text: "หลวงพ่อจะไปบอกยายว่า{p}ตอบรับไหม{kq}"
            heart: 1
            reply: "อาตมาว่าโยมไปบอกเองดีกว่า… ถือหมากไปสักคำ ยายจะเล่าว่าลายนาคแต่ละตัวเป็นใครในครอบครัวยาย ยายไม่เล่าให้อาตมาฟัง ยายบอกว่าเป็นเรื่องผู้หญิง"
          - text: "ทำไมหลวงพ่อนึกถึง{p}{kq}"
            heart: 1
            reply: "เพราะโยมกลับมาหาของเก่าโยม… คนที่กลับมาเอาบ้านคืนได้ ก็คงกลับมาเอาลายผ้าคืนได้ อาตมาคิดง่ายๆ แค่นั้น"
      - text: "แพรวก็อยากทำผ้าทอนะ{kq}"
        heart: 1
        reply: "แพรวขายเก่งโยม แต่ทอไม่เป็น… ยายจันทร์ว่าถ้าได้คนทอกับคนขายมาเป็นเพื่อนกัน ผ้ายายจะไม่ตายไปกับยาย อาตมาเห็นด้วย"
      - text: "{p}ไม่มีเวลา{k}หลวงพ่อ"
        heart: 0
        reply: "ไม่เป็นไรโยม อาตมาจะบอกยายให้… แต่ถ้าวันหนึ่งโยมเดินผ่านบ้านยายแล้วได้ยินเสียงกี่ แวะไปนั่งดูสักครู่ก็ได้ ยายไม่ได้ขอให้รับวิชา ยายแค่อยากให้มีคนเห็น"
