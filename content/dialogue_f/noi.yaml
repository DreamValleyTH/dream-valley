# พี่หน่อย — บทคุยเฉพาะผู้เล่นหญิง (gender: f) · อบอุ่น ห่วงกินข้าวครบมื้อ ‘ชิมก่อนแล้วค่อยเติม’ ไม่มีตลกร้าย
convos:
  - id: noi_f_r_bet
    topic: react
    once: true
    when: { gender: f, flag: story_town_intro }
    npc: "น้อง! นั่งก่อน เมื่อเช้าผู้ชายโต๊ะริมสองคนพนันกันว่าน้องจะอยู่ไม่ถึงสงกรานต์ เพราะ ‘ผู้หญิงทำไร่คนเดียวไม่ไหว’ พี่เลยเติมพริกให้เขาคนละสองช้อน… เส้นอะไรดีจ๊ะ"
    options:
      - text: "เส้นเล็ก{k} แล้วพี่หน่อยพนันข้างไหน{kq}"
        heart: 2
        reply: "ข้างน้องสิ! พี่พนันชามพิเศษไปหนึ่งชาม… ตอนพี่เปิดร้านใหม่ๆ เขาก็พนันแบบนี้กับพี่นะน้อง คนพนันคนเดิมเลย ตอนนี้ยังกินร้านพี่ทุกวัน"
        next:
          - text: "แล้วเขาจ่ายพนันพี่ไหม{kq}"
            heart: 1
            reply: "จ่ายทุกวันจ้ะ ชามละสี่สิบ สิบปีแล้ว… พี่ไม่ได้ทวง เขาจ่ายเอง เพราะหิว"
          - text: "{p}จะอยู่ให้เกินสงกรานต์{k}"
            heart: 2
            reply: "ไม่ต้องอยู่ให้ใครดูหรอกน้อง อยู่ให้ตัวเองอิ่มก็พอ… ส่วนพี่จะอยู่ดูเขาจ่ายพนัน ชามนี้พี่ใส่ลูกชิ้นเพิ่มสองลูก ชามแห่งชัยชนะ"
      - text: "พริกสองช้อนเลยเหรอ{kq}"
        heart: 1
        reply: "ชิมก่อนแล้วค่อยเติมไง พี่ชิมคำพูดเขาก่อน แล้วเติมพริกตามรส… คนนึงไอจนน้ำตาไหล อีกคนบอกอร่อยดี คนนั้นพี่ให้อภัยครึ่งนึง"
      - text: "ช่างเขาเถอะ{k} หิวแล้ว"
        heart: 1
        reply: "ถูก! ท้องว่างไปเถียงใครก็แพ้นะน้อง กินก่อน เถียงทีหลัง เส้นเล็กน้ำตกเหมือนเดิมนะจ๊ะ"

  - id: noi_f_n_sign
    topic: news
    when: { gender: f }
    npc: "ป้ายรายชื่อเจ้าภาพงานบุญวัดออกแล้วน้อง… ชื่อลุงๆ ตัวโตเต็มแผ่น ป้าทองใบกับพี่กวนกระยาสารทสามวันสามคืน ชื่อเราอยู่บรรทัดล่างสุด ‘และคณะแม่ครัว’ พี่เพิ่งรู้ว่าพี่ชื่อคณะ"
    options:
      - text: "คณะแม่ครัวทำงานหนักสุดเลยนะ{k}"
        heart: 1
        reply: "หนักสุด แต่หอมสุดนะน้อง… ป้าทองใบโกรธมาก เอาปากกาเมจิกไปเขียนชื่อตัวเองข้างป้าย ตัวโตกว่าชื่อนายกอีก"
      - text: "ชื่อบนป้ายไม่สำคัญหรอก{k}"
        heart: 0
        reply: "ไม่สำคัญจ้ะ… แต่ถ้าปีไหนไม่มีคณะ ป้ายก็ไม่มีอะไรให้กินนะน้อง พี่ว่าแค่นั้นแหละ"

  - id: noi_f_a_omelet
    topic: advice
    when: { gender: f }
    npc: "น้อง จะหัดทำกับข้าวน่ะ อย่าหัดเพราะใครบอกว่าผู้หญิงต้องทำเป็นนะ หัดเพราะอยากกินของอร่อยตอนหิวตีสอง… พี่สอนอย่างนึง ไข่เจียว ตีไข่ใส่น้ำปลาหยดเดียว มะนาวนิดนึง น้ำมันร้อนจัด ฟูเหมือนเมฆ"
    options:
      - text: "มะนาวในไข่เจียวเหรอ{kq}"
        heart: 1
        reply: "นิดเดียวจ้ะ ทำให้ฟู สูตรพี่สมัยโรงแรม… เชฟใหญ่เอาไปใส่เมนูชื่อ ‘ไข่เจียวเชฟ’ ขายจานละสามร้อย พี่ได้ค่าแรงวันละสี่ร้อย"
      - text: "{p}ทำกับข้าวไม่เก่งเลย{k}"
        heart: 1
        reply: "ไม่ต้องเก่งจ้ะ ต้องกินครบมื้อ… เก่งเอาไว้ทีหลัง พี่ก็ทำไข่ไหม้มาสามปีกว่าจะเจียวสวยแบบนี้"
      - text: "ใครบอกว่าผู้หญิงต้องทำเป็น{kq}"
        heart: 1
        reply: "ป้าพร ป้าแต๋ว ทั้งตำบลแหละจ้ะ… แต่คนทำกับข้าวเป็นอาชีพแล้วได้ชื่อดัง ส่วนใหญ่เป็นผู้ชาย พี่ว่าแปลกดี ทำที่บ้านเรียกหน้าที่ ทำที่ภัตตาคารเรียกศิลปะ"

  - id: noi_f_s_spoon
    topic: smalltalk
    when: { gender: f }
    npc: "น้องกินข้าวคนเดียวที่บ้านใช่ไหม พี่ก็กินคนเดียวนะ หลังปิดร้าน นั่งโต๊ะนี้ ชามเดียว วางช้อนข้างๆ อีกคัน ไม่ได้รอใคร ติดมือจ้ะ… ป้าแต๋วเห็นเลยลือว่าพี่มีแฟนลับ"
    options:
      - text: "แฟนลับชื่อช้อน{k}"
        heart: 2
        reply: "ฮ่าๆ ใช่! ช้อนสเตนเลส ซื่อสัตย์ ไม่บ่นว่าเค็ม… น้องมานั่งกินกับพี่ตอนบ่ายสามได้นะ ช้อนคันนั้นจะได้มีงานทำ"
      - text: "กินคนเดียวก็สบายดีนะ{k}"
        heart: 1
        reply: "สบายจ้ะ ไม่ต้องแบ่งไข่ดาว… แต่ถ้าวันไหนกินคนเดียวแล้วลืมกิน นั่นแหละอันตราย มาหาพี่"

  - id: noi_f_f_wok
    topic: self
    when: { gender: f, heart_min: 4 }
    npc: "พี่อยู่ครัวโรงแรมเก้าปีนะน้อง ครัวมีผู้หญิงสามคน ผู้ชายยี่สิบ เขาให้พี่อยู่แผนกขนมกับสลัด บอกว่า ‘มือผู้หญิงเบา’ วันหนึ่งพี่ได้ยืนเตาผัดแทนคนป่วย ไฟพุ่งจนแขนเสื้อไหม้ ข้าวผัดจานนั้นเชฟใหญ่กินหมด แล้วถามว่า ‘ใครผัด’… พี่ไม่ตอบ"
    options:
      - text: "ทำไมพี่ไม่ตอบ{kq}"
        heart: 2
        reply: "กลัวจ้ะ… กลัวว่าตอบแล้วเขาจะไม่ให้กลับไปยืนเตาอีก สุดท้ายก็ไม่ได้กลับไปอยู่ดี พี่เลยมาเปิดร้านที่มีเตาของตัวเอง ยืนได้ทั้งวัน ไม่ต้องขอใคร"
        next:
          - text: "ตอนนี้ทั้งร้านเป็นของพี่แล้ว{k}"
            heart: 2
            reply: "ทั้งร้าน ทั้งเตา ทั้งหม้อของแม่… ถ้าวันนี้เชฟคนนั้นมากินแล้วถามว่าใครทำ พี่จะตอบเสียงดังจนลุงเชิดได้ยินบนรถ"
          - text: "{p}ภูมิใจในตัวพี่นะ{k}"
            heart: 1
            reply: "โอ๊ย พูดแบบนี้พี่ลวกเส้นไม่ถูกแล้ว… ขอบใจนะน้อง ชามนี้พี่ไม่คิดเงิน ห้ามเถียง"
      - text: "แขนเสื้อไหม้เลยเหรอ{kq}"
        heart: 1
        reply: "แขนเสื้อจ้ะ รอยยังอยู่ที่แขนพี่ด้วย นี่ไง… พี่ไม่อายรอยนี้นะ เป็นรอยของวันเดียวที่พี่ได้ยืนตรงที่อยากยืน"

  - id: noi_f_o_chan_loom
    topic: others
    when: { gender: f, day_min: 4 }
    npc: "ยายจันทร์มากินร้านพี่เมื่อเช้า ถามหาน้องจ้ะ ยายบอกว่า ‘หลานเพียรเป็นผู้หญิงใช่ไหม ให้มาหัดทอผ้า ลูกหลานยายไปโรงงานหมด ไม่มีใครเอากี่’"
    options:
      - text: "{p}ไม่เคยทอผ้าเลย{k} จะได้เหรอ"
        heart: 1
        reply: "ไม่มีใครทอเป็นตั้งแต่เกิดหรอกน้อง ยายบอกว่ามือหลานยายเพียรต้องได้มาแน่ เพราะยายเพียรทอซิ่นสู้ยายจันทร์ได้คนเดียวในตำบล… พี่ไม่รู้นะว่าจริงไหม ยายสองคนเถียงกันมาห้าสิบปี"
        next:
          - text: "งั้นพรุ่งนี้{p}ไปหายายจันทร์{k}"
            heart: 2
            reply: "ไปช่วงสายๆ นะ ยายตื่นตีห้า ทอถึงเก้าโมงแล้วต้องพักตา… เอาก๋วยเตี๋ยวเส้นใหญ่น้ำใสไปฝากด้วย ยายชอบ ไม่ใส่ผงชูรส พี่ห่อให้"
          - text: "ผู้ชายหัดทอได้ไหม{kq}"
            heart: 1
            reply: "ได้สิ ยายเคยสอนลุงเชิดตอนเจ้าเขียวเสียสามเดือน ลุงทอได้ผ้าเช็ดหน้าผืนนึง ยังแขวนอยู่หน้ารถทุกวันนี้"
      - text: "ทำไมต้องเป็นผู้หญิงล่ะ{kq}"
        heart: 1
        reply: "ยายพูดตามความเคยชินจ้ะ รุ่นยายผู้หญิงทอ ผู้ชายไถ… แต่ยายไม่เลือกหรอกน้อง ใครนั่งนิ่งได้นานยายสอนหมด ตำบลนี้คนนั่งนิ่งเป็นมีไม่กี่คน"
