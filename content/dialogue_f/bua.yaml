# ยายบัว — บทคุยเฉพาะผู้เล่นหญิง (gender: f) · อบอุ่น ช้าๆ ส่งต่อวิชายาย สมุนไพร เรื่องผีแล้วปิดด้วยวิธีรอด ไม่มีตลกร้าย
convos:
  - id: bua_f_r_scissors
    topic: react
    once: true
    when: { gender: f, flag: story_first_night }
    npc: "หลานเอ๊ย… คืนก่อนนอนบ้านเพียรคนเดียวใช่ไหม ผู้หญิงนอนบ้านคนเดียวคืนแรกๆ โบราณให้วางกรรไกรไว้ใต้หมอน กันผีอำ… ไม่ใช่เพราะผู้หญิงอ่อนแอนะหลาน ผีมันชอบรังแกคนที่ไม่มีใครเฝ้า ไม่เลือกหรอกจ้ะว่าหญิงหรือชาย"
    options:
      - text: "ยายเพียรเคยวางกรรไกรไหม{kq}"
        heart: 2
        reply: "วางทุกคืนจ้ะ ตั้งแต่ตาของหลานไป… กรรไกรยังอยู่ใต้หมอนเพียรนะหลาน ลองยกดู กรรไกรตัดผ้าด้ามแดง เพียรใช้ตัดทั้งผ้าทั้งผี"
      - text: "{p}ไม่กลัวผีหรอก{k}ยาย"
        heart: 0
        reply: "ชู่ว์! อย่าพูดหลาน… ยายบอกแล้ว ห้ามพูดว่าไม่กลัว (เคี้ยวหมาก) พูดใหม่ว่า ‘หนูเคารพ’ ผีชอบคนสุภาพจ้ะ"
      - text: "ขอบคุณ{k}ยาย {p}จะลองดู"
        heart: 1
        reply: "ลองดูจ้ะ ถ้าคืนไหนฝันเห็นผู้หญิงนั่งปลายเตียง ไม่ต้องตกใจ บอกเขาว่า ‘หลานเพียรมาแล้ว’… อาจเป็นเพียรมาดูหลานก็ได้นะ"

  - id: bua_f_n_yu_fai
    topic: news
    when: { gender: f }
    npc: "เมื่อวานสะใภ้บ้านหมู่สี่คลอดลูกนะหลาน เขาให้ยายไปช่วยอยู่ไฟ ต้มไพลให้อาบ ทับหม้อเกลือ… หนูแอนมายืนดูด้วย ยายนึกว่าหนูแอนจะห้าม หนูแอนจดตาม ถามยายว่าไพลกี่หัว"
    options:
      - text: "หมอแอนจดด้วยเหรอ{kq}"
        heart: 1
        reply: "จดจ้ะ แล้วบอกยายว่า ‘ยาย ทับหม้อเกลือได้ แต่อย่าให้ร้อนเกินนะ แล้วพาแม่เขามาตรวจที่ รพ.สต. ด้วย’… ยายดูเรื่องอุ่น หนูแอนดูเรื่องยา เด็กคนนั้นเลยได้ยายสองคน"
        next:
          - text: "ยายสอน{p}บ้างได้ไหม{kq}"
            heart: 2
            reply: "ได้สิหลาน… ไม่ได้สอนเพราะหลานเป็นผู้หญิงนะจ๊ะ สอนเพราะยายแก่แล้ว ความรู้ยายต้องมีที่อยู่ พรุ่งนี้มาตอนยายตากไพล ยายจะให้ดมว่าไพลแก่กับไพลอ่อนกลิ่นต่างกันยังไง"
          - text: "สมัยยายเพียรคลอดแม่ ก็อยู่ไฟเหรอ{kq}"
            heart: 2
            reply: "อยู่จ้ะ ยายเป็นคนก่อไฟให้เอง… เพียรนอนบนกระดานร้องเพลงทั้งคืน บ่นว่าร้อนจนจะเป็นไก่ย่าง ยายหัวเราะจนไฟเกือบดับ แม่หลานนอนหลับไม่รู้เรื่องเลย"
      - text: "สมัยนี้ยังอยู่ไฟกันอีกเหรอ{kq}"
        heart: 0
        reply: "น้อยลงแล้วจ้ะหลาน คนรุ่นใหม่คลอดโรงพยาบาลอำเภอ กลับมาก็นอนเปิดแอร์… ยายไม่ว่าหรอก แต่ยายยังเก็บไพลไว้ทุกปี เผื่อมีใครอยากได้ความอุ่นแบบเก่า"

  - id: bua_f_a_ginger_basil
    topic: advice
    when: { gender: f, heart_min: 2 }
    npc: "หลานเอ๊ย ปวดท้องเดือนละครั้งใช่ไหม ผู้หญิงก็เป็นกันทุกคน… ยายบอกสูตรนะ ขิงแก่ทุบสามแว่น ใบกะเพรากำมือ ต้มจิบอุ่นๆ ช่วงนั้นอย่ากินน้ำเย็น ถ้าปวดจนเหงื่อแตกให้ไปหาหนูแอนนะ ยายไม่อวดเก่งเกินมือ"
    options:
      - text: "{p}มีกะเพราจากแปลงพอดี{k} ยายสอนต้มหน่อย"
        take: { basil: 1 }
        heart: 2
        reply: "มานั่งนี่จ้ะ… ทุบขิงก่อน ไม่ต้องแรง ขิงไม่ได้ทำผิดอะไร (หัวเราะ) …ฉีกกะเพรา อย่าหั่น ใบช้ำแล้วหอม ทีนี้ดมสิ นี่แหละกลิ่นบ้านเพียรตอนหลานเป็นสาวใหม่ๆ มาค้างปิดเทอม"
        next:
          - text: "ยายเพียรเคยต้มให้{p}เหรอ{kq}"
            heart: 2
            reply: "ต้มจ้ะ หลานบ่นว่าเผ็ดแต่ก็จิบหมด… เพียรมาเล่าให้ยายฟังทั้งหัวเราะ ‘หลานฉันกินยาเก่งกว่าฉันอีก’"
          - text: "{p}จะจดสูตรไว้{k}"
            heart: 1
            reply: "จดได้จ้ะ แต่จดแล้วต้องต้มนะหลาน สูตรในสมุดไม่เคยหายปวดให้ใคร"
      - text: "{p}กินยาแก้ปวดของภก.มดอยู่แล้ว{k}"
        heart: 1
        reply: "ก็ดีจ้ะ หนูมดเขาเรียนมา… จิบน้ำขิงด้วยก็ได้ ยาไม่ทะเลาะกับขิงหรอก ยายถามหนูมดแล้ว"
      - text: "ยายรู้ได้ไง{kq}ว่า{p}ปวด"
        heart: 1
        reply: "หลานเดินกุมท้องผ่านหน้าบ้านยายมาสองวันแล้ว ยายแก่แต่ตายังไม่บอดนะจ๊ะ"

  - id: bua_f_s_comb
    topic: smalltalk
    when: { gender: f, time: evening }
    npc: "หลานมานี่ ผมยาวแบบนี้ยายอยากหวีให้… สมัยสาวๆ ยายกับเพียรหวีผมให้กันริมคลองทุกเย็น ทาน้ำมันมะพร้าวเคี่ยว หอมไปทั้งทาง ใครเดินผ่านต้องหันมาดม"
    options:
      - text: "ยายหวีให้{p}หน่อยได้ไหม{kq}"
        heart: 2
        reply: "นั่งลงจ้ะ… (หวีช้าๆ) ผมหลานเส้นเหมือนเพียรเลยนะ ดำ แข็ง ดื้อ หวีลงยาก แต่พอลงแล้วไม่ยุ่งอีก นิสัยเดียวกับเจ้าของ"
      - text: "สมัยนี้ไม่ค่อยมีใครหวีผมให้กันแล้ว{k}"
        heart: 1
        reply: "ใช่จ้ะ ทุกคนมีหวีของตัวเอง แต่ไม่มีมือคนอื่น… ยายว่ามือคนอื่นหวีให้แล้วนอนหลับดีกว่านะหลาน"

  - id: bua_f_f_watching
    topic: self
    when: { gender: f, heart_min: 5 }
    npc: "วิชายาย ยายได้จากยายของยายนะหลาน ไม่มีตำรา… ผู้ชายในบ้านได้ตำราเลขยันต์กันคนละเล่ม ผู้หญิงได้แต่ยืนดูยายต้มยา แต่สุดท้ายตำราหายหมด หนูกินบ้าง น้ำท่วมบ้าง สิ่งที่ยืนดูยังอยู่ในมือยาย"
    options:
      - text: "งั้นวิชายายต้องมีคนรับต่อ{k}"
        heart: 2
        reply: "นั่นแหละหลาน… ยายไม่ได้ขอให้หลานเป็นหมอยานะ แค่มายืนดูยายบ่อยๆ ยืนดูนานพอ มือมันจำเองจ้ะ เหมือนที่ยายจำมือยาย"
        next:
          - text: "{p}จะมายืนดูทุกวันพระ{k}"
            heart: 2
            reply: "วันพระยายต้มยาหม้อใหญ่พอดีจ้ะ… มาแต่เช้านะ ยายจะให้หลานถือทัพพี ทัพพีของยายของยาย ด้ามไม้มะขาม ร้อยกว่าปีแล้ว ยังไม่หัก"
          - text: "ทำไมไม่จดเป็นตำราล่ะ{kq}"
            heart: 1
            reply: "จดได้จ้ะ หลานจดเลย… แต่จดคำยายนะ ห้ามแก้ ‘ไฟอ่อนเท่าใจคนรอ’ อย่าไปแก้เป็นองศา ยายไม่รู้จักองศา"
      - text: "ผู้ชายได้ตำรา ผู้หญิงได้ยืนดู ไม่ยุติธรรมเลย{k}"
        heart: 1
        reply: "ไม่ยุติธรรมจ้ะ… แต่ยายแก่เกินจะโกรธแล้ว เอาความโกรธไปต้มยาดีกว่า หม้อเดือดเร็วขึ้นนิดหน่อย"

  - id: bua_f_o_taew_list
    topic: others
    when: { gender: f, day_min: 7 }
    npc: "แต๋วมาหายายเมื่อวาน ถามว่าหลานเพียรควรคู่กับใครดี… แต๋วเขียนรายชื่อมาสามคนนะหลาน ยายอ่านไม่ออก ยายบอกแต๋วว่าคนที่ควรเลือกคือหลาน ไม่ใช่รายชื่อ"
    options:
      - text: "ใครอยู่ในรายชื่อบ้าง{kq}"
        heart: 1
        reply: "ยายจำได้อย่างเดียว… ชื่อที่สามแต๋วขีดฆ่า แล้วเขียนกำกับว่า ‘ไม่ได้ พูดเยอะ’ ยายไม่รู้ว่าแต๋วหมายถึงเขาหรือหมายถึงตัวเองนะหลาน"
      - text: "{p}ยังไม่อยากมีใคร{k}ยาย"
        heart: 2
        reply: "ไม่ต้องมีก็ได้จ้ะหลาน… ยายอยู่คนเดียวมาหลายสิบปี มีแมวหนึ่ง มีหมากหนึ่ง มีเพื่อนแก่ๆ อีกสองสามคน ใจยายยังเต็มอยู่เลย ใจที่เต็มแล้วไม่ต้องรอใครมาเติม"
