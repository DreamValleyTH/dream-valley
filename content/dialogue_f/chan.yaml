# ยายจันทร์ — บทคุยเฉพาะผู้เล่นหญิง
convos:
  - id: chan_f_r_unfinished
    topic: react
    once: true
    when: { gender: f, flag: met_chan, day_min: 4 }
    npc: "เจ้า… มานี่แหน่ลูกหลาน ข้อยมีของยายเพียรฝากไว้ ซิ่นตีนจกผืนหนึ่ง ยายเพียรมาเรียนจกกับข้อยตอนแก่ ทอได้ครึ่งตีน แล้วกะเลิก บอกว่า ‘ไว้หลานสาวมันกลับมา ให้มันทอต่อ’"
    set_flag: chan_f_sarong
    options:
      - text: "ยายเพียรมาเรียนทอผ้าด้วยเหรอ{kq}"
        heart: 2
        reply: "มาเด้อ มาทุกวันอังคาร มือแข็งเหมือนไม้ไผ่ จกผิดแล้วด่าตัวเองเสียงดัง ข้อยหัวเราะจนด้ายขาด… ยายเพียรบ่เก่งทอ แต่ยายเพียรบ่เลิกง่าย ยกเว้นผืนนี้"
        next:
          - text: "ทำไมยายถึงเลิกผืนนี้{kq}"
            heart: 2
            reply: "ยายว่าตาเริ่มฝ้า… แต่ข้อยว่ายายแกล้งเลิก ยายอยากให้เจ้ามีเหตุมาหาข้อย คนแก่บ่กล้าพูดว่า ‘มาหาข้อยแหน่’ เลยทิ้งงานไว้ให้มาทำแทน"
          - text: "{p}ทอไม่เป็นเลย{k}ยาย"
            heart: 1
            reply: "บ่เป็นหยัง ยายเพียรกะบ่เป็น ทอเบี้ยวไปครึ่งตีน ตอนนี้ครึ่งตีนที่เหลือเจ้าทอเบี้ยวต่อ สองคนเบี้ยวเหมือนกัน ผ้ามันกะสิเป็นผ้าผืนเดียวกัน"
      - text: "{p}ขอดูก่อนได้ไหม{kq}"
        heart: 1
        reply: "ดูเด้อ… ลายนาคตรงนี้ยายเพียรจกหัวนาคเบี้ยวไปทางซ้าย ข้อยว่าแก้ ยายบ่แก้ ยายว่านาคตัวนี้กำลังหันไปมองหลาน"
      - text: "เก็บไว้ที่ยายจันทร์ก่อนนะ{k}"
        heart: 0
        reply: "เก็บได้เด้อ ข้อยเก็บมาสามปีแล้ว เก็บต่อได้ ด้ายบ่เน่า… แต่คนเฒ่าอย่างข้อยบ่รู้ว่าสิอยู่เก็บได้อีกกี่ปีเด้อ เจ้าคิดแหน่"

  - id: chan_f_a_jok
    topic: advice
    when: { gender: f, flag: chan_f_sarong, heart_min: 2 }
    npc: "มาเรียนจกแล้วบ่… นั่งลงเด้อ ขนเม่นอันนี้ใช้เขี่ยด้าย นับเส้นยืนสามเส้นข้าม หนึ่งเส้นลอด ปากนับไปด้วยเด้อ ข้อยนับมาเจ็ดสิบปี ยังนับออกเสียงอยู่"
    options:
      - text: "สาม ข้าม หนึ่ง ลอด… แบบนี้ใช่ไหม{kq}"
        heart: 2
        reply: "แม่นแล้ว! มือเจ้าเบากว่ายายเพียรหลาย… ยายเพียรนับผิดแล้วโทษขนเม่น ข้อยเลยตั้งชื่อขนเม่นอันนี้ว่า ‘เพียร’ มันโดนด่าบ่อยที่สุดในเฮือน"
        next:
          - text: "ยายสอน{p}ลายที่แม่ยายสอนยายได้ไหม{kq}"
            heart: 2
            reply: "ลายนั้นต้องจกเป็นแล้วค่อยเรียนเด้อ… แต่ข้อยสิสอนแน่นอน ลายนี้แม่สอนข้อย ยายสอนแม่ ผู้หญิงในเฮือนข้อยส่งมือต่อกันมาเจ็ดชั่วคน เจ้าบ่ใช่หลานเฮือนข้อย แต่มือเจ้าใช้ได้"
          - text: "นิ้ว{p}เริ่มเจ็บแล้ว{k}"
            heart: 1
            reply: "เจ็บแหละ นิ้วใหม่บ่เคยจับด้าย… เจ็บสามวันแล้วด้านขึ้นมา ข้อยมีด้านตรงนี้ตั้งแต่สิบขวบ เป็นด้านที่ข้อยภูมิใจที่สุดในโต"
      - text: "ยากกว่าที่คิดเยอะเลย{k}"
        heart: 1
        reply: "ยากเด้อ… คนสมัยนี้มักของง่าย ข้อยบ่ว่า ของง่ายกะดี แต่ของยากมันจำเราได้ ซิ่นที่ทอยากๆ มันจำมือคนทอได้จนผ้าขาด"
      - text: "ซื้อผ้าเครื่องมาต่อตีนแทนได้ไหม{kq}"
        heart: -1
        reply: "ได้… ถ้าเจ้าอยากให้ยายเพียรลุกขึ้นมาตีหัว ข้อยว่าเจ้าลองทอก่อนสักเจ็ดวันเด้อ ถ้ายังบ่มัก ค่อยว่ากัน"

  - id: chan_f_n_kamfa
    topic: news
    when: { gender: f, day_min: 6 }
    npc: "งานกำฟ้าปีนี้แม่งานเป็นผู้หญิงทั้งหมดเด้อ… ข้อย ทองใบ พร กับแม่ค้าตลาดอีกสิบคน ทำข้าวหลามสามร้อยกระบอก แต่ป้ายขอบคุณหน้าศาลาเขียนชื่อนายกฯ ตัวใหญ่เท่าควาย"
    options:
      - text: "แล้วชื่อยายอยู่ตรงไหน{kq}"
        heart: 1
        reply: "อยู่ล่างสุดเด้อ ตัวเท่ามดแดง ‘และคณะแม่บ้าน’ … ข้อยบ่มีชื่อว่าคณะแม่บ้านเด้อ ข้อยชื่อจันทร์ เป็นแม่บ้านเฮือนข้อยคนเดียว"
        next:
          - text: "ปีหน้ายายทอชื่อตัวเองใส่ป้ายไปเลย{k}"
            heart: 2
            reply: "ฮ่า! เจ้านี่คิดคือข้อยแท้… ข้อยสิทอชื่อทุกคนที่เผาข้าวหลามใส่ผืนผ้ายาวเท่าป้าย ตัวใหญ่กว่าชื่อนายกฯ เด้อ แขวนข้างกัน ให้คนเลือกอ่านเอา"
          - text: "นายกฯ มาช่วยงานไหม{kq}"
            heart: 1
            reply: "มาเด้อ มาตอนข้าวหลามสุกแล้ว จับกระบอกหนึ่งถ่ายรูป ร้อนมือแล้วโยนทิ้ง… ข้าวหลามกระบอกนั้นหมาวัดได้กิน หมาวัดมันช่วยงานมากกว่า"
      - text: "เป็นแบบนี้ทุกปีเหรอ{kq}"
        heart: 1
        reply: "ทุกปีเด้อ… เปลี่ยนแต่ชื่อนายกฯ บนป้าย คนเผาข้าวหลามบ่เปลี่ยน มือเดิม ไฟเดิม ควันเข้าตาเดิม"

  - id: chan_f_s_three_sarongs
    topic: smalltalk
    when: { gender: f, heart_min: 1 }
    npc: "ไผมาถามเจ้าว่าเมื่อใดสิออกเฮือนบ่… สมัยข้อย สาวพวนต้องทอซิ่นไว้แต่งงานตั้งแต่สิบห้า ข้อยทอไว้สามผืน แต่งงานผืนเดียวเด้อ อีกสองผืนข้อยขาย ได้ควายมาตัวหนึ่ง"
    options:
      - text: "ยายเก่งกว่าการแต่งงานอีก{k}"
        heart: 2
        reply: "ฮ่า! ควายตัวนั้นทำนาให้ข้อยสิบปี ผัวข้อยเป่าแคนให้ฟังห้าสิบปี… ทั้งสองอย่างดีเด้อ ข้อยบ่เลือก แต่ควายบ่เคยเป่าแคนผิดคีย์"
      - text: "มีคนถาม{p}ทุกวันเลย{k}"
        heart: 1
        reply: "ถามกะตอบว่า ‘ทอซิ่นยังบ่แล้ว’ … เขาสิงงแล้วเลิกถาม คำตอบนี้ข้อยใช้มาตั้งแต่สาว ใช้ได้ทุกเทื่อ เพราะบ่มีไผรู้ว่าซิ่นผืนนั้นยาวเท่าใด"
      - text: "แล้วถ้าไม่แต่งเลยล่ะ{kq}"
        heart: 1
        reply: "บ่แต่งกะทอซิ่นใส่เองเด้อ… พี่สาวข้อยบ่แต่งงาน ปลูกหอมขายจนมีนาสามแปลง แม่ข้อยว่าพี่สาวข้อยแก่เป็นโสด ข้อยว่าพี่สาวข้อยแก่เป็นเจ้าของนา"

  - id: chan_f_f_seven
    topic: self
    when: { gender: f, heart_min: 5 }
    npc: "ลูกหลาน… ข้อยเป็นผู้หญิงชั่วที่เจ็ดในเฮือนที่จกลายนี้เป็น ลูกสาวข้อยบ่มัก ข้อยบ่โกรธแล้ว แต่บางคืนข้อยนอนบ่หลับ คึดว่าลายนี้สิไปหยุดอยู่ที่มือข้อย"
    options:
      - text: "{p}จะจำลายให้ยายเอง{k}"
        heart: 2
        reply: "…เจ้าพูดแท้บ่ เจ้าบ่ใช่ลูกหลานเฮือนข้อย แต่ข้อยเลือกได้เด้อว่าสิส่งมือให้ไผ แม่ข้อยเลือกข้อย บ่ได้เลือกพี่สาว เพราะพี่สาวมือหนัก ข้อยเลือกเจ้า"
        next:
          - text: "{p}จะจกให้ผ่านตาแม่ยาย ผ่านตายาย{k}"
            heart: 2
            reply: "ดีเด้อ… ข้อยสิไหว้แม่ก่อนนอนคืนนี้ บอกว่าเจ็ดชั่วคนบ่หยุดแล้ว ชั่วที่แปดเป็นหลานสาวเพียร แม่ข้อยคงหัวเราะ แม่กับเพียรเคยเถียงกันเรื่องปลาร้า"
          - text: "แล้วน้องมิวล่ะ{kq}"
            heart: 2
            reply: "มิวกะด้วยเด้อ มือมิวยังน้อย ใจมิวตั้ง… สองคน ลายข้อยสิได้อยู่ต่ออีกสองชั่วคน ข้อยนอนหลับแล้วคืนนี้"
      - text: "ลายมันต้องเป็นผู้หญิงสืบเท่านั้นเหรอ{kq}"
        heart: 1
        reply: "สมัยก่อนแม่น… สมัยนี้บ่แล้วเด้อ ไผมักกะมาเรียน ปาล์มมาขอเรียนอยู่ ข้อยบ่สอน เพราะปาล์มจดใส่สมุดอย่างเดียว บ่จับด้าย บ่เกี่ยวกับปาล์มเป็นผู้ชาย เกี่ยวกับปาล์มเป็นปาล์ม"

  - id: chan_f_o_bua_alone
    topic: others
    when: { gender: f, heart_min: 2 }
    npc: "เจ้าโดนถามบ่ ว่าอยู่ผู้เดียวบ่ย่านเหรอ… ข้อยกับบัวโดนถามมาสามสิบปีเด้อ ทุกปีคนถามคนใหม่ บัวตอบว่า ‘ย่านผี’ ข้อยตอบว่า ‘ย่านคนถาม’"
    options:
      - text: "ยายจันทร์ตอบแบบนั้นเลยเหรอ{kq}"
        heart: 2
        reply: "ตอบเด้อ คนถามหัวเราะ คึดว่าข้อยตลก… ข้อยบ่ได้ตลก ข้อยย่านแท้ ย่านคนที่ห่วงแล้วบ่มาช่วยตัดหญ้า มาแต่ถาม"
      - text: "แล้วยายบัวกลัวผีจริงไหม{kq}"
        heart: 1
        reply: "ย่านแท้เด้อ แต่บัวเล่าผีเก่งที่สุดในตำบล ย่านเองแล้วเล่าให้คนอื่นย่านด้วย บัวว่าย่านคนเดียวมันเหงา"
      - text: "{p}ไม่กลัวอยู่คนเดียวหรอก{k}"
        heart: 1
        reply: "ดีเด้อ… แต่ถ้ามีคืนใดย่าน มาเฮือนข้อยได้ ข้อยบ่ถามว่าย่านหยัง ข้อยสิจกผ้าให้เจ้าเบิ่ง เสียงกี่มันดังพอให้ผีบ่กล้าเข้า"
