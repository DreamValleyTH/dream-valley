# นก — บทคุยเฉพาะผู้เล่นหญิง
convos:
  - id: nok_f_r_came_back
    topic: react
    once: true
    when: { gender: f, flag: met_nok }
    npc: "แก! แม่เล่าว่าหลานยายเพียรเป็นผู้หญิง กลับมาทำฟาร์มคนเดียว… จริงดิ ตำบลนี้ผู้หญิงรุ่นเราออกไปหมด โรงงาน ห้าง ร้านนวด ไม่มีใครกลับ แกเป็นคนแรกที่กลับมาแบบไม่ได้กลับมาแต่งงาน"
    options:
      - text: "ทุกคนก็คิดว่า{p}กลับมาแต่งงานนะ"
        heart: 1
        reply: "แน่นอนแก ป้าแต๋วจัดคิวผู้ชายให้แกแล้วสามคน ฉันเห็นในสมุดป้า… หนึ่งในนั้นคือบอล ฉันขีดฆ่าให้แล้ว ไม่ใช่หึงนะ บอลไม่ว่าง บอลแต่งกับอู่ไปแล้ว"
        next:
          - text: "ขีดฆ่าให้ทำไม {p}ยังไม่ได้เลือกเลย"
            heart: 1
            reply: "จริงดิ… โอเค ฉันเติมกลับให้ก็ได้ แต่เติมด้วยดินสอนะ ไม่ใช่ปากกา ฉันยังไม่พร้อมให้ใครถาวร… หมายถึงบอลนะ บอลไม่พร้อม"
          - text: "ขอบใจ ประหยัดเวลา{p}ไปหนึ่งคน"
            heart: 2
            reply: "เห็นไหม ฉันคิดแบบโรงงาน ลดขั้นตอน เพิ่มประสิทธิภาพ… อีกสองคนแกจัดการเองนะ ฉันไม่รู้จัก คนนึงเป็นลูกพี่ลูกน้องเจ๊หงษ์ ฉันว่าแกโดนเจ๊จับชั่งน้ำหนักก่อนแน่"
      - text: "นกจะกลับมาเหมือนกันไหม"
        heart: 2
        reply: "จะกลับดิแก… อีกสองปี โอทีอีกสามพันชั่วโมง ฉันนับไว้แล้ว ตอนนี้มีแกกลับมาก่อน ฉันรู้สึกเหมือนมีคนไปจองที่นั่งรอฉันไว้"
      - text: "{p}กลับมาเพราะหมดไฟ ไม่ได้เท่าขนาดนั้น"
        heart: 1
        reply: "หมดไฟแล้วกลับ ก็เท่ากว่าหมดไฟแล้วอยู่ต่อแบบฉันนะ… ไม่ได้ประชดตัวเองนะแก ประชดนิดนึง"

  - id: nok_f_n_kpi
    topic: news
    when: { gender: f, time: evening }
    npc: "แก ฟังนี่ หัวหน้าไลน์ประกาศว่าบริษัทจ้างผู้หญิงเพราะ ‘มือเล็ก ละเอียด อดทน’ … ฉันยกมือถามว่างั้นขึ้นเงินให้ความอดทนได้ป่ะ เขาบอกว่าความอดทนไม่มีในตาราง KPI"
    options:
      - text: "แล้วความละเอียดมีในตารางไหม"
        heart: 2
        reply: "มี! หักเงินถ้าผิด ไม่บวกเงินถ้าถูก… ความละเอียดของเรามีแต่ขาลง เหมือนบ่อน้ำแถวนี้แหละแก"
        next:
          - text: "เหมือนคุณธนาพูดเลย ใช้ศัพท์สวยๆ กลบ"
            heart: 2
            reply: "จริงดิ! ผู้จัดการทุกบริษัทเรียนโรงเรียนเดียวกันป่ะ… ‘ความอดทน’ ของโรงงานฉัน กับ ‘ความยั่งยืน’ ของคุณธนา แปลว่าเดียวกัน แปลว่าเราจ่ายเอง"
          - text: "นกโดนหักบ่อยไหม"
            heart: 1
            reply: "ไม่บ่อย ฉันละเอียดจริง… โดนหักครั้งเดียวตอนนั่งหลับคาไลน์ หลังโอทีสี่ชั่วโมง เขาเขียนในใบเตือนว่า ‘ขาดความอดทน’ ฉันขำจนร้องไห้"
      - text: "ผู้ชายในไลน์ได้เงินเท่ากันไหม"
        heart: 1
        reply: "ไลน์ฉันไม่มีผู้ชาย ผู้ชายอยู่ฝ่ายซ่อมบำรุง ได้มากกว่าห้าร้อย เพราะ ‘งานหนัก’ … เขานั่งรอเครื่องเสียทั้งวัน เราประกอบชิ้นส่วนทั้งวัน แกว่าอันไหนหนัก"

  - id: nok_f_a_watch_me
    topic: advice
    when: { gender: f, heart_min: 2 }
    npc: "แก ฉันมีสูตร ถ้าใครในตำบลบอกแกว่า ‘ผู้หญิงทำไม่ได้หรอก’ อย่าเถียง ตอบว่า ‘เดี๋ยวดู’ แล้วทำให้ดูเลย… เถียงมันเปลืองแรง แรงเก็บไว้ทำโอที"
    options:
      - text: "ถ้าทำแล้วทำไม่ได้จริงๆ ล่ะ"
        heart: 2
        reply: "ก็บอก ‘เดี๋ยวดูอีกรอบ’ ไง ไม่มีกฎว่าต้องได้รอบแรก… ฉันเปลี่ยนยางมอไซค์เองรอบที่เจ็ดถึงได้ หกรอบแรกบอลยืนดูแล้วกลั้นขำ ฉันไม่ให้มันช่วย"
      - text: "บางทีก็อยากเถียงให้สะใจนะ"
        heart: 1
        reply: "เถียงได้แก ฉันก็เถียงบ่อย… แต่เถียงกับคนแก่ในตำบลนี้ไม่เคยชนะ เขามีเวลามากกว่าเรา เขาเถียงจนเราต้องขึ้นรถเมล์กลับโรงงาน"
      - text: "นกใช้สูตรนี้กับใครบ้าง"
        heart: 1
        reply: "กับแม่ กับหัวหน้า กับลุงสมหมายที่ว่าฉันยกถังส้มตำไม่ไหว… ใช้กับตัวเองด้วยแก ตอนที่ตัวเองบอกว่าเปิดร้านไม่ได้หรอก ฉันก็ตอบมันว่า ‘เดี๋ยวดู’"

  - id: nok_f_s_tell_often
    topic: smalltalk
    when: { gender: f, heart_min: 4 }
    npc: "แก… เพื่อนที่หอถามว่า ‘คนที่แกเล่าถึงบ่อยๆ นี่ผู้ชายป่ะ’ ฉันบอกผู้หญิง มันทำหน้างง ถามว่า ‘แล้วทำไมแกยิ้มแบบนั้น’ … ฉันก็งงตัวเองนิดนึงแก"
    options:
      - text: "แล้วยิ้มแบบไหนล่ะ"
        heart: 2
        reply: "แบบ… แบบตอนได้โบนัสมั้ง ไม่ใช่ จะบอกว่าแบบตอนลุงเชิดเลี้ยวรถเข้าตำบล แบบนั้น จริงดิ ฉันพูดอะไรออกไปเนี่ย ลืมไปเลยแก"
        next:
          - text: "ไม่ลืม {p}ชอบที่นกพูดแบบนั้น"
            heart: 2
            reply: "…โอเค งั้นไม่ลืมก็ได้ แต่ห้ามล้อนะ ฉันเพิ่งหน้าแดงครั้งแรกในรอบสามปี ครั้งล่าสุดคือตอนหัวหน้าเรียกชื่อผิดต่อหน้าทั้งไลน์"
          - text: "แบบเพื่อนสนิทไง ไม่ต้องงง"
            heart: 1
            reply: "เออ ใช่ แบบเพื่อนสนิท… แกพูดถูก แกพูดถูกเสมอ น่ารำคาญ ไปกินหมูปิ้งกันป่ะ ฉันเลี้ยง เป็นค่าที่แกทำให้ฉันไม่ต้องงง"
      - text: "นกเล่าเรื่องอะไรของ{p}บ้าง"
        heart: 1
        reply: "เล่าว่าแกปลูกพริกแล้วพริกเผ็ดกว่าที่ตลาด เล่าว่าแกไล่ไก่งวงป้าแต๋วด้วยไม้กวาด… เพื่อนบอกว่าชีวิตแกเหมือนละครเย็น ฉันบอกว่าดีกว่าละคร ละครไม่มีกลิ่นปุ๋ย"

  - id: nok_f_f_rich_husband
    topic: self
    when: { gender: f, heart_min: 5 }
    npc: "แก… เมื่อคืนแม่พูดอีกแล้ว ‘ถ้าแกได้ผัวรวยๆ หนี้เสี่ยเฮงก็หมด’ แม่ไม่ได้ใจร้ายนะ แม่แค่เหนื่อย… ฉันบอกแม่ว่าฉันใช้หนี้เองได้ อีกสองปี แม่ร้องไห้ ฉันก็ร้อง"
    options:
      - text: "นกใช้หนี้เองมาเจ็ดปีแล้ว เก่งกว่าผัวรวยทุกคน"
        heart: 2
        reply: "…แกพูดเหมือนป้าพรเลย ป้าพรพูดแบบนี้กับแม่ฉันทุกเดือน แม่ก็ยังพูดเรื่องผัวรวย ฉันว่าแม่ไม่ได้อยากได้ลูกเขยหรอกแก แม่อยากให้มีคนช่วยฉันแบก"
        next:
          - text: "งั้นให้{p}ช่วยแบกแทนผัวรวยก็ได้"
            heart: 2
            reply: "…จริงดิ แกไม่รวยนะ ฉันรู้ ยายเพียรทิ้งที่ไว้ให้ ไม่ได้ทิ้งเงิน แต่ฉันว่า… ฉันว่าแบบนี้ฉันชอบกว่า แบกคนละครึ่ง ไม่ต้องรวย ขอแค่ไม่วางฉันไว้คนเดียว"
          - text: "บอกแม่ไปว่านกมีแผนร้านส้มตำ"
            heart: 1
            reply: "บอกแล้ว แม่ถามว่าร้านส้มตำได้วันละกี่บาท ฉันบอกว่าไม่รู้ แม่ถามว่าแล้วจะใช้หนี้ยังไง ฉันบอกว่า ‘เดี๋ยวดู’ แม่ถอนหายใจ… สูตรฉันไม่เวิร์กกับแม่"
      - text: "แม่ก็แค่อยากให้นกสบาย"
        heart: 0
        reply: "รู้แก… แต่ทุกครั้งที่แม่พูด ฉันรู้สึกเหมือนเจ็ดปีที่ทำโอทีมันไม่นับ ต้องมีผู้ชายมาช่วยถึงจะนับ ฉันไม่ได้โกรธแม่ ฉันโกรธตารางที่ไม่นับ"

  - id: nok_f_o_ball_tire
    topic: others
    when: { gender: f, heart_min: 2 }
    npc: "บอลบอกว่าจะสอนแกเปลี่ยนยางมอไซค์ใช่ป่ะ… ระวังนะแก บอลสอนฉันตอนสิบสอง สอนสามชั่วโมง แล้วสุดท้ายแย่งไปเปลี่ยนเองเพราะทนดูไม่ได้ ผู้ชายบางคนสอนเก่งแต่ปล่อยมือไม่เป็น"
    options:
      - text: "งั้น{p}จะตบมือพี่บอลออกถ้าเขาแย่ง"
        heart: 2
        reply: "เอาเลยแก! ตบเบาๆ นะ มือเขาไว้ซ่อมรถทั้งตำบล… แต่ฉันว่าเขาไม่แย่งแกหรอก เขาโตแล้ว เดี๋ยวนี้เขาแค่ยืนกัดฟันแล้วพูดว่า ‘เดี๋ยวดูให้’ ช้าลงเยอะ"
      - text: "พี่บอลแย่งเพราะเป็นห่วงมั้ง"
        heart: 1
        reply: "ห่วงแหละ… บอลห่วงทุกคนแบบซ่อมให้ ไม่พูด ห่วงแบบน็อตหกเหลี่ยม แข็งแต่ขันแน่น ฉันคิดคำนี้เอง อย่าบอกบอลนะ เขาจะเอาไปเขียนบนป้ายอู่"
      - text: "นกเปลี่ยนยางเองได้หรือยัง"
        heart: 1
        reply: "ได้แล้วแก! เพิ่งได้ปีที่แล้ว… ยางแบนทุกเสาร์ ฉันเปลี่ยนเองได้ แต่ก็ยังเอาไปอู่บอลทุกเสาร์อยู่ดี อย่าถามว่าทำไม"
