convos:
  - id: somsak_f_niece_announce
    topic: react
    once: true
    when: { gender: f, flag: story_broadcast_welcome }
    npc: "หลาน… ผู้ใหญ่ขอโทษนะจ้ะ ประกาศต้อนรับเมื่อเช้า ผู้ใหญ่อ่านว่า ‘หลานชายยายเพียร’ ไปหนึ่งรอบ ผู้ใหญ่เขียนร่างไว้ก่อนเห็นหน้า… รอบสองกับรอบสามแก้แล้ว ย้ำอีกครั้งนะ รอบสองกับรอบสามถูก"
    options:
      - text: "ไม่เป็นไร{k}ผู้ใหญ่ ป้าแต๋วแก้ข่าวในกลุ่ม LINE ให้แล้ว"
        heart: 1
        reply: "ป้าแต๋วแก้ก่อนผู้ใหญ่ประกาศรอบสองอีกจ้ะ… ข่าวป้าแต๋วเร็วกว่าเสียงตามสาย ผู้ใหญ่เคยจับเวลา ผู้ใหญ่แพ้มาสิบสองปี"
      - text: "งั้นประกาศแก้อีกสามรอบเลยไหม{kq}"
        heart: 1
        reply: "ผู้ใหญ่คิดอยู่จ้ะ ร่างไว้แล้วด้วย ‘แก้ไขประกาศ หลานยายเพียรเป็นหลานสาว ย้ำอีกครั้งนะ หลานสาว’… แต่กลัวคนจะคิดว่ายายเพียรมีหลานสองคน"
      - text: "หลานชายก็ไม่เห็นเป็นไร{k}"
        heart: 0
        reply: "เป็นสิจ้ะ ระเบียบหอกระจายข่าวข้อสาม ‘ประกาศต้องถูกต้องตามความจริง’… ผู้ใหญ่ร่างระเบียบนี้เอง ผู้ใหญ่ผิดเอง ผู้ใหญ่ต้องแก้เอง"

  - id: somsak_f_could_run
    topic: self
    when: { gender: f, heart_min: 4 }
    npc: "หลาน ผู้ใหญ่จะบอกอะไรอย่างนึงนะ สมัยปี 2530 ถ้าผู้หญิงลงผู้ใหญ่บ้านได้ง่ายๆ เมียผู้ใหญ่คงได้เป็นแทนผู้ใหญ่ไปนานแล้ว เขาจำชื่อคนได้ทั้งหมู่ ผู้ใหญ่จำได้ครึ่งเดียว"
    options:
      - text: "ทำไมเมียผู้ใหญ่ไม่ลงล่ะ{kq}"
        heart: 1
        reply: "เขาบอกว่า ‘ผู้หญิงลง ผู้ชายในศาลาไม่ฟังหรอก ให้พ่อลง แม่จะเขียนให้’… แล้วเขาก็เขียนให้จริงๆ ยี่สิบปี ผู้ใหญ่อ่านอย่างเดียว"
        next:
          - text: "ตอนนี้ถ้าผู้หญิงลง ผู้ชายในศาลาจะฟังไหม{kq}"
            heart: 2
            reply: "ฟังไม่ฟังผู้ใหญ่ไม่รู้จ้ะ… แต่ระเบียบไม่ได้ห้าม ผู้ใหญ่อ่านมาสามรอบแล้ว ไม่มีคำว่าผู้ชายสักบรรทัด ย้ำอีกครั้งนะ ไม่มีสักบรรทัด"
          - text: "ผู้ใหญ่คิดถึงเขาไหม{kq}"
            heart: 2
            reply: "ทุกเช้าตอนเปิดไมค์จ้ะ… ผู้ใหญ่พูดช้าเพราะเขาบอกว่า ‘พ่อพูดเร็วคนแก่ฟังไม่ทัน’ ผู้ใหญ่ทำตามมาจนทุกวันนี้ เขาไม่อยู่ฟังแล้ว ผู้ใหญ่ก็ยังพูดช้า"
      - text: "ผู้ใหญ่กำลังชวน{p}ลงผู้ใหญ่บ้านเหรอ{kq}"
        heart: 1
        reply: "ผู้ใหญ่ไม่ได้ชวนจ้ะ ผู้ใหญ่ชวนใครไม่ได้ ผิดระเบียบ… ผู้ใหญ่แค่บอกว่าใบสมัครอยู่ลิ้นชักที่สองโต๊ะศาลา สำเนาบัตรสามชุด ย้ำอีกครั้งนะ ลิ้นชักที่สอง"
      - text: "{p}ไม่สนการเมือง{k}"
        heart: 0
        reply: "ไม่เป็นไรจ้ะ ผู้ใหญ่ไม่ได้ว่า… เมียผู้ใหญ่ก็พูดแบบนี้ แล้วก็มานั่งเขียนบันทึกประชุมทุกครั้ง คนไม่สนการเมืองบางคน สนตำบลมากกว่าคนลงสมัคร"

  - id: somsak_f_speak_list
    topic: advice
    when: { gender: f, day_min: 5 }
    npc: "หลานรู้ไหมว่าประชุมประชาคม จะพูดต้องลงชื่อขอพูดล่วงหน้าที่ผู้ใหญ่ ระเบียบมีมาสิบปีแล้วจ้ะ… แต่ไม่มีใครรู้ เพราะคนที่ได้พูดทุกครั้งคือคนที่ลุกขึ้นตะโกนก่อน"
    options:
      - text: "งั้น{p}ขอลงชื่อเป็นคนแรกเลย{k}"
        heart: 2
        reply: "ได้จ้ะ ผู้ใหญ่เขียนลงสมุดแล้ว ลำดับที่หนึ่ง… หลานเป็นคนแรกในสิบปีที่ลงชื่อตามระเบียบ ผู้ใหญ่ขอจับมือหน่อย ผู้ใหญ่ตื้นตัน"
      - text: "ตะโกนก่อนง่ายกว่า{k}"
        heart: 0
        reply: "ง่ายกว่าจ้ะ แต่ป้าแต๋วตะโกนชนะทุกคน แล้วทุกครั้งที่ป้าแต๋วชนะ ประชุมเลิกช้าไปชั่วโมง… ระเบียบมีไว้ให้คนเสียงเบาได้พูดบ้าง"
      - text: "ผู้ใหญ่จดชื่อไว้ให้{p}ได้ไหม{kq}"
        heart: 1
        reply: "จดแล้วจ้ะ ผู้ใหญ่จดไว้ตั้งแต่หลานมาถึงตำบล… ผู้ใหญ่จดทุกคน แต่คนส่วนใหญ่ไม่เคยมาขอใช้"

  - id: somsak_f_training
    topic: news
    when: { gender: f }
    npc: "ข่าวจาก อบต. จ้ะ เดือนหน้ามีอบรมสองหลักสูตร หลักสูตร ‘แม่บ้านยุคใหม่’ ร้อยพวงมาลัย ทำขนม ห่อของขวัญ… อีกหลักสูตร ‘การบริหารงบประมาณชุมชน’ รายชื่อส่งมาแล้ว ผู้ชายสิบสองคน"
    options:
      - text: "{p}ขอลงชื่ออบรมงบประมาณ{k}"
        heart: 2
        reply: "ระเบียบไม่ได้ห้ามจ้ะ ผู้ใหญ่ลงให้เลย… ย้ำอีกครั้งนะ ผู้ใหญ่ลงให้แล้ว สำเนาบัตรสามชุด ส่งพรุ่งนี้ก่อนเที่ยง"
        next:
          - text: "ชวนป้าแต๋วกับป้าพรไปด้วยได้ไหม{kq}"
            heart: 2
            reply: "ได้จ้ะ ผู้ใหญ่เพิ่มให้… ป้าแต๋วจบ ป.4 แต่ทอนเงินไม่เคยผิด ป้าพรจำได้ว่าใครติดเงินใครย้อนหลังห้าปี ผู้ใหญ่ว่าสองคนนี้ควรเป็นวิทยากร"
          - text: "ผู้ชายสิบสองคนเขาเรียนเรื่องอะไรกัน{kq}"
            heart: 1
            reply: "ผู้ใหญ่ดูกำหนดการแล้วจ้ะ… เช้าฟังบรรยาย เที่ยงกินโต๊ะจีน บ่ายถ่ายรูปรับเกียรติบัตร ผู้ใหญ่ไม่ได้พูดอะไรนะ ผู้ใหญ่แค่อ่านกำหนดการ"
      - text: "{p}อยากลงร้อยพวงมาลัย{k} ยายเคยสอนนิดหน่อย"
        heart: 1
        reply: "ดีจ้ะ ยายเพียรร้อยมาลัยถวายพระทุกวันพระ… ร้อยแบบแน่นจนลมพัดไม่ขาด ผู้ใหญ่ลงให้ทั้งสองหลักสูตรเลยนะ ระเบียบไม่ได้ห้ามลงสอง"
      - text: "ไม่ไปทั้งคู่{k}"
        heart: 0
        reply: "ไม่เป็นไรจ้ะ… แต่ถ้าวันหนึ่งหลานอยากรู้ว่างบล้านห้าหายไปไหน หลักสูตรที่สองเขาสอนวิธีเขียนรายงานให้มันหาย ผู้ใหญ่ว่าน่ารู้ไว้"

  - id: somsak_f_rice_knuckle
    topic: smalltalk
    when: { gender: f, time: noon }
    npc: "หลานกินข้าวหรือยังจ้ะ ผู้ใหญ่หุงข้าวเองมาห้าปี ยังแฉะทุกวัน… เมียผู้ใหญ่วัดน้ำด้วยข้อนิ้ว ผู้ใหญ่ลองแล้ว นิ้วผู้ใหญ่ยาวกว่า ข้าวเลยเป็นโจ๊ก"
    options:
      - text: "ข้อนิ้วเดียวพอ{k} ไม่ต้องวัดทั้งนิ้ว ยายสอน{p}"
        heart: 2
        reply: "ข้อเดียว… ข้อเดียวหรือจ้ะ ผู้ใหญ่วัดถึงโคนนิ้วมาห้าปี! ย้ำอีกครั้งนะ ห้าปี ผู้ใหญ่กินโจ๊กมาห้าปีเพราะอ่านระเบียบผิดข้อ"
        next:
          - text: "พรุ่งนี้{p}มาหุงให้ดูก็ได้{k}"
            heart: 2
            reply: "ขอบใจจ้ะหลาน… ผู้ใหญ่จะจดลงสมุด ‘วิธีหุงข้าว ฉบับหลานยายเพียร’ แปะข้างหม้อ ข้างรูปเมียผู้ใหญ่ เขาจะได้เห็นว่ามีคนมาสอนแทนแล้ว"
          - text: "แล้วผู้ใหญ่ไม่ถามใครเลยเหรอ{kq}"
            heart: 1
            reply: "ผู้ใหญ่อายจ้ะ… ผู้ชายอายุหกสิบ ถามใครว่าหุงข้าวยังไง ป้าแต๋วรู้ทั้งตำบลภายในสิบนาที ผู้ใหญ่เลยกินโจ๊กเงียบๆ"
      - text: "ข้าวแฉะก็อร่อย{k} กินกับไข่เค็ม"
        heart: 1
        reply: "ใช่จ้ะ ผู้ใหญ่ก็ปลอบตัวเองแบบนี้… ไข่เค็มป้าแต๋วฟองละสิบสอง ผู้ใหญ่ซื้อทุกวัน ป้าแต๋วคงเดาได้แล้วว่าข้าวผู้ใหญ่แฉะ"
      - text: "ซื้อหม้อหุงข้าวไฟฟ้าสิ{kq}"
        heart: 0
        reply: "นี่หม้อไฟฟ้าแล้วจ้ะ… ปัญหาไม่ใช่หม้อ ปัญหาคือคนกดปุ่ม ผู้ใหญ่เข้าใจระเบียบทุกข้อ ยกเว้นข้อในครัว"

  - id: somsak_f_matchmaking
    topic: others
    when: { gender: f, day_min: 6 }
    npc: "หลาน ผู้ใหญ่ต้องเล่าให้ฟังนะ เมื่อวานป้าแต๋วกับป้าพรมาขอใช้หอกระจายข่าว จะประกาศว่า ‘หลานยายเพียรยังโสด ใครสนใจติดต่อร้านป้าแต๋ว’… ผู้ใหญ่ปฏิเสธแล้วจ้ะ"
    options:
      - text: "ขอบคุณ{k}ผู้ใหญ่ ปฏิเสธว่ายังไง{kq}"
        heart: 2
        reply: "ผู้ใหญ่บอกว่าระเบียบหอกระจายข่าวไม่มีหมวด ‘หาคู่’ จ้ะ มีแค่ ข่าวราชการ ของหาย ราคาพืชผล งานบุญ… ป้าพรถามว่าให้ลงหมวดของหายได้ไหม ผู้ใหญ่บอกว่าหลานไม่ได้หาย"
      - text: "ให้ประกาศไปเลยก็ได้{k} อยากรู้ใครจะโทรมา"
        heart: 1
        reply: "หลานก็ใจกล้าเหมือนยายจริงๆ… ไม่ได้จ้ะ ผิดระเบียบ แต่ผู้ใหญ่บอกได้เลยว่าใครจะโทรมา ลุงหวัง สองครั้ง ขอยืมเงินก่อนแล้วค่อยจีบ"
      - text: "ป้าๆ ในตำบลว่างกันมากเลยนะ{kq}"
        heart: 0
        reply: "ไม่ว่างจ้ะ เขาห่วง… ห่วงแบบตำบลนี้ คือห่วงดังๆ ผ่านลำโพง ผู้ใหญ่เข้าใจ แต่ผู้ใหญ่ไม่ให้ยืมลำโพง"
