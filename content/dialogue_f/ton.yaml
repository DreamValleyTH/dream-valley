# เณรต้น — บทคุยเฉพาะผู้เล่นหญิง (gender: f) · เด็ก ไม่มีเรื่องรัก · เณรรักษาระยะห่างจากผู้หญิงตามธรรมเนียม แบบใสซื่อ
convos:
  - id: ton_f_r_distance
    topic: react
    once: true
    when: { gender: f, flag: met_ton }
    npc: "พี่ครับ… ขอผมถอยไปอีกสองก้าวนะครับ หลวงพ่อบอกว่าเณรต้องไม่อยู่ใกล้ผู้หญิง แต่หลวงพ่อไม่ได้บอกว่ากี่ก้าว ผมเลยกำหนดเองครับ เจ็ดก้าว"
    options:
      - text: "เจ็ดก้าวเลยเหรอ ทำไมต้องเจ็ด"
        heart: 1
        reply: "เพราะลุงจำรัสยืนห่างป้าทองใบห้าก้าวครับ แล้วป้าทองใบยังดุลุงได้ ผมเลยเผื่อไว้อีกสองก้าว"
        next:
          - text: "แล้วถ้าพี่ต้องตะโกนคุยล่ะ"
            heart: 1
            reply: "ก็ได้ครับ! แต่ถ่านจะเห่านะครับ ถ่านคิดว่าทุกคนที่ตะโกนกำลังทะเลาะกัน… ไม่เป็นไรครับ หกก้าวก็ได้"
          - text: "งั้นพี่ถอยให้ก้าวนึง เณรจะได้ไม่ต้องถอยเยอะ"
            heart: 2
            reply: "ขอบคุณครับพี่! งั้นเราถอยคนละสามก้าวครึ่งครับ… ครึ่งก้าวผมยังไม่รู้จะก้าวยังไง ผมจะไปฝึกที่ลานวัดครับ"
      - text: "เณรกลัวพี่เหรอ"
        heart: 0
        reply: "ไม่กลัวครับ! ผมกลัวแค่งูกับผี… พี่ไม่ใช่ทั้งสองอย่าง ผมเช็กแล้วครับ พี่มีเงา"
      - text: "ไม่เป็นไร พี่เข้าใจ เณรทำถูกแล้ว"
        heart: 2
        reply: "ครับ! หลวงพ่อบอกว่าไม่ใช่เพราะผู้หญิงไม่ดีนะครับ เป็นเพราะเณรต้องฝึกใจ… ใจผมยังฝึกไม่เสร็จครับ ตอนเย็นยังหิวอยู่เลย"

  - id: ton_f_n_cloth
    topic: news
    when: { gender: f }
    npc: "พี่ครับ! ลุงจำรัสให้ผมฝึกใช้ผ้ารับประเคนครับ เวลาผู้หญิงถวายของ ผมต้องวางผ้า แล้วเขาวางของบนผ้า ห้ามมือโดนกัน… เมื่อเช้าป้าพรถวายกล้วย ผมกางผ้าช้าไป กล้วยตกพื้นครับ"
    options:
      - text: "แล้วกล้วยเป็นไงบ้าง"
        heart: 1
        reply: "ถ่านเก็บไปครับ… ถ่านไม่ต้องใช้ผ้ารับประเคน ถ่านใช้ปาก ป้าพรหัวเราะจนต้องนั่งลงครับ"
      - text: "พี่มีมะม่วงพอดี มาซ้อมกัน"
        take: { mango: 1 }
        heart: 2
        reply: "จริงเหรอครับ! ผมกางผ้าแล้วครับ… พี่วางเลยครับ… ได้แล้ว! ไม่ตก! ครั้งที่สิบสี่ครับ สิบสามครั้งก่อนตกหมด ผมจะเก็บไว้ฉันพรุ่งนี้เช้า แล้วจะบอกหลวงพ่อว่าพี่เป็นครูซ้อมผม"
      - text: "ทำไมต้องใช้ผ้าด้วยล่ะ"
        heart: 1
        reply: "หลวงพ่อบอกว่าเป็นวินัยครับ เหมือนรั้ววัด ไม่ได้มีไว้กันคนดี มีไว้ให้ใจเราจำได้ว่าเราอยู่ตรงไหน… ผมท่องประโยคนี้มาสามวันแล้วครับ"

  - id: ton_f_a_alms
    topic: advice
    when: { gender: f, time: morning }
    npc: "พี่ครับ ถ้าพี่มาใส่บาตรพรุ่งนี้ วางของในบาตรเบาๆ ก็พอนะครับ แล้วก็… อย่าจับแขนผมนะครับ เมื่อวานมีป้าจากหมู่สี่จับแขนผมจะผูกสายสิญจน์ให้ ผมตกใจจนวิ่งไปหลบหลังหลวงพ่อ"
    options:
      - text: "ขอบใจที่บอกนะเณร พี่จะระวัง"
        heart: 1
        reply: "ครับ! ถ้าพี่อยากผูกสายสิญจน์ให้ผม ให้หลวงพ่อผูกแทนครับ หรือลุงจำรัสก็ได้ ลุงผูกแน่นมาก สามวันยังไม่หลุด"
      - text: "ป้าคนนั้นคงเอ็นดูเณรนะ"
        heart: 1
        reply: "ครับ ป้าบอกว่าผมเหมือนหลานป้า… ผมเลยกลับไปขอโทษป้าทีหลัง ยืนห่างเจ็ดก้าว ป้าต้องตะโกนตอบ ถ่านเห่าเลยครับ"
        next:
          - text: "แล้วป้าว่าไง"
            heart: 1
            reply: "ป้าบอกว่า ‘ไม่เป็นไรลูก ป้าลืมไปว่าหลานป้าเป็นเณรแล้ว’ ครับ… แล้วป้าก็ถวายขนมครกสิบลูก วางบนผ้า ไม่ตกสักลูกครับ"
          - text: "เณรขอโทษเก่งนะ"
            heart: 1
            reply: "หลวงพ่อสอนครับ ทำให้ใครตกใจ ต้องไปบอกเขาว่าเราไม่ได้โกรธ… แต่ผมก็ตกใจเหมือนกันนะครับ ไม่มีใครมาขอโทษผมเลย ฮิๆ"
      - text: "แต่ก่อนยายพี่ใส่บาตรเณรไหม"
        heart: 2
        reply: "ทุกวันพระครับ! ยายเพียรใส่ข้าวเหนียวหนึ่งปั้น กล้วยหนึ่งลูก แล้วบอกว่า ‘เณรตัวเล็ก กินเยอะๆ’ ยายไม่เคยจับแขนผมเลยครับ ยายรู้ทุกอย่าง"

  - id: ton_f_s_hair
    topic: smalltalk
    when: { gender: f }
    npc: "พี่ครับ… พี่ผมยาวแบบนั้นไม่ร้อนเหรอครับ ผมโกนหัวทุกวันโกน ยังร้อนเลยครับ ผมนับเหงื่อที่หยดจากหัวตอนกวาดลานได้สิบเจ็ดหยด"
    options:
      - text: "ร้อนสิ พี่ถึงต้องมัดผม"
        heart: 1
        reply: "อ๋อ! เหมือนถ่านครับ หน้าร้อนถ่านขนร่วงเต็มลานวัด… อันนี้ไม่เหมือนกันใช่ไหมครับ ผมขอโทษครับ ผมจะไม่เอาพี่ไปเทียบกับหมาอีกแล้ว"
      - text: "เณรอยากมีผมเหรอ"
        heart: 1
        reply: "ไม่อยากครับ ผมเคยมีตอนอยู่บ้าน แม่หวีให้ทุกเช้า ผมร้องไห้ทุกเช้าเพราะเจ็บ… ตอนนี้ไม่ต้องหวีแล้ว ร้องอย่างอื่นแทนครับ ร้องเพราะหิว"
      - text: "นับเหงื่อด้วยเหรอเณร"
        heart: 1
        reply: "นับครับ! วันไหนเกินยี่สิบหยด หลวงพ่อให้พักใต้ต้นโพธิ์ได้ครับ… วันนี้ผมนับช้าๆ ครับ"

  - id: ton_f_f_mom
    topic: self
    when: { gender: f, heart_min: 3 }
    npc: "พี่ครับ… ตอนพี่บอกให้ผมฉันข้าวเช้าเยอะๆ พี่พูดเหมือนแม่ผมเลยครับ แม่มาวัดได้เดือนละครั้งเอง แล้วแม่ก็ต้องนั่งห่างผมเหมือนพี่ครับ"
    options:
      - text: "แม่เณรคงอยากกอดเณรมากเลยนะ"
        heart: 2
        reply: "ครับ… แม่บอกว่าวันที่ผมสึก แม่จะกอดให้ครบทุกวันที่ไม่ได้กอด ผมนับให้แม่แล้วครับ เจ็ดร้อยกว่าวัน แม่ต้องกอดนานมากเลย"
        next:
          - text: "เณรอยากสึกเหรอ"
            heart: 1
            reply: "ยังไม่รู้ครับ… ผมอยากสอบนักธรรมให้ได้ก่อน แล้วค่อยให้แม่กอด กอดช้าหน่อยไม่เป็นไรครับ แม่บอกว่าแม่รอได้"
          - text: "งั้นพี่จะคอยดูให้เณรฉันข้าวครบแทนแม่นะ"
            heart: 2
            reply: "ได้ครับ! แต่ต้องดูจากเจ็ดก้าวนะครับ… หกก้าวก็ได้ครับ สำหรับพี่"
      - text: "เดือนละครั้งน้อยไปนะ"
        heart: 1
        reply: "แม่ทำงานโรงงานครับ วันหยุดน้อย… แม่นั่งรถลุงเชิดมา ลุงเชิดไม่เก็บค่ารถแม่ บอกว่า ‘ค่ารถแม่เณร ลุงถวายวัด’ ครับ"

  - id: ton_f_o_kitchen
    topic: others
    when: { gender: f }
    npc: "พี่ครับ ผมนับแล้ว วันพระที่แล้วครัววัดมีผู้หญิงสิบเอ็ดคน ผู้ชายหนึ่งคน คือลุงจำรัส ลุงเข้าไปชิมครับ… ผู้ชายคนอื่นนั่งรอที่ศาลา สามสิบสองคน"
    options:
      - text: "แล้วลุงจำรัสชิมแล้วว่าไง"
        heart: 1
        reply: "ลุงบอกว่า ‘เค็มไป’ ครับ ป้าทองใบเลยให้ลุงล้างหม้อสามใบ… หลังจากนั้นลุงชิมหม้อไหนก็บอกว่า ‘อร่อยทุกหม้อ’ ครับ"
      - text: "เณรว่าผู้ชายควรเข้าครัวบ้างไหม"
        heart: 2
        reply: "ควรครับ! หลวงพ่อบอกว่าบุญไม่ได้อยู่ที่ศาลาอย่างเดียว… ผมบอกลุงสมหมายแล้ว ลุงบอกว่าเข้าครัวไม่ได้ เพราะต้องนั่งฟังเลข ผมไม่เข้าใจครับ"
      - text: "ครัวคนเยอะก็วุ่นนะ"
        heart: 0
        reply: "วุ่นครับ แต่หอมมาก… ผมไม่ได้เข้าไปนะครับ ผมยืนดมอยู่หน้าประตู เจ็ดก้าวพอดี"
