# น้องมิว — บทคุยเฉพาะผู้เล่นหญิง (เด็ก ไม่มีเรื่องรัก)
convos:
  - id: mew_f_r_sack
    topic: react
    once: true
    when: { gender: f, flag: met_mew, day_min: 3 }
    npc: "พี่คะ! เมื่อวานหนูเห็นพี่แบกกระสอบปุ๋ยคนเดียว โอ๊ตบอกว่าผู้หญิงแบกไม่ได้ หนูเลยชี้ให้ดู โอ๊ตบอกว่าพี่แบกได้เพราะพี่เป็นผู้ใหญ่ ไม่ใช่เพราะพี่เป็นผู้หญิง… เขาเถียงเก่งขึ้นค่ะ หนูไม่ชอบ"
    options:
      - text: "โอ๊ตก็พูดถูกครึ่งนึงนะ"
        heart: 1
        reply: "ครึ่งไหนคะ… อ๋อ ผู้ใหญ่แบกได้ งั้นโตขึ้นหนูก็แบกได้ใช่ไหมคะ หนูจะบอกโอ๊ตว่าพี่ตัดสินแล้ว หนูชนะครึ่งนึง โอ๊ตชนะครึ่งนึง เขาจะงง"
        next:
          - text: "ไม่ต้องรอโต ลองยกถุงเล็กๆ ช่วยพี่ก่อนก็ได้"
            heart: 2
            reply: "ได้ค่ะ! หนูยกถุงเมล็ดผักบุ้งได้สองถุง… หนักนิดนึง หนูไม่บ่น หนูจะเล่าให้ยายฟังว่าหนูเป็นลูกมือพี่ ยายจะบอกว่าหนูเหมือนยายตอนเด็ก"
          - text: "อย่าไปเถียงกันเลยนะ"
            heart: 0
            reply: "ไม่ได้เถียงค่ะ หนูอธิบาย โอ๊ตต่างหากที่เถียง… ยายบอกว่าคนอธิบายกับคนเถียงหน้าเหมือนกัน แต่หนูว่าหน้าหนูน่ารักกว่า"
      - text: "พี่ก็เหนื่อยนะ แต่แบกไหว"
        heart: 1
        reply: "หนูรู้ค่ะ หนูเห็นพี่นั่งพักตรงศาลาแล้วถอนหายใจยาวมาก… ยาวเท่ายายตอนดูข่าวเลย หนูเอาน้ำแข็งเปล่ามาให้ได้นะคะ ฟรี"

  - id: mew_f_a_hair
    topic: advice
    when: { gender: f, time: morning }
    npc: "พี่คะ ทำนาต้องมัดผมสูงๆ แบบหนูนะคะ ผมจะได้ไม่ตีหน้า หนูกระโดดหนังยางผมไม่เคยตีหน้าเลย ยายมัดให้ทุกเช้า… หนูมัดให้พี่ได้ไหมคะ"
    options:
      - text: "ได้สิ มัดให้พี่หน่อย"
        heart: 2
        reply: "นั่งลงค่ะ… ดึงนิดนึงนะคะ ยายบอกว่าต้องดึงแน่นๆ ถึงจะอยู่ทั้งวัน เสร็จแล้ว! พี่เหมือนแชมป์หนังยางเลยค่ะ หนูให้หนังยางสีชมพูเส้นโปรดหนูด้วย ห้ามทำหายนะคะ"
      - text: "พี่ใส่หมวกงอบ ไม่ต้องมัด"
        heart: 1
        reply: "งอบมันบังแดดได้ แต่ลมพัดทีนึงผมพี่ก็ออกมาข้างๆ แบบป้าแต๋วตอนขี่มอไซค์… หนูไม่ได้ว่าป้าแต๋วนะคะ หนูแค่สังเกต"
      - text: "เดี๋ยวพี่สอนหนูถักเปียแบบใหม่"
        heart: 2
        reply: "จริงเหรอคะ! แบบที่เด็กในโทรศัพท์ถักใช่ไหมคะ ถักสามเส้นแล้วกลายเป็นมงกุฎ… หนูจะใส่ไปโรงเรียน โอ๊ตจะว่าหนูเหมือนเจ้าหญิง หนูจะบอกว่าเจ้าหญิงกระโดดหนังยางได้สูงกว่าเขา"

  - id: mew_f_n_leader
    topic: news
    once: true
    when: { gender: f, day_min: 5 }
    npc: "พี่คะ! ครูเต้ยให้เลือกหัวหน้าห้อง เพื่อนผู้ชายบอกว่าหัวหน้าต้องเป็นผู้ชาย หนูเลยถามว่าทำไม ไม่มีใครตอบได้เลยค่ะ ครูเต้ยหัวเราะแล้วบอกว่า ‘งั้นโหวต’"
    options:
      - text: "แล้วใครได้"
        heart: 1
        reply: "หนูค่ะ! ชนะหนึ่งคะแนน… โอ๊ตเลือกหนู เขาบอกว่าเลือกเพราะหนูเขียนกระดานสวย ไม่ได้เลือกเพราะหนูเก่ง แต่หนูว่าเขาเลือกเพราะหนูเก่ง เขาแค่อาย"
        next:
          - text: "เก่งมาก หัวหน้ามิว"
            heart: 2
            reply: "ขอบคุณค่ะ! งานแรกของหนูคือจดชื่อคนคุยในห้อง… หนูจดชื่อโอ๊ตสามรอบ เขาบอกว่าหนูแก้แค้น หนูบอกว่าหนูซื่อสัตย์ค่ะ"
          - text: "ทำไมเพื่อนคิดว่าต้องเป็นผู้ชายล่ะ"
            heart: 1
            reply: "เขาบอกว่าผู้ใหญ่ที่ประชุมศาลามีแต่ผู้ชายพูดค่ะ… หนูบอกว่าป้าแต๋วก็พูด เขาบอกว่าป้าแต๋วพูดแต่ไม่มีใครฟัง หนูเลยไม่รู้จะเถียงยังไง พี่ช่วยคิดหน่อยได้ไหมคะ"
      - text: "หนูถามดีมากเลยนะ"
        heart: 2
        reply: "จริงเหรอคะ ยายบอกว่าหนูถามทำไมเยอะเกินไป แต่ครูเต้ยบอกว่าคำถามที่ไม่มีใครตอบได้ เป็นคำถามที่ดีที่สุด หนูเลยจะถามเยอะกว่าเดิมค่ะ"

  - id: mew_f_s_like_you
    topic: smalltalk
    when: { gender: f, heart_min: 2 }
    npc: "พี่คะ หนูบอกยายว่าโตขึ้นหนูจะเป็นแบบพี่ ยายถามว่าแบบไหน หนูบอกแบบที่ไม่กลัวไก่งวงป้าแต๋ว ยายหัวเราะจนไอเลยค่ะ"
    options:
      - text: "จริงๆ พี่ก็กลัวไก่งวงนะ"
        heart: 2
        reply: "จริงเหรอคะ! แต่พี่เดินผ่านมันได้… อ๋อ กลัวแต่ก็เดินผ่าน หนูจะลองค่ะ ถ้าหนูโดนจิกหนูจะบอกยายว่าพี่สอน"
      - text: "เป็นแบบมิวก็ดีอยู่แล้ว"
        heart: 1
        reply: "หนูก็ว่างั้นค่ะ… แต่หนูอยากเป็นแบบหนูที่ขับรถไถได้เหมือนพี่ด้วย เป็นสองแบบพร้อมกันได้ไหมคะ"
      - text: "แบบไหนอีกที่หนูอยากเป็น"
        heart: 1
        reply: "แบบที่ไปกรุงเทพฯ แล้วกลับมาได้ค่ะ… แม่หนูไปแล้วยังไม่กลับ พี่ไปแล้วกลับ หนูจะเป็นแบบที่กลับ"

  - id: mew_f_f_sister
    topic: self
    when: { gender: f, heart_min: 4 }
    npc: "พี่คะ… หนูไม่มีพี่สาวค่ะ หนูมีแต่ยายกับโอ๊ต โอ๊ตไม่ใช่น้องหนูนะคะ เขาแค่อยู่ใกล้ หนูขอเรียกพี่ว่าพี่สาวได้ไหมคะ แค่ในใจก็ได้"
    options:
      - text: "เรียกออกเสียงเลยก็ได้ พี่สาวมิว"
        heart: 2
        reply: "พี่สาว… พี่สาว! หนูจะบอกครูเต้ย บอกยาย บอกโอ๊ต… ไม่บอกโอ๊ตดีกว่า เขาจะขอเป็นน้องชายพี่ด้วย หนูยังไม่พร้อมแบ่ง"
        next:
          - text: "แบ่งโอ๊ตบ้างก็ได้นะ"
            heart: 1
            reply: "ก็ได้ค่ะ… แบ่งวันละนิด วันเสาร์ให้เขา วันอื่นเป็นของหนู โอ๊ตชอบวันเสาร์อยู่แล้ว เขาไปดูควาย ไม่ว่างหรอก"
          - text: "พี่สาวต้องทำอะไรบ้าง"
            heart: 2
            reply: "ต้องฟังหนูเล่าเรื่องโรงเรียนค่ะ แล้วก็ช่วยหนูทำการบ้านเลขข้อยากๆ… แล้วก็ถ้าแม่วิดีโอคอลมาแล้วภาพค้าง พี่ต้องนั่งดูด้วยกัน หนูไม่อยากนั่งดูคนเดียว"
      - text: "พี่ก็ไม่มีน้องสาวเหมือนกัน"
        heart: 2
        reply: "งั้นเท่ากันค่ะ! พี่ได้น้องสาว หนูได้พี่สาว ไม่มีใครเสียเปรียบ… ยายบอกว่าแบบนี้เรียกว่ายุติธรรม หนูชอบคำนี้"

  - id: mew_f_o_chan
    topic: others
    when: { gender: f, heart_min: 3 }
    npc: "พี่คะ ยายจันทร์บอกว่าพี่กับหนูควรไปเรียนจกผ้าด้วยกัน ยายบอกว่า ‘สองคนเบี้ยวพร้อมกัน จะได้บ่อาย’ … หนูยังไม่รู้ว่าบ่อายแปลว่าอะไร แต่ยายหัวเราะ"
    options:
      - text: "แปลว่าไม่อายจ้ะ ไปเรียนด้วยกันนะ"
        heart: 2
        reply: "เย้! หนูจะจกลายดอกแก้ว พี่จกอะไรคะ… พี่เลือกลายง่ายๆ ก่อนนะคะ หนูไม่อยากให้พี่ร้องไห้ ยายจันทร์บอกว่าคนเริ่มจกครั้งแรกร้องไห้กันหมด"
      - text: "พี่มือหนักนะ จะเบี้ยวกว่ามิวอีก"
        heart: 1
        reply: "ไม่เป็นไรค่ะ ยายจันทร์เก็บผืนแรกตอนสิบขวบไว้ เบี้ยวเหมือนปลาไหล ยายยังเป็นคนทอเก่งที่สุดได้เลย พี่เบี้ยวได้สบายเลยค่ะ"
      - text: "ทำไมยายจันทร์อยากให้เราไปเรียน"
        heart: 1
        reply: "ยายบอกว่าลายมันต้องมีมือคนในตำบลคอยจำ ถ้าไม่มีใครจำ ลายจะหายไปกับลม… หนูว่าน่าเศร้าค่ะ หนูเลยจะจำให้หมด"
