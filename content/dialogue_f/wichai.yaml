convos:
  - id: wichai_f_mic_side
    topic: react
    once: true
    when: { gender: f, flag: story_meeting1 }
    npc: "คุณครับ ผมขอชี้แจงว่าการที่คุณยกมือในประชุมแล้วไม่ได้พูด ไม่ได้เป็นนโยบายนะครับ เป็นข้อจำกัดทางเทคนิค ไมค์เรามีสายเดียว และสายนั้นอยู่ฝั่งผู้ชาย… เพราะฝั่งผู้ชายใกล้ปลั๊กครับ"
    options:
      - text: "ย้ายปลั๊กไม่ได้เหรอ{kq}"
        heart: 1
        reply: "ประเด็นการย้ายปลั๊กอยู่ระหว่างการศึกษาความเป็นไปได้ครับ ในส่วนของงบประมาณ ค่าศึกษาสามหมื่น ค่าปลั๊กสามสิบห้าบาท ผมรับทราบว่าสัดส่วนดูแปลก แต่เป็นสัดส่วนที่เป็นรูปธรรมครับ"
      - text: "นายกฯ ไม่เห็น{p}ยกมือเลยเหรอ{kq}"
        heart: 0
        reply: "ผมเห็นครับ ผมบันทึกไว้ในใจว่ามีผู้แสดงความประสงค์จะแสดงความคิดเห็น… แล้วผมก็ปิดประชุมก่อนที่ใจผมจะได้ประมวลผลครับ ผมขอโทษจริงๆ"
      - text: "ไม่เป็นไร{k} ครั้งหน้า{p}จะเดินไปที่ไมค์เอง"
        heart: 1
        reply: "ผมไม่สามารถห้ามได้ครับ ระเบียบไม่มีข้อห้ามการเดิน… ผมแค่ขอเตือนว่าสายไมค์ยาวสามเมตร คุณต้องเดินไปจนถึงฝั่งผู้ชาย ซึ่งในเชิงสัญลักษณ์ก็เป็นภาพที่ดีครับ ผมจะให้ทีมถ่ายรูป"

  - id: wichai_f_women_budget
    topic: news
    when: { gender: f }
    npc: "ข่าวดีครับ อบต. ได้รับงบ ‘ส่งเสริมบทบาทสตรีในชุมชน’ ครับ ห้าหมื่นบาท เราได้ดำเนินการอย่างเป็นรูปธรรมแล้ว คือป้ายไวนิลหน้า อบต. ขนาดสามคูณหกเมตร ครับ"
    options:
      - text: "ป้ายมีรูปใคร{kq}"
        heart: 0
        reply: "รูปผมครับ ยืนตรงกลาง ล้อมรอบด้วยแม่บ้านสิบสองคน… ทีมงานบอกว่าองค์ประกอบภาพสื่อถึงผู้นำที่ให้ความสำคัญกับสตรี ผมเห็นด้วยครับ ผมยืนอยู่ตรงกลางของความสำคัญ"
        next:
          - text: "แล้วแม่บ้านสิบสองคนได้อะไร{kq}"
            heart: 1
            reply: "ได้ข้าวกล่องคนละกล่องครับ… และได้อยู่บนป้ายเป็นเวลาหนึ่งปีงบประมาณ ผมเรียกว่าการเพิ่มพื้นที่ทางสังคมครับ พื้นที่สามคูณหกเมตร"
          - text: "รอบหน้าให้พวกเขายืนตรงกลางบ้างสิ{kq}"
            heart: 2
            reply: "…ข้อเสนอที่ดีครับ แต่ผมต้องเรียนว่าตรงกลางมีที่ยืนคนเดียว… (เงียบ) ผมเพิ่งรู้ตัวครับว่าประโยคเมื่อกี้ตอบตัวเองได้หมดแล้ว"
      - text: "ห้าหมื่นได้ป้ายเดียวเหรอ{kq}"
        heart: 1
        reply: "ป้ายหนึ่งผืนกับพิธีเปิดป้ายหนึ่งครั้งครับ พิธีเปิดมีพวงมาลัย ซึ่งเราจ้างกลุ่มแม่บ้านร้อย… ดังนั้นในเชิงเศรษฐกิจ เงินก็ไปถึงสตรีจริงครับ สามร้อยบาท"
      - text: "อย่างน้อยก็ยังมีงบ{k}"
        heart: 0
        reply: "ขอบคุณครับ คุณเป็นคนแรกที่มองเห็นแง่บวก… ภรรยาผมเห็นป้ายแล้วไม่พูดอะไรเลยครับ เธอไม่พูดอะไรสามวัน ผมกำลังศึกษาความหมาย"

  - id: wichai_f_acknowledge
    topic: advice
    when: { gender: f, day_min: 4 }
    npc: "ผมมีคำแนะนำให้คุณครับ เป็นประสบการณ์ตรง ในที่ประชุม ถ้ามีคนพูดแทรกคุณ โดยเฉพาะผู้ชายวัยเกินห้าสิบ คุณอย่าเถียงครับ ให้พูดคำเดียว… ‘รับทราบค่ะ’ แล้วพูดต่อจากที่ค้างไว้"
    options:
      - text: "ได้ผลจริงเหรอ{kq}"
        heart: 1
        reply: "ได้ผลร้อยเปอร์เซ็นต์ครับ ไม่มีใครเถียงคำว่ารับทราบได้ มันเหมือนตอบแล้วแต่ไม่ได้ยอม… ผมใช้มาสองวาระ ผมรู้ดีที่สุดครับ"
      - text: "{p}จะเถียงตรงๆ ดีกว่า{k}"
        heart: 0
        reply: "นั่นเป็นสิทธิ์ของคุณครับ… ผมแค่ขอให้เถียงหลังจากถ่ายรูปหมู่แล้ว จะได้ไม่มีภาพที่ไม่พึงประสงค์ในเพจ อบต. ครับ"
      - text: "รับทราบ{k}"
        heart: 1
        reply: "…คุณเรียนเร็วมากครับ ผมเริ่มไม่แน่ใจว่าผมควรสอนคุณหรือเปล่า"

  - id: wichai_f_poster_model
    topic: smalltalk
    when: { gender: f, flag: met_wichai }
    npc: "คุณครับ อบต. มีโครงการ ‘คนรุ่นใหม่คืนถิ่น’ ครับ เราอยากเชิญคุณมาถ่ายรูปลงป้าย ผู้หญิงรุ่นใหม่ จบจากกรุงเทพฯ กลับมาทำเกษตร… ภาพลักษณ์ตรงกับตัวชี้วัดทุกข้อครับ"
    options:
      - text: "โครงการนี้ช่วยอะไรคนกลับบ้านบ้าง{kq}"
        heart: 1
        reply: "ในส่วนของการช่วยเหลือ… อยู่ระหว่างการพิจารณาครับ ตอนนี้ที่ชัดเจนแล้วคือป้าย ป้ายเสร็จก่อนโครงการครับ เป็นธรรมเนียม"
      - text: "ได้{k} แต่ขอถือจอบนะ ไม่ถือตะกร้าดอกไม้"
        heart: 1
        reply: "จอบ… ผมต้องถามทีมออกแบบครับ แบบร่างเป็นตะกร้าดอกไม้ ยิ้มเห็นฟันหกซี่ เหมือนผม… แต่คุณพูดถูก ผู้หญิงในตำบลเราถือจอบมากกว่าตะกร้า ผมแค่ไม่เคยเห็นในป้าย"
      - text: "ไม่ถ่าย{k} {p}ไม่ใช่ตัวชี้วัด"
        heart: -1
        reply: "ประโยคนี้… ผมจะไม่บันทึกครับ แต่ผมคงจำไปนาน"

  - id: wichai_f_wife_speeches
    topic: self
    when: { gender: f, heart_min: 4 }
    npc: "คุณครับ ผมจะสารภาพเรื่องหนึ่ง… สุนทรพจน์ของผมทุกฉบับในสองวาระ ภรรยาผมเป็นคนเขียนครับ ส่วนที่ตรงประเด็นเป็นของเธอ ส่วนที่วนเป็นของผม ผมเติมเองครับ"
    options:
      - text: "ทำไมต้องเติมส่วนที่วนด้วย{kq}"
        heart: 1
        reply: "เพราะส่วนของเธอสั้นเกินไปครับ สามนาทีจบ… ผู้ชายในศาลาบอกว่านายกฯ พูดสั้นแบบนี้ไม่มีน้ำหนัก ผมเลยเติมน้ำหนักให้ สี่สิบนาที จนตอนนี้ไม่มีใครหาประเด็นของเธอเจอแล้วครับ"
        next:
          - text: "ลองพูดแค่ส่วนของคุณนายดูสักครั้งสิ{kq}"
            heart: 2
            reply: "…ผมเคยลองซ้อมหน้ากระจกครับ สามนาที ตรงประเด็น ผมได้ยินตัวเองแล้วตกใจ ฟังเหมือนผู้นำ… ผมไม่แน่ใจว่าผมกล้าหรือเปล่าครับ"
          - text: "คุณนายรู้ไหมว่านายกฯ เล่าให้{p}ฟัง{kq}"
            heart: 1
            reply: "ไม่รู้ครับ และผมขอให้เป็นอย่างนั้น… ถ้าเธอรู้ เธอจะเขียนสุนทรพจน์ขอโทษให้ผมอ่าน แล้วผมก็จะเติมจนมันไม่เหลือคำขอโทษ"
      - text: "ตอนนี้คุณนายลงสมัครเอง ก็ดีแล้วนี่{kq}"
        heart: 1
        reply: "ป้ายเขียนว่า ‘สานต่องาน’ ครับ… ผมอยากบอกคนทั้งตำบลว่า เธอไม่ได้สานต่องานผม ผมต่างหากที่สานต่องานเธอมาตลอด แต่ประโยคนี้ไม่มีในสุนทรพจน์ฉบับไหน"
      - text: "แล้วนายกฯ ทำอะไรเองบ้าง{kq}"
        heart: -1
        reply: "ผมตัดริบบิ้นครับ… ผมตัดตรงทุกครั้ง ผมภูมิใจกับเรื่องนั้นจริงๆ ครับ"

  - id: wichai_f_pr_officer
    topic: others
    when: { gender: f, flag: story_thana_visit }
    npc: "บริษัทคุณธนาส่งเจ้าหน้าที่ประชาสัมพันธ์คนใหม่มาประสานงานกับ อบต. ครับ ทุกคนบอกว่าส่งมาเพราะหน้าตาดี… แต่เธอส่งเอกสารเร็วกว่าคุณธนาสามเท่า และตอบคำถามตรงกว่าผมครับ ผมเริ่มกังวล"
    options:
      - text: "กังวลเพราะเธอเก่งกว่าที่คิดเหรอ{kq}"
        heart: 1
        reply: "กังวลเพราะทุกคนในห้องประชุมมองหน้าเธอ แต่ไม่มีใครอ่านเอกสารเธอครับ… ยกเว้นผม ผมอ่านทุกบรรทัด บรรทัดสุดท้ายเขียนว่า ‘ปริมาณการสูบตามจริงโปรดดูภาคผนวก’ และไม่มีภาคผนวกแนบมาครับ"
        next:
          - text: "นายกฯ ถามหาภาคผนวกหรือยัง{kq}"
            heart: 1
            reply: "ผมถามครับ เธอตอบว่า ‘ดิฉันส่งไปแล้วสามรอบค่ะ ถูกดึงออกก่อนถึงมือท่านทุกรอบ’… แล้วเธอก็ยิ้มกลับไปเป็นพีอาร์ ผมว่าเธอกำลังบอกอะไรผมครับ"
          - text: "นายกฯ ระวังตัวด้วยนะ{kq}"
            heart: 1
            reply: "ขอบคุณครับ… คุณเป็นคนแรกที่บอกให้ผมระวังตัว ไม่ใช่ระวังคำพูด ผมรับทราบครับ ในความหมายที่ไม่วน"
      - text: "บริษัทชอบใช้ผู้หญิงสวยๆ เป็นหน้าตาจัง"
        heart: 1
        reply: "อบต. ก็เหมือนกันครับ… ป้ายรณรงค์ทุกป้ายของเราใช้รูปผู้หญิง ส่วนป้ายโครงการทุกป้ายใช้รูปผม ผมไม่เคยสังเกตจนคุณพูดครับ"
      - text: "นายกฯ ก็อ่านเอกสารให้เร็วขึ้นสิ{kq}"
        heart: 0
        reply: "ผมอ่านเร็วไม่ได้ครับ ผมต้องอ่านช้าเพื่อให้มีเวลาคิดว่าจะไม่ตอบอะไร… นั่นคือทักษะครับ ไม่ใช่ความช้า"
