convos:
  - id: praew_f_girls_count
    topic: react
    once: true
    when: { gender: f, flag: met_praew, day_min: 2 }
    npc: "{player}รู้ไหมคะ ตำบลนี้ผู้หญิงอายุยี่สิบถึงสามสิบที่อยู่จริงมีสี่คนค่ะ แพรว หมอแอน ครูเต้ย แล้วก็นกที่มาแค่เสาร์อาทิตย์… ตอนนี้ห้าคนแล้ว แพรวนับ{player}เข้าไปเมื่อคืน"
    options:
      - text: "งั้นตั้งกลุ่ม LINE เลยไหม{kq}"
        heart: 2
        reply: "ตั้งแล้วค่ะ! เมื่อคืนตีหนึ่ง ชื่อกลุ่ม ‘สาวโสดดงเย็น’… หมอแอนขอเปลี่ยนเป็น ‘ชมรมนอนก่อนห้าทุ่ม’ แพรวยอม เพราะหมอแอนเป็นคนเดียวที่ตอบภายในห้านาที"
        next:
          - text: "แล้วครูเต้ยว่าไง{kq}"
            heart: 1
            reply: "ครูเต้ยให้คะแนนชื่อกลุ่มหกเต็มสิบค่ะ แล้วส่งสติกเกอร์ดาวมาหนึ่งดวง… แพรวถือว่าผ่าน นกอ่านแล้วไม่ตอบ อยู่กะดึก แพรวเข้าใจ"
          - text: "ทำไมต้องมีคำว่าโสดด้วย{kq}"
            heart: 1
            reply: "ตั้งไว้กันพ่อแพรวขอเข้ากลุ่มค่ะ พ่อขอเข้าทุกกลุ่มในตำบล… กลุ่มนี้พ่อเข้าไม่ได้ เพราะพ่อไม่โสด พ่อแต่งงานกับไก่"
      - text: "ทำไมผู้หญิงรุ่นเราเหลือน้อยจัง{kq}"
        heart: 1
        reply: "ไปนิคมค่ะ ไปกรุงเทพฯ ไปแต่งงานอยู่อำเภออื่น… คนที่กลับมาคือคนที่หนีอะไรมาสักอย่าง แพรวหนีแฟนเก่า {player}หนีอะไรมาคะ"
        next:
          - text: "หนีหัวหน้าที่ตอบทุกอย่างว่า ‘รับทราบ’{k}"
            heart: 2
            reply: "โอ๊ย แบบเดียวกับนายกฯ วิชัยเลย หนีมาไกลขนาดนี้ยังเจออีก… ไม่เป็นไรค่ะ ที่นี่อย่างน้อยเราด่าหัวหน้าในกลุ่ม LINE ได้ เพราะหัวหน้าไม่รู้ว่ามีกลุ่ม"
          - text: "ยังไม่อยากเล่า{k}"
            heart: 0
            reply: "ได้ค่ะ แพรวไม่ถามต่อ… แพรวไม่ใช่ป้าแต๋ว แพรวรอได้ (แต่ไม่นานนะคะ)"
      - text: "ห้าคนก็เยอะแล้ว{k}"
        heart: 0
        reply: "เยอะสำหรับตำบลค่ะ แต่ไม่เยอะสำหรับป้าๆ ที่จะจับคู่ให้ แพรวได้ยินว่าป้าพรเริ่มทำรายชื่อแล้ว ระวังตัวนะคะ"

  - id: praew_f_presenter
    topic: news
    when: { gender: f, flag: story_thana_visit }
    npc: "บริษัทมาจ้างแพรวเป็น ‘พรีเซนเตอร์ประจำตำบล’ ค่ะ เขาบอกว่าหน้าแพรว ‘ขายความไว้ใจได้’… แพรวถามว่าแล้วปริญญาการตลาดแพรวขายอะไรได้บ้างคะ เขาเงียบไปสามวิ"
    options:
      - text: "แล้วแพรวรับไหม{kq}"
        heart: 0
        reply: "ไม่รับค่ะ แพรวเสนอกลับว่า จะรับเป็นที่ปรึกษาการตลาด คิดชั่วโมงละพันห้า ไม่ต้องใช้หน้า… เขาบอกว่า ‘ขอเอากลับไปคุยกับทีมก่อนครับ’ แปลว่าไม่"
      - text: "เอาหน้าแพรวไปขายเลยเหรอ{kq} ตลกร้ายมาก"
        heart: 1
        reply: "ตลกร้ายกว่านั้นอีกค่ะ เขาส่งรูปตัวอย่างมาให้ดูด้วย เป็นรูปแพรวที่ตัดต่อใส่เสื้อโปโลบริษัทแล้ว… ทำเสร็จก่อนถามแพรวสักคำ"
      - text: "เงินดีไหม{kq}"
        heart: -1
        reply: "ดีค่ะ ดีพอจะซื้อแพรวได้ทั้งเดือน… แต่แพรวไม่ได้ขายค่ะ {player} ถามแบบนี้แพรวเจ็บนิดนึงนะ"

  - id: praew_f_comments
    topic: advice
    when: { gender: f }
    npc: "ถ้า{player}จะไลฟ์ขายผักนะคะ เตรียมใจไว้เลย ผู้หญิงไลฟ์จะเจอคอมเมนต์ ‘น้องสวยจัง ขอเบอร์หน่อย’ มากกว่าคนสั่งของสิบเท่า… แพรวนับแล้ว สิบเท่าจริงๆ"
    options:
      - text: "แล้วแพรวรับมือยังไง{kq}"
        heart: 1
        reply: "แพรวตอบทุกคอมเมนต์เหมือนกันหมดค่ะ ‘ขอบคุณค่ะ ข้าวกล้องถุงละเก้าสิบนะคะ’… ตอบไปสามรอบ เขาจะสั่งหรือหายไป ได้ทั้งสองทาง แพรวกำไรทั้งสองทาง"
      - text: "{p}ไม่คิดจะไลฟ์หรอก{k}"
        heart: 0
        reply: "ไม่ไลฟ์ก็ได้ค่ะ แต่จำวิธีไว้ ใช้ได้ทุกที่ ในตลาด ในศาลา ในงานศพ… ทุกที่ที่มีคนถามเรื่องที่ไม่ใช่ธุระของเขา"
      - text: "ขอเบอร์แพรวได้ไหม{kq}"
        heart: 1
        reply: "ขอบคุณค่ะ ข้าวกล้องถุงละเก้าสิบนะคะ… ล้อเล่นค่ะ เบอร์แพรวอยู่ในกลุ่ม LINE ตั้งนานแล้ว {player}ไม่เคยทักมาเองต่างหาก"

  - id: praew_f_live_together
    topic: smalltalk
    when: { gender: f, heart_min: 4 }
    npc: "เมื่อวาน{player}ยืนข้างแพรวตอนไลฟ์แค่สองนาที ลูกค้าถามมาสิบคอมเมนต์ว่า ‘คนข้างๆ คือใครคะ’… แพรวตอบว่า ‘คนที่แพรวอยากให้ยืนข้างๆ ทุกไลฟ์ค่ะ’ ล้อเล่นค่ะ ครึ่งเดียว"
    options:
      - text: "ครึ่งไหนที่ไม่ได้ล้อเล่น{kq}"
        heart: 2
        reply: "ครึ่งที่… ไม่บอกค่ะ แพรวเป็นคนขายของ ต้องเหลืออะไรไว้ให้ลูกค้ากลับมาถามอีก"
        next:
          - text: "งั้น{p}จะกลับมาถามทุกวัน"
            heart: 2
            reply: "ได้ค่ะ แพรวจะตอบไม่เหมือนเดิมทุกวัน… สัญญาว่าวันไหนตอบตรง จะไม่ไลฟ์ตอนนั้น อันนี้ไม่ใช่ของขาย"
          - text: "แพรวเลี่ยงเก่งเหมือนนายกฯ เลยนะ{kq}"
            heart: 1
            reply: "ย่ะ! อย่าเอาแพรวไปเทียบกับนายกฯ ค่ะ… แพรวเลี่ยงสวยกว่า แล้วจบในสามประโยค ไม่ใช่สี่สิบนาที"
      - text: "ไลฟ์ด้วยกันอีกก็ได้นะ{kq} ใส่ผ้าทอยายจันทร์"
        heart: 2
        reply: "ตกลงค่ะ! ผ้าคลุมไหล่ยายจันทร์สองผืน คนละผืน… ยายจันทร์บอกว่าผ้าผืนนี้ทอให้คนที่ยืนข้างกันใส่ แพรวไม่ได้แต่งเรื่องนะคะ ยายพูดจริง"
      - text: "{p}ไม่ชอบออกกล้อง{k}"
        heart: 0
        reply: "ไม่เป็นไรค่ะ แพรวหันกล้องไปทางแปลงผักแทน… มีคนคอมเมนต์ว่าผักบุ้งของ{player}สวยกว่าแพรว แพรวยอมรับค่ะ วันนั้นแพรวไม่ได้รดน้ำตัวเอง"

  - id: praew_f_not_son
    topic: self
    when: { gender: f, heart_min: 3 }
    npc: "ตอนแพรวเด็กๆ ผู้ใหญ่มาบ้านทุกคนพูดประโยคเดียวกันค่ะ ‘เสียดายนะกำนัน ได้ลูกสาว ถ้าเป็นลูกชายได้เป็นกำนันต่อ’… พ่อยิ้ม แพรวยืนอยู่ตรงนั้น ได้ยินทุกครั้ง"
    options:
      - text: "พ่อแพรวตอบว่ายังไง{kq}"
        heart: 1
        reply: "พ่อไม่ตอบค่ะ พ่อยิ้มแล้วรินเหล้าให้เขา… แพรวโกรธพ่อมาสิบปี จนวันหนึ่งพ่อเมา พ่อบอกว่า ‘พ่อไม่ตอบเพราะพ่อกลัวว่าเขาพูดถูก แล้วลูกจะไม่ได้เป็นอะไรเลย’"
        next:
          - text: "แพรวเลยกลับมาทำแบรนด์เองใช่ไหม{kq}"
            heart: 2
            reply: "ใช่ค่ะ… ไม่ได้อยากเป็นกำนันนะ แพรวแค่อยากให้วันหนึ่งมีคนมาบ้านแล้วพูดว่า ‘แพรวทำได้’ โดยไม่มีคำว่าเสียดายนำหน้า"
          - text: "พ่อแพรวก็ภูมิใจในแพรวนะ{kq} {p}ดูออก"
            heart: 1
            reply: "พ่อภูมิใจแบบไก่ค่ะ… คืออวดคนอื่นแต่ไม่บอกเจ้าตัว แพรวรู้ค่ะ แพรวแค่อยากได้ยินเองสักครั้ง"
      - text: "ยังมีคนพูดแบบนั้นอยู่อีกไหม{kq}"
        heart: 0
        reply: "มีค่ะ แต่เปลี่ยนเป็น ‘เสียดายนะ เก่งขนาดนี้ยังไม่แต่งงาน’… ประโยคเปลี่ยน คนพูดคนเดิม แพรวตอบว่า ‘ยังไม่เสียดายค่ะ’ แล้วยิ้มแบบพ่อ"
      - text: "ถ้าแพรวเป็นลูกชาย ป่านนี้คงหนีไปกรุงเทพฯ แล้ว"
        heart: 1
        reply: "ฮ่าๆ จริงค่ะ ลูกชายกำนันทุกบ้านหนีไปหมด กลับมาแค่งานบวชกับงานศพ… ลูกสาวต่างหากที่กลับมาเลี้ยงไก่ให้พ่อ แพรวเลี้ยงให้ตอนพ่อไปประชุม แพรวไม่บอกใครนะคะ"

  - id: praew_f_font_size
    topic: others
    when: { gender: f, flag: story_posters }
    npc: "{player}เห็นป้ายคุณนายพเยาว์หรือยังคะ แพรวเอาไม้บรรทัดไปวัดมาแล้ว คำว่า ‘ภรรยานายกฯ วิชัย’ ตัวสูงสิบห้าเซนต์ ชื่อเขาเองสูงแปดเซนต์ค่ะ"
    options:
      - text: "ทำไมชื่อตัวเองเล็กกว่าล่ะ{kq}"
        heart: 1
        reply: "แพรวถามคนทำป้ายค่ะ เขาบอกว่า ‘คนรู้จักนายกฯ มากกว่า’… ตลกนะคะ คนทั้งตำบลโทรหาคุณนายตอนมีเรื่อง แต่ป้ายบอกว่าเขาเป็นแค่เมียคนที่ไม่รับสาย"
      - text: "แพรวว่างจริงๆ ถึงขั้นเอาไม้บรรทัดไปวัด"
        heart: 0
        reply: "ไม่ว่างค่ะ แพรวทำงานการตลาด การวัดฟอนต์คืองานค่ะ… ฟอนต์บอกความจริงมากกว่าสุนทรพจน์ทั้งอำเภอ"
      - text: "ป้ายทับป้ายร้านแพรวหรือเปล่า{kq}"
        heart: 0
        reply: "ทับค่ะ… ป้ายแพรวเหลือแค่คำว่า ‘ข้าวกล้อง’ ต่อท้ายป้ายคุณนาย อ่านรวมกันได้ว่า ‘สานต่องานที่ยังไม่เสร็จ ข้าวกล้อง’ ยอดสั่งขึ้นนะคะ ไม่รู้ทำไม"
