convos:
  - id: ann_f_queue_questions
    topic: react
    once: true
    when: { gender: f, flag: met_ann, day_min: 3 }
    npc: "เมื่อเช้าป้าพรในคิววัดความดันถาม{player}สามข้อติดกันใช่ไหมคะ ‘มีแฟนยัง’ ‘ทำไมยังไม่มี’ ‘จะเอาคนที่นี่ไหม’… แอนได้ยินค่ะ ความดันป้าพรขึ้นไปสิบ ตอนถามข้อสาม"
    options:
      - text: "หมอแอนช่วยตอบแทนให้ที{k} {p}ไปไม่เป็นเลย"
        heart: 1
        reply: "ครั้งหน้าแอนจะเรียกคิวป้าพรพอดีตอนข้อสองค่ะ แอนทำแบบนี้มาสามปีแล้ว… คนไข้ผู้หญิงทุกคนอายุต่ำกว่าสามสิบผ่านคิวป้าพรมาด้วยวิธีนี้"
      - text: "{p}บอกป้าพรว่ามีแฟนแล้ว ชื่อผักบุ้ง{k}"
        heart: 1
        reply: "ฮ่าๆ ป้าแต๋วเล่าให้แอนฟังแล้วค่ะ มุกนี้ไปถึง รพ.สต. ก่อน{player}อีก… ป้าพรถามแอนว่าผักบุ้งเป็นชื่อเล่นของใคร แอนบอกว่าความลับคนไข้ค่ะ"
      - text: "รำคาญนิดหน่อย{k}"
        heart: 0
        reply: "เข้าใจค่ะ… รำคาญได้นะคะ ไม่ต้องยิ้มตลอด แอนยิ้มมาสามปี แก้มแอนปวดกว่าหลังแอนอีก"

  - id: ann_f_grandma_herbs
    topic: advice
    when: { gender: f, heart_min: 2 }
    npc: "ยายแอนเป็นหมอตำแยค่ะ ยายสอนแอนไว้หลายอย่าง ไพลกับขมิ้นตำพอกแก้ฟกช้ำ ใบเตยต้มให้คนเพลีย… แอนจดไว้ทุกข้อ ข้อไหนวิทยาศาสตร์ยืนยันแล้วจดหมึกน้ำเงิน ยังไม่ยืนยันจดหมึกแดง"
    options:
      - text: "สอน{p}ด้วยได้ไหม{kq} อยากรู้ข้อน้ำเงิน"
        heart: 2
        reply: "ได้ค่ะ ข้อแรก ไพลตำกับเกลือนิดเดียว ห่อผ้าขาวบาง นาบตอนอุ่น ปวดเมื่อยหลังทำนาหายครึ่งหนึ่งค่ะ… ไพลมีหลังวัด ยายเพียรปลูกไว้"
        next:
          - text: "แล้วข้อแดงล่ะ{kq}"
            heart: 1
            reply: "ข้อแดงข้อที่แอนชอบที่สุด ‘เหนื่อยใจให้ไปนั่งริมคลองฟังน้ำ’ ค่ะ… ยังไม่มีงานวิจัยยืนยัน แต่แอนทำทุกเย็นวันศุกร์ ไม่เคยไม่ได้ผล"
          - text: "ยายเพียรปลูกไพลไว้ด้วยเหรอ{kq}"
            heart: 1
            reply: "ปลูกค่ะ ยายเพียรกับยายแอนเป็นเพื่อนกัน แลกสมุนไพรกันประจำ… ยายแอนเคยบอกว่า ผู้หญิงในตำบลนี้ไม่มีหมอ มีแต่กันเอง ตอนนี้มีแอนแล้ว แต่ก็ยังมีกันเองอยู่"
      - text: "หมึกแดงก็ใช้ได้ไหม{kq}"
        heart: 1
        reply: "บางข้อใช้ได้ค่ะ บางข้อห้ามเด็ดขาด… เช่น ‘ไข้ให้กินยาดองเหล้าขาว’ อันนั้นแอนขีดฆ่าสามเส้น แล้วเขียนว่า ‘มาหาแอน’"
      - text: "{p}ใช้ยาจากร้านเภสัชมดดีกว่า{k}"
        heart: 0
        reply: "ก็ดีค่ะ มดจ่ายยาแม่นมาก… แอนแค่อยากให้มีคนจำวิชายายไว้บ้าง ก่อนที่ทั้งตำบลจะจำได้แต่สติกเกอร์สวัสดีวันจันทร์"

  - id: ann_f_male_doctor
    topic: self
    when: { gender: f, heart_min: 3 }
    npc: "ตอนแอนมาบรรจุใหม่ๆ คนไข้ผู้ชายเดินเข้ามาถามว่า ‘หมอผู้ชายไม่อยู่เหรอ’ ค่ะ… รพ.สต. ที่นี่ไม่เคยมีหมอผู้ชายเลยนะคะ ตั้งแต่สร้างมา"
    options:
      - text: "แล้วหมอแอนตอบว่าอะไร{kq}"
        heart: 1
        reply: "แอนตอบว่า ‘วันนี้หมอผู้ชายลาค่ะ แอนดูแทน’… แล้วก็วัดความดันให้ ฉีดยาให้ ทำแผลให้ สามปีแล้วค่ะ หมอผู้ชายคนนั้นยังลาอยู่ คนไข้ไม่ถามอีกเลย"
        next:
          - text: "หมอแอนเก่งมากเลยนะ{kq}"
            heart: 2
            reply: "ขอบคุณค่ะ… แต่วันที่รู้สึกเก่งที่สุดคือวันที่ลุงคนนั้นพาหลานมาฉีดวัคซีน แล้วบอกหลานว่า ‘ไม่ต้องกลัว หมอคนนี้มือเบา’ แอนเข้าห้องน้ำไปยิ้มคนเดียวห้านาที"
          - text: "ตอนนั้นหมอแอนเสียใจไหม{kq}"
            heart: 1
            reply: "นิดหนึ่งค่ะ… คืนนั้นแอนโทรหายาย ยายบอกว่า ‘สมัยยาย ผู้ชายไม่ยอมให้ยายเข้าบ้านด้วยซ้ำ จนเมียเขาเจ็บท้อง’ แอนเลยรู้ว่าแอนโชคดีกว่ายายเยอะ"
      - text: "คนไข้แบบนั้นยังมีอยู่ไหม{kq}"
        heart: 0
        reply: "มีค่ะ แต่เปลี่ยนเป็น ‘หมอยังไม่แต่งงานเหรอ’ แทน… แอนว่าดีขึ้นนะคะ อย่างน้อยเขาเชื่อแล้วว่าแอนเป็นหมอ"
      - text: "ถ้า{p}อยู่ตอนนั้น {p}ตอบให้แล้ว"
        heart: 1
        reply: "ฮ่าๆ แอนว่า{player}จะตอบแรงกว่าแอนแน่ๆ… ไว้มีคนไข้แบบนั้นอีก แอนจะโทรเรียก ค่าจ้างเป็นพลาสเตอร์ลายดาวของครูเต้ยค่ะ"

  - id: ann_f_crochet_club
    topic: smalltalk
    when: { gender: f, time: evening }
    npc: "ทุกเย็นวันพฤหัส ยายจันทร์สอนแอนถักโครเชต์ใต้ถุนบ้านค่ะ มีป้าทองใบ ป้าพร บางทีแพรวด้วย… ป้าแต๋วตั้งชื่อให้ว่า ‘ชมรมถักไปนินทาไป’ {player}มาด้วยไหมคะ"
    options:
      - text: "ไป{k} {p}ถักไม่เป็นแต่นินทาเป็น"
        heart: 2
        reply: "ผ่านเกณฑ์รับสมัครค่ะ! ครึ่งหนึ่งของชมรมก็ถักไม่เป็นเหมือนกัน ป้าพรถักผ้าพันคอผืนเดียวมาสองปีแล้ว ยังไม่เสร็จ เพราะนินทาจนลืมนับห่วง"
      - text: "{p}มือไม่ค่อยว่าง{k} งานในแปลงเยอะ"
        heart: 0
        reply: "ไม่เป็นไรค่ะ มาตอนไหนก็ได้ ชมรมนี้ไม่มีสมุดลงชื่อ… ลุงจำรัสเสนอจะทำให้ ยายจันทร์ห้ามค่ะ"
      - text: "ป้าแต๋วตั้งชื่อตรงมากเลย"
        heart: 1
        reply: "ตรงจนยายจันทร์โกรธไปหนึ่งวันค่ะ แล้วก็ยอมรับว่าจริง… ชื่อในกลุ่ม LINE ตอนนี้ยังเป็นชื่อนั้นอยู่เลย"

  - id: ann_f_womens_day
    topic: news
    when: { gender: f }
    npc: "สัปดาห์หน้า รพ.สต. มีวันตรวจสุขภาพผู้หญิงฟรีค่ะ วัดความดัน ตรวจน้ำตาล ตรวจเต้านมด้วยตัวเอง… ปีที่แล้วป้าๆ มาต่อคิวตั้งแต่ตีห้า เพราะมีคนลือในกลุ่ม LINE ว่าแจกผ้าถุง"
    options:
      - text: "แจกผ้าถุงจริงไหม{kq}"
        heart: 1
        reply: "ไม่แจกค่ะ… แต่ปีที่แล้วพอป้าๆ มาแล้วไม่มีผ้าถุง แอนกลัวโดนด่า เลยวิ่งไปซื้อร้านป้าแต๋วมายี่สิบผืน ด้วยเงินแอนเอง ปีนี้แอนเลยประกาศชัดๆ ว่าไม่แจก ป้าๆ ไม่เชื่อ"
      - text: "{p}ไปตรวจด้วยดีไหม{kq}"
        heart: 2
        reply: "ดีค่ะ! อายุยี่สิบกว่าก็ควรเริ่มรู้จักตัวเองไว้… แอนจะสอนวิธีตรวจเอง ใช้เวลาห้านาที ทำเดือนละครั้งที่บ้าน ไม่ต้องมาต่อคิวตีห้าค่ะ"
      - text: "{p}ยังสาว ไม่ต้องตรวจหรอก{k}"
        heart: -1
        reply: "แอนได้ยินประโยคนี้บ่อยที่สุดค่ะ… จากคนที่กลับมาหาแอนตอนสายไปแล้ว มาเถอะนะคะ ห้านาที แอนไม่ดุ แอนขอร้อง"

  - id: ann_f_mew_dream
    topic: others
    when: { gender: f, day_min: 5 }
    npc: "น้องมิวมาทำแผลที่เข่าเมื่อวานค่ะ ล้มตอนวิ่งเล่น… ระหว่างทาแผลน้องบอกแอนว่า ‘โตขึ้นหนูจะไปเรียนกรุงเทพฯ แล้วกลับมาทำฟาร์มแบบพี่{player}ค่ะ’"
    options:
      - text: "น้องมิวพูดแบบนั้นจริงเหรอ{kq}"
        heart: 2
        reply: "จริงค่ะ แล้วน้องถามแอนว่า ‘พี่{player}ทำนาเองใช่ไหมคะ ไม่ต้องให้ผู้ชายช่วยใช่ไหมคะ’… แอนบอกว่า ‘ใช่ แต่ใครช่วยก็ไม่ผิดนะ’ น้องคิดนานมาก แล้วบอกว่า ‘งั้นหนูจะช่วยพี่{player}’"
        next:
          - text: "ให้น้องมิวมาช่วยรดน้ำที่ฟาร์มก็ได้{k}"
            heart: 2
            reply: "แอนจะบอกน้องให้ค่ะ… แต่ใส่หมวกนะคะ ทาครีมกันแดดด้วย แล้วกลับบ้านก่อนห้าโมง ยายน้องมิวฝากแอนดูแลเรื่องเข่าแล้ว เรื่องอื่นแอนขอฝาก{player}"
          - text: "{p}ไม่ได้เก่งขนาดนั้นหรอก{k}"
            heart: 1
            reply: "สำหรับเด็กอายุเก้าขวบ เก่งพอแล้วค่ะ… เด็กผู้หญิงที่นี่เห็นแต่ผู้หญิงขายของกับผู้หญิงไปทำโรงงานแบบแม่น้อง {player}เป็นแบบที่สามที่น้องไม่เคยเห็น"
      - text: "อย่าให้น้องมาเหนื่อยแบบ{p}เลย{k}"
        heart: 0
        reply: "แอนก็ห่วงแบบนั้นค่ะ… แต่แอนว่าน้องไม่ได้อยากเหนื่อย น้องอยากเลือกเอง อันนี้ต่างกันนะคะ"
      - text: "เข่าน้องเป็นอะไรมากไหม{kq}"
        heart: 1
        reply: "แผลถลอกนิดเดียวค่ะ ร้องไห้ไปสองนาที พอแอนบอกว่าพี่{player}ก็มีแผลแบบนี้ตอนทำนา น้องหยุดร้องทันที บอกว่า ‘งั้นเป็นแผลชาวนา’ ภูมิใจมากค่ะ"
