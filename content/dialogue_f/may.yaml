# เมย์ — บทคุยเฉพาะผู้เล่นหญิง
convos:
  - id: may_f_r_nong
    topic: react
    once: true
    when: { gender: f, flag: met_may, day_min: 3 }
    npc: "{player} เราเพิ่งสังเกต… ทั้งตำบลเรียกเราว่า ‘น้องนักข่าว’ เรียกเธอว่า ‘น้องหลานยายเพียร’ ส่วนผู้ชายอายุเท่ากันเป็น ‘ไอ้หนุ่ม’ ‘ช่าง’ ‘คุณ’ … พาดหัว: ผู้หญิงในดงเย็นเป็นน้องตลอดชีพ เราจดแล้ว"
    options:
      - text: "อายุหกสิบก็ยังเป็นน้องเหรอ{kq}"
        heart: 2
        reply: "ไม่ ตอนหกสิบกลายเป็น ‘ป้า’ ทันที ข้ามขั้นไปเลย ไม่มีช่วง ‘คุณ’ … ยกเว้นคุณนายพเยาว์ เป็นคุณนายเพราะผัว เราว่าเธอคงเหนื่อยกว่าเราอีก"
        next:
          - text: "แล้วพี่เมย์อยากให้เรียกว่าอะไร{kq}"
            heart: 2
            reply: "‘เมย์’ เฉยๆ… หรือ ‘คุณเมย์’ แบบที่คุณธนาเรียก เป็นคนเดียวในตำบลที่เรียกเราว่าคุณ น่าเศร้าที่คนที่ให้เกียรติเราที่สุดคือคนที่เรากำลังสืบ"
          - text: "เรียก ‘น้อง’ มันก็น่ารักดีนะ{k}"
            heart: 0
            reply: "น่ารัก… จนเราไปถามเรื่องงบที่ อบต. แล้วนายกฯ ตอบว่า ‘น้องยังเด็ก ไม่เข้าใจหรอก’ น้องคนนี้อ่านงบประมาณเป็นนะคะ น้องคนนี้นับเลขศูนย์ครบ"
      - text: "{p}ก็โดน ‘น้อง’ ทุกวัน{k}"
        heart: 1
        reply: "ใช่ไหม! เมื่อวานเราได้ยินเสี่ยเฮงเรียกเธอว่า ‘น้องเจ้าของที่’ … มีคำว่าเจ้าของที่อยู่ด้วยนะ แต่เขายังต้องใส่ ‘น้อง’ ข้างหน้า เหมือนกลัวคำว่าเจ้าของจะใหญ่เกินไป"

  - id: may_f_n_minutes
    topic: news
    once: true
    when: { gender: f, flag: story_meeting1 }
    npc: "{player} เราจับเวลาประชุมประชาคมวันนั้น… นายกฯ สี่สิบเจ็ดนาที เสี่ยเฮงสิบสอง กำนันหลับยี่สิบห้า ผู้หญิงทั้งศาลารวมกันสามนาที ป้าแต๋วสองนาทีครึ่ง อีกสามสิบวินาทีคือยายบัวไอ"
    options:
      - text: "{p}ยกมือสองรอบ ไม่มีใครเรียก{k}"
        heart: 1
        reply: "เราเห็น เราจดไว้ ‘ยกมือ 14:32 ไม่ถูกเรียก 14:41 ไม่ถูกเรียก’ … นายกฯ มองตรงมาทางเธอด้วยนะ มองแล้วเรียกผู้ใหญ่สมศักดิ์ซึ่งไม่ได้ยกมือ"
        next:
          - text: "รอบหน้าเราสองคนลุกขึ้นพูดพร้อมกันเลย{k}"
            heart: 2
            reply: "ตกลง! เธอพูด เราถ่าย ถ้าไมค์ไม่ส่งมา เราจะไลฟ์ ไลฟ์ไม่ต้องรอใครส่งไมค์… พาดหัว: สองสาวยึดศาลา ไม่สิ ‘สองคนในศาลาที่ถูกได้ยิน’"
          - text: "ยายบัวไอนับเป็นการพูดด้วยเหรอ{kq}"
            heart: 1
            reply: "นับ! ยายบัวไอตอนนายกฯ พูดว่า ‘โปร่งใส’ ทุกครั้ง สามครั้ง ตรงเป๊ะ เราไม่รู้ว่ายายตั้งใจไหม แต่เราใส่ไว้ในบทความว่าเป็น ‘ความเห็นแย้งจากผู้อาวุโส’"
      - text: "ป้าแต๋วพูดตั้งสองนาทีครึ่ง ถือว่าเก่ง{k}"
        heart: 1
        reply: "เก่งมาก โดนตัดบทสามรอบยังพูดต่อ… ป้าแต๋วบอกเราว่าเทคนิคคือพูดตอนที่นายกฯ หายใจ นายกฯ หายใจทุกสี่นาที ป้านับไว้ตั้งแต่สมัยแรก"

  - id: may_f_a_record
    topic: advice
    when: { gender: f, flag: story_thana_visit }
    npc: "คำแนะนำจากนักข่าวงบน้อย… ถ้าคุณธนาชวนคุยเรื่องที่ดิน อัดเสียงไว้นะ เขาจะพูดกับเธอนุ่มกว่าพูดกับลุงสมหมายสามเท่า ฟังกลับแล้วจะเห็นว่าเนื้อความแรงกว่าสามเท่าเหมือนกัน"
    options:
      - text: "พี่เมย์เคยฟังเทปเปรียบเทียบด้วยเหรอ{kq}"
        heart: 2
        reply: "ฟัง ลุงสมหมายได้ ‘ข้อเสนอทางธุรกิจ’ เธอได้ ‘ความห่วงใย’ ยายบัวได้ ‘ความเข้าใจ’ … ราคาเท่ากันทุกเทป คำห่อต่างกัน เราเรียกว่าห่อของขวัญให้ระเบิด"
      - text: "อัดเสียงคนอื่นโดยไม่บอก ผิดไหม{kq}"
        heart: 1
        reply: "คำถามดี… เราบอกเขาทุกครั้งนะ เราวางมือถือบนโต๊ะแล้วพูดว่า ‘หนูอัดนะคะ’ เขายิ้มแล้วบอก ‘ได้เลยครับ’ เพราะเขาคิดว่าผู้หญิงถือมือถือคือถ่ายเซลฟี่"
      - text: "{p}จำได้หมดอยู่แล้ว ไม่ต้องอัด{k}"
        heart: 0
        reply: "เราก็เคยคิดแบบนั้น… จนเราไปเล่าให้บก. ฟัง บก. บอก ‘น้องอาจจำผิด’ ตั้งแต่นั้นเราอัดทุกอย่าง แม้แต่เสียงตัวเองสั่งก๋วยเตี๋ยว"

  - id: may_f_s_alone
    topic: smalltalk
    when: { gender: f, time: noon }
    npc: "ทำไมทุกร้านในตำบลถามเราว่า ‘มาคนเดียวเหรอ’ ทุกครั้งที่เราเข้าไป… ถามเธอด้วยไหม เราเริ่มตอบว่า ‘มากับมือถือค่ะ’ พี่หน่อยหัวเราะ ร้านอื่นไม่หัวเราะ"
    options:
      - text: "โดน ร้านก๋วยเตี๋ยวถามว่าแฟนไม่มาด้วยเหรอ{k}"
        heart: 1
        reply: "แฟน… ข้ามขั้นไปอีก ต่อไปจะถามว่า ‘ลูกไม่มาด้วยเหรอ’ … ขอโทษนะ เราใช้เรื่องเธอเป็นข้อมูลแล้ว ข้อมูลสองชุด สรุปได้ว่าตำบลนี้นับหัวผู้หญิงเป็นคู่"
      - text: "งั้นมานั่งกินข้าวเป็นคู่กันเลย ให้เขางง{k}"
        heart: 2
        reply: "ได้! เราเลี้ยง… ข้าวเวฟสองกล่อง หรูไหม พาดหัว: สองสาวมาด้วยกัน ร้านไม่ต้องถาม ประสิทธิภาพการสื่อสารเพิ่มขึ้นร้อยเปอร์เซ็นต์"
      - text: "ไม่ต้องคิดมาก เขาถามเฉยๆ{k}"
        heart: 0
        reply: "ใช่ ถามเฉยๆ… เราแค่สงสัยว่าทำไมคุณธนาเข้าร้านคนเดียวไม่มีใครถามเฉยๆ บ้าง เขาโดนถามว่า ‘รับอะไรดีคะ’ อย่างเดียว"

  - id: may_f_f_byline
    topic: self
    when: { gender: f, heart_min: 5 }
    npc: "{player}… ตอนอยู่สำนักข่าวเก่า เราสืบข่าวทุจริตงบถนนอยู่สี่เดือน บก. ให้พี่ผู้ชายในทีมลงชื่อเป็นคนเขียน เพราะ ‘น่าเชื่อถือกว่า’ ข่าวนั้นได้รางวัล ชื่อเราอยู่บรรทัดขอบคุณ ต่อจากคนขับรถ"
    options:
      - text: "พี่เมย์ไม่โกรธเหรอ{kq}"
        heart: 1
        reply: "โกรธ… โกรธจนเปิดเพจเอง ตอนนี้ทุกข่าวในเพจมีชื่อเราตัวใหญ่ คนอ่านแปดพันคน ไม่มีรางวัล แต่ไม่มีบรรทัดขอบคุณด้วย เพราะไม่มีใครให้ขอบคุณ นอกจากข้าวเวฟ"
        next:
          - text: "ข่าวบ่อในตำบลนี้ต้องมีชื่อพี่เมย์ตัวใหญ่ที่สุด{k}"
            heart: 2
            reply: "…และชื่อเธอด้วย ในฐานะผู้ร่วมสืบ ไม่ใช่บรรทัดขอบคุณ เราสัญญา เรารู้ว่ามันรู้สึกยังไงเวลาถูกทำให้หายไปจากงานของตัวเอง"
          - text: "พี่ผู้ชายคนนั้นตอนนี้เป็นไง{kq}"
            heart: 1
            reply: "เป็นผู้ช่วย บก. แล้ว ส่งไลน์มาเมื่อเดือนก่อน ‘น้องเมย์ เรื่องบ่อน้ำน่าสนใจ ส่งมาให้พี่ดูก่อนได้นะ’ … เราอ่านแล้ววางโทรศัพท์ แล้วกินข้าวเวฟจนหมด"
      - text: "แต่ทุกคนในตำบลรู้ว่าใครเป็นคนสืบ{k}"
        heart: 2
        reply: "…ใช่ ป้าแต๋วรู้ ป้าพรรู้ ยายบัวรู้ ข่าวในตำบลนี้ไม่ต้องลงชื่อ ทุกคนรู้ว่าใครพูด เราว่าระบบนี้แฟร์กว่าสำนักข่าว แค่บางทีรู้มากเกินไป"

  - id: may_f_o_madam
    topic: others
    when: { gender: f, flag: act1_done }
    npc: "เราขอสัมภาษณ์คุณนายพเยาว์… ถามเรื่องนโยบาย เธอตอบเองทุกข้อ ชัดกว่านายกฯ สามเท่า แล้วนายกฯ เดินเข้ามาตอบซ้ำทุกข้อ ยาวกว่าเดิมสามเท่า เราตัดเสียงนายกฯ ออก คลิปสั้นลงครึ่งหนึ่ง"
    options:
      - text: "แปลว่าคุณนายทำงานจริงมาตลอดเหรอ{kq}"
        heart: 1
        reply: "แปลว่าคุณนายเป็นคนจัดตารางนายกฯ จำชื่อชาวบ้าน รู้ว่าบ้านไหนมีงานศพ มาสิบปี… แล้วก็แปลว่าคุณนายรู้ว่าเงิน ‘ศึกษาความเป็นไปได้’ ไปไหน รู้ทุกอย่างทั้งดีและไม่ดี เก่งไม่ได้แปลว่าสะอาด"
        next:
          - text: "ข่าวนี้เขียนยังไงไม่ให้ใจร้ายกับผู้หญิงด้วยกัน{kq}"
            heart: 2
            reply: "คำถามที่เราคิดทั้งคืน… เราจะเขียนเหมือนที่จะเขียนถึงผู้ชาย ไม่ชมว่าสวย ไม่ด่าว่าเป็นเมียใคร ถามแค่ว่าเงินไปไหน ความแฟร์คือการถามคำถามเดียวกัน"
          - text: "พี่เมย์ชอบคุณนายนะ{kq}"
            heart: 1
            reply: "ชอบที่เธอตอบตรง… และกลัวที่เธอตอบตรง เพราะคนที่ตอบตรงแบบนั้นรู้ตัวว่ากำลังทำอะไร เหมือนคุณธนา พาดหัว: คนเก่งสองคนในฝั่งที่เราไม่อยากให้ชนะ"
      - text: "นายกฯ ตอบซ้ำทำไม{kq}"
        heart: 1
        reply: "เพราะกลัวคนจำว่าคุณนายตอบ… นายกฯ บอกเราว่า ‘เขียนว่าผมเป็นคนให้สัมภาษณ์นะน้อง’ เราเขียนชื่อทั้งสองคน เรียงตามจำนวนคำตอบที่ตอบตรงคำถาม คุณนายอยู่บน"
