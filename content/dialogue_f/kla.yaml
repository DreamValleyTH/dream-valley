# กล้า ♥ — บทคุยเฉพาะผู้เล่นหญิง (gender: f) · สุภาพ จริงจัง ติดตัวเลข จีบเบาๆ อย่างให้เกียรติ ไม่มีเนื้อหาทางเพศ
convos:
  - id: kla_f_r_meeting
    topic: react
    once: true
    when: { gender: f, flag: story_meeting1 }
    npc: "{player} ครับ… ประชุมเมื่อวานผมพูดนานไปอีกแล้ว แล้วผมเพิ่งสังเกตว่าแถวหลังมีแต่ผู้หญิง สมาชิกสหกรณ์ผมหกสิบเปอร์เซ็นต์เป็นผู้หญิง แต่คนพูดในศาลาเป็นผู้ชายเก้าสิบเปอร์เซ็นต์ รวมผมด้วย… ผมเป็นส่วนหนึ่งของปัญหาครับ"
    options:
      - text: "งั้นรอบหน้าพี่ยื่นไมค์ให้คนอื่นบ้างสิ{kq}"
        heart: 2
        reply: "ผมคิดอยู่ครับ… รอบหน้าผมจะยกมือแล้วบอกว่า ‘ขอให้ป้าพรพูดแทนผม’ ป้าพรรู้เรื่องบ่อน้ำดีกว่าผม แค่ไม่เคยมีใครยื่นไมค์ให้"
        next:
          - text: "แล้วถ้า{p}ขอพูดเองล่ะ{kq}"
            heart: 2
            reply: "ผมจะนั่งฟังครับ ไม่แทรก ไม่เสริมตัวเลข… อาจจะจดตัวเลขส่งให้ใต้โต๊ะนิดหน่อย ถ้าคุณอยากได้"
          - text: "พี่ยอมรับง่ายดีนะ{k}"
            heart: 1
            reply: "ตัวเลขมันฟ้องครับ ผมเถียงตัวเลขไม่ได้… ผมเถียงได้แต่เสี่ยเฮง"
      - text: "พี่นับคนพูดด้วยเหรอ{kq}"
        heart: 1
        reply: "นับครับ สิบสามคน เป็นผู้หญิงหนึ่ง คือป้าแต๋ว แล้วไมค์ก็ดับ… ผมไม่คิดว่าไมค์สมคบคิด แต่ผมก็ไม่ตัดทิ้งสมมติฐานนี้ครับ"
      - text: "ก็ผู้หญิงไม่อยากพูดเองนี่{k}"
        heart: -1
        reply: "ผมเคยคิดแบบนั้นครับ… แล้วผมไปถามสมาชิกทีละคน ทุกคนมีเรื่องจะพูด แค่ไม่อยากพูดแล้วโดนหัวเราะ ลองคิดดูนะครับ ถ้าโดนหัวเราะทุกครั้งที่ยกมือ ผมก็ไม่ยก"

  - id: kla_f_n_treasurer
    topic: news
    when: { gender: f, day_min: 6 }
    npc: "สหกรณ์จะเลือกกรรมการใหม่ครับ ผมเสนอป้าพรเป็นเหรัญญิก มีสมาชิกผู้ชายสองคนค้านว่า ‘ให้ผู้หญิงถือเงินไม่ได้ เดี๋ยวเอาไปซื้อทอง’ ผมเลยเปิดบัญชีสามปีให้ดู คนยืมเงินสหกรณ์แล้วไม่คืน ผู้ชายสิบเอ็ดคน ผู้หญิงหนึ่งคน คนนั้นเอาไปผ่าตัดลูก"
    options:
      - text: "ตัวเลขชนะอีกแล้ว{k}"
        heart: 1
        reply: "ชนะครับ แต่สองคนนั้นลาออก… ไม่เป็นไรครับ ป้าพรหาสมาชิกใหม่มาแทนได้สี่คนในวันเดียว ทั้งหมดเป็นเพื่อนป้าพร ทั้งหมดถือเงินเป็น"
      - text: "ผู้หญิงซื้อทองก็คือการออมนะ{kq}"
        heart: 1
        reply: "ใช่ครับ! เจ๊หงษ์บอกผมว่าทองในคอคือธนาคารที่ไม่มีวันปิดสาขา… ผมเอาไปพูดในที่ประชุม ผู้ชายเงียบทั้งศาลา"

  - id: kla_f_a_compost_sacks
    topic: advice
    when: { gender: f, heart_min: 3 }
    npc: "{player} ครับ ถ้าจะขนปุ๋ยหมักไปแปลง ผมขนให้ได้นะครับ กระสอบละยี่สิบห้ากิโล… เอ่อ ผมไม่ได้หมายความว่าคุณขนไม่ได้ ผมหมายความว่า… ผมขอพูดใหม่ได้ไหมครับ"
    options:
      - text: "พูดใหม่ได้{k}"
        heart: 2
        reply: "ลองคิดดูนะครับ… ไม่ ไม่ต้องลองคิด ผมแค่อยากไปช่วยที่แปลงคุณ เพราะอยากไปที่แปลงคุณ ไม่เกี่ยวกับกระสอบ… กระสอบเป็นข้ออ้างครับ ขอโทษครับ ผมไม่เก่งเรื่องนี้"
        next:
          - text: "งั้นมาขนด้วยกันคนละกระสอบ{k}"
            heart: 2
            reply: "คนละกระสอบ ยุติธรรมที่สุดครับ… ผมจะไม่นับว่าใครขนได้มากกว่า ผมสัญญา ผมจะนับในใจ"
          - text: "เป็นข้ออ้างที่ดีนะ{k}"
            heart: 1
            reply: "…ขอบคุณครับ ผมใช้ข้ออ้างครั้งแรกในชีวิต นึกว่ามันจะฟังดูมีเหตุผลกว่านี้"
      - text: "{p}ขนได้{k} ขนมาสามกระสอบแล้วด้วย"
        heart: 1
        reply: "สามกระสอบ! เจ็ดสิบห้ากิโล… วันนี้ผมขนได้สองครับ ผมแพ้ ผมจะไม่เสนอขนให้อีก จะเสนอน้ำให้แทน"
      - text: "ไม่ต้อง{k} {p}จ้างคนแล้ว"
        heart: 0
        reply: "ครับ จ้างคนในตำบลใช่ไหมครับ ดีครับ เงินหมุนในชุมชน… ผมพูดเรื่องเงินหมุนตอนนี้ไม่ได้ช่วยอะไรเลยใช่ไหมครับ"

  - id: kla_f_s_vetiver
    topic: smalltalk
    when: { gender: f, heart_min: 4, time: morning }
    npc: "ป้าแต๋วถามผมว่าทำไมช่วงนี้ผมรดน้ำแปลงริมทางทุกเช้า ทั้งที่แปลงนั้นปลูกแค่หญ้าแฝก… ผมตอบไม่ได้ครับ ผมเลยบอกว่า ‘หญ้าแฝกต้องการความใส่ใจ’ ป้าหัวเราะไปจนถึงร้าน"
    options:
      - text: "แปลงนั้นอยู่ทางที่{p}เดินผ่านทุกเช้านี่{kq}"
        heart: 2
        reply: "…ใช่ครับ บังเอิญ… ไม่บังเอิญครับ ผมโกหกไม่เก่ง ผมแค่อยากพูดอรุณสวัสดิ์กับคุณทุกเช้า โดยไม่ต้องหาเรื่องสหกรณ์มาคุย"
        next:
          - text: "งั้นพรุ่งนี้พูดได้เลย{k} ไม่ต้องรดหญ้า"
            heart: 2
            reply: "ได้ครับ… แต่ผมจะรดหญ้าด้วย มันเริ่มชินแล้ว ถ้าหยุดมันจะน้อยใจ เหมือนผม"
          - text: "ป้าแต๋วรู้แล้ว ทั้งตำบลรู้แน่{k}"
            heart: 1
            reply: "ผมทราบครับ ข่าวในกลุ่ม LINE ใช้เวลาเฉลี่ยสี่สิบนาที… ผมพร้อมแล้ว ผมเคยโดนเสี่ยเฮงด่าในกลุ่ม อันนี้เบากว่าเยอะ"
      - text: "หญ้าแฝกต้องการความใส่ใจจริงๆ{k}"
        heart: 1
        reply: "ใช่ไหมครับ! รากลึกสามเมตร ยึดดินไม่ให้พัง… ขอโทษครับ ผมเทศน์อีกแล้ว ทั้งที่ควรจะพูดเรื่องอื่น"
      - text: "พี่กล้าแปลกดีนะ{k}"
        heart: 0
        reply: "ผมได้ยินบ่อยครับ… ได้ยินจากคุณ ฟังดูดีกว่าจากเสี่ยเฮงนิดนึง"

  - id: kla_f_f_mother_farm
    topic: self
    when: { gender: f, heart_min: 5 }
    npc: "แม่ผมเป็นคนทำนาจริงๆ ครับ ตอนพ่อป่วย ทุกคนบอกแม่ว่า ‘ผู้หญิงทำนาเองไม่ไหว ขายเถอะ’ เสี่ยเฮงมาขอซื้อสามรอบ แม่ทำนาคนเดียวสองปีก่อนผมกลับมา… ผมชอบเล่าว่าผมก่อตั้งสหกรณ์ จริงๆ แม่ผมทำให้ยังมีนาเหลือให้ผมก่อตั้ง"
    options:
      - text: "แม่พี่เก่งมาก{k}"
        heart: 2
        reply: "เก่งกว่าผมครับ แม่ไม่มีตัวเลข ไม่มีเปอร์เซ็นต์ แม่มีแค่ ‘พรุ่งนี้ต้องดำนา’ แล้วก็ไปดำ… ผมนึกถึงแม่ทุกครั้งที่เห็นคุณทำที่ยายคนเดียว"
        next:
          - text: "ฝากบอกแม่ว่า{p}อยากไปกราบ{k}"
            heart: 2
            reply: "…แม่จะดีใจมากครับ แม่จะเลี้ยงข้าวคุณจนกินไม่ไหว แล้วถามผมต่อหน้าคุณว่าทำไมผมพูดไม่หยุด ผมขอเตือนไว้ก่อน"
          - text: "{p}ยังไม่เก่งเท่าแม่พี่หรอก{k}"
            heart: 1
            reply: "ยังครับ แต่แม่ผมก็ไม่ได้เก่งตั้งแต่ปีแรก แม่บอกว่าปีแรกร้องไห้ในนาทุกวัน ปีที่สองอาทิตย์ละครั้ง… คุณร้องได้นะครับ นาไม่ไปฟ้องใคร"
      - text: "ทำไมพี่ไม่เล่าเรื่องนี้ในศาลา{kq}"
        heart: 1
        reply: "เพราะทุกครั้งที่ผมเล่า คนชมว่า ‘ลูกกตัญญู’ แล้วลืมแม่ไปเลยครับ… ผมเลยเล่าให้คุณฟัง เพราะคุณถามถึงแม่"

  - id: kla_f_o_pr_contract
    topic: others
    when: { gender: f, flag: story_meeting2, heart_min: 2 }
    npc: "น้องพีอาร์บริษัทมาหาผมที่สหกรณ์ครับ เอาเอกสาร ‘ความร่วมมือเกษตรยั่งยืน’ มา ยิ้มเก่งมาก… ผมอ่านเอกสารจนจบ เขาถามว่า ‘พี่ไม่มองหน้าหนูเลยเหรอคะ’ ผมบอกว่าหน้าเขาไม่มีข้อผูกมัด เอกสารมี"
    options:
      - text: "พี่กล้าตรงไปไหม{kq}"
        heart: 1
        reply: "ตรงไปครับ… เขาหัวเราะ แล้วบอกว่าไม่มีใครอ่านถึงหน้าสิบสองเลย หน้าที่เขียนว่าเมล็ดพันธุ์เป็นของบริษัท แม้ปลูกในนาเรา… เขาบอกเขาก็เพิ่งรู้ อ่านไม่ทันเพราะต้องยิ้ม"
      - text: "แล้วพี่ไม่มองหน้าเขาจริงเหรอ{kq}"
        heart: 1
        reply: "มองครับ ตอนจบ ผมบอกขอบคุณ… แต่ถ้าถามว่าวันนั้นผมจำหน้าใครได้ชัด ผมจำหน้าคุณที่ยืนหลังศาลาวันประชุมได้ชัดกว่า เอ่อ… ไม่เกี่ยวกันครับ ผมพูดเฉยๆ"
