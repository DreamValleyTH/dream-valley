convos:
  - id: taew_f_alone_night
    topic: react
    once: true
    when: { gender: f, flag: story_first_night, day_max: 8 }
    npc: "หลาน… ป้าถามจริงๆ นะ เมื่อคืนนอนคนเดียวทั้งบ้าน ไม่กลัวเหรอจ้ะ ผู้หญิงตัวคนเดียว บ้านก็ติดทุ่ง หมาบ้านลุงสมหมายหอนทั้งคืน ป้าฟังจากร้านยังขนลุกเลย"
    options:
      - text: "กลัวนิดหน่อย{k} แต่{p}ล็อกประตูสองชั้นแล้ว"
        heart: 1
        reply: "สองชั้นยังน้อยไปจ้ะ ป้าล็อกสามชั้น เอาไม้ขัดอีกอัน แล้วเปิดวิทยุทั้งคืน ให้ผีคิดว่าบ้านมีคนคุยกัน… เอานี่ไป นกหวีด ป้าแอบเก็บไว้ของดาบเสถียร เป่าทีเดียวหมาตื่นทั้งซอย"
        next:
          - text: "แล้วถ้าเป่า ดาบจะตื่นไหม{kq}"
            heart: 1
            reply: "ดาบน่ะเหรอ… หมาตื่นก่อนดาบสามรอบจ้ะ แต่ป้าตื่นแน่ ป้าไม่ได้หลับหรอกตอนกลางคืน ป้ากลัว เบอร์ป้าจดไว้นะหลาน โทรมาได้ทั้งคืน"
          - text: "ป้าก็อยู่คนเดียวนี่{kq} ป้ายังอยู่ได้เลย"
            heart: 2
            reply: "ใครบอกว่าป้าไม่กลัว! ป้ากลัวทุกคืนมาสิบกว่าปีแล้ว… แต่ก็อยู่มาได้นะ เออ จริงของหลาน ผู้หญิงอยู่คนเดียวไม่ได้แปลว่าอยู่ไม่ได้ ป้าเป็นตัวอย่าง ตัวอย่างขี้กลัว"
      - text: "{p}อยู่ห้องเช่าแปดตารางเมตรในกรุงเทพฯ คนเดียวมาห้าปี{k} น่ากลัวกว่าอีก"
        heart: 1
        reply: "ตายแล้ว แปดตารางเมตร เล็กกว่าห้องเก็บลังน้ำปลาป้าอีก… เออ งั้นผีบ้านนอกคงไม่ระคายหลานหรอก ผีกรุงเทพฯ มันทวงค่าเช่าด้วย"
      - text: "ผีไม่น่ากลัวเท่าคนหรอก{k}ป้า"
        heart: 0
        reply: "อุ๊ย พูดแบบนี้ระวังนะหลาน ยายบัวห้ามพูดว่าไม่กลัว… แต่ก็จริงครึ่งนึง ใครมาเคาะประตูดึกๆ อย่าเปิดนะ ผีหรือคนก็อย่าเปิด ให้เขามาใหม่ตอนเช้า"

  - id: taew_f_boyfriend
    topic: others
    when: { gender: f, day_min: 3 }
    npc: "(กระซิบ) ป้าไม่ได้พูดนะ แต่เขาว่ากันว่า… หลานมีแฟนอยู่กรุงเทพฯ แล้ว จริงไหมจ้ะ ป้าพรถามป้ามาสามรอบ ป้าบอกไม่รู้ ป้าพรไม่เชื่อ หาว่าป้ากั๊ก"
    options:
      - text: "ยังไม่มี{k} แล้วก็ไม่รีบด้วย"
        heart: 1
        reply: "ไม่รีบก็ดีจ้ะ… แต่ป้าบอกไว้ก่อนนะ ป้าพรมีหลานชายเพิ่งปลดทหาร เขาจะเอารูปมาให้ดู รูปใส่ชุดทหารยืนข้างรถกระบะ ทุกคนในตำบลเคยเห็นรูปนี้แล้ว ยกเว้นหลาน"
      - text: "มี{k} ชื่อแปลงผักบุ้ง ดูแลทุกเช้าเย็นเลย"
        heart: 1
        reply: "ฮ่าๆ แฟนแบบนี้ดีจ้ะ ไม่กินเหล้า ไม่เล่นไพ่ โกรธทีแค่เหี่ยว… ป้าจะไปบอกป้าพรว่าหลานมีแฟนแล้ว ไม่ได้โกหกนะ ป้าแค่ไม่บอกว่าเป็นผัก"
      - text: "เรื่องส่วนตัว{k}ป้า"
        heart: -1
        reply: "อุ๊ย ขอโทษจ้ะ ป้าปากไว… ป้าไม่ถามแล้ว สัญญา (อย่างน้อยก็จนถึงงานวัด)"

  - id: taew_f_rice_sack
    topic: advice
    when: { gender: f }
    npc: "ข้าวสารห้ากิโลถุงนี้เดี๋ยวป้าเรียกตั้มให้ช่วยแบกไปส่งนะหลาน… อ้อ ตั้มยังไม่ตื่น งั้นเดี๋ยวป้าโทรตามบอลที่อู่ ผู้หญิงแบกของหนักเดี๋ยวปวดหลังจ้ะ"
    options:
      - text: "{p}แบกเองได้{k}ป้า ไม่ต้องโทรตามใคร"
        heart: 1
        reply: "ห้ากิโลขึ้นบ่าเลยเหรอ… เออ ยายเพียรเคยแบกกระสอบข้าวเปลือกบ่าเดียวเดินจากนาถึงบ้าน ป้าลืมไปเลยว่าหลานเป็นหลานใคร ไปเลยจ้ะ แต่ย่อเข่านะ หมอแอนสั่งทุกคน ผู้ชายด้วย"
      - text: "โทรเรียกบอลก็ดี{k}"
        heart: 0
        reply: "หูย พูดง่ายจริง… ป้าโทรเลยนะ (กดเบอร์) บอลเหรอ มาร้านป้าหน่อย มีของหนักให้ช่วย… หนักตรงไหนน่ะเหรอ หนักใจป้านี่แหละ อยากให้หลานมีคนช่วยแบก"
      - text: "ป้าคิดว่า{p}แบกไม่ไหวเหรอ{kq}"
        heart: 0
        reply: "ไม่ใช่ไม่ไหวจ้ะ ป้าแค่เคยชิน คนรุ่นป้า เห็นผู้หญิงแบกของต้องร้องเรียกผู้ชาย ทั้งที่ป้ายกลังน้ำแข็งเองทุกเช้ามาสามสิบปี"

  - id: taew_f_pr_girl
    topic: news
    when: { gender: f, flag: story_thana_visit }
    npc: "ป้าไม่ได้พูดนะ แต่บริษัทคุณธนาส่งน้องพีอาร์มาใหม่ สาวสวย ผมยาว ยิ้มเหมือนโลโก้หยดน้ำเลยจ้ะ แจกน้ำขวดหน้าร้านป้า เรียกป้าว่า ‘คุณแม่’ ป้าเกือบใจอ่อน"
    options:
      - text: "บริษัทคิดว่าส่งคนสวยมาแล้วคนจะลืมเรื่องบ่อแห้งเหรอ{kq}"
        heart: 1
        reply: "นั่นแหละที่ป้าคิด! …แต่ลุงๆ แถวศาลาลืมจริงนะหลาน ลุงสมหมายรับน้ำไปสามขวด ยืนคุยครึ่งชั่วโมง ทั้งที่บ่อบ้านตัวเองแห้งอยู่"
      - text: "น้องเขาก็แค่ทำงาน{k}ป้า"
        heart: 1
        reply: "จริงจ้ะ ป้าก็สงสาร น้องเขาแอบถามป้าว่าห้องน้ำอยู่ไหน เดินแจกมาสามชั่วโมงไม่มีใครให้เข้าห้องน้ำ ป้าให้เข้าหลังร้าน… ออกมาน้องกระซิบป้าว่า ‘อย่าเซ็นอะไรนะคะคุณแม่’"
        next:
          - text: "น้องเขาพูดแบบนั้นจริงเหรอ{kq}"
            heart: 1
            reply: "จริงจ้ะ แล้วก็รีบใส่ยิ้มกลับเข้าไปใหม่ เหมือนใส่หมวก… ป้าเลยให้ปาท่องโก๋ไปถุงนึง ไม่คิดเงิน ผู้หญิงด้วยกัน"
          - text: "ป้าอย่าไปบอกใครนะ{kq} เดี๋ยวน้องเขาโดนไล่ออก"
            heart: 2
            reply: "ป้า… ป้าจะพยายามจ้ะ (เงียบไปนาน) ป้าบอกป้าพรไปแล้วคนนึง แต่ป้าพรสาบานแล้ว สาบานต่อหน้าศาลปู่ตาด้วย ป้าพรกลัวปู่ตามากกว่ากลัวป้า"
      - text: "แล้วป้าได้น้ำมากี่ขวด{kq}"
        heart: 0
        reply: "หกขวดจ้ะ… ป้าเอามาขายต่อขวดละเจ็ดบาท อย่าบอกใครนะ ป้าก็ทำงานเหมือนกัน"

  - id: taew_f_phathung
    topic: smalltalk
    when: { gender: f, time: morning }
    npc: "หลานมีผ้าถุงไหมจ้ะ ร้านป้ามีผ้าถุงลายปาเต๊ะ ผืนละร้อยยี่สิบ ใส่ทำงานบ้านเย็นกว่ากางเกงยีนส์เยอะ… ยายหลานนุ่งผ้าถุงขึ้นต้นมะม่วงได้ด้วยนะ ป้าเห็นกับตา"
    options:
      - text: "สอน{p}นุ่งหน่อย{k}ป้า {p}นุ่งไม่เป็น"
        heart: 2
        reply: "มานี่ จับชายสองข้าง ป้ายให้ตึง พับทบ แล้วม้วนลง… ม้วนลงหลาน ไม่ใช่ม้วนขึ้น! นั่นมันนุ่งโสร่งแบบลุงสมหมาย"
      - text: "{p}ใส่กางเกงทำนาสะดวกกว่า{k}"
        heart: 0
        reply: "ก็จริงจ้ะ สมัยนี้ใครเขานุ่งผ้าถุงดำนาแล้ว… ป้าแค่คิดถึงภาพยายเฉยๆ ไม่เป็นไร กางเกงก็ได้ ขอให้กันแดดก็พอ"
      - text: "ขึ้นต้นมะม่วงทั้งผ้าถุงเลยเหรอ{kq} เก่งกว่า{p}อีก"
        heart: 1
        reply: "เก่งกว่าทุกคนจ้ะ ยายบอกว่าผ้าถุงไม่ได้ทำให้ปีนไม่ได้ ผู้ชายที่ยืนดูต่างหากที่ทำให้ไม่อยากปีน… ยายพูดแรงนะ ป้าจำมาถึงทุกวันนี้"

  - id: taew_f_widow_shop
    topic: self
    when: { gender: f, heart_min: 3 }
    npc: "หลานรู้ไหม ตอนสามีป้าเสีย ป้าอายุสี่สิบกว่า ใครๆ ก็บอกว่าแม่ม่ายเปิดร้านคนเดียวไม่รอดหรอก มีคนมาขอซื้อร้านสามราย ราคาต่ำกว่าราคาตู้เย็นในร้านอีก"
    options:
      - text: "แล้วป้าทำยังไง{kq}"
        heart: 1
        reply: "ป้าก็เปิดร้านเช้ากว่าเดิมครึ่งชั่วโมงจ้ะ ปิดดึกกว่าเดิมครึ่งชั่วโมง จดหนี้ทุกคนลงสมุด… สามปีผ่านไป คนที่มาขอซื้อร้าน มาขอติดเงินป้าแทน"
        next:
          - text: "ป้าเก่งมากเลย{k}"
            heart: 2
            reply: "ไม่เก่งหรอกจ้ะ ป้ากลัว กลัวจนต้องทำ… คนชอบคิดว่าผู้หญิงกล้าหาญคือไม่กลัว ป้าว่าผู้หญิงกล้าหาญคือกลัวแล้วเปิดร้านอยู่ดี"
          - text: "แล้วยายเพียรช่วยป้าไหม{kq}"
            heart: 2
            reply: "ช่วยจ้ะ… ยายเพียรมาซื้อของทุกวัน ซื้อทั้งที่ไม่ได้ใช้ ไข่ไก่เต็มตู้เย็นบ้านยาย ป้ารู้ทีหลังว่ายายเอาไปแจกวัด ยายไม่เคยพูดสักคำว่ามาช่วย"
      - text: "คนที่ขอซื้อ ตอนนี้ยังอยู่ไหม{kq}"
        heart: 0
        reply: "อยู่จ้ะ ยังมาซื้อน้ำปลาร้านป้าทุกอาทิตย์… ป้าคิดราคาเต็มทุกขวด ไม่เคยลดให้สักบาท นั่นแหละการแก้แค้นของแม่ม่าย"
      - text: "ป้าคิดถึงสามีไหม{kq}"
        heart: 1
        reply: "คิดถึงจ้ะ… คิดถึงตอนต้องยกถังแก๊ส อุ๊ย ล้อเล่น คิดถึงทุกวันแหละ ป้ายังเปิดเพลงลูกทุ่งที่เขาชอบตอนปิดร้านอยู่เลย"
