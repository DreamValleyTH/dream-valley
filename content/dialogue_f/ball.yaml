# บอล — บทคุยเฉพาะผู้เล่นหญิง
convos:
  - id: ball_f_r_price
    topic: react
    once: true
    when: { gender: f, flag: met_ball, day_min: 2 }
    npc: "…ช่างอู่อำเภอเขาบวกราคาลูกค้าผู้หญิงสองเท่านะครับ ผมได้ยินมา ผมเลยบอกไว้ก่อน ที่นี่ผมไม่บวก… ผมบวกเท่ากันทุกคน คือไม่บวกเลย เพราะไม่มีใครจ่าย"
    options:
      - text: "งั้น{p}จะเป็นคนแรกที่จ่ายเต็ม{k}"
        heart: 2
        reply: "…เต็มเหรอครับ ผมไม่ค่อยได้ยินคำนี้ ฟังเสียงแล้วแปลกๆ เหมือนเครื่องที่เพิ่งยกใหม่ เดินเรียบจนผมไม่ไว้ใจ"
        next:
          - text: "ไว้ใจได้ เอาใบเสร็จมาเลย{k}"
            heart: 2
            reply: "ใบเสร็จ… ผมต้องหาก่อนครับ สมุดใบเสร็จอยู่ใต้กล่องน็อต ไม่ได้ใช้มาสองเดือน ใบสุดท้ายเขียนว่า ‘ลุงสมหมาย ค้าง’ ใบนี้จะเป็นใบแรกที่ไม่มีคำว่าค้าง"
          - text: "ล้อเล่น{k} ขอลดนิดนึง"
            heart: 0
            reply: "ฟังเสียงก็รู้ว่าจะต่อครับ… ลดได้ ลดเท่ากับทุกคน ยกเว้นเสี่ยเฮง เสี่ยเฮงผมบวก"
      - text: "ทำไมอู่อำเภอบวกราคาผู้หญิง{kq}"
        heart: 1
        reply: "เพราะคิดว่าผู้หญิงฟังเสียงเครื่องไม่ออกครับ… ป้าพรฟังออกก่อนผม ยายผมฟังออกก่อนพ่อผม แต่ช่างอู่อำเภอไม่เคยถาม เขาบอกเลยว่า ‘ต้องเปลี่ยนทั้งชุดครับพี่’"
      - text: "{p}ซ่อมเองก็ได้ ไม่ต้องห่วง{k}"
        heart: 1
        reply: "ได้ครับ ซ่อมเองดี… ถ้าซ่อมแล้วมีน็อตเหลือ เอามาให้ผมดูนะครับ น็อตเหลือแปลว่าเครื่องมันรู้ แต่คนซ่อมยังไม่รู้"

  - id: ball_f_a_belt
    topic: advice
    when: { gender: f, heart_min: 2 }
    npc: "สายพานปั๊มน้ำบ้านยายเพียรใกล้หมดแล้วครับ ฟังเสียงก็รู้… จะให้ผมไปเปลี่ยน หรือจะเรียนเปลี่ยนเอง ผมถามเพราะคนส่วนใหญ่ไม่อยากเรียน ไม่ใช่เพราะเป็นผู้หญิง"
    options:
      - text: "เรียนเอง{k} ยื่นประแจมา"
        heart: 2
        reply: "เบอร์สิบสองครับ… อันนั้นสิบสี่ ไม่เป็นไร ทุกคนหยิบผิดครั้งแรก คลายน็อตตัวปรับก่อน ดันมอเตอร์เข้า สายพานจะหย่อน แล้วถอดออก… ทำได้แล้วครับ เร็วกว่าที่ผมคิด"
        next:
          - text: "พี่บอลคิดว่า{p}จะช้าเหรอ{kq}"
            heart: 1
            reply: "ผมคิดว่าทุกคนจะช้าครับ… ผมช้าเองตอนพ่อสอน พ่อด่าผมสามชั่วโมง ผมจำได้ทุกคำ ผมเลยไม่ด่าใคร ผมแค่ยืนรอ"
          - text: "ครั้งหน้า{p}ยื่นเบอร์สิบสองให้ถูกแน่{k}"
            heart: 2
            reply: "…ครับ ไม่ค่อยมีใครยื่นประแจให้ผมถูกเบอร์ นอกจากพ่อ ตอนนี้ไม่มีพ่อแล้ว… ไม่ต้องรีบนะครับ ผิดเบอร์ก็มานั่งได้ เก้าอี้ตัวนั้นว่าง"
      - text: "พี่ทำให้เลยดีกว่า{k}"
        heart: 0
        reply: "ได้ครับ… เดี๋ยวดูให้ แต่ถ้าวันไหนผมไม่อยู่ ไประยองหรือป่วย… ช่างเถอะครับ เดี๋ยวดูให้"
      - text: "พี่สอนผู้หญิงซ่อมรถบ่อยไหม{kq}"
        heart: 1
        reply: "นกคนเดียวครับ สอนตั้งแต่สิบสอง สอนไม่จบสักที เพราะผมแย่งทำเองทุกรอบ… นกบอกว่าผมปล่อยมือไม่เป็น ผมกำลังฝึกอยู่ครับ"

  - id: ball_f_n_rumor
    topic: news
    when: { gender: f, heart_min: 3 }
    npc: "ช่างอู่อำเภอโทรมาถามว่าผมรับผู้หญิงมาฝึกงานเหรอ… ข่าวจากป้าแต๋วครับ ผมบอกว่าไม่ได้ฝึกงาน มานั่งเฉยๆ แต่ฟังเสียงเครื่องออกก่อนผมสองรอบแล้ว เขาเงียบไปเลย"
    options:
      - text: "ฟังออกก่อนพี่จริงเหรอ{kq}"
        heart: 2
        reply: "รอบแรกครับ ลูกปืนล้อหลังมอไซค์ลุงเชิด… รอบสองไม่แน่ใจว่าฟังออกหรือเดา แต่เดาถูก ช่างดีครึ่งนึงก็เดาครับ อีกครึ่งเดาแล้วไม่ยอมรับ"
        next:
          - text: "{p}ฟังออก ไม่ได้เดา{k}"
            heart: 2
            reply: "…ครับ ฟังออก ผมแก้ข่าวให้ ผมจะโทรบอกช่างอู่อำเภอว่า ‘ฟังออก’ เขาจะถามว่ารับเงินเดือนเท่าไหร่ ผมจะบอกว่าจ่ายเป็นกาแฟเย็น"
          - text: "เดาก็ได้ ถูกก็คือถูก{k}"
            heart: 1
            reply: "ถูกครับ… แต่อย่าบอกลูกค้าว่าเดานะครับ ลูกค้าไม่จ่ายค่าเดา ลูกค้าก็ไม่จ่ายค่าฟังเหมือนกัน แต่ฟังดูดีกว่า"
      - text: "ป้าแต๋วไปเล่าว่าอะไรอีก{kq}"
        heart: 1
        reply: "ว่าเรากำลังคบกันครับ… ผมบอกป้าว่าไม่ใช่ ป้าบอกว่า ‘ยัง’ ใช่ไหม ผมไม่ตอบ ผมเปลี่ยนเรื่องไปพูดเรื่องเบรก ป้าจดลงสมุดว่า ‘บอลเขิน’"

  - id: ball_f_s_what_fix
    topic: smalltalk
    when: { gender: f, heart_min: 5 }
    npc: "…เมื่อคืนยายถามผมว่า ‘หลานยายเพียรมาอู่ทำไมบ่อยๆ’ ผมบอกมาซ่อม ยายถามว่าซ่อมอะไร ผมนึกไม่ออกครับ… ตกลงซ่อมอะไรครับ ผมต้องไปตอบยาย"
    options:
      - text: "บอกยายว่ามาซ่อมเวลาว่างของพี่บอล"
        heart: 2
        reply: "…เวลาว่างผมพังเหรอครับ ก็พังจริง ผมไม่เคยว่าง ว่างแล้วไม่รู้ทำอะไร นั่งมองกุญแจ… ผมจะไปบอกยาย ยายจะหัวเราะทั้งวันอีก"
        next:
          - text: "ยายหัวเราะก็ดีแล้ว{k}"
            heart: 2
            reply: "ดีครับ… ยายไม่ค่อยหัวเราะตั้งแต่พ่อเสีย ช่วงนี้หัวเราะบ่อยขึ้น ยายบอกว่าเพราะผมเช็ดเก้าอี้พลาสติกทุกวัน ผมไม่รู้ว่ามันเกี่ยวยังไง"
          - text: "ล้อเล่น บอกยายว่ามาเติมลมยาง{k}"
            heart: 0
            reply: "เติมลมยางวันละรอบเหรอครับ… ยายจะคิดว่ายางรั่ว แล้วยายจะบอกให้ผมเปลี่ยนจุ๊บ ผมเปลี่ยนให้ฟรี ไม่ได้ช่วยเรื่องอะไรเลย"
      - text: "มานั่งฟังเสียงเครื่องไง พี่ก็รู้"
        heart: 1
        reply: "ฟังเสียงเครื่อง… ครับ ผมจะบอกยายแบบนั้น ยายจะถามว่าเครื่องไหน ผมจะบอกว่าทุกเครื่อง ยายจะบอกว่า ‘แกนี่มันโง่’ ยายพูดถูกบ่อย"

  - id: ball_f_f_apprentice
    topic: self
    when: { gender: f, heart_min: 5 }
    npc: "…พ่อผมเคยไม่รับลูกมือผู้หญิงครับ ลูกสาวลุงหวังมาขอเรียนช่างตอนสิบหก พ่อบอกว่า ‘อู่ไม่ใช่ที่ของผู้หญิง’ เขาเลยไปเรียนช่างเทคนิคที่อำเภอ"
    options:
      - text: "แล้วตอนนี้เขาทำอะไรอยู่{kq}"
        heart: 2
        reply: "เป็นวิศวกรโรงงานที่ระยองครับ… โรงงานที่เพื่อนชวนผมไป เขาเป็นหัวหน้าเพื่อนผม ถ้าผมไป ผมก็จะเป็นลูกน้องคนที่พ่อผมไม่รับเป็นลูกมือ"
        next:
          - text: "พี่บอลรู้สึกยังไงกับเรื่องนี้{kq}"
            heart: 2
            reply: "อายแทนพ่อครับ… แล้วก็ดีใจแทนเขา ถ้าพ่อรับไว้ เขาคงยังซ่อมรถที่นี่ ค่าซ่อมก็ยังเป็นข้าวสาร… พ่อไม่ได้ทำถูก แต่ผลมันออกมาดีกับเขา ผมไม่รู้จะคิดยังไง"
          - text: "ถ้าเป็นพี่ จะรับเขาไหม{kq}"
            heart: 2
            reply: "รับครับ… ผมจะรับเขาเป็นหุ้นส่วน เขาคำนวณเก่งกว่าผม อู่จะได้มีคนทวงหนี้เป็น ผมทวงไม่เป็นเลย"
      - text: "พ่อพี่ก็คิดแบบคนรุ่นเก่า{k}"
        heart: 0
        reply: "ครับ… แต่ยายผมรุ่นเก่ากว่าพ่ออีก ยายบอกพ่อตอนนั้นว่า ‘รับเขาไว้เถอะ’ พ่อไม่ฟัง ไม่ใช่เรื่องรุ่นครับ เป็นเรื่องคนไม่ฟัง"

  - id: ball_f_o_pr_car
    topic: others
    when: { gender: f, flag: story_meeting2 }
    npc: "สาวประชาสัมพันธ์บริษัทเอารถมาซ่อมครับ แอร์เสีย นั่งรอสามชั่วโมง… เล่าว่าเงินเดือนหมื่นแปด โดนส่งมายิ้มที่ศาลา โดนป้าพรถามว่า ‘ยิ้มแทนใคร’ แล้วร้องไห้ในรถ"
    options:
      - text: "พี่บอลปลอบเขาไหม{kq}"
        heart: 1
        reply: "ผมไม่ปลอบเป็นครับ… ผมเปิดพัดลมให้ แล้วเอากาแฟเย็นให้แก้วนึง เขาบอกว่าเป็นกาแฟที่อร่อยที่สุดตั้งแต่มาตำบลนี้ ผมว่าเขาแค่ร้อน"
      - text: "ค่าซ่อมเก็บใคร{kq}"
        heart: 2
        reply: "เก็บบริษัทครับ เต็มราคา บวกค่ารอสามชั่วโมง บวกค่ากาแฟ… ครั้งแรกในชีวิตที่ผมบวกราคา บวกให้คนที่ส่งเขามา ไม่ใช่เขา"
      - text: "เขาก็ทำงานเพื่อเงินเหมือนทุกคน{k}"
        heart: 1
        reply: "ครับ เหมือนนก เหมือนผมถ้าไประยอง… ทุกคนยิ้มแทนใครสักคน ผมแค่ยังไม่รู้ว่าถ้าผมไป ผมจะยิ้มแทนใคร"
