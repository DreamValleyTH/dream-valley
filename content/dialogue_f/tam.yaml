# ตั้ม — บทคุยเฉพาะผู้เล่นหญิง (gender: f) · หน้าตาย ลงท้ายครับ เรื่องน่ากลัวกับโปรโมชั่นใช้น้ำเสียงเดียวกัน
convos:
  - id: tam_f_r_night_walk
    topic: react
    once: true
    when: { gender: f, day_min: 3, time: evening }
    npc: "คืนก่อนคุณเดินผ่านหน้าร้านคนเดียวตอนสามทุ่มครับ ผมเห็นจากกล้องตัวที่สาม ลูกค้าผู้ชายสองคนในร้านถามผมว่า ‘ผู้หญิงเดินมืดๆ คนเดียว ไม่กลัวเหรอ’ ผมบอกว่าพวกเขาก็เดินมาคนเดียว เขาบอกว่าไม่เหมือนกัน ผมยังหาไม่เจอว่าไม่เหมือนตรงไหนครับ"
    options:
      - text: "ไม่เหมือนตรงที่{p}เดินเร็วกว่า{k}"
        heart: 2
        reply: "กล้องยืนยันครับ คุณเดินเร็วกว่าเขาประมาณสามสิบเปอร์เซ็นต์ ผมเทียบเฟรมแล้ว… หนึ่งในสองคนนั้นมาถึงร้านแล้วยังหอบอยู่ครับ"
        next:
          - text: "พี่ตั้มดูกล้องเพลินเลยนะ{k}"
            heart: 1
            reply: "ทุกคืนครับ แปดจอ เหมือนดูหนังแปดเรื่องที่ไม่มีใครแสดง… คืนนั้นคุณเป็นนักแสดงนำ ต่อจากหมาสามตัว"
          - text: "เขาก็กลัวแหละ แค่ไม่พูด{k}"
            heart: 1
            reply: "ผมคิดแบบนั้นครับ เขาซื้อน้ำหกขวดแล้วนั่งรอให้มีคนเดินกลับก่อน จะได้เดินตาม… เขาบอกจะไปส่งคุณ ผมว่าเขาอยากให้คุณไปส่งเขา"
      - text: "กลัวสิ{k} ถึงได้แวะร้านพี่ตั้มไง"
        heart: 1
        reply: "ถูกต้องครับ ร้านนี้คือที่หลบภัยที่มีโปรสองชิ้นห้าสิบ… กลัวแล้วมาที่สว่าง ไม่เกี่ยวกับเพศครับ เกี่ยวกับสมองดี"
      - text: "ช่างเขา{k}"
        heart: 0
        reply: "ครับ ผมช่างเขามาสามปีแล้ว ได้ผลดีครับ"

  - id: tam_f_n_pr_girl
    topic: news
    when: { gender: f, flag: story_meeting2 }
    npc: "เมื่อคืนน้องพีอาร์บริษัทมานั่งในร้านผมตั้งแต่สี่ทุ่มครับ ถอดรองเท้าส้นสูงวางบนเก้าอี้ ยิ้มมาทั้งวัน เขาขอให้ผมไม่พูดอะไรสิบนาที ผมทำได้ครับ ผมถนัด"
    options:
      - text: "เขาคงเหนื่อยแย่เลย{k}"
        heart: 2
        reply: "เขาเล่าว่าคุณธนาให้เขาไปยืนแจกถังหน้าศาลา เพราะ ‘ชาวบ้านไม่กล้าเถียงผู้หญิงยิ้ม’ ป้าพรเถียงเขาครึ่งชั่วโมงครับ ป้าพรไม่สนทฤษฎีบริษัท"
      - text: "เขาพูดถึงบริษัทว่าไงบ้าง{kq}"
        heart: 0
        reply: "เขาไม่พูดครับ ผมก็ไม่ถาม… แต่เขาซื้อพลาสเตอร์ไปสี่แผ่น ปิดส้นเท้าทั้งสองข้าง บริษัทที่ทำส้นเท้าพนักงานพังได้ในวันเดียว ผมไม่ต้องถามเรื่องอื่นครับ"

  - id: tam_f_a_smile
    topic: advice
    when: { gender: f }
    npc: "ผมแนะนำครับ ถ้ามีลูกค้าบอกให้คุณ ‘ยิ้มหน่อยสิ’ ไม่ต้องยิ้มครับ น้องพนักงานกะเช้าคนก่อนโดนบอกวันละสิบครั้ง ผมโดนวันละศูนย์ครั้ง ทั้งที่ผมหน้าตายกว่าเธอสามเท่า"
    options:
      - text: "พี่ตั้มนับไว้ด้วยเหรอ{kq}"
        heart: 1
        reply: "ผมนับทุกอย่างที่กล้องเห็นครับ ผมเอาสถิติให้ผู้จัดการดู ผู้จัดการบอกว่า ‘ก็ให้น้องเขายิ้มสิ’… ตอนนี้น้องย้ายไปร้านในเมืองแล้วครับ ร้านที่ไม่มีผู้จัดการคนนี้"
      - text: "ถ้าใครบอก{p}ให้ยิ้ม {p}จะยิ้มให้กล้องแทน{k}"
        heart: 2
        reply: "ดีครับ ฟุตเทจนั้นผมจะสำรองไว้ ไม่ให้ระบบลบตอนครบเจ็ดวัน เป็นไฟล์แรกในสามปีที่ผมสำรองครับ"
      - text: "{p}ยิ้มเก่งอยู่แล้ว{k}"
        heart: 0
        reply: "ครับ ยิ้มตอนอยากยิ้ม ไม่ใช่ตอนโดนสั่ง สองอย่างนี้กล้องแยกออกครับ ผมดูมาสามปี"

  - id: tam_f_s_rumor
    topic: smalltalk
    when: { gender: f, day_min: 6 }
    npc: "ป้าแต๋วถามผมว่าคุณมาร้านผมบ่อยเพราะอะไรครับ ผมตอบว่าเพราะไฟสว่าง ป้าไม่เชื่อ ป้าโพสต์ในกลุ่มว่า ‘หลานยายเพียรกับตั้ม ไฟสว่าง’ ไม่มีบริบทครับ"
    options:
      - text: "ไฟสว่างจริง{k} แอร์ก็เย็นด้วย"
        heart: 1
        reply: "ผมพิมพ์แก้ในกลุ่มแล้วครับ ‘แอร์ก็เย็นด้วย’ ป้าตอบมาว่า ‘เย็นแบบไหน’ ผมเลยออกจากกลุ่ม ผู้ใหญ่ดึงกลับเข้ามาภายในสองนาที"
      - text: "ช่างป้าเถอะ{k} {p}มาเพราะกะเพราไก่"
        heart: 2
        reply: "ผมจะบอกป้าแบบนั้นครับ ป้าคงโพสต์ว่า ‘หลานยายเพียรกับกะเพรา’… กะเพราไม่มีสิทธิ์ตอบ เป็นผู้เสียหายที่ดีที่สุดครับ"
      - text: "เขาสนเรื่องแบบนี้ทำไม{kq}"
        heart: 0
        reply: "เพราะตำบลนี้ไม่มีละครตอนดึกครับ ร้านผมเลยเป็นละคร… ผมเป็นตัวประกอบ คุณเป็นแขกรับเชิญ"

  - id: tam_f_f_classmates
    topic: self
    when: { gender: f, heart_min: 4 }
    npc: "รุ่นผมเรียนนิเทศฯ สามสิบคนครับ ผู้หญิงยี่สิบสองคน ตอนนี้ทำงานตรงสายยี่สิบคน ผู้ชายแปดคน ทำตรงสายสองคน ผมไม่ใช่หนึ่งในสองคนนั้นครับ… ผมเลยไม่เชื่อเวลาใครบอกว่าผู้หญิงทำงานหนักไม่ไหว"
    options:
      - text: "เพื่อนผู้หญิงเก่งกว่าเหรอ{kq}"
        heart: 1
        reply: "ขยันกว่าครับ ตอนทำหนังจบ เพื่อนผู้หญิงแบกขาตั้งกล้อง ผมแบกความฝัน ขาตั้งหนักกว่า… หนังได้ที่สอง ความฝันผมยังแขวนอยู่ในห้องพักพนักงาน"
        next:
          - text: "ยังไม่สายนะ{kq} ทำหนังสั้นที่นี่ก็ได้"
            heart: 2
            reply: "…ผมมีฟุตเทจแปดจอทั้งคืนสามปีครับ ถ้าตัดดีๆ อาจได้หนังสยองขวัญที่น่าเบื่อที่สุดในประเทศ ผมจะคิดดูครับ"
          - text: "เพื่อนยังติดต่อพี่ตั้มไหม{kq}"
            heart: 1
            reply: "ติดครับ คนหนึ่งเป็นผู้กำกับโฆษณา ส่งงานมาให้ผมดูก่อนออนแอร์ ผมติว่าน่าเบื่อทุกครั้ง เขาบอกผมเป็นคนเดียวที่ติตรง… ผมไม่ได้ตรงครับ ผมง่วง"
      - text: "พี่ตั้มคิดมากไปรึเปล่า{kq}"
        heart: 0
        reply: "ผมมีเวลาคิดคืนละแปดชั่วโมงครับ คิดน้อยไม่ได้ ระบบไม่อนุญาต"

  - id: tam_f_o_cherd
    topic: others
    when: { gender: f }
    npc: "ลุงเชิดบอกผมว่าเที่ยวหกโมงเย็น ถ้ามีผู้หญิงรอที่ป้ายคนเดียว ลุงจะรอเพิ่มหนึ่งนาทีครับ ลุงไม่รอใครเลย แต่รอเรื่องนี้ ลุงไม่อยากให้ใครรู้ เพราะเสียชื่อคนตรงเวลา"
    options:
      - text: "ลุงเชิดน่ารักนะ{k}"
        heart: 1
        reply: "น่ารักครับ แต่ผมเคยวิ่งไล่รถลุงตอนหกโมงหนึ่งนาที ลุงไม่รอผม ผมยืนยันได้ว่าลุงรอเฉพาะกรณีนี้ครับ ผมไม่ได้น้อยใจ ผมแค่บันทึก"
        next:
          - text: "พี่ตั้มน้อยใจแหละ{k}"
            heart: 1
            reply: "นิดหนึ่งครับ เท่าค่าธรรมเนียมสิบบาท"
          - text: "วันหลัง{p}จะไปยืนรอเป็นเพื่อนพี่ตั้ม{k}"
            heart: 2
            reply: "ขอบคุณครับ ลุงจะรอหนึ่งนาที ผมจะวิ่งให้ทันในหนึ่งนาที เราเป็นทีมครับ… ผมไม่ได้วิ่งมาตั้งแต่เรียนจบ"
      - text: "แล้วพี่ตั้มบอก{p}ทำไม{kq}"
        heart: 0
        reply: "เพราะคุณเป็นผู้หญิงที่ขึ้นเที่ยวหกโมงเย็นครับ จะได้รู้ว่ามีหนึ่งนาที… ใช้ให้คุ้มนะครับ ไม่ได้มีทุกคน"
