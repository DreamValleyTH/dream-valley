# เภสัชกรมด — บทคุยเฉพาะผู้เล่นหญิง (gender: f) · พูดเรียบ แห้ง ข้อมูลยาถูกต้องเสมอ ตลกร้ายเรื่องระบบสาธารณสุข
convos:
  - id: mod_f_r_back
    topic: react
    once: true
    when: { gender: f, day_min: 4 }
    npc: "คุณมาซื้อยาแก้ปวดหลังครับ ป้าแต๋วฝากผมบอกคุณว่า ‘ผู้หญิงอย่าแบกปุ๋ยเอง ให้ผู้ชายแบก’ ผมรับฝากมาครับ… แต่ทางการแพทย์ หลังผู้ชายก็พังเหมือนกัน หลังไม่ดูเพศครับ ดูท่า"
    options:
      - text: "งั้นท่าที่ถูกเป็นยังไง{kq}"
        heart: 2
        reply: "ย่อเข่า หลังตรง ของชิดตัว ยกด้วยขาไม่ใช่หลังครับ… ลุงสมหมายยกด้วยหลังมาสี่สิบปี ตอนนี้เป็นลูกค้าประจำผม เป็นตัวอย่างของ ‘ผู้ชายแบกได้’ ที่ป้าแต๋วพูด"
        next:
          - text: "ภก.สอนป้าแต๋วด้วยสิ{kq}"
            heart: 1
            reply: "สอนแล้วครับ ป้าบอกว่า ‘ป้าไม่แบก ป้าเรียกคนแบก’ ซึ่งทางการแพทย์ถูกที่สุดครับ"
          - text: "{p}จะยกด้วยขา{k}"
            heart: 1
            reply: "ดีครับ ถ้าทำได้ ผมจะเสียลูกค้าหนึ่งคน ผมยินดีครับ ร้านผมยังมีลุงสมหมาย"
      - text: "{p}แบกไหว{k} แค่ปวดนิดหน่อย"
        heart: 0
        reply: "‘นิดหน่อย’ คือคำที่คนไข้หมอนรองกระดูกพูดครั้งแรกครับ ผมจดคำนี้ไว้ในประวัติคุณแล้ว"
      - text: "ป้าแต๋วฝากด่ามาด้วยเหรอ{kq}"
        heart: 1
        reply: "ฝากแนะนำครับ แต่ผมแปลงเป็นข้อมูลก่อนส่ง คุณได้รับฉบับที่ผ่านการตรวจสอบแล้ว"

  - id: mod_f_n_whitening
    topic: news
    when: { gender: f }
    npc: "ข่าวปลอมสัปดาห์นี้ครับ ‘ผู้หญิงดื่มน้ำมะพร้าวทุกวัน ผิวขาวใน 7 วัน ไม่ต้องแต่งงานก็สวย’ แชร์ไปสี่สิบครั้ง คนแชร์ครึ่งหนึ่งเป็นผู้ชาย ผมยังไม่เข้าใจวัตถุประสงค์"
    options:
      - text: "แล้วจริงไหม{kq}"
        heart: 1
        reply: "น้ำมะพร้าวมีโพแทสเซียมครับ ดื่มพอดีก็ดี ไม่ทำให้ขาว ไม่เกี่ยวกับการแต่งงาน… คนเป็นโรคไตดื่มเยอะเกินอาจไม่ได้แต่งงานจริงครับ เพราะต้องนอนโรงพยาบาล"
      - text: "{p}ไม่สนเรื่องผิวขาว{k}"
        heart: 1
        reply: "ดีครับ ครีมขาวที่ขายในกลุ่ม LINE สามยี่ห้อ ผมส่งตรวจ สองยี่ห้อมีปรอท ผิวขาวจริงครับ แล้วก็ต้องมาหาผมจริงด้วย"

  - id: mod_f_a_alone
    topic: advice
    when: { gender: f, time: evening }
    npc: "ดึกแล้วครับ ถ้าคุณอยู่บ้านคนเดียว เก็บเบอร์ผม เบอร์หมอแอน เบอร์ดาบเสถียรไว้ในโทรศัพท์ครับ ผมไม่ได้บอกเพราะคุณเป็นผู้หญิง ผมบอกทุกคนที่อยู่คนเดียว… แต่คนที่จดจริง เป็นผู้หญิงหมดครับ"
    options:
      - text: "ผู้ชายไม่จดเหรอ{kq}"
        heart: 1
        reply: "ไม่จดครับ บอกว่า ‘ไม่เป็นไรหรอก’ แล้วผมก็ได้เบอร์เขาจากหมอแอน ตอนเขานอนอยู่ รพ.สต. ครับ"
        next:
          - text: "ดาบเสถียรรับสายเหรอ{kq}"
            heart: 0
            reply: "รับครับ ช่วงสี่ทุ่มถึงตีสี่เขาอยู่ร้านตั้ม ถ้าโทรไม่ติดให้โทรร้านตั้ม ผลลัพธ์เท่ากัน"
          - text: "{p}จดแล้ว{k} ขอบคุณที่ห่วงนะ{kq}"
            heart: 2
            reply: "ไม่ต้องขอบคุณครับ มันคือการป้องกันโรค… โรคอยู่คนเดียวแล้วไม่มีใครรู้ ยายคุณโทรหาผมทุกคืนวันอาทิตย์ครับ ไม่ได้ซื้อยา แค่บอกว่ายังอยู่"
      - text: "{p}ไม่กลัวหรอก{k}"
        heart: 0
        reply: "ไม่กลัวไม่ได้แปลว่าไม่ป่วยครับ ยายบัวบอกอีกว่าห้ามพูดว่าไม่กลัวตอนกลางคืน ผมไม่เชื่อเรื่องผี แต่ผมก็ไม่พูดครับ"

  - id: mod_f_s_classmate
    topic: smalltalk
    when: { gender: f }
    npc: "เมื่อวานลูกค้าถามผมว่า ‘ภก.ผู้หญิงร้านอำเภอแนะนำยาตัวนี้ เชื่อได้ไหม’ ผมบอกว่าเชื่อได้ครับ เธอได้ที่หนึ่งรุ่นผม ลูกค้าบอกว่า ‘แต่หมอผู้ชายดูน่าเชื่อกว่า’ ผมเลยขายยาที่เธอแนะนำ ในราคาร้านผม"
    options:
      - text: "สรุปลูกค้าเชื่อใคร{kq}"
        heart: 1
        reply: "เชื่อผมครับ ซึ่งแปลว่าเชื่อเธอ ผ่านผม… ระบบนี้ไม่มีประสิทธิภาพครับ แต่ยาถูกตัว"
      - text: "แล้วภก.ได้ที่เท่าไหร่{kq}"
        heart: 1
        reply: "ที่สิบเจ็ดครับ จากหกสิบ ไม่แย่ แต่ผมไม่เคยบอกลูกค้า… คุณเป็นคนแรก ช่วยเก็บเป็นความลับทางวิชาชีพด้วยครับ"
      - text: "คนก็เชื่อผู้ชายก่อนทุกเรื่องแหละ{k}"
        heart: 1
        reply: "ไม่ทุกเรื่องครับ เรื่องผีเขาเชื่อยายบัว เรื่องข่าวเชื่อป้าแต๋ว เรื่องยาเชื่อผม… เรื่องที่ถูกที่สุด เขาเชื่อน้อยที่สุดเสมอครับ"

  - id: mod_f_f_mother
    topic: self
    when: { gender: f, heart_min: 4 }
    npc: "แม่ผมสอบติดพยาบาลครับ สมัยก่อน ตาไม่ให้ไป บอกว่าลูกสาวไปไกลไม่ได้ ให้น้องชายแม่ไปเรียนแทน น้องชายแม่เรียนไม่จบ… ตอนผมเรียนเภสัช แม่ท่องชื่อยาตามทุกตัว ตอนนี้แม่จำได้มากกว่าผม"
    options:
      - text: "แม่ภก.คงภูมิใจในตัวภก.มาก{k}"
        heart: 2
        reply: "ภูมิใจครับ แต่ผมคิดว่าบางวันแม่มองผม แล้วเห็นตัวเองที่ไม่ได้ไป… ผมเลยให้แม่นั่งหลังเคาน์เตอร์ทุกวันเสาร์ แม่จัดยาเร็วกว่าผมครับ"
        next:
          - text: "ร้านนี้ก็เป็นของแม่ด้วยนะ{kq}"
            heart: 2
            reply: "…ไฟป้ายร้านที่เสียสองตัว ผมไม่ซ่อมเพราะแม่บอกว่าเหลือ ‘ร้านขาย’ ดีแล้ว คนจะได้เดินเข้ามาถาม ผมไม่เคยบอกใครว่าเป็นเหตุผลนี้ครับ"
          - text: "แม่ภก.ยังมาร้านทุกเสาร์เลยเหรอ{kq}"
            heart: 1
            reply: "ทุกเสาร์ครับ ใส่เสื้อกาวน์ตัวเก่าของผม ลูกค้าเรียกแม่ว่า ‘หมอ’ แม่ไม่แก้ ผมก็ไม่แก้ครับ"
      - text: "สมัยก่อนเป็นแบบนี้เยอะ{k}"
        heart: 1
        reply: "สมัยนี้ก็ยังมีครับ เปลี่ยนจาก ‘ไปไกลไม่ได้’ เป็น ‘กลับมาดูแลบ้านก่อน’… คุณเองก็กลับมานะครับ ผมไม่ได้ถามว่าใครขอ ผมแค่สังเกต"

  - id: mod_f_o_ann
    topic: others
    when: { gender: f }
    npc: "ชาวบ้านเรียกผมว่าหมอครับ ผมเป็นเภสัชกร แต่เรียกหมอแอนว่า ‘น้องพยาบาล’ ทั้งที่เธอรักษาคนมากกว่าผมสามเท่า เย็บแผลได้ ผมเย็บไม่ได้ ผมแก้ทุกครั้ง ชาวบ้านบอกว่า ‘หมอถ่อมตัว’"
    options:
      - text: "หมอแอนว่าไงบ้าง{kq}"
        heart: 1
        reply: "เธอบอกว่า ‘ช่างมันเถอะพี่มด’ แล้วเย็บแผลต่อ… เธอไม่มีเวลาโกรธครับ ผมเลยโกรธแทน วันละนิด ตามขนาดที่แนะนำ"
      - text: "เพราะภก.เป็นผู้ชาย เขาเลยเรียกหมอแหละ{k}"
        heart: 1
        reply: "ผมก็ตั้งสมมติฐานแบบนั้นครับ เลยลองใส่เสื้อธรรมดามาร้านหนึ่งอาทิตย์ ยังเป็นหมอเหมือนเดิม หมอแอนใส่ชุดพยาบาลทุกวัน ยังเป็นน้องเหมือนเดิม การทดลองยืนยันสมมติฐานครับ"
