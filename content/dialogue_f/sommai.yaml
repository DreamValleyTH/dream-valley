# ลุงสมหมาย — บทคุยเฉพาะผู้เล่นหญิง
convos:
  - id: sommai_f_r_boyfriend
    topic: react
    once: true
    when: { gender: f, flag: met_sommai, day_min: 3 }
    npc: "หลาน! ป้าพรสั่งห้ามลุงถามเรื่องแฟนหลานเด็ดขาด… ลุงไม่ได้ถามนะ ลุงแค่อยากรู้วันเกิดแฟนหลาน เอาไปซื้อหวย ไม่เกี่ยวกับความรักเลยเว้ย เกี่ยวกับเลขล้วนๆ"
    options:
      - text: "ไม่มีแฟน{k} ลุงซื้อเลขศูนย์ไปเลย"
        heart: 2
        reply: "ฮ่า! เลขศูนย์… ศูนย์สองตัวงวดที่แล้วออกนะหลาน ลุงไม่ได้ซื้อ เพราะลุงคิดว่าศูนย์มันไม่มีอะไร ที่แท้ไม่มีอะไรแหละที่ออก"
        next:
          - text: "ลุงอย่าไปบอกใครนะ{kq}ว่า{p}ไม่มีแฟน"
            heart: 1
            reply: "ไม่บอก ลุงสาบานกับรถเกี่ยว… แต่ลุงบอกป้าพรไปแล้วเมื่อกี้ทางสายตา ป้าพรยืนอยู่หลังหลานนะ"
          - text: "ลุงซื้อแล้วถูก แบ่ง{p}ด้วย{kq}"
            heart: 2
            reply: "แบ่งครึ่ง! ลุงพูดคำนี้กับทุกคน ไม่เคยต้องแบ่งสักบาท… ถ้าถูกจริงลุงจะแบ่งหลานก่อนป้าพร อย่าบอกป้าพร"
      - text: "ลุงถามแทนใครมา{kq}"
        heart: 1
        reply: "แทนป้าแต๋ว แทนเจ๊หงษ์ แทนแม่โอ๊ต… ลุงเป็นไปรษณีย์คำถาม ทุกคนอยากรู้ ไม่มีใครกล้าถามเอง เพราะกลัวหลานตอบเหมือนยายเพียร ยายเพียรตอบทีคนถามต้องไปนอนพัก"
      - text: "เรื่องส่วนตัว{k}ลุง"
        heart: 0
        reply: "จ้ะๆ ส่วนตัว… ลุงเข้าใจ ลุงก็มีเรื่องส่วนตัว เช่นเลขท้ายสองตัวงวดหน้า แต่อันนั้นลุงบอกทุกคน"

  - id: sommai_f_a_harvester
    topic: advice
    when: { gender: f, heart_min: 3 }
    npc: "หลาน… จะลองขับเจ้าทองคำไหม รถเกี่ยวลุงน่ะ คนในตำบลว่าผู้หญิงขับรถเกี่ยวไม่ได้ ลุงว่าไม่จริง ป้าพรขับได้ตั้งแต่สาว แต่ไม่ขับ เพราะไม่อยากขับตามคำสั่งลุง"
    options:
      - text: "ลองเลย{k} สอน{p}หน่อย"
        heart: 2
        reply: "ดี! คันโยกซ้ายยกหัวเกี่ยว ขวาเดินหน้า อย่ากดสองอันพร้อมกัน เจ้าทองคำจะงงแล้วเต้นรำ… เห็นไหม หลานจับคันโยกแน่นกว่าลูกชายลุงตอนหัดอีก"
        next:
          - text: "ลูกชายลุงหัดตอนกี่ขวบ{kq}"
            heart: 1
            reply: "สิบสาม ขับลงคูไปครึ่งคัน ลุงด่าจนเสียงแหบ ป้าพรเดินมาดึงขึ้นเองด้วยรถไถเดินตาม… ลุงไม่เคยเล่าให้ใครฟังนะว่าป้าเป็นคนดึง"
          - text: "{p}ขับเกี่ยวนาลุงปีนี้ได้ไหม{kq}"
            heart: 2
            reply: "ได้! ลุงคิดค่าเรียนเป็นข้าวสามกระสอบ… ล้อเล่น ลุงจ่ายหลานเป็นค่าแรง ป้าพรจะได้ไม่ว่าลุงเอาเปรียบเด็ก ป้าพรว่าลุงเอาเปรียบเฉพาะเจ้ามือหวย"
      - text: "ทำไมคนว่าผู้หญิงขับไม่ได้ล่ะ{kq}"
        heart: 1
        reply: "เพราะผู้ชายขับมาก่อนไงหลาน… คนแรกที่ขับรถเกี่ยวในตำบลคือลุง ขับชนต้นตาลไปต้นนึง ไม่มีใครว่าผู้ชายขับไม่ได้ ว่าแค่ลุงขับไม่เป็น"
      - text: "เดี๋ยวพังรถลุง{k}"
        heart: 0
        reply: "พังก็ให้บอลซ่อม บอลยังไม่ได้ค่าซ่อมลุงงวดที่แล้วเลย หนี้มันพอกพูนไปเรื่อย เหมือนดอกเบี้ยเสี่ยเฮง… ไม่ต้องกลัวเว้ย"

  - id: sommai_f_n_madam
    topic: news
    once: true
    when: { gender: f, flag: act1_done }
    npc: "เห็นป้ายยังหลาน! ‘คุณนายพเยาว์ สานต่องานที่ยังไม่เสร็จ’ ลุงนับได้สี่สิบเจ็ดป้ายจากบ้านถึงวัด… สี่เจ็ด ลุงซื้อไปแล้วสิบใบ"
    options:
      - text: "ผู้หญิงเป็นนายกฯ ก็ดีนะ{kq}ลุง"
        heart: 1
        reply: "ดีสิ ลุงไม่ว่าผู้หญิงผู้ชาย ลุงว่าเรื่องนามสกุล… นามสกุลเดียวนั่งเก้าอี้ตัวเดิมยี่สิบปี เก้าอี้มันจำก้นได้แล้วหลาน"
        next:
          - text: "แต่คุณนายพูดเก่งกว่านายกฯ นะ{kq}"
            heart: 2
            reply: "เก่งกว่าแน่ นายกฯ พูดวนสามชั่วโมง คุณนายพูดห้านาทีจบ ลุงฟังรู้เรื่องทุกคำ… แต่ฟังรู้เรื่องว่าถนนจะซ่อมอีกรอบ ก่อนเลือกตั้งเหมือนเดิม"
          - text: "งานที่ยังไม่เสร็จคืออะไร{kq}"
            heart: 1
            reply: "ลุงก็อยากรู้ ลุงไปถามผู้ใหญ่สมศักดิ์ ผู้ใหญ่บอกว่า ‘ทุกงานแหละ’ … ย้ำอีกครั้งนะ ทุกงาน"
      - text: "ลุงจะเลือกใคร{kq}"
        heart: 0
        reply: "ลุงเลือกเลข! ใครได้เบอร์สวยลุงเลือกคนนั้น… ล้อเล่นเว้ย ลุงยังไม่รู้ ป้าพรบอกว่าถ้าลุงรับซองใคร ป้าจะเย็บกระเป๋าลุงปิด"

  - id: sommai_f_s_heavy
    topic: smalltalk
    when: { gender: f, time: morning }
    npc: "หลาน! เมื่อวานลุงเห็นหลานแบกกระสอบปุ๋ยจากร้านเสี่ยเฮงคนเดียว ลุงจะวิ่งไปช่วย ป้าพรดึงแขนไว้ บอกว่า ‘ให้เขาแบก เขาไม่ได้ขอ’ … ลุงยืนดูเฉยๆ รู้สึกเหมือนผู้ชมมวย"
    options:
      - text: "ป้าพรเข้าใจ{p}{k}"
        heart: 2
        reply: "ป้าพรเข้าใจทุกคน ยกเว้นลุง… เออ จริงด้วย ลุงช่วยคนที่ไม่ได้ขอทั้งชีวิต ช่วยเจ้ามือหวยรวยมายี่สิบปี เขาก็ไม่ได้ขอ"
      - text: "คราวหน้าวิ่งมาช่วยได้นะ{kq} ห้าสิบกิโลหนักจริง"
        heart: 1
        reply: "ห้าสิบกิโล! ห้าศูนย์… ลุงไม่ได้จะซื้อนะ… เอ้อ ซื้อนิดนึง คราวหน้าตะโกนเรียกลุงเลย ลุงแบกคนละครึ่ง ลุงแบกด้านเบา"
      - text: "แบกเองเป็นการออกกำลังกาย{k}"
        heart: 1
        reply: "หมอแอนก็บอกลุงงี้ ให้ลุงเดินวันละห้าพันก้าว ลุงเดินไปร้านหวยสามรอบได้พอดี หมอแอนว่าไม่นับ"

  - id: sommai_f_f_wallet
    topic: self
    when: { gender: f, heart_min: 5 }
    npc: "หลาน ลุงจะเล่าอะไรให้ฟัง… ตอนแต่งงานใหม่ๆ เพื่อนในวงเหล้าล้อลุงว่ากลัวเมีย เพราะป้าพรถือเงินทั้งบ้าน ลุงอายจนต้องแอบซื้อหวยเพื่อพิสูจน์ว่าลุงมีเงินเอง"
    options:
      - text: "แล้วเพื่อนลุงตอนนี้เป็นยังไงบ้าง{kq}"
        heart: 2
        reply: "ขายนาหมดแล้วสี่คน… อีกคนเป็นหนี้เสี่ยเฮงสามแสน ลุงยังมีเจ้าทองคำ ยังมีนาสิบห้าไร่ ทั้งหมดเพราะป้าพรถือกระเป๋า ไม่ใช่เพราะลุงเก่ง ลุงเพิ่งยอมพูดตอนหกสิบห้า"
        next:
          - text: "ลุงเคยบอกป้าพรแบบนี้ไหม{kq}"
            heart: 2
            reply: "ไม่เคย… ถ้าบอกป้าจะคิดว่าลุงป่วย ป้าจะพาไปหาหมอแอน หลานบอกแทนลุงหน่อยได้ไหม บอกแบบไม่ให้ป้ารู้ว่าลุงฝาก"
          - text: "แต่ลุงก็ยังซื้อหวยอยู่ดีนะ{kq}"
            heart: 1
            reply: "ซื้อ… แต่ซื้อจากเงินที่ป้าแบ่งให้ เดือนละสามร้อย เกินนั้นป้ารู้ ป้านับเงินในกระเป๋าลุงแม่นกว่าธนาคาร"
      - text: "ลุงไม่อายแล้วใช่ไหม{kq}"
        heart: 1
        reply: "ไม่อายแล้วหลาน… เดี๋ยวนี้ใครล้อ ลุงบอกเลยว่าเมียลุงเป็นรัฐมนตรีคลังประจำบ้าน ไม่มีงบหาย ไม่มีศึกษาความเป็นไปได้ อบต. ยังต้องมาเรียน"

  - id: sommai_f_o_porn
    topic: others
    when: { gender: f, heart_min: 2 }
    npc: "หลาน… ป้าพรเขาชอบหลานนะ ลุงดูออก เขาวัดตัวหลานในใจทุกครั้งที่หลานเดินผ่าน ป้าไม่เคยวัดตัวใครฟรีๆ นอกจากคนที่จะตัดเสื้อให้"
    options:
      - text: "ป้าพรจะตัดเสื้อให้{p}เหรอ{kq}"
        heart: 1
        reply: "ไม่รู้ ป้าไม่บอกลุงหรอก… แต่ป้าซื้อผ้าฝ้ายสีครามมาสองเมตรเมื่อวาน ป้าไม่ใส่สีคราม ลุงใส่ไม่ได้ ไซซ์ไม่พอ ลุงว่าเป็นของหลาน… ทำหน้าตกใจด้วยนะ ป้าชอบให้คนตกใจ"
      - text: "ลุงไปเจอผ้าได้ยังไง{kq}"
        heart: 0
        reply: "ไม่ได้แอบนะ ลุงหาที่ซ่อนโพยหวย แล้วไปเจอผ้า… เอ้อ อันนี้ไม่ต้องบอกป้านะหลาน"
      - text: "ป้าพรดุจัง{k}"
        heart: 0
        reply: "ดุแต่ปาก ใจป้าเหมือนข้าวเหนียวมูน… ลุงพูดหวานไปไหม เดี๋ยวป้าได้ยินจะคิดว่าลุงทำอะไรผิดมา"
