# เจ๊หงษ์ — บทคุยเฉพาะผู้เล่นหญิง (gender: f) · ปากจัด ใจถึง แม่ค้าที่เลี้ยงลูกคนเดียว
convos:
  - id: hong_f_r_alone
    topic: react
    once: true
    when: { gender: f, day_min: 2 }
    npc: "น้อง! ได้ข่าวว่าอยู่บ้านยายคนเดียวเหรอย่ะ ไม่มีผู้ชายสักคน… ไม่กลัวเหรอ"
    options:
      - text: "กลัวผีนิดหน่อย{k} ผู้ชายไม่ต้องก็ได้"
        heart: 2
        reply: "ถูก! เจ๊บอกเลย ผู้ชายกันผีไม่ได้หรอก ผัวเจ๊หนีไปไกลกว่าผีอีก… เจ๊ลองถามดูว่าน้องตอบได้ไหม เพราะพรุ่งนี้ป้าแต๋วจะถาม มะรืนป้าพร อาทิตย์หน้าทั้งตลาด"
        next:
          - text: "ตอบแบบนี้ทุกคนเลยดีไหม{kq}"
            heart: 1
            reply: "ได้ แต่กับป้าพรต้องพูดดังๆ สามรอบนะย่ะ ป้าหูตึงข้างเดียว ข้างที่หันมาหาเราทุกที"
          - text: "เจ๊ก็อยู่คนเดียวเหรอ{kq}"
            heart: 2
            reply: "ยี่สิบปีแล้วย่ะ เลี้ยงลูกสามคนจบมหาลัย ประตูบ้านล็อกสองชั้น ข้างในมีสากกะเบือเท่าแขน… ผีมาเจ๊ยังเสียดายค่าธูป"
      - text: "ทำไม{kq} เจ๊จะหาผู้ชายมาให้เหรอ"
        heart: 1
        reply: "ไม่ย่ะ! เจ๊ขายผลไม้ ไม่ได้ขายผู้ชาย… ถ้าขายได้ เจ๊ขายผัวเจ๊ไปนานแล้ว ไม่มีใครซื้อ ช้ำทั้งลูก"
      - text: "เรื่องของ{p}{k}"
        heart: -1
        reply: "โอ้โห ห้วนเหมือนเจ๊สมัยสาว ดี! แต่ห้วนกับเจ๊ได้นะ กับป้าแต๋วอย่าห้วน ป้าจะโพสต์ลงกลุ่มว่าหลานยายเพียรเศร้า"

  - id: hong_f_n_campaign
    topic: news
    when: { gender: f, flag: story_posters }
    npc: "(หรี่เสียง) น้อง… คุณนายพเยาว์มาเดินตลาดเมื่อเช้า ไม่ได้มาหาเสียงนะย่ะ มาเช็กราคา แล้วต่อเจ๊ได้ห้าบาท! ยี่สิบห้าปีไม่มีใครต่อเจ๊ได้ เจ๊ว่าคนนี้ได้เป็นนายกแน่"
    options:
      - text: "เจ๊จะเลือกเพราะเขาต่อเก่งเหรอ{kq}"
        heart: 1
        reply: "ก็คนต่อเจ๊ได้ ต่องบจังหวัดได้แน่ย่ะ… ผัวเขาพูดสิบห้านาทีไม่มีคำว่าถนน เมียต่อห้าบาทได้ในสามคำ ‘เจ๊ ลดหน่อย’ เจ๊ใจอ่อนไปเอง"
      - text: "ห้าบาทเลยเหรอ{kq} เจ๊ไม่สบายรึเปล่า"
        heart: 1
        reply: "นั่นสิ เจ๊ยังงงตัวเอง… เขาจับมือเจ๊แล้วบอกว่า ‘ผู้หญิงด้วยกันนะเจ๊’ เจ๊เสร็จเลยย่ะ ห้าบาทหายไปกับคำเดียว นักการเมืองน่ากลัวกว่าผี"

  - id: hong_f_a_lipstick
    topic: advice
    when: { gender: f }
    npc: "น้อง เจ๊สอนให้ฟรีครั้งเดียว จะเอาของไปขายลานเฮีย ทาลิปแดงๆ ไป ไม่ใช่ให้สวยนะย่ะ ให้เขารู้ว่าเราไม่กลัวใครมอง แล้วพูดราคาก่อนเขา คนพูดราคาก่อนคือคนคุมเกม"
    options:
      - text: "เจ๊ใช้วิธีนี้กับเฮียเฮงเหรอ{kq}"
        heart: 2
        reply: "ยี่สิบปี ไม่เคยแพ้ย่ะ! เฮียเห็นเจ๊มาแต่ไกล กดเครื่องคิดเลขบวกราคารอเลย… รู้ไหม เฮียกดราคาผู้หญิงทุกคน ยกเว้นเจ๊กับยายเธอ สองคนนี้เขาจำ"
        next:
          - text: "ยาย{p}ทำยังไงกับเฮีย{kq}"
            heart: 2
            reply: "ยายเธอไม่ทาลิปย่ะ ยายเธอถือสมุดจดราคาทุกลานไปยืนอ่านให้ฟังทีละบรรทัด เฮียหน้าซีดเหมือนข้าวสาร เจ๊ยืนดูอยู่ ขำจนมะม่วงหล่นสองลูก"
          - text: "{p}จะลองดู{k}"
            heart: 1
            reply: "ดี! กลับมาเล่าให้เจ๊ฟังด้วยนะย่ะ ได้เพิ่มกิโลละบาท เจ๊ขอค่าคอร์สห้าสิบสตางค์"
      - text: "ถ้า{p}ไม่ทาลิปล่ะ{kq}"
        heart: 1
        reply: "ก็พูดเสียงดังแทน… ลิปของเจ๊จริงๆ คือเสียงเจ๊แหละย่ะ ทาไว้เผื่อวันเสียงแหบ"
      - text: "{p}ไม่อยากทะเลาะกับใคร{k}"
        heart: 0
        reply: "ไม่ต้องทะเลาะย่ะ แค่อย่ายิ้มก่อน… ผู้หญิงยิ้มก่อน เขาคิดว่าลดได้ เจ๊ยิ้มหลังเขาจ่ายเงินแล้วเท่านั้น"

  - id: hong_f_s_daughter
    topic: smalltalk
    when: { gender: f }
    npc: "น้องอายุพอๆ กับลูกสาวคนเล็กเจ๊เลยนะ ลูกเจ๊กลับบ้านทีไรโดนถาม ‘เมื่อไหร่จะแต่ง’ ทุกที… คนถามคือเจ๊เองนี่แหละย่ะ"
    options:
      - text: "แล้วลูกเจ๊ตอบว่าไง{kq}"
        heart: 1
        reply: "ตอบว่า ‘แม่แต่งแล้วได้อะไร’ เจ๊เถียงไม่ออกย่ะ เจ๊เลยเปลี่ยนไปถามว่า ‘กินข้าวยัง’ ปลอดภัยกว่า"
      - text: "ถ้าเจ๊ถาม{p} {p}จะตอบว่ากินข้าวแล้ว{k}"
        heart: 2
        reply: "ฮ่าๆ ฉลาดย่ะ! ตอบคำถามที่ไม่มีใครถาม เหมือนนายกวิชัยเลย… อันนี้ชมนะ เฉพาะเรื่องนี้เรื่องเดียว"

  - id: hong_f_f_ring
    topic: self
    when: { gender: f, heart_min: 5 }
    npc: "(หรี่เสียง) น้อง… รู้ไหมทำไมเจ๊ใส่แหวนทองวงนี้ทุกวัน แหวนแต่งงานย่ะ ไม่ใช่ยังรักนะ คนในตลาดเห็นแหวน เขาไม่มาจีบ ไม่มาต่อราคาแบบจีบๆ เจ๊ใช้ผัวที่ไม่อยู่เป็นยามเฝ้าแผงมายี่สิบปี"
    options:
      - text: "ผัวเจ๊ยังมีประโยชน์อยู่นะ{k}"
        heart: 1
        reply: "อย่างเดียวย่ะ อย่างเดียวในยี่สิบปี… ส่วนเงินที่เขาไม่ส่ง เจ๊หาเองหมด"
      - text: "เจ๊เก่งมากที่ผ่านมาได้{k}"
        heart: 2
        reply: "ไม่ได้เก่งย่ะ ไม่มีทางเลือก… แต่พอผ่านมาแล้ว เออ เจ๊ก็เก่งแหละ ให้เจ๊ชมตัวเองบ้าง ไม่มีใครชม"

  - id: hong_f_o_meeting
    topic: others
    when: { gender: f, flag: story_meeting1 }
    npc: "ประชุมศาลาเมื่อวาน เจ๊นับนะย่ะ ผู้ชายพูดสิบสองคน ผู้หญิงพูดคนเดียวคือป้าแต๋ว แล้วไมค์ดับตอนป้าพูดพอดี… ผู้ใหญ่ว่าไมค์เก่า เจ๊ว่าไมค์มันรู้ตัว"
    options:
      - text: "แต่ผู้หญิงนั่งเต็มศาลาเลยนะ{kq}"
        heart: 1
        reply: "เต็มย่ะ นั่งแถวหลัง ถือขนม ป้อนข้าวหลาน จดราคา… เลิกประชุม ผู้ชายกลับบ้านถามเมียว่าสรุปได้อะไร เมียสรุปให้ในสามประโยค สั้นกว่านายกพูดอีก"
        next:
          - text: "รอบหน้าเจ๊ยกมือพูดสิ{k}"
            heart: 2
            reply: "ยกแน่ย่ะ เสียงเจ๊ไม่ต้องใช้ไมค์ ถึงหน้าวัด… ถ้ากำนันหลับ เจ๊ปลุกให้ฟรี"
          - text: "รอบหน้า{p}จะพูดเอง{k}"
            heart: 2
            reply: "นั่นแหละ! เจ๊จะนั่งแถวหน้า ถ้าไมค์ดับ เจ๊ตะโกนทวนให้ทุกคำย่ะ ผู้ใหญ่สมศักดิ์จะได้พักย้ำบ้าง"
      - text: "ไมค์คงเก่าจริงๆ แหละ{k}"
        heart: 0
        reply: "เก่าเฉพาะตอนผู้หญิงพูดเหรอย่ะ… ตอนนายกพูดสิบห้านาที ไมค์ไม่ดับสักวิ"
