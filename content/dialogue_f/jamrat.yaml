convos:
  - id: jamrat_f_daughter_home
    topic: react
    once: true
    when: { gender: f, day_min: 6 }
    npc: "หลาน… วันอาทิตย์ลูกสาวลุงโทรมาตามเวลาเดิม สิบเก้านาฬิกาตรง ลุงเล่าว่ามีหลานสาวยายเพียรกลับมาอยู่คนเดียว ทำแปลงเอง ลูกลุงเงียบไปห้าวินาที ลุงจับเวลา… แล้วบอกว่า ‘พ่อ หนูอยากกลับบ้านบ้าง’"
    options:
      - text: "ลูกสาวลุงจะกลับมาไหม{kq}"
        heart: 1
        reply: "ยังไม่รู้หลาน ลุงไม่กล้าถามต่อ… ลุงจดประโยคนั้นลงสมุดแล้ว บรรทัดที่สี่ร้อยสิบสอง ช่องหมายเหตุลุงเขียนว่า ‘ยังไม่ใช่สัญญา แต่เป็นครั้งแรก’"
        next:
          - text: "ถ้ากลับมา {p}จะพาไปดูแปลง{k}"
            heart: 2
            reply: "ลุงจะบอกเขาเอ้อ… ลูกลุงทำบัญชีโรงงานอยู่ระยอง เก่งตัวเลขเหมือนลุง แต่ไม่เคยได้ปลูกอะไร ถ้าหลานพาไปดู เขาอาจจะอยากอยู่นานกว่าสามวัน"
          - text: "ลุงอยากให้กลับไหม{kq}"
            heart: 2
            reply: "อยาก… ลุงไม่เคยบอกเขา ลุงกลัวว่าเขาจะกลับมาเพราะสงสารพ่อ ลุงอยากให้เขากลับมาเพราะอยากอยู่ เหมือนหลาน"
      - text: "{p}ทำให้ลูกลุงคิดถึงบ้านเหรอ{kq}"
        heart: 1
        reply: "ลุงว่าใช่หลาน… เขาถามลุงสามคำถาม หลานอยู่คนเดียวจริงไหม ใครช่วยไถ ไม่มีใครว่าอะไรเหรอ ลุงตอบได้สองข้อ ข้อสามลุงตอบไม่ได้ ลุงบอกว่า ‘มีคนว่า แต่เขาก็อยู่’"
      - text: "ลุงจับเวลาด้วยเหรอ{kq}"
        heart: 0
        reply: "จับทุกอย่างหลาน… ห้าวินาทีสำหรับลูกลุงถือว่านาน ปกติเขาตอบลุงภายในหนึ่งวินาทีว่า ‘สบายดีค่ะพ่อ’"

  - id: jamrat_f_loan_witness
    topic: advice
    when: { gender: f, day_min: 4 }
    npc: "ลุงจะบอกอะไรอย่างนึงนะหลาน ตำบลนี้ ใครเห็นผู้หญิงอยู่คนเดียวมีที่ดิน จะมีคนมายืมเงิน มาขอฝากของ มาขอเป็นพยานเซ็นอะไร… เยอะกว่าผู้ชายสามเท่า ลุงเคยนับตอนเป็นเสมียน"
    options:
      - text: "แล้ว{p}ควรทำยังไง{kq}"
        heart: 1
        reply: "ใครมายืม ให้มาเซ็นในสมุดลุงที่วัด ลุงเป็นพยานให้ฟรี จดวันที่ จำนวน ดอกเบี้ย ศูนย์ก็จดว่าศูนย์… คนที่ตั้งใจคืนจะไม่ว่าอะไร คนที่ไม่ตั้งใจคืนจะเดินกลับเอง"
      - text: "{p}ปฏิเสธเป็น{k} ไม่ต้องห่วง"
        heart: 1
        reply: "ดีหลาน… ลุงจดไว้ว่า ‘หลานยายเพียร ปฏิเสธเป็น’ ข้อมูลนี้มีค่ามาก ลุงจะไม่บอกใคร ยกเว้นคนที่จะมายืม"
      - text: "ทำไมผู้หญิงโดนเยอะกว่า{kq}"
        heart: 1
        reply: "เพราะคนคิดว่าผู้หญิงเกรงใจหลาน… แต่ลุงดูบัญชีสหกรณ์สามสิบปี คนที่คืนเงินตรงเวลาที่สุดเป็นผู้หญิงแปดในสิบคน คนที่คิดว่าผู้หญิงใจอ่อน ไม่เคยเปิดบัญชีดู"

  - id: jamrat_f_kathin_names
    topic: news
    when: { gender: f }
    npc: "ปีนี้ลุงจะเปลี่ยนป้ายรายชื่อเจ้าภาพกฐินหลาน… ปีที่แล้วชื่อผู้ชายทุกบรรทัด ลุงไปเปิดสมุดดู คนที่ควักเงินจริงเป็นผู้หญิงสิบเจ็ดในยี่สิบคน เมียๆ ให้เขียนชื่อสามีเพราะ ‘ดูดีกว่า’"
    options:
      - text: "ลุงจะเขียนชื่อคนที่ควักเงินจริงเหรอ{kq}"
        heart: 2
        reply: "ใช่หลาน ลุงยึดความโปร่งใส ป้ายต้องตรงกับสมุด สมุดต้องตรงกับเงิน… ลุงถามทุกคนก่อนนะ ป้าทองใบบอกว่า ‘เขียนชื่อข้าเลย ผัวข้าไม่เคยรู้ด้วยซ้ำว่าข้าทำบุญ’"
      - text: "ทำไมต้องเขียนชื่อสามีให้ดูดีกว่า{kq}"
        heart: 1
        reply: "ลุงก็ไม่เข้าใจหลาน… ลุงเป็นเสมียน ลุงเข้าใจแต่ตัวเลข ตัวเลขบอกว่าใครจ่าย ส่วนป้ายบอกว่าใครอยากให้คนคิดว่าจ่าย สองอย่างนี้ไม่ควรต่างกัน"
      - text: "ไม่ต้องเปลี่ยนหรอก{k} เดี๋ยวมีเรื่อง"
        heart: 0
        reply: "อาจจะมีเรื่องหลาน… แต่ลุงเลิกเหล้ามาสิบห้าปีด้วยการไม่โกหกตัวเอง ลุงจะเริ่มโกหกบนป้ายวัดไม่ได้เอ้อ"

  - id: jamrat_f_counter
    topic: smalltalk
    when: { gender: f }
    npc: "สมัยลุงเป็นเสมียนสหกรณ์นะหลาน คนนับเงินหน้าเคาน์เตอร์เป็นผู้หญิงทั้งหมด คนเซ็นอนุมัติเป็นผู้ชายทั้งหมด… ลุงนั่งตรงกลาง หน้าที่ลุงคือจดว่าใครทำงาน"
    options:
      - text: "แล้วใครทำงานเยอะกว่า{kq}"
        heart: 1
        reply: "ลุงจดไว้ ผู้หญิงหน้าเคาน์เตอร์นับเงินวันละสามร้อยราย ผู้ชายเซ็นวันละสิบสองฉบับ… เงินเดือนผู้ชายมากกว่าสองเท่า ลุงจดไว้ด้วย แต่ไม่มีใครขอดูหน้านั้น"
      - text: "ลุงจดทุกอย่างจริงๆ นะ{kq}"
        heart: 0
        reply: "จริงหลาน… ลุงจดแม้กระทั่งว่าวันนี้หลานยืนคุยกับลุงสี่นาที จดในช่อง ‘เวลาที่ได้คุยกับคนรุ่นใหม่’ ช่องนี้ว่างมาหลายปี"
      - text: "ยายเพียรเคยมาสหกรณ์บ่อยไหม{kq}"
        heart: 1
        reply: "ทุกเดือนหลาน มาฝากเงินทีละร้อยสองร้อย ต่อคิวผู้หญิง ไม่เคยแซงคิว… คนเซ็นอนุมัติชอบเรียกยายเข้าห้องก่อน ยายไม่ไป ยายบอกว่า ‘คิวนี้คิวเดียวกัน’"

  - id: jamrat_f_pian_ledger
    topic: self
    when: { gender: f, heart_min: 3 }
    npc: "ลุงจะสารภาพอะไรหลานอย่างนึง… สมัยหนุ่ม ลุงคิดว่าผู้หญิงชาวนาอ่านบัญชีไม่ออก วันนึงยายเพียรมาขอดูสมุดสหกรณ์ ยายชี้บรรทัดที่ลุงจดผิดได้ในห้านาที ลุงจดมาสามวันยังไม่เห็น"
    options:
      - text: "ลุงรู้สึกยังไงตอนนั้น{kq}"
        heart: 1
        reply: "อายหลาน… อายจนกลับบ้านไปกินเหล้าเพิ่ม ลุงพูดตรงๆ นะ ตอนนั้นลุงยังไม่เลิก แต่วันรุ่งขึ้นลุงแก้บรรทัดนั้น แล้วเขียนหมายเหตุว่า ‘แก้ตามที่คุณเพียรชี้’ ไม่เคยลบมาจนทุกวันนี้"
        next:
          - text: "ลุงเขียนชื่อยายไว้ในสมุดด้วยเหรอ{kq}"
            heart: 2
            reply: "เขียนหลาน… นั่นเป็นครั้งแรกที่ลุงเขียนว่าคนที่ถูกคือผู้หญิง ในสมุดราชการ ตัวหนังสือลุงสั่นนิดนึง ไม่ใช่เพราะเหล้า เพราะเขิน"
          - text: "ยายเพียรว่าอะไรลุงไหม{kq}"
            heart: 1
            reply: "ยายไม่ว่าอะไรเลยหลาน ยายแค่บอกว่า ‘ตัวเลขไม่รู้ว่าใครเป็นคนอ่าน’… ลุงเอาประโยคนั้นมาใช้กับทุกคนที่ถามว่าทำไมลุงติดบัญชีวัดหน้าศาลา"
      - text: "ยายเพียรเก่งตัวเลขขนาดนั้นเลยเหรอ{kq}"
        heart: 1
        reply: "ยายทำนาหลาน… ทำนาต้องคิดทุกอย่าง ค่าปุ๋ย ค่าน้ำ ค่าไถ ราคาข้าว ความชื้นที่ลานหัก คนทำนาที่ไม่เก่งเลข อยู่ไม่ได้สามปี ยายอยู่มาห้าสิบปี"
      - text: "ทุกคนก็เคยคิดผิดกันทั้งนั้น{k}"
        heart: 1
        reply: "จริงหลาน… แต่ลุงจดไว้ว่าลุงคิดผิดเรื่องไหน คนส่วนใหญ่คิดผิดแล้วไม่จด เลยคิดผิดเรื่องเดิมซ้ำ"

  - id: jamrat_f_thongbai_line
    topic: others
    when: { gender: f }
    npc: "ป้าทองใบทำครัววัดมายี่สิบปีหลาน ไม่เคยมีชื่อในสมุดบัญชีวัดสักบรรทัด เพราะไม่เคยเบิกเงิน ไม่เคยรับค่าแรง… เมื่อวานลุงเพิ่งเปิดช่องใหม่ ชื่อช่องว่า ‘แรงงานที่ไม่ได้คิดเงิน’"
    options:
      - text: "ช่องนั้นมีชื่อใครบ้าง{kq}"
        heart: 1
        reply: "ป้าทองใบ ยายบัว ป้าแต๋ว ป้าพร ยายจันทร์ แม่บ้านหมู่สองอีกสิบสามคน ช่างเปี๊ยกคนเดียวที่เป็นผู้ชาย… ลุงคิดเป็นเงินตามค่าแรงขั้นต่ำ ยี่สิบปี ลุงไม่กล้าบอกตัวเลขหลาน ตัวเลขมันใหญ่กว่างบ อบต."
        next:
          - text: "ลุงบอกตัวเลขเถอะ{k} {p}อยากรู้"
            heart: 2
            reply: "(กระซิบ) …ถ้าคิดเป็นเงิน ครัววัดเราติดหนี้ผู้หญิงในตำบลสามล้านกว่าบาทเอ้อ ลุงคิดสามรอบ ตรงทุกรอบ ลุงจะติดไว้หน้าศาลาเดือนหน้า ใต้บัญชีวัด ตัวเท่ากัน"
          - text: "ป้าทองใบรู้ไหม{kq}ว่าลุงทำช่องนี้"
            heart: 1
            reply: "รู้หลาน ป้าทองใบหัวเราะจนน้ำแกงหก แล้วบอกว่า ‘จดไปทำไม วัดไม่มีเงินจ่ายหรอก’… ลุงบอกว่าไม่ได้จดเพื่อจ่าย จดเพื่อให้รู้ ป้าทองใบเงียบไป แล้วตักแกงให้ลุงเพิ่มหนึ่งทัพพี"
      - text: "จดไปก็ไม่ได้เงินอยู่ดี{k}"
        heart: 0
        reply: "ไม่ได้หลาน… แต่สิ่งที่ไม่ถูกจด มันหายไปจากความจำของตำบล ลุงเห็นมาแล้วกับเงินกองทุน ลุงไม่อยากให้แรงคนหายแบบเดียวกัน"
      - text: "{p}ช่วยครัววัดบ้างได้ไหม{kq}"
        heart: 2
        reply: "ได้เอ้อ ป้าทองใบรอคนช่วยหั่นผักทุกวันพระ… แต่ลุงต้องจดชื่อหลานลงช่องใหม่นะ ช่องนี้ลุงไม่ยอมให้ใครทำงานฟรีแบบไม่มีชื่อ"
