convos:
  - id: toey_f_mew_drawing
    topic: react
    once: true
    when: { gender: f, day_min: 5, flag: met_toey }
    npc: "ครูให้เด็กวาดรูปหัวข้อ ‘อาชีพในฝัน’ จ้ะ ทุกปีเด็กผู้หญิงวาดครู พยาบาล แม่ค้า… ปีนี้น้องมิววาดผู้หญิงใส่หมวกงอบ ถือจอบ ข้างๆ มีไก่สามตัว ใต้รูปเขียนว่า ‘พี่{player}’"
    options:
      - text: "จริงเหรอ{kq} ขอดูรูปหน่อย"
        heart: 2
        reply: "นี่จ้ะ ครูถ่ายมา… สังเกตไหม จอบใหญ่กว่าตัวคน ไก่ใหญ่กว่าจอบ แล้วคนในรูปยิ้มกว้างที่สุดในห้อง ครูให้สิบเต็มสิบ ให้ดาวสองดวงด้วย"
      - text: "แล้วน้องโอ๊ตวาดอะไร{kq}"
        heart: 1
        reply: "น้องโอ๊ตวาดนายกฯ จ้ะ… ยืนตัดริบบิ้น ป้ายใหญ่กว่าตัว ครูถามว่าทำไมอยากเป็นนายกฯ น้องตอบว่า ‘ได้ใช้กรรไกรอันใหญ่ครับ’ ครูให้เจ็ดเต็มสิบ ความซื่อสัตย์เต็ม"
      - text: "อย่าให้น้องเอา{p}เป็นตัวอย่างเลย{k} {p}ยังไม่ได้เรื่อง"
        heart: 0
        reply: "ครูไม่ให้คะแนนประโยคนี้นะจ๊ะ… เด็กเลือกตัวอย่างเอง ผู้ใหญ่ห้ามไม่ได้ ผู้ใหญ่แค่ทำตัวให้ไม่ผิดหวังก็พอ"

  - id: toey_f_career_day
    topic: news
    when: { gender: f }
    npc: "เดือนหน้าโรงเรียนมี ‘วันอาชีพ’ จ้ะ ปีที่แล้วครูเชิญช่างเปี๊ยก ดาบเสถียร เสี่ยเฮงมาเล่า… เด็กผู้หญิง ป.5 ยกมือถามว่า ‘ผู้หญิงทำอะไรได้บ้างคะครู’ ครูอยากเชิญ{player}มาตอบจ้ะ"
    options:
      - text: "ได้{k} {p}จะเล่าเรื่องปลูกผักกับหนีงานกรุงเทพฯ"
        heart: 2
        reply: "ส่วนแรกดีมากจ้ะ ส่วนหลังขอปรับเป็น ‘เลือกชีวิตใหม่’ นะ… ครูจะชวนหมอแอน แพรว ป้าแต๋วมาด้วย สี่คนสี่แบบ เด็กจะได้เห็นว่าคำตอบมีมากกว่าหนึ่ง"
      - text: "แล้วเสี่ยเฮงเล่าอะไรให้เด็กฟัง{kq}"
        heart: 1
        reply: "เล่าวิธีปล่อยกู้จ้ะ… เด็ก ป.6 คำนวณดอกเบี้ยตามได้ แล้วยกมือบอกว่า ‘เสี่ยโกงครับ’ ครูให้เด็กสิบเต็มสิบวิชาคณิต ให้เสี่ยศูนย์วิชาจริยธรรม"
      - text: "{p}พูดหน้าห้องไม่เก่ง{k}"
        heart: 0
        reply: "ไม่ต้องเก่งจ้ะ เด็กไม่ได้ให้คะแนนการพูด เด็กให้คะแนนว่าพูดจริงไหม… ถ้าเปลี่ยนใจ ครูเว้นที่ไว้ให้นะ"

  - id: toey_f_score_answer
    topic: advice
    when: { gender: f }
    npc: "ตั้งใจฟังนะ… ครูมีเคล็ดลับตอบคำถาม ‘เมื่อไหร่จะแต่งงาน’ จ้ะ ใช้มาเจ็ดปีไม่เคยพลาด ให้ตอบเป็นคะแนน ‘ตอนนี้ความรักได้สามเต็มสิบค่ะ ยังไม่ผ่านเกณฑ์’"
    options:
      - text: "แล้วเขาถามต่อไหม{kq}"
        heart: 1
        reply: "ถามจ้ะ ‘แล้วต้องได้เท่าไหร่ถึงผ่าน’… ครูตอบว่า ‘เจ็ดจ้ะ แต่ข้อสอบยังไม่ออก’ แล้วเปลี่ยนเรื่องไปถามเรื่องหลานเขา คนแก่ชอบเล่าเรื่องหลานมากกว่าถามเรื่องเรา"
        next:
          - text: "ตอนนี้ของครูได้กี่คะแนนแล้ว{kq}"
            heart: 2
            reply: "…ครูยังไม่ได้ตรวจจ้ะ ข้อสอบฉบับนี้ครูเก็บไว้ในลิ้นชัก ยังไม่กล้าเปิด (ปากกาแดงหล่นจากมือ) ครูไปเก็บปากกาก่อนนะ"
          - text: "{p}จะใช้กับป้าพรพรุ่งนี้เลย{k}"
            heart: 1
            reply: "ป้าพรเป็นข้อสอบยากที่สุดในตำบลนะจ๊ะ ป้าพรจะถามว่า ‘ใครเป็นคนตรวจ’… ถ้าเจอข้อนี้ ให้ตอบว่า ‘ตรวจเองค่ะ’ แล้วเดินออกมาเลย"
      - text: "ตอบตรงๆ ว่ายังไม่อยากแต่งไม่ได้เหรอ{kq}"
        heart: 1
        reply: "ได้จ้ะ ตอบตรงก็ดี… แต่ตอบตรงในตำบลนี้ต้องตอบสามรอบเหมือนผู้ใหญ่ประกาศ คะแนนช่วยให้เขาหัวเราะก่อน แล้วค่อยเชื่อ"
      - text: "ครูเต้ยโดนถามบ่อยเหรอ{kq}"
        heart: 1
        reply: "ทุกวันประชุมผู้ปกครองจ้ะ… ผู้ปกครองถามเรื่องการบ้านลูกห้านาที ถามเรื่องแฟนครูยี่สิบนาที ครูกำลังคิดจะทำแบบประเมิน แยกสองหัวข้อ"

  - id: toey_f_venus
    topic: smalltalk
    when: { gender: f, heart_min: 4, time: evening }
    npc: "พรุ่งนี้ครูจะสอนเรื่องดาวเคราะห์จ้ะ คืนนี้ดาวศุกร์สว่างที่สุดของเดือน ครูจะไปนั่งดูที่สนามโรงเรียนก่อนสองทุ่ม… ไปด้วยกันไหมจ๊ะ เรื่องนี้ครูให้สิบเต็มสิบ ทั้งที่ยังไม่ได้ไป"
    options:
      - text: "ไป{k} {p}ไม่เคยดูดาวจริงจังเลย"
        heart: 2
        reply: "ดีจ้ะ ครูเตรียมเสื่อไว้ผืนเดียว… หมายถึงผืนเดียวพอสำหรับสองคน ครูคำนวณพื้นที่แล้ว เป็นวิชาคณิต ไม่ใช่อย่างอื่น"
        next:
          - text: "ครูเต้ยหน้าแดงหรือเปล่า{kq}"
            heart: 2
            reply: "ไม่จ้ะ แสงดาวศุกร์ส่องมาจ้ะ… ดาวศุกร์สว่างมากคืนนี้ สว่างจนหน้าคนแดงได้ ครูสอนแบบนี้เด็กไม่เชื่อ แต่{player}เชื่อนะ"
          - text: "กลับก่อนสามทุ่มนะ{kq} ผีออก"
            heart: 1
            reply: "ครูตั้งนาฬิกาปลุกไว้แล้วจ้ะ สองทุ่มสี่สิบห้า… ครูเป็นคนตรงเวลา แต่คืนนี้ครูอยากให้นาฬิกาเดินช้าหน่อย"
      - text: "ดาวศุกร์คือดาวประจำเมือง{kq}"
        heart: 1
        reply: "ถูกต้องจ้ะ! ดาวประจำเมืองตอนหัวค่ำ ดาวประกายพรึกตอนเช้ามืด ดวงเดียวกันสองชื่อ… เก้าเต็มสิบ ตัดหนึ่งคะแนนเพราะยังไม่ตอบว่าจะไปไหม"
      - text: "คืนนี้{p}เหนื่อย{k}"
        heart: 0
        reply: "ไม่เป็นไรจ้ะ ดาวศุกร์ขึ้นทุกคืน… ครูก็อยู่ทุกคืน วันไหนว่างค่อยไปนะ ครูจะเก็บเสื่อไว้"

  - id: toey_f_mother_knowledge
    topic: self
    when: { gender: f, heart_min: 3 }
    npc: "แม่ครูขายขนมไทยตลาดเช้าจ้ะ ส่งครูเรียนจนจบ แม่พูดประโยคเดียวทุกเช้าตอนกวนขนม ‘ผู้หญิงต้องมีวิชาติดตัว ผัวหนีได้ วิชาไม่หนี’"
    options:
      - text: "แม่ครูพูดตรงมากเลย{k}"
        heart: 1
        reply: "ตรงเหมือนปากกาแดงจ้ะ… แต่แม่ไม่ได้มีวิชาแค่ขนมนะ แม่จำราคาของทั้งตลาดได้ คิดเลขในใจเร็วกว่าครู ครูเพิ่งรู้ตอนเป็นครูแล้วว่าแม่คือครูคนแรกของครู"
        next:
          - text: "ครูยังจำสูตรขนมของแม่ได้ไหม{kq}"
            heart: 2
            reply: "จำได้จ้ะ ยกเว้นชั้นที่สิบ… ครูทำได้เก้าชั้นมาตลอด ครูคิดว่าแม่แอบเก็บชั้นที่สิบไว้ไม่สอน เผื่อครูจะได้มีอะไรให้ตามหาต่อ ถ้า{player}อยากเรียน ครูสอนเก้าชั้นให้ได้นะ"
          - text: "แล้วพ่อครูล่ะ{kq}"
            heart: 1
            reply: "พ่อครูไปทำงานไกลตั้งแต่ครูยังเล็กจ้ะ กลับบ้านปีละครั้งสองครั้ง… คนในตลาดเรียกแม่ว่า ‘แม่ค้าขนม’ แต่ครูเรียกแม่ว่าทั้งพ่อทั้งแม่ ในใจนะ ไม่เคยพูดออกไป"
      - text: "ยาย{p}ก็สอนแบบนี้เหมือนกัน{k}"
        heart: 2
        reply: "ยายเพียรเหรอจ๊ะ… ไม่แปลกใจเลย ยายเพียรมาซื้อขนมแม่ครูทุกวันพระ สองคนยืนคุยกันนานกว่าขาย ครูเพิ่งเข้าใจวันนี้ว่าคุยเรื่องอะไรกัน"
      - text: "สมัยนี้ไม่ต้องคิดแบบนั้นแล้วมั้ง{k}"
        heart: 0
        reply: "ส่วนเรื่องผัวอาจจะไม่ต้องจ้ะ… แต่ส่วนวิชา ครูว่ายังต้อง เด็กผู้หญิงในห้องครูทุกคนครูบอกประโยคนี้ ฉบับแก้แล้ว ‘ใครจะหนีก็ได้ วิชาไม่หนี’"

  - id: toey_f_tug_of_war
    topic: others
    when: { gender: f, flag: story_sports_day }
    npc: "กีฬาสีปีนี้ ชักเยอ ทีมเด็กผู้หญิงชนะทีมเด็กผู้ชายสองรอบติดจ้ะ… น้องโอ๊ตร้องไห้ บอกว่า ‘ไม่ยุติธรรม มิวกินข้าวเยอะ’ น้องมิวตอบว่า ‘ก็กินสิ’"
    options:
      - text: "น้องมิวพูดถูก{k}"
        heart: 1
        reply: "ครูไม่ได้เข้าข้างใครนะจ๊ะ… แต่ครูให้น้องมิวสิบเต็มสิบวิชาโต้วาที แล้วพาน้องโอ๊ตไปกินข้าวเพิ่มอีกจาน ทั้งสองคนจบวันแบบอิ่ม"
      - text: "เด็กผู้ชายแพ้แล้วต้องร้องไห้ด้วยเหรอ{kq}"
        heart: 0
        reply: "ร้องได้จ้ะ ครูให้ร้อง… ผู้ชายร้องไห้ไม่ผิด แพ้ผู้หญิงก็ไม่ผิด ครูสอนสองข้อนี้ในวันเดียว คุ้มกว่าวิชาไหนในเทอมนี้"
      - text: "{p}อยากไปเชียร์ด้วยจัง{k}"
        heart: 1
        reply: "ปีหน้ามานะจ๊ะ ครูขอแรงเป็นกรรมการชักเยอ… กรรมการปีนี้คือดาบเสถียร ดาบเป่านกหวีดช้าไปสามวิทุกรอบ ไม่มีใครรู้ว่าตั้งใจหรือหลับ"
