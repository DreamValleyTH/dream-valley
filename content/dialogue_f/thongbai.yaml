# ป้าทองใบ — บทคุยเฉพาะผู้เล่นหญิง
convos:
  - id: thongbai_f_r_matchmaker
    topic: react
    once: true
    when: { gender: f, flag: met_thongbai, day_min: 3 }
    npc: "หลาน! มานี่จ้ะ ป้ามีเรื่อง… ลูกชายคนขายหมูตลาดอำเภอยังโสดนะ ขยัน หมูไม่เคยขาดตาชั่ง ป้าไม่ได้จับคู่นะ ป้าแค่บอกข้อมูลเฉยๆ แหม อย่ามองป้าแบบนั้นสิ"
    options:
      - text: "{p}กลับมาทำนา ไม่ได้กลับมาหาแฟน{k}ป้า"
        heart: 2
        reply: "แหม! ปากเหมือนยายเพียรเปี๊ยบ… ห้าสิบปีก่อนป้าถามยายแบบเดียวกันเรื่องครูโรงเรียนอำเภอ ยายตอบคำนี้คำต่อคำ แล้วก็ไม่ได้แต่งกับครูจริงๆ ด้วย"
        next:
          - text: "แล้วยายได้แต่งกับใคร{kq}"
            heart: 2
            reply: "กับตาหลานไงจ้ะ คนที่ยายเลือกเอง ตอนนั้นทั้งตำบลว่าจน ยายบอกว่าจนก็จนสองคน ดีกว่ารวยคนเดียว… ป้าว่าที่ป้าจับคู่ไม่เคยติดสักคู่ เพราะคนบ้านนี้เลือกเองหมด"
          - text: "ป้าจับคู่มากี่คู่แล้ว{kq}"
            heart: 1
            reply: "สิบสี่คู่ ไม่ติดสักคู่จ้ะ… ติดคู่เดียวคือคนที่ป้าไม่ได้จับ แต่เขามาเจอกันในครัววัดตอนป้าใช้ให้ไปขูดมะพร้าว ป้าเลยนับว่าเป็นผลงานป้า"
      - text: "หมูไม่ขาดตาชั่ง แปลว่าคนไม่ขาดตาชั่งด้วยเหรอ{kq}"
        heart: 1
        reply: "จืด! คำถามนี้ป้าไม่ได้คิดไว้… เดี๋ยวป้าไปสืบก่อน ถ้าตาชั่งเขาเที่ยง ป้าจะกลับมาเสนอใหม่ ถ้าไม่เที่ยง ป้าจะไปบอกเจ๊หงษ์"
      - text: "ไม่สนใจ{k}"
        heart: -1
        reply: "จ้ะๆ ไม่สนใจก็ไม่สนใจ ป้าแค่ถาม… แม่หลานฝากป้าถาม ป้าจะบอกแม่หลานว่าหลานตอบห้วนเหมือนแม่หลานตอนสาวๆ"

  - id: thongbai_f_a_paste
    topic: advice
    when: { gender: f, heart_min: 2 }
    npc: "หลานรู้ไหม ยายเพียรเคยพูดว่าสูตรน้ำพริกแกงเขียวของยายจะบอกหลานคนเดียว ป้าถามว่าทำไม ยายบอกว่า ‘เพราะหลานผู้หญิงมันจะโดนถามก่อนว่าทำกับข้าวเป็นไหม มันเลยต้องเก่งกว่าคนถาม’"
    options:
      - text: "งั้นป้าบอกสูตรยายให้{p}หน่อย{k}"
        heart: 2
        reply: "ป้ารู้แค่ครึ่งเดียวจ้ะ… พริกเขียวโขลกกับรากผักชีก่อน ห้ามใส่ทีหลัง ยายบอกว่ารากผักชีต้องได้ยินเสียงสากก่อนใคร อีกครึ่งยายจดไว้ในสมุด หลานหาเจอเมื่อไหร่ป้าขอดูด้วยนะ"
        next:
          - text: "เจอแล้ว{p}จะมาแกงให้ป้าชิมก่อนใคร{k}"
            heart: 2
            reply: "แหม! ป้าจะชิมแล้วบ่นว่าจืดนะ อย่าเสียใจ ป้าบ่นทุกหม้อ ถ้าป้าไม่บ่นแปลว่าป้าไม่สบาย ให้พาไปหาหมอแอน"
          - text: "ถ้าแกงไม่อร่อยล่ะ{kq}"
            heart: 1
            reply: "ก็แกงใหม่จ้ะ ป้าแกงเขียวหวานครั้งแรกตอนสิบสอง เขียวแต่ไม่หวาน แม่ป้าเทให้หมากิน หมาไม่กิน ป้ายังแกงต่อมาห้าสิบปี"
      - text: "แล้วผู้ชายไม่ต้องทำกับข้าวเป็นเหรอ{kq}"
        heart: 1
        reply: "ต้องเป็นสิจ้ะ แต่ไม่มีใครถามเขา… ลุงจำรัสทอดไข่ไม่เป็นจนอายุหกสิบ ไม่มีใครว่า ป้าทอดไข่ไหม้ครั้งเดียวตอนแปดขวบ ทั้งตำบลยังเล่าอยู่เลย"
      - text: "{p}ซื้อน้ำพริกแกงสำเร็จที่ตลาดก็ได้{k}"
        heart: -1
        reply: "ได้จ้ะ ได้… ป้าไม่ว่า แค่ป้าจะร้องไห้ข้างในนิดนึง ยายเพียรบนฟ้าก็คงส่ายหน้าสามที แบบที่ยายส่ายใส่ป้าตอนใส่ผงชูรส"

  - id: thongbai_f_n_campaign_pot
    topic: news
    once: true
    when: { gender: f, flag: act1_done }
    npc: "หลานเห็นรูปในกลุ่ม LINE ยัง! คุณนายพเยาว์มาครัววัด ยืนคนหม้อแกงป้าห้านาทีให้ช่างภาพถ่าย แล้วโพสต์ว่า ‘ลงมือทำเพื่อชุมชน’ … ป้าลงมือตั้งแต่ตีสาม ไม่มีใครถ่าย"
    options:
      - text: "แกงหม้อนั้นอร่อยไหม{kq}"
        heart: 1
        reply: "จืด! คนห้านาทีแต่คนผิดทาง กะทิแตกหมด ป้าต้องแก้ทั้งหม้อ… แต่ป้าไม่โกรธคุณนายหรอก คุณนายยังรู้ว่าต้องมาครัว นายกฯ ไม่เคยรู้ว่าครัววัดอยู่ตรงไหน"
      - text: "ป้าน่าจะยืนถ่ายรูปคู่ด้วย{k}"
        heart: 2
        reply: "ป้ายืนแล้วจ้ะ! แต่ช่างภาพครอปป้าออก เหลือแค่ทัพพีป้าโผล่ข้างหม้อ… ป้าแชร์รูปนั้นในกลุ่มแล้วเขียนว่า ‘ทัพพีป้าเอง’ คนกดหัวเราะสามสิบคน"
      - text: "นักการเมืองก็งี้แหละ{k}"
        heart: 0
        reply: "งี้แหละจ้ะ… แต่อย่าพูดดังนะหลาน ป้ายังต้องยืมหม้อใหญ่ของบ้านคุณนายทุกงานบุญ หม้อไม่ผิด หม้อไม่ได้ลงสมัคร"

  - id: thongbai_f_s_knife
    topic: smalltalk
    when: { gender: f, time: noon }
    npc: "หลาน… จับมีดแบบนั้นเดี๋ยวนิ้วขาดจ้ะ! มานี่ ป้าจับให้ดู นิ้วโป้งกับนิ้วชี้หนีบสันมีด อีกมืองอนิ้วเหมือนตีนแมว ใครสอนหลานหั่นผักแบบนี้"
    options:
      - text: "ยูทูบสอน{k}"
        heart: 1
        reply: "แหม! ยูทูบไม่เคยโดนมีดบาด เลยสอนไม่ระวัง… ป้าสอนดีกว่า ป้าโดนบาดมาสามสิบแผล ทุกแผลมีบทเรียน แผลนี้หั่นตะไคร้ แผลนี้หั่นตอนนินทา"
      - text: "ป้าหั่นเร็วขนาดนี้ได้ยังไง{kq}"
        heart: 1
        reply: "หั่นงานบุญสี่สิบปีจ้ะ ตะไคร้วันละห้ากิโล… มือมันจำเอง ตาป้าไม่ได้ดูมีดแล้ว ตาป้าดูว่าใครเดินเข้าครัวมาชิมแกงแอบๆ"
        next:
          - text: "สอน{p}หั่นตะไคร้ซอยแบบป้าหน่อย{k}"
            heart: 2
            reply: "ได้จ้ะ ซอยบางๆ ให้เห็นแสงทะลุ… ช้าๆ ก่อน เร็วทีหลัง หลานซอยได้บางกว่าลูกสาวป้าตอนสิบห้าแล้วนะ อย่าบอกลูกป้าล่ะ"
          - text: "ป้าเห็นใครแอบชิมบ่อยที่สุด{kq}"
            heart: 1
            reply: "เณรต้นจ้ะ… แต่ป้าไม่ว่า เณรต้นชิมแล้วชมทุกครั้ง คนเดียวในวัดที่ชมแกงป้า ป้าเลยแกล้งทำเป็นไม่เห็น"

  - id: thongbai_f_f_mother
    topic: self
    when: { gender: f, heart_min: 4 }
    npc: "แม่ป้าเคยบอกว่า ‘ลูกผู้หญิงทำกับข้าวเป็น ไม่มีวันอดตาย แต่อาจเหนื่อยตาย’ ป้าจำแต่ครึ่งแรกมาทั้งชีวิตจ้ะหลาน… ครึ่งหลังเพิ่งเข้าใจตอนหกสิบ ตอนเข่าป้าลั่นทุกครั้งที่ลุกจากเตา"
    options:
      - text: "ป้าพักบ้างนะ{k} ให้{p}ช่วยยกหม้อ"
        heart: 2
        reply: "แหม… หลานพูดเหมือนลูกสาวป้าตอนโทรมา แต่ลูกป้าอยู่กรุงเทพฯ ยกหม้อทางโทรศัพท์ไม่ได้ หลานยกได้ ป้าจะเรียกใช้จริงๆ นะ อย่าเปลี่ยนใจ"
        next:
          - text: "ไม่เปลี่ยน{k} งานบุญหน้า{p}มาตั้งแต่ตีสาม"
            heart: 2
            reply: "ตีสามจริงนะ… ป้าจะทอดไข่เจียวไว้รอ ไข่เจียวสูตรแม่ป้า ใส่น้ำปลาก่อนตีไข่ ไม่ใช่หลัง ป้าไม่เคยบอกใคร บอกหลานแล้วนี่ไง"
          - text: "ตีห้าได้ไหม{kq} ตีสามมันยังเป็นกลางคืน"
            heart: 1
            reply: "ฮ่า! ตีห้าก็ได้จ้ะ ตีห้าผีกลับบ้านพอดี หลานเดินสวนกับมัน ป้าเดินสวนทุกวัน ป้ากับผีทักกันแล้ว"
      - text: "แล้วทำไมป้ายังทำครัววัดอยู่{kq}"
        heart: 1
        reply: "เพราะถ้าป้าไม่ทำ ไม่มีใครทำจ้ะ… ผู้ชายเขาว่าจะช่วย ช่วยยกโต๊ะเสร็จแล้วไปนั่งเต็นท์หน้า ป้าไม่ว่าหรอก แต่ป้านับ ป้าจดไว้ในสมุดด้วยว่ากี่โต๊ะ"

  - id: thongbai_f_o_three_teachers
    topic: others
    when: { gender: f, heart_min: 3 }
    npc: "หลาน ป้าได้ยินมาจ้ะ ยายจันทร์บอกว่าหลานมือเบา เหมาะทอผ้า ป้าพรบอกว่าหลานตาดี เหมาะเย็บผ้า… ป้าบอกว่าหลานลิ้นดี เหมาะแกง สามคนแก่แย่งหลานกันแล้วนะ เลือกมาเลยจ้ะ"
    options:
      - text: "{p}เรียนทั้งสามอย่างได้ไหม{kq}"
        heart: 2
        reply: "แหม! โลภเหมือนยายเพียร… ได้จ้ะ แต่วันพระต้องเป็นของป้า ยายจันทร์เอาวันอังคาร พรเอาวันที่ตาแก่ไปซื้อหวย ป้าว่าพรได้เปรียบ ตาแก่ไปทุกวัน"
      - text: "ป้าทองใบสิ{k} ของกินมาก่อน"
        heart: 2
        reply: "เห็นไหม! ป้าจะไปบอกสองคนนั้น… ไม่บอกดีกว่า เดี๋ยวพรประชดป้าว่าล่อเด็กด้วยแกง ป้าก็ล่อด้วยแกงจริงๆ นั่นแหละ"
      - text: "ทำไมไม่มีใครบอกว่า{p}เหมาะขับรถไถบ้าง{kq}"
        heart: 1
        reply: "จืด! คำถามนี้ป้าไม่ได้คิด… แต่จริงนะ ยายเพียรขับรถไถเดินตามได้ตั้งแต่สาว ป้าลืมไปเลย เดี๋ยวป้าไปบอกลุงสมหมายให้สอน แต่ระวังแกพาไปซื้อหวยระหว่างทาง"
