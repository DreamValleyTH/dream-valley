convos:
  - id: prasert_f_meeting_mic
    topic: react
    once: true
    when: { gender: f, flag: story_meeting1 }
    npc: "เมื่อวานประชุม หลานยกมือจะพูดใช่ไหม กำนันเห็นนะโว้ย กำนันหลับตาฟังแต่ตาข้างนึงยังเปิด… แล้วสมศักดิ์ส่งไมค์ข้ามหัวหลานไปให้ตาเผือก ตาเผือกพูดเรื่องควายยี่สิบนาที ไม่เกี่ยวงบสักคำ"
    options:
      - text: "ศาลานี้ผู้หญิงพูดได้ไหม{kq}กำนัน"
        heart: 1
        reply: "ได้สิโว้ย! ใครว่าไม่ได้… (นิ่งไปนาน) เออ ประชุมมายี่สิบปี คนที่ได้จับไมค์เป็นผู้หญิงมีสองคน ป้าแต๋วกับแม่แพรว แม่แพรวจับครั้งเดียว ด่ากำนันกลางศาลาเรื่องกินเหล้าก่อนประชุม"
        next:
          - text: "ครั้งหน้ากำนันส่งไมค์ให้{p}เองนะ{kq}"
            heart: 2
            reply: "ได้! กำนันจะลืมตาสองข้างแล้วส่งให้เอง สัญญาโว้ย ใครแย่งไมค์จากหลาน เจอเสียงกำนัน กำนันไม่ต้องใช้ไมค์"
          - text: "ทำไมแม่แพรวต้องด่ากลางศาลาด้วย{kq}"
            heart: 1
            reply: "เพราะที่บ้านกำนันไม่ฟังไง… เขารู้ว่ากลางศาลากำนันหนีไม่ได้ คนดูเป็นร้อย กำนันเลิกเหล้าไปสามเดือน แม่แพรวฉลาดกว่ากำนันทุกเรื่อง ยกเว้นเรื่องไก่"
      - text: "{p}ยกมือจนเมื่อยแขน{k} นึกว่าโหวตไปแล้ว"
        heart: 1
        reply: "ฮ่าๆ ยายเพียรเคยยกมือค้างทั้งประชุมเหมือนกัน คนนึกว่ายายโหวตทุกข้อ… ยายเลยลุกขึ้นพูดเองไม่รอไมค์ เสียงดังกว่ากำนันอีก หลานลองดูสิ"
      - text: "ไม่เป็นไร{k} {p}ไม่ได้อยากพูดมาก"
        heart: 0
        reply: "อย่าไม่อยากโว้ย คนที่ไม่อยากพูดคือคนที่ควรพูด คนอยากพูดในตำบลนี้มีเยอะเกินแล้ว กำนันก็หนึ่งในนั้น"

  - id: prasert_f_braids
    topic: self
    when: { gender: f, heart_min: 3 }
    npc: "ตอนแม่แพรวเสีย ใครๆ ก็บอกให้กำนันส่งแพรวไปอยู่กับยาย บอกว่าผู้ชายเลี้ยงลูกสาวไม่เป็น… กำนันไม่ส่ง กำนันถักเปียไม่เป็น เปียแพรวเบี้ยวไปจนจบ ม.ต้น เลยโว้ย"
    options:
      - text: "แต่แพรวก็โตมาเก่งนะ{kq}"
        heart: 2
        reply: "เก่งเกิน… เก่งจนเถียงกำนันชนะทุกเรื่อง กำนันอยากได้ลูกที่เถียงเก่ง ได้มาแล้วก็ไม่รู้จะดีใจหรือร้องไห้"
        next:
          - text: "ดีใจไปเลย{k}กำนัน"
            heart: 1
            reply: "เออ ดีใจก็ได้… แต่อย่าไปบอกแพรวนะว่ากำนันพูด เดี๋ยวมันได้ใจ เถียงยาวกว่าเดิมอีกสองชั่วโมง"
          - text: "แล้วใครสอนแพรวเรื่องผู้หญิงๆ{kq}"
            heart: 1
            reply: "ป้าแต๋ว ป้าพร แล้วก็ยายเพียร สามคนผลัดกันมาที่บ้าน… ยายเพียรสอนแพรวขี่มอเตอร์ไซค์ ป้าแต๋วสอนแต่งหน้า ป้าพรสอนด่า กำนันจ่ายค่าขนมอย่างเดียว"
      - text: "เปียเบี้ยวแค่ไหน{kq}"
        heart: 1
        reply: "ข้างซ้ายสั้นกว่าข้างขวาคืบนึง ครูที่โรงเรียนนึกว่าเป็นทรงใหม่ กำนันไม่แก้ข่าว… ตอนนี้แพรวมีรูปนั้นในโทรศัพท์ เอามาขู่กำนันทุกครั้งที่ทะเลาะกัน"
      - text: "คนสมัยนั้นคิดแบบนั้นกันหมดเหรอ{kq}"
        heart: 0
        reply: "หมดทั้งตำบลโว้ย… ยกเว้นยายเพียร ยายเพียรบอกกำนันว่า ‘ผัวเลี้ยงลูกไม่เป็น ก็หัดเอา เมียก็ไม่ได้เกิดมาเป็นเหมือนกัน’ กำนันจำมาจนทุกวันนี้"

  - id: prasert_f_plough
    topic: advice
    when: { gender: f }
    npc: "หลานจะไถแปลงเองเหรอ รถไถเดินตามมันกระชากนะโว้ย ผู้ชายตัวใหญ่ยังไหล่หลุดมาแล้ว เดี๋ยวกำนันส่งลูกน้องไปไถให้ คิดราคาเพื่อนบ้าน"
    options:
      - text: "ยายสอน{p}ขับตั้งแต่สิบขวบแล้ว{k}"
        heart: 1
        reply: "ยายเพียร… เออ ใช่ ยายเพียรไถนาเองจนอายุเจ็ดสิบ ลูกน้องกำนันยังขับตรงไม่เท่ายาย กำนันลืมไปโว้ย ผู้หญิงบ้านนั้นไม่เคยรอใครมาไถให้"
      - text: "ลูกน้องกำนันคิดไร่ละเท่าไหร่{kq}"
        heart: 0
        reply: "ไร่ละห้าร้อย ราคาเพื่อนบ้าน… ราคาคนอื่นไร่ละห้าร้อยเหมือนกัน แต่ราคาเพื่อนบ้านได้น้ำแดงเพิ่มขวดนึง"
      - text: "ไม่ต้อง{k} {p}ทำเอง"
        heart: 0
        reply: "เออ ดื้อเหมือนยาย… ทำเองก็ทำ แต่ใส่รองเท้าบูทนะโว้ย ตีนคนไม่ได้ทำจากเหล็ก ทั้งผู้หญิงผู้ชาย"

  - id: prasert_f_payao_poster
    topic: news
    when: { gender: f, flag: story_posters }
    npc: "เห็นป้ายคุณนายพเยาว์ไหม ‘สานต่องานที่ยังไม่เสร็จ’ ก็วิชัยไม่เคยทำอะไรเสร็จสักงานนี่โว้ย เมียเลยต้องมาสานต่อ… วงเหล้าหน้าบ้านกำนันพูดกันว่าผู้หญิงเป็นนายกฯ ไม่ได้หรอก"
    options:
      - text: "แล้วกำนันว่ายังไง{kq}"
        heart: 1
        reply: "กำนันถามวงเหล้าว่า แล้วสิบปีที่ผ่านมาใครเขียนสุนทรพจน์ให้วิชัย ใครจำชื่อลูกบ้านได้ทุกคน ใครโทรตามผู้รับเหมา… วงเหล้าเงียบ แล้วเปลี่ยนเรื่องไปคุยเรื่องไก่"
      - text: "ผู้หญิงเป็นนายกฯ ได้สิ{k} ทำไมจะไม่ได้"
        heart: 1
        reply: "ได้โว้ย กำนันไม่ได้เถียง กำนันแค่สงสัยว่าทำไมป้ายไม่เขียนชื่อเขาตัวใหญ่ๆ เขียนคำว่า ‘ภรรยานายกฯ’ ใหญ่กว่าชื่อตัวเองอีก"
      - text: "{p}ไม่สนเรื่องเลือกตั้ง{k}"
        heart: -1
        reply: "ไม่สนได้ไง หลานมีที่ดินตรงกลางตำบล ทุกคนสนหลานหมดแล้ว… ไม่สนการเมือง เดี๋ยวการเมืองมาสนหลานเองโว้ย"

  - id: prasert_f_hens
    topic: smalltalk
    when: { gender: f }
    npc: "ปีนี้ไก่ตัวเมียของกำนันได้รางวัลไก่สวยงามนะโว้ย ส่วนเจ้าประดู่ตัวผู้แพ้… มันเดินวนรอบเล้าทั้งวัน ทำหน้าเหมือนนักการเมืองแพ้เลือกตั้ง"
    options:
      - text: "ตัวเมียก็สวยได้นะ{kq}"
        heart: 1
        reply: "สวยกว่าด้วยโว้ย! คนชอบซื้อแต่ตัวผู้เพราะหงอนใหญ่ ร้องดัง… แต่ตัวเมียคือตัวที่ทำให้มีไก่ทั้งเล้า ไม่มีตัวเมีย เจ้าประดู่ก็เป็นแค่ไก่ร้องเปล่า"
      - text: "เจ้าประดู่น่าสงสารจัง{k}"
        heart: 0
        reply: "อย่าไปสงสารมัน เมื่อเช้ามันตีกระจกรถกำนันอีกแล้ว แพ้แล้วยังไม่ยอมรับ ไก่ตัวผู้ก็งี้ คนก็งี้ เออ"
      - text: "ไก่ก็คือไก่{k}"
        heart: -1
        reply: "ไก่ก็คือไก่… หลานพูดแบบนี้ต่อหน้าเจ้าประดู่ไม่ได้นะโว้ย มันจะเสียใจ กำนันก็เสียใจด้วย"

  - id: prasert_f_praew_bf
    topic: others
    when: { gender: f, heart_min: 2, flag: met_praew }
    npc: "หลาน… หลานเป็นผู้หญิงเหมือนกัน กำนันถามได้ไหม แพรวมันมีแฟนหรือยัง มันไม่บอกพ่อ กำนันถามทีไรมันเปิดไลฟ์หนีทุกที"
    options:
      - text: "ถามแพรวเองดีกว่า{k}กำนัน"
        heart: 0
        reply: "ถามแล้วโว้ย! มันตอบว่า ‘พ่อสนใจเรื่องไก่ไปเถอะค่ะ’ แล้วกำนันก็สนใจไก่ไปตามที่ลูกสั่ง… เออ ช่างเถอะ"
      - text: "{p}ไม่ขายความลับเพื่อน{k}"
        heart: 1
        reply: "ดีโว้ย! ซื่อสัตย์เหมือนไก่ชนตัวดี กำนันนับถือ… แต่ถ้ามันจะมีใคร บอกกำนันอย่างเดียวว่าคนนั้นอ่านหนังสือก่อนเซ็นไหม"
        next:
          - text: "ทำไมต้องอ่านหนังสือก่อนเซ็น{kq}"
            heart: 1
            reply: "เพราะแฟนเก่ามันที่กรุงเทพฯ มาหาแพรวเพราะอยากให้กำนันเซ็นเรื่องเส้นสาย… คนแบบนั้นเซ็นทุกอย่างไม่อ่าน ขอแค่ได้ กำนันไม่อยากให้ลูกเจออีก"
          - text: "กำนันห่วงแพรวมากเลยนะ{kq}"
            heart: 2
            reply: "ห่วงจนนอนไม่หลับโว้ย… แต่ห้ามบอกแพรว เดี๋ยวมันไลฟ์ว่า ‘พ่อแพรวนอนไม่หลับเพราะแพรว’ ยอดวิวขึ้น แต่หน้ากำนันไม่เหลือ"
      - text: "มี{k} ชื่อยอดวิว คบกันทุกคืนเลย"
        heart: 1
        reply: "ฮ่าๆๆ เออ จริงของหลาน มันคุยกับโทรศัพท์มากกว่าคุยกับพ่อ… ถ้ายอดวิวมาขอแพรว กำนันจะขอสินสอดเป็นไลก์ล้านไลก์"
