# ลุงพรานแดง — บทคุยเฉพาะผู้เล่นหญิง
convos:
  - id: daeng_f_r_backdoor
    topic: react
    once: true
    when: { gender: f, flag: met_daeng, day_min: 2 }
    npc: "หลาน… อยู่บ้านยายคนเดียวใช่ไหม ลุงไม่ว่าอะไรนะ ยายหลานก็อยู่คนเดียวมาสามสิบปี ลุงจะบอกอย่างเดียว กลอนประตูหลังมันหลวม ลุงรู้เพราะลุงซ่อมให้ยายสามรอบแล้ว"
    options:
      - text: "{p}ไม่กลัวหรอก{k}ลุง"
        heart: 1
        reply: "ไม่กลัวดี… แต่ไม่กลัวกับไม่ระวังมันคนละเรื่องนะหลาน เสือมันไม่กลัวอะไร มันก็ยังเดินเลี่ยงที่โล่ง"
        next:
          - text: "งั้นลุงสอน{p}ซ่อมกลอนเองเลย{k}"
            heart: 2
            reply: "เอาไขควงมา ลุงทำให้ดูทีเดียวนะเว้ย… ทำเองเป็นแล้วไม่ต้องรอใคร ยายหลานก็ซ่อมเอง ลุงแค่ถือไฟฉาย"
          - text: "ยายเรียกลุงไปซ่อมบ่อยเหรอ{kq}"
            heart: 1
            reply: "บ่อย… ยายเรียกลุงไป แล้วยืนชี้ว่าลุงทำผิด ลุงทำใหม่ ยายชี้อีก สุดท้ายยายแย่งไขควงไปทำเอง ลุงกลับบ้านไปกินข้าว"
      - text: "ใครจะมาปล้นบ้าน{p}ล่ะ{kq} มีแต่จอบ"
        heart: 0
        reply: "คนไม่ได้มาเอาจอบหรอกหลาน… หมาจิ้งจอกมาเอาไก่ คนบริษัทมาเดินดูที่ เมื่อวานลุงเห็นรอยบูทใหม่ๆ หลังรั้วยาย เดินวนสามรอบ"
      - text: "ลุงก็อยู่คนเดียวไม่ใช่เหรอ{kq}"
        heart: 1
        reply: "ลุงอยู่กับป่า ป่ามันพูดทั้งคืน… เออ หลานพูดถูก ลุงไม่ควรสอนเรื่องที่ลุงเองก็ไม่ทำ แต่ลุงล็อกประตูหลังนะเว้ย อันนี้ทำ"

  - id: daeng_f_a_trap
    topic: advice
    when: { gender: f, heart_min: 1, time: morning }
    npc: "จะมาเรียนวางไซจริงเหรอหลาน… สมัยลุงเด็ก แม่ลุงห้ามผู้หญิงมาท่าน้ำตอนพรานวางไซ บอกว่าผู้หญิงวางไซแล้วปลาไม่เข้า"
    options:
      - text: "แล้วปลาไม่เข้าจริงไหม{kq}"
        heart: 2
        reply: "…ยายหลานวางไซได้ปลามากกว่าลุงทุกปี ลุงเลิกเชื่อเรื่องนี้ตั้งแต่อายุสิบห้า มาวะ ตรงนี้ ปากไซหันทวนน้ำ อย่าหันตามน้ำ ปลามันว่ายสวนขึ้นมา"
      - text: "ปลามันรู้เหรอ{kq}ว่าใครวาง"
        heart: 1
        reply: "ปลามันรู้แต่ว่าเหยื่ออร่อยไหม… คนต่างหากที่อยากรู้ว่าใครวาง จะได้มีเรื่องคุยกันที่ร้านป้าแต๋ว"
      - text: "งั้น{p}ไม่เรียนก็ได้{k}"
        heart: -1
        reply: "อย่าเชื่อลุงง่ายนักสิหลาน ลุงพูดเรื่องเก่า เรื่องเก่ามันผิดเยอะ… เปลี่ยนใจเมื่อไหร่มาท่าน้ำตีห้า ลุงเผื่อไซไว้ลูกนึง"

  - id: daeng_f_n_fox
    topic: news
    once: true
    when: { gender: f, flag: story_thana_visit }
    npc: "เมื่อวานคนบริษัทสองคนมาเดินชายป่า ถือแผนที่ ถามลุงว่าแปลงยายเพียรตอนนี้ใครดูแล ลุงบอกหลานสาวยาย… มันยิ้มให้กัน ยิ้มแบบหมาจิ้งจอกเห็นเล้าไก่ไม่มีหมาเฝ้า"
    options:
      - text: "เขาคิดว่าผู้หญิงคนเดียวกดราคาง่ายสินะ{kq}"
        heart: 1
        reply: "คนที่คิดว่าเหยื่อง่าย มันเดินเสียงดัง ลุงชอบพวกนี้ ตามรอยง่าย… หลานไม่ต้องทำอะไร แค่ทำให้มันงงว่าทำไมไม่ง่าย"
        next:
          - text: "งั้น{p}จะยิ้มกลับให้งงกว่าเดิม{k}"
            heart: 2
            reply: "เออ ยิ้มแบบยายหลาน ยิ้มแล้วไม่พูดอะไร คนบริษัทกลัวยิ้มแบบนั้นที่สุด ลุงเห็นมันถอยกลับรถมาแล้วสามคัน"
          - text: "ลุงช่วยไล่เขาให้หน่อยได้ไหม{kq}"
            heart: 0
            reply: "ลุงไล่ได้ แต่ลุงไล่แล้วมันก็คิดว่าหลานต้องมีคนไล่ให้… ไล่เองดีกว่าหลาน ลุงจะยืนอยู่ข้างหลังเฉยๆ ลุงยืนนิ่งเก่ง"
      - text: "แล้วลุงบอกอะไรเขาอีก{kq}"
        heart: 1
        reply: "ลุงบอกว่าที่แปลงนั้นมีงูเห่าสองตัว ผีพรายหนึ่งตัว หลานสาวยายหนึ่งคน ตัวที่ดุที่สุดคือตัวสุดท้าย… มันจดลงสมุดด้วยนะเว้ย"

  - id: daeng_f_s_wood
    topic: smalltalk
    when: { gender: f, has_item: wood }
    npc: "เมื่อเช้าลุงเห็นไอ้หนุ่มสองคนวิ่งมาจะช่วยหลานแบกฟืน หลานส่ายหน้า แล้วแบกผ่านหน้ามันไปเฉยๆ… ลุงหัวเราะจนไซหล่นน้ำ"
    options:
      - text: "ก็{p}แบกไหวนี่{k}"
        heart: 1
        reply: "ไหวก็แบก ไม่ไหวก็ให้ช่วย พรานก็งี้ ไม่มีใครแบกเก้งคนเดียวตลอดชีวิต… แต่ไอ้สองคนนั้นมันอยากช่วยเพราะอยากคุย ไม่ใช่เพราะหลานไม่ไหว ลุงดูออก"
      - text: "ไม้ฟืนนี่ให้ลุงไปหุงข้าวสักมัด{k}"
        heart: 2
        take: { wood: 1 }
        reply: "ฟืนแห้งดี ตัดตรงข้อ… ใครสอนหลานเลือกไม้ ยายสอนใช่ไหม ยายหลานเลือกฟืนเก่งกว่าลุง ลุงเลือกไม้เก่งแต่ตอนมันยังเป็นต้นไม้"
      - text: "ไซหล่นน้ำแล้วได้คืนไหม{kq}"
        heart: 1
        reply: "ได้คืน… มีปลาซิวติดมาสองตัว ลุงว่าปลามันก็หัวเราะเหมือนกัน"

  - id: daeng_f_f_mother
    topic: self
    when: { gender: f, heart_min: 4 }
    npc: "หลานรู้ไหม ใครสอนลุงอ่านรอย… ไม่ใช่พ่อ พ่อลุงสอนแค่ยิง คนที่สอนลุงดูรอยเท้า ดูขี้สัตว์ ดูกิ่งหัก คือแม่ แม่ลุงหาของป่าตั้งแต่ตีสี่ อ่านป่าออกทั้งเล่ม"
    options:
      - text: "แล้วทำไมคนเรียกลุงว่าพราน แต่ไม่มีใครพูดถึงแม่ลุง{kq}"
        heart: 2
        reply: "…เพราะลุงถือปืน คนจำคนถือปืน ไม่จำคนถือตะกร้า แม่ลุงไม่เคยว่าอะไร แม่บอกว่าป่ามันจำได้ก็พอ ลุงว่าป่ามันจำได้จริงๆ เห็ดขึ้นตรงที่แม่เดินทุกปี"
        next:
          - text: "{p}อยากให้ลุงเล่าเรื่องแม่ลุงให้ฟังอีก{k}"
            heart: 2
            reply: "ไว้วันฝนตก… ลุงจะพาไปดูต้นมะขามป้อมที่แม่ปลูกไว้ชายป่า แม่ปลูกให้ลิงกิน บอกว่าลิงอิ่มแล้วจะไม่ลงมากินข้าวโพดคน ฉลาดกว่าพรานทั้งตำบล"
          - text: "ป่าจำได้ ลุงก็จำได้นี่{k}"
            heart: 1
            reply: "จำ… แต่ลุงไม่เคยเล่าให้ใครฟัง หลานเป็นคนแรก อย่าไปเล่าป้าทองใบนะเว้ย เดี๋ยวเขาจะว่าแม่ลุงหาเห็ดเก่งกว่า เขาจะทำใจไม่ได้"
      - text: "แม่ลุงคงเก่งมาก{k}"
        heart: 1
        reply: "เก่ง… เก่งจนลุงอายบอกเพื่อน สมัยนั้นเด็กผู้ชายถูกแม่สอนมันน่าอาย ตอนนี้ลุงหกสิบกว่า อายที่ตัวเองเคยอาย"

  - id: daeng_f_o_thongbai
    topic: others
    when: { gender: f, heart_min: 2 }
    npc: "คนในตำบลถามหลานใช่ไหมว่าอยู่คนเดียวไม่กลัวเหรอ… ป้าทองใบเข้าป่าคนเดียวตีห้ามาสี่สิบปี ไม่มีใครถามป้าว่ากลัวไหม ถามแต่ว่า ‘วันนี้ได้เห็ดไหม’"
    options:
      - text: "งั้นรอบหน้ามีคนถาม{p}จะตอบว่าได้เห็ดสองกำ{k}"
        heart: 2
        reply: "ฮึ… ตอบงั้นแหละหลาน เขาจะงงแล้วเลิกถาม ป้าทองใบตอบแบบนี้มาสี่สิบปี ทุกคนเลิกถามหมดแล้ว เหลือแต่ลุงที่ถาม เพราะลุงอยากได้เห็ด"
      - text: "ป้าทองใบไม่กลัวจริงเหรอ{kq}"
        heart: 1
        reply: "กลัว… ป้าเคยเจอหมีควายตอนสาวๆ ป้าวิ่งเร็วกว่าลุงตอนวิ่งหนีเสือ ลุงเห็นเอง แต่ป้าก็เข้าป่าวันรุ่งขึ้น คนกลัวแล้วยังไปนั่นแหละที่ลุงนับถือ"
      - text: "ก็เขาห่วง ไม่ได้ว่าอะไรหรอก{k}"
        heart: 0
        reply: "ห่วงก็ห่วง ลุงไม่ว่า… แต่ห่วงแล้วมาช่วยขุดร่องน้ำมันดีกว่าห่วงแล้วยืนถาม นี่ลุงพูดถึงตัวเองด้วยนะเว้ย"
