# คุณธนา — บทคุยเฉพาะผู้เล่นหญิง
convos:
  - id: thana_f_r_flowers
    topic: react
    once: true
    when: { gender: f, flag: story_thana_visit }
    npc: "คุณ{player}ครับ ผมเอาดอกไม้มา… ไม่ใช่ครับ ไม่ใช่ความหมายนั้น เป็นดอกไม้แสดง ‘ความใส่ใจต่อ stakeholder เพศหญิง’ ตามคู่มือ engagement ของฝ่ายผม มีสไลด์ทั้งหน้าเลยครับ หน้าที่สิบเจ็ด"
    options:
      - text: "สไลด์หน้าสิบแปดเขียนว่าถ้า{p}ไม่รับ ให้ทำยังไงต่อ{kq}"
        heart: 2
        reply: "…หน้าสิบแปดเขียนว่า ‘ให้เสนอพาไปทานอาหารเพื่อสร้าง rapport’ ครับ ผมไม่ทำนะครับ ผมอ่านแล้วอายแทนคนเขียน คนเขียนเป็นผู้ชายสามคนในห้องประชุมชั้นยี่สิบ"
        next:
          - text: "คู่มือสำหรับเจ้าของที่ผู้ชายมีดอกไม้ด้วยไหม{kq}"
            heart: 2
            reply: "ไม่มีครับ… ผู้ชายได้เหล้าขาวกับนามบัตร ผู้หญิงได้ดอกไม้กับ ‘การรับฟังอย่างอ่อนโยน’ ราคาที่ดินเท่ากันครับ ผมเช็กแล้ว คู่มือนี้ทำให้ทุกคนดูแย่เท่าๆ กัน ยกเว้นราคา"
          - text: "งั้นเอาดอกไม้ไปวางศาลปู่ตาแทน{k}"
            heart: 1
            reply: "เป็นการใช้ทรัพยากรที่… ดีที่สุดในไตรมาสนี้ครับ ผมจะเขียนรายงานว่า ‘ดอกไม้ถูก reallocate ไปยังผู้มีส่วนได้เสียที่อาวุโสกว่า’ ปู่ตาน่าจะเป็น stakeholder ที่ใหญ่ที่สุดในตำบล"
      - text: "รับไว้{k} แต่ไม่ขายที่นะ"
        heart: 1
        reply: "ขอบคุณครับ ผมจะบันทึกว่า ‘รับของ ไม่รับข้อเสนอ’ … ยายเพียรไม่เคยรับอะไรจากผมเลยครับ แม้แต่น้ำเปล่า คุณ{player}ก้าวหน้ากว่ายายหนึ่งขั้น"
      - text: "คุณธนาเชื่อคู่มือนี้จริงเหรอ{kq}"
        heart: 1
        reply: "ไม่ครับ… แต่ผมต้องทำ KPI ‘จำนวนการติดต่อเชิงบวก’ ดอกไม้นับเป็นหนึ่ง โดนด่านับเป็นศูนย์ คุณ{player}ไม่ด่า ผมได้หนึ่งแต้มครับ ขอบคุณ"

  - id: thana_f_n_pretty_pr
    topic: news
    when: { gender: f, flag: story_meeting1 }
    npc: "สำนักงานใหญ่จะส่งน้องประชาสัมพันธ์มาประจำตำบลครับ อีเมลเขียนว่าต้องการ ‘ใบหน้าที่เป็นมิตรกับชุมชน’ … ผมตอบไปว่าผมก็ยิ้มทุกวัน เขาบอกว่าผมเป็นมิตรแบบมีสัญญาแนบ"
    options:
      - text: "ส่งผู้หญิงสวยๆ มาให้ชาวบ้านเกรงใจ ใช่ไหม{kq}"
        heart: 1
        reply: "…คุณ{player}พูดสิ่งที่อีเมลไม่กล้าเขียนครับ ผมจะตอบตรงๆ ใช่ครับ เขาเลือกจากรูปในใบสมัคร ผมเห็นแฟ้ม ผมปิดแฟ้มแล้วไปล้างมือ ไม่รู้ทำไม"
      - text: "น้องเขาจะโดนป้าแต๋วกับป้าพรรุมนะ{k}"
        heart: 1
        reply: "ผมเตือนแล้วครับ ผมเขียนคู่มือให้น้องเองสามหน้า หน้าแรก ‘อย่าใส่ส้นสูง’ หน้าสอง ‘ถ้าป้าพรถามว่ายิ้มแทนใคร ให้ตอบว่าไม่รู้ เพราะไม่รู้จริง’ หน้าสามว่าง ผมไม่รู้จะเขียนอะไร"
      - text: "ทำไมไม่ให้คุณธนามาพูดความจริงเองล่ะ{kq}"
        heart: 2
        reply: "เพราะความจริงไม่ได้อยู่ในงบประชาสัมพันธ์ครับ… ถ้าผมพูดเอง ผมต้องพูดคำว่า ‘น้ำ’ และ ‘บาดาล’ ในประโยคเดียวกัน คู่มือห้ามครับ"

  - id: thana_f_a_support
    topic: advice
    when: { gender: f, flag: met_thana, day_min: 6 }
    npc: "คุณ{player}ครับ ผมแนะนำในฐานะคนที่เป็นห่วงนะครับ ที่ดินทั้งแปลง ผู้หญิงตัวคนเดียว ภาระเยอะมาก บริษัทมีโครงการ ‘Women Landowner Empowerment’ เราช่วย ‘ปลดภาระ’ ในราคาที่ยุติธรรม"
    options:
      - text: "ปลดภาระ แปลว่าซื้อที่ใช่ไหม{kq}"
        heart: 1
        reply: "…ครับ แปลว่าซื้อที่ ผมพูดคำว่า empowerment แล้วตัวเองยังสะดุ้ง ชื่อโครงการตั้งตอนอบรมวันสตรีสากล ทุกคนปรบมือ ไม่มีใครถามว่า empower ใครเป็นอะไร"
        next:
          - text: "empower ให้{p}กลายเป็นคนไม่มีที่ไง{k}"
            heart: 2
            reply: "ครับ… ผมจะเอาประโยคนี้ไปพูดในที่ประชุม ไม่ได้ครับ ผมจะโดนย้าย ผมจดไว้ในโฟลเดอร์ฉบับร่างแทนครับ โฟลเดอร์นั้นมีแต่ประโยคของคนในตำบลนี้"
          - text: "ยายเพียรก็ผู้หญิงตัวคนเดียว ไม่เห็นปลดภาระ{k}"
            heart: 2
            reply: "ยายแบกได้สามสิบปีครับ ผมรู้ ผมอ่านแฟ้มยาย… แฟ้มยายเขียนว่า ‘ดื้อ’ ห้าที่ ผมว่าคำที่ถูกคือ ‘แบกเก่ง’ แต่ไม่มีช่องให้เขียนแบบนั้น"
      - text: "ถ้า{p}เป็นผู้ชาย คุณจะพูดแบบนี้ไหม{kq}"
        heart: 2
        reply: "…ไม่ครับ ถ้าเป็นผู้ชาย ผมจะพูดว่า ‘ลงทุนต่อยอด’ แทน ‘ปลดภาระ’ ราคาเท่ากัน คำต่างกัน คุณ{player}จับได้เร็วกว่าที่ปรึกษาของบริษัทอีกครับ"
      - text: "ขอบคุณที่ห่วง แต่ไม่ต้อง{k}"
        heart: 0
        reply: "รับทราบครับ ผมจะบันทึกว่า ‘เจ้าของที่ปฏิเสธอย่างสุภาพ’ … สุภาพกว่ายายครับ ยายถือจอบ"

  - id: thana_f_s_slow
    topic: smalltalk
    when: { gender: f, heart_min: 3 }
    npc: "คุณ{player}ครับ ผมมีเรื่องแปลกจะสารภาพ… คุณเมย์บอกผมว่า ‘คุณพูดช้าลงเวลาคุยกับผู้หญิง’ ผมไม่เชื่อ เลยเปิดคลิปประชุมดู ผมพูดช้าลงจริงครับ ช้าลงยี่สิบเปอร์เซ็นต์ ผมจับเวลา"
    options:
      - text: "เหมือนคิดว่าผู้หญิงฟังไม่ทันเหรอ{kq}"
        heart: 1
        reply: "…ผมคิดว่ามันคือความสุภาพครับ จนดูคลิปตัวเอง มันดูเหมือนผมกำลังอธิบายให้เด็ก ป.4 ฟัง ซึ่งไม่แฟร์กับเด็ก ป.4 ด้วย น้องมิวเข้าใจสัญญาเร็วกว่าเสี่ยเฮง"
      - text: "ตอนนี้คุณก็พูดเร็วปกตินะ{k}"
        heart: 2
        reply: "จริงเหรอครับ… เพราะผมตั้งใจครับ ผมนับในใจ แต่การนับในใจทำให้ผมลืมว่าจะพูดอะไรครับ ผมเลยพูดความจริงไปหลายประโยค ผลข้างเคียงที่ไม่ได้วางแผน"
      - text: "พูดช้าก็ดี{k} {p}จะได้จับโกหกง่ายขึ้น"
        heart: 1
        reply: "ฮ่า… คุณ{player}ครับ ประโยคนี้ทำให้ผมพูดเร็วขึ้นทันทีครับ ผมไม่แน่ใจว่าดีหรือแย่"

  - id: thana_f_f_mother_no
    topic: self
    when: { gender: f, heart_min: 5 }
    npc: "คุณ{player}ครับ แม่ผมโทรมาเมื่อคืน… ถามว่า ‘ที่ดินแปลงที่ลูกอยากได้ เจ้าของเป็นใคร’ ผมบอกว่าเป็นผู้หญิงอายุยี่สิบกว่า กลับมาดูแลที่ยาย แม่เงียบไปนาน แล้วบอกว่า ‘อย่ารังแกเขานะลูก’"
    options:
      - text: "แม่คุณคงรู้สึกเหมือนตอนตัวเองขายนา{k}"
        heart: 2
        reply: "…ครับ ตอนแม่ขายนา คนบริษัทก็มาบ้านเราตอนพ่อไม่อยู่ครับ มาคุยกับแม่คนเดียว พูดช้าๆ ใจดีๆ เอาขนมมาให้ผม… ผมเพิ่งนึกออกเมื่อคืนว่าผมกำลังเป็นคนนั้น"
        next:
          - text: "คุณยังเลือกไม่เป็นคนนั้นได้นะ{k}"
            heart: 2
            reply: "ผมพยายามครับ… สำนักงานใหญ่ไม่มีช่องให้เลือกครับ แต่ผมเริ่มเว้นช่องเองในรายงาน ช่องที่ผมไม่กรอก คุณ{player}อาจเห็นเร็วๆ นี้"
          - text: "แล้วคุณตอบแม่ว่าไง{kq}"
            heart: 1
            reply: "ผมบอกว่า ‘ไม่รังแกครับ แม่’ แม่ถามว่า ‘แล้วทำอะไร’ ผมตอบไม่ได้ครับ ผมนั่งในรถหน้าตู้คอนเทนเนอร์จนตีสอง ดาบเสถียรเคาะกระจกถามว่าเป็นผีหรือเปล่า"
      - text: "คุณจะฟังแม่ไหม{kq}"
        heart: 1
        reply: "ผมฟังแม่ทุกครั้งครับ แค่ทำตามไม่ทุกครั้ง… เหมือนนโยบายบริษัท ‘รับฟังชุมชน’ ผมเรียนมาจากที่บ้าน"

  - id: thana_f_o_may_both
    topic: others
    when: { gender: f, heart_min: 2 }
    npc: "คุณเมย์บอกผมว่า ‘อย่าใช้วิธีเดียวกันกับเราสองคน’ ผมถามว่าวิธีอะไรครับ เขาบอก ‘วิธีที่คุณคิดว่าผู้หญิงสองคนจะทะเลาะกันเองถ้าให้ข้อมูลไม่เท่ากัน’ … ผมไม่ได้คิดแบบนั้นครับ ฝ่ายกฎหมายคิด"
    options:
      - text: "แต่คุณก็ทำตามฝ่ายกฎหมาย{k}"
        heart: 1
        reply: "ครับ… ผมส่งข้อมูลให้คุณ{player}สามหน้า ให้คุณเมย์หน้าเดียว แล้วคุณสองคนนั่งร้านกาแฟเอามาต่อกันได้สี่หน้า ฝ่ายกฎหมายไม่ได้คำนวณเรื่องร้านกาแฟครับ"
      - text: "{p}กับพี่เมย์ไม่ทะเลาะกันหรอก{k}"
        heart: 2
        reply: "ผมทราบครับ ผมเห็นคุณสองคนแบ่งข้าวเวฟกันกล่องเดียว… ผมรายงานไปว่า ‘กลยุทธ์ไม่ได้ผล’ เป็นรายงานฉบับเดียวในปีนี้ที่ผมเขียนแล้วยิ้ม"
      - text: "ฝ่ายกฎหมายคิดอะไรอีก{kq}"
        heart: 1
        reply: "คิดว่าผู้หญิงในตำบลจะเชื่อผู้ชายที่ใส่สูทมากกว่าผู้หญิงที่ถือมือถืออัดเสียงครับ… ฝ่ายกฎหมายไม่เคยมาร้านป้าแต๋ว"
