# ลุงเชิด — บทคุยเฉพาะผู้เล่นหญิง (gender: f) · ใจดี ขี้เล่นเบาๆ ตรงเวลา ข่าวจากคนบนรถ
convos:
  - id: cherd_f_r_bet
    topic: react
    once: true
    when: { gender: f, flag: story_arrived, day_min: 2 }
    npc: "หลาน เมื่อเช้าป้าสองคนบนรถลุงคุยเรื่องหลานตั้งแต่ป้ายแรกถึงอำเภอ คนนึงว่า ‘สาวกรุงเทพฯ มาอยู่คนเดียว เดี๋ยวก็กลับ’ อีกคนว่า ‘เดี๋ยวก็ได้ผัวที่นี่’ พนันกันนะหลาน ข้าวเหนียวหมูทอดห่อนึง"
    options:
      - text: "ลุงช่วยบอกเขาทีว่า{p}ไม่กลับ แล้วก็ไม่หา{k}"
        heart: 2
        reply: "ลุงบอกแล้วจ้ะ ทั้งคู่เลยแพ้ ต้องซื้อข้าวเหนียวหมูทอดให้ลุงคนละห่อ… ฮ่าๆ ลุงชนะคนเดียว ขอบใจนะหลาน"
      - text: "แล้วใครชนะ{kq}"
        heart: 1
        reply: "ยังไม่มีใครชนะจ้ะ ต้องรอดูสิบปี… ลุงขับรถมาสามสิบปี ลุงรอเป็น"
      - text: "คนบนรถว่างจัง{k}"
        heart: 0
        reply: "ว่างสองชั่วโมงไปอำเภอจ้ะหลาน ไม่มีไวไฟ มีแต่ชีวิตคนอื่น"

  - id: cherd_f_n_three_pm
    topic: news
    when: { gender: f, day_min: 5 }
    npc: "หลานรู้ไหม ผู้โดยสารลุงสิบคน ผู้หญิงแปดคน ไปตลาด ไปหาหมอ พาหลานไปฉีดยา พาแม่ไปล้างไต… ขนส่งจังหวัดมานับคนแล้วว่าจะตัดเที่ยวบ่ายสาม เพราะ ‘ไม่ใช่ชั่วโมงเดินทางไปทำงาน’ งานของป้าๆ บนรถลุงไม่นับเป็นงานจ้ะ"
    options:
      - text: "ดูแลคนก็คืองานนะ{kq}"
        heart: 2
        reply: "ลุงก็ว่าอย่างนั้น ลุงเขียนลงแบบฟอร์มเขาช่อง ‘หมายเหตุ’ ว่า ‘ป้าหมู่สี่พาแม่ไปล้างไตทุกพฤหัส เที่ยวบ่ายสามคือเที่ยวกลับ’… แบบฟอร์มเขาไม่มีช่องให้แม่ของป้าจ้ะ"
      - text: "เขาจะตัดจริงเหรอ{kq}"
        heart: 0
        reply: "ยังจ้ะ เขาบอกว่า ‘อยู่ระหว่างพิจารณา’ ลุงได้ยินคำนี้มาสามสิบปี ทุกอย่างที่อยู่ระหว่างพิจารณา ยังพิจารณาอยู่จนทุกวันนี้"

  - id: cherd_f_a_mirror
    topic: advice
    when: { gender: f, time: evening }
    npc: "เที่ยวหกโมงเย็นนะหลาน ถ้ากลับจากอำเภอคนเดียว นั่งแถวหน้าใกล้ลุง ไม่ใช่เพราะหลานเป็นผู้หญิงนะ… ก็ใช่ส่วนนึงแหละ ลุงพูดตรงๆ เมียลุงสอนไว้ ใครนั่งคนเดียวตอนค่ำ ให้นั่งตรงที่ลุงมองกระจกเห็น"
    options:
      - text: "ป้าสอนดีนะ{kq}"
        heart: 2
        reply: "เขาจ้ะ ยี่สิบห้าปีเขานั่งตรงนั้น คอยดูทุกคนแทนลุง… ตอนนี้ลุงต้องเหลือบกระจกเองบ่อยขึ้น คอลุงเลยเคล็ดทุกเดือน"
        next:
          - text: "งั้นวันไหน{p}นั่งรถ {p}จะช่วยดูแทนป้า{k}"
            heart: 2
            reply: "…ได้จ้ะหลาน นั่งข้างคนขับเลย เบาะตรงนั้นยังนุ่มฝั่งเดียว ฝั่งที่เขานั่ง ลุงไม่ให้ใครนั่งมาหลายปี หลานนั่งได้"
          - text: "ลุงคิดถึงป้าไหม{kq}"
            heart: 1
            reply: "ทุกเที่ยวจ้ะ โดยเฉพาะตอนทอนเงินผิด… ทอนผิดทีไรลุงได้ยินเสียงเขา ‘เชิด สิบบาท’"
      - text: "{p}ดูแลตัวเองได้{k}ลุง"
        heart: 0
        reply: "รู้จ้ะ ลุงไม่ได้ว่าหลานดูแลไม่ได้ ลุงแค่อยากเห็นหลานในกระจก… คนขับรถเมล์ก็แบบนี้แหละ ห่วงทุกคนที่จ่ายสามสิบบาท"

  - id: cherd_f_s_photo
    topic: smalltalk
    when: { gender: f }
    npc: "ป้าบนรถฝากถามหลานจ้ะ ป้ามีลูกชายจบวิศวะ ทำงานนิคม ‘ส่งรูปให้ดูไหม’ ลุงบอกว่าลุงรับส่งคน ไม่ได้รับส่งรูป… แต่เขายัดรูปใส่มือลุงมาแล้ว"
    options:
      - text: "ลุงคืนรูปไปเถอะ{k} {p}ยังไม่พร้อม"
        heart: 1
        reply: "ได้จ้ะ ลุงจะบอกว่า ‘หลานเขายุ่งกับแปลงผัก ไม่มีเวลาดูรูป’ ป้าคนนี้ไม่ชอบผัก ไม่ถามต่อแน่"
      - text: "หล่อไหม{kq}"
        heart: 1
        reply: "หน้าเหมือนแม่มันจ้ะ… แม่มันพูดเก่งที่สุดบนรถลุง สามสิบปีไม่เคยหยุด ลุงไม่ได้ว่าอะไรนะ ลุงแค่เตือนว่าวันพ่อวันแม่จะเสียงดัง"
      - text: "ป้าเขาห่วงว่า{p}อยู่คนเดียวเหรอ{kq}"
        heart: 1
        reply: "ห่วงแบบคนบนรถห่วงจ้ะ ห่วงสองชั่วโมง ถึงอำเภอก็ไปห่วงราคาไข่… อย่าคิดมาก หลานจะอยู่คนเดียวหรืออยู่กับไก่ บ้านยายก็ยังเป็นบ้าน"

  - id: cherd_f_f_conductor
    topic: self
    when: { gender: f, heart_min: 4 }
    npc: "เมียลุงเป็นกระเป๋ารถเมล์ผู้หญิงคนแรกของสายนี้นะหลาน คนว่าผู้หญิงห้อยประตูเก็บเงินไม่ได้หรอก เขาห้อยอยู่ยี่สิบห้าปี… ลุงมาเป็นคนขับเพราะเขา ไม่ใช่เขามาเพราะลุง"
    options:
      - text: "ป้าเป็นคนแรกเลยเหรอ{kq}"
        heart: 2
        reply: "คนแรกจ้ะ เจ้าของรถสมัยนั้นบอกว่า ‘ลองเดือนเดียว’ เขาเก็บเงินไม่ขาดสักบาท ผู้ชายคนก่อนขาดทุกวัน… เดือนเดียวกลายเป็นยี่สิบห้าปี"
        next:
          - text: "แล้วลุงมาเป็นคนขับได้ยังไง{kq}"
            heart: 1
            reply: "ลุงขึ้นรถไปอำเภอทุกวัน ไม่มีธุระ… สามเดือนเจ้าของรถสงสัย เลยให้ลุงขับซะ จะได้ไม่ต้องจ่ายค่ารถทุกวัน ฮ่าๆ"
          - text: "ป้าคงภูมิใจมาก{k}"
            heart: 2
            reply: "ภูมิใจจนวันสุดท้ายจ้ะ… กระเป๋าเงินหนังของเขายังแขวนข้างที่นั่งลุง ลุงไม่ใช้ แค่แขวนไว้ ให้เขายังมีกะ"
      - text: "ลุงยอมเป็นรองป้ามาตลอดเลยนะ{k}"
        heart: 1
        reply: "ยอมจ้ะ ขับอย่างเดียวสบายกว่าเยอะ… ตอนนี้ลุงต้องทำสองอย่าง ลุงถึงรู้ว่าเขาทำงานหนักกว่าลุงมาตลอด"

  - id: cherd_f_o_nok_bags
    topic: others
    when: { gender: f, flag: story_nok_met_bus }
    npc: "นกกลับบ้านเสาร์อาทิตย์ทุกที ลงรถลุงพร้อมถุงสามใบ ถุงนึงของฝากแม่ ถุงนึงยาให้พ่อ ถุงนึงเสื้อผ้าตัวเอง… คนในหมู่บ้านถามนกแต่ ‘แฟนอยู่นิคมหรือเปล่า’ ไม่มีใครถามว่าถุงยาหนักไหม"
    options:
      - text: "นกคงเหนื่อยมาก{k}"
        heart: 2
        reply: "เหนื่อยแต่ยิ้มทุกครั้งที่ลงรถจ้ะ… ใกล้ถึงป้ายเขาหลับทุกที ลุงเลยขับช้าลงสองนาที ให้ได้หลับต่อ อันนี้อย่าบอกผู้ใหญ่นะ เวลาเพี้ยน"
        next:
          - text: "{p}จะไปช่วยนกถือถุงตอนลงรถ{k}"
            heart: 2
            reply: "ดีจ้ะ ลุงจะบีบแตรสามทีตอนถึงป้าย สามทีแปลว่า ‘มาช่วยหน่อย’ ทั้งตำบลยังไม่มีใครรู้ หลานรู้คนแรก"
          - text: "ลุงใจดีกับทุกคนเลยนะ{k}"
            heart: 1
            reply: "ไม่ทุกคนหรอก ใครขึ้นรถไม่จ่ายลุงจำ… แต่คนที่ทำงานหกวันแล้วนั่งรถสองชั่วโมงกลับบ้าน ลุงให้สองนาทีได้"
      - text: "คนชอบถามเรื่องแฟนแหละ{k}"
        heart: 1
        reply: "ถามหลานด้วยใช่ไหมล่ะ… ลุงว่าเขาถามเรื่องแฟนเพราะมันถามง่าย ถามเรื่องถุงยาต้องช่วยถือ คำถามที่ต้องช่วยถือ คนไม่ค่อยถามหรอกจ้ะ"
