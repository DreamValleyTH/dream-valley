convos:
  - id: sathian_f_walk_home
    topic: react
    when: { gender: f, time: evening, day_min: 2 }
    npc: "…หลานเดินกลับบ้านคนเดียวตอนค่ำเมื่อวานใช่ไหม ดาบเห็น… ไม่ใช่ ดาบไม่เห็น ดาบได้ยินจากป้าแต๋ว ป้าแต๋วโทรแจ้งดาบสามรอบ ว่ามีผู้หญิงเดินคนเดียว ดาบลงบันทึกว่า ‘ผู้หญิงเดินกลับบ้าน’ ไม่ใช่คดี"
    options:
      - text: "ดาบจะไปส่ง{p}ไหม{kq}"
        heart: 1
        reply: "ดาบไปส่งได้… พรุ่งนี้นะ วันนี้เปลยังอุ่นอยู่ ล้อเล่น… ดาบไปส่งถึงสะพานคลองได้ เลยสะพานไปเป็นเขตยายบัว ผีแถวนั้นเกรงใจยายบัวมากกว่าตำรวจ"
        next:
          - text: "ไม่ต้องหรอก{k} {p}แค่อยากรู้ว่าดาบจะไปไหม"
            heart: 2
            reply: "…หลานทดสอบดาบ ดาบสอบผ่านไหม ดาบไม่เคยผ่านการทดสอบอะไรมาสิบห้าปีแล้ว ยศยังไม่ยอมขยับเลย"
          - text: "ไปถึงสะพานก็ยังดี{k}"
            heart: 1
            reply: "เออ ดาบเดินช้า หลานเดินรอ… เดินกับตำรวจไม่ได้ปลอดภัยกว่าหรอกนะ แต่ถ้ามีอะไรเกิดขึ้น ดาบจะได้เป็นพยาน ดาบเป็นพยานที่ดี ดาบนิ่ง"
      - text: "{p}มีไฟฉายกับนกหวีด{k}"
        heart: 1
        reply: "นกหวีดของดาบที่ป้าแต๋วขโมยไปใช่ไหม… เก็บไว้เถอะ ดาบไม่เคยเป่าเลย ดาบเป่าแล้วหมาตื่น หมาตื่นแล้วดาบต้องลุก"
      - text: "ผู้ชายเดินกลับคนเดียวไม่เห็นมีใครโทรแจ้ง"
        heart: 1
        reply: "…จริง ลุงสมหมายเดินเมากลับบ้านตีสองทุกคืน ไม่มีใครโทรเลยสักครั้ง ดาบควรลงบันทึกเขาแทน ‘ผู้ชายเดินกลับบ้านไม่ได้’ อันนี้ใกล้คดีกว่า"

  - id: sathian_f_two_reports
    topic: news
    when: { gender: f }
    npc: "คดีใหม่… ตาคนหนึ่งหมู่สี่มาแจ้งความว่าเมียหนีไปทำงานนิคมสามเดือน ดาบรับแจ้ง… วันต่อมาเมียโทรมาแจ้งความกลับ ว่าผัวหนีงานบ้านมาสามสิบปี ดาบรับแจ้งทั้งสองคดี"
    options:
      - text: "แล้วดาบตัดสินยังไง{kq}"
        heart: 1
        reply: "ดาบไม่ได้ตัดสิน ตำรวจไม่ใช่ศาล… ดาบนอนคิดอยู่ในเปลสองวัน แล้วเห็นว่าคดีหลังเก่ากว่า มีอายุความยาวกว่า ดาบเลยเอาคดีหลังขึ้นก่อน"
      - text: "แจ้งความเรื่องงานบ้านได้ด้วยเหรอ{kq}"
        heart: 0
        reply: "ไม่ได้… แต่ดาบรับไว้ ช่องข้อหาดาบเขียนว่า ‘เรื่องที่ควรเป็นคดี แต่กฎหมายยังไม่ตื่น’ ผู้กำกับยังไม่ได้อ่าน ไม่เคยอ่าน"
      - text: "ไปนิคมก็ดีแล้ว{k} มีเงินเดือน"
        heart: 1
        reply: "นกก็พูดแบบนี้… นกบอกว่าที่นิคมผู้หญิงหมู่สี่มีสิบสองคน ตั้งกลุ่มกันชื่อ ‘หนีมาพัก’ ดาบไม่ได้ลงบันทึก ดาบเห็นด้วยนิดนึง"

  - id: sathian_f_tell_wife
    topic: advice
    when: { gender: f, heart_min: 2 }
    npc: "ฟังนะหลาน… ถ้ามีใครมาตามจีบหลานแบบไม่สุภาพ ส่งข้อความกลางคืน มายืนหน้าบ้าน อะไรแบบนั้น หลานแจ้งดาบได้ ดาบรับเรื่องเลย ไม่พรุ่งนี้"
    options:
      - text: "แล้วดาบจะทำยังไง{kq}"
        heart: 1
        reply: "ดาบจะไปบอกเมียดาบ… เมียดาบจัดการเร็วกว่าตำรวจทั้งอำเภอ เขาโทรหาแม่ของคนคนนั้น แล้วแม่เขาจะโทรหายายเขา ภายในชั่วโมงเดียวทั้งตระกูลรู้ ไม่มีใครกล้าอีก"
        next:
          - text: "เมียดาบเคยทำแบบนี้จริงเหรอ{kq}"
            heart: 1
            reply: "สามครั้ง ได้ผลสามครั้ง… ดาบทำตามระเบียบมายี่สิบหกปี ได้ผลน้อยกว่าเมียดาบใช้โทรศัพท์เครื่องเดียว"
          - text: "ดาบไม่เลื่อนเป็นพรุ่งนี้จริงๆ นะ{kq}"
            heart: 2
            reply: "จริง… เรื่องนี้ไม่เลื่อน ดาบขี้เกียจทุกเรื่อง ยกเว้นเรื่องที่ลูกสาวดาบเคยเจอ… ไว้วันหลังดาบเล่า"
      - text: "{p}จัดการเองได้{k}"
        heart: 1
        reply: "ดาบเชื่อ หน้าหลานเหมือนยายเพียรตอนไล่คนมาขอซื้อที่… แต่จัดการเองแล้วบอกดาบด้วย ดาบจะได้ลงบันทึกว่าเรื่องจบดี ดาบชอบบันทึกที่จบดี มีน้อย"
      - text: "ตำบลนี้มีแบบนั้นด้วยเหรอ{kq}"
        heart: 0
        reply: "มีทุกตำบล… ที่นี่น้อยหน่อยเพราะป้าแต๋วเห็นทุกอย่าง กล้องวงจรปิดเสีย แต่ป้าแต๋วไม่เคยเสีย"

  - id: sathian_f_lunchbox
    topic: smalltalk
    when: { gender: f, time: noon }
    npc: "เที่ยงแล้ว… ข้าวห่อของดาบ เมียดาบห่อให้ทุกวัน ไข่เจียวกับน้ำพริก ดาบอายุห้าสิบ ทอดไข่เองไม่เป็น… เป็นความลับระดับชาติ หลานอย่าบอกใคร"
    options:
      - text: "ดาบหัดเองสิ{kq} ไข่เจียวง่ายจะตาย"
        heart: 1
        reply: "ดาบเคยลองครั้งนึง ไข่ติดกระทะ กระทะติดเตา เมียดาบบอกว่า ‘ดาบไปนอนเปลเถอะ บ้านจะได้ไม่ไหม้’ ดาบทำตามคำสั่ง ดาบเป็นข้าราชการที่ดี"
      - text: "ขอชิมน้ำพริกได้ไหม{kq}"
        heart: 1
        reply: "ได้… น้ำพริกตาแดงสูตรแม่เมียดาบ ส่งต่อมาสามรุ่น ผู้หญิงบ้านนั้นตำ ผู้ชายบ้านนั้นกิน… ดาบไม่ได้วิจารณ์ ดาบบรรยายเฉยๆ"
      - text: "ดาบน่าจะทำเองได้แล้ว{k}"
        heart: 0
        reply: "…เมียดาบก็พูดประโยคนี้ทุกเช้า ดาบไม่เถียง ดาบเคี้ยว"

  - id: sathian_f_daughter_cadet
    topic: self
    when: { gender: f, heart_min: 4 }
    npc: "หลาน… ลูกสาวคนโตดาบ ที่ดาบเกลี้ยกล่อมให้ไปเป็นหมอน่ะ เมื่อวานโทรมาบอกว่าสอบข้อเขียนตำรวจหญิงผ่านแล้ว… ไม่ได้บอกดาบก่อนสมัครสักคำ"
    options:
      - text: "ดาบโกรธไหม{kq}"
        heart: 1
        reply: "ไม่โกรธ… ดาบนอนในเปลทั้งคืน ไม่หลับ คิดว่าตำรวจสมัยนี้ผู้หญิงยังต้องเจออะไรอีกเยอะ… แล้วก็คิดว่าเขาคงไม่นอนเปลเหมือนพ่อ เขาจะเป็นตำรวจที่ดีกว่าดาบ"
        next:
          - text: "บอกเขาสิ{kq}ว่าดาบภูมิใจ"
            heart: 2
            reply: "ดาบบอกไม่เป็น… ดาบเลยส่งเหรียญความกล้าหาญในลิ้นชักไปให้ทางไปรษณีย์ กับหนังยางสามเส้น ไม่ได้เขียนอะไร เขาคงเข้าใจ เขาเป็นลูกดาบ"
          - text: "เขาเลือกเองก็ดีแล้ว{k}"
            heart: 1
            reply: "เออ… ดาบเกลี้ยกล่อมคนอื่นเก่ง เกลี้ยกล่อมลูกไม่สำเร็จ แสดงว่าลูกดาบหัวแข็งเหมือนแม่ ดีแล้ว"
      - text: "ทำไมเขาไม่บอกดาบก่อน{kq}"
        heart: 0
        reply: "เพราะรู้ว่าดาบจะบอกว่า ‘พรุ่งนี้ค่อยคิด’… ลูกดาบรู้จักดาบดีกว่าผู้กำกับ"
      - text: "ผู้หญิงเป็นตำรวจเท่จะตาย{k}"
        heart: 1
        reply: "เท่… ดาบนึกภาพเขาใส่ชุดแล้วตาร้อน ฝุ่นเข้าตา ฝุ่นแถวนี้เยอะ ดาบไม่ได้ร้องไห้"

  - id: sathian_f_the_bet
    topic: others
    when: { gender: f, day_min: 10 }
    npc: "หลานรู้ไหม… วันแรกที่หลานมา คนในศาลาพนันกันว่าผู้หญิงกรุงเทพฯ จะอยู่ได้กี่วัน ตาเผือกให้สามวัน ลุงสมหมายให้อาทิตย์ ป้าพรให้สองอาทิตย์… ดาบไม่ได้แทง ดาบไม่เห็น ดาบเป็นเจ้ามือ"
    options:
      - text: "แล้วใครชนะ{kq}"
        heart: 1
        reply: "ไม่มีใครชนะ ทุกคนแพ้… เงินกองกลางอยู่กับดาบ สามร้อยบาท ดาบเอาไปซื้อชาเย็น… ล้อเล่น ดาบเอาไปใส่ตู้บริจาควัดในชื่อยายเพียร ลุงจำรัสจดไว้แล้ว"
      - text: "{p}จะอยู่ให้ทุกคนแพ้อีกหลายรอบ{k}"
        heart: 2
        reply: "ดี… ป้าพรตั้งวงใหม่แล้ว รอบนี้พนันว่าหลานจะแต่งงานเมื่อไหร่ ดาบไม่รับเป็นเจ้ามือ ดาบบอกว่า ‘ไปถามเจ้าตัวเอง’ ทุกคนเงียบ ไม่มีใครกล้าถาม"
      - text: "คนที่นี่ว่างกันจริงๆ"
        heart: 0
        reply: "ว่าง… ตำบลที่ไม่มีคดี คนก็หาเรื่องทำ ดีกว่ามีคดี ดาบชอบตำบลที่ว่างแบบนี้"
