# เสี่ยเฮง — บทคุยเฉพาะผู้เล่นหญิง (gender: f) · ตลกร้ายเรื่องทุน + เพศ แบบยอมรับหน้าตาเฉย
convos:
  - id: heng_f_r_guarantor
    topic: react
    once: true
    when: { gender: f, flag: story_town_intro }
    npc: "น้องจะเชื่อปุ๋ยเหรอ ได้ๆ เฮียขอชื่อคนค้ำหน่อย… พ่อ ผัว หรือแฟนก็ได้ ผู้ชายสักคนในบ้าน เฮียจะได้รู้ว่าต้องไปทวงใคร ฮ่าๆ"
    options:
      - text: "ยาย{p}ไม่เคยมีผัวมาค้ำ เฮียก็ให้ยายเชื่อนะ{kq}"
        heart: 2
        reply: "…เออ จริง ยายเพียรเซ็นเองตลอด จ่ายตรงกว่าผู้ชายครึ่งตำบล (กดเครื่องคิดเลข) โอเคน้อง เฮียแก้แบบฟอร์ม ช่องคนค้ำเขียนว่า ‘ตัวเอง’ ก็ได้"
        next:
          - text: "แล้วดอกล่ะ{kq}"
            heart: 1
            reply: "ดอกเท่าเดิมน้อง เฮียแก้ได้ทีละช่อง ฮ่าๆ… ล้อเล่น ลดให้ครึ่งเปอร์เซ็นต์ ถือเป็นค่าเรียนที่น้องสอนเฮีย"
          - text: "ช่องนั้นเฮียลบทิ้งไปเลยดีกว่า{k}"
            heart: 1
            reply: "ลบไม่ได้น้อง ไม่มีช่องนั้นเฮียไม่รู้จะเขียนอะไรตอนทวง… เดี๋ยวเฮียเปลี่ยนเป็น ‘คนที่จะร้องไห้ถ้าน้องไม่จ่าย’ ทุกคนมีหมด"
      - text: "ไม่มีแฟน{k} ใช้หมาค้ำได้ไหม{kq}"
        heart: 1
        reply: "หมาเฮียชื่อดอกเบี้ย ค้ำให้น้องได้ ถือว่าเป็นญาติกัน ฮ่าๆ… เอาเถอะ น้องเซ็นเอง เฮียดูหน้าแล้ว หน้าคนจ่ายตรง"
      - text: "งั้นไม่เชื่อแล้ว{k} จ่ายสด"
        heart: 0
        reply: "จ่ายสดเฮียก็ชอบ แต่เฮียเพิ่งเสียลูกค้าระยะยาวไปคนนึง… ดูสิ ปากเฮียทำเฮียขาดทุนอีกแล้ว"

  - id: heng_f_n_pr
    topic: news
    when: { gender: f, flag: story_meeting2 }
    npc: "น้องเห็นเด็กพีอาร์บริษัทคนใหม่ยัง ที่มายืนแจกน้ำขวดหน้าลานเฮีย ยิ้มทั้งวัน… คุณธนาส่งมาแทนตัวเอง เพราะคนในตำบลกล้าด่าเขา แต่ไม่กล้าด่าเด็กผู้หญิงยิ้มๆ ฉลาดนะ เฮียต้องจด"
    options:
      - text: "เขาส่งผู้หญิงมารับด่าแทนเหรอ{kq}"
        heart: 1
        reply: "เขาเรียกว่า ‘หน้าบ้านองค์กร’ น้อง เฮียเรียกว่ากันชน… เด็กมันมานั่งกินน้ำแข็งใสร้านเฮียตอนเที่ยง บอกเงินเดือนหมื่นห้า ยิ้มวันละแปดชั่วโมง เฮียคิดแล้ว ยิ้มละสามบาท"
      - text: "เฮียก็ใช้ยิ้มต่อราคาเหมือนกันนี่{k}"
        heart: 1
        reply: "ยิ้มเฮียเป็นยิ้มเจ้าของน้อง ไม่มีใครส่งมา ไม่มีเงินเดือน… แย่กว่าอีก เฮียยิ้มแล้วต้องจ่ายค่าไฟเอง"

  - id: heng_f_a_haggle
    topic: advice
    when: { gender: f, heart_min: 2 }
    npc: "เฮียสอนฟรีนะน้อง เอาข้าวโพดไปขายลานไหนก็ตาม พาผู้ชายไปยืนข้างๆ สักคน ไม่ต้องพูด แค่ยืน พ่อค้าจะกดราคาน้อยลงกิโลละบาทสองบาท… เฮียรู้ เพราะเฮียคือพ่อค้าคนนั้น ฮ่าๆ"
    options:
      - text: "งั้นที่ผ่านมาเฮียกด{p}ไปเท่าไหร่แล้ว{kq}"
        heart: 1
        reply: "(กดเครื่องคิดเลข) …สามเดือนที่ผ่านมา เฮียกดผู้หญิงในตำบลเฉลี่ยกิโลละบาทห้าสิบ เฮียไม่เคยคิดออกมาเป็นตัวเลข น้องทำเฮียเสียความรู้สึก"
        next:
          - text: "คืนมาสิ{kq} บาทห้าสิบ"
            heart: 2
            reply: "…ได้ ล็อตหน้าน้องได้ราคาเท่าลุงสมหมาย แต่ห้ามบอกใครว่าเฮียใจดี บอกว่าน้องต่อเก่ง ชื่อเสียงเฮียต้องรักษา"
          - text: "ไม่ต้องคืน แค่เลิกทำก็พอ{k}"
            heart: 1
            reply: "เลิกทีเดียวมันยากน้อง นิสัยสามสิบปี… เฮียลดเหลือกิโลละห้าสิบสตางค์ก่อน เป็นขั้นบันได แบบนี้ในสภาเขาเรียกว่าปฏิรูป"
      - text: "{p}พาตัวเองไปก็พอ{k} ต่อเองได้"
        heart: 1
        reply: "พูดแบบนี้เฮียชอบ แต่ต้องดูตาชั่งด้วยนะน้อง… เจ๊หงษ์ก็พูดแบบนี้ ยี่สิบปีแล้วเฮียยังกดเจ๊ไม่ได้สักบาท เจ๊กดเฮียกลับด้วย"
      - text: "แล้วเฮียบอก{p}ทำไม{kq}"
        heart: 1
        reply: "เพราะยายน้องเคยด่าเฮียเรื่องนี้กลางลาน ต่อหน้าคนยี่สิบคน เฮียจำได้ทุกคำ… บอกน้องไว้ก่อน ดีกว่าโดนหลานด่าซ้ำ ดอกมันทบ"

  - id: heng_f_s_son
    topic: smalltalk
    when: { gender: f, day_min: 5 }
    npc: "น้องมีแฟนหรือยัง… เฮียถามเฉยๆ นะ ลูกเฮียเรียนเมืองนอก ยังโสด… ไม่ได้จะขาย เฮียแค่ให้ดูแค็ตตาล็อก ฮ่าๆ"
    options:
      - text: "{p}ขอดูสัญญาก่อน{k} ดอกกี่เปอร์เซ็นต์"
        heart: 2
        reply: "ฮ่าๆๆ หลานยายเพียรของแท้! อ่านก่อนเซ็น… สัญญาฉบับนี้เฮียเขียนยังไม่เสร็จน้อง ลูกเฮียไม่รับสายมาสามอาทิตย์ เฮียไม่รู้ว่ามันยังโสดหรือยังมีชีวิต"
      - text: "ยังไม่มี{k} แล้วก็ยังไม่หา"
        heart: 1
        reply: "ดี ไม่มีภาระ ไม่มีหนี้ร่วม… เฮียเห็นผัวเมียเซ็นค้ำกันเองมาเยอะ แต่งงานวันเดียว ผ่อนกันยี่สิบปี"
      - text: "เฮียถามทำไม{kq}"
        heart: 0
        reply: "เฮียเก็บข้อมูลลูกค้าน้อง ทุกร้านในตำบลก็ถาม เฮียแค่ถามตรงๆ แล้วจดลงสมุด คนอื่นถามแล้วไปโพสต์ LINE"

  - id: heng_f_f_mother
    topic: self
    when: { gender: f, heart_min: 4 }
    npc: "แม่เฮียขายโจ๊กหน้าตลาดคนเดียว เลี้ยงเฮียกับน้องอีกสองคน… คนในตลาดเรียกพ่อเฮียว่าเถ้าแก่ เรียกแม่ว่าแม่ค้า ทั้งที่คนหาเงินคือแม่ คนติดหนี้คือพ่อ"
    options:
      - text: "แม่เฮียเก่งมากเลยนะ{k}"
        heart: 2
        reply: "เก่งกว่าเฮีย แม่คิดเลขในหัวก่อนเฮียอีก ทอนเงินไม่เคยผิด… เฮียเรียนคิดเลขจากเสียงแม่ทอนเงินตอนตีห้า ไม่ใช่จากโรงเรียน"
        next:
          - text: "แล้วแม่เฮียได้เป็นเถ้าแก่บ้างไหม{kq}"
            heart: 2
            reply: "…ไม่ได้ แม่ตายตอนเฮียเปิดร้านปุ๋ยปีแรก ป้ายร้านเขียนว่า ‘ร้านเฮง’ เฮียน่าจะเขียนชื่อแม่ (เงียบ) …ปุ่มเครื่องคิดเลขมันติดน้อง เฮียไม่ได้ร้องไห้"
          - text: "เฮียได้นิสัยแม่มาเยอะเลย{k}"
            heart: 1
            reply: "ได้ความขยันมา ความใจดีแม่เอาไปด้วย ฮ่าๆ… แม่ให้คนเชื่อโจ๊กไม่คิดดอก บ้านเฮียเลยจนจนเฮียอายุสิบห้า"
      - text: "เฮียเคยเล่าให้ใครฟังบ้าง{kq}"
        heart: 1
        reply: "เจ๊หงษ์รู้ เพราะเจ๊ตั้งแผงตรงที่แผงแม่… เจ๊ไม่เคยพูดเรื่องนี้ แต่เจ๊ไม่ย้ายแผงไปไหนยี่สิบห้าปี เฮียว่าเจ๊รู้"

  - id: heng_f_o_payao
    topic: others
    when: { gender: f, flag: story_posters }
    npc: "เห็นป้ายคุณนายพเยาว์ยัง ‘สานต่องานที่ยังไม่เสร็จ’… น้อง เฮียบอกให้ ตำบลนี้คุณนายบริหารมาสิบปีแล้ว นายกวิชัยถือไมค์ งานไหนเสร็จเพราะคุณนายโทรตาม งานไหนไม่เสร็จเพราะนายกพูด"
    options:
      - text: "งั้นคุณนายลงสมัครเองก็สมเหตุสมผลนะ{kq}"
        heart: 1
        reply: "สมเหตุสมผลที่สุดในตำบล… ที่ไม่สมเหตุสมผลคือป้ายมีรูปนายกยืนข้างหลังตัวใหญ่กว่าคุณนาย เหมือนกลัวคนลืมว่าใครเป็นผัว"
      - text: "ทำไมป้ายต้องเขียนว่าภรรยานายกด้วย{kq}"
        heart: 2
        reply: "เพราะคนเขียนป้ายเป็นผู้ชายไงน้อง… เฮียเองนี่แหละรับพิมพ์ ฮ่าๆ ลูกค้าสั่งมาแบบนั้น เฮียเสนอให้เขียนว่า ‘ผู้จัดการตำบลตัวจริง’ เขาไม่เอา กลัวนายกน้อยใจ"
