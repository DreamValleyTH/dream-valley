# น้องโอ๊ต — บทคุยเฉพาะผู้เล่นหญิง (เด็ก ไม่มีเรื่องรัก)
convos:
  - id: oat_f_r_lizard
    topic: react
    once: true
    when: { gender: f, flag: met_oat, day_min: 2 }
    npc: "พี่ครับ! เมื่อกี้พี่จับกิ้งก่าโยนออกจากแปลงผักด้วยมือเปล่า! ผมนึกว่าผู้หญิงกลัวกิ้งก่าทุกคน… มิวก็ไม่กลัว ยายผมก็ไม่กลัว แม่ผมก็ไม่กลัว ผมว่าคนที่กลัวกิ้งก่าในตำบลนี้มีผมคนเดียวครับ"
    options:
      - text: "กลัวได้ ไม่เห็นเป็นไร"
        heart: 2
        reply: "จริงเหรอครับ… ผมไม่กลัวมากนะ กลัวนิดเดียว กลัวตอนมันหันมามอง มันมองแบบรู้ว่าผมกลัว ผมเลยกลัวเพิ่ม"
        next:
          - text: "งั้นมองตามันกลับเลย"
            heart: 1
            reply: "ได้ครับ! ผมจะฝึกกับจิ้งจกก่อน จิ้งจกตัวเล็กกว่า… ถ้าผมชนะจิ้งจก ผมค่อยไปสู้กิ้งก่า แล้วค่อยไปสู้ไก่งวงป้าแต๋ว เรียงตามขนาดครับ"
          - text: "พี่สอนจับก็ได้นะ"
            heart: 2
            reply: "จับที่คอใช่ไหมครับ ไม่ใช่หาง หางมันหลุด… ผมรู้เพราะเคยจับหาง มันหลุดแล้วหางยังดิ้นในมือผม ผมร้องดังจนลุงเชิดจอดรถเมล์"
      - text: "แล้วโอ๊ตไม่กลัวอะไรบ้าง"
        heart: 1
        reply: "ไม่กลัวควายครับ! ควายตัวใหญ่สุดในทุ่งตาเผือก ผมขี่หลังได้… ผมเก่งเรื่องตัวใหญ่ ตัวเล็กผมไม่ถนัด"

  - id: oat_f_s_mom_asks
    topic: smalltalk
    when: { gender: f, heart_min: 1 }
    npc: "พี่ครับ แม่ผมให้มาถามว่าพี่มีแฟนยัง… ผมไม่อยากถาม ผมถามแล้วนะครับ พี่ตอบเร็วๆ ผมจะได้ไปเล่นทอยเส้นต่อ มิวรออยู่"
    options:
      - text: "บอกแม่ว่าพี่มีแปลงพริกเป็นแฟน"
        heart: 2
        reply: "ได้ครับ! แปลงพริก… แม่จะเชื่อไหมครับ แม่บอกว่าพี่สวยแบบนี้ต้องมีแน่ ผมว่าพี่ก็หน้าธรรมดา… ขอโทษครับ ธรรมดาแบบดีครับ แบบคนปกติ"
        next:
          - text: "ธรรมดาแบบดีเหรอ ขอบใจนะ"
            heart: 1
            reply: "ครับ! แบบที่มองแล้วไม่ตกใจ… ผมชมแล้วนะครับ ครูเต้ยบอกว่าผมต้องหัดชมคน ผมชมไปวันนี้หนึ่งครั้งแล้ว พรุ่งนี้ค่อยชมใหม่"
          - text: "ทำไมแม่อยากรู้ล่ะ"
            heart: 1
            reply: "แม่บอกว่าป้าแต๋วถามแม่ แม่ไม่รู้ แม่อาย เลยให้ผมมาถาม… ผู้ใหญ่ถามต่อกันเป็นแถวเลยครับ เหมือนส่งของในห้องเรียน ผมอยู่ท้ายแถว"
      - text: "ไปบอกแม่ว่าเรื่องผู้ใหญ่"
        heart: 0
        reply: "เรื่องผู้ใหญ่… ได้ครับ แม่จะถามว่าเรื่องผู้ใหญ่แปลว่ามีหรือไม่มี ผมจะบอกว่าผมเด็ก ผมไม่รู้ ดีเลยครับ ผมไปเล่นต่อได้"

  - id: oat_f_a_comeback
    topic: advice
    when: { gender: f, heart_min: 2 }
    npc: "พี่ครับ ผมมีเทคนิค! ถ้าผู้ใหญ่ถามพี่ว่าเมื่อไหร่จะแต่งงาน ให้ถามกลับว่า ‘แล้วลุงจะเลิกซื้อหวยเมื่อไหร่ครับ’ แม่ผมใช้กับลุงสมหมาย ลุงเดินหนีไปเลยครับ ได้ผลร้อยเปอร์เซ็นต์"
    options:
      - text: "ถ้าคนถามไม่ได้ซื้อหวยล่ะ"
        heart: 1
        reply: "เอ่อ… ก็ถามว่า ‘แล้วป้าจะเลิกนินทาเมื่อไหร่ครับ’ ใช้กับป้าแต๋วได้… ไม่ได้ครับ ป้าแต๋วจะตอบว่าเลิกไม่ได้ แล้วเล่านินทาให้ฟังอีกสามเรื่อง"
      - text: "เทคนิคดี แต่พี่ว่ามันเสียมารยาทนิดนึงนะ"
        heart: 1
        reply: "ผมก็ว่างั้นครับ แม่โดนยายดุ… แต่ยายดุแม่เสร็จ ยายแอบหัวเราะในครัว ผมเห็น ผู้ใหญ่ดุเรื่องที่ตัวเองอยากทำอยู่บ่อยครับ"
      - text: "ทำไมโอ๊ตถึงมาสอนพี่"
        heart: 2
        reply: "เพราะผมได้ยินป้าๆ ถามพี่ทุกวันครับ หน้าพี่เวลาโดนถามเหมือนผมเวลาโดนถามว่าการบ้านเสร็จยัง… ผมเลยสงสาร เราเป็นทีมเดียวกันครับ ทีมโดนถาม"

  - id: oat_f_n_sweep
    topic: news
    when: { gender: f, day_min: 4 }
    npc: "พี่ครับ! ครูเต้ยเคยให้ผู้ชายยกโต๊ะ ผู้หญิงกวาดห้อง มิวบอกว่าไม่ยุติธรรม ครูเลยให้สลับ… ผมกวาดห้องครั้งแรกในชีวิตครับ กวาดยากกว่ายกโต๊ะอีก ฝุ่นมันหนีไม้กวาด"
    options:
      - text: "แล้วมิวยกโต๊ะไหวไหม"
        heart: 1
        reply: "ไหวครับ… ยกได้เร็วกว่าผมด้วย ผมไม่อยากพูดแต่ต้องพูดเพราะพี่ถาม มิวยกแล้วยิ้มใส่ผมทุกโต๊ะ ยิ้มแบบแชมป์"
        next:
          - text: "งั้นสัปดาห์หน้าโอ๊ตยกแข่งกับมิวเลย"
            heart: 2
            reply: "ได้ครับ! ผมจะฝึกยกกระสอบข้าวที่บ้าน… ไม่ได้ครับ แม่ไม่ให้ยก ผมจะฝึกยกควาย ไม่ได้อีก ผมจะฝึกยกมิว เดี๋ยวโดนตี"
          - text: "กวาดห้องก็สำคัญเหมือนกันนะ"
            heart: 1
            reply: "ครับ… ตอนนี้ผมรู้แล้วว่าแม่กวาดบ้านทุกวันเหนื่อยแค่ไหน ผมเลยกวาดหน้าบ้านให้แม่เมื่อวาน แม่ถามว่าผมทำอะไรผิดมา"
      - text: "ครูเต้ยใจดีนะ ยอมสลับ"
        heart: 1
        reply: "ครูเต้ยบอกว่างานในห้องไม่มีป้ายติดว่าผู้ชายหรือผู้หญิง มีแต่ป้ายติดว่า ‘ห้ามวิ่ง’ ซึ่งผมก็ไม่ทำตามครับ"

  - id: oat_f_f_cry
    topic: self
    when: { gender: f, heart_min: 4 }
    npc: "พี่ครับ… พ่อผมบอกว่าผู้ชายห้ามร้องไห้ แต่ตอนวิดีโอคอลเมื่อคืน ผมเห็นพ่อร้อง พ่อหันกล้องไปทางตึก แต่ผมเห็นแล้ว… พี่เป็นผู้หญิง พี่ร้องไห้ได้ใช่ไหมครับ แล้วผมล่ะครับ"
    options:
      - text: "ใครก็ร้องไห้ได้ ทั้งพี่ ทั้งโอ๊ต ทั้งพ่อโอ๊ตด้วย"
        heart: 2
        reply: "…จริงเหรอครับ งั้นพ่อไม่ได้ทำผิดกฎตัวเอง พ่อแค่คิดถึงบ้าน… ผมจะบอกพ่อว่าไม่เป็นไร ผมก็ร้องตอนพ่อวางสาย ร้องแค่นิดเดียว ร้องใส่หมอน"
      - text: "พี่ก็ร้องไห้ตอนอยู่กรุงเทพฯ บ่อยนะ"
        heart: 2
        reply: "พี่ร้องเพราะอะไรครับ… เพราะเหนื่อยเหรอครับ พ่อผมก็เหนื่อย งั้นพี่กับพ่อผมเหมือนกัน พี่กลับบ้านแล้วหายเหนื่อยไหมครับ ถ้าหาย ผมจะบอกพ่อให้กลับบ้านบ้าง"
      - text: "เก็บไว้ร้องตอนอยู่คนเดียวก็ได้"
        heart: 0
        reply: "ผมก็ทำงั้นครับ… แต่ร้องคนเดียวมันเงียบไปหน่อย มีแต่เสียงจิ้งจก ผมไม่ชอบจิ้งจก"

  - id: oat_f_o_mew_sister
    topic: others
    when: { gender: f, heart_min: 3 }
    npc: "พี่ครับ มิวบอกทุกคนว่าพี่เป็นพี่สาวของมิว ผมบอกว่าพี่เป็นพี่ของทุกคน มิวไม่ยอม… ตกลงพี่เป็นพี่ของใครครับ ผมต้องรู้ เรื่องนี้สำคัญมาก"
    options:
      - text: "เป็นพี่ของโอ๊ตด้วย ของมิวด้วย"
        heart: 2
        reply: "เห็นไหมครับ! ของทุกคน… เดี๋ยวนะครับ ถ้าของทุกคน ผมก็ได้น้อยลง มิวก็ได้น้อยลง ผมไม่ได้คิดถึงข้อนี้ ผมจะกลับไปเถียงใหม่"
      - text: "ทำไมโอ๊ตอยากมีพี่สาวล่ะ"
        heart: 2
        reply: "ไม่ได้อยากครับ… อยากนิดนึง พี่สาวไม่ดุเหมือนแม่ ไม่ชนะทุกเรื่องเหมือนมิว แล้วก็จับกิ้งก่าแทนได้ เป็นตำแหน่งที่มีประโยชน์มากครับ"
      - text: "ไปเถียงกับมิวเองเลย พี่ไม่เกี่ยว"
        heart: -1
        reply: "พี่ก็เหมือนครูเต้ยเลยครับ ‘ไปตกลงกันเอง’ … ตกลงกันเองทีไรมิวชนะทุกที"
