# ป้าพร — บทคุยเฉพาะผู้เล่นหญิง
convos:
  - id: porn_f_r_wedding_q
    topic: react
    once: true
    when: { gender: f, flag: met_porn, day_min: 4 }
    npc: "เมื่อเช้าที่ร้านแต๋ว มีคนถามป้าแทนหลานสามคนแล้วนะว่าหลานจะแต่งงานเมื่อไหร่ ป้าตอบว่า ‘เมื่อหลานอยากแต่ง’ เขาไม่พอใจคำตอบ… ป้าเลยบอกว่าหลานจะแต่งกับรถไถ"
    options:
      - text: "ป้าตอบดีมาก{k} {p}ขอยืมไปใช้"
        heart: 2
        reply: "ยืมได้ ไม่คิดตังค์… คำนี้ป้าใช้กับตัวเองตอนยี่สิบห้า ตอนนั้นป้าบอกว่าจะแต่งกับจักรเย็บผ้า สุดท้ายแต่งกับตาแก่ จักรยังอยู่ ตาแก่ก็ยังอยู่ ป้าเลือกถูกครึ่งนึง"
        next:
          - text: "ครึ่งไหนถูก{kq}"
            heart: 2
            reply: "จักร… ล้อเล่นย่ะ ถูกทั้งสองอย่างแหละ แต่อย่าไปบอกตาแก่ เดี๋ยวแกเหลิง แกเหลิงทีซื้อหวยเพิ่มห้าใบ"
          - text: "รถไถยายเพียรเสียนะ{kq} แต่งไม่ได้แล้ว"
            heart: 1
            reply: "งั้นเลื่อนงานไปก่อน รอบอลซ่อม… ดีเลย บอลซ่อมช้า หลานได้โสดไปอีกสามปี"
      - text: "ใครถาม{kq} สามคนนั้น"
        heart: 1
        reply: "แม่ค้าถั่วต้ม เมียกำนัน กับคนที่ป้าไม่รู้จัก เขามาซื้อน้ำแข็งเฉยๆ แต่ฟังแล้วถามด้วย… ตำบลนี้คำถามเรื่องแต่งงานแถมไปกับน้ำแข็งทุกถุง"
      - text: "{p}ก็ยังไม่อยากแต่ง{k}"
        heart: 1
        reply: "ก็ดี ไม่อยากก็อย่าแต่ง ป้ารู้จักผู้หญิงในตำบลนี้สิบคนที่แต่งเพราะโดนถามจนรำคาญ เจ็ดคนตอนนี้มาถามคนอื่นต่อ ส่งต่อความรำคาญเป็นมรดก"

  - id: porn_f_a_button
    topic: advice
    when: { gender: f, heart_min: 2 }
    npc: "มานี่หลาน กระดุมเสื้อหลุดมาสองวันแล้วใช่ไหม ป้าเห็น… ไม่ต้องให้ป้าเย็บ ป้าจะสอน ผู้หญิงสมัยนี้ติดกระดุมไม่เป็นไม่ใช่ความผิดหรอกนะ ผู้ชายสมัยไหนก็ติดไม่เป็น ไม่เห็นมีใครด่าเขา"
    options:
      - text: "สอน{p}หน่อย{k}ป้า"
        heart: 2
        reply: "ด้ายสองเส้น ปมเดียว แทงขึ้นจากข้างใน… พันใต้กระดุมสามรอบให้มีคอ ไม่มีคอกระดุมมันหายใจไม่ออก ติดไปอาทิตย์เดียวหลุด เหมือนตาแก่ใส่เข็มขัดแน่นเกิน"
        next:
          - text: "นี่จักรเย็บผ้าของแม่ป้าใช่ไหม{kq}"
            heart: 2
            reply: "ใช่… แม่ป้าสอนป้าตรงนี้แหละ ตอนป้าแปดขวบ ป้าเย็บนิ้วตัวเองติดผ้าไปทีนึง แม่ไม่ด่า แม่บอกว่า ‘เข็มมันแค่ทักทาย’ ป้ายังเรียกแบบนั้นจนทุกวันนี้"
          - text: "ป้าเย็บให้เลยไม่ได้เหรอ{kq} เร็วกว่า"
            heart: 0
            reply: "ได้ เร็วกว่าด้วย… แต่ป้าไม่อยู่ไปตลอดนะหลาน เมื่อไหร่ป้าตาฝ้าจนร้อยเข็มไม่เข้า หลานต้องมาร้อยให้ป้า ฝึกไว้ก่อน"
      - text: "ลุงสมหมายติดกระดุมเป็นไหม{kq}"
        heart: 1
        reply: "เป็น… ติดกระดุมเสื้อตัวเองผิดรูทุกวัน เดินไปตลาดเสื้อเบี้ยว ป้าไม่บอก ให้คนในตลาดบอก ป้าเหนื่อยบอกมาสี่สิบปีแล้ว"
      - text: "ใส่เสื้อยืดดีกว่า ไม่มีกระดุม{k}"
        heart: 0
        reply: "ฉลาดแบบขี้เกียจนะย่ะ… เสื้อยืดขาดก็ต้องปะอยู่ดี หนีเข็มไม่พ้นหรอกหลาน ทั้งชีวิตต้องเจอเข็มสักวัน"

  - id: porn_f_n_pr_girl
    topic: news
    once: true
    when: { gender: f, flag: story_meeting2 }
    npc: "เห็นสาวประชาสัมพันธ์บริษัทที่ศาลาไหมหลาน สวยเหมือนนางงาม ใส่ส้นสูงเดินลานดิน ส้นจมไปข้างนึง ป้าสงสารเด็กนะ… ไม่ได้สงสารบริษัท"
    options:
      - text: "บริษัทส่งผู้หญิงมายิ้มแทนผู้จัดการสินะ{kq}"
        heart: 1
        reply: "นั่นแหละ ป้าถามเด็กมันเลยว่า ‘หนูยิ้มแทนใคร’ เด็กตอบไม่ได้ ยืนยิ้มต่อ… ป้าคำนวณให้ฟัง เงินเดือนหนูหมื่นห้า ผู้จัดการแสนสอง หนูยิ้มแทนเขาเจ็ดเท่า"
        next:
          - text: "ป้าพูดแบบนั้นเด็กไม่เสียใจเหรอ{kq}"
            heart: 2
            reply: "เสีย… ป้าก็เสียใจที่พูด ป้าเลยเอารองเท้าแตะตาแก่ไปให้มันใส่แทนส้นสูง มันไหว้ป้าแล้วร้องไห้ ป้าว่าเด็กนี่ไม่ได้อยากมายืนยิ้มหรอก มันอยากได้เงินเดือนเหมือนหลานสาวป้า"
          - text: "ป้าเย็บผ้าถุงคลุมโลโก้จริงไหม{kq}"
            heart: 1
            reply: "จริง! ผ้าถุงลายดอกพิกุล คลุมพอดีหยดน้ำยิ้ม ป้าว่ามันยิ้มน้อยลงเยอะ"
      - text: "เด็กมันก็ทำงานของมัน{k}"
        heart: 1
        reply: "ใช่ ป้าไม่ว่าเด็ก ป้าว่าคนส่งมา… ส่งผู้หญิงสวยมาเพราะคิดว่าชาวบ้านจะเกรงใจ คนส่งไม่รู้จักป้าแต๋ว ป้าแต๋วไม่เคยเกรงใจความสวยของใคร ความสวยของตัวเองก็ไม่เกรงใจ"

  - id: porn_f_s_jeans
    topic: smalltalk
    when: { gender: f }
    npc: "หลานใส่แต่กางเกงยีนส์ ป้าดูมาสองอาทิตย์แล้ว… ป้าจะตัดผ้าถุงให้สักผืนไหม ไม่ต้องใส่ทำนา เอาไว้ใส่ไปวัด ยายเพียรมีผ้าถุงสิบสองผืน ป้าเย็บให้แปดผืน"
    options:
      - text: "{p}ใส่กางเกงทำนาสะดวกกว่า{k}"
        heart: 2
        reply: "ถูก! ป้าก็ใส่กางเกงลงนาตั้งแต่สาวๆ แม่ป้าว่าเหมือนผู้ชาย ป้าบอกว่าเหมือนคนที่ไม่อยากให้ปลิงเข้า… แม่ป้าเงียบไปเลย ปีต่อมาแม่ใส่กางเกงตามป้า"
      - text: "ตัดผ้าถุงแบบที่ยายใส่ได้ไหม{kq}"
        heart: 2
        reply: "ได้สิ ลายดอกพิกุลพื้นเขียว ยายชอบสีนี้… ป้ายังมีเศษผ้าผืนสุดท้ายของยายอยู่ ป้าจะต่อเชิงให้ผืนหลานด้วยผ้ายาย ใส่ไปวัดยายจะได้เดินไปด้วย"
        next:
          - text: "ป้าคิดเท่าไหร่{kq}"
            heart: 1
            reply: "สองร้อย… ลดเหลือร้อยห้าสิบเพราะหน้าเหมือนยาย ลดอีกห้าสิบถ้าหลานไม่บอกตาแก่ว่าป้าเก็บเศษผ้ายายไว้ แกจะว่าป้าขี้เก็บ ป้าขี้เก็บจริง"
          - text: "ป้าเก็บเศษผ้ายายไว้ด้วยเหรอ{kq}"
            heart: 2
            reply: "เก็บทุกคนที่ป้าเย็บให้แหละหลาน… ใส่ถุงเขียนชื่อไว้ คนตายไปแล้วผ้ายังอยู่ ป้าเปิดถุงดูบางทีก็จำได้ว่าใครชอบสีอะไร เหมือนนั่งคุยกัน"
      - text: "ผ้าถุงใส่แล้วเดินยาก{k}"
        heart: 0
        reply: "เดินยากเพราะใส่ไม่เป็นย่ะ ยายหลานใส่ผ้าถุงขี่จักรยานไปอำเภอ ไม่เคยล้ม… ล้มครั้งเดียวเพราะหมาไล่ ไม่ใช่เพราะผ้าถุง"

  - id: porn_f_f_bangkok
    topic: self
    when: { gender: f, heart_min: 5 }
    npc: "หลาน… ป้าเคยได้ทุนไปเรียนตัดเสื้อที่กรุงเทพฯ ตอนสิบแปด ครูโรงเรียนอำเภอส่งชื่อให้ พ่อป้าไม่ให้ไป บอกว่าผู้หญิงไปกรุงเทพฯ คนเดียวเดี๋ยวเสียคน"
    options:
      - text: "{p}ไปกรุงเทพฯ มาคนเดียว ก็ไม่เห็นเสียอะไร{k}"
        heart: 2
        reply: "ไม่เสีย… เหนื่อยกลับมา แต่ไม่เสีย ป้าดูหลานแล้วเหมือนดูป้าอีกคนที่ได้ไป หลานไปมาแทนป้าแล้ว ป้าหายค้างคาไปครึ่งนึง"
        next:
          - text: "แล้วอีกครึ่งล่ะ{kq}"
            heart: 2
            reply: "อีกครึ่งคือหลานสาวป้าที่จะไปเรียนพยาบาลปีหน้า… ป้าจะไปส่งถึงหอ ป้าจะยืนดูกรุงเทพฯ ครั้งแรกในชีวิต ตอนหกสิบ ไม่สายใช่ไหม"
          - text: "ป้าเสียใจไหมที่ไม่ได้ไป{kq}"
            heart: 1
            reply: "ตอนยี่สิบเสียใจ ตอนสี่สิบโกรธ ตอนหกสิบ… ป้าเย็บชุดนักเรียนให้เด็กหมู่สี่สามรุ่น ป้าว่าป้าได้ไปที่ที่ควรไปแล้วแหละ แค่ไม่มีตั๋วรถไฟ"
      - text: "พ่อป้าคงห่วง{k}"
        heart: 0
        reply: "ห่วง… ป้ารู้ แต่ห่วงแล้วขังไว้มันไม่ใช่ห่วงแล้ว มันกลัว พ่อป้ากลัวแทนป้าทั้งชีวิต ป้าเลยกลัวไม่เป็นเลยสักเรื่อง ยกเว้นเรื่องหวยตาแก่"

  - id: porn_f_o_nok
    topic: others
    when: { gender: f, heart_min: 3 }
    npc: "นกลูกสาวบ้านท้ายซอยน่ะหลาน ส่งเงินให้แม่ทุกเดือนมาเจ็ดปี ใช้หนี้เสี่ยเฮงไปครึ่งนึงแล้ว เก่งกว่าลูกชายทุกบ้านในหมู่สี่… แต่คนในตำบลยังถามนกว่าเมื่อไหร่จะได้ผัวรวยๆ มาช่วยใช้หนี้"
    options:
      - text: "นกใช้หนี้เองได้อยู่แล้ว{k}"
