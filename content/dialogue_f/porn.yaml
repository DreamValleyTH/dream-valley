      - text: "ป้าช่วยนกได้ไหม{kq}"
        heart: 2
        reply: "ป้าตัดชุดทำงานให้นกฟรีทุกปี นกไม่รู้ว่าฟรี ป้าบอกว่าแม่จ่ายแล้ว ห้ามบอกนะหลาน นกเกรงใจคนจนป่วย"
      - text: "เขาก็หวังดีแหละ{k}"
        heart: 0
        reply: "หวังดีย่ะ… หวังดีแบบนี้ป้าโดนมาตั้งแต่สาว หวังดีจนป้าอยากหวังร้ายบ้าง ไม่หรอก ป้าพูดเล่น"
