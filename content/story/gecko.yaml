# =============================================================================
# Dream Valley — ไอ้จุก ตุ๊กแกประจำบ้านยายเพียร
# - อยู่ในบ้านยายมานานกว่าใครจำได้ ไล่ไม่ไป (ยายไล่มาสิบปีก็ไม่ไป) ค่อยๆ กลายเป็นเพื่อนร่วมบ้าน
# - ชื่อ "ไอ้จุก" เพราะมีปุ่มนูนบนหัวเหมือนผมจุกเด็กสมัยก่อน (ยายตั้ง)
# - greet: ผู้บรรยายพูดตอนผู้เล่นเดินเข้าบ้าน สุ่มหนึ่งบรรทัดจากรายการที่เงื่อนไขผ่าน
#     when (ไม่บังคับ): time: morning | noon | evening | night (night = หลัง 21:00) · rain: true
#                       flag / not_flag / day_min / day_max แบบเดียวกับ convos
#     บรรทัดที่มี when ควรได้น้ำหนักสุ่มสูงกว่าบรรทัดทั่วไป
# - talk: แตะไอ้จุกในบ้าน → ฉากสั้น เลือกพูด 2–3 ทาง ตอบกลับเป็นคำบรรยาย (ไม่มีผลหัวใจ)
#     when (ไม่บังคับ) รูปแบบเดียวกับ greet
# - นับเสียงร้องเป็นเลข/โชค = เรื่องขำๆ ตามความเชื่อไทย ไม่ชี้ว่าได้ผลจริง
# =============================================================================
id: gecko
name: "ไอ้จุก"
desc: "ตุ๊กแกประจำบ้านยายเพียร ร้องทักทุกครั้งที่กลับบ้าน ไล่ไม่ไป เลยกลายเป็นเพื่อน"

greet:
  - text: "ตุ๊กแก… ตุ๊กแก… ไอ้จุกร้องสองที แปลว่า ‘กลับมาแล้วเหรอ’ หรือ ‘ปิดประตูเบาๆ หน่อย’ ยังตีความไม่ออก"
  - text: "ตุ๊กแก ×7 ครบเจ็ดที! คนแก่ว่าร้องเจ็ดทีจะมีโชค… โชควันนี้อาจเป็นแค่ยุงในบ้านลดลงหนึ่งตัว"
  - text: "ตุ๊กแก… แค่ทีเดียวแล้วเงียบ ไอ้จุกร้องไม่จบประโยค หรือจบแล้วสำหรับมัน"
  - text: "ตุ๊กแก… ตุ๊กแก… ตุ๊ก— เสียงขาดหายกลางคำ ไอ้จุกคงสำลักแมลงเม่า"
  - text: "ตุ๊กแก ×12 ถ้านับตามสูตรลุงสมหมาย เลขเด็ดงวดนี้คือ 12 ถ้านับตามสูตรป้าพร เลขเด็ดคืออยู่บ้านเฉยๆ อย่าเสียเงิน"
  - text: "ไอ้จุกห้อยหัวลงจากขื่อ มองตาแป๋ว ร้องสี่ที ป้าแต๋วเคยเล่าว่ายายบอกมันร้องเท่าจำนวนคนที่มันคิดถึง… ยายพูดเล่นหรือเปล่าไม่มีใครรู้"
  - text: "ไอ้จุกไม่ร้อง แต่หางกระดิกช้าๆ ตุ๊กแกกระดิกหางดีใจได้ไหมไม่รู้ แต่ดูเหมือนอย่างนั้น"
  - text: "กลิ่นยาหม่องยังติดผนัง ไอ้จุกเกาะทับรอยปฏิทินปีเก่าของยาย ร้องหกที ทักแบบคนบ้านเดียวกัน"
  - text: "เหงื่อเต็มตัวเดินเข้าบ้าน ไอ้จุกร้องแปดที ยาวที่สุดในอาทิตย์นี้ คงแปลว่า ‘ไปอาบน้ำ’"
  - text: "ตุ๊กแก! ตุ๊กแก! เสียงป้าแต๋วตะโกนมาจากปากทาง ‘ร้องกี่ทีหลาน!’ …สามที ‘แขก! ป้าเองแหละแขก’"
  - text: "เช้าแล้ว ไอ้จุกเกาะนิ่งหลังปฏิทินวงวันพระ ร้องเบาๆ ทีเดียว เหมือนคนแก่ที่ยังไม่ได้กินกาแฟ"
    when: { time: morning }
  - text: "ไอ้จุกเพิ่งกลับจากเวรกลางคืน ร้องแบบหาวหนึ่งที แล้วคลานเข้าซอกฝาไปนอน กะเดียวกับตั้มเป๊ะ"
    when: { time: morning }
  - text: "เที่ยงๆ ไอ้จุกหลบร้อนอยู่หลังกรอบรูปยาย ไม่ร้องสักคำ ลืมตาข้างเดียวมอง แล้วหลับต่อ"
    when: { time: noon }
  - text: "ร้อนจนตุ๊กแกยังขี้เกียจ ไอ้จุกอ้าปากแต่ไม่มีเสียง เหมือนส่งข้อความเสียงแล้วลืมกดอัด"
    when: { time: noon }
  - text: "เปิดไฟหน้าบ้านปุ๊บ ไอ้จุกโผล่มาประจำที่ใต้หลอดไฟ แมลงเม่ามาถึงก่อนหลานซะอีก… ตุ๊กแก! (แปลว่า ‘ข้าวมาแล้ว’)"
    when: { time: evening }
  - text: "กลับดึกอีกแล้ว ไอ้จุกร้องรัวห้าที เสียงเหมือนป้าแต๋วบ่นอยู่หลังฝาบ้าน"
    when: { time: night }
  - text: "ดึกขนาดนี้ข้างนอกเงียบกริบ มีแต่ ตุ๊กแก… ตุ๊กแก… จากมุมเดิม เป็นเสียงเดียวในตำบลที่ยังรอหลานกลับบ้าน"
    when: { time: night }
  - text: "ฝนตก ไอ้จุกเกาะชิดขอบหน้าต่างครัวตรงที่หลังคารั่วพอดี เหมือนมาคุมว่ารั่วตรงไหนบ้าง"
    when: { rain: true }
  - text: "ฝนกระหน่ำหลังคาสังกะสีดังลั่น ไอ้จุกร้องสวนกลับเก้าที ใครดังกว่าไม่รู้ แต่ไอ้จุกไม่ยอมแพ้"
    when: { rain: true }
  - text: "คืนแรกในบ้านยาย ฝุ่นยังเต็มบ้าน จู่ๆ มีเสียงจากขื่อ ตุ๊กแก… ตุ๊กแก… เหมือนมีใครรออยู่ก่อนแล้ว"
    when: { flag: story_first_night, day_max: 2 }
  - text: "ไฟดับทั้งตำบล บ้านมืดสนิท มีแต่ ตุ๊กแก… ตุ๊กแก… ดังจากมุมเดิม อุ่นใจกว่าที่คิดไว้"
    when: { flag: story_power_out, day_max: 10 }
  - text: "ตั้งแต่รถเก๋งบริษัทมา ไอ้จุกย้ายไปเกาะเหนือประตูหน้าบ้าน ร้องใส่ทุกคนที่ไม่ถอดรองเท้า"
    when: { flag: story_thana_visit }
  - text: "คืนนี้ไอ้จุกร้องช้ากว่าปกติ ทีละคำ เหมือนกำลังนับว่าคนในบ้านครบไหม… ครบ หนึ่งคนกับหนึ่งตุ๊กแก"
    when: { flag: story_ghost_rumor, time: night }
  - text: "รถแห่ผ่านหน้าบ้าน เพลงหาเสียงดังลั่น ไอ้จุกร้องสวนไปสิบที ตุ๊กแกตัวนี้ไม่รับซองใคร"
    when: { flag: story_election_announced }
  - text: "ตั้งแต่เปิดไม้แผ่นที่ห้าใต้หิ้ง ไอ้จุกชอบมาเกาะเหนือหิ้งพระ ร้องเบาๆ ทีเดียว เหมือนคนเฝ้าของที่เพิ่งรู้ว่าเฝ้าอะไรอยู่"
    when: { flag: story_last_page }

talk:
  - text: "ไอ้จุกเกาะนิ่งอยู่เหนือประตู จ้องหลานเหมือนเจ้าของบ้านจ้องผู้เช่า"
    options:
      - text: "สวัสดี{k}เจ้าของบ้าน"
        reply: "ไอ้จุกร้องสองที ดูพอใจที่ลำดับชั้นในบ้านนี้ชัดเจนแล้ว"
      - text: "บ้านนี้ยายยกให้{p}นะ"
        reply: "มันหันหลังให้ช้าๆ แล้วคลานขึ้นไปเกาะสูงกว่าเดิมอีกหนึ่งคืบ เป็นคำตอบที่ชัดมาก"
      - text: "ชู่ๆ ออกไปเลยไป"
        reply: "มันไม่ไป มันไม่เคยไป ยายไล่มาสิบปีก็ไม่ไป มันกะพริบตาใส่หนึ่งครั้ง ช้าและยาวมาก"
  - text: "ไอ้จุกเริ่มร้อง ตุ๊กแก… ตุ๊กแก… หลานเผลอนับตามโดยไม่รู้ตัว"
    options:
      - text: "นับไว้ไปบอกลุงสมหมาย"
        reply: "ร้องได้หกที แล้วค้างอยู่ที่ ‘ตุ๊ก—’ ลุงสมหมายคงบอกว่าหกครึ่ง ตีเป็น 65 ได้สบาย"
      - text: "ไม่นับหรอก ไม่เชื่อ"
        reply: "มันร้องต่อไปเรื่อยๆ จนหลานนับได้เก้า… ไม่ได้เชื่อนะ แค่สมองมันนับเอง"
      - text: "ร้องให้ครบเจ็ดสิ ขอโชคหน่อย"
        reply: "มันร้องหกทีแล้วหยุด มองหน้า เหมือนจะบอกว่าทีที่เจ็ดต้องไปหาเอาเอง"
  - text: "ไอ้จุกค่อยๆ ย่องไปหาแมลงเม่าตัวอ้วนใต้หลอดไฟ"
    options:
      - text: "เอาเลยไอ้จุก!"
        reply: "งับ! แม่นยำแบบคนทำงานมาทั้งชีวิต แล้วหันมามองเหมือนรอเสียงปรบมือ"
      - text: "กินน้อยๆ หน่อย เดี๋ยวอ้วน"
        reply: "มันกินอีกสองตัวต่อหน้า เพื่อให้รู้ว่าใครตัดสินใจเรื่องอาหารในบ้านนี้"
  - text: "ฝนตก ไอ้จุกเกาะอยู่ตรงรอยรั่วหลังคาครัวพอดี น้ำหยดลงข้างตัวมันทีละหยด"
    when: { rain: true }
    options:
      - text: "ขอบใจที่ชี้ให้นะ เดี๋ยวเรียกช่างเปี๊ยก"
        reply: "ตุ๊กแก! สั้นๆ ทีเดียว เหมือนเซ็นรับทราบ เร็วกว่า อบต. หลายเท่า"
      - text: "หลบไปตรงอื่นสิ เดี๋ยวเปียก"
        reply: "มันไม่หลบ มันอยู่บ้านนี้นานกว่าสังกะสีแผ่นนี้อีก เปียกนิดหน่อยไม่สะเทือน"
  - text: "สามทุ่มกว่า ข้างนอกหมาหอน ไอ้จุกร้องดังกว่าทุกคืน"
    when: { time: night }
    options:
      - text: "ร้องไล่ผีให้เหรอ"
        reply: "มันร้องอีกสามที แล้วเงียบ ข้างนอกก็เงียบตาม… อาจบังเอิญ อาจไม่"
      - text: "เบาๆ หน่อย เดี๋ยวข้างนอกรู้ว่าบ้านนี้มีคน"
        reply: "มันหยุดร้องทันที แล้วคลานมาเกาะใกล้หัวนอนกว่าเดิม คืนนั้นหลับง่ายกว่าที่คิด"
  - text: "ไอ้จุกเกาะอยู่ข้างรูปยายบนผนัง หัวเอียงนิดๆ เหมือนกำลังฟังอะไรอยู่"
    options:
      - text: "คิดถึงยายเหมือนกันใช่ไหม"
        reply: "มันร้องเบาๆ หนึ่งที ไม่เหมือนทุกครั้ง แล้วเกาะอยู่ตรงนั้นทั้งคืน"
      - text: "ยายเคยดุเอ็งไหม"
        reply: "มันกะพริบตาสองที ป้าแต๋วเคยเล่าว่ายายบ่นมันทุกเช้า แต่ทุกคืนยายเปิดไฟหน้าบ้านทิ้งไว้ให้แมลงมาตอม"
  - text: "เพิ่งสังเกตว่าบนหัวไอ้จุกมีปุ่มนูนเล็กๆ เหมือนผมจุกเด็กสมัยก่อน"
    options:
      - text: "อ๋อ ชื่อไอ้จุกมาจากนี่เอง"
        reply: "มันร้องสองทีอย่างภาคภูมิ คงเป็นชื่อเดียวที่มันมี และมันชอบ"
      - text: "เปลี่ยนชื่อเป็นไอ้หนวดดีไหม"
        reply: "มันหันหลังให้ทั้งคืน ไม่ร้องสักที… ชื่อเดิมก็ได้ ชื่อเดิมก็ดี"
  - text: "ไอ้จุกจ้องซองเอกสารบริษัทที่วางอยู่บนโต๊ะไม่วางตา"
    when: { flag: story_thana_visit }
    options:
      - text: "อ่านออกเหรอ"
        reply: "มันคลานไปเกาะทับโลโก้หยดน้ำยิ้มพอดีทั้งตัว ยิ้มไม่เห็นแล้ว"
      - text: "อย่าไปเลอะนะ เอกสารสำคัญ"
        reply: "สายไปแล้ว… แต่ไม่ต้องห่วง หน้านั้นเป็นแค่หน้าโปรโมชันรูปคนยิ้มกับถังน้ำ"
      - text: "ช่วยตัดสินใจหน่อย ขายหรือไม่ขาย"
        reply: "มันร้องคี่หรือคู่ไม่รู้ เพราะร้องไปได้ครึ่งทางมันเห็นแมลงเม่าแล้วหายไปเลย ตัดสินใจเองนะ"
  - text: "หลานนั่งพิงฝาบ้าน เหนื่อยจนไม่อยากขยับ ไอ้จุกคลานลงมาเกาะต่ำกว่าปกติ ห่างแค่ศอกเดียว"
    options:
      - text: "วันนี้เหนื่อยจัง"
        reply: "มันไม่ร้อง แค่อยู่ตรงนั้น บางทีคนก็ต้องการแค่นั้น ตุ๊กแกคงรู้"
      - text: "อย่ามามองแบบสงสารนะ"
        reply: "มันร้องหนึ่งที ไม่ใช่เสียงสงสาร เป็นเสียงแบบ ‘ไปกินข้าวเถอะ’ ยายคงสอนมันมา"
  - text: "หลานถือสลากใบละร้อยเข้าบ้าน ไอ้จุกจ้องเขม็ง"
    when: { flag: bought_lottery }
    options:
      - text: "ช่วยเป่าให้ถูกทีนะ"
        reply: "ตุ๊กแก… สองที เลขท้ายในสลากไม่มีอะไรเกี่ยวกับสองเลย แต่ใจก็ฟูขึ้นนิดนึง"
      - text: "ร้องกี่ทีจะซื้อเลขนั้นงวดหน้า"
        reply: "มันเงียบทั้งคืน ตีเป็นเลขศูนย์… ป้าพรคงบอกว่าตุ๊กแกฉลาดกว่าลุงสมหมาย"
  - text: "ลูกแมวส้มจากหน้าวัดเดินสำรวจบ้าน ไอ้จุกเห็นแล้วไต่ขึ้นขื่อไปเงียบๆ"
    when: { flag: kitten_promise }
    options:
      - text: "ไม่ต้องกลัว น้องใหม่"
        reply: "มันร้องใส่แมวเจ็ดที แมวนั่งฟังจนจบ ทั้งคู่ตกลงแบ่งบ้านกันแบบไม่เป็นทางการ ข้างบนของจุก ข้างล่างของแมว"
      - text: "แมว จับมันเลย!"
        reply: "แมวมองขึ้นไป มองหลาน แล้วนอนต่อ ไอ้จุกร้องหนึ่งทีเหมือนหัวเราะ"
  - text: "ไอ้จุกเกาะอยู่บนมุ้ง ข้างนอกมุ้งยุงบินวนเป็นฝูง"
    options:
      - text: "กินยุงให้หมดเลยนะ"
        reply: "มันงับไปหนึ่งตัว ช้าๆ เหมือนลูกจ้างรายวันที่ไม่ได้ค่าโอที"
      - text: "ห้ามเข้ามาในมุ้งนะ"
        reply: "มันมองเหมือนเพิ่งได้ไอเดีย… แล้วก็ไม่เข้า แม่สั่งให้นอนในมุ้ง มุ้งนี้มีที่สำหรับคนเดียว"
  - text: "ป้าแต๋วแวะมาส่งแกง ยืนอยู่แค่หน้าประตู ชะโงกมองไอ้จุก"
    options:
      - text: "ป้ากลัวมันเหรอ{kq}"
        reply: "ป้าแต๋วว่า ‘ป้าไม่ได้กลัวตุ๊กแก ป้ากลัวมันร้องผิดจังหวะ’ ไอ้จุกร้องพอดีสามที ป้าวางแกงแล้วรีบกลับ"
      - text: "ป้านับให้หน่อยว่ามันร้องกี่ที"
        reply: "ป้าแต๋วนับได้ห้า หลานนับได้สี่ ไอ้จุกร้องเพิ่มอีกทีให้เท่ากัน ป้าเอาเลข 45 ไปบอกทั้งกลุ่มไลน์ก่อนเดินถึงบ้าน"
  - text: "ตีห้าครึ่ง ไอ้จุกร้องปลุกก่อนไก่บ้านข้างๆ"
    when: { time: morning }
    options:
      - text: "ไก่ยังตื่นสายเลยนะ"
        reply: "ยายเขียนไว้ว่าที่นี่ไม่มีใครรีบ ไก่ยังตื่นสาย… ยายไม่ได้เขียนถึงไอ้จุก มันคงเป็นข้อยกเว้น"
      - text: "ขออีกห้านาที"
        reply: "มันร้องอีกห้าที ทีละนาที แม่นกว่านาฬิกาปลุกที่ห้องเช่าในกรุงเทพฯ ที่เคยกดเลื่อนวันละสิบรอบ"
  - text: "หลานนั่งดูรูปห้องเช่าเก่าในโทรศัพท์ ไอ้จุกเกาะเงียบอยู่ข้างจอ"
    options:
      - text: "ถ้า{p}กลับกรุงเทพฯ จะคิดถึงไหม"
        reply: "มันร้องยาวที่สุดเท่าที่เคยได้ยิน นับไม่ทัน… คงแปลว่า ‘ไม่รู้ แต่อย่าเพิ่ง’"
      - text: "ห้องนั้นไม่มีตุ๊กแกนะ"
        reply: "มันมองจอ มองหลาน แล้วคลานไปเกาะทับรูปห้องเช่าพอดี เหมือนจะบอกว่า ‘งั้นที่นั่นก็ไม่มีใครรอ’"
      - text: "ไม่กลับหรอก"
        reply: "ตุ๊กแก! ทีเดียว ดังฟังชัด แล้วไปหาแมลงกินต่อเหมือนไม่มีอะไรเกิดขึ้น"
