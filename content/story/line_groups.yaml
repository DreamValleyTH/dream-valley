      - id: ws_d19_alone
        day_min: 19
        time: "01:15"
        from: may
        when: { flag: may_went_alone }
        text: "ไปคนเดียวมา กระบะจี้ท้าย ล้มรถ เข่าแตกนิดหน่อย รูปเบลอทุกรูป ไม่มีใครถือไฟฉาย… ไม่ได้ว่าใครนะ แค่จดไว้"
        replies:
          - { from: kla, text: "ผมขอโทษครับ ผมควรไปด้วย" }
          - { from: sathian, text: "ทะเบียนอะไร ดาบจะ… ดาบจะไม่ลืม" }
          - { from: palm, text: "เราฝากยาแดงกับผ้าก๊อซไว้ที่ร้านตั้มแล้วนะ ไปเอาด้วย" }
          - { from: tam, text: "มีกาแฟกระป๋องแถมให้ครับ ผมจ่ายเองครับ" }
      - id: ws_d20_lawyer
        day_min: 20
        time: "11:20"
        from: may
        when: { flag: story_may_threat }
        text: "ได้จดหมายทนายแล้ว คำว่า ‘รับผิดชอบ’ สามครั้งในหน้าเดียว เราว่าจะเอาไปทำที่รองแก้วกาแฟ"
        replies:
          - { from: palm, text: "เก็บไว้เถอะ อาจเป็นหลักฐาน" }
          - { from: may, text: "เก็บแล้ว รองแก้วก็เป็นหลักฐานได้" }
          - { from: kla, text: "สรุปเราต้องมีอะไรบ้างครับ" }
          - { from: may, text: "ตัวเลขปาล์ม รายชื่อกล้า รูปท่อ แล้วก็อีกอย่างนึงที่เรายังไม่รู้ว่าคืออะไร" }
      - id: ws_d20_cards
        day_min: 20
        time: "07:40"
        from: sathian
        when: { flag: story_funeral_huan }
        text: "งานศพตาหวลเมื่อคืน ดาบนั่งมองฟ้าแถววงไพ่ทั้งคืน ระหว่างนั้นได้ยินคนงานบริษัทคุยกันว่าปั๊มเครื่องที่สองเปิดหลังทุ่มครึ่งเท่านั้น ดาบไม่ได้แอบฟังนะ ดาบมองฟ้า หูมันอยู่ข้างหัว"
        replies:
          - { from: may, text: "ดาบคะ… นี่คือข้อมูลที่ดีที่สุดของอาทิตย์นี้" }
          - { from: sathian, text: "ดาบรู้ ดาบเลยไม่บอกใครนอกจากกลุ่มนี้ ดาบไม่เห็นกลุ่มนี้" }
        like: sathian
      - id: ws_d21_bottle
        day_min: 21
        time: "21:00"
        from: palm
        when: { flag: story_meeting2 }
        text: "เอาน้ำขวดที่บริษัทแจกในศาลาไปตรวจแร่ธาตุแล้ว ตามหลักวิชาการเรียกว่า ‘ใกล้เคียงกับน้ำบ่อป้าแต๋วตอนยังไม่แห้งอย่างมีนัยสำคัญ’ ตามหลักบ้านๆ เรียกว่า ‘เอาน้ำป้าแต๋วมาขายคืนป้าแต๋ว’"
        replies:
          - { from: kla, text: "ผมไม่แปลกใจครับ ผมแค่… อยากแปลกใจบ้างครับ" }
          - { from: may, text: "พาดหัว: ‘น้ำดื่มฟรีที่ไม่ฟรี เพราะเราจ่ายไปก่อนแล้ว’" }
          - { from: tam, text: "น้ำยี่ห้อนั้นวางขายในร้านผมด้วยครับ ขวดละสิบบาทครับ" }
      - id: ws_d22_barcode
        day_min: 22
        time: "23:30"
        from: tam
        when: { flag: story_tanks_arrived }
        text: "ถังสีฟ้าทุกใบมีบาร์โค้ดครับ ผมเอาเครื่องยิงที่ร้านลองยิงดู ขึ้นว่า ‘ไม่พบสินค้า’ ครับ"
        replies:
          - { from: may, text: "แปลว่ามันไม่ได้มีไว้ขาย มันมีไว้นับ" }
          - { from: kla, text: "นับอะไรครับ" }
          - { from: may, text: "นับว่าบ้านไหนพึ่งเขาแล้ว" }
          - { from: sathian, text: "ถังที่ป้อมดาบเอาเทปดำปิดบาร์โค้ดไว้แล้ว ไม่ได้ทำอะไรผิด แค่เทปมันเหลือ" }
      - id: ws_d23_question
        day_min: 23
        time: "19:10"
        from: may
        when: { flag: story_tank_question }
        text: "ประโยค ‘ถังเป็นของบริษัท แล้วน้ำในถังเป็นของใคร’ เราอยากเอาไปขึ้นหัวข่าว ใครถามในศาลานะ"
        replies:
          - { from: kla, text: "{player}ถามครับ ผมนั่งอยู่ข้างๆ ครับ" }
          - { from: may, text: "งั้นเราจะใส่เครดิตว่า ‘ชาวบ้านคนหนึ่ง’ ปลอดภัยกว่า แต่เราจะจำไว้ว่าใคร" }
          - { from: palm, text: "ศาลาเงียบไปสามวินาทีเต็ม เราจับเวลาไว้ เงียบที่สุดตั้งแต่พัดลมหมุนกลับทาง" }
        like: may
      - id: ws_d26_posters
        day_min: 26
        time: "08:00"
        from: may
        when: { flag: story_posters }
        text: "ป้ายหาเสียงเต็มเสาไฟก่อนเปิดรับสมัคร ป้ายถนนไม่มีชื่อ มีแต่หยดน้ำยิ้มตัวเล็กมุมขวาล่าง ใครผ่านถ่ายเก็บไว้ทุกแผ่นนะ"
        replies:
          - { from: palm, text: "เรานับได้ 41 แผ่น ตั้งแต่หน้า อบต. ถึงหน้าลานเฮีย" }
          - { from: tam, text: "เมื่อคืนตีสองมีคนมาซื้อกาวร้อนสามสิบหลอดครับ เปิดบิลชื่อ ‘ทั่วไป’ ครับ" }
          - { from: kla, text: "ผมไม่ลงครับ… ยังครับ" }
          - { from: may, text: "จดคำว่า ‘ยัง’ ตัวใหญ่ไว้แล้วนะ" }
      - id: ws_d27_contract
        day_min: 27
        time: "22:40"
        from: may
        when: { flag: story_guarantee_known }
        text: "{player}เล่าเรื่องสัญญาค้ำประกันประปาหมู่บ้านปี 39 ให้ฟังแล้ว นี่แหละ ‘อีกอย่างที่ยังไม่รู้’ ของเรา"
        replies:
          - { from: kla, text: "เขาไม่ได้อยากซื้อที่ครับ เขาอยากซื้อสัญญา" }
          - { from: palm, text: "เราจะไปค้นทะเบียนกองทุนที่ อบต. ตู้ที่สามมีแฟ้มปี 39 ถ้าตู้ยังไม่ ‘อยู่ระหว่างการค้นหา’ นะ" }
          - { from: sathian, text: "ชื่อพยานที่ถูกขีดทับ ดาบพอเดาได้ แต่ดาบยังไม่เห็น ดาบขอไม่เห็นไปอีกสักพัก" }
          - { from: may, text: "ไม่เป็นไรค่ะดาบ คราวนี้เราจะไปด้วยกันทั้งหกคน" }
        like: may
      - id: ws_d27_hint
        day_min: 27
        time: "22:40"
        from: may
        when: { flag: story_guarantee_hint }
        text: "ผู้ใหญ่สมศักดิ์บอก{player}ว่ายายเพียรเคยเซ็นค้ำประกันอะไรบางอย่างไว้กับตำบล สัญญายังไม่ปิด… เราต้องหาตัวจริงให้เจอ"
        replies:
          - { from: kla, text: "ถ้าสัญญายังไม่ปิด ใครถือหนี้ก็มีสิทธิ์ในที่ดินครับ… นี่อาจเป็นเหตุผลที่ราคาขึ้นไวครับ" }
          - { from: palm, text: "เราจะไปค้นแฟ้มที่ อบต. ให้ ถ้าเจอแต่ป้าย เราจะถ่ายรูปป้ายมาให้" }
          - { from: sathian, text: "ดาบจะไปถามผู้ใหญ่อีกที… พรุ่งนี้นะ ไม่ใช่ ดาบจะไปวันนี้" }
      - id: ws_d28_month
        day_min: 28
        time: "23:55"
        from: may
        text: "จบเดือนแรกแล้ว เรายังไม่โดนฟ้อง ยังไม่โดนรถชน ยังไม่โดนผีจับ นับเป็นความสำเร็จของสื่ออิสระ"
        replies:
          - { from: tam, text: "ผมยังไม่ได้ขึ้นเงินเดือนครับ นับเป็นความสม่ำเสมอของภาคเอกชนครับ" }
          - { from: palm, text: "ป้ายโครงการศึกษายังตั้งอยู่ นับเป็นผลงานชิ้นเดียวในตำบลที่ทนแดดทนฝน" }
          - { from: sathian, text: "ดาบยังไม่เห็นอะไรเลยทั้งเดือน นับเป็นความสามารถเฉพาะตัว" }
          - { from: kla, text: "ผมนับว่าเรายังมีห้าคน… หกคนครับ" }
        like: may

  # ===========================================================================
  # 6. ธารใส ❤ ชุมชนสัมพันธ์ — กลุ่มบริษัท (ธนา)
  # ===========================================================================
  - id: company_csr
    name: "ธารใส ❤ ชุมชนสัมพันธ์"
    avatar: thana
    members: [thana, wichai, heng, praew, prasert, taew, porn, may, somsak]
    unlock_when: { flag: story_thana_visit }
    invite:
      npc: thana
      heart_min: 3
      text: "คุณ{player}ครับ ผมขออนุญาตเชิญเข้ากลุ่ม Community Relations ของบริษัทนะครับ เป็นช่องทาง two-way communication รับ feedback จากชุมชนแบบ real-time ครับ… กลุ่มเงียบไปหน่อยครับ แต่เราอยาก engage มากๆ ครับ 😊"
      accept: "เข้าก็ได้{k} {p}ขอดูเฉยๆ"
      decline: "ไม่ดีกว่า{k} บ่อ{p}ให้ feedback ทุกวันอยู่แล้ว"
    welcome:
      - { from: thana, text: "ยินดีต้อนรับคุณ{player}สู่ครอบครัวธารใสครับ 💧❤ สมาชิกครบสิบท่านแล้ว เท่ากับ KPI ไตรมาสนี้พอดีครับ 🎉" }
      - { from: porn, text: "ครอบครัวไหน ป้ามีครอบครัวแล้ว ครอบครัวป้ามีตาแก่คนเดียวก็พอแล้ว" }
      - { from: may, text: "ยินดีต้อนรับค่ะ กลุ่มนี้เราอ่านทุกข้อความ เขาก็อ่านทุกข้อความ" }
      - { from: thana, text: "เรายินดีกับทุกการมีส่วนร่วมครับ 🙏✨" }
    posts:
      - id: csr_d05_easy
        day_min: 5
        time: "08:00"
        from: thana
        text: "Good morning ครับพี่น้องดงเย็น 🌞 วันนี้ทีมเราลงพื้นที่พูดคุยกับเจ้าของที่ดินด้วยความเคารพครับ ทุกอย่างจะง่ายขึ้นสำหรับทุกคนครับ 💧"
        sticker: "💧😊 ขอบคุณที่ไว้วางใจ 😊💧"
        replies:
          - { from: porn, text: "ง่ายขึ้นสำหรับใครก่อน" }
          - { from: thana, text: "สำหรับทุกคนพร้อมกันครับ win-win ครับ 🙏" }
          - { from: heng, text: "win ใครบ้าง เฮียนับได้คนเดียว ฮ่าๆ" }
      - id: csr_d06_trees
        day_min: 6
        time: "17:00"
        from: thana
        text: "ขอบคุณทุกท่านที่ร่วม Green Community Day ครับ ปลูกต้นไม้ได้ 100 ต้น 🌱🌳 [รูปภาพ 37 รูป]"
        replies:
          - { from: taew, text: "ป้าเห็นตัวเองในรูปที่ 12 แต่ป้าไม่ได้ไปนะจ๊ะ" }
          - { from: thana, text: "เป็นภาพประกอบครับป้า 🙏" }
          - { from: may, text: "ต้นไม้ 100 ต้นปลูกในกระถาง ถ่ายรูปเสร็จขนกลับขึ้นรถไป 60 ต้น เราถ่ายไว้ค่ะ" }
          - { from: thana, text: "ต้นไม้บางส่วนถูก relocate ไปยัง site ที่เหมาะสมครับ" }
          - { from: porn, text: "site ไหน ร้านต้นไม้ในอำเภอเหรอ" }
      - id: csr_d06_refused
        day_min: 6
        time: "12:00"
        from: thana
        when: { flag: thana_refused }
        text: "บริษัทเคารพทุกการตัดสินใจของเจ้าของที่ดินครับ ประตูของเราเปิดเสมอครับ 🚪❤"
        replies:
          - { from: heng, text: "ประตูเปิด แต่รั้วสูงสามเมตร ฮ่าๆ" }
          - { from: taew, text: "ประตูเปิดก็ดีจ้ะ แต่หลานเขาปิดแล้ว ป้าไม่ได้พูดนะ" }
          - { from: thana, text: "เรามองว่าเป็นการ pause ครับ ไม่ใช่ stop ครับ 😊" }
      - id: csr_d06_haggled
        day_min: 6
        time: "12:00"
        from: thana
        when: { flag: thana_haggled }
        text: "ขอบคุณสำหรับ open dialogue กับเจ้าของที่ดินครับ การต่อรองคือสัญญาณของ partnership ที่ดีครับ 🤝"
        replies:
          - { from: porn, text: "ต่อรองได้ แปลว่าราคาแรกกดไว้" }
          - { from: thana, text: "เราเรียกว่า room for growth ครับ" }
          - { from: heng, text: "เฮียเรียกว่ากำไรเผื่อต่อ ฮ่าๆ เราพูดภาษาเดียวกันนะคุณธนา" }
      - id: csr_d07_snack
        day_min: 7
        time: "18:00"
        from: wichai
        when: { flag: story_meeting1 }
        text: "ขอบคุณบริษัทที่ให้การสนับสนุนขนมในการประชุมประชาคมครับ เป็นการบูรณาการภาครัฐและภาคเอกชนอย่างเป็นรูปธรรมครับ"
        replies:
          - { from: thana, text: "ด้วยความยินดีครับ ขนมชั้นสีเขียวสื่อถึง sustainability ครับ 🌿" }
          - { from: taew, text: "ป้านึกว่าสีใบเตย" }
          - { from: prasert, text: "กำนันกินไปสามชิ้น หลับตาฟังไปหนึ่งรอบ ขนมดีโว้ย" }
          - { from: "รักดงเย็น2569", text: "ประชุมดีมากครับ บริษัทดีครับ ถนนดีครับ" }
          - { from: porn, text: "แกเข้ามาในกลุ่มนี้ได้ยังไง" }
          - { from: thana, text: "ทุกท่านเป็น stakeholder ครับ 🙏" }
      - id: csr_d09_ribbon
        day_min: 9
        time: "10:30"
        from: wichai
        when: { flag: story_sign_up }
        text: "ขอเชิญทุกท่านร่วมพิธีเปิดป้ายโครงการศึกษาความเป็นไปได้ครับ เป็นก้าวแรกของการขับเคลื่อนครับ"
        replies:
          - { from: thana, text: "บริษัทร่วมสนับสนุนริบบิ้นครับ ✂️🎀" }
          - { from: may, text: "ป้ายหมื่นห้า ริบบิ้นเท่าไหร่คะ" }
          - { from: thana, text: "ริบบิ้นเป็น in-kind contribution ครับ" }
          - { from: praew, text: "แพรวไลฟ์ให้แล้วนะคะ ยอดวิว 12 ขอบคุณทุกคนค่ะ" }
          - { from: prasert, text: "กำนันดูอยู่ ดูสองเครื่อง" }
      - id: csr_d09_backup
        day_min: 9
        time: "20:15"
        from: thana
        when: { flag: story_power_out }
        text: "แจ้งเพื่อทราบครับ ไซต์งานของเรามีระบบไฟสำรองเพื่อความปลอดภัยของชุมชนครับ 💡🛡️"
        replies:
          - { from: taew, text: "ปั๊มก็ปลอดภัยดีนะจ๊ะ ป้าได้ยินเสียงมันทั้งคืน ตอนบ้านป้ามืด" }
          - { from: thana, text: "ขอบคุณที่ใส่ใจครับป้า ❤" }
          - { from: somsak, text: "ไฟสำรองแบ่งมาหอกระจายข่าวได้ไหม ผู้ใหญ่จะได้ประกาศว่าไฟดับ ย้ำอีกครั้งนะ ประกาศว่าไฟดับ" }
      - id: csr_d11_season
        day_min: 11
        time: "09:00"
        from: thana
        when: { flag: story_well_dry }
        text: "บริษัทขอส่งกำลังใจให้ครัวเรือนที่ประสบปัญหาน้ำบ่อลดลงจากภาวะแล้งตามฤดูกาลครับ 🙏💧"
        replies:
          - { from: porn, text: "ฝนตกวันที่สี่นะ" }
          - { from: thana, text: "ฤดูกาลมีความซับซ้อนครับ" }
          - { from: heng, text: "เฮียขายปั๊มได้สามตัว ขอบคุณฤดูกาลครับ ฮ่าๆ" }
          - { from: may, text: "ฤดูกาลนี้มีใบอนุญาตสูบวันละกี่คิวคะ" }
          - { from: thana, text: "🙏" }
        sticker: "🙏 ขอบคุณที่ติดตามค่ะ 🙏"
      - id: csr_d15_hiring
        day_min: 15
        time: "13:00"
        from: thana
        when: { flag: story_ghost_rumor }
        text: "📢 We’re hiring! เปิดรับพนักงานรักษาความปลอดภัย 30 อัตรา ทำงานกะกลางคืน สวัสดิการดี มีผ้ายันต์ให้ครับ 🙏"
        replies:
          - { from: may, text: "ลาออกสามคน รับใหม่สามสิบ ผู้หญิงบนท่อต้องทำงานหนักขึ้นสิบเท่า" }
          - { from: porn, text: "ผ้ายันต์เช่าจากวัดเราหรือเปล่า ลุงจำรัสจดชื่อผู้เช่าไว้ทุกผืนนะ" }
          - { from: thana, text: "เราสนับสนุนวิสาหกิจชุมชนครับ ❤" }
          - { from: taew, text: "ป้าว่าไม่มีคนในตำบลไปสมัครหรอก ค่าแรงเท่าไหร่ก็ไม่ไป" }
      - id: csr_d18_renew
        day_min: 18
        time: "11:00"
        from: thana
        text: "💡 Fun fact ครับ น้ำใต้ดินเป็นทรัพยากรหมุนเวียน เติมกลับได้ตามธรรมชาติครับ 🔄💧"
        replies:
          - { from: may, text: "ใช้เวลาเติมกลับกี่ปีคะ" }
          - { from: thana, text: "ขึ้นอยู่กับหลายปัจจัยครับ" }
          - { from: may, text: "ปัจจัยข้อแรกคือหยุดสูบหรือเปล่าคะ" }
          - { from: thana, text: "ขอบคุณสำหรับคำถามที่ดีมากครับ 🙏" }
          - { from: somsak, text: "กี่ปี ย้ำอีกครั้งนะ กี่ปี" }
      - id: csr_d20_savedate
        day_min: 20
        time: "09:00"
        from: thana
        when: { flag: story_meeting2_notice }
        text: "📣 Save the date! อาทิตย์ที่ 21 ขอเชิญพี่น้องทุกครัวเรือนร่วมงานเปิดตัวโครงการ ‘น้ำใจสู่ชุมชน’ ที่ศาลา มีของแจก ใหญ่มากครับ 🎁"
        replies:
          - { from: somsak, text: "ผู้ใหญ่ไม่ได้เชิญนะ บริษัทขอใช้ศาลา ย้ำอีกครั้งนะ บริษัทขอ" }
          - { from: taew, text: "ใหญ่แค่ไหนจ๊ะ ใส่มอไซค์กลับได้ไหม" }
