# =============================================================================
# Dream Valley — กลุ่ม LINE ย่อย (นอกเหนือจากกลุ่มหมู่บ้าน `village` ใน line.yaml)
# - ผู้เล่นเห็นเฉพาะกลุ่มที่เข้าแล้ว · กลุ่มเปิดเมื่อถึง unlock_when แล้วสุ่มเชิญตอนคุยกับ invite.npc
#   (หัวใจ ≥ heart_min) · ตอบรับ = เข้ากลุ่ม ขึ้น welcome แล้วเห็นโพสต์ที่ day_min ≤ วันนี้ (ย้อนหลังได้แบบ LINE จริง)
# - from: id ตัวละคร SPEC §3 หรือบัญชีชาวบ้านไม่มีชื่อ (เช่น "แม่โอ๊ต (ขนมครก)") / บัญชีอวตาร (รักดงเย็น2569)
# - posts[].when = เงื่อนไขธงเพิ่มเติม (ไม่บังคับ) รูปแบบเดียวกับ line.yaml · like = id ที่ได้หัวใจเมื่อผู้เล่นกดไลก์
# - time (ไม่บังคับ) เวลาโพสต์ · sticker (ไม่บังคับ) ข้อความสติกเกอร์แบบ line.yaml
# - day 1 = จันทร์ · หวยออกวันที่ 1, 16 · ตลาดนัดพุธ/เสาร์ · นกกลับบ้านวันที่ 6, 7, 13, 14, 20, 21, 27, 28
# =============================================================================
groups:

  # ===========================================================================
  # 1. อสม. / แม่บ้านคุยกัน
  # ===========================================================================
  - id: osm_aunties
    name: "อสม.ดงเย็น & แม่บ้านคุยกัน 🌺"
    avatar: taew
    members: [taew, porn, thongbai, hong, noi, ann, chan, bua]
    unlock_when: { day_min: 3, flag: story_town_intro }
    invite:
      npc: taew
      heart_min: 3
      text: "หลาน… ป้ามีอีกกลุ่มนึงนะ กลุ่มเล็กๆ แม่บ้านกับ อสม. คุยเรื่องสุขภาพ… เรื่องสุขภาพจริงๆ นะ บางทีก็มีเรื่องอื่นปนนิดหน่อย ป้าแอดให้ไหมจ๊ะ ห้ามแคปไปให้ใครดูนะหลาน"
      accept: "แอดเลย{k}ป้า {p}จะอ่านเงียบๆ"
      decline: "ไว้ก่อนนะ{kq}ป้า กลุ่มหมู่บ้าน{p}ยังอ่านไม่ทันเลย"
    welcome:
      - { from: taew, text: "หลานยายเพียรเข้ามาแล้วนะทุกคน 🌸 กลุ่มนี้ไม่ใช่กลุ่มนินทานะหลาน เป็นกลุ่มแลกเปลี่ยนข้อมูล" }
      - { from: porn, text: "ข้อมูลเรื่องคนอื่น" }
      - { from: ann, text: "ยินดีต้อนรับค่ะ ถ้าเห็นคลิปสุขภาพแปลกๆ ในกลุ่มนี้ แท็กแอนได้เลยนะคะ แอนตามแก้ทุกวันค่ะ 😊" }
      - { from: thongbai, text: "แหม เข้ามาก็ดีแล้ว พรุ่งนี้ครัววัดทำแกงฮังเล ใครว่างมาหั่นหมูนะหลาน หั่นเป็นไหม ไม่เป็นป้าสอน" }
    posts:
      - id: osm_d03_pandan
        day_min: 3
        time: "07:10"
        from: thongbai
        text: "ส่งต่อจากกลุ่มครัววัดอำเภอจ้ะ!! ต้มใบเตยดื่มแทนยาเบาหวาน ได้ผลใน 7 วัน หมอไม่อยากให้รู้!!"
        replies:
          - { from: ann, text: "ใบเตยหอมดีค่ะป้า ดื่มได้ค่ะ แต่ห้ามหยุดยาเบาหวานเองเด็ดขาดนะคะ ใครกินยาอยู่กินต่อนะคะ 🙏" }
          - { from: porn, text: "พี่ทองใบ เธอเป็นเบาหวานตั้งแต่เมื่อไหร่" }
          - { from: thongbai, text: "ไม่ได้เป็น ส่งเผื่อ" }
          - { from: noi, text: "ใบเตยพี่ใช้ทำน้ำซุปก็หอมนะ ไม่ต้องรอเป็นเบาหวานก็กินได้จ้ะ" }
        like: ann
      - id: osm_d04_early
        day_min: 4
        time: "06:05"
        from: taew
        text: "ป้าไม่ได้พูดนะ แต่หลานยายเพียรเปิดไฟครัวตั้งแต่ตีห้าครึ่ง ป้าเห็นตอนออกไปใส่บาตร ขยันเหมือนยายเลย 🥹"
        replies:
          - { from: porn, text: "แต๋ว บ้านแกห่างบ้านยายเพียรตั้งสามร้อยเมตร" }
          - { from: taew, text: "ป้าตาดี" }
          - { from: noi, text: "ตื่นเช้าแล้วกินข้าวเช้าด้วยนะน้อง พี่ฝากบอก ใครเห็นช่วยบอกที" }
          - { from: ann, text: "ตื่นเช้าดีค่ะ แต่ถ้านอนไม่พอก็งีบกลางวันได้นะคะ ไม่ผิดค่ะ" }
      - id: osm_d05_match
        day_min: 5
        time: "13:40"
        from: porn
        text: "ขอถามในกลุ่มนะ หลานยายเพียรยังโสดใช่ไหม ใครมีลูกหลานโสดๆ ส่งรายชื่อมา ป้าจะคัดเอง"
        replies:
          - { from: thongbai, text: "กล้าไง ขยัน ไม่ใช้ยา ผักไม่มีพิษ แต่พูดยาว" }
          - { from: hong, text: "บอลอู่รถก็ได้ยะ ซ่อมได้ทุกอย่าง ยกเว้นเรื่องของตัวเอง" }
          - { from: taew, text: "ครูเต้ยก็ดี นกก็น่ารัก ปาล์มก็เก่ง ให้หลานเลือกเองก็ได้ ป้าไม่เกี่ยง ป้าแค่ช่วยคัด" }
          - { from: ann, text: "ป้าๆ ให้เขาพักผ่อนก่อนนะคะ เพิ่งย้ายมาไม่ถึงอาทิตย์เองค่ะ" }
          - { from: porn, text: "พักไปด้วย คัดไปด้วย ไม่ขัดกันหมอ" }
      - id: osm_d06_refused
        day_min: 6
        time: "09:30"
        from: porn
        when: { flag: thana_refused }
        text: "ได้ข่าวว่าหลานยายเพียรไม่ขายที่ รถเก๋งบริษัทถอยออกไปล้อตกร่องหน้าบ้านด้วย ป้าขำจนเข็มทิ่มนิ้ว"
        replies:
          - { from: taew, text: "เหมือนยายเลย สมัยก่อนยายเพียรไล่เซลส์ขายหม้อด้วยไม้กวาดทางมะพร้าว" }
          - { from: hong, text: "เจ๊จำทะเบียนรถไว้แล้วยะ ไม่ต้องถามว่าทำไม" }
          - { from: chan, text: "ดินของบรรพบุรุษ บ่ขายแม่นแล้วลูกหลาน ข้อยภูมิใจแท้" }
        like: taew
      - id: osm_d06_haggled
        day_min: 6
        time: "09:30"
        from: porn
        when: { flag: thana_haggled }
        text: "ได้ข่าวว่าหลานยายเพียรต่อราคาบริษัท ป้าภูมิใจนะ ต่อเก่งกว่าตาแก่ต่อเจ๊หงษ์ตอนซื้อมะม่วง"
        replies:
          - { from: hong, text: "ลุงสมหมายไม่เคยต่อได้สักบาทย่ะ เขาแค่ยืนบ่นนาน" }
          - { from: taew, text: "ต่อได้แต่อย่าเพิ่งเซ็นนะหลาน ป้าไม่ได้พูด ยายเขียนไว้" }
      - id: osm_d06_maybe
        day_min: 6
        time: "10:15"
        from: thongbai
        when: { flag: thana_maybe }
        text: "หลานยังไม่ตอบบริษัทเหรอจ๊ะ คิดนานๆ ดีแล้ว แกงยังต้องเคี่ยว ใครรีบตักก่อนก็ได้แกงจืด"
        replies:
          - { from: porn, text: "จืด! พี่ทองใบพูดคำนี้ทุกเรื่องเลย" }
          - { from: noi, text: "ชิมก่อนแล้วค่อยเติมนะน้อง เรื่องที่ดินก็เหมือนกันจ้ะ" }
      - id: osm_d07_meeting
        day_min: 7
        time: "18:20"
        from: taew
        when: { flag: story_meeting1 }
        text: "สรุปประชุมให้คนไม่ได้ไปนะ: กำนันหลับ (ครั้งที่สามของปี ป้านับ) · นายกฯ พูดสิบห้านาที ป้าจดได้คำเดียวว่า ‘งบประมาณ’ · ขนมชั้นสีเขียว ไม่ค่อยหวาน"
        replies:
          - { from: porn, text: "ตาแก่ยกมือผิดรอบ ยกตอนเขานับถนน กลับบ้านบอกว่ายกเพราะคันหัว" }
          - { from: noi, text: "พี่ขายก๋วยเตี๋ยวหน้าศาลาได้สี่สิบชาม ประชุมยาวดีจ้ะ ขอให้ประชุมบ่อยๆ เนอะ" }
          - { from: ann, text: "ใครนั่งนานปวดหลัง นอนราบแล้วชันเข่ากอดเข่าสักห้านาทีก่อนนอนนะคะ" }
        like: taew
      - id: osm_d08_tiebreak
        day_min: 8
        time: "11:00"
        from: hong
        text: "ตกลงเสียงชี้ขาดเป็นของหลานยายเพียรจริงใช่ไหมยะ เจ๊ได้ยินมาจากสามคน สามเวอร์ชัน"
        replies:
          - { from: taew, text: "สี่สิบ สี่สิบ สี่สิบ แล้วหลานยกมือ ป้าเห็นกับตา… ป้านั่งหลังเสา แต่ป้าเห็น" }
          - { from: porn, text: "ได้มาแล้วครึ่งนึงไป ‘ศึกษาความเป็นไปได้’ ป้าศึกษามาห้าสิบปี ไม่เคยมีใครจ่ายป้าสักบาท" }
          - { from: thongbai, text: "เงินเจ็ดแสนห้า ทำข้าวต้มเลี้ยงพระได้กี่งาน ใครคิดเลขเก่งช่วยคิดที ป้าไม่กล้าคิด" }
      - id: osm_d09_powerout
