        replies:
          - { from: noi, text: "พี่เอาลูกชิ้นไปสามกิโล ละลายหมดแล้ว แกงลูกชิ้นได้ไหมป้า" }
          - { from: thongbai, text: "ได้ ใส่ใบกะเพราหน่อย ใครปรุงหม้อนี้ห้ามใส่ผงชูรสเกินช้อน" }
          - { from: taew, text: "ทำไมรั้วบริษัทยังสว่างอยู่ล่ะจ๊ะ… ป้าแค่ถาม ป้าไม่ได้พูด" }
