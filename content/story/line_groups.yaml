          - { from: porn, text: "สามสิบปีไม่เคยแห้ง บริษัทมาได้สามเดือนแห้งพอดี บังเอิญเนอะ" }
          - { from: hong, text: "เจ๊ไม่พูดยะ เจ๊ขายผลไม้… แต่ต้นมะม่วงเจ๊ก็ต้องกินน้ำนะ" }
          - { from: bua, text: "แต๋ว น้ำในบ่อเขาไม่ได้หาย เขาถูกเรียกไปที่อื่น เดี๋ยวยายเอาสายสิญจน์ไปผูกปากบ่อให้ (มิวพิมพ์ให้ยายค่ะ)" }
