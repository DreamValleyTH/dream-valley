  # ===========================================================================
  # 7. สภากาแฟเช้า
  # ===========================================================================
  - id: coffee_council
    name: "สภากาแฟเช้า ☕"
    avatar: prasert
    members: [prasert, somsak, sommai, phueak, cherd, jamrat, wichai, piak, daeng]
    unlock_when: { day_min: 5, flag: story_town_intro }
    invite:
      npc: sommai
      heart_min: 4
      text: "หลาน! พรุ่งนี้หกโมงครึ่งมานั่งโต๊ะหน้าร้านแต๋วไหม ไม่มาก็ได้ ลุงแอดเข้ากลุ่มสภากาแฟให้เลย กลุ่มนี้ทายฝนแม่นกว่ากรมอุตุฯ ทายหวยแม่นกว่า… ไม่แม่นหรอก แต่ทายทุกงวดเว้ย"
      accept: "แอดเลย{k}ลุง {p}ขอฟังเฉยๆ"
      decline: "ไว้ก่อน{k}ลุง {p}ยังตื่นไม่ทันหกโมงครึ่ง"
    welcome:
      - { from: prasert, text: "เด็กใหม่เข้ากลุ่มโว้ย หลานยายเพียร ทุกคนพิมพ์ดีๆ หน่อย ไม่ต้องดีมาก" }
      - { from: jamrat, text: "ยินดีต้อนรับหลาน กลุ่มนี้มีกติกา ใครเลี้ยงกาแฟลุงจดลงสมุด ใครค้างลุงจดหมึกแดง พ่อหลานยังค้างลุงสิบบาทนะ" }
      - { from: phueak, text: "เออ" }
      - { from: cherd, text: "ยินดีต้อนรับจ้ะ ลุงอ่านตอนรถจอดเท่านั้นนะ ขับรถไม่จับโทรศัพท์" }
    posts:
      - id: cf_d02_fare
        day_min: 2
        time: "06:40"
        from: cherd
        text: "เมื่อวานลุงรับหลานยายเพียรมาส่งปากทาง จ่ายค่ารถครบสามสิบ แบงก์ยับเหมือนแบงก์ยายเลย"
        replies:
          - { from: prasert, text: "ยายเพียรจ่ายค่ารถเป็นเหรียญทุกครั้ง นับตรงหน้าบันไดรถ ใครเร่งยายนับใหม่" }
          - { from: jamrat, text: "ยายเพียรทำบุญทุกวันพระ ยี่สิบบาท ไม่เคยขาด ลุงจดไว้สามสิบปี" }
          - { from: somsak, text: "หลานเขามาแล้ว พรุ่งนี้ผู้ใหญ่จะประกาศ ย้ำอีกครั้งนะ ประกาศพรุ่งนี้" }
          - { from: phueak, text: "เออ ยายเพียรเดินผ่านทุ่งทุกเช้า ทักไอ้ทุยก่อนทักตา" }
        like: cherd
      - id: cf_d05_chair
        day_min: 5
        time: "06:50"
        from: prasert
        text: "เช้านี้ใครนั่งเก้าอี้ตัวประจำกำนันวะ ตัวที่ขาโยกน่ะ"
        replies:
          - { from: piak, text: "พี่เปลี่ยนขาให้แล้วกำนัน ไม่โยกแล้ว ได้ฉากเป๊ะ" }
          - { from: prasert, text: "แล้วกำนันจะนั่งโยกยังไงวะ ใครขอให้ซ่อม" }
          - { from: jamrat, text: "ค่าขาเก้าอี้สามสิบบาท ลุงจดไว้ในบัญชีกาแฟแล้ว กำนันจ่ายนะ" }
      - id: cf_d06_rain
        day_min: 6
        time: "07:10"
        from: phueak
        text: "พรุ่งนี้ฝนไม่ตก ไอ้ทุยมันนอนกลางทุ่ง"
        replies:
          - { from: somsak, text: "ผู้ใหญ่ดูพยากรณ์ในทีวี ฝนตกหกสิบเปอร์เซ็นต์" }
          - { from: cherd, text: "ลุงเห็นมดขนไข่ขึ้นรถเมล์ ฝนตกแน่" }
          - { from: phueak, text: "มดมันขึ้นรถไปอำเภอ ไม่ได้หนีฝน" }
          - { from: daeng, text: "ข้าดูนกกางเขนดง มันร้องตอนบ่าย ฝนไม่มา ไอ้ทุยถูก" }
      - id: cf_d07_hands
        day_min: 7
        time: "18:50"
        from: somsak
        when: { flag: story_meeting1 }
        text: "ผู้ใหญ่นับมือได้สามรอบ สามตัวเลข จะนับใหม่ที่บ้าน ใครจำได้ว่ายกมือกี่ข้างส่งมาบอกผู้ใหญ่ด้วย ย้ำอีกครั้งนะ กี่ข้าง"
        replies:
          - { from: phueak, text: "ข้างเดียว ปีนี้ข้างเดียว" }
          - { from: sommai, text: "ลุงยกสองรอบ รอบนึงยกเพราะยุงกัด" }
          - { from: prasert, text: "กำนันไม่ได้ยก กำนัน… หลับตาฟังอยู่" }
          - { from: wichai, text: "ขอบคุณทุกท่านที่มีส่วนร่วมในกระบวนการประชาธิปไตยครับ" }
          - { from: piak, text: "นายกฯ ครับ ตกลงผลออกอะไรครับ" }
          - { from: wichai, text: "ผลอยู่ระหว่างการรวบรวมครับ" }
      - id: cf_d08_road
        day_min: 8
        time: "07:00"
        from: piak
        when: { flag: meeting1_result_road }
        text: "ถนนแปดร้อยเมตร ผู้รับเหมาเป็นน้องภรรยานายกฯ พี่ไม่ได้ว่าอะไรนะ พี่แค่ไม่ได้งาน"
        replies:
          - { from: wichai, text: "การจัดจ้างเป็นไปตามระเบียบทุกขั้นตอนครับ" }
          - { from: piak, text: "ระเบียบไหนครับ ระเบียบบ้านนายกฯ หรือเปล่าครับ" }
          - { from: prasert, text: "เปี๊ยก ใจเย็นโว้ย กินกาแฟก่อน" }
          - { from: daeng, text: "ถนนจากหน้าลานถึงหลังลาน ข้าเดินสามสิบก้าวก็สุดแล้ว" }
      - id: cf_d08_water
        day_min: 8
        time: "07:00"
        from: daeng
        when: { flag: meeting1_result_water }
        text: "บ่อตื้นสิบห้าบ่อ ดีกว่าป้าย ข้าเห็นด้วยกับไอ้กล้ามันเว้ย"
        replies:
          - { from: sommai, text: "ลุงจะไปช่วยขุด ถ้าขุดเจอลอตเตอรี่เก่าลุงยกให้สหกรณ์" }
          - { from: piak, text: "ขอบปูนบ่อพี่ทำให้ ราคาช่างวัด แต่ไม่ฟรีนะ บ่อไม่ใช่วัด" }
          - { from: wichai, text: "อบต. จะเร่งรัดให้เป็นรูปธรรมโดยเร็วครับ หลังการศึกษาครับ" }
      - id: cf_d08_market
        day_min: 8
        time: "07:00"
        from: prasert
        when: { flag: meeting1_result_market }
        text: "ตลาดหลังคาครึ่งเดียว ฝั่งไม่มีหลังคากำนันจะเอากรงไก่ไปตั้งโชว์ ไก่สวยงามชอบแดดโว้ย"
        replies:
          - { from: somsak, text: "ฝั่งตะวันออกมีวิถีชีวิต… ผู้ใหญ่ไม่ได้คิดคำนี้นะ นายกฯ คิด" }
          - { from: wichai, text: "เป็นการออกแบบที่ผสานวัฒนธรรมกับธรรมชาติครับ" }
          - { from: cherd, text: "ฝนตกฝั่งตะวันออก ลุงจะจอดรถเมล์ให้แม่ค้าหลบได้นะ จอดได้สิบนาที รถลุงต้องออกตรงเวลา" }
      - id: cf_d09_ledger
        day_min: 9
        time: "06:30"
        from: jamrat
        text: "บัญชีกาแฟสัปดาห์นี้ กำนันค้าง 45 บาท ช่างเปี๊ยกค้าง 30 ลุงเชิดจ่ายครบ ผู้ใหญ่จ่ายเกินห้าบาท ลุงทอนเป็นเหรียญบาทใส่ซองไว้ให้แล้ว"
        replies:
          - { from: prasert, text: "เอาไปห้าสิบเลยโว้ย ไม่ต้องทอน" }
          - { from: jamrat, text: "ลุงทอนทุกบาท ความโปร่งใสต้องมีเงินทอน" }
          - { from: somsak, text: "ห้าบาทของผู้ใหญ่ ใส่ตู้บริจาคไปเลย ย้ำอีกครั้งนะ ตู้บริจาค" }
          - { from: jamrat, text: "ลุงจดว่า ‘ผู้ใหญ่บริจาคเงินทอน 5 บาท’ เรียบร้อย" }
        like: jamrat
      - id: cf_d10_wells
        day_min: 10
        time: "06:45"
        from: sommai
        when: { flag: story_well_dry }
        text: "บ่อแต๋วแห้งแล้ว บ่อลุงยังเหลือครึ่งบ่อ ลุงฟังเสียงตอนตักได้เลข 47"
        replies:
          - { from: phueak, text: "บ่อข้ายังดี ควายกินก่อนคน" }
          - { from: daeng, text: "น้ำในป่าก็ลด ห้วยหลังเขาเหลือแค่หัวเข่า ข้าเดินมาสี่สิบปี ไม่เคยต่ำกว่าเอว" }
          - { from: prasert, text: "…บริษัทเขาก็ชวนกำนันไปกินข้าว" }
          - { from: somsak, text: "กินไปกี่ครั้ง" }
          - { from: prasert, text: "ครั้งเดียว… สองครั้งโว้ย" }
      - id: cf_d14_tickets
        day_min: 14
        time: "06:35"
        from: sommai
        text: "งวดวันที่ 16 ใครจะซื้อสลาก ใบละร้อยที่แผงเจ๊หงษ์ ลุงเหมาเลข 02 มาห้าใบแล้ว บ่อพูด"
        replies:
          - { from: cherd, text: "ทะเบียนเจ้าเขียวลงท้าย 16 ตรงกับวันหวยออกพอดี ลุงไม่ซื้อนะ ลุงแค่บอก" }
          - { from: jamrat, text: "เซียมซีที่วัดคนเขย่าได้ใบที่ 3 ทั้งอาทิตย์ ลุงจดไว้ ไม่ได้ให้เลขนะ ลุงจดเฉยๆ" }
          - { from: somsak, text: "ผู้ใหญ่ไม่เล่นหวย ผู้ใหญ่แค่อยากรู้ว่าเลขอะไร ย้ำอีกครั้งนะ แค่อยากรู้" }
          - { from: wichai, text: "ผมขอไม่แสดงความคิดเห็นในส่วนของตัวเลขครับ" }
      - id: cf_d15_bus
        day_min: 15
        time: "19:20"
        from: cherd
        when: { flag: story_ghost_rumor }
        text: "เที่ยวหกโมงเย็นมีคนงานบริษัทขึ้นรถลุงสามคน ลาออกกลับบ้าน ไม่พูดกันสักคำ จ่ายค่ารถเกินแล้วไม่เอาเงินทอน"
        replies:
          - { from: daeng, text: "ป่ามันรู้ น้ำมันรู้ ข้าบอกแล้ว" }
          - { from: phueak, text: "ควายไม่ยอมเดินผ่านรั้วบริษัทสามวันแล้ว ไอ้ทุยดึงเชือกจนตาล้ม" }
          - { from: jamrat, text: "เงินทอนที่เขาไม่เอา ลุงเชิดเอามาใส่ตู้วัดนะ ลุงจะจดว่า ‘ทำบุญให้แม่หญิง’" }
          - { from: cherd, text: "ได้จ้ะ ลุงเอาไปให้พรุ่งนี้เที่ยวหกโมงเช้า" }
      - id: cf_d16_result
        day_min: 16
        time: "16:10"
        from: jamrat
        text: "ออก 03 ลุงไม่ได้ซื้อ ลุงแค่จดถูก"
        replies:
          - { from: sommai, text: "02!!! ห่างไปหนึ่งเดียว บ่อมันคอแห้ง พูดไม่ชัด" }
          - { from: cherd, text: "16 ไม่ออก เจ้าเขียวไม่ว่าอะไร มันเป็นรถ" }
          - { from: prasert, text: "เมื่อเช้าไก่กำนันจิกข้าวเป็นเลข 30 กลับหัวก็ 03 กำนันไม่ได้ซื้อเพราะไม่เชื่อไก่… ทีหลังจะเชื่อ" }
          - { from: phueak, text: "เออ" }
      - id: cf_d17_dogs
        day_min: 17
        time: "06:20"
        from: somsak
        when: { flag: story_dogs_17 }
        text: "หมาหอนพร้อมกันเมื่อคืน ปีก่อนหมาหอนก่อนเลือกตั้งสามวัน ผู้ใหญ่ไม่ได้ใบ้อะไรนะ ย้ำอีกครั้งนะ ไม่ได้ใบ้"
        replies:
          - { from: sommai, text: "ซองปีก่อนสามร้อย ปีนี้จะขึ้นไหมวะ" }
          - { from: prasert, text: "สมหมาย ระวังปากในกลุ่มหน่อยโว้ย นายกฯ อยู่" }
          - { from: wichai, text: "ผมไม่ได้อ่านครับ" }
          - { from: piak, text: "นายกฯ ตอบแล้วครับ" }
      - id: cf_d19_huan
        day_min: 19
        time: "12:00"
        from: cherd
        when: { flag: story_funeral_huan }
        text: "ตาหวลขึ้นรถลุงทุกวันพระ นั่งแถวสามข้างยายเพียร ตีกลองบนตักไปตลอดทาง… เที่ยวเย็นนี้ลุงจะจอดหน้าวัดนานหน่อยนะ"
        replies:
          - { from: phueak, text: "เออ" }
          - { from: jamrat, text: "ซองงานตาหวล ลุงจดครบทุกซอง จะไม่บอกใครว่าใครใส่เท่าไหร่ ลุงจดเฉยๆ" }
          - { from: daeng, text: "ข้าตีกลองยาวกับมันครั้งสุดท้ายตอนงานบวชลูกผู้ใหญ่… นานแล้ว" }
          - { from: somsak, text: "ยี่สิบสองปีแล้ว ผู้ใหญ่จำได้ ตาหวลตีจนมือพอง" }
        like: cherd
      - id: cf_d21_cement
        day_min: 21
        time: "19:30"
        from: piak
        when: { flag: story_meeting2 }
        text: "ถังสองพันลิตรต้องเทฐานปูนนะ ไม่งั้นทรุด บริษัทไม่เทให้ ใครจะเทพี่คิดค่าแรงครึ่งราคา บ้านไหนไม่รับถังพี่เทฟรี… ไม่ใช่ เทได้แต่ไม่มีถังจะวาง"
        replies:
          - { from: prasert, text: "กำนันรับมาสองใบ ใบนึงใส่น้ำ อีกใบใส่ความลังเลไว้ก่อน" }
          - { from: somsak, text: "ผู้ใหญ่ไม่รับ ผู้ใหญ่มีโอ่งมังกรที่ยายเพียรยกให้ตั้งแต่ปีน้ำท่วม" }
          - { from: wichai, text: "อบต. ยินดีที่ภาคเอกชนเข้ามามีส่วนร่วมครับ" }
          - { from: daeng, text: "ภาคเอกชนมันเข้ามามีส่วนร่วมในห้วยข้าด้วย" }
      - id: cf_d22_barcode
        day_min: 22
        time: "07:15"
        from: sommai
        when: { flag: story_tanks_arrived }
        text: "ถังทุกใบมีบาร์โค้ด ถังลุงลงท้าย 58 ถังแม่พรลงท้าย 85 กลับหัวกันพอดี ฟ้าส่งมาแล้วเว้ย"
        replies:
          - { from: jamrat, text: "ลุงจดเลขถังทั้งหมู่ได้ 41 ใบ เลขที่ซ้ำมากที่สุดคือเลข 1 ไม่ได้ให้เลขนะ" }
          - { from: prasert, text: "สมหมาย ถังมันนับบ้านเรา เราก็นับถังมันคืน ยุติธรรมดีโว้ย" }
          - { from: cherd, text: "ถังวางหน้าบ้านริมถนนเยอะจนเจ้าเขียวต้องหักหลบ ลุงนับได้สิบเจ็ดโค้ง เมื่อก่อนมีสามโค้ง" }
      - id: cf_d25_retire
        day_min: 25
        time: "07:00"
        from: somsak
        when: { flag: story_election_announced }
        text: "ผู้ใหญ่จะไม่ลงสมัครแล้วนะ ขอบคุณที่ฟังผู้ใหญ่ย้ำมาสิบแปดปี"
        replies:
          - { from: prasert, text: "สมศักดิ์ อย่าเพิ่งพูดเหมือนคนจะตายสิโว้ย" }
          - { from: somsak, text: "ผู้ใหญ่เกษียณ ไม่ได้ตาย ย้ำอีกครั้งนะ… ไม่ได้ตาย" }
          - { from: cherd, text: "ลุงจะติดลำโพงในเจ้าเขียวให้ผู้ใหญ่ประกาศได้ทุกเที่ยวนะ ไม่คิดค่ารถ" }
          - { from: phueak, text: "แล้วใครจะลงแทน" }
          - { from: sommai, text: "หลานยายเพียรไง!" }
          - { from: wichai, text: "ทุกท่านมีสิทธิ์ลงสมัครตามกฎหมายครับ ผมสนับสนุนครับ โดยเฉพาะในส่วนของสิทธิ์ครับ" }
        like: somsak
      - id: cf_d26_posters
        day_min: 26
        time: "06:40"
        from: piak
        when: { flag: story_posters }
        text: "มีคนจ้างพี่ไปตอกป้ายหาเสียงตอนตีสอง พี่ไม่ไป ผีเยอะ แต่มีคนไปแทน ป้ายเอียงทุกแผ่น ไม่ได้ฉากสักแผ่น"
        replies:
          - { from: prasert, text: "ป้ายคุณนายพเยาว์ เสาไฟหน้าบ้านกำนันมีสามแผ่น ไก่กำนันเห็นแล้วไม่ยอมขันเลยโว้ย" }
          - { from: wichai, text: "ภรรยาผมมีความตั้งใจจะสานต่องานที่ยังไม่เสร็จครับ" }
          - { from: somsak, text: "งานไหนที่ยังไม่เสร็จ" }
          - { from: wichai, text: "หลายงานครับ ทุกงานครับ" }
          - { from: daeng, text: "งั้นก็สานต่อไปเรื่อยๆ ไม่ต้องเสร็จเลย" }
      - id: cf_d28_rain
        day_min: 28
        time: "06:30"
        from: phueak
        text: "ฝนจะมาอาทิตย์หน้า ไอ้ทุยมันเดินเข้าคอกเองแล้ว"
        replies:
          - { from: somsak, text: "ผู้ใหญ่จะประกาศตามไอ้ทุย ย้ำอีกครั้งนะ ตามไอ้ทุย" }
          - { from: cherd, text: "เมื่อวานรถแห่เปิดเพลงแรกแล้ว ดังกว่าแตรเจ้าเขียว ลุงไม่ยอม" }
          - { from: daeng, text: "ข้าจะเข้าป่าสามวัน ใครถามว่าข้าเลือกใคร บอกไปว่าข้าอยู่กับเจ้าป่า" }
          - { from: jamrat, text: "เดือนนี้บัญชีกาแฟปิดยอดได้ ไม่มีใครค้าง… นอกจากพ่อหลานยายเพียร สิบบาท ลุงไม่ลืม" }
        like: phueak
