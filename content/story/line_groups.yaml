          - { from: porn, text: "พวงหรีดนายกฯ ชื่อตัวโตกว่าชื่อตาหวลอีก ป้าขอยืมตลับเมตรปาล์มไปวัดแล้ว ใหญ่กว่าสองเท่า" }
          - { from: taew, text: "ใครใส่ซองเท่าไหร่ป้าไม่ถามนะ… ป้าเดาได้จากความหนา" }
          - { from: ann, text: "นั่งดึกระวังยุงนะคะ แอนเอายากันยุงไปวางไว้ที่โต๊ะครัวแล้วค่ะ" }
      - id: osm_d21_tanks
        day_min: 21
        time: "18:40"
        from: porn
        when: { flag: story_meeting2 }
        text: "ป้าจะเย็บปลอกผ้าถุงคลุมโลโก้ถังบริษัท ใครมีผ้าถุงเก่าส่งมา ป้าเย็บให้ฟรี ถังละผืน ไม่ฟรีสำหรับตาแก่"
        replies:
          - { from: taew, text: "ป้าเข้าข้างกะละมังนะ ป้าพูดในศาลาแล้ว ป้าพูดซ้ำในนี้อีกที กะละมัง" }
          - { from: hong, text: "ถังสองพันลิตร เจ๊ใส่ทุเรียนได้สองร้อยลูก… ไม่ได้คิดจะเอานะยะ คิดเฉยๆ" }
          - { from: noi, text: "น้ำในถังเอามาลวกเส้นได้ไหมนะ พี่ยังไม่กล้า ใครรู้บอกพี่ที" }
          - { from: ann, text: "ใครรับถังแล้ว เดี๋ยวแอนไปตรวจคลอรีนให้ทีละบ้านนะคะ ก่อนดื่มค่ะ" }
      - id: osm_d22_taken
        day_min: 22
        time: "08:10"
        from: taew
        when: { flag: story_tank_taken }
        text: "หลานยายเพียรรับถังมาแล้วนะ ไม่เป็นไรนะหลาน น้ำก็คือน้ำ ป้าเข้าใจ ป้าไม่ได้พูดอะไรเลย"
        replies:
          - { from: porn, text: "ใบแรกป้าเย็บปลอกให้ฟรี ลายดอกพิกุล โลโก้จะได้ยิ้มอยู่ข้างในคนเดียว" }
          - { from: bua, text: "ใช้รดผักก็ได้จ้ะหลาน ผักไม่รู้หรอกว่าน้ำมาจากใคร คนต่างหากที่ต้องรู้ (มิวพิมพ์ให้ยายค่ะ)" }
      - id: osm_d24_sports
        day_min: 24
        time: "15:30"
        from: noi
        when: { flag: story_sports_day }
        text: "กีฬาสีวันนี้พี่เลี้ยงน้ำแดงเด็กทั้งโรงเรียนจ้ะ สามสิบสี่แก้ว ขาดหนึ่งแก้วเพราะพี่กินเอง"
        replies:
          - { from: thongbai, text: "ป้าห่อข้าวผัดใบตองไป นายกฯ กล่าวเปิดสี่สิบนาที ข้าวผัดเย็นหมด จืด!" }
          - { from: taew, text: "หลานยายเพียรวิ่งแทนพ่อน้องโอ๊ตด้วยนะ ป้าเชียร์จนเสียงหาย พรุ่งนี้ป้าขายของด้วยมือ" }
          - { from: ann, text: "วิ่งเสร็จดื่มน้ำเยอะๆ นะคะ ใครตะคริวกินมาที่ รพ.สต. ได้ค่ะ" }
        like: noi
      - id: osm_d27_wedding
        day_min: 27
        time: "14:00"
        from: chan
        text: "ข้อยทอผ้าซิ่นผืนใหม่ ลายนาคเกี้ยว เก็บไว้ให้ลูกหลานใส่ไปงานแต่ง… ไผสิแต่งก่อนกันน้อ"
        replies:
          - { from: porn, text: "หลานยายเพียรไงยาย" }
          - { from: taew, text: "ยังไม่มีคู่นะ ป้ายังคัดไม่เสร็จ รายชื่อยาวกว่าหน้าสมุดเครดิตป้าอีก" }
          - { from: noi, text: "ให้น้องเขากินข้าวครบมื้อก่อนเถอะ แต่งทีหลังได้ เนอะ" }
          - { from: chan, text: "บ่เป็นหยัง ผ้าซิ่นข้อยรอได้ เส้นด้ายบ่เคยรีบ" }
        like: chan

  # ===========================================================================
  # 2. สหกรณ์ผักอินทรีย์ (กล้า)
  # ===========================================================================
  - id: coop_organic
    name: "สหกรณ์ผักอินทรีย์ดงเย็น 🥬"
    avatar: kla
    members: [kla, palm, sommai, porn, phueak, thongbai, noi, chan, toey]
    unlock_when: { day_min: 4, flag: met_kla }
    invite:
      npc: kla
      heart_min: 3
      text: "ลองคิดดูนะครับ… คุณ{player}ปลูกผักอยู่แล้ว ถ้าเข้ากลุ่มสหกรณ์ จะเห็นราคารับซื้อก่อนลานเสี่ยหนึ่งวัน ผมแอดให้นะครับ ไม่มีค่าสมัคร มีแต่ค่าน้ำใจ… ขอโทษครับ ผมเทศน์อีกแล้ว"
      accept: "แอดเลย{k} {p}อยากรู้ราคาก่อนเฮีย"
      decline: "ขอดูก่อนนะ{kq} {p}ยังไม่พร้อมเป็นสมาชิก"
    welcome:
      - { from: kla, text: "ยินดีต้อนรับสมาชิกใหม่ครับ ตอนนี้กลุ่มเรามี 23 คน หุ้นละ 100 บาท ยังไม่ต้องซื้อนะครับ… ซื้อได้นะครับ" }
      - { from: palm, text: "กฎกลุ่มข้อหนึ่ง ห้ามส่งสติกเกอร์สวัสดีวันจันทร์เกินวันละอัน ข้อสอง ห้ามด่าเฮียในกลุ่ม ไปด่าข้างนอก ล้อเล่นๆ" }
      - { from: sommai, text: "ยินดีต้อนรับหลาน! ลุงเป็นสมาชิกเบอร์สามนะ ซื้อหุ้นไว้หุ้นนึง ยังไม่เคยได้ปันผลเลย" }
      - { from: kla, text: "ปีนี้ยังไม่มีกำไรครับลุง มีแต่ประสบการณ์ครับ" }
    posts:
      - id: coop_d04_price
        day_min: 4
        time: "06:30"
        from: kla
        text: "ราคารับซื้อสัปดาห์นี้ครับ พริกขี้หนู กก.ละ 80 · กะเพรา กก.ละ 40 · ผักบุ้ง กก.ละ 25 · ข้าวโพดหวานฝักละ 6 · ลานเสี่ยให้พริก 65 ผมไม่ได้เปรียบเทียบนะครับ ผมแค่วางไว้ข้างกัน"
        replies:
          - { from: porn, text: "วางข้างกันนี่แหละกล้า เขาเรียกว่าเปรียบเทียบ" }
          - { from: kla, text: "ครับป้า… งั้นผมเปรียบเทียบครับ" }
          - { from: palm, text: "ตามหลักวิชาการนะ ต่างกัน 15 บาท คือ 23 เปอร์เซ็นต์ ตามหลักบ้านๆ คือค่าก๋วยเตี๋ยวพี่หน่อยหนึ่งชาม" }
        like: kla
      - id: coop_d05_compost
        day_min: 5
        time: "16:00"
        from: palm
        text: "สูตรปุ๋ยหมักตามหลักวิชาการนะ ใบไม้แห้ง 3 ส่วน มูลสัตว์ 1 ส่วน รดน้ำให้ชื้นเหมือนผ้าบิดหมาด กลับกองทุกเจ็ดวัน ตามหลักบ้านๆ ไปขอขี้ควายตาเผือก ฟรี"
        replies:
          - { from: phueak, text: "ไม่ฟรีเว้ย ต้องมาตักเอง ไอ้ทุยมันไม่ส่งถึงบ้าน" }
          - { from: palm, text: "ค่าขนส่งแพงกว่าขี้อีก ล้อเล่นๆ" }
          - { from: phueak, text: "ไอ้ทุยขี้วันละสองกระสอบ ใครตักก่อนได้ก่อน มาเช้าได้อุ่นๆ" }
          - { from: thongbai, text: "ตาเผือก… ป้ากินข้าวอยู่" }
      - id: coop_d06_worm
        day_min: 6
        time: "12:10"
        from: thongbai
        text: "ผักบุ้งสหกรณ์ล็อตเมื่อวาน ครัววัดผัดไปสี่กระทะ มีหนอนคลานออกมาเดินบนขอบกระทะสองตัว เณรช่วยปล่อยลงดินไปแล้วจ้ะ"
        replies:
          - { from: kla, text: "ขอโทษครับป้า ล็อตหน้าผมจะล้างสามน้ำครับ" }
          - { from: thongbai, text: "ไม่ต้องขอโทษ หนอนมันคงดีใจที่ได้ออกจากกระทะเป็นๆ ป้าก็ดีใจที่มันไม่ได้อยู่ในปากป้า" }
          - { from: chan, text: "หนอนอยู่ได้ คนก็อยู่ได้ แม่นบ่ แสดงว่าผักบ่มียา" }
      - id: coop_d06_numbers
        day_min: 6
        time: "20:30"
        from: kla
        text: "พรุ่งนี้ประชุมประชาคม ใครว่างไปนั่งด้วยกันนะครับ ผมจะเสนอระบบน้ำ เตรียมตัวเลขมาสิบสองหน้าครับ"
        replies:
          - { from: palm, text: "สิบสองหน้า แค่นายกฯ พูดก็หมดเวลาแล้ว เตรียมให้เหลือหน้าเดียวเถอะ" }
          - { from: kla, text: "หน้าเดียวก็ได้ครับ ผมย่อตัวหนังสือลงได้ครับ" }
          - { from: porn, text: "ย่อแล้วป้าอ่านไม่ออกนะกล้า ป้าลืมแว่นทุกประชุม" }
          - { from: sommai, text: "ลุงไปแน่ มีขนม" }
      - id: coop_d07_vote
        day_min: 7
        time: "19:00"
        from: kla
        when: { flag: vote_water }
        text: "ขอบคุณทุกมือที่ยกให้ระบบน้ำนะครับ ผมนับเองด้วยครับ ได้ตัวเลขไม่ตรงกับผู้ใหญ่ แต่ผมเห็นทุกมือครับ"
        replies:
          - { from: palm, text: "เราก็นับ ได้อีกตัวเลขนึง รวมแล้วตำบลนี้มีสี่ตัวเลข ล้อเล่นๆ… ไม่ได้ล้อเล่น" }
          - { from: phueak, text: "ตายกข้างเดียว ปีนี้ข้างเดียว" }
        like: kla
      - id: coop_d08_water
        day_min: 8
        time: "17:30"
        from: kla
        when: { flag: meeting1_result_water }
        text: "ได้ระบบน้ำครับพี่น้อง ขอบคุณทุกเสียงครับ 🙏 …เหลือเจ็ดแสนห้า ผมคำนวณแล้ว ขุดบ่อตื้นได้ 15 บ่อ หรือศึกษาความเป็นไปได้ได้อีก 1 ครั้งครับ"
        replies:
          - { from: sommai, text: "เอาบ่อเถอะกล้า ศึกษาแล้วมันดื่มไม่ได้" }
          - { from: palm, text: "เราช่วยเขียนโครงการให้ หนาไม่เกินสามหน้า ตั้งใจให้นายกฯ อ่านจบ" }
          - { from: kla, text: "สามหน้าก็ยาวไปครับ นายกฯ อ่านแค่หน้าที่มีรูปครับ" }
        like: kla
      - id: coop_d08_road
        day_min: 8
        time: "17:30"
        from: kla
        when: { flag: meeting1_result_road }
        text: "ผลออกเป็นถนนครับ ผมเคารพเสียงส่วนมากครับ… ส่วนมากหนึ่งเสียง ผมไม่ได้ประชดนะครับ ผมแค่… ขอไปรดผักก่อนครับ"
        replies:
          - { from: porn, text: "ไม่เป็นไรกล้า ถนนแปดร้อยเมตรหน้าลานเฮีย ไว้ขนผักไปขายเฮียไง" }
          - { from: phueak, text: "ถนนใหม่ควายเดินลื่น ตาไม่ชอบ ไอ้ทุยก็ไม่ชอบ" }
          - { from: kla, text: "ขอบคุณครับ ผมรดผักเสร็จแล้วครับ รู้สึกดีขึ้นสี่สิบเปอร์เซ็นต์ครับ" }
      - id: coop_d08_market
        day_min: 8
        time: "17:30"
        from: kla
        when: { flag: meeting1_result_market }
        text: "ผลออกเป็นตลาดครับ ยินดีกับป้าแต๋วด้วยครับ สหกรณ์ขอจองแผงฝั่งที่มีหลังคานะครับ ผักโดนแดดเหี่ยวเร็วกว่าคน"
        replies:
          - { from: noi, text: "ฝั่งไม่มีหลังคาพี่ขอขายน้ำแข็งใส ขายดีแน่ๆ จ้ะ" }
          - { from: porn, text: "ฝั่งตะวันออกมีวิถีชีวิต ป้าจำคำนายกฯ ได้ ป้าจะเอาไปปักผ้า" }
      - id: coop_d09_undercut
        day_min: 9
        time: "10:00"
        from: kla
        text: "เสี่ยประกาศรับพริกเพิ่มเป็น 82 วันนี้วันเดียว ตรงกับวันที่รถสหกรณ์ยางแบนพอดีครับ บังเอิญครับ วันนี้ผมเชื่อในความบังเอิญครับ"
        replies:
          - { from: sommai, text: "ลุงขายเฮียไปสามโลแล้ว ขอโทษนะกล้า พริกมันไม่รอ" }
          - { from: kla, text: "ไม่เป็นไรครับลุง พริกไม่ผิดครับ" }
          - { from: palm, text: "พรุ่งนี้เฮียกลับไป 65 เราเดิมพันข้าวมันไก่หนึ่งจาน" }
      - id: coop_d10_map
        day_min: 10
        time: "21:00"
        from: kla
        when: { flag: story_well_dry }
        text: "บ่อป้าแต๋วแห้งครับ ผมไม่อยากด่วนสรุป แต่ผมเริ่มทำแผนที่แล้ว ใครบ่อลดแจ้งผมได้ทุกเวลาครับ ยกเว้นตีสองถึงตีห้า ผมนอนครับ"
        replies:
          - { from: palm, text: "ไม่จริง ตีสามเมื่อคืนยังเห็นออนไลน์" }
          - { from: kla, text: "ผมนอนแบบออนไลน์ครับ" }
          - { from: chan, text: "บ่อข้อยลดไปศอกนึงเด้อ ข้อยวัดกับด้ายทอผ้า" }
          - { from: kla, text: "ขอบคุณครับยาย ด้ายยายแม่นกว่าตลับเมตรบางอันอีกครับ" }
      - id: coop_d12_list
        day_min: 12
        time: "19:30"
        from: kla
        when: { flag: story_well_dry_2 }
        text: "รายชื่อขอให้ตรวจสอบบ่อบาดาลตอนนี้ได้ 64 ชื่อครับ ต้องการ 100 ลายมือไม่ต้องสวยครับ ลายมือหมอก็รับครับ"
        replies:
          - { from: porn, text: "ตาแก่เซ็นไปสองที เพราะทีแรกเผลอเขียนเลขหวยแทนชื่อ" }
          - { from: kla, text: "อันนั้นผมขอตัดออกนะครับลุง" }
          - { from: sommai, text: "ตัดได้ แต่ขอเลขคืน" }
      - id: coop_d13_signed
        day_min: 13
        time: "08:00"
        from: kla
        when: { flag: story_kla_list }
        text: "ขอบคุณคุณ{player}ที่ลงชื่อนะครับ เป็นชื่อที่ 65 ครับ ผมจำได้เพราะเป็นชื่อเดียวที่ใส่วันที่มาด้วย"
        replies:
          - { from: palm, text: "คนกรุงเทพฯ ใส่วันที่ทุกเอกสาร ติดนิสัยงานออฟฟิศ ล้อเล่นๆ" }
          - { from: thongbai, text: "ป้าเซ็นด้วยแล้วนะ ชื่อที่ 66 ป้าใส่วันที่ตามหลาน" }
        like: kla
      - id: coop_d14_gauge
        day_min: 14
        time: "18:00"
        from: palm
        when: { flag: story_palm_visit }
        text: "เครื่องวัดระดับน้ำ อบต. มีเครื่องเดียว เรายืมมาได้เพราะไม่มีใครรู้ว่ามีอยู่ มันอยู่ในกล่องใต้ป้ายโครงการเก่า"
        replies:
          - { from: kla, text: "ป้ายโครงการอะไรครับ" }
          - { from: palm, text: "‘โครงการติดตามระดับน้ำใต้ดิน ปี 62’ ป้ายยังอยู่ เครื่องยังอยู่ แต่การติดตามไม่เคยอยู่ ล้อเล่นๆ… ไม่ได้ล้อเล่น" }
          - { from: porn, text: "ป้ายอยู่ทนกว่าโครงการทุกอันในตำบลนี้" }
      - id: coop_d18_audit
        day_min: 18
        time: "20:10"
        from: porn
        text: "ขอเสนอในกลุ่มนะ เงินกองกลางสหกรณ์ใครถือบัญชี ไม่ได้ว่าใครนะ ป้าเย็บผ้า ป้าคิดเงินเป็น"
