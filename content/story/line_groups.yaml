        text: "รถกระบะใครจอดขวางหน้าแผงเจ๊ ทะเบียนลงท้าย 59 ขยับด่วนยะ!!"
        replies:
          - { from: heng, text: "รถเฮียเอง ขนปุ๋ยมาลงแป๊บเดียว" }
          - { from: hong, text: "แป๊บของเฮียสองชั่วโมง ลูกค้าเจ๊เห็นแต่ท้ายรถเฮีย" }
          - { from: heng, text: "ท้ายรถเฮียสวยนะ ฮ่าๆ" }
          - { from: hong, text: "เจ๊จะเอาทุเรียนไปวางบนกระบะเฮียแล้วนะยะ ขายตรงนั้นเลย" }
          - { from: heng, text: "ได้ คิดค่าที่ลูกละสิบ ฮ่าๆ" }
      - id: mk_d25_vinyl
        day_min: 25
        time: "13:00"
        from: praew
        when: { flag: story_election_announced }
        text: "รับทำป้ายไวนิลหาเสียงค่ะ ราคากันเอง ทุกฝ่าย ไม่เลือกข้าง แพรวเลือกยอดขายค่ะ"
        replies:
          - { from: heng, text: "เฮียสั่งสิบแผ่น ไม่ต้องใส่ชื่อ" }
          - { from: praew, text: "ไม่ใส่ชื่อแล้วใส่อะไรคะเสี่ย" }
          - { from: heng, text: "ใส่หยดน้ำ… เปล่า ใส่ลายดอกไม้ ฮ่าๆ" }
          - { from: hong, text: "เจ๊ขอแผ่นนึงไว้ปูแผงกันฝนยะ หน้าใครก็ได้ ขอแค่หนา" }
      - id: mk_d27_nok
        day_min: 27
        time: "17:00"
        from: nok
        text: "เสาร์นี้นกขายวันสุดท้ายนะจ้า เดือนหน้าโรงงานให้โอทีทุกเสาร์ เท่ากับไม่ได้กลับบ้านสี่อาทิตย์ แต่ได้เพิ่มแปดพัน… ไม่รู้คุ้มไหมอ่ะ"
        replies:
          - { from: noi, text: "ก่อนไปมากินก๋วยเตี๋ยวพี่นะ พี่แถมลูกชิ้นห้าลูก กินให้ครบมื้อด้วยนะนก" }
          - { from: hong, text: "เจ๊ฝากมะม่วงไปกินที่หอสองโล ไม่คิดเงิน… คิดครึ่งเดียวยะ" }
          - { from: thongbai, text: "ป้าห่อน้ำพริกให้หนึ่งกระปุก กินกับข้าวโรงงานจะได้ไม่จืด" }
          - { from: nok, text: "ทุกคนอ่ะ 😭 นกยังไม่ได้ไปเลย ร้องไห้เท่ากับโอทีสามชั่วโมงแล้วเนี่ย" }
        like: nok
      - id: mk_d28_dream
        day_min: 28
        time: "21:00"
        from: hong
        text: "งวดหน้าออกวันที่ 1 นะยะ ใครฝันอะไรเก็บไว้ก่อน อย่าบอกในกลุ่ม มาบอกเจ๊ส่วนตัว"
        replies:
          - { from: tam, text: "ผมฝันว่าได้กลับไปทำงานตรงสายที่เรียนมาครับ ตีเป็นเลขอะไรดีครับ" }
          - { from: hong, text: "ตีเป็นเลขศูนย์ยะน้อง… เจ๊ล้อเล่นนะ ฝันต่อไปเถอะ เจ๊เชียร์" }
          - { from: noi, text: "ฝันดีนะตั้ม พรุ่งนี้มากินข้าวเช้าที่ร้านพี่ก่อนนอน" }
        like: tam

  # ===========================================================================
  # 4. ผู้ปกครอง ร.ร.บ้านดงเย็น (ครูเต้ย)
  # ===========================================================================
  - id: school_parents
    name: "ผู้ปกครอง ร.ร.บ้านดงเย็น 📚"
    avatar: toey
    members: [toey, bua, ann, somsak, wichai, piak, noi, palm]
    unlock_when: { day_min: 6, flag: met_toey }
    invite:
      npc: toey
      heart_min: 4
      text: "ตั้งใจฟังนะ… เอ้ย ครูติดปาก ครูอยากชวน{player}เข้ากลุ่มผู้ปกครองของโรงเรียนจ้ะ ไม่มีลูกก็เข้าได้นะ ครูขาดคนช่วยงาน กลุ่มนี้คนอ่านเยอะ คนตอบน้อย ครูอยากได้คนตอบสักคน"
      accept: "ได้{k}ครู {p}ช่วยตอบเอง"
      decline: "{p}ไม่มีลูกนะ{kq}ครู ขอไว้ก่อน"
    welcome:
      - { from: toey, text: "แนะนำสมาชิกใหม่นะจ๊ะ {player} มาเป็นผู้ปกครองอาสาของโรงเรียน ครูให้สิบเต็มสิบตั้งแต่ยังไม่ได้ทำอะไรเลย ⭐" }
      - { from: bua, text: "ยายฝากหลานดูมิวด้วยนะจ๊ะ เวลายายเข้าป่าเก็บสมุนไพร (มิวพิมพ์ให้ยายค่ะ)" }
      - { from: somsak, text: "ยินดีต้อนรับ ผู้ปกครองอาสาต้องมีสำเนาบัตรไหม… ไม่ต้องก็ได้ ย้ำอีกครั้งนะ ไม่ต้อง" }
      - { from: "แม่โอ๊ต (ขนมครก)", text: "ยินดีค่ะ โอ๊ตเล่าให้ฟังทุกวันเลยค่ะ ว่ามีพี่คนใหม่ไม่กลัวงู" }
    posts:
      - id: sch_d01_filter
        day_min: 1
        time: "15:30"
        from: toey
        text: "แจ้งผู้ปกครองนะจ๊ะ พรุ่งนี้ให้เด็กๆ พกขวดน้ำมาเองนะ เครื่องกรองน้ำโรงเรียนเสีย แจ้ง อบต. ไปแล้ว ครั้งที่สามจ้ะ"
        replies:
          - { from: wichai, text: "รับทราบครับ อยู่ระหว่างการจัดสรรงบประมาณครับ" }
          - { from: toey, text: "ครูนับการรับทราบได้สามครั้งแล้วนะคะนายกฯ เครื่องกรองยังนับได้ศูนย์ลิตรจ้ะ" }
          - { from: piak, text: "เดี๋ยวพี่ไปดูให้ น่าจะไส้กรองตัน ไม่ต้องรองบ" }
        like: toey
      - id: sch_d03_merge
        day_min: 3
        time: "16:10"
        from: toey
        text: "ตั้งใจฟังนะจ๊ะ เขตแจ้งว่าปีหน้าจะประเมินจำนวนนักเรียนใหม่ ถ้าไม่ถึงเกณฑ์อาจถูกยุบรวมกับโรงเรียนในอำเภอ ครูไม่ได้ขู่นะ ครูแค่ส่งต่อหนังสือ"
        replies:
          - { from: "แม่โอ๊ต (ขนมครก)", text: "ถ้ายุบ โอ๊ตต้องนั่งรถลุงเชิดเที่ยวหกโมงไปเรียนเหรอคะ แม่ยังทำขนมครกไม่เสร็จเลยตอนนั้น" }
          - { from: somsak, text: "ผู้ใหญ่จะทำหนังสือค้าน ย้ำอีกครั้งนะ ทำหนังสือค้าน" }
          - { from: wichai, text: "อบต. พร้อมขับเคลื่อนเรื่องนี้อย่างเป็นรูปธรรมครับ" }
          - { from: toey, text: "ขับเคลื่อนไปทางไหนคะนายกฯ" }
          - { from: wichai, text: "ไปข้างหน้าครับ" }
      - id: sch_d04_leak
        day_min: 4
        time: "16:40"
        from: toey
        when: { flag: story_first_rain }
        text: "หลังคาห้อง ป.4 รั่วสามจุดจ้ะ วันนี้ครูเอากะละมังรองได้สองใบ จุดที่สามรองด้วยกระป๋องสี ครูให้หลังคาสองเต็มสิบ"
        replies:
          - { from: piak, text: "พรุ่งนี้เช้าพี่ไปดูให้ ค่าแรงไม่คิด ค่ากระเบื้องคิด แต่คิดแบบช่างงานวัดนะ" }
          - { from: ann, text: "เด็กคนไหนตัวเปียกให้เปลี่ยนเสื้อก่อนนอนนะคะ ช่วงนี้ไข้หวัดมาค่ะ" }
          - { from: bua, text: "ยายต้มน้ำขิงไปให้เด็กๆ หนึ่งหม้อนะจ๊ะ ไม่เผ็ดหรอก ยายไม่กินเผ็ด (มิวพิมพ์ให้ยายค่ะ)" }
      - id: sch_d05_millipede
        day_min: 5
        time: "14:50"
        from: toey
        text: "วันนี้โอ๊ตเอากิ้งกือมาส่งเป็นการบ้านวิทย์ ตั้งชื่อให้ว่า ‘นายกฯ’ เพราะเดินช้าแต่ขาเยอะ ครูให้เปลี่ยนชื่อแล้วนะจ๊ะ ครูให้การบ้านเก้าเต็มสิบ ชื่อศูนย์"
        replies:
          - { from: "แม่โอ๊ต (ขนมครก)", text: "ขอโทษค่ะครู 🙏 แม่ไม่รู้ว่าเขาเอาใส่กระเป๋าไปตอนไหน" }
          - { from: wichai, text: "ไม่เป็นไรครับ ผมถือว่าเยาวชนให้ความสนใจผู้บริหารท้องถิ่นครับ" }
          - { from: palm, text: "ตามหลักวิชาการ กิ้งกือเป็นผู้ย่อยสลายที่ดีมาก ทำงานเงียบ ไม่ขึ้นป้าย ล้อเล่นๆ" }
      - id: sch_d08_mew
        day_min: 8
        time: "17:00"
        from: toey
        text: "มิวได้ที่หนึ่งกระโดดหนังยางระดับอำเภอ!! ครูไม่ได้ไปดูเพราะต้องส่งแฟ้มประเมิน แต่ครูร้องไห้อยู่ในห้องธุรการ ⭐⭐⭐"
        replies:
          - { from: bua, text: "ยายภูมิใจจ้ะ พรุ่งนี้ยายต้มน้ำใบเตยเลี้ยงทั้งห้อง (มิวพิมพ์ให้ยายค่ะ ยายยิ้มทั้งวันเลยค่ะ)" }
          - { from: noi, text: "พรุ่งนี้มิวมากินก๋วยเตี๋ยวฟรีนะ พี่ใส่ไข่ให้สองฟองเลย" }
          - { from: ann, text: "เก่งมากค่ะ อย่าลืมยืดน่องก่อนกระโดดทุกครั้งนะคะ" }
          - { from: somsak, text: "พรุ่งนี้หกโมงผู้ใหญ่จะประกาศ ย้ำอีกครั้งนะ จะประกาศชื่อน้องมิว" }
        like: toey
      - id: sch_d09_temple
        day_min: 9
        time: "19:30"
        from: toey
        when: { flag: story_power_out }
        text: "ไฟดับ พรุ่งนี้ครูให้เด็กๆ ไปเรียนที่ศาลาวัดนะจ๊ะ พระอาจารย์อนุญาตแล้ว ห้องเรียนไม่มีพัดลมร้อนเกินจ้ะ"
        replies:
          - { from: somsak, text: "ไฟดับ หอกระจายข่าวก็ดับ ผู้ใหญ่เลยต้องประกาศในนี้ ย้ำอีกครั้งนะ พรุ่งนี้ไปเรียนที่วัด" }
          - { from: "แม่โอ๊ต (ขนมครก)", text: "โอ๊ตถามว่าเรียนที่วัดต้องนั่งพับเพียบทั้งวันไหมคะ" }
          - { from: toey, text: "พับเพียบครึ่งวัน ขัดสมาธิครึ่งวันจ้ะ ครูก็ไม่ไหวเหมือนกัน" }
      - id: sch_d11_water
        day_min: 11
        time: "16:00"
        from: toey
        when: { flag: story_well_dry }
        text: "ขอความร่วมมือผู้ปกครองให้เด็กๆ พกน้ำต้มสุกมาเองนะจ๊ะ ช่วงนี้บ่อในตำบลน้ำขุ่น ห้องน้ำโรงเรียนก็ต้องประหยัดน้ำ ครูขอโทษที่ต้องพิมพ์เรื่องนี้"
        replies:
          - { from: ann, text: "เด็กคนไหนท้องเสียมา รพ.สต. ได้เลยค่ะ เกลือแร่มีพอค่ะ แอนไปดูที่โรงเรียนพรุ่งนี้ด้วยค่ะ" }
          - { from: "แม่โอ๊ต (ขนมครก)", text: "โอ๊ตบอกจะกลั้นไว้จนกลับบ้าน แม่บอกว่าไม่ต้องกลั้นลูก" }
          - { from: piak, text: "พี่ต่อถังเก็บน้ำฝนให้หลังโรงเรียนได้ ถังพี่มีเก่าอยู่ใบนึง เดี๋ยวเข้าไปทำวันเสาร์" }
      - id: sch_d13_relay
        day_min: 13
        time: "18:00"
        from: toey
        text: "กีฬาสีวันพุธที่ 24 สีเขียวยังขาดผู้ปกครองวิ่งผลัดหนึ่งคนจ้ะ พ่อโอ๊ตอยู่กรุงเทพฯ กลับไม่ทัน มีใครอาสาไหมจ๊ะ ครูให้คะแนนจิตอาสาสิบเต็มสิบ"
        replies:
          - { from: piak, text: "พี่วิ่งไม่ได้ เข่าพี่ปูนเซ็ตตัวแล้ว" }
          - { from: somsak, text: "ผู้ใหญ่วิ่งได้ แต่ช้า ย้ำอีกครั้งนะ ช้า" }
          - { from: "แม่โอ๊ต (ขนมครก)", text: "ขอบคุณทุกคนนะคะ โอ๊ตบอกว่าไม่เป็นไร แต่เมื่อคืนเขานอนกอดรองเท้าแตะพ่อ" }
      - id: sch_d15_drawing
        day_min: 15
        time: "15:20"
        from: toey
        when: { flag: story_ghost_rumor }
        text: "เด็กๆ วาดรูป ‘หมู่บ้านของฉัน’ มีสามคนวาดผู้หญิงผมยาวนั่งบนท่อน้ำ ครูไม่รู้จะให้คะแนนยังไงจ้ะ ระบายสีสวยมาก"
        replies:
          - { from: bua, text: "ไม่ต้องกลัวจ้ะครู เด็กเห็นเขาเป็นคน ไม่ได้เห็นเป็นผี ยายว่าดีแล้ว ทำบุญไปให้เขาก็พอ (มิวพิมพ์ให้ยายค่ะ)" }
          - { from: ann, text: "ถ้าเด็กคนไหนฝันร้าย นอนไม่หลับ บอกแอนได้นะคะ คุยกันเบาๆ ก็ช่วยได้เยอะค่ะ" }
          - { from: toey, text: "งั้นครูให้สิบเต็มสิบทุกคนนะจ๊ะ แล้วพาไปทำบุญด้วยกัน" }
      - id: sch_d18_tiles
        day_min: 18
        time: "12:30"
        from: piak
        text: "หลังคา ป.4 พี่ซ่อมแล้วสองจุด จุดที่สามรอกระเบื้องที่ อบต. เบิกไว้ตั้งแต่ปีก่อน"
        replies:
          - { from: wichai, text: "อยู่ระหว่างกระบวนการจัดซื้อจัดจ้างครับ" }
          - { from: piak, text: "ปีก่อนก็ระหว่างครับนายกฯ ระหว่างนานจนรุ่นกระเบื้องนั้นเลิกผลิตแล้ว" }
          - { from: toey, text: "ครูซื้อเองสิบแผ่นแล้วนะจ๊ะช่าง ใบเสร็จครูเก็บไว้ จะเบิกคืนเมื่อระบบพร้อม" }
          - { from: somsak, text: "ผู้ใหญ่ออกให้ครึ่งนึง ย้ำอีกครั้งนะ ครึ่งนึง ครูอย่าเถียง" }
      - id: sch_d19_huan
        day_min: 19
        time: "17:10"
        from: toey
        when: { flag: story_funeral_huan }
        text: "พรุ่งนี้งดการบ้านนะจ๊ะ เด็กๆ จะไปช่วยงานศพตาหวลที่วัด ตาหวลมาสอนกลองยาวให้โรงเรียนมาสิบปี ไม่เคยรับค่าสอนสักบาท"
        replies:
          - { from: somsak, text: "ตาหวลตีกลองทุกงานในตำบล ไม่เคยคิดเงิน… ผู้ใหญ่ขอพูดแค่นี้นะ" }
          - { from: bua, text: "ให้เด็กๆ ไหว้ตาหวลแล้วบอกว่าจะตีกลองต่อ ตาหวลจะได้ไปสบายจ้ะ (มิวพิมพ์ให้ยายค่ะ)" }
          - { from: noi, text: "พี่ทำขนมไปเลี้ยงเด็กที่ไปช่วยงานนะจ๊ะ" }
      - id: sch_d21_photo
        day_min: 21
        time: "19:00"
        from: toey
        when: { flag: story_meeting2 }
        text: "บริษัทขอมาถ่ายรูปมอบถังน้ำให้โรงเรียน จะให้เด็กๆ ยืนถือป้ายขอบคุณด้วย ครูขอความเห็นผู้ปกครองก่อนนะจ๊ะ ครูยังไม่ตอบเขา"
        replies:
          - { from: "แม่โอ๊ต (ขนมครก)", text: "ถ้าได้น้ำแม่โอเคค่ะ แต่ไม่อยากให้โอ๊ตต้องยิ้มในรูป" }
          - { from: bua, text: "ให้เด็กเรียนหนังสือ ไม่ต้องไปยืนกลางแดดให้ใครถ่ายจ้ะ (มิวพิมพ์ให้ยายค่ะ)" }
          - { from: ann, text: "ถ้ารับถัง ขอแอนตรวจน้ำก่อนให้เด็กดื่มนะคะ" }
          - { from: toey, text: "สรุปครูรับถัง ไม่รับรูปนะจ๊ะ ครูให้มติกลุ่มสิบเต็มสิบ" }
        like: toey
      - id: sch_d24_sports
        day_min: 24
        time: "16:30"
        from: toey
        when: { flag: story_sports_day }
        text: "ขอบคุณทุกคนที่มากีฬาสีนะจ๊ะ สีเขียวชนะผลัดผู้ปกครอง เพราะ{player}วิ่งแทนพ่อโอ๊ต ⭐⭐⭐⭐⭐ ครูให้ห้าดาว ครูไม่เคยให้ใครห้าดาวมาก่อนเลย"
        replies:
          - { from: "แม่โอ๊ต (ขนมครก)", text: "โอ๊ตวิดีโอคอลเล่าให้พ่อฟังแล้วค่ะ พ่อนั่งร้องไห้อยู่หน้าไซต์ก่อสร้าง ขอบคุณมากนะคะ 🙏" }
          - { from: wichai, text: "ขอบคุณผู้ปกครองทุกท่านที่ตั้งใจฟังคำกล่าวเปิดงานครับ ปีนี้ผมกระชับลงแล้วครับ" }
          - { from: piak, text: "สี่สิบนาทีคือกระชับแล้วเหรอครับนายกฯ" }
          - { from: wichai, text: "ปีที่แล้วหนึ่งชั่วโมงสิบห้าครับ" }
        like: toey
      - id: sch_d26_polling
        day_min: 26
        time: "10:00"
        from: somsak
        when: { flag: story_election_announced }
        text: "เลือกตั้งปีนี้ใช้โรงเรียนเป็นหน่วยเลือกตั้งเหมือนเดิม ขอครูเตรียมโต๊ะเด็กไว้ให้ด้วย ย้ำอีกครั้งนะ โต๊ะ"
        replies:
          - { from: toey, text: "ได้ค่ะผู้ใหญ่ แต่ขอให้ช่วยทาสีผนังคืนด้วยนะจ๊ะ ปีก่อนป้ายติดกาวที่ผนังห้อง ป.3 ยังแกะไม่ออกเลย" }
          - { from: wichai, text: "ป้ายนั้นเป็นป้ายประชาสัมพันธ์ครับ ไม่ใช่ป้ายหาเสียงครับ" }
          - { from: toey, text: "หน้านายกฯ อยู่บนป้ายนะคะ" }
          - { from: wichai, text: "เป็นการประชาสัมพันธ์ใบหน้าครับ" }
      - id: sch_d27_two
        day_min: 27
        time: "15:00"
        from: toey
        text: "ข่าวดีนิดนึงนะจ๊ะ เทอมหน้ามีเด็กย้ายกลับมาเรียนสองคน พ่อแม่ลาออกจากไซต์บริษัทกลับมาทำนา ครูไม่รู้จะดีใจแบบไหน แต่ครูนับหัวได้เพิ่มสอง"
        replies:
          - { from: palm, text: "เรามีโต๊ะเก้าอี้เก่าที่ อบต. อยู่สองชุด ไม่ได้อยู่ในป้ายโครงการไหน เอาไปได้เลย" }
          - { from: noi, text: "วันแรกพาเด็กใหม่มากินก๋วยเตี๋ยวนะครู พี่เลี้ยงต้อนรับ" }
          - { from: somsak, text: "สองคน ย้ำอีกครั้งนะ สองคน ผู้ใหญ่ดีใจ" }
      - id: sch_d28_month
        day_min: 28
        time: "20:30"
        from: toey
        text: "สรุปเดือนนี้นะจ๊ะ หลังคาซ่อมแล้วสองในสามจุด เครื่องกรองน้ำช่างเปี๊ยกล้างไส้กรองให้แล้ว อบต. ยังรับทราบอยู่ เด็กยังมาครบ ครูยังไม่ถูกย้าย ครูให้เดือนนี้เจ็ดเต็มสิบจ้ะ"
        replies:
          - { from: ann, text: "แอนให้ครูสิบค่ะ" }
          - { from: bua, text: "หนูให้ครูร้อยค่ะ อันนี้มิวพิมพ์เองค่ะ ยายไม่ได้บอก" }
          - { from: toey, text: "มิว… ครูให้ดาวหนึ่งดวงเพราะซื่อสัตย์นะจ๊ะ แล้วคืนโทรศัพท์ยายด้วย 😊" }
        like: toey

  # ===========================================================================
  # 5. รักษ์น้ำดงเย็น (ลับ) — เมย์
  # ===========================================================================
  - id: water_secret
    name: "รักษ์น้ำดงเย็น (ลับ) 🤫"
    avatar: may
    members: [may, palm, kla, sathian, tam]
    unlock_when: { flag: story_may_digging }
    invite:
      npc: may
      heart_min: 4
      text: "{player}… เราขอถามตรงๆ นะ ปากหนักไหม เรามีกลุ่มเล็กๆ ห้าคน คุยเรื่องท่อ เรื่องตัวเลข ไม่ใช่กลุ่มข่าว ห้ามแคป ห้ามเล่าให้ป้าแต๋วฟัง… โดยเฉพาะป้าแต๋ว จะเข้าไหม"
      accept: "เข้า{k} {p}ปากหนักกว่าป้าแต๋วแน่นอน"
      decline: "ขอไม่เข้าก่อน{k} {p}ยังไม่กล้า"
    welcome:
      - { from: may, text: "กฎกลุ่ม: 1) ห้ามแคป 2) ห้ามพิมพ์ตอนเมา 3) เรื่องยาวไปคุยต่อที่ร้านตั้ม 4) ถ้าใครเงียบหายไปสามวัน คนอื่นต้องตามหา ข้อนี้ไม่ได้พูดเล่นนะ" }
      - { from: sathian, text: "ดาบอยู่ในกลุ่มนี้แบบไม่เป็นทางการนะ ถ้ามีใครถาม ดาบไม่เห็นกลุ่มนี้" }
      - { from: tam, text: "ยินดีต้อนรับครับ ร้านเปิดยี่สิบสี่ชั่วโมง กล้องวงจรปิดลบตัวเองทุกเจ็ดวันครับ" }
      - { from: palm, text: "ที่นี่มีแต่ตัวเลข ไม่มีสติกเกอร์ ล้อเล่นๆ มีอยู่อันเดียว รูปปั๊มน้ำร้องไห้" }
    posts:
      - id: ws_d12_open
        day_min: 12
        time: "22:15"
        from: may
        text: "ที่เปิดกลุ่มนี้แยกออกมา เพราะในกลุ่มหมู่บ้านมีบัญชีอวตารอย่างน้อยสามบัญชีที่อ่านทุกข้อความ แล้วพิมพ์ผิดคำเดียวกัน"
        replies:
          - { from: palm, text: "สี่ เมื่อเช้ามีบัญชีใหม่ชื่อ ‘ชาวนาตัวจริง89’ ชาวนาตัวจริงอะไรตื่นมาโพสต์ตอนตีห้าว่าบริษัทดี" }
          - { from: tam, text: "ตีห้าชาวนาตัวจริงเขาอยู่ในนาครับ ผมเห็นเขาซื้อกาแฟกระป๋องตอนตีสี่ครึ่งครับ" }
          - { from: kla, text: "ผมขอเสนอว่าเราอย่าพิมพ์ชื่อบริษัทตรงๆ ครับ เรียกว่า ‘หยดน้ำ’ ก็พอครับ" }
          - { from: may, text: "หยดน้ำยิ้ม รับทราบ" }
      - id: ws_d13_trucks
        day_min: 13
        time: "23:40"
        from: may
        text: "เท่าที่รู้ตอนนี้: เขาได้ใบอนุญาตสูบวันละ 50 คิว ใครเห็นรถน้ำออกจากรั้วตอนกลางคืนช่วยนับคันด้วย อย่าถ่ายรูปถ้าไม่ปลอดภัย นับอย่างเดียวพอ"
        replies:
          - { from: tam, text: "เมื่อคืนผ่านหน้าร้านผม 14 คันครับ ผมนับจากเสียงระหว่างหาวครับ" }
          - { from: kla, text: "คันละหมื่นลิตร สิบสี่คันคือ 140 คิว เกินเกือบสามเท่าครับ… ขอโทษครับ ผมคิดเลขในใจแล้วมันหลุดออกมา" }
          - { from: sathian, text: "ดาบไม่เห็นรถ ดาบเห็นแต่ฝุ่น ฝุ่นเยอะผิดปกติ ดาบจดไว้ในใจแล้ว" }
      - id: ws_d14_gauge
        day_min: 14
        time: "20:00"
        from: palm
        when: { flag: story_palm_visit }
        text: "ติดเครื่องวัดที่บ่อยายเพียรแล้วนะ เครื่อง อบต. ปี 62 กล่องยังอยู่ ใบรับประกันยังอยู่ ความกระตือรือร้นของหน่วยงานไม่อยู่"
        replies:
          - { from: may, text: "ตัวเลขพวกนี้ห้ามหาย เก็บสำเนาไว้สามที่ คนละที่" }
          - { from: sathian, text: "เก็บที่ป้อมก็ได้ ป้อมดาบไม่มีใครเข้า ขนาดดาบยังไม่ค่อยเข้า" }
          - { from: tam, text: "เก็บที่ร้านผมไม่ได้นะครับ ทุกอย่างในร้านลบทุกเจ็ดวันครับ รวมทั้งความหวังครับ" }
      - id: ws_d15_pipe
        day_min: 15
        time: "02:10"
        from: tam
        when: { flag: story_ghost_rumor }
        text: "ยามบริษัทมาซื้อน้ำหกขวดครับ ถามผมว่าผีกลัวน้ำมนต์ไหม ผมบอกว่าน้ำมนต์ไม่มีขาย มีแต่น้ำแร่ครับ"
        replies:
          - { from: may, text: "ถามเขาหรือยังว่าผู้หญิงคนนั้นนั่งบนท่อไหน" }
          - { from: tam, text: "เขาบอกว่าท่อที่ไม่มีในแบบแปลนครับ" }
          - { from: kla, text: "…ท่อที่ไม่มีในแบบแปลน" }
          - { from: palm, text: "จดๆๆ" }
        like: tam
      - id: ws_d16_checkpoint
        day_min: 16
        time: "09:30"
        from: sathian
        text: "ดาบได้หนังสือมาว่าห้ามตั้งด่านแถวไซต์บริษัท เพราะรบกวนการขนส่ง ดาบเลยไม่ตั้ง ดาบไปผูกเปลนอนตรงนั้นแทน ไม่ผิดระเบียบ"
        replies:
          - { from: may, text: "แล้วดาบนอนแล้วเห็นอะไรบ้างคะ" }
          - { from: sathian, text: "ดาบไม่เห็น ดาบหลับ แต่ดาบได้ยินรถยี่สิบสองคัน หูดาบไม่ได้หลับไปด้วย" }
          - { from: kla, text: "ยี่สิบสองคันคือ 220 คิวครับ… ขอโทษครับ มันหลุดอีกแล้ว" }
        like: sathian
      - id: ws_d17_truck
        day_min: 17
        time: "23:05"
        from: may
        when: { flag: story_dogs_17 }
        text: "เมื่อคืนมีกระบะไม่เปิดไฟมาจอดหน้าที่พักเราสิบนาที แล้วก็ไป ไม่ได้ทำอะไร แค่อยากให้รู้ว่าเขารู้"
        replies:
          - { from: kla, text: "คืนนี้มานอนที่สหกรณ์ไหมครับ มีห้องเก็บปุ๋ย กลิ่นแรงหน่อยแต่ปลอดภัยครับ" }
          - { from: tam, text: "หรือมานั่งร้านผมครับ ไฟสว่าง กล้องอัดอยู่ อีกเจ็ดวันค่อยลบครับ" }
          - { from: sathian, text: "พรุ่งนี้ดาบจะไปเดินแถวนั้น… ไม่ใช่ คืนนี้เลย เดี๋ยวนี้เลย ดาบใส่รองเท้าแล้ว" }
          - { from: may, text: "ขอบคุณนะทุกคน… ดาบใส่รองเท้าครั้งแรกในรอบเดือนเลยนะ" }
      - id: ws_d18_tonight
        day_min: 18
        time: "15:00"
        from: may
        when: { flag: story_may_evidence }
        text: "คืนนี้ทุ่มครึ่ง สะพานคลอง ใครว่างช่วยถือไฟฉายหน่อย ไม่ต้องกล้า แค่ถือไฟให้นิ่ง"
        replies:
          - { from: palm, text: "เราติดประชุม อบต. เรื่องป้ายโครงการ… ขอโทษนะ จริงๆ" }
          - { from: sathian, text: "ดาบจะไม่เห็นอะไรเลยแถวสะพาน ตั้งแต่ทุ่มครึ่งถึงสามทุ่ม" }
          - { from: may, text: "ขอบคุณค่ะดาบ นี่คือคำว่าช่วยที่ดีที่สุดที่ได้ยินจากตำรวจปีนี้" }
          - { from: tam, text: "ผมจะเปิดไฟหน้าร้านทุกดวงครับ วิ่งมาทางนี้ได้เลยครับ" }
      - id: ws_d19_photo
        day_min: 19
        time: "00:30"
        from: may
        when: { flag: helped_may }
        text: "รูปออกแล้ว น้ำไหลย้อนเข้ารั้วชัดเจน ขอบคุณ{player}ที่ถือไฟนิ่งทั้งที่ขาสั่น ตอนหมาหอนพร้อมกันเรานึกว่าจะโดนทิ้งให้อยู่คนเดียวแล้ว"
        replies:
          - { from: tam, text: "ทั้งสองคนวิ่งเข้าร้านผมตอนสองทุ่มห้าสิบครับ ถามผมว่าผีหรือยาม ผมยังไม่ได้ตอบครับ" }
          - { from: kla, text: "ตอบเถอะครับตั้ม" }
          - { from: tam, text: "ยามครับ… น่าจะครับ" }
          - { from: palm, text: "ส่งรูปมาเราขยายดูท่อนะ ตามหลักวิชาการ ท่อแบบนั้นไม่ใช่ท่อระบายน้ำ ตามหลักบ้านๆ คือท่อขโมย" }
