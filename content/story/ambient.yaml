# =============================================================================
# Dream Valley — เสียงที่ได้ยินตอนเดินผ่าน (ambient barks) และบทคุยกันเองของ NPC (banter)
# places.<place_id>: รายการบรรทัดเดียว { who, text, when? } — who = id ตัวละคร หรือ villager (ชาวบ้านไม่มีชื่อ)
# when ใช้รูปแบบเดียวกับ story.yaml (flag, not_flag, day_min, time_from/time_to ฯลฯ) ไม่ใส่ = ได้ยินได้ตลอด
# banter: บทสั้น 2–4 บรรทัดระหว่าง NPC สองคน เล่นเมื่อผู้เล่นเดินผ่าน place นั้นและทั้งคู่อยู่ใกล้กัน
# กู/มึง ใช้เฉพาะเพื่อนเก่าคุยกันเอง (บอล-นก, กำนัน-ผู้ใหญ่, แต๋ว-พร, บัว-ทองใบ, สมหมาย-ตาเผือก)
# =============================================================================
places:
  taew_shop:
    - { who: taew, text: "ป้าไม่ได้พูดนะ แต่เขาว่ากันว่า… เดี๋ยวๆ หลานเดินผ่านมา เปลี่ยนเรื่องก่อน" }
    - { who: taew, text: "น้ำแข็งหมดแล้วจ้า! รถน้ำแข็งติดหลุมหน้า อบต. อีกแล้ว" }
    - { who: porn, text: "แต๋ว เชื่อเหล้าตาแก่ไว้เท่าไหร่ ป้าจะจ่ายแล้วไปหักค่าหวยเอา" }
    - { who: villager, text: "ป้า ขอยากันยุงห่อนึง แล้วข่าวล่าสุดอีกเรื่อง" }
    - { who: sathian, text: "กาแฟกระป๋องเย็นๆ ป้า… ไม่ได้มานั่งนะ แค่มาซื้อ… ขอนั่งแป๊บ" }
    - { who: taew, text: "อุ๊ยตาย! จิ้งจกตกใส่หัว… ไม่ใช่ลางนะ ใช่ไหม ใช่ไหม" }
    - { who: taew, text: "บ่อป้าแห้งมาสิบวันแล้ว ป้านับทุกวัน นับแล้วก็ไม่มีน้ำเพิ่ม", when: { flag: story_well_dry } }
    - { who: taew, text: "ถังสีฟ้าใบนี้ป้าใช้นะ แต่ป้าหันโลโก้เข้ากำแพง", when: { flag: story_meeting2 } }
    - { who: villager, text: "ป้าแต๋วว่าใครจะลงนายกฯ ป้าแต๋วรู้ก่อนอำเภอแน่", when: { flag: story_election_announced } }
  kamnan_house:
    - { who: prasert, text: "ไอ้แดง! อย่าไปจิกไอ้ทอง! ไก่สวยงามต้องมีมารยาทโว้ย" }
    - { who: praew, text: "พ่อคะ ยืนเฉยๆ ข้างไก่ แพรวจะไลฟ์… พ่อยิ้มหน่อย ไม่ใช่ยิ้มให้ไก่ ยิ้มให้กล้อง" }
    - { who: prasert, text: "คุณธนาชวนกินข้าวอีกแล้ว ร้านแพงอีกแล้ว… กำนันจะกินแต่ไม่เซ็น" }
    - { who: villager, text: "กำนันครับ ผมมาขอหนังสือรับรองครับ… กำนันอยู่ไหม หรือไก่รับแทน" }
    - { who: prasert, text: "บ่อบ้านกำนันน้ำลดไปครึ่งศอก ไก่ยังรู้เลยว่าน้ำในรางมันจืดลง", when: { flag: story_well_dry } }
    - { who: praew, text: "ยอดวิวไลฟ์ไก่ได้มากกว่าไลฟ์ขายของแพรวอีก แพรวไม่ได้น้อยใจนะคะ น้อยใจ" }
    - { who: prasert, text: "เลือกตั้งรอบนี้กำนันไม่ลง… กำนันแค่ฟัง แล้วจด แล้วจำ", when: { flag: story_election_announced } }
    - { who: prasert, text: "ประชุมวันนั้นกำนันไม่ได้หลับ กำนันพักสายตา สายตากำนันทำงานหนัก" }
  obt:
    - { who: wichai, text: "ในส่วนของเรื่องนี้ เรารับทราบแล้วครับ และจะรับทราบต่อไปอย่างต่อเนื่อง" }
    - { who: palm, text: "ตามหลักวิชาการนะ แฟ้มนี้ต้องส่งเมื่อวาน ตามหลักความจริง ยังไม่ได้เริ่ม" }
    - { who: villager, text: "มาขอเบี้ยผู้สูงอายุ เขาให้ไปถ่ายเอกสารสามชุด ร้านถ่ายเอกสารปิดวันพฤหัส" }
    - { who: wichai, text: "ป้ายนี้ขยับซ้ายอีกนิดครับ ให้หน้าผมไม่โดนกิ่งไม้บัง… กิ่งไม้ไม่ได้ทำผิดอะไรครับ" }
    - { who: palm, text: "หัวหน้าบอกให้เก็บรายงานไว้ก่อน เราเก็บไว้ในหัวด้วย ลบไม่ได้", when: { flag: story_palm_gauge } }
    - { who: wichai, text: "ศึกษาความเป็นไปได้คือการทำให้สิ่งที่เป็นไปไม่ได้ ดูเป็นไปได้มากขึ้นครับ", when: { flag: story_meeting1 } }
    - { who: villager, text: "ป้ายใหญ่จัง ถ้าเอาค่าป้ายมาลาดยาง ได้หน้าบ้านฉันแล้วมั้ง" }
    - { who: wichai, text: "ผมไม่ได้ลงสมัครครับ ผมแค่… ยืนอยู่ใกล้ๆ ป้ายที่บังเอิญมีหน้าผม", when: { flag: story_election_announced } }
  sala:
    - { who: somsak, text: "ทดสอบ หนึ่ง สอง… ย้ำอีกครั้งนะ ทดสอบ" }
    - { who: somsak, text: "ไมค์มันหอนเพราะมันแก่ ผู้ใหญ่ก็แก่ แต่ผู้ใหญ่ไม่หอน" }
    - { who: mew, text: "โอ๊ต! เธอเหยียบเส้นแล้ว! ตาย! ตายแล้วออกไปเลย", when: { time_from: "15:00", time_to: "18:00" } }
    - { who: oat, text: "ผมไม่ได้เหยียบ! เส้นมันขยับเอง! พี่เห็นไหมครับ", when: { time_from: "15:00", time_to: "18:00" } }
    - { who: villager, text: "เตะตะกร้อขาดคนนึง ใครว่างมาเลย" }
    - { who: somsak, text: "สำเนาบัตรสามชุด… ผู้ใหญ่มีสำรองไว้ให้คนลืมด้วย ย้ำอีกครั้งนะ ผู้ใหญ่มีสำรอง" }
    - { who: somsak, text: "ผู้ใหญ่จะเกษียณแล้ว… ไมค์ตัวนี้จะคิดถึงผู้ใหญ่ไหมนะ", when: { flag: story_election_announced } }
    - { who: villager, text: "พัดลมตัวนั้นหมุนกลับทางมาสามปีแล้ว ไม่มีใครซ่อม เพราะไม่มีงบศึกษา" }
    - { who: villager, text: "ถังสีฟ้าสามใบหน้าศาลา ตั้งไว้โชว์ น้ำไม่เคยมี", when: { flag: story_meeting2 } }
  coffee:
    - { who: praew, text: "ลาเต้เย็นหวานน้อยได้แล้วค่ะ ไม่ต้องเกรงใจพ่อแพรว พ่อแพรวไม่ได้ชง" }
    - { who: may, text: "(พิมพ์รัว) ประธานกองทุน… ปีสามเก้า… ทำไมทุกเอกสารหายตอนน้ำท่วม" }
    - { who: may, text: "พาดหัวที่สาม ‘บริษัทตอบทุกคำถาม ด้วยคำว่า ขอบคุณสำหรับคำถาม’" }
    - { who: praew, text: "ไลฟ์ขายกาแฟเรตติ้งตก ต้องเอาไก่พ่อมาออกกล้องแล้ว" }
    - { who: villager, text: "ร้านนี้แอร์เย็นสุดในตำบล นั่งได้ทั้งวัน… ผู้ใหญ่ว่าไม่ได้นะ เดี๋ยวคนว่าว่างงาน" }
    - { who: may, text: "แบตเครื่องอัดเสียงหมดอีกแล้ว กล้าพูดยาวเกิน" }
    - { who: may, text: "ไฟล์รูปท่อเราก๊อปไว้สามที่ ที่ที่สามคือกระปุกหมู", when: { flag: story_pipe_photo } }
    - { who: praew, text: "เมย์ อย่าเขียนชื่อพ่อแพรว… เขียนก็ได้ แต่เขียนสวยๆ", when: { flag: story_may_digging } }
  police:
    - { who: sathian, text: "ดาบรับเรื่องแล้ว… พรุ่งนี้นะ" }
    - { who: sathian, text: "เปลตัวนี้ดาบผูกเองกับมือ ฐานรากแน่นกว่าป้อมอีก" }
    - { who: sathian, text: "ระบบมันทำให้ดาบขี้เกียจ… หรือดาบทำให้ระบบขี้เกียจ ดาบคิดมาสามปียังไม่จบ" }
    - { who: villager, text: "ดาบครับ มีคนขโมยไก่… ดาบหลับอยู่ ไว้มาใหม่ก็ได้" }
    - { who: sathian, text: "ใบแจ้งความหมดแล้ว ไปถ่ายเอกสารมาเองนะ สามชุด… ไม่ใช่ เอามาชุดเดียวพอ ดาบไม่ใช่ผู้ใหญ่" }
    - { who: sathian, text: "รถกระบะไม่เปิดไฟเหรอ ดาบลงบันทึกแล้ว สีไม่ทราบ ทะเบียนไม่ทราบ ดาบทราบว่ามันมืด", when: { flag: story_may_evidence } }
    - { who: sathian, text: "บ่อแห้งไม่ใช่คดี ผีบนท่อก็ไม่ใช่คดี ดาบว่าตำบลนี้ไม่มีคดีเลย มีแต่เรื่อง", when: { flag: story_ghost_rumor } }
    - { who: sathian, text: "คืนหมาหอนดาบจะเข้าเวร… ดาบจะเข้าเวรในป้อม ไม่ออกไปไหน ดาบสัญญา", when: { flag: story_election_announced } }
  clinic:
    - { who: ann, text: "คุณยายคะ ยาความดันกินวันละเม็ดนะคะ ไม่ใช่กินวันที่ความดันขึ้นค่ะ" }
    - { who: ann, text: "บัตรทองฟรีค่ะ ไม่ต้องเกรงใจ ไม่ต้องเอาไข่มาให้ด้วยค่ะ… ไข่สวยมากค่ะ ขอบคุณค่ะ" }
    - { who: villager, text: "หมอแอนบอกให้ลดเค็ม ฉันลดแล้วนะ ปลาร้าเหลือวันละสองช้อน" }
    - { who: ann, text: "ใครโดนผีจับเมื่อคืนนั่งรอตรงนี้ก่อนนะคะ แอนวัดความดันให้ ผีทำให้ความดันขึ้นจริงค่ะ" }
    - { who: ann, text: "ข่าวในกลุ่มวันนี้มีสามเรื่อง แอนแก้ไปสอง อีกเรื่องเป็นสูตรแกง แอนไม่แก้ค่ะ อร่อย" }
    - { who: ann, text: "ท้องเสียช่วงนี้เยอะค่ะ น้ำบ่อขุ่นต้องต้มก่อนนะคะ ทุกครั้งเลยค่ะ", when: { flag: story_well_dry } }
    - { who: villager, text: "ผมมาวัดความดันครับ ไม่ได้มาหลบแดด… หลบแดดด้วยครับ" }
    - { who: ann, text: "ผู้ใหญ่สมศักดิ์คะ ความดันร้อยห้าสิบ ย้ำอีกครั้งนะคะ ร้อยห้าสิบ" }
  school:
    - { who: toey, text: "ตั้งใจฟังนะจ๊ะ สองคูณเจ็ดได้เท่าไหร่… โอ๊ต ไม่ใช่แมลงจ้ะ", when: { time_from: "08:00", time_to: "15:00" } }
    - { who: mew, text: "ครูคะ ทำไมบ่อโรงเรียนไม่มีน้ำคะ ทำไมห้องน้ำต้องตักจากถังคะ ทำไม", when: { time_from: "08:00", time_to: "15:00" } }
    - { who: oat, text: "ผมเจอด้วงกว่างครับ! มันชื่อนายกฯ เพราะมันเดินวนครับ", when: { time_from: "08:00", time_to: "15:00" } }
    - { who: toey, text: "อันนี้ครูให้เก้าเต็มสิบ หักหนึ่งเพราะเขียนชื่อครูผิด เต้ยไม่ใช่เตย" }
    - { who: villager, text: "โรงเรียนเหลือเด็กสามสิบสี่คน ปีหน้าเขาว่าจะยุบรวม… ปีที่แล้วก็ว่าแบบนี้" }
    - { who: toey, text: "สภาเด็กวันนี้โหวตสามสิบสี่ต่อศูนย์ ครูอิจฉาเด็กๆ นะ" }
    - { who: ton, text: "พี่ครับ ผมมาเรียนหนังสือที่นี่วันอังคารครับ ถ่านรออยู่หน้าประตูครับ", when: { time_from: "08:00", time_to: "15:00" } }
    - { who: toey, text: "ห้องน้ำโรงเรียนใช้น้ำจากถังสีฟ้าไปก่อนนะจ๊ะ ครูขอโทษเด็กๆ แทนผู้ใหญ่ทุกคน", when: { flag: story_meeting2 } }
  temple:
    - { who: sumet, text: "กวาดใบไม้ก็เหมือนกวาดใจนะโยม กวาดวันเดียวไม่สะอาด ต้องกวาดทุกวัน" }
    - { who: jamrat, text: "ผ้ายันต์เก้าสิบเก้า ตะกรุดเจ็ดสิบเก้า สายสิญจน์สี่สิบเก้า… ลุงร้องเป็นทำนองได้แล้ว" }
    - { who: ton, text: "ถ่าน! อย่ากินข้าวพระ! …ขอโทษครับพี่ ถ่านหิวครับ ผมก็หิวครับ" }
    - { who: villager, text: "เณรครับ ตีเลขให้หน่อย… เณรบอกว่าวันนี้วันพระ ตีเป็นอะไรดีวะ" }
    - { who: jamrat, text: "ลุงจดทุกบาทนะหลาน สมุดเล่มนี้เล่มที่สี่สิบสอง เล่มแรกยังอยู่" }
    - { who: sumet, text: "อาตมาให้น้ำบ่อวัดชาวบ้านตักได้ บ่อวัดก็ลดลง แต่น้ำใจไม่ลดนะโยม", when: { flag: story_well_dry } }
    - { who: thongbai, text: "ใครปรุงหม้อนี้! จืด! ป้าออกไปแป๊บเดียว", when: { flag: story_funeral_huan } }
    - { who: ton, text: "พี่ครับ ผมนับต้นไม้ในวัดได้หนึ่งร้อยสิบสองต้นครับ ต้นตะเคียนไม่นับครับ ผมกลัว" }
  heng_shop:
    - { who: heng, text: "(กดเครื่องคิดเลขติ๊กๆ) ปุ๋ยสามกระสอบ ดอกสามเดือน… ฮ่าๆ น้องไม่ต้องตกใจ เฮียกดเล่น" }
    - { who: heng, text: "เครื่องชั่งหน้าลานเที่ยงตรงนะพี่น้อง เที่ยงตรงตามเฮีย" }
    - { who: villager, text: "เสี่ยหักความชื้นสิบห้าอีกแล้ว ข้าวผมตากมาสามแดด" }
    - { who: heng, text: "ปั๊มน้ำขายดีสามเท่า เฮียควรดีใจไหม เฮียถามเครื่องคิดเลขแล้ว มันตอบว่าดีใจ", when: { flag: story_well_dry } }
    - { who: heng, text: "คุณธนามาขอซื้อลานเฮีย… เฮียเพิ่งรู้ว่าตัวเองเป็นปลาเล็กได้", when: { flag: story_thana_visit } }
    - { who: heng, text: "ป้ายหาเสียงขนาดมาตรฐานแผ่นละสี่ร้อย ขนาดนายกฯ แผ่นละสองพัน", when: { flag: story_election_announced } }
    - { who: heng, text: "แปดร้อยเมตรหน้าลานเฮียเรียบกริบ เฮียขอบคุณพี่น้อง… เฮียไม่ได้ขอนะ พี่น้องให้เอง", when: { flag: meeting1_result_road } }
    - { who: villager, text: "เฮียครับ ขอเชื่อยาฆ่าหญ้าก่อน ขายข้าวแล้วจ่ายครับ… ปีที่แล้วก็พูดแบบนี้ครับ" }
  market:
    - { who: hong, text: "มะม่วงหวานเจี๊ยบ ไม่หวานคืนเงิน… คืนเป็นมะม่วงนะยะ" }
    - { who: hong, text: "(กระซิบ) งวดนี้… เปล่า เจ๊ไม่ได้พูดอะไร ส้มโอลูกละห้าสิบ" }
    - { who: villager, text: "หมูปิ้งไม้ละสิบจ้า ข้าวเหนียวห่อละห้า เจ๊หงษ์ขายแพงกว่าสองบาท" }
    - { who: hong, text: "ดาบ เงาะเอาไปกินได้ แต่ห้ามมองโพย… เจ๊หมายถึงห้ามมองป้ายราคา" }
    - { who: villager, text: "ผักตลาดนัดแพงขึ้นทุกอาทิตย์ แม่ค้าบอกบ่อแห้ง ผมเชื่อแม่ค้า" }
    - { who: hong, text: "แผงฝั่งไม่มีหลังคาเขาเรียกว่าวิถีชีวิตย่ะ ยืนตากแดดอย่างมีวัฒนธรรม", when: { flag: meeting1_result_market } }
    - { who: hong, text: "ขนมครกแม่โอ๊ตหมดเร็วสุดในตลาด เจ๊ยอมรับ ไม่บ่อยนะที่เจ๊ยอมรับ" }
    - { who: villager, text: "ป้ายหาเสียงติดกับเสาเต็นท์ตลาด เต็นท์จะล้มอยู่แล้ว", when: { flag: story_election_announced } }
  pharmacy:
    - { who: mod, text: "ยาแก้ปวดหลังที่ดีที่สุดคือเลิกแบกกระสอบคนเดียวครับ" }
    - { who: mod, text: "พาราสองเม็ด ทุกหกชั่วโมง ไม่ใช่กินหมดแผงเพราะอยากหายไว" }
    - { who: villager, text: "คุณมด มียาแก้เบื่อการเมืองไหม" }
    - { who: mod, text: "มีครับ ชื่อปิดแจ้งเตือนกลุ่มไลน์ ฟรีครับ" }
    - { who: mod, text: "เกลือแร่ขายดีกว่ายาทุกตัวแล้วครับ อากาศร้อนกับน้ำบ่อขุ่นเป็นเซลส์ให้ผม", when: { flag: story_well_dry } }
    - { who: mod, text: "ยาที่ราคาแพงที่สุดในร้านคือยาที่คนไม่กินตามหมอสั่ง แล้วต้องกลับมาซื้อใหม่" }
    - { who: villager, text: "มียาดมไหม ขอสามหลอด ประชุมคืนนี้ยาว" }
    - { who: mod, text: "พระเครื่องรุ่นน้ำไหลไม่หยุดไม่ได้ผลนะครับ ผมไม่ได้ขายแข่ง ผมแค่ขายยาท้องเสีย" }
  store24:
    - { who: tam, text: "รับถุงไหมครับ สะสมแต้มไหมครับ ผีหรือคนครับ… อันสุดท้ายผมถามในใจครับ", when: { time_from: "16:00", time_to: "24:00" } }
    - { who: tam, text: "(หาว) ข้าวเวฟกะเพราอุ่นสองนาทีครับ ชีวิตผมอุ่นมาสามปีแล้วยังไม่สุก", when: { time_from: "16:00", time_to: "24:00" } }
    - { who: villager, text: "ร้านนี้ปลอดภัยสุดตอนกลางคืน ผีไม่เข้าแอร์" }
    - { who: tam, text: "ปริญญาผมแขวนอยู่หลังเคาน์เตอร์ครับ ข้างป้ายโปรซื้อหนึ่งแถมหนึ่ง", when: { time_from: "16:00", time_to: "24:00" } }
    - { who: tam, text: "ยามบริษัทมาซื้อน้ำหกขวดอีกแล้วครับ ซื้อน้ำของบริษัทตัวเอง", when: { flag: story_ghost_rumor } }
    - { who: tam, text: "เครื่องปั่นไฟร้านผมเสียงดังกว่าหอกระจายข่าว แต่ไม่ย้ำครับ", when: { flag: story_power_out } }
    - { who: villager, text: "ตั้มจบปริญญาแท้ๆ มาทอนเงินตอนตีสอง เสียดายจัง… เอ้า ทอนผิดหรือเปล่า" }
    - { who: tam, text: "คืนหมาหอนร้านผมยอดขายดีที่สุดของปีครับ ซองขาวขายหมด", when: { flag: story_election_announced } }
  workshop:
    - { who: piak, text: "ไม่ได้ฉากเว้ย! วัดใหม่! เหล็กเส้นมันไม่โกหก คนวัดต่างหากที่โกหก" }
    - { who: piak, text: "ลูกค้าเปลี่ยนแบบเป็นครั้งที่ห้า ฐานรากพี่ยังไม่ทันแห้งเลย" }
    - { who: villager, text: "ช่างเปี๊ยก หลังคาบ้านรั่ว มาดูวันไหน" }
    - { who: piak, text: "ฝนตกพี่ไม่ขึ้นหลังคา แดดออกพี่ก็ไม่ขึ้น ร้อน… พรุ่งนี้เช้าตรู่นะ" }
    - { who: piak, text: "ศาลาวัดพี่ซ่อมไม่คิดค่าแรง ศาลา อบต. พี่คิดสองเท่า เพราะต้องรอเซ็นสามรอบ" }
    - { who: piak, text: "ถังสีฟ้าใบละเท่าไหร่รู้ไหม พี่ถามแล้ว ไม่มีใครบอก แต่ฐานรองถังพี่คิดร้อยห้าสิบ", when: { flag: story_meeting2 } }
    - { who: villager, text: "ไม้สักเก่าบ้านยายเพียรนะ ถ้าวันไหนรื้อขายได้เป็นแสน… พูดเล่นๆ" }
    - { who: piak, text: "ป้ายหาเสียงพี่ไม่ตอก ตอกแล้วโดนลือว่าเข้าข้าง พี่เข้าข้างตะปู", when: { flag: story_election_announced } }
  bus_stop:
    - { who: cherd, text: "ขึ้นๆ ออกแล้วนะ! เจ้าเขียวไม่รอใคร ไม่รอสำเนา ไม่รอแฟน" }
    - { who: cherd, text: "เที่ยวเก้าโมงยังมีที่ข้างคนขับ ที่นั่งแถวสองริมหน้าต่างไม่ว่าง… มีคนจองไว้" }
    - { who: villager, text: "ลุงเชิดเปิดเพลงเดิมมาสิบปี ฟังจนร้องได้ทั้งตำบล" }
    - { who: cherd, text: "ถนนหลุมเยอะ เจ้าเขียวมันร้อง ลุงลูบหน้ารถให้ทุกเช้า" }
    - { who: cherd, text: "คนบนรถเล่าว่าอำเภอจะมาสำรวจบ่อ… คนบนรถเล่าทุกอย่าง ลุงไม่ได้ถาม", when: { flag: story_well_dry } }
    - { who: villager, text: "ไปอำเภอเที่ยวสุดท้ายหกโมงเย็นนะ ตกรถต้องนอนโรงแรม ห้องละห้าร้อย" }
    - { who: cherd, text: "รถแห่ขวางป้ายอีกแล้ว! ลุงไม่บีบแตรใส่หรอก… บีบนิดเดียว", when: { flag: story_election_announced } }
    - { who: cherd, text: "หกโมงตรง เก้าโมงตรง เที่ยงตรง บ่ายสามตรง หกโมงเย็นตรง ลุงตรงทั้งชีวิต" }
  noi_noodle:
    - { who: noi, text: "เส้นอะไรดีจ๊ะ เล็ก ใหญ่ หมี่ บะหมี่ซอง… บะหมี่ซองไม่มีนะ พี่ล้อเล่น" }
    - { who: noi, text: "ชิมก่อนแล้วค่อยเติม! ยังไม่ชิมเติมพริกสามช้อนแล้ว ใจร้อนเหมือนคนกรุงเทพฯ" }
    - { who: villager, text: "พี่หน่อย เกาเหลาหนึ่ง พิเศษลูกชิ้น ไม่เอาผัก… เอาผักนิดนึง" }
    - { who: noi, text: "ขึ้นราคาห้าบาท พี่ขอโทษทุกชาม ซื้อน้ำมาต้มซุปทุกวัน", when: { flag: story_well_dry } }
    - { who: noi, text: "สมัยพี่อยู่โรงแรม จานละสามร้อย อร่อยไม่เท่าชามละสี่สิบที่นี่ เพราะคนกินหน้าไม่เครียด" }
    - { who: villager, text: "ร้านพี่หน่อยปิดบ่ายสาม ใครหิวหลังนั้นไปพึ่งข้าวเวฟร้านตั้ม" }
    - { who: noi, text: "กินข้าวครบมื้อหรือยังน้อง หน้าซีดแบบนี้พี่ไม่ยอมนะ นั่งก่อน" }
    - { who: noi, text: "นายกฯ มากินทุกวันช่วงนี้ จ่ายทุกโต๊ะ… พี่ไม่ได้ว่าอะไรนะ ช่วงนี้ใจดีจัง", when: { flag: story_election_announced } }
  coop_garden:
    - { who: kla, text: "ลองคิดดูนะครับ ผักบุ้งหนึ่งกำ ต้นทุนสามบาท ขายสิบ… ขอโทษครับ ผมคุยกับผักบุ้ง" }
    - { who: kla, text: "ตาชั่ง ‘ความยุติธรรม’ ของผมเที่ยงตรงที่สุดในตำบล ไม่ต้องตั้งหน้าลานให้ใครดู" }
    - { who: palm, text: "หนอนตัวนี้พันธุ์ดีมาก ล้อเล่นๆ กินผักเราหมดแล้ว" }
    - { who: villager, text: "ผักสหกรณ์แพงกว่าตลาดบาทนึง แต่ไม่ต้องล้างสามน้ำ" }
    - { who: kla, text: "บ่อสมาชิกแห้งไปเจ็ดบ่อ… แปด… ผมเลิกนับในใจแล้ว นับในแฟ้มแทน", when: { flag: story_well_dry } }
    - { who: kla, text: "ผมเห็นรั้วบริษัทขยับมาใกล้ทุกปีจากแปลงนี้ ปีนี้มันมีโลโก้ยิ้มด้วย", when: { flag: story_thana_visit } }
    - { who: kla, text: "ผมไม่ลงสมัครครับ ผมทำสหกรณ์… ป้าแต๋วครับ อย่าถ่ายรูปผมกับป้ายครับ", when: { flag: story_election_announced } }
    - { who: villager, text: "กล้ามันพูดยาวแต่ผักมันดี ทนฟังหน่อยก็ได้ผักงาม" }
  house_bua:
    - { who: bua, text: "(เคี้ยวหมาก) หลานเอ๊ย… มานั่งตรงนี้ ยายมียาหม่องสูตรใหม่ ไม่เผ็ดนะ ยายไม่กินเผ็ด" }
    - { who: bua, text: "ไพลกับขมิ้นตากแดดไว้ อย่าเหยียบนะหลาน เหยียบแล้วยายต้องตากใหม่" }
    - { who: villager, text: "ยายบัวครับ ลูกผมไข้ขึ้นตอนกลางคืน… ไปหาหมอแอนก่อน ยายบัวสั่งไว้แบบนี้ทุกคน" }
    - { who: bua, text: "ผีน่ะไม่ได้อยากทำร้ายใครหรอกหลาน มันแค่อยากให้คนจำมันได้" }
    - { who: bua, text: "สมุนไพรริมคลองยายแห้งไปครึ่งแปลง รากมันไม่มีอะไรดูดแล้ว", when: { flag: story_well_dry } }
    - { who: bua, text: "โอ่งมังกรสามใบนี้รองน้ำฝน ฝนไม่เคยติดโลโก้ ยายไม่ต้องรอใคร", when: { flag: story_meeting2 } }
    - { who: bua, text: "ยายเพียรชอบนั่งตรงขั้นบันไดนี้ เคี้ยวหมากแข่งกับยาย ยายชนะทุกที เพราะยายเพียรคุยเยอะ" }
    - { who: bua, text: "อย่าหันหลังให้น้ำนะหลาน จำไว้ ยายบอกครั้งเดียว… ยายบอกสองครั้ง", when: { flag: story_ghost_rumor } }
  pasture:
    - { who: phueak, text: "เจ้าทองคำ… กลับมาเว้ย! ควายไม่ใช่แพะ ไม่ต้องปีนคันนา" }
    - { who: phueak, text: "คนน่ะเหมือนควาย จูงจมูกได้ แต่ถ้าดึงแรงไป มันก็ขวิดเอานะหลาน" }
    - { who: villager, text: "ตาเผือกเลี้ยงควายฝูงสุดท้ายของตำบล ลูกหลานไม่มีใครเลี้ยงต่อ" }
    - { who: phueak, text: "ควายไม่กินน้ำถังสีฟ้า ดมแล้วเดินหนี ควายมันรู้", when: { flag: story_meeting2 } }
    - { who: phueak, text: "หนองหลังทุ่งแห้งไปเกือบหมด ควายนอนแช่ไม่ได้ ควายหงุดหงิด ตาก็หงุดหงิด", when: { flag: story_well_dry } }
    - { who: phueak, text: "ไอ้ด่างของสมหมายมันกินผักสหกรณ์ เพราะมันฉลาดกว่าเจ้าของ" }
    - { who: phueak, text: "ใครยกมือสองข้างที่ประชุม ตาไม่ได้ตั้งใจ ตาบิดขี้เกียจ", when: { flag: story_meeting1 } }
    - { who: phueak, text: "เลือกตั้งทีไรมีคนมาขอจับมือตา จับเสร็จก็ล้างมือ ควายตาไม่ล้างนะ", when: { flag: story_election_announced } }
  forest_edge:
    - { who: daeng, text: "เข้าป่าเอาแต่พอกิน เอาเกินเจ้าป่าเขาจำหน้าได้นะหลาน" }
    - { who: daeng, text: "ห้วยแห้งครึ่งนึงแล้ว ปลามันไม่รู้จะไปไหน เหมือนคนในตำบลเว้ย" }
    - { who: daeng, text: "รอยเท้าใหม่… ไม่ใช่หมูป่า รองเท้าบูตพื้นหนา คนบริษัทเข้ามาวัดป่าอีกแล้ว", when: { flag: story_thana_visit } }
    - { who: villager, text: "ลุงแดงเห็นเสือตอนหนุ่ม เล่าทุกวงเหล้า เสือตัวใหญ่ขึ้นทุกปี" }
    - { who: daeng, text: "ไข่มดแดงปีนี้น้อย ต้นไม้มันแห้ง มดมันก็ย้ายบ้าน" }
    - { who: daeng, text: "อย่าเดินชายป่าหลังสองทุ่ม ผีไม่ได้ดุ แต่คนที่ส่องไฟหาของในป่าตอนกลางคืนน่ะดุ" }
    - { who: daeng, text: "ลุงไม่ไปประชุมหรอก ป่ามันไม่มีสิทธิ์โหวต ลุงอยู่กับมันดีกว่า", when: { flag: story_meeting1 } }
    - { who: daeng, text: "ใบปลิวหาเสียงปลิวมาติดกิ่งไม้ในป่าแล้ว ลุงเก็บไปจุดไฟหุงข้าว", when: { flag: story_election_announced } }
  house_thongbai:
    - { who: thongbai, text: "แหม! เห็ดโคนดอกนี้ ใครเก็บมา ขาไม่ครบ! ต้องเก็บทั้งโคนนะหลาน" }
    - { who: thongbai, text: "จืด! ใครปรุงหม้อนี้… อ๋อ ป้าปรุงเอง ไม่จืด ลิ้นป้าจืด" }
    - { who: villager, text: "ป้าทองใบขอสูตรแกงป่าหน่อย… ป้าบอกว่าสูตรอยู่ในมือ ไม่อยู่ในปาก" }
    - { who: thongbai, text: "ยายเพียรตำน้ำพริกเก่งกว่าป้านิดนึง… นิดเดียว อย่าไปบอกใคร" }
    - { who: thongbai, text: "ผักหวานป่าปีนี้ยอดเล็ก น้ำไม่พอ ป้าเก็บได้ครึ่งตะกร้า", when: { flag: story_well_dry } }
    - { who: thongbai, text: "งานศพตาหวลป้าล้างหม้อไปยี่สิบสามใบ ใครว่าป้าแก่ ป้าจะให้ล้างใบที่ยี่สิบสี่", when: { flag: story_funeral_huan } }
    - { who: thongbai, text: "บัวมันชมป้าลับหลังใช่ไหม ป้ารู้ ป้าก็ชมมันลับหลัง เราเป็นเพื่อนแบบลับหลัง" }
    - { who: thongbai, text: "ผู้สมัครมาขอกินแกงป้าทุกวัน กินแล้วไม่ล้างถ้วย ป้าไม่เลือก", when: { flag: story_election_announced } }
  house_sommai:
    - { who: porn, text: "ตาแก่! ซองหวยงวดที่แล้วอยู่ในกระเป๋ากางเกงตัวไหน ป้าจะเอาไปซักแล้วนะ!" }
    - { who: sommai, text: "เลขนี้มาจากจิ้งจกร้องสามที ตรงฝาบ้านทิศตะวันออก… แม่ อย่าเพิ่งตี" }
    - { who: porn, text: "จักรเย็บผ้าเสียงดังเพราะป้าโกรธ ไม่ใช่เพราะจักรเก่า" }
    - { who: sommai, text: "รถเกี่ยวลุงคิวเต็มถึงสิ้นเดือน ถ้าไม่มีน้ำปีหน้า ลุงจะเกี่ยวอะไร", when: { flag: story_well_dry } }
    - { who: porn, text: "บ่อแห้ง ป้าซักผ้าวันเว้นวัน ตาแก่ใส่เสื้อตัวเดิมสามวัน เหม็นเป็นเลขได้ไหม", when: { flag: story_well_dry_2 } }
    - { who: sommai, text: "ถังสีฟ้าใต้ผ้าถุงนั่นของบ้านลุงเอง สวยไหมหลาน แม่เขาคลุมให้", when: { flag: story_meeting2 } }
    - { who: villager, text: "ป้าพรตัดชุดสวยแต่ปากไม่สวย ใครๆ ก็รู้ ใครๆ ก็ยังไปตัด" }
    - { who: porn, text: "ตาแก่จะไปลงผู้ใหญ่บ้าน! ไปเลย! ป้าจะไม่เลือก!", when: { flag: story_election_announced } }
  house_chan:
    - { who: chan, text: "เส้นไหมเส้นนี้ข้อยย้อมกับครั่ง สีแดงแม่นแท้ ไผมาเบิ่งได้เด้อ" }
    - { who: chan, text: "ชีวิตก็เหมือนทอผ้า หลานเอ๊ย พุ่งไปพุ่งมา ลายมันถึงจะเกิด" }
    - { who: villager, text: "ยายจันทร์ทอผืนเดียวสามเดือน ขายผืนละหมื่น ยังขาดทุนค่าแรง" }
    - { who: chan, text: "กำฟ้าปีนี้ข้อยสิฟังเสียงฟ้าทายฝน บ่รู้ฟ้าสิฮ้องบ่ แล้งหลาย", when: { flag: story_well_dry } }
    - { who: chan, text: "ยายเพียรเคยยืมผ้าข้อยนุ่งไปวัด คืนมาพร้อมข้าวหลามสองกระบอก แม่นคนน่ารัก" }
    - { who: chan, text: "กี่ตัวนี้อายุแก่กว่าข้อยอีก ข้อยบ่ทิ้งมันดอก มันบ่ทิ้งข้อย" }
    - { who: chan, text: "ผู้สมัครมาขอผ้าข้อยไปถ่ายรูปหาเสียง ข้อยบ่ให้ ผ้าบ่ได้มีไว้ขอคะแนน", when: { flag: story_election_announced } }
    - { who: villager, text: "เสียงกี่ทอผ้ายายจันทร์ดังทุกเช้า ฟังแล้วรู้ว่าตำบลยังไม่ตาย" }
  nok_house:
    - { who: nok, text: "แม่! ข้าวเหนียวเหลือไหม เดี๋ยวเอาไปหอด้วยห้าห่อ ไม่สิ สิบห่อ", when: { weekday: 6 } }
    - { who: nok, text: "นอนบ้านสองคืนเท่ากับโอทีสิบหกชั่วโมง แต่นอนหลับสบายกว่าเยอะเลยแก", when: { weekday: 7 } }
    - { who: villager, text: "นกกลับมาทีไรบ้านนี้เสียงดังทั้งซอย แม่นกยิ้มทั้งวัน" }
    - { who: nok, text: "บ่อบ้านเราน้ำลด แม่อาบน้ำวันเว้นวัน แม่บอกประหยัด เราว่าแม่โดนดูด", when: { flag: story_well_dry } }
    - { who: nok, text: "ใบสมัครงานโรงงานแม่เก็บไว้ในลิ้นชัก แม่บอกเผื่อเราเปลี่ยนใจกลับบ้านถาวร… ใบสมัครโรงงานไว้กลับบ้าน งงป่ะ" }
    - { who: nok, text: "บอลมันมาซ่อมพัดลมให้แม่อีกแล้ว ฟรีตลอด ไม่รู้คิดอะไร… รู้แหละ ไม่บอก" }
    - { who: nok, text: "หน้าใครเต็มเสาไฟหน้าบ้านอ่ะแม่ ยิ้มหวานจัง ไม่เคยเห็นยิ้มแบบนี้ในชีวิตจริง", when: { flag: story_election_announced } }
    - { who: villager, text: "แม่นกส่งลูกไปโรงงาน ลูกส่งเงินกลับมาทุกเดือน บ้านทาสีใหม่ แต่คนในบ้านเหลือคนเดียว" }
  garage:
    - { who: ball, text: "ฟังเสียงก่อน… อาการแบบนี้ คลัตช์หมด" }
    - { who: ball, text: "เดี๋ยวดูให้ ไม่คิดตังค์ คิดตังค์ค่าอะไหล่ ค่าอะไหล่แพงกว่าค่าแรงสามเท่า" }
    - { who: villager, text: "บอลจะไประยองจริงเหรอ แล้วใครจะซ่อมรถเจ้าเขียวลุงเชิด" }
    - { who: ball, text: "มอเตอร์ไซค์เมย์มาอีกแล้ว ไมล์สามแสน มันอยากตายแต่เจ้าของไม่ยอม" }
    - { who: ball, text: "โช้คหน้างอ ล้อคด… คนขี่ถลอก รถบาดเจ็บสาหัสกว่าคน", when: { flag: may_went_alone } }
    - { who: ball, text: "ปั๊มน้ำบ้านใครดังแปลกๆ เอามา เดี๋ยวดูให้ ช่วงนี้ปั๊มป่วยทั้งตำบล", when: { flag: story_well_dry } }
    - { who: ball, text: "รถแห่ยางแบนหน้าอู่ เขาจะให้ปะ… ปะให้ ไม่ใช่เพราะเลือกนะ เพราะมันขวางประตู", when: { flag: story_election_announced } }
    - { who: ball, text: "ใบสมัครโรงงานระยองอยู่ในลิ้นชักสามใบ ใบแรกเปื้อนน้ำมันเครื่องจนอ่านไม่ออกแล้ว" }
  company_office:
    - { who: thana, text: "(คุยโทรศัพท์) ครับ… noted ครับ… เราจะ align กับชุมชนครับ… ครับ จะไม่ใช้คำว่าดูดครับ" }
    - { who: thana, text: "ยินดีต้อนรับครับ น้ำดื่มฟรีครับ เป็นน้ำจาก… แหล่งน้ำคุณภาพครับ" }
    - { who: villager, text: "ตู้คอนเทนเนอร์แอร์เย็นกว่า อบต. อีก ป้ายก็สวยกว่า" }
    - { who: thana, text: "คุณ{player}ครับ ประตูเราเปิดเสมอครับ… ส่วนรั้วเราเปิดเฉพาะเวลาทำงานครับ" }
    - { who: villager, text: "ยามใหม่มาเฝ้าแล้ว คนเก่าลาออกไปสามคนหลังเห็นผี", when: { flag: story_ghost_rumor } }
    - { who: thana, text: "ถังสีฟ้าเหลือสามสิบใบครับ ใครยังไม่ได้ ลงชื่อได้ครับ ฟรีครับ ถังเป็นของบริษัทครับ", when: { flag: story_meeting2 } }
    - { who: thana, text: "(ถอนหายใจ) จดหมายลาออกฉบับที่สาม… ยังสะกดคำว่า ‘ลาออก’ ผิดอยู่ดี" }
    - { who: thana, text: "บริษัทเป็นกลางทางการเมืองครับ เราสนับสนุนทุกฝ่าย ในสัดส่วนที่ต่างกันครับ", when: { flag: story_election_announced } }
  bank:
    - { who: villager, text: "ตู้เอทีเอ็มกลางแจ้ง ตอนกลางคืนไม่มีใครกล้ากด กดเสร็จต้องวิ่ง" }
    - { who: villager, text: "มาจ่ายดอกเบี้ยธนาคารเกษตร ปีนี้ขายข้าวไม่พอดอก ขอผ่อนผันอีกปี" }
    - { who: villager, text: "ป้ายสินเชื่อบ้านใหม่ ดอกพิเศษ ถ้ามีโฉนด… ที่ฉันเป็น ส.ป.ก. เขาส่ายหัว" }
    - { who: villager, text: "พนักงานธนาคารบอกว่ามีบริษัทมาถามเรื่องหนี้เก่ากองทุนหมู่บ้าน ถามทำไมก็ไม่รู้", when: { flag: story_thana_visit } }
    - { who: villager, text: "บัตรสวัสดิการเข้าวันที่ห้า ร้านป้าแต๋วรับ ร้านตั้มไม่รับ" }
    - { who: villager, text: "เงินลูกโอนมาแล้ว ไปจ่ายค่าไฟ แล้วจ่ายค่าน้ำ… ค่าน้ำประปาไม่ต้องจ่าย ไม่มีน้ำ", when: { flag: story_well_dry } }
    - { who: villager, text: "คิวยาวจัง ช่วงเลือกตั้งคนมาถอนเงินเยอะ… ไม่รู้ถอนไปทำอะไร", when: { flag: story_election_announced } }
    - { who: villager, text: "ยายเพียรมาฝากเงินทุกต้นเดือน ห้าร้อยไม่เคยขาด พนักงานยังถามถึง" }
  water_tower:
    - { who: villager, text: "หอถังน้ำประปาหมู่บ้านสร้างปีสามเก้า ป้ายเขียนว่าบริจาคโดย… ชื่อลบเลือนหมดแล้ว" }
    - { who: villager, text: "ประปาหมู่บ้านไหลวันละสองชั่วโมง ตอนตีห้ากับห้าโมงเย็น ใครตื่นสายอด" }
    - { who: villager, text: "ถังบนหอมีน้ำแค่ก้น ปั๊มดูดไม่ขึ้นแล้ว", when: { flag: story_well_dry } }
    - { who: somsak, text: "หอนี้ยายเพียรเป็นคนค้ำให้สร้าง… ผู้ใหญ่จำได้แค่นี้ ผู้ใหญ่ต้องไปหาแฟ้ม", when: { flag: story_guarantee_hint } }
    - { who: villager, text: "เด็กๆ ชอบปีนหอถังน้ำ ผู้ใหญ่ประกาศห้ามทุกเดือน เด็กปีนทุกเดือน" }
    - { who: palm, text: "ตามหลักวิชาการ หอนี้ควรซ่อมตั้งแต่สิบปีที่แล้ว ตามหลักงบประมาณ รอศึกษาก่อน" }
    - { who: villager, text: "ป้ายใหม่ติดหอถังน้ำ ‘สานต่อระบบน้ำ’ หน้าคุณนายพเยาว์ยิ้มใต้ถังที่ไม่มีน้ำ", when: { flag: story_election_announced } }
    - { who: villager, text: "สมัยก่อนนั่งเล่นใต้หอถังน้ำ น้ำหยดใส่หัวเย็นดี เดี๋ยวนี้ไม่หยดแล้ว" }
  shrine:
    - { who: villager, text: "ไหว้ปู่ตาก่อนนะลูก แล้วค่อยขอ ขอแล้วอย่าลืมแก้บน" }
    - { who: villager, text: "ศาลปู่ตามีพวงมาลัยใหม่ทุกวัน ไม่มีใครรู้ว่าใครเอามา" }
    - { who: bua, text: "ปู่ตาท่านดูแลหมู่บ้านมาก่อนมี อบต. หลานไหว้ท่านก่อนไหว้นายกฯ นะ" }
    - { who: villager, text: "ฉันมาบนให้บ่อมีน้ำ ถ้าน้ำมาจะถวายไข่ต้มร้อยฟอง… ไข่แพงนะช่วงนี้", when: { flag: story_well_dry } }
    - { who: villager, text: "ม้าลายปูนที่ศาลเพิ่มอีกตัว ใครบนถูกหวยมาแก้บน", when: { flag: story_lottery_16 } }
    - { who: villager, text: "ผู้สมัครมาไหว้ศาลปู่ตาวันละสามคน ปู่ตาคงเหนื่อย", when: { flag: story_election_announced } }
    - { who: taew, text: "ปู่ตาคุ้มครองป้าด้วยนะ ป้าเดินผ่านบ่อบริษัทไม่ไหวจริงๆ", when: { flag: story_ghost_rumor } }
    - { who: villager, text: "ตอนค่ำๆ ได้ยินเสียงกระดิ่งที่ศาลดังเอง ลมพัดมั้ง… ลมไม่มีนะวันนั้น" }
  canal:
    - { who: villager, text: "คลองส่งน้ำปีนี้น้ำน้อย เรือยังลอยไม่ได้ ปลายังว่ายลำบาก" }
    - { who: villager, text: "อย่าเดินบนสะพานตอนกลางคืนนะ ผีพรายชอบมานั่งห้อยขาตรงนั้น" }
    - { who: villager, text: "บางคืนน้ำในคลองไหลย้อนทาง ใครเห็นบ้าง… ฉันไม่ได้เมานะ", when: { flag: story_well_dry } }
    - { who: villager, text: "ท่อเหล็กใหม่โผล่ใต้สะพาน ไม่มีป้าย ไม่มีใครรู้ว่าของใคร… ทุกคนรู้", when: { flag: story_may_evidence } }
    - { who: may, text: "(ยืนถ่ายรูปท่อ) ตอนกลางวันมันเงียบมาก เงียบจนน่าสงสัย", when: { flag: story_may_digging } }
    - { who: villager, text: "เด็กๆ ตกปลาตรงสะพานทุกเย็น ปีนี้ได้แต่ปลาตัวเท่านิ้ว" }
    - { who: villager, text: "ตรงนี้แหละที่ผู้หญิงจมน้ำปีน้ำท่วมใหญ่ ไม่มีใครรู้ชื่อเลย", when: { flag: story_ghost_rumor } }
    - { who: kla, text: "ฝายชะลอน้ำควรอยู่ตรงนี้ครับ ผมวาดไว้สามรอบแล้ว ขาดแค่คนกับไม้ไผ่", when: { flag: meeting1_result_water } }

banter:
  - id: bt_taew_porn_lotto
    place: taew_shop
    lines:
      - { who: porn, text: "แต๋ว ตาแก่มาเชื่อเหล้าอีกแล้วใช่ไหม บอกมาตามตรง" }
      - { who: taew, text: "ไม่ได้เชื่อเหล้านะพร… เชื่อน้ำปลา น้ำปลาสีเหมือนเหล้า" }
      - { who: porn, text: "น้ำปลาขวดเล็ก ฝาเขียว ดีกรีสี่สิบใช่ไหม" }
      - { who: taew, text: "มึงนี่รู้ทันกูตั้งแต่ ป.2 แล้วนะพร" }
  - id: bt_taew_porn_well
    place: taew_shop
    when: { flag: story_well_dry }
    lines:
      - { who: porn, text: "บ่อแกแห้ง บ่อกูแห้ง เหลือบ่อใครบ้างวะแต๋ว" }
      - { who: taew, text: "บ่อหลานยายเพียรไง หลานใจดี" }
      - { who: porn, text: "แกพูดแทนหลานเขาอีกแล้ว" }
      - { who: taew, text: "ก็กูพูดแทนทุกคนในตำบลอยู่แล้ว ไม่ใช่เหรอ" }
  - id: bt_hong_sathian
    place: market
    lines:
      - { who: hong, text: "ดาบ เงาะวันนี้หวานนะ เอาไปกินกิโลนึง" }
      - { who: sathian, text: "ดาบรับไว้ในฐานะประชาชนนะ ไม่ใช่ในฐานะเจ้าหน้าที่" }
      - { who: hong, text: "แล้วโพยใต้แผงเจ๊ล่ะ ดาบเห็นในฐานะอะไร" }
      - { who: sathian, text: "ดาบไม่เห็น… ในทุกฐานะ" }
  - id: bt_somsak_prasert_asleep
    place: sala
    when: { flag: story_meeting1 }
    lines:
      - { who: somsak, text: "ประเสริฐ มึงหลับในประชุมอีกแล้ว ป้าแต๋วนับได้สามรอบ" }
      - { who: prasert, text: "กูหลับตาฟังโว้ย สมศักดิ์ มึงพูดซ้ำสามรอบ กูหลับไปสองรอบก็ยังได้ยินครบ" }
      - { who: somsak, text: "…อันนี้ผู้ใหญ่เถียงไม่ได้ ย้ำอีกครั้งนะ เถียงไม่ได้" }
  - id: bt_somsak_wichai_road
    place: obt
    lines:
      - { who: somsak, text: "นายกฯ หนังสือเรื่องถนนหมู่สาม ฉบับที่สี่ ได้รับหรือยัง" }
      - { who: wichai, text: "ได้รับครับผู้ใหญ่ ผมรับทราบทั้งสี่ฉบับ จัดเรียงตามลำดับไว้อย่างดีครับ" }
      - { who: somsak, text: "ผู้ใหญ่ไม่อยากให้เรียง ผู้ใหญ่อยากให้ลาดยาง" }
      - { who: wichai, text: "การเรียงเป็นขั้นตอนแรกของการลาดยางครับ" }
  - id: bt_heng_kla_price
    place: heng_shop
    lines:
      - { who: kla, text: "เฮียครับ หักความชื้นสิบห้า ข้าวลุงหมานตากมาสามแดดนะครับ" }
      - { who: heng, text: "ไอ้กล้า มึง… น้องกล้า เครื่องวัดเฮียบอกสิบห้า เฮียเชื่อเครื่อง" }
      - { who: kla, text: "เครื่องสหกรณ์บอกสิบสามครับ ผมเชื่อเครื่องผมครับ" }
      - { who: heng, text: "งั้นเอาเครื่องสองเครื่องมาชกกัน เครื่องไหนชนะเฮียจ่ายตามนั้น ฮ่าๆ" }
  - id: bt_heng_thana
    place: company_office
    when: { flag: story_thana_visit }
    lines:
      - { who: heng, text: "คุณธนา ได้ยินว่าจะซื้อลานผม ราคาเท่าไหร่ บอกมาเลย ผมไม่ขาย แค่อยากรู้" }
      - { who: thana, text: "เป็นข้อมูลภายในครับเสี่ย แต่ผมบอกได้ว่าเรามองเสี่ยเป็น partner ครับ" }
      - { who: heng, text: "partner แปลว่าอะไร ปลาเล็กใช่ไหม" }
      - { who: thana, text: "แปลว่าหุ้นส่วนครับ… ในสัดส่วนที่ต่างกันครับ" }
  - id: bt_kla_palm_data
    place: coop_garden
    when: { flag: story_well_dry }
    lines:
      - { who: palm, text: "ตัวเลขบ่อจุดที่ห้าลดอีกสิบเซนต์ ตามหลักวิชาการเรียกว่า… แย่" }
      - { who: kla, text: "ลองคิดดูนะครับ สิบเซนต์ต่อวัน สามสิบวัน สามเมตร… ขอโทษครับ คุณเป็นนักวิชาการ ผมไม่ควรคิดเลขให้ฟัง" }
      - { who: palm, text: "คิดต่อเลย เราชอบฟังคนคิดเลขเพื่อชาวบ้าน มันไม่ค่อยมี ล้อเล่นๆ… ไม่ได้ล้อเล่น" }
  - id: bt_ball_nok_rayong
    place: garage
    when: { weekday: 6 }
    lines:
      - { who: nok, text: "บอล มึงจะไประยองจริงป่ะ ใบสมัครเปื้อนน้ำมันเครื่องจนอ่านไม่ออกแล้ว" }
      - { who: ball, text: "ฟังเสียงก่อน… อาการแบบนี้ ยังไม่พร้อม" }
      - { who: nok, text: "มึงวินิจฉัยตัวเองเหมือนรถอีกแล้ว" }
      - { who: ball, text: "คนก็เครื่องยนต์แบบนึงแหละ แต่ไม่มีคู่มือ" }
  - id: bt_ball_nok_fan
    place: nok_house
    when: { weekday: 7 }
    lines:
      - { who: ball, text: "พัดลมแม่มึงตลับลูกปืนหมด เดี๋ยวดูให้" }
      - { who: nok, text: "มึงซ่อมพัดลมบ้านกูมาสามตัวแล้วนะ บ้านกูมีพัดลมสามตัว" }
      - { who: ball, text: "ก็ตัวที่สามยังไม่ได้ดู" }
  - id: bt_bua_thongbai
    place: house_bua
    lines:
      - { who: thongbai, text: "บัว แกงเห็ดที่กูเอามาให้เมื่อวาน จืดไหม" }
      - { who: bua, text: "ไม่จืดหรอกทองใบ… แต่มึงใส่พริกเยอะ กูไม่กินเผ็ด กูบอกมึงมาหกสิบปี" }
      - { who: thongbai, text: "กูใส่ให้เผ็ดเพราะอยากให้มึงจำว่ากูทำ" }
      - { who: bua, text: "จำได้ทุกถ้วย แสบท้องทุกถ้วย" }
  - id: bt_sommai_phueak
    place: pasture
    lines:
      - { who: sommai, text: "ตาเผือก ไอ้ด่างจามกี่ทีวันนี้" }
      - { who: phueak, text: "สองที เมื่อกี้มันเพิ่งจามอีกที รวมสาม… มึงอย่าเอาไปซื้อหวยนะสมหมาย" }
      - { who: sommai, text: "กูไม่ได้ซื้อ กูแค่จด" }
      - { who: phueak, text: "มึงจดแล้วซื้อทุกงวด" }
  - id: bt_ann_sathian
    place: police
    lines:
      - { who: ann, text: "ดาบคะ วัดความดันเดือนนี้หรือยังคะ" }
      - { who: sathian, text: "ดาบวัดแล้ว… ในใจ ดาบรู้สึกว่าปกติ" }
      - { who: ann, text: "ความรู้สึกไม่ใช่เครื่องวัดนะคะ มานั่งตรงนี้ค่ะ" }
      - { who: sathian, text: "พรุ่งนี้นะหมอ… หมอยืนขวางทางหนีดาบอยู่" }
  - id: bt_ann_mod
    place: pharmacy
    lines:
      - { who: ann, text: "คุณมดคะ วันนี้แก้ข่าวในกลุ่มไปสามเรื่องแล้วค่ะ เรื่องกระเทียมล้างไต" }
      - { who: mod, text: "ผมขายกระเทียมได้สองถุงเมื่อเช้าครับ ข่าวปลอมเพิ่มยอดขายผักครับ" }
      - { who: ann, text: "ขายได้ค่ะ แต่อย่าบอกว่าล้างไตนะคะ" }
      - { who: mod, text: "ผมบอกว่าล้างจานครับ ใช้ทำกับข้าวแล้วต้องล้างจาน" }
  - id: bt_may_wichai
    place: obt
    when: { flag: story_meeting1 }
    lines:
      - { who: may, text: "นายกฯ คะ บริษัทที่ปรึกษาโครงการศึกษาเจ็ดแสนห้า ชื่ออะไรคะ" }
      - { who: wichai, text: "ในส่วนของบริษัทที่ปรึกษา เป็นบริษัทที่มีความเชี่ยวชาญด้านการให้คำปรึกษาครับ" }
      - { who: may, text: "ชื่ออะไรคะ" }
      - { who: wichai, text: "อยู่ในเอกสารครับ เอกสารอยู่ระหว่างการพิจารณาว่าจะเปิดเผยครับ" }
  - id: bt_may_thana
    place: coffee
    when: { flag: story_may_digging }
    lines:
      - { who: may, text: "คุณธนาคะ บริษัทสูบน้ำวันละกี่คิวคะ" }
      - { who: thana, text: "เราบริหารน้ำใต้ดินตามที่ได้รับอนุญาตครับคุณเมย์" }
      - { who: may, text: "แล้วที่ไม่ได้รับอนุญาตล่ะคะ" }
      - { who: thana, text: "กาแฟร้านนี้อร่อยนะครับ… ผมขอตัวก่อนครับ" }
  - id: bt_praew_prasert
    place: kamnan_house
    lines:
      - { who: praew, text: "พ่อคะ คุณธนาชวนกินข้าวอีกแล้วเหรอ พ่อไปสามรอบแล้วนะคะ" }
      - { who: prasert, text: "กำนันไปกินเฉยๆ ไม่ได้เซ็นอะไรโว้ย… ไม่ได้เซ็นนะลูก" }
      - { who: praew, text: "ไม่ต้องเกรงใจแพรวนะคะพ่อ แต่ถ้าพ่อเซ็น แพรวจะไลฟ์" }
  - id: bt_cherd_somsak_time
    place: bus_stop
    lines:
      - { who: cherd, text: "ผู้ใหญ่ เก้าโมงแล้ว จะไปอำเภอไหม" }
      - { who: somsak, text: "ไป รอผู้ใหญ่ถ่ายสำเนาสามชุด" }
      - { who: cherd, text: "เจ้าเขียวไม่รอสำเนา ออกนะ… ขึ้นๆ" }
      - { who: somsak, text: "ผู้ใหญ่ขึ้นแล้ว สำเนาจะตามไปเที่ยวเที่ยง" }
  - id: bt_noi_tam
    place: noi_noodle
    lines:
      - { who: noi, text: "ตั้ม กินข้าวหรือยัง หน้าซีดยังกับข้าวต้มค้างคืน" }
      - { who: tam, text: "กินแล้วครับพี่ ข้าวเวฟเมื่อตีสาม นับเป็นมื้อเช้าหรือมื้อดึกก็ไม่แน่ใจครับ" }
      - { who: noi, text: "นั่งลงเลย พี่ตักให้ ไม่คิดเงิน คิดเป็นการนอนให้พอ" }
  - id: bt_toey_wichai
    place: school
    lines:
      - { who: toey, text: "ท่านนายกฯ คะ ห้องน้ำโรงเรียนไม่มีน้ำมาสองอาทิตย์แล้วค่ะ" }
      - { who: wichai, text: "รับทราบครับคุณครู เรื่องนี้จะนำเข้า…" }
      - { who: toey, text: "เด็กๆ โหวตกันแล้วนะคะ ครูให้เด็กสิบเต็มสิบ ให้ อบต. ศูนย์ค่ะ" }
      - { who: wichai, text: "…ผมขอรับศูนย์นั้นไว้ด้วยความเคารพครับ" }
  - id: bt_mew_oat
    place: sala
    when: { time_from: "15:00", time_to: "18:00" }
    lines:
      - { who: mew, text: "โอ๊ต ทำไมเธอชอบแมลง แมลงไม่ได้ชอบเธอนะ" }
      - { who: oat, text: "ด้วงกว่างตัวนี้ชอบผม! มันเกาะนิ้วผมนานสุดในโรงเรียน" }
      - { who: mew, text: "เพราะมันกลัวตกไง ไม่ใช่เพราะชอบ" }
  - id: bt_sumet_ton
    place: temple
    lines:
      - { who: ton, text: "หลวงพ่อครับ วันนี้มีคนมาถามเลขผมสามคนครับ ผมตอบว่าสูตรคูณแม่เก้าครับ" }
      - { who: sumet, text: "ตอบดีแล้ว สูตรคูณแม่เก้าเอาไปใช้ได้ทั้งชีวิต เลขอื่นใช้ได้แค่วันเดียว" }
      - { who: ton, text: "ถ่านก็ถามครับ แต่ถ่านถามข้าว" }
  - id: bt_jamrat_heng_kathin
    place: temple
    lines:
      - { who: heng, text: "ลุงจำรัส ปีนี้เฮียถวายกฐินห้าหมื่นนะ จดชื่อให้ใหญ่หน่อย" }
      - { who: jamrat, text: "ลุงจดขนาดตัวหนังสือเท่ากันทุกคนนะเสี่ย สิบบาทก็ตัวเท่านี้ ห้าหมื่นก็ตัวเท่านี้" }
      - { who: heng, text: "งั้นเฮียขอจดสองบรรทัดได้ไหม" }
      - { who: jamrat, text: "ได้ ถ้าถวายสองครั้ง" }
  - id: bt_hong_porn
    place: market
    lines:
      - { who: porn, text: "เจ๊หงษ์ ห้ามขายเลขให้ตาแก่นะ ป้าเตือนครั้งสุดท้าย" }
      - { who: hong, text: "เจ๊ขายผลไม้ย่ะ ป้าพร จะเอาส้มโอไหม หวานกว่าคำเตือนป้า" }
      - { who: porn, text: "เอาสองลูก… แล้วห้ามขายเลขให้ตาแก่" }
      - { who: hong, text: "ส้มโอสองลูก ร้อยบาท คำเตือนแถมฟรีย่ะ" }
  - id: bt_kla_thana_tank
    place: sala
    when: { flag: story_meeting2 }
    lines:
      - { who: kla, text: "คุณธนาครับ ผมขอถามแบบไม่มีศัพท์อังกฤษนะครับ น้ำในถังมาจากใต้บ้านใคร" }
      - { who: thana, text: "จากแหล่งน้ำใต้ดินในพื้นที่ครับ" }
      - { who: kla, text: "พื้นที่ของใครครับ" }
      - { who: thana, text: "…ผมขอรับไปเป็นการบ้านอีกข้อครับ" }
  - id: bt_taew_bua_ghost
    place: house_bua
    when: { flag: story_ghost_rumor }
    lines:
      - { who: taew, text: "ยายบัว ผู้หญิงบนท่อน้ำมีจริงไหมจ๊ะ หนูนอนไม่หลับมาสามคืนแล้ว" }
      - { who: bua, text: "มีหรือไม่มี แต๋วก็ไม่ต้องเดินผ่าน ไม่ต้องรู้ก็นอนหลับได้" }
      - { who: taew, text: "แต่หนูอยากรู้" }
      - { who: bua, text: "นั่นแหละ ที่นอนไม่หลับไม่ใช่เพราะผีหรอก เพราะอยากรู้" }
  - id: bt_piak_somsak
    place: workshop
    lines:
      - { who: somsak, text: "เปี๊ยก หลังคาศาลารั่ว ผู้ใหญ่ทำหนังสือขอ อบต. แล้ว" }
      - { who: piak, text: "รอ อบต. ฝนหมดฤดูพอดีผู้ใหญ่ เดี๋ยวพี่ขึ้นไปดูให้ ไม่คิดค่าแรง" }
      - { who: somsak, text: "ขอบใจ ย้ำอีกครั้งนะ ขอบใจ… หนังสือผู้ใหญ่ยังส่งนะ เผื่อไว้" }
  - id: bt_tam_sathian
    place: store24
    when: { time_from: "18:00", time_to: "24:00" }
    lines:
      - { who: sathian, text: "ตั้ม เมื่อคืนเห็นรถกระบะไม่เปิดไฟผ่านหน้าร้านไหม" }
      - { who: tam, text: "เห็นครับ สามรอบ กล้องร้านจับได้ครับ จะดูไหมครับ" }
      - { who: sathian, text: "…ดาบดูพรุ่งนี้นะ" }
      - { who: tam, text: "กล้องลบอัตโนมัติทุกเจ็ดวันครับ พรุ่งนี้ยังทันครับ อีกหกวันก็ยังทันครับ" }
  - id: bt_daeng_phueak
    place: forest_edge
    lines:
      - { who: daeng, text: "เผือก ควายมึงเข้ามาแทะหน่อไม้ในป่าชุมชนอีกแล้ว" }
      - { who: phueak, text: "มันหิว หนองแห้ง หญ้าแห้ง มันก็ต้องหาเอง เหมือนคนแหละแดง" }
      - { who: daeng, text: "เออ… ให้มันกินพอกิน ไม่ต้องกินเกิน" }
      - { who: phueak, text: "ควายกูไม่เคยกินเกิน มีแต่บริษัทที่กินเกิน" }
  - id: bt_chan_bua
    place: house_chan
    lines:
      - { who: chan, text: "บัว เจ้ามาเบิ่งลายใหม่ข้อยแล้วบ่ ลายนาคน้ำ" }
      - { who: bua, text: "สวยนะจันทร์ ทอขอฝนเหรอ" }
      - { who: chan, text: "แม่น ขอฝน ขอน้ำ ขอให้บ่อเต็ม ผ้าผืนเดียวขอหลายเรื่อง" }
      - { who: bua, text: "ผ้ามันรับไหวนะ คนเรานั่นแหละรับไม่ค่อยไหว" }
  - id: bt_wichai_heng_signs
    place: heng_shop
    when: { flag: story_election_announced }
    lines:
      - { who: wichai, text: "เสี่ยครับ ป้ายของภรรยาผม สั่งเพิ่มอีกห้าสิบแผ่นครับ" }
      - { who: heng, text: "ได้ครับนายก จ่ายสดลดห้า ผ่อนบวกสิบ… ภรรยาท่านลงสมัคร ใครจ่ายครับ" }
      - { who: wichai, text: "ในส่วนของการจ่าย… ผมขอรับทราบไว้ก่อนครับ" }
      - { who: heng, text: "รับทราบแล้วจ่ายด้วยนะครับ ฮ่าๆ" }
  - id: bt_may_ball_bike
    place: garage
    lines:
      - { who: may, text: "บอล มอเตอร์ไซค์เรามีเสียงแปลกๆ ตอนเบรก" }
      - { who: ball, text: "ฟังเสียงก่อน… อาการแบบนี้ เจ้าของขับไปทำข่าวเยอะเกิน" }
      - { who: may, text: "เป็นอาการทางเครื่องยนต์หรือทางจริยธรรม" }
      - { who: ball, text: "ทั้งสองอย่าง ผ้าเบรกหมด" }
  - id: bt_somsak_ann_retire
    place: clinic
    when: { flag: story_election_announced }
    lines:
      - { who: somsak, text: "หมอแอน ผู้ใหญ่จะเกษียณแล้ว ต่อไปไม่ต้องย้ำแล้ว" }
      - { who: ann, text: "ไม่ได้ค่ะผู้ใหญ่ ยาความดันต้องย้ำทุกวันค่ะ" }
      - { who: somsak, text: "งั้นหมอย้ำแทนผู้ใหญ่นะ" }
      - { who: ann, text: "ย้ำอีกครั้งนะคะ ยาความดัน… หนูติดจากผู้ใหญ่แล้วค่ะ" }
  - id: bt_noi_hong_price
    place: noi_noodle
    when: { flag: story_well_dry }
    lines:
      - { who: hong, text: "หน่อย ขึ้นราคาห้าบาท ไม่กลัวลูกค้าหายเหรอ" }
      - { who: noi, text: "กลัวจ้ะเจ๊ แต่กลัวน้ำซุปไม่มีน้ำมากกว่า" }
      - { who: hong, text: "ทั้งตำบลขึ้นราคาเพราะบ่อแห้ง มีเจ้าเดียวไม่ขึ้น บริษัท น้ำขวดเขาแจกฟรี เพราะเอาของเราไปฟรีย่ะ" }
