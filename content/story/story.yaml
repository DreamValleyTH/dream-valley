      - { who: somsak, text: "ผู้ใหญ่อายุครบหกสิบแล้ว… ผู้ใหญ่ขอบคุณพี่น้องที่ฟังผู้ใหญ่ย้ำมาตลอดสิบแปดปี" }
      - { who: somsak, text: "…ย้ำอีกครั้งนะ ขอบคุณ" }
