      - text: "ยกมือ ‘ตลาดนัด’"
        effect: { set_flag: vote_market, heart: { taew: 2, hong: 1, noi: 1 }, text: "ป้าแต๋วตบเข่าดังป้าบ ‘หลานป้า!’ ป้าพรหันมาค้อน ‘หลานยายเพียรต่างหาก’" }
    effect: { set_flag: story_meeting1 }

  - id: st_d7_meeting1_c
    chapter: 1
    when: { day_min: 7, day_max: 7, flag: story_meeting1, not_flag: story_meeting1_c }
    trigger: visit
    place: sala
    art: meeting
    title: "นับมือ"
    beats:
      - { who: somsak, text: "นับนะ… สามสิบเก้า สี่สิบ… ตาเผือกเอามือลง! …สี่สิบเอ็ด" }
      - { who: somsak, text: "นับรอบสอง ได้ตัวเลขไม่เหมือนรอบแรก นับรอบสาม ได้ตัวเลขใหม่อีก ย้ำอีกครั้งนะ… ผู้ใหญ่จะนับใหม่ที่บ้าน" }
      - { who: wichai, text: "เพื่อความโปร่งใส อบต. จะรับผลการนับไปพิจารณา และประกาศผลพรุ่งนี้เช้าครับ โปร่งใสแน่นอน ใสจนมองไม่เห็นครับ" }
      - { who: prasert, text: "(ตื่นเต็มตา) สรุปอะไรชนะ" }
      - { who: taew, text: "ยังไม่รู้จ้ะกำนัน แต่ขนมหมดแล้ว อันนั้นแน่นอน" }
    effect: { set_flag: story_meeting1_c }

  # ---------------------------------------------------------------------------
  # วันที่ 8 — ผลโหวต (ตามที่ผู้เล่นโหวต · ทุกทางโดน ‘ศึกษาความเป็นไปได้’ ไปครึ่ง)
  # ---------------------------------------------------------------------------
  - id: st_d8_result_water
    chapter: 1
    when: { day_min: 8, day_max: 10, flag: vote_water, not_flag: meeting1_result_water }
    trigger: morning
    art: meeting
    title: "ระบบน้ำชนะ (ครึ่งหนึ่ง)"
    beats:
      - { who: somsak, text: "ผลการลงคะแนน ระบบน้ำ สี่สิบเอ็ด ถนน สี่สิบ ตลาดนัด สี่สิบ ระบบน้ำชนะไปหนึ่งเสียง ย้ำอีกครั้งนะ หนึ่งเสียง" }
      - { who: somsak, text: "ผู้ใหญ่ไม่ได้บอกนะว่าเสียงไหน… แต่ผู้ใหญ่ขอบคุณหลานยายเพียรที่มาประชุม" }
      - { who: wichai, text: "(เสียงแทรกเข้ามาในไมค์) อบต. รับทราบมติครับ และจะดำเนินการอย่างเป็นรูปธรรม ขั้นแรก จัดสรรเจ็ดแสนห้าหมื่นบาท สำหรับโครงการศึกษาความเป็นไปได้ของระบบน้ำครับ" }
      - { who: somsak, text: "…ย้ำอีกครั้งนะ เจ็ดแสนห้า ศึกษา ส่วนที่เหลือ… ทำระบบน้ำ ได้หนึ่งจุด… ครึ่งจุด" }
      - { who: narrator, text: "ครึ่งหนึ่งของงบ เพื่อศึกษาว่าน้ำ… เป็นสิ่งจำเป็นหรือไม่ บริษัทที่ปรึกษามาจากกรุงเทพฯ ไม่มีใครเคยเห็นหน้า" }
      - { who: narrator, text: "ห้านาทีต่อมา กล้าโพสต์ในกลุ่ม LINE เป็นตัวเลขสามย่อหน้า ลงท้าย ‘ขอโทษครับ ผมเทศน์อีกแล้ว แต่เจ็ดแสนห้าขุดบ่อตื้นได้สิบห้าบ่อนะครับ’" }
    choices:
      - text: "ไปถามนายกฯ ว่าศึกษาอะไรตั้งเจ็ดแสน"
        effect: { heart: { wichai: -1, kla: 1 }, text: "นายกฯ ตอบว่า ‘ศึกษาความเป็นไปได้ครับ’ ถามว่าความเป็นไปได้ของอะไร ‘ของการศึกษาครับ’" }
      - text: "อย่างน้อยก็ได้มาครึ่งหนึ่ง"
        effect: { heart: { somsak: 1 }, text: "ผู้ใหญ่สมศักดิ์พยักหน้า ‘ครึ่งหนึ่งก็มากกว่าปีที่แล้ว ปีที่แล้วได้ป้าย’" }
    effect: { set_flag: meeting1_result_water }

  - id: st_d8_result_road
    chapter: 1
    when: { day_min: 8, day_max: 10, flag: vote_road, not_flag: meeting1_result_road }
    trigger: morning
    art: meeting
    title: "ถนนชนะ (แปดร้อยเมตร)"
    beats:
      - { who: somsak, text: "ผลการลงคะแนน ถนนลาดยาง สี่สิบเอ็ด ระบบน้ำ สี่สิบ ตลาดนัด สี่สิบ ถนนชนะไปหนึ่งเสียง ย้ำอีกครั้งนะ หนึ่งเสียง" }
      - { who: wichai, text: "(เสียงแทรก) อบต. รับทราบมติครับ ขั้นแรก จัดสรรเจ็ดแสนห้าหมื่นบาท เพื่อศึกษาความเป็นไปได้และผลกระทบด้านฝุ่นของถนนลูกรังครับ" }
      - { who: wichai, text: "ส่วนงบที่เหลือ ลาดยางได้แปดร้อยเมตรครับ เริ่มจากหน้าลานรับซื้อ ไปสิ้นสุดที่… หลังลานรับซื้อครับ เป็นจุดที่มีการสัญจรหนาแน่นที่สุดครับ" }
      - { who: somsak, text: "…ย้ำอีกครั้งนะ แปดร้อยเมตร หน้าลาน ถึงหลังลาน" }
      - { who: narrator, text: "ผู้รับเหมาคือ หจก. รุ่งเรืองก่อสร้าง ซึ่งบังเอิญเป็นของน้องภรรยานายกฯ บังเอิญมากจนไม่มีใครแปลกใจ" }
      - { who: narrator, text: "ห้านาทีต่อมา ลุงเชิดโพสต์ในกลุ่ม ‘เจ้าเขียวจะได้วิ่งบนยางแปดร้อยเมตร แล้วตกหลุมต่ออีกสิบเอ็ดกิโล ขอบคุณครับ’" }
    choices:
      - text: "อย่างน้อยรถก็วิ่งสะดวกขึ้นนิดนึง"
        effect: { heart: { heng: 1 }, text: "เสี่ยเฮงโทรมาขอบคุณ ‘น้องมีวิสัยทัศน์ เดี๋ยวเฮียลดดอกให้ครึ่งเปอร์เซ็นต์ ครึ่งเปอร์เซ็นต์ก็คือน้ำใจนะ’" }
      - text: "แปดร้อยเมตร… ลานเสี่ยเฮงล้วนๆ เลยนี่นา"
        effect: { heart: { kla: 1, heng: -1 }, text: "เมย์รีโพสต์ประโยคนี้พร้อมแผนที่ ยอดแชร์สูงสุดของเพจเธอในเดือนนี้" }
    effect: { set_flag: meeting1_result_road }

  - id: st_d8_result_market
    chapter: 1
    when: { day_min: 8, day_max: 10, flag: vote_market, not_flag: meeting1_result_market }
    trigger: morning
    art: meeting
    title: "ตลาดนัดชนะ (มีหลังคาครึ่งเดียว)"
    beats:
      - { who: somsak, text: "ผลการลงคะแนน ตลาดนัด สี่สิบเอ็ด ระบบน้ำ สี่สิบ ถนน สี่สิบ ตลาดนัดชนะไปหนึ่งเสียง ย้ำอีกครั้งนะ หนึ่งเสียง" }
      - { who: wichai, text: "(เสียงแทรก) อบต. รับทราบมติครับ ขั้นแรก เจ็ดแสนห้าหมื่นบาท เพื่อศึกษาความเป็นไปได้ของพฤติกรรมการจับจ่ายของประชาชนครับ" }
      - { who: wichai, text: "งบส่วนที่เหลือ สร้างหลังคาตลาดได้ครึ่งหนึ่งครับ อีกครึ่งเป็นพื้นที่กลางแจ้ง เพื่อส่งเสริมวิถีชีวิตแบบดั้งเดิมครับ" }
      - { who: somsak, text: "…ย้ำอีกครั้งนะ แผงฝั่งตะวันตกมีหลังคา ฝั่งตะวันออกมีวิถีชีวิต" }
      - { who: narrator, text: "ห้านาทีต่อมา เจ๊หงษ์โพสต์ในกลุ่ม ‘เจ๊จองฝั่งหลังคา ใครแย่งเจ๊บอกเลย ฝนตกเปียกคนเดียวย่ะ’ ป้าแต๋วตอบด้วยสติกเกอร์ดอกไม้สามดอก" }
    choices:
      - text: "ครึ่งหลังคาก็ยังดี ร้านป้าแต๋วจะคึกคัก"
        effect: { heart: { taew: 1, hong: 1 }, text: "ป้าแต๋วส่งสติกเกอร์หัวใจมาในแชตส่วนตัวสิบสองดวง แล้วตามด้วย ‘กดผิดจ้ะ’" }
      - text: "ศึกษาพฤติกรรมการจับจ่าย… เจ็ดแสน?"
        effect: { heart: { may: 1 }, text: "เมย์ทักมา ‘ถามเหมือนเราเลย ถ้าอยากรู้พฤติกรรมการจับจ่าย ถามป้าแต๋วฟรีๆ ก็ได้ แม่นกว่าด้วย’" }
    effect: { set_flag: meeting1_result_market }

  - id: st_d9_sign
    chapter: 1
    when: { day_min: 9, day_max: 12, map: town, flag: story_meeting1 }
    trigger: enter_map
    art: village
    title: "ป้ายมาก่อนงาน"
    beats:
      - { who: narrator, text: "หน้า อบต. มีป้ายไวนิลใหม่เอี่ยม ใหญ่กว่าป้ายเก่า ‘โครงการศึกษาความเป็นไปได้ งบประมาณ 750,000 บาท’ พร้อมรูปนายกฯ ยิ้มเต็มป้าย" }
      - { who: wichai, text: "(ถือกรรไกรอันใหญ่) พิธีเปิดป้ายครับ ป้ายนี้เป็นสัญลักษณ์ของความตั้งใจครับ ความตั้งใจที่จะเริ่มครับ" }
      - { who: praew, text: "(ถือไม้เซลฟี่) สวัสดีค่ะทุกคนที่ดูไลฟ์ ตอนนี้ยอดวิวสิบสองคน หนึ่งในนั้นคือพ่อแพรว… พ่อ ออกจากไลฟ์ได้แล้ว พ่อยืนอยู่ข้างหลังแพรวนี่" }
      - { who: sathian, text: "(กอดอกยืนในร่ม) ดาบมารักษาความปลอดภัยให้ป้าย… ป้ายปลอดภัยดี" }
      - { who: may, text: "(กระซิบ) ป้ายนี้ค่าทำหนึ่งหมื่นห้า เราขอใบเสร็จไปแล้ว ได้คำตอบว่า ‘อยู่ระหว่างการพิจารณา’ ใบเสร็จก็ต้องพิจารณาเหรอ" }
    choices:
      - text: "ปรบมือตามคนอื่น"
        effect: { heart: { wichai: 1 }, text: "นายกฯ ชี้มาที่คุณ ‘ขอบคุณคนรุ่นใหม่ครับ’ แล้วกล้องไลฟ์ของแพรวก็หันมาซูมหน้าคุณเต็มจอ" }
      - text: "ถามดังๆ ว่าเมื่อไหร่จะเริ่มทำจริง"
        effect: { heart: { wichai: -1, may: 1, somsak: 1 }, text: "ทุกคนเงียบ นายกฯ ตอบ ‘หลังจากศึกษาเสร็จครับ’ ถามต่อว่าศึกษาเสร็จเมื่อไหร่ ‘หลังจากเริ่มศึกษาครับ’ ผู้ใหญ่สมศักดิ์แอบยกนิ้วโป้งให้ใต้แขนเสื้อ" }
      - text: "เดินไปซื้อน้ำแข็งไสร้านป้าแต๋วแทน"
        effect: { energy: 5, heart: { taew: 1 }, text: "ป้าแต๋วตักน้ำแข็งไสให้พูนกว่าปกติ ‘กินกันร้อน… ดูนายกฯ ตัดริบบิ้นทีไร ป้าร้อนทุกที’" }
    effect: { set_flag: story_sign_up }

  # ---------------------------------------------------------------------------
  # ชีวิตประจำวัน + บ่อแห้ง (วันที่ 9–14)
  # ---------------------------------------------------------------------------
  - id: st_life_power_out
    chapter: 1
    when: { day_min: 9, day_max: 9, time_from: "19:00", time_to: "20:20" }
    trigger: hour
    art: night
    title: "ไฟดับทั้งตำบล"
    beats:
      - { who: narrator, text: "หนึ่งทุ่มตรง ไฟดับพรึ่บ ทั้งบ้าน ทั้งทุ่ง ทั้งตำบล เหลือแต่ดาวกับแสงจอมือถือ" }
      - { who: narrator, text: "ในกลุ่ม LINE ป้าแต๋วโพสต์ก่อนการไฟฟ้า ‘ป้าบอกแล้ว ช่างไฟมาซื้อกาแฟร้านป้าเมื่อวาน’" }
      - { who: somsak, text: "(ตะโกนผ่านโทรโข่งมือถือ เพราะหอกระจายข่าวก็ไม่มีไฟ) พี่น้อง! ไฟดับ! ย้ำอีกครั้งนะ… ไฟ… ดับ!" }
      - { who: narrator, text: "ไกลๆ มีแสงไฟเดียวที่ยังสว่าง ร้าน 24 ชั่วโมงของตั้ม เครื่องปั่นไฟคำรามเหมือนรถไถ ชาวบ้านเริ่มเดินไปมุงหน้าร้านเหมือนแมลงเม่า" }
      - { who: narrator, text: "และอีกแสงหนึ่งไกลกว่า สว่างจ้าไม่สะดุ้งสะเทือน… รั้วบริษัท บ่อบาดาลยังปั๊มน้ำได้ ไม่มีใครรู้ว่าเขาใช้ไฟจากไหน" }
    choices:
      - text: "จุดเทียนนั่งดูดาวที่บันได"
        effect: { energy: 10, text: "ดาวเยอะจนนับไม่ไหว นึกขึ้นได้ว่าตั้งแต่ทำงานไม่เคยเงยหน้าเลยสักคืน ยุงกัดสิบสองแผล คุ้ม" }
      - text: "เดินไปนั่งตากแอร์ร้านตั้ม"
        effect: { heart: { tam: 1 }, text: "ตั้มยืนนิ่งหลังเคาน์เตอร์ ‘ไฟดับครับ แต่โปรโมชั่นยังเปิด ซื้อสองแถมหนึ่ง… ผีก็ได้สิทธิ์นะครับ’" }
      - text: "โทรหาแม่ แบตเหลือสิบสองเปอร์เซ็นต์"
        effect: { text: "แม่ตกใจ ‘ไฟดับเหรอลูก! ปิดตู้เย็นไว้นะ อย่าเปิด’ พ่อเสริม ‘ในตู้มีแต่น้ำเปล่ากับน้ำพริก ไม่ต้องห่วงลูก’" }
    effect: { set_flag: story_power_out }

  - id: st_life_parcel
    chapter: 1
    when: { day_min: 10, day_max: 12, map: farm }
    trigger: morning
    art: phone
    title: "พัสดุจากแม่"
    beats:
      - { who: narrator, text: "มอเตอร์ไซค์ไปรษณีย์มาจอดปากทาง บีบแตรสามที กล่องกระดาษพันเทปเหลืองแน่นเหมือนมัมมี่" }
      - { who: narrator, text: "ข้างในมี น้ำพริกเผาสามกระปุก กล้วยตากหนึ่งถุง ยากันยุง ยาดม และมุ้งใหม่ ทุกอย่างห่อถุงพลาสติกสามชั้น" }
      - { who: mom, text: "(โน้ตลายมือ) ‘น้ำพริกฝาแดงเผ็ดมาก กินกับข้าวสวยนะ อย่ากินกับข้าวเวฟ แม่รู้นะว่ากิน — แม่’" }
      - { who: dad, text: "(เขียนต่อข้างล่างตัวเล็กกว่า) ‘ปั๊มน้ำไม่ติดให้เคาะข้างๆ สองที — พ่อ’ (ใต้นั้นแม่เขียนอีกบรรทัด) ‘อย่าเคาะ เรียกช่าง — แม่’" }
    choices:
      - text: "โทรขอบคุณแม่"
        effect: { items: { nam_prik_pao: 1, dried_banana: 1 }, text: "แม่รับสายตอนวินาทีแรก เหมือนนั่งถือโทรศัพท์รอ ‘ได้แล้วเหรอลูก! ปลาร้าที่แม่ใส่รั่วไหม’ …แม่ไม่ได้ใส่ปลาร้ามา แต่แม่จำว่าใส่" }
      - text: "เอากล้วยตากไปแบ่งป้าแต๋ว"
        effect: { items: { nam_prik_pao: 1 }, heart: { taew: 1 }, text: "ป้าแต๋วรับไปแล้วเล่าให้ทุกคนที่เข้าร้านฟังว่าแม่หลานยายเพียรตากกล้วยเก่งกว่ายาย ซึ่งยายไม่เคยตากกล้วย" }
    effect: { set_flag: story_parcel_1 }

  - id: st_d10_well_taew
    chapter: 1
    when: { day_min: 10, day_max: 12, time_from: "07:00", time_to: "18:00", flag: story_meeting1 }
    trigger: visit
    place: taew_shop
    art: well
    title: "บ่อหลังร้านแห้ง"
    beats:
      - { who: narrator, text: "หน้าร้านป้าแต๋วมีคนมุงห้าหกคน ไม่มีใครซื้อของ ทุกคนมองลงไปในบ่อหลังร้าน" }
      - { who: taew, text: "หลาน! มาดูนี่ บ่อป้า! สามสิบปีไม่เคยแห้ง ปีน้ำท่วมยังล้น ปีแล้งยังตักได้" }
      - { who: narrator, text: "ถังสังกะสีหย่อนลงไปจนสุดเชือก ดึงขึ้นมามีแต่โคลนสีเทาติดก้นถัง" }
      - { who: porn, text: "แห้งผากเหมือนกระเป๋าตาแก่หลังหวยออก" }
      - { who: sathian, text: "ดาบมาดูแล้วนะ… บ่อแห้งไม่ใช่คดีอาญา ดาบช่วยได้แค่มองด้วยความเห็นใจ" }
      - { who: taew, text: "ป้าไม่ได้พูดนะ แต่เขาว่ากันว่าตั้งแต่บริษัทเจาะบ่อบาดาลท้ายตลาด รถน้ำวิ่งทั้งคืน… ป้าได้ยินเสียงปั๊มตอนตีสองทุกคืน" }
      - { who: heng, text: "(ตะโกนจากร้านฝั่งตรงข้าม) ปั๊มน้ำลดสิบเปอร์เซ็นต์นะพี่น้อง! วันนี้วันเดียว! …เฮียไม่ได้ดีใจนะ เฮียแค่มีของ" }
    choices:
      - text: "ตักโคลนใส่ขวดเก็บไว้เป็นหลักฐาน"
        effect: { items: { dry_well_water: 1 }, heart: { taew: 1 }, text: "ป้าแต๋วมองขวดโคลนแล้วเงียบไปนาน ‘เก็บไว้นะหลาน วันไหนมีคนบอกว่าไม่มีอะไรเกิดขึ้น เอาให้เขาดู’" }
      - text: "ป้ามาตักน้ำบ่อ{p}ไปใช้ก่อนไหม{kq}"
        effect: { heart: { taew: 2 }, set_flag: story_share_well, text: "‘จริงเหรอหลาน… ขอแค่วันละสองถังพอ ยายเพียรก็เคยให้ป้าตักตอนปีแล้ง’ ป้าน้ำตาซึม แล้วรีบบอกว่าฝุ่นเข้าตา" }
      - text: "ซื้อน้ำดื่มป้าสักแพ็ค"
        effect: { money: -60, heart: { taew: 1 }, text: "ป้ารับเงินแล้วหัวเราะทั้งน้ำตา ‘ขายน้ำได้เพราะบ่อแห้ง ป้าควรดีใจไหมเนี่ย’" }
    effect: { set_flag: story_well_dry }

  - id: st_d12_well_sommai
