# โครงเรื่ององก์ 2–3 และฉากจบ (ยังไม่ใช่ข้อมูลเล่นได้)
# =============================================================================
outline:
  act2:
    title: "น้ำใต้ดิน"
    days: "วันที่ 29–84 (ประมาณ 2 เดือนในเกม จบที่วันเลือกตั้ง)"
    beats:
      - "เปิดองก์: หลานยายเพียรเอาสัญญาค้ำประกันไปถามผู้ใหญ่สมศักดิ์ (หรือผู้ใหญ่มาหาเองถ้าได้ฉาก story_guarantee_hint) ฉบับที่อยู่กับผู้ใหญ่ขึ้นราจนอ่านไม่ออกครึ่งหน้า ฉบับในตู้ อบต. นายกฯ วิชัยตอบว่า ‘อยู่ระหว่างการค้นหาครับ ซึ่งการค้นหาก็คือการค้นครับ’"
      - "ปมกลาง: ประปาหมู่บ้านปี 2539 กู้ธนาคาร 2.4 ล้าน ยายเพียรเป็นผู้ค้ำโดยเอาที่ดินแปลงนี้ค้ำไว้ เงินกองทุนจ่ายคืนไม่ครบเพราะมีก้อนหนึ่ง ‘หาย’ สมัยประธานกองทุนคนแรก (พยานคนที่ถูกขีดชื่อ) ถ้ากองทุนผิดนัด ที่ดินยายตกเป็นประกัน — ผู้เล่นจะได้รู้ว่าบริษัทแอบติดต่อธนาคารเพื่อ ‘ซื้อหนี้’ ก้อนนี้อยู่ นี่คือเหตุผลที่ราคาขึ้นไว (thana_haggled) และที่หมุดแดงเขียนว่า ‘แปลง 17 – เป้าหมาย’"
      - "บริษัทเร่งสูบน้ำ: บ่อแห้งลามจากหมู่สามไปหมู่สี่ สหกรณ์ของกล้าเสียแปลงผักครึ่งหนึ่ง เครื่องวัดของปาล์มบันทึกระดับน้ำลดทุกวัน (ถ้ามี story_palm_gauge ได้กราฟใช้เป็นหลักฐาน) รถน้ำบริษัทวิ่งบนถนน 800 เมตรของเสี่ยเฮง (ถ้าโหวตถนน) หรือข้ามหลังคาตลาดครึ่งเดียว (ถ้าโหวตตลาด)"
      - "เควสต์ลงแรงสร้างฝาย (ถ้า meeting1_result_water) — ผู้เล่นรวมชาวบ้านทำฝายชะลอน้ำที่คลองส่งน้ำด้วยมือ ไม่ใช้งบ ไม่ต้องมีป้าย สายชุมชนเริ่มตรงนี้ · สายบริษัท: จ่ายเงินให้บริษัททำ ‘ฝายสำเร็จรูป’ เร็วกว่า แต่มีโลโก้หยดน้ำยิ้มติดหัวฝาย"
      - "เลือกตั้งสองสนามพร้อมกัน: ผู้ใหญ่บ้านหมู่สาม (ผู้ใหญ่สมศักดิ์เกษียณ) และนายก อบต. — ผู้สมัครนายกฯ: คุณนายพเยาว์ (ภรรยานายกฯ วิชัย ‘สานต่องานที่ยังไม่เสร็จ’) กับผู้สมัครที่บริษัทหนุนเงียบๆ (ข่าวลือว่าเสี่ยเฮง เฮียปฏิเสธทุกวันแต่ป้ายมีหน้าเฮียเพิ่มทุกวัน) — กล้าถูกชาวบ้านดันให้ลง ผู้เล่นเลือกได้ว่าจะลงเอง (ผู้ใหญ่บ้านหรือนายกฯ) เป็นทีมกล้า หรือไม่ลง"
      - "หาเสียง: รถแห่วนทั้งวัน บัญชีอวตารในกลุ่ม LINE (รักดงเย็น2569 คนดีศรีดงเย็น ชาวนาตัวจริง88) โครงการใหม่ผุดเหมือนเห็ด ซองกฐินหาเสียง ผู้เล่นทำได้: ปราศรัยที่ศาลา เคาะประตู ใช้หอกระจายข่าว (ประกาศเรื่องดีคะแนนขึ้น ประกาศโฆษณาตัวเองคนเบื่อ) และทางเลือกยั่วใจ: รับซองบริษัท ทำโครงการแค่ป้าย ฝากคนเข้าทำงาน"
      - "เรื่องของเมย์: ถ้า helped_may + story_pipe_photo + กราฟปาล์ม + รายชื่อกล้า + สัญญายาย ครบอย่างน้อย 3 ชิ้น เมย์ปล่อยข่าวใหญ่ ‘ท่อเส้นที่สอง’ และเปิดโปงว่าบริษัทที่ปรึกษา ‘ศึกษาความเป็นไปได้’ 750,000 บาท มีที่อยู่เดียวกับสำนักงานกฎหมายของบริษัท · ถ้าไม่ครบ ข่าวเงียบ เมย์ถูกฟ้องหมิ่นประมาท ผู้เล่นช่วยหาเงินประกันตัว/หาพยานได้"
      - "คุณธนา: ถ้าหัวใจธนา ≥5 เขาเริ่มสารภาพเป็นชิ้นๆ (จดหมายลาออกในลิ้นชักฉบับที่สี่สะกดถูกทุกตัว) ถ้าผู้เล่นปฏิเสธแรงทุกครั้ง เขาจะส่งทนายแทนตัวเอง"
      - "ผีแม่ธรณี: ถ้า story_merit_drowned ผู้เล่นทำบุญที่วัดดงเย็นให้ผู้หญิงที่จมน้ำ (กับพระอาจารย์สุเมธ ยายบัว) ผีบนท่อหายไป ปั๊มบริษัทกลับ ‘ดับเอง’ ทุกคืนแทน คนงานไม่กล้าเข้ากะดึก — ไม่ใช่ปาฏิหาริย์ แค่คนกลัว และความกลัวทำให้สูบน้ำช้าลงพอให้บ่อชาวบ้านฟื้นนิดหนึ่ง"
      - "คืนหมาหอน (คืนก่อนเลือกตั้ง): หมาทั้งตำบลหอน มีคนเดินแจกซองตามบ้าน ผู้เล่นรับหรือไม่รับก็ได้ รับแล้วเลือกใครก็ได้ แต่ฝ่ายที่ให้จะจำได้ (มีผลกับบทพูดและข่าวลือในองก์ 3) ผีออกตามปกติ คนแจกซองโดนผีไล่ไปสองคน"
      - "วันเลือกตั้ง: ผลขึ้นกับคะแนนนิยมผู้เล่น/ทีมกล้า ข่าวของเมย์ เงินซอง และหัวใจคนสำคัญ (ป้าแต๋ว ยายบัว กำนัน ลุงสมหมาย) · ปิดองก์: ผู้ชนะแถลงที่ศาลา แล้วโทรศัพท์ทุกเครื่องเด้งข่าวจากส่วนกลาง: ‘นโยบายเปลี่ยนที่ ส.ป.ก. เป็นโฉนด’ ทั้งศาลาเงียบ คุณธนายิ้มกว้างที่สุดตั้งแต่มาอยู่ตำบล → องก์ 3"
  act3:
    title: "ที่ดินของใคร"
    days: "วันที่ 85–140 (ประมาณ 2 เดือน + บทส่งท้าย)"
    beats:
      - "ส.ป.ก. กลายเป็นโฉนด ขายได้ จำนองได้ ทั้งตำบลตื่นเต้นและหวาดกลัวพร้อมกัน บริษัทเปิดโต๊ะรับซื้อที่หน้าตลาด ราคาสูงกว่าตลาดสามเท่า มีคนเข้าคิวตั้งแต่ตีห้า"
      - "เกษตรพันธสัญญา: บริษัทเสนอสัญญาให้ชาวบ้านปลูกตามสั่ง รับซื้อทั้งหมด ‘ไม่ต้องขายที่ก็ได้ครับ แค่ขายอนาคต’ — ผู้เล่นเซ็นได้หลายฉบับ (จำนวนสัญญามีผลกับฉากจบ) กล้าเสนอทางเลือกสหกรณ์ที่ได้น้อยกว่าแต่เป็นของตัวเอง"
      - "กำนันประเสริฐลังเลขายที่ผืนใหญ่ แพรวกับพ่อทะเลาะกันครั้งแรกในไลฟ์ ลุงสมหมายกับป้าพรแบ่งฝ่ายกันเอง ป้าแต๋วขายร้านหรือไม่ขาย — ผู้เล่นช่วยคุยได้ทีละบ้าน (ใช้ปากหวาน)"
      - "สัญญาของยาย: บริษัทซื้อหนี้กองทุนประปาจากธนาคารสำเร็จ ส่งหนังสือทวงถึงหลานยายเพียร ‘ผู้รับมรดกของผู้ค้ำประกัน’ ทางออก: (ก) ชาวบ้านลงขันใช้หนี้กองทุนเอง (ข) เปิดโปงเงินที่หายไปให้ อบต. ต้องรับผิด (ค) ขายที่ให้บริษัทแล้วจบ (ง) ผู้เล่นจ่ายเองถ้ารวยพอ"
      - "ความจริงเรื่องพยานคนที่ถูกขีดชื่อ: เป็นพ่อของนายกฯ วิชัย ประธานกองทุนประปาคนแรก วิชัยรู้มาตลอดว่าเงินหาย และพูดวนเพราะไม่กล้าตอบ — ผู้เล่นเลือกได้ว่าจะประจานเขา ให้โอกาสเขาพูดความจริงเอง (เปิด ‘สุนทรพจน์ที่ตอบทุกคำถามตรงๆ’ ที่เขาล็อกไว้ในลิ้นชัก) หรือเก็บเป็นไพ่ต่อรอง"
      - "ประชาคมครั้งสุดท้ายที่ศาลา: เรื่องเดียว ‘ที่ดินแปลงยายเพียรกับบ่อน้ำสาธารณะ จะเป็นของใคร’ ทุกคนที่ผู้เล่นช่วยหรือทำร้ายมาตลอดเกมมานั่งในศาลา พัดลมตัวที่หมุนกลับทางถูกซ่อมแล้ว (หรือยัง ขึ้นกับว่าใครเป็นนายกฯ)"
  endings:
    - id: end_water_for_all
      title: "น้ำของทุกคน"
      need: "สายชุมชน · สัญญาบริษัท ≤1 · การเมืองซื่อสัตย์ · ไม่ขายที่"
      text: "หนี้กองทุนปิดด้วยเงินลงขันกับข้าวสหกรณ์ ที่ดินยายแบ่งแปลงเล็กข้างบ่อเป็นที่สาธารณะ ‘บ่อยายเพียร’ ฝายของชาวบ้านเก็บน้ำฝนได้ ระดับน้ำบ่อขึ้นช้าๆ ปีละไม่กี่เซนต์ ปาล์มจดทุกเซนต์ ถังสีฟ้าถูกเอาไปปลูกผักบุ้ง"
    - id: end_smiling_drop
      title: "หมู่บ้านหยดน้ำยิ้ม"
      need: "สายบริษัท · สัญญาบริษัท ≥3 หรือขายที่"
      text: "ถนนลาดยางทั้งตำบล รายได้ดี ทุกบ้านมีถังสีฟ้า ทุกบ้านซื้อน้ำขวด บ่อทุกบ่อกลายเป็นที่ทิ้งของ ผู้เล่นได้บ้านใหม่สวยที่สุดในตำบล ยืนตัดริบบิ้นข้างคุณธนา ป้าแต๋วยังส่งข้อความถามว่ากินข้าวหรือยังทุกวัน ไม่เคยถามเรื่องอื่นอีก"
    - id: end_ribbon
      title: "สานต่อป้าย"
      need: "ผู้เล่นเป็นนายก อบต. · การเมืองทุจริต (รับซอง/โครงการแค่ป้าย/ฝากคน)"
      text: "ผู้เล่นมีโล่สิบเจ็ดอัน ป้ายสามสิบแผ่น โครงการศึกษาความเป็นไปได้อีกเจ็ดโครงการ วันหนึ่งเมย์ปล่อยข่าว ภาพสุดท้ายคือผู้เล่นตอบนักข่าวว่า ‘ผมรับทราบคำถามครับ’ แล้วได้ยินตัวเองพูดวนเป็นครั้งแรก (ถ้าเมย์ไม่มีหลักฐาน: ชนะเลือกตั้งสมัยสอง และอ่านข้อกฎหมายเรื่องวาระบ่อยขึ้น)"
    - id: end_repeat_again
      title: "ย้ำอีกครั้งนะ"
      need: "ผู้เล่นเป็นผู้ใหญ่บ้าน · ซื่อสัตย์ · หัวใจสมศักดิ์ ≥7"
      text: "หกโมงเช้า ผู้เล่นเปิดเพลงลูกทุ่งที่หอกระจายข่าว ไมค์หอนเหมือนเดิม ผู้ใหญ่สมศักดิ์นั่งฟังอยู่ใต้หอ จดว่าหลานพูดซ้ำกี่รอบ ‘สองรอบ… ยังไม่พอ ย้ำอีกครั้ง’"
    - id: end_back_to_city
      title: "เจ้าเขียวเที่ยวสุดท้าย"
      need: "ขายที่ให้บริษัท (องก์ใดก็ได้) และไม่ลงการเมือง"
      text: "ลุงเชิดขับเจ้าเขียวไปส่งที่อำเภอ ไม่เปิดเพลง ไม่พูดอะไรจนถึงปลายทาง ห้องเช่าใหม่ใหญ่ขึ้นสองตารางเมตร แจ้งเตือนสี่สิบเจ็ดรายการ ข้อความสุดท้ายในกลุ่ม LINE ดงเย็นที่ยังไม่ได้ออก: ป้าแต๋วโพสต์รูปต้นมะม่วงหลังบ้านยาย ‘ลูกดกปีนี้ แต่ไม่มีใครแจก’"
    - id: end_grandmas_house
      title: "บ้านยายยังอยู่"
      need: "ไม่ขายที่ · ไม่ลงการเมือง · หัวใจคนในครอบครัว/คู่ครองสูง"
      text: "ไม่ได้เปลี่ยนตำบล ไม่ได้ชนะใคร แต่บ้านยายยังอยู่ สงกรานต์พ่อแม่กลับมา พ่อนั่งใต้ต้นมะม่วง แม่ห่อปลาร้าสามชั้นส่งให้ป้าแต๋ว คู่ของผู้เล่น (ถ้ามี) รดน้ำมะลิหน้าบ้าน บ่อลดลงทุกปี แต่ทุกคนยังกินข้าวครบมื้อ"
    - id: end_mother_earth
      title: "แม่ธรณีรับรู้ (ฉากลับ)"
      need: "story_merit_drowned · helped_may · story_pipe_photo · ไม่รับซองคืนหมาหอน"
      text: "คืนหนึ่งผู้เล่นเดินผ่านสะพานคลองหลังสามทุ่ม ไม่มีผีไล่ บนท่อน้ำที่ถูกถอดออกแล้ว ผู้หญิงผมยาวนั่งหันหน้าออกจากรั้วเป็นครั้งแรก มองน้ำที่ไหลถูกทาง แล้วหายไป เช้าวันรุ่งขึ้น บ่อหลังร้านป้าแต๋วมีน้ำครึ่งถัง ป้าร้องไห้ ทั้งตำบลรู้ภายในสิบนาที"
    - id: end_thana_resigns
      title: "จดหมายฉบับที่สี่ (ฉากเสริม ซ้อนกับฉากจบอื่นได้)"
      need: "หัวใจธนา ≥7 · ผู้เล่นไม่เคยเซ็นขายที่"
      text: "คุณธนาส่งจดหมายลาออกฉบับที่สี่ สะกดถูกทุกคำ แล้วขับรถเก๋งสีเงินไปจอดหน้าร้านกาแฟ ยื่นแฟลชไดรฟ์ให้เมย์ ‘นี่คือ feedback ของผมครับ’ ปีต่อมาเขาเป็นสมาชิกสหกรณ์ของกล้า ใส่หมวกใส่หน้ากากเหมือนเดิม ทุกคนจำได้ ไม่มีใครพูดอะไร"
  ending_factors:
    - "สายโครงการชุมชน: ชุมชน หรือ บริษัท (นับจากโครงการที่ทำสำเร็จ)"
    - "จำนวนสัญญาเกษตรพันธสัญญาที่เซ็น (0 / 1–2 / 3+)"
    - "การเมือง: ซื่อสัตย์ หรือ ทุจริต (รับซอง ทำโครงการแค่ป้าย ฝากคนเข้าทำงาน รับซองคืนหมาหอน)"
    - "ความสัมพันธ์และครอบครัว: คู่ครอง หัวใจพ่อแม่ เพื่อนสนิทระดับ 7+"
    - "ค่าชีวิตชีวาของตำบล ไม่มีผลกับฉากจบ (ตามสเปก)"
