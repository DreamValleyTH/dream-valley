      - { who: narrator, text: "ไม่ถึงชั่วโมง กลุ่ม LINE มีสมาชิกใหม่เจ็ดคน รูปโปรไฟล์เป็นดอกไม้ทุกคน ชื่อลงท้ายด้วยตัวเลขทุกคน" }
