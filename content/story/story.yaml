      - { who: somsak, text: "เปิดประชุมวาระพิเศษ บริษัทขอชี้แจง ย้ำอีกครั้งนะ ผู้ใหญ่ไม่ได้เชิญ อำเภอส่งหนังสือมา" }
      - { who: thana, text: "ขอบคุณครับท่านผู้ใหญ่ สวัสดีครับพี่น้อง stakeholder ทุกท่าน บริษัทรับฟัง feedback เรื่องบ่อน้ำแล้วครับ และเราเสียใจกับปรากฏการณ์ธรรมชาติที่เกิดขึ้นครับ" }
      - { who: thana, text: "วันนี้เราขอเปิดตัวโครงการ CSR ‘น้ำใจสู่ชุมชน’ ครับ มอบถังเก็บน้ำสองพันลิตรให้ทุกครัวเรือน ฟรี พร้อมเติมน้ำให้เดือนละสองครั้ง" }
      - { who: narrator, text: "ผ้าคลุมถูกดึงออก ถังน้ำสีฟ้าใบใหญ่ โลโก้หยดน้ำยิ้มขนาดเท่าประตูบ้าน ใต้โลโก้มีตัวหนังสือเล็กมาก ‘ถังเป็นทรัพย์สินของบริษัท’" }
      - { who: wichai, text: "อบต. ขอขอบคุณภาคเอกชนที่เข้ามาบูรณาการครับ เราจะจัดพิธีส่งมอบอย่างเป็นทางการ พร้อมป้ายครับ ป้ายจะใหญ่กว่าถังครับ" }
      - { who: kla, text: "ขอโทษครับ เติมน้ำเดือนละสองครั้ง… น้ำมาจากบ่อไหนครับคุณธนา" }
      - { who: thana, text: "เป็นคำถามที่ดีมากครับคุณกล้า… จากแหล่งน้ำที่บริษัทบริหารจัดการอย่างมีประสิทธิภาพครับ" }
    choices:
      - text: "ฟังต่อเงียบๆ"
        effect: { text: "พัดลมตัวที่หมุนกลับทางยังหมุนกลับทางเหมือนเดิม เป็นสิ่งเดียวในศาลาที่ไม่เปลี่ยนจุดยืน" }
      - text: "หยิบน้ำฟรีมาขวดนึง"
        effect: { energy: 5, text: "ฉลากบอกว่า ‘น้ำบาดาลผ่านการกรอง 7 ขั้นตอน’ ขั้นตอนที่ 1 คงเป็นการเจาะใต้บ้านคนอื่น" }
    effect: { set_flag: story_meeting2_a }

  - id: st_d21_meeting2_b
