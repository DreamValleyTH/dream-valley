  - id: st_d13_may
    chapter: 1
    when: { day_min: 12, day_max: 16, time_from: "09:00", time_to: "20:00", flag: story_well_dry }
    trigger: visit
    place: coffee
    art: company
    title: "นักข่าวเริ่มขุด"
    beats:
      - { who: may, text: "{player}! นั่งก่อน เรากำลังเขียนพาดหัว ‘บ่อแห้งทั้งตำบล บริษัทชี้เป็นปรากฏการณ์ธรรมชาติ ธรรมชาติไม่ขอให้สัมภาษณ์’" }
      - { who: may, text: "บ้านเธอมีบ่อใช่ไหม วัดระดับทุกวันได้ไหม จดเวลาด้วย เราต้องการตัวเลข ไม่ใช่ความรู้สึก ความรู้สึกเรามีเยอะแล้ว" }
      - { who: may, text: "เราขอสำเนาใบอนุญาตบ่อบาดาลจาก อบต. ได้คำตอบว่า ‘อยู่ระหว่างการพิจารณา’ พิจารณามาสองเดือน ใบอนุญาตคงหนาเท่าเสาไฟแล้ว" }
      - { who: praew, text: "(จากหลังเคาน์เตอร์) เมย์ อย่าเขียนชื่อพ่อแพรวนะ พ่อแพรวแค่ไปกินข้าวกับคุณธนาครั้งเดียว… สองครั้ง… ไม่ต้องจด!" }
      - { who: may, text: "เห็นไหม ร้านกาแฟนี้คือสำนักข่าวที่ดีที่สุดในอำเภอ แหล่งข่าวชงกาแฟให้ด้วย" }
    choices:
      - text: "ได้ {p}จะจดระดับน้ำทุกวัน"
        effect: { set_flag: story_may_log, heart: { may: 2 }, text: "เมย์ฉีกกระดาษจากสมุดให้หนึ่งแผ่น ตีตารางไว้แล้ว ‘วันที่ / เวลา / เมตร / หมายเหตุ ช่องหมายเหตุไว้เขียนด่าได้’" }
      - text: "ระวังตัวด้วยนะ{k} ทำข่าวบริษัทใหญ่"
        effect: { heart: { may: 1 }, text: "‘ระวังแล้ว เราเปลี่ยนเส้นทางกลับบ้านทุกวัน… แต่ตำบลนี้มีถนนสองเส้น ก็เลยสลับได้แค่นั้น’" }
      - text: "{p}ไม่อยากยุ่งเรื่องนี้{k}"
        effect: { heart: { may: -1 }, text: "‘เข้าใจ ไม่มีใครอยากยุ่ง นั่นแหละเหตุผลที่มันเกิดได้’ เมย์ยิ้มบางๆ แล้วก้มพิมพ์ต่อ" }
    effect: { set_flag: story_may_digging }

  - id: st_d14_palm_gauge
    chapter: 1
    when: { day_min: 13, day_max: 16, map: farm, time_from: "08:00", time_to: "17:00", flag: story_well_dry }
    trigger: enter_map
    art: well
    title: "เครื่องวัดระดับน้ำ"
    beats:
      - { who: palm, text: "สวัสดี! ตามหลักวิชาการนะ เราควรมีเครื่องวัดระดับน้ำใต้ดินแบบดิจิทัล… แต่ อบต. ให้งบซื้อตลับเมตรกับเชือก ล้อเล่นๆ เครื่องนี้ยืมมหาวิทยาลัยมา" }
      - { who: palm, text: "ขอติดที่บ่อยายเพียรได้ไหม บ่อนี้อยู่ระหว่างบ่อบริษัทกับคลองพอดี เป็นจุดวัดที่สวยมาก สวยในทางสถิตินะ" }
      - { who: narrator, text: "ปาล์มหย่อนสายวัดลงบ่อ จดตัวเลข ขมวดคิ้ว จดใหม่ ขมวดคิ้วกว่าเดิม" }
      - { who: palm, text: "ปีที่แล้วยายเพียรให้เรามาวัดบ่อนี้ ได้ 4.2 เมตร วันนี้ 7.9… เดี๋ยวๆ วัดซ้ำ… 7.9 เหมือนเดิม" }
      - { who: palm, text: "เรายื่นรายงานไปรอบนึงแล้ว หัวหน้าบอก ‘เก็บไว้ก่อน’ ตอนนี้แฟ้มที่เก็บไว้ก่อนหนากว่าแฟ้มที่ส่งแล้ว" }
    choices:
      - text: "ติดได้เลย{k} มาวัดทุกวันก็ได้"
        effect: { set_flag: story_palm_gauge, heart: { palm: 2 }, text: "ปาล์มยิ้มกว้างจนตลับเมตรหล่น ‘ขอบคุณนะ! เราจะมาตอนเช้า ถ้าเห็นเรายืนพึมพำกับบ่อ ไม่ต้องตกใจ เราคุยกับข้อมูล’" }
      - text: "ยายให้วัดตั้งแต่ปีที่แล้วเลยเหรอ{kq}"
        effect: { set_flag: story_palm_gauge, heart: { palm: 1 }, text: "‘ใช่ ยายบอกว่า จดไว้นะหนู วันหนึ่งจะมีคนบอกว่าน้ำไม่เคยลด… ตอนนั้นเราขำ ตอนนี้ไม่ขำแล้ว’" }
      - text: "ระวังนะ{k} ถ้าบริษัทรู้"
        effect: { heart: { palm: 1 }, text: "‘รู้แล้ว เขาส่งดอกไม้มาขอบคุณที่ห้องทำงาน อบต. ด้วย… ขอบคุณเรื่องอะไรก็ไม่รู้ ดอกไม้สวยจนน่ากลัว’" }
    effect: { set_flag: story_palm_visit }

