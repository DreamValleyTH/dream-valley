      - text: "{p}เพิ่งกลับมาเดือนเดียวเองนะ{k}ป้า"
        effect: { heart: { taew: 1 }, text: "‘ยายเพียรอยู่ที่นี่ทั้งชีวิต ไม่เคยลงอะไรเลย… ป้าว่ายายเสียดายนะหลาน ป้าไม่ได้พูดนะ ยายพูดเอง ตอนเมาเหล้าดองงานบวชปีนั้น’" }
      - text: "ถ้าลงจริง ป้าจะเลือก{p}ไหม{kq}"
        effect: { set_flag: story_candidate_hint, heart: { taew: 2 }, text: "‘เลือกสิ! …แล้วแต่ว่าหลานจะสร้างหลังคาตลาดอีกครึ่งให้ป้าไหม ล้อเล่น เลือกฟรี ไม่ต้องมีซอง… มีก็ได้นะ ล้อเล่น’" }
      - text: "{p}ไม่ยุ่งการเมือง{k}"
        effect: { heart: { heng: 1 }, text: "เสี่ยเฮงหัวเราะลั่น ‘ทุกคนพูดแบบนี้แหละน้อง จนกว่าการเมืองจะมายุ่งกับเรา’" }
    effect: { set_flag: story_posters }

  - id: st_d27_diary_full
    chapter: 1
    when: { day_min: 27, day_max: 28, diary_min: 5, not_flag: story_last_page }
    trigger: morning
    art: grandma
    title: "หน้าสุดท้ายของสมุดยาย"
    beats:
      - { who: narrator, text: "หน้าสมุดที่ได้คืนมาวางเรียงบนพื้นกระดาน มุมล่างทุกหน้ามีตัวเลขเล็กๆ ที่ยายเขียนไว้ อ่านรวมกันได้ว่า ‘ไม้แผ่นที่ห้า ใต้หิ้ง’" }
      - { who: narrator, text: "ไม้กระดานแผ่นที่ห้าใต้หิ้งพระยกขึ้นได้ ข้างใต้มีกล่องสังกะสีขึ้นสนิม ข้างในเป็นหน้าสมุดหน้าสุดท้าย กับกระดาษถ่ายเอกสารเก่าซีด พับสี่ทบ" }
      - { who: grandma, text: "‘ถ้าหลานอ่านถึงหน้านี้ แปลว่าหลานคุยกับคนแก่มาเยอะแล้ว ดีแล้ว คนแก่ชอบมีคนฟัง’" }
      - { who: grandma, text: "‘ปีสามเก้า ตำบลจะทำประปาหมู่บ้าน ธนาคารไม่ให้กู้ถ้าไม่มีคนค้ำ ไม่มีใครกล้าค้ำ ฉันเลยเซ็นเอง เอาที่แปลงนี้ค้ำไว้กับตำบล’" }
      - { who: grandma, text: "‘ฉันไม่เสียใจหรอก น้ำประปาไหลมายี่สิบกว่าปี เด็กทั้งหมู่บ้านได้อาบ แต่เงินกองทุนบางก้อนหายไประหว่างทาง ฉันถามทีไรก็ได้คำตอบว่า รับทราบ’" }
      - { who: grandma, text: "‘สัญญานั้นยังไม่ปิด ฉบับหนึ่งอยู่กับสมศักดิ์ อีกฉบับอยู่ในตู้ อบต. ถ้าวันไหนมีคนมาขอซื้อที่ ให้ถามเขาก่อนว่า เขาจะซื้อที่ หรือซื้อสัญญา’" }
      - { who: grandma, text: "‘ที่ดินไม่ใช่ของเราคนเดียวหรอกหลาน มันเป็นของคนที่ดื่มน้ำจากมันด้วย… ยายฝากด้วยนะ’" }
      - { who: narrator, text: "สำเนาสัญญามีตรายาง อบต. สีม่วงซีด ลายเซ็นยายเพียรตัวโตกว่าใคร พยานสองคน คนหนึ่งชื่อ ‘สมศักดิ์’ อีกคนถูกปากกาขีดทับจนอ่านไม่ออก" }
    choices:
      - text: "เอาไปถามผู้ใหญ่สมศักดิ์"
        effect: { set_flag: story_ask_somsak, heart: { somsak: 1 }, text: "เก็บใส่ซองพลาสติกสามชั้นแบบที่แม่ห่อปลาร้า แล้วตั้งใจว่าพรุ่งนี้จะไปศาลา" }
      - text: "ถ่ายรูปส่งให้เมย์"
        effect: { set_flag: story_contract_to_may, heart: { may: 1 }, text: "เมย์ตอบภายในสามวินาที ‘อย่าส่งให้ใครอีกนะ’ แล้วตามมาอีกข้อความ ‘นี่แหละ อีกอย่างที่เรายังไม่รู้ว่าคืออะไร’" }
      - text: "เก็บไว้ใต้หิ้งเหมือนเดิมก่อน"
        effect: { text: "วางกลับที่เดิม ปิดไม้กระดาน ไหว้รูปยาย ยายยิ้มฟันหลอเหมือนเดิม แต่วันนี้ดูเหมือนยิ้มแบบรู้อะไรมากกว่า" }
    effect: { set_flag: [story_last_page, story_guarantee_known] }

  - id: st_d27_diary_partial
    chapter: 1
    when: { day_min: 27, day_max: 28, diary_max: 4, not_flag: story_last_page }
    trigger: morning
    art: grandma
    title: "แฟ้มของผู้ใหญ่"
    beats:
      - { who: narrator, text: "สมุดของยายยังบางนัก หน้าที่ได้คืนมายังไม่ถึงครึ่ง ตัวเลขเล็กๆ มุมกระดาษอ่านรวมกันแล้วไม่เป็นความหมาย" }
      - { who: narrator, text: "เมื่อคืนฝันถึงยาย ยายนั่งเคี้ยวหมากหน้าหิ้ง เคาะพื้นไม้กระดานสามที ‘ยังไม่ถึงเวลาหรอก ไปคุยกับคนแก่ให้มากกว่านี้’" }
      - { who: narrator, text: "สายๆ ผู้ใหญ่สมศักดิ์เดินมาถึงบันได ถือแฟ้มกระดาษสีน้ำตาลใบเก่า" }
      - { who: somsak, text: "หลาน… ผู้ใหญ่จะเกษียณแล้ว ต้องเคลียร์แฟ้มค้าง แฟ้มนี้มีชื่อยายเพียร ผู้ใหญ่ย้ำกับตัวเองมาสิบปีว่าจะบอก แต่ไม่เคยบอก" }
      - { who: somsak, text: "ยายเพียรเคยเซ็นค้ำประกันอะไรบางอย่างไว้กับตำบล สัญญายังไม่ปิด… ผู้ใหญ่อ่านระเบียบเก่ง แต่สัญญานี้เขียนให้คนอ่านไม่เข้าใจ" }
      - { who: somsak, text: "ผู้ใหญ่เป็นพยานในสัญญานั้น ส่วนพยานอีกคน… ผู้ใหญ่ขอยังไม่พูด เก็บไว้ก่อนนะหลาน อย่าเพิ่งให้ใครดู ย้ำอีกครั้งนะ… ใครก็ตาม" }
    choices:
      - text: "ขอบคุณ{k}ผู้ใหญ่ที่บอก"
        effect: { heart: { somsak: 2 }, text: "‘ขอบใจหลานที่ฟัง… ยายเพียรเคยบอกว่าผู้ใหญ่พูดซ้ำเพราะไม่มีใครฟังรอบแรก หลานฟังรอบแรกเลยนะ’" }
      - text: "พยานอีกคนเป็นใคร{kq}"
        effect: { heart: { somsak: 1 }, text: "ผู้ใหญ่มองไปทางหน้า อบต. ไกลๆ นานพอที่จะเป็นคำตอบ แต่ไม่พูดอะไร" }
    effect: { set_flag: [story_last_page, story_guarantee_hint] }

  - id: st_d28_act1_end
    chapter: 1
    when: { day_min: 28, day_max: 28, time_from: "17:00", time_to: "20:00", flag: story_last_page, not_flag: act1_done }
    trigger: hour
    art: village
    title: "จบองก์ 1 ‘กลับบ้าน’"
    beats:
      - { who: narrator, text: "เย็นวันที่ยี่สิบแปด แดดอ่อนลอดใบมะม่วง เสียงรถแห่ลอยมาจากทางตำบล เพลงหาเสียงเพลงแรกของฤดู" }
      - { who: narrator, text: "หนึ่งเดือนก่อน ห้องแปดตารางเมตร แจ้งเตือนสี่สิบเจ็ดรายการ… วันนี้แจ้งเตือนเดียวคือป้าแต๋วถามว่ากินข้าวหรือยัง" }
      - { who: narrator, text: "บ่อหลังบ้านลดลงอีกสิบเซนต์ ถังสีฟ้าในตำบลยิ้มทุกใบ ป้ายหาเสียงขึ้นใหม่วันละสิบแผ่น" }
      - { who: narrator, text: "และใต้หิ้งพระ มีสัญญาฉบับหนึ่งที่ยังไม่ปิด" }
      - { who: player, text: "…ยาย {p}ยังไม่รู้หรอกว่าจะทำอะไรได้บ้าง" }
      - { who: narrator, text: "ลมพัดใบมะม่วงพลิกขาวทั้งต้น เหมือนใครหัวเราะเบาๆ" }
      - { who: narrator, text: "จบองก์ 1 ‘กลับบ้าน’ · องก์ 2 ‘น้ำใต้ดิน’ — เร็วๆ นี้ (เล่นต่ออิสระได้)" }
    effect: { set_flag: act1_done }

