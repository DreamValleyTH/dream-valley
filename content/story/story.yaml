# =============================================================================
# Dream Valley — เนื้อเรื่องหลัก (story.yaml)
# องก์ 0 = ฉากเปิดเกม · องก์ 1 "กลับบ้าน" (วันที่ 1–28) เล่นได้เต็ม · องก์ 2–3 อยู่ใน outline:
#
# หมายเหตุสำหรับโปรแกรมเมอร์ (ส่วนขยายจากสคีมาที่ตกลงไว้)
# - who: grandma = ยายเพียร (ตัวอักษรจดหมาย/สมุด) · mom / dad / boss = แม่ พ่อ หัวหน้าเก่า
# - ฉากเปิดเกมทุกฉากใช้ trigger: newgame และต่อกันด้วยธง open_*_done (เล่นต่อกันทันทีตามลำดับ)
# - when.diary_min / when.diary_max = จำนวนธง diary_* ที่ผู้เล่นมี (ใช้ในฉากหน้าสุดท้ายของสมุดยาย)
# - ผลโหวตประชุมครั้งที่ 1 = ตัวเลือกของผู้เล่น (คะแนนออกมาเสมอกันสามทาง เสียงของหลานยายเพียรชี้ขาด)
# - ฉากที่ไม่มีธงกำหนดชัดให้เล่นครั้งเดียว (ทุกฉากเล่นครั้งเดียว)
# - set_flag เป็นชื่อเดียว หรือรายการ [a, b] ก็ได้
# - heart ใน when = ค่าหัวใจขั้นต่ำ (เช่น heart: { may: 3 } = เมย์ ≥ 3)
# - ธงที่ตั้งขึ้นใหม่ในไฟล์นี้ขึ้นต้นด้วย story_ หรือ id ตัวละคร (เช่น may_went_alone)
# =============================================================================
scenes:

  # ---------------------------------------------------------------------------
  # องก์ 0 — ฉากเปิดเกม
  # ---------------------------------------------------------------------------
  - id: st_open_bkk
    chapter: 0
    when: { day_min: 1, day_max: 1 }
    trigger: newgame
    art: night
    title: "ตีหนึ่งสี่สิบ"
    beats:
      - { who: narrator, text: "ตีหนึ่งสี่สิบ ห้องเช่าแปดตารางเมตร ย่านที่รถติดได้แม้ตอนตีหนึ่ง" }
      - { who: narrator, text: "โทรศัพท์สั่นไม่หยุด แจ้งเตือนงานสี่สิบเจ็ดรายการ บิลค่าห้องเลยกำหนดสามวัน" }
      - { who: boss, text: "{player} ไฟล์ที่ขอตอนห้าทุ่มได้ยังครับ ไม่รีบนะ ขอก่อนเจ็ดโมงพอ" }
      - { who: boss, text: "อ้อ พรุ่งนี้ประชุมแปดโมงนะครับ หัวข้อ ‘ทำไมทีมเราหมดไฟ’ เตรียมสไลด์มาคนละสามหน้า" }
      - { who: narrator, text: "บะหมี่ถ้วยบนโต๊ะเย็นชืดตั้งแต่สามทุ่ม เส้นอืดจนติดกันเป็นแผ่นเดียว" }
      - { who: player, text: "…กินข้าวครบมื้อครั้งล่าสุดเมื่อไหร่นะ" }
      - { who: narrator, text: "ข้างนอกมอเตอร์ไซค์บิดผ่านไปเป็นคันที่ร้อย ข้างในไม่มีอะไรขยับ นอกจากเคอร์เซอร์ที่กะพริบรอ" }
    choices:
      - text: "พิมพ์ตอบ ‘รับทราบ{k} จะส่งก่อนเจ็ดโมง’"
        effect: { energy: -10, text: "ส่งไปแล้ว หัวหน้าอ่านแล้วไม่ตอบ กดไลก์ให้หนึ่งที เป็นไลก์ที่หนักที่สุดในชีวิต" }
      - text: "คว่ำโทรศัพท์ แล้วนอนมองเพดานเฉยๆ"
        effect: { text: "เพดานมีรอยน้ำรั่วเป็นรูปแผนที่ประเทศที่ไม่มีอยู่จริง… ไปอยู่ที่นั่นก็คงดี" }
      - text: "เปิดรูปเก่าตอนเด็กที่บ้านยาย"
        effect: { text: "เด็กมอมแมมขี่คอยายใต้ต้นมะม่วง ยายหัวเราะจนเห็นฟันหลอ… ไม่ได้โทรหายายมากี่เดือนแล้วนะ" }
    effect: { set_flag: open_bkk_done }

  - id: st_open_call
    chapter: 0
    when: { day_min: 1, day_max: 1, flag: open_bkk_done }
    trigger: newgame
    art: phone
    title: "สายจากแม่"
    beats:
      - { who: narrator, text: "เจ็ดโมงสิบห้า ไฟล์ส่งไปแล้ว ตายังไม่ทันได้ปิด โทรศัพท์ก็ดังอีก… คราวนี้ไม่ใช่หัวหน้า" }
      - { who: mom, text: "ลูก… แม่เอง ตั้งสติก่อนนะลูก" }
      - { who: mom, text: "ยายเพียรไปแล้วนะ เมื่อคืนตีสาม หลับไปเฉยๆ ป้าแต๋วเอาโจ๊กไปให้ตอนเช้าถึงได้รู้" }
      - { who: dad, text: "ยายไปสบายนะลูก ไม่ทรมาน… เมื่อวานเย็นยายยังรดน้ำมะลิหน้าบ้านอยู่เลย" }
      - { who: mom, text: "งานเผาวันอาทิตย์ที่วัดดงเย็น ยายสั่งไว้ว่าไม่ต้องจัดใหญ่… แล้วก็… บ้านยายน่ะลูก" }
      - { who: mom, text: "พ่อแม่ทิ้งงานไม่ได้ บ้านไม้ทิ้งไว้เดือนเดียวปลวกกินหมด แล้วคนบริษัทก็มาถามซื้อที่ตั้งแต่ยายยังไม่ทันเข้าโลง" }
      - { who: dad, text: "ไม่ต้องตอบตอนนี้ก็ได้ พ่อแค่… ไม่อยากขายบ้านที่ลูกเคยปีนต้นมะม่วงตกลงมาหัวแตก" }
    choices:
      - text: "{p}จะกลับไปดูแลบ้านยายเอง{k}"
        effect: { text: "แม่เงียบไปนาน แล้วสะอื้นเบาๆ ‘ยายต้องดีใจแน่ลูก’ พ่อกระแอมเสียงดังผิดปกติ" }
      - text: "งานที่นี่… {p}ก็ไม่ไหวแล้วเหมือนกัน{k}แม่"
        effect: { text: "‘งั้นกลับบ้านนะลูก’ แม่พูดน้ำเสียงเดียวกับตอนเด็กๆ เวลาล้มแล้วร้องไห้" }
      - text: "ขอ{p}คิดก่อนนะ{k} …แต่คงไม่มีอะไรให้คิดแล้วล่ะ"
        effect: { text: "พ่อบอกว่า ‘คิดไปเถอะลูก ที่นั่นรอได้ ต้นมะม่วงมันไม่รีบ’ แต่เสียงพ่อเหมือนคนที่รีบที่สุดในโลก" }
    effect: { set_flag: open_call_done }

  - id: st_open_bus
    chapter: 0
    when: { day_min: 1, day_max: 1, flag: open_call_done }
    trigger: newgame
    art: bus
    title: "เจ้าเขียว"
    beats:
      - { who: narrator, text: "สามสัปดาห์ต่อมา งานเผาจบ ใบลาออกส่งแล้ว หัวหน้าตอบกลับคำเดียว ‘รับทราบ’ พร้อมกดไลก์" }
      - { who: narrator, text: "รถทัวร์ส่งถึงอำเภอตอนบ่าย ต่อรถเมล์สีเขียวคันเดียวของตำบล ป้ายหน้ารถเขียนด้วยมือ ‘อำเภอ–ดงเย็น’" }
      - { who: cherd, text: "ขึ้นๆ ออกแล้วนะ! …อ้าว หน้าคุ้นๆ หลานยายเพียรใช่ไหม ลุงเห็นที่งานเผา" }
      - { who: cherd, text: "ยายนั่งรถลุงทุกวันพระ แถวสองริมหน้าต่าง ห่อข้าวต้มมัดมาฝากลุงทุกรอบ ลุงอ้วนขึ้นสามโลก็เพราะยายหลานนี่แหละ" }
      - { who: narrator, text: "เพลงลูกทุ่งเสียงแตกดังจากลำโพงหน้ารถ ลมร้อนเข้าทางหน้าต่างที่ปิดไม่ได้ ทุ่งนาสีเขียวไหลผ่านเหมือนไม่มีวันจบ" }
      - { who: cherd, text: "ช่วงนี้รถน้ำบริษัทวิ่งทั้งคืน ถนนเป็นหลุม เจ้าเขียวมันบ่น ลุงก็บ่น ไม่มีใครฟังทั้งคู่" }
      - { who: cherd, text: "ถึงแล้วหลาน ทางลูกรังนี่เดินเข้าไปห้าร้อยเมตร บ้านใต้ถุนสูงหลังต้นมะม่วง… อย่าเดินดึกนะ ที่นี่ผีเขายังทำงานกะดึกอยู่" }
    choices:
      - text: "ขอบคุณ{k}ลุง ค่ารถเท่าไหร่{kq}"
        effect: { heart: { cherd: 1 }, text: "‘สามสิบ เหมือนเดิมมาสิบปี น้ำมันขึ้น ลุงไม่ขึ้น’ ลุงเชิดทอนเหรียญให้พร้อมยิ้มเห็นฟันทอง" }
      - text: "ยายนั่งแถวสองจริงๆ เหรอ{kq}"
        effect: { heart: { cherd: 1 }, text: "‘จริงสิ ที่นั่งนั้นลุงยังไม่ให้ใครนั่งเลย… ยกเว้นวันคนเยอะ’ ลุงเคาะพวงมาลัยสองที แล้วเจ้าเขียวก็ออกตัวไป" }
      - text: "ลงจากรถเงียบๆ แล้วโบกมือ"
        effect: { text: "ลุงเชิดบีบแตรสั้นๆ สองที เสียงแตรเหมือนจะพูดว่า ‘กลับมาแล้วนะ’" }
    effect: { money: -30, set_flag: open_bus_done }

  - id: st_open_house
    chapter: 0
    when: { day_min: 1, day_max: 1, flag: open_bus_done }
    trigger: newgame
    art: grandma
    title: "บ้านยาย"
    beats:
      - { who: narrator, text: "บ้านไม้ใต้ถุนสูงยังอยู่ที่เดิม เพียงแต่ดูเล็กกว่าในความจำ" }
      - { who: narrator, text: "ประตูเปิดออกพร้อมเสียงเอี๊ยดยาว ฝุ่นลอยขึ้นในแสงบ่ายเหมือนใครโปรยแป้ง" }
      - { who: narrator, text: "กลิ่นยาหม่อง ไม้เก่า กับข้าวสารในถังกระเบื้อง… กลิ่นยาย" }
      - { who: narrator, text: "ปฏิทินบนฝายังเปิดค้างเดือนที่แล้ว วันพระวงด้วยปากกาแดงทุกวัน วันที่ยายเสียมีเขียนว่า ‘นัดตัดผม’" }
      - { who: narrator, text: "บนหิ้งพระ ข้างรูปยายยิ้มฟันหลอ มีซองสีน้ำตาลวางอยู่ ลายมือหวัดๆ ‘ถึงหลาน (ถ้ามันกลับมา)’" }
    choices:
      - text: "ไหว้รูปยายก่อนเปิดซอง"
        effect: { energy: 5, text: "กราบสามครั้ง ฝุ่นบนหิ้งติดหน้าผาก ยายเห็นคงหัวเราะ" }
      - text: "ปัดฝุ่นหิ้งพระก่อน"
        effect: { energy: -5, money: 3, text: "ฝุ่นหนาเป็นเซนต์ ใต้แจกันมีเหรียญบาทซ่อนอยู่สามเหรียญ ยายซ่อนเงินไว้ทุกที่จริงๆ" }
      - text: "เปิดซองเลย"
        effect: { text: "มือสั่นนิดหน่อย กระดาษข้างในพับสามทบ หนาสองแผ่น" }
    effect: { set_flag: open_house_done }

  - id: st_open_letter
    chapter: 0
    when: { day_min: 1, day_max: 1, flag: open_house_done }
    trigger: newgame
    art: letter
    title: "จดหมายของยาย"
    beats:
      - { who: grandma, text: "ถึงหลาน ถ้าอ่านอยู่ แปลว่ายายไปแล้ว แล้วหลานก็กลับมา… ขอโทษที่ไม่ได้ยืนรอที่บันได ข้าวสารในถังยังมีครึ่งถัง หุงกินได้เลย ไม่ต้องซื้อ" }
      - { who: grandma, text: "ยายรู้ว่าหลานเหนื่อย ตอนโทรมาเสียงเหมือนต้นพริกที่ลืมรดน้ำสามวัน ที่นี่ไม่มีใครรีบหรอก ไก่ยังตื่นสายบ้างเลย" }
      - { who: grandma, text: "ที่ดินนี้ ใครมาขอซื้อ อย่าเพิ่งเซ็นอะไร ยายไม่ได้ห้ามขาย ยายแค่อยากให้หลานรู้จักมันก่อน เหมือนต้องรู้จักคนก่อนจะเลิกคบ" }
      - { who: grandma, text: "มะม่วงหลังบ้านยายปลูกตอนแม่หลานเกิด ปีไหนดกเอาไปแจกหน้าร้านแต๋ว แต๋วกินฟรีทุกปี แล้วบ่นว่าเปรี้ยวทุกปี" }
      - { who: grandma, text: "ยายมีสมุดเล่มหนึ่ง เขียนไว้หลายเรื่อง บางหน้ายายฝากเพื่อนแก่ๆ ไว้ เพราะยายขี้ลืมว่าวางไว้ไหน อยากอ่านก็ไปเที่ยวหาเอา คนแก่ที่นี่ชอบให้คนไปคุยด้วยอยู่แล้ว" }
      - { who: grandma, text: "อย่าออกไปไหนหลังสามทุ่ม ไม่ต้องถามว่าทำไม ถามยายบัวเอา" }
      - { who: grandma, text: "กินข้าวให้ครบมื้อ รดน้ำมะลิหน้าบ้านด้วย แล้วก็… ยายดีใจนะที่หลานกลับมา จะอยู่นานแค่ไหนก็ได้ — ยายเพียร" }
      - { who: grandma, text: "ป.ล. กุญแจโรงเก็บของอยู่ในกระป๋องนมผงเก่าบนตู้กับข้าว ป.ล. 2 อย่าเชื่อหอกระจายข่าวเรื่องพยากรณ์อากาศ เชื่อมดดีกว่า" }
    effect: { set_flag: open_letter_done }

  - id: st_d1_taew
    chapter: 1
    when: { day_min: 1, day_max: 1, map: farm, flag: open_letter_done }
    trigger: enter_map
    art: village
    title: "ป้าแต๋วมาแล้ว"
    beats:
      - { who: narrator, text: "ยังไม่ทันพับจดหมาย เสียงรองเท้าแตะก็ดังแปะๆ ขึ้นบันได" }
      - { who: taew, text: "ใครอยู่ในบ้านยายเพียร! …ตายแล้ว นึกว่าขโมย อ้าว หลานยายเพียรนี่นา หน้าซีดเหมือนคนกรุงเทพฯ เลย" }
      - { who: taew, text: "ป้าแต๋วไง ร้านชำตรงสามแยกข้างศาลา ป้าเอาห่อหมกกับข้าวเหนียวมาให้ ป้ารู้ว่าหลานจะมาวันนี้" }
      - { who: player, text: "ป้ารู้ได้ยังไง{kq}" }
      - { who: taew, text: "ลุงเชิดบอก ลุงเชิดรู้จากคนบนรถ คนบนรถรู้จากแม่หลาน… ป้าไม่ได้สอดรู้นะ ข่าวมันเดินมาหาป้าเอง" }
      - { who: taew, text: "อ่านจดหมายยายแล้วสินะ ตาแดงเชียว… ไม่ต้องอาย ป้าอ่านจดหมายลูกป้าจากโรงงานยังร้องทุกฉบับ ทั้งที่เขาเขียนมาขอเงิน" }
      - { who: taew, text: "พรุ่งนี้เข้าไปในตำบลนะ ให้คนเขาเห็นหน้า ไม่งั้นคนจะลือว่ามีคนแปลกหน้ามาอยู่บ้านยายเพียร… ซึ่งก็คือป้าจะลือเองแหละ" }
    choices:
      - text: "ขอบคุณ{k}ป้า ห่อหมกหอมมาก"
        effect: { energy: 10, heart: { taew: 1 }, text: "‘กินให้หมดนะ ป้านับห่อ’ ป้าแต๋วพูดแล้วหันหลังเร็วๆ เหมือนกลัวคนเห็นว่าตาก็แดง" }
      - text: "ป้าจะไปบอกทั้งตำบลเลยใช่ไหม{kq}"
        effect: { heart: { taew: 1 }, text: "‘ไม่ทั้งตำบลหรอก… แค่คนที่ป้าเจอ ซึ่งก็เกือบทั้งตำบลแหละ’" }
      - text: "{p}เหนื่อย{k} ขอพักก่อน"
        effect: { text: "‘เออๆ นอนเถอะ’ ป้าวางห่อกับข้าวไว้ที่บันได เดินกลับไปแต่หันมามองอีกสองรอบ" }
    effect: { set_flag: story_arrived }

  - id: st_d1_night
    chapter: 1
    when: { day_min: 1, day_max: 1, map: farm, time_from: "20:30", time_to: "23:00", flag: story_arrived }
    trigger: hour
    art: night
    title: "คืนแรก"
    beats:
      - { who: narrator, text: "สองทุ่มครึ่ง หมาบ้านไหนสักบ้านเริ่มหอน แล้วก็มีอีกตัวหอนรับ ไกลออกไปอีกตัว" }
      - { who: narrator, text: "ลมเย็นพัดลอดช่องฝา หลอดไฟในครัวกะพริบสองที" }
      - { who: narrator, text: "ทางทุ่งนา มีแสงเรืองดวงหนึ่งลอยต่ำเรี่ยยอดหญ้า… แล้วดับไป" }
