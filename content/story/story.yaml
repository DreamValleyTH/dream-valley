      - { who: heng, text: "(หัวเราะ) เฮียว่าดีลนี้ฉลาดนะ ขายน้ำคืนให้เจ้าของน้ำ เฮียทำธุรกิจมาสามสิบปียังคิดไม่ถึง" }
      - { who: sommai, text: "ถังสองพันลิตร… ขอดีไหมแม่ บ่อเราแห้งแล้วนะ" }
      - { who: porn, text: "ขอได้ แต่ป้าจะเอาผ้าถุงคลุมโลโก้" }
      - { who: bua, text: "(ลุกขึ้นช้าๆ จากแถวหน้า) ยายไม่เอา น้ำที่ต้องรอเขาเอามาให้ ไม่ใช่น้ำของเรา" }
      - { who: taew, text: "ป้า… ป้าขอใบนึงนะ ร้านป้าต้องใช้น้ำ ป้าไม่ได้เข้าข้างใคร ป้าเข้าข้างกะละมัง" }
      - { who: narrator, text: "ศาลาแตกเป็นสองฝั่ง ฝั่งหนึ่งเข้าแถวลงชื่อรับถัง อีกฝั่งรุมดูแผนที่บ่อแห้งของกล้า ตรงกลางกำนันประเสริฐยืนเกาหัว คราวนี้ไม่ได้หลับ ตาค้าง" }
      - { who: prasert, text: "กำนันว่า… เดี๋ยวกำนันขอไปถามไก่ก่อน" }
      - { who: thana, text: "(ยื่นใบลงชื่อมาตรงหน้า ยิ้มเท่าเดิม) คุณ{player}ครับ บ้านคุณยายเพียรยังไม่มีถังเลยนะครับ" }
    choices:
      - text: "ลงชื่อรับถัง ‘บ่อ{p}ก็ลดเหมือนกัน{k}’"
        effect: { set_flag: story_tank_taken, heart: { thana: 1, taew: 1, kla: -1 }, text: "คุณธนาเขียนชื่อให้อย่างตั้งใจ ‘ขอบคุณที่เป็นส่วนหนึ่งของการเปลี่ยนแปลงครับ’ ข้างหลัง ยายบัวถอนหายใจเบาๆ" }
      - text: "ไม่รับ แล้วเดินไปลงชื่อในรายชื่อยื่นอำเภอของกล้า"
        effect: { set_flag: story_petition_signed, heart: { kla: 2, bua: 1, thana: -1 }, text: "กล้ายื่นปากกาให้ มือสั่นนิดๆ ‘รายชื่อที่สี่สิบครับ… ขอโทษครับ ผมนับทุกชื่อ’" }
      - text: "ถามดังๆ ‘ถังเป็นของบริษัท แล้วน้ำในถังเป็นของใคร{kq}’"
        effect: { set_flag: story_tank_question, heart: { may: 2, kla: 1, somsak: 1, thana: -1 }, text: "ทั้งศาลาเงียบ ได้ยินแต่พัดลม คุณธนายิ้ม… ยิ้ม… แล้วตอบ ‘ขอรับไปเป็นการบ้านครับ’ เมย์กดอัดเสียงค้างไว้จนจบประชุม" }
    effect: { set_flag: story_meeting2 }

  - id: st_d22_tanks
    chapter: 1
    when: { day_min: 22, day_max: 25, map: town, flag: story_meeting2 }
    trigger: enter_map
    art: company
    title: "ถังสีฟ้ายิ้มทั้งตำบล"
    beats:
      - { who: narrator, text: "รถบรรทุกขนถังสีฟ้ามาสามเที่ยว หน้าบ้านครึ่งตำบลมีหยดน้ำยิ้มตั้งอยู่ อีกครึ่งไม่มี มองจากถนนเหมือนฟันที่หลอเป็นซี่ๆ" }
      - { who: narrator, text: "หน้าศาลามีป้ายส่งมอบโครงการ ใหญ่กว่าถังสามเท่า รูปนายกฯ จับมือคุณธนา ทั้งคู่ยิ้มเท่ากับหยดน้ำ" }
      - { who: porn, text: "(ยืนข้างถังบ้านตัวเอง ที่คลุมผ้าถุงลายดอกไว้) ถังได้ โลโก้ไม่ได้ ผ้าถุงตัวนี้สองร้อย คุ้มกว่าน้ำ" }
      - { who: heng, text: "เฮียเปิดขายฝาครอบโลโก้แล้วนะพี่น้อง ลายพระจันทร์ ลายดอกบัว ลายหน้าเฮีย… ลายหน้าเฮียลดห้าสิบ ฮ่าๆ" }
      - { who: bua, text: "หน้าบ้านยายไม่มีถังหรอกหลาน ยายมีโอ่งมังกรสามใบ รองน้ำฝน ฝนไม่เคยติดโลโก้" }
      - { who: may, text: "เราถ่ายถังไปแล้วสองร้อยใบ ทุกใบมีสติกเกอร์บาร์โค้ด… บาร์โค้ดบนถังน้ำฟรี เรายังคิดไม่ออกว่าเอาไว้นับอะไร" }
    choices:
      - text: "ถามคุณธนาเรื่องบาร์โค้ด"
        effect: { heart: { thana: -1, may: 1 }, text: "คุณธนาหยุดยิ้มไปครึ่งวินาที ‘เป็นระบบบริหารสินทรัพย์ครับ เพื่อความโปร่งใส’ แล้วยิ้มต่อเต็มที่กว่าเดิม" }
      - text: "ช่วยยายบัวขัดโอ่งมังกร"
        effect: { energy: -10, heart: { bua: 2 }, text: "ยายบัวเล่าว่าโอ่งใบกลางยายเพียรช่วยแบกมาจากท่าน้ำเมื่อสี่สิบปีก่อน ‘หนักกว่าหลานตอนนี้อีก’" }
      - text: "เดินผ่านไปเฉยๆ"
        effect: { text: "ถังสีฟ้าทุกใบยิ้มตามหลัง ไม่ว่าจะเดินไปทางไหน" }
