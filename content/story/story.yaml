  - id: st_d15_ghost_rumor
    chapter: 1
    when: { day_min: 15, day_max: 16, flag: story_well_dry }
    trigger: morning
    art: ghost
    title: "ผู้หญิงบนท่อน้ำ"
    beats:
      - { who: narrator, text: "เช้าวันที่สิบห้า ข่าวมาถึงก่อนเพลงหอกระจายข่าวจะจบท่อนแรก" }
      - { who: taew, text: "(ตะโกนจากปากทาง ไม่ยอมเดินเข้ามา) หลาน! ได้ข่าวยัง! คนงานบริษัทลาออกสามคนรวด! เห็นผี!" }
      - { who: taew, text: "เขาว่ากันว่าเมื่อคืนตีสอง ตรงบ่อบาดาลท้ายตลาด มีผู้หญิงผมยาวนั่งบนท่อน้ำ ตัวเปียกทั้งตัว หันหน้าเข้าหาปั๊ม… แล้วปั๊มก็ดับเอง" }
      - { who: taew, text: "ยามบริษัทวิ่งมาร้าน 24 ชั่วโมง ตั้มบอกว่ายามซื้อน้ำเปล่าหกขวด กินหมดหน้าเคาน์เตอร์ แล้วถามว่ามีผ้ายันต์ขายไหม" }
      - { who: narrator, text: "ใครบางคนในกลุ่ม LINE ส่งรูปเบลอมา เห็นแสงขาวลอยเหนือรั้ว… อาจเป็นผี ไฟฉายยาม หรือนิ้วคนถ่าย" }
      - { who: taew, text: "ป้าไม่ได้พูดนะ แต่ป้าว่าแม่ธรณีเขาโกรธ ป้าจะไม่เดินผ่านตรงนั้นอีก แม้แต่ตอนกลางวัน แม้แต่ถ้ามีโปรโมชั่น" }
    choices:
      - text: "ป้าเชื่อจริงๆ เหรอ{kq}"
        effect: { heart: { taew: 1 }, text: "‘ป้าไม่เชื่อหรอก… แต่ป้ากลัว สองอย่างนี้ไม่เหมือนกันนะหลาน ป้าทำได้ทั้งสองอย่างพร้อมกัน’" }
      - text: "ป้าเข้ามาก่อน มายืนตะโกนทำไม{kq}"
        effect: { heart: { taew: 1 }, text: "‘บ้านหลานอยู่ทางเดียวกับบ่อบาดาล ป้าเดินมาแค่ครึ่งทางพอ ที่เหลือหลานเดินมาหาป้าเอง’" }
    effect: { set_flag: story_ghost_rumor }

  - id: st_d15_bua
    chapter: 1
    when: { day_min: 15, day_max: 18, time_from: "06:00", time_to: "19:00", flag: story_ghost_rumor }
    trigger: visit
    place: house_bua
    art: ghost
    title: "แม่ธรณีไม่ชอบ"
    beats:
      - { who: bua, text: "มานั่งนี่หลาน… ยายรู้ว่าหลานจะมาถามเรื่องผีบ่อบาดาล หน้าหลานเหมือนยายเพียรตอนอยากรู้อะไรสักอย่าง" }
      - { who: bua, text: "สมัยก่อนนะ จะขุดบ่อทุกบ่อ คนแก่เขาจุดธูปขอแม่ธรณีก่อน ขอแค่พอใช้ ไม่ขอเกิน ขุดเสร็จแล้วเอาข้าวปลาอาหารวางไว้ขอบบ่อ" }
      - { who: bua, text: "บ่อบริษัทเขาไม่ได้ขอ เจาะลงไปร้อยเมตร เครื่องดูดทั้งวันทั้งคืน… ผีไม่ชอบคนดูดน้ำจากแม่ธรณีหรอกหลาน" }
      - { who: bua, text: "ผู้หญิงบนท่อน่ะ ยายไม่รู้ว่าใคร… แต่ปีน้ำท่วมใหญ่ มีคนจมน้ำตรงคลองนั้นคนหนึ่ง ไม่มีญาติ ไม่มีใครทำบุญไปให้เลย" }
      - { who: bua, text: "(เคี้ยวหมากช้าๆ) ถ้าจะเดินแถวนั้นตอนค่ำ ผูกสายสิญจน์จากวัด อย่าหันหลังให้น้ำ แล้วอย่าพูดว่า ‘ไม่กลัว’ ผีมันถือเป็นคำท้า" }
      - { who: bua, text: "…แต่ยายว่านะหลาน ผีไล่คนงานได้สามคน บริษัทจ้างใหม่ได้สามสิบคน สุดท้ายคนก็ต้องช่วยกันเองนั่นแหละ" }
    choices:
      - text: "ยายเชื่อว่าผีมีจริงไหม{kq}"
        effect: { heart: { bua: 1 }, text: "‘ยายเชื่อว่าคนกลัวจริงหลาน กลัวแล้วหยุดทำผิดได้ ผีก็มีประโยชน์’" }
      - text: "{p}จะไปทำบุญให้คนที่จมน้ำ{k}"
        effect: { set_flag: story_merit_drowned, heart: { bua: 2 }, text: "ยายบัวยิ้มจนเห็นฟันแดงหมาก ‘ยายเพียรก็เคยพูดแบบนี้… หลานนี่หลานเขาจริงๆ’" }
      - text: "ยายเล่าน่ากลัวไปแล้ว{k}"
        effect: { energy: 5, text: "‘น่ากลัวก็ดี จะได้กลับบ้านก่อนสามทุ่ม’ ยายบัวหัวเราะ แล้วยื่นกล้วยต้มให้หนึ่งลูก" }
    effect: { set_flag: story_bua_ghost_talk }

  - id: st_life_lottery16
    chapter: 1
    when: { day_min: 16, day_max: 16, time_from: "15:00", time_to: "18:00" }
    trigger: visit
    place: taew_shop
    art: village
    title: "สี่โมงเย็นวันที่สิบหก"
    beats:
      - { who: narrator, text: "บ่ายสี่ วันที่สิบหก ทั้งตำบลเงียบเหมือนรอประกาศผลสอบ วิทยุหน้าร้านป้าแต๋วเปิดดังสุด" }
      - { who: sommai, text: "เงียบๆ! …รางวัลเลขท้ายสองตัว…" }
      - { who: narrator, text: "‘…ศูนย์ สาม’" }
      - { who: sommai, text: "ศูนย์สาม! ลุงซื้อศูนย์สอง! บ่อบอกศูนย์สองชัดๆ… บ่อมันพูดไม่ชัดเพราะคอแห้ง!" }
      - { who: porn, text: "ยี่สิบปีมานี้ตาแก่ห่างหนึ่งเลขทุกงวด เอาเงินที่เสียมารวมกัน เราเจาะบ่อบาดาลแข่งกับบริษัทได้แล้ว" }
      - { who: taew, text: "ป้าก็ซื้อศูนย์สอง… ไม่ได้ซื้อนะ ฝากเจ๊หงษ์ไว้เฉยๆ" }
      - { who: sathian, text: "(นั่งกินกาแฟกระป๋องหน้าร้าน) ดาบไม่ได้ยินอะไรนะ ใครฝากใครซื้ออะไร ดาบหูไม่ดีช่วงสี่โมงถึงห้าโมง" }
