    title: "กีฬาสีโรงเรียนบ้านดงเย็น"
    beats:
      - { who: narrator, text: "สนามโรงเรียนประดับธงสีกระดาษ สีเขียวกับสีเหลือง นักเรียนทั้งโรงเรียนสามสิบสี่คน แบ่งได้สีละสิบเจ็ด" }
      - { who: wichai, text: "(กล่าวเปิดงานกลางแดด) กีฬาคือการบูรณาการร่างกายและจิตใจครับ ซึ่งในส่วนของร่างกาย…" }
      - { who: narrator, text: "สี่สิบนาทีต่อมา นายกฯ ยังกล่าวเปิดอยู่ เด็กแถวหน้าเริ่มนั่งยองๆ หมอแอนเดินถือน้ำเกลือแร่ไล่แจกเงียบๆ" }
      - { who: toey, text: "(กระซิบกับไมค์อีกตัว) ขอบคุณท่านนายกฯ มากๆ นะคะ ครูให้คำกล่าวเปิดสิบเต็มสิบ… สำหรับความยาว เริ่มแข่งเลยนะจ๊ะเด็กๆ" }
      - { who: mew, text: "พี่{player}! หนูอยู่สีเหลือง! หนูจะชนะวิ่งเปรี้ยว ส่วนโอ๊ตจะแพ้ เขาวิ่งไปดูแมลงทุกรอบ" }
      - { who: oat, text: "ผมไม่ได้ดูแมลง! ผมวางแผน! …พี่ครับ มีวิ่งผู้ปกครองด้วย สีผมขาดคนนึง พี่มาวิ่งแทนพ่อผมได้ไหมครับ พ่อผมอยู่กรุงเทพฯ" }
    choices:
      - text: "ลงวิ่งแทนพ่อโอ๊ต"
        effect: { energy: -15, heart: { oat: 2, toey: 1 }, text: "ได้ที่สาม จากสามคน แต่โอ๊ตกระโดดกอดเหมือนได้ที่หนึ่ง ‘พี่วิ่งเหมือนพ่อผมเลย! …พ่อผมก็ได้ที่สาม’" }
      - text: "ไปยืนเชียร์ข้างครูเต้ย"
        effect: { heart: { toey: 1, mew: 1 }, text: "ครูเต้ยแปะสติกเกอร์ดาวบนแขนเสื้อให้ ‘ผู้เชียร์ดีเด่น ครูให้เก้าเต็มสิบ หักหนึ่งเพราะเชียร์ทั้งสองสี’" }
      - text: "ไปช่วยหมอแอนแจกน้ำ"
        effect: { heart: { ann: 1 }, text: "หมอแอนยิ้ม ‘ขอบคุณนะคะ ปีที่แล้วเด็กเป็นลมสองคน ระหว่างคำกล่าวเปิดค่ะ ไม่ใช่ระหว่างวิ่ง’" }
    effect: { set_flag: story_sports_day }

