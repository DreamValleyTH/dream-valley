  - id: st_d25_posters
    chapter: 1
    when: { day_min: 25, day_max: 28, map: town, flag: story_election_announced }
    trigger: enter_map
    art: village
    title: "เสาไฟมีหน้าคน"
    beats:
      - { who: narrator, text: "ตอนบ่าย เสาไฟทุกต้นในตำบลมีหน้าคนติดอยู่ บางต้นสามหน้าซ้อนกัน ทั้งที่ยังไม่เปิดรับสมัครด้วยซ้ำ" }
      - { who: narrator, text: "ป้ายแรก นายกฯ วิชัยยิ้มคู่ภรรยา ‘สานต่องานที่ยังไม่เสร็จ’ ตัวเล็กข้างล่าง ‘ผู้สมัคร: คุณนายพเยาว์’" }
      - { who: narrator, text: "ป้ายที่สอง ไม่มีชื่อ ไม่มีเบอร์ มีแต่รูปถนนลาดยางกับคำว่า ‘ความเจริญมาถึงแล้ว’ มุมล่างมีหยดน้ำยิ้มตัวเล็กนิดเดียว" }
      - { who: narrator, text: "ป้ายที่สาม เขียนด้วยมือบนกระดาษลัง ‘ใครอยากลงผู้ใหญ่บ้าน มาคุยที่ศาลา ผู้ใหญ่จะสอนวิธีย้ำ’" }
      - { who: wichai, text: "(ยืนใต้ป้าย) ผมไม่ได้ลงสมัครครับ กฎหมายไม่อนุญาต ผมแค่มายืนเป็นกำลังใจให้ป้าย ซึ่งบังเอิญมีหน้าผมครับ" }
      - { who: heng, text: "เฮียไม่ได้ลงนะน้อง เฮียรับทำป้ายให้ทุกฝ่าย ราคาเท่ากัน ฝ่ายที่จ่ายสดลดห้าเปอร์เซ็นต์ ประชาธิปไตยต้องเท่าเทียม ฮ่าๆ" }
      - { who: kla, text: "(โดนป้าแต๋วกับยายบัวล้อม) ผมไม่ลงครับ ผมทำสหกรณ์… ป้าครับ อย่าเพิ่งถ่ายรูปผมโพสต์ ป้า…" }
      - { who: taew, text: "(หันมาหาผู้เล่น) แล้วหลานล่ะ… ป้าไม่ได้พูดนะ แต่เขาว่ากันว่าหลานยายเพียรก็ลงได้นะ" }
