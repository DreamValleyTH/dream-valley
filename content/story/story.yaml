    beats:
      - { who: narrator, text: "สองวันต่อมา เสียงป้าพรดังลั่นมาจากหมู่สี่ ได้ยินถึงตลาด" }
      - { who: porn, text: "ตาแก่! บ่อแห้งแล้ว! เอาเงินค่าหวยยี่สิบปีมาเจาะบ่อใหม่เลยนะ!" }
      - { who: sommai, text: "ใจเย็นแม่… หลาน ดูนี่ ลุงหย่อนเชือกไปสิบสองเมตร สมัยก่อนหกเมตรก็เจอน้ำแล้ว" }
      - { who: sommai, text: "เมื่อคืนลุงฝันว่าบ่อพูดได้ มันบอกว่า ‘คอแห้ง’ …ลุงตีได้ศูนย์สอง" }
      - { who: porn, text: "นี่! บ่อแห้งยังจะตีเลขอีก!" }
      - { who: kla, text: "(วิ่งมาพร้อมแฟ้ม) บ่อที่แปดแล้วครับลุง ห่างบ่อบาดาลบริษัทหนึ่งกิโลสอง ทุกบ่อที่แห้งอยู่ในรัศมีสองกิโล ผมทำแผนที่ไว้แล้วครับ" }
      - { who: sommai, text: "หลานกล้า ลุงอ่านแผนที่ไม่เป็น แต่ลุงอ่านออกว่าเรากำลังจะไม่มีน้ำ" }
    choices:
      - text: "{p}ลงชื่อในรายชื่อของกล้าด้วย{k}"
        effect: { set_flag: story_kla_list, heart: { kla: 1, sommai: 1 }, text: "รายชื่อหน้าแรกมีสิบสี่ชื่อ ชื่อของคุณอยู่ใต้ลายเซ็นยายบัวที่เขียนตัวโตที่สุด" }
      - text: "ลุงไปตักน้ำบ่อบ้าน{p}ได้นะ{k}"
        effect: { set_flag: story_share_well, heart: { sommai: 2, porn: 1 }, text: "ป้าพรหยุดด่าไปห้าวินาที เป็นห้าวินาทีที่เงียบที่สุดของหมู่สี่ ‘…ขอบใจนะหลาน’" }
      - text: "ลุงตีเลขศูนย์สองจริงเหรอ{kq}"
        effect: { heart: { sommai: 1, porn: -1 }, text: "ลุงขยิบตา ป้าพรหยิบรองเท้าแตะ ลุงวิ่ง" }
