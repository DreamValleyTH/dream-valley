    when: { day_min: 25, day_max: 25 }
    time: "06:00"
    text: "ประกาศจากอำเภอ… เลือกตั้งนายก อบต. และผู้ใหญ่บ้านหมู่สาม ภายในสี่สิบห้าวัน ย้ำอีกครั้งนะ ทั้งสองตำแหน่ง… ผู้ใหญ่ขอบคุณพี่น้องสิบแปดปี ย้ำอีกครั้งนะ ขอบคุณ"
  - id: bc_d25_pm
    when: { day_min: 25, day_max: 25 }
    time: "17:00"
    text: "ประกาศ อบต. ห้ามติดป้ายหาเสียงก่อนเปิดรับสมัคร… ผู้ใหญ่อ่านตามหนังสือ ผู้ใหญ่มองออกไปนอกหอ เห็นป้ายติดไปแล้วสี่สิบแผ่น"
  - id: bc_d26_am
    when: { day_min: 26, day_max: 26 }
    time: "06:00"
    text: "ใครสนใจลงสมัครผู้ใหญ่บ้าน มารับใบสมัครที่ศาลา เตรียมสำเนาบัตรสามชุด ย้ำอีกครั้งนะ สามชุด ผู้ใหญ่บอกไว้ตั้งแต่วันแรกแล้ว"
  - id: bc_d26_pm
    when: { day_min: 26, day_max: 26 }
    time: "17:00"
    text: "ขอความร่วมมือรถแห่ ห้ามเปิดเพลงหลังหนึ่งทุ่ม เด็กจะนอน… และห้ามเปิดเพลงทับหอกระจายข่าว ผู้ใหญ่ยังพูดไม่จบ ย้ำอีกครั้งนะ ผู้ใหญ่ยังพูดไม่จบ"
  - id: bc_d27_am
    when: { day_min: 27, day_max: 27 }
    time: "06:00"
    text: "ตลาดนัดวันเสาร์… ร้านกาแฟน้องแพรวมีเมนูใหม่ ผู้ใหญ่ไม่ได้รับเงินโฆษณา กำนันขอให้ประกาศ ย้ำอีกครั้งนะ กำนันขอ"
  - id: bc_d27_pm
    when: { day_min: 27, day_max: 27 }
    time: "17:00"
    text: "ขอแทรกประกาศหาเสียง… ไม่ได้ ผู้ใหญ่ไม่แทรก ใครให้เงินผู้ใหญ่มา ผู้ใหญ่คืนแล้ว ย้ำอีกครั้งนะ คืนแล้ว"
  - id: bc_d28_am
    when: { day_min: 28, day_max: 28 }
    time: "06:00"
    text: "สิ้นเดือนแล้วพี่น้อง ใครยังไม่จ่ายค่าน้ำประปาหมู่บ้าน… ประปาหมู่บ้านไม่มีน้ำ ไม่ต้องจ่าย ย้ำอีกครั้งนะ ไม่ต้องจ่าย ผู้ใหญ่พูดเอง"
  - id: bc_d28_pm
    when: { day_min: 28, day_max: 28 }
    time: "17:00"
    text: "ขอให้พี่น้องระวังคนแปลกหน้าเดินเคาะประตูช่วงหาเสียง… และคืนก่อนเลือกตั้งอยู่บ้าน หมาจะหอน ผู้ใหญ่ไม่ได้หมายถึงผี ย้ำอีกครั้งนะ ไม่ได้หมายถึงผี"
  # ----- ประกาศวนซ้ำหลังจบองก์ 1
  - id: bc_loop_am
    when: { day_min: 29, day_max: 999 }
    time: "06:00"
    text: "สวัสดีพี่น้องหมู่สาม วันนี้อากาศ… ดูเอาเองนะ ผู้ใหญ่ตาไม่ดีแล้ว ย้ำอีกครั้งนะ ดูเอาเอง"
  - id: bc_loop_pm
    when: { day_min: 29, day_max: 999 }
    time: "17:00"
    text: "ราคาพรุ่งนี้ ข้าว พริก ผัก ตามที่ติดหน้าร้านเสี่ยเฮงกับสหกรณ์ ผู้ใหญ่อ่านไม่ทัน… ใครทำของหายแจ้งผู้ใหญ่ ใครเก็บได้แจ้งผู้ใหญ่ ผู้ใหญ่อยู่ศาลาจนถึงหกโมงเย็น"
