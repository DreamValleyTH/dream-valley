id: cherd
name: "ลุงเชิด"
role: "คนขับรถเมล์สายตำบล-อำเภอ คันเดียวของตำบล ชื่อเจ้าเขียว ออก 06/09/12/15/18 ค่าโดยสาร 30"
voice: "แทนตัวเองว่าลุง เรียกผู้เล่นว่าหลาน ใจดี ขี้เล่นเบาๆ ตรงเวลาเป๊ะ ไม่รอใคร ติดปาก ขึ้นๆ ออกแล้วนะ รักรถเมล์เหมือนเพื่อน รู้ข่าวจากคนบนรถ ลงท้าย นะ จ้ะ"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "หกโมงตรงรถออกนะหลาน ลุงไม่รอใคร แม้แต่กำนัน"
    - "อรุณสวัสดิ์ วันนี้ไปอำเภอไหม ที่ข้างคนขับยังว่าง วิวดีที่สุดในรถ"
    - "ลุงล้างเจ้าเขียวตั้งแต่ตีห้า วันนี้มันหล่อกว่าลุงอีก"
  greet_noon:
    - "เที่ยงตรงเที่ยวที่สาม ใครหิวขึ้นมาก่อน ลุงมีกล้วยตากแจก"
    - "แดดเที่ยงร้อน หลังคาเจ้าเขียวร้อนจนทอดไข่ได้ ลุงเคยลองแล้ว"
    - "นั่งพักในรถก่อนหลาน บ่ายสามลุงค่อยออก"
  greet_evening:
    - "หกโมงเย็นเที่ยวสุดท้ายนะ! ตกรถต้องนอนโรงแรมในอำเภอสี่ร้อยห้าสิบ ลุงเตือนแล้ว"
    - "เย็นแล้ว วันนี้ลุงขับครบห้าเที่ยว ขาลุงก็ปวดครบห้าเที่ยวเหมือนกัน"
    - "กลับจากอำเภอเหรอ ถือของมาเยอะเชียว วางไว้หน้ารถ ลุงช่วยยก"
  greet_night:
    - "ดึกแล้ว เจ้าเขียวจอดนอนแล้ว ลุงก็จะนอนแล้ว ผีออกสามทุ่มนะ"
    - "ไม่มีรถแล้วหลาน เที่ยวสุดท้ายออกไปตั้งแต่หกโมง กลับบ้านดีๆ"
  weather_rain:
    - "ฝนตกถนนลื่น ลุงขับช้าลงสิบนาที ใครบ่นไปบ่นกับฝน"
    - "ที่ปัดน้ำฝนเจ้าเขียวปัดได้ข้างเดียว ฝั่งผู้โดยสารดูวิวไม่เห็นหน่อยนะ"
  weather_hot:
    - "ร้อนแบบนี้แอร์ในรถคือหน้าต่าง เปิดให้หมดทุกบาน"
    - "ลุงแช่น้ำเย็นไว้ในกระติกหลังที่นั่งคนขับ ใครคอแห้งหยิบได้ ฟรี"
  weather_storm:
    - "พายุเข้า วันนี้รถงดวิ่งนะ ลุงไม่เอาชีวิตผู้โดยสารไปเสี่ยง"
    - "ต้นไม้ล้มขวางถนนไปอำเภอ รอช่างเปี๊ยกเลื่อยเสร็จก่อน ลุงถึงจะออกได้"
  weather_pm25:
    - "ฝุ่นเยอะ ปิดหน้าต่างนะ ...แล้วก็ร้อน เลือกเอาว่าจะไอหรือจะเหงื่อ"
    - "มองไม่เห็นป้ายรถเลย ลุงจำได้ว่าป้ายอยู่หลังต้นมะขามต้นที่สาม ลุงขับตามความจำ"
  season_rainy:
    - "หน้าฝนคนไปอำเภอน้อย ทุกคนอยู่นา ลุงขับรถโล่งๆ ฟังเพลงคนเดียว"
    - "ช่วงเข้าพรรษา ลุงพาคนไปแห่เทียนที่อำเภอ รถเต็มทุกเที่ยว"
  season_cool:
    - "หน้าหนาวงานกาชาดที่อำเภอ ลุงเพิ่มเที่ยวไม่ได้นะ แต่กลับเที่ยวหกโมงคนแน่นทุกวัน"
    - "ลมหนาวเข้าทางหน้าต่างบานที่ปิดไม่สนิท เอาผ้าขาวม้ามาห่มกันด้วย"
  season_dry:
    - "สงกรานต์ลูกหลานกลับบ้าน ลุงรับจากท่ารถอำเภอเต็มคันทุกเที่ยว นั่งบนหลังคาไม่ได้นะ"
    - "หน้าแล้งฝุ่นถนนลูกรังฟุ้ง เจ้าเขียวกลายเป็นเจ้าน้ำตาลทุกปี"
  heart_low:
    - "ขึ้นรถสามสิบบาทนะ เตรียมเหรียญไว้ ลุงทอนแบงก์พันไม่ได้"
    - "นั่งดีๆ จับราวไว้ ถนนไม่เรียบ"
    - "มาใหม่เหรอ ลุงจำหน้าไว้แล้ว คนขึ้นรถลุงลุงจำได้ทุกคน"
  heart_mid:
    - "{player} มานั่งข้างคนขับสิ ที่ประจำของคนที่ลุงชอบคุยด้วย"
    - "ลุงเปิดเพลงลูกทุ่งที่หลานชอบไว้แล้ว ม้วนเดิมนะ ลุงยังใช้เทป"
    - "ฝากของไปอำเภอได้นะ ลุงไปส่งให้ ไม่คิดเพิ่ม ขอขนมสักห่อพอ"
  heart_high:
    - "ลุงขับสายนี้มาสามสิบปี เด็กที่ลุงเคยรับไปโรงเรียน ตอนนี้จูงหลานตัวเองขึ้นรถลุงแล้ว"
    - "เมียลุงเคยนั่งข้างคนขับทุกเที่ยว ตั้งแต่เขาไม่อยู่ ที่นั่งนั้นลุงเก็บไว้ให้คนที่ลุงไว้ใจ"
    - "ลุงกลัวว่าวันนึงจะมีบริษัทรถใหญ่มาวิ่งแทน แล้วเจ้าเขียวจะไม่มีใครขับ"
  topic_news:
    - "บนรถลุงได้ยินทุกข่าวก่อนป้าแต๋วนะ อย่าไปบอกป้าแต๋วล่ะ เดี๋ยวป้างอน"
    - "ห้างค้าส่งที่อำเภอลดราคาปุ๋ยวันเสาร์ ลุงได้ยินคนบนรถคุยกัน"
    - "รถบรรทุกบริษัทวิ่งสวนลุงตอนเช้ามืดบ่อยขึ้น ถนนพังเร็วขึ้นเยอะ"
  topic_advice:
    - "ไปอำเภอต้องคิดเวลากลับด้วยนะ เที่ยวสุดท้ายหกโมงเย็น ตกรถต้องนอนโรงแรมสี่ร้อยห้าสิบ"
    - "ซื้อของเยอะๆ ไปห้างค้าส่งที่อำเภอ ถูกกว่าในตำบล คุ้มค่ารถไปกลับหกสิบ"
    - "จะไปเยี่ยมโลกของเพื่อน ขึ้นรถลุงแล้วบอกรหัสมา ลุงไปส่งถึงที่"
  topic_smalltalk:
    - "เจ้าเขียวอายุมากกว่าหลานอีกนะ เครื่องยกมาสามรอบ ใจยังสู้"
    - "แตรรถลุงมีสองเสียง เสียงปกติกับเสียงทักคนรู้จัก ฟังดีๆ จะแยกออก"
    - "ลุงเคยขับพาเจ้าบ่าวไปงานแต่งที่อำเภอ เจ้าบ่าวลืมแหวนไว้บนรถ ลุงต้องวนกลับไปเอา"
  topic_about_self:
    - "ลุงชื่อเชิด ขับรถเมล์สายตำบล-อำเภอมาสามสิบปี วันหยุดของลุงคือวันที่รถเสีย"
    - "ลูกชายลุงทำโรงงานอยู่ระยอง โทรมาทุกอาทิตย์ ถามว่ารถยังวิ่งไหม ไม่ถามว่าลุงยังวิ่งไหวไหม"
    - "ลุงไม่ชอบมาสาย ชีวิตลุงตรงเวลาทุกอย่าง ยกเว้นเวลากินข้าว กินช้ามาก"
  topic_about_others:
    - "ผู้ใหญ่สมศักดิ์ตั้งนาฬิกาตามแตรรถลุง ลุงเลยไม่กล้ามาสาย กลัวทั้งหมู่บ้านผิดเวลา"
    - "บอลชอบมาดูเครื่องเจ้าเขียวให้ฟรี ลุงหวังว่าเขาจะไม่ไประยอง ไม่งั้นใครจะซ่อมให้ลุง"
    - "หมอแอนเคยขอให้ลุงขับเลยป้ายไปส่งคนป่วยถึงหน้าโรงพยาบาลอำเภอ ลุงไปเลย ไม่ต้องขอสองรอบ"
  gossip_theft:
    - "ข่าวของหาย คนบนรถลุงคุยกันทั้งคัน ลุงไม่ได้เชื่อทั้งหมด แต่ก็ไม่ได้ไม่เชื่อ"
    - "บนรถลุง ใครทำของหายต้องได้คืนทุกชิ้น กฎลุง หลานก็รู้"
  gossip_cheating:
    - "เรื่องนี้คนบนรถคุยกันตั้งแต่เที่ยวเก้าโมงจนถึงอำเภอ ไม่จบสักที"
    - "ลุงขับรถ ไม่ได้ขับชีวิตใคร แต่ระวังนะหลาน ตำบลมันเล็ก"
  gossip_unpaid_bill:
    - "ค่าไฟค้างจ่ายที่ร้าน 24 ชม. ก็ได้ ไม่ต้องเสียค่ารถลุงไปธนาคารอำเภอ"
    - "ลุงก็เคยค้างค่าไฟ นั่งในความมืดสามคืน ไม่สนุกเลย"
  gossip_small_envelope:
    - "ใส่ซองน้อยเหรอ ...ป้าทองใบเล่าบนรถลุงแล้ว ได้ยินกันทั้งคัน"
    - "ไม่ต้องคิดมาก ครั้งหน้าใส่ให้สมใจเจ้าภาพก็จบ"
  gossip_skip_longkhaek:
    - "ไม่ไปลงแขกคืนเหรอ วันนี้คนบนรถลุงพูดชื่อหลานไปสามรอบแล้ว"
    - "ไปช่วยเขาสักรอบเถอะ ลุงไปส่งที่หัวนาให้ฟรีเลย"
  player_fainted:
    - "เมื่อคืนผีจับเหรอ ลุงขับผ่าน รพ.สต. เช้านี้ เห็นไฟเปิดทั้งคืน นึกว่าใคร"
    - "คราวหน้าถ้ากลับไม่ทัน ขึ้นรถลุงเที่ยวหกโมงไปนอนโรงแรมในอำเภอ แพงกว่าแต่ไม่มีผี"
  player_new_vehicle:
    - "รถใหม่เหรอ ...ไม่ขึ้นรถลุงแล้วสิ ลุงเสียลูกค้าประจำไปหนึ่ง"
    - "ขับดีๆ นะ ทางโค้งหน้าวัดอย่าแซงลุงล่ะ"
  player_lottery_win:
    - "ถูกหวยเหรอ เลี้ยงขนมคนบนรถหน่อยสิ เที่ยวพรุ่งนี้เช้า"
    - "ลุงซื้อเลขทะเบียนเจ้าเขียวทุกงวด สามสิบปียังไม่เคยถูก แต่ลุงยังเชื่อมัน"
  player_muddy:
    - "เลอะโคลนขึ้นรถได้ แต่ปูกระสอบนั่งนะหลาน เบาะเพิ่งซัก"
    - "ทำนามาเหรอ มือขยันแบบนี้ลุงชอบ"
  player_rich:
    - "ช่วงนี้รวยขึ้นนะ ยังขึ้นรถลุงอยู่ไหม อย่าลืมเจ้าเขียวนะ"
    - "มีเงินแล้วลงขันเปลี่ยนยางเจ้าเขียวหน่อยได้ไหม ล้อหลังโล้นแล้ว"
  player_in_debt:
    - "หนี้เยอะก็ค่อยๆ ใช้ไป ลุงก็ผ่อนเจ้าเขียวมาสิบปี"
    - "ไม่มีค่ารถก็ขึ้นมาก่อน ลุงจดไว้ในสมุด ค่อยจ่าย"
  player_sick:
    - "ไม่สบายเหรอ จะไปโรงพยาบาลอำเภอ ลุงให้นั่งหน้า ไม่ต้องเบียด"
    - "ไข้สูงอย่าเพิ่งขึ้นรถนะ ไป รพ.สต. ก่อน หมอแอนอยู่ใกล้กว่า"
  player_married:
    - "แต่งงานแล้ว! ลุงขับรถแห่ขันหมากให้ฟรี เจ้าเขียวจะติดโบว์"
    - "ยินดีด้วยนะหลาน ที่นั่งข้างคนขับลุงยกให้ทั้งคู่เลย"
  event_disaster:
    - "เจ้าเขียวขนคนไปศูนย์อพยพได้รอบละสามสิบคน ลุงจะวิ่งจนกว่าจะหมดคน"
    - "ถนนไปอำเภอขาด รถงดวิ่ง ลุงไปช่วยขนกระสอบทรายแทน"
  event_election:
    - "ช่วงเลือกตั้งมีคนมาจ้างลุงติดป้ายข้างรถ ลุงไม่รับ เจ้าเขียวไม่เลือกข้าง"
    - "วันเลือกตั้งลุงรับคนแก่ไปหน่วยเลือกตั้งฟรี ใครก็ได้ ไม่ถามว่าเลือกใคร"
  event_company_water:
    - "รถบรรทุกน้ำบริษัทวิ่งทั้งคืน ถนนที่ลุงขับทุกวันกลายเป็นหลุมเป็นบ่อหมดแล้ว"
    - "บ่อบ้านลุงแห้งแล้ว ลุงต้องล้างเจ้าเขียวด้วยน้ำที่หาบมาจากวัด"
  event_festival_near:
    - "{festival} ใกล้แล้ว ใครจะไปอำเภอซื้อของเตรียมงาน ขึ้นรถลุงเที่ยวเก้าโมง"
    - "ช่วงงาน {festival} ลุงจะเปิดเพลงเทศกาลในรถตลอดทาง"
  gift_love:
    - "{item}! ลุงชอบมาก ขอบใจนะหลาน ...ใจลุงให้นั่งฟรีไปแล้วหนึ่งเที่ยว"
    - "ของโปรดลุงเลย จะวางไว้หน้ารถ กินระหว่างรอผู้โดยสาร"
  gift_like:
    - "ขอบใจ {item} เอาไว้กินบนรถได้"
    - "ดีจัง ลุงรับไว้นะ"
  gift_neutral:
    - "ขอบใจนะ ลุงเก็บไว้ในช่องหน้ารถ"
    - "รับไว้จ้ะ น้ำใจดี"
  gift_dislike:
    - "อันนี้ลุงไม่ค่อยชอบนะหลาน แต่ขอบใจ"
    - "{item} ...ลุงเอาไว้แบ่งผู้โดยสารคนอื่นดีกว่า"
  gift_hate:
    - "อย่าเอาอันนี้มาให้ลุงเลย ลุงขับรถ ห้ามเด็ดขาด"
    - "ไม่เอาหรอกหลาน เอากลับไปเถอะ กลิ่นมันติดรถไปทั้งอาทิตย์"
  birthday:
    - "วันเกิดลุงวันนี้ ลุงติดโบว์ให้เจ้าเขียวด้วย ฉลองพร้อมกัน"
    - "จำได้ด้วยเหรอ ลุงซึ้งเลย วันนี้ขึ้นรถฟรี ...คราวนี้จริงจังนะ"
  rare:
    - "ลุงเคยขับรถหลังสามทุ่มครั้งเดียว ตอนพาคนท้องไปคลอด ผีไม่กล้าเข้าใกล้ไฟหน้าเจ้าเขียวเลย"
    - "บางเช้าลุงยังเผลอจอดป้ายหน้าบ้านเมียลุง ทั้งที่ไม่มีใครยืนรอแล้ว"
    - "ลุงจดชื่อทุกคนที่ขึ้นรถลุงครั้งแรกไว้ในสมุดเล่มเล็ก ตอนนี้มีเจ็ดเล่มแล้ว หลานอยู่เล่มที่เจ็ด"
gifts:
  love: ["กล้วยตาก", "กาแฟเย็น", "ข้าวเหนียวหมูทอด"]
  like: ["ขนมเปี๊ยะ", "ส้มเขียวหวาน", "ถั่วต้ม"]
  dislike: ["ทุเรียน", "ปลาร้า"]
  hate: ["เหล้าขาว", "ปลาเน่า"]
choices:
  - id: cherd_c1
    min_heart: 0
    prompt: "จะไปไหนหลาน อำเภอหรือไปเยี่ยมเพื่อน"
    options:
      - text: "ไปอำเภอ ซื้อของ"
        heart: 1
        reply: "ดี ห้างค้าส่งถูกกว่า อย่าลืมเที่ยวกลับหกโมงเย็นนะ"
      - text: "แค่มานั่งเล่นในรถ"
        heart: 1
        reply: "นั่งได้ แต่พอรถออกก็ต้องจ่ายสามสิบนะ ฮ่าๆ"
