id: tam
name: "ตั้ม"
role: "พนักงานร้าน 24 ชม. กะดึก จบปริญญาตรี ร้านเป็นที่หลบผีของคนทั้งตำบล"
voice: "หน้าตาย เสียงเรียบ ลงท้ายครับทุกประโยค เรียกผู้เล่นว่าคุณหรือชื่อ พูดสั้น พูดเรื่องน่ากลัวกับเรื่องโปรโมชั่นด้วยน้ำเสียงเดียวกัน หาวบ่อย ตลกร้ายเรื่องงาน ค่าแรง หนี้การศึกษา"
dark_humor: true
romanceable: false
lines:
  greet_morning:
    - "อรุณสวัสดิ์ครับ สำหรับผมคือราตรีสวัสดิ์ อีกยี่สิบนาทีผมเลิกกะ"
    - "เช้าแล้วเหรอครับ ผมรู้เพราะผีกลับหมดแล้ว แล้วป้าแต๋วก็เริ่มเปิดร้าน"
    - "รับซาลาเปาไหมครับ ไส้หมูสับที่ผมนึ่งตั้งแต่ตีสาม ตอนนี้มันเหนื่อยพอๆ กับผม"
    - "ยินดีต้อนรับครับ เสียงประตูอัตโนมัติวันนี้ดังไปแปดร้อยครั้ง ผมนับ ไม่มีอะไรจะทำ"
    - "เช้านี้กาแฟสามสิบ ผมดื่มไปสี่แก้ว ใช้สิทธิ์พนักงานลดสิบเปอร์เซ็นต์ ก็คือผมจ่ายร้อยแปด"
  greet_noon:
    - "ผมมาซื้อข้าวเวฟครับ วันหยุดผม แต่ก็มาร้านเดิม ไม่มีที่อื่นเปิดแอร์ฟรี"
    - "เที่ยงแล้วเหรอครับ ผมเพิ่งตื่น ร่างกายผมคิดว่าตอนนี้ตีสอง"
    - "ผมเดินผ่านมาเฉยๆ ครับ ไม่ได้ทำงาน เวลาไม่ได้ทำงานผมพูดน้อยกว่านี้อีก"
    - "แดดจ้ามากครับ ผมไม่ค่อยเห็นแสงแดด ตอนนี้กำลังศึกษาว่ามันคืออะไร"
    - "สวัสดีครับ ถ้าเห็นผมตอนกลางวันแปลว่าผมต้องไปจ่ายหนี้กองทุนกู้ยืมเพื่อการศึกษาที่ธนาคาร"
  greet_evening:
    - "หกโมงเย็น ผมเริ่มกะหกโมงครึ่ง ขอเวลาผมปลุกวิญญาณตัวเองแป๊บนึงครับ"
    - "ยินดีต้อนรับครับ ช่วงนี้คนมาจ่ายค่าไฟเยอะ ค่าธรรมเนียมสิบบาท ผมไม่ได้สักบาทครับ"
    - "เย็นแล้วครับ ซื้อของไว้ก่อน หลังสามทุ่มผีมาแย่งคิว"
    - "ข้าวเวฟกะเพราไก่เพิ่งเติมครับ ลอตนี้หมดอายุพรุ่งนี้ อร่อยที่สุดตอนใกล้หมดอายุ เหมือนคนครับ"
    - "สวัสดีครับ ตอนนี้ผมยังพอมีชีวิตชีวา ใช้ให้คุ้มก่อนตีสอง"
  greet_night:
    - "สามทุ่มแล้วครับ ร้านนี้สว่างทั้งคืน นั่งได้ แต่นอนพื้นหน้าตู้แช่ไม่ได้ครับ ผมนอนไปแล้ว"
    - "ถ้าจะหลบผีก็เชิญครับ ไม่เก็บค่าที่ แต่ช่วยซื้ออะไรสักอย่างให้ยอดขายกะดึกดูมีความหวัง"
    - "ผีมาซื้อของบ่อยครับ แต่ไม่มีใครสะสมแต้ม"
    - "เมื่อกี้มีกระสือลอยผ่านหน้าร้าน ผมกดเปิดประตูอัตโนมัติไม่ทัน เลยเสียลูกค้าไปหนึ่งราย"
    - "ดึกแล้วครับ ตื่นมาแรงจะเหลือสามในสี่ แต่ยังดีกว่าตื่นที่ รพ.สต. ครับ ผมเคยมาแล้วทั้งสองแบบ"
  weather_rain:
    - "ฝนตกครับ คนเข้ามาหลบในร้านเยอะ ขายร่มได้สามคัน ขายความหวังได้ศูนย์"
    - "ร่มพับคันละร้อยสี่สิบครับ แพงกว่าร้านป้าแต๋ว แต่ร้านป้าแต๋วปิดแล้ว นี่คือเศรษฐศาสตร์ครับ"
    - "พื้นร้านเปียกครับ ผมถูไปแล้วหกรอบ มีคนเดินเข้ามาเจ็ดคน"
    - "ฝนตกกลางคืน ผีไม่ค่อยเปียกนะครับ ผมสังเกตมา ไม่รู้เขาใช้ร่มอะไร"
    - "ฟ้าแลบทีนึง ไฟร้านกะพริบทีนึง ลูกค้ากรี๊ดทีนึง ผมเฉยๆ ครับ ชินแล้ว"
  weather_hot:
    - "ร้อนครับ ตู้แช่เป็นที่ที่คนอยากอยู่ที่สุดในตำบล รวมถึงผม"
    - "น้ำแข็งถุงหมดตั้งแต่บ่ายครับ ร้อนขนาดนี้ผมอยากเอาตัวเองไปแช่แทนไอติม"
    - "คนเข้ามาเปิดตู้แช่ยืนนิ่งๆ สองนาทีแล้วเดินออก เยอะมากครับวันนี้ ไม่มีใครซื้อ"
    - "แอร์ร้านตั้งไว้ยี่สิบห้าครับ สำนักงานใหญ่สั่ง ประหยัดพลังงาน พนักงานไม่ได้อยู่ในการคำนวณ"
    - "เกลือแร่ขวดละยี่สิบครับ ดื่มแล้วไม่เป็นลมแดด ผมขายไปสามสิบขวด ตัวเองยังไม่ได้ดื่ม"
  weather_storm:
    - "พายุครับ ไฟดับ ร้านเปิดไฟสำรอง ตู้ ATM ยังใช้ได้ เป็นสิ่งเดียวในตำบลที่ไม่เคยหยุดทำงาน นอกจากผม"
    - "ป้ายร้านด้านนอกกะพริบอยู่ตัวเดียว เหลือคำว่า 24 สำหรับผมก็ครบถ้วนแล้ว"
    - "ลมแรงจนประตูอัตโนมัติเปิดเอง ผมพูดยินดีต้อนรับไปสิบสองรอบให้ลม"
    - "พายุแบบนี้ไม่มีใครมา ผมเลยเรียงบะหมี่ถ้วยตามรสชาติ ตามสี แล้วก็ตามความรู้สึก"
  weather_pm25:
    - "ฝุ่นเยอะครับ หน้ากากหมดตั้งแต่เช้า สำนักงานใหญ่ส่งของมาเพิ่มอาทิตย์หน้า ตอนนั้นฝุ่นคงหมดแล้ว"
    - "ผมมองออกไปนอกร้านตอนตีสาม ไฟถนนเป็นสีส้มขุ่น เหมือนอยู่ในขวดน้ำส้มที่หมดอายุ"
    - "ในร้านมีแอร์ อากาศดีกว่าข้างนอกครับ คนเลยมายืนเลือกขนมนานขึ้น ยอดขายไม่ขึ้นครับ"
    - "ไอครับ ขอโทษ ผมไม่ได้ป่วย แค่หายใจตามปกติของฤดูนี้"
  season_rainy:
    - "หน้าฝนกบมาเกาะกระจกหน้าร้านครับ แสงไฟดึงแมลง แมลงดึงกบ กบดึงเด็กมาส่อง ร้านเป็นศูนย์กลางห่วงโซ่อาหาร"
    - "เข้าพรรษาครับ เบียร์ขายน้อยลง ผมไม่รู้ว่าคนเลิกดื่มหรือไปซื้อร้านป้าแต๋วแทน"
    - "หน้าฝนยากันยุงขายดีครับ ยุงไม่ได้สนใจผีเลย มันกัดทุกคนเท่ากัน ยุติธรรมดี"
    - "ฝนตกทุกคืน ผมเปลี่ยนพรมเช็ดเท้าวันละสองผืน ผมผูกพันกับพรมพวกนี้มากกว่าคนบางคน"
    - "หน้าฝนคืนมืดมาก ร้านผมเป็นไฟดวงเดียวที่เห็นจากทุ่ง ผมเหมือนประภาคารครับ ประภาคารค่าแรงขั้นต่ำ"
  season_cool:
    - "หน้าหนาวครับ ผมใส่เสื้อหนาวทับยูนิฟอร์ม ผิดระเบียบ แต่สำนักงานใหญ่ไม่ได้อยู่ที่นี่ตอนตีสาม"
    - "โจ๊กถ้วยขายดีครับหน้าหนาว ผมเติมน้ำร้อนให้ลูกค้า ได้ยินคำว่าขอบคุณ เป็นความอบอุ่นอย่างเดียวที่ร้านมี"
    - "หมอกลงครับ มองจากหน้าร้านไม่เห็นถนน ผมเห็นแค่ไฟหน้ารถกับแสงผีโพง ซึ่งแยกยากมาก"
    - "งานกาชาดในอำเภอครับ ทุกคนไปเที่ยว ผมอยู่ร้าน กินข้าวเหนียวหมูปิ้งที่ป้าแต๋วฝากมา เท่านี้ก็เป็นงานแล้ว"
    - "ปีใหม่ครับ ผมเคาต์ดาวน์กับเครื่องคิดเงิน มันปิดยอดตอนเที่ยงคืนพอดี เราสองคนผ่านอะไรมาด้วยกันเยอะ"
  season_dry:
    - "หน้าแล้งครับ น้ำดื่มแพ็คขายดีที่สุด น้ำประปาไหลอ่อน คนเลยต้องซื้อน้ำที่มาจากที่อื่น"
    - "ร้อนจนกลางคืนก็ยังร้อนครับ ผีออกมาก็ดูเหนื่อยๆ ผมรู้สึกว่าเราเข้าใจกัน"
    - "สงกรานต์ร้านขายปืนฉีดน้ำหมดครับ ผมเหลือกระบอกเดียวที่ลำกล้องแตก ราคาเต็ม"
    - "หน้าแล้งคนกลับจากกรุงเทพฯ มาเยอะ เขาบอกร้านนี้เหมือนที่โน่นเลย ผมไม่รู้ว่าเป็นคำชมหรือเปล่า"
    - "ไฟร้านดึงแมลงเม่าหน้าแล้งครับ ปีกร่วงเต็มพื้น ผมกวาดแล้วนึกถึงความฝันของตัวเอง"
  heart_low:
    - "รับถุงไหมครับ"
    - "ทั้งหมด {price} บาทครับ สะสมแต้มไหมครับ ไม่มีใช่ไหมครับ โอเคครับ"
    - "ข้าวเวฟอุ่นไหมครับ สองนาทีครับ"
    - "ยินดีต้อนรับครับ"
    - "จ่ายบิลค่าธรรมเนียมสิบบาทครับ ใช่ครับ ทุกบิล ใช่ครับ ผมก็ไม่ชอบ"
  heart_mid:
    - "คุณมาบ่อยนะครับ ผมจำได้ว่าคุณชอบกะเพราไก่มากกว่าหมู ผมไม่มีชีวิตส่วนตัว เลยจำของคนอื่น"
    - "นั่งตรงโต๊ะหน้าร้านได้ครับ ผมจะทำเป็นไม่เห็นว่าไม่ได้ซื้ออะไร"
    - "ผมแอบเก็บซาลาเปาไส้ครีมให้ลูกหนึ่ง ตัวสุดท้ายครับ อย่าบอกผู้จัดการเขต เขาไม่มีตัวตน แต่ก็อย่าบอก"
    - "คืนนี้ถ้าหลบผีมาที่นี่ ผมมีเก้าอี้พลาสติกให้ตัวนึง ปกติผมเก็บไว้ให้ดาบเสถียร"
    - "คุณเป็นลูกค้าคนเดียวที่ถามผมว่าเหนื่อยไหม ผมตอบว่าไม่เหนื่อย ผมโกหกครับ"
  heart_high:
    - "ผมจบนิเทศฯ ครับ อยากทำหนังสั้น ตอนนี้ผมดูกล้องวงจรปิดแปดจอทั้งคืน ก็ถือว่าใกล้เคียง"
    - "กองทุนกู้ยืมเพื่อการศึกษาผมเหลืออีกเก้าปีครับ ผมคำนวณแล้ว ผมจะใช้หนี้หมดตอนเลิกฝันพอดี"
    - "ผมเขียนเรื่องสั้นตอนตีสาม เรื่องผีที่มาซื้อของ ผมเขียนไปสามสิบเรื่องแล้ว ทุกเรื่องจบด้วยผีลืมเอาเงินทอน"
    - "แม่ผมอยู่บ้านหลังคลองครับ ผมเลือกงานกะดึกเพราะกลางวันได้พาแม่ไปหาหมอแอน"
    - "ผมเคยสอบเข้ากรุงเทพฯ ได้นะครับ แต่ไม่ได้ไป ทุกคืนผมดูรถเมล์เที่ยวสุดท้ายผ่าน แล้วก็ไม่ได้ขึ้นเหมือนเดิม"
    - "ถ้าคุณอยากรู้ ร้านนี้ไม่ได้ปลอดภัยเพราะไฟ แต่เพราะมีคนอยู่ ผีไม่ชอบที่ที่มีคนตื่นอยู่ ผมก็เลยตื่น"
  topic_news:
    - "ดาบเสถียรมานั่งในร้านตั้งแต่สี่ทุ่มถึงตีสี่ เขาบอกว่าเฝ้าระวังเหตุครับ เหตุคือเขาไม่อยากกลับโรงพัก"
    - "คนของบริษัทคุณธนามากดเงินตู้ ATM ตอนตีหนึ่ง กดเต็มวงเงินทุกคืน ผมไม่ได้สอดรู้ ผมแค่มีตา"
    - "ข่าวในกลุ่ม LINE บอกว่ากินข้าวเวฟทำให้เป็นหมัน หมอแอนแก้ข่าวแล้ว แต่ยอดขายผมลดไปสามวัน"
    - "สำนักงานใหญ่จะติดเครื่องคิดเงินอัตโนมัติ ผมอาจจะตกงานเพราะเครื่องที่ไม่กลัวผี ซึ่งก็ยุติธรรม"
    - "เมย์มานั่งพิมพ์ข่าวในร้านทุกคืนวันศุกร์ครับ เขาว่าที่นี่ไวไฟดีกว่าที่ไหนในตำบล ผมรู้สึกภูมิใจแปลกๆ"
    - "ลุงสมหมายมาซื้อหวยตอนตีห้าวันหวยออก ร้านผมไม่ได้ขายหวยครับ เขาแค่มาถามทางไปตลาดเจ๊หงษ์"
  topic_advice:
    - "ถ้ากลับบ้านไม่ทันสามทุ่ม เข้าร้านนี้ไว้ครับ ตื่นมาแรงเหลือสามในสี่ ดีกว่าโดนผีจับแล้วเหลือครึ่ง"
    - "ข้าวเวฟนับเป็นมื้อครับ ขนมไม่นับ ซาลาเปากับแซนด์วิชนับ ผมรู้เพราะผมกินแต่ของพวกนี้"
    - "ของที่นี่แพงกว่าร้านป้าแต๋วสามสิบถึงห้าสิบเปอร์เซ็นต์ครับ ซื้อที่นี่เฉพาะตอนร้านป้าปิด หรือตอนกลัวผี"
    - "จ่ายบิลที่นี่เสียสิบบาท ไปตั้งหักบัญชีอัตโนมัติที่ธนาคารฟรีครับ ผมไม่ควรบอกเลย ผมเสียยอดขาย"
    - "ตู้ ATM ในร้านปลอดภัยกว่าตู้กลางแจ้งของธนาคารเพื่อเกษตรกรครับ ตู้นั้นกลางคืนมีคนเจอผีมากดเงินบ่อย"
    - "ไฟหน้ารถไล่ผีได้ครับ ยกเว้นผีโพง ตัวนั้นเรืองแสงเอง ไม่สนไฟใคร ผมเห็นมันยืนส่องกระจกร้านอยู่ครั้งนึง"
  topic_smalltalk:
    - "คุณรู้ไหมครับ ประตูอัตโนมัติร้านนี้เปิดเองตอนตีสามสิบห้านาทีทุกคืน ช่างบอกว่าเซนเซอร์เสีย ผมเลือกเชื่อช่าง"
    - "ผมตั้งชื่อตู้แช่ทุกตู้ครับ ตู้ซ้ายสุดชื่อสมชาย มันเย็นที่สุดและไม่เคยบ่น เป็นเพื่อนร่วมงานที่ดีที่สุดของผม"
    - "บะหมี่ถ้วยรสต้มยำกุ้งกับรสหมูสับขายดีพอกัน ผมทำสถิติไว้สามปี ข้อมูลนี้ไม่มีใครต้องการเลยครับ"
    - "แมวส้มหน้าร้านป้าแต๋วมาหาผมตอนดึกครับ ตอนกลางวันมันเป็นแมวป้า ตอนกลางคืนมันเป็นแมวผม เหมือนผมกับสำนักงานใหญ่"
    - "ผมเคยลองนับว่าพูดยินดีต้อนรับไปกี่ครั้งในชีวิต ได้ประมาณสามแสน ไม่มีครั้งไหนผมรู้สึกยินดีจริงๆ ยกเว้นตอนคุณมา อันนี้ไม่ได้พูดเล่น"
  topic_about_self:
    - "ผมอายุยี่สิบเจ็ดครับ ทำกะดึกมาสามปี หน้าผมซีดเพราะไฟนีออน ไม่ได้ป่วย ป้าแต๋วไม่เชื่อ"
    - "ผมจบปริญญาตรีครับ ใบปริญญาแขวนอยู่ในห้องพักพนักงาน ข้างตารางเวรทำความสะอาดห้องน้ำ"
    - "ผมไม่กลัวผีครับ ผมกลัวลูกค้าที่จะคืนของโดยไม่มีใบเสร็จมากกว่า"
    - "งานอดิเรกผมคือนอน แต่ผมทำไม่ค่อยได้ เลยเปลี่ยนเป็นอยากนอนแทน"
    - "ผมเกิดที่นี่ เรียนในเมือง แล้วกลับมาเหมือนคุณ ต่างกันที่คุณมีที่ดิน ผมมีเครื่องอุ่นข้าว"
  topic_about_others:
    - "ดาบเสถียรเป็นลูกค้าประจำกะดึกครับ ซื้อกาแฟกระป๋องหนึ่งกระป๋อง นั่งหกชั่วโมง ผมเรียกว่าการบริหารทรัพยากรอย่างคุ้มค่า"
    - "พี่หน่อยร้านก๋วยเตี๋ยวบอกว่าข้าวเวฟไม่ใช่อาหาร ทุกครั้งที่เจอกันเธอเอาก๋วยเตี๋ยวมาให้ผมถุงนึง ผมเลยไม่เถียง"
    - "เภสัชกรมดร้านยาข้างๆ ครับ เราสองคนเป็นคนเดียวในตำบลที่ตื่นอยู่หลังเที่ยงคืนโดยไม่ได้หนีผี เราเข้าใจกันโดยไม่ต้องพูด ซึ่งดี เพราะเราไม่ชอบพูด"
    - "ป้าแต๋วฝากผมดูว่าใครมาซื้ออะไรตอนดึก ผมไม่บอกครับ นโยบายความเป็นส่วนตัว นโยบายของผมเอง"
    - "ลุงเชิดขับรถเมล์เที่ยวหกโมงเย็นแวะซื้อกาแฟทุกวันครับ เขาบอกว่าเที่ยวสุดท้ายต้องตาสว่าง ผมไม่เคยขึ้นเที่ยวนั้นเลย"
    - "เสี่ยเฮงมาซื้อเครื่องคิดเลขสำรองที่ร้านผมครับ เครื่องเดิมปุ่มเครื่องหมายบวกพัง เขาบอกว่าใช้บ่อยเกิน"
  gossip_theft:
    - "ในกลุ่ม LINE ว่าคุณขโมยของ ร้านผมมีกล้องแปดตัวครับ แค่บอกไว้เฉยๆ ไม่ได้หมายความอะไร"
    - "ผมไม่ตัดสินครับ ร้านผมโดนขโมยเดือนละสามครั้ง ส่วนใหญ่เป็นคนที่หิวจริงๆ แต่คุณมีที่นา"
    - "สำนักงานใหญ่หักเงินผมทุกครั้งที่ของหาย ถ้าคุณจะขโมย ช่วยไปขโมยกะเช้านะครับ"
  gossip_cheating:
    - "ผมเห็นคุณมาซื้อนมเย็นสองแก้วกับสองคน คนละคืน ผมไม่ได้พูดอะไรครับ แต่กล้องจำได้"
    - "เรื่องหัวใจผมไม่ถนัดครับ ผมคบกับกะดึกมาสามปี มันไม่เคยนอกใจผม"
    - "ระวังนะครับ ข่าวในกลุ่มวิ่งเร็วกว่าไวไฟร้านผมอีก"
  gossip_unpaid_bill:
    - "บิลค่าไฟคุณค้างครับ ผมรู้เพราะมันขึ้นเตือนตอนผมสแกนบิลคนอื่น จ่ายเลยไหมครับ ค่าธรรมเนียมสิบบาทเหมือนเดิม"
    - "ไฟบ้านดับเหรอครับ มานั่งชาร์จโทรศัพท์ในร้านได้ ปลั๊กหลังตู้แช่ ผมไม่เห็น"
    - "ค้างเกินเดือนโดนตัดครับ ค่าต่อกลับร้อยนึง แพงกว่าข้าวเวฟสามกล่อง ผมคิดเป็นข้าวเวฟหมดทุกอย่าง"
  gossip_small_envelope:
    - "ซองร้อยบาทเหรอครับ ผมใส่ร้อยเหมือนกัน แต่ผมได้ค่าแรงวันละสามร้อยห้าสิบ เขาเลยไม่ว่าผม"
    - "ซองงานบวชลูกป้าพรที่คุณซื้อจากร้านผม ซองละสามบาท ผมจำได้ เพราะคุณซื้อซองเดียว"
    - "ในกลุ่ม LINE เขาเทียบซองกันครับ ผมไม่เข้าใจทำไมความสัมพันธ์ต้องมีใบเสร็จ แต่ผมทำงานร้านที่ทุกอย่างมีใบเสร็จ"
  gossip_skip_longkhaek:
    - "ได้ยินว่าคุณไม่ไปลงแขกคืน ผมไม่มีนาครับ ผมเลยไม่เคยโดนเรียก ผมนึกว่าตัวเองเป็นคนเดียวที่ไม่ไป"
    - "ลุงสมหมายมาบ่นในร้านตอนตีหนึ่งเรื่องคุณครับ เขาซื้อเบียร์สองกระป๋องเพื่อบ่นต่อ"
  player_fainted:
    - "ได้ข่าวว่าเมื่อคืนคุณโดนผีจับ คุณน่าจะวิ่งมาร้านผม ไฟเปิดอยู่ ผมก็เปิดอยู่"
    - "ตื่นที่ รพ.สต. ค่ารักษาสิบเปอร์เซ็นต์ของเงินสด เป็นนโยบายที่ใจดีกว่าค่าธรรมเนียมจ่ายบิลร้านผมนิดเดียว"
    - "คราวหน้าถ้าวิ่งหนีผีไม่ทัน ตะโกนชื่อผมก็ได้ครับ ผมไม่ได้ไปช่วยหรอก แต่จะได้รู้ว่าต้องเตรียมเกลือแร่"
  player_new_vehicle:
    - "รถใหม่ครับ ไฟหน้าสว่างดี ไล่ผีได้ ยกเว้นผีโพง ผมแนะนำให้ขับเร็วๆ ตอนเจอผีโพง"
    - "จอดหน้าร้านได้ครับ ลานจอดหน้าร้านผมคือที่เดียวในตำบลที่มีไฟถนนสามดวง"
    - "ยินดีด้วยครับ ผมยังขี่จักรยานมาทำงาน ผ่อนแค่ค่ายางในทุกเดือน"
  player_lottery_win:
    - "ถูกหวยเหรอครับ ยินดีด้วย ผมขายลอตเตอรี่ไม่ได้ ผมขายได้แค่ความหวังในรูปขนมขบเคี้ยว"
    - "ถ้ามีญาติแปลกหน้ามาถามทางไปบ้านคุณ ผมจะชี้ไปทางวัดครับ"
    - "เงินรางวัลฝากธนาคารเถอะครับ ตู้ ATM ในร้านผมกดได้ทีละสองหมื่น ผมไม่อยากเห็นคุณยืนกดยี่สิบรอบ"
  player_muddy:
    - "รบกวนเช็ดเท้าที่พรมก่อนครับ พรมนี้ชื่อสมศรี เธอทำงานหนักมาทั้งวันแล้ว"
    - "โคลนเต็มตัวเลยครับ ทิชชูเปียกห่อละยี่สิบห้า ผมแนะนำสองห่อ"
    - "คุณดูเหมือนคนที่ทำงานจริงมาทั้งวัน ผมดูเหมือนคนที่ยืนอยู่ทั้งคืน เราต่างก็เหนื่อยแบบที่ไม่มีใครเห็น"
  player_rich:
    - "คุณซื้อของไม่ดูราคาแล้วนะครับ ผมสังเกตว่าคุณหยิบน้ำแร่ขวดแพงแทนน้ำเปล่า ยินดีด้วยกับการเลื่อนชั้น"
    - "รวยแล้วยังมาร้านผม แปลว่าคุณกลัวผีจริงๆ หรือไม่ก็ติดข้าวเวฟ ผมไม่ตัดสินทั้งสองอย่าง"
    - "รวยแล้วบัตรสวัสดิการใช้ไม่ได้นะครับ ผมเห็นเครื่องปฏิเสธบัตรมาหลายใบ เครื่องไม่เคยลังเล"
  player_in_debt:
    - "มีหนี้เหรอครับ ยินดีต้อนรับสู่ชมรม ผมเป็นสมาชิกตลอดชีพ ผ่อนถึงอายุสามสิบหก"
    - "บะหมี่ถ้วยสิบห้าบาทครับ ถ้าช่วงนี้ตึงๆ ผมแนะนำรสหมูสับ อิ่มนานกว่าห้านาที"
    - "อย่ากดเงินตู้ต่างธนาคารเกินห้าครั้งนะครับ ครั้งที่หกเสียสิบห้าบาท คนมีหนี้ไม่ควรจ่ายค่าเข้าถึงเงินตัวเอง"
  player_sick:
    - "หน้าคุณซีดกว่าผมครับ ซึ่งยากมาก ไปร้านเภสัชมดข้างๆ ก่อนเถอะ"
    - "ยาแก้ไข้ในร้านผมมีแค่สองยี่ห้อ ทั้งสองยี่ห้อคือยี่ห้อเดียวกันในกล่องคนละสี"
    - "ป่วยแล้วไป รพ.สต. ครับ บัตรทองฟรี ฟรีเป็นคำที่ผมไม่ได้ยินในร้านนี้นานแล้ว"
  player_married:
    - "ยินดีด้วยครับ ซองผมสองร้อย ผมใส่มากกว่าค่าแรงครึ่งวัน แปลว่าผมจริงใจ"
    - "แต่งงานแล้วกลับบ้านก่อนสามทุ่มนะครับ มีคนรอ ผมรอแค่ตอนหกโมงเช้า"
    - "ถ้ามาซื้อของดึกๆ คนเดียวตอนนี้ ผมจะเริ่มเป็นห่วงครับ"
  event_disaster:
    - "น้ำท่วมครับ ร้านยกพื้นสูง ไฟไม่ดับ คนเลยมานอนในร้านยี่สิบคน ผมเปลี่ยนจากพนักงานเป็นผู้จัดการศูนย์อพยพ ค่าแรงเท่าเดิม"
    - "สำนักงานใหญ่โทรมาถามว่าน้ำท่วมแล้วยอดขายเป็นยังไง ไม่ได้ถามว่าผมเป็นยังไง ผมตอบว่ายอดขายสบายดีครับ"
    - "บะหมี่ถ้วยหมดทั้งร้านแล้วครับ อบต. มาซื้อไปใส่ถุงยังชีพ แล้วแจกคนที่เคยมาซื้อที่ร้านผม วงจรมันครบ"
  event_election:
    - "ช่วงเลือกตั้งมีคนมาถ่ายเอกสารสำเนาบัตรประชาชนเยอะครับ ทุกโครงการต้องใช้สามชุด เครื่องถ่ายเอกสารร้านผมคือผู้ชนะตัวจริง"
    - "คืนก่อนเลือกตั้งหมาหอนทั้งคืนครับ มีคนเดินผ่านหน้าร้านถือซองเยอะมาก ผมไม่ได้เห็นอะไร กล้องเห็น"
    - "รถแห่หาเสียงจอดหน้าร้านแล้วเปิดเพลงดังจนผมนอนกลางวันไม่ได้ ผมจะเลือกคนที่ไม่มีรถแห่"
  event_company_water:
    - "บริษัทสั่งน้ำดื่มร้านผมทีละห้าสิบแพ็ค ส่งไปไซต์เจาะบ่อบาดาล คนดูดน้ำใต้ดินก็ยังต้องซื้อน้ำดื่ม ผมคิดเรื่องนี้ทั้งคืน"
    - "บ่อบ้านแม่ผมแห้งแล้วครับ ตอนนี้แม่อาบน้ำด้วยน้ำขวดจากร้านผม ผมได้ส่วนลดพนักงานสิบเปอร์เซ็นต์ ก็ยังถือว่าโชคดี"
    - "คุณธนามาซื้อกาแฟครับ เขาบอกว่าบริษัทจะสร้างงานให้คนในพื้นที่ ผมถามว่ากะดึกไหม เขายิ้มแล้วไม่ตอบ"
  event_festival_near:
    - "{festival} ใกล้แล้วครับ คืนเทศกาลไม่มีผี ร้านผมจะเงียบที่สุดของปี ผมรอคืนนั้นมากกว่าใคร"
    - "{festival} ร้านผมขายน้ำแข็งกับถ่านไฟฉายดีที่สุดครับ บอกเผื่อคุณจะเตรียม"
    - "ผมไม่ได้ไป {festival} ครับ ผมเข้ากะ ช่วยถ่ายรูปมาให้ผมดูสักรูปได้ไหม"
  gift_love:
    - "{item}… ให้ผมเหรอครับ ผมไม่รู้จะทำหน้ายังไง ปกติผมมีหน้าเดียว"
    - "ข้าวเหนียวหมูปิ้งร้อนๆ ตอนตีสอง คุณเพิ่งทำให้คืนนี้ผมรอดครับ ผมพูดจริง"
    - "ผมจะเก็บไว้กินตอนตีสี่ ตอนที่ใจผมอ่อนแอที่สุด ขอบคุณครับ"
  gift_like:
    - "ขอบคุณครับ {item} ดีกว่าของในร้านผมทุกอย่าง"
    - "ของจริงที่ไม่ได้มาจากเครื่องอุ่นเหรอครับ ผมจำรสชาติแบบนี้แทบไม่ได้แล้ว"
    - "ขอบคุณครับ ผมจะกินระหว่างนับเงินปิดกะ เวลานั้นผมต้องการกำลังใจ"
  gift_neutral:
    - "ขอบคุณครับ ผมรับไว้"
    - "{item} เหรอครับ ผมเก็บไว้ในล็อกเกอร์ก่อนนะครับ"
    - "ครับ ขอบคุณ ผมยิ้มแล้วนะครับ ข้างใน"
  gift_dislike:
    - "เครื่องดื่มชูกำลังม้าเหล็ก… ผมขายวันละสามสิบขวด กลิ่นมันติดฝันผมครับ"
    - "{item} เหรอครับ ผมขอบคุณในความตั้งใจครับ"
  gift_hate:
    - "ข้าวเวฟ… คุณเอาข้าวเวฟให้คนขายข้าวเวฟ นี่คือตลกร้ายที่ผมเข้าใจดีที่สุดครับ แต่ไม่ขำ"
    - "ผมจะทำเป็นว่าไม่ได้รับครับ เพื่อความสัมพันธ์ของเรา"
  birthday:
    - "คุณจำวันเกิดผมได้ ผมคิดว่ามีแต่ระบบเงินเดือนที่จำได้ เพราะมันหักประกันสังคมเท่าเดิม"
    - "ผมอายุเพิ่มขึ้นหนึ่งปี กองทุนกู้ยืมผมลดลงหนึ่งปี ปีนี้เสมอกันครับ"
    - "ขอบคุณครับ วันนี้ผมจะให้ตัวเองหยุดพูดยินดีต้อนรับหนึ่งครั้ง เป็นของขวัญ"
  rare:
