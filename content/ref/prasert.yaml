id: prasert
name: "กำนันประเสริฐ"
role: "กำนันประจำตำบล เจ้าของที่ดินผืนใหญ่ เลี้ยงไก่สวยงาม พ่อของแพรว ถูกบริษัทเสนอซื้อที่"
voice: "แทนตัวเองว่ากำนัน พูดเร็ว ตรง เสียงดัง ใจนักเลงแต่ใจดี ลงท้าย โว้ย เว้ย นะ บ้าง ชอบโยงทุกเรื่องเข้าไก่สวยงามของตัวเอง ห่วงลูกสาว ลังเลเรื่องขายที่"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "เช้าแล้ว ตื่นเช้าเหมือนไก่กำนันนะ เจ้าประดู่ขันตั้งแต่ตีสี่"
    - "{player} กินกาแฟยัง มานั่งหน้าร้านป้าแต๋วด้วยกัน กำนันเลี้ยงแก้วนึง"
    - "อรุณสวัสดิ์ เช้านี้กำนันต้องไปประชุมที่อำเภอ ขึ้นรถลุงเชิดเที่ยวหกโมง วิ่งแทบไม่ทัน"
  greet_noon:
    - "เที่ยงแล้ว ก๋วยเตี๋ยวพี่หน่อยเถอะ เส้นเล็กต้มยำ กำนันสั่งแบบนี้มายี่สิบปี"
    - "แดดเที่ยงขนาดนี้ ไก่กำนันยังหลบเข้าใต้สุ่มเลย"
    - "ว่าไง {player} ผ่านมามีธุระอะไร มีอะไรให้กำนันช่วยก็บอกตรงๆ"
  greet_evening:
    - "เย็นแล้ว กำนันจะไปอาบน้ำไก่ ไก่สวยงามต้องอาบทุกเย็น สวยกว่าคนบางคนอีก"
    - "ห้าโมงเย็นฟังราคาข้าวหรือยัง ปีนี้ราคาไม่ค่อยดี กำนันปวดหัวแทนทุกบ้าน"
    - "จะค่ำแล้ว ทำงานเสร็จก็กลับบ้าน อย่าเถลไถลนะ"
  greet_night:
    - "สามทุ่มผีออกโว้ย! อย่ามาเดินเล่นแถวนี้ กลับบ้านไปเลย"
    - "กำนันปิดประตูรั้วแล้ว มีธุระพรุ่งนี้มาใหม่ ...ถ้าผีไล่มา เคาะได้"
  weather_rain:
    - "ฝนตกดี นาได้น้ำ กำนันรอมาสามเดือน"
    - "ฝนมาถนนลูกรังก็เละอีก นายกฯ บอกอยู่ในแผน แผนก็คงเปียกเหมือนกัน"
  weather_hot:
    - "ร้อนจนไก่หอบ กำนันต้องเอาน้ำแข็งใส่ถาดให้มันยืนแช่ขา"
    - "ร้อนอย่างนี้ทำงานเช้ากับเย็นพอ กลางวันนอนเปลแบบดาบเสถียรบ้างก็ได้ ...วันเดียวพอ"
  weather_storm:
    - "พายุมา! บ้านใครเสียหายบอกกำนัน กำนันจะส่งคนไปช่วย"
    - "ลมแรงขนาดนี้ สังกะสีบ้านใครไม่รู้ปลิวมาตกบ้านกำนันสองแผ่นแล้ว มารับคืนด้วย"
  weather_pm25:
    - "ฝุ่นอีกแล้ว กำนันขอทุกหมู่แล้วว่าอย่าเผา ยังมีคนเผา กำนันรู้ว่าใคร กำลังจะไปคุย"
    - "ใส่หน้ากากนะ กำนันใส่แล้วหายใจไม่ค่อยออก แต่ดีกว่าไอทั้งคืน"
  season_rainy:
    - "หน้าฝน ทำขวัญข้าวปีนี้กำนันเป็นเจ้าภาพ ใครจะร่วมเครื่องเซ่นมาบอก"
    - "ช่วงดำนาใครขาดแรงลงแขก บอกกำนัน กำนันหาคนให้ได้"
    - "แข่งเรือยาวออกพรรษาปีนี้ตำบลเราต้องชนะ กำนันลงขันซื้อไม้พายใหม่แล้ว"
  season_cool:
    - "หน้าหนาวงานวัดประจำปี ประกวดไก่สวยงาม ไก่กำนันแชมป์สามปีซ้อน ปีนี้ขอสี่"
    - "เกี่ยวข้าวเสร็จอย่าเผาฟาง เอาไปให้ตาเผือกเลี้ยงควาย ได้บุญด้วย"
  season_dry:
    - "หน้าแล้งน้ำในคลองลด กำนันไปขอรถน้ำจากอำเภอ ได้คันเดียวก็ยังดี"
    - "สงกรานต์ลูกหลานกลับบ้านกันเยอะ กำนันจัดรดน้ำดำหัวที่ศาลา มาด้วยนะ"
  heart_low:
    - "ลูกหลานบ้านไหน อ้อ บ้านนั้น พ่อแกยืมจอบกำนันไปยังไม่คืนเลย ...ล้อเล่น"
    - "มาใหม่ก็ตั้งใจทำงานนะ กำนันดูอยู่"
    - "มีธุระกับกำนันก็ว่ามา กำนันไม่ชอบพูดอ้อม"
  heart_mid:
    - "{player} ทำงานดี กำนันได้ยินชาวบ้านชมหลายคนแล้ว"
    - "มานี่ ดูไก่ตัวใหม่กำนัน ชื่อเจ้าประดู่ ขนสวยไหม"
    - "ว่างๆ มากินข้าวบ้านกำนัน แพรวทำแกงส้มอร่อย ...อย่าไปบอกว่ากำนันชมนะ"
  heart_high:
    - "กำนันพูดเร็วเพราะกลัวว่าถ้าพูดช้าจะไม่กล้าพูด เรื่องนี้กำนันไม่เคยบอกใคร"
    - "บริษัทมาเสนอซื้อที่กำนันสองร้อยไร่ ราคาดีมาก กำนันนอนไม่หลับมาสามคืนแล้ว"
    - "แม่แพรวเสียตอนแพรวสิบขวบ กำนันเลี้ยงลูกมาพร้อมกับไก่ ไก่ยังเชื่อฟังกว่า"
  topic_news:
    - "ประชุมที่อำเภอเขาว่าจะเปลี่ยน ส.ป.ก. เป็นโฉนดได้ ทุกคนตื่นเต้นกันใหญ่ กำนันว่าน่าห่วงมากกว่า"
    - "บริษัทคุณธนากว้านซื้อที่ตำบลข้างๆ ไปห้าร้อยไร่แล้ว กำนันว่าเขาจะมาทางนี้ต่อ"
    - "ประกวดไก่สวยงามงานวัดปีนี้เพิ่มรางวัลเป็นห้าพัน กำนันไม่ได้ลงขันนะ ...ลงนิดหน่อย"
  topic_advice:
    - "ใครมาขอซื้อที่ อย่าเพิ่งเซ็นอะไร เอาเอกสารมาให้กำนันดูก่อน กำนันเห็นมาเยอะ"
    - "ที่ ส.ป.ก. ซื้อขายกันไม่ได้ ใครมาเสนอซื้อแบบจ่ายเงินสดเงียบๆ อย่ารับ"
    - "อยากเลี้ยงไก่ ทำเล้าให้สูง กันหมากันงู ให้กินข้าวเปลือกผสมปลวก ขนจะเงา"
  topic_smalltalk:
    - "ไก่สวยงามไม่เหมือนไก่ชนนะ ไม่ได้เอาไปตีกัน เอาไปประกวดความหล่อ"
    - "สมัยหนุ่มกำนันพายเรือยาวฝีพายที่สามจากหัว ตำแหน่งที่ต้องตะโกนดังที่สุด"
    - "กำนันกับสมศักดิ์บวชพร้อมกัน สมศักดิ์ขานนาคซ้ำสามรอบ พระอุปัชฌาย์ยังอมยิ้ม"
  topic_about_self:
    - "กำนันเป็นกำนันมาสิบสองปี ก่อนนั้นเป็นผู้ใหญ่บ้านหมู่หนึ่ง ทำงานให้ตำบลมาทั้งชีวิต"
    - "กำนันได้ที่ดินมรดกจากพ่อ มีทั้งโฉนดทั้ง ส.ป.ก. ตอนนี้ใครๆ ก็อยากได้ที่ของกำนัน"
    - "กำนันเลี้ยงไก่สวยงามสิบสองตัว ทุกตัวมีชื่อ แพรวตั้งให้ครึ่งนึง"
  topic_about_others:
    - "สมศักดิ์น่ะเพื่อนรัก ย้ำจนกำนันจำประกาศแทนได้ทุกเรื่อง"
    - "แพรวลูกกำนันอยากเปิดร้านกาแฟ กำนันยังไม่รู้จะห้ามหรือจะช่วย ...คงช่วยแหละ"
    - "นายกฯ วิชัยกับกำนันคุยกันได้ แต่คุยเสร็จกำนันต้องกลับมานั่งนึกว่าเขาตอบอะไร"
  gossip_theft:
    - "ได้ยินเรื่องของหายแล้ว ถ้าจริง คืนเขาไปซะ แล้วกำนันจะไม่พูดถึงอีก"
    - "ตำบลนี้ไม่ชอบขโมย กำนันไม่ชอบที่สุด"
  gossip_cheating:
    - "เรื่องหัวใจกำนันไม่ยุ่ง แต่อย่าให้ลามมาวุ่นวายถึงแพรวก็แล้วกัน"
    - "ในกลุ่มเขาพูดกันใหญ่โต เคลียร์ให้จบๆ อย่าให้ลากยาว"
  gossip_unpaid_bill:
    - "ค่าไฟค้างเหรอ จ่ายซะก่อนสิบห้า อย่าให้ช่างไฟต้องมาปีนเสาหน้าบ้าน"
    - "ถ้าขัดสนจริงๆ บอกกำนัน กำนันให้ยืมได้ ไม่คิดดอก ...แต่ต้องคืนนะ"
  gossip_small_envelope:
    - "ซองน้อยไม่เป็นไร แต่งานศพบ้านไหนไปให้ถึง ไปให้เห็นหน้า ชาวบ้านจำหน้ามากกว่าจำเงิน"
    - "งานบวชคราวก่อนใส่ร้อยเดียวเหรอ ...กำนันไม่ว่าหรอก ป้าทองใบว่า"
  gossip_skip_longkhaek:
    - "เขาช่วยแล้วไม่ช่วยคืน ในตำบลนี้มันเรื่องใหญ่นะ ไปขอโทษเขา แล้วรอบหน้าไปให้ได้"
    - "กำนันเห็นชื่อในกลุ่มแล้ว รอบหน้ากำนันไปด้วย จะได้เห็นกับตาว่าไปจริง"
  player_fainted:
    - "เมื่อคืนผีจับเหรอ หมอแอนโทรมาบอก คราวหน้าไปเช่าตะกรุดที่วัดติดตัวไว้"
    - "หน้ายังซีดอยู่เลย กลับไปนอนก่อน นาไม่หนีไปไหน"
  player_new_vehicle:
    - "รถใหม่เหรอ สวยดี แต่ถนนตำบลเราจะช่วยให้มันเก่าเร็วหน่อยนะ"
    - "เอาไปให้บอลเช็กสภาพบ้าง บอลมือดี ถึงจะลังเลจะไประยองก็เถอะ"
  player_lottery_win:
    - "ถูกหวยเหรอ เก่งนี่ อย่าบอกลุงสมหมายนะ แกจะมาขอดูมือทั้งคืน"
    - "เงินก้อนเอาไปซื้อที่หรือเก็บไว้ อย่าไปเช่าพระวัดเจริญทรัพย์ฯ เก็งกำไรนะ ราคามันขึ้นลงยิ่งกว่าข้าว"
  player_muddy:
    - "เลอะขนาดนี้ทำนาเก่งแน่ กำนันชอบ"
    - "อย่าเข้าใกล้ไก่กำนันตอนตัวเลอะนะ มันเพิ่งอาบน้ำ"
  player_rich:
    - "ช่วงนี้ทำเงินได้ดีนะ อย่าลืมช่วยงานบุญของตำบลบ้าง"
    - "มีเงินแล้วอย่าเพิ่งหลงรถป้ายกรุงเทพฯ ซื้อรถไถดีกว่า ใช้ได้จริง"
  player_in_debt:
    - "หนี้เยอะเหรอ อย่าไปเชื่อปุ๋ยเสี่ยเฮงเพิ่มนะ ดอกมันโตไวกว่าไก่"
    - "ไปคุยกับสมศักดิ์เรื่องกองทุนหมู่บ้าน บอกว่ากำนันส่งมา"
  player_sick:
    - "ป่วยแล้วอย่าฝืน ไป รพ.สต. เลย หมอแอนดูแลดี"
    - "เอายาดมไปดม กำนันพกติดตัวตลอด แพรวบังคับ"
  player_married:
    - "ยินดีด้วย! งานแต่งขอกำนันเป็นเฒ่าแก่สักฝ่ายได้ไหม กำนันเป็นมาสิบกว่างานแล้ว"
    - "แต่งงานแล้วช่วยกันทำมาหากิน ทะเลาะกันอย่าให้ข้ามคืน"
  event_disaster:
    - "ทุกคนมาช่วยกันขนกระสอบทราย! กำนันขนด้วย อย่ายืนดูเฉยๆ นะ"
    - "บ้านใครเสียหายไปลงชื่อที่ศาลา กำนันจะไปตามเรื่องที่อำเภอเอง"
    - "รถกระบะกำนันเปิดให้ใช้ขนของได้ทั้งวัน กุญแจอยู่ที่แพรว"
  event_election:
    - "รอบนี้กำนันไม่ได้ลงสมัคร แต่ใครมาขอเสียง กำนันฟังหมด ...ฟังแล้วจดไว้"
    - "คืนหมาหอนอย่าออกจากบ้าน ไม่ใช่เพราะผีอย่างเดียวหรอก"
  event_company_water:
    - "บ่อบ้านกำนันน้ำลดไปครึ่งศอก ไม่เคยเห็นแบบนี้มาก่อน ต้องไปคุยกับบริษัทแล้ว"
    - "คุณธนาชวนกำนันกินข้าวที่อำเภอ ร้านแพงด้วย กำนันกินนะ แต่ยังไม่ได้ตกลงอะไร"
    - "ถ้ากำนันขายที่ บ่อชาวบ้านจะแห้งกว่านี้อีก กำนันรู้ ...กำนันรู้ดี"
  event_festival_near:
    - "{festival} ใกล้แล้ว กำนันเป็นประธานจัดงาน ใครอยากช่วยมาลงชื่อ"
    - "งาน {festival} ปีนี้ต้องดีกว่าปีก่อน กำนันลงขันเพิ่มแล้ว"
  gift_love:
    - "{item}! อันนี้กำนันชอบมาก ขอบใจนะ ...อย่าบอกแพรวว่ากำนันยิ้มกว้างขนาดนี้"
    - "ของดีจริง ใครบอกว่ากำนันชอบ ...ไม่ต้องบอก กำนันดีใจก็พอ"
  gift_like:
    - "ขอบใจ {item} ใช้ได้เลย"
    - "ดีนี่ ขอบใจนะ กำนันจำไว้"
  gift_neutral:
    - "อ้อ ขอบใจ กำนันจะหาที่ใช้"
    - "รับไว้ น้ำใจกำนันรับเต็มที่"
  gift_dislike:
    - "{item} เหรอ กำนันไม่ค่อยชอบ แต่ไม่เป็นไร"
    - "อันนี้เอาไปให้ไก่กำนันคงดีกว่า"
  gift_hate:
    - "อย่าเอาอันนี้มาให้กำนันอีกนะ ไม่ชอบเลยจริงๆ"
    - "เอาคืนไปเถอะ ถือว่ากำนันไม่เห็น"
  birthday:
    - "วันเกิดกำนันวันนี้ แพรวทำแกงเขียวหวานไก่ให้ ...ไก่ซื้อนะ ไม่ใช่ไก่ในเล้า"
    - "จำวันเกิดกำนันได้ด้วยเหรอ ใจดีจริง"
  rare:
    - "กำนันแอบร้องไห้ตอนไก่ตัวแรกตาย ฝังไว้ใต้ต้นมะขามหลังบ้าน ยังไปจุดธูปให้ทุกปี"
    - "สมัยหนุ่มกำนันเกือบไปทำงานเมืองนอก ซื้อตั๋วแล้ว แต่พ่อป่วยพอดี เลยอยู่จนได้เป็นกำนัน"
    - "กำนันยังเก็บจดหมายที่แม่แพรวเขียนตอนจีบกันไว้ในกล่องเหล็ก ลายมือสวยกว่ากำนันเยอะ"
gifts:
  love: ["ปลาช่อนเผา", "ข้าวหอมมะลิใหม่", "กาแฟโบราณ"]
  like: ["ไข่ไก่", "มะม่วงน้ำดอกไม้", "หมูปิ้ง"]
  dislike: ["ผักชีลาว", "ปุ๋ยหมัก"]
  hate: ["ขยะ", "ปลาเน่า"]
