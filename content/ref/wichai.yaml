id: wichai
name: "นายกฯ วิชัย"
role: "นายกองค์การบริหารส่วนตำบล (อบต.) วาระที่สอง คุมงบ อบต. รักป้ายโครงการและการตัดริบบิ้น"
voice: "สุภาพ ลงท้ายครับ เรียกผู้เล่นว่าคุณ พูดวนไม่ตอบคำถาม ใช้ศัพท์ราชการ รับทราบ บูรณาการ ขับเคลื่อน อยู่ระหว่างการพิจารณา ในส่วนของ เป็นรูปธรรม ประโยคยาวที่จบตรงจุดเริ่ม ตลกร้ายเรื่องงบ ป้าย และภาพลักษณ์ ลึกๆ เหนื่อยกับระบบ"
dark_humor: true
romanceable: false
lines:
  greet_morning:
    - "อรุณสวัสดิ์ครับพี่น้อง ในส่วนของเช้าวันนี้ ผมขอยืนยันว่าเป็นเช้าที่ดีอย่างเป็นรูปธรรม"
    - "เช้านี้ผมลงตรวจเยี่ยมพื้นที่ครับ คือยืนตรงนี้ แล้วให้น้องถ่ายรูปสามมุม"
    - "{player} มาแต่เช้า ดีครับ ประชาชนตื่นเช้า ตำบลก็ตื่นเช้า ตำบลตื่นเช้า... ก็เช้าครับ"
    - "กินข้าวหรือยังครับ ผมยังเลย ประชุมแผนพัฒนาสามปีนัดเจ็ดโมง ยังไม่ได้เริ่มเพราะรอผมอยู่"
    - "เช้านี้ผมเห็นถนนหมู่สามแล้วนะครับ เห็นอย่างใกล้ชิด จากกระจกรถเลย"
  greet_noon:
    - "เที่ยงแล้วครับ ข้าวกล่องโครงการอบรมเหลือ ผมให้ได้ แต่ต้องเซ็นชื่อว่ามาอบรมนะครับ"
    - "บ่ายนี้ผมมีพิธีเปิดป้ายโครงการครับ ตัวโครงการยังไม่เสร็จ แต่ป้ายเสร็จก่อน เป็นไปตามลำดับขั้นตอน"
    - "แดดแรงครับวันนี้ ผมสั่งการไปแล้วให้มีร่มเงาในตำบล ...ในแผนปีหน้าครับ"
    - "สวัสดีครับ {player} เดินผ่านมาคิดอะไรอยู่ ผมก็คิดอยู่เหมือนกัน เราคิดเหมือนกันครับ"
    - "ผมกำลังจะไปกินก๋วยเตี๋ยวพี่หน่อยในฐานะประชาชนคนหนึ่ง ไม่ใช่การหาเสียงครับ ...ใส่ไข่ด้วย"
  greet_evening:
    - "เย็นแล้วครับพี่น้อง ผมเพิ่งเลิกประชุม มติที่ประชุมคือให้นัดประชุมใหม่ครับ"
    - "ห้าโมงเย็นฟังประกาศ อบต. หรือยังครับ เราประกาศว่าจะมีประกาศต่อไปครับ"
    - "เย็นนี้ผมมีงานศพสองงาน งานบวชหนึ่งงาน ขึ้นบ้านใหม่อีกหนึ่ง ประชาชนต้องการผมครับ ซองผมก็ต้องการเงินเดือน"
    - "ตะวันตกแล้วครับ เหมือนงบประมาณปลายปีงบเลย หมดไปอย่างสวยงาม"
    - "ผมมาวิ่งรอบสนามกีฬา อบต. ครับ สนามจากงบปี 64 ...ส่วนที่สร้างเสร็จแล้วน่ะครับ"
  greet_night:
    - "ดึกแล้วครับ ผีออกสามทุ่ม อบต. มีนโยบายเรื่องนี้ชัดเจน คือให้ทุกคนกลับบ้านครับ"
    - "เรื่องไฟถนนทางเข้าหมู่สอง ผมรับทราบแล้วว่ามันมืด ตอนนี้ก็ยังมืดอยู่ครับ ข้อมูลตรงกัน"
    - "ผมกลับรถหลวงก่อนนะครับ ไฟหน้ารถไล่ผีได้ ยกเว้นผีโพง ผีโพงไม่อยู่ในอำนาจหน้าที่ของ อบต. ครับ"
    - "สองทุ่มครึ่งแล้ว ผมแนะนำให้เข้าวัดหรือร้าน 24 ชม. นี่ไม่ใช่นโยบายนะครับ เป็นคำแนะนำจากใจ"
    - "ยังไม่กลับบ้านอีก ผมชื่นชมความขยันครับ ชื่นชมจากในรถนะ ผมไม่ลงแล้ว"
  weather_rain:
    - "ฝนตกครับ เป็นโอกาสดีในการทบทวนระบบระบายน้ำ ซึ่งเราจะทบทวนเมื่อฝนหยุดครับ"
    - "น้ำขังหน้า อบต. ผมเห็นแล้วครับ เราจะตั้งคณะทำงานศึกษาว่ามันขังเพราะอะไร"
    - "ฝนตกขนาดนี้ป้ายโครงการไม่เปียกครับ เคลือบอย่างดี งบป้ายเราไม่เคยประหยัด"
    - "ฝนดีครับ ชาวนาได้น้ำ ผมก็ได้ข่าวดีไปพูดในที่ประชุม วินวินทุกฝ่ายครับ"
  weather_hot:
    - "ร้อนครับวันนี้ ห้องประชุม อบต. แอร์เย็นมาก เสียดายประชาชนเข้าได้เฉพาะวันประชาคม"
    - "อากาศร้อนเป็นปัญหาระดับโลกครับ เราจึงไม่สามารถแก้ไขในระดับตำบลได้โดยลำพัง"
    - "ร้อนแบบนี้ระวังเป็นลมแดดนะครับ หมอแอนอยู่ รพ.สต. ทั้งวัน ส่วนผมอยู่ในรถทั้งวัน"
    - "ผมแจกหมวกฟรีนะครับ หมวกมีชื่อผมตัวโตหน่อย เพื่อเพิ่มพื้นที่กันแดดครับ"
  weather_storm:
    - "พายุเข้าครับ อบต. ได้สั่งการเตรียมความพร้อมแล้ว คือสั่งให้ทุกคนพร้อมครับ"
    - "ต้นไม้ล้มขวางถนนหมู่สี่ ผมรับทราบด้วยความห่วงใย และจะห่วงใยต่อไปจนกว่าจะมีคนเลื่อยครับ"
    - "ไฟดับแบบนี้ ระบบออนไลน์ของ อบต. ก็ล่มครับ ...ปกติก็ล่มนะครับ แต่วันนี้มีเหตุผล"
    - "ลมแรงจนป้ายผมปลิวไปสามป้าย ผมไม่เสียดายครับ ทำใหม่ได้ งบมีครับ งบป้ายนะ"
  weather_pm25:
    - "ฝุ่นมาครับ เรารณรงค์ไม่เผามาโดยตลอด ผ่านป้ายรณรงค์ซึ่งพิมพ์ใหม่ทุกปีครับ"
    - "ค่าฝุ่นสีส้มครับ ผมจะแจกหน้ากาก มีโลโก้ อบต. ด้านนอก ...ชื่อผมอยู่ด้านใน ใกล้หัวใจ"
    - "ฝุ่นนี้ข้ามเขตมาครับ มาจากตำบลข้างๆ ซึ่งไม่อยู่ในความรับผิดชอบของเราครับ"
    - "เครื่องฟอกอากาศในห้องนายกฯ ทำงานดีมากครับ ผมยืนยันได้ด้วยตัวเอง"
  season_rainy:
    - "หน้าฝนครับ อบต. มีแผนขุดลอกคลอง แผนนี้อยู่รอดมาสี่หน้าฝนแล้ว แผนเราแข็งแรงครับ"
    - "เข้าพรรษาผมไปแห่เทียนทุกปีครับ ยืนหน้าขบวน ...เผื่อช่างภาพหาผมไม่เจอ"
    - "หน้าฝนยุงเยอะ อบต. พ่นหมอกควันแล้วครับ หนึ่งวัน แต่ถ่ายรูปไว้ครบทุกหมู่"
    - "หน้าฝนน้ำมาเยอะ ผมสนับสนุนการสร้างฝายครับ ถ้าสภาโหวตผ่าน ผมจะดีใจเป็นคนแรก"
  season_cool:
    - "หน้าหนาวครับ ฤดูกาลแห่งงานวัด งานกาชาด และป้ายอวยพรปีใหม่ของผมครับ"
    - "อบต. จะแจกผ้าห่มกันหนาวครับ ตอนนี้อยู่ระหว่างจัดซื้อจัดจ้าง น่าจะทันหน้าร้อนครับ"
    - "คาราโอเกะปีใหม่ อบต. ผมร้องเปิดงานครับ เพลงเดียว สามรอบ ตามคำเรียกร้องของทีมงานผม"
    - "ลมหนาวมาแล้ว อากาศดีเหมาะกับการลงพื้นที่ครับ อาทิตย์นี้ผมลงจากรถไปแล้วสองครั้ง"
  season_dry:
    - "หน้าแล้งครับ อบต. เตรียมรถน้ำไว้แล้ว หนึ่งคัน แต่เปิดไฟกะพริบทุกครั้งที่วิ่ง"
    - "แล้งปีนี้รุนแรงครับ ผมจะยกให้เป็นวาระตำบล ซึ่งจะทำให้มันเป็นวาระครับ"
    - "สงกรานต์ผมไปรดน้ำดำหัวผู้สูงอายุทุกหมู่ครับ มีช่างภาพไปด้วย เพื่อเก็บความทรงจำ"
    - "หน้าแล้งไฟป่าเยอะครับ เรามีถังดับเพลิงครบทุกหมู่ ...หมดอายุไปบ้างบางถังครับ"
  heart_low:
    - "สวัสดีครับ ท่านเป็นลูกหลานบ้านไหนครับ บ้านนั้นใช่ไหม ใช่ครับ ผมจำได้ครับ"
    - "มีเรื่องร้องเรียนหรือครับ ยื่นที่ธุรการได้เลย เรื่องจะถูกรับ แล้วจะถูกรับไว้ครับ"
    - "ยินดีที่ได้รู้จักครับ นี่นามบัตรผม ด้านหลังเป็นปฏิทิน ใช้ได้ทั้งปี ผมใช้ได้หลายปี"
    - "ขอตัวก่อนนะครับ ผมรีบ ...ไม่ได้รีบไปไหน แต่ต้องดูรีบครับ"
  heart_mid:
    - "{player} มาพอดีครับ ผมอยากฟังเสียงคนรุ่นใหม่ ฟังแล้วจะนำไปบูรณาการครับ"
    - "ผมชอบคุยกับ {player} นะครับ คุณถามตรง ผมตอบวน เราเติมเต็มกันครับ"
    - "เรื่องที่คุณเสนอคราวก่อน ผมเอาเข้าที่ประชุมแล้วครับ ที่ประชุมรับทราบ ...ครั้งนี้ผมพูดจริงนะ"
    - "บอกความลับนะครับ คำว่าบูรณาการ ผมไม่แน่ใจว่าแปลว่าอะไร แต่มันได้ผลทุกครั้ง"
  heart_high:
    - "ผมพูดวนเพราะถ้าพูดตรง งบปีหน้าก็ไม่มา คุณเข้าใจไหมครับ ...ผมเองก็ไม่ค่อยเข้าใจ"
    - "ตอนหนุ่มผมอยากเป็นครูครับ แล้วพ่อบอกว่าครูไม่มีป้ายชื่อตัวใหญ่ ผมเลยมาทางนี้"
    - "ถนนหมู่สามผมอยากทำจริงนะครับ แต่งบมาทีไรโดนตัดก่อนถึงตำบล เหมือนคลองที่แห้งกลางทาง"
    - "ผมกลัวการเลือกตั้งครับ ไม่ได้กลัวแพ้ กลัวว่าชนะแล้วต้องเป็นผมแบบนี้ต่ออีกสี่ปี"
    - "ถ้าวันนึงผมพูดตรงๆ ในสภา คุณช่วยปรบมือเป็นคนแรกนะครับ ห้องจะได้ไม่เงียบ"
  topic_news:
    - "ข่าวล่าสุดครับ อบต. มีมติให้ศึกษาความเป็นไปได้ ในการศึกษาความเป็นไปได้ครับ"
    - "เรามีอบรมอาชีพทำน้ำพริกครับ ฟังหนึ่งวัน ได้เกียรติบัตรติดผนัง ผนังสวยขึ้นแน่นอน"
    - "ระบบลงทะเบียนออนไลน์เปิดพรุ่งนี้ครับ แนะนำให้มาต่อคิวที่ อบต. ตั้งแต่เช้า ...เผื่อไว้ครับ"
    - "งบสภาหนึ่งล้านห้าครับ ระบบน้ำ ถนน หรือตลาดนัด ผมสนับสนุนทุกทางอย่างเท่าเทียมครับ"
    - "บริษัทของคุณธนามาขอพบผมครับ เราคุยกันในบรรยากาศที่เป็นมิตร ส่วนเนื้อหา... ก็เป็นมิตรครับ"
  topic_advice:
    - "อยากได้ส่วนลดค่าขุดบ่อ สมัครโคกหนองนาตัวอย่างครับ อบต. จ่ายครึ่ง แค่ต้อนรับผู้ดูงานสามรอบ"
    - "ไร่ละพันต้องขึ้นทะเบียนก่อนนะครับ ช่วยค่าเกี่ยวได้จริงไร่ละพัน สูงสุดยี่สิบไร่ อันนี้ผมพูดตรงครับ"
    - "ประกันราคาข้าวต้องขึ้นทะเบียนก่อนปลูก เงินเข้าช้าหนึ่งฤดู แต่เข้าครับ ช้าแต่ชัวร์ เหมือนผม"
    - "จะยื่นอะไรที่ อบต. ถ่ายสำเนาบัตรไปสามชุด แล้วเอาปากกาไปเองนะครับ ของเราหมึกหมด"
    - "อยากให้สภาโหวตตามที่คุณต้องการ ไปคุยกับชาวบ้านทีละคนครับ คะแนนเสียงมาจากหน้าบ้าน ไม่ใช่หน้าป้าย"
    - "แจกพันธุ์ปลาพันธุ์ไม้ปีละครั้งครับ มาก่อนได้ก่อน ผมกระซิบให้ว่าต้องมาก่อนเจ็ดโมงครับ"
  topic_smalltalk:
    - "คุณชอบป้ายโครงการพื้นเขียวหรือพื้นน้ำเงินครับ ผมกำลังตัดสินใจครั้งสำคัญ"
    - "ผมเลี้ยงปลาคาร์ฟในบ่อหน้าบ้านครับ ตั้งชื่อตามโครงการที่ยังไม่เสร็จ ตอนนี้มีสิบสองตัว"
    - "ผมฝึกยิ้มถ่ายรูปทุกเช้าครับ หันสี่สิบห้าองศา เห็นฟันหกซี่ กำลังพอดี"
    - "ผมว่าไมค์คาราโอเกะคือเครื่องมือประชาธิปไตยครับ ทุกคนได้ถือ ...ตามคิวที่ผมจัด"
    - "เมื่อวานผมกดไลก์ทุกโพสต์ในกลุ่ม LINE ครับ รวมโพสต์ที่ด่าผมด้วย เพื่อแสดงความเปิดกว้าง"
  topic_about_self:
    - "ผมเป็นนายกฯ วาระที่สองครับ กฎหมายให้ติดกันไม่เกินสองวาระ ...ผมอ่านข้อนี้บ่อยมาก"
    - "ผมเกิดที่ตำบลนี้ครับ ไปเรียนรัฐศาสตร์ในเมือง กลับมาพร้อมคำศัพท์ใหม่สามร้อยคำ"
    - "ภรรยาผมบอกว่าผมพูดวนแม้แต่ตอนขอโทษ ผมรับทราบข้อสังเกตนั้นแล้วครับ"
    - "ผมชอบตัดริบบิ้นครับ มันเป็นช่วงเดียวที่งานดูเสร็จจริงในสายตาทุกคน"
    - "ห้องทำงานผมมีโล่สิบเจ็ดอันครับ ได้มาจากการมอบโล่ให้คนอื่น แล้วเขามอบคืน"
  topic_about_others:
    - "ผู้ใหญ่สมศักดิ์เป็นคนดีครับ ทำหนังสือมาหาผมบ่อยมาก ผมเก็บไว้ทุกฉบับในแฟ้มสีน้ำเงิน"
    - "กำนันประเสริฐกับผมคุยกันเข้าใจครับ คือเข้าใจว่าเราไม่ค่อยเข้าใจกัน"
    - "คุณเมย์นักข่าวน่ะ ผมนับถือครับ เขาถามคำถามดีมาก ดีจนผมยังไม่ได้ตอบสักข้อ"
    - "คุณธนามีวิสัยทัศน์ครับ ภาษาเขาสวยกว่าผมอีก ผมกำลังเรียนรู้อยู่"
    - "ปาล์มเป็นคนทำงานจริงที่สุดใน อบต. ครับ ผมพูดในที่ประชุมบ่อยๆ ว่า ปาล์มจัดการเลยครับ"
    - "ดาบเสถียรกับผมยึดหลักเดียวกันครับ ไม่รีบร้อนตัดสินใจ ในทุกเรื่อง"
  gossip_theft:
    - "เรื่องข่าวลือการลักทรัพย์ ผมไม่ได้กล่าวหาใคร และก็ไม่ได้ไม่กล่าวหาใครครับ"
    - "อบต. ยืนยันว่าตำบลเราปลอดภัยครับ ยกเว้นกรณีที่มีคนขโมยของ ซึ่งคุณน่าจะทราบดี"
    - "ผมแนะนำให้คืนของครับ ในฐานะผู้นำท้องถิ่น และในฐานะคนที่ไม่อยากเห็นชื่อตำบลในข่าวของคุณเมย์"
  gossip_cheating:
    - "เรื่องส่วนตัวผมไม่ก้าวล่วงครับ แต่ในเชิงสถิติ ผมเห็นสามกระทู้ในกลุ่ม LINE"
    - "ความรักเป็นเรื่องซับซ้อนครับ ซับซ้อนกว่างบประมาณ แต่อย่างน้อยงบเรามีคนตรวจสอบ"
    - "ผมแนะนำแบบที่ผมใช้กับทุกปัญหาครับ ชี้แจงให้ชัด ...แต่อย่าชี้แจงแบบผมนะครับ"
  gossip_unpaid_bill:
    - "ค่าไฟค้างจ่ายเป็นปัญหาเชิงโครงสร้างครับ ...แต่ของคุณน่าจะเป็นเชิงบุคคล"
    - "ผมเข้าใจครับ บางทีเงินมาไม่ทันใบแจ้งหนี้ ปีก่อนค่าไฟ อบต. เองก็ค้างสองเดือน"
    - "จ่ายก่อนวันที่สิบห้านะครับ หลังจากนั้นการไฟฟ้าไม่รับทราบแบบผมแล้วครับ เขาตัดเลย"
  gossip_small_envelope:
    - "เรื่องซองเป็นวัฒนธรรมอันดีงามครับ และวัฒนธรรมอันดีงามก็มีคนจดไว้ครับ"
    - "ผมใส่ซองทุกงานครับ ห้าร้อย พร้อมนามบัตร เจ้าภาพจะได้ไม่ลืมทั้งสองอย่าง"
    - "ขนาดซองไม่สำคัญครับ ...ผมพูดตามที่ทีมงานเขียนให้ แต่ผมว่าป้าทองใบไม่เห็นด้วย"
  gossip_skip_longkhaek:
    - "การลงแขกคือความร่วมมือภาคประชาชนครับ ซึ่งคุณยังไม่ได้ร่วม ในรอบนี้นะครับ"
    - "ผมเองไปลงแขกทุกปีครับ ถือกล้าข้าวหนึ่งกำยืนให้ถ่ายรูป แล้วกลับไปประชุม"
    - "อย่าให้เรื่องนี้ไปถึงหอกระจายข่าวนะครับ ผู้ใหญ่สมศักดิ์จะพูดชื่อคุณสามรอบ"
  player_fainted:
    - "ผมทราบว่าคุณไปตื่นที่ รพ.สต. เมื่อคืน รพ.สต. เป็นผลงานที่เรามีส่วนร่วมครับ ในพิธีเปิด"
    - "เรื่องไฟถนนที่มืดจนคุณโดนผีจับ ผมรับทราบครับ และเสียใจอย่างเป็นทางการ"
    - "หายดีแล้วใช่ไหมครับ ผมอยากไปเยี่ยม ...ถ้าคุณยังนอนอยู่ ช่างภาพผมว่างพรุ่งนี้"
  player_new_vehicle:
    - "รถใหม่สวยครับ ถนนเราอาจยังไม่พร้อมรับรถสวยขนาดนี้ เป็นข้อจำกัดชั่วคราวครับ ตั้งแต่ปี 2550"
    - "ยินดีด้วยครับ ผ่านหลุมหน้าหมู่สามช้าๆ นะครับ หลุมนั้นอยู่ในแผนครับ"
    - "รถคุณใหม่กว่ารถหลวงผมอีก ...อันนี้ไม่ต้องบอกคุณเมย์นะครับ"
  player_lottery_win:
    - "ถูกรางวัลหรือครับ ยินดีด้วย อบต. มีกองทุนพัฒนาตำบลรับบริจาคนะครับ ...ไม่ใช่ซองผมนะ"
    - "เงินก้อนแบบนี้ลงทุนในตำบลครับ สหกรณ์ หรือร้านค้า อย่าเอาไปลงป้ายแบบผม"
    - "ผมไม่เคยถูกหวยครับ แต่ผมถูกเลือกตั้งสองครั้ง โอกาสน้อยกว่าอีกนะ"
  player_muddy:
    - "ตัวเปื้อนโคลนนี่คือภาพลักษณ์เกษตรกรตัวจริงครับ ขอถ่ายรูปคู่ได้ไหม ...ผมยืนห่างหน่อยนะ"
    - "นี่แหละครับรากหญ้าที่แท้จริง ผมจะยกไปพูดในสุนทรพจน์ครั้งหน้า ไม่เอ่ยชื่อครับ"
    - "เสื้อผมเพิ่งรีดครับ เราจับมือกันในใจก่อนได้ไหมครับ"
  player_rich:
    - "ธุรกิจคุณโตเร็วนะครับ อบต. มีภาษีป้ายด้วยนะครับ ...ผมพูดจากประสบการณ์"
    - "คนมีศักยภาพอย่างคุณน่าจะช่วยงานตำบลนะครับ เช่นสนับสนุนป้ายอวยพรปีใหม่"
    - "รวยแล้วอย่าลืมบ้านเกิดครับ และบัตรสวัสดิการไม่ใช่ของสะสมนะครับ"
  player_in_debt:
    - "หนี้สินเป็นเรื่องเชิงระบบครับ ตำบลเราเป็นหนี้กันทั้งตำบล คุณไม่ได้โดดเดี่ยวครับ"
    - "อบต. ผลักดันพักหนี้หลังภัยพิบัติครับ ต้องรอให้มีภัยพิบัติก่อน ซึ่งผมไม่ได้หวังนะครับ"
    - "ลองกองทุนหมู่บ้านครับ ผู้ใหญ่สมศักดิ์อนุมัติ ผมแค่ไปถ่ายรูปตอนมอบเงิน"
  player_sick:
    - "ไม่สบายหรือครับ ไป รพ.สต. เลย บัตรทองฟรีครับ เรื่องนี้ผมสนับสนุนเต็มที่ ในฐานะผู้ใช้บริการ"
    - "พักผ่อนเยอะๆ ครับ ผมก็อยากพัก แต่ตำบลไม่ยอมให้ผมพักครับ"
    - "หายเร็วๆ นะครับ ผมจะส่งกระเช้าไป มีป้ายชื่อผมแปะหน้ากระเช้า จะได้รู้ว่ามาจากใคร"
  player_married:
    - "ยินดีด้วยครับ! ผมขอเป็นแขกผู้ใหญ่กล่าวอวยพรนะครับ เตรียมไว้แล้ว ไม่เกินยี่สิบนาที"
    - "ชีวิตคู่คือการบูรณาการที่แท้จริงครับ คราวนี้ผมเข้าใจคำนี้แล้วจริงๆ"
    - "ซองผมห้าร้อยนะครับ แนบนามบัตร ไม่ต้องใส่คืนตอนผมจัดงานครับ ...ใส่ก็ได้"
  event_disaster:
    - "อบต. ประกาศเขตภัยพิบัติแล้วครับ เพื่อให้ภัยพิบัติเป็นทางการ และงบช่วยเหลือเป็นไปได้"
    - "ถุงยังชีพมาถึงแล้วครับ แจกที่ศาลาประชาคม มีชื่อผมบนถุง เพราะร้านพิมพ์ให้ฟรีครับ"
    - "ผมลงพื้นที่ทั้งวันครับ ...ไม่ได้ช่วยยกของเพราะไหล่ผมมีภารกิจถือโทรโข่ง"
    - "เรื่องนี้ผมไม่วนครับ บ้านไหนเสียหาย ไปลงชื่อกับผู้ใหญ่สมศักดิ์ อบต. จะจ่ายตามระเบียบ"
  event_election:
    - "ช่วงนี้มีโครงการใหม่เยอะครับ เป็นความบังเอิญเชิงนโยบาย"
    - "ผมไม่ได้หาเสียงครับ ผมแค่มาขอบคุณประชาชนทุกบ้าน ทุกวัน เฉพาะช่วงนี้"
    - "เพลงรถแห่คันนั้นไม่ใช่ของผมครับ ของผมคันที่ดังกว่า"
    - "คืนก่อนเลือกตั้งหมาหอนเยอะครับ ผมไม่ทราบสาเหตุ ผมเป็นนายกฯ ไม่ใช่สัตวแพทย์"
  event_company_water:
    - "บริษัทให้ความร่วมมือกับเราในการรับฟังครับ เขาฟังเก่งมาก ฟังเสร็จก็สูบต่อครับ"
    - "อบต. อยู่ระหว่างตรวจสอบใบอนุญาตครับ ใบอนุญาตนั้นออกโดย... เดี๋ยวผมขอเช็กลายเซ็นก่อน"
    - "บ่อชาวบ้านแห้งผมทราบครับ บ่อปลาหน้าบ้านผมก็เริ่มต่ำ ปลาคาร์ฟผมเริ่มกังวลครับ"
  event_festival_near:
    - "งาน {festival} ใกล้แล้วครับ อบต. สนับสนุนเต็มที่ ทั้งงบ ทั้งป้าย โดยเฉพาะป้าย"
    - "ปีนี้งาน {festival} ผมจะกล่าวเปิดสั้นๆ ครับ สั้นในความหมายของผมนะครับ"
    - "มางาน {festival} นะครับ มีจับฉลาก รางวัลใหญ่คือพัดลมตั้งพื้น ผมจับเองกับมือ"
  gift_love:
    - "โอ้ {item}! ผมขอรับไว้ทั้งอย่างเป็นทางการและไม่เป็นทางการเลยครับ ซึ้งใจมาก"
    - "นี่คือของที่ผมชอบที่สุด ผมพูดตรงเป็นครั้งแรกของอาทิตย์นี้เลยนะครับ"
    - "ขอบคุณครับ อันนี้ผมจะไม่ถ่ายลงเพจ เพราะเป็นความสุขส่วนตัวจริงๆ"
  gift_like:
    - "ขอบคุณครับ {item} ผมรับไว้ในนามส่วนตัว ไม่ใช่ในนาม อบต. นะครับ"
    - "น้ำใจดีครับ ผมจะนำไปบูรณาการกับมื้อเย็น"
    - "ของดีครับ ผมขอรับทราบ และขอรับไว้ด้วยครับ"
  gift_neutral:
    - "ขอบคุณครับ ผมจะหาวิธีใช้ {item} ให้เหมาะสมครับ"
    - "ครับ ได้รับแล้ว ความรู้สึกผมอยู่ระหว่างการพิจารณาครับ"
  gift_dislike:
    - "{item}... ผมรับทราบครับ และจะไม่ดำเนินการใดๆ ต่อกับมัน"
    - "ผมขอส่งเรื่องนี้ให้คณะกรรมการพิจารณาของขวัญครับ ...คือภรรยาผม"
  gift_hate:
    - "อันนี้ผมรับไม่ได้ครับ ทั้งในทางระเบียบและทางจมูก"
    - "ผมขอปฏิเสธอย่างสุภาพครับ ...และไม่วนเลยนะครับ ไม่เอา"
  birthday:
    - "วันนี้วันเกิดผมครับ มีคนส่งกระเช้ามาสิบใบ แต่คุณเป็นคนแรกที่มาด้วยตัวเอง"
    - "ผมขอพรให้ตัวเองครับ ขอให้ปีนี้พูดสั้นลงสักนิด ...ซึ่งผมจะพยายามอย่างยั่งยืน"
    - "อายุเพิ่มอีกปี ป้ายอวยพรวันเกิดผมก็เพิ่มอีกป้าย ผมไม่ได้สั่งนะครับ แต่ก็ไม่ได้ห้าม"
  rare:
    - "ผมแอบไปนั่งฟังสภาเด็กของครูเต้ยครับ เด็กๆ ตอบคำถามตรงกว่าผู้ใหญ่ทั้ง อบต."
    - "ผมเคยเขียนสุนทรพจน์ที่ตอบทุกคำถามตรงๆ ไว้หนึ่งฉบับครับ ล็อกไว้ในลิ้นชัก ยังไม่กล้าเปิด"
    - "ความจริงผมกลัวผีมากครับ ผมเช่าผ้ายันต์ที่วัดดงเย็นทุกวัน ทั้งที่ไม่เคยอยู่นอกบ้านหลังสองทุ่มเลย"
    - "ผมไม่ได้พูดวนเพราะโกหกหรอกครับ บางทีผมแค่ไม่รู้คำตอบ แล้วไม่เคยมีใครให้ผมพูดว่าไม่รู้"
    - "ป้ายหาเสียงแผ่นแรกในชีวิตผม แม่ทำจากกระดาษลังเขียนด้วยถ่าน ผมยังเก็บไว้ใต้เตียงครับ"
gifts:
  love: ["ข้าวเหนียวมะม่วง", "ดอกดาวเรือง", "กาแฟโบราณ"]
  like: ["ขนมเปี๊ยะ", "ส้มโอ", "น้ำผึ้งป่า", "มะม่วงน้ำดอกไม้"]
  dislike: ["ปลาร้า", "ปุ๋ยหมัก", "ผักบุ้ง"]
  hate: ["ขยะ", "ปลาเน่า"]
choices:
  - id: wichai_c1
    min_heart: 0
    prompt: "ในฐานะประชาชน คุณมีข้อเสนอแนะต่อการพัฒนาตำบลไหมครับ"
    options:
      - text: "ซ่อมถนนหมู่สามเถอะ"
        heart: 1
        reply: "รับทราบครับ ...ครั้งนี้ผมพูดด้วยหัวใจนะครับ ผมจดแล้ว"
      - text: "ขอไฟถนนทางเข้าหมู่สอง มืดจนผีเต็ม"
        heart: 1
        reply: "ข้อเสนอที่มีทั้งมิติความปลอดภัยและมิติจิตวิญญาณ ผมชอบครับ"
      - text: "ขอป้ายเพิ่มอีกสักป้ายสิ"
        heart: -1
        reply: "คุณกำลังประชดผมใช่ไหมครับ ...ผมรับทราบการประชดครับ"
      - text: "ตอบตรงๆ สักครั้งได้ไหม"
        heart: 2
        reply: "...ได้ครับ ถนนยังไม่ได้ทำเพราะงบไม่พอ นั่นแหละครับ ขอบคุณที่ถาม"
  - id: wichai_c2
    min_heart: 3
    prompt: "งบสภาหนึ่งล้านห้า คุณจะโหวตอะไรครับ ระบบน้ำ ถนน หรือตลาดนัด"
    options:
      - text: "ระบบน้ำ หน้าแล้งจะได้ไม่ลำบาก"
        heart: 1
        reply: "ทางเลือกที่ยั่งยืนครับ ผมจะสนับสนุน ถ้ามันชนะ"
      - text: "ถนน รถจะได้ไม่พัง"
        heart: 1
        reply: "ทางเลือกที่จับต้องได้ครับ ป้ายถนนก็สวยที่สุดด้วย"
      - text: "ตลาดนัด คนจะได้มีงานทำ"
        heart: 1
        reply: "ทางเลือกด้านเศรษฐกิจฐานรากครับ ผมพูดคำนี้แล้วรู้สึกเก่ง"
