id: nok
name: "นก"
role: "สาวโรงงานประกอบชิ้นส่วนอิเล็กทรอนิกส์ที่นิคมอุตสาหกรรมชลบุรี กลับบ้านวันหยุดยาวและเสาร์อาทิตย์ อายุ 25"
voice: "เสียงดัง ร่าเริง ภาษาวัยรุ่นโรงงาน เรียกคนสนิทว่า 'แก' ลงท้าย 'จ้า' 'ป่ะ' 'อ่ะ' ชอบพูด 'จริงดิ' และนับทุกอย่างเป็นชั่วโมงโอที เช่น 'อันนี้เท่ากับโอทีสามชั่วโมงเลยนะแก'"
dark_humor: false
romanceable: true
personality: "ตลก ใจถึง ขยันจนลืมตัวเอง ร่าเริงต่อหน้าคน เหนื่อยเงียบๆ ตอนอยู่คนเดียว"
backstory: "ออกไปทำงานโรงงานตั้งแต่จบ ม.6 ทำโอทีวันละสี่ชั่วโมงส่งเงินกลับมาใช้หนี้ที่แม่ค้างเสี่ยเฮงและส่งน้องชายเรียน ทุกครั้งที่กลับบ้านต้องรีบขึ้นรถเมล์หกโมงเช้าวันจันทร์ ความฝันคือเปิดร้านส้มตำหน้าวัดดงเย็นและไม่ต้องกลับไปตอกบัตรอีก แต่กลัวว่าถ้ากลับมาแล้วไม่มีเงินส่งแม่"
courtship: "ชอบคนที่ทำให้เธอได้พัก ไม่ต้องเป็นคนแข็งแรงตลอด ชวนไปกินของอร่อย ไปส่งที่ป้ายรถเมล์ตอนเช้าวันจันทร์ ให้ของกินที่บ้านๆ ไม่ชอบของแพงที่ทำให้เธอเกรงใจ"
lines:
  greet_morning:
    - "อรุณสวัสดิ์จ้า! ตื่นเจ็ดโมงโดยไม่มีเสียงหวอโรงงานนี่มันสวรรค์ชัดๆ อ่ะแก"
    - "เช้านี้แม่ทำข้าวต้มปลาให้ กลิ่นมันเหมือนตอนเป็นเด็กเลย ที่หอพักมีแต่มาม่า"
    - "แกตื่นมาทำนาตอนตีห้าทุกวันจริงดิ ฉันนึกว่ามีแต่คนโรงงานที่ทรมานตัวเองขนาดนี้"
    - "ไปตลาดเช้ากันป่ะ ฉันอยากกินปาท่องโก๋น้ำเต้าหู้หน้าวัด ที่ชลบุรีไม่มีเจ้าไหนอร่อยเท่า"
    - "อ้าว {player}! เมื่อวานกลับรถเมล์เที่ยวหกโมงเย็น หลับยาวจนลุงเชิดต้องปลุก"
  greet_noon:
    - "เที่ยงแล้วจ้า ที่โรงงานตอนนี้คือพักกินข้าวสี่สิบห้านาที ฉันยังเผลอกินเร็วอยู่เลย"
    - "ร้อนเนอะ แต่ร้อนแบบมีลมทุ่งก็ยังดีกว่าร้อนในไลน์ผลิตนะแก"
    - "ไปกินก๋วยเตี๋ยวพี่หน่อยกันป่ะ ฉันเลี้ยง ได้โบนัสมาเดือนนี้ เท่ากับโอทีหกชั่วโมง"
    - "นอนกลางวันได้นี่มันหรูหราที่สุดในชีวิตแล้ว เดี๋ยวฉันจะไปนอนใต้ถุนบ้านต่อ"
    - "ช่วยแม่ตากพริกอยู่จ้า มือฉันแสบหมดแล้ว ที่โรงงานยังไม่เคยเจ็บขนาดนี้"
  greet_evening:
    - "เย็นแล้ว! ไปตลาดนัดกันป่ะแก ฉันอยากกินหมูปิ้งกับข้าวเหนียวจนอ้วน"
    - "พระอาทิตย์ตกที่ทุ่งนี่สวยกว่ารูปพื้นหลังจอมือถือฉันอีก"
    - "แม่ถามว่าพรุ่งนี้กลับกี่โมง ฉันยังไม่อยากตอบเลยแก"
    - "เย็นนี้ฉันจะตำส้มตำให้ทั้งบ้านกิน ฝึกไว้ก่อนเปิดร้าน แกมาชิมด้วยนะ"
    - "ฟังหอกระจายข่าวห้าโมงไหม เพลงก่อนประกาศเพลงเดียวกับตอนฉันอยู่ ป.4 เลย ไม่เปลี่ยนเลยนะ"
  greet_night:
    - "สองทุ่มแล้วแก กลับบ้านเหอะ ฉันยังไม่อยากใช้วันหยุดไปเยี่ยมใครที่ รพ.สต."
    - "ที่หอพักฉันกลัวแต่หัวหน้าไลน์ ที่บ้านกลัวผีกระสือ ไม่รู้อย่างไหนน่ากลัวกว่า"
    - "หมาเริ่มหอนแล้ว ฉันเข้าบ้านก่อนนะ แม่ล็อกประตูสามทุ่มตรงเป๊ะยิ่งกว่าเครื่องตอกบัตร"
    - "ถ้าวิ่งไม่ทันไปร้าน 24 ชม. นะแก ตั้มเขาไม่ถามอะไรหรอก เขาหน้าตายใส่ผีด้วยซ้ำ"
    - "ดึกแล้ว พรุ่งนี้ฉันต้องตื่นตีห้าขึ้นรถเมล์หกโมง อย่าชวนคุยนาน… แต่คุยต่ออีกหน่อยก็ได้"
  weather_rain:
    - "ฝนตกแล้ว! ฉันชอบนอนฟังเสียงฝนบนหลังคาสังกะสี ที่หอพักได้ยินแต่เสียงแอร์ห้องข้างๆ"
    - "ฝนแบบนี้เก็บเห็ดได้นะแก แต่ฉันเก็บไม่เป็นแล้ว ลืมหมดว่าดอกไหนกินได้"
    - "ฝนตกแล้วรถเมล์ช้า ถ้าวันจันทร์ฝนตกฉันโดนหักค่าแรงแน่ๆ"
    - "ตอนเด็กฉันกับแพรววิ่งเล่นน้ำฝนในทุ่ง แล้วแพรวโดนกำนันตีก้น ฉันโดนแม่ตีด้วยเพราะชวน"
    - "ฝนมาทีไรแม่ต้องเอากะละมังรองหลังคารั่วสามใบ ฉันเก็บเงินเปลี่ยนหลังคาให้แม่อยู่"
  weather_hot:
    - "ร้อนจนอยากกลับไปนั่งในห้องคลีนรูมที่โรงงาน… พูดเล่นนะ ไม่อยากกลับ"
    - "ร้อนขนาดนี้ต้องกินน้ำแข็งใสใส่ลอดช่องเท่านั้น ร้านหน้าโรงเรียนยังเปิดอยู่ป่ะแก"
    - "อย่าตากแดดนานนะแก เพื่อนที่โรงงานเป็นลมแดดตอนเดินไปโรงอาหาร ร้อนทั้งข้างนอกข้างใน"
    - "แม่บอกร้อนแบบนี้พริกตากแห้งไว ฉันเลยโดนจับไปเกลี่ยพริกทั้งบ่าย"
    - "ร้อนจนเครื่องชูกำลัง 'ม้าเหล็ก' ในกระเป๋าอุ่นเหมือนชา กินไปก็ไม่หายง่วง"
  weather_storm:
    - "พายุเข้า! หลังคาบ้านแม่สั่นเหมือนจะปลิว ฉันโทรหาบอลให้มาช่วยตอกตะปูแล้ว"
    - "ไฟดับทั้งตำบลเลยแก ฉันนั่งชาร์จมือถือกับพาวเวอร์แบงก์อันสุดท้ายอยู่"
    - "อย่าออกไปทุ่งนะ ต้นตาลล้มขวางทางหน้าวัดแล้ว"
    - "ถ้าพายุทำให้รถเมล์ไม่วิ่งวันจันทร์ ฉันได้อยู่บ้านอีกวัน… อย่าบอกใครนะว่าฉันแอบหวัง"
    - "หอกระจายข่าวซ่าจนฟังไม่ออก แต่ฉันเดาว่าบอกให้อยู่บ้าน ซึ่งฉันจะทำ"
  weather_pm25:
    - "ฝุ่นที่นี่ก็หนักนะแก นึกว่าหนีฝุ่นจากนิคมมาได้แล้ว"
    - "ใส่หน้ากากด้วย ฉันมีหน้ากากโรงงานติดมาเต็มกระเป๋า เอาไปเลยสองอัน"
    - "ฝุ่นแบบนี้แม่ไอทั้งคืน ฉันเลยซื้อเครื่องฟอกอากาศเล็กๆ ให้ เท่ากับโอทีสิบชั่วโมงเลยนะ"
    - "ใครก็ได้บอกตาเผือกให้เลิกเผาฟางทีเหอะ ควันลอยมาบ้านฉันหมด"
    - "วันฝุ่นหนักฉันนอนอยู่บ้านดูละครกับแม่ทั้งวัน ก็เป็นวันหยุดที่ดีแบบหนึ่ง"
  season_rainy:
    - "หน้าฝนกลับบ้านทีไรทุ่งเขียวทั้งตำบล ฉันถ่ายรูปไปอวดเพื่อนที่หอพัก มันอิจฉากันหมด"
    - "ช่วงเข้าพรรษาแม่ชวนไปวัดทุกวันพระ ฉันไปได้แค่วันพระที่ตรงเสาร์อาทิตย์"
    - "หน้าฝนกบเยอะ แม่ทำต้มยำกบรอฉันกลับบ้าน ที่ชลบุรีไม่มีใครทำแบบแม่"
    - "ออกพรรษาแข่งเรือยาว ฉันลาพักร้อนรอไว้แล้ว ปีนี้จะไปเชียร์ทีมหมู่ 4 ให้เสียงแหบ"
    - "ฝนตกถนนลื่น ขี่มอไซค์ระวังนะแก ฉันเพิ่งไหว้พระขอให้ทุกคนในตำบลไม่ล้ม"
  season_cool:
    - "หน้าหนาวที่นี่หนาวจริง ที่ชลบุรีหนาวแค่ในแอร์โรงงาน"
    - "ลอยกระทงปีนี้ฉันได้กลับ! ไปลอยด้วยกันป่ะแก ฉันจะอธิษฐานขอขึ้นเงินเดือน… กับเรื่องอื่นด้วย"
    - "หนาวแบบนี้ต้องกินข้าวหลามกับข้าวจี่งานกำฟ้าของยายจันทร์ ปีนี้ฉันจะไปช่วยเผาด้วย"
    - "ปีใหม่ฉันจะกลับบ้านห้าวัน ห้าวันเต็ม! ฉันจะร้องคาราโอเกะ อบต. จนไมค์หอน"
    - "เกี่ยวข้าวหน้าหนาวฉันไม่ได้ช่วยแม่เลย เพราะโรงงานไม่ให้ลา ฉันส่งเงินจ้างรถเกี่ยวลุงสมหมายแทน"
  season_dry:
    - "หน้าแล้งน้ำบ่อบ้านแม่ลดลงเยอะเลยแก เมื่อก่อนไม่เคยเป็นขนาดนี้"
    - "สงกรานต์ฉันได้กลับเจ็ดวัน! วันแรกนอน วันที่สองนอน วันที่สามค่อยสาดน้ำ"
    - "สงกรานต์คนกลับบ้านเต็มรถเมล์ ลุงเชิดบอกว่าเป็นช่วงเดียวที่รถเมล์ได้กำไร"
    - "ร้อนแบบนี้อยากขายน้ำอ้อยปั่นหน้าวัด ฉันว่าวันหนึ่งได้ไม่น้อยกว่าค่าแรงโรงงานนะ"
    - "หน้าแล้งงานบวชเยอะ ฉันต้องใส่ซองทุกงาน เงินเดือนหายไปครึ่งหนึ่งเลยแก"
  heart_low:
    - "อ้าว หวัดดีจ้า คนที่กลับมาจากกรุงเทพฯ ใช่ป่ะ แม่ฉันพูดถึงแกบ่อย"
    - "ฉันกลับมาแค่สองวันนะ ขอนอนก่อน มีอะไรค่อยคุยวันหลัง"
    - "แกกลับมาทำนาจริงดิ กล้ามากเลยนะ ฉันยังไม่กล้าเลย"
    - "ขอโทษนะ ฉันจำหน้าคนในตำบลไม่ค่อยได้แล้ว อยู่หอพักนานไป"
    - "จ้าๆ สวัสดี วันนี้ฉันขอพักก่อนนะ เพิ่งลงรถเมล์ ปวดหลังมาก"
  heart_mid:
    - "แกจำได้ป่ะว่าฉันชอบกินอะไร ฉันจำได้นะว่าแกชอบอะไร ฉันจดลงโน้ตในมือถือ"
    - "ทุกครั้งที่กลับบ้าน ฉันแวะดูแปลงแกก่อนเข้าบ้านอีก ดูมันโตแล้วชื่นใจแปลกๆ"
    - "ที่โรงงานฉันเล่าเรื่องแกให้เพื่อนฟัง มันถามว่า 'แฟนเหรอ' ฉันโยนรองเท้าใส่มันไปแล้ว"
    - "แกเป็นคนเดียวที่ถามว่า 'เหนื่อยไหม' แทนที่จะถาม 'เงินเดือนเท่าไหร่'"
    - "คราวหน้าฉันจะเอาขนมจากชลบุรีมาฝาก เอาแบบไหนบอกได้นะแก"
  heart_high:
    - "ฉันส่งเงินให้แม่เดือนละแปดพันมาเจ็ดปีแล้ว หนี้เสี่ยเฮงยังไม่หมดเลยแก ดอกมันโตไวกว่าฉันโตอีก"
    - "มือขวาฉันชาบ่อยๆ หมอบอกเป็นพังผืดทับเส้นประสาท จากงานกดชิ้นส่วนซ้ำๆ ฉันยังไม่กล้าบอกแม่"
    - "บางคืนที่หอพักฉันร้องไห้เพราะคิดถึงเสียงกบ แปลกป่ะ คนอื่นคิดถึงแฟน ฉันคิดถึงกบ"
    - "น้องชายฉันจะจบปริญญาปีหน้า พอเขาจบ ฉันอาจจะได้กลับบ้านถาวร… ถ้ากล้าพอ"
    - "ฉันวาดแปลนร้านส้มตำไว้ในสมุดเล่มเล็ก ตั้งแต่ปีแรกที่ไปโรงงาน ไม่เคยให้ใครดูนอกจากแก"
  topic_news:
    - "เพื่อนที่โรงงานบอกว่าบริษัทจะลดคน ฉันไม่รู้ว่าตัวเองจะรอดไหมแก"
    - "แม่บอกว่ามีคนจากบริษัทคุณธนามาขอซื้อที่แม่ ให้ราคาดีด้วย แม่ยังไม่ตอบ ฉันกลัวแม่ขาย"
    - "ได้ยินว่าบอลจะไปทำงานระยอง จริงป่ะแก เขายังไม่บอกฉันเลย"
    - "หอพักฉันขึ้นค่าเช่าอีกห้าร้อย ค่าแรงขึ้นสิบบาท เศรษฐกิจดีจริงๆ เลยเนอะ"
    - "ป้าพรบอกว่าลุงสมหมายถูกหวยเลขท้ายสองตัว แล้วเอาไปซื้อหวยต่อหมดภายในชั่วโมงเดียว"
  topic_advice:
    - "ถ้าจะจ้างคนมาช่วยงาน จ้างคนในตำบลนะแก จ่ายรายวันตรงเวลา คนจะกลับมาช่วยอีก ฉันรู้ว่าค่าแรงที่ไม่มาตรงเวลามันเจ็บแค่ไหน"
    - "ส้มตำขายดีต้องมีมะละกอสดทุกวัน ปลูกมะละกอไว้สักสองสามต้นนะ ส่งให้แม่ค้าตลาดนัดได้ตลอดปี"
    - "อย่ากินแต่เครื่องดื่มชูกำลังแทนข้าวนะ ฉันทำมาสองปี ได้โรคกระเพาะเป็นของแถม กินข้าวให้ครบมื้อ"
    - "ทำงานหนักต้องพักนะแก หลังมันพังเงียบๆ แล้วจะมาทวงทีเดียว ถามเภสัชกรมดดูก็ได้"
    - "ส่งเงินให้ที่บ้านทุกเดือนดีนะ แต่เก็บส่วนของตัวเองด้วย ฝากธนาคารไว้ อย่าถือเงินสดเดินตอนกลางคืน"
  topic_smalltalk:
    - "แกเคยกินหมูกระทะหน้านิคมป่ะ ร้อยเก้าสิบเก้าบาทกินไม่อั้น ฉันกินจนเจ้าของร้านจำหน้าได้"
    - "ฉันฝึกตำส้มตำทุกวันหยุด แม่บอกเปรี้ยวไป พ่อบอกเผ็ดไป หมาไม่กินเลย"
    - "ที่โรงงานมีหัวหน้าไลน์ชื่อเดียวกับควายตาเผือก ฉันหัวเราะทุกครั้งที่เขาเรียกประชุม"
    - "ถ้าฉันเปิดร้านส้มตำ จะตั้งชื่อว่า 'ส้มตำนกน้อยกลับรัง' เชยป่ะ"
    - "เมื่อวานฉันลองร้องคาราโอเกะที่ร้านป้าแต๋ว ป้าบอกว่าเสียงเหมือนเครื่องตอกบัตร"
  topic_about_self:
    - "ฉันทำงานโรงงานประกอบแผงวงจรมาเจ็ดปี วันละสิบสองชั่วโมง ถ้ารวมโอทีก็ไม่ค่อยเห็นแสงแดด"
    - "บ้านฉันอยู่หมู่ 4 หลังคาสังกะสีสีฟ้าที่ปะไว้สามสี แม่บอกว่าเป็นศิลปะ"
    - "ฉันเรียนเก่งนะแก ได้ทุนเรียนต่อตอน ม.6 แต่ไม่ไป เพราะต้องมีคนหาเงินก่อน"
    - "ทุกวันจันทร์ฉันขึ้นรถเมล์หกโมงเช้า ต่อรถที่อำเภอไปชลบุรี ถึงหอพักบ่ายสอง เข้ากะดึกเลย"
    - "ฉันชอบทำกับข้าวมากกว่าทำงานโรงงานล้านเท่า ฝันว่าสักวันจะมีร้านเล็กๆ หน้าวัด"
  topic_about_others:
    - "บอลเพื่อนสมัยเด็กฉันเอง ซ่อมรถเก่งที่สุดในอำเภอ ถ้าเขาไประยอง ตำบลเราจะไม่มีใครซ่อมรถเกี่ยวลุงสมหมายเลยนะ"
    - "แพรวกับฉันเป็นเพื่อนกันตั้งแต่ ป.1 เธอเป็นลูกกำนัน ฉันเป็นลูกแม่ค้า แต่เราปีนต้นมะม่วงหลังโรงเรียนด้วยกัน แล้วโดนครูทำโทษคู่กัน"
    - "เสี่ยเฮงเป็นคนที่ทำให้ฉันต้องไปโรงงาน ฉันไม่โกรธเขานะ ฉันแค่ไม่ยิ้มให้"
    - "ลุงเชิดขับรถเมล์ส่งฉันมาเจ็ดปี เขาจำได้ว่าฉันชอบนั่งเบาะที่สามหลังคนขับ"
    - "พี่หน่อยร้านก๋วยเตี๋ยวสอนฉันทำน้ำซุป เธอบอกว่าถ้ากลับมาเปิดร้าน เธอจะไม่ถือว่าแย่งลูกค้า"
  gossip_theft:
    - "แกขโมยของจริงดิ ฉันไม่เชื่อหรอก แต่ถ้าจริง บอกฉันว่าเพราะอะไร ฉันเคยหิวจนคิดจะทำมาแล้ว"
    - "ที่โรงงานคนโดนไล่ออกเพราะเรื่องนี้ ที่ตำบลไม่มีใครไล่ แต่จะไม่มีใครลืม"
    - "คืนของเถอะแก ถ้าเงินไม่พอฉันให้ยืม เท่ากับโอทีห้าชั่วโมง ไม่คิดดอก"
  gossip_cheating:
    - "คบซ้อนเหรอแก ฉันไม่ได้อยู่บ้านทุกวัน แต่ฉันก็ไม่ได้โง่นะ"
    - "ฉันขึ้นรถเมล์ไปทำงานทั้งอาทิตย์ แล้วแกเอาวันเหล่านั้นไปให้คนอื่นเหรอ"
    - "ไม่เป็นไร ฉันชินกับการถูกปล่อยไว้ทีหลังอยู่แล้ว"
  gossip_unpaid_bill:
    - "ค้างค่าไฟเหรอแก ฉันเคยค้างค่าหอสองเดือน โดนเจ้าของหอติดป้ายหน้าห้อง อายแทบตาย"
    - "จ่ายค่าไฟก่อนนะ อย่าให้ตัด เดี๋ยวปั๊มน้ำหยุด ผักตายหมด"
    - "ถ้าช็อตจริงๆ ฉันให้ยืมก่อน แต่ต้องจ่ายคืนเป็นส้มตำ"
  gossip_small_envelope:
    - "ซองน้อยเหรอ ฉันเข้าใจนะ ฉันใส่ซองงานบวชลูกป้าแต๋วไปแค่ร้อย ป้ายังทักไม่หาย"
    - "ซองไม่ต้องหนาหรอกแก ไปช่วยยกโต๊ะยกเก้าอี้ คนจำได้นานกว่า"
    - "ป้าทองใบจดยอดซองทุกงานเหมือนเครื่องบันทึกโอทีเลย ระวังด้วย"
  gossip_skip_longkhaek:
    - "ไม่ไปลงแขกคืนลุงสมหมายเหรอแก ฉันอยากไปช่วยแทบตาย แต่โรงงานไม่ให้ลา"
    - "ลงแขกคือสิ่งเดียวที่ทำให้ฉันรู้สึกว่าตำบลนี้ยังเป็นบ้าน อย่าทิ้งมันเลยนะ"
    - "คราวหน้าไปเหอะ ฉันจะส่งเงินซื้อข้าวเหนียวหมูทอดไปเลี้ยงคนช่วยงานด้วย"
  player_fainted:
    - "เป็นลมเพราะผีจริงดิแก! แม่โทรมาบอกฉันถึงชลบุรีเลยนะ ข่าวเร็วกว่าไปรษณีย์"
    - "ค่ารักษาไปเท่าไหร่ เงินหายด้วยป่ะ ไอ้ผีนี่หักเงินแรงกว่าหัวหน้าไลน์อีก"
    - "คราวหน้ากลับบ้านก่อนสามทุ่มนะ ฉันไม่อยากกลับมาแล้วเจอแกนอนอยู่ รพ.สต."
  player_new_vehicle:
    - "รถใหม่! พาฉันไปส่งป้ายรถเมล์วันจันทร์หน่อยได้ป่ะ ไม่ต้องเดินลากกระเป๋าสองโล"
    - "สวยมากแก บอลเห็นยัง เขาจะบอกว่าต้องเปลี่ยนน้ำมันเครื่องใหม่ทันที เขาพูดกับทุกคัน"
    - "ฉันเก็บเงินซื้อมอไซค์มาสามปีแล้วยังไม่ได้ แกได้ก่อนเลย ยินดีด้วยจริงๆ นะ"
  player_lottery_win:
    - "ถูกหวยจริงดิแก! เท่ากับโอทีกี่ร้อยชั่วโมงเนี่ย ฉันคิดไม่ทันแล้ว"
    - "เลี้ยงหมูกระทะหน่อยนะ ฉันกลับบ้านเสาร์นี้"
    - "เอาไปปะหลังคา เปลี่ยนปั๊มน้ำ อย่าเอาไปซื้อหวยต่อแบบลุงสมหมายนะ"
  player_muddy:
    - "โคลนเต็มตัวเลยแก เหมือนตอนเราเด็กๆ จับปลาในนาเลย"
    - "เปื้อนโคลนแบบนี้ดูมีความสุขกว่าฉันใส่ชุดคลีนรูมสะอาดเอี่ยมอีกนะ"
    - "ล้างก่อนกินข้าวนะแก อย่าให้แม่ฉันเห็น แม่จะเอาสายยางฉีดใส่"
  player_rich:
    - "ได้ข่าวว่ารวยแล้วนะแก ดีใจด้วย อย่าลืมคนที่ยังตอกบัตรอยู่นะ"
    - "รวยแล้วจ้างฉันกลับมาทำงานที่ฟาร์มได้ป่ะ ฉันขอแค่ค่าแรงเท่าโรงงาน ไม่เอาโอที"
    - "คนรวยในตำบลส่วนใหญ่ปล่อยเงินกู้ แกอย่าเป็นแบบนั้นนะ"
  player_in_debt:
    - "มีหนี้เหรอแก ฉันเข้าใจดีที่สุดในตำบลแล้ว ทุกวันทำงานให้ดอกเบี้ยของคนอื่น"
    - "อย่ากู้เสี่ยเฮงเพิ่มนะ ไปสหกรณ์ของกล้าเหอะ ฉันเพิ่งรู้ว่าดอกต่ำกว่าตั้งเยอะ"
    - "เขียนรายการหนี้ออกมาให้หมดแล้วจ่ายอันดอกแพงก่อน ฉันเรียนรู้เองจากเจ็ดปีในโรงงาน"
  player_sick:
    - "ป่วยเหรอ พักเลยนะแก ฉันเคยฝืนทำงานตอนไข้ขึ้น แล้วสลบในไลน์ผลิต"
    - "ฉันต้มต้มยำกบแบบแม่มาให้ กินร้อนๆ เหงื่อออกแล้วจะดีขึ้น"
    - "ไป รพ.สต. เหอะ ใช้บัตรทองฟรี อย่ารอจนหนักแล้วต้องไปโรงพยาบาลอำเภอ"
  player_married:
    - "แต่งงานแล้วเหรอแก! ฉันลางานกลับมาไม่ทัน ขอโทษนะ ส่งซองมาให้ทางแม่แล้ว"
    - "ยินดีด้วยจริงๆ มีคนอยู่ข้างๆ ตอนเหนื่อย มันดีกว่าโอทีทุกชั่วโมงเลยแหละ"
    - "งานแต่งแกแม่ฉันไปช่วยทำครัว แม่บอกว่าแกงเขียวหวานอร่อยที่สุดในรอบปี"
  event_disaster:
    - "น้ำท่วมบ้านแม่แล้วแก ฉันขอลาจากโรงงานแต่หัวหน้าไม่ให้ ฝากดูแม่ฉันด้วยนะ"
    - "ฉันโอนเงินมาช่วยแล้ว ส่วนแรงก็ฝากแกกับบอลไปก่อนนะ"
    - "เพื่อนที่โรงงานลงขันส่งของมาช่วยตำบลเราด้วยนะแก รถคันนั้นเลย"
  event_election:
    - "เลือกตั้งฉันต้องลากลับมาเลือก ค่ารถไปกลับเท่ากับค่าแรงสองวัน แต่ฉันจะกลับ"
    - "คืนหมาหอนมีคนมาเคาะประตูบ้านแม่ ฉันไม่ได้รับนะแก ฉันอยากเลือกคนที่ทำให้ไม่ต้องไปโรงงาน"
    - "ป้ายหาเสียงเยอะจนฉันหาป้ายรถเมล์ไม่เจอ"
  event_company_water:
    - "บ่อบ้านแม่แห้งแล้วแก แม่ต้องซื้อน้ำถังละยี่สิบมาใช้ เท่ากับฉันทำโอทีให้บริษัทอื่นอีกต่อหนึ่ง"
    - "บริษัทคุณธนามาประกาศรับคนงานในตำบลด้วยนะ ค่าแรงเท่าโรงงาน แต่ทำบนที่ดินที่เคยเป็นนาของเพื่อนบ้านเรา"
    - "ถ้าแม่ขายที่ให้บริษัท ฉันก็ไม่มีบ้านให้กลับมาแล้ว"
  event_festival_near:
    - "{festival} ใกล้แล้ว! ฉันยื่นใบลาไปแล้ว ขอให้หัวหน้าอนุมัติด้วยเถิด"
    - "ไปงาน {festival} ด้วยกันป่ะแก ฉันอยากกินทุกอย่างในงานแล้วไปนอนกลางวันต่อ"
    - "ถ้าฉันลากลับงาน {festival} ไม่ได้ ถ่ายรูปส่งมาเยอะๆ นะแก ฉันจะดูในห้องพักโรงงาน"
  gift_love:
    - "{item}! แกจำได้ด้วยเหรอว่าฉันชอบ ฉันจะกินทีละนิดให้ถึงวันจันทร์เลย"
    - "นี่มันรสชาติบ้านเลยแก ฉันจะร้องไห้แล้วนะ"
    - "ขอบคุณมากๆ ให้ของที่หาไม่ได้ในชลบุรีแบบนี้ ฉันใจละลายเลย"
  gift_like:
    - "ชอบจ้า ขอบคุณนะแก"
    - "{item} เหรอ น่ากินมาก ฉันจะแบ่งแม่ครึ่งหนึ่ง"
    - "ดีเลย ฉันจะเอาใส่กระเป๋ากลับหอด้วย"
  gift_neutral:
    - "ขอบใจนะแก"
    - "อ๋อ {item} โอเคจ้า"
    - "เก็บไว้ก่อนนะ เดี๋ยวคิดว่าจะเอาไปทำอะไร"
  gift_dislike:
    - "เอ่อ… ฉันไม่ค่อยกินแบบนี้นะแก แต่ขอบใจที่คิดถึง"
    - "อันนี้ฉันเอาไปให้เพื่อนที่หอแล้วกัน มันน่าจะชอบ"
    - "ไม่ต้องลำบากซื้อของแพงให้ฉันนะ ฉันเกรงใจ"
  gift_hate:
    - "เครื่องดื่มชูกำลังเหรอแก… ฉันกินมาเจ็ดปีจนกระเพาะพัง ขอไม่รับนะ"
    - "ล็อตเตอรี่… ฉันเห็นแม่หมดเงินกับมันมาทั้งชีวิต เอาคืนไปเหอะ"
    - "แกไม่รู้จักฉันจริงๆ เลยเนอะ"
  birthday:
    - "จำวันเกิดฉันได้จริงดิ! ที่โรงงานมีแค่เค้กก้อนเล็กแบ่งกับคนเกิดเดือนเดียวกันสามสิบคน"
    - "ปีนี้ฉันอธิษฐานขอให้ได้กลับบ้านถาวร… พูดออกมาแล้วจะเป็นจริงป่ะแก"
    - "ขอบคุณที่ทำให้วันเกิดฉันมีความหมายนะ ไม่ใช่แค่วันที่ได้หักภาษีเพิ่ม"
  rare:
    - "ความลับนะแก ฉันแอบไปสมัครเรียนออนไลน์หลักสูตรทำอาหาร เรียนตอนพักโอทีทุกคืน"
    - "บัตรพนักงานฉันรูปถ่ายตั้งแต่อายุสิบแปด ทุกวันที่สแกนนิ้ว ฉันเห็นตัวเองตอนยังไม่เหนื่อย"
    - "ฉันมีกระปุกออมสินรูปควายที่ซ่อนไว้ใต้เตียงบ้านแม่ ข้างในเป็นเงินเปิดร้าน ห้ามบอกแม่เด็ดขาด"
    - "หัวหน้าไลน์เคยถามว่าทำไมฉันยิ้มตลอด ฉันบอกว่า 'คิดถึงส้มตำ' เขาให้ฉันไปพักสิบนาที"
    - "ตอนเด็กฉันกับบอลสัญญากันว่าจะไม่ไปจากตำบล ฉันผิดสัญญาก่อน เขาเลยยังโกรธฉันนิดๆ"
  flirt:
    - "ไปส่งฉันที่ป้ายรถเมล์วันจันทร์ได้ป่ะ… ไม่ใช่เพราะกระเป๋าหนักหรอก"
    - "ทุกครั้งที่ใกล้วันศุกร์ ฉันนับชั่วโมงกลับบ้าน ช่วงนี้นับเร็วขึ้น ไม่รู้ทำไม… รู้แหละ"
    - "ส้มตำจานนี้ฉันตำให้แกคนแรกนะ ก่อนแม่อีก อย่าบอกแม่"
    - "ถ้าฉันกลับมาอยู่บ้านถาวร แกจะว่างไปนั่งเล่นริมคลองกับฉันทุกเย็นป่ะ"
romance_stages:
  friend:
    - "เป็นเพื่อนกันแล้วนะแก ต่อไปฉันจะเอาของฝากจากชลบุรีมาให้ทุกรอบ"
    - "กลับบ้านคราวหน้าฉันทักไลน์บอกก่อนนะ จะได้นัดกินหมูปิ้งกัน"
    - "แกเป็นเพื่อนคนที่สองในตำบลที่ฉันกล้าเล่าว่าเหนื่อย คนแรกคือแม่"
  dating:
    - "ตั้งแต่คบกัน ฉันโทรวิดีโอคอลหาแกตอนพักกะดึกทุกคืน เพื่อนที่หอบอกว่าฉันยิ้มน่ากลัว"
    - "ฉันขอเปลี่ยนกะเพื่อให้กลับบ้านได้ทุกศุกร์แล้วนะ ได้เงินน้อยลง แต่ได้เจอแกบ่อยขึ้น"
    - "เป็นแฟนกันแล้ว แกต้องชิมส้มตำฉันทุกสูตร ทั้งที่อร่อยและไม่อร่อย นี่คือสัญญา"
  engaged:
    - "หมั้นแล้วนะแก! ฉันยื่นใบลาออกจากโรงงานแล้ว มือสั่นแต่ไม่เสียใจ"
    - "แม่ร้องไห้ตอนรู้ว่าฉันจะกลับบ้านถาวร บอกว่าไม่ต้องส่งเงินแล้ว ให้เก็บไว้เปิดร้าน"
    - "สินสอดไม่ต้องเยอะ ขอแค่ช่วยปะหลังคาบ้านแม่ก็พอ ฉันพูดจริงนะ"
  married:
