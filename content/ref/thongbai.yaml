        reply: "ดีที่ไม่มั่ว ไม่รู้ก็อย่าเก็บ จำไว้ เห็ดไม่ได้ให้โอกาสเราผิดครั้งที่สอง"
      - text: "เก็บเลยป้า เห็ดก็คือเห็ด"
        heart: -1
