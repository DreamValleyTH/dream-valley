    - "ขอบใจจ้ะ วางไว้ตรงนั้นก่อน ป้ามือไม่ว่าง"
    - "อ้อ จ้ะ ป้ารับไว้นะ"
  gift_dislike:
    - "{item} เหรอหลาน... ขอบใจนะ แต่ครัวป้าไม่ค่อยได้ใช้หรอก"
    - "แหม ป้าไม่ชอบเท่าไรนะ แต่ให้มาแล้วป้าไม่ทิ้งหรอก"
  gift_hate:
    - "เอามาให้ป้าทำไม{item} หลานอยากให้ป้าเลิกทำครัวเหรอ"
    - "ไม่เอาจ้ะหลาน ของแบบนี้ป้าไม่ให้เข้าครัวเด็ดขาด"
  birthday:
    - "วันเกิดป้าเหรอ ไม่มีใครจำได้มาสิบปีแล้ว หลานทำป้าน้ำตาจะไหล... เดี๋ยว ไปยกหม้อมาก่อน ป้าทำขนมครกไว้"
    - "ขอบใจนะหลาน ปีนี้ป้าขอแค่ฝนมาตามฤดู เห็ดขึ้นเยอะ แล้วก็แกงไม่จืด"
    - "อายุมากขึ้นแล้ว เข่าป้าเริ่มไม่ไหว แต่ตราบใดที่ยังยืนหน้าเตาได้ ป้าจะแกงต่อไป"
  rare:
    - "ความลับนะหลาน ป้าแอบใส่น้ำตาลในแกงนิดหนึ่งทุกหม้อ ป้าด่าคนอื่นว่าหวานแต่ป้าก็ใส่"
    - "ป้าเคยเห็นนางตะเคียนครั้งหนึ่งตอนหาเห็ดเลยเวลา นางไม่ไล่ป้า นางแค่มองตะกร้าเห็ดป้า ป้าเลยวางไว้ให้เห็ดหนึ่งดอก"
    - "แกงที่จืดที่สุดในชีวิตป้าคือแกงที่ป้าทำเองวันที่สามีป้าตาย ป้าลืมใส่ทุกอย่าง ไม่มีใครกล้าบอกป้าเลย"
    - "ถ้าหลานเห็นป้าร้องไห้ตอนหั่นหอม ไม่ต้องห่วงนะ บางทีหอมมันแรง บางทีป้าแค่ใช้หอมเป็นข้ออ้าง"
    - "ป้ามีสมุดสูตรแกงเล่มหนึ่ง เขียนด้วยลายมือแม่ป้า ถ้าวันไหนป้าไม่อยู่ ป้าอยากให้มันอยู่ในครัววัดต่อไป"
