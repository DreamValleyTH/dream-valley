id: thongbai
name: "ป้าทองใบ"
role: "แม่ครัวใหญ่งานบุญประจำวัดดงเย็น ผู้เชี่ยวชาญของป่า ครูสายหาของป่า"
voice: "พูดเร็ว ปากไวใจดี ลงท้าย จ้ะ นะหลาน แหม คำติดปาก จืด! กับ ใครปรุงหม้อนี้ ชิมทุกหม้อที่ผ่านหน้า ชอบสอนเรื่องเห็ดและผักป่าแบบละเอียดยิบ"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "ตื่นแล้วเหรอหลาน ป้าเข้าป่ามารอบหนึ่งแล้ว ได้ผักหวานมากำเดียว แต่ยอดสวยนะ"
    - "เช้านี้ป้าต้องไปตั้งหม้อที่ศาลาวัดจ้ะ แกงเลี้ยงพระสามหม้อ ใครอย่ามายุ่งหม้อป้า"
    - "อรุณสวัสดิ์จ้ะหลาน กินข้าวหรือยัง ไม่กินมื้อเช้าเดี๋ยวแรงตกนะ ป้าเห็นหลานชอบข้าม"
    - "ตีห้าป้าก็ตำน้ำพริกแล้ว ครกบ้านป้าดังจนหมาข้างบ้านตื่นทุกวัน"
    - "ไปตลาดนัดไหมหลาน วันนี้ป้าจะไปหาปลาช่อนมาทำแกงป่า ถ้าเจ๊หงษ์ขายแพงป้าจะต่อให้"
    - "หมอกยังลงอยู่เลย ช่วงนี้แหละเห็ดชอบ ใครตื่นก่อนก็ได้ก่อนจ้ะ"
  greet_noon:
    - "เที่ยงแล้วหลาน มากินข้าวด้วยกันไหม ป้าทำต้มจืดเต้าหู้หมูสับไว้ ไม่จืดนะ ต้มจืดแต่ไม่จืด"
    - "ร้อนจังหลาน ป้าเพิ่งออกจากป่า เหงื่อท่วมเหมือนยืนข้างเตาถ่าน"
    - "กินข้าวเวฟร้าน 24 ชม. อีกแล้วเหรอ แหม หลานเอ๊ย มาบ้านป้า ข้าวสวยร้อนๆ มีทุกวัน"
    - "พักเที่ยงป้าเด็ดยอดมะกรูดหลังบ้านไว้ทำพริกแกง พริกแกงซื้อสำเร็จน่ะ เค็มกับจืดในซองเดียว"
    - "บ่ายนี้ป้าจะไปช่วยพี่หน่อยหั่นผักร้านก๋วยเตี๋ยว แลกกับน้ำซุปหนึ่งถัง ยุติธรรมดี"
  greet_evening:
    - "เย็นแล้วหลาน กลับจากนาเหนื่อยไหม ป้ามีแกงเห็ดเผาะเหลือ เอาถ้วยมาตักไปสิ"
    - "ตะวันจะตกแล้ว อย่าเข้าป่าตอนนี้นะหลาน ต้นตะเคียนใหญ่ข้างทางนั่น ป้ายังไม่กล้าผ่านเลย"
    - "หอกระจายข่าวบอกว่าพรุ่งนี้มีงานทำบุญบ้านลุงจำรัส ป้าต้องไปแช่ข้าวเหนียวคืนนี้แล้ว"
    - "เย็นนี้ป้าตำส้มตำปลาร้าให้ป้าพร ป้าพรบ่นว่าลุงสมหมายซื้อหวยอีกแล้ว ส้มตำนี่แก้เครียดได้"
    - "อากาศเย็นลงหน่อยค่อยหายใจออก หลานกินข้าวมื้อเย็นด้วยนะ อย่าให้กระเพาะกินตัวเอง"
  greet_night:
    - "สองทุ่มแล้วหลาน กลับบ้านเถอะ ใกล้สามทุ่มผีออก ป้าปิดประตูครัวแล้ว"
    - "หมาเริ่มหอนแล้วนั่น ใครยังอยู่ในป่าป้าก็ช่วยไม่ไหวนะหลาน รีบกลับจ้ะ"
    - "ดึกแล้วอย่าเดินผ่านป่าดงเย็น นางตะเคียนชอบยืนรอคนกลับดึก ป้าไม่ได้พูดเล่นนะ"
    - "ถ้ากลับบ้านไม่ทันก็เข้าวัดไป ป้าทิ้งข้าวต้มไว้ในโรงครัว หลานกินได้เลย"
    - "เดินกลางคืนผูกสายสิญจน์ที่วัดไว้หน่อยนะหลาน สี่สิบเก้าบาท ป้าว่าคุ้มกว่าแกงหนึ่งหม้ออีก"
  weather_rain:
    - "ฝนตกแล้วหลาน! พรุ่งนี้เช้าเห็ดขึ้นแน่ ป้าจะเข้าป่าตั้งแต่ไก่ยังไม่ขัน"
    - "ฝนตกแบบนี้ป้าชอบ ต้มยำปลาหม้อเดียว นั่งกินฟังเสียงฝน ไม่ต้องการอะไรอีกแล้ว"
    - "ระวังลื่นนะหลาน ทางเข้าป่าเป็นดินเหนียว ป้าล้มก้นจ้ำเบ้าไปเมื่อวานยังเจ็บอยู่"
    - "ฝนตกฟืนเปียกหมด ป้าต้องจุดเตาแก๊ส แกงเตาแก๊สรสไม่เหมือนเตาถ่านเลยหลาน"
  weather_hot:
    - "ร้อนเหลือเกิน ดื่มน้ำตะไคร้เยอะๆ นะหลาน ป้าต้มไว้หม้อใหญ่ ตักไปเลย"
    - "ร้อนอย่างนี้แกงอะไรก็บูดไว ทำกับข้าวแล้วกินให้หมดภายในวันนะ"
    - "แดดแรงขนาดนี้ผักป่าเหี่ยวคากิ่ง ป้าออกไปเก็บไม่ไหว ไว้หน้าฝนดีกว่า"
    - "ทำแกงส้มผักรวมกินช่วงร้อน เปรี้ยวๆ ช่วยให้คล่องคอ ไม่เป็นลมแดดง่ายนะหลาน"
  weather_storm:
    - "พายุมาแล้ว! หลานยกหม้อข้าวเข้าบ้านหรือยัง ป้าหมายถึงเก็บของเข้าบ้านทั้งหมดน่ะ"
    - "ฟ้าผ่าแบบนี้อย่าไปยืนใต้ต้นไม้ใหญ่ในป่านะหลาน ทั้งฟ้าทั้งผีไม่มีใครปรานี"
    - "หลังพายุกิ่งไม้หักเต็มป่า ป้าจะไปเก็บฟืนพรุ่งนี้ ได้ฟืนฟรีทั้งเดือน"
    - "ลมแรงหลังคาโรงครัววัดปลิวไปแผ่นหนึ่ง ช่างเปี๊ยกบอกว่าพรุ่งนี้จะมาซ่อม พรุ่งนี้ของช่างเปี๊ยกมีหลายแบบนะ"
  weather_pm25:
    - "ฝุ่นเยอะ อย่าตากผักตากปลาไว้ข้างนอกนะหลาน หมูแดดเดียวจะกลายเป็นหมูฝุ่นเดียว"
    - "ใครเผาป่าล่ะนี่ เผาทีผักหวานป่าป้าตายเรียบ คนเผานึกว่าจะได้ผักงามแต่ได้ฝุ่นงามแทน"
    - "ใส่หน้ากากเข้าป่านะหลาน ป้าไอทั้งคืนเมื่อวาน หมอแอนให้ยามาแล้ว"
  season_rainy:
    - "หน้าฝนคือหน้าของป้า เห็ดเผาะ เห็ดโคน หน่อไม้ ป้าเข้าป่าทุกเช้าเลยหลาน"
    - "ช่วงเข้าพรรษาป้าต้องทำกับข้าวถวายพระทุกวันพระ ใครอยากมาช่วยหั่นผักบอกป้านะ"
    - "หน้าฝนกบเขียดอ้วน ป้าจะทำต้มยำกบให้กิน หลานกินเป็นไหม ไม่เป็นป้าสอน"
    - "ฝนแรกแล้วเห็ดเผาะจะขึ้นใต้ต้นเต็งต้นรัง ต้องคุ้ยดินดูนะหลาน มันชอบซ่อน"
  season_cool:
    - "หน้าหนาวหน้างานบุญ กฐินมาที ป้าต้องทำแกงสิบหม้อ แขนป้าจะหลุด แต่ใจป้าเต็ม"
    - "อากาศเย็นแบบนี้ ต้มข่าไก่ร้อนๆ สักถ้วยดีที่สุด หลานมากินไหม"
    - "หน้าหนาวผักป่าน้อย แต่ป้าปลูกตะไคร้ ข่า มะกรูดไว้หลังบ้าน ครัวป้าไม่เคยขาด"
    - "หน้าเกี่ยวลงแขกเยอะ ป้ารับทำกับข้าวทุกงาน ส่วนป้าจะบ่นว่าแกงจืดทุกงานเหมือนกัน"
  season_dry:
    - "หน้าแล้งไข่มดแดงมาแล้วหลาน ป้าจะไปแหย่รังที่ต้นมะม่วงหลังวัด แกงไข่มดแดงอร่อยที่สุดในโลก"
    - "หน้าแล้งผักหวานป่าแตกยอด เด็ดเฉพาะยอดนะหลาน อย่าตัดกิ่ง ต้นมันจะได้ให้เราอีกปีหน้า"
    - "สงกรานต์ป้าทำข้าวแช่ไม่ได้หรอก ป้าทำขนมจีนน้ำยาเลี้ยงทั้งหมู่บ้านแทน"
    - "แล้งอย่างนี้บ่อน้ำหลังบ้านป้าเหลือครึ่งเดียว ล้างผักทีต้องคิดก่อนว่าล้างกี่รอบ"
  heart_low:
    - "หลานบ้านไหนจ้ะ อ๋อ ลูกบ้านนั้น ตอนเด็กแม่หลานเอาหลานมาฝากป้าเลี้ยงบ่อยนะ จำไม่ได้หรอก"
    - "ป้ายุ่งอยู่จ้ะ ต้องหั่นหมูสามกิโล หลานอยากคุยมานั่งหั่นด้วยกันได้นะ"
    - "อยากหาของป่าเหรอ ไปหัดดูต้นไม้ก่อนนะหลาน ป้าไม่สอนใครที่เดินเหยียบเห็ดหรอก"
    - "แหม หลานมาใหม่ ป้ายังไม่รู้ว่าหลานกินเผ็ดได้แค่ไหน ไว้มากินข้าวกันสักวัน"
  heart_mid:
    - "หลานมาพอดี ชิมแกงป่านี่หน่อย จืดไหม บอกตรงๆ ป้าไม่โกรธ... ป้าโกรธนิดเดียว"
    - "ป้าทำน้ำพริกหนุ่มไว้ให้หลานกระปุกหนึ่ง กินกับผักลวกนะ ดีกว่ากินบะหมี่ซองทุกวัน"
    - "พรุ่งนี้ป้าจะเข้าป่าหาเห็ดโคน หลานมาด้วยไหม แต่สาบานก่อนว่าจะไม่บอกใครว่าจุดไหน"
    - "หลานกินเผ็ดเก่งขึ้นนะ ตอนแรกกินส้มตำป้าแล้วน้ำตาไหล ตอนนี้ขอพริกเพิ่ม ป้าภูมิใจ"
    - "งานบุญคราวหน้าป้าให้หลานคุมหม้อแกงจืดฟักทอง ถ้าจืดเกินป้าจะบอกตรงๆ นะ"
  heart_high:
    - "หลานรู้ไหม ป้าเป็นแม่ครัวงานวัดมาสามสิบปี แต่ไม่เคยมีใครถามว่าป้าได้กินหรือยัง หลานเป็นคนแรก"
    - "สูตรแกงเห็ดเผาะนี่ของแม่ป้า แม่ป้าตายไปแล้ว ป้าเลยทำทุกปีเหมือนแม่ยังอยู่ในครัว"
    - "ลูกสาวป้าอยู่กรุงเทพฯ ขายของออนไลน์ ส่งเงินมาทุกเดือน แต่ป้าอยากให้กลับมากินแกงป้ามากกว่าเงิน"
    - "ที่ป้าบ่นว่าแกงคนอื่นจืดน่ะ จริงๆ ป้ากลัวว่าพอหมดรุ่นป้าจะไม่มีใครทำแกงแบบนี้แล้ว"
    - "ป้าอยากเปิดร้านข้าวแกงเล็กๆ ในตลาดนัดมาตลอด แต่ไม่กล้า ถ้าหลานช่วยป้า ป้าอาจจะลองดู"
  topic_news:
    - "ข่าวใหญ่ งานบวชลูกป้าแต๋วเดือนหน้า ป้าต้องทำกับข้าวเลี้ยงสองร้อยคน หลานว่างมาช่วยไหม"
    - "ได้ยินว่าเห็ดโคนขึ้นแล้วที่จอมปลวกหลังป่าดงเย็น ป้าบอกหลานคนเดียวนะ"
    - "พี่หน่อยร้านก๋วยเตี๋ยวขึ้นราคาชามละห้าบาท เพราะหมูแพง ป้าเข้าใจ ป้าก็ซื้อหมูแพงเหมือนกัน"
    - "บริษัทของคุณธนามาล้อมรั้วแถวป่าทางทิศเหนือ ป้าไปหาหน่อไม้ไม่ได้แล้ว ป่าตรงนั้นป้าเข้ามาตั้งแต่เด็ก"
    - "ยายบัวบอกว่าคืนวันพระนี้ผีโพงจะออกแถวทุ่ง ป้าเชื่อยายบัวมากกว่าพยากรณ์อากาศอีก"
  topic_advice:
    - "เห็ดเผาะขึ้นหลังฝนแรกใต้ต้นเต็งต้นรัง ต้องไปเช้าตรู่ คุ้ยดินเบาๆ อย่าใช้จอบนะหลาน"
    - "เห็ดสีขาวทั้งดอกที่มีถ้วยหุ้มโคน อย่าเก็บเด็ดขาด นั่นเห็ดระโงกหิน กินแล้วไป รพ.อำเภอไม่ทัน"
    - "หน่อไม้ต้องต้มเทน้ำทิ้งก่อนอย่างน้อยสองรอบนะหลาน หน่อไม้ดิบมีพิษ กินแล้วเวียนหัว"
    - "ไข่มดแดงมีหน้าแล้ง ช่วงก่อนสงกรานต์ เอาตะกร้าผูกไม้ยาวแหย่รัง มีผ้าชุบน้ำไว้เช็ดมด"
    - "ผักหวานป่าเด็ดเฉพาะยอดอ่อน ไม่ต้องหักกิ่ง ต้นที่เราเก็บอย่างดีปีหน้าให้ยอดเยอะกว่าเดิม"
    - "แกงเห็ดเผาะกินแล้วตาไวขึ้นนะหลาน เข้าป่าหาของเจอง่ายขึ้น ป้ากินก่อนเข้าป่าทุกครั้ง"
  topic_smalltalk:
    - "หลานกินปลาร้าไหม คนกรุงเทพฯ ชอบบอกว่าเหม็น ป้าว่าพวกเขายังไม่เจอปลาร้าดีๆ"
    - "ครกป้าใบนี้อายุมากกว่าหลานนะ สากเปลี่ยนไปสามอันแล้ว ครกยังอยู่"
    - "ป้าชอบดูรายการทำอาหารในทีวี แต่เขาใส่น้ำตาลเยอะจนป้าอยากเข้าไปแย่งทัพพี"
    - "หลานเคยกินข้าวจี่ไหม ปั้นข้าวเหนียวทาไข่แล้วปิ้ง ตอนเด็กป้าปิ้งในกองไฟกลางนา อร่อยกว่าทุกร้านในอำเภอ"
    - "ถ้าหลานเห็นป้าเดินดมหม้อคนอื่นในงานบุญ ไม่ต้องตกใจ ป้ากำลังทำงาน"
  topic_about_self:
    - "ป้าเกิดในครัวเลยหลาน แม่ป้าทำกับข้าวงานวัด ป้านั่งตำพริกแกงตั้งแต่ตัวเท่าครก"
    - "ป้าทำกับข้าวงานบุญไม่เคยรับเงิน ได้แต่บุญกับเศษกับข้าวกลับบ้าน ป้าว่ากำไรนะ"
    - "สามีป้าเสียไปสิบปีแล้ว เขาชอบกินแกงป่าเผ็ดๆ ป้าเลยยังแกงเผ็ดทุกวันพระ"
    - "ป้ารู้จักต้นไม้ในป่าดงเย็นทุกต้น ต้นไหนให้เห็ด ต้นไหนมีผี ต้นไหนมีมดแดงกัด"
    - "ป้าเรียนจบแค่ ป.4 แต่ถ้าวัดกันที่จำสูตรแกง ป้าจบปริญญาเอกนะหลาน"
  topic_about_others:
    - "พี่หน่อยร้านก๋วยเตี๋ยวทำน้ำซุปเก่ง แต่ใส่ผงปรุงรสเยอะไปหน่อย ป้าบอกไปแล้ว พี่หน่อยยิ้มอย่างเดียว"
    - "ยายบัวน่ะเพื่อนป้า เข้าป่าด้วยกันมาสี่สิบปี ยายดูผี ป้าดูเห็ด แบ่งงานกันลงตัว"
    - "ลุงพรานแดงหาปลามาให้ป้าทำแกงทุกงานบุญ ไม่เคยคิดเงิน แต่ขอแกงหม้อแรกทุกครั้ง"
    - "ป้าพรกับป้าเพื่อนกันมาตั้งแต่สาว ทุกเย็นป้าพรมาบ่นเรื่องลุงสมหมาย ป้าฟังมาสามสิบปีแล้ว"
    - "ลุงมัคนายกจำรัสชอบมาชิมแกงก่อนพระฉัน ป้าต้องตีมือแกทุกครั้ง ลุงจำรัสหัวเราะทุกครั้ง"
    - "กล้าปลูกผักอินทรีย์เก่งนะ ป้าซื้อผักเขาประจำ ผักเขาไม่มีกลิ่นยา หวานกว่าผักตลาด"
  gossip_theft:
    - "หลาน... ป้าได้ยินเรื่องของหายแล้วชื่อหลานโผล่มา ป้าไม่ชอบเลย คืนเขาไปซะ แล้วมาช่วยป้าล้างหม้อชดใช้"
    - "ของของคนอื่นน่ะ จะอร่อยแค่ไหนก็ไม่ใช่ของเรา ป้าสอนเด็กในหมู่บ้านมาแบบนี้ทุกคน"
    - "ป้าไม่ด่าหรอกนะ แต่หลานรู้ไหมว่าทั้งตลาดนัดคุยเรื่องหลานอยู่ ป้าต้องปกป้องหลานจนคอแห้ง"
  gossip_cheating:
    - "แหม คบหลายคนพร้อมกัน เหมือนแกงหม้อเดียวใส่ทุกอย่าง สุดท้ายไม่อร่อยสักอย่าง"
    - "ป้าไม่ยุ่งเรื่องหัวใจหลานหรอก แต่คนที่ถูกหลอกเขาเจ็บนะ ป้าเห็นหน้าเขาที่ตลาดนัด"
    - "ความรักต้องตั้งใจปรุงเหมือนน้ำพริก ใส่ทีละอย่าง ชิมทีละครั้ง ไม่ใช่เทรวมทีเดียว"
  gossip_unpaid_bill:
    - "ค้างค่าไฟเหรอหลาน ช็อตก็มากินข้าวบ้านป้า อย่าอดข้าวเพื่อประหยัดนะ"
    - "ป้าเคยค้างค่าน้ำตอนสามีป้าป่วย ไม่ต้องอาย แต่ไปคุยกับ อบต. เขาผ่อนให้ได้"
    - "เงินไม่พอใช้ ลองเก็บผักป่าไปขายตลาดนัดสิหลาน ผักหวานป่ากิโลละหลายร้อยนะ"
  gossip_small_envelope:
    - "ใส่ซองน้อยไม่เป็นไรหลาน แต่งานหน้ามาช่วยป้าในครัว คนครัวไม่มีใครนับเงินในซองหรอก"
    - "ป้าได้ยินว่าหลานใส่ซองงานศพตาแก้วแค่ยี่สิบ เจ้าภาพไม่ว่า แต่ป้าแต๋วจดไว้แล้ว"
    - "งานบุญน่ะ เงินช่วยได้ แรงก็ช่วยได้ ถ้าเงินน้อยก็เอาแรงมาแทน ป้าต้องการคนหั่นหอม"
  gossip_skip_longkhaek:
    - "หลานไม่ไปช่วยลงแขกคืนเหรอ ป้าทำกับข้าวเลี้ยงคนที่มาช่วยหลานเหนื่อยนะ ป้าจำได้"
    - "ลงแขกน่ะ ไม่ได้ช่วยแค่เกี่ยวข้าว ช่วยกันจำว่าเราเป็นหมู่บ้านเดียวกัน หลานต้องไปคืนนะ"
    - "คนบ่นกันในวงข้าวว่าหลานกินแล้วไม่ไปช่วย ป้าเลยไม่กล้าตักแกงให้หลานเพิ่มแล้วคราวนี้"
  player_fainted:
    - "เมื่อคืนผีจับเหรอหลาน! เดี๋ยวป้าต้มข้าวต้มปลาให้ กินแล้วแรงกลับมา"
    - "ป้าบอกแล้วว่าอย่าเดินผ่านป่าตอนดึก นางตะเคียนไม่ได้กลัวใครหรอกนะหลาน"
    - "ตื่นที่ รพ.สต. ใช่ไหม หมอแอนบอกป้าแล้ว หลานยังไม่ได้กินข้าวด้วยใช่ไหม หน้าซีดขนาดนั้น"
  player_new_vehicle:
    - "รถใหม่เหรอหลาน ดีจัง ทีนี้ไปตลาดนัดช่วยป้าขนผักได้แล้ว"
    - "ขับระวังนะหลาน ทางเข้าป่ามีกิ่งไม้ล้มเยอะ ยางจะแตกไม่รู้ตัว"
    - "รถใหม่เอาไปให้พระอาจารย์ที่วัดเจิมก่อนนะหลาน ป้าว่าสบายใจดี"
  player_lottery_win:
    - "ถูกหวยเหรอหลาน ดีใจด้วยจ้ะ อย่าเล่าให้ลุงสมหมายฟังนะ แกจะนอนไม่หลับทั้งเดือน"
    - "ได้เงินแล้วเลี้ยงข้าวป้าสักมื้อ ป้าทำเองก็ได้ หลานแค่จ่ายค่าหมู"
    - "ระวังญาติโผล่นะหลาน คนที่ไม่เคยกินแกงป้าสักถ้วยจะมานั่งรอหน้าบ้านหลาน"
  player_muddy:
    - "ตัวเลอะโคลนขนาดนี้ อย่าเข้าครัวป้านะหลาน ไปล้างตัวก่อน แล้วค่อยมากินข้าว"
    - "โคลนเต็มตัวเลย ไปดำนามาใช่ไหม ขยันจริง ป้าให้ข้าวจี่ไปกินหนึ่งไม้"
    - "เลอะอย่างนี้เหมือนป้าตอนตามหาเห็ดในวันฝนตกเลย เห็ดไม่เจอ เจอแต่โคลน"
  player_rich:
    - "หลานมีเงินแล้วก็ดีจ้ะ แต่อย่ากินแต่ของซื้อนะ ทำกับข้าวกินเองบ้าง ร่างกายจะได้ดีด้วย"
    - "รวยแล้วงานบุญหน้าช่วยออกค่าหมูหน่อยนะหลาน ป้าจะประกาศชื่อหลานตอนแจกแกง"
    - "เงินเยอะแล้วอย่าลืมว่ากินข้าวได้วันละสามมื้อเท่าเดิมนะหลาน ป้าว่าเงินน่ะเอาไว้แบ่ง"
  player_in_debt:
    - "เป็นหนี้ไม่ใช่เรื่องน่าอายหลาน กินข้าวบ้านป้าได้ ประหยัดค่ากับข้าวไปหลายบาท"
    - "ช่วงช็อตไปเก็บหน่อไม้ขายตลาดนัดสิหลาน ป้าจะบอกว่าตรงไหนเยอะ ห้ามบอกใครนะ"
    - "อย่าไปเชื่อพวกเงินกู้ที่ติดป้ายเสาไฟนะหลาน ป้าเห็นคนในหมู่บ้านหมดตัวเพราะมันมาแล้ว"
  player_sick:
    - "ป่วยเหรอหลาน เดี๋ยวป้าต้มแกงจืดฟักทองไปให้ กินร้อนๆ แล้วนอนพัก"
    - "ไป รพ.สต. เถอะหลาน ป้าทำกับข้าวรักษาได้แค่ใจ ร่างกายต้องให้หมอแอนดู"
    - "หลานกินไม่ครบมื้อใช่ไหม ป้ารู้ ปวดท้องแบบนี้ต้องกินข้าวตรงเวลาแล้ว"
  player_married:
    - "แต่งงานแล้ว! ป้าจะทำกับข้าวงานแต่งให้เอง ฟรี ขอแค่ให้ป้าคุมครัวคนเดียว"
    - "ยินดีด้วยจ้ะ มีคู่แล้วสอนเขาทำกับข้าวด้วยนะ ถ้าเขาทำแกงจืด มาบอกป้า ป้าจะสอนเอง"
    - "ชีวิตคู่เหมือนแกงป่า ต้องเผ็ดบ้างเค็มบ้าง แต่ต้องกินด้วยกันทุกวัน"
  event_disaster:
    - "น้ำท่วมแล้วหลาน ป้าตั้งโรงครัวที่ศาลาวัดแล้ว มาช่วยห่อข้าวกล่องแจกคนในหมู่บ้านกัน"
    - "ภัยมาทีป้าต้องทำข้าวต้มวันละห้าร้อยถ้วย แขนป้าไม่ไหว แต่ท้องคนในหมู่บ้านต้องอิ่ม"
    - "อย่ากินผักที่จมน้ำท่วมนะหลาน มันสกปรก ล้างยังไงก็ไม่หมด รอผักใหม่ขึ้นก่อน"
  event_election:
    - "ช่วงหาเสียงมีงานเลี้ยงเยอะ ป้าโดนจ้างทำกับข้าวทุกฝั่ง ป้าทำอร่อยเท่ากันหมดนะหลาน ไม่เลือกข้าง"
    - "ผู้สมัครคนไหนมากินแกงป้าแล้วบอกว่าเผ็ดไป ป้าจำไว้แล้ว"
    - "ป้าอยากได้คนที่ทำให้น้ำเข้าป่าได้ ป่าแห้งเห็ดไม่ขึ้น เห็ดไม่ขึ้นป้าก็ไม่มีอะไรจะแกง"
  event_company_water:
    - "ตั้งแต่บริษัทดูดน้ำบาดาล ป่าดงเย็นแห้งจนเห็ดไม่ขึ้นที่เดิม ป้าหาเห็ดเผาะได้ครึ่งเดียวของปีก่อน"
    - "คุณธนามาชิมแกงป้าในงานวัด บอกว่ารสชาติเป็นมรดกทางวัฒนธรรมที่ต้องรักษา ป้าบอกว่างั้นก็อย่าดูดน้ำป่าป้าสิ"
    - "บ่อน้ำหลังบ้านป้าแห้งแล้ว ป้าต้องซื้อน้ำถังมาล้างผัก น้ำที่เคยฟรีตอนนี้มีราคาแล้วหลาน"
  event_festival_near:
    - "{festival}ใกล้แล้ว ป้าต้องเตรียมกับข้าวตั้งแต่ตอนนี้ หลานว่างมาขูดมะพร้าวไหม"
    - "ปีนี้{festival}ป้าจะทำกล้วยบวชชีหม้อใหญ่ หลานมากินด้วยนะ ห้ามมามือเปล่า เอาใบตองมาด้วย"
    - "ช่วง{festival}ทั้งตำบลมาที่วัด ครัวป้าเป็นสนามรบ ใครเข้ามาต้องถือมีดหรือทัพพีเท่านั้นนะหลาน"
  gift_love:
    - "{item}! โอ้ย หลานเอ๊ย ป้าจะแกงคืนนี้เลย แบ่งให้หลานถ้วยใหญ่สุด"
    - "นี่แหละของดีของจริง หลานเลือกเป็นนะ ป้ายอมรับหลานเป็นลูกศิษย์ครัวแล้ว"
    - "ให้ป้าจริงเหรอ {item} สดขนาดนี้ หลานไปหามาจากไหน บอกป้าหน่อย"
  gift_like:
    - "{item} เหรอ ดีจ้ะหลาน ป้าจะเอาไปทำกับข้าวเลี้ยงพระพรุ่งนี้"
    - "ขอบใจจ้ะ ป้าใช้ได้ทุกอย่างในครัว ไม่มีอะไรเหลือทิ้ง"
    - "ของดีนะหลาน ป้าเก็บไว้ทำน้ำพริก"
  gift_neutral:
