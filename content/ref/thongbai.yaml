        reply: "จริงเหรอ งั้นป้าจะตักให้หลานถ้วยหนึ่ง แต่ถ้าโกหกป้าจะรู้นะ"
      - text: "เค็มไปนิดนะป้า"
        heart: 2
        reply: "หลานกล้าพูด ป้าชอบคนกล้าพูด เดี๋ยวป้าเติมน้ำอีกนิด หลานลิ้นดีนะ"
      - text: "ไม่ได้ชิม กลัวท้องเสีย"
        heart: -2
