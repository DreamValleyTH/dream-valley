    options:
      - text: "ไม่ได้ป้า นั่นน่าจะเห็ดระโงกหิน มีพิษ"
        heart: 2
        reply: "เก่งมาก! ป้าลองหลานเฉยๆ คนที่รู้เรื่องนี้ป้าจะพาเข้าป่าลึกด้วย"
      - text: "ไม่แน่ใจ ถามยายบัวก่อนดีกว่า"
