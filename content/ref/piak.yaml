id: piak
name: "ช่างเปี๊ยก"
role: "ช่างก่อสร้างประจำตำบล สร้างบ้าน ต่อเติม ทำเฟอร์นิเจอร์ไม้สั่งทำ"
voice: "พูดตรง ห้าวแต่ใจดี แทนตัวว่า พี่ ลงท้าย นะ เว้ย วะ กับคนสนิท ใช้ศัพท์ช่าง ปูน เหล็กเส้น ได้ฉาก ฐานราก งานช้าเพราะฝนกับลูกค้าเปลี่ยนแบบ ซ่อมของวัดไม่คิดค่าแรง"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "เช้าเว้ย {player} พี่จะไปเทปูนลานหน้าบ้านลุงสมหมาย ต้องรีบก่อนแดดแรง ปูนแห้งไว"
    - "ตื่นมาก็ตอกตะปูเลย กาแฟยังไม่ได้กินด้วยซ้ำ"
    - "ได้ยินหอกระจายข่าวไหม ผู้ใหญ่ย้ำเรื่องประชุมสามรอบ พี่ตอกตะปูทับเสียงไปสองรอบ"
  greet_noon:
    - "เที่ยงแล้วพักก่อน ช่างที่ไม่ยอมพักเที่ยงคือช่างที่ตกนั่งร้าน"
    - "ข้าวมันไก่หน้าตลาดนัดฝากซื้อมาให้พี่ได้ไหม จะได้มีแรงฉาบผนังต่อ"
  greet_evening:
    - "เย็นแล้ว เก็บเครื่องมือ ใครทิ้งสว่านไว้ข้างนอกตอนกลางคืน เช้ามาหายแน่"
    - "งานวันนี้ได้ฉากสวย พี่ภูมิใจ ขอฉลองด้วยน้ำมะพร้าวปั่นสักแก้ว"
  greet_night:
    - "ดึกแล้วยังเดินอยู่อีก พี่ยังกลัวเลย มองนั่งร้านตอนกลางคืนเหมือนมีคนยืนอยู่บนนั้น"
    - "รีบกลับเหอะ พี่ขับกระบะไปส่งถึงวัดได้ ไฟหน้ารถพี่สว่าง ผีส่วนใหญ่ไม่กล้าเข้าใกล้"
  weather_rain:
    - "ฝนตก งานปูนพับหมด วันนี้พี่ทำเฟอร์นิเจอร์ในโรงไม้แทน"
    - "หลังคาบ้านไหนรั่ว จดไว้เลย ฝนหยุดพี่ไล่ซ่อมทีละหลัง คิวยาวถึงหน้าหนาวแล้ว"
  weather_hot:
    - "ร้อนจนสังกะสีลวกมือ พี่ขึ้นหลังคาได้แค่เช้ากับเย็น"
    - "ร้อนแบบนี้ปูนแตกลายงา ต้องรดน้ำบ่มทั้งวันเหมือนเลี้ยงลูก"
  weather_storm:
    - "พายุมา พรุ่งนี้โทรศัพท์พี่ดังทั้งวันแน่ หลังคาปลิวกันทั้งหมู่"
    - "อย่าไปยืนใกล้เสาไฟนะ ลมแรงขนาดนี้ สายมันขาดได้"
  weather_pm25:
    - "ฝุ่นข้างนอกเยอะกว่าฝุ่นไม้ในโรงงานพี่อีก"
    - "ใส่หน้ากากแบบพี่สิ หน้ากากช่างกันฝุ่นไม้ได้ กันฝุ่นควันก็ได้"
  season_rainy:
    - "หน้าฝนงานพี่น้อย คนไม่อยากสร้างบ้านตอนดินเละ พี่เลยรับทำตู้ทำโต๊ะแทน"
    - "ไม้หน้าฝนบวม ทำบานประตูต้องเผื่อช่องไว้ ไม่งั้นหน้าแล้งปิดไม่สนิท"
  season_cool:
    - "หน้าหนาวสร้างบ้านดีที่สุด ปูนเซ็ตตัวสวย คิวพี่เต็มยาว"
    - "เกี่ยวข้าวเสร็จ คนมีเงินก็ต่อเติมบ้าน พี่ยุ่งจนไม่มีเวลาหวีผม"
  season_dry:
    - "หน้าแล้งน้ำผสมปูนยังต้องซื้อ บ่อแถวนี้แห้งหมด"
    - "แล้งแบบนี้ไม้แห้งดี ใครอยากได้เฟอร์นิเจอร์สั่งตอนนี้เลย"
  heart_low:
    - "อยากสร้างอะไรบอกพี่ได้ ขอแบบก่อนนะ วาดบนกระดาษสมุดก็ได้"
    - "พี่ช่างเปี๊ยก สร้างบ้าน ต่อเติม ทำตู้ทำเตียง ราคาคุยกันได้ แต่เวลาคุยไม่ได้"
  heart_mid:
    - "{player} มาอีกแล้ว อยากต่อเติมอะไรอีก บ้านจะใหญ่กว่าบ้านกำนันแล้วนะ"
    - "เศษไม้สักจากงานบ้านกำนันพี่เก็บไว้ ทำชั้นวางของให้ได้อันหนึ่ง"
    - "พี่เห็นตอกตะปูเมื่อวาน ท่าใช้ได้นะ มาฝึกงานกับพี่ไหม"
  heart_high:
    - "พี่เคยไปเป็นช่างที่กรุงเทพฯ สิบปี สร้างคอนโดสามสิบชั้น แต่ไม่เคยได้นอนในห้องที่ตัวเองสร้างสักคืน"
    - "บ้านไม้ของพ่อพี่ยังอยู่ พี่ซ่อมทุกปี ไม่ยอมรื้อ ต่อให้ปลวกจะเอาไปครึ่งหลังก็ตาม"
    - "พี่อยากทำเกวียนไม้จำลองไว้ให้ตำบลที่ศาลาวัด เป็นงานชิ้นสุดท้ายก่อนวางค้อน"
  topic_news:
    - "หลังคาโรงครัววัดจะเริ่มซ่อมสัปดาห์หน้า ลุงจำรัสจดวันไว้แล้ว พี่หนีไม่ได้"
    - "เหล็กเส้นขึ้นราคาอีกแล้ว เสี่ยเฮงบอกว่าเอาเชื่อไปก่อนได้ ดอกเบี้ยก็ขึ้นตามเหล็ก"
    - "บริษัทคุณธนาจ้างช่างจากข้างนอกมาสร้างรั้ว ไม่จ้างคนในตำบลสักคน"
  topic_advice:
    - "จะสร้างบ้านเพิ่มบอกพี่ล่วงหน้า งานใช้หลายวัน ระหว่างนั้นเตรียมที่นอนสำรองไว้ด้วย"
    - "สั่งเฟอร์นิเจอร์ไม้ต้องรอหลายวัน สั่งก่อนเทศกาลจะได้ทันแต่งบ้าน"
    - "บ้านริมคลองให้ยกพื้นสูงไว้ น้ำท่วมทีไร บ้านยกพื้นไม่ต้องขนของหนี"
  topic_smalltalk:
    - "รู้ไหมว่าทำไมช่างชอบเหน็บดินสอไว้หลังหู เพราะใส่กระเป๋าแล้วหาไม่เจอ"
    - "ระดับน้ำอันนี้พี่ใช้มายี่สิบปี ฟองยังอยู่ตรงกลางเป๊ะ เหมือนใจพี่"
  topic_about_self:
    - "พี่ฝึกงานช่างกับพ่อตั้งแต่สิบห้า ตอกตะปูครั้งแรกโดนนิ้วตัวเอง เล็บดำไปเดือนหนึ่ง"
    - "ลูกค้าเปลี่ยนแบบสามรอบคือปกติ รอบที่สี่พี่เริ่มคิดค่ายางลบ"
  topic_about_others:
    - "ลุงจำรัสจดทุกอย่าง ขนาดพี่ไปช้าห้านาทียังมีบันทึก"
    - "บอลซ่อมรถเก่ง ถ้าไประยองจริง ตำบลจะเหลือช่างหนุ่มแค่พี่คนเดียว พี่ไม่อยากให้ไปเลย"
    - "เสี่ยเฮงขายปูนให้พี่เชื่อได้ แต่ทุกครั้งที่เซ็น พี่รู้สึกเหมือนกำลังเทปูนให้บ้านแกเอง"
  gossip_theft:
    - "ข่าวว่าหยิบของคนอื่นไป อย่าบอกนะว่าค้อนพี่ที่หายก็ด้วย"
    - "พี่ไม่เชื่อหรอก แต่ถ้าจริงเอาไปคืนซะ ตำบลเล็ก ข่าวเดินเร็วกว่าพี่สร้างบ้าน"
  gossip_cheating:
    - "เรื่องแบบนี้เหมือนต่อเติมบ้านไม่ขออนุญาต ไม่นานก็มีคนมาเห็น"
    - "ฐานรากไม่ดี บ้านก็ทรุด ความสัมพันธ์ก็เหมือนกันนะ"
  gossip_unpaid_bill:
    - "ค้างค่าแรงช่างไว้ใช่ไหม ไม่ใช่ของพี่นะ…หรือใช่ เดี๋ยวพี่เปิดสมุดดูก่อน"
    - "ค้างไว้ค่อยๆ ผ่อนได้ บอกกันตรงๆ ดีกว่าหลบหน้า ช่างก็มีลูกต้องกินข้าว"
  gossip_small_envelope:
    - "ซองน้อยไม่เป็นไร งานหน้าไปช่วยกางเต็นท์ แรงช่วยงานมีค่ากว่าแบงก์ร้อย"
    - "พี่เองบางงานก็ใส่น้อย แต่พี่ยกโต๊ะยกเก้าอี้ให้จนเจ้าภาพลืมนับซอง"
  gossip_skip_longkhaek:
    - "ลงแขกไม่ไปคืนก็เหมือนยืมสว่านแล้วไม่คืน คราวหน้าไม่มีใครให้ยืม"
    - "ตาเผือกบ่นใหญ่ ไปช่วยแกสักวันเถอะ แกไม่ถือหรอก ถ้าหิ้วลาบหมูไปด้วย"
  player_fainted:
    - "โดนผีจับเหรอ หน้าซีดยังกับปูนฉาบ นั่งก่อนเว้ย"
    - "ค่า รพ.สต. ไม่ใช่ถูกๆ นะ คราวหน้ารีบกลับก่อนสามทุ่ม"
  player_new_vehicle:
    - "รถใหม่สวย ทำโรงจอดรถไหม หลังคาเมทัลชีท พี่ทำสามวันเสร็จ"
    - "มีกระบะแล้วช่วยพี่ขนไม้บ้างนะ พี่ลดค่าแรงให้"
  player_lottery_win:
    - "ถูกหวยแล้วสร้างบ้านใหม่เลยไหม เดือนหน้าพี่ว่าง"
    - "อย่าเพิ่งใช้หมดนะ ซ่อมหลังคาก่อน ฝนมาทีไรบ้านหยดเป็นจังหวะ"
  player_muddy:
    - "โคลนเต็มตัวเลย ยังกับเพิ่งผสมปูนด้วยมือเปล่า"
    - "อย่าเดินเข้าโรงไม้พี่นะ ขี้เลื่อยติดโคลนแล้วล้างยากเว้ย"
  player_rich:
    - "รวยแล้วต่อเติมชั้นสองไหม พี่วาดแบบให้ฟรี แต่สร้างไม่ฟรีนะ"
    - "ช่วงนี้จ้างพี่บ่อย พี่ก็มีกินด้วย เงินหมุนอยู่ในตำบลแบบนี้แหละดี"
  player_in_debt:
    - "ถ้ายังไม่มีเงิน งานต่อเติมรอก่อนได้ บ้านไม่หนีไปไหน"
    - "พี่เคยเป็นหนี้ค่าเหล็กจนต้องขายสว่าน ค่อยๆ สู้ไป เดี๋ยวก็ผ่าน"
  player_sick:
    - "ป่วยก็พักนะ ไม่ต้องมาคุมงาน พี่ทำเองได้ ไม่แอบเอาไม้ไปไหนหรอก"
    - "ไปหาหมอแอนก่อน ช่างที่ฝืนทำงานตอนป่วยคือช่างที่ตอกตะปูโดนนิ้ว"
  player_married:
    - "แต่งงานแล้ว! บ้านต้องขยายนะ พี่ทำเตียงคู่ไม้สักให้ทั้งหลัง"
    - "ยินดีด้วย ชีวิตคู่ก็เหมือนบ้าน ต้องหมั่นซ่อม ไม่ใช่สร้างเสร็จแล้วจบ"
  event_disaster:
    - "บ้านใครพังมาเขียนชื่อไว้ที่วัด พี่จะไล่ซ่อมบ้านคนแก่ก่อน ไม่คิดค่าแรง"
    - "ช่วยพี่ขนไม้กระดานไปทำสะพานชั่วคราวหน่อย สะพานไม้หมู่สามขาดแล้ว"
  event_election:
    - "มีผู้สมัครมาสัญญาว่าจะสร้างสะพานใหม่ พี่ถามว่าจะจ้างช่างในตำบลไหม เขายิ้มอย่างเดียว"
    - "ป้ายหาเสียงใช้ไม้อัดดีกว่าฝาบ้านพี่อีก เลือกตั้งเสร็จพี่จะขอไปทำชั้นวางของ"
  event_company_water:
    - "รั้วบริษัทสูงสามเมตร พี่ดูแล้ว ฐานรากลึกกว่าบ่อน้ำชาวบ้านอีก"
    - "ตาเผือกจ้างพี่ไปขุดบ่อให้ลึกขึ้น พี่ขุดลงไปอีกห้าเมตรยังไม่เจอน้ำเลย"
  event_festival_near:
    - "{festival} ใกล้แล้ว วัดให้พี่ทำเวที ไม่ได้ค่าแรงแต่ได้ข้าวกินสามมื้อ คุ้มเว้ย"
    - "จะแต่งบ้านรับ{festival} สั่งของไม้ตอนนี้เลย ช้ากว่านี้ไม่ทัน"
  gift_love:
    - "{item} ของโปรดพี่เลย กินแล้วตอกตะปูได้ทั้งวัน"
    - "เฮ้ย ใจดีจัง งานหน้าพี่ลดค่าแรงให้หน่อยนะ…นิดหน่อย"
  gift_like:
    - "ขอบใจ {item} ใช้ได้เลย"
    - "ดีๆ เก็บไว้กินตอนพักเที่ยงหน้างาน"
  gift_neutral:
    - "ขอบใจนะ วางไว้บนโต๊ะช่างก่อน"
    - "อ้อ {item} พี่รับไว้"
  gift_dislike:
    - "อืม ขอบใจ แต่พี่ไม่ค่อยกินของหวานแบบนี้"
    - "งั้นเอาไว้ให้ลูกพี่แล้วกัน"
  gift_hate:
    - "ตะปูขึ้นสนิมเหรอ จะให้พี่เป็นบาดทะยักเหรอเนี่ย"
    - "ไม้ปลวกกินแบบนี้ ช่างเห็นแล้วเจ็บใจ เอาไปทำฟืนเถอะ"
  birthday:
    - "วันเกิดเหรอ พี่ทำกล่องไม้ใส่ของให้ใบหนึ่ง เข้าเดือยทั้งใบ ไม่ใช้ตะปูสักตัว"
    - "สุขสันต์วันเกิด ขอให้หลังคาไม่รั่ว ฐานไม่ทรุด หนี้ไม่งอก"
  rare:
    - "พี่เคยสร้างบ้านให้ลูกค้าคนหนึ่ง เขาบอกว่ากลางคืนมีคนเคาะฝาผนัง ไปดูอีกทีเป็นตุ๊กแก"
    - "พี่แอบสลักชื่อเมียไว้ใต้ขื่อบ้านทุกหลังที่สร้าง เป็นลายเซ็นช่าง"
    - "ตอนอยู่กรุงเทพฯ พี่เกือบตกนั่งร้านชั้นยี่สิบ คืนนั้นพี่ตัดสินใจกลับบ้าน"
  flirt: []
gifts:
  love: ["ลาบหมู", "ข้าวมันไก่", "ไม้สัก"]
  like: ["ไข่เจียวหมูสับ", "น้ำมะพร้าวปั่น", "ไม้ไผ่", "ก๋วยเตี๋ยวเรือ"]
  dislike: ["ขนมครก", "กล้วยบวชชี"]
  hate: ["ตะปูขึ้นสนิม", "ไม้ปลวกกิน"]
choices:
  - id: piak_c1
    min_heart: 0
    prompt: "อยากได้ตู้แบบไหน ไม้สักแพงแต่ทน ไม้ยางถูกแต่มอดชอบ เลือกเลย"
    options:
      - text: "ไม้สัก ใช้กันไปนานๆ"
        heart: 1
        reply: "ตาดี ตู้ไม้สักพี่ทำห้าวัน ใช้ได้ถึงรุ่นลูกรุ่นหลาน"
      - text: "ไม้ยาง ประหยัดไว้ก่อน"
        heart: 1
        reply: "ก็ได้ พี่ทาน้ำยากันมอดให้ฟรี อยู่ได้หลายปี"
      - text: "เร่งให้เสร็จพรุ่งนี้ได้ไหม"
        heart: -1
        reply: "พรุ่งนี้ได้แค่ไม้กองหนึ่ง ตู้ต้องรอหลายวันเว้ย ช่างไม่ใช่ร้าน 24 ชม."
  - id: piak_c2
    min_heart: 4
    prompt: "บริษัทคุณธนาจ้างพี่ไปสร้างโกดัง ค่าแรงสองเท่า แต่ชาวบ้านคงมองพี่ไม่ดี ว่าไงดี"
    options:
      - text: "ค่าแรงสูงก็จริง แต่คนในตำบลอยู่กับพี่ไปอีกนาน"
        heart: 2
