# ---------------------------------------------------------------------------
# convos — บทคุยโต้ตอบ (ผู้เล่นเลือกคำตอบ ป้าตอบกลับต่างกัน) · ดู README หมวด convos
# topic: react (ป้าทักเองตามเหตุการณ์ ขึ้นก่อนบทอื่น) · news · advice · smalltalk · self · others
# when: heart_min heart_max day_min time(morning/noon/evening) rain flag not_flag has_item fainted_recent
# once: true = เล่นครั้งเดียว · ไม่ใส่ = วนกลับมาได้หลังผ่านไป 7 วัน
# ตัวเลือก: text (ผู้เล่นพูด) heart reply (ป้าตอบ) next (ตัวเลือกรอบต่อไป) take/set_flag
# ตัวแปรผู้เล่น: {p} = ผม/หนู · {k} = ครับ/ค่ะ · {kq} = ครับ/คะ
# ---------------------------------------------------------------------------
convos:
  # ===== ป้าทักเองตามเหตุการณ์ =====
  - id: taew_r_meet
    topic: react
    once: true
    when: { not_flag: met_taew }
    npc: "อ้าว! หลานยายเพียรใช่ไหม ป้าจำได้ ตอนเด็กมาขโมยขนมที่ร้านป้า ตัวแค่นี้เอง… ตอนนี้โตเป็นควายแล้ว"
