  event_company_water:
    - "บ่อหลังร้านป้าแห้งแล้วหลาน สามสิบปีไม่เคยแห้ง ตั้งแต่บริษัทมาเจาะบ่อบาดาลนั่นแหละ"
    - "คุณธนาส่งคนมาซื้อน้ำขวดร้านป้าทีละสิบแพ็ค ก็ดูดน้ำเราไปแล้วยังมาซื้อน้ำเราอีก"
    - "ป้าไม่ได้พูดนะ แต่เขาว่ากันว่าบ้านหมู่สามขายที่ให้บริษัทไปสองแปลงแล้ว"
