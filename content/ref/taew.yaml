        heart: 0
        reply: "ไม่มีก็ไม่มีจ้ะ ป้าแค่จดไว้ในสมุดเฉยๆ… ล้อเล่นๆ ทำหน้าจริงจังเชียว เหมือนยายไม่มีผิด"

