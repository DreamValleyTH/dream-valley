          - text: "{p}ไม่ได้ขโมยนะ ยายบอกว่าป้าแจกเอง"
            heart: 0
            reply: "ยายพูดงั้นเหรอ… เออ ก็คงงั้นแหละ ป้าแก่แล้ว จำสลับกันบ้าง ฮ่าๆ"
      - text: "ขอโทษ{k} จำไม่ค่อยได้"
        heart: 0
        reply: "ไม่เป็นไรจ้ะ ตอนนั้นหลานยังเล็ก ป้าชื่อแต๋ว ร้านชำตรงสามแยกข้างศาลา ขาดอะไรแวะมานะ"
