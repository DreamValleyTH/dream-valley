id: may
name: "เมย์"
role: "นักข่าวอิสระจากกรุงเทพฯ ทำเพจข่าวท้องถิ่น ตามขุดเรื่องบริษัทและการทุจริตในตำบล"
voice: "พูดเร็ว ประชดเก่ง แทนตัวว่าเรา (กับผู้ใหญ่ใช้หนู) ลงท้าย ค่ะ นะ อะ เรียกผู้เล่นว่า {player} ชอบพูดเป็นพาดหัวข่าว ถือมือถืออัดเสียงตลอด งบน้อย กินข้าวเวฟ ใจจริงห่วงชาวบ้านมาก"
dark_humor: true
romanceable: false
lines:
  greet_morning:
    - "อรุณสวัสดิ์ {player} หอกระจายข่าวพยากรณ์ว่าแดดออก แม่นแปดสิบเปอร์เซ็นต์ น่าเชื่อกว่าข่าวในกลุ่ม LINE เยอะ"
    - "เช้าค่ะ เราเพิ่งนั่งร้านกาแฟหน้าตลาดมา ได้ข่าวสามเรื่อง ยืนยันได้ครึ่งเรื่อง"
    - "คนที่นี่ตื่นตีห้าเพื่อทำนา เราตื่นตีห้าเพื่อเช็กว่าเมื่อวานใครโกหก"
    - "ขอโทษที่หน้าโทรมนะ เมื่อคืนถอดเทปสัมภาษณ์นายกฯ สองชั่วโมง ได้ใจความหนึ่งบรรทัด"
    - "รถเมล์ลุงเชิดออกหกโมงตรงเป๊ะเลยเช้านี้ เป็นข่าวดีข่าวเดียวของสัปดาห์"
  greet_noon:
    - "เที่ยงแล้ว กินอะไรยัง เรากินข้าวเวฟร้าน 24 ชม. อีกแล้ว อาหารประจำนักข่าวงบน้อย"
    - "แดดแรงแบบนี้เหมาะกับการไปยืนรอสัมภาษณ์หน้า อบต. ที่ไม่มีใครเดินออกมา"
    - "{player} มาพอดี ช่วยถือมือถือหน่อย ป้ายโครงการใหญ่จนเราต้องถอยหลังสามก้าวถึงจะเข้าเฟรม"
    - "บ่ายนี้จะไปขอดูเอกสารจัดซื้อที่ อบต. คนถือกุญแจตู้เอกสารไปงานบวชมาสามวันแล้ว งานบวชยาวมาก"
    - "ถ้ามีคนใส่เชิ้ตแขนยาวกลางแดดมาถามว่าเห็นเราไหม บอกว่าไม่เห็นนะ"
  greet_evening:
    - "ฟ้าเย็นนี้สวยจนอยากเขียนบทความท่องเที่ยว แต่ที่ขายได้มีแค่ข่าวคนโกง"
    - "หอกระจายข่าวรอบห้าโมงเพิ่งจบ ไมค์หอนสองที ประกาศ อบต. ได้ยินชัดแค่คำว่างบประมาณ"
    - "เย็นนี้เรานั่งใต้ถุนบ้านป้าแต๋ว เป็นสำนักข่าวที่ไวกว่าออฟฟิศเก่าเราที่กรุงเทพฯ อีก"
    - "เลิกงานแล้วเหรอ ดีจัง งานเราไม่มีเลิก มีแต่เดดไลน์เลื่อน"
    - "ส่งต้นฉบับไปสองชิ้น บรรณาธิการตัดเหลือชิ้นครึ่ง ครึ่งที่หายคือครึ่งที่จริงที่สุด"
  greet_night:
    - "ดึกแล้ว รีบกลับนะ ผีออกสามทุ่ม เราอยากสัมภาษณ์ผีมาก แต่ไม่อยากไปตื่นที่ รพ.สต."
    - "เราจะไปนั่งพิมพ์งานที่ร้าน 24 ชม. ตั้มบอกว่าผีมาซื้อของบ่อย เราแค่อยากรู้ว่าจ่ายด้วยอะไร"
    - "กลางคืนตำบลนี้เงียบมาก เงียบจนได้ยินเสียงปั๊มของบริษัทชัดเจน"
    - "เราเช่าผ้ายันต์จากวัดดงเย็นแล้ว ฿99 ถูกกว่าประกันชีวิตนักข่าวที่ไม่มีบริษัทไหนยอมขายให้"
    - "ถ้าเห็นกระบะไม่เปิดไฟวิ่งผ่านตอนดึก อย่าตามไปนะ ผีหรือคนก็ไม่ควรตามทั้งคู่"
  weather_rain:
    - "ฝนตก ถนนลูกรังที่เพิ่งตัดริบบิ้นเดือนก่อนกลายเป็นคลองแล้ว เดี๋ยวไปถ่ายรูปเก็บไว้"
    - "โน้ตบุ๊กเราอยู่ในถุงก๊อบแก๊บสามชั้น ระบบป้องกันข้อมูลระดับตำบล"
    - "ชอบวันฝนตกนะ คนหลบฝนใต้ศาลาเยอะ คุยกันเยอะ ข่าวไหลเยอะ"
    - "ฝนตกบ่อชาวบ้านมีน้ำนิดหน่อย บริษัทจะได้แถลงว่าปัญหาคลี่คลายแล้ว รอดูพรุ่งนี้"
    - "หลังคาห้องเช่ารั่วตรงหัวเตียงพอดี จักรวาลก็คงอยากให้เราตื่นมาทำงาน"
  weather_hot:
    - "ร้อนขนาดนี้ เหงื่อเราไหลเร็วกว่างบกลางปีอีก"
    - "ร้อนจัดระวังลมแดดนะ ถ้าเป็นลมกลางทุ่ง เราจะเขียนข่าวให้แบบสุภาพที่สุด"
    - "มือถือเด้งเตือนว่าเครื่องร้อนเกินไป เราก็ร้อนเกินไปเหมือนกัน แต่ไม่มีใครเตือน"
    - "น้ำแข็งเปล่าร้านป้าแต๋วถุงละห้าบาท ความสุขราคาถูกที่สุดในตำบล"
    - "คนงานไร่บริษัทยืนกลางแดด คุณธนานั่งในรถติดแอร์ ภาพข่าวแบบนี้เขียนตัวเองได้"
  weather_storm:
    - "ไฟดับทั้งตำบล ยกเว้นที่ดินบริษัท สว่างอยู่ที่เดียวเหมือนเป็นคำตอบของอะไรสักอย่าง"
    - "อย่าออกไปไหนถ้าไม่จำเป็นนะ เราออกเพราะข่าวมันจำเป็น ซึ่งก็ไม่ค่อยฉลาด"
    - "หอกระจายข่าววันนี้ได้ยินแต่ ซ่าาา… ยังซื่อสัตย์กว่าการแถลงหลายครั้งที่เราเคยฟัง"
    - "พายุพัดป้ายหาเสียงปลิวเต็มถนน หน้าผู้สมัครจมโคลนทุกคนเท่ากัน ประชาธิปไตยแบบธรรมชาติ"
    - "ฟ้าผ่าจนสัญญาณมือถือหาย เราเลยได้คุยกับคนจริงๆ ทั้งชั่วโมง แปลกดี"
  weather_pm25:
    - "ฝุ่นสีส้มเลยวันนี้ ค่าฝุ่นสูงกว่าคะแนนนิยมของทุกคนในตำบลรวมกัน"
    - "คุณธนาแจกหน้ากากมีโลโก้บริษัท หายใจผ่านโลโก้ทั้งวันก็ได้อารมณ์อีกแบบ"
    - "ทุกปีมีแถลงว่าจะแก้ฝุ่น ทุกปีฝุ่นมาตรงเวลากว่าคำแถลง"
    - "ถ่ายรูปไม่ติดเลย ทั้งตำบลขาวขุ่นอ่านไม่ออก เหมือนเอกสารราชการ"
    - "หมอแอนบอกให้อยู่ในร่ม เราเลยไปสัมภาษณ์คนในร้าน 24 ชม. ตั้มคิดค่าที่เป็นการซื้อขนมคนละถุง"
  season_rainy:
    - "หน้าฝนคือฤดูข่าวน้ำท่วม เราเตรียมรองเท้าบูตกับคำว่า ซ้ำซากทุกปี ไว้แล้ว"
    - "หน้าฝนทุกคนลงนา ไม่มีใครว่างให้สัมภาษณ์ เราเลยไปช่วยถอนกล้า ได้ข่าวสามเรื่อง ปวดหลังหนึ่งเรื่อง"
    - "เข้าพรรษาร้านเหล้าปิดเร็ว แหล่งข่าวเราก็พูดน้อยลงตาม"
    - "ฝนมาทุกปี แต่งบขุดลอกคลองมาแค่ปีเลือกตั้ง น่าสนใจนะ"
    - "หน้าฝนยุงเยอะ ยุงเป็นแหล่งข่าวเดียวในตำบลที่กัดทุกฝ่ายเท่ากัน"
  season_cool:
    - "เช้าๆ หมอกลงทุ่งสวยจนเราลืมไปแป๊บนึงว่ามาทำข่าวเรื่องที่ดิน"
    - "หน้าหนาวคือฤดูงานวัด งานกาชาด และป้ายผู้สนับสนุน เราชอบนับว่าป้ายไหนใหญ่กว่าเวที"
    - "หลังเกี่ยวข้าว ทุ่งโล่งจนเห็นหมุดรังวัดใหม่เต็มไปหมด ไม่มีใครรู้ว่าใครปัก แต่ทุกคนรู้"
    - "ยายจันทร์สอนเผาข้าวหลามงานกำฟ้า เราเผาไหม้ไปสองกระบอก ยายบอกว่าใจร้อนเหมือนคนเขียนข่าว"
    - "หนาวแล้ว ซื้อผ้าห่มที่ตลาดนัดผืนละร้อยห้าสิบ ลายเป็ดสีชมพู ไม่ต้องแซวนะ"
  season_dry:
    - "หน้าแล้ง บ่อชาวบ้านแห้ง บ่อบริษัทไม่แห้ง วิทยาศาสตร์นี่น่าอัศจรรย์จริงๆ"
    - "คลองแห้งจนเห็นรถเข็นจมอยู่ก้นคลอง มีคนบอกว่าเป็นของโครงการขุดลอกปีก่อน"
    - "สงกรานต์ใกล้แล้ว ทุกบ้านจะมีรถป้ายกรุงเทพฯ เราจะได้ถามคนที่ย้ายออกไปว่าทำไมถึงไป"
    - "ข่าวไฟไหม้ไร่เยอะมาก ถามว่าใครเผา ทุกคนชี้ไปทางเดียวกัน คือทางลม"
    - "งานบุญกลางบ้าน ผ้าป่า งานบวชหมู่ กลุ่ม LINE เด้งไม่หยุด เราปิดเสียงไม่ได้ อาชีพมันบังคับ"
  heart_low:
    - "สวัสดี เมย์ค่ะ นักข่าวอิสระ ถ้าเห็นอะไรแปลกๆ ในตำบล บอกได้นะ ไม่ใส่ชื่อ"
    - "คนแถวนี้เห็นเราแล้วเดินหลบ เข้าใจได้ คนถือไมค์ไม่ค่อยเอาข่าวดีมาฝาก"
    - "ไม่ต้องกลัว เราไม่ได้อัดเสียงอยู่… อ้ะ ลืมปิด"
    - "{player} เพิ่งย้ายกลับมาใช่ไหม คนกลับบ้านเกิดเป็นข่าวดีที่หายากที่สุดในประเทศนี้"
    - "ว่างเมื่อไหร่ เล่าให้ฟังหน่อยว่าตำบลเมื่อสิบปีก่อนเป็นยังไง เราอยากรู้ว่าอะไรหายไปบ้าง"
  heart_mid:
    - "{player} เป็นคนแรกในตำบลที่ตอบคำถามเราโดยไม่ถามกลับว่าจะลงชื่อไหม"
    - "เราได้ค่าเรื่องละ 1,500 ค่าน้ำมันไปอำเภอก็หายไปครึ่งแล้ว ดีที่อุดมการณ์ไม่ต้องเติมน้ำมัน"
    - "บางวันอยากเขียนข่าวดีบ้าง เช่นยายบัวรักษาเด็กหายไข้ แต่ข่าวแบบนั้นไม่มีใครคลิก"
    - "พี่หน่อยแอบใส่ไข่ในก๋วยเตี๋ยวให้ฟรี บอกว่าคนที่กล้าถามต้องกินเยอะๆ เราเกือบร้องไห้กลางร้าน"
    - "คุยกับ {player} แล้วเราไม่ต้องจดอะไรเลย ไม่ค่อยมีใครทำให้รู้สึกแบบนี้"
  heart_high:
    - "เราเคยอยู่สำนักข่าวใหญ่นะ ข่าวโดนถอดเพราะสปอนเซอร์ไม่ชอบ เลยออกมาเป็นอิสระ อิสระแบบไม่มีประกันสังคม"
    - "พ่อเราเป็นชาวนาอีกจังหวัด ที่นาโดนยึดเพราะหนี้ ตอนนั้นไม่มีนักข่าวสักคนมาถาม เราเลยมาถามแทน"
    - "บางคืนเราก็กลัวนะ จดหมายเตือนจากทนายบริษัทเขียนสุภาพมาก สุภาพจนน่ากลัวกว่าคำด่า"
    - "ถ้าวันหนึ่งเราเลิกทำข่าว อย่าคิดว่าเราหมดไฟนะ แปลว่าค่าเช่าห้องชนะอุดมการณ์ไปหนึ่งยก"
    - "เราไม่ได้อยากให้ตำบลนี้เป็นข่าวหรอก อยากให้มันไม่ต้องเป็นข่าวต่างหาก"
  topic_news:
    - "งบซ่อมถนนหมู่ 4 ผ่านสภามาสามรอบในสามปี หลุมยังเป็นหลุมเดิม หลุมที่แพงที่สุดในจังหวัดแล้วมั้ง"
    - "บริษัทเพิ่งจดทะเบียนบริษัทลูกในอำเภออีกสองแห่ง ชื่อเพราะมาก มีคำว่าเขียวกับยั่งยืนทั้งคู่"
    - "โครงการใหม่ขอสำเนาบัตรรับรองสามชุด ระบบออนไลน์ล่มวันแรก ข่าวนี้ไม่ใหม่ แค่ซ้ำทุกโครงการ"
    - "บ่อบ้านตาเผือกแห้งเป็นบ้านที่สิบสองแล้ว เราทำแผนที่ไว้ บ่อแห้งเรียงเป็นเส้นตรงไปหาที่ดินบริษัทพอดี"
    - "วัดเจริญทรัพย์มหามงคลในอำเภอออกวัตถุมงคลรุ่นใหม่ จองผ่านแอป ผ่อนได้สิบงวด เราไม่ได้แต่งนะ"
  topic_advice:
    - "ก่อนเซ็นอะไรก็ตาม ถ่ายรูปเก็บไว้ทุกหน้า วันที่มีเรื่อง เอกสารจะพูดแทนเราได้"
    - "เจอโพสต์ในกลุ่ม LINE ที่มีคำว่าแชร์ด่วน ถามหมอแอนก่อน ถ้าช่วยแก้ข่าวปลอมได้ หมอแอนจะไว้ใจ {player} มากขึ้นด้วย"
    - "ขายข้าวให้ฟังราคาพรุ่งนี้จากหอกระจายข่าวห้าโมงเย็นก่อน ลานเสี่ยเฮงหักความชื้นตามอารมณ์ สหกรณ์ของกล้าหักตามเครื่องวัด"
    - "เครื่องชั่งบริษัทขาด 3–5% ประจำ ฝีมือค้าขายถึงเลเวลหกเมื่อไหร่ ขอชั่งซ้ำได้ เรามีสถิติให้ดู"
    - "อยากรู้ว่าใครพูดจริง ฟังว่าใครพูดเป็นตัวเลข ใครพูดเป็นภาพรวม"
    - "ถ้าวันหนึ่งลงสมัครอะไร อย่ารับซอง เราสืบเจอทุกครั้ง และเราไม่ใช่คนเดียวที่สืบ"
  topic_smalltalk:
    - "เราเคยซื้อหวยใบละร้อยครั้งเดียว ไม่ถูก เลยเขียนบทความเรื่องความน่าจะเป็นแทน คนอ่านน้อยกว่าคนซื้อหวยอีก"
    - "ควายของตาเผือกจ้องเราทุกครั้งที่เดินผ่าน เราว่ามันรู้อะไรบางอย่าง"
    - "มีคนส่งสติกเกอร์สวัสดีวันจันทร์ในกลุ่มตอนวันพฤหัส เราไม่กล้าทัก เขาอาจอยู่อีกมิติหนึ่ง"
    - "หอกระจายข่าวเปิดเพลงเดิมก่อนประกาศมาสามปี เรานับแล้ว ราวสองพันรอบ"
    - "อยากเลี้ยงแมวนะ แต่ห้องเช่าห้ามสัตว์ ห้ามเสียงดัง ห้ามนักข่าว ข้อสุดท้ายเจ้าของเพิ่งเขียนเพิ่ม"
  topic_about_self:
    - "เราทำเพจข่าวท้องถิ่นเล็กๆ ผู้ติดตามแปดพันคน ครึ่งหนึ่งเป็นคนที่เราเคยเขียนถึง"
    - "เราจบนิเทศฯ เพื่อนร่วมรุ่นไปทำโฆษณากันหมด บางคนทำโฆษณาให้บริษัทของคุณธนาด้วย"
    - "มาอยู่ตำบลนี้แปดเดือนแล้ว ตั้งใจมาทำข่าวชิ้นเดียว ตอนนี้ยาวกว่าละครหลังข่าวแล้ว"
    - "มอเตอร์ไซค์เราไมล์สามแสน ซ่อมกับบอลบ่อยจนบอลเรียกมันว่าลูกค้า VIP"
    - "เราเชื่อว่าข่าวที่ดีคือข่าวที่ทำให้คนตัวเล็กนอนหลับ แล้วคนตัวใหญ่นอนไม่หลับ"
  topic_about_others:
    - "นายกฯ วิชัยตอบคำถามเราเก้านาที ไม่มีคำนามสักคำ เป็นทักษะที่ควรศึกษาทางวิชาการ"
    - "เสี่ยเฮงให้สัมภาษณ์ง่ายมาก ตราบใดที่ไม่ถามเรื่องดอกเบี้ย ความชื้น หรือเงิน ซึ่งก็คือทุกเรื่อง"
    - "กล้าเป็นแหล่งข่าวที่ดีที่สุด แต่พูดยาวจนต้องเปลี่ยนถ่านเครื่องอัดเสียงกลางคัน"
    - "ดาบเสถียรรับเรื่องที่เราแจ้งว่ามีรถตามแล้ว ลงบันทึกว่าเรื่องเล็กน้อย รอดูท่าที ท่าทีของใครก็ไม่รู้"
    - "หมอแอนเป็นพันธมิตรเรา หมอแก้ข่าวปลอม เราขุดข่าวจริง ตำบลนี้ต้องการทั้งสองอย่าง"
    - "คุณธนาสุภาพมากนะ สุภาพจนเราไม่เคยได้คำตอบตรงๆ สักครั้ง"
  gossip_theft:
    - "ข่าวว่า {player} ขโมยของ ต้นทางคือบัญชีชื่อ คนดีประจำตำบล ในกลุ่ม LINE ถ้าอยากให้ตรวจสอบ บอกได้นะ"
    - "ถ้าจริงเราผิดหวัง ถ้าไม่จริงเราจะหาให้เจอว่าใครปล่อย ทั้งสองแบบเราเขียนได้"
    - "ขโมยของชาวบ้านเป็นข่าวในตำบล ขโมยที่ดินชาวบ้านเป็นนโยบาย เราแค่สังเกตเฉยๆ"
  gossip_cheating:
    - "เรื่องหัวใจไม่ใช่สายข่าวเรานะ แต่ทั้งตำบลก็ส่งข้อความมาเล่าให้เราอยู่ดี"
    - "คบซ้อนก็เหมือนรับซองสองฝ่ายตอนเลือกตั้ง สุดท้ายมีคนนับคะแนนเสมอ"
    - "เราไม่เขียนเรื่องนี้หรอก ป้าแต๋วตีพิมพ์ไปแล้ว ด้วยปาก"
  gossip_unpaid_bill:
    - "ค้างค่าไฟเหรอ ไม่เป็นไร ทั้งประเทศก็ค้างอะไรสักอย่างกันทั้งนั้น"
    - "ถ้าโดนตัดไฟ มานั่งพิมพ์งานที่ร้าน 24 ชม. กับเราได้ ตั้มไม่ไล่ ถ้าซื้อน้ำสักขวด"
    - "จ่ายก่อนวันที่ 15 นะ เราเคยโดนตัดไฟตอนกำลังส่งต้นฉบับ บทความนั้นเลยจบห้วนกว่าที่ตั้งใจ"
  gossip_small_envelope:
    - "ใส่ซองน้อยโดนนินทาทั้งกลุ่ม แต่คนรับซองโครงการหลักล้านไม่มีใครพูดถึง ตำบลนี้นับเลขผิดหลัก"
    - "เราใส่ซองงานแต่งเพื่อนร้อยเดียว แล้วเขียนการ์ดยาวสองหน้าแทน ไม่รู้ว่าช่วยหรือแย่ลง"
    - "อย่าคิดมาก สมุดจดซองของเจ้าภาพคือฐานข้อมูลที่ละเอียดที่สุดในตำบลอยู่แล้ว"
  gossip_skip_longkhaek:
    - "ไม่ไปลงแขกคืนเหรอ ในสายตาชาวบ้าน อันนี้ร้ายกว่าข่าวทุจริตอีกนะ เราพูดจริง"
    - "ลงแขกคือระบบสวัสดิการเดียวในตำบลที่ไม่ต้องใช้สำเนาบัตรประชาชน อย่าทำให้มันพังเลย"
    - "เราไปลงแขกแทน {player} ไม่ได้นะ เราเกี่ยวข้าวทีไร ข้าวร้องไห้"
  player_fainted:
    - "ได้ยินว่าเมื่อคืนไปตื่นที่ รพ.สต. เป็นไงบ้าง ผีหรือคนทำ ถามในฐานะนักข่าวและในฐานะคนห่วง"
    - "ค่ารักษาสิบเปอร์เซ็นต์ของเงินที่มี ระบบนี้ก้าวหน้ากว่าภาษีบางตัวในประเทศอีก"
    - "คราวหน้าไม่ทันกลับบ้าน วิ่งไปวัดหรือร้าน 24 ชม. นะ เราสัมภาษณ์คนรอดมาหลายคน ทุกคนพูดเหมือนกัน"
  player_new_vehicle:
    - "รถใหม่เหรอ ยินดีด้วย ว่างๆ พาไปอำเภอหน่อยได้ไหม รถเมล์เที่ยวสุดท้ายหกโมงเย็น แต่ข่าวไม่เลิกหกโมง"
    - "สวยดี ขับระวังหลุมบนถนนงบสามรอบด้วยนะ ล้อจะได้ไม่ต้องมาเป็นพยาน"
    - "ขอถ่ายรูปรถคู่กับถนนหน่อย จะทำสกู๊ป สิ่งที่ใหม่กว่าถนนในตำบล"
  player_lottery_win:
    - "ถูกหวยเหรอ ยินดีด้วย เราไม่เขียนข่าวหรอก ญาติที่ไม่เคยรู้จักจะโทรมาเองอยู่แล้ว"
    - "ระวังนะ คนถูกหวยในตำบลนี้ ภายในเจ็ดวันจะมีคนมาเสนอซื้อที่ดิน เราเก็บสถิติไว้"
    - "ยินดีด้วยจริงๆ อย่างน้อยก็มีเงินในตำบลไหลขึ้นบ้าง ไม่ได้ไหลลงอย่างเดียว"
  player_muddy:
    - "ขอถ่ายรูปหน่อย จะใช้เป็นภาพประกอบเกษตรกรตัวจริง ไม่ใช่เกษตรกรในโบรชัวร์"
    - "โคลนนี่ล้างออกง่ายกว่าคราบบางอย่างที่เราเขียนถึงนะ"
    - "ตกคันนามาเหรอ ไม่ต้องอาย เราเคยตกคูน้ำหน้า อบต. ตอนวิ่งตามนายกฯ"
  player_rich:
    - "ได้ข่าวว่า {player} ไปได้สวย ขอถามแบบนักข่าวหน่อย มาจากผลผลิตหรือจากสัญญา"
    - "คนในตำบลรวยขึ้นได้โดยไม่ต้องขายที่ดิน เป็นข่าวที่เราอยากเขียนที่สุด"
    - "รวยแล้วจำไว้นะ คนรวยในตำบลสืบง่ายที่สุด เพราะทุกคนอยากเล่า"
  player_in_debt:
    - "หนี้ครัวเรือนเกษตรกรเป็นสถิติที่เราเขียนทุกปี ปีนี้ {player} ช่วยให้ตัวเลขสมจริงขึ้น ไม่ต้องอายนะ"
    - "อย่าไปกู้นอกระบบถ้าเลี่ยงได้ ธนาคารเพื่อเกษตรกรช้ากว่า แต่ไม่ส่งคนมาเคาะประตู"
    - "ระวังนะ ช่วงที่คนมีหนี้ คือช่วงที่บริษัทใจดีที่สุด"
  player_sick:
    - "ป่วยไป รพ.สต. ใช้บัตรทองฟรีนะ คลินิกในอำเภอจ่ายแพงแล้วได้แค่รอเร็วขึ้น"
    - "หายไวๆ นะ เราอยากให้หายมากกว่าอยากได้ข่าวอีก ซึ่งปกติไม่มีอะไรชนะเรื่องข่าวได้"
    - "เภสัชกรมดบอกว่ายาที่ดีที่สุดคือพักผ่อน เราจดไว้แล้ว ยังไม่เคยทำเลย"
  player_married:
    - "แต่งงานแล้วเหรอ ยินดีด้วย เป็นข่าวดีที่ไม่ต้องตรวจสอบข้อเท็จจริง"
    - "เราใส่ซองให้แล้วนะ บอกไว้ก่อนว่าน้อย แต่ความตั้งใจเต็มหน้ากระดาษ"
    - "เห็นคุณธนาส่งกระเช้าไปให้ด้วย อ่านการ์ดในกระเช้าให้ละเอียดนะ"
  event_disaster:
    - "ภัยมาทีไร ป้ายช่วยเหลือขึ้นก่อนของช่วยเหลือทุกที รอบนี้เราจับเวลาได้ห่างกันสองวัน"
    - "ถ่ายรูปความเสียหายเก็บไว้นะ ประกันพืชผลกับเงินเยียวยาชอบขอหลักฐานที่ไม่มีใครถ่ายทัน"
    - "เราไปช่วยแพ็กถุงยังชีพที่วัดดงเย็นมา พระอาจารย์สุเมธจัดระบบได้ดีกว่าหน่วยงานไหนในอำเภอ"
  event_election:
    - "ช่วงเลือกตั้งโครงการผุดเหมือนเห็ดหน้าฝน แต่เห็ดยังอยู่นานกว่า"
    - "คืนก่อนเลือกตั้งหมาหอนทั้งตำบล ไม่ใช่เพราะผีนะ"
    - "บัญชี รักบ้านเกิด99 ในกลุ่ม LINE สมัครเมื่อวาน โพสต์ไปห้าสิบโพสต์แล้ว ขยันกว่าผู้สมัครตัวจริงอีก"
    - "เราไม่บอกหรอกว่าเลือกใคร แต่บอกได้ว่าใครไม่ตอบคำถามเรา รายชื่อยาวกว่าบัตรเลือกตั้ง"
  event_company_water:
    - "บริษัทบอกว่าแค่บริหารน้ำใต้ดินให้มีประสิทธิภาพ ประสิทธิภาพสูงจนบ่อชาวบ้านแห้งเร็วขึ้นสองเท่า"
    - "เราขอข้อมูลระดับน้ำจากบริษัทไปสามครั้ง ได้รูปต้นไม้กลับมาสามรูป"
    - "ถ้าบ่อที่บ้าน {player} แห้ง ช่วยจดวันที่ไว้ให้เราด้วยนะ ทุกวันที่สำคัญหมด"
    - "นักวิชาการที่บริษัทจ้างมาสรุปว่าบ่อแห้งเพราะธรรมชาติ ธรรมชาติคงเซ็นสัญญาจ้างด้วยแล้วมั้ง"
  event_festival_near:
    - "งาน{festival}ใกล้แล้ว เราจะไปถ่ายบรรยากาศ แล้วนับป้ายสปอนเซอร์ไปด้วย"
    - "{festival}ปีนี้บริษัทเป็นสปอนเซอร์หลัก ปีที่แล้วยังไม่ใช่ ปีหน้าอาจเป็นเจ้าของงาน"
    - "ไปงาน{festival}ด้วยกันไหม คืนเทศกาลไม่มีผี เราจะได้เดินกลับห้องเช่าแบบไม่ต้องวิ่ง"
  gift_love:
    - "{item}! ให้เราจริงเหรอ นี่คือเรื่องดีที่สุดของสัปดาห์ และเราตรวจสอบแล้ว"
    - "ขอบคุณมากนะ {player} นักข่าวงบน้อยได้ของแบบนี้ เหมือนได้ทุนวิจัย"
    - "อันนี้ของโปรดเราเลย แหล่งข่าวทั้งหมดของเราไม่เคยรู้เรื่องนี้ {player} รู้ได้ไง"
  gift_like:
    - "ขอบคุณนะ {item}ใช้ได้เลย ไม่มีเงื่อนไขแอบแฝงใช่ไหม ขอโทษ เคยชินกับการถาม"
    - "น่ารักจัง เราจะกินตอนถอดเทป ช่วงที่นายกฯ พูดวนรอบที่สี่"
    - "ขอบคุณค่ะ ของขวัญแบบนี้ไม่ต้องแจ้งบัญชีทรัพย์สิน ดีจัง"
  gift_neutral:
    - "อ้อ ขอบคุณนะ เดี๋ยวเก็บไว้"
    - "{item}เหรอ ได้ ขอบคุณที่นึกถึง"
    - "ขอบคุณค่ะ เราจะบันทึกว่าได้รับของจากแหล่งข่าว มูลค่าไม่มีผลต่อการทำข่าว"
  gift_dislike:
    - "อ่า {item}… ขอบคุณนะ เราจะหาคนที่ชอบมันมากกว่าเรา"
    - "เราถือว่าเป็นความตั้งใจดีนะ ความตั้งใจดีบางทีก็เหมือนโครงการรัฐ"
    - "ขอบคุณค่ะ แต่ไม่ใช่ทางเราจริงๆ"
  gift_hate:
    - "นี่ล้อเล่นใช่ไหม ถ้าไม่ได้ล้อเล่น เราจะเขียนถึงนะ"
    - "เราไม่รับนะ ถ้ารูปตอนรับหลุดไปในกลุ่ม LINE อาชีพเราจบ"
    - "{item}… {player} กำลังทดสอบจรรยาบรรณเราอยู่หรือเปล่า"
  birthday:
    - "จำวันเกิดเราได้ด้วย ปกติมีแต่ธนาคารที่จำ แล้วส่ง SMS ขายประกันมาอวยพร"
    - "ขอบคุณนะ วันเกิดปีนี้ไม่มีเดดไลน์ เป็นของขวัญที่ดีที่สุดแล้ว ยกเว้นของ {player}"
    - "อายุเพิ่มอีกปี อุดมการณ์เท่าเดิม ค่าเรื่องก็เท่าเดิม"
  rare:
    - "เราเคยเกือบรับงานเขียนข่าวประชาสัมพันธ์ให้บริษัทคุณธนา ค่าจ้างเท่าเราทำงานสามปี เราปฏิเสธ แล้วกินบะหมี่ซองทั้งเดือน"
    - "กระปุกหมูในห้องเรามีเงิน 340 บาท กับแฟลชไดรฟ์อีกหนึ่งอัน อันหลังมีค่ามากกว่า"
    - "ยายบัวเคยดูดวงให้ บอกว่าเราจะเขียนเรื่องที่เปลี่ยนตำบลได้ แล้วก็บอกให้กินข้าวให้ตรงเวลา ข้อหลังยากกว่า"
    - "เรามีโฟลเดอร์ชื่อ ยังไม่ถึงเวลา เก็บข่าวที่เขียนเสร็จแต่ไม่ได้ส่ง มันหนาขึ้นทุกเดือน"
    - "พ่อโทรมาถามว่าเมื่อไหร่จะได้งานประจำ เราตอบว่าข่าวมันประจำอยู่แล้ว ไม่เคยหยุดเลย"
