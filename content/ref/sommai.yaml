id: sommai
name: "ลุงสมหมาย"
role: "เจ้าของรถเกี่ยวข้าวคันเดียวของหมู่ 4 คอหวยตัวยง สามีป้าพร"
voice: "เสียงดัง อารมณ์ดี เรียกผู้เล่นว่า หลาน ลงท้าย นะหลาน เว้ย วะ ครับ ทุกเรื่องวกกลับมาเป็นเลขหวยได้ เลขทุกงวดมีที่มาเสมอ เช่น ควายจาม จิ้งจกร้อง ทะเบียนรถเมล์ลุงเชิด"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "อ้าว {player} ตื่นเช้าเหมือนกันนี่ ลุงตื่นตีห้ามาจดเลขทะเบียนรถเมล์ลุงเชิดก่อนออก"
    - "หอกระจายข่าวเพิ่งประกาศเรื่องวัคซีนหมา ลุงฟังผิดเป็นเลขเด็ดซะงั้น จดไว้แล้วด้วย"
    - "เช้านี้ไอ้ด่างควายลุงมันจามสองที สองที! หลานจำไว้ เลขสองต้องมา"
    - "กาแฟโอเลี้ยงร้านป้าแต๋วแก้วละสิบห้า ลุงกินทุกเช้า กินมาตั้งแต่โอเลี้ยงแก้วละห้าบาท"
    - "ไปไหนแต่เช้าหลาน ถ้าไปตลาดนัดฝากดูหน่อยว่าเจ๊หงษ์แต่งชุดสีอะไร ลุงจะเอามาตีเลข"
    - "อรุณสวัสดิ์หลาน ป้าพรยังไม่ตื่น ลุงเลยได้คุยเรื่องหวยแบบไม่โดนค้อน"
  greet_noon:
    - "เที่ยงแล้ว กินข้าวยังหลาน ลุงเพิ่งกินข้าวเวฟร้าน 24 ชม. ราคาเท่าเลขท้ายเมื่องวดก่อนเลย"
    - "แดดเที่ยงอย่างนี้ลุงไม่ออกรถเกี่ยวหรอก เครื่องร้อน คนขับก็ร้อน"
    - "พักเที่ยงอยู่ใต้ต้นมะขามนี่แหละ ลมดีกว่าแอร์ห้างในอำเภออีก"
    - "หลานมาพอดี ลุงกำลังนับว่าจิ้งจกในเถียงนาร้องกี่ที ร้องเจ็ด... หรือแปดวะ"
    - "บ่ายนี้ลุงต้องไปเปลี่ยนสายพานรถเกี่ยวที่ร้านบอล ค่าอะไหล่แพงกว่าหวยงวดหนึ่งอีก"
  greet_evening:
    - "เย็นแล้วหลาน ไปฟังหอกระจายข่าวห้าโมงกัน เผื่อผู้ใหญ่ประกาศเลขอะไรหลุดมา"
    - "พระอาทิตย์ตกสวยนะ สีส้มๆ อย่างนี้ลุงว่าเลขเก้า ไม่รู้ทำไมแต่รู้สึกเก้า"
    - "กลับจากนาเหนื่อยๆ ได้ถั่วลิสงคั่วสักกำ นั่งดูข่าวรางวัลที่หนึ่งย้อนหลัง สุขของลุงละ"
    - "ป้าพรเรียกกินข้าวแล้ว คืนนี้แกงส้มผักรวม ลุงจะนับว่ามีผักกี่ชิ้น"
    - "หลานรีบทำงานให้เสร็จนะ อีกเดี๋ยวฟ้ามืด ลุงไม่อยากเห็นใครนอนกลางทุ่งอีก"
  greet_night:
    - "สองทุ่มกว่าแล้วหลาน ผีจะออกตอนสามทุ่ม รีบกลับเถอะ ลุงก็จะเข้าบ้านละ"
    - "หมาหอนแล้วนั่น! หลานจำไว้ หมาหอนกี่ทีลุงจะเอาไปแทงงวดหน้า แต่ตอนนี้วิ่งก่อน"
    - "ดึกแล้วยังเดินอยู่อีก ถ้าไม่ทันกลับบ้านก็แวะร้าน 24 ชม. หรือเข้าเขตวัดไปเลย"
    - "ลุงเคยฝันว่าผีให้เลข ตื่นมาจำได้แค่ตัวเดียว ตัวที่เหลือผีเอาคืนไปหมด"
    - "ถ้าจะเดินกลางคืนเช่าสายสิญจน์ที่วัดไว้สักเส้น สี่สิบเก้าบาทเอง ถูกกว่าค่ารักษา รพ.สต. เยอะ"
  weather_rain:
    - "ฝนตกแบบนี้รถเกี่ยวลงนาไม่ได้ ล้อจม ลุงเลยมีเวลานั่งศึกษาสถิติหวยเต็มที่"
    - "ฝนมาแล้วหลาน ข้าวที่ตากไว้ที่ลานใครยังไม่เก็บ เดี๋ยวเสี่ยเฮงหักความชื้นยับ"
    - "ฟ้าร้องสามที ลุงนับแล้ว... อ้าว สี่ที ฟ้าเปลี่ยนเลขกลางคันได้ไงวะ"
    - "ฝนตกหลังคาสังกะสีบ้านลุงดังเหมือนเครื่องออกรางวัล ฟังแล้วใจเต้น"
  weather_hot:
    - "ร้อนจนควายไม่ยอมขึ้นจากปลัก ลุงก็อยากลงไปนอนกับมันเหมือนกัน"
    - "ร้อนอย่างนี้ใส่หมวกปีกกว้างนะหลาน ปีที่แล้วลุงเป็นลมแดดกลางนา ตื่นมาเจอหมอแอนดุ"
    - "แดดแรงขนาดนี้ น้ำมันในถังรถเกี่ยวยังเหมือนจะเดือด"
    - "อากาศร้อนแบบนี้ พรุ่งนี้หวยออก ใจลุงร้อนกว่าแดดอีก"
  weather_storm:
    - "พายุเข้า! หลานรีบผูกหลังคาเล้าไก่ให้แน่น ลุงต้องไปคลุมผ้าใบรถเกี่ยวก่อน"
    - "ลมแรงจนป้ายหน้าร้านปุ๋ยเสี่ยเฮงปลิว ลุงอยากเห็นหน้าเสี่ยตอนนี้จัง"
    - "พายุมาทีข้าวล้มทั้งแปลง รถเกี่ยวเกี่ยวยากขึ้นเท่าตัว ค่าจ้างลุงไม่ขึ้นนะหลาน ลุงไม่ใจร้าย"
    - "อยู่ในบ้านเถอะหลาน วันนี้ไม่ใช่วันทำนา วันนี้วันนั่งรอให้ฟ้าเลิกโกรธ"
  weather_pm25:
    - "ฝุ่นตลบเลยหลาน ใส่หน้ากากด้วย รพ.สต. แจกฟรี หมอแอนบอก"
    - "ไร่อ้อยแถวนอกตำบลเผาอีกแล้ว ลุงไม่เผาตอซังนะ ลุงไถกลบ ป้าพรบังคับ"
    - "ฝุ่นหนาจนมองไม่เห็นป้ายทะเบียนรถลุงเชิด เสียเลขไปหนึ่งเช้าเต็มๆ"
  season_rainy:
    - "หน้าฝนมาแล้ว ชาวนาเริ่มหว่านกล้า ส่วนลุงเริ่มซ่อมรถเกี่ยวรอหน้าเก็บเกี่ยว"
    - "หน้าฝนนาเขียวทั้งทุ่ง ลุงชอบช่วงนี้ เงินยังไม่มา แต่ความหวังมาเต็ม"
    - "หน้าฝนกบออกเยอะ เด็กๆ ไปส่องกบกัน ลุงไปนับว่ากบร้องกี่ตัว"
    - "ช่วงนี้ปักดำกันทั้งหมู่บ้าน หลานได้กล้าครบหรือยัง ขาดเหลือไปขอกล้าได้นะ"
  season_cool:
    - "หน้าหนาวหน้าเกี่ยวข้าว คิวรถเกี่ยวลุงยาวถึงหลังบ้านป้าแต๋ว หลานจองยัง"
    - "ลมหนาวมาแล้ว ข้าวเหลืองทั้งทุ่ง หอมฟางไปทั้งตำบล หอมเหมือนเงิน"
    - "หน้าหนาวลุงตื่นตีสี่ไปติดเครื่องรถเกี่ยว เครื่องก็หนาว คนก็หนาว ป้าพรอุ่นอยู่ในมุ้งคนเดียว"
    - "งานกาชาดอำเภอมาแล้ว ลุงไปสอยดาวทุกปี ได้แต่ขันน้ำพลาสติก บ้านลุงมีขันสิบสามใบแล้ว"
  season_dry:
    - "หน้าแล้งนาปรังต้องพึ่งน้ำชลประทาน ถ้าน้ำไม่มา รถเกี่ยวลุงก็จอดตากแดดเฉยๆ"
    - "หน้าแล้งงานน้อย ลุงรับจ้างขนฟางอัดก้อนแทน ก้อนละไม่กี่บาท แต่ดีกว่าว่าง"
    - "สงกรานต์ใกล้มาแล้ว ลุงจะไปรดน้ำดำหัวกำนัน แล้วแอบถามว่าปีนี้ฝันเห็นเลขอะไรไหม"
    - "แล้งอย่างนี้บ่อบาดาลที่บ้านลุงสูบแล้วได้แต่ลม ไม่รู้น้ำหายไปไหน"
  heart_low:
    - "อ้อ หลานบ้านที่พ่อแม่ย้ายไปใช่ไหม ลุงจำได้ ตอนเด็กหลานวิ่งเล่นในลานตากข้าวลุง"
    - "สวัสดีหลาน ถ้าจะจ้างรถเกี่ยวมาบอกลุงนะ ไร่ละห้าร้อยห้าสิบ ราคาเพื่อนบ้าน"
    - "ลุงยุ่งนิดหน่อยหลาน กำลังเช็กเลขในกลุ่ม LINE หมู่บ้าน ไว้คุยกันนะ"
    - "เห็นหลานทำนาเองแล้วนึกถึงตัวเองตอนหนุ่ม ตอนนั้นยังไม่มีรถเกี่ยว มีแต่เคียวกับหลังที่ยังไม่ปวด"
  heart_mid:
    - "หลานนี่ขยันนะ ลุงเห็นไฟบ้านหลานเปิดตั้งแต่ตีห้า แต่ลุงไม่ได้แอบดูนะ ลุงตื่นมาจดเลข"
    - "มานั่งก่อนหลาน ลุงมีน้ำตะไคร้ป้าพรต้มไว้ ป้าบอกให้ลุงกินแทนเครื่องดื่มชูกำลัง"
    - "หลานรู้ไหม ไอ้ด่างควายลุงมันอายุมากกว่าหลานอีกนะ ยังแข็งแรงกว่าลุงซะอีก"
    - "ถ้าหน้าเกี่ยวคิวลุงเต็ม ลุงจะแทรกให้หลานก่อน ห้ามบอกใคร โดยเฉพาะป้าแต๋ว"
    - "เดี๋ยวงวดนี้ลุงถูก จะเลี้ยงก๋วยเตี๋ยวพี่หน่อยหลานชามพิเศษ สัญญา ลุงสัญญามายี่สิบปีแล้ว"
  heart_high:
    - "บอกจริงๆ นะหลาน รถเกี่ยวคันนี้ลุงผ่อนสิบปีเพิ่งหมด วันที่ผ่อนงวดสุดท้ายลุงนั่งร้องไห้ในห้องเครื่อง"
    - "ลุงซื้อหวยไม่ใช่เพราะอยากรวยหรอก ลุงซื้อความหวังครึ่งเดือน ร้อยบาทได้ฝันตั้งสิบห้าวัน"
    - "ลูกชายลุงทำงานโรงงานที่ระยอง โทรมาเดือนละครั้ง ทุกครั้งถามแต่ว่าพ่อยังซื้อหวยอยู่ไหม"
    - "ป้าพรบ่นลุงทุกวัน แต่ตอนลุงป่วย ป้านั่งเฝ้าที่ รพ.อำเภอทั้งคืน ลุงเลยยอมให้บ่นตลอดชีวิต"
    - "ลุงกลัวอย่างเดียวหลาน กลัวว่าหมดรุ่นลุงแล้วนาแถวนี้จะไม่มีใครทำ เหลือแต่รั้วบริษัท"
  topic_news:
    - "งวดหน้าวันที่หนึ่งนะหลาน ลุงได้เลขมาสามชุดแล้ว ชุดแรกจากควาย ชุดสองจากจิ้งจก ชุดสามจากความรู้สึก"
    - "ข่าวใหญ่ ลานรับซื้อเสี่ยเฮงหักความชื้นยี่สิบเปอร์เซ็นต์ ข้าวลุงตากสามแดดยังโดนหัก"
    - "ได้ยินว่าสหกรณ์ของกล้ารับซื้อข้าวราคาตลาดแล้ว ไม่หักโหดเท่าลานเสี่ย แต่จ่ายช้ากว่านิด"
    - "ในกลุ่ม LINE หมู่บ้านเมื่อคืนมีคนส่งเลขเด็ดมายี่สิบชุด ไม่มีชุดไหนซ้ำกันเลย ลุงซื้อไปห้าชุด"
    - "บริษัทของคุณธนามาวัดที่ข้างนาลุงอีกแล้ว มีหมุดสีแดงปักไว้ ลุงไม่รู้ว่าวัดอะไร"
  topic_advice:
    - "จะจ้างรถเกี่ยวต้องจองตั้งแต่ข้าวเริ่มเหลือง หน้าเกี่ยวคิวยาว ช้าไปสองสามวันข้าวร่วงหมดนะหลาน"
    - "ค่าจ้างลุงไร่ละห้าร้อยห้าสิบถ้าไม่เกินห้าไร่ เกินสิบห้าไร่เหลือสี่ร้อยห้าสิบ นามากเกี่ยวทีเดียวคุ้มกว่า"
    - "เกี่ยวตอนเมล็ดเหลืองแปดสิบเปอร์เซ็นต์ อย่าเกี่ยวตอนเช้ามีน้ำค้าง ข้าวชื้นโดนหักราคา"
    - "ตากข้าวที่ลานสองแดดก่อนขาย ความชื้นลดเยอะ เสี่ยเฮงหักน้อยลง หรือไม่ก็ไปขายสหกรณ์"
    - "ข้าวล้มเพราะพายุ ให้รีบเกี่ยวก่อนเมล็ดงอก ทิ้งไว้ในน้ำสามวันขายได้แต่เป็นอาหารเป็ด"
    - "เรื่องหวยน่ะหลาน... ป้าพรให้ลุงบอกว่าซื้อนานๆ ขาดทุนแน่นอน ลุงบอกแล้วนะ ลุงทำหน้าที่แล้ว"
  topic_smalltalk:
    - "หลานเชื่อเรื่องฝันไหม ลุงฝันเห็นงูเมื่อคืน งูตัวเดียวแต่ลุงแทงไปสามเลข"
    - "รถเกี่ยวลุงชื่อเจ้าทองคำ ลุงตั้งเองเพราะหวังว่ามันจะเกี่ยวเงินมาให้"
    - "ตอนหนุ่มๆ ลุงเคยเป็นนักร้องรำวงงานวัดนะ ร้องเพลงลูกทุ่งจนสาวๆ ทั้งตำบลรู้จัก ป้าพรก็รู้จักจากตอนนั้น"
    - "หลานว่าถ้าลุงถูกรางวัลที่หนึ่ง ลุงควรซื้อรถเกี่ยวคันใหม่หรือพาป้าพรไปเที่ยวทะเล ลุงคิดมาสิบปีแล้ว"
    - "ไก่บ้านลุงออกไข่แฝดเมื่อวาน ทั้งหมู่บ้านมาขอดูเลขไข่ ไก่ดังกว่าลุงอีก"
  topic_about_self:
    - "ลุงเกิดที่หมู่สี่นี่แหละ ทำนามาตั้งแต่สิบสอง ขับรถเกี่ยวมายี่สิบปี หวยซื้อมาสามสิบปี"
    - "ก่อนมีรถเกี่ยว ลุงไปลงแขกทั้งตำบล ไปช่วยใครเขาก็มาช่วยคืน เดี๋ยวนี้จ้างลุงหมดเลย ลุงก็เหงานิดๆ"
    - "ลุงกับป้าพรแต่งงานกันที่วัดดงเย็น สินสอดตอนนั้นควายหนึ่งตัวกับเงินสามพัน ควายตัวนั้นคือแม่ของไอ้ด่าง"
    - "ลุงเคยถูกเลขท้ายสองตัวสองครั้งในชีวิต ครั้งแรกเอาเงินไปซื้อพัดลม ครั้งที่สองไปซื้อหวยต่อ"
    - "ลุงไม่ได้เรียนสูงหรอกหลาน แต่ลุงจำเลขรางวัลที่หนึ่งย้อนหลังได้สิบปี ความจำลุงใช้ผิดที่"
  topic_about_others:
    - "ตาเผือกเลี้ยงไอ้ด่างให้ลุงตอนลุงออกรถ ลุงจ่ายค่าเลี้ยงเป็นข้าวเปลือก ตาไม่เคยขอเพิ่ม คนดีเว้ย"
    - "เจ๊หงษ์น่ะปากจัดแต่ใจกว้าง ลุงซื้อกับเจ๊บางงวด... อย่าบอกดาบเสถียรนะ แต่ดาบคงขี้เกียจจับอยู่แล้ว"
    - "ป้าทองใบทำแกงอร่อยที่สุดในตำบล แต่ทุกงานลงแขกแกจะบอกว่าแกงคนอื่นจืด ลุงไม่เถียง ลุงกลัว"
    - "เณรต้นน่ะ ชาวบ้านชอบไปถามเลข เณรตอบทุกคนว่าเลขเดียวที่รู้คือสูตรคูณแม่เก้า ลุงขำจนท้องแข็ง"
    - "ลุงเชิดขับรถเมล์มาสามสิบปี ทะเบียนรถไม่เคยเปลี่ยน ลุงแทงมาสามสิบปีก็ไม่เคยออก"
    - "บอลซ่อมรถเกี่ยวลุงเก่งมาก ถ้าบอลไประยองจริง ลุงคงต้องเอารถไปซ่อมถึงอำเภอ ร้องไห้แน่"
  gossip_theft:
    - "หลาน... ลุงได้ยินมาเรื่องของหายบ้านคนอื่น ลุงไม่อยากเชื่อหรอก แต่คืนให้เขาเถอะนะ"
    - "ลุงทำงานเหนื่อยมาทั้งชีวิตกว่าจะได้รถเกี่ยวคันหนึ่ง ของใครใครก็หวง หลานเข้าใจใช่ไหม"
    - "ข่าวลือว่าหลานหยิบของคนอื่น ลุงขอให้มันเป็นข่าวลือแบบเลขเด็ดในกลุ่ม LINE คือไม่จริงสักเรื่อง"
  gossip_cheating:
    - "หลาน เรื่องหัวใจลุงไม่ยุ่ง แต่คบทีละคนเถอะ ลุงซื้อหวยยังซื้อทีละงวดเลย"
    - "ป้าพรเล่าให้ฟังเรื่องหลานกับหลายคน ลุงไม่ตัดสินนะ แต่ในหมู่บ้านนี้ไม่มีความลับหรอก"
    - "ลุงอยู่กับป้าพรสี่สิบปี ทะเลาะทุกวัน แต่ไม่เคยแอบไปไหน หัวใจคนไม่ใช่สลาก ซื้อหลายใบไม่ได้"
  gossip_unpaid_bill:
    - "ได้ข่าวว่าค้างค่าไฟหลายเดือน ช็อตอยู่ใช่ไหมหลาน หน้าเกี่ยวมาเดี๋ยวลุงจ้างหลานช่วยขนกระสอบ"
    - "ค้างค่าน้ำค่าไฟอย่าปล่อยนานนะหลาน ลุงเคยโดนตัดไฟคืนก่อนหวยออก ดูผลไม่ได้ทั้งคืน"
    - "หนี้น่ะหลาน ยิ่งทิ้งยิ่งโต โตเร็วกว่าดอกเบี้ยเสี่ยเฮงอีก รีบเคลียร์เถอะ"
  gossip_small_envelope:
    - "ใส่ซองงานบวชลูกป้าแต๋วแค่ยี่สิบเหรอหลาน ป้าแต๋วจำเลขนั้นได้แม่นกว่าลุงจำหวยอีก"
    - "ลุงไม่ว่าหรอก ช็อตก็ใส่ตามกำลัง แต่ครั้งหน้าไปช่วยงานครัวแทนนะ คนจำแรงได้มากกว่าเงิน"
    - "เรื่องซองในหมู่บ้านนี้คนจดกันจริงจังนะหลาน มีสมุดเลย ป้าพรก็มีเล่มหนึ่ง"
  gossip_skip_longkhaek:
    - "หลานไม่ไปช่วยลงแขกนาตาเผือกเหรอ ตารอจนเที่ยง ลุงเลยต้องเกี่ยวแทนให้ฟรี"
    - "สมัยนี้ใครๆ ก็จ้างรถเกี่ยวลุง ลุงรู้ แต่ใครมาช่วยหลานแล้ว หลานก็ต้องไปช่วยคืนนะ นั่นแหละที่ทำให้หมู่บ้านยังเป็นหมู่บ้าน"
    - "คนเขาบ่นกันว่าหลานใช้แรงคนอื่นแล้วไม่ไปคืน ลุงพูดแทนหลานไม่ได้แล้วนะคราวนี้"
  player_fainted:
    - "เมื่อคืนหลานไปนอนที่ รพ.สต. มาใช่ไหม ทั้งหมู่บ้านรู้แล้ว ป้าแต๋วประกาศแทนหอกระจายข่าว"
    - "ผีจับเหรอหลาน เห็นผีแล้วจำเลขอะไรได้ไหม ไม่ได้ก็ไม่เป็นไร ปลอดภัยก็พอ... แต่ถ้าจำได้บอกลุงนะ"
    - "หลานต้องกลับบ้านก่อนสามทุ่มนะ ค่ารักษาไม่ถูก ลุงจ่ายค่าหวยยังเจ็บน้อยกว่า"
  player_new_vehicle:
    - "รถใหม่เหรอหลาน! ทะเบียนอะไร ขอดูหน่อย... ไม่ได้จะแทงนะ แค่อยากรู้เฉยๆ"
    - "รถสวยเว้ย ขับระวังนะหลาน ถนนเข้าหมู่สี่หลุมเยอะกว่าเลขในกลุ่ม LINE"
    - "ได้รถแล้วไปอำเภอสะดวก ไม่ต้องรอรถเมล์ลุงเชิด แต่แวะทักลุงเชิดบ้างนะ แกเหงา"
  player_lottery_win:
    - "หลานถูกหวย!? เลขอะไร ซื้อที่ไหน เพราะอะไร ฝันอะไร ลุงขอสูตรหน่อย ลุงไหว้แล้วนะ"
    - "ซื้อมางวดเดียวถูกเลย ลุงซื้อมาสามสิบปี ฟ้าไม่ยุติธรรมเลยหลาน... ยินดีด้วยจริงๆ นะ"
    - "ถูกแล้วระวังญาติที่ไม่เคยเห็นหน้านะหลาน เดี๋ยวโผล่มาเป็นขบวน ลุงเคยถูกสองพันยังมาสามคน"
    - "ป้าพรรู้ข่าวแล้วด่าลุงอีกรอบ ว่าดูหลานสิ ซื้อทีเดียวพอ หลานทำลุงซวยเลย ยินดีด้วยนะ"
  player_muddy:
    - "ตัวเลอะโคลนเหมือนลุงตอนรถเกี่ยวติดหล่มเลย ทำนาจริงจังนะหลาน ดีมาก"
    - "โคลนติดถึงคิ้วเลยหลาน ไปล้างที่ตุ่มหน้าบ้านลุงก่อนก็ได้ ป้าพรไม่ด่าหรอก... มั้ง"
    - "เลอะแบบนี้แปลว่าวันนี้ทำงานเต็มที่ ชาวนาตัวสะอาดน่ะลุงไม่ค่อยเชื่อ"
  player_rich:
    - "หลานรวยแล้วนะ เห็นซื้อของทีละเยอะ ลุงดีใจ แต่อย่าลืมคนที่เคยมาช่วยลงแขกนะ"
    - "รวยแล้วจ้างรถเกี่ยวลุงได้ทุกแปลงเลย ลุงลดให้ไร่ละห้าสิบ ราคาคนรวยใจดี"
    - "มีเงินแล้วฝากสหกรณ์หรือธนาคารเพื่อเกษตรกรไว้บ้าง อย่าเก็บใต้ที่นอน ผีมาทีเงินหายนะ"
  player_in_debt:
    - "เป็นหนี้เหรอหลาน ลุงเข้าใจ รถเกี่ยวคันนี้ลุงก็เคยเป็นหนี้สิบปี ค่อยๆ ใช้ไป"
    - "อย่าไปกู้นอกระบบนะหลาน ดอกมันกินคนทั้งเป็น ไปคุยกับธนาคารเพื่อเกษตรกรก่อน"
    - "หนี้น่ะหลาน ลุงบอกเลยว่าหวยไม่ใช่ทางออก ลุงพูดเองยังไม่อยากเชื่อ แต่มันจริง"
  player_sick:
    - "หน้าซีดเชียวหลาน ไป รพ.สต. ให้หมอแอนดูเถอะ บัตรทองฟรี อย่ามัวทนทำนา"
    - "ป่วยก็พักนะหลาน นาไม่หนีไปไหน ลุงจะดูแปลงหลานให้ถ้าฝนไม่ตก"
    - "ไข้เหรอ ให้ป้าพรต้มข้าวต้มปลาไปให้ไหม ลุงไม่ได้ทำอะไร ลุงเป็นคนส่งอย่างเดียว"
  player_married:
    - "แต่งงานแล้ว! ยินดีด้วยนะหลาน วันงานลุงขอนับว่าแขกมากี่คน เอาไปเป็นเลข"
    - "ชีวิตคู่น่ะหลาน ทะเลาะได้ แต่อย่านอนโกรธกัน ลุงกับป้าพรทะเลาะแล้วต้องคืนดีก่อนหอกระจายข่าวหกโมง"
    - "มีคู่แล้วก็ช่วยกันทำนา ไม่ต้องจ้างรถเกี่ยวลุงแล้วสิ... ไม่ได้ ยังต้องจ้างนะ"
  event_disaster:
    - "น้ำท่วมนาหมดแล้วหลาน รถเกี่ยวลุงจมถึงห้องเครื่อง ปีนี้ไม่มีงาน ไม่มีหวย ไม่มีอะไรเลย"
    - "ภัยมาทีชาวนาเจ็บก่อนใคร ไปลงทะเบียนเยียวยาที่ อบต. นะหลาน อย่ารอเขาเดินมาหา"
    - "ช่วยกันกรอกกระสอบทรายที่ศาลาวัดกัน พระอาจารย์สุเมธเปิดโรงครัวแล้ว"
  event_election:
    - "ช่วงเลือกตั้งนี่ ใบปลิวมาที่บ้านลุงวันละสามใบ ลุงเอามาจดเลข เบอร์ผู้สมัครก็เลขนะหลาน"
    - "หาเสียงกันทั้งตำบล รถแห่ผ่านหน้าบ้านลุงสิบรอบ ลุงอยากรู้แค่ว่าใครจะซ่อมถนนเข้านาจริงๆ"
    - "เลือกใครก็ไปใช้สิทธิ์นะหลาน แล้วจำไว้ว่าเขาสัญญาอะไรไว้ จดไว้เหมือนจดเลขเลย"
  event_company_water:
    - "บ่อบาดาลบ้านลุงแห้งตั้งแต่บริษัทมาตั้งปั๊มข้างคลอง ลุงไม่รู้จะเรียกว่าบังเอิญหรือเลขออกตรง"
    - "คุณธนาบอกว่าบริหารน้ำใต้ดินให้มีประสิทธิภาพ ลุงว่ามีประสิทธิภาพจริง ดูดหมดภายในเดือนเดียว"
    - "ถ้านาไม่มีน้ำ รถเกี่ยวลุงก็ไม่มีอะไรให้เกี่ยว หลานไปประชุมที่ อบต. กับลุงไหม"
  event_festival_near:
    - "อีกไม่กี่วัน{festival}แล้วหลาน ลุงจะไปซุ้มสอยดาว ปีนี้ต้องได้อย่างอื่นนอกจากขันน้ำ"
    - "{festival}ใกล้มาแล้ว ป้าพรจะเย็บชุดใหม่ให้ลุง ลุงจะได้หล่อพอไปรำวง"
    - "ช่วง{festival}ลุงพักรถเกี่ยวหนึ่งวัน วันเดียวในปีที่ลุงไม่นับเลขอะไรเลย... อาจจะ"
  gift_love:
    - "{item}! หลานรู้ใจลุงจริงๆ คืนนี้ลุงจะกินแล้วนอนฝันเห็นเลข"
    - "โอ้โห {item} ของโปรดลุงเลย ลุงจะบอกทุกคนในกลุ่ม LINE ว่าหลานใจดีที่สุดในตำบล"
    - "ให้ลุงจริงเหรอ งวดนี้ถ้าลุงถูก ลุงจะแบ่งให้หลาน... เขียนสัญญาไว้ก็ได้"
  gift_like:
    - "ขอบใจนะหลาน {item} ดีเลย เอาไปให้ป้าพรด้วย ป้าจะได้อารมณ์ดี"
    - "{item} เหรอ ชอบๆ ลุงกินได้หมดแหละ ขอบใจนะ"
    - "เอ้อ ของดีนะหลาน ลุงเก็บไว้กินตอนรอคิวเกี่ยวข้าว"
  gift_neutral:
    - "อ๋อ {item} ขอบใจนะหลาน"
    - "เอาไว้ให้ป้าพรดูละกันหลาน ลุงไม่ค่อยรู้จักของแบบนี้"
    - "ขอบใจหลาน ลุงจะหาที่วางไว้ก่อน"
  gift_dislike:
    - "{item}... เออ ขอบใจนะหลาน ลุงไม่ค่อยถนัดเท่าไร แต่น้ำใจลุงรับไว้"
    - "อืม ป้าพรคงชอบกว่าลุงนะ ลุงจะส่งต่อให้"
  gift_hate:
    - "หลาน... ให้ลุงทำไม{item} ลุงกินไม่ได้ ใช้ไม่เป็น นอนดูก็ไม่สบายใจ"
    - "อันนี้ไม่ไหวจริงๆ หลาน ลุงขอคืนนะ เอาไปให้คนที่ชอบเถอะ"
  birthday:
    - "วันเกิดลุงเหรอ หลานจำได้ด้วย! วันเกิดลุงคือเลขเดียวที่ลุงไม่เคยแทง กลัวมันไม่ออกแล้วเสียใจ"
    - "อายุลุงขึ้นอีกปี ป้าพรบอกให้เลิกหวยเป็นของขวัญ ลุงขอเลื่อนไปปีหน้า"
    - "ขอบใจนะหลาน ปีนี้ลุงขอแค่สุขภาพดี น้ำมาตามฤดู แล้วก็... เลขท้ายสักงวด"
  rare:
    - "ลุงมีสมุดจดเลขยี่สิบเล่ม ป้าพรเผาไปเล่มหนึ่ง ลุงเสียใจเหมือนเสียญาติ"
    - "บอกความลับนะหลาน ลุงเคยไปวัดเจริญทรัพย์มหามงคลในอำเภอ ทำบุญไปห้าร้อย ได้พระผงรุ่นเลขเด็ด กลับมาถูกกินเรียบ"
    - "ลุงเคยฝันว่าไอ้ด่างพูดได้ มันบอกเลขมาหกตัว ตื่นมาลุงจำได้แค่ว่ามันเรียกลุงว่าพ่อ"
    - "ถ้าวันไหนลุงถูกรางวัลที่หนึ่ง ลุงจะไม่ซื้ออะไรเลย ลุงจะซื้อหวยต่อ เพราะไม่รู้จะทำอะไรกับวันที่สิบหกแล้ว"
    - "รถเกี่ยวคันนี้ลุงตั้งใจว่าจะยกให้ลูก แต่ลูกบอกพ่อขายเถอะ ลุงเลยตั้งใจว่าจะขับเองจนขับไม่ไหว"
  flirt: []
gifts:
  love: ["ลาบหมู", "ไก่ย่าง", "ถั่วลิสงคั่ว", "ไข่แฝด"]
  like: ["ข้าวเหนียวหมูปิ้ง", "ส้มตำไทย", "หมูแดดเดียว", "ปลาเผาเกลือ", "สลากพัฒนาตำบล"]
  dislike: ["น้ำตะไคร้", "ผักอินทรีย์", "ปุ๋ยหมัก"]
