choices:
  - id: sommai_c1
    min_heart: 0
    prompt: "หลาน ลุงฝันเห็นงูเหลือมพันเสาบ้าน หลานว่าเลขอะไร"
    options:
      - text: "งูใหญ่ต้องเลขห้าหกสิลุง"
        heart: 1
        reply: "นั่นไง! หลานคิดเหมือนลุงเลย เดี๋ยวไปบอกป้าพรว่าหลานเห็นด้วย"
      - text: "ลุงลองเก็บเงินค่าหวยไว้สักงวดดีไหม"
        heart: 0
        reply: "เอ้า หลานโดนป้าพรจ้างมาพูดใช่ไหม... ก็จริงของหลานแหละ ลุงจะคิดดู"
      - text: "ไร้สาระน่าลุง ฝันก็คือฝัน"
        heart: -1
        reply: "ฝันมันก็ฟรีนะหลาน ลุงไม่ได้ขอให้หลานซื้อด้วยสักหน่อย"
  - id: sommai_c2
    min_heart: 2
    prompt: "หน้าเกี่ยวปีนี้คิวลุงเต็ม หลานจะจองรถเกี่ยว หรือจะลงแขกเอา"
    options:
      - text: "ลงแขกดีกว่าลุง อยากให้คนในหมู่บ้านได้มาช่วยกัน"
        heart: 2
