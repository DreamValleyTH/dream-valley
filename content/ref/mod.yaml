      - ["tam", "ผมเห็นแดดล่าสุดตอนจ่ายหนี้กองทุนเมื่อเดือนที่แล้วครับ"]
      - ["mod", "งั้นจ่ายหนี้บ่อยขึ้นครับ ได้ทั้งแดดและเครดิต ผมจ่ายยาตัวนี้ให้คุณ"]
