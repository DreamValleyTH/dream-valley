id: mod
name: "เภสัชกรมด"
role: "เภสัชกรเจ้าของร้านขายยาประจำตำบล รักษาโรคเบื้องต้น"
voice: "พูดเรียบ สั้น แห้ง ลงท้ายครับ เรียกผู้เล่นว่าคุณ ให้คำแนะนำทางยาที่ถูกต้องเสมอแต่ห่อด้วยมุกแห้งๆ ตลกร้ายเรื่องระบบสาธารณสุข ค่าครองชีพ และนิสัยคนไข้"
dark_humor: true
romanceable: false
lines:
  greet_morning:
    - "อรุณสวัสดิ์ครับ ลูกค้าคนแรกของวันมักจะเป็นคนที่ปวดหลังจากเมื่อวาน"
    - "เช้านี้ผมเติมยาลดไข้ไปสามกล่อง ข่าวในกลุ่ม LINE บอกว่าอากาศจะเปลี่ยน ทุกคนเลยป่วยล่วงหน้า"
    - "ร้านเปิดเจ็ดโมงครับ ส่วนผมเปิดจริงๆ ตอนกาแฟแก้วที่สอง"
  greet_noon:
    - "เที่ยงแล้วครับ ช่วงนี้ลูกค้ามาเพราะลมแดด ผมแนะนำให้มาก่อนลมแดดจะดีกว่า"
    - "สวัสดีครับ ผมกำลังกินข้าว อาหารเที่ยงของเภสัชกรคือข้าวกับยาลดกรด ตามลำดับ"
    - "ถ้ามาซื้อยาแก้ปวดหัว ผมขอถามก่อนว่ากินข้าวหรือยัง ส่วนใหญ่ยาที่ดีที่สุดคือข้าว"
  greet_evening:
    - "เย็นแล้วครับ ช่วงนี้คนมาซื้อพลาสเตอร์ปิดแผล หลังจากทำงานทั้งวันโดยไม่ใส่ถุงมือ"
    - "ผมปิดร้านสองทุ่มครับ หลังจากนั้นไปร้าน 24 ชม. ของตั้ม เขามียาลดไข้ราคาแพงกว่าผมนิดหน่อย"
  greet_night:
    - "สองทุ่มแล้วครับ ร้านผมกำลังปิด ยากันผีไม่มีขาย ลองไปวัดดูครับ ผ้ายันต์เก้าสิบเก้า"
    - "ดึกแล้วรีบกลับบ้านครับ ค่ารักษาที่ รพ.สต. หลังโดนผีจับแพงกว่ายาทุกตัวในร้านผม"
  weather_rain:
    - "ฝนตกครับ พรุ่งนี้ผมจะขายยาแก้หวัดได้เยอะ ผมพยากรณ์ยอดขายจากเมฆได้แม่นกว่าหอกระจายข่าว"
    - "เปียกฝนแล้วเปลี่ยนเสื้อทันทีนะครับ ไข้หวัดไม่ได้มาจากฝน แต่มาจากคนที่ยืนเปียกนานเกินไป"
    - "หน้าฝนยุงชุมครับ ไข้เลือดออกไม่มียารักษาเฉพาะ ผมขายได้แค่มุ้งกับยากันยุง ซึ่งราคาถูกกว่าการป่วยเยอะ"
  weather_hot:
    - "ร้อนครับ ผงเกลือแร่ซองละห้าบาท ถูกกว่าค่าเดินทางไปโรงพยาบาลอำเภอ"
    - "ทำงานกลางแดดพักทุกชั่วโมงนะครับ ลมแดดไม่ได้เลือกว่าคุณขยันแค่ไหน"
    - "อุณหภูมิวันนี้สามสิบเก้าองศา เท่ากับคนมีไข้ ทั้งตำบลกำลังมีไข้ครับ"
  weather_storm:
    - "พายุครับ ไฟดับ ตู้เย็นเก็บอินซูลินของร้านผมต่อไฟสำรองไว้ ผมมีแค่สองอย่างที่ไม่ยอมให้ดับ คืออินซูลินกับความหวัง อย่างแรกสำคัญกว่า"
    - "ถ้าต้องออกไปข้างนอก ระวังกิ่งไม้หักครับ ผมมีผ้าพันแผลพร้อม แต่ไม่อยากใช้กับคุณ"
  weather_pm25:
    - "ฝุ่นเยอะครับ หน้ากากผ้าธรรมดากันฝุ่นจิ๋วไม่ได้ ใช้แบบที่ผมขาย หรือแบบที่ใครก็ได้ขาย แต่ต้องเป็นแบบกรองฝุ่นจิ๋ว"
    - "ยาแก้ภูมิแพ้ขายดีช่วงนี้ครับ ตำบลเราหายใจเอาผลผลิตทางการเกษตรของอำเภออื่นเข้าไปทุกวัน"
    - "ถ้าไอเรื้อรังเกินสองอาทิตย์ ไป รพ.สต. นะครับ ผมขายยาแก้ไอได้ แต่ขายปอดใหม่ไม่ได้"
  season_rainy:
    - "หน้าฝนคือฤดูไข้หวัด ฤดูเชื้อรา และฤดูน้ำกัดเท้า ร้านผมมีครีมให้ครบทั้งสามฤดูย่อย"
    - "ดำนาเสร็จแล้วล้างเท้าให้แห้งนะครับ โรคน้ำกัดเท้าเป็นของแถมที่ไม่มีใครอยากได้"
  season_cool:
    - "หน้าหนาวคนผิวแห้ง ปากแตก และความดันขึ้นจากงานบุญทุกอาทิตย์ ผมขายวาสลีนได้ แต่ห้ามแกงเค็มไม่ได้"
    - "ข้าวใหม่ออก คนเกี่ยวข้าวมาซื้อยาแก้ปวดหลังเยอะ ผมแนะนำให้ซื้อพร้อมกับการพัก ซึ่งผมไม่มีขาย"
  season_dry:
    - "หน้าแล้งครับ ท้องเสียเยอะเพราะน้ำไม่สะอาด ต้มน้ำก่อนดื่มนะครับ ไฟฟรีกว่ายาเสมอ"
    - "สงกรานต์ผมเตรียมยาตาไว้เยอะ ทุกปีมีคนโดนแป้งดินสอพองเข้าตา และอีกครึ่งโดนน้ำคลองเข้าตา"
  heart_low:
    - "เป็นอะไรมาครับ"
    - "แพ้ยาอะไรไหมครับ ถ้าไม่รู้ ผมจะถือว่าแพ้ทุกอย่างไว้ก่อน"
    - "กินหลังอาหารเช้าเย็นครับ ซึ่งแปลว่าต้องกินอาหารด้วย"
  heart_mid:
    - "คุณกลับมาอีกแล้ว ปวดหลังเหมือนเดิมใช่ไหม ยาแก้ปวดหลังที่ดีที่สุดคือเลิกแบกกระสอบคนเดียวครับ"
    - "ผมจดประวัติคุณไว้แล้ว สามเดือนที่ผ่านมาคุณซื้อยาแก้ปวดเยอะกว่ากินผัก"
    - "นั่งวัดความดันฟรีได้ครับ ผมไม่คิดเงิน ผมคิดแค่ความกังวล"
  heart_high:
    - "ผมเรียนเภสัชหกปี กลับมาเปิดร้านที่นี่เพราะแม่ผมเคยต้องนั่งรถสองชั่วโมงไปซื้อยาความดัน ตอนนี้ไม่มีใครต้องนั่งแล้ว"
    - "บางครั้งคนไข้ไม่มีเงินซื้อยาครบชุด ผมขายให้ครบแต่คิดเงินครึ่งเดียว บัญชีร้านผมเลยดูเหมือนคนป่วยตลอด"
    - "หมอแอนกับผมแบ่งงานกัน เธอบอกให้คนไปหาหมอ ผมบอกให้คนกินยาให้ครบ เราแพ้ข่าวปลอมในกลุ่ม LINE ทุกสัปดาห์ แต่ยังไม่เลิก"
  topic_news:
    - "มีข่าวในกลุ่มว่าน้ำมะนาวผสมโซดารักษามะเร็งได้ ไม่จริงครับ ผลข้างเคียงเดียวคือคุณจะอยากกินส้มตำ"
    - "บริษัทของคุณธนาซื้อยาฆ่าแมลงไปจากร้านเสี่ยเฮงเป็นตัน แล้วผมก็ขายยาแก้แพ้ได้เพิ่มเป็นตันเหมือนกัน เศรษฐกิจครบวงจร"
    - "ยาบางตัวขึ้นราคาอีกแล้วครับ บริษัทยาบอกว่าต้นทุนวิจัยสูง ผมเชื่อ เพราะคนวิจัยราคาเก่งมาก"
  topic_advice:
    - "ฉีดยาฆ่าแมลงบ่อยเสี่ยงพิษสารเคมีครับ ใส่หน้ากาก ถุงมือ เสื้อแขนยาว และถ้าเป็นไปได้ ฉีดให้น้อยลง"
    - "โรคเรื้อรังรักษาหายได้ถ้าต่อเนื่องครับ ดีขึ้นหลังหนึ่งฤดู หายขาดหลังหนึ่งปี ห้ามหยุดยาเองตอนรู้สึกดีขึ้น"
    - "กินข้าวไม่ครบมื้อติดกันสามวันเป็นโรคกระเพาะครับ ยาลดกรดช่วยได้ แต่ข้าวสองมื้อช่วยได้มากกว่า"
  topic_smalltalk:
    - "ผมสะสมฉลากยาเก่าครับ บางอันเขียนว่าใช้ภายนอก แต่ลูกค้าดื่มไปแล้ว ผมเก็บไว้เตือนใจ"
    - "งานอดิเรกผมคือนับเม็ดยา มันผ่อนคลาย และคนไข้ไม่ต้องกลัวว่าผมนับผิด"
    - "ผมเลี้ยงปลากัดหนึ่งตัวในร้าน ชื่อพาราเซตามอล มันอยู่มาสามปีโดยไม่ต้องกินยาสักเม็ด เป็นคนไข้ที่ดีที่สุดของผม"
  topic_about_self:
    - "ผมไม่ค่อยยิ้มครับ ไม่ได้หมายความว่าไม่ดีใจ หน้าผมแค่ถูกออกแบบมาสำหรับอ่านฉลาก"
    - "ผมเปิดร้านนี้มาแปดปี ยังไม่มีใครเรียกผมว่าหมอเลย ทุกคนเรียกว่าเภสัช ผมพอใจ ชัดเจนดี"
    - "ผมกลัวผีนิดหน่อยครับ แต่กลัวคนกินยาฆ่าเชื้อไม่ครบชุดมากกว่า ผีไม่ดื้อยา"
  topic_about_others:
    - "หมอแอนเป็นคนที่ทำงานหนักที่สุดในตำบลครับ รองลงมาคือควายตาเผือก รองลงมาคือผม ดาบเสถียรไม่อยู่ในลำดับ"
    - "ตั้มร้าน 24 ชม. มาซื้อวิตามินบีทุกเดือน ผมบอกว่าวิตามินที่เขาขาดคือวิตามินดี ซึ่งได้จากแดด ซึ่งเขาไม่เคยเจอ"
    - "ป้าแต๋วมาถามผมว่าใครซื้อยาอะไรบ้าง ผมบอกว่าเป็นความลับของคนไข้ ป้าบอกว่าผมพูดเหมือนคนมีเรื่องปิดบัง ป้าเข้าใจถูกครับ นั่นคืองานผม"
  gossip_theft:
    - "ข่าวลือว่าคุณขโมยของ ผมไม่ตัดสินครับ แต่ยาทุกตัวในร้านผมติดตั้งอยู่หลังเคาน์เตอร์ตั้งแต่วันนี้"
    - "ผมไม่มียาลบข่าวลือครับ มีแต่เวลากับการทำตัวดี ซึ่งรสชาติขมกว่ายาทุกตัว"
  gossip_cheating:
    - "คบซ้อนเหรอครับ ผมไม่มียาแก้ใจสลายจะจ่ายให้ใคร ทั้งคุณและอีกสองคน"
    - "ผลข้างเคียงของการคบซ้อนคือนอนไม่หลับครับ ผมไม่แนะนำให้ซื้อยานอนหลับ แนะนำให้เลือก"
  gossip_unpaid_bill:
    - "ค่าไฟค้างเหรอครับ ตู้เย็นดับแล้วยาที่ต้องแช่เย็นจะเสียนะครับ ถ้ามีอินซูลินเอามาฝากร้านผมก่อน"
    - "ผมเห็นชื่อคุณในกลุ่ม LINE เรื่องค่าไฟ ผมไม่มียาลดความอายครับ มีแต่ยาลดความดันที่อาจต้องใช้ถ้ายังไม่จ่าย"
  gossip_small_envelope:
    - "ซองน้อยเหรอครับ ผมก็ใส่น้อย เภสัชกรบ้านนอกรายได้ไม่สูง แต่ผมช่วยวัดความดันแขกในงานฟรี เขาเลยไม่ว่า"
    - "ถ้าใส่ซองน้อย ลองช่วยงานให้มากครับ คนในตำบลคิดราคาเหงื่อด้วย"
  gossip_skip_longkhaek:
    - "ไม่ไปลงแขกคืนเหรอครับ ลุงสมหมายมาซื้อยาแก้ปวดหลังสองแผงเมื่อวาน ผมไม่ได้บอกว่าเกี่ยวกับคุณนะครับ ฉลากไม่ได้บอก"
    - "แรงงานที่ยืมกันแล้วไม่คืน เป็นหนี้ที่ไม่มีดอกเบี้ย แต่มีผลข้างเคียงทางสังคมครับ"
  player_fainted:
    - "ได้ข่าวว่าเมื่อคืนโดนผีจับครับ ตื่นมาแรงเหลือครึ่ง กินข้าวกับดื่มน้ำเยอะๆ วันนี้อย่าฝืนงานหนัก"
    - "ผมเช็กแล้ว ไม่มียาตัวไหนป้องกันผีได้ครับ ผ้ายันต์ที่วัดได้ผลกว่ายาทุกตัวของผม ผมพูดแบบนี้แล้วสภาเภสัชฯ อาจไม่ชอบ"
  player_new_vehicle:
    - "รถใหม่ครับ ยินดีด้วย ผมมีชุดปฐมพยาบาลติดรถขาย เผื่ออุบัติเหตุ และเผื่อคนข้างทาง"
    - "ขับรถระวังด้วยครับ ผมมีแค่ยาทาแผลถลอก ถ้าหนักกว่านั้นต้องไปโรงพยาบาลอำเภอ ซึ่งไกลพอๆ กับความหวัง"
  player_lottery_win:
    - "ถูกหวยเหรอครับ ยินดีด้วย ผมแนะนำให้ซื้อประกันสุขภาพ มันคือหวยที่คุณหวังว่าจะไม่ถูก"
    - "ความดันคุณขึ้นสิบห้าจุดตั้งแต่ถูกหวยครับ ดีใจได้ แต่ดีใจช้าๆ"
  player_muddy:
    - "มีแผลที่เท้าไหมครับ โคลนกับแผลไม่ใช่คู่ที่ดี ล้างด้วยน้ำสะอาดแล้วทายาฆ่าเชื้อนะครับ"
    - "ลุยนาแล้วเป็นไข้ ปวดน่องหนักๆ ให้ไป รพ.สต. ทันทีนะครับ ฉี่หนูไม่ใช่เรื่องตลก ทั้งที่ชื่อมันฟังดูตลก"
  player_rich:
    - "ช่วงนี้คุณรวยขึ้น ผมสังเกตจากการที่คุณซื้อวิตามินแบบกระปุกใหญ่ คนรวยมักเริ่มกังวลว่าจะอายุยืนไม่พอใช้เงิน"
    - "รวยแล้วไปคลินิกเอกชนได้ครับ เร็วกว่า แพงกว่า ยาตัวเดียวกับที่ผมขาย แต่ซองสวยกว่า"
  player_in_debt:
    - "มีหนี้เหรอครับ ความเครียดทำให้ความดันขึ้น ผมวัดให้ฟรี ส่วนหนี้ผมวัดให้ไม่ได้"
    - "ไม่มีเงินซื้อยา ไป รพ.สต. ครับ บัตรทองฟรี ผมเสียลูกค้าแต่คุณไม่เสียเงิน ผมโอเค"
  player_sick:
    - "อาการแบบนี้กินยาลดไข้ทุกหกชั่วโมงครับ นอนพักให้มาก ถ้าไข้สูงเกินสามวันไป รพ.สต. ทันที"
    - "ปวดหลังเรื้อรังต้องพักครับ ทำงานหนักต่อเนื่องไม่พัก ยาทุกตัวในโลกก็สู้ไม่ไหว"
    - "เบาหวานกับความดันรักษาหายได้ถ้ากินยาต่อเนื่องและลดหวานลดเค็มครับ ยาแค่ครึ่งหนึ่ง อีกครึ่งอยู่ในจานข้าว"
  player_married:
    - "ยินดีด้วยครับ ตอนนี้ผมมีประวัติแพ้ยาของสองคน ผมจะดูแลให้"
    - "แต่งงานแล้วนอนพอนะครับ ชีวิตคู่ที่ดีเริ่มจากคนที่ไม่หงุดหงิดเพราะอดนอน"
  event_disaster:
    - "น้ำท่วมครับ ระวังน้ำกัดเท้า ท้องเสีย และงูเข้าบ้าน สองอย่างแรกผมมียา อย่างที่สามโทรหาลุงพรานแดง"
    - "ผมเปิดร้านยาฟรีหนึ่งวันสำหรับคนที่บ้านโดนน้ำ ยาพื้นฐานเท่านั้นนะครับ ผมใจดีได้แค่ระดับหนึ่งแผง"
  event_election:
    - "ช่วงเลือกตั้งยาแก้ปวดหัวขายดีครับ รถแห่หาเสียงเปิดเพลงวันละสิบสองชั่วโมง ผมควรขอบคุณผู้สมัครทุกคน"
    - "ผู้สมัครคนหนึ่งสัญญาว่าจะสร้างโรงพยาบาลในตำบล ผมจดไว้แล้วครับ เป็นคำสัญญาที่หกในรอบแปดปี"
  event_company_water:
    - "บ่อชาวบ้านแห้ง น้ำที่เหลือขุ่น ท้องเสียกันเยอะครับ ผมขายผงเกลือแร่ได้มากขึ้น นี่คือกำไรที่ผมไม่อยากได้"
    - "คุณธนาบอกว่าน้ำใต้ดินบริหารอย่างมีประสิทธิภาพ ผมเห็นด้วย มันหายไปอย่างมีประสิทธิภาพมาก"
  event_festival_near:
    - "{festival} ใกล้แล้วครับ ผมเตรียมยาแก้ท้องเสียกับยาแก้แฮงก์ไว้ ประสบการณ์สอนผม"
    - "ไปงาน {festival} กินอาหารให้หลากหลายครับ อย่ากินแต่ของทอด ผมไม่อยากเจอคุณที่ร้านวันรุ่งขึ้น"
  gift_love:
    - "{item}… ผมดีใจครับ ใบหน้าผมอาจไม่บอก แต่ความดันผมขึ้นห้าจุด เป็นห้าจุดที่ดี"
    - "ขอบคุณครับ ผมจะเก็บไว้ในที่แห้ง พ้นแสงแดด ตามที่ฉลากยาสอนผมมาทั้งชีวิต"
  gift_like:
    - "ขอบคุณครับ {item} ดีต่อสุขภาพด้วย ผมชอบของขวัญที่มีประโยชน์"
    - "ของจากธรรมชาติ ไม่ต้องอ่านฉลาก ผมชอบครับ"
  gift_neutral:
    - "ขอบคุณครับ ผมรับไว้"
    - "{item} เหรอครับ ผมจะหาที่ใช้"
  gift_dislike:
    - "ขนมหวานเหรอครับ… ผมกินได้ แต่ผมจะคิดเรื่องน้ำตาลในเลือดตลอดเวลาที่กิน"
    - "{item} ผมไม่ค่อยใช้ครับ แต่ขอบคุณ"
  gift_hate:
    - "ยาฆ่าแมลงเป็นของขวัญเหรอครับ ผมเห็นผลข้างเคียงของมันทุกวัน ไม่ต้องเอามาให้ผมอีกครับ"
    - "พระเครื่องวัดเจริญทรัพย์ผมไม่รับครับ มันไม่ได้รักษาอะไร ผมพูดในทางวิชาการ"
  birthday:
    - "วันเกิดผมเหรอครับ ขอบคุณ อายุเพิ่มขึ้นอีกปี ความเสี่ยงโรคเรื้อรังก็เพิ่มขึ้นอีกนิด ผมจะฉลองด้วยการวัดความดัน"
    - "ปกติวันเกิดผมไม่มีใครจำ นอกจากระบบสภาเภสัชกรรมที่ส่งอีเมลให้ต่อใบอนุญาต ขอบคุณที่คุณจำครับ"
  rare:
    - "ผมเคยคิดจะไปทำงานบริษัทยาในกรุงเทพฯ เงินเดือนสามเท่า แต่ที่นั่นผมจะขายยาให้คนที่ไม่เคยเห็นหน้า ที่นี่ผมรู้ว่ายายบัวกินยาครบหรือเปล่าจากแววตา"
    - "บางคืนผมเปิดร้านตอนดึกให้คนที่ลูกไข้ขึ้น ถึงจะเลยสามทุ่ม ผมยืนเปิดประตูกลัวผีตัวสั่น แต่ไม่เคยปิดใส่ใคร"
    - "ความลับครับ ปลากัดพาราเซตามอลเป็นตัวที่สาม สองตัวแรกตายไปแล้ว ผมไม่บอกลูกค้า เพราะมันจะทำลายความเชื่อมั่นในร้านยา"
  flirt: []
gifts:
  love: ["ชาสมุนไพร", "ดอกมะลิ", "กาแฟดริปบ้านเรา"]
  like: ["ผักอินทรีย์", "น้ำตะไคร้", "ปลานิลสด"]
  dislike: ["ขนมหวาน", "เครื่องดื่มชูกำลังม้าเหล็ก"]
  hate: ["ยาฆ่าแมลง", "พระเครื่องวัดเจริญทรัพย์"]
choices:
  - id: mod_c1
    min_heart: 0
    prompt: "ปวดหลังมาสามวันแล้วใช่ไหมครับ ผมขอถามว่าสามวันนั้นคุณพักบ้างหรือเปล่า"
    options:
      - text: "ไม่ได้พักเลย งานในนายังไม่เสร็จ"
        heart: 1
        reply: "ซื่อสัตย์ดีครับ ผมให้ยาแก้ปวดสามวัน และคำสั่งให้พักหนึ่งวัน ผมรู้ว่าคุณจะซื้ออย่างแรกและทิ้งอย่างหลัง"
      - text: "พักแล้ว แต่ยังปวด"
        heart: 0
        reply: "ถ้าพักแล้วยังปวดเกินอาทิตย์ ไป รพ.สต. นะครับ ผมขายยาได้ แต่ไม่มีเครื่องเอกซเรย์"
      - text: "ขอยาแรงสุดเลยภก."
        heart: -1
        reply: "ยาแรงสุดที่ผมมีคือการบอกความจริงครับ คุณต้องพัก แล้วผมให้ยาแค่ขนาดปกติ"
  - id: mod_c2
    min_heart: 3
    prompt: "ข่าวในกลุ่ม LINE บอกว่าดื่มน้ำมะพร้าวต้มกับใบเตยรักษาเบาหวานได้ ลุงสมหมายหยุดกินยาแล้ว คุณช่วยผมไหมครับ"
    options:
      - text: "ช่วยสิ เดี๋ยวพิมพ์แก้ข่าวในกลุ่ม แล้วไปคุยกับลุงด้วย"
        heart: 2
        reply: "ขอบคุณครับ คุณกับหมอแอนเป็นแนวป้องกันข่าวปลอมที่ดีที่สุดในตำบล ผมจะเตรียมเอกสารให้ลุงอ่าน"
      - text: "ให้ป้าพรบอกลุงดีกว่า ลุงกลัวป้าพร"
        heart: 1
        reply: "กลยุทธ์ทางสาธารณสุขที่แม่นยำมากครับ ผมจะโทรหาป้าพรเดี๋ยวนี้"
      - text: "ปล่อยลุงไปเถอะ เดี๋ยวก็รู้เอง"
        heart: -2
        reply: "เบาหวานไม่ได้สอนบทเรียนแบบให้แก้ตัวครับ ผมจะไปคุยกับลุงเอง"
banter:
  - with: ann
    lines:
      - ["ann", "มด ข่าวปลอมเรื่องน้ำมะนาวรักษามะเร็งกลับมาอีกแล้ว"]
      - ["mod", "ครั้งที่เจ็ดในปีนี้ครับหมอ มันฟื้นตัวเก่งกว่าคนไข้ของเราอีก"]
      - ["ann", "หมอจะพิมพ์แก้อีกรอบ มดช่วยกดไลก์ด้วยนะ"]
      - ["mod", "ครับ ผมจะกดไลก์ด้วยความรู้สึกสิ้นหวังแบบมืออาชีพ"]
  - with: tam
