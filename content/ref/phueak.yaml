id: phueak
name: "ตาเผือก"
role: "คนเลี้ยงควายฝูงสุดท้ายของตำบล ครูสายปศุสัตว์"
voice: "พูดช้า เสียงต่ำ ประโยคสั้น เรียกผู้เล่นว่า เอ็ง หรือ หลาน ลงท้าย วะ เว้ย นะ เปรียบทุกอย่างกับควาย เรียกควายแต่ละตัวด้วยชื่อเหมือนเรียกลูก"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "เช้าแล้วหลาน ตาพาควายออกทุ่งตั้งแต่ตีห้า หญ้าตอนเช้ามีน้ำค้าง ควายชอบ"
    - "หอกระจายข่าวยังไม่ทันประกาศ ไอ้ทุยมันร้องปลุกตาก่อนแล้ว"
    - "ไปทำนาเหรอ เดินอ้อมฝูงควายหน่อยนะ อีแดงมันไม่ชอบคนแปลกหน้า"
  greet_noon:
    - "เที่ยงแล้ว ควายลงปลักแล้ว ตาก็นั่งกินข้าวห่อใต้ต้นมะขาม"
    - "ร้อนขนาดนี้ควายไม่ทำงานหรอก มันฉลาดกว่าคน"
    - "กินข้าวยังหลาน ตามีข้าวเหนียวกับปลาทูทอด แบ่งกันได้"
  greet_evening:
    - "เย็นแล้ว ต้อนควายกลับคอก ควายรู้ทางเองนะหลาน ตาแค่เดินตาม"
    - "ตะวันตกดินแล้ว ฝุ่นจากกีบควายสีทองทั้งทุ่ง ตาดูมาหกสิบปีไม่เคยเบื่อ"
    - "ห้าโมงแล้ว ตาจะกลับไปจุดกองไฟไล่ยุงให้ควาย"
  greet_night:
    - "ดึกแล้วหลาน กลับบ้าน ผีออกสามทุ่ม ควายมันรู้ก่อน มันหันหน้าไปทางป่าแล้ว"
    - "ควายตาไม่นอนเลยคืนนี้ ยืนหูตั้ง แปลว่ามีอะไรเดินอยู่ รีบกลับนะหลาน"
    - "ถ้าหลานได้ยินกอย กอย ก็วิ่งนะ ไม่ต้องหันไปดู ตาบอกแค่นี้"
  weather_rain:
    - "ฝนตกควายชอบ ปลักเต็ม หญ้างาม ตาเปียกแต่ควายดีใจ"
    - "ฝนแบบนี้อย่าให้ควายยืนกลางทุ่ง ฟ้าผ่าควายตายมาแล้ว"
    - "ฝนตกดินนุ่ม ไถนาง่าย ถ้าหลานจะยืมควายตาไถ บอกนะ"
  weather_hot:
    - "ร้อนจัดต้องพาควายลงน้ำวันละสองรอบ ไม่งั้นมันเป็นลมแดดเหมือนคน"
    - "ร้อนแบบนี้ควายกินน้ำวันละห้าถัง ตาหาบน้ำจนบ่าแดง"
    - "แดดเปรี้ยงแบบนี้ ตาพาควายไปกินหญ้าในร่มริมคลอง หลานก็ไปหลบร่มบ้าง"
  weather_storm:
    - "พายุมา ตาต้องผูกควายในคอกให้แน่น อีแดงกลัวฟ้าร้อง ชอบวิ่งชนรั้ว"
    - "ลมแรงขนาดนี้หลังคาคอกควายหลุดแน่ ช่วยตาหาไม้มาค้ำหน่อยหลาน"
    - "อยู่ในบ้านนะหลาน ฟ้าแบบนี้ควายยังไม่ออกจากคอก"
  weather_pm25:
    - "ฝุ่นเยอะ ควายไอ ตาก็ไอ ไอกันทั้งคอก"
    - "ใครเผาหญ้าเผาฟาง ควายตาไม่มีหญ้ากิน คนเผาคิดว่าประหยัด แต่ควายตาจ่ายแทน"
    - "ใส่หน้ากากนะหลาน หมอแอนแจกตาด้วย ตาใส่แล้วควายจำหน้าไม่ได้"
  season_rainy:
    - "หน้าฝนหญ้าขึ้นเต็มทุ่ง ควายกินอิ่ม ตานอนสบาย"
    - "หน้าฝนต้องระวังกีบเน่า เช็ดกีบควายบ่อยๆ อย่าให้ยืนในโคลนทั้งวัน"
    - "สมัยก่อนหน้าฝนทั้งตำบลไถนาด้วยควาย เดี๋ยวนี้รถไถหมดแล้ว เหลือควายตาไม่กี่ตัว"
  season_cool:
    - "หน้าหนาวควายหนาวนะหลาน ตาจุดกองไฟข้างคอกทุกคืน"
    - "หน้าเกี่ยวตาพาควายไปกินตอซังในนาคนอื่น เขาได้ปุ๋ยขี้ควาย ควายได้อิ่ม ได้กันทั้งคู่"
    - "ฟางข้าวหน้าเกี่ยวอย่าเผานะหลาน อัดเก็บไว้ให้ควายกินหน้าแล้ง ตาซื้อต่อ"
  season_dry:
    - "หน้าแล้งหญ้าแห้ง ตาต้องซื้อฟางอัดก้อนให้ควาย ก้อนละสามสิบห้า แพงกว่าข้าวตาอีก"
    - "แล้งแบบนี้ปลักแห้ง ตาต้องสูบน้ำใส่ให้ควายนอน น้ำบาดาลก็เหลือน้อย"
    - "สงกรานต์ตาพาควายไปอาบน้ำที่คลอง ควายก็ต้องรดน้ำดำหัวเหมือนกัน"
  heart_low:
    - "หลานบ้านไหน อ้อ บ้านนั้น ตอนเด็กหลานขี่หลังควายตาตกปลัก ร้องไห้ทั้งวัน"
    - "อยากเลี้ยงควายเหรอ ต้องตื่นเช้า ต้องอดทน ควายไม่รอใคร"
    - "ตาไม่ค่อยพูดนะหลาน ควายไม่ชอบเสียงดัง"
  heart_mid:
    - "มานั่งสิหลาน ดูควายกินหญ้าไป ใจเย็นลงเยอะ"
    - "หลานเลี้ยงสัตว์เก่งขึ้นนะ ตาเห็นไก่หลานอ้วนดี"
    - "ไอ้ทุยมันจำหลานได้แล้ว ไม่ส่ายหัวใส่แล้ว"
  heart_high:
    - "ลูกตาไปทำงานกรุงเทพฯ หมดแล้ว ไม่มีใครเลี้ยงควายต่อ ถ้าตาไม่อยู่ ควายพวกนี้จะไปอยู่ไหนก็ไม่รู้"
    - "ตาเลี้ยงควายมาหกสิบปี ไม่เคยขายควายตัวไหนเข้าโรงเชือด ตาขายให้คนที่จะเลี้ยงต่อเท่านั้น"
    - "เมียตาเสียไปนานแล้ว ตอนนี้ตาคุยกับควายทุกวัน ควายฟังเก่งกว่าคน"
  topic_news:
    - "อีแดงจะคลอดลูกเดือนหน้า ลุงสมหมายมาถามทุกวันว่าคลอดวันไหน ตารู้ว่ามันอยากได้อะไร"
    - "บริษัทของคุณธนามาล้อมรั้วทุ่งหญ้าหลังคลอง ควายตาไม่มีที่กินหญ้าแล้วหลาน"
    - "เสี่ยเฮงมาขอซื้อควายตาไปขาย ให้ราคาดี ตาไม่ขาย"
  topic_advice:
    - "ควายต้องมีปลักนอนนะหลาน ไม่มีปลัก ผิวมันแตก มันเครียด ทำงานไม่ไหว"
    - "ขี้ควายเอาไปหมักกับฟางสามเดือน ได้ปุ๋ยคอกดีกว่าปุ๋ยเสี่ยเฮง แล้วไม่ต้องเชื่อด้วย"
    - "ให้อาหารสัตว์ทุกเช้า สัตว์ที่หิวไม่ให้ไข่ไม่ให้นม เหมือนคนหิวไม่อยากทำงาน"
  topic_smalltalk:
    - "ควายตาแต่ละตัวมีนิสัยไม่เหมือนกัน ไอ้ทุยขี้เกียจ อีแดงขี้หงุดหงิด ไอ้ด่างของลุงสมหมายขี้จาม"
    - "หลานเคยขี่ควายไหม สมัยตาเด็กๆ ขี่ควายไปโรงเรียน ผูกไว้ใต้ต้นไม้ เลิกเรียนขี่กลับ"
    - "ตาชอบเป่าใบไม้เป็นเพลง ควายชอบฟัง มันหยุดเคี้ยวหญ้าทุกครั้ง"
  topic_about_self:
    - "ตาเลี้ยงควายตั้งแต่อายุแปดขวบ พ่อตาเลี้ยง ปู่ตาก็เลี้ยง ตาเป็นรุ่นสุดท้ายแล้ว"
    - "ตาไม่เคยไปกรุงเทพฯ เลยนะหลาน ไกลสุดคืออำเภอ ไปซื้อยาควาย"
    - "ตามีควายเจ็ดตัว รู้จักชื่อทุกตัว รู้วันเกิดทุกตัว จำวันเกิดลูกตัวเองไม่ได้ ลูกตาบ่น"
  topic_about_others:
    - "ลุงสมหมายฝากไอ้ด่างไว้ให้ตาเลี้ยง จ่ายเป็นข้าวเปลือก แต่ถามเลขจากควายตาทุกวัน"
    - "พรานแดงเพื่อนตา เข้าป่าด้วยกันตอนหนุ่ม แกล่าสัตว์ ตาเลี้ยงสัตว์ ไม่เคยทะเลาะกัน"
    - "น้องโอ๊ตชอบมาดูควาย ตาสอนให้ป้อนหญ้า เด็กคนนี้ใจเย็น เหมาะเลี้ยงควาย"
  gossip_theft:
    - "หลาน ขโมยของคนอื่นไม่ดีนะ ควายตายังไม่กินหญ้าในแปลงคนอื่นเลยถ้าไม่ได้รับอนุญาต"
    - "ตาได้ยินแล้ว คืนของเขาไปซะ แล้วก็ขอโทษ ตาจะไม่พูดอีก"
  gossip_cheating:
    - "คบหลายคนเหรอหลาน ควายมันยังมีคู่ตัวเดียว ตาไม่ว่าอะไรนะ แค่บอกไว้"
    - "เรื่องหัวใจตาไม่รู้ แต่คนโดนหลอกเขาเสียใจ ตาไม่ชอบเห็นใครเสียใจ"
  gossip_unpaid_bill:
    - "ค้างค่าไฟเหรอหลาน ตาไม่มีไฟฟ้าที่คอกควาย ใช้ตะเกียงก็อยู่ได้นะ แต่บ้านหลานคงไม่ได้"
    - "ช็อตก็มาช่วยตาตัดหญ้าให้ควาย ตาให้ค่าแรงเป็นข้าวเปลือก"
  gossip_small_envelope:
    - "ซองน้อยไม่เป็นไรหลาน ตาก็ใส่น้อย ตาให้ขี้ควายไปใส่สวนเจ้าภาพแทน"
    - "งานบุญเขาจำซองได้ แต่เขาจำคนมาช่วยได้ดีกว่า"
  gossip_skip_longkhaek:
    - "หลานไม่มาช่วยลงแขกนาตา ตารอถึงเที่ยง สุดท้ายลุงสมหมายเอารถเกี่ยวมาช่วย ตาไม่ได้โกรธ แค่เหงา"
    - "สมัยก่อนใครไม่ไปช่วยคืน ปีหน้าไม่มีใครมาช่วย หมู่บ้านอยู่ได้เพราะช่วยกัน"
  player_fainted:
    - "เมื่อคืนผีจับเหรอหลาน ควายตาร้องทั้งคืน ตารู้ว่ามีอะไรไม่ดี"
    - "กลับบ้านก่อนสามทุ่มนะหลาน ควายยังรู้จักกลับคอกก่อนมืด"
  player_new_vehicle:
    - "รถใหม่เหรอ ขับช้าๆ ผ่านฝูงควายนะ ควายตกใจแตรแล้ววิ่ง"
    - "รถเร็วดี แต่ควายไม่ต้องเติมน้ำมันนะหลาน แค่หญ้า"
  player_lottery_win:
    - "ถูกหวยเหรอ ดีใจด้วยหลาน อย่าบอกลุงสมหมายว่าได้เลขจากควายตาก็แล้วกัน"
    - "มีเงินแล้วซื้อควายสักตัวไหม ตาจะสอนเลี้ยง"
  player_muddy:
    - "ตัวเลอะโคลนเหมือนควายลงปลักเลยหลาน ตาว่าเหมาะเลี้ยงควาย"
    - "โคลนเต็มตัวแบบนี้ยุงไม่กัดนะ ควายรู้มานานแล้ว"
  player_rich:
    - "รวยแล้วก็ดี แต่อย่าซื้อที่ทุ่งหญ้าไปล้อมรั้วนะหลาน ควายตาจะไม่มีที่กิน"
    - "เงินเยอะแล้วแบ่งให้คนในหมู่บ้านบ้าง ควายได้หญ้ามาก มันยังแบ่งให้นกที่เกาะหลัง"
  player_in_debt:
    - "เป็นหนี้เหรอหลาน ค่อยๆ ใช้ไป ควายไถนาวันละแปลง ไม่เคยไถทีเดียวทั้งทุ่ง"
    - "ช็อตก็มาช่วยตาเลี้ยงควาย ได้ข้าวกิน ได้ที่นอน ไม่ต้องจ่ายอะไร"
  player_sick:
    - "ป่วยเหรอ ไป รพ.สต. นะหลาน ตาเคยดื้อไม่ไป เป็นไข้ห้าวัน ควายต้องดูแลตัวเอง"
    - "พักนะหลาน สัตว์หลานตาจะไปให้อาหารให้"
  player_married:
    - "แต่งงานแล้ว ดีนะหลาน มีคนช่วยเลี้ยงสัตว์ ตาให้ลูกควายเป็นของขวัญ ถ้าอีแดงคลอดตัวเมีย"
    - "ยินดีด้วยหลาน อยู่กันนานๆ นะ ตากับเมียอยู่ด้วยกันห้าสิบปี ไม่เคยทะเลาะเรื่องควาย"
  event_disaster:
    - "น้ำท่วมแล้ว ตาต้องพาควายขึ้นที่สูง ช่วยตาต้อนหน่อยหลาน"
    - "ภัยมาที สัตว์ก็ลำบากเหมือนคน หลานดูแลสัตว์หลานให้ดีนะ"
  event_election:
    - "ช่วงเลือกตั้งรถแห่ผ่านทุ่ง ควายตาตกใจเสียงลำโพงทุกวัน ตาจะเลือกคนที่เปิดเสียงเบาที่สุด"
    - "ตาอยากได้คนที่เก็บทุ่งหญ้าสาธารณะไว้ให้ควาย ไม่ใช่เอาไปให้บริษัท"
  event_company_water:
    - "ตั้งแต่บริษัทดูดน้ำ ปลักควายตาแห้ง คลองก็ตื้น ควายตาไม่มีที่นอนแช่น้ำแล้ว"
    - "คุณธนาบอกตาว่าจะทำบ่อน้ำให้ควาย บ่อนั้นอยู่ในรั้วบริษัท ควายตาเข้าไม่ได้"
  event_festival_near:
    - "{festival}ใกล้แล้ว ตาจะพาควายไปเดินในขบวน ถ้าเขาให้ไป"
    - "ช่วง{festival}คนเยอะ ตาเอาควายไว้ในคอก ควายไม่ชอบเสียงพลุ"
  gift_love:
    - "{item}... ให้ตาเหรอ ตาดีใจนะหลาน ตาไม่ค่อยได้ของ"
    - "ของดีเลยหลาน ตาจะแบ่งให้ควายด้วย... ถ้าควายกินได้นะ"
  gift_like:
    - "{item} เหรอ ขอบใจหลาน"
    - "ดีนะหลาน ตาจะเก็บไว้กินตอนเลี้ยงควาย"
  gift_neutral:
    - "อ้อ ขอบใจหลาน"
    - "{item}... ตาไม่ค่อยรู้จัก แต่ขอบใจนะ"
  gift_dislike:
    - "อืม {item}... ขอบใจนะหลาน แต่ตาไม่ค่อยใช้"
    - "เก็บไว้ให้คนอื่นดีกว่าหลาน ตาไม่ถนัด"
  gift_hate:
    - "{item} ห้ามเอามาใกล้ทุ่งหญ้าตาเลยนะหลาน ควายตาตายได้"
    - "ไม่เอาหลาน ของแบบนี้ทำร้ายสัตว์ ตารับไม่ได้"
  birthday:
    - "วันเกิดตาเหรอ ตาเองยังจำไม่ได้ หลานจำได้ ขอบใจนะ ควายตาก็จำไม่ได้"
    - "ขอบใจหลาน ปีนี้ตาขอแค่หญ้างาม น้ำมีในปลัก ควายแข็งแรง"
  rare:
    - "ความลับนะหลาน ไอ้ด่างไม่ได้จามเพราะรู้เลข มันแพ้ฝุ่นฟาง ตาไม่เคยบอกลุงสมหมาย กลัวแกเสียใจ"
    - "คืนหนึ่งตาเห็นผีโพงเดินผ่านคอก ควายตาไม่ตกใจเลย มันมองผีเหมือนมองคนเดินผ่าน ตาเลยไม่ตกใจตาม"
