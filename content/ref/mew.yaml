id: mew
name: "น้องมิว"
role: "เด็กหญิง ป.4 โรงเรียนประจำตำบล อยู่กับยาย แม่ทำงานโรงงานในเมือง แชมป์กระโดดหนังยางของหมู่ 4"
voice: "เสียงใส พูดเร็ว ชอบถามว่า ทำไม แทนตัวเองว่า หนู ลงท้าย ค่ะ คะ นะ เรียกผู้เล่นว่า พี่ หรือ พี่{player} ชวนเล่นตลอด เถียงกับน้องโอ๊ตเป็นประจำ"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "สวัสดีค่ะพี่{player} หนูจะไปโรงเรียนแล้ว วันนี้ครูเต้ยให้วาดรูปควาย"
    - "พี่ ยายหนูให้เอาไข่ต้มมาฝากพี่สองฟอง ยายบอกว่าพี่ผอม"
    - "ตอนเช้าหอกระจายข่าวดังมาก หนูตื่นทุกวันเลย แต่ยายบอกว่าดีจะได้ไม่สาย"
  greet_noon:
    - "พักเที่ยงแล้วค่ะ หนูกินข้าวที่โรงเรียน วันนี้มีแกงจืดฟักทอง หนูเขี่ยฟักทองออก"
    - "ร้อนจังพี่ หนูกับโอ๊ตไปนั่งใต้ต้นมะขามหน้าโรงเรียนกัน"
    - "พี่ไปไหนคะ หนูไปด้วยได้ไหม ไม่ได้เหรอ งั้นซื้อน้ำแข็งใสมาฝากนะ"
  greet_evening:
    - "เลิกเรียนแล้ว! พี่มาเล่นกระโดดหนังยางกันไหม หนูถึงระดับเอวแล้วนะ"
    - "เย็นแล้วค่ะ ยายเรียกให้กลับก่อนมืด หนูขอเล่นอีกแค่รอบเดียว"
    - "พี่ดูท้องฟ้าสิ สีส้มเหมือนน้ำส้มที่ร้าน 24 ชม."
  greet_night:
    - "หนูต้องกลับบ้านแล้วค่ะ ยายบอกว่าสามทุ่มผีออก พี่ก็รีบกลับนะ"
    - "หมาหอนแล้ว! หนูกลัว พี่อย่าอยู่ข้างนอกนะคะ"
    - "หนูจะเข้าบ้านแล้ว ยายสวดมนต์ให้ทุกคืน หนูขอให้ยายสวดเผื่อพี่ด้วย"
  weather_rain:
    - "ฝนตก! หนูกับโอ๊ตจะไปเหยียบแอ่งน้ำ ยายไม่ให้ แต่ยายยังไม่เห็น"
    - "ฝนตกไม่ได้เล่นหนังยาง หนูเลยพับเรือกระดาษลอยในร่องน้ำ เรือหนูชนะเรือโอ๊ต"
    - "พี่ไม่มีร่มเหรอคะ เอาใบตองบังหัวสิ หนูทำเป็นนะ"
  weather_hot:
    - "ร้อนจนหนังยางเหนียว กระโดดแล้วติดขา"
    - "ร้อนมากเลยค่ะพี่ ซื้อไอติมให้หนูได้ไหม แท่งละสิบบาทเอง"
    - "ยายบอกว่าร้อนๆ อย่าวิ่งเล่นกลางแดด เดี๋ยวเป็นลม หนูเลยวิ่งในร่ม"
  weather_storm:
    - "ฟ้าร้องดังมาก หนูนอนอยู่ใต้ผ้าห่มกับยายค่ะ"
    - "พายุมาแล้วพี่! ไปหลบในบ้านเร็ว"
    - "ลมแรงจนหนังยางที่หนูแขวนไว้ปลิวไปเลย ฮือ"
  weather_pm25:
    - "หมอแอนแจกหน้ากากที่โรงเรียน ของหนูเป็นลายแมว"
    - "ฝุ่นเยอะ ครูเต้ยไม่ให้เล่นข้างนอก หนูเลยเล่นมอญซ่อนผ้าในห้องเรียน"
    - "ทำไมฟ้าเป็นสีเทาคะพี่ หนูไม่ชอบเลย"
  season_rainy:
    - "หน้าฝนมีกบเยอะ หนูกับโอ๊ตไปส่องกบกัน หนูจับได้สามตัว แล้วปล่อยไปหมดเลย"
    - "หน้าฝนนาเขียวสวยมาก หนูวาดรูปส่งครูเต้ยได้ดาวห้าดวง"
    - "เข้าพรรษาหนูไปแห่เทียนกับยาย หนูถือเทียนเล่มเล็กสุด"
  season_cool:
    - "หน้าหนาวแล้ว! หนูชอบมากเลย ได้ใส่เสื้อกันหนาวลายหมีที่แม่ส่งมาให้"
    - "วันเด็กใกล้แล้วค่ะพี่ หนูจะลงแข่งกระโดดหนังยาง ปีนี้หนูต้องชนะโอ๊ต"
    - "ลอยกระทงหนูทำกระทงใบตองเอง ยายช่วยพับนิดเดียว"
  season_dry:
    - "หน้าร้อนปิดเทอม! หนูจะเล่นทั้งวันเลย"
    - "สงกรานต์แม่หนูจะกลับมาบ้าน หนูนับวันรออยู่ อีกไม่กี่วันแล้ว"
    - "ร้อนจนน้ำในบ่อหลังบ้านแห้ง ปลาหางนกยูงของหนูต้องย้ายไปอยู่ในโอ่ง"
  heart_low:
    - "สวัสดีค่ะ พี่เป็นใครคะ ยายบอกว่าพี่มาอยู่บ้านที่ว่างใช่ไหม"
    - "หนูชื่อมิวค่ะ อยู่ ป.4 ยายบอกว่าต้องไหว้ผู้ใหญ่ หนูไหว้แล้วนะ"
    - "พี่เล่นกระโดดหนังยางเป็นไหมคะ ไม่เป็นเหรอ หนูสอนได้นะ"
  heart_mid:
    - "พี่ หนูเก็บดอกไม้มาให้ ไม่ได้เด็ดจากสวนใครนะ เก็บจากข้างทาง"
    - "พี่มาเล่นมอญซ่อนผ้ากับหนูกับโอ๊ตนะ ห้ามวิ่งช้าเหมือนโอ๊ต"
    - "หนูอ่านหนังสือได้เร็วขึ้นแล้วค่ะ ครูเต้ยชม พี่ฟังหนูอ่านไหม"
  heart_high:
    - "พี่ หนูคิดถึงแม่ แม่ทำงานในเมือง กลับบ้านปีละสองครั้ง แต่วิดีโอคอลทุกคืนวันอาทิตย์"
    - "โตขึ้นหนูอยากเป็นพยาบาลเหมือนหมอแอน จะได้ดูแลยาย ยายปวดเข่าทุกวัน"
    - "พี่ห้ามบอกใครนะ หนูกลัวผี แต่หนูทำเป็นไม่กลัวเพราะโอ๊ตกลัวกว่า"
  topic_news:
    - "ข่าวใหญ่ค่ะพี่! แมวป้าแต๋วออกลูกห้าตัว มีตัวหนึ่งสีส้มทั้งตัวเลย"
    - "ครูเต้ยบอกว่าจะมีแข่งวิ่งเปรี้ยวที่โรงเรียน หนูอยู่ทีมสีฟ้า"
    - "โอ๊ตทำฟันหน้าหลุดเมื่อวาน เขาโยนขึ้นหลังคาบ้าน บอกว่าฟันจะได้ขึ้นใหม่"
  topic_advice:
    - "ถ้าพี่หาเห็ด ต้องไปกับป้าทองใบนะคะ ยายบอกว่าเห็ดบางอันกินแล้วไปหาหมอ"
    - "พี่อยากเป็นเพื่อนกับยายหนู ให้เอาขนมครกมานะ ยายชอบมาก"
    - "กลับบ้านก่อนมืดนะพี่ ถ้ากลับไม่ทันไปร้าน 24 ชม. พี่ตั้มเปิดไฟสว่างทั้งคืน"
  topic_smalltalk:
    - "พี่ชอบสีอะไรคะ หนูชอบสีม่วง หนังยางของหนูก็สีม่วง"
    - "พี่ว่าควายฉลาดไหม ตาเผือกบอกว่าควายจำทางกลับบ้านได้ หนูยังจำทางไปตลาดนัดไม่ได้เลย"
    - "หนูเก็บฝาขวดได้สามสิบอัน จะเอาไปแลกขนมที่ร้านป้าแต๋ว ป้าแต๋วบอกว่าไม่ได้ แต่ให้อมยิ้มมาแทน"
  topic_about_self:
    - "หนูอยู่กับยายค่ะ ยายสอนหนูหุงข้าวด้วยหม้อดินด้วยนะ"
    - "หนูเป็นแชมป์กระโดดหนังยางของหมู่สี่ ระดับสูงสุดหนูกระโดดได้ถึงหูแล้ว"
    - "หนูชอบวาดรูปค่ะ หนูวาดรูปแม่ติดไว้ข้างฝาบ้าน วาดให้แม่ยิ้มทุกรูป"
  topic_about_others:
    - "โอ๊ตชอบโกงตอนเล่นทอยเส้น ทอยแล้วแอบเลื่อนเส้น หนูเห็นทุกครั้ง"
    - "ครูเต้ยใจดีมาก เวลาหนูอ่านไม่ออก ครูไม่ดุ ครูนั่งอ่านกับหนู"
    - "เณรต้นเล่นมอญซ่อนผ้าไม่ได้ เพราะต้องสำรวม หนูเลยให้เณรเป็นคนนับแทน"
  gossip_theft:
    - "พี่คะ ยายบอกว่ามีคนเอาของคนอื่นไป แล้วชื่อพี่โผล่มา ไม่จริงใช่ไหมคะ"
    - "ครูเต้ยสอนว่าเอาของคนอื่นต้องคืนแล้วขอโทษ พี่ทำได้นะ หนูช่วยไปด้วยก็ได้"
  gossip_cheating:
    - "ผู้ใหญ่คุยกันว่าพี่มีแฟนหลายคน หนูไม่เข้าใจ แต่ยายบอกให้เด็กอย่าฟังเรื่องผู้ใหญ่"
    - "หนูมีเพื่อนสนิทคนเดียวคือโอ๊ต... ก็ได้ สองคน มีแมวด้วย"
  gossip_unpaid_bill:
    - "พี่ไม่มีเงินเหรอคะ หนูมีเงินในกระปุกหมูยี่สิบบาท พี่เอาไหม"
    - "ยายบอกว่าบ้านพี่อาจจะไฟดับ พี่มานอนบ้านยายได้นะ ยายมีตะเกียง"
  gossip_small_envelope:
    - "ซองคืออะไรคะ หนูใส่ซองให้ยายวันเกิด ข้างในเป็นรูปวาด ยายดีใจมาก"
    - "ป้าแต๋วนับซองเก่งมาก หนูเห็นป้าจดในสมุดเล่มใหญ่"
  gossip_skip_longkhaek:
    - "พี่ไม่ไปช่วยเกี่ยวข้าวบ้านตาเผือกเหรอ หนูกับโอ๊ตไปช่วยถือน้ำนะ"
    - "ครูเต้ยบอกว่าช่วยเพื่อนแล้วเพื่อนจะช่วยเรา พี่ไปช่วยเขาบ้างนะคะ"
  player_fainted:
    - "พี่! ทุกคนบอกว่าเมื่อคืนผีจับพี่ พี่เจ็บไหมคะ หนูเป่าให้"
    - "พี่อย่าอยู่ข้างนอกตอนดึกอีกนะ หนูกลัวพี่หาย"
  player_new_vehicle:
    - "รถใหม่! พี่พาหนูนั่งรอบหมู่บ้านได้ไหม ต้องขออนุญาตยายก่อน"
    - "รถพี่สีสวยค่ะ หนูจะวาดรูปรถพี่ส่งครูเต้ย"
  player_lottery_win:
    - "พี่ได้เงินเยอะเหรอคะ ทุกคนพูดกันใหญ่ ซื้อหนังยางให้หนูถุงหนึ่งได้ไหม"
    - "ยายบอกว่าได้เงินแล้วต้องเก็บ ไม่ใช่ใช้หมด พี่เก็บในกระปุกหมูไหมคะ"
  player_muddy:
    - "พี่ตัวเลอะโคลนเหมือนควายเลย! หนูหัวเราะไม่ได้นะ แต่หนูหัวเราะแล้ว"
    - "พี่ไปดำนามาเหรอ ทีหลังพาหนูไปด้วย หนูอยากเลอะบ้าง"
  player_rich:
    - "พี่รวยแล้วเหรอคะ ซื้อขนมให้เด็กทั้งหมู่บ้านเลยได้ไหม"
    - "พี่มีเงินเยอะ แต่พี่ยังเล่นกับหนูเหมือนเดิมใช่ไหมคะ"
  player_in_debt:
    - "หนี้คืออะไรคะพี่ ยายบอกว่าคือเงินที่ต้องคืน หนูยังติดเงินโอ๊ตห้าบาทอยู่เลย"
    - "พี่ไม่ต้องเศร้านะ หนูให้ลูกอมพี่เม็ดหนึ่ง"
  player_sick:
    - "พี่ป่วยเหรอคะ ไปหาหมอแอนนะ หมอแอนฉีดยาไม่เจ็บเลย... เจ็บนิดเดียว"
    - "หนูวาดรูปให้กำลังใจพี่ เป็นรูปพี่หายป่วยแล้ววิ่งเล่นกับหนู"
  player_married:
    - "พี่แต่งงานแล้ว! หนูไปงานได้ไหมคะ หนูจะใส่ชุดสวยที่แม่ส่งมา"
    - "พี่แต่งงานแล้วยังมาเล่นกับหนูได้ไหม ชวนแฟนพี่มาด้วยก็ได้"
  event_disaster:
    - "น้ำท่วมโรงเรียนค่ะพี่ ครูเต้ยให้หยุดเรียน แต่หนูเป็นห่วงหนังสือในห้องสมุด"
    - "หนูกับยายไปนอนที่ศาลาวัด ป้าทองใบทำข้าวต้มให้กิน อร่อยมาก"
  event_election:
    - "มีรถแห่ผ่านบ้านหนูเปิดเพลงเสียงดังมาก หนูเต้นตามได้ด้วย"
    - "ผู้ใหญ่ไปเลือกตั้งกัน เด็กยังเลือกไม่ได้ หนูเลยเลือกว่าจะกินขนมครกหรือกล้วยทอด"
  event_company_water:
    - "บ่อปลาหางนกยูงที่โรงเรียนแห้งค่ะ ครูเต้ยบอกว่าน้ำใต้ดินลดลง หนูไม่เข้าใจว่าน้ำไปไหน"
    - "ยายต้องซื้อน้ำมาใส่โอ่ง ยายบอกว่าเมื่อก่อนน้ำฟรี"
  event_festival_near:
    - "{festival}ใกล้แล้ว! หนูอยากไปเที่ยวงานกับยาย พี่ไปด้วยไหมคะ"
    - "หนูเก็บเงินไว้ไปเล่นที่งาน{festival}ได้สามสิบบาทแล้ว"
  gift_love:
    - "{item}! หนูชอบที่สุดเลยค่ะ ขอบคุณค่ะพี่ หนูจะเก็บไว้อวดโอ๊ต"
    - "ให้หนูจริงเหรอคะ พี่ใจดีที่สุดในหมู่บ้านเลย"
  gift_like:
    - "{item} ขอบคุณค่ะพี่"
    - "ชอบค่ะ หนูจะแบ่งให้ยายด้วย"
  gift_neutral:
    - "อ๋อ {item} ขอบคุณค่ะ"
    - "หนูจะเอาไปให้ยายดูนะคะ"
  gift_dislike:
    - "{item}... หนูไม่ค่อยชอบค่ะ แต่ขอบคุณนะคะ"
    - "อันนี้ให้ยายดีกว่าค่ะพี่"
  gift_hate:
    - "ไม่เอา! {item} หนูไม่กิน ยายบังคับทุกวันแล้ว"
    - "พี่แกล้งหนูใช่ไหมคะ หนูไม่ชอบเลย"
  birthday:
    - "วันนี้วันเกิดหนู! พี่จำได้ด้วย หนูดีใจมากค่ะ แม่จะวิดีโอคอลมาตอนค่ำ"
    - "ขอบคุณค่ะพี่ หนูอธิษฐานว่าขอให้แม่กลับบ้านบ่อยๆ"
  rare:
    - "พี่รู้ไหม หนูเคยเห็นแสงลอยๆ ที่ทุ่งตอนกลางคืนจากหน้าต่าง ยายบอกว่าหิ่งห้อย หนูว่าตัวใหญ่ไปนะ"
    - "หนูซ่อนผ้าเช็ดหน้าไว้หลังศาลาวัดตอนเล่นมอญซ่อนผ้าเมื่อปีที่แล้ว ยังไม่มีใครหาเจอเลย"
    - "หนูเขียนจดหมายถึงแม่ทุกอาทิตย์ แต่ไม่เคยส่ง หนูเก็บไว้ให้แม่อ่านตอนกลับบ้านทีเดียว"
  flirt: []
gifts:
  love: ["ขนมครก", "ข้าวเหนียวมะม่วง", "หนังยาง", "ดินสอสี"]
  like: ["กล้วยบวชชี", "ดอกมะลิ", "ไข่ไก่", "กล้วยตาก"]
  dislike: ["ปลาร้า", "พริกขี้หนู"]
  hate: ["มะระขี้นก", "ขยะ"]
choices:
  - id: mew_c1
    min_heart: 0
    prompt: "พี่คะ มาเล่นกระโดดหนังยางกับหนูไหม พี่ต้องเป็นคนถือหนังยางนะ"
    options:
      - text: "ได้เลย ถือให้ทั้งวันเลย"
        heart: 2
        reply: "เย้! ระดับแรกที่ข้อเท้า แล้วขึ้นไปที่เข่า ที่เอว พี่ถือให้นิ่งนะคะ"
      - text: "ขอลองกระโดดด้วยได้ไหม"
        heart: 1
        reply: "ได้ค่ะ แต่พี่ตัวใหญ่ต้องเริ่มที่ระดับหูเลยนะ หนูล้อเล่นค่ะ เริ่มที่ข้อเท้า"
      - text: "ไม่ว่าง ไปเล่นกับเพื่อนเถอะ"
        heart: -1
        reply: "ก็ได้ค่ะ... หนูไปเล่นกับโอ๊ตก็ได้"
  - id: mew_c2
    min_heart: 4
    prompt: "พี่คะ หนูอยากไปเรียนต่อในเมืองเหมือนที่ครูเต้ยบอก แต่หนูไม่อยากทิ้งยาย หนูควรทำไง"
    options:
      - text: "ลองคุยกับยายดูนะ ยายอาจจะอยากให้มิวไปเรียน"
        heart: 2
        reply: "จริงด้วย หนูยังไม่เคยถามยายเลย เย็นนี้หนูจะถามค่ะ"
      - text: "ยังมีเวลาอีกหลายปี ตอนนี้ตั้งใจเรียนก่อน"
        heart: 1
        reply: "ค่ะพี่ หนูจะอ่านหนังสือทุกวันเลย จะได้เลือกได้ทีหลัง"
      - text: "อยู่บ้านเถอะ ในเมืองไม่สนุกหรอก"
        heart: -1
        reply: "แต่หนูอยากเป็นพยาบาลนะคะ... หนูจะไปถามครูเต้ยอีกที"
banter:
  - with: oat
    lines:
      - ["mew", "โอ๊ต! เมื่อกี้แกเหยียบเส้นตอนทอย หนูเห็น"]
      - ["oat", "ไม่ได้เหยียบ ลมพัดเส้นมาโดนเท้าผม"]
      - ["mew", "ลมที่ไหนพัดเส้นชอล์กได้"]
      - ["oat", "ลมแรงพิเศษ... ทอยใหม่ก็ได้"]
  - with: ton
    lines:
      - ["mew", "เณรต้น มาเล่นวิ่งเปรี้ยวกันไหม ขาดคนอีกคนเดียว"]
      - ["ton", "ผมวิ่งไม่ได้ครับ ต้องสำรวม แต่ผมเป็นกรรมการนับคะแนนให้ได้"]
      - ["mew", "งั้นเณรนับให้ทีมหนูเยอะๆ นะ"]
      - ["ton", "นับตามจริงครับ ศีลข้อสี่"]
