id: hong
name: "เจ๊หงษ์"
role: "แม่ค้าแผงผลไม้และของแห้งในตลาดนัด (พุธ/เสาร์) เจ้ามือหวยใต้ดิน"
voice: "แทนตัวเองว่าเจ๊ เรียกผู้เล่นว่าน้อง ลงท้าย ย่ะ นะยะ เจ๊บอกเลย ปากจัด พูดเร็ว ต่อราคาไม่ลง ใจถึง หรี่เสียงทุกครั้งที่พูดเรื่องเลข"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "เช้าแล้วน้อง มะม่วงน้ำดอกไม้เจ๊เพิ่งลงจากรถ กิโลหกสิบ ไม่ต่อนะยะ"
    - "มาเช้าได้ของสวย มาสายได้ของช้ำ เลือกเอาเองย่ะ"
    - "ตลาดนัดวันนี้คนเยอะ เดินดีๆ อย่าเหยียบตะกร้าเจ๊ล่ะ"
  greet_noon:
    - "เที่ยงแล้ว ผลไม้เจ๊ลดสิบบาททุกกอง ไม่ใช่ใจดีนะ แดดมันแรง"
    - "เจ๊ยังไม่ได้กินข้าวเลย ใครจะซื้อรีบซื้อ เจ๊จะได้ไปร้านพี่หน่อย"
    - "หิวก็ซื้อกล้วยตากเจ๊ไปกินรองท้องสิ ห่อละยี่สิบ หวานเจี๊ยบ"
  greet_evening:
    - "เย็นแล้ว เจ๊เก็บแผงแล้ว เหลือส้มโอสองลูก เอาไปลูกละห้าสิบ ขาดทุนแล้วย่ะ"
    - "ห้าโมงเย็นหอกระจายข่าวประกาศราคาผลไม้ ไม่ต้องฟังหรอก ฟังเจ๊นี่แหละ"
    - "ตลาดวายแล้วน้อง พรุ่งนี้ไม่มีตลาดนะ เจอกันวันพุธหรือวันเสาร์"
  greet_night:
    - "สองทุ่มแล้วยังเดินอยู่อีก อยากเจอผีหรือไงย่ะ เจ๊ปิดประตูแล้วนะ"
    - "ถ้าจะมาถามเลข มาพรุ่งนี้ คืนนี้ผีมันก็ถามเหมือนกัน เจ๊ไม่ตอบ"
  weather_rain:
    - "ฝนตกตลาดเงียบ ผลไม้เจ๊ช้ำหมด ใครเอาไปทำน้ำผลไม้ปั่นเจ๊ลดครึ่ง"
    - "ผ้าใบเจ๊รั่วตรงกองมังคุดพอดี ฟ้ากลั่นแกล้งเจ๊แน่ๆ"
    - "ฝนตกคนไม่มาตลาด แต่คนยังโทรมาถามเลขนะ ฝนไม่เคยหยุดความหวัง"
  weather_hot:
    - "ร้อนจนกล้วยเจ๊สุกคาหวีเลย ซื้อไปทำกล้วยตากเหอะน้อง"
    - "แดดแบบนี้เจ๊กางร่มสองคัน ยังร้อนอยู่ดี หน้าเจ๊ไหม้จนป้าแต๋วถามว่าไปทะเลมาเหรอ"
  weather_storm:
    - "พายุมาเจ๊ไม่ออกตลาด ใครอยากได้ของโทรมา เจ๊ส่งให้ ค่าส่งยี่สิบ"
    - "ลมพัดเต็นท์เจ๊ไปติดต้นมะขามหน้าวัด ดาบเสถียรเดินผ่านแล้วถามว่าเต็นท์ใคร ใครจะตอบล่ะย่ะ"
  weather_pm25:
    - "ฝุ่นเยอะ ผลไม้เจ๊ต้องคลุมผ้า ลูกค้าบอกมองไม่เห็นว่าสวยไหม เชื่อเจ๊สิ สวย"
    - "หน้ากากเจ๊ใส่ทั้งวัน ตะโกนเรียกลูกค้าเสียงอู้อี้ ลูกค้าคิดว่าเจ๊ร้องเพลง"
  season_rainy:
    - "หน้าฝนทุเรียนกับมังคุดมาแล้ว เจ๊ขายดีสุดของปี แต่ช้ำง่ายสุดของปีด้วย"
    - "หน้าฝนคนว่างงานรอข้าวโต มาซื้อเลขเจ๊เยอะ เจ๊ไม่ได้ชวนนะ เขามาเอง"
    - "เข้าพรรษาแล้ว ลุงสมหมายบอกจะเลิกหวยสามเดือน ผ่านไปสามวันมาหาเจ๊แล้ว"
  season_cool:
    - "หน้าหนาวส้มกับสตรอว์เบอร์รีจากภาคเหนือมาแล้ว ราคาแรงแต่คนซื้อไปฝากญาติ"
    - "งานวัดประจำปีเจ๊ไปตั้งแผงทุกปี ขายดีกว่าตลาดนัดสามเท่า"
    - "ลมหนาวมาเจ๊ใส่เสื้อหนาวทับผ้ากันเปื้อน ดูเหมือนเจ๊เป็นโปเตโต้ย่ะ"
  season_dry:
    - "หน้าแล้งมะม่วงล้นตลาด ราคาตกจนเจ๊อยากร้องไห้ ข้าวเหนียวมะม่วงเลยถูกทั้งตำบล"
    - "สงกรานต์คนกลับบ้าน เจ๊ขายผลไม้กระเช้าได้หมด คนกรุงเทพฯ ไม่ค่อยต่อราคา เจ๊ชอบ"
  heart_low:
    - "จะเอาอะไร ชี้มาเลย อย่าบีบผลไม้เจ๊นะ ช้ำแล้วต้องซื้อ"
    - "ราคาเขียนไว้แล้วน้อง ไม่ต่อ ต่อเจ๊ขึ้นราคา"
    - "เด็กกรุงเทพฯ กลับมาใช่ไหม รู้จักมะม่วงพันธุ์ไหนบ้างล่ะย่ะ"
  heart_mid:
    - "น้องมาบ่อยเจ๊ให้ส่วนลด กิโลละห้าบาท อย่าไปบอกป้าแต๋วนะ เดี๋ยวทั้งตำบลมาขอ"
    - "เจ๊แถมเงาะให้หนึ่งกำ ไม่ใช่ใจดี เงาะมันจะเน่าแล้ว"
    - "น้องนี่หน้าตาดวงดีนะ เจ๊ดูคนแม่น"
  heart_high:
    - "เจ๊ขายผลไม้เลี้ยงลูกสามคนคนเดียว ผัวเจ๊ไปทำงานต่างประเทศแล้วไม่กลับมา ตอนนี้ลูกเจ๊จบมหาลัยหมดแล้วนะย่ะ"
    - "หวยน่ะเจ๊ไม่ได้อยากทำหรอก มันเริ่มจากรับแทงให้เพื่อนบ้าน แล้วมันก็โตเป็นของที่เจ๊ปล่อยมือไม่ได้"
    - "บางงวดคนถูกเยอะเจ๊จ่ายไม่ไหว ต้องขายทองเจ๊เอง แต่เจ๊ไม่เคยเบี้ยวใครสักบาท"
  topic_news:
    - "มีแผงหมูปิ้งเจ้าใหม่มาขายตลาดนัด คิดว่าจะแย่งลูกค้าเจ๊ได้เหรอ เจ๊ขายผลไม้ย่ะ ไม่เกี่ยวกัน"
    - "ได้ข่าวว่าบริษัทจะมาเปิดมินิมาร์ทใกล้ตลาด เจ๊ไม่กลัวหรอก เจ๊กลัวป้ายห้ามตั้งแผงมากกว่า"
    - "งวดนี้เลขในกลุ่ม LINE มาจากควายลุงสมหมายอีกแล้ว ควายตัวนั้นทำงานหนักกว่าลุงอีก"
  topic_advice:
    - "จะขายของในตลาดนัด จัดของให้เป็นกองสวยๆ ป้ายราคาตัวโต คนชอบของที่ดูเยอะ"
    - "อย่าเอาของช้ำไว้ข้างหน้า เอาไว้ข้างหลังแล้วลดราคาตอนบ่ายสาม ขายหมดทุกกอง"
    - "หวยน่ะ ซื้อระยะยาวขาดทุนแน่นอนนะน้อง เจ๊พูดในฐานะเจ้ามือ เชื่อเจ๊สักครั้ง"
  topic_smalltalk:
    - "น้องว่าเจ๊ทาลิปสีนี้สวยไหม แดงทับทิม แดงกว่ามะม่วงหาวมะนาวโห่อีก"
    - "เจ๊ดูละครหลังข่าวกับป้าแต๋ว พอนางเอกร้องไห้ ป้าร้องตาม เจ๊ด่าพระเอก"
    - "เมื่อวานแมวขโมยปลาทูเจ๊ไปตัวนึง เจ๊จำหน้ามันได้แล้วนะย่ะ"
  topic_about_self:
    - "เจ๊ขายของตลาดนัดมายี่สิบห้าปี เสียงเจ๊ดังที่สุดในตลาด ไม่มีใครเถียง"
    - "เจ๊เป็นคนชัดเจน ไม่ชอบก็บอกว่าไม่ชอบ ชอบก็บอกว่าราคาเท่าไหร่"
    - "เจ๊ไม่เคยซื้อหวยเลยนะ เจ๊รู้ว่าใครได้ ก็เจ๊ไง"
  topic_about_others:
    - "ดาบเสถียรเดินผ่านแผงเจ๊ทุกวันพุธ ทำเป็นไม่เห็นโพย แต่ขอเงาะไปกินทุกครั้ง ใครจับใครกันแน่ย่ะ"
    - "ลุงสมหมายลูกค้าประจำ ป้าพรมาด่าเจ๊ทุกงวด เจ๊ไม่ว่าหรอก ป้าก็ซื้อผลไม้เจ๊ทุกงวดเหมือนกัน"
    - "เณรต้นน่ะ ชาวบ้านไปขอเลขจากเณร เจ๊บอกว่าอย่าไปกวนเด็กเลย เณรเขาตั้งใจเรียนธรรมะ เลขก็ไม่เคยถูกด้วย"
  gossip_theft:
    - "ขโมยของเหรอน้อง เจ๊จะนับผลไม้ทุกครั้งที่น้องเดินผ่านนะย่ะ"
    - "ข่าวนี้ทั้งตลาดรู้แล้ว ใครจะซื้อของจากคนมือไว เจ๊ว่าล้างชื่อเร็วๆ เถอะ"
  gossip_cheating:
    - "คบซ้อนเหรอ เจ๊เห็นคนแบบนี้มาเยอะ สุดท้ายเหลือคนเดียวคือตัวเองย่ะ"
    - "ทั้งตลาดคุยเรื่องน้องหมดเลย ข่าวน้องดังกว่าราคามะม่วงอีก"
  gossip_unpaid_bill:
    - "ค่าไฟค้างแต่ยังมาซื้อทุเรียนเหรอน้อง เจ๊ไม่ว่าหรอก แต่คนอื่นเขาว่า"
    - "ไฟดับตู้เย็นเสีย ผลไม้ในตู้เน่า มาซื้อของเจ๊ใหม่ก็ได้นะย่ะ"
  gossip_small_envelope:
    - "ใส่ซองร้อยเดียวแล้วนั่งกินจนอิ่มสามรอบ เจ๊เห็นนะย่ะ เจ๊นั่งโต๊ะข้างๆ"
    - "ซองน้อยไม่ผิดหรอก แต่ใส่ซองน้อยแล้วห่อกลับบ้านอีกนี่สิ เจ๊จำ"
  gossip_skip_longkhaek:
    - "เขาไปช่วยน้องเกี่ยวข้าวทั้งวัน น้องไม่ไปคืนเขา ในตลาดเจ๊เรียกว่าเบี้ยวหนี้ย่ะ"
    - "ป้าพรมาบ่นที่แผงเจ๊ครึ่งชั่วโมง เจ๊ขายของไม่ได้เลย เพราะน้องไม่ไปลงแขกนี่แหละ"
  player_fainted:
    - "ได้ข่าวว่าโดนผีจับ ไปตื่นที่ รพ.สต. เจ๊ว่าน้องฝันเห็นเลขหรือเปล่า ล้อเล่นย่ะ หายดีหรือยัง"
    - "ทีหลังกลับบ้านเร็วๆ ผีไม่จ่ายค่ารักษาให้หรอกนะ"
  player_new_vehicle:
    - "รถใหม่! ทะเบียนเลขอะไร เจ๊ขอดูหน่อย ทะเบียนรถใหม่ขายดีทุกงวด"
    - "มีรถแล้วมาช่วยเจ๊ขนผลไม้จากอำเภอหน่อยสิ เจ๊ให้ค่าน้ำมัน"
  player_lottery_win:
    - "ถูกหวยรัฐบาลเหรอ ไม่ใช่ของเจ๊ใช่ไหม ดีแล้ว เจ๊ไม่ต้องจ่าย"
    - "ถูกแล้วหยุดนะน้อง คนส่วนใหญ่ถูกครั้งแรกแล้วเสียคืนหมดในสามงวด เจ๊เห็นมาเยอะ"
    - "ซื้อผลไม้กระเช้าไปไหว้ศาลเจ้าที่หน่อยสิ เจ๊มีกระเช้าละห้าร้อยพอดีเลย"
  player_muddy:
    - "อย่าเข้าใกล้แผงเจ๊นะ โคลนกระเด็นใส่มังคุดหมด"
    - "เพิ่งขึ้นจากนามาใช่ไหม ซื้อแตงโมเจ๊ไปกินแก้ร้อนสิ ชิ้นละสิบ"
  player_rich:
    - "ช่วงนี้รวยนะน้อง ซื้อทุเรียนเจ๊ทั้งลูกไม่ต้องให้ผ่าดูเลย"
    - "รวยแล้วอุดหนุนเจ๊เยอะๆ นะ ตลาดนัดไม่มีคนซื้อ ตลาดก็ตาย"
  player_in_debt:
    - "มีหนี้แล้วอย่ามาแทงหวยเจ๊นะ เจ๊ไม่รับ เจ๊มีหลักการย่ะ"
    - "หนี้น่ะ ค่อยๆ จ่าย เจ๊เคยมีหนี้มากกว่าน้องอีก ยังรอดมาได้"
  player_sick:
    - "ไม่สบายเหรอ กินส้มเยอะๆ วิตามินซี เจ๊ลดให้ห้าบาท"
    - "หน้าซีดแบบนี้ไปหาหมอแอนเลยนะ อย่ามามัวต่อราคาเจ๊"
  player_married:
    - "แต่งงานแล้วเหรอ ยินดีด้วย เจ๊ส่งผลไม้กระเช้าให้หนึ่งกระเช้า ฟรี แต่ครั้งเดียวนะย่ะ"
    - "แต่งแล้วอย่ามาบ่นที่แผงเจ๊เรื่องคู่ล่ะ เจ๊ฟังป้าพรบ่นลุงสมหมายทุกงวดก็พอแล้ว"
  event_disaster:
    - "น้ำท่วมสวนผลไม้หมด เจ๊ต้องไปรับของจากจังหวัดอื่น ราคาเลยแพงขึ้นนะ ไม่ใช่เจ๊โก่ง"
    - "บ้านใครโดนหนัก มาเอาผลไม้เจ๊ไปกินได้เลย วันนี้เจ๊ไม่เก็บตังค์"
  event_election:
    - "ช่วงเลือกตั้งคนมาซื้อกระเช้าเยอะ เอาไปเยี่ยมบ้านชาวบ้าน เจ๊ไม่ถามว่าในกระเช้ามีอะไรนอกจากผลไม้"
    - "ผู้สมัครทุกคนมาเดินตลาดเจ๊ ยิ้มทุกแผง ซื้อแค่มะม่วงลูกเดียว"
  event_company_water:
    - "สวนมะม่วงหลังตำบลน้ำไม่พอแล้ว ลูกเล็กลีบหมด บริษัทนั่นดูดน้ำไปหมด"
    - "คุณธนามาซื้อผลไม้เจ๊ไปทำกระเช้าแจกชาวบ้าน เอาน้ำเขาไป แล้วเอาผลไม้มาคืน ตลกดีย่ะ"
  event_festival_near:
    - "{festival} ใกล้แล้ว เจ๊สั่งผลไม้ไหว้มาเยอะ จองก่อนได้ก่อนนะ"
    - "{festival} ปีนี้เจ๊ไปตั้งแผงแน่นอน มาซื้อที่บูธเจ๊ด้วยล่ะ"
  gift_love:
    - "{item}! น้องรู้ได้ไงว่าเจ๊ชอบ ใครบอก ป้าแต๋วใช่ไหม"
    - "ของดีแบบนี้ เจ๊จะลดให้น้องตลอดเดือนเลย สัญญา"
  gift_like:
    - "ขอบใจนะน้อง {item} ใช้ได้เลยย่ะ"
    - "ของฝากเหรอ เจ๊ชอบนะ คนในตลาดไม่ค่อยให้อะไรเจ๊ นอกจากคำบ่น"
  gift_neutral:
    - "อ้อ {item} เจ๊รับไว้ก่อนนะ"
    - "ขอบใจย่ะ เจ๊เก็บไว้"
  gift_dislike:
    - "{item} เหรอ เจ๊ไม่ค่อยใช้ แต่ขอบใจที่อุตส่าห์เอามา"
    - "ผลไม้ช้ำเอามาให้แม่ค้าผลไม้ น้องกล้าดีนะย่ะ"
  gift_hate:
    - "ใบเตือนจากโรงพักเหรอ! เอามาให้เจ๊ทำไม จะแกล้งเจ๊ใช่ไหม"
    - "ของแบบนี้อย่าเอามาให้เจ๊อีกนะ เจ๊จำหน้าน้องได้แล้ว"
  birthday:
    - "วันเกิดเจ๊น้องก็จำได้ด้วย วันนี้ผลไม้เจ๊ลดทั้งแผงสิบเปอร์เซ็นต์"
    - "แก่อีกปีแล้ว แต่ปากเจ๊ยังไม่แก่ย่ะ"
  rare:
