    - "น้ำท่วมแบบนี้ผักแพงหมด พี่ต้องใช้ผักที่มีในตู้ไปก่อน ใครมีผักเหลือขายให้พี่ได้นะ"
    - "ถุงยังชีพ อบต. มีแต่บะหมี่กับปลากระป๋อง พี่จะสอนทำต้มยำปลากระป๋องให้ อร่อยกว่าที่คิด"
  event_election:
    - "ช่วงเลือกตั้งผู้สมัครมากินร้านพี่ทุกคน ยิ้มให้ทุกคน จ่ายเงินตรงหรือเปล่าพี่ก็จำได้หมด"
