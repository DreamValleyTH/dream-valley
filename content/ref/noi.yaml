    - "ดำนามาเหนื่อยๆ ต้องกินเยอะหน่อย พี่ให้ชามพิเศษราคาชามธรรมดา"
    - "โคลนแบบนี้แปลว่าทำงานหนักมา พี่ชอบคนแบบนี้ กินให้อิ่มนะ"
  player_rich:
