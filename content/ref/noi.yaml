    - "ทำอาหารขายช่วยได้นะน้อง ทำจานไหนได้เกรดทองขายได้ราคาดี พี่ช่วยสอน"
    - "ช่วงตึงๆ ต้มจืดเต้าหู้หมูสับหม้อเดียวกินได้สองวัน ถูกแล้วยังดีต่อสุขภาพ"
  player_sick:
    - "ไม่สบายเหรอ มากินข้าวต้มปลาร้อนๆ ไม่ใส่พริกนะ พี่ทำให้เดี๋ยวนี้"
    - "ป่วยแล้วกินไม่ครบมื้อ เดี๋ยวโรคกระเพาะตามมาอีก กินน้อยๆ แต่ต้องกินนะน้อง"
    - "พี่ต้มน้ำขิงกับตะไคร้ใส่ขวดไว้ให้ ดื่มอุ่นๆ ก่อนนอน แล้วอย่าลืมไป รพ.สต. ด้วย"
  player_married:
