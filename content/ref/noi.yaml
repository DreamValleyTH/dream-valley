    - "ป้าแต๋วเล่าให้พี่ฟังเรื่องซองน้อง พี่บอกป้าว่าเงินไม่ใช่ทุกอย่าง ป้าบอกว่าแต่ซองคือทุกอย่าง"
    - "งานหน้าไปช่วยพี่ล้างหม้อในงานนะ ซองเท่าไหร่ไม่สำคัญเท่าคนที่อยู่จนเก็บโต๊ะเสร็จ"
  gossip_skip_longkhaek:
    - "ลงแขกต้องไปคืนนะน้อง พี่เตรียมข้าวกล่องไปเลี้ยงคนลงแขกทุกครั้ง เห็นแต่น้องไม่มา"
    - "ป้าพรรอน้องไปช่วยดำนาทั้งเช้า สุดท้ายลุงสมหมายต้องดำเอง หลังเดี้ยงไปสามวัน"
  player_fainted:
    - "ได้ข่าวว่าเมื่อคืนโดนผีจับ ตื่นที่ รพ.สต. แรงเหลือครึ่งเดียวใช่ไหม มากินข้าวต้มปลาพี่ก่อน"
    - "ตื่นมาไม่มีแรงต้องกินให้ดี กินไข่สักฟองนะน้อง พี่ตอกใส่ชามให้แล้ว"
    - "คราวหน้าก่อนออกดึก กินต้มยำกุ้งก่อนนะ ใจกล้าขึ้น เจอผีจะได้ไม่เสียแรงเยอะ"
  player_new_vehicle:
    - "รถใหม่เหรอน้อง ดีจัง ไปตลาดอำเภอซื้อวัตถุดิบมาฝากพี่บ้างนะ"
    - "มีรถแล้วก็ขนผักไปขายตลาดนัดได้ทีละเยอะๆ แล้ว พี่ช่วยรับซื้อด้วย"
    - "ขับรถระวังด้วยนะ อย่าขับไปกินไป น้ำซุปหกเลอะเบาะใหม่หมด"
  player_lottery_win:
    - "ถูกหวยเหรอน้อง! เลี้ยงก๋วยเตี๋ยวคนในร้านทั้งร้านเลยไหม พี่ลดให้สิบเปอร์เซ็นต์"
    - "ยินดีด้วยนะ แต่เก็บไว้ดีๆ อย่าใช้หมดในเดือนเดียว เหมือนลุงสมหมายปีก่อน"
    - "ถูกหวยแล้วซื้อหม้ออบดีๆ สักใบนะน้อง ทำอาหารจะได้ง่ายขึ้น พี่แนะนำแบบจริงจัง"
  player_muddy:
