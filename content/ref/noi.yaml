id: noi
name: "พี่หน่อย"
role: "เจ้าของร้านก๋วยเตี๋ยวในตำบล อดีตแม่ครัวโรงแรมในกรุงเทพฯ ครูสายเชฟ"
voice: "เรียกผู้เล่นว่าน้อง แทนตัวเองว่าพี่ ลงท้าย จ้ะ นะ เนอะ ถามเส้นติดปาก “เส้นอะไรดีจ๊ะ” คำสอนประจำตัว “ชิมก่อนแล้วค่อยเติม” พูดไวมือไว อบอุ่น ห่วงเรื่องกินข้าวให้ครบมื้อ ไม่มีตลกร้าย"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "มาแล้วเหรอน้อง น้ำซุปพี่เคี่ยวตั้งแต่ตีสี่ หอมกระดูกหมูเต็มร้านเลย เส้นอะไรดีจ๊ะ"
    - "กินข้าวเช้าหรือยัง ถ้ายังนั่งเลย มื้อแรกต้องก่อนบ่ายสองนะ ไม่งั้นแรงหายทั้งวัน"
    - "เช้านี้พี่ได้ผักบุ้งสดจากสวนกล้า กรอบมาก ใส่ก๋วยเตี๋ยวเรือให้นะ"
    - "อรุณสวัสดิ์จ้ะ พี่เพิ่งลวกลูกชิ้นเสร็จ ลูกแรกของวันพี่ให้น้องชิมฟรี"
    - "ลุงเชิดเพิ่งกินเสร็จไปขับรถเมล์เที่ยวเก้าโมง น้องมาช้ากว่าลุงนิดเดียวเอง"
    - "ตลาดเช้านี้หมูขึ้นกิโลละสิบ พี่ไม่ขึ้นราคานะ แต่ลูกชิ้นอาจจะเล็กลงนิดนึง ล้อเล่นจ้ะ"
  greet_noon:
    - "เที่ยงแล้ว ร้านพี่คนแน่น นั่งรอแป๊บนะน้อง ชามเล็กสี่สิบ ชามพิเศษห้าสิบจ้ะ"
    - "หิวไหม หน้าน้องบอกว่าหิว พี่อ่านหน้าคนหิวได้แม่นกว่าอ่านหนังสืออีก"
    - "พี่เพิ่งทำน้ำตะไคร้ไว้หม้อใหญ่ แดดแบบนี้กินแล้วไม่เป็นลมแดดนะ"
    - "ครูเต้ยพาเด็กนักเรียนมากินทั้งห้อง พี่ลวกเส้นจนแขนจะหลุดแล้ว"
    - "นั่งตรงหน้าพัดลมเลย ที่ประจำของดาบเสถียร แต่ดาบยังไม่มา น่าจะยังนอนอยู่"
  greet_evening:
    - "เย็นแล้วพี่จะปิดร้านแล้ว แต่ยังเหลือเกาเหลาอยู่สองถุง เอาไปกินมื้อเย็นนะน้อง"
    - "กินมื้อหลังหรือยังจ๊ะ อย่าเอาขนมมาแทนข้าวนะ ขนมไม่นับเป็นมื้อ"
    - "ฟังหอกระจายข่าวรอบห้าโมงหรือยัง พริกขี้หนูพรุ่งนี้ราคาขึ้น พี่ต้องรีบซื้อตุนไว้"
    - "พี่กำลังล้างหม้อ น้องช่วยยกเก้าอี้ขึ้นโต๊ะหน่อยได้ไหม เดี๋ยวพี่แถมลูกชิ้นให้"
    - "เย็นนี้พี่จะทำแกงส้มผักรวมกินเอง ถ้ามาทันพี่ตักแบ่งให้"
  greet_night:
    - "สองทุ่มแล้วน้อง ร้านพี่ปิดแล้วจ้ะ กลับบ้านเถอะ สามทุ่มผีออก"
    - "ยังไม่ได้กินมื้อเย็นเหรอ เดี๋ยวพี่ห่อเส้นกับน้ำซุปให้ กลับไปต้มที่บ้านนะ"
    - "ดึกแล้ว ถ้าไม่ทันจริงๆ ไปร้าน 24 ชม. ฝากบอกตั้มด้วยว่าห้ามกินข้าวเวฟคืนนี้ พี่ฝากก๋วยเตี๋ยวไว้ให้แล้ว"
    - "หมาเริ่มหอนแล้วน้อง พี่ไม่ได้กลัวผีนะ แต่พี่กลัวน้องอดข้าวเพราะไปเป็นลมกลางทุ่ง"
    - "พี่ยังไม่นอน กำลังแช่กระดูกหมูไว้ทำน้ำซุปพรุ่งนี้ น้องรีบกลับนะ"
  weather_rain:
    - "ฝนตกแบบนี้ คนอยากกินอะไรร้อนๆ ร้านพี่ขายดีทุกทีเลย"
    - "ฝนมาแล้ว เข้ามาหลบในร้านก่อนน้อง พี่ชงชาร้อนให้แก้ว"
    - "ฝนตกแปลงผักน้องไม่ต้องรดน้ำ วันนี้ว่างมาหัดทำอาหารกับพี่ไหม"
    - "เห็ดออกหลังฝนนะน้อง ไปเก็บเห็ดเผาะมา พี่สอนทำแกงเห็ดเผาะให้ กินแล้วคุยกับใครก็ถูกใจ"
    - "หลังคาผ้าใบร้านพี่ขังน้ำ น้องช่วยดันให้หน่อย ระวังน้ำราดหัวนะ"
  weather_hot:
    - "ร้อนมากน้อง กินน้ำมะพร้าวปั่นหน่อยไหม ทนร้อนได้ทั้งบ่าย"
    - "อากาศร้อนแบบนี้อาหารบูดไว ทำกับข้าวแล้วกินให้หมดภายในวันนะ"
    - "หน้าเตาพี่ร้อนกว่าข้างนอกอีก พี่ยืนมายี่สิบปี เหงื่อพี่คงเค็มกว่าน้ำปลาแล้ว"
    - "ร้อนๆ แบบนี้พี่แนะนำแกงจืดฟักทอง กินแล้วตัวเย็น ทำงานกลางแดดได้นานขึ้น"
    - "น้ำแข็งพี่ละลายหมดแล้ว รอรถส่งน้ำแข็งอยู่ ใครอยากกินน้ำแข็งเปล่ารอแป๊บนะ"
  weather_storm:
    - "พายุมาแรงมาก พี่ปิดร้านก่อน ผ้าใบปลิวไปแล้วผืนนึง"
    - "ไฟดับ ตู้เย็นพี่ดับด้วย ลูกชิ้นต้องรีบลวกขายให้หมดวันนี้ ลดราคาเหลือชามละสามสิบ"
    - "พายุแบบนี้อยู่บ้านดีกว่าน้อง ต้มข้าวต้มปลากินอุ่นๆ อิ่มท้องสบายใจ"
    - "พี่ใช้เตาถ่านแทนแก๊สวันนี้ น้ำซุปออกกลิ่นควันนิดๆ บางคนบอกอร่อยกว่าเดิมอีก"
  weather_pm25:
    - "ฝุ่นเยอะ พี่ต้องปิดหม้อน้ำซุปตลอด ไม่งั้นได้ก๋วยเตี๋ยวรสฝุ่น"
    - "ฝุ่นแบบนี้ทำงานกลางแจ้งเหนื่อยไวนะน้อง กินต้มยำกุ้งน้ำใสร้อนๆ โล่งจมูกดี"
    - "ใส่หน้ากากแล้วชิมอาหารไม่ได้ พี่ต้องถอดเปิดดมทุกหม้อ ลำบากจริงๆ"
    - "ผักที่ปลูกกลางแจ้งช่วงนี้ล้างหลายน้ำนะน้อง ฝุ่นเกาะใบเยอะ"
  season_rainy:
    - "หน้าฝนหน่อไม้ออก พี่จะสอนทำหน่อไม้ผัดพริก ต้มหน่อไม้ให้ดีก่อนนะ ไม่งั้นขื่น"
    - "เข้าพรรษาแล้ว พี่เตรียมทำแกงไปถวายวัดดงเย็นทุกวันพระ"
    - "หน้าฝนผักบุ้งงามมาก ผัดผักบุ้งไฟแดงนะน้อง กินแล้วปลูกผักขึ้นดี"
    - "กินเจเดือนหน้าแล้ว พี่ต้องเปลี่ยนน้ำซุปเป็นซุปผักทั้งร้าน สิบวันเต็มๆ"
    - "สารทไทยใกล้แล้ว กวนกระยาสารทแข่งกันปีนี้ พี่แพ้ป้าทองใบมาสามปีติด ปีนี้พี่ไม่ยอม"
  season_cool:
    - "หน้าหนาวข้าวใหม่ออก หุงข้าวหอมมะลิใหม่หอมไปถึงหน้าร้านเลยน้อง"
    - "อากาศเย็นแบบนี้ก๋วยเตี๋ยวน้ำตกขายดีที่สุด คนต่อคิวยาว"
    - "งานกฐินพี่ต้องไปช่วยครัววัด ร้านปิดสองวันนะน้อง ไปช่วยพี่ล้างผักไหม"
    - "กำฟ้าไทยพวนปีนี้ยายจันทร์จะสอนเผาข้าวหลาม พี่ขอไปเรียนด้วย อายุเท่าไหร่ก็ยังเรียนได้"
    - "หน้าหนาวผิวแห้ง พี่ทามะพร้าวน้ำมันทุกเช้า กลิ่นเหมือนขนมครกเลยน้อง"
  season_dry:
    - "หน้าแล้งมะนาวแพง พี่ต้องใช้มะขามเปียกแทนในบางเมนู เปรี้ยวคนละแบบแต่อร่อยนะ"
    - "น้ำประปาไหลอ่อน พี่ต้องรองน้ำล้างชามไว้ตั้งแต่ตีห้า"
    - "สงกรานต์ใกล้แล้ว ลูกหลานกลับบ้าน ร้านพี่จะขายดีที่สุดของปี ต้องเตรียมเส้นไว้สามเท่า"
    - "หน้าแล้งไปเก็บผักหวานป่าได้นะน้อง เอามาแกงกับไข่มดแดง พี่รับซื้อด้วย"
    - "ร้อนแล้งแบบนี้ ทำหมูแดดเดียวดีที่สุด ตากแดดวันเดียวก็ได้ที่"
  heart_low:
    - "เส้นอะไรดีจ๊ะ เล็ก ใหญ่ หมี่ หรือบะหมี่"
    - "น้ำตกหรือน้ำใส เผ็ดไหมจ๊ะ"
    - "ชามละสี่สิบจ้ะ พิเศษห้าสิบ จ่ายตอนกินเสร็จก็ได้"
    - "น้องคนใหม่ใช่ไหม พี่จำหน้าได้แล้ว ทีหลังพี่จะจำด้วยว่าชอบเส้นอะไร"
    - "นั่งตรงไหนก็ได้จ้ะ เครื่องปรุงอยู่บนโต๊ะ ชิมก่อนแล้วค่อยเติมนะ"
  heart_mid:
    - "เส้นเล็กน้ำตก ไม่ใส่ถั่วงอกใช่ไหม พี่จำได้แล้วน้อง"
    - "วันนี้พี่ใส่ลูกชิ้นเพิ่มให้สองลูก อย่าบอกใครนะ"
    - "อยากเรียนทำอาหารไหม เวลาร้านว่างตอนบ่ายสาม มาหาพี่ได้"
    - "พี่ดีใจที่น้องกินข้าวครบมื้อ หน้าตาดูมีแรงขึ้นเยอะเลย"
    - "เวลาพี่เหนื่อย พี่จะนึกถึงหน้าลูกค้าที่กินจนซดน้ำหมดชาม น้องก็เป็นหนึ่งในนั้นนะ"
  heart_high:
    - "น้ำซุปร้านนี้เป็นสูตรแม่พี่นะน้อง แม่ไม่เคยเขียนไว้ พี่ต้องชิมทุกวันจนจำได้ในลิ้น"
    - "พี่เคยเป็นแม่ครัวโรงแรมในกรุงเทพฯ สิบปี ทำอาหารให้คนที่ไม่เคยรู้จักชื่อพี่ ที่นี่ทุกคนเรียกพี่ว่าพี่หน่อย พี่ชอบอันนี้มากกว่า"
    - "แม่พี่ป่วยตอนพี่อายุสามสิบห้า พี่ลาออกกลับมาเปิดร้านต่อ ตอนแรกคิดว่าจะอยู่ปีเดียว นี่สิบห้าปีแล้ว"
    - "พี่กลัวอย่างเดียว คือวันที่คนหนุ่มสาวย้ายออกหมด แล้วร้านพี่ไม่มีใครมานั่ง ร้านก๋วยเตี๋ยวที่ไม่มีคนก็แค่หม้อน้ำร้อน"
    - "พี่อยากเปิดห้องเรียนทำอาหารให้เด็กในตำบล น้องมิวกับน้องโอ๊ตบอกจะมาเรียนเป็นคนแรก"
    - "น้องรู้ไหม ลิ้นของคนเรามันจำบ้านได้ พี่เห็นน้องกินน้ำซุปพี่แล้วนิ่งไป พี่รู้เลยว่าน้องคิดถึงบ้าน"
  topic_news:
    - "ได้ยินว่าสหกรณ์กล้าจะส่งผักอินทรีย์ให้ร้านพี่ทุกอาทิตย์ ราคาแพงกว่านิดหน่อย แต่ผักหวานกรอบกว่ากันเยอะ"
    - "ป้าทองใบบอกว่าแกงจืดงานบุญคราวที่แล้วจืดเกิน พี่ไม่ได้ทำนะ คนทำคือลุงจำรัส"
    - "ครูเต้ยมาขอให้พี่ไปสอนทำอาหารในโรงเรียนเดือนละครั้ง พี่ตื่นเต้นมากเลยน้อง"
    - "ร้านกาแฟเปิดใหม่ข้างตลาดนัด ถ้าตำบลคึกคักขึ้นอีกหน่อย จะมีร้านอาหารเปิดเพิ่มอีกนะ"
    - "หมอแอนขอให้พี่ลดเกลือในน้ำซุปลงนิดนึง คนในตำบลความดันสูงกันเยอะ พี่ก็กำลังปรับสูตรอยู่"
    - "บอลบอกพี่ว่าอาจจะไประยองจริงๆ แล้ว ลูกค้าเส้นใหญ่น้ำตกประจำร้านพี่จะหายไปอีกคน"
  topic_advice:
    - "ชิมปรุงรสอย่าเทน้ำตาลเยอะนะน้อง อาหารจะติดป้ายหวาน กินบ่อยเสี่ยงเบาหวาน เติมทีละนิดแล้วชิมก่อน"
    - "จานไหนทำได้เกรดทองครบสิบครั้ง จะทำอัตโนมัติได้เลย ฝึกจานเดียวให้เก่งก่อนดีกว่าทำได้สิบจานแบบงูๆ ปลาๆ"
    - "ฝึกเชฟถึงขั้นห้า ทำอาหารได้ทีละสองจาน ประหยัดแรงเยอะมาก ขั้นสิบคิดสูตรเองได้เลยนะ"
    - "อาหารแต่ละคนชอบรสไม่เหมือนกัน ยายบัวไม่กินเผ็ด ป้าแต๋วชอบเค็มแต่หมอแอนห้าม ทำของขวัญต้องดูคนกินด้วย"
    - "ตอนทอดให้ยกขึ้นตอนเหลืองพอดี อย่ารอให้เหลืองเข้ม เพราะยกขึ้นมาแล้วมันยังสุกต่อในตัวเอง"
    - "ทำอาหารที่มีบัฟไว้ก่อนออกงานนะน้อง ต้มยำกุ้งน้ำใสทำให้ใจกล้า เจอผีเสียแรงน้อยลง ข้าวผัดกะเพราได้แรงเยอะแต่มันหน่อย"
  topic_smalltalk:
    - "น้องชอบกินเส้นอะไรที่สุด พี่ทายว่าเส้นเล็ก คนที่ชอบเส้นเล็กมักจะใจเย็น"
    - "พี่เคยทำก๋วยเตี๋ยวเรือให้ฝรั่งที่โรงแรม เขาบอกว่าน้ำซุปมีเลือดหมูทำให้ตกใจ แต่ก็ซดหมดชามนะ"
    - "เมื่อวานพี่ลองทำขนมครกใส่ต้นหอมกับข้าวโพด ป้าแต๋วกินไปสิบหลุม แล้วบ่นว่าอ้วน"
    - "เวลาว่างพี่ชอบดูรายการทำอาหารในโทรศัพท์ ดูเสร็จก็บ่น ใส่ผงปรุงรสเยอะไปๆ"
    - "ถ้าโลกจะแตกพรุ่งนี้ พี่จะทำข้าวไข่เจียวหมูสับกิน ง่ายที่สุด แต่อร่อยที่สุดเลยนะน้อง"
  topic_about_self:
    - "พี่ชื่อจริงยาวมาก ไม่มีใครเรียก พี่เลยเป็นพี่หน่อยของทั้งตำบล เด็กเรียก ยายเรียก ดาบก็เรียก"
    - "พี่เริ่มล้างชามช่วยแม่ตั้งแต่เจ็ดขวบ ตอนนั้นยืนบนลังน้ำปลาถึงจะเอื้อมถึงอ่าง"
    - "ตอนอยู่โรงแรม พี่ได้เงินเดือนเยอะกว่านี้สามเท่า แต่กลับห้องไม่มีใครถามว่ากินข้าวหรือยัง"
    - "พี่ไม่ได้แต่งงาน ก็ไม่ได้รีบ ร้านนี้ก็เหมือนครอบครัวพี่ ทุกคนที่นั่งกินก็เหมือนญาติ"
    - "พี่ทำอาหารเพราะมันเป็นวิธีเดียวที่พี่ใช้บอกคนอื่นว่าห่วง พี่พูดไม่ค่อยเก่ง แต่พี่ลวกเส้นเก่ง"
  topic_about_others:
    - "ป้าทองใบเป็นคู่แข่งพี่เรื่องแกง แต่ถ้าพี่ป่วย ป้าคนแรกที่หอบข้าวต้มมาให้ เราสองคนเป็นแบบนั้นแหละ"
    - "ตั้มน่ะ พี่เป็นห่วงมาก กินแต่ข้าวเวฟ หน้าซีดลงทุกวัน พี่ฝากก๋วยเตี๋ยวไปให้เกือบทุกวัน"
    - "ลุงเชิดกินร้านพี่ทุกเช้าก่อนออกรถเที่ยวแรก สามสิบปีไม่เคยเปลี่ยนเมนู เส้นใหญ่น้ำใส ไม่งอก ไม่ผัก"
    - "ป้าแต๋วชอบเอาข่าวมาแลกลูกชิ้น พี่ก็ฟังไปยิ้มไป ข่าวครึ่งนึงไม่จริง แต่ป้าเล่าสนุก"
    - "กล้าน่ะเป็นเด็กดีนะ ปลูกผักไม่ใช้สาร พี่อุดหนุนเพราะผักเขาดีจริงๆ ไม่ใช่เพราะสงสาร"
    - "หมอแอนมาตรวจความดันคนในร้านพี่ทุกวันพุธ เลยกลายเป็นวันที่คนสั่งน้ำซุปน้อยลง"
  gossip_theft:
    - "พี่ได้ยินข่าวในกลุ่ม LINE เรื่องขโมยของ พี่ไม่อยากเชื่อนะน้อง แต่พี่ก็ไม่รู้จะพูดยังไงกับคนอื่น"
    - "ถ้าหิวมาก บอกพี่ก็ได้นะ พี่ให้กินก่อนจ่ายทีหลัง ไม่ต้องไปเอาของใคร"
    - "ข่าวแบบนี้ลบยากนะน้อง ค่อยๆ ทำดีให้คนเห็น เดี๋ยวคนก็ลืม"
  gossip_cheating:
