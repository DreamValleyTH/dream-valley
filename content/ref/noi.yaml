    - "เมื่อวานมีคนมานั่งร้องไห้ในร้านพี่ เรื่องน้องเลย พี่ต้องเติมน้ำซุปให้สามรอบ"
    - "ความรักเหมือนน้ำซุปนะน้อง เคี่ยวไปทีละหม้อ จะเคี่ยวสองหม้อพร้อมกันไฟมันไม่พอหรอก"
  gossip_unpaid_bill:
    - "ได้ข่าวว่าไฟบ้านโดนตัด ตู้เย็นดับของเสียหมดแล้วใช่ไหม มากินร้านพี่ก่อน พี่จดไว้ก่อนได้"
    - "ช่วงตึงๆ ทำกับข้าวกินเองนะน้อง ไข่เจียวกับข้าวสวยก็อิ่ม ประหยัดกว่ากินข้าวนอกบ้านเยอะ"
    - "ไปจ่ายค่าไฟก่อนวันที่สิบห้านะ ค่าต่อกลับร้อยนึงเท่ากับก๋วยเตี๋ยวพี่สองชามครึ่งเลย"
  gossip_small_envelope:
