    - "แต่งงานแล้วทำกับข้าวกินด้วยกันนะ อาหารที่ทำกินด้วยกันมันอร่อยกว่าที่ร้านพี่อีก"
    - "มาร้านพี่เป็นคู่แล้ว พี่ต้องจำเส้นเพิ่มอีกคน พี่ยินดีจำนะ"
  event_disaster:
