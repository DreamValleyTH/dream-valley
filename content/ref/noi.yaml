    - "ตอนตีสี่พี่ตั้งหม้อน้ำซุป บางครั้งได้ยินเสียงคนเดินมาหยุดหน้าร้าน พี่ตักน้ำซุปวางไว้ถ้วยนึง เช้ามาถ้วยว่าง พี่ไม่ถามว่าใคร"
