id: oat
name: "น้องโอ๊ต"
role: "เด็กชาย ป.4 โรงเรียนประจำตำบล แม่ขายขนมครกที่ตลาดนัด พ่อทำงานก่อสร้างในกรุงเทพฯ เซียนทอยเส้นและวิ่งเปรี้ยว"
voice: "พูดเสียงดัง ตื่นเต้นง่าย แทนตัวเองว่า ผม ลงท้าย ครับ เรียกผู้เล่นว่า พี่ หรือ พี่{player} ชอบอวดว่าตัวเองเก่ง ชอบควายและแมลง แพ้น้องมิวทุกเรื่องแต่ไม่ยอมรับ"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "สวัสดีครับพี่{player}! ผมช่วยแม่หยอดขนมครกมาตั้งแต่ตีห้า ไหม้ไปสามหลุม"
    - "พี่ไปนาเหรอครับ ระวังหอยเชอรี่นะ ผมเหยียบเปลือกมันเมื่อวาน เจ็บมาก"
    - "เช้านี้ผมเห็นนกกระยางเกาะหลังควายตาเผือกด้วยครับ เท่มาก"
  greet_noon:
    - "พักเที่ยงครับ ผมกินข้าวเสร็จก่อนมิวทุกวัน มิวกินช้าเหมือนเต่า"
    - "ร้อนจังครับพี่ ผมจะไปเล่นน้ำในคลอง... ไม่ได้ แม่ไม่ให้ ไปนั่งใต้ต้นไม้ก็ได้"
    - "พี่กินข้าวเวฟเหรอครับ ผมชอบนะ แต่แม่บอกว่าข้าวบ้านดีกว่า"
  greet_evening:
    - "เลิกเรียนแล้ว! พี่มาเล่นวิ่งเปรี้ยวกันไหมครับ ทีมผมขาดคนหนึ่ง"
    - "เย็นแล้วครับ ผมต้องไปช่วยแม่เก็บแผงที่ตลาดนัดก่อน แล้วค่อยมาเล่น"
    - "พี่ดูหิ่งห้อยกับผมไหมครับ ตอนหัวค่ำมันออกมาที่ริมคลอง"
  greet_night:
    - "ผมต้องกลับแล้วครับ แม่บอกว่าเด็กห้ามอยู่ข้างนอกตอนผีออก"
    - "ได้ยินเสียงกอย กอย ไหมครับพี่ ผมไม่กลัวนะ... ผมกลับก่อนนะครับ"
    - "พี่รีบกลับบ้านนะครับ ถ้าไม่ทันวิ่งไปร้าน 24 ชม. พี่ตั้มให้ผมนั่งรอแม่ที่นั่นบ่อยๆ"
  weather_rain:
    - "ฝนตก! ผมกับมิวจะไปจับลูกอ๊อด ใส่ขวดดูแล้วปล่อยครับ"
    - "ฝนตกเล่นทอยเส้นไม่ได้ เส้นชอล์กหายหมดเลยครับ"
    - "ฝนตกแม่ขายขนมครกไม่ได้ ผมเลยได้กินขนมครกที่เหลือทั้งถาด"
  weather_hot:
    - "ร้อนจนดินแตกเป็นช่องๆ ผมเอาไม้แหย่ดู มีจิ้งหรีดอยู่ข้างในครับ"
    - "ร้อนมากครับพี่ ผมเอาหัวจุ่มโอ่งน้ำ แม่ดุ"
    - "พี่ใส่หมวกนะครับ ครูเต้ยบอกว่าร้อนๆ ไม่ใส่หมวกจะเป็นลม"
  weather_storm:
    - "ฟ้าผ่าดังมากครับ ผมนับหนึ่งสองสามแล้วฟ้าร้อง ครูเต้ยสอนว่านับแล้วรู้ว่าฟ้าไกลแค่ไหน"
    - "พายุมาแล้วพี่ ไปหลบเร็วครับ"
    - "ลมแรงจนว่าวผมขาดลอยไปเลย ไม่รู้ไปตกที่ไหน"
  weather_pm25:
    - "ฝุ่นเยอะครับ ผมใส่หน้ากากลายไดโนเสาร์ที่หมอแอนแจก"
    - "ครูเต้ยไม่ให้ออกไปเล่นข้างนอก ผมเลยเล่นหมากเก็บกับมิวในห้อง ผมแพ้"
    - "ฝุ่นทำให้ผมไอครับ แม่ให้ดื่มน้ำอุ่นเยอะๆ"
  season_rainy:
    - "หน้าฝนผมไปส่องกบกับพ่อตอนพ่อกลับบ้าน ได้เยอะมาก แต่ผมขอปล่อยตัวเล็กๆ"
    - "หน้าฝนนาเต็มน้ำ ผมเห็นปลาซิวว่ายในนาด้วยครับ"
    - "แห่เทียนพรรษาผมได้ตีกลองด้วย ตีผิดจังหวะนิดหน่อย"
  season_cool:
    - "หน้าหนาวลมว่าวดีครับ! ผมทำว่าวจุฬาเองกับลุงพรานแดง"
    - "วันเด็กใกล้แล้ว ผมจะลงแข่งทอยเส้นกับวิ่งเปรี้ยว ผมจะได้ที่หนึ่งสองรายการ"
    - "หน้าเกี่ยวผมไปเก็บรวงข้าวที่ตกในนาลุงสมหมาย ลุงให้ห้าบาท"
  season_dry:
    - "ปิดเทอมหน้าร้อน! ผมจะช่วยตาเผือกเลี้ยงควายทุกวันเลยครับ"
    - "สงกรานต์พ่อผมกลับบ้าน ผมจะเอาปืนฉีดน้ำยิงพ่อก่อนคนแรก"
    - "หน้าแล้งน้ำในหนองลด ผู้ใหญ่ไปวิดหนอง ผมไปช่วยจับปลาด้วยครับ ตัวผมเลอะโคลนหมด"
  heart_low:
    - "พี่เป็นใครครับ อ๋อ พี่ที่มาทำนาใช่ไหม ผมชื่อโอ๊ตครับ"
    - "พี่เล่นทอยเส้นเป็นไหมครับ ผมเก่งที่สุดในโรงเรียน... รองจากมิว นิดเดียว"
    - "แม่บอกว่าต้องไหว้ผู้ใหญ่ สวัสดีครับพี่"
  heart_mid:
    - "พี่ ผมจับด้วงกว่างได้ตัวหนึ่ง เขายาวมาก พี่ดูไหมครับ"
    - "พี่มาเป็นทีมผมตอนเล่นวิ่งเปรี้ยวนะครับ พี่ขายาว วิ่งเร็ว"
    - "ผมเอาขนมครกของแม่มาฝากพี่ครับ ไม่ไหม้นะ ผมเลือกหลุมที่สวยที่สุด"
  heart_high:
    - "พี่ ผมคิดถึงพ่อ พ่อทำงานก่อสร้างในกรุงเทพฯ ส่งรูปตึกสูงมาให้ผมดู บอกว่าพ่อสร้างชั้นที่สามสิบ"
    - "โตขึ้นผมอยากทำนาเหมือนพี่ หรือเลี้ยงควายเหมือนตาเผือก แม่บอกว่าเรียนก่อน ผมก็จะเรียนครับ"
    - "พี่ห้ามบอกมิวนะ ผมชอบแพ้มิวตอนเล่นหนังยาง เพราะมิวยิ้มทุกครั้งที่ชนะ"
  topic_news:
    - "ข่าวใหญ่ครับ! อีแดงควายตาเผือกจะมีลูก ตาบอกว่าจะให้ผมช่วยตั้งชื่อ"
    - "ครูเต้ยบอกว่าวันศุกร์จะพาไปดูแปลงผักของพี่กล้า ผมจะไปขุดไส้เดือน"
    - "ฟันผมหลุดแล้วครับ! ผมโยนขึ้นหลังคา รอฟันใหม่อยู่"
  topic_advice:
    - "ถ้าพี่จะเล่นทอยเส้น ต้องใช้เหรียญหนักๆ ครับ เหรียญสิบดีที่สุด ทอยแล้วไม่กลิ้ง"
    - "ถ้าพี่อยากให้ตาเผือกชอบ ให้ข้าวจี่ครับ ตาชอบมาก ผมเห็นตากินทุกวัน"
    - "ไปเก็บปลาในไซลุงพรานแดงไม่ได้นะครับ ลุงบอกว่าไซใครใครกู้"
  topic_smalltalk:
    - "พี่ว่าด้วงกว่างกับแมงมุมใครชนะครับ ผมว่าด้วงกว่าง มันมีเขา"
    - "พี่รู้ไหมครับว่าควายมีกี่กระเพาะ สี่! ตาเผือกบอก ผมมีกระเพาะเดียวแต่กินเยอะกว่าควาย"
    - "ผมเคยวิ่งเปรี้ยวแล้วล้มหัวเข่าแตก แต่ผมไม่ร้องไห้ นิดเดียว"
  topic_about_self:
    - "ผมช่วยแม่ขายขนมครกที่ตลาดนัดวันพุธกับวันเสาร์ครับ ผมทอนเงินได้ไม่ผิดเลย"
    - "ผมชอบสัตว์ครับ บ้านผมมีแมวสองตัว ไก่ห้าตัว แล้วก็ด้วงกว่างหนึ่งตัวในกล่อง"
    - "ผมเป็นเซียนทอยเส้นของหมู่สี่ครับ มิวเป็นเซียนหนังยาง เราแบ่งกันเก่ง"
  topic_about_others:
    - "มิวชอบเถียงผมทุกเรื่อง แต่ถ้าใครแกล้งผม มิวเป็นคนแรกที่ไปด่าเขา"
    - "ตาเผือกสอนผมป้อนหญ้าควาย ตาไม่ค่อยพูด แต่ตาให้ผมนั่งหลังควายด้วย"
    - "ลุงพรานแดงทำว่าวเก่งที่สุด ว่าวลุงขึ้นสูงกว่าวัดอีก"
  gossip_theft:
    - "พี่ครับ มีคนบอกว่าพี่เอาของคนอื่น พี่ไม่ได้เอาใช่ไหม ถ้าเอาก็คืนเขานะครับ"
    - "ผมเคยแอบเอาลูกแก้วเพื่อน แม่ให้ผมไปคืนแล้วขอโทษ ไม่อายหรอกครับ อายแค่นิดเดียว"
  gossip_cheating:
    - "ผู้ใหญ่พูดเรื่องพี่กันที่ร้านป้าแต๋ว ผมไม่เข้าใจ แม่บอกให้ไปเล่นที่อื่น"
    - "พี่มีเพื่อนเยอะเหรอครับ ผมมีเพื่อนสนิทคนเดียวคือมิว แต่ห้ามบอกมิว"
  gossip_unpaid_bill:
    - "บ้านพี่ไฟดับเหรอครับ ผมมีไฟฉายที่พ่อให้ พี่ยืมได้"
    - "แม่บอกว่าบางคนเงินไม่พอจ่ายค่าไฟ ไม่ใช่เรื่องน่าอาย ผมเอาขนมครกไปให้พี่นะ"
  gossip_small_envelope:
    - "ซองคืออะไรครับ ผมเห็นผู้ใหญ่ใส่เงินในซองตอนงานบวช ผมใส่การ์ดไดโนเสาร์ลงไปแทน แม่ดุ"
    - "แม่บอกว่าใส่ซองตามกำลัง ผมมีกำลังห้าบาท"
  gossip_skip_longkhaek:
    - "พี่ไม่ไปช่วยเกี่ยวข้าวบ้านลุงสมหมายเหรอครับ ผมไปช่วยถือกระติกน้ำนะ"
    - "ลงแขกสนุกมากนะครับ มีข้าวเหนียวไก่ย่าง พี่ไปคราวหน้านะ"
  player_fainted:
    - "พี่! ผมได้ยินว่าผีจับพี่ ผีหน้าตาเป็นยังไงครับ น่ากลัวไหม... ไม่ต้องบอกก็ได้"
    - "พี่ต้องกลับบ้านก่อนสามทุ่มนะครับ ผมจะเตือนพี่ทุกวันเลย"
  player_new_vehicle:
    - "รถใหม่! เท่มากครับ ผมขอนั่งได้ไหม แค่นั่งเฉยๆ ไม่จับอะไรเลย"
    - "รถพี่วิ่งเร็วไหมครับ เร็วกว่าผมวิ่งเปรี้ยวไหม"
  player_lottery_win:
    - "พี่ได้เงินเยอะเหรอครับ! ซื้อว่าวให้ผมได้ไหม ว่าวผมขาดไปแล้ว"
    - "แม่บอกว่าได้เงินแล้วต้องเก็บใส่กระปุก ผมมีกระปุกรูปควาย พี่ยืมได้"
  player_muddy:
    - "พี่เลอะโคลนเท่มากครับ! ผมอยากเลอะแบบพี่ แต่แม่จะดุ"
    - "พี่ไปจับปลาในหนองมาเหรอครับ ได้ปลาดุกไหม"
  player_rich:
    - "พี่รวยแล้วซื้อควายสักตัวนะครับ ผมจะช่วยเลี้ยง"
    - "พี่มีเงินเยอะ เลี้ยงไอติมเด็กทั้งโรงเรียนได้ไหมครับ"
  player_in_debt:
    - "หนี้คืออะไรครับ แม่บอกว่าเป็นเงินที่ยืมมา ผมยืมเงินมิวห้าบาท ผมจะคืนวันศุกร์"
    - "พี่ไม่ต้องเศร้านะครับ ผมให้ด้วงกว่างพี่ยืมเลี้ยงหนึ่งวัน"
  player_sick:
    - "พี่ป่วยเหรอครับ ไปหาหมอแอนนะ ผมไปฉีดวัคซีนแล้วไม่ร้องเลย... ร้องนิดหน่อย"
    - "ผมจะเอาขนมครกไปให้พี่ กินแล้วหายเร็วครับ แม่บอก"
  player_married:
    - "พี่แต่งงานแล้ว! ผมไปงานได้ไหมครับ ผมจะช่วยถือพานด้วย"
    - "พี่แต่งงานแล้วยังมาเล่นทอยเส้นกับผมได้ไหมครับ"
  event_disaster:
    - "น้ำท่วมครับ ผมกับแม่ไปอยู่ที่วัด พระอาจารย์ให้ผมช่วยแจกน้ำด้วย"
    - "ไก่ผมหนีน้ำขึ้นไปบนหลังคา ผมช่วยมันลงมาไม่ได้ ลุงพรานแดงช่วยครับ"
  event_election:
    - "ผมได้ปากกาฟรีจากรถแห่สามด้ามครับ เขียนการบ้านได้ทั้งเทอม"
    - "ครูเต้ยให้ห้องผมเลือกหัวหน้าห้อง ผมได้สามคะแนน มิวได้ยี่สิบ"
  event_company_water:
    - "คลองที่ผมเคยจับปลาตื้นมากเลยครับ ลุงพรานแดงบอกว่าเพราะบริษัทดูดน้ำ"
    - "ผมเห็นรั้วบริษัทยาวมาก ผมเคยไปเก็บมะม่วงตรงนั้น ตอนนี้เข้าไม่ได้แล้ว"
  event_festival_near:
    - "{festival}ใกล้แล้ว! ผมจะไปเล่นปาลูกโป่ง ผมปาแม่นมากครับ"
    - "ผมเก็บเงินจากช่วยแม่ขายขนมครกไว้ไปเที่ยวงาน{festival}ครับ"
  gift_love:
    - "{item}! ผมชอบที่สุดเลยครับ ขอบคุณครับพี่"
    - "ให้ผมจริงเหรอครับ เท่มาก! ผมจะเอาไปอวดมิว"
  gift_like:
    - "{item} ขอบคุณครับพี่"
    - "ดีครับ ผมจะแบ่งให้แม่ด้วย"
  gift_neutral:
    - "อ๋อ {item} ขอบคุณครับ"
    - "ผมจะเอาไปให้แม่ดูนะครับ"
  gift_dislike:
    - "{item}... ผมไม่ค่อยชอบครับ แต่ขอบคุณนะครับ"
    - "อันนี้ผมให้แม่ดีกว่าครับ"
  gift_hate:
    - "ไม่เอาครับ! {item} ขมมาก ผมกินแล้วจะร้องไห้"
    - "พี่แกล้งผมใช่ไหมครับ ผมไม่เอา"
  birthday:
    - "วันนี้วันเกิดผม! พี่จำได้ด้วย เย้! พ่อจะโทรมาตอนเย็นครับ"
    - "ขอบคุณครับพี่ ผมอธิษฐานขอให้พ่อกลับบ้านแล้วไม่ต้องไปอีก"
  rare:
    - "พี่ครับ ผมเคยเห็นแสงสีเขียวลอยข้ามนาตอนกลางคืนจากหน้าต่าง แม่บอกว่าเป็นไฟรถ แต่รถไม่บินนะครับ"
    - "ผมแอบตั้งชื่อลูกควายที่ยังไม่เกิดไว้แล้ว ชื่อเจ้าโอ๊ตน้อย อย่าบอกตาเผือกนะครับ"
    - "ผมเก็บรูปตึกที่พ่อส่งมาทุกรูปไว้ในกล่อง นับได้สี่สิบตึกแล้ว พ่อสร้างตึกเยอะกว่าบ้านในหมู่บ้านอีก"
  flirt: []
gifts:
  love: ["ข้าวเหนียวหมูปิ้ง", "ว่าว", "ข้าวหลาม", "ลูกแก้ว"]
  like: ["ขนมครก", "ไข่ไก่", "กล้วยทอด", "ข้าวจี่"]
