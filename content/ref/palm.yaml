id: palm
name: "ปาล์ม"
role: "นักวิชาการเกษตรรุ่นใหม่ ประจำ อบต. อายุ 26"
voice: "เรียกตัวเองว่า 'เรา' ลงท้าย 'นะ' 'เนอะ' ชอบขึ้นต้น 'ตามหลักวิชาการนะ…' แล้วตามด้วยวิธีบ้านๆ แซวแล้วรีบเติม 'ล้อเล่นๆ' พกสมุดจดกับตลับเมตรติดตัว พูดเร็วตอนตื่นเต้นเรื่องแมลง"
dark_humor: false
romanceable: true
personality: "ร่าเริง ขี้แซว เนิร์ดเรื่องดินกับแมลง ทำงานจริงจังแต่ติดระเบียบราชการ"
backstory: "เรียนจบเกษตรศาสตร์ กลับมาสอบบรรจุที่ อบต. หวังช่วยชาวบ้าน แต่เวลาครึ่งหนึ่งหมดไปกับเอกสาร ถ่ายรูปป้ายโครงการ และรายงานที่ไม่มีใครอ่าน แอบกลัวว่าตัวเองจะกลายเป็น 'ข้าราชการที่เลิกฝัน'"
courtship: "ชอบคนที่ลงมือทำจริง ให้ของที่ปลูกเอง ชวนไปเดินแปลงหรือตลาดนัดตอนเย็น ไม่ชอบคนอวดรวย"
lines:
  greet_morning:
    - "อรุณสวัสดิ์ {player}! เช้านี้น้ำค้างลงหนัก ใบข้าวเปียกอย่าเพิ่งพ่นอะไรนะ"
    - "เพิ่งกินกาแฟแก้วแรกเอง สมองยังโหลดไม่เสร็จ ถามอะไรยากๆ รอแก้วที่สองนะ"
    - "หอกระจายข่าวเมื่อกี้บอกฝนแปดสิบเปอร์เซ็นต์ ตามหลักวิชาการนะ… เชื่อมดแดงที่ขนไข่ขึ้นที่สูงดีกว่า"
    - "ไปแปลงมาแต่เช้าเลยเหรอ ดีมาก แดดเช้าทำงานสบาย บ่ายค่อยหลบเข้าร่ม"
    - "เช้าๆ แบบนี้แมลงยังไม่ตื่น เราเลยชอบเดินดูแปลงตอนนี้ที่สุด"
  greet_noon:
    - "เที่ยงแล้ว กินข้าวยัง อย่าเอาแต่ทำงานจนกระเพาะประท้วงนะ"
    - "เพิ่งออกมาจากประชุม อบต. สามชั่วโมง ได้มติว่า… นัดประชุมใหม่ ล้อเล่นๆ ก็ไม่ได้ล้อเล่นเท่าไหร่"
    - "แดดเที่ยงตรงหัวแบบนี้ ถ้าจะใส่ปุ๋ยรอเย็นก่อนนะ ปุ๋ยระเหยหมดพอดี"
    - "เราไปกินก๋วยเตี๋ยวพี่หน่อยมา น้ำตกหมูวันนี้เข้มข้นเชียว แนะนำเลย"
    - "บ่ายนี้ต้องออกตรวจแปลงหมู่ 4 ถ้าเห็นเราขี่มอไซค์ผ่านก็โบกมือได้นะ"
  greet_evening:
    - "เย็นแล้ว เลิกงานกันเนอะ ไปตลาดนัดไหม ขนมครกเจ้าประจำออกแล้ว"
    - "เพิ่งพิมพ์รายงานเสร็จ ตาลายไปหมด ขอมองต้นข้าวเขียวๆ พักสายตาหน่อย"
    - "แสงเย็นแบบนี้ถ่ายรูปแปลงสวยมาก เราแอบถ่ายแปลงของ {player} ลงรายงานไปรูปหนึ่งนะ"
    - "หอกระจายข่าวห้าโมงประกาศราคาพรุ่งนี้แล้ว ฟังทันไหม ข้าวขยับขึ้นนิดหน่อย"
    - "เย็นๆ ยุงเริ่มออก ทาโลชั่นตะไคร้หอมด้วยนะ ไข้เลือดออกไม่ใช่เรื่องเล่น"
  greet_night:
    - "สองทุ่มกว่าแล้ว รีบกลับบ้านเถอะ เราไม่อยากไปเยี่ยมใครที่ รพ.สต. พรุ่งนี้"
    - "หมาเริ่มหอนแล้วได้ยินไหม ตามหลักวิชาการนะ… ช่างหลักวิชาการเถอะ วิ่ง!"
    - "ถ้ากลับไม่ทัน แวะร้าน 24 ชม. ของตั้มก่อน อย่างน้อยไฟสว่างทั้งคืน"
    - "เรายังไม่ได้เช่าผ้ายันต์เลย พรุ่งนี้ต้องแวะวัดแล้วล่ะ ฿99 ถูกกว่าค่ารักษาเยอะ"
    - "ดึกแล้วยังไม่กลับอีก ไม่ได้ห่วงนะ แค่… โอเค ห่วงนิดนึง"
  weather_rain:
    - "ฝนตกแบบนี้ไม่ต้องรดน้ำ ประหยัดแรงไปทำอย่างอื่นนะ"
    - "ระวังเชื้อราใบไหม้ช่วงฝนชุก ถ้าเห็นจุดสีน้ำตาลบนใบรีบบอกเรา"
    - "ร่มเราพังตั้งแต่เดือนที่แล้ว เลยใช้ถุงปุ๋ยคลุมหัวแทน แฟชั่นใหม่ของ อบต."
    - "ฝนมาทีไรท่อหน้า อบต. ตันทุกที เสนอซ่อมไปสามรอบแล้ว ได้คำตอบว่า 'รับทราบ'"
    - "กลิ่นดินหลังฝนนี่ดีที่สุดในโลก เราว่ามันควรมีขายเป็นน้ำหอม"
  weather_hot:
    - "ร้อนจนดินแตกระแหง คลุมโคนต้นด้วยฟางข้าวหน่อยนะ ช่วยเก็บความชื้น"
    - "อย่าทำงานกลางแดดนานเกินไป ลมแดดมาไวกว่าที่คิด พักในร่มดื่มน้ำบ่อยๆ"
    - "รดน้ำตอนเช้ามืดหรือหลังห้าโมงเย็นนะ รดตอนเที่ยงน้ำระเหยหมด ต้นไม่ได้อะไร"
    - "แอร์ อบต. เสียมาสองอาทิตย์แล้ว ตอนนี้เราย้ายไปนั่งทำงานใต้ต้นมะขามแทน"
    - "ร้อนขนาดนี้ไก่ยังไม่อยากออกไข่เลย ใส่น้ำให้สัตว์เพิ่มด้วยนะ"
  weather_storm:
    - "พายุเข้า! ค้ำต้นกล้วยกับไม้ค้างให้ดีนะ เดี๋ยวล้มทั้งแปลง"
    - "อย่าออกไปทุ่งตอนฟ้าผ่า เราไม่อยากเขียนรายงานความเสียหายที่มีชื่อ {player} อยู่ในนั้น"
    - "หลังพายุผ่านมาแจ้ง อบต. นะ เราจะช่วยกรอกแบบขอรับความช่วยเหลือให้ เอกสารเยอะแต่เราชิน"
    - "หอกระจายข่าวเมื่อเช้าซ่าจนฟังไม่รู้เรื่อง เราว่าพายุเข้าแน่ๆ เก็บของเข้าบ้านเถอะ"
    - "พายุแบบนี้ไฟดับทั้งตำบล ชาร์จแบตโทรศัพท์ไว้ด้วยนะ"
  weather_pm25:
    - "ฝุ่นแดงเถือกเลยวันนี้ ใส่หน้ากากด้วยนะ ผ้าขาวม้าปิดจมูกกันไม่ได้หรอก"
    - "ฝุ่นมาจากการเผาตอซังด้วยแหละ เราอยากชวนทุกคนไถกลบแทน ได้ปุ๋ยฟรีด้วย"
    - "เรารณรงค์ไม่เผาปีนี้ทำป้ายไปห้าป้าย ป้ายมันโดนควันรมจนอ่านไม่ออก"
    - "ฝุ่นหนาแบบนี้พืชก็สังเคราะห์แสงได้น้อยลงนะ ไม่ใช่แค่ปอดเราที่เหนื่อย"
    - "วันนี้ตาแสบมาก ขอดูแปลงจากในห้องผ่านรูปที่ {player} ส่งมาได้ไหม ล้อเล่นๆ"
  season_rainy:
    - "หน้าฝนแล้ว ถึงเวลาปักดำ เรามีพันธุ์ข้าวทนน้ำท่วมให้ทดลองปลูกด้วยนะ"
    - "หน้าฝนหอยเชอรี่บุก ลองเก็บไปทำน้ำหมักชีวภาพ ได้ทั้งกำจัดทั้งปุ๋ย"
    - "ฝนแบบนี้หญ้าโตไวกว่าข้าว ดายหญ้าเร็วๆ ตั้งแต่ต้นฤดูจะเบาแรงกว่า"
    - "เข้าพรรษาแล้วเราตั้งใจจะเลิกกินหมูกระทะ… ครบสามวันแล้ว ภูมิใจมาก"
    - "หน้าฝนเห็ดโคนออกนะ แต่อย่าเก็บเห็ดที่ไม่รู้จัก ถามยายบัวก่อนดีกว่า"
  season_cool:
    - "หน้าหนาวมาแล้ว! ปลูกผักกาด กะหล่ำ ผักชีได้งามสุดช่วงนี้แหละ"
    - "ลมหนาวเข้า เราเอาเสื้อแจ็กเก็ตตัวเก่าตั้งแต่สมัยเรียนมาใส่ ยังใส่ได้อยู่ ดีใจ"
    - "หลังเกี่ยวข้าวอย่าเผาตอซังนะ ไถกลบแล้วหว่านปอเทืองบำรุงดินดีกว่า"
    - "หน้าหนาวงานเยอะ ลอยกระทง งานวัด งานกาชาด แต่เรายังต้องส่งรายงานไตรมาส"
    - "เช้าๆ หมอกลงทุ่ง สวยเหมือนโปสการ์ด แต่ขับมอไซค์มองไม่เห็นทาง ระวังนะ"
  season_dry:
    - "หน้าแล้ง น้ำในคลองลดเร็ว ลองปลูกพืชใช้น้ำน้อยอย่างถั่วเขียวหรือแตงโมดูนะ"
    - "ช่วงนี้ อบต. มีโครงการขุดลอกคลอง ถ้าคนลงชื่อเยอะงบจะออกไวขึ้น… หวังว่านะ"
    - "แล้งแบบนี้ระบบน้ำหยดคุ้มมาก เราช่วยคำนวณให้ได้ว่าต้องใช้สายกี่เมตร"
    - "สงกรานต์นี้เราจะสาดน้ำแบบประหยัด ใช้ขันเล็ก รักษ์โลกและรักษ์ค่าน้ำ"
    - "หน้าแล้งแมลงหวี่ขาวระบาด ใช้กับดักกาวเหลืองช่วยได้เยอะ ถูกด้วย"
  heart_low:
    - "สวัสดี มีอะไรให้ อบต. ช่วยไหม ถ้าเรื่องเอกสาร ต้องกรอกสามชุดนะ"
    - "อ๋อ คนที่ย้ายกลับมาจากกรุงเทพฯ ใช่ไหม ที่ดินแปลงนั้นดินดีนะ อย่าทำพัง"
    - "ขอโทษนะ ตอนนี้รีบไปถ่ายรูปป้ายโครงการ ไว้ค่อยคุยกัน"
    - "ถ้าจะขอพันธุ์พืชฟรี ต้องลงทะเบียนเกษตรกรก่อนนะ แบบฟอร์มอยู่ที่ช่องสาม"
    - "ปลูกอะไรอยู่ล่ะ… อืม โอเค ขอให้รอดนะ"
  heart_mid:
    - "{player} ทำแปลงได้ดีขึ้นเยอะเลยนะ เราแอบไปดูมาเงียบๆ"
    - "เดี๋ยวเราเอาเมล็ดพันธุ์ข้าวพื้นบ้านมาแบ่งให้ ปลูกแล้วเล่าผลให้ฟังด้วยนะ"
    - "เมื่อวานนายกฯ ถามว่าทำไมเราไปแปลงชาวบ้านบ่อย เราบอกว่าเก็บข้อมูล… ซึ่งก็จริงครึ่งหนึ่ง"
    - "คุยกับ {player} แล้วสบายใจกว่าคุยกับแฟ้มเอกสารเยอะเลย"
    - "ถ้าเจอแมลงแปลกๆ ถ่ายรูปส่งมาได้ตลอดนะ เราชอบ จริงจัง"
  heart_high:
    - "รู้ไหม เราเคยร่างจดหมายลาออกไว้ในลิ้นชัก ยังไม่ได้ทิ้งเลย แต่ช่วงนี้ไม่ได้เปิดอ่านแล้ว"
    - "ตอนเด็กพ่อเราเป็นหนี้ปุ๋ยเสี่ยเฮงจนต้องขายที่ไปครึ่งหนึ่ง เราเลยมาเรียนเกษตร อยากให้ไม่มีใครต้องเป็นแบบนั้นอีก"
    - "บางวันเรารู้สึกเหมือนเป็นเครื่องถ่ายรูปป้ายโครงการ แต่พอมาเห็นแปลงของ {player} ก็รู้ว่าที่เรียนมายังมีประโยชน์"
    - "แม่ชอบถามว่าเมื่อไหร่จะย้ายไปทำงานจังหวัด เงินเดือนดีกว่า… เรายังตอบแม่ไม่ได้ เพราะยังไม่อยากไปไหน"
    - "ถ้าวันหนึ่งเราเปลี่ยนไปเป็นคนที่ตอบทุกอย่างว่า 'รับทราบ' ช่วยเขย่าเราแรงๆ ด้วยนะ"
  topic_news:
    - "อบต. เพิ่งได้งบอบรมการทำปุ๋ยหมัก มาสมัครนะ มีข้าวกล่องกับเกียรติบัตรด้วย"
    - "ได้ยินว่าบริษัทของคุณธนามาขอดูแผนที่น้ำใต้ดินที่ อบต. เราไม่ให้หรอก แต่หัวหน้าเราลังเลอยู่"
    - "เพลี้ยกระโดดสีน้ำตาลเริ่มระบาดที่ตำบลข้างๆ เตรียมตัวไว้ อย่าเพิ่งตกใจไปซื้อยาแรง"
    - "สหกรณ์ของกล้ารับซื้อผักอินทรีย์เพิ่มแล้วนะ ราคาตลาดไม่หักความชื้นมั่วด้วย"
    - "โครงการแจกพันธุ์ไก่พื้นเมืองมาแล้ว รอบนี้ได้ไก่ห้าตัวต่อครัวเรือน อย่าลืมไปลงชื่อ"
  topic_advice:
    - "ตามหลักวิชาการนะ ปลูกพืชหมุนเวียนสลับข้าวกับถั่ว ดินจะได้ไนโตรเจนคืน ผลผลิตรอบหน้าดีขึ้น"
    - "ใบเหลืองทั้งแปลงไม่ใช่ขาดปุ๋ยเสมอไป ลองดูว่าน้ำขังรากหรือเปล่า ระบายน้ำก่อนค่อยใส่ปุ๋ย"
    - "น้ำหมักสะเดาฉีดตอนเย็น แมลงไม่ชอบกลิ่น แถมไม่ต้องเสียเงินซื้อยา ไม่เสี่ยงพิษสารเคมีด้วย"
    - "อย่าใส่ปุ๋ยเคมีทีเดียวทั้งกระสอบ แบ่งใส่สองสามรอบ ต้นใช้ได้หมด ไม่ไหลทิ้งลงคลอง"
    - "ก่อนเซ็นสัญญาเกษตรพันธสัญญา อ่านข้อคัดเกรดให้ดี ถ้าไม่เข้าใจเอามาให้เราอ่านด้วย ฟรี"
    - "เก็บเมล็ดพันธุ์จากต้นที่งามที่สุดไว้ปลูกรอบหน้า ประหยัดเงินและพันธุ์จะชินกับดินเราด้วย"
  topic_smalltalk:
    - "ถ้าเกิดเป็นแมลงได้ เราอยากเป็นแมลงปอ กินยุงเป็นอาชีพ มีประโยชน์ดี"
    - "เราตั้งชื่อต้นมะม่วงหน้า อบต. ว่า 'คุณงบประมาณ' เพราะมันออกลูกปีละครั้งแล้วก็หายไป"
    - "ช่วงนี้ติดดูคลิปคนทำปุ๋ยหมักก่อนนอน มันผ่อนคลายดีนะ อย่าหัวเราะ"
    - "กาแฟที่ อบต. เป็นแบบซองสามในหนึ่ง หวานจนคิดว่าเป็นขนม เราเลยพกดริปมาเอง"
    - "ถ้าวันหนึ่งเราลาออก จะเปิดร้านขายต้นกล้าชื่อ 'กล้าดีมีอนาคต' เพราะไหม"
  topic_about_self:
    - "เราเรียนเกษตรมาสี่ปี ทำงาน อบต. มาสองปี เวลาครึ่งหนึ่งเป็นเอกสาร อีกครึ่งเป็นเอกสารที่ต่อจากครึ่งแรก"
    - "บ้านเราอยู่ชุมชนหมู่ 4 เลี้ยงหมาชื่อ 'ไนโตรเจน' เรียกสั้นๆ ว่าไน"
    - "เราชอบแมลงตั้งแต่เด็ก จับด้วงมาเลี้ยงในกล่องนม แม่ร้องกรี๊ดทุกวัน"
    - "งานที่เราภูมิใจที่สุดคือช่วยยายจันทร์เปลี่ยนแปลงผักจากฉีดยามาเป็นอินทรีย์ ยายยังเอาข้าวหลามมาให้ทุกปี"
    - "ความฝันเราคือทำแปลงสาธิตกลางตำบล ให้ทุกคนมาดูได้ว่าไม่ต้องพึ่งเคมีก็รอด"
  topic_about_others:
    - "กล้าเป็นคนที่มีอุดมการณ์ที่สุดในตำบล บางทีเราก็อิจฉานะ เขาไม่ต้องตอบ 'รับทราบ' กับใคร"
    - "นายกฯ วิชัยใจดีนะ แค่เวลาถามว่า 'งบมาเมื่อไหร่' ท่านจะตอบเรื่องอื่นสวยงามมาก"
    - "เสี่ยเฮงให้เชื่อปุ๋ยง่าย แต่ดอกเบี้ยโตเร็วกว่าข้าวที่เราแนะนำอีก ระวังนะ"
    - "หมอแอนกับเราร่วมมือกันแก้ข่าวปลอมในกลุ่ม LINE บ่อยมาก ล่าสุดคือ 'น้ำมะนาวผสมยาฆ่าหญ้าล้างพิษ' ไม่จริงนะ!"
    - "ยายจันทร์เก่งเรื่องพยากรณ์ฝนมากกว่ากรมอุตุฯ อีก เราจดสถิติไว้แล้ว แม่นกว่าจริงๆ"
  gossip_theft:
    - "ได้ยินข่าวเรื่องของหายแล้วชื่อ {player} โผล่ เราไม่อยากเชื่อนะ ถ้าไม่จริงช่วยบอกเราหน่อย"
    - "ถ้าลำบากจนต้องหยิบของคนอื่น มาคุยกับเราก่อนได้ไหม อบต. มีโครงการช่วยเหลืออยู่"
    - "ของที่หายเป็นเมล็ดพันธุ์ที่เราแจกเองกับมือ… เสียใจนะ"
  gossip_cheating:
    - "ข่าวในกลุ่ม LINE เรื่อง {player} คบสองคน ตามหลักวิชาการนะ… ไม่มีหลักวิชาการไหนรองรับเรื่องนี้"
    - "เราไม่ได้โกรธนะ แค่ไม่เข้าใจว่าทำไมต้องปิด"
    - "ใจคนก็เหมือนดิน เหยียบซ้ำๆ มันก็แน่นจนอะไรก็งอกไม่ได้"
  gossip_unpaid_bill:
    - "ค้างค่าไฟเหรอ ถ้าเงินช็อต ลองขายผลผลิตให้สหกรณ์ของกล้าดู ได้เงินเร็วกว่าที่คิด"
    - "ระวังโดนตัดไฟนะ ปั๊มน้ำจะหยุดทั้งแปลง ผักเหี่ยวในวันเดียว"
    - "อย่าอายเลย เราเองก็เคยค้างค่าโทรศัพท์จนตกข่าวในกลุ่ม LINE ไปทั้งเดือน"
  gossip_small_envelope:
    - "ป้าทองใบเล่าว่าซองของ {player} บางจนแสงลอด… เราว่าใส่ตามกำลังก็พอนะ แต่ไปช่วยงานครัวชดเชยหน่อย"
    - "ซองไม่ต้องหนา แต่ถ้าไปช่วยล้างจานงานบุญ คนจำได้นานกว่าแบงก์อีก"
    - "เรื่องซองนี่เรื่องใหญ่ของตำบลนะ ใหญ่กว่างบ อบต. บางรายการอีก"
  gossip_skip_longkhaek:
    - "ลุงสมหมายเล่าว่า {player} ไม่ไปช่วยลงแขกคืน ระวังนะ ปีหน้าจะไม่มีใครมาช่วยเกี่ยว"
    - "ลงแขกไม่ใช่แค่แรงงานฟรี มันคือประกันชีวิตแบบชาวนาเลย"
    - "ครั้งหน้าไปช่วยเถอะ เราไปด้วยก็ได้ ถือว่าเก็บข้อมูลภาคสนาม"
  player_fainted:
    - "ได้ยินว่าเมื่อคืนเจอผีไล่จนสลบ? คราวหน้าโทรเรียกนะ จะขับมอไซค์ไปรับ"
    - "ตื่นที่ รพ.สต. เหรอ หมอแอนบอกว่าละเมอเรียกชื่อพืชผักทั้งคืน"
    - "ตามหลักวิชาการ ผีไม่มีจริง… แต่เราเช่าตะกรุดมาแล้วสองอัน เผื่อหลักวิชาการผิด"
  player_new_vehicle:
    - "รถใหม่! ทีนี้ขนปุ๋ยไม่ต้องแบกทีละกระสอบแล้ว ไหล่จะได้พัก"
    - "เท่มาก ไว้พาเราไปตรวจแปลงไกลๆ บ้างนะ มอไซค์ อบต. เบรกไม่ค่อยติด"
    - "ระวังให้บอลแซวนะ เขาจะบอกว่าเลือกรุ่นผิดเสมอไม่ว่าจะซื้ออะไร"
  player_lottery_win:
    - "ถูกหวยเหรอ! เอาไปลงทุนระบบน้ำหยดเลย คุ้มกว่าซื้อหวยต่ออีกร้อยงวด"
    - "ลุงสมหมายคงมาขอเลขแล้วล่ะ ระวังโดนตามถึงบ้าน"
    - "ยินดีด้วยนะ แต่อย่าลืมฝากเงินธนาคาร เงินสดหายได้ถ้าโดนผีจับ"
  player_muddy:
    - "โคลนเต็มตัวเลย แสดงว่าทำงานจริง เราชอบคนแบบนี้… หมายถึงในฐานะนักวิชาการนะ"
    - "ไปลุยแปลงมาเหรอ ดินแปลงนี้สีดำดี อินทรียวัตถุสูงนะ เราดูจากขากางเกงก็รู้"
    - "อาบน้ำก่อนค่อยกินข้าวนะ ดินน่ะดี แต่ไม่ใช่สำหรับกระเพาะ"
  player_rich:
    - "ช่วงนี้รวยขึ้นนะ เห็นซื้อของเต็มมือ อย่าลืมเก็บเงินสำรองไว้ปีแล้งด้วยล่ะ"
    - "รวยแล้วอย่าเพิ่งเปลี่ยนไปเป็นเสี่ยนะ ตำบลเรามีเสี่ยพอแล้ว"
    - "ถ้ามีทุนเหลือ ลองขยายแปลงอินทรีย์ดูไหม เราช่วยวางแผนให้ฟรี"
  player_in_debt:
    - "หนี้เยอะเหรอ ลองดูกองทุนหมู่บ้านหรือสหกรณ์ของกล้า ดอกต่ำกว่าเสี่ยเฮงเยอะ"
    - "อย่ากู้ใหม่มาโปะเก่าเลยนะ เราเห็นมากับตาว่ามันจบยังไง"
    - "มาวางแผนลดต้นทุนกันไหม ทำปุ๋ยหมักเองลดค่าปุ๋ยได้เกือบครึ่ง"
  player_sick:
    - "ป่วยเหรอ พักเถอะ แปลงไม่หนีไปไหน เดี๋ยวเราแวะไปรดน้ำให้"
    - "ถ้าฉีดยาฆ่าแมลงบ่อยจนเวียนหัว นั่นพิษสารเคมีนะ ไป รพ.สต. เลย อย่าฝืน"
    - "เราต้มน้ำขิงมาให้ อร่อยไม่อร่อยไม่รู้ แต่อุ่นแน่นอน"
  player_married:
    - "ยินดีด้วยนะ {player} มีคนช่วยงานแปลงแล้ว ผลผลิตต้องดีขึ้นแน่"
    - "งานแต่งเมื่อวานกับข้าวอร่อยมาก ป้าทองใบไม่บ่นเลยสักคำ แปลว่าเลิศ"
    - "อย่าลืมไปจดทะเบียนที่อำเภอนะ กู้ร่วมได้วงเงินสูงขึ้น เป็นคำแนะนำทางการเงินที่ไม่โรแมนติกที่สุดของเรา"
  event_disaster:
    - "น้ำท่วมแปลงหลายหมู่แล้ว เรากำลังสำรวจความเสียหาย ถ้าแปลง {player} เสียหายรีบมาแจ้งนะ"
    - "แบบฟอร์มขอรับเงินช่วยเหลือยาวเจ็ดหน้า เราจะช่วยกรอก ไม่ต้องห่วง"
    - "ภัยพิบัติทีไร คนที่ช่วยกันเองเร็วที่สุดก็ยังเป็นชาวบ้านกันเองนี่แหละ"
  event_election:
    - "ช่วงเลือกตั้งห้ามข้าราชการเลือกข้างนะ เราเลยต้องยิ้มให้ป้ายทุกป้ายเท่ากัน"
    - "จู่ๆ ก็มีโครงการใหม่สิบโครงการโผล่มา ทุกโครงการต้องให้เราไปถ่ายรูปเปิดตัว"
    - "เลือกใครก็ได้ แต่เลือกคนที่ไม่ลืมทุ่งนาหลังวันเลือกตั้งนะ"
  event_company_water:
    - "ระดับน้ำบ่อบาดาลหมู่ 4 ลดลงสองเมตรในเดือนเดียว เราวัดเองกับตลับเมตรนี่แหละ"
    - "บริษัทบอกว่า 'บริหารน้ำใต้ดินให้มีประสิทธิภาพ' เราดูตัวเลขแล้ว ประสิทธิภาพสูงมาก แต่ของใครล่ะ"
    - "เรายื่นรายงานไปแล้ว หัวหน้าบอก 'เก็บไว้ก่อน' ถ้าต้องการตัวเลข เราให้ {player} ได้นะ"
  event_festival_near:
    - "{festival} ใกล้แล้ว! ปีนี้ อบต. ให้เราคุมบูธ เลยต้องพิมพ์ใบลงทะเบียนอีกห้าร้อยแผ่น"
    - "ไป {festival} ด้วยกันไหม คืนเทศกาลไม่มีผี เดินได้ถึงดึกเลย"
    - "เตรียมของไปงาน {festival} หรือยัง ถ้าเอาผักไปประกวด เราช่วยเลือกต้นงามๆ ให้"
  gift_love:
    - "{item}! รู้ได้ไงว่าเราชอบ ขอบคุณมากเลยนะ จะเก็บไว้ดีๆ"
    - "ว้าว นี่ของจริงเลย เราจะเอาไปอวดที่ อบต. ว่ามีคนรู้ใจ"
    - "ไม่ต้องลำบากขนาดนี้ก็ได้… แต่ดีใจมาก ดีใจจริงๆ"
  gift_like:
    - "ขอบคุณนะ {item} เข้ากับกาแฟพอดีเลย"
    - "น่ารักจัง เดี๋ยวกินตอนพักเที่ยง"
    - "ของดีนะเนี่ย ปลูกเองหรือเปล่า"
  gift_neutral:
    - "ขอบคุณนะ เดี๋ยวเราเก็บไว้ก่อน"
    - "อ๋อ {item} ใช้ได้อยู่ ขอบคุณจ้ะ"
    - "รับไว้นะ ไม่เป็นไร"
  gift_dislike:
    - "อืม… ขอบคุณนะ แต่เราไม่ค่อยได้ใช้ของแบบนี้"
    - "เดี๋ยวเอาไปให้คนที่ อบต. ดีกว่า เขาน่าจะชอบมากกว่าเรา"
    - "เอ่อ… เจตนาดีนะ เรารู้"
  gift_hate:
    - "ยาฆ่าหญ้า… ให้นักวิชาการเกษตรอินทรีย์เนี่ยนะ นี่ประชดใช่ไหม"
    - "ขอโทษนะ อันนี้เรารับไม่ได้จริงๆ มันซึมลงคลองหมดเลย"
    - "เราจะทำเป็นไม่เห็นแล้วกัน ครั้งหน้าอย่าทำอีกนะ"
  birthday:
    - "จำวันเกิดเราได้ด้วยเหรอ ที่ อบต. ไม่มีใครจำเลย มีแต่เครื่องสแกนนิ้วที่ทักว่า 'สวัสดี'"
    - "อายุเพิ่มอีกปี แต่ยังเด็กกว่ารายงานที่ค้างอยู่ในลิ้นชักนะ"
    - "ขอบคุณมาก วันนี้เราจะลางานครึ่งวัน… กรอกแบบลาสามแผ่นก่อน"
  rare:
    - "ความลับนะ เราเคยไปนั่งร้องไห้หลังโรงเก็บปุ๋ย อบต. เพราะโครงการที่เขียนไปถูกตัดงบเหลือแค่ป้าย"
    - "เราเลี้ยงไส้เดือนไว้ในกล่องใต้โต๊ะทำงาน ตั้งชื่อตามหัวหน้าทุกคนที่เคยมี อย่าบอกใครนะ"
    - "ตอนสอบบรรจุ เราตอบข้อสอบข้อหนึ่งว่า 'ขึ้นอยู่กับดิน' ทุกข้อในส่วนอัตนัย ยังสอบติดเฉย"
    - "เคยแอบตั้งชื่อเพลี้ยกระโดดตัวหนึ่งว่า 'นายกฯ' เพราะมันมาทุกปีแล้วไม่เคยแก้อะไรเลย… ล้อเล่นๆ อย่าส่งต่อนะ"
    - "เรามีสมุดบันทึกเล่มหนึ่งที่จดว่าแต่ละวัน {player} ปลูกอะไร… เพื่องานวิจัยนะ วิจัยจริงๆ"
  flirt:
    - "ตลาดนัดคืนวันเสาร์มีขนมครกเจ้าอร่อย… ถ้าว่างก็ไปด้วยกันนะ"
    - "แปลงของ {player} ดินดีที่สุดในตำบลเลย… คนดูแลก็ดีด้วย เอ่อ ลืมที่พูดไปนะ"
    - "เราไม่เก่งเรื่องพูดหวาน แต่ถ้าต้องเลือกใครไปเดินดูหิ่งห้อยด้วย เราเลือก {player}"
    - "รู้ไหมว่าต้นไม้ที่ได้คนคุยด้วยทุกวันโตดีกว่า เราเลยมาคุยด้วยทุกวันไง"
romance_stages:
  friend:
    - "{player} เป็นเพื่อนคนแรกในตำบลที่ฟังเราพูดเรื่องไส้เดือนได้เกินห้านาที"
    - "มีเรื่องแปลงก็โทรหาเราได้นะ เบอร์ส่วนตัว ไม่ใช่เบอร์ อบต."
    - "เพื่อนกันต้องแบ่งกาแฟดริปกัน นี่ ชิมดู"
  dating:
    - "ลอยกระทงปีนี้ เราไปลอยที่ท่าน้ำหลังวัดกันนะ คนไม่เยอะ"
    - "วันนี้ที่ อบต. ถามว่าทำไมยิ้มทั้งวัน เราตอบว่า 'ดินดี' ไม่มีใครเชื่อเลย"
    - "เป็นแฟนกันแล้ว ขอสิทธิ์ตั้งชื่อแปลงผักแปลงหนึ่งของ {player} ได้ไหม"
  engaged:
    - "แม่เราถามเรื่องสินสอดแล้ว เราบอกว่าขอเป็นเมล็ดพันธุ์ข้าวหอมสักกระสอบ แม่ทำหน้าไม่ถูกเลย"
    - "เตรียมงานแต่งยังวุ่นน้อยกว่าเตรียมงบประมาณประจำปี แต่มีความสุขกว่าเยอะ"
    - "หมั้นกันแล้วนะ ทีนี้ข่าวลือในกลุ่ม LINE ก็จริงทุกข้อแล้ว"
  married:
    - "อรุณสวัสดิ์ กาแฟดริปอยู่บนโต๊ะนะ วันนี้เราบดเมล็ดเข้มกว่าเดิมนิดหนึ่ง"
    - "เช้านี้เราเดินดูแปลงให้แล้ว มีเพลี้ยนิดหน่อยที่แปลงพริก ฉีดน้ำหมักสะเดาไปแล้วนะ"
    - "วันนี้มีประชุม อบต. ถ้าเรากลับช้าแปลว่ามติคือ 'นัดประชุมใหม่' อีกแล้ว"
    - "ไม่ต้องรีบนะ กินข้าวก่อน ไส้เดือนในกล่องก็ยังรอได้ แปลงก็รอได้"
