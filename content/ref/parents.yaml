# พ่อแม่ผู้เล่น: ย้ายไปอยู่ที่อื่นแล้ว วิดีโอคอลมาเป็นระยะ ส่งพัสดุของฝาก กลับมาเยี่ยมช่วงสงกรานต์
# รูปแบบบรรทัด: แต่ละบรรทัดเป็นข้อความเดียว ถ้าพูดสองคนใช้ "แม่: ... / พ่อ: ..." (เกมแยกเป็นสองกล่องที่ " / ")
# parcel_notes = โน้ตลายมือแนบในกล่องพัสดุ
id: parents
name: "พ่อกับแม่"
role: "พ่อแม่ของผู้เล่น ทำงานในเมือง ฝากลูกกลับไปดูแลบ้านของยายเพียรที่เสียไปแล้ว"
voice: "แม่ห่วงเรื่องกินอยู่ ขี้กังวล เชื่อคลิปสุขภาพในไลน์ พ่อพูดน้อย มุกแห้ง ถามแต่เรื่องนา ต้นไม้ และปั๊มน้ำ ถือกล้องไม่เป็น เห็นแต่หน้าผาก เรียกผู้เล่นว่าลูก หรือ {player}"
dark_humor: false
romanceable: false
lines:
  call_weekly:
    - "แม่: ฮัลโหล เห็นหน้าแม่ไหม {player} / พ่อ: เห็นแต่หน้าผากแม่ เอียงกล้องลงหน่อย"
    - "แม่: กินข้าวหรือยังลูก อย่ากินแต่ข้าวเวฟนะ / พ่อ: ข้าวเวฟก็ข้าว แม่เขาไม่เข้าใจโลกสมัยใหม่"
    - "แม่: ไปวัดบ้างไหม ทำบุญไปให้ตายายด้วยนะ / พ่อ: ฝากบอกลุงจำรัสว่าพ่อยังติดค่ากาแฟแกอยู่สิบบาท"
    - "พ่อ: ต้นมะม่วงหลังบ้านออกลูกหรือยัง พ่อปลูกไว้ตั้งแต่ลูกยังไม่เกิด / แม่: ถามถึงต้นมะม่วงทุกอาทิตย์ ถามมากกว่าถามลูกอีก"
    - "แม่: แม่ไปเต้นแอโรบิกกับแม่บ้านแถวนี้ ได้ที่หนึ่งแถวหลังนะ / พ่อ: แถวหลังมีแม่อยู่คนเดียว"
    - "แม่: ปิดไฟก่อนนอนด้วย ค่าไฟแพง / พ่อ: แล้วอย่าออกไปไหนหลังสามทุ่ม แม่ยังเล่าเรื่องผีปอบสมัยสาวๆ ให้พ่อฟังทุกคืน"
    - "พ่อ: ปั๊มน้ำยังติดไหม ถ้าไม่ติดเคาะข้างๆ สองทีเบาๆ เหมือนปลุกคนแก่ / แม่: อย่าไปเคาะ เรียกช่างเปี๊ยกเถอะ"
    - "แม่: มีแฟนหรือยัง แม่ไม่ได้เร่งนะ แค่ถาม / พ่อ: ถามทุกอาทิตย์ เขาเรียกว่าเร่งแล้วแม่"
    - "แม่: แม่ส่งคลิปไปในไลน์ ดื่มน้ำมะนาวโซดาแก้ได้ทุกโรค / พ่อ: หมอบอกแม่เมื่อวานว่าอย่าเชื่อคลิป แม่บอกว่าหมอไม่ได้อยู่ในกลุ่มไลน์"
    - "พ่อ: เสียงอะไรดังๆ ข้างหลังน่ะ / แม่: หอกระจายข่าวไง พ่อไม่ได้ยินมาสองปี ฟังจนน้ำตาซึมเลย"
  call_after_fainted:
    - "แม่: ป้าแต๋วโทรมาบอกว่าลูกไปตื่นที่ รพ.สต. เป็นอะไรมากไหม / พ่อ: ป้าแต๋วรู้ก่อนพ่อแม่อีก ข่าวไวกว่าไลน์"
    - "แม่: บอกแล้วว่าสามทุ่มให้อยู่บ้าน แม่จะส่งผ้ายันต์ไปให้ / พ่อ: เช่าที่วัดดงเย็นเถอะ เก้าสิบเก้าบาท ค่าส่งไปรษณีย์แพงกว่า"
    - "พ่อ: สมัยพ่อยังหนุ่มก็เคยโดน ตื่นมาอยู่กลางดงกล้วย / แม่: คืนนั้นพ่อกลับจากวงเหล้า ไม่เกี่ยวกับผีสักนิด"
    - "แม่: ค่ารักษาเท่าไหร่ลูก ขาดเงินไหม แม่โอนให้ / พ่อ: โอนได้ แต่อย่าให้บ่อยนะลูก เบี้ยผู้สูงอายุพ่อเดือนละไม่กี่ร้อย"
  call_new_house:
    - "แม่: บ้านใหม่สวยจังลูก ขอดูห้องครัวหน่อย / พ่อ: ขอดูหลังคา รั่วไหม"
    - "พ่อ: ทำบุญขึ้นบ้านใหม่หรือยัง นิมนต์พระอาจารย์สุเมธนะ / แม่: แล้วเลี้ยงข้าวป้าแต๋วด้วย ไม่งั้นข่าวออกมาไม่สวย"
    - "แม่: บ้านไม้หลังเก่ายังอยู่ไหม อย่ารื้อนะ / พ่อ: รื้อได้ แต่เก็บเสาไว้ ไม้แดงทั้งต้น สมัยนี้หาไม่ได้แล้ว"
    - "พ่อ: มีห้องให้พ่อแม่นอนตอนสงกรานต์ไหม / แม่: ไม่ต้องห้องใหญ่ ขอมุ้งดีๆ ยุงที่นั่นมันจำแม่ได้"
  call_married:
    - "แม่: แต่งงานแล้ว แม่ร้องไห้ทั้งคืนเลย ร้องเพราะดีใจนะ / พ่อ: แม่ร้องตั้งแต่ก่อนรู้ข่าว ร้องเพราะละครหลังข่าว"
    - "พ่อ: ดูแลกันดีๆ ทะเลาะกันอย่าข้ามคืน / แม่: ถ้าจะข้ามคืนก็ห้ามเกินสามทุ่ม ผีออก"
    - "แม่: ให้คู่ของลูกมาคุยกับแม่หน่อย แม่จะสอนสูตรแกงเขียวหวาน / พ่อ: ระวังนะ สูตรแม่ไม่มีช้อนตวง มีแต่คำว่าประมาณ"
    - "พ่อ: เมื่อไหร่จะมีหลาน… พ่อไม่ได้อยากถามนะ แม่ให้ถาม / แม่: พ่อถามเองต่างหาก แม่นั่งอยู่ตรงนี้ได้ยิน"
  call_in_debt:
    - "แม่: ได้ข่าวว่ามีหนี้ ไม่ต้องอายพ่อแม่นะลูก / พ่อ: พ่อเคยติดหนี้ร้านปุ๋ยสมัยพ่อของเสี่ยเฮงยังเปิดร้าน ใช้หมดจนได้"
    - "พ่อ: อย่าไปกู้นอกระบบเด็ดขาดนะลูก / แม่: แม่โอนไปให้นิดหน่อย ห้ามเอาไปซื้อหวย"
    - "แม่: กินข้าวให้ครบมื้อก่อน หนี้ค่อยว่ากัน / พ่อ: หนี้มันไม่วิ่งหนี แต่ข้าวมันบูด"
    - "พ่อ: ถ้าบริษัทมาขอซื้อที่ช่วงนี้ คิดดีๆ นะลูก / แม่: ที่ดินขายได้ครั้งเดียว แม่พูดคำนี้มาสามสิบปีแล้ว"
  call_rich:
    - "แม่: ได้ข่าวว่าลูกไปได้สวย ป้าแต๋วเล่าทั้งตำบลแล้ว / พ่อ: พ่อก็โม้ให้คนทั้งซอยฟังไปแล้วเหมือนกัน"
    - "พ่อ: มีเงินแล้วซ่อมหลังคาก่อนนะ ค่อยซื้อของเล่น / แม่: ใส่ซองงานบวชหลานป้าพรให้หนาหน่อยด้วย"
    - "แม่: ไม่ต้องส่งเงินมาหรอก แม่มีพอใช้ / พ่อ: แต่ถ้าจะส่งจริงๆ พ่ออยากได้รองเท้าบูตคู่ใหม่"
    - "พ่อ: รวยแล้วอย่าลืมว่ามาจากคันนา / แม่: และอย่าลืมว่าใครสอนให้เก็บถุงพลาสติกไว้ใช้ซ้ำ"
  call_harvest_good:
    - "พ่อ: ข้าวงามแบบนี้พ่อภูมิใจ อย่าลืมไหว้แม่โพสพนะ / แม่: แล้วส่งข้าวใหม่มาให้แม่หุงสักถุง"
    - "แม่: เห็นรูปในไลน์แล้ว รวงข้าวเต็มเลย / พ่อ: เอาไปขายสหกรณ์ของกล้านะ เสี่ยเฮงหักความชื้นเก่ง"
    - "พ่อ: ปีนี้ได้กี่เกวียน พ่อไม่ได้แข่งนะ แต่ปีที่ดีที่สุดของพ่อได้สามสิบ / แม่: เลขสามสิบนี่พ่อพูดมาสิบปีแล้ว ปีนั้นได้ยี่สิบเจ็ด"
    - "แม่: ได้ผลดีแล้วแบ่งให้คนที่มาลงแขกด้วยนะ / พ่อ: แบ่งไปถวายวัดด้วย บุญไม่ต้องรอปีหน้า"
  call_harvest_bad:
    - "พ่อ: ปีนี้ไม่ดีก็ไม่เป็นไร ชีวิตพ่อก็มีปีแย่มากกว่าปีดี / แม่: แต่พ่อเล่าแต่ปีดี"
    - "แม่: ไม่ต้องเครียดนะลูก มีข้าวกินก็พอแล้ว / พ่อ: ปีหน้าลองถามกล้าเรื่องพันธุ์ทนแล้งดู"
    - "พ่อ: ฝนฟ้ามันไม่ฟังใคร ไม่ฟังแม้แต่ อบต. / แม่: แต่ประกันพืชผลเขาฟังนะ ซื้อไว้หรือยังลูก"
    - "แม่: แม่ส่งพริกแห้งกับปลาร้าไปอีกกล่อง อย่างน้อยกับข้าวไม่แย่ / พ่อ: ข้าวไม่ดี แต่น้ำพริกดี ก็ยังกินได้"
  call_disaster:
    - "แม่: ดูข่าวว่าทางนั้นน้ำท่วม ลูกปลอดภัยไหม / พ่อ: ยกของขึ้นที่สูงหรือยัง ตู้เย็นก่อน ทีวีทีหลัง"
    - "พ่อ: หลังคาเป็นไงบ้าง พ่อบอกแล้วว่าสังกะสีแผ่นซ้ายมันหลวม / แม่: พ่อบอกมาห้าปี แต่พ่อไม่เคยซ่อม"
    - "แม่: ไปพักที่วัดก่อนไหมลูก พระอาจารย์สุเมธท่านใจดี / พ่อ: ไปช่วยท่านแพ็กของด้วยนะ ไม่ใช่ไปนอนเฉยๆ"
    - "พ่อ: ของเสียหายซ่อมได้ คนเจ็บซ่อมยาก ดูแลตัวเองก่อน / แม่: แม่โอนค่าซ่อมไปแล้ว ไม่ต้องคืน"
  call_songkran_visit:
    - "แม่: สงกรานต์นี้พ่อแม่จะกลับบ้านนะ เตรียมที่นอนไว้ด้วย / พ่อ: จองรถทัวร์แล้ว แถวหน้าสุด พ่อเมารถ"
    - "พ่อ: ปีนี้พ่อจะไปรดน้ำดำหัวตาเผือก แกยังติดค่าเหล้าพ่ออยู่ขวดนึง / แม่: ไปรดน้ำขอพรนะ ไม่ใช่ไปทวงหนี้"
    - "แม่: แม่จะทำข้าวแช่ไปถวายวัด เตรียมน้ำแข็งไว้เยอะๆ / พ่อ: พ่อขอแค่ได้นั่งใต้ต้นมะม่วงเหมือนเดิม"
    - "พ่อ: อย่าสาดน้ำใส่แม่นะ แม่เพิ่งไปทำผมมา / แม่: สาดพ่อได้เลย พ่อไม่มีผมให้ทำ"
  parcel_notes:
    - "ปลาร้าบองแม่ห่อถุงสามชั้นแล้ว ถ้ายังรั่วอีกให้โทษไปรษณีย์นะ — แม่"
    - "ในกล่องมีมุ้ง ยากันยุง ยาดม ใช้ให้หมดก่อนค่อยซื้อใหม่ — แม่"
    - "เมล็ดพริกพันธุ์ดีจากข้างบ้าน ปลูกตรงข้างโอ่งนะ ตรงนั้นแดดดี — พ่อ"
    - "กล้วยตากแม่ตากเอง แบ่งเพื่อนบ้านได้ แต่เหลือไว้กินเองบ้าง — แม่"
    - "เสื้อกันหนาวตัวนี้ของพ่อสมัยหนุ่ม ยังใส่ได้ ไม่เชย แม่ว่าเชย — พ่อ"
    - "สายสิญจน์นี้แม่ขอจากวัดใกล้บ้าน ผูกข้อมือไว้ กลางคืนจะได้อุ่นใจ — แม่"
    - "มีเงินซองเล็กๆ ใต้ถุงขนม อย่าบอกพ่อนะ — แม่ / พ่อเห็นแล้ว ใส่เพิ่มให้อีกร้อย — พ่อ"
    - "น้ำพริกนรกสามกระปุก ฝาแดงเผ็ดมาก อย่าให้เด็กแถวบ้านกินนะ — แม่"
  call_about_grandma:
    - "แม่: บ้านยายเป็นยังไงบ้างลูก ฝุ่นเยอะไหม / พ่อ: หลังคาด้านครัวรั่วนะ ยายบ่นมาตั้งแต่ปีก่อน"
    - "แม่: แม่ขอโทษนะที่ต้องให้ลูกกลับไปคนเดียว แม่รู้ว่าลูกเหนื่อยมาจากงาน / พ่อ: พักบ้างนะ ที่นั่นไม่มีใครเร่งเรา"
    - "แม่: ยายชอบปลูกมะลิไว้หน้าบ้าน ถ้ายังไม่ตายก็รดน้ำให้หน่อยนะ"
    - "พ่อ: สมุดของยายน่ะ ยายเขียนทุกอย่างลงไป ถ้าเจอหน้าไหนถ่ายรูปส่งมาให้แม่ดูด้วย แม่คิดถึง"
    - "แม่: ใครในตำบลพูดถึงยายบ้าง ยายบัวยังแข็งแรงไหม ฝากกราบด้วยนะ"
    - "แม่: วันนี้ครบรอบร้อยวันยาย ไปวัดใส่บาตรให้ยายด้วยนะลูก / พ่อ: พ่อโอนค่าทำบุญไปให้แล้ว"
  call_burnout:
    - "แม่: ช่วงนี้นอนหลับดีขึ้นไหม ตอนอยู่กรุงเทพฯ ลูกโทรมาตีสองทุกคืน"
    - "พ่อ: หัวหน้าเก่าโทรมาตามงานอีกแล้วเหรอ บล็อกไปเลยลูก พ่ออนุญาต"
    - "แม่: หน้าลูกมีเลือดฝาดขึ้นนะ แดดที่นั่นดีกว่ายาบำรุง"
    - "แม่: ไม่ต้องรีบรวยนะลูก ยายไม่เคยรวย แต่ยายมีความสุข"
