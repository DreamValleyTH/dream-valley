    - "น้องกำลังทดสอบความอดทนของเฮียใช่ไหม ดอกเบี้ยน้องขึ้นแล้วนะ ล้อเล่น… มั้ง"
  birthday:
    - "วันเกิดเฮียน้องก็จำได้ ดี เฮียจำวันครบกำหนดของน้องได้เหมือนกัน"
    - "อายุเฮียขึ้นอีกปี เหมือนดอกเบี้ยทบต้น ไม่เคยลด"
    - "วันนี้เฮียใจดี ลดดอกทุกคนหนึ่งวัน หนึ่งวันนะ ไม่ใช่หนึ่งงวด"
  rare:
    - "เฮียมีสมุดเล่มเล็กอีกเล่ม จดหนี้ที่เฮียตัดทิ้งไปแล้ว ไม่มีใครรู้ เพราะถ้ารู้คนจะเลิกกลัวเฮีย"
    - "เฮียไม่เคยซื้อหวยสักงวดเลยนะน้อง เพราะเฮียรู้ว่าระบบที่ได้กำไรแน่ๆ คือระบบเจ้ามือ เฮียก็เป็นเจ้ามือแบบหนึ่ง"
    - "พ่อเฮียตายตอนเฮียยี่สิบ หนี้เหลือสองแสน เฮียจ่ายครบตอนสามสิบห้า วันนั้นเฮียนั่งร้องไห้หลังลานคนเดียว"
    - "เฮียแอบซื้อข้าวอินทรีย์ของไอ้กล้ากินเองที่บ้าน อร่อยกว่าข้าวที่เฮียรับซื้อ เฮียเลยโกรธมันมากกว่าเดิม"
    - "รู้ไหมทำไมเฮียตั้งเครื่องชั่งหน้าลาน ไม่ได้เอาไว้โกงนะ เอาไว้ให้คนเห็นว่ามีเครื่องชั่ง แค่นั้นก็พอให้คนเชื่อแล้ว น่ากลัวกว่าเยอะ"
