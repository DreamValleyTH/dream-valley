  gift_love:
    - "{item}! น้องรู้ใจเฮียจริงๆ ของชิ้นนี้ราคาตลาดเท่าไหร่ เฮียจะจดไว้ว่าน้องให้เฮีย"
    - "โอ้โห เฮียลดดอกให้น้องครึ่งเปอร์เซ็นต์ทันที ไม่มีใครเคยให้ของแบบนี้กับเฮียเลย"
    - "ของดีแบบนี้ เฮียไม่ขายต่อนะ เฮียเก็บเอง ถือว่าเป็นสินทรัพย์ทางใจ"
  gift_like:
    - "{item} เหรอ ดีน้อง ของมีราคา เฮียชอบของมีราคา"
