id: heng
name: "เสี่ยเฮง"
role: "เจ้าของร้านปุ๋ยยาและลานรับซื้อพืชผล ปล่อยเชื่อปุ๋ย ครูสายค้าขาย ฝั่งทุน"
voice: "แทนตัวเองว่าเฮีย เรียกผู้เล่นว่าน้อง ลงท้าย นะน้อง ฮ่าๆ ทุกเรื่องแปลงเป็นเงินและดอกเบี้ยได้ กดเครื่องคิดเลขระหว่างคุย ใจดีแบบมีดอกเบี้ย ตลกร้ายเรื่องทุนแบบยอมรับหน้าตาเฉย"
dark_humor: true
romanceable: false
lines:
  greet_morning:
    - "เช้าแล้วน้อง ตลาดเปิด ดอกเบี้ยก็ตื่นแล้ว มันไม่เคยนอนหรอก"
    - "มาแต่เช้าเลย จะซื้อปุ๋ยหรือจะมาเชื่อปุ๋ย สองอย่างนี้ราคาไม่เท่ากันนะน้อง"
    - "เฮียเปิดลานตั้งแต่หกโมง ข้าวที่มาตอนเช้าความชื้นสูง เฮียชอบ ฮ่าๆ"
    - "กาแฟเฮียแก้วละสิบห้า แต่น้องดื่มฟรี ถือว่าเป็นค่าการตลาด"
    - "หอกระจายข่าวบอกวันนี้แดดดี ดีสำหรับน้องนะ ไม่ค่อยดีสำหรับเฮีย"
  greet_noon:
    - "เที่ยงแล้ว เฮียกินข้าวไปคิดเลขไป อร่อยเท่าเดิมแต่ได้กำไรเพิ่ม"
    - "แดดเที่ยงแรงขนาดนี้ ข้าวที่ตากบนลานแห้งไวมาก เฮียเห็นแล้วใจหาย"
    - "มาๆ นั่งใต้ร่มเฮียก่อน ร่มนี่ฟรี ที่นั่งก็ฟรี คำปรึกษาเริ่มจะไม่ฟรีแล้วนะ"
    - "ลูกค้าคนที่สามสิบวันนี้ น้องได้รางวัล… รางวัลคือเฮียจำหน้าน้องได้"
    - "เครื่องคิดเลขเฮียแบตอ่อน แต่ดอกเบี้ยแบตยังเต็มนะน้อง"
  greet_evening:
    - "ห้าโมงแล้ว ฟังหอกระจายข่าวหรือยัง ราคาพรุ่งนี้ขึ้น แต่ลานเฮียขึ้นช้ากว่านิดนึง เป็นธรรมชาติ"
    - "เย็นแล้วน้อง เฮียปิดลานแล้ว แต่ปิดบัญชีเฮียไม่เคยปิด"
    - "เย็นนี้ลมดี เฮียนั่งนับเงินเพลินๆ ใครว่าเงินซื้อความสุขไม่ได้ เขาคงนับไม่ถูกวิธี"
    - "กลับบ้านดีๆ นะน้อง ลูกหนี้เฮียทุกคนต้องปลอดภัย"
    - "เย็นแล้วยังมาขายของอีก น้องขยันจริง เฮียชอบคนขยัน ขยันจ่ายด้วยยิ่งชอบ"
  greet_night:
    - "สองทุ่มแล้วน้อง รีบกลับเถอะ ผีมันไม่จ่ายดอกแทนน้องหรอกนะ"
    - "เฮียปิดร้านแล้ว แต่ถ้าจะมาเชื่อปุ๋ย เคาะประตูได้ ดอกกลางคืนแพงกว่านิดหน่อย ฮ่าๆ"
    - "ไฟลานเฮียเปิดทั้งคืน ไม่ได้กันผีหรอก กันคนขโมยกระสอบข้าว"
    - "เฮียไม่กลัวผีนะ ผีไม่มีบัตรประชาชน ฟ้องเฮียไม่ได้"
    - "ดึกแล้วน้อง ถ้าเป็นลมกลางทาง เงินสดหาย เฮียเสียลูกหนี้ไปคนนึงเลยนะ"
  weather_rain:
    - "ฝนตก ลานตากของใครก็ตากไม่ได้ ข้าวชื้นทั้งตำบล เฮียยิ้มแก้มปริเลย"
    - "ฝนแบบนี้แหละน้อง ความชื้นสิบแปดเปอร์เซ็นต์ เฮียหักให้แบบเพื่อนๆ"
    - "ยาเชื้อราขายดีหน้าฝน เฮียต้องขอบคุณฟ้าบ้าง จุดธูปไหว้ฟ้าทุกเช้า"
    - "ฝนตก น้องไม่ต้องรดน้ำ ประหยัดแรง แรงที่เหลือมาขนกระสอบให้เฮียไหม จ้างวันละสามร้อย"
    - "รองเท้าบูทเฮียมีขาย คู่ละร้อยแปดสิบ หรือจะเชื่อไว้ก่อนก็ได้นะ"
  weather_hot:
    - "ร้อนขนาดนี้ ข้าวแห้งไว ความชื้นเหลือสิบสี่ เฮียหักไม่ลงเลย หัวใจเฮียร้อนกว่าแดด"
    - "ร้อนนะน้อง ยาฆ่าแมลงฉีดตอนเที่ยงมันระเหยหมด เปลืองเงิน ฉีดตอนเช้าสิ"
    - "แอร์ร้านเฮียเปิดเย็นเฉียบ เข้ามาซื้อของในห้องแอร์ ราคาก็เย็นตามนะ ล้อเล่น ราคาเท่าเดิม"
    - "หน้าร้อนคนเป็นลมแดดกันเยอะ เฮียขายเกลือแร่ซองละสิบ กำไรนิดเดียว จริงๆ นะ"
    - "แดดเปรี้ยงอย่างนี้ เฮียคิดจะเก็บค่าใช้ลานตากเป็นรายชั่วโมงแล้ว"
  weather_storm:
    - "พายุมาน้อง หลังคาเฮียสังกะสีปลิวไปสองแผ่น ประกันจ่าย เฮียทำประกันทุกอย่าง แม้แต่ประกันอารมณ์"
    - "ไฟดับ เครื่องชั่งดิจิทัลเฮียใช้ไม่ได้ วันนี้เฮียชั่งด้วยตาชั่งสปริงแบบเก่า… ซึ่งก็แม่นพอๆ กัน ฮ่าๆ"
    - "พายุทีไรพืชล้ม ราคาพุ่ง ใครมีของในโกดังก็รวย ใครมีของในนาก็ร้องไห้"
    - "ฝนกระหน่ำแบบนี้ ลูกหนี้เฮียโทรมาขอเลื่อนจ่ายเป็นแถว เฮียใจดีนะ เลื่อนได้ ดอกก็เลื่อนตามขึ้นไปด้วย"
  weather_pm25:
    - "ฝุ่นเยอะน้อง เฮียขายหน้ากากกล่องละร้อยยี่สิบ มีอากาศให้หายใจฟรีแต่หายใจได้ไม่ดีเท่าไหร่"
    - "ฝุ่นแบบนี้คนอำเภอเผาไร่อ้อย ส่งอ้อยเข้าโรงงาน โรงงานก็ซื้อแบบไม่ถามว่าเผามาหรือเปล่า ระบบมันหมุนแบบนี้แหละน้อง"
    - "เครื่องฟอกอากาศเฮียสั่งให้ได้ ผ่อนหกเดือน ดอกเบาๆ หายใจโล่งไปพร้อมกับหนี้"
    - "ไอแค่กๆ เฮียก็หายใจฝุ่นเหมือนน้องแหละ ฝุ่นนี่ยุติธรรมที่สุดในประเทศแล้ว"
  season_rainy:
    - "หน้าฝนคือหน้าทองของร้านปุ๋ย ทุกคนอยากให้ข้าวงาม เฮียอยากให้ทุกคนอยากต่อไปเรื่อยๆ"
    - "ต้นฤดูอย่าลืมทำประกันพืชผลนะน้อง ซื้อได้แค่ต้นฤดู เฮียบอกเพราะเฮียไม่ได้ขายประกัน"
    - "ปุ๋ยสูตรเสมอใส่ตอนข้าวแตกกอ ยูเรียตอนตั้งท้อง จำไว้นะ ใส่ผิดเวลาเงินลงดินเปล่าๆ"
    - "หน้าฝนน้ำท่วมทีไร ราคาข้าวขึ้น แต่ข้าวน้องจมน้ำไปแล้ว ชีวิตมันตลกแบบนี้แหละ"
    - "หน้าฝนคนมาเชื่อปุ๋ยเยอะ หน้าหนาวคนมาขายข้าว หน้าแล้งคนมาหาเฮียเรื่องดอก ฤดูกาลของเฮียครบสามฤดู"
  season_cool:
    - "หน้าหนาวเกี่ยวข้าว ลานเฮียคิวยาวถึงหน้าวัด ข้าวมาเยอะ ราคาก็ลงตามกลไกตลาด เฮียไม่ได้ทำนะ ตลาดทำ"
    - "ข้าวใหม่หอมนะน้อง หอมจนเฮียได้กลิ่นกำไรตั้งแต่หน้าลาน"
    - "รถเกี่ยวลุงสมหมายคิวเต็มเลย ไร่ละพันรัฐช่วยค่าเก็บเกี่ยว ส่วนลุงก็ขึ้นค่าเกี่ยวไร่ละร้อย พอดีกันเป๊ะ"
    - "หน้าหนาวอากาศดี เฮียใส่เสื้อหนาวแบรนด์อำเภอ อุ่นเหมือนบัญชีเงินฝาก"
    - "ใกล้สิ้นปีแล้ว เฮียกำลังปิดบัญชีลูกหนี้ ใครจ่ายครบเฮียแจกปฏิทินร้านปุ๋ยให้ ฟรี"
  season_dry:
    - "หน้าแล้งไม่มีข้าวมาขาย ลานเฮียว่าง เฮียเลยให้เช่าลานจัดงานบวช ตกวันละห้าร้อย"
    - "มะนาวหน้าแล้งราคาพุ่ง ใครปลูกไว้ตอนนี้รวย เฮียรับซื้อนะ ราคาดีกว่าตลาด… ตลาดเมื่อเดือนที่แล้ว"
    - "น้ำแล้งทีไร ปั๊มสูบน้ำเฮียขายดี บริษัทเขาก็ซื้อ ชาวบ้านก็ซื้อ แข่งกันดูดว่าใครถึงก้นบ่อก่อน"
    - "หน้าแล้งคนหนุ่มสาวไปโรงงาน ส่งเงินกลับมาจ่ายหนี้เฮีย เศรษฐกิจหมุนเวียนดีนะน้อง"
    - "สงกรานต์ใกล้แล้ว ญาติกรุงเทพฯ กลับมาพร้อมรถป้ายแดง เฮียแจกนามบัตรรอเลย"
  heart_low:
    - "ซื้อเงินสดนะน้อง เครดิตน้องยังไม่มีในระบบเฮีย"
    - "จะเชื่อก็ได้ ดอกห้าเปอร์เซ็นต์ต่อเดือน เพราะเฮียยังไม่รู้จักน้องเท่าไหร่"
    - "น้องคือเด็กที่กลับมาจากกรุงเทพฯ ใช่ไหม เฮียได้ยินว่าทำนาไม่เป็นนี่"
    - "ขายข้าวที่ลานเฮียก็ได้ หักความชื้นตามมาตรฐาน มาตรฐานของเฮียนะ"
    - "ถ้าน้องไปขายสหกรณ์ของไอ้กล้า ปุ๋ยเชื่อเฮียก็ต้องงดนะ ธุรกิจคือธุรกิจ"
  heart_mid:
    - "ช่วงนี้น้องขายของให้เฮียบ่อย เฮียลดดอกให้เหลือสามเปอร์เซ็นต์ เห็นไหม ความรักมีราคา"
    - "นั่งก่อน เฮียสอนคิดต้นทุนให้ เครื่องคิดเลขเฮียนี่สอนชีวิตได้มากกว่าครูบางคนอีก"
    - "เฮียไม่ได้ใจร้ายนะน้อง เฮียแค่ใจดีเป็นงวดๆ"
    - "เฮียชอบน้องนะ น้องจ่ายตรงเวลา ในตำบลนี้คนแบบนี้หายากกว่าพระเครื่องรุ่นแรก"
    - "ลูกเฮียเรียนอยู่เมืองนอก ค่าเทอมแพงกว่าความชื้นที่เฮียหักทั้งปีอีก น้องเห็นใจเฮียหน่อย"
  heart_high:
    - "รู้ไหมน้อง สมัยก่อนพ่อเฮียติดหนี้พ่อค้าข้าวจนต้องขายนา เฮียสาบานว่าจะไม่เป็นคนติดหนี้ ก็เลยมาเป็นคนให้กู้แทน"
    - "เฮียเริ่มจากขี่รถเร่ขายปุ๋ยตามหมู่บ้าน กระสอบแรกเฮียแบกเองบนหลัง ตอนนั้นยังไม่มีใครเรียกเฮียว่าเสี่ย"
    - "เฮียไม่ชอบไอ้กล้าหรอก แต่เฮียเคารพมัน มันทำในสิ่งที่เฮียไม่กล้าทำตอนหนุ่มๆ"
    - "บริษัทของคุณธนาใหญ่กว่าเฮียร้อยเท่า ถ้ามันมา เฮียก็เป็นแค่ปลาตัวกลางในบ่อที่ใกล้จะแห้ง"
    - "ความลับนะน้อง สมุดหนี้ของเฮียมีหลายบ้านที่เฮียไม่เคยทวงเลย เฮียแค่ไม่อยากให้ใครรู้ว่าเฮียใจอ่อน"
    - "ถ้าวันนึงเฮียเลิกปล่อยกู้ คนในตำบลจะไปกู้ใครล่ะน้อง แอปเงินด่วนในโทรศัพท์ดอกแพงกว่าเฮียสามเท่านะ"
  topic_news:
    - "ราคาข้าวหอมมะลิพรุ่งนี้ขึ้นกิโลละห้าสิบสตางค์ เฮียบอกน้องก่อนหอกระจายข่าวอีก เห็นไหมเฮียใจดี"
    - "บริษัทคุณธนามาเสนอเฮียเป็นตัวแทนรับซื้อข้าวโพดสัญญา เฮียยังไม่ตอบ เพราะเขาหักเฮียอีกทอดนึง"
    - "สหกรณ์ไอ้กล้ารับซื้อราคาตลาดอีกแล้ว ลูกค้าเฮียหายไปสามเจ้า ตลาดเสรีนี่ไม่ค่อยเสรีกับเฮียเลย"
    - "ข่าวว่าจะมีโครงการประกันราคาข้าวรอบใหม่ เงินเข้าช้าหนึ่งฤดู ระหว่างรอก็มาเชื่อปุ๋ยเฮียก่อนได้"
    - "เขาว่าที่ ส.ป.ก. จะเปลี่ยนเป็นโฉนดได้ พอเป็นโฉนดก็กู้ได้ กู้ได้ก็เป็นหนี้ได้ เป็นหนี้ได้ก็ขายได้ ระบบมันลื่นมากนะน้อง"
    - "พระเครื่องวัดเจริญทรัพย์มหามงคลรุ่นใหม่ราคาขึ้นสามเท่าในอาทิตย์เดียว เร็วกว่าดอกเบี้ยเฮียอีก เฮียยังอิจฉา"
  topic_advice:
    - "จะขายของ ฟังราคาหอกระจายข่าวรอบห้าโมงเย็นก่อน แล้วค่อยขายวันรุ่งขึ้น อย่าขายตอนทุกคนแห่ขาย"
    - "ข้าวตากให้แห้งก่อนค่อยเอามาขาย เฮียบอกแล้วนะ เฮียเสียเงินเพราะคำแนะนำนี้ทุกปี"
    - "ต่อราคาต้องยิ้มก่อนแล้วค่อยต่อ ยิ้มแล้วต่อลดได้อีกสามเปอร์เซ็นต์ ไม่ยิ้มเฮียไม่ลด"
    - "ฝึกค้าขายสูงๆ ถึงเลเวลหก ขอชั่งซ้ำได้ ตาชั่งบริษัทจะขาดน้อยลง ส่วนตาชั่งเฮีย… ก็ชั่งซ้ำได้เหมือนกัน"
    - "ของเทศกาลขายได้แพง ตั้งแผงตอนงานวัดแล้วขายของกินเล่น คนเที่ยวงานไม่ค่อยดูราคา"
    - "อย่าเอาไข่ไว้ตะกร้าเดียว ปลูกข้าวด้วย ผักด้วย เลี้ยงไก่ด้วย ราคาตัวไหนตกอีกตัวยังพยุง"
  topic_smalltalk:
    - "เฮียกำลังคิดจะเปลี่ยนชื่อร้านเป็นเฮงทวีคูณ น้องว่าดีไหม ฟังดูเหมือนดอกเบี้ยทบต้นดี"
    - "หมาเฮียชื่อดอกเบี้ย เพราะยิ่งเลี้ยงยิ่งโต ยิ่งโตยิ่งกิน"
    - "เมื่อคืนเฮียฝันว่าเงินหล่นจากฟ้า ตื่นมาเป็นใบเสร็จค่าไฟ"
    - "เฮียเล่นกอล์ฟในอำเภอเดือนละครั้ง ตีไม่เป็นหรอก ไปเพื่อเจอคนที่ตีเป็นแล้วมีเงิน"
    - "ลองดื่มชาจีนเฮียหน่อย กาละพันห้า ถ้วยนี้น้องกินไปห้าสิบบาทแล้วนะ ฮ่าๆ ล้อเล่นๆ"
  topic_about_self:
    - "เฮียเกิดที่ตำบลนี้ แม่เฮียขายโจ๊กหน้าตลาด เฮียเคยล้างถ้วยจนนิ้วเปื่อย"
    - "เฮียจบแค่ ม.3 แต่คิดเลขในหัวเร็วกว่าเครื่องคิดเลข ยกเว้นตอนนับเงินทอนให้คนอื่น ฮ่าๆ"
    - "เฮียเป็นทั้งร้านปุ๋ย ร้านยา ลานรับซื้อ และธนาคารเงาของตำบล ครบวงจร ตั้งแต่ปลูกยันเป็นหนี้"
    - "เฮียไม่ได้อยากรวยนะน้อง เฮียแค่ไม่อยากจน มันไม่เหมือนกัน คนจนเท่านั้นแหละที่รู้ว่าไม่เหมือน"
    - "ทุกปีเฮียทำบุญกฐินที่วัดดงเย็นก้อนใหญ่ พระอาจารย์ไม่เคยถามเลยว่าเงินมาจากไหน เฮียซึ้งใจ"
  topic_about_others:
    - "ไอ้กล้าน่ะ อุดมการณ์สูงจนเฮียมองไม่เห็นหัว แต่สหกรณ์มันบัญชีสะอาดกว่าเฮียอีก น่ารำคาญจริง"
    - "เจ๊แต๋วให้เชื่อดอกเดือนละบาท เฮียว่าแกทำธุรกิจขาดทุนด้วยความใจดี เฮียทำไม่ได้หรอก"
    - "คุณธนาพูดภาษาสวยมาก เฮียฟังจบแล้วยังไม่รู้ว่าโดนกดราคาตรงไหน คนนี้เก่งกว่าเฮีย"
    - "ลุงสมหมายติดหนี้เฮียเพราะหวย เฮียไม่ปล่อยกู้ซื้อหวยนะ ลุงแค่บอกว่ากู้ไปซ่อมรถเกี่ยว ทุกงวด"
    - "เมย์นักข่าวมาถามเรื่องความชื้นที่ลานเฮีย เฮียบอกว่าความจริงก็มีความชื้นเหมือนกัน ต้องหักบ้าง"
    - "ดาบเสถียรมาดูความเรียบร้อยลานเฮียทุกเย็น ดูเสร็จก็กินกาแฟเฮียฟรี เฮียถือว่าค่าประกันภัย"
  gossip_theft:
    - "ข่าวว่าน้องขโมยของ เฮียไม่ตัดสินนะ แต่วงเงินเชื่อน้องลดเหลือครึ่ง ธุรกิจคือธุรกิจ"
    - "ขโมยของเหรอน้อง เสียดายนะ ถ้าอยากได้ของฟรีมาทำงานกับเฮียสิ อย่างน้อยถูกกฎหมาย"
    - "ข่าวลือแบบนี้กดราคาตัวเองนะน้อง คนเชื่อใจคือทุนที่แพงที่สุด เสียแล้วซื้อคืนยาก"
  gossip_cheating:
    - "คบซ้อนเหรอน้อง เฮียไม่ว่าหรอก เฮียแค่บอกว่าความรักไม่ใช่หุ้น กระจายความเสี่ยงไม่ได้"
    - "สองคนพร้อมกันนี่ต้นทุนสูงนะน้อง ของขวัญสองชุด เวลาสองเท่า แต่หัวใจจะเหลือศูนย์"
    - "เฮียแนะนำในฐานะนักธุรกิจ ปิดดีลเดียวให้จบดีกว่า"
  gossip_unpaid_bill:
    - "ค่าไฟค้างเหรอน้อง มาเชื่อเงินเฮียไปจ่ายก่อนก็ได้ ดอกค่าไฟเฮียไม่แพง เฉพาะคนตกยากเลย"
    - "เห็นชื่อน้องในกลุ่ม LINE เรื่องค่าไฟ เฮียตกใจ นึกว่าน้องติดเฮียคนเดียว"
    - "ไฟดับตู้เย็นดับ ของในตู้เสีย ขาดทุนสองต่อ เฮียเกลียดขาดทุนแทนคนอื่นด้วยนะ"
  gossip_small_envelope:
    - "ใส่ซองร้อยนึงเหรอน้อง เฮียเข้าใจนะ ต้นทุนชีวิตมันสูง แต่ต้นทุนชื่อเสียงสูงกว่า"
    - "ใส่ซองน้อยแล้วโดนจด ตอนน้องจัดงานเขาก็ใส่คืนน้อยนะ ระบบนี้เป๊ะกว่าบัญชีเฮียอีก"
    - "ซองคือการลงทุนระยะยาวน้อง ใส่วันนี้ ได้คืนวันงานน้อง ดอกเบี้ยเป็นศูนย์แต่ได้น้ำใจ"
  gossip_skip_longkhaek:
    - "ไม่ไปลงแขกคืนเขาเหรอ น้องกำลังเบี้ยวหนี้แรงงานนะ เฮียรู้จักหนี้ทุกชนิด"
    - "เขาช่วยน้องแล้วน้องไม่ช่วยเขา ในโลกเฮียเรียกว่าผิดนัดชำระ ในโลกชาวบ้านเรียกว่าไม่มีน้ำใจ อันหลังแรงกว่า"
  player_fainted:
    - "ได้ข่าวว่าน้องโดนผีจับ ตื่นที่ รพ.สต. เงินสดหายไปบ้างไหม ถ้าหายมาเชื่อเฮียได้ ฮ่าๆ"
    - "เฮียบอกแล้ว อย่าพกเงินสดเยอะตอนกลางคืน ผีมันไม่เอาไปหรอก แต่มันก็หายอยู่ดี"
    - "ค่ารักษาสิบเปอร์เซ็นต์ของเงินสดเหรอ รพ.สต. คิดดอกยังน้อยกว่าเฮียอีก ใจดีจริง"
  player_new_vehicle:
    - "รถใหม่เลยเหรอน้อง ผ่อนกี่งวด ดอกเท่าไหร่ ให้เฮียดูสัญญาหน่อย เฮียดูให้ฟรี"
    - "รถใหม่สวยนะ เฮียชอบ ลูกค้ามีรถคือขนของมาขายลานเฮียได้เยอะขึ้น"
    - "ขับรถเข้าลานได้เลยน้อง ที่จอดฟรี ชั่งน้ำหนักรถก่อนนะ เดี๋ยวจะได้หักตอนออก"
  player_lottery_win:
    - "ถูกหวยเหรอน้อง! ยินดีด้วย เฮียคิดว่าตอนนี้เป็นเวลาที่ดีที่สุดที่จะคุยเรื่องปิดหนี้"
    - "ถูกหวยอย่าเพิ่งซื้อของ เอาไปฝากธนาคาร หรือ… ให้เฮียกู้ต่อ เฮียให้ดอกน้องนะ"
    - "หวยคือภาษีของคนมีความหวังน้อง วันนี้น้องได้คืนแล้ว อย่าจ่ายเพิ่มอีกนะ"
  player_muddy:
    - "โคลนเต็มตัวเลยน้อง ยืนห่างจากกระสอบปุ๋ยเฮียหน่อย ถุงขาวมันเปื้อนง่าย"
    - "นี่แหละหน้าตาของคนทำงานจริง ส่วนเฮียหน้าตาของคนนับเงินจากงานจริง"
    - "ไปล้างตัวที่ก๊อกหลังลานก่อนน้อง ค่าน้ำเฮียไม่คิด วันนี้วันดี"
  player_rich:
    - "ช่วงนี้น้องรวยขึ้นนะ เฮียเห็นจากการที่น้องไม่มาเชื่อปุ๋ย เฮียเศร้านิดๆ"
    - "รวยแล้วถือบัตรสวัสดิการเองไม่ได้นะน้อง เกินแสนก็ตกเกณฑ์ บางคนเขาจ้างคนอื่นถือแทน เฮียไม่ได้แนะนำนะ เฮียแค่เล่า"
    - "รวยแล้วลงทุนกับเฮียไหม ซื้อหุ้นลาน ปันผลทุกฤดู ความเสี่ยงคือฝนไม่ตก ซึ่งดีสำหรับเฮีย"
  player_in_debt:
    - "หนี้เฮียน้องตอนนี้ {price} บาท ไม่ต้องตกใจ ดอกมันโตเร็วกว่าข้าวเองแหละ เป็นธรรมชาติ"
    - "ไม่ต้องหลบหน้าเฮียหรอกน้อง เฮียไม่ยึดอะไรหรอก เฮียแค่จำ จำได้นานด้วย"
    - "ถ้าจ่ายไม่ไหวไปคุยกับสหกรณ์ไอ้กล้าดู เฮียพูดเรื่องนี้ครั้งเดียวนะ อย่าบอกใคร"
  player_sick:
    - "ป่วยเหรอน้อง ร้านยาเภสัชมดอยู่ติดกัน อย่าซื้อยาที่ร้านเฮีย ร้านเฮียมีแต่ยาฆ่าแมลง"
    - "พักก่อนน้อง คนป่วยทำงานแล้วล้ม เฮียเสียทั้งลูกค้าและลูกหนี้"
    - "ป่วยหลายวันระวังเรื่องพิษสารเคมีนะ น้องฉีดยาบ่อยหรือเปล่า เฮียขายเองแต่ไม่ได้บอกให้ฉีดทุกวัน"
  player_married:
    - "ยินดีด้วยน้อง! จดทะเบียนสมรสแล้วกู้ร่วมได้วงเงินสูงขึ้นนะ เฮียพูดในฐานะคนรักครอบครัว"
    - "แต่งงานแล้วค่าใช้จ่ายเพิ่ม รายได้ก็เพิ่ม หนี้ก็เพิ่ม ชีวิตคู่สมบูรณ์แบบ"
    - "ซองงานแต่งเฮียใส่ห้าพัน อย่าบอกใคร เดี๋ยวคนจะคิดว่าเฮียใจดีจริงๆ"
  event_disaster:
    - "น้ำท่วมแบบนี้ เฮียงดทวงหนี้หนึ่งเดือนนะ ดอกก็งดด้วย… เฮียพูดจริง อย่าตกใจ"
    - "สภาโหวตพักหนี้แล้วเหรอ ดี แต่หนี้เฮียไม่ผ่านสภานะน้อง ผ่านเฮียคนเดียว แต่เฮียผ่อนผันให้"
    - "ภัยพิบัติทีไรคนรวยก็ยังรวย คนจนก็ยังซ่อมบ้าน เฮียเห็นมาสามสิบปี น้ำไม่เคยท่วมเท่ากันทุกบ้าน"
  event_election:
    - "ช่วงเลือกตั้งโครงการใหม่โผล่มาเยอะ ป้ายใหญ่กว่างาน เฮียรับทำป้ายด้วยนะ เพิ่งเปิดกิจการ"
    - "คืนหมาหอนน่ะน้อง ซองมาแล้วจะรับก็รับ เข้าคูหาแล้วเลือกตามใจ แต่ฝ่ายที่ให้เงินเขาจำนะ เฮียจำด้วย"
    - "เฮียไม่ยุ่งการเมือง เฮียแค่ให้ทุกฝ่ายเชื่อปุ๋ย ใครชนะก็เป็นลูกค้าเฮีย"
  event_company_water:
    - "บริษัทดูดน้ำบาดาลจนบ่อชาวบ้านแห้ง ปั๊มเฮียขายดีขึ้นสามเท่า เฮียควรดีใจไหมน้อง เฮียไม่แน่ใจแล้ว"
    - "คุณธนามาขอซื้อลานเฮียด้วยนะ เฮียเพิ่งรู้ว่าตัวเองก็เป็นปลาเล็กได้เหมือนกัน"
    - "ทุนใหญ่มาก็กินทุนเล็กก่อน แล้วค่อยกินชาวบ้าน เฮียอยู่ตรงกลาง กำลังคิดว่าจะยืนข้างไหน"
  event_festival_near:
    - "{festival} ใกล้แล้ว ใครจะตั้งแผงขายของมาเช่าโต๊ะเฮียได้ ตัวละห้าสิบ"
    - "{festival} ทีไรคนใช้เงินเก่ง เฮียชอบเทศกาลทุกเทศกาลเลยน้อง"
