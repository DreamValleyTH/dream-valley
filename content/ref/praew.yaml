id: praew
name: "แพรว"
role: "ลูกสาวกำนันประเสริฐ เรียนจบการตลาดจากกรุงเทพฯ กลับมาเปิดร้านขายของออนไลน์ อายุ 27"
voice: "มั่นใจ ปากไว ลงท้าย 'ค่ะ' 'นะคะ' แต่เวลาหงุดหงิดเปลี่ยนเป็น 'ย่ะ' ชอบพูด 'ไม่ต้องเกรงใจพ่อแพรวนะ' ติดศัพท์ขายของออนไลน์ เช่น ไลฟ์ ยอดวิว ออเดอร์ ถือไม้เซลฟี่ติดตัว"
dark_humor: false
romanceable: true
personality: "สวย เก่ง ทะเยอทะยาน ขี้แซว ภายนอกเหมือนคุณหนู แต่ทำงานหนักและเหงา"
backstory: "ทั้งตำบลเรียกเธอว่า 'ลูกกำนัน' ไม่เคยเรียกชื่อ ทุกคนเกรงใจจนไม่มีใครกล้าเป็นเพื่อนจริง แฟนเก่าในกรุงเทพฯ คบเพราะเห็นว่าพ่อมีเส้นสาย เธอจึงกลับมาทำแบรนด์ผ้าทอและข้าวกล้องของตำบลขายออนไลน์ เพื่อพิสูจน์ว่าทำได้ด้วยตัวเอง และแอบสงสัยว่าพ่อพัวพันกับบริษัทคุณธนาแค่ไหน"
courtship: "ไม่ชอบคนประจบหรือคนที่ทำดีเพราะพ่อเป็นกำนัน ชอบคนที่กล้าเถียงเธอตรงๆ และช่วยงานไลฟ์ขายของ ให้ของทำมือมีเรื่องราว"
lines:
  greet_morning:
    - "อรุณสวัสดิ์ค่ะ {player} ตื่นเช้าจัง แพรวเพิ่งไลฟ์ขายข้าวกล้องเสร็จ มีคนดูสิบสองคน สามคนเป็นญาติ"
    - "เช้านี้พ่อเปิดหอกระจายข่าวเพลงลูกทุ่งดังจนแพรวตกเตียง ใครก็ได้ช่วยซื้อหูฟังให้พ่อที"
    - "มาจ่ายตลาดเหรอคะ แพรวแนะนำผักบุ้งเจ้าป้าตรงหัวมุม สดสุดในตำบล ไม่ได้ค่าโฆษณานะ"
    - "แสงเช้าแบบนี้ถ่ายรูปสินค้าสวยที่สุด {player} ช่วยถือผ้าซิ่นให้แพรวถ่ายแป๊บได้ไหมคะ"
    - "อ้าว สวัสดีค่ะ ไม่ต้องไหว้แพรวนะ แพรวไม่ใช่กำนัน"
  greet_noon:
    - "เที่ยงแล้วค่ะ แพรวกำลังแพ็กออร์เดอร์ยี่สิบกล่อง ใครว่างมาช่วยพับกล่องได้ค่าแรงเป็นข้าวผัด"
    - "ร้อนจนเทปกาวละลาย ถ้ากล่องถึงลูกค้าแล้วเปิดเอง ไม่ใช่ความผิดแพรวนะคะ"
    - "พักกินข้าวกันไหมคะ ร้านพี่หน่อยวันนี้มีเย็นตาโฟ แพรวเลี้ยงเอง… ด้วยเงินแพรวเองนะ ไม่ใช่เงินพ่อ"
    - "เพิ่งไปส่งพัสดุที่อำเภอมา รถเมล์ลุงเชิดเปิดเพลงเดิมทั้งทาง แพรวร้องตามได้ทุกคำแล้ว"
    - "เที่ยงๆ แบบนี้ยอดขายออนไลน์ตก คนกำลังกินข้าว แพรวเลยมาเดินเล่นค่ะ"
  greet_evening:
    - "เย็นแล้วค่ะ ไลฟ์รอบหนึ่งทุ่มนะคะ อย่าลืมเข้ามากดหัวใจให้แพรวด้วย"
    - "แสงสีทองแบบนี้เหมาะกับถ่ายข้าวในทุ่งมาก {player} ยืนเป็นนายแบบให้แพรวหน่อยได้ไหม หรือนางแบบก็ได้ ตามสะดวก"
    - "พ่อกลับจากประชุมแล้วอารมณ์ไม่ดี แพรวเลยหนีออกมาเดินเล่น"
    - "ตลาดนัดเย็นนี้มีหมูปิ้ง แพรวจองไว้สิบไม้แล้ว แบ่งให้ได้สองไม้"
    - "เย็นๆ แบบนี้คิดถึงรถไฟฟ้าในกรุงเทพฯ นิดหนึ่ง… แค่นิดเดียวนะคะ"
  greet_night:
    - "สองทุ่มกว่าแล้ว กลับบ้านเถอะค่ะ ผีไม่สนว่าใครเป็นลูกกำนัน แพรวลองมาแล้ว"
    - "แพรวกำลังจะไปไลฟ์ในบ้าน ใครติดอยู่ข้างนอกตอนสามทุ่มก็… ขอให้วิ่งเร็วค่ะ"
    - "ไม่ต้องห่วงแพรวนะ บ้านกำนันมีไฟสปอตไลต์สิบดวง ผีเห็นแล้วนึกว่าคอนเสิร์ต"
    - "หมาหอนแล้ว ถ้าวิ่งไม่ทันแวะร้าน 24 ชม. ของตั้มนะคะ ซื้อขนมอุดหนุนเขาด้วย"
    - "รีบกลับนะคะ พรุ่งนี้แพรวไม่อยากได้ยินในกลุ่ม LINE ว่า {player} ไปนอน รพ.สต."
  weather_rain:
    - "ฝนตกค่ะ พัสดุแพรวเปียกหมด ต้องห่อพลาสติกสามชั้น ต้นทุนพุ่ง"
    - "ฝนตกแบบนี้คนอยู่บ้านเล่นโทรศัพท์ ยอดไลฟ์ดีที่สุดในรอบสัปดาห์"
    - "ร่มของแพรวเป็นลายดอกไม้ที่ขายไม่ออก เลยใช้เอง ถือเป็นการโปรโมต"
    - "ฝนตกถนนเข้าหมู่ 4 เป็นหลุมอีกแล้ว พ่อบอกว่า 'กำลังดำเนินการ' มาสามปี"
    - "ฝนตกแล้วผมแพรวพองหมด ห้ามถ่ายรูปนะคะ"
  weather_hot:
    - "ร้อนจนครีมกันแดดละลายลงตา แพรวมองไม่เห็นอะไรแล้วค่ะ"
    - "อากาศร้อนแบบนี้ขายพัดลมมือถือดีมาก แพรวกำลังคิดจะสั่งมาขายพร้อมลายผ้าซิ่น"
    - "ดื่มน้ำเยอะๆ นะคะ แพรวมีน้ำเก๊กฮวยเย็นในกระติก เอาไหม"
    - "ร้อนแบบนี้พ่อนั่งใต้ต้นมะม่วงหน้าบ้านทั้งวัน ชาวบ้านมาหาก็ต้องนั่งตากแดดรอ"
    - "แดดแรงขนาดนี้ แพรวไม่ออกไปไหนแล้ว ยกเว้นมีคนชวนไปกินน้ำแข็งไส"
  weather_storm:
    - "พายุเข้าค่ะ ป้ายร้านออนไลน์ที่แพรวติดหน้าบ้านปลิวไปไหนไม่รู้ ใครเจอเอามาคืนด้วย"
    - "พ่อบอกให้แพรวอยู่บ้าน แต่แพรวต้องไปช่วยยกของที่ศาลาหมู่บ้าน ไม่ฟังหรอก"
    - "ไฟดับแบบนี้ไลฟ์ไม่ได้ แพรวเลยนั่งพับกล่องใต้เทียนเหมือนคนยุคก่อน"
    - "อย่าออกไปทุ่งนะคะ ต้นไม้ล้มขวางทางหลายจุดแล้ว"
    - "หลังพายุ ถ้าบ้านใครเสียหาย บอกแพรวนะ แพรวจะกดดันพ่อให้เร่งเรื่องให้ อันนี้แพรวทำได้"
  weather_pm25:
    - "ฝุ่นหนาจนกล้องถ่ายสินค้าออกมาเป็นสีส้ม ลูกค้าถามว่าผ้าสีอะไรกันแน่"
    - "ใส่หน้ากากนะคะ แพรวมีหน้ากากผ้าลายตีนจกขาย กันฝุ่นไม่ได้หรอก แต่สวย"
    - "ปีที่แล้วแพรวเสนอพ่อให้ออกประกาศห้ามเผา พ่อบอก 'เดี๋ยวคนไม่เลือก'"
    - "ฝุ่นแบบนี้อยากกลับไปนั่งห้องแอร์ในกรุงเทพฯ แต่ที่นั่นฝุ่นก็มีเหมือนกัน ไม่มีที่หนีเลยนะคะ"
    - "วันนี้แพรวงดไลฟ์กลางแจ้ง ไลฟ์ในห้องแล้วเปิดพัดลมไล่ฝุ่นแทน"
  season_rainy:
    - "หน้าฝนข้าวเขียวทั้งทุ่ง แพรวถ่ายรูปไปทำปกเพจ ยอดไลก์ขึ้นเลย"
    - "เข้าพรรษาแล้ว พ่อไปงานแห่เทียนทุกวัด แพรวต้องตามไปถือร่มให้"
    - "ช่วงนี้กบเยอะ ร้องทั้งคืน แพรวอัดเสียงไปลงคลิป 'เสียงบ้านนอก' คนในเมืองชอบมาก"
    - "หน้าฝนพัสดุส่งช้า ลูกค้าทักมาด่าทุกวัน แพรวต้องตอบ 'ขออภัยในความไม่สะดวกค่ะ' จนนิ้วล็อก"
    - "แข่งเรือยาวปีนี้แพรวจะไปเชียร์ทีมหมู่ 4 ไม่ใช่ทีมพ่อ อย่าบอกพ่อนะ"
  season_cool:
    - "หน้าหนาวแล้วค่ะ! ยอดขายผ้าคลุมไหล่ทอมือพุ่ง แพรวขายหมดสต็อกในสามวัน"
    - "ลอยกระทงปีนี้แพรวทำกระทงใบตองเอง ไม่ใช้โฟม แพรวมีหลักการนะคะ"
    - "หนาวแบบนี้ต้องกินข้าวหลามยายจันทร์ แพรวกำลังขอยายเอามาขายออนไลน์"
    - "งานกาชาดอำเภอแพรวจะไปสอยดาว ปีที่แล้วได้ขวดน้ำปลามาสองขวด"
    - "หน้าหนาวพ่อชอบจัดงานเลี้ยงที่บ้าน แพรวต้องยิ้มให้แขกสามร้อยคน แก้มแพรวเป็นตะคริว"
  season_dry:
    - "หน้าแล้งน้ำประปาไหลเบา แพรวอาบน้ำทีต้องรอให้น้ำเต็มถังก่อน"
    - "สงกรานต์นี้แพรวจะเปิดบูธขายน้ำอบไทยกับผ้าขาวม้า ใครมารดน้ำดำหัวพ่อต้องผ่านบูธแพรวก่อน"
    - "แล้งแบบนี้ชาวบ้านมาขอพ่อให้ช่วยเรื่องรถน้ำ แพรวจดชื่อไว้ให้ ไม่งั้นพ่อลืม"
    - "หน้าร้อนลูกค้าซื้อเสื้อผ้าฝ้ายเยอะ แพรวกำลังจะทำคอลเลกชัน 'ร้อนแต่สวย'"
    - "งานบวชหมู่ปีนี้กลองยาวดังทั้งตำบล แพรวเต้นตามไปครึ่งทางแล้วเพิ่งรู้ว่าตามผิดขบวน"
  heart_low:
    - "สวัสดีค่ะ ถ้ามาหาพ่อ พ่ออยู่ที่ทำการกำนัน ไม่ต้องผ่านแพรว"
    - "ไม่ต้องยิ้มเกรงใจขนาดนั้นค่ะ แพรวไม่ได้ให้คะแนนความประพฤติใคร"
    - "คนย้ายกลับมาจากกรุงเทพฯ เหมือนแพรวเลย หวังว่าคงไม่หนีกลับไปเร็วนะคะ"
    - "ขอโทษค่ะ กำลังไลฟ์อยู่ อย่าเดินเข้ากล้องนะ"
    - "ทุกคนที่มาคุยกับแพรวครั้งแรก ส่วนใหญ่ขอให้ฝากเรื่องกับพ่อ {player} ก็ด้วยหรือเปล่าคะ"
  heart_mid:
    - "{player} เป็นคนแรกที่เรียกแพรวด้วยชื่อตั้งแต่ครั้งแรกที่เจอเลยนะ รู้ตัวไหม"
    - "ช่วงนี้มาช่วยไลฟ์บ่อยๆ ลูกค้าถามหาแล้วนะคะ ว่า 'คนที่ถือผ้าวันก่อนไปไหน'"
    - "แพรวทำโลโก้ใหม่ให้ข้าวกล้องของตำบล ดูแล้วบอกตรงๆ นะว่าสวยไหม ห้ามเกรงใจ"
    - "เวลาคุยกับ {player} แพรวไม่ต้องคิดว่าจะพูดอะไรให้ดูดี สบายดีนะคะ"
    - "พ่อถามว่า 'คนที่มาคุยกับลูกบ่อยๆ ทำอาชีพอะไร' แพรวบอกว่าทำนา พ่อเงียบไปทั้งมื้อ"
  heart_high:
    - "รู้ไหมคะ แฟนเก่าแพรวขอเลิกวันเดียวกับที่รู้ว่าพ่อแพรวไม่ช่วยเรื่องประมูลงานให้ที่บ้านเขา"
    - "บางคืนแพรวแอบดูเอกสารบนโต๊ะพ่อ ชื่อบริษัทคุณธนาโผล่บ่อยเกินไป แพรวกลัวว่าจะรู้อะไรที่ไม่อยากรู้"
    - "แพรวไม่เคยมีเพื่อนในตำบลจริงๆ เลย ตอนเด็กไม่มีใครกล้าแกล้งแพรว และก็ไม่มีใครกล้าชวนแพรวเล่น"
    - "แม่แพรวเสียตอนแพรวสิบสอง พ่อเลยเลี้ยงแพรวแบบเลี้ยงหมู่บ้าน คือสั่งการ แต่รักนะ แพรวรู้"
    - "ถ้าวันหนึ่งพ่อแพรวทำเรื่องผิด แพรวจะยืนข้างความจริงหรือข้างพ่อ… แพรวยังตอบตัวเองไม่ได้เลยค่ะ"
  topic_news:
    - "แพรวได้ยินพ่อคุยโทรศัพท์ว่าบริษัทจะมาขอซื้อที่แถวหมู่ 4 เพิ่ม ใครมีที่ตรงนั้นระวังนะคะ"
    - "อำเภอจะจัดงานของดีประจำอำเภอ แพรวกำลังรวบรวมของดีตำบลไปออกบูธ {player} มีอะไรอยากฝากขายไหม"
    - "กลุ่ม LINE หมู่บ้านมีคนโพสต์ขายพระเครื่องวัดเจริญทรัพย์ราคาสามหมื่น แพรวกดหัวเราะไปแล้ว"
    - "ป้าแต๋วบอกว่ามีคนเห็นเมย์นักข่าวมาถ่ายรูปที่ทำการกำนัน พ่อเครียดทั้งคืน"
    - "ข้าวกล้องตำบลเราขึ้นหน้าแรกเว็บขายของแล้วนะคะ! วันเดียว ก่อนโดนครีมหน้าใสแซง"
  topic_advice:
    - "จะขายของให้ได้ราคา ต้องเล่าเรื่องค่ะ 'ข้าวจากนาที่ไม่ใช้ยา' ขายได้แพงกว่าข้าวเฉยๆ สามสิบเปอร์เซ็นต์"
    - "ถ้าจะประกาศขายของในหอกระจายข่าว ประกาศวันก่อนตลาดนัด คนจะมาถามซื้อถึงฟาร์ม คุ้มค่าสามเปอร์เซ็นต์"
    - "ถ่ายรูปผลผลิตตอนแสงเช้าหรือแสงเย็น อย่าถ่ายตอนเที่ยง ผักจะดูเหี่ยวทั้งที่สดอยู่"
    - "ของแปรรูปขายได้ราคาดีกว่าของสด มะม่วงสุกกิโลละสามสิบ แต่ทำมะม่วงกวนขายได้เป็นร้อย"
    - "ถ้ามีเรื่องต้องติดต่อทำการกำนัน ไปตอนเช้าก่อนเก้าโมงนะคะ พ่อยังอารมณ์ดีอยู่"
    - "อย่าแจกของฟรีบ่อยในกลุ่ม LINE คนจะชินแล้วไม่ยอมจ่าย แพรวเจ็บมาแล้ว"
  topic_smalltalk:
    - "ถ้าแพรวไม่ใช่ลูกกำนัน แพรวว่าแพรวคงเป็นแม่ค้าตลาดนัดปากจัดเหมือนเจ๊หงษ์ แต่หน้าสวยกว่า"
    - "แพรวมีไม้เซลฟี่สามอัน อันหนึ่งไว้ไลฟ์ อันหนึ่งไว้สำรอง อีกอันไว้ไล่หมาตอนเดินกลับบ้าน"
    - "{player} ว่าแพรวควรตั้งชื่อร้านใหม่ไหมคะ ตอนนี้ชื่อ 'แพรวพรรณ' ทุกคนนึกว่าขายเครื่องสำอาง"
    - "เคยลองทำส้มตำไลฟ์สด ใส่พริกผิดไปสิบเม็ด ร้องไห้ออกกล้อง ยอดวิวสูงสุดตั้งแต่เปิดร้าน"
    - "แพรวกำลังฝึกพูดสำเนียงไทยพวนกับยายจันทร์ จะได้ไลฟ์ขายผ้าแบบเข้าถึงอารมณ์"
  topic_about_self:
    - "แพรวเรียนการตลาดที่กรุงเทพฯ ทำงานบริษัทโฆษณาสามปี ขายครีมที่ตัวเองไม่ได้ใช้ เลยกลับมาขายของที่ตัวเองเชื่อแทน"
    - "ร้านแพรวขายผ้าทอ ข้าวกล้อง กับขนมของป้าๆ ในตำบล กำไรน้อย แต่ป้าๆ ได้เงินจริง"
    - "ทุกคนคิดว่าแพรวรวย ความจริงพ่อรวย แพรวมีแค่หนี้ค่าแพ็กเกจจิ้งค่ะ"
    - "แพรวชอบนั่งริมคลองตอนเย็น เป็นที่เดียวที่ไม่มีใครเดินมาไหว้แพรว"
    - "ฝันของแพรวคือให้คนรู้จักตำบลเราเพราะของดี ไม่ใช่เพราะข่าวบริษัทสูบน้ำ"
  topic_about_others:
    - "พ่อแพรวเป็นกำนันที่รักลูกบ้านนะคะ แค่บางทีรักนักลงทุนด้วย ซึ่งแพรวไม่แน่ใจว่ารักเท่ากันไหม"
    - "นกเป็นเพื่อนสมัยประถมคนเดียวที่ยังกล้าเรียกแพรวว่า 'ยัยแพรวขี้มูก' แพรวคิดถึงเธอเวลาเธอกลับโรงงาน"
    - "กล้าเกลียดบริษัทมาก เวลาเจอแพรวก็มองแบบสงสัยว่าแพรวอยู่ข้างไหน ซึ่งแพรวก็อยากรู้เหมือนกัน"
    - "เมย์นักข่าวเคยมาสัมภาษณ์แพรวเรื่องร้านค้าออนไลน์ แล้วถามคำถามสุดท้ายเรื่องพ่อ แพรวรู้ทันนะ"
    - "ยายจันทร์ทอผ้าเก่งที่สุดในอำเภอ ผ้าผืนหนึ่งทอสามเดือน แพรวตั้งราคาให้ยายสูงกว่าที่ยายกล้าตั้งเองสองเท่า"
  gossip_theft:
    - "ข่าวเรื่องขโมยของมาถึงหูพ่อแพรวแล้วค่ะ พ่อจดชื่อ {player} ไว้ในสมุดเล่มแดง แพรวไม่ชอบเลย"
    - "แพรวไม่ตัดสินจากกลุ่ม LINE หรอก แต่ถ้าจริงคืนของซะ แล้วแพรวจะทำเป็นลืม"
    - "รู้ไหมคะ คนเขาจะบอกว่าแพรวคบคนขโมยของ แล้วไปบอกต่อว่าพ่อแพรวปกป้อง เรื่องมันลามแบบนี้แหละ"
  gossip_cheating:
    - "คบซ้อนเหรอคะ แพรวเคยเจอแบบนี้มาแล้วในกรุงเทพฯ ไม่คิดว่าจะเจออีกที่บ้าน"
    - "แพรวจะไม่ร้องไห้ในไลฟ์หรอกนะ แต่ไม่ได้แปลว่าไม่เจ็บ"
    - "ทั้งตำบลรู้ก่อนแพรว นั่นแหละที่เจ็บที่สุดย่ะ"
  gossip_unpaid_bill:
    - "ค้างค่าไฟเหรอคะ แพรวไม่ล้อนะ แต่ป้าแต๋วล้อแน่"
    - "มาขายของในไลฟ์แพรวไหม แพรวหักค่าคอมแค่สิบเปอร์เซ็นต์ ได้เงินมาจ่ายบิล"
    - "อย่าให้ถึงขั้นโดนตัดไฟนะคะ ทั้งตำบลจะได้เห็นบ้าน {player} มืดเป็นหลังเดียว"
  gossip_small_envelope:
    - "ซองงานบวชที่บ้านแพรว {player} ใส่มาเท่าไหร่ แพรวไม่ได้นับ แต่พ่อนับ"
    - "ใส่ซองน้อยไม่เป็นไรหรอกค่ะ ที่เป็นเรื่องคือคนที่จดไว้แล้วพูดถึงสามปี"
    - "ครั้งหน้าใส่ซองพร้อมยิ้มกว้างๆ ป้าทองใบจะจำแต่รอยยิ้ม… ล้อเล่น ป้าจำแต่ยอดเงิน"
  gossip_skip_longkhaek:
    - "ไม่ไปช่วยลงแขกคืนเหรอคะ ที่นี่ไม่ใช่กรุงเทพฯ นะ ไม่มีใครลืมอะไรง่ายๆ"
    - "แพรวยังไปช่วยลงแขกปีละครั้งเลย ถึงจะเกี่ยวข้าวได้แค่สามกำแล้วเป็นลมก็ตาม"
    - "เรื่องนี้พ่อแพรวพูดในวงข้าวเย็นแล้วนะคะ ไปขอโทษลุงสมหมายเถอะ"
  player_fainted:
    - "เป็นลมกลางทุ่งเหรอคะ! แพรวเห็นในกลุ่ม LINE มีคนแชร์รูปแล้ว รูปไม่สวยเลย แพรวขอให้ลบแล้วนะ"
    - "ค่ารักษาเท่าไหร่คะ ถ้าเงินหาย บอกแพรว ไม่ใช่ยืมนะ จ้างช่วยแพ็กของ"
    - "ครั้งหน้าถ้ากลับไม่ทันไปนอนบ้านกำนันก็ได้ บ้านแพรวไฟสว่างเหมือนสนามบิน"
  player_new_vehicle:
    - "รถใหม่สวยค่ะ! มาเป็นรถส่งของให้ร้านแพรวไหม ค่าน้ำมันแพรวจ่าย"
    - "ขอถ่ายรูปคู่กับรถหน่อย แพรวจะแคปชันว่า 'คนรุ่นใหม่กลับบ้าน' ยอดไลก์มาแน่"
    - "บอลคงวิจารณ์ไปแล้วสิบนาทีใช่ไหมคะ เขาทำแบบนั้นกับรถทุกคันในตำบล"
  player_lottery_win:
    - "ถูกหวย! เจ๊หงษ์รู้แล้วนะ ระวังโดนชวนซื้อเลขต่อ"
    - "เอาเงินไปลงทุนทำแบรนด์ผลผลิตกับแพรวไหมคะ คุ้มกว่าซื้อทองแน่นอน… อาจจะนะ"
    - "แพรวยินดีด้วยค่ะ แค่อย่าบอกพ่อ พ่อจะมาขอบริจาคสร้างศาลาอีกหลัง"
  player_muddy:
    - "โคลนเต็มตัวเลยค่ะ ยืนนิ่งๆ แพรวขอถ่ายรูปไปโปรโมตข้าว 'ปลูกด้วยมือจริงๆ'"
    - "อย่าเดินเข้าบ้านกำนันแบบนี้นะคะ พรมพ่อแพงกว่าค่าไถนาทั้งปี"
    - "เปื้อนโคลนแบบนี้ก็ดูดีนะ… แพรวพูดเรื่องแสงในกล้องค่ะ"
  player_rich:
    - "ได้ข่าวว่ารวยแล้ว ระวังพ่อแพรวชวนไปเป็นหัวคะแนนนะคะ"
    - "รวยแล้วอย่าลืมอุดหนุนร้านค้าชุมชน แพรวเปิดให้จองผ้าคลุมไหล่ล่วงหน้าแล้ว"
    - "คนรวยในตำบลส่วนใหญ่เริ่มใส่ทองเส้นใหญ่ {player} อย่าเลยนะ ไม่เข้ากับหน้า"
  player_in_debt:
    - "มีหนี้เหรอคะ แพรวก็มี หนี้ค่ากล่องพัสดุ เรามาเป็นลูกหนี้ด้วยกันไหม"
    - "อย่าไปกู้เสี่ยเฮงเพิ่มนะคะ ดอกเขาโตเร็วกว่ายอดวิวแพรวอีก"
    - "แพรวช่วยได้ค่ะ เอาของที่ทำมาฝากขาย แพรวไม่หักค่าคอมเดือนแรก"
  player_sick:
    - "ป่วยเหรอคะ แพรวต้มโจ๊กมาให้ ไม่ใช่สูตรตัวเองนะ ป้าทองใบทำ แพรวแค่ถือมา"
    - "พักเถอะค่ะ ไม่ต้องห่วงงาน แพรวสั่งพ่อให้ส่งคนไปรดน้ำให้แล้ว… ล้อเล่น แพรวไปเอง"
    - "ไป รพ.สต. นะคะ หมอแอนเก่ง ฟรีด้วย อย่าไปคลินิกที่อำเภอเปลืองเงิน"
  player_married:
    - "ยินดีด้วยค่ะ แพรวไลฟ์งานแต่งให้แล้ว คนดูเยอะกว่าไลฟ์ขายของทุกครั้งรวมกัน"
    - "งานแต่งสวยมาก แพรวจดไอเดียไว้เต็มสมุด… เผื่อใช้ ไม่ได้มีแผนนะ"
    - "ขอให้มีความสุขนะคะ อย่าลืมมาซื้อผ้าปูที่นอนทอมือร้านแพรวด้วย"
  event_disaster:
    - "แพรวเปิดไลฟ์ระดมของช่วยน้ำท่วมแล้วค่ะ ยอดบริจาคมากกว่ายอดขายทั้งเดือน"
    - "พ่อลงพื้นที่ แพรวขับรถกระบะตามไปแจกถุงยังชีพ คราวนี้แพรวสั่งพ่อบ้าง"
    - "ถ้าบ้าน {player} เสียหาย แจ้งแพรวด้วย แพรวจะคอยดูว่าชื่อไม่ตกหล่นจากรายชื่อรับเงินช่วยเหลือ"
  event_election:
    - "ช่วงเลือกตั้งบ้านแพรวมีแขกทั้งวัน แพรวต้องชงกาแฟจนจำสูตรได้ร้อยคน"
    - "ใครมาบอกว่าพ่อแพรวฝากให้เลือกใคร ไม่ต้องเชื่อนะคะ แพรวขอแค่เลือกตามใจ"
    - "คืนก่อนเลือกตั้งแพรวไม่ออกจากบ้าน แพรวไม่อยากเห็นว่าใครเดินถือซองอะไร"
  event_company_water:
    - "บ่อบ้านแพรวยังไม่แห้ง บ่อชาวบ้านแห้งก่อน… แพรวไม่แน่ใจว่าเป็นเรื่องบังเอิญ"
    - "คุณธนาส่งตะกร้าผลไม้มาบ้านแพรวทุกเดือน แพรวเอาไปแจกที่ รพ.สต. หมด"
    - "แพรวกำลังรวบรวมรูปบ่อที่แห้ง ถ้า {player} มีรูปบ่อบ้านส่งมานะคะ ยังไม่รู้จะเอาไปทำอะไร แต่จะไม่ทิ้ง"
  event_festival_near:
    - "{festival} ใกล้แล้วค่ะ แพรวจะไลฟ์สดทั้งงาน ช่วยเป็นตากล้องให้หน่อยได้ไหม"
    - "ปีนี้งาน {festival} พ่อเป็นประธาน แพรวต้องนั่งแถวหน้า ใครไปช่วยนั่งข้างแพรวทีจะได้ไม่เหงา"
    - "ซื้อชุดใหม่ไปงาน {festival} หรือยังคะ แพรวมีผ้าซิ่นให้เช่า ราคามิตรภาพ"
  gift_love:
    - "{item}! แพรวอยากได้มาตั้งนานแล้ว รู้ใจขนาดนี้ทำแพรวเขินนะคะ"
    - "ของแบบนี้ซื้อไม่ได้ด้วยชื่อพ่อ แพรวจะเก็บไว้ดีๆ ค่ะ"
    - "ขอบคุณค่ะ… ปกติแพรวพูดเก่ง แต่ตอนนี้นึกไม่ออกเลย"
  gift_like:
    - "น่ารักจังค่ะ แพรวจะถ่ายรูปลงสตอรี่"
    - "{item} เหรอคะ ชอบค่ะ ขอบคุณนะ"
    - "ดีจัง แพรวกำลังอยากได้พอดีเลย"
  gift_neutral:
    - "ขอบคุณค่ะ"
    - "อ๋อ {item} แพรวรับไว้นะคะ"
    - "แพรวเก็บไว้ก่อนนะ เผื่อใช้ทำพร็อพถ่ายรูป"
  gift_dislike:
    - "เอ่อ… คนชอบให้แพรวแบบนี้เพราะคิดว่าลูกกำนันต้องชอบ แต่แพรวไม่ค่อยชอบนะคะ"
    - "ขอบคุณค่ะ แต่ครั้งหน้าถามแพรวก่อนก็ได้"
    - "อืม… แพรวเอาไปใส่กล่องของแถมให้ลูกค้าแล้วกัน"
  gift_hate:
    - "ซองเงิน? นี่ให้แพรวหรือฝากถึงพ่อคะ ไม่ต้องตอบ แพรวรู้แล้ว"
    - "เอากลับไปเถอะค่ะ แพรวไม่อยากให้ใครคิดว่าแพรวรับของแบบนี้"
    - "แพรวขอไม่รับนะคะ และขอให้ลืมว่าเคยเกิดขึ้น"
  birthday:
    - "จำวันเกิดแพรวได้! ทุกปีคนส่งดอกไม้มาบ้านเยอะ แต่ส่งถึงพ่อ ไม่มีใครเขียนการ์ดถึงแพรวเลย"
    - "ขอบคุณค่ะ ปีนี้แพรวขอพรว่าขอให้ยอดขายดี และขอให้คนเรียกชื่อแพรวมากกว่าเรียก 'ลูกกำนัน'"
    - "วันเกิดปีนี้แพรวไม่จัดงาน ขอเดินเล่นริมคลองกับเพื่อนสักคนก็พอ… อย่างเช่น {player}"
  rare:
    - "ความลับนะคะ แพรวยังเก็บตุ๊กตาช้างที่แม่ซื้อให้ตอนเด็กไว้หัวเตียง ชื่อ 'ท่านกำนันน้อย'"
    - "แพรวเคยแอบส่งข้อมูลให้เมย์ครั้งหนึ่ง เรื่องเล็กมาก… แต่แพรวไม่ได้นอนทั้งคืน"
    - "เวลาไลฟ์ไม่มีคนดู แพรวพูดกับกล้องเหมือนพูดกับแม่ ช่วงนั้นแพรวไม่ตัดออกเลย"
    - "แพรวเคยสอบเข้าเป็นนักร้องประกวดงานวัด ได้ที่สอง ที่หนึ่งคือหมาของตาเผือกที่หอนตามเพลง"
    - "ทุกปีวันที่ 16 พ่อแอบซื้อหวยเลขวันเกิดแม่ ไม่เคยถูก แต่พ่อไม่เคยหยุดซื้อ"
  flirt:
    - "{player} รู้ไหมคะ ไลฟ์ที่มีคนถือผ้าข้างๆ แพรวยอดดีที่สุด… แพรวว่าไม่ใช่เพราะผ้าหรอก"
    - "ไปนั่งริมคลองกันไหมคะ ที่นั่นไม่มีใครไหว้แพรว มีแต่เรากับยุง"
    - "แพรวไม่ใช่คนเขินง่ายนะ แต่ถ้า {player} มองแบบนี้นานกว่านี้แพรวจะปิดกล้องแล้วนะคะ"
    - "ถ้าพ่อถามว่าคบใครอยู่ แพรวจะบอกว่าคนที่กล้าเถียงแพรว พ่อคงเดาได้ทันที"
romance_stages:
  friend:
    - "เป็นเพื่อนกันแล้วนะคะ ตั้งแต่นี้ไม่ต้องเรียกแพรวว่า 'คุณแพรว' อีก"
    - "เพื่อนคนแรกที่ไม่เคยขอให้แพรวฝากเรื่องกับพ่อ แพรวจดไว้แล้ว"
    - "มาช่วยแพ็กของได้ทุกเมื่อนะ ค่าแรงเป็นข้าวผัดกับการนินทาพ่อแพรว"
  dating:
    - "พ่อถามว่าเราคบกันจริงไหม แพรวตอบว่า 'ไปถามคนที่ทำนาเองสิคะ' พ่อเงียบไปสองวัน"
    - "แพรวโพสต์รูปเราคู่กันในเพจร้าน ลูกค้าถามว่าขายคู่กันไหม"
    - "เป็นแฟนกันแล้ว แพรวขอสิทธิ์พิเศษอย่างเดียว คือเรียกชื่อแพรวเวลาทะเลาะ ห้ามเรียกลูกกำนัน"
  engaged:
    - "พ่อบอกสินสอดไม่ต้องเยอะ แต่ขอแห่ขันหมากให้ยาวกว่างานผู้ใหญ่บ้าน แพรวขอโทษแทนพ่อล่วงหน้านะคะ"
    - "แพรวออกแบบการ์ดแต่งงานเองแล้ว สามสิบแบบ ช่วยเลือกหน่อย ทุกแบบสวยหมดนั่นแหละปัญหา"
    - "หมั้นกันแล้ว ทั้งตำบลเลิกเรียกแพรวว่าลูกกำนันแล้วค่ะ… เปลี่ยนเป็นเรียก 'คู่หมั้นของ {player}' แทน แพรวว่าฟังดีกว่าเยอะเลย"
  married:
    - "อรุณสวัสดิ์ค่ะ แพรวต้มข้าวต้มไว้ในหม้อ ไม่ไหม้นะ วันนี้สำเร็จ"
    - "เมื่อเช้าแพรวไลฟ์ขายผักจากแปลงเราไปแล้วสิบกำ ลูกค้าถามว่าคนปลูกโสดไหม แพรวตอบว่าไม่ค่ะ"
    - "พ่อโทรมาถามว่าวันนี้จะแวะไปกินข้าวที่บ้านไหม แพรวบอกว่าวันนี้บ้านเราก็มีกับข้าว"
    - "วันนี้อย่าเหนื่อยเกินนะคะ เย็นนี้แพรวอยากให้ช่วยถือไม้เซลฟี่ ไม่ใช่ถือจอบ"
  jealous:
    - "มีคนในกลุ่ม LINE แท็กแพรวในรูป {player} กับคนอื่น แพรวยิ้มให้ทั้งตำบลเห็นแล้วนะคะ ยิ้มที่เหนื่อยที่สุดในชีวิต"
    - "แพรวเคยถูกคบเพราะชื่อพ่อ ไม่คิดว่าครั้งนี้จะถูกคบแค่ครึ่งใจย่ะ"
gifts:
  love: ["ผ้าซิ่นตีนจก", "ดอกกุหลาบมอญ", "มะม่วงกวนทำเอง", "ข้าวหลาม"]
  like: ["น้ำเก๊กฮวย", "หมูปิ้ง", "ดอกมะลิ", "ข้าวกล้องหอมมะลิ", "ขนมชั้น"]
  dislike: ["ทองคำเส้นใหญ่", "กระเช้าผลไม้", "พระเครื่องวัดเจริญทรัพย์"]
  hate: ["ซองเงิน", "เหล้าขาว"]
choices:
  - id: praew_c1
    min_heart: 0
    prompt: "สวัสดีค่ะ {player} มาหาพ่อแพรวใช่ไหมคะ จะให้แพรวช่วยฝากเรื่องอะไรหรือเปล่า"
    options:
      - text: "เปล่า มาคุยกับแพรวนี่แหละ"
        heart: 2
        reply: "จริงเหรอคะ… โอเค แพรวไม่ชินกับคำตอบนี้ ขอเวลาปรับตัวแป๊บ"
      - text: "ใช่ ฝากเรื่องขอรถน้ำหน่อย"
        heart: -1
        reply: "ได้ค่ะ แพรวจดไว้ให้แล้ว ต่อคิวที่สี่สิบเจ็ดนะคะ"
      - text: "แค่เดินผ่านมา ร้านขายอะไรบ้าง"
        heart: 1
        reply: "ลูกค้าตัวจริงมาแล้ว! มาเลยค่ะ ข้าวกล้องลดราคาให้คนแรกของวัน"
  - id: praew_c2
    min_heart: 3
    prompt: "แพรวตั้งราคาผ้าของยายจันทร์ไว้ผืนละสามพัน ชาวบ้านบอกแพงเกิน แพรวทำถูกไหมคะ"
    options:
      - text: "ถูกแล้ว ฝีมือยายคุ้มกว่านั้นอีก"
        heart: 2
        reply: "ใช่ไหมล่ะ! สามเดือนต่อผืน ถ้าคิดค่าแรงจริงต้องหมื่น"
      - text: "ลดหน่อยเถอะ คนในตำบลจะได้ซื้อไหว"
        heart: 0
        reply: "แพรวว่าจะทำผืนเล็กราคาถูกแยกไว้ขายคนในตำบลแทน ขอบคุณที่บอกนะคะ"
      - text: "ขายแพงแบบนี้ได้กำไรเยอะสิ"
        heart: -2
        reply: "แพรวไม่ได้กำไรสักบาทค่ะ เงินเข้ายายทั้งหมด อย่าคิดแบบที่คนอื่นคิดกับพ่อแพรวสิ"
  - id: praew_c3
    min_heart: 5
    prompt: "แพรวเจอเอกสารบริษัทคุณธนาบนโต๊ะพ่อ… ถ้าเป็น {player} จะเปิดอ่านไหม"
    options:
      - text: "อ่าน ความจริงสำคัญกว่าความสบายใจ"
        heart: 1
        reply: "แพรวรู้ว่าต้องอ่าน แค่อยากให้มีคนพูดออกมาก่อน"
      - text: "คุยกับพ่อตรงๆ ก่อนดีกว่า"
        heart: 2
        reply: "นั่นยากที่สุด… แต่ใช่ แพรวควรเป็นลูกที่ถาม ไม่ใช่ลูกที่แอบดู"
      - text: "อย่ายุ่งเลย เรื่องผู้ใหญ่"
        heart: -1
        reply: "แพรวอายุยี่สิบเจ็ดแล้วนะคะ แพรวก็เป็นผู้ใหญ่"
  - id: praew_c4
    min_heart: 7
    prompt: "ถ้าวันหนึ่งพ่อแพรวโดนข่าว แล้วทุกคนเลิกคุยกับแพรว {player} จะยังอยู่ไหม"
    options:
      - text: "อยู่ ฉันคบแพรว ไม่ได้คบพ่อแพรว"
        heart: 2
        reply: "ประโยคนี้แพรวจะจำไปจนแก่เลยค่ะ"
      - text: "ขึ้นอยู่กับว่าพ่อทำอะไร"
        heart: 0
        reply: "ตรงดีค่ะ… แพรวก็ถามตัวเองแบบนี้เหมือนกัน"
      - text: "อย่าคิดมากเลย ไม่มีอะไรหรอก"
        heart: -1
        reply: "ทุกคนก็พูดแบบนี้ค่ะ แล้วก็ไม่มีใครอยู่ตอนมันมีอะไร"
banter:
  - with: prasert
    lines:
      - ["prasert", "แพรว ลูกไปไลฟ์ในทุ่งอีกแล้วเหรอ แดดเผาหน้าดำหมด"]
      - ["praew", "พ่อคะ หนูยี่สิบเจ็ดแล้ว หน้าดำก็หน้าหนูเองค่ะ"]
      - ["prasert", "พ่อแค่ห่วง เดี๋ยวคนเขาว่าลูกกำนันตากแดดเหมือนชาวนา"]
      - ["praew", "ชาวนาเลี้ยงทั้งตำบลนะคะพ่อ รวมถึงพ่อด้วย"]
  - with: prasert
    lines:
      - ["praew", "พ่อคะ คุณธนามาบ้านเราทำไมเมื่อคืน"]
      - ["prasert", "มาคุยเรื่องพัฒนาตำบล ลูกไม่ต้องห่วง"]
      - ["praew", "พัฒนาตำบลทำไมต้องคุยกันสี่ทุ่มคะ ผีออกตั้งแต่สามทุ่ม"]
      - ["prasert", "…ไปนอนได้แล้วแพรว"]
  - with: nok
    lines:
      - ["nok", "ยัยแพรวขี้มูก! ไม่เจอตั้งสามเดือน ยังไลฟ์ขายผ้าอยู่อีกเหรอแก"]
      - ["praew", "นก! แกกลับมาก็ดีเลย ช่วยเป็นนางแบบให้หน่อย ค่าตัวเป็นส้มตำ"]
      - ["nok", "ส้มตำปูปลาร้าสองจาน ไม่งั้นไม่ยิ้ม"]
  - with: may
    lines:
      - ["may", "คุณแพรวคะ ขอถามสั้นๆ เรื่องร้านค้าออนไลน์… กับที่ดินแปลงที่พ่อเพิ่งโอน"]
      - ["praew", "ถามสั้นจริงค่ะ แต่คำถามที่สองยาวกว่าคำถามแรกนะคะ"]
      - ["may", "นักข่าวเขาเรียกว่าคำถามต่อเนื่องค่ะ"]
      - ["praew", "ลูกกำนันเขาเรียกว่าไม่ตอบค่ะ"]
  - with: chan
    lines:
      - ["chan", "หนูแพรว ผ้าผืนที่แล้วขายได้จริงเหรอสามพัน ยายไม่เชื่อ"]
      - ["praew", "จริงค่ะยาย ลูกค้าที่เชียงใหม่สั่งอีกสองผืนแล้ว"]
      - ["chan", "ตายแล้ว ยายต้องทอจนถึงสงกรานต์ปีหน้า"]
