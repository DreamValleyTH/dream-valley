id: porn
name: "ป้าพร"
role: "ภรรยาลุงสมหมาย ช่างเย็บผ้าประจำหมู่ 4 คนคุมเงินของบ้าน"
voice: "พูดตรง ประชดเก่ง ลงท้าย นะ จ้ะ ย่ะ เรียกสามีว่า ตาแก่ ทุกเรื่องคำนวณเป็นเงินค่าหวยที่เสียไปได้ แต่ใจอ่อนกับเด็กและคนลำบาก"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "เช้าจ้ะหลาน ป้าตื่นมาเย็บผ้าตั้งแต่ตีห้า ตาแก่ตื่นมาจดเลข เราสองคนขยันคนละแบบ"
    - "ไปตลาดนัดเหรอ ฝากซื้อด้ายสีขาวหลอดหนึ่ง แล้วถ้าเห็นตาแก่ยืนหน้าแผงเจ๊หงษ์ ลากกลับมาด้วย"
    - "อรุณสวัสดิ์หลาน หอกระจายข่าวเพิ่งประกาศเรื่องฉีดวัคซีนหมา ตาแก่ฟังเป็นเลขอีกแล้ว"
  greet_noon:
    - "เที่ยงแล้ว กินข้าวยังหลาน ป้ามีแกงส้มเหลืออยู่ ตาแก่ไม่กลับมากิน ไปนั่งนับจิ้งจกอยู่ที่ไหนไม่รู้"
    - "ร้อนนะ ป้าเย็บผ้าใต้ถุนบ้าน ลมดี จักรไม่ร้อน คนก็ไม่ร้อน"
    - "แวะมาพักก่อนหลาน มีน้ำตะไคร้เย็นๆ ป้าต้มให้ตาแก่ แต่แกไม่กิน ไปกินเครื่องดื่มชูกำลังแทน"
  greet_evening:
    - "เย็นแล้วจ้ะ ป้ารอฟังหอกระจายข่าวห้าโมง ไม่ได้ฟังเลขนะ ฟังเรื่องค่าน้ำ"
    - "กลับบ้านกินข้าวด้วยนะหลาน ป้าเห็นหลานผอมลงทุกวัน"
    - "ตะวันตกแล้ว ตาแก่ยังไม่กลับ ถ้าเจอบอกด้วยว่าข้าวเย็นแล้ว ใจป้าก็เย็นแล้ว"
  greet_night:
    - "ดึกแล้วหลาน กลับบ้านเถอะ ใกล้สามทุ่มแล้ว ป้าล็อกประตูแล้วนะ"
    - "หมาหอนแล้ว ตาแก่ป้ากำลังนับว่ามันหอนกี่ที หลานรีบกลับไป อย่าไปนับกับแก"
    - "ไม่ทันกลับบ้านก็ไปร้าน 24 ชม. นะ อย่าไปนอนกลางทุ่ง ค่า รพ.สต. แพงกว่าหวยตาแก่อีก"
  weather_rain:
    - "ฝนตกแล้วผ้าที่ตากไว้เปียกหมด ป้าต้องซักใหม่ ตาแก่บอกว่าฝนตกเป็นลางดีของเลขเจ็ด"
    - "ฝนแบบนี้ป้านั่งเย็บผ้าได้ทั้งวัน ไม่มีใครมาทักหวยใส่หูป้า"
    - "ฝนตกหลานอย่าเดินตากนะ เป็นไข้หวัดแล้วต้องไป รพ.สต. เสียเวลาทำนา"
  weather_hot:
    - "ร้อนจนผ้าที่ตากแห้งในชั่วโมงเดียว ดีอย่างเดียวของหน้าร้อน"
    - "ร้อนแบบนี้ใส่เสื้อแขนยาวผ้าฝ้ายทำนานะหลาน ป้าเย็บให้ได้ ตัวละสองร้อย คนสนิทลดห้าสิบ"
    - "ร้อนขนาดนี้ตาแก่ยังออกไปนั่งรอเลขใต้ต้นมะขาม ป้าไม่เข้าใจจริงๆ"
  weather_storm:
    - "พายุเข้า! ช่วยป้ายกจักรเข้าข้างในหน่อยหลาน จักรเปียกแล้วสนิมขึ้น"
    - "ลมแรงหลังคาจะปลิว ตาแก่ไปคลุมรถเกี่ยวก่อนคลุมเมีย ป้าจำไว้นะ"
    - "อย่าออกไปไหนนะหลาน พายุแบบนี้ต้นไม้ล้มทับคนมาแล้วทุกปี"
  weather_pm25:
    - "ฝุ่นเยอะ ป้าเย็บหน้ากากผ้าไว้หลายอัน เอาไปใส่สักอันนะหลาน ฟรี"
    - "ฝุ่นลงผ้าขาวที่ตากไว้เป็นสีเทาหมด ใครเผาไร่เผาป่าป้าอยากไปเย็บปากเขา"
    - "อากาศแย่แบบนี้อย่าทำงานกลางแจ้งนานนะหลาน ไอแล้วไปหาหมอแอน"
  season_rainy:
    - "หน้าฝนตาแก่ซ่อมรถเกี่ยวทั้งวัน ป้าได้ใช้เงินกับค่าอะไหล่แทนค่าหวย ป้าว่าดีขึ้นนิดหนึ่ง"
    - "เข้าพรรษาแล้ว ป้าตั้งใจว่าจะชวนตาแก่ถือศีลเลิกหวยสามเดือน ปีที่แล้วแกถือได้สามวัน"
    - "หน้าฝนคนสั่งตัดผ้าถุงเยอะ ป้ารับงานไม่ทัน หลานอยากได้สักผืนไหม"
  season_cool:
    - "หน้าหนาวหน้าเกี่ยว ตาแก่ได้เงินค่ารถเกี่ยวทีละเยอะ ป้าต้องยึดไว้ก่อนเลขออกวันที่หนึ่ง"
    - "หนาวแล้วป้าเย็บผ้าห่มขาย ผ้าห่มลายดอกพิกุล ผืนละสามร้อย หลานเอาไหม"
    - "ช่วงลอยกระทงป้าตัดชุดไทยให้สาวๆ ประกวดนางนพมาศ นิ้วป้าโดนเข็มทิ่มทุกปี"
  season_dry:
    - "หน้าแล้งงานน้อย ตาแก่ว่าง ว่างแล้วก็ศึกษาสถิติหวย ป้าหางานให้ทำทุกวันเลย"
    - "สงกรานต์ลูกชายป้ากลับจากระยอง ป้าจะเย็บเสื้อลายดอกให้ใหม่ ใส่สาดน้ำ"
    - "แล้งแบบนี้น้ำบาดาลบ้านป้าเหลือน้อย ซักผ้าวันเว้นวันแล้วหลาน"
  heart_low:
    - "หลานบ้านไหนนะ อ๋อ ลูกบ้านที่ย้ายไป ป้าเคยตัดชุดนักเรียนให้แม่หลานตอนเด็กนะ"
    - "จะสั่งตัดผ้าหรือจ้างรถเกี่ยวจ้ะ ถ้าจ้างรถเกี่ยว จ่ายเงินกับป้านะ อย่าจ่ายตาแก่"
    - "ป้ายุ่งจ้ะหลาน มีชุดต้องส่งพรุ่งนี้สามตัว ไว้คุยกันนะ"
  heart_mid:
    - "หลานมาพอดี ช่วยป้าร้อยด้ายเข้าเข็มหน่อย ตาป้าไม่ค่อยดีแล้ว"
    - "ป้าเห็นเสื้อหลานขาดตรงศอก ถอดมา เดี๋ยวป้าปะให้ ไม่คิดเงิน"
    - "หลานเป็นเด็กดีนะ ไม่ซื้อหวยใช่ไหม ซื้อก็ไม่ต้องบอกป้า ป้าไม่อยากเสียใจสองคน"
  heart_high:
    - "รู้ไหมหลาน ที่ป้าบ่นตาแก่ทุกวัน เพราะป้ากลัวแกจะหมดตัวตอนแก่ ไม่ใช่เพราะป้าไม่รัก"
    - "จักรเย็บผ้าตัวนี้เป็นของแม่ป้า ป้าเย็บชุดแต่งงานตัวเองด้วยจักรนี้ ถ้าวันไหนป้าไม่ไหว ป้าจะยกให้หลาน"
    - "ป้ามีกระปุกออมสินลับ เก็บเงินที่ตาแก่ไม่รู้ ไว้ส่งหลานสาวเรียนพยาบาล อย่าบอกแกนะ"
  topic_news:
    - "ข่าวใหญ่ ตาแก่บ้านป้าซื้อหวยไปห้าใบ ไม่ถูกสักใบ เป็นข่าวทุกงวดเลยหลาน"
    - "ได้ยินจากแต๋วว่าเสี่ยเฮงจะขึ้นดอกเบี้ยค่าปุ๋ยเชื่อ ใครเชื่อปุ๋ยไว้ระวังนะ"
    - "สหกรณ์ของกล้าเปิดรับสมาชิกเพิ่ม ป้าว่าจะสมัคร เอาเงินออมไปฝาก ปลอดภัยกว่าใต้ที่นอน"
  topic_advice:
    - "เสื้อผ้าทำนาให้ใช้ผ้าฝ้ายแขนยาวนะหลาน กันแดดกันยา ทำงานได้นานขึ้นไม่เป็นลมแดด"
    - "เก็บเงินให้แบ่งเป็นสามกระปุก ค่ากิน ค่าลงทุน ค่าฉุกเฉิน ห้ามมีกระปุกค่าหวย"
    - "หลานอยากรู้ว่าหวยคุ้มไหม ตาแก่ป้าซื้อมาสามสิบปี เสียไปเจ็ดหมื่น ถูกคืนมาสี่พัน หลานคิดเอง"
  topic_smalltalk:
    - "หลานชอบลายผ้าแบบไหน ป้าชอบลายดอกพิกุล ตาแก่ชอบลายที่มีตัวเลข"
    - "ป้าเคยประกวดเย็บผ้าที่งานกาชาดอำเภอ ได้ที่สอง ที่หนึ่งเป็นร้านจากในเมืองที่ใช้จักรไฟฟ้า"
    - "ตอนสาวๆ ป้าเป็นนางรำงานวัด ตาแก่เป็นนักร้อง ป้าน่าจะเลือกมือกลองนะ มือกลองไม่ซื้อหวย"
  topic_about_self:
    - "ป้าเย็บผ้ามาตั้งแต่สิบห้า เย็บชุดนักเรียนให้เด็กในหมู่บ้านมาสามรุ่นแล้ว"
    - "ป้าแต่งกับตาแก่ตอนยี่สิบ สินสอดเป็นควายหนึ่งตัว ตอนนี้ควายตัวนั้นมีหลานแล้ว ตาแก่ยังซื้อหวย"
    - "ป้าเป็นคนคุมเงินบ้าน ตาแก่หาเงินเก่ง แต่ใช้เงินเก่งกว่า"
  topic_about_others:
    - "แต๋วร้านชำน่ะเพื่อนป้า ข่าวเรื่องตาแก่ซื้อหวยกี่ใบ ป้ารู้จากแต๋วก่อนรู้จากตาแก่อีก"
    - "ทองใบทำส้มตำให้ป้ากินทุกครั้งที่ป้าโกรธตาแก่ เดือนหนึ่งกินไปยี่สิบครก"
    - "เจ๊หงษ์ขายของดี แต่ป้าไม่ชอบที่เจ๊ขายเลขให้ตาแก่ ป้าเคยไปยืนกอดอกหน้าแผงเจ๊ทั้งเช้า"
  gossip_theft:
    - "ได้ข่าวว่าหลานหยิบของคนอื่น ป้าไม่อยากเชื่อ ถ้าจริงคืนไปเถอะ ป้าจะช่วยพูดให้"
    - "ป้าเย็บผ้าทั้งชีวิตไม่เคยเอาด้ายใครสักเส้น หลานอย่าทำให้ป้าผิดหวังนะ"
  gossip_cheating:
    - "แหม คบซ้อนเหรอหลาน ป้าว่าไม่ดีนะ ใจคนไม่ใช่เสื้อ ใส่หลายตัวพร้อมกันไม่ได้"
    - "ป้าได้ยินจากแต๋วแล้ว คนที่โดนหลอกมาร้องไห้หน้าร้านชำ ป้าเห็นแล้วสงสาร"
  gossip_unpaid_bill:
    - "ค้างค่าไฟเหรอหลาน ป้าเข้าใจ บ้านป้าก็เคยโดนตัดไฟเพราะตาแก่เอาเงินค่าไฟไปซื้อเลข"
    - "ช็อตก็บอกป้า ป้ามีงานเย็บผ้าให้ช่วยติดกระดุม ได้ค่าแรงนิดหน่อย ดีกว่าค้าง"
  gossip_small_envelope:
    - "ใส่ซองน้อยไม่เป็นไรหลาน แต่บ้านป้าจดซองทุกงาน งานหน้าใส่เพิ่มหน่อยนะ"
    - "แต๋วบอกว่าหลานใส่ซองยี่สิบ ป้าบอกแต๋วว่าเด็กมันเพิ่งเริ่มทำนา แต่แต๋วจดไว้แล้ว"
  gossip_skip_longkhaek:
    - "หลานไม่ไปช่วยลงแขกคืนเหรอ คนเขามาช่วยหลานทั้งวันนะ ป้ายังเย็บหมวกให้คนที่มาช่วยหลานเลย"
    - "เดี๋ยวนี้ใครก็จ้างรถเกี่ยว ป้าเข้าใจ แต่ถ้ามีคนมาช่วยแล้ว ไปช่วยคืนเถอะหลาน"
  player_fainted:
    - "เมื่อคืนผีจับเหรอหลาน! แต๋วเล่าให้ป้าฟังตั้งแต่หกโมงเช้า ป้านึกว่าตาแก่ไปนอนกลางทุ่งอีกแล้ว"
    - "ค่าที่ รพ.สต. เสียไปเท่าไร ป้ารู้ว่าเจ็บกระเป๋า กลับบ้านก่อนสามทุ่มนะ"
  player_new_vehicle:
    - "รถใหม่เหรอหลาน อย่าบอกทะเบียนตาแก่นะ แกจะเอาไปแทง"
    - "ป้าเย็บผ้าคลุมเบาะให้ได้นะ ลายดอกพิกุล กันแดดกันฝุ่น"
  player_lottery_win:
    - "ถูกหวยเหรอ แหม... ซื้อใบเดียวถูก ตาแก่ป้าซื้อสามสิบปีไม่ถูก ยินดีด้วยนะหลาน แต่อย่าซื้อต่อ"
    - "ได้เงินแล้วเก็บไว้นะหลาน ฝากสหกรณ์ไว้ อย่าเอาไปซื้อหวยเพิ่ม ถูกครั้งหนึ่งไม่ได้แปลว่าจะถูกอีก"
    - "อย่าบอกตาแก่ว่าหลานซื้อที่ไหน แกจะไปยืนรอแม่ค้าคนนั้นทั้งงวด"
  player_muddy:
    - "ตัวเลอะโคลนแบบนี้ อย่าเข้ามาใกล้จักรป้านะหลาน ไปล้างตุ่มหน้าบ้านก่อน"
    - "เสื้อเปื้อนโคลนต้องแช่น้ำก่อนซักนะ ไม่งั้นคราบไม่ออก ป้าสอนให้"
  player_rich:
    - "หลานรวยแล้ว ดีจ้ะ อย่าลืมแบ่งเก็บไว้ยามฉุกเฉิน รวยวันนี้ไม่ได้แปลว่ารวยตลอด"
    - "มีเงินแล้วสั่งตัดชุดดีๆ ไว้ใส่งานบุญสักชุด ป้าให้ส่วนลดคนรวยใจดี"
  player_in_debt:
    - "เป็นหนี้เหรอหลาน อย่าไปกู้นอกระบบนะ ไปคุยกับธนาคารเพื่อเกษตรกร หรือสหกรณ์ของกล้า"
    - "ป้าเคยเป็นหนี้ค่ารถเกี่ยวสิบปี ใช้ทีละนิดจนหมด หลานก็ทำได้"
  player_sick:
    - "ป่วยเหรอหลาน ป้าจะต้มข้าวต้มให้ ตาแก่จะเอาไปส่ง ถ้าแกไม่แวะร้านเจ๊หงษ์ก่อนนะ"
    - "หน้าซีดแบบนี้ไป รพ.สต. เถอะ บัตรทองใช้ได้ ไม่ต้องเสียเงิน"
  player_married:
    - "แต่งงานแล้ว! ป้าจะเย็บชุดแต่งงานให้ ผ้าไหมหรือผ้าฝ้ายบอกป้ามา"
    - "ยินดีด้วยจ้ะ แต่งแล้วคุยเรื่องเงินกันให้ชัดนะหลาน ป้าเรียนรู้มาสี่สิบปีแล้ว"
  event_disaster:
    - "น้ำท่วมแล้ว ป้าเย็บถุงผ้าใส่ของบริจาคอยู่ หลานมาช่วยไหม"
    - "ภัยมาที ป้าดีใจที่ตาแก่มีรถเกี่ยว ขนของช่วยคนได้ ครั้งเดียวที่ป้าภูมิใจในตาแก่เต็มร้อย"
  event_election:
    - "ช่วงเลือกตั้งตาแก่เอาเบอร์ผู้สมัครไปแทงหวย ป้าบอกว่าเลือกคนนะ ไม่ใช่เลือกเลข"
    - "ใครสัญญาว่าจะเอาน้ำเข้านา ป้าจะจดไว้ในสมุดซอง ถ้าไม่ทำตาม ป้าจะพิมพ์ทวงในกลุ่ม LINE หมู่บ้านทุกเช้า"
  event_company_water:
    - "บ่อบาดาลบ้านป้าแห้งตั้งแต่บริษัทมา ป้าซักผ้าได้วันเว้นวันแล้วนะหลาน"
