    prompt: "มีคนมาขอกู้กองทุนหมู่บ้านเกินวงเงิน เขาเดือดร้อนจริง หลานว่าผู้ใหญ่ควรทำยังไง"
    options:
      - text: "ทำตามระเบียบดีกว่า ไม่งั้นคนอื่นจะมาขอบ้าง"
        heart: 1
        reply: "นั่นแหละที่ผู้ใหญ่คิด แต่ใจมันไม่สบายเลย"
