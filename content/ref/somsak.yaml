choices:
  - id: somsak_c1
    min_heart: 0
    prompt: "หลานย้ายทะเบียนบ้านมาที่นี่หรือยัง ผู้ใหญ่ต้องลงบัญชีหมู่บ้าน"
    options:
      - text: "ย้ายมาแล้ว เมื่อวานนี้เอง"
        heart: 1
        reply: "ดีมาก! เป็นลูกบ้านผู้ใหญ่เต็มตัวแล้ว ผู้ใหญ่จดชื่อลงสมุดเลย"
      - text: "ช่วยพาไปทำหน่อยได้ไหม"
        heart: 2
        reply: "ได้เลย พรุ่งนี้ผู้ใหญ่ว่าง เอาสำเนาบัตรมาสามชุดนะ ย้ำอีกครั้งนะ สามชุด"
      - text: "ยังเลย มันจำเป็นด้วยเหรอ"
        heart: -1
        reply: "จำเป็นสิ ไม่ย้ายมา สิทธิ์ในตำบลก็ไม่ได้ โครงการ อบต. ก็สมัครไม่ได้ ย้ำอีกครั้งนะ ไม่ได้"
  - id: somsak_c2
    min_heart: 0
    prompt: "พรุ่งนี้หกโมงผู้ใหญ่จะขึ้นประกาศ อยากให้ประกาศเรื่องอะไรเพิ่มไหม"
    options:
      - text: "เตือนคนให้ไปเช่าเครื่องรางที่วัดก่อนค่ำ"
        heart: 1
        reply: "ดี! ผู้ใหญ่จะต่อท้ายพยากรณ์อากาศเลย"
      - text: "ขอเพลงลูกทุ่งเพราะๆ ก่อนประกาศหน่อย"
        heart: 1
        reply: "ได้ เปิดให้สองเพลงเลย ถ้าเทปไม่ค้างนะ"
      - text: "พูดสั้นๆ ได้ไหม ไม่ต้องย้ำ"
        heart: -1
        reply: "...ผู้ใหญ่จะพยายาม ย้ำอีกครั้งนะ จะพยายาม"
  - id: somsak_c3
    min_heart: 3
    prompt: "ประชุมหมู่บ้านรอบหน้า ผู้ใหญ่อยากให้หลานช่วยจดรายงานการประชุม ช่วยได้ไหม"
    options:
      - text: "ยินดีเลย"
        heart: 2
        reply: "ดีแท้ ลายมืออย่าหวัดนะ ผู้ใหญ่อ่านไม่ออก"
      - text: "จดในมือถือได้ไหม"
        heart: 1
        reply: "ได้ แต่พิมพ์ออกมาให้ผู้ใหญ่เซ็นด้วยนะ ระเบียบ"
      - text: "ไม่ว่างอะ"
        heart: -1
        reply: "อืม ไม่เป็นไร ผู้ใหญ่จดเองก็ได้ ช้าหน่อยแค่นั้น"
  - id: somsak_c4
