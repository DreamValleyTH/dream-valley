id: somsak
name: "ผู้ใหญ่สมศักดิ์"
role: "ผู้ใหญ่บ้าน อายุ 60 ใกล้เกษียณ คุมหอกระจายข่าว อนุมัติกองทุนหมู่บ้าน ยึดระเบียบเดิม"
voice: "แทนตัวเองว่าผู้ใหญ่ เรียกผู้เล่นว่าหลาน พูดช้าชัด ติดปาก ย้ำอีกครั้งนะ พูดเรื่องสำคัญซ้ำสองสามรอบ อ้างระเบียบ สำเนาบัตรสามชุด ลงท้าย นะ จ้ะ ใจดีแบบพ่อหลวงสมัยเก่า"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "อรุณสวัสดิ์ {player} หกโมงเช้าฟังหอกระจายข่าวหรือยัง ย้ำอีกครั้งนะ ฟังหรือยัง"
    - "เช้านี้ผู้ใหญ่เปิดเพลงก่อนประกาศสามเพลง เพลงที่สามไมค์หอน ไม่ใช่ผู้ใหญ่ร้องเพี้ยนนะ"
    - "ตื่นเช้าดีแล้ว คนตื่นเช้าได้ยินประกาศ คนตื่นสายได้ยินแต่ข่าวจากร้านป้าแต๋ว"
    - "กินข้าวเช้าหรือยังหลาน มื้อแรกต้องก่อนบ่ายสองนะ ย้ำอีกครั้งนะ ก่อนบ่ายสอง"
    - "ผู้ใหญ่จิบโอเลี้ยงหน้าร้านชำทุกเช้ามาสามสิบปี เก้าอี้พลาสติกตัวนี้มีรอยผู้ใหญ่ฝังอยู่"
  greet_noon:
    - "เที่ยงแล้ว ก๋วยเตี๋ยวพี่หน่อยก็ได้ ข้าวเวฟร้าน 24 ชม. ก็ได้ อย่าข้ามมื้อนะ"
    - "แดดเที่ยงอย่างนี้ ผู้ใหญ่ขอหลบใต้ศาลาประชาคมก่อน แบบฟอร์มยังกรอกไม่เสร็จเลย"
    - "{player} มาพอดี ช่วยผู้ใหญ่อ่านหนังสือราชการฉบับนี้หน่อย ตัวหนังสือเล็กกว่ามดอีก"
    - "บ่ายนี้มีคนมาขอรับรองสำเนาสามคน ผู้ใหญ่เซ็นจนปากกาหมึกหมดไปด้ามนึงแล้ว"
    - "เที่ยงๆ อย่าเอาข้าวเปลือกไปตากที่ลานวัดนะ ย้ำอีกครั้งนะ ลานวัดไม่ใช่ลานตาก"
  greet_evening:
    - "ห้าโมงเย็นฟังราคารับซื้อพรุ่งนี้หรือยัง ผู้ใหญ่อ่านเองกับปากเลยนะ"
    - "เย็นนี้ต้อนไก่เข้าเล้าด้วยนะ เมื่อวานไก่บ้านตาเผือกเดินไปถึงหน้า อบต."
    - "ตะวันจะตกแล้ว ทำงานให้เสร็จ กลับบ้านแต่หัวค่ำ ย้ำอีกครั้งนะ แต่หัวค่ำ"
    - "ผู้ใหญ่จะไปรดน้ำกะเพราในกระถางหลังบ้าน อีกไม่กี่เดือนจะมีเวลาให้มันทั้งวันแล้ว"
    - "ไปไหนมา {player} หน้าแดงเชียว ตากแดดทั้งวันเลยสิ เอาน้ำใบเตยไปสักแก้ว"
  greet_night:
    - "สองทุ่มกว่าแล้วนะ! ผีออกสามทุ่ม ย้ำอีกครั้งนะ สามทุ่มตรง ไม่ใช่สามทุ่มครึ่ง"
    - "ยังไม่กลับบ้านอีกเหรอ ถ้ากลับไม่ทันก็เข้าวัดหรือร้าน 24 ชม. ไว้ก่อน"
    - "หมาหอนแล้วนั่นไง ผู้ใหญ่ไม่ได้ขู่นะ ผู้ใหญ่แจ้งเพื่อทราบ"
    - "ไม่ได้เช่าผ้ายันต์มาเหรอ ผืนละเก้าสิบเก้า ถูกกว่าค่ารักษาที่ รพ.สต. นะหลาน"
    - "ดึกแล้ว ผู้ใหญ่จะปิดไฟหน้าบ้าน ...ไม่ปิดดีกว่า เปรตมันไม่ชอบแสงไฟ"
  weather_rain:
    - "ฝนตกแล้ว เก็บผ้าเก็บข้าวเปลือกเข้าใต้ถุนเร็ว ย้ำอีกครั้งนะ เข้าใต้ถุน"
    - "ฝนมาทีไร ถนนลูกรังหมู่สามเละเป็นโจ๊ก ผู้ใหญ่ทำหนังสือขอหินคลุกไปตั้งแต่ปีที่แล้ว"
    - "หลังคาศาลาประชาคมรั่วสามจุด ผู้ใหญ่เอากะละมังรองไว้แล้ว จุดที่สี่ยังหากะละมังไม่ได้"
    - "ฝนตกก็ดี นาได้น้ำ แต่เดินคันนาให้ดูงูด้วยนะ งูมันไม่ฟังหอกระจายข่าว"
  weather_hot:
    - "ร้อนอย่างนี้ใส่งอบ เอาผ้าขาวม้าชุบน้ำพันคอไว้ อย่าให้ต้องหามไปหาหมอแอน"
    - "แดดเปรี้ยงจนเชือกเสาธงหน้า อบต. ร้อนจับไม่ได้ แต่ธงยังต้องขึ้นนะ ระเบียบ"
    - "ร้อนจนพัดลมบ้านผู้ใหญ่พ่นลมอุ่นออกมาแล้ว ไปยืนตากแอร์ร้าน 24 ชม. ดีกว่า"
    - "กินน้ำเยอะๆ ย้ำอีกครั้งนะ น้ำเปล่า ไม่ใช่น้ำชูกำลัง"
  weather_storm:
    - "พายุเข้าแล้ว! อยู่ในบ้าน อย่าออกไปเก็บมะม่วงหล่น ย้ำอีกครั้งนะ อย่าเก็บมะม่วง"
    - "ลมแรงขนาดนี้ หอกระจายข่าวเสียงขาดๆ หายๆ ผู้ใหญ่ประกาศไป ชาวบ้านได้ยินแต่ ซ่าาา"
    - "ต้นไม้ล้มขวางทางมาแจ้งผู้ใหญ่ ผู้ใหญ่แจ้ง อบต. อบต. แจ้ง... เอาเป็นว่าช่วยกันเลื่อยก่อน"
    - "ไฟดับทั้งหมู่ เทียนไขมีที่ร้านป้าแต๋ว ไฟฉายมีที่ร้าน 24 ชม. ราคาไม่เท่ากันนะ"
  weather_pm25:
    - "ฝุ่นขึ้นสีส้มแล้ว ใส่หน้ากากออกไปนา ผ้าขาวม้าปิดจมูกไม่พอนะหลาน"
    - "ผู้ใหญ่ประกาศห้ามเผาตอซังไปสามรอบ ควันยังมาเหมือนเดิม คงมีคนฟังไม่ถึงรอบที่สาม"
    - "ฟ้าขมุกขมัวอย่างนี้ไม่ใช่หมอกนะ หมอกมันไม่แสบตา"
    - "วันนี้ทำงานกลางแจ้งน้อยๆ ฝุ่นมันกินแรง ไปหาต้นไม้ฟอกอากาศมาวางในบ้านไว้"
  season_rainy:
    - "หน้าฝนแล้ว เตรียมหว่านเตรียมดำ ใครจะลงแขกมาลงชื่อกับผู้ใหญ่นะ"
    - "หน้าฝนนี้ทุกบ้านคว่ำกะลา ปิดฝาโอ่ง ยุงลายมันไม่รู้จักระเบียบ"
    - "เข้าพรรษาแล้ว ผู้ใหญ่ตั้งใจงดเหล้า ...ผู้ใหญ่เลิกมาสิบปีแล้ว แต่ตั้งใจซ้ำทุกปี"
    - "น้ำในคลองขึ้นแล้ว เด็กๆ อย่าไปเล่นน้ำที่ท่าน้ำวัดนะ ผีพรายมันชอบริมตลิ่ง"
  season_cool:
    - "หน้าหนาวแล้ว ข้าวเริ่มเหลือง เกี่ยวเสร็จแล้วอย่าเผาฟางนะ ให้ตาเผือกเอาไปเลี้ยงควาย"
    - "ผู้ใหญ่เอาเสื้อกันหนาวที่ได้จากงานกาชาดปี 2540 มาใส่ ยังดีอยู่เลย กระดุมหายเม็ดเดียว"
    - "หน้าหนาวงานเยอะ ลอยกระทง งานวัด กำฟ้า ผู้ใหญ่ต้องเขียนหนังสือขออนุญาตทุกงาน"
    - "เช้าๆ หมอกลงหนา ขี่มอเตอร์ไซค์เปิดไฟด้วยนะ ย้ำอีกครั้งนะ เปิดไฟ"
  season_dry:
    - "หน้าแล้งแล้ว ประปาหมู่บ้านไหลเป็นเส้นด้าย รองน้ำใส่โอ่งไว้ก่อนเลย"
    - "หน้าแล้งใครปลูกพืชใช้น้ำน้อยได้ก็ปลูก ถั่วเขียว ข้าวโพด ดีกว่าดื้อทำนาปรัง"
    - "เดือนเมษาฯ ผู้ใหญ่เปิดแต่เพลงคิดถึงบ้าน ให้ลูกหลานที่อยู่กรุงเทพฯ ได้ยิน ...ถึงเสียงจะไปไม่ถึงก็เถอะ"
    - "หน้าแล้งไฟลามง่าย ใครเผาหญ้าต้องเฝ้าจนดับ ย้ำอีกครั้งนะ จนดับสนิท"
  heart_low:
    - "อ้อ หลานบ้านที่กลับมาจากกรุงเทพฯ ใช่ไหม ย้ายทะเบียนบ้านมาหรือยังล่ะ"
    - "มีธุระอะไรกับผู้ใหญ่ ถ้าจะขอรับรองเอกสาร เอาสำเนาบัตรมาสามชุดนะ"
    - "ผู้ใหญ่ยังไม่ค่อยคุ้นหน้า มาประชุมหมู่บ้านบ้างนะ วันที่หนึ่งของเดือน ที่ศาลาประชาคม"
    - "อืม ดี ดี ทำตัวดีๆ ล่ะ หมู่บ้านนี้ใครทำอะไรรู้กันหมด"
  heart_mid:
    - "{player} มาพอดี ผู้ใหญ่มีน้ำกระเจี๊ยบแช่เย็น กินสักแก้วไหม"
    - "หลานนี่ใช้ได้ มาประชุมไม่เคยขาด ผู้ใหญ่จดชื่อไว้ในสมุดแล้ว สมุดเล่มนี้นะ"
    - "ผู้ใหญ่ว่าหลานเหมาะทำงานส่วนรวมนะ พูดจาดี ไม่ค่อยเถียง ...ไม่ค่อยนะ"
    - "บ้านหลานน่ะ สมัยพ่อหลานยังหนุ่ม เคยมาช่วยผู้ใหญ่ทาสีศาลาประชาคมด้วย"
  heart_high:
    - "ผู้ใหญ่จะเกษียณแล้ว บางทีก็กลัว ตื่นมาไม่มีใครมาขอให้เซ็นอะไร แล้วจะทำอะไรล่ะทีนี้"
    - "รู้ไหม ผู้ใหญ่ย้ำทุกเรื่องเพราะตอนหนุ่มประกาศครั้งเดียวว่าน้ำจะมา แล้วมีบ้านนึงไม่ได้ยิน"
    - "ผู้ใหญ่เก็บสมุดประชุมไว้ทุกเล่มตั้งแต่ปี 2530 เกษียณแล้วฝากหลานดูแลได้ไหม"
    - "เมียผู้ใหญ่เสียไปห้าปีแล้ว เขาเป็นคนบอกให้ผู้ใหญ่พูดช้าๆ ซ้ำๆ ชาวบ้านจะได้เข้าใจ"
    - "ถ้าวันไหนผู้ใหญ่เล่าเรื่องเดิมสามรอบ หลานไม่ต้องบอกนะ ...หรือบอกก็ได้ ผู้ใหญ่จะได้รู้ตัว"
  topic_news:
    - "อบต. แจกพันธุ์ปลา มาก่อนได้ก่อน ต้องใช้สำเนาบัตรสามชุด รับรองทุกแผ่น"
    - "ประชุมหมู่บ้านวันที่หนึ่งนะ วาระคือเรื่องถังขยะ วาระเดิมจากเดือนที่แล้วยังไม่จบ"
    - "ราคาข้าวเปลือกที่ลานเสี่ยเฮงลงอีกแล้ว ไปเทียบกับสหกรณ์ของกล้าก่อนขายนะ"
    - "กองทุนหมู่บ้านเปิดให้กู้รอบใหม่ ดอกต่ำ ต้องมีคนค้ำสองคน และต้องผ่านผู้ใหญ่"
    - "มีคนแจ้งวัวหายหนึ่งตัว สีน้ำตาล หน้าขาว ชื่อเจ้าโชค ใครเห็นบอกผู้ใหญ่นะ"
  topic_advice:
    - "จะขายของให้ขายง่าย มาจ้างประกาศหอกระจายข่าว สามเปอร์เซ็นต์ รุ่งขึ้นคนมาถามซื้อถึงฟาร์ม"
    - "ของหายมาแจ้งผู้ใหญ่ ประกาศของหายฟรี ชาวบ้านช่วยตาม เร็วกว่าไปโรงพักอีก"
    - "เงินสดอย่าพกเยอะ เอาไปฝากธนาคารเพื่อเกษตรกร ผีจับทีนึงเงินหายได้นะ"
    - "จะกู้กองทุนหมู่บ้าน มาประชุมให้สม่ำเสมอก่อน ผู้ใหญ่เห็นหน้าบ่อยก็อนุมัติง่าย"
    - "ฟังพยากรณ์ตอนหกโมงเช้า แม่นราวแปดในสิบ ดีกว่ามองฟ้าเดาเอง แล้วมันจดลงปฏิทินให้ด้วย"
    - "อยากให้คนรักก็ไปลงแขกช่วยเขา แล้วเขาจะมาช่วยคืน ระเบียบเก่าแต่ใช้ได้ทุกปี"
  topic_smalltalk:
    - "หลานชอบเพลงลูกทุ่งเพลงไหน ผู้ใหญ่จะเปิดก่อนประกาศพรุ่งนี้ให้"
    - "สมัยก่อนหอกระจายข่าวคือกรวยสังกะสี ผู้ใหญ่ตะโกนจนเสียงแหบไปสามวัน"
    - "ผู้ใหญ่รีดชุดกากีเองทุกเช้าวันจันทร์ จีบกางเกงคมจนหั่นมะนาวได้"
    - "ผู้ใหญ่หัดส่งสติกเกอร์ในกลุ่ม LINE ส่งสวัสดีวันจันทร์ไปตอนวันพุธ คนในกลุ่มขำกันใหญ่"
    - "รู้ไหม ไก่ตัวใหม่ของกำนันชื่อเหมือนผู้ใหญ่เลย ผู้ใหญ่ยังไม่ได้อนุญาตนะ"
  topic_about_self:
    - "ผู้ใหญ่เป็นผู้ใหญ่บ้านมายี่สิบสองปี อีกไม่นานก็ต้องลงจากตำแหน่งตามระเบียบ"
    - "ลูกสาวผู้ใหญ่เป็นพนักงานบัญชีอยู่นนทบุรี โทรมาทุกอาทิตย์ ถามว่ากินยาความดันหรือยัง"
    - "ผู้ใหญ่ชอบระเบียบ เพราะระเบียบไม่เลือกที่รักมักที่ชัง ...คนต่างหากที่เลือก"
    - "งานอดิเรกผู้ใหญ่คือปลูกโหระพากับกะเพรา ใบมันไม่เถียง รดน้ำก็โต"
    - "ผู้ใหญ่ไม่เคยไปทะเลเลย เกษียณแล้วจะนั่งรถลุงเชิดไปอำเภอ แล้วต่อรถไปดูสักครั้ง"
  topic_about_others:
    - "กำนันประเสริฐเป็นเพื่อนผู้ใหญ่ตั้งแต่บวชพร้อมกัน เขาพูดเร็ว ผู้ใหญ่พูดซ้ำ รวมกันก็พอดี"
    - "นายกฯ วิชัยบอกว่าเรื่องถนนหมู่สามรับทราบแล้ว ผู้ใหญ่ทำหนังสือไปสามฉบับ ก็รับทราบสามรอบ"
    - "หมอแอนเก่งนะ ข่าวปลอมในกลุ่ม LINE เขาแก้ทันทุกเรื่อง ผู้ใหญ่แค่กดไลก์ตาม"
    - "ดาบเสถียรเหรอ ...ดีกับทุกคน โดยเฉพาะกับเปลหลังโรงพัก"
    - "ป้าแต๋วรู้ข่าวก่อนผู้ใหญ่ทุกที บางทีผู้ใหญ่ก็ไปถามป้าแต๋วก่อนขึ้นประกาศ"
    - "ลุงเชิดขับรถเมล์ตรงเวลากว่านาฬิกา อบต. ผู้ใหญ่ตั้งนาฬิกาตามเสียงแตรเขาเลย"
  gossip_theft:
    - "ผู้ใหญ่ได้ยินเรื่องหลานกับของหาย ผู้ใหญ่ไม่ตัดสินนะ แต่ต้องคืนเจ้าของก่อน ย้ำอีกครั้งนะ คืนก่อน"
    - "หมู่บ้านเราไม่เคยต้องล็อกประตู อย่าให้ผู้ใหญ่ต้องประกาศให้ทุกบ้านไปซื้อกุญแจนะ"
    - "ถ้าเดือดร้อนเรื่องเงิน มาคุยเรื่องกองทุนหมู่บ้าน ดีกว่าไปหยิบของคนอื่น"
  gossip_cheating:
    - "ผู้ใหญ่ไม่ยุ่งเรื่องหัวใจใคร แต่ในกลุ่ม LINE เขาส่งกันว่อนเลยนะหลาน"
    - "เรื่องแบบนี้ระเบียบไม่ได้เขียนไว้ แต่ใจคนเขียนไว้ หลานคิดดูดีๆ"
    - "ผู้ใหญ่ไกล่เกลี่ยเรื่องผัวเมียมาเยอะ ที่จบดีมีแต่คนที่พูดความจริงก่อน"
  gossip_unpaid_bill:
    - "ค่าไฟค้างต้องจ่ายก่อนวันที่สิบห้านะ ย้ำอีกครั้งนะ สิบห้า ไม่งั้นการไฟฟ้ามาตัด"
    - "ค้างค่าไฟไม่ใช่เรื่องน่าอาย แต่ปล่อยให้โดนตัด เพื่อนบ้านเห็นช่างปีนเสานะหลาน"
    - "จ่ายได้ที่ร้าน 24 ชม. หรือธนาคาร ผู้ใหญ่พาไปก็ได้ ผู้ใหญ่ก็ต้องไปจ่ายเหมือนกัน"
  gossip_small_envelope:
    - "เรื่องซอง ผู้ใหญ่ว่าไปงานด้วยใจก็พอ ...แต่ป้าทองใบเขานับนะ"
    - "ใส่ซองน้อยไม่ผิดระเบียบ ระเบียบไม่ได้กำหนดขั้นต่ำ แต่เจ้าภาพเขากำหนดไว้ในใจ"
    - "ครั้งหน้าถ้าไม่มีจริงๆ ไปช่วยล้างจานในงาน เจ้าภาพจำได้นานกว่าแบงก์ร้อยนะ"
  gossip_skip_longkhaek:
    - "เขามาช่วยนาหลาน หลานไม่ไปช่วยคืน ลงแขกนี่ไม่มีใบเสร็จ แต่ทุกคนจำได้"
    - "ลงแขกครั้งหน้าผู้ใหญ่จะเขียนชื่อหลานไว้บนสุดเลยนะ ย้ำอีกครั้งนะ บนสุด"
    - "ผู้ใหญ่อายุหกสิบยังไปดำนาให้บ้านตาเผือกเลย หลานยังมีแรงกว่าผู้ใหญ่ตั้งเยอะ"
  player_fainted:
    - "ได้ยินว่าเมื่อคืนไปตื่นที่ รพ.สต. ผู้ใหญ่ประกาศแล้วนะว่าผีออกสามทุ่ม ประกาศทุกวันด้วย"
    - "ผีจับแล้วเงินในกระเป๋าหายด้วยไหม คราวหน้าฝากธนาคารไว้ก่อนนะ"
    - "ไม่เป็นอะไรมากใช่ไหม ผู้ใหญ่จะเพิ่มประกาศเตือนผีเป็นรอบที่สี่ให้เลย"
  player_new_vehicle:
    - "รถใหม่เหรอ ต่อภาษี ต่อ พ.ร.บ. ให้เรียบร้อยนะ ระเบียบมาก่อนความเท่"
    - "ขับรถเข้าหมู่บ้านช้าๆ ไก่บ้านตาเผือกมันไม่รู้กฎจราจร"
    - "ไฟหน้ารถไล่ผีได้นะ ...ยกเว้นผีโพง มันเรืองแสงเองอยู่แล้ว"
  player_lottery_win:
    - "ถูกหวยเหรอ ยินดีด้วย แต่อย่าให้ผู้ใหญ่ประกาศทางหอกระจายข่าวนะ ญาติจะมาจากสามจังหวัด"
    - "เอาเงินไปฝากธนาคารก่อนแล้วค่อยคิด ผู้ใหญ่เคยเห็นคนถูกรางวัลที่สองแล้วหมดภายในงานบวชงานเดียว"
    - "แบ่งไปทำบุญที่วัดดงเย็นบ้างนะ ไม่ต้องเยอะ เอาใจล้วนๆ"
  player_muddy:
    - "ตัวเลอะโคลนขนาดนี้ ไปดำนามาเหรอ ดี คนทำนาต้องเลอะ"
    - "อย่าเพิ่งเข้าศาลาประชาคมนะหลาน ผู้ใหญ่เพิ่งถูพื้นเสร็จ"
    - "ล้างโคลนที่ตุ่มหน้าบ้านก่อนค่อยขึ้นเรือน ไม่งั้นพื้นไม้จะด่าง"
  player_rich:
    - "ทำมาหากินดีขึ้นนะช่วงนี้ อย่าลืมเสียภาษีที่ดินให้ อบต. ด้วย"
    - "มีเงินแล้วช่วยหมู่บ้านบ้าง โครงการชุมชนยังขาดของอยู่หลายรายการ"
    - "รวยแล้วอย่าเอาบัตรสวัสดิการไปให้คนอื่นถือแทนนะ ผู้ใหญ่ได้ยินมาว่ามีคนทำ"
  player_in_debt:
    - "หนี้เยอะเหรอ มาคุยกับผู้ใหญ่ กองทุนหมู่บ้านดอกต่ำกว่าที่อื่นแน่นอน"
    - "อย่ากู้นอกระบบนะหลาน ดอกเบี้ยรายวันมันโตเร็วกว่าต้นกล้าหน้าฝนอีก"
    - "ถ้าเจอภัยพิบัติ ผู้ใหญ่จะเสนอพักหนี้เข้าสภาให้ จำไว้ว่ายังมีทาง"
  player_sick:
    - "หน้าซีดเชียว ไป รพ.สต. เลย บัตรทองฟรี ไม่ต้องรอให้หนัก"
    - "ป่วยแล้วอย่าออกไปไถนา ระเบียบของร่างกายคือป่วยต้องพัก"
    - "ผู้ใหญ่มียาหม่องกับยาดมติดกระเป๋าเสื้อตลอด เอาไปสักหลอดไหม"
  player_married:
    - "ยินดีด้วย! ไปจดทะเบียนที่อำเภอหรือยัง ระเบียบนะหลาน ระเบียบ"
    - "แต่งงานแล้วย้ายทะเบียนบ้านมาอยู่ด้วยกันนะ ผู้ใหญ่จะได้แก้บัญชีหมู่บ้าน"
    - "ขอให้รักกันนานๆ เหมือนผู้ใหญ่กับเมีย สี่สิบปีไม่เคยนอนแยกห้อง ยกเว้นคืนที่ผู้ใหญ่กรน"
  event_disaster:
    - "ทุกบ้านฟังทางนี้ ย้ายของขึ้นที่สูง ย้ำอีกครั้งนะ ที่สูง ย้ำอีกครั้งนะ ที่สูง"
    - "ศาลาประชาคมเปิดเป็นที่พักชั่วคราว มีข้าวกล่อง มีน้ำดื่ม ใครบ้านเสียหายมาลงชื่อ"
    - "ผู้ใหญ่จะทำเรื่องขอเงินช่วยเหลือ ต้องถ่ายรูปความเสียหายไว้นะ ถ่ายก่อนซ่อม"
    - "หลังน้ำลด เราลงแขกซ่อมบ้านกันทีละหลัง เริ่มจากบ้านคนแก่ก่อน"
  event_election:
    - "ช่วงเลือกตั้งผู้ใหญ่วางตัวเป็นกลาง ...ไม่ใช่เพราะไม่มีความเห็นนะ กลางเพราะระเบียบ"
    - "ป้ายหาเสียงห้ามติดที่ศาลาประชาคม ย้ำอีกครั้งนะ ห้ามติด ผู้ใหญ่แกะไปสิบสองแผ่นแล้ว"
    - "คืนก่อนเลือกตั้งหมาหอนเยอะ ผู้ใหญ่ไม่ได้บอกว่ามีอะไรนะ ผู้ใหญ่บอกแค่ว่าหมาหอน"
    - "ไปเลือกตั้งด้วยนะหลาน เอาบัตรประชาชนตัวจริงไป ไม่ใช่สำเนา"
  event_company_water:
    - "บ่อบ้านยายบัวแห้งแล้ว ผู้ใหญ่ทำหนังสือถึงบริษัท เขาตอบกลับมาเป็นแผ่นพับสี่สี"
    - "ผู้ใหญ่ไม่เคยเห็นน้ำบาดาลลดเร็วขนาดนี้ในชีวิต ระเบียบไหนก็ไม่ได้เขียนรับมือไว้"
    - "ใครบ่อแห้งมาลงชื่อ ผู้ใหญ่จะรวบรวมไปยื่นอำเภอ คราวนี้ผู้ใหญ่ไม่ยอมแค่รับทราบแล้ว"
  event_festival_near:
    - "{festival} ใกล้แล้ว ใครจะตั้งซุ้มในงานมาลงชื่อที่ผู้ใหญ่ ย้ำอีกครั้งนะ ลงชื่อก่อน"
    - "งาน {festival} ปีนี้ผู้ใหญ่เป็นพิธีกร ซ้อมคำกล่าวเปิดงานไว้แล้ว ยาวสามหน้า"
    - "คืนงาน {festival} ไม่มีผีนะ เที่ยวได้เต็มที่ แต่กลับบ้านดีๆ ด้วย"
  gift_love:
    - "โอ้โห {item} นี่ผู้ใหญ่ชอบที่สุด! จะจดลงสมุดเลยว่าวันนี้มีคนรู้ใจผู้ใหญ่"
    - "ของดีขนาดนี้ผู้ใหญ่ต้องขอบใจสองรอบ ขอบใจนะ ...ย้ำอีกครั้งนะ ขอบใจ"
    - "หลานรู้ได้ยังไงว่าผู้ใหญ่ชอบ ป้าแต๋วบอกใช่ไหม"
  gift_like:
    - "ขอบใจนะหลาน {item} เอาไว้กินกับข้าวเย็นพอดี"
    - "ของดีๆ ผู้ใหญ่รับไว้ด้วยความยินดี ...ไม่ได้ถือว่าเป็นสินบนนะ"
    - "น้ำใจดีแบบนี้ ประชุมหมู่บ้านคราวหน้าผู้ใหญ่จะชมให้"
  gift_neutral:
    - "อ้อ {item} ขอบใจจ้ะ ผู้ใหญ่จะหาที่วางให้"
    - "รับไว้นะ ผู้ใหญ่ไม่ค่อยได้ใช้ แต่น้ำใจรับไว้เต็มๆ"
  gift_dislike:
    - "เอ่อ {item} ผู้ใหญ่ไม่ค่อยถนัดนะ แต่ขอบใจที่นึกถึง"
    - "ของแบบนี้ผู้ใหญ่กินแล้วความดันขึ้น เอาไปให้คนอื่นดีกว่าไหม"
  gift_hate:
    - "หลานเอานี่มาให้ผู้ใหญ่ทำไม ผู้ใหญ่ไม่รับนะ ย้ำอีกครั้งนะ ไม่รับ"
    - "ผู้ใหญ่เลิกไปตั้งแต่สิบปีก่อน อย่าเอามาล่อเลย"
  birthday:
    - "วันนี้วันเกิดผู้ใหญ่ ไม่มีใครจำหรอก ...หลานจำได้เหรอ! ผู้ใหญ่ซึ้งเลยนะเนี่ย"
    - "ปีนี้ผู้ใหญ่ขอพรข้อเดียว ขอให้มีแรงทำงานให้ครบวาระก็พอ"
    - "ผู้ใหญ่ไม่จัดงานใหญ่หรอก ใส่บาตรพระอาจารย์สุเมธตอนเช้า แค่นั้นก็อิ่มใจแล้ว"
  rare:
    - "ผู้ใหญ่บอกความลับนะ ตอนประกาศเรื่องน้ำท่วมปี 54 ผู้ใหญ่ย้ำไปสิบเอ็ดรอบ เพราะมือสั่น"
    - "เคยฝันว่าหอกระจายข่าวพูดเองได้ แล้วมันพูดอยู่คำเดียวว่า ย้ำอีกครั้งนะ"
    - "ผู้ใหญ่ซ้อมกล่าวอำลาตำแหน่งหน้ากระจกทุกคืน ยังไม่เคยพูดจบโดยไม่ร้องไห้เลย"
    - "สมุดประชุมเล่มแรกเป็นลายมือเมียผู้ใหญ่ เขาจดแทนตอนผู้ใหญ่ยังเขียนช้า"
    - "ผู้ใหญ่ไม่รู้ว่าเพลงที่เปิดก่อนประกาศชื่อเพลงอะไร เปิดเพราะเทปมันค้างอยู่ในเครื่องตั้งแต่ปี 2538"
