id: kla
name: "กล้า"
role: "คนรุ่นใหม่ทำเกษตรอินทรีย์ ผู้ก่อตั้งสหกรณ์ชุมชน (ฝั่งชุมชน) อายุ 30"
voice: "สุภาพ จริงจัง ลงท้าย 'ครับ' เรียกชาวบ้านว่า 'พี่น้อง' ติดพูดตัวเลขต้นทุนกับเปอร์เซ็นต์ ชอบขึ้นต้น 'ลองคิดดูนะครับ…' พอพูดยาวเกินจะรู้ตัวแล้วพูด '…ขอโทษครับ ผมเทศน์อีกแล้ว'"
dark_humor: false
romanceable: true
personality: "อุดมการณ์สูง ซื่อตรง ดื้อ ทำงานจนลืมกิน ใจดีแต่เข้มงวดกับตัวเองมาก"
backstory: "เคยทำงานมูลนิธิในกรุงเทพฯ กลับบ้านเมื่อพ่อป่วยเรื้อรังจากการฉีดยาฆ่าแมลงมาทั้งชีวิต จึงเปลี่ยนนาที่บ้านเป็นอินทรีย์และตั้งสหกรณ์รับซื้อราคาตลาด แข่งกับลานรับซื้อเสี่ยเฮง แต่สหกรณ์เงินทุนน้อย กล้าเอาโฉนดที่บ้านไปค้ำเงินกู้ของสหกรณ์ ถ้าสหกรณ์ล้ม ครอบครัวเขาจะเสียนาที่พ่อเหลืออยู่"
courtship: "ชอบคนที่ลงแรงจริงกับชุมชน ไม่ชอบคนที่เซ็นสัญญากับบริษัทง่ายๆ หรือฉีดยาหนัก ชวนไปช่วยงานสหกรณ์ ไปดูหิ่งห้อยในนาอินทรีย์ ให้ผลผลิตที่ปลูกเองโดยไม่ใช้สารเคมี"
lines:
  greet_morning:
    - "อรุณสวัสดิ์ครับ {player} ผมเพิ่งเก็บผักบุ้งส่งสหกรณ์เสร็จ ได้ยี่สิบกำ ราคากำละสิบ ไม่หักความชื้นสักบาท"
    - "เช้านี้ลองฟังเสียงในนาผมดูสิครับ มีกบ มีเขียด มีนก นาที่ฉีดยาเงียบกว่านี้เยอะ"
    - "ตื่นเช้าเหมือนกันเลยนะครับ คนทำนาไม่มีวันจันทร์ ไม่มีวันหยุด มีแต่ฟ้า"
    - "ผมต้มน้ำใบเตยไว้ในกระติก ดื่มไหมครับ ไม่มีน้ำตาล ไม่มีสีผสม ไม่มีโฆษณา"
    - "หอกระจายข่าวเมื่อเช้าประกาศราคาลานรับซื้อเสี่ย ผมขอประกาศเสริมว่าสหกรณ์รับซื้อสูงกว่ากิโลละห้าสิบสตางค์"
  greet_noon:
    - "เที่ยงแล้วครับ ผมยังไม่ได้กินข้าวเลย… ไม่ต้องบอกหมอแอนนะครับ"
    - "แดดแรงแบบนี้ผมหลบมาคิดบัญชีสหกรณ์ใต้ศาลา ตัวเลขร้อนกว่าแดดอีก"
    - "ลองคิดดูนะครับ ข้าวเวฟร้าน 24 ชม. กล่องละสี่สิบห้า แต่ข้าวที่เราปลูก ชาวนาได้กิโลละไม่ถึงสิบห้า"
    - "พักกินข้าวที่ร้านพี่หน่อยไหมครับ ผมส่งผักให้ร้านแกทุกวัน กินแล้วรู้สึกเหมือนกินผลงานตัวเอง"
    - "ผมเพิ่งไปส่งผักอินทรีย์ที่โรงเรียนให้ครูเต้ยทำอาหารกลางวันเด็ก ได้เงินช้าแต่ได้เห็นเด็กกินผัก"
  greet_evening:
    - "เย็นแล้วครับ ผมจะไปรดน้ำแปลงปุ๋ยหมักต่อ ไม่หยุดก็ไม่เหนื่อย… อันนั้นโกหกครับ เหนื่อยมาก"
    - "หอกระจายข่าวห้าโมงประกาศราคาพรุ่งนี้แล้ว ถ้าเสี่ยกดราคา ขายให้สหกรณ์ได้นะครับ"
    - "เย็นนี้มีประชุมสมาชิกสหกรณ์ที่ศาลาวัด มาไหมครับ มีข้าวต้มมัดให้กิน"
    - "แสงเย็นแบบนี้ผมชอบนั่งดูนาที่บ้าน นึกถึงตอนพ่อยังแข็งแรง"
    - "ได้ยินว่าวันนี้ {player} ไปตลาดนัด เจอผักอินทรีย์ของสหกรณ์ไหมครับ แผงสีเขียวมีป้ายมือเขียน"
  greet_night:
    - "สองทุ่มแล้วครับ รีบกลับเถอะ ผมเคยวิ่งหนีผีปอบรอบแปลงปุ๋ยหมัก มันไม่สนอุดมการณ์ใครทั้งนั้น"
    - "ถ้ากลับไม่ทัน แวะวัดดงเย็นก่อนนะครับ พระอาจารย์สุเมธเปิดศาลาให้หลบเสมอ"
    - "ผมยังต้องปิดบัญชีสหกรณ์อีกครึ่งชั่วโมง ถ้าไม่ทันผมคงนอนสหกรณ์ มีเสื่อกับมุ้งอยู่"
    - "หมาหอนแล้ว ลมเริ่มเย็น ไปเถอะครับ เดี๋ยวผมเดินไปส่งถึงหัวสะพาน"
    - "ดึกแล้วยังไม่เข้าบ้านอีก ถ้าเป็นลมไปเสียค่ารักษาแล้วเงินหาย อย่ามากู้เสี่ยเฮงนะครับ"
  weather_rain:
    - "ฝนตกครับ! ปุ๋ยหมักผมได้ความชื้นพอดี ปกติต้องหาบน้ำมารด วันนี้ฟ้าช่วย"
    - "ฝนแบบนี้เสี่ยเฮงจะหักความชื้นเพิ่มแน่ๆ ใครเก็บเกี่ยววันนี้ ตากให้แห้งก่อนขายนะครับ"
    - "ฝนมาทีไรหลังคาโรงคัดผักของสหกรณ์รั่วสองจุด ผมเอาถังสีมารองไว้ เป็นระบบบริหารน้ำแบบสหกรณ์"
    - "หลังฝนตก ลองดูไส้เดือนในแปลงผมสิครับ เยอะจนเหยียบไม่ได้ ดินมันมีชีวิต"
    - "ฝนตกหนักแบบนี้สารเคมีจากนาข้างบนไหลลงคลอง ผมเคยเห็นปลาลอยตายทั้งแถบ"
  weather_hot:
    - "ร้อนครับ คลุมดินด้วยฟางหรือใบไม้แห้งไว้นะครับ ดินเปลือยคือดินที่กำลังตาย"
    - "ร้อนแบบนี้ผมแบ่งเวลาทำงานเป็นเช้ามืดกับหัวค่ำ กลางวันนอน ชาวนาสมัยก่อนก็ทำแบบนี้"
    - "ดื่มน้ำเยอะๆ นะครับ ผมไม่อยากเห็นใครเป็นลมแดดกลางนาอีก ปีที่แล้วพ่อผมก็ล้มกลางนาตอนเที่ยง"
    - "ร้อนแบบนี้ผักใบเหี่ยวเร็ว สหกรณ์ต้องรีบส่งตลาดตั้งแต่ตีห้า ไม่งั้นราคาตก"
    - "แดดเปรี้ยงแบบนี้ ลองทำโรงเรือนตาข่ายพรางแสงดูครับ สหกรณ์มีขายราคาทุน"
  weather_storm:
    - "พายุเข้าครับ! ผมต้องไปมัดหลังคาโรงคัดผัก ใครว่างช่วยกันหน่อย"
    - "อย่าออกไปทุ่งนะครับ ปีที่แล้วต้นยางนาล้มทับนาลุงสมหมายเกือบโดนตัว"
    - "พายุแบบนี้ผักสหกรณ์เสียหายหนักแน่ แต่ไม่เป็นไร ปลูกใหม่ได้ คนสิครับปลูกใหม่ไม่ได้"
    - "หลังพายุมาช่วยกันเก็บกวาดที่สหกรณ์นะครับ ผมเลี้ยงข้าวเหนียวไก่ทอด สมาชิกทอดกันเอง"
    - "ไฟดับทั้งตำบล ผักในห้องเย็นสหกรณ์จะเสียหมด… ผมขอตัวไปหาเครื่องปั่นไฟก่อนครับ"
  weather_pm25:
    - "ฝุ่นหนามากครับ ส่วนหนึ่งมาจากไร่อ้อยที่เผาก่อนตัดส่งโรงงาน เพราะโรงงานรับซื้ออ้อยไฟไหม้ตัดง่ายกว่า"
    - "ใส่หน้ากากนะครับ ผมใส่สองชั้น พูดไม่ค่อยชัด แต่ก็ยังพูดเรื่องเดิมอยู่"
    - "ลองคิดดูนะครับ ถ้าไถกลบตอซังแทนเผา ได้ปุ๋ยอินทรีย์ฟรีไร่ละหลายร้อย แถมไม่มีฝุ่น"
    - "ผมเคยเสนอให้ตำบลมีรถไถกลบกลาง ค่าเช่าถูก ได้คำตอบว่า 'ต้องรองบปีหน้า' มาสามปีแล้วครับ"
    - "วันนี้ผมไม่ออกแปลง ไปนั่งเขียนโครงการขอทุนแทน… ซึ่งเหนื่อยกว่าดายหญ้าอีก"
  season_rainy:
    - "หน้าฝนแล้วครับ สหกรณ์มีเมล็ดข้าวพันธุ์พื้นบ้านแจกสมาชิก ข้าวหอมนิลกับข้าวเหลืองประทิว"
    - "ช่วงปักดำ ผมจะลงแขกช่วยทุกบ้านที่เป็นสมาชิก แลกแรงกันคนละวัน ไม่มีใครต้องจ้างใคร"
    - "หน้าฝนหอยเชอรี่ขึ้นเยอะ เก็บมาทำน้ำหมักครับ อย่าใช้ยาฆ่าหอย มันฆ่าปลาด้วย"
    - "เข้าพรรษาผมตั้งใจเลิกบ่นเรื่องเสี่ยเฮงสามเดือน… ผ่านไปสองวันแล้วครับ ยากมาก"
    - "หน้าฝนน้ำเยอะ แต่ใต้ดินผมวัดได้ว่าระดับน้ำยังไม่กลับมาเท่าก่อนบริษัทมา"
  season_cool:
    - "หน้าหนาวครับ ฤดูเกี่ยวข้าว สหกรณ์รับซื้อราคาตลาด ชั่งต่อหน้าสมาชิกทุกกระสอบ"
    - "เกี่ยวเสร็จอย่าเผาตอซังนะครับ ผมมีเมล็ดปอเทืองแจก หว่านลงไปแล้วไถกลบ ดินจะขอบคุณ"
    - "หนาวแบบนี้ปลูกผักสลัดได้งาม ร้านในอำเภอรับซื้อราคาดี ผมพาไปคุยได้"
    - "งานกฐินปีนี้สหกรณ์จะถวายข้าวอินทรีย์สิบกระสอบ เป็นครั้งแรกที่เราทำได้"
    - "ลมหนาวมาแล้ว พ่อผมไอหนักขึ้น… ขอโทษครับ ไม่ได้ตั้งใจจะเล่า"
  season_dry:
    - "หน้าแล้งครับ น้ำบ่อลดลงทุกปี ผมจดตัวเลขไว้ห้าปีย้อนหลัง กราฟมันชี้ลงไปที่เดียว"
    - "ลองคิดดูนะครับ ปลูกถั่วเขียวหลังนาใช้น้ำน้อย ได้ไนโตรเจนคืนดิน แถมขายได้"
    - "หน้าแล้งสหกรณ์รับซื้อผักน้อยลง เพราะทุกคนไม่มีน้ำรด ผมเลยกำลังคิดเรื่องธนาคารน้ำใต้ดิน"
    - "สงกรานต์นี้ผมขอรดน้ำดำหัวพ่อก่อน แล้วจะไปช่วยงานวัดต่อ ไม่สาดใครนะครับ ประหยัดน้ำ"
    - "งานผ้าป่าหน้าแล้ง สหกรณ์จะร่วมกองด้วยปุ๋ยหมักห้าสิบกระสอบ วัดเอาไปใส่ต้นไม้ได้"
  heart_low:
    - "สวัสดีครับ ถ้าจะสมัครสมาชิกสหกรณ์ ค่าหุ้นร้อยบาท ต้องไม่ใช้สารเคมีในแปลงที่ส่งขายครับ"
    - "ผมได้ยินว่า {player} ซื้อปุ๋ยเคมีร้านเสี่ยเฮง… ไม่ว่าอะไรครับ แค่บันทึกไว้"
    - "ขอโทษครับ ผมรีบไปส่งผัก ไว้คุยกันใหม่นะครับ"
    - "กลับมาจากกรุงเทพฯ เหมือนผมเลย อยู่ให้ได้นะครับ ส่วนใหญ่อยู่ไม่ถึงปี"
    - "ถ้าจะเซ็นสัญญากับบริษัทคุณธนา คิดให้ดีก่อนนะครับ… ผมไม่ได้บังคับ แค่เตือน"
  heart_mid:
    - "{player} ลงแขกกับสหกรณ์มาสามครั้งแล้ว สมาชิกเริ่มถามหาแล้วนะครับ"
    - "ผมเห็นแปลงของ {player} ใช้ปุ๋ยหมักแล้ว… ผมดีใจแบบที่พูดไม่ออกเลยครับ"
    - "บางทีผมก็พูดเยอะเกิน ขอบคุณที่ฟังจนจบนะครับ คนส่วนใหญ่เดินหนีตั้งแต่ประโยคที่สาม"
    - "ผมเก็บผักกาดหอมที่งามที่สุดไว้ให้ ไม่ได้ใส่บัญชีสหกรณ์นะครับ ของส่วนตัว"
    - "วันนี้ผมขายผักได้ทั้งหมด ไม่มีเหลือทิ้งเลย อยากบอกใครสักคน เลยมาบอก {player}"
  heart_high:
    - "ผมเอาโฉนดนาของพ่อไปค้ำเงินกู้ของสหกรณ์ ถ้าสหกรณ์ล้ม บ้านผมเสียนา… ไม่มีใครรู้เรื่องนี้นอกจากแม่"
    - "พ่อผมฉีดยาฆ่าแมลงมาสามสิบปี ไม่เคยใส่หน้ากาก ตอนนี้มือสั่นจนถือแก้วน้ำไม่ได้ ผมเลยไม่ยอมแพ้เรื่องนี้"
    - "บางคืนผมนั่งคิดว่า ถ้าผมยอมเซ็นสัญญากับบริษัท ทุกอย่างคงง่ายกว่านี้ แล้วผมก็เกลียดตัวเองที่คิด"
    - "ตอนอยู่มูลนิธิในกรุงเทพฯ ผมเขียนรายงานเรื่องชาวนาเป็นร้อยหน้า กลับมาเป็นชาวนาเองถึงรู้ว่าเขียนผิดเกือบหมด"
    - "ผมไม่เคยบอกใคร แต่ผมกลัวว่าวันหนึ่งผมจะกลายเป็นคนที่ทุกคนเบื่อ คนที่พูดเรื่องเดิมแล้วไม่มีอะไรเปลี่ยน"
  topic_news:
    - "สหกรณ์เพิ่งได้สัญญาส่งผักให้โรงพยาบาลอำเภอ! สามปี ราคาคงที่ ไม่ใช่เกษตรพันธสัญญานะครับ เราตั้งราคาเอง"
    - "เสี่ยเฮงประกาศงดเชื่อปุ๋ยคนที่ขายให้สหกรณ์ ผมว่านั่นแปลว่าเราเริ่มน่ากลัวแล้วครับ"
    - "บริษัทของคุณธนาเปิดรับสมัครชาวนาเข้าโครงการ 'ข้าวโพดยั่งยืน' ใช้ปุ๋ยเคมีเต็มสูบ ยั่งยืนตรงไหนผมยังหาไม่เจอ"
    - "สมาชิกสหกรณ์ครบร้อยคนแล้วครับ เมื่อสองปีก่อนมีสามคน รวมผมกับแม่"
    - "ระดับน้ำบ่อในหมู่ 4 ลดลงอีกแล้ว ผมกับปาล์มวัดได้ตรงกัน แต่ตัวเลขยังไม่ไปถึงโต๊ะใครเลย"
  topic_advice:
    - "ขายข้าวให้สหกรณ์ได้ราคาตลาด ชั่งต่อหน้า ไม่หักความชื้นเกินจริง ต่างจากลานรับซื้อตันละหลายร้อยบาท"
    - "ทำปุ๋ยหมักแบบไม่กลับกอง ใช้ฟางสามส่วนมูลวัวหนึ่งส่วน รดน้ำให้ชื้น สองเดือนใช้ได้ ลดค่าปุ๋ยได้เกือบครึ่ง"
    - "ถ้าจะกู้ยืม กู้สหกรณ์ครับ ดอกต่ำ แต่ต้องเป็นสมาชิก อย่ากู้เสี่ยเฮง ยิ่งหัวใจต่ำยิ่งดอกแพง"
    - "ก่อนเซ็นเกษตรพันธสัญญา ดูข้อคัดเกรดให้ดี ถ้าบริษัทคัดตกได้ตามใจ ราคาคงที่ก็ไม่มีความหมาย"
    - "ปลูกพืชผสมผสานครับ ข้าว ผัก ไม้ผล เลี้ยงไก่ ราคาอะไรตกยังมีอย่างอื่นพยุง อย่าลงตะกร้าเดียว"
    - "เลี้ยงเป็ดในนาข้าวครับ เป็ดกินหอยเชอรี่กับหญ้า ขี้เป็ดเป็นปุ๋ย แถมได้ไข่"
  topic_smalltalk:
    - "ผมตั้งชื่อกองปุ๋ยหมักทุกกองครับ กองนี้ชื่อ 'ความหวัง' กองนั้นชื่อ 'ความอดทน' กองที่เน่าชื่อ 'งบประมาณ'"
    - "ผมฟังพอดแคสต์เรื่องสหกรณ์ในต่างประเทศตอนดายหญ้า แม่บอกว่าผมพูดกับหญ้าแบบนักวิชาการ"
    - "ถ้าไม่ได้ทำนา ผมคงเป็นครู… แต่ครูเต้ยบอกว่าผมสอนนานเกินคาบ"
    - "ผมกินข้าวกล้องทุกมื้อมาห้าปี บางคืนฝันถึงข้าวมันไก่ แต่ตื่นมาก็ยังกินข้าวกล้อง"
    - "เคยไหมครับ รู้สึกว่าคุยกับต้นไม้แล้วมันเข้าใจมากกว่าคุยกับที่ประชุม อบต."
  topic_about_self:
    - "ผมเรียนพัฒนาชุมชน ทำงานมูลนิธิในกรุงเทพฯ ห้าปี แล้วกลับมาตอนพ่อป่วย ไม่ได้วางแผนจะมาอยู่ถาวร แต่ก็อยู่"
    - "สหกรณ์เริ่มจากโต๊ะพับตัวเดียวกับตาชั่งมือสองที่ซื้อจากตลาดนัด ตอนนี้มีโรงคัดผักแล้ว ถึงหลังคาจะรั่ว"
    - "บ้านผมอยู่ปลายคลองหมู่ 4 นาแปลงสุดท้ายก่อนถึงรั้วบริษัท ผมเห็นรั้วนั้นขยับมาใกล้ขึ้นทุกปี"
    - "ผมไม่กินเหล้า ไม่สูบบุหรี่ ไม่ซื้อหวย แม่บอกว่าผมเป็นผู้ชายที่น่าเบื่อที่สุดในตำบล"
    - "ฝันของผมคือวันที่ชาวนาตั้งราคาข้าวเองได้ ไม่ใช่รอฟังหอกระจายข่าวห้าโมงเย็นว่าเสี่ยให้เท่าไหร่"
  topic_about_others:
    - "เสี่ยเฮงไม่ใช่คนเลวนะครับ ระบบที่ทำให้ชาวนาต้องพึ่งเขาต่างหากที่เลว… แต่ดอกเบี้ยเขาก็เลวจริง"
    - "ปาล์มเป็นคนเดียวใน อบต. ที่ลงมาเหยียบดินจริง ผมเคารพเธอ ถึงเธอจะต้องถ่ายรูปป้ายเยอะไปหน่อย"
    - "คุณธนาพูดเพราะมากครับ เพราะจนผมต้องฟังสามรอบถึงจะรู้ว่าเขากำลังบอกว่าจะเอาน้ำเราไป"
    - "ลุงสมหมายมีรถเกี่ยวคันเดียวในตำบล ทุกคนต้องรอคิวเขา ผมอยากให้สหกรณ์มีรถเกี่ยวของตัวเอง แต่ลุงจะเสียใจ"
    - "เมย์นักข่าวมาถามข้อมูลน้ำบาดาลจากผมบ่อย ผมให้หมด ถึงเธอจะเขียนว่าผมเป็น 'ชาวนาหัวรั้น' ก็ตาม"
  gossip_theft:
    - "ผมได้ยินเรื่องของหาย… ถ้าเป็น {player} จริง ผมผิดหวังครับ แต่ถ้ามีปัญหาเรื่องปากท้อง มาคุยกับสหกรณ์ได้"
    - "สหกรณ์อยู่ได้เพราะความไว้ใจ ถ้าความไว้ใจหาย ตาชั่งก็ไม่มีความหมายครับ"
    - "คืนของให้เจ้าของก่อนครับ แล้วค่อยมาคุยกันว่าต้องการอะไร"
  gossip_cheating:
    - "ผมไม่เก่งเรื่องหัวใจครับ แต่ผมรู้ว่าการไม่ซื่อตรงทำลายอะไรได้บ้าง ผมเห็นมันทุกวันที่ลานรับซื้อ"
    - "ผมนึกว่า {player} เป็นคนที่ผมไว้ใจได้ทั้งเรื่องงานและเรื่องอื่น"
    - "ไม่ต้องอธิบายครับ ผมขอไปทำงานก่อน งานไม่เคยโกหกผม"
  gossip_unpaid_bill:
    - "ค้างค่าไฟเหรอครับ ขายผลผลิตให้สหกรณ์สิครับ จ่ายเงินสดภายในสามวัน ไม่ต้องรอเครดิต"
    - "อย่าอายครับ ค่าไฟสหกรณ์เองก็ค้างอยู่สองเดือน การไฟฟ้าโทรมาทุกวันพฤหัส"
    - "ถ้าช็อตจริงๆ สหกรณ์มีกองทุนฉุกเฉินให้สมาชิกยืม ไม่มีดอก แต่ต้องมาช่วยงานคัดผักแทน"
  gossip_small_envelope:
    - "ซองน้อยไม่ผิดครับ ระบบที่บังคับให้ทุกคนใส่ซองแข่งกันต่างหากที่ทำให้คนเป็นหนี้"
    - "ถ้าเงินไม่มี ช่วยด้วยแรงครับ งานบุญต้องการคนล้างหม้อมากกว่าแบงก์ร้อย"
    - "ผมใส่ซองเป็นข้าวสารอินทรีย์ห้ากิโลทุกงาน ป้าทองใบบ่นแต่ก็หุงกินหมด"
  gossip_skip_longkhaek:
    - "ลงแขกคือหัวใจของสหกรณ์ครับ ถ้า {player} ไม่ไปคืนแรง สมาชิกคนอื่นจะเริ่มไม่ไปเหมือนกัน"
    - "ผมไม่ได้โกรธนะครับ แค่… ลุงสมหมายรอ {player} ทั้งเช้า"
    - "ครั้งหน้าไปพร้อมผมก็ได้ครับ ผมไปทุกงาน มีข้าวเหนียวหมูทอดรอทุกครั้ง"
  player_fainted:
    - "โดนผีไล่จนสลบเหรอครับ! ค่ารักษาสิบเปอร์เซ็นต์ของเงินสด ผมว่าแพงกว่าดอกเบี้ยเสี่ยเฮงต่อวันอีก"
    - "ครั้งหน้าถ้ากลับไม่ทัน แวะนอนที่สหกรณ์ก็ได้ครับ… เอ่อ ไม่ได้ เดี๋ยวโดนผีเจ้าที่อำ ไปวัดดีกว่า"
    - "ฝากเงินธนาคารไว้นะครับ เงินสดหายตอนเป็นลม ผมเห็นสมาชิกเสียเงินค่าปุ๋ยไปทั้งเดือนแบบนี้"
  player_new_vehicle:
    - "รถใหม่เหรอครับ ดีมาก ขนผักส่งสหกรณ์ได้ทีละเยอะ… ถ้าว่างช่วยส่งของให้ผมด้วยได้ไหม"
    - "ผมยังขี่มอไซค์คันเดิมตั้งแต่สมัยเรียน บอลบอกว่ามันอยู่ได้ด้วยความศรัทธาล้วนๆ"
    - "ยินดีด้วยครับ แต่อย่าผ่อนเกินกำลังนะ ผมเห็นคนผ่อนรถจนต้องขายนา"
  player_lottery_win:
    - "ถูกหวยเหรอครับ ยินดีด้วย… ถ้าสนใจ ซื้อหุ้นสหกรณ์ได้นะครับ ปันผลไม่เยอะแต่ไม่เคยออกงวดเปล่า"
    - "เอาไปลงทุนระบบน้ำ ปุ๋ยหมัก หรือบ่อเก็บน้ำ อะไรที่อยู่กับที่ดินนานๆ ครับ"
    - "ลุงสมหมายคงมาถามเลขแล้ว อย่าบอกนะครับ เราจะได้ไม่ต้องเห็นลุงเสียเงินเพิ่ม"
  player_muddy:
    - "โคลนเต็มตัวเลยครับ นี่แหละสภาพคนทำนาจริง ไม่ใช่ในโปสเตอร์โครงการ"
    - "ดินที่ติดตัว {player} มีไส้เดือนติดมาด้วยนะครับ แปลว่าแปลงดินดี"
    - "ล้างตัวที่บ่อหลังสหกรณ์ได้ครับ น้ำยังไม่แห้ง… ยังนะ"
  player_rich:
    - "ได้ข่าวว่ารวยขึ้นครับ ดีใจด้วย ขอแค่อย่าเอาเงินไปปล่อยกู้แบบเสี่ยนะครับ"
    - "ถ้าอยากให้เงินทำงานต่อ ลงทุนในชุมชนครับ เงินจะวนอยู่ในตำบล ไม่ไหลไปอำเภอ"
    - "รวยแล้วคนจะเข้าหาเยอะ ทั้งบริษัท ทั้งนักการเมือง ระวังนะครับ"
  player_in_debt:
    - "มีหนี้เหรอครับ มานั่งทำบัญชีด้วยกันไหม ผมทำบัญชีสหกรณ์ทุกวัน ทำให้ {player} อีกเล่มได้"
    - "อย่ากู้ใหม่มาโปะหนี้เก่าครับ ผมเห็นวงจรนั้นที่ลานรับซื้อทุกฤดู"
    - "หนี้ไม่ได้แปลว่าล้มเหลวครับ ระบบออกแบบมาให้ชาวนาเป็นหนี้ตั้งแต่ก่อนหว่านเมล็ด"
  player_sick:
    - "ป่วยเหรอครับ ถ้าฉีดยาฆ่าแมลงมาก่อนหน้านี้ ไป รพ.สต. เลยนะครับ อย่ารอเหมือนพ่อผม"
    - "ผมต้มน้ำขิงกับตะไคร้มาให้ ปลูกเองไม่ใส่ยาครับ"
    - "พักเถอะครับ เดี๋ยวผมให้สมาชิกสหกรณ์ไปช่วยรดน้ำแปลงให้ ลงแขกแบบเร่งด่วน"
  player_married:
    - "ยินดีด้วยครับ {player} สองแรงทำนาเบากว่าแรงเดียวเยอะ"
    - "ผมถวายข้าวอินทรีย์เป็นของขวัญแต่งงาน ห้ากิโล ไม่ใช่ซองนะครับ ป้าทองใบรู้แล้ว"
    - "อย่าลืมจดทะเบียนที่อำเภอนะครับ กู้ร่วมได้ แต่ถ้าจะกู้ มากู้สหกรณ์ก่อน"
  event_disaster:
    - "น้ำท่วมแปลงสมาชิกสหกรณ์สิบกว่าราย ผมกำลังจัดเวรลงแขกช่วยกู้นา ใครว่างมาเลยครับ"
    - "สหกรณ์เปิดโรงคัดผักเป็นศูนย์รับบริจาค ของมาเยอะกว่าที่ อบต. แจกอีกครับ"
    - "ภัยพิบัติทีไรผมเห็นชัดเลยว่าชุมชนช่วยกันเร็วกว่าแบบฟอร์มเจ็ดหน้า"
  event_election:
    - "ช่วงเลือกตั้งผู้สมัครทุกคนบอกว่ารักเกษตรกร ผมขอให้เขียนใส่กระดาษพร้อมตัวเลขงบครับ"
    - "คืนหมาหอนมีคนมาเคาะประตูบ้านผม ผมเปิดออกไปพูดเรื่องสหกรณ์สิบห้านาที เขารีบไปบ้านอื่นเลยครับ"
    - "ไม่ว่าใครชนะ สหกรณ์ก็ต้องทำงานต่อ เราไม่ได้ตั้งขึ้นเพื่อรอใคร"
  event_company_water:
    - "บ่อสมาชิกสหกรณ์แห้งไปเจ็ดบ่อแล้วครับ บริษัทบอกว่า 'ไม่มีความสัมพันธ์ทางสถิติ' ผมมีกราฟห้าปีให้ดู"
    - "ผมกำลังรวบรวมรายชื่อยื่นอำเภอ ถ้า {player} บ่อแห้งด้วย ลงชื่อนะครับ"
    - "เขาเรียกว่า 'บริหารน้ำใต้ดินให้มีประสิทธิภาพ' ผมเรียกว่าดูดน้ำ เราใช้ภาษาต่างกันครับ"
  event_festival_near:
    - "{festival} ใกล้แล้วครับ สหกรณ์จะออกบูธขายผักอินทรีย์ ใครอยากช่วยขาย ผมแบ่งกำไรให้"
    - "ไปงาน {festival} ด้วยกันไหมครับ ผมสัญญาว่าจะไม่พูดเรื่องสหกรณ์… เกินห้านาที"
    - "งาน {festival} ปีนี้ผมขอให้ใช้กระทงใบตอง จานใบตอง ไม่ใช้โฟม คณะกรรมการบอกว่าจะ 'พิจารณา'"
  gift_love:
    - "{item}! ปลูกเองเหรอครับ ไม่ใช้ยาใช่ไหม… ผมขอบคุณมากเลย จริงๆ"
    - "ของแบบนี้มีค่ากว่าเงินครับ มันมีแรงคนอยู่ในนั้น"
    - "ผมไม่รู้จะตอบแทนยังไงดีครับ… เอาผักสหกรณ์ไปสักตะกร้าไหม"
  gift_like:
    - "ขอบคุณครับ {item} ผมชอบนะ"
    - "ดีจังครับ เดี๋ยวแบ่งให้พ่อด้วย"
    - "ของดีครับ ซื้อจากตลาดนัดใช่ไหม ผมสนับสนุนแม่ค้าคนเดียวกัน"
  gift_neutral:
    - "ขอบคุณครับ"
    - "อ๋อ {item} ครับ ผมเก็บไว้นะ"
    - "รับไว้ครับ ขอบคุณที่คิดถึง"
  gift_dislike:
    - "ขอบคุณครับ แต่ห่อพลาสติกสามชั้นแบบนี้ผมไม่ค่อยสบายใจเลย"
    - "ของจากบริษัทคุณธนาเหรอครับ… ผมเอาไปบริจาคแล้วกัน"
    - "ข้าวเวฟเหรอครับ ผมขอเก็บไว้ให้คนที่ต้องการกว่านะครับ"
  gift_hate:
    - "ยาฆ่าหญ้า… {player} รู้ใช่ไหมครับว่าพ่อผมเป็นอะไร"
    - "ผมรับไม่ได้ครับ ขอโทษ ช่วยเอามันไปให้ไกลจากแปลงผมด้วย"
    - "ผมจะทำเป็นว่าไม่ได้เห็นนะครับ แต่ผมจะจำได้"
  birthday:
    - "วันเกิดผมเหรอครับ… ผมลืมไปแล้วจริงๆ มัวแต่ทำบัญชีสหกรณ์"
    - "ขอบคุณครับ ปีนี้ผมขอพรให้สหกรณ์ไม่ขาดทุน กับให้พ่อหายไอ แค่สองข้อพอ"
    - "ไม่มีใครเลี้ยงวันเกิดผมมาหลายปีแล้ว ผมไม่รู้ต้องทำหน้ายังไงเลยครับ"
  rare:
    - "ความลับนะครับ ผมเคยกินข้าวมันไก่ที่อำเภอแบบแอบๆ ไก่เลี้ยงฟาร์ม น้ำจิ้มมีผงชูรส ผมรู้สึกผิดแต่อร่อยมาก"
    - "ผมเขียนจดหมายถึงตัวเองตอนอายุสี่สิบไว้ ฝังไว้ใต้ต้นมะขามหน้าสหกรณ์ ข้างในเขียนว่า 'ยังไม่ยอมแพ้ใช่ไหม'"
