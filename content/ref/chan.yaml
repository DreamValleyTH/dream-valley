id: chan
name: "ยายจันทร์"
role: "ชาวไทยพวน ช่างทอผ้าซิ่นตีนจก แม่งานกำฟ้าไทยพวน"
voice: "ภาษากลางปนไทยพวนเล็กน้อย แทนตัวว่า ข้อย เรียกผู้เล่นว่า เจ้า หรือ ลูกหลาน ใช้คำ บ่ แม่น หลาย เฮือน ไผ ย่าน(กลัว) มัก(ชอบ) ลงท้าย เด้อ แท้ ภูมิใจลายผ้าและงานกำฟ้า เปรียบชีวิตกับเส้นด้าย"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "มาแต่เช้าเด้อลูกหลาน ข้อยขึ้นกี่ทอผ้าตั้งแต่ไก่ขัน"
    - "ตื่นเช้าดีหลาย เจ้ากินข้าวเช้าแล้วบ่ ข้อยมีข้าวจี่อยู่ในกระติบ"
    - "ข้อยย้อมเส้นไหมด้วยครั่งอยู่ มือแดงหมดแล้วเห็นบ่"
  greet_noon:
    - "เที่ยงแล้ว ข้อยหยุดทอพักตา ตีนจกลายนี้ละเอียดหลาย ตาลายเลยแหละ"
    - "แดดแรงเด้อ มานั่งใต้ถุนเฮือนข้อยก่อน ลมเย็นดี"
  greet_evening:
    - "เย็นแล้ว รีบกลับเฮือนเด้อลูกหลาน ค่ำมาผีออกบ่ทันรู้ตัว"
    - "ข้อยเก็บกี่แล้ว แสงเย็นทอบ่ได้ ดูสีเพี้ยนหมด"
  greet_night:
    - "ดึกป่านนี้ยังเดินอยู่ เจ้าบ่ย่านผีบ่ ข้อยย่านแทนเจ้าเลย"
    - "เข้ามาหลบในรั้วก่อน แล้วค่อยเดินทางที่มีไฟไปวัดเด้อ"
  weather_rain:
    - "ฝนตกเส้นไหมบ่แห้ง ข้อยต้องตากใหม่อีกสามวัน"
    - "ฝนมาแม่นตามที่ฟ้าทายไว้ตอนกำฟ้าเลย ข้อยบอกแล้ว"
  weather_hot:
    - "ร้อนหลายเด้อ ข้อยนุ่งซิ่นฝ้ายบางๆ เย็นกว่าผ้าโรงงานหลาย"
    - "ร้อนจนขี้ผึ้งที่ข้อยไว้ลูบเส้นด้ายละลายหมด"
  weather_storm:
    - "ฟ้าร้องแรงแบบนี้ ไทยพวนเฮาถือว่าฟ้าเปิดปาก ปีนี้ฝนดีแน่"
    - "ลมแรงเด้อ ช่วยข้อยยกกี่เข้าเฮือนหน่อย"
  weather_pm25:
    - "ฝุ่นหลายแท้ ผ้าขาวที่ข้อยตากไว้กลายเป็นสีเทาหมด"
    - "ข้อยแสบตาจนนับเส้นยืนบ่ได้ หยุดทอวันหนึ่งแหละ"
  season_rainy:
    - "หน้าฝนข้อยดำนาบ่ไหวแล้ว อยู่เฮือนทอผ้าขายแทน"
    - "เข้าพรรษา ข้อยทอผ้าไปถวายวัดทุกปีเด้อ ปีนี้ลายนาค"
  season_cool:
    - "หน้าหนาวใกล้กำฟ้าแล้ว ข้อยเริ่มเลือกกระบอกไม้ไผ่ไว้เผาข้าวหลาม"
    - "หนาวแล้ว ข้อยทอผ้าห่มไว้ให้หลานที่ไปทำงานระยอง ยังบ่ได้ส่ง"
  season_dry:
    - "หน้าแล้งน้ำน้อย ย้อมไหมก็ยาก ข้อยต้องประหยัดน้ำครั่ง"
    - "สงกรานต์เจ้ามาดำหัวข้อยเด้อ ข้อยจะนุ่งซิ่นตีนจกตัวงามสุด"
  heart_low:
    - "เจ้าเป็นไผ มาจากไส ข้อยบ่เคยเห็นหน้า"
    - "ข้อยชื่อจันทร์ คนไทยพวน มาอยู่ที่นี่ตั้งแต่รุ่นปู่ย่า"
  heart_mid:
    - "ลูกหลานมาบ่อยแล้วเด้อ ข้อยดีใจ นั่งดูข้อยทอผ้าสิ"
    - "ข้อยจะสอนเจ้าจกลายดอกแก้วตัวเล็กๆ ก่อน ลายง่ายสุดแล้ว"
    - "เจ้าพูดไทยพวนได้หลายคำแล้วเด้อ ข้อยฟังแล้วชื่นใจ"
  heart_high:
    - "ซิ่นตีนจกผืนเก่าที่ข้อยเก็บไว้ แม่ข้อยทอตอนแต่งงาน อายุเกินร้อยปีแล้ว"
    - "ลูกสาวข้อยบ่สนใจทอผ้า ข้อยบ่ว่าหรอก แต่ข้อยย่านลายนี้จะหายไปพร้อมข้อย"
    - "ถ้าวันหนึ่งข้อยบ่อยู่ เจ้าไปงานกำฟ้าแทนข้อยเด้อ ไปบอกฟ้าว่าจันทร์ยังคิดถึง"
  topic_news:
    - "ปีนี้อำเภอจะจัดประกวดผ้าซิ่น ข้อยว่าจะส่งลายนาคเกี้ยวไปเด้อ"
    - "พ่อค้าจากในเมืองมากดราคาซิ่นข้อย บอกว่าผ้าพิมพ์ลายโรงงานถูกกว่า ข้อยบ่ขาย"
    - "บ่อทางหมู่สามแห้งอีกแล้ว ข้อยต้องไปตักน้ำคลองมาย้อมผ้า"
  topic_advice:
    - "งานกำฟ้าตั้งใจฟังเสียงฟ้าร้องเด้อ ร้องทางทิศไหนบอกได้ว่าฝนปีหน้าดีบ่ดี ไว้วางแผนปลูกข้าว"
    - "ข้าวจี่ทาไข่แล้วปิ้งไฟอ่อน กินแล้วเดินไกลบ่เมื่อย ข้อยห่อไปนาทุกวัน"
    - "ผ้าฝ้ายย้อมครามใส่ทำนาบ่ร้อน ทนกว่าเสื้อโรงงานหลายเท่า"
  topic_smalltalk:
    - "รู้บ่ ไทยพวนเฮาเรียกกลัวว่า ย่าน เด้อ แล้วเจ้าย่านผีบ่"
    - "ข้าวหลามข้อยบ่ใส่น้ำตาลหลาย หวานพอดีๆ คนเฒ่ากินได้"
  topic_about_self:
    - "ข้อยทอผ้ามาตั้งแต่สิบขวบ จกผิดลายทีไรแม่ตีมือทุกที"
    - "บรรพบุรุษข้อยอพยพมาจากเมืองพวนตั้งแต่สมัยโน้น ตอนนี้เหลือคนพูดพวนได้บ่กี่หลังคาเรือน"
  topic_about_others:
    - "บัวเพื่อนข้อย ปากบอกย่านผีแต่เล่าเรื่องผีเก่งที่สุดในตำบล"
    - "น้องมิวมักมานั่งดูข้อยทอผ้า ข้อยว่าเด็กคนนี้มือละเอียด"
    - "ปาล์ม อบต. มาถ่ายรูปผ้าข้อยไปลงเพจ ข้อยบ่รู้เพจคืออีหยัง แต่มีคนโทรมาสั่งซิ่น"
  gossip_theft:
    - "ข้อยได้ยินมาเด้อ แม่นบ่แม่นข้อยบ่รู้ แต่ถ้าแม่น เอาไปคืนเขาเสีย"
    - "คนพวนเฮาถือ ของบ่แม่นของเฮา บ่เอา"
  gossip_cheating:
    - "ใจคนเหมือนเส้นด้าย ดึงไปสองทางมันขาดเด้อ"
    - "ข้อยบ่ว่าอีหยัง แต่ซิ่นผืนเดียวนุ่งสองคนบ่ได้"
  gossip_unpaid_bill:
    - "ค้างเขาก็ค่อยๆ คืนเด้อ ข้อยก็เคยค้างค่าไหมพ่อค้า ทอผ้าใช้หนี้อยู่สองปี"
    - "บ่ต้องอายหรอก แต่อย่าหนีหน้าเขา"
  gossip_small_envelope:
    - "ซองน้อยบ่เป็นหยัง คนพวนเฮาไปงานบุญหอบข้าวหลามไปช่วยก็ได้"
    - "งานหน้าไปช่วยด้วยแรงเด้อ เจ้าภาพจำแรงได้ดีกว่าจำซอง"
  gossip_skip_longkhaek:
    - "เขาช่วยเจ้าแล้ว เจ้าบ่ไปช่วยเขาคืน ปีหน้าได้เกี่ยวคนเดียวเด้อ"
    - "สมัยข้อยสาวๆ ลงแขกเกี่ยวข้าวกันทั้งหมู่ ร้องเพลงไปด้วย บ่มีไผขาด"
  player_fainted:
    - "เจ้าโดนผีจับมาแม่นบ่ หน้าซีดหลาย มากินข้าวจี่ร้อนๆ ก่อน"
    - "คราวหน้าย่านก็เข้าวัดเลยเด้อ อย่าดื้อ"
  player_new_vehicle:
    - "รถใหม่งามหลาย พาข้อยไปส่งผ้าที่ตลาดนัดวันพุธบ้างเด้อ"
    - "ขับช้าๆ เด้อ ทางหน้าเฮือนข้อยหมาวิ่งตัดหลาย"
  player_lottery_win:
    - "ถูกหวยแม่นบ่ ระวังคนมายืมเด้อ เงินมาไวไปไว"
    - "เอาไปซื้อที่นาไว้ดีกว่า ดินบ่หนีไปไส"
  player_muddy:
    - "เปื้อนโคลนหลายแท้ ลงนามาแม่นบ่ อย่ามานั่งใกล้กี่ข้อยเด้อ ผ้าเปื้อน"
    - "ล้างตีนก่อนขึ้นเฮือนเด้อลูกหลาน ข้อยตักน้ำไว้ในโอ่งแล้ว"
  player_rich:
    - "เจ้ามีกินแล้วเด้อ ข้อยดีใจ มาสั่งซิ่นข้อยสักผืนบ่"
    - "มีแล้วอย่าลืมเฮือนพวนเฒ่าๆ หลังนี้เด้อ"
  player_in_debt:
    - "หนี้เหมือนด้ายพันกัน ค่อยๆ แก้ทีละปม ดึงแรงมันยิ่งแน่น"
    - "ข้อยมีข้าวมีปลาร้า มากินด้วยกันได้เด้อ"
  player_sick:
    - "บ่สบายบ่ ข้อยต้มน้ำใบเตยให้กิน แล้วไปหาหมอแอนเด้อ"
    - "นอนพักเด้อ อย่าฝืน ผ้าทอบ่เสร็จวันเดียว นาก็ไถบ่เสร็จวันเดียว"
  player_married:
    - "แต่งงานแล้วบ่ ข้อยจะทอผ้าขาวม้าให้คู่หนึ่ง ลายเดียวกันเด้อ"
    - "อยู่กันไปให้ยืดเหมือนเส้นไหมดีๆ เหนียวบ่ขาด"
  event_disaster:
    - "น้ำมาถึงกี่ข้อยแล้ว ช่วยข้อยยกขึ้นที่สูงหน่อยเด้อ"
    - "ผ้าเปียกข้อยตากใหม่ได้ แต่ไผบ่มีที่นอน มาเฮือนข้อยได้เด้อ"
  event_election:
    - "มีคนมาขอให้ข้อยนุ่งซิ่นยืนถ่ายรูปด้วย ข้อยบอกว่าซิ่นข้อยบ่ใช่ป้ายหาเสียง"
    - "ไผสัญญาว่าจะส่งเสริมผ้าทอ ข้อยฟังมาสามสิบปี ยังทอขายเองอยู่ดี"
  event_company_water:
    - "น้ำบ่อข้อยแห้งจนย้อมผ้าบ่ได้ สีด่างหมดเพราะน้ำน้อย"
    - "เขาว่าบริษัทสูบน้ำลึก ข้อยบ่รู้เรื่องลึกเรื่องตื้น รู้แต่ว่าบ่อข้อยแห้ง"
  event_festival_near:
    - "{festival} ใกล้แล้ว ข้อยต้องรีบทอซิ่นให้ทันนุ่งไปงานเด้อ"
    - "งาน{festival} เจ้ามาเด้อ ข้อยจะพาไปนั่งแถวหน้า"
  gift_love:
    - "{item} ของมักข้อยแท้ๆ ขอบใจหลายเด้อลูกหลาน"
    - "โอย ใจดีหลาย ข้อยจะเก็บไว้กินกับบัว"
  gift_like:
    - "ขอบใจเด้อ {item} นี่ข้อยมักอยู่"
    - "ดีเด้อ วันนี้ข้อยบ่ต้องไปตลาดแล้ว"
  gift_neutral:
    - "ขอบใจเด้อ ข้อยรับไว้"
    - "อ้อ {item} ข้อยวางไว้ข้างกี่ก่อนเด้อ"
  gift_dislike:
    - "ข้อยบ่ค่อยมักของแบบนี้ แต่ขอบใจเด้อ"
    - "อันนี้ข้อยให้หลานบ้านข้างๆ กินแทนเด้อ"
  gift_hate:
    - "ผ้าพิมพ์ลายโรงงานบ่ เอามาให้คนทอผ้าเนี่ยนะ ข้อยบ่เอาเด้อ"
    - "เก็บไปเถอะลูกหลาน อันนี้ข้อยรับบ่ได้แท้ๆ"
  birthday:
    - "วันเกิดเจ้าบ่ ข้อยผูกฝ้ายแขนให้ ขวัญเอ๋ยขวัญมาเด้อ"
    - "ข้อยทอผ้าเช็ดหน้าลายดอกแก้วไว้ให้ผืนหนึ่ง เก็บไว้ดีๆ"
  rare:
    - "คืนกำฟ้าปีหนึ่ง ข้อยได้ยินฟ้าร้องเหมือนเสียงแม่เรียกชื่อ ข้อยเลยรู้ว่าแม่ยังเฝ้าอยู่"
    - "ข้อยแอบทอชื่อผัวข้อยไว้ในลายตีนจกผืนหนึ่ง บ่มีไผอ่านออก นอกจากข้อย"
    - "สมัยสาวๆ ข้อยหนีพ่อไปดูหนังกลางแปลงงานวัด กลับมาโดนให้ทอผ้าเจ็ดวันบ่ได้ออกเฮือน"
  flirt: []
gifts:
  love: ["ข้าวหลาม", "ข้าวจี่", "เส้นไหม"]
  like: ["ปลานิลนึ่งมะนาว", "ข้าวเหนียวหมูปิ้ง", "น้ำตะไคร้"]
  dislike: ["ผัดไทย", "เครื่องดื่มชูกำลัง"]
  hate: ["ผ้าถุงพิมพ์ลายโรงงาน"]
choices:
  - id: chan_c1
    min_heart: 0
    prompt: "เจ้าว่าผ้าซิ่นผืนนี้ลายอะไรเอ่ย ทายข้อยดูสิ"
    options:
      - text: "ลายนาค"
        heart: 2
        reply: "แม่นแล้ว! ตาดีเด้อลูกหลาน นาคเกี้ยวคือลายประจำเฮือนข้อย"
      - text: "ลายดอกไม้"
        heart: 0
        reply: "ใกล้แล้วเด้อ ดอกแก้วอยู่ขอบล่าง ตัวกลางคือนาค"
      - text: "ผ้าพิมพ์โรงงานหรือเปล่า"
        heart: -2
        reply: "โอย พูดหยังแบบนั้น ข้อยจกมือทีละเส้นสามเดือนเด้อ"
  - id: chan_c2
    min_heart: 4
    prompt: "งานกำฟ้าปีนี้ เจ้าจะมาช่วยข้อยเผาข้าวหลามบ่"
    options:
      - text: "มาแน่ จะตัดไม้ไผ่มาด้วย"
        heart: 2
        reply: "ดีหลาย เลือกไผ่ข้าวหลามเด้อ ปล้องยาว เยื่อหนา ข้าวจะหอม"
      - text: "ถ้าไม่ติดงานจะไป"
        heart: 0
        reply: "บ่เป็นหยัง แต่คืนนั้นบ่มีผีเด้อ มาเที่ยวได้ทั้งคืน"
      - text: "ซื้อข้าวหลามตลาดนัดง่ายกว่า"
        heart: -1
        reply: "ซื้อได้ แต่ฟ้าบ่ได้ยินเสียงเจ้าหัวเราะรอบกองไฟเด้อ"
banter:
  - with: mew
    lines:
      - ["mew", "ยายจันทร์ หนูลองจกลายเองได้แล้ว แต่มันเบี้ยว"]
      - ["chan", "เบี้ยวบ่เป็นหยังเด้อหลาน ผืนแรกของข้อยก็เบี้ยวเหมือนปลาไหล"]
      - ["mew", "จริงเหรอยาย แล้วยายยังเก็บไว้ไหม"]
      - ["chan", "เก็บไว้สิ ไว้เตือนใจว่าคนเก่งก็เริ่มจากเบี้ยว"]
  - with: palm
    lines:
      - ["palm", "ยายจันทร์คะ อบต. อยากพาผ้าทอของยายไปออกงานในจังหวัดค่ะ"]
      - ["chan", "ไปได้เด้อ แต่ข้อยบ่ขึ้นเวทีนะ ข้อยย่านไมค์"]
      - ["palm", "ไม่ต้องขึ้นค่ะยาย หนูพูดแทน ยายนั่งทอให้คนดูเฉยๆ"]
      - ["chan", "ทอให้ดูได้ แต่ห้ามไผมาจับกี่ข้อยเด้อ"]
