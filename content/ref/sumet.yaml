choices:
  - id: sumet_c1
    min_heart: 0
    prompt: "เจริญพร โยมมาวัดวันนี้ มีอะไรค้างอยู่ในใจหรือเปล่า"
    options:
      - text: "แค่อยากมานั่งพักเฉยๆ"
        heart: 1
        reply: "ดีแล้ว นั่งตามสบายนะโยม ศาลานี้ไม่ต้องจองที่"
      - text: "กลัวผีจนนอนไม่หลับเลย"
        heart: 1
        reply: "กลัวเป็นธรรมดา ค่ำแล้วเดินทางที่มีไฟหรือแวะวัดไว้ก่อน เรื่องผ้ายันต์ไปคุยกับลุงจำรัสนะ"
      - text: "หลวงพ่อช่วยบอกเลขหน่อยสิ"
        heart: -1
        reply: "อาตมาบอกเลขไม่ได้หรอกโยม เลขเดียวที่อาตมารู้คือเลขที่บ้านโยม กลับไปรดน้ำผักเถอะ"
  - id: sumet_c2
    min_heart: 3
    prompt: "วันเสาร์นี้อาตมาจะพาเด็กๆ ปลูกต้นไม้ในป่าชุมชน โยมจะมาช่วยไหม"
    options:
      - text: "ไปแน่นอน จะเอาจอบไปด้วย"
        heart: 2
        reply: "อนุโมทนา โยมขุดหลุม เด็กๆ ปลูก อาตมาจะให้เณรต้นถือบัวรดน้ำตามหลัง"
      - text: "ถ้าว่างจะไปนะ"
        heart: 0
        reply: "ไม่เป็นไรโยม มาได้ก็มา ต้นไม้รอได้ ไม่รีบ"
      - text: "ปลูกไปก็โดนตัดอยู่ดี"
        heart: -1
        reply: "อาจจะใช่ แต่ถ้าไม่ปลูกเลย ก็ไม่มีอะไรเหลือให้รักษานะโยม"
  - id: sumet_c3
    min_heart: 5
    prompt: "บริษัทเสนอจะสร้างศาลาใหม่ถวายวัด แลกกับให้อาตมาช่วยพูดกับชาวบ้านเรื่องบ่อบาดาล โยมว่าอย่างไร"
    options:
      - text: "ศาลาเก่ายังใช้ได้ ใจชาวบ้านสำคัญกว่า"
        heart: 2
        reply: "อาตมาก็คิดอย่างนั้น ขอบใจที่ช่วยให้ใจอาตมานิ่งขึ้น"
      - text: "ให้ชาวบ้านประชุมตัดสินกันเองดีกว่า"
        heart: 1
        reply: "ดีนะ ให้ทุกคนได้พูด วัดเป็นที่ประชุม ไม่ใช่ที่ตัดสินแทนใคร"
      - text: "รับไว้ก่อน แล้วค่อยว่ากัน"
        heart: -1
        reply: "รับของเขาแล้วจะพูดตรงๆ ยากนะโยม อาตมาไม่อยากติดค้างใครทั้งนั้น"
  - id: sumet_c4
    min_heart: 7
    prompt: "อาตมาถามอะไรหน่อยได้ไหมโยม ทำไมถึงเลือกกลับมาทำนา ทั้งที่ในเมืองสะดวกกว่า"
    options:
      - text: "อยากอยู่ใกล้ดินกับคนที่รู้จัก"
        heart: 2
        reply: "อาตมาก็กลับมาด้วยเหตุผลเดียวกัน ดีใจที่มีเพื่อนคิดเหมือนกันนะโยม"
      - text: "ในเมืองก็ไม่ได้สบายอย่างที่คิด"
        heart: 1
        reply: "สบายกายกับสบายใจไม่เหมือนกัน โยมคงได้เรียนรู้มาแล้ว"
      - text: "ยังไม่แน่ใจ อาจกลับไปอีกก็ได้"
        heart: 0
        reply: "ไม่แน่ใจก็ไม่เป็นไร ระหว่างที่อยู่ที่นี่ อยู่ให้เต็มที่ก็พอ"
banter:
  - with: jamrat
    lines:
      - ["jamrat", "หลวงพ่อครับ เดือนนี้ค่าเช่าผ้ายันต์เข้าตู้มากผิดปกติ ผมจดไว้ครบแล้วครับ"]
      - ["sumet", "ดีแล้วลุง ติดบัญชีไว้หน้าศาลาเหมือนเดิมนะ ให้ญาติโยมเห็นทุกรายการ"]
      - ["jamrat", "ครับ แล้วขอเอาไปซ่อมหลังคาโรงครัวก่อน ป้าทองใบบ่นทุกวันว่าฝนรั่วใส่หม้อแกง"]
      - ["sumet", "ตามนั้นลุง แกงจืดจะได้ไม่จืดเพราะน้ำฝน"]
  - with: ton
    lines:
      - ["ton", "หลวงพ่อครับ ผีกลัวพระจริงไหมครับ"]
      - ["sumet", "ผีไม่ได้กลัวพระหรอกเณร ผีไม่ค่อยกล้าเข้าใกล้คนที่ใจนิ่ง"]
      - ["ton", "งั้นผมต้องนั่งสมาธิเยอะๆ ใช่ไหมครับ"]
      - ["sumet", "ใช่ แต่ไม่ใช่นั่งหลับแบบเมื่อวานนะเณร"]
  - with: kla
    lines:
      - ["kla", "หลวงพ่อครับ แปลงผักวัดปีนี้งามกว่าแปลงผมอีก"]
      - ["sumet", "ก็ดินที่กล้าสอนอาตมาหมักไงล่ะ"]
      - ["kla", "ถ้าทั้งตำบลทำแบบนี้ ไม่ต้องซื้อปุ๋ยเชื่อจากเสี่ยเฮงเลยครับ"]
      - ["sumet", "ใจเย็นๆ กล้า ชวนคนด้วยผักที่งาม ดีกว่าชวนด้วยคำพูดนะ"]
  - with: bua
    lines:
      - ["bua", "ท่านจ๊ะ ยายเอายาหม่องไพลมาถวาย ท่านเดินแปลงผักทั้งวันเข่าคงเมื่อย"]
      - ["sumet", "อนุโมทนายาย สูตรยายใช้ดีกว่ายาจากในอำเภออีก"]
      - ["bua", "เมื่อคืนยายได้ยินเสียงกอย กอย แถวป่าไผ่หลังวัดนะท่าน ชัดเลย"]
      - ["sumet", "อาตมาจะสวดแผ่เมตตาให้นะยาย ยายก็อย่าเดินทางนั้นตอนค่ำ"]
  - with: palm
    lines:
      - ["palm", "หลวงพ่อคะ ขอยืมศาลาจัดอบรมปุ๋ยหมักวันพุธได้ไหมคะ"]
      - ["sumet", "ได้เลยปาล์ม เสื่ออยู่ในตู้หลังธรรมาสน์ เดี๋ยวอาตมาให้เณรตั้งน้ำไว้"]
      - ["palm", "รอบที่แล้วคนมาแค่เจ็ดคนเองค่ะ"]
      - ["sumet", "เจ็ดคนที่กลับไปทำจริง ดีกว่าเจ็ดสิบคนที่มาเพราะข้าวกล่องนะ"]
