id: sumet
name: "พระอาจารย์สุเมธ"
role: "เจ้าอาวาสวัดดงเย็น พระนักพัฒนา ทำแปลงผักอินทรีย์และป่าชุมชนหลังวัด"
voice: "ใช้ภาษาพระ อาตมา โยม เจริญพร อนุโมทนา พูดช้า สุภาพ อบอุ่น ยกตัวอย่างจากไร่นามาเป็นธรรมะง่ายๆ ไม่เทศน์ยาว ชวนลงมือทำ ไม่พูดเรื่องเงินหรือหวย เรื่องเครื่องรางส่งต่อให้ลุงจำรัส"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "เจริญพรโยม {player} ตื่นเช้าดีนะ แดดยังไม่แรง เหมาะกับงานสวน"
    - "อาตมาเพิ่งกลับจากบิณฑบาต ทางหน้าบ้านโยมน้ำค้างยังเกาะหญ้าเต็มเลย"
    - "เช้านี้ฉันเสร็จแล้วอาตมาจะไปช่วยกล้าที่แปลงผักอินทรีย์ โยมว่างก็ไปด้วยกันนะ"
    - "หอกระจายข่าวหกโมงเช้าเพิ่งประกาศ ผู้ใหญ่สมศักดิ์ย้ำเรื่องประชุมหมู่บ้านสามรอบ โยมได้ยินไหม"
    - "เจริญพร กินข้าวก่อนออกนานะโยม ท้องว่างแล้วทำงานกลางแดด หน้ามืดได้ง่าย"
  greet_noon:
    - "เจริญพร เที่ยงแล้วแดดแรง พักใต้ร่มโพธิ์ก่อนก็ได้นะโยม ศาลามีน้ำฝนในโอ่ง"
    - "อาตมากวาดลานวัดอยู่ ใบมะขามร่วงทั้งวัน กวาดเสร็จก็ร่วงใหม่ เหมือนความคิดคนเรานั่นแหละ"
    - "บ่ายนี้โยมทำอะไรอยู่ ถ้าเหนื่อยก็นั่งก่อน งานไม่หนีไปไหนหรอก"
    - "เณรต้นแอบหลับในกุฏิอีกแล้ว อาตมาไม่ปลุกหรอก เด็กกำลังโตต้องนอน"
    - "มาวัดตอนบ่ายเงียบดีนะโยม ได้ยินแต่เสียงจักจั่นกับเสียงไม้กวาดทางมะพร้าว"
  greet_evening:
    - "เจริญพร ใกล้ค่ำแล้ว งานเสร็จก็รีบกลับบ้านนะโยม อย่าให้มืดกลางทาง"
    - "อีกสักพักอาตมาจะลงทำวัตรเย็น โยมอยากนั่งฟังก็ขึ้นมาบนศาลาได้"
    - "ฟ้าเย็นนี้สีส้มสวยนะโยม ทำงานมาทั้งวัน หยุดมองสักหน่อยก็ได้พักใจ"
    - "ถ้ากลัวตอนดึก ไปหาลุงจำรัสเรื่องผ้ายันต์ก่อนสองทุ่มนะโยม ลุงปิดโต๊ะตรงเวลามาก"
    - "หอกระจายข่าวรอบห้าโมงเย็นประกาศอะไร อาตมากวาดใบไม้อยู่ฟังไม่ทัน"
  greet_night:
    - "ดึกแล้วนะโยม ถ้ายังไม่ถึงบ้าน แวะเข้าเขตวัดก่อนได้เสมอ ศาลามีเสื่อมีหมอน"
    - "สามทุ่มแล้วอย่าเดินตามคันนาคนเดียวเลยโยม เลาะทางที่มีไฟถนนดีกว่า"
    - "อาตมากำลังจะจำวัด โยมนอนศาลาได้ ประตูวัดไม่เคยปิดสำหรับคนที่ต้องการที่พัก"
    - "หมาหอนทั้งหมู่บ้านเลยคืนนี้ อาตมาจะสวดแผ่เมตตาให้ โยมรีบเข้าที่ปลอดภัยนะ"
    - "เจริญพร กลัวก็ไม่ผิดหรอกโยม แต่อย่ากลัวจนวิ่งลงคูน้ำ ตั้งสติแล้วค่อยๆ ไป"
  weather_rain:
    - "ฝนมาแล้ว นาก็ชื่นใจ วันนี้โยมไม่ต้องรดน้ำ พักบ้างก็ได้"
    - "เข้ามาหลบฝนในศาลาก่อนโยม หลังคาสังกะสีดังหน่อย แต่ไม่รั่วแล้ว ช่างเปี๊ยกเพิ่งซ่อม"
    - "ฝนตกถนนลูกรังลื่นนะโยม ขี่รถช้าๆ หลุมหน้าวัดส่งคนไป รพ.สต. มาหลายรายแล้ว"
    - "อาตมาชอบเสียงฝนตกบนใบตอง ฟังแล้วใจเย็นลง โยมลองนั่งฟังสักครู่สิ"
  weather_hot:
    - "ร้อนแบบนี้ดื่มน้ำบ่อยๆ นะโยม หมอแอนบอกว่าคนเป็นลมแดดกลางนามาหลายคนแล้ว"
    - "ใต้ต้นโพธิ์หน้าโบสถ์เย็นที่สุดในตำบล โยมมานั่งพักได้ตลอด"
    - "แดดแรงขนาดนี้ อาตมาเลื่อนไปช่วยงานแปลงผักตอนเย็นแทน โยมก็อย่าฝืนนะ"
    - "ร้อนแค่ไหน ต้นไม้ที่ปลูกไว้ก็ให้ร่มคืน ปีหน้าเราปลูกเพิ่มกันอีกนะโยม"
  weather_storm:
    - "พายุเข้า อย่าออกไปไหนนะโยม ถ้าบ้านไม่แข็งแรง มาอยู่ศาลาวัดด้วยกันได้"
    - "ฟ้าผ่าแรง อย่ายืนใต้ต้นไม้ใหญ่กลางนา อาตมาเป็นห่วงคนที่ออกไปเลี้ยงควาย"
    - "ลมแรงขนาดนี้ หลังพายุเราไปช่วยกันดูบ้านคนแก่ในหมู่บ้านนะโยม"
    - "กิ่งมะขามหักขวางทางเข้าวัด เดี๋ยวพายุสงบอาตมากับเณรจะช่วยกันลากออก"
  weather_pm25:
    - "ฝุ่นควันเยอะ ใส่หน้ากากด้วยนะโยม อาตมาเองก็ไอทั้งคืน"
    - "ฟ้าขมุกขมัวแบบนี้ คงเผาตอซังกันอีกแล้ว อาตมาอยากชวนทุกคนไถกลบแทน ดินก็ได้ปุ๋ยด้วย"
    - "วันนี้อาตมาให้เณรงดกวาดลานวัด ฝุ่นฟุ้งเปล่าๆ โยมก็งดงานกลางแจ้งนานๆ นะ"
    - "หมอแอนเอาหน้ากากมาฝากไว้ที่ศาลา โยมหยิบไปได้เลย ไม่ต้องเกรงใจ"
  season_rainy:
    - "เข้าพรรษาแล้ว อาตมาอยู่วัดตลอดสามเดือน โยมมีอะไรมาหาได้ทุกเมื่อ"
    - "หน้าฝนนาเขียวทั้งทุ่ง อาตมาเห็นแล้วชื่นใจกว่าดูอะไรทั้งนั้น"
    - "ระวังปลิงตอนลงนานะโยม ยายบัวว่าเอายาเส้นถูขาไว้ แต่อาตมาว่าใส่บู๊ตยางง่ายกว่า"
    - "หน้านี้คนมาวัดน้อย ทุกคนอยู่ในนา อาตมากลับดีใจที่เขามีงานทำ"
    - "ฝนดีปีนี้ แต่ถ้าฝายเก่าพังอีก น้ำจะไหลทิ้งหมด อาตมาคิดเรื่องนี้อยู่ทุกวัน"
  season_cool:
    - "หน้าหนาวเช้าๆ หมอกลงทุ่ง บิณฑบาตตอนนี้สวยที่สุดในปีเลยโยม"
    - "หนาวแล้วนะโยม คนแก่ในหมู่บ้านหลายบ้านไม่มีผ้าห่มหนาๆ อาตมาคิดจะรวบรวมไปให้"
    - "ออกพรรษา กฐินผ่านไป เกี่ยวข้าวกันแล้ว ข้าวใหม่หอมไปทั้งตำบล"
    - "อากาศเย็นแบบนี้ปลูกผักกาด ผักชีดีนะโยม กล้าที่แปลงหลังวัดเพาะไว้เยอะเลย"
  season_dry:
    - "หน้าแล้งบ่อน้ำวัดลดลงทุกวัน ใช้น้ำกันประหยัดๆ นะโยม"
    - "ดินแตกระแหงแบบนี้ ต้นไม้ที่ปลูกปีก่อนยังรอด เพราะคลุมฟางไว้ โยมลองทำบ้าง"
    - "สงกรานต์ใกล้มาแล้ว ลูกหลานจะกลับบ้าน วัดคึกคักที่สุดก็ช่วงนี้"
    - "หน้าแล้งมีงานบวชหมู่ อาตมาอยากให้เด็กๆ ได้มาเรียนรู้จริง ไม่ใช่มาแค่แห่กลองยาว"
    - "ร้อนแล้งก็อย่าใจร้อนตามนะโยม น้ำน้อยต้องแบ่งกัน ไม่ใช่แย่งกัน"
  heart_low:
    - "เจริญพร โยมเพิ่งมาอยู่ใหม่ใช่ไหม คนที่นี่อัธยาศัยดี ค่อยๆ ทำความรู้จักกันไป"
    - "มีอะไรให้อาตมาช่วยไหมโยม วัดนี้เปิดให้ทุกคน ไม่ต้องเกรงใจ"
    - "อาตมาเห็นโยมทำงานในนาตั้งแต่เช้า ขยันดีนะ"
    - "ถ้ายังไม่รู้จักใคร ลองมาช่วยงานวัดบ่อยๆ เดี๋ยวก็รู้จักทั้งตำบลเอง"
    - "อย่าเพิ่งท้อนะโยม ที่ดินใหม่ต้องใช้เวลาปรับ คนมาใหม่ก็เหมือนกัน"
  heart_mid:
    - "โยม {player} มาพอดี อาตมาเก็บมะม่วงหลังกุฏิไว้ให้ลูกหนึ่ง เอาไปกินนะ"
    - "ช่วงนี้โยมเข้ากับคนในตำบลได้ดีขึ้นนะ ป้าทองใบชมว่าโยมล้างหม้อสะอาด"
    - "อาตมาอยากทำแปลงสาธิตผักไร้สารหลังวัด โยมช่วยดูดินให้หน่อยได้ไหม"
    - "วันพระนี้มาวัดไหมโยม ไม่ต้องหอบอะไรมา มานั่งฟังธรรมก็พอ"
    - "อาตมาดีใจที่โยมเลือกอยู่ที่นี่ คนหนุ่มสาวกลับบ้านน้อยลงทุกปี"
  heart_high:
    - "อาตมาก็ลูกชาวนาเหมือนกันนะโยม พ่อปลูกข้าวพันธุ์พื้นเมืองจนวันสุดท้าย อาตมายังเก็บเมล็ดไว้"
    - "ตอนบวชใหม่ อาตมาคิดว่าจะเรียนให้สูงแล้วอยู่วัดในเมือง สุดท้ายก็กลับมาที่นี่ เพราะที่นี่ยังต้องการคน"
    - "ต้นตะเคียนหลังโบสถ์ อาตมาปลูกกับแม่ตอนเก้าขวบ ตอนนี้สูงกว่ากุฏิแล้ว"
    - "บางคืนอาตมาก็คิดหนักเรื่องน้ำของตำบล พระก็คนนะโยม ยังต้องฝึกปล่อยวางทุกวัน"
    - "อาตมาไว้ใจโยมนะ ถ้าวันหนึ่งอาตมาต้องไปจำพรรษาที่อื่น ฝากดูแลป่าชุมชนกับเณรต้นด้วย"
  topic_news:
    - "วันอาทิตย์นี้วัดชวนลงแรงลอกคลองหน้าวัด โยมมาช่วยได้นะ ป้าทองใบจะทำแกงเลี้ยง"
    - "ปาล์มจาก อบต. จะมาอบรมทำปุ๋ยหมักที่ศาลาวัดสัปดาห์หน้า ใครมาก็ได้ ไม่ต้องลงชื่อ"
    - "ได้ยินว่าบ่อบ้านตาเผือกแห้งเร็วกว่าทุกปี อาตมาเป็นห่วงอยู่"
    - "ห้องสมุดเล็กๆ บนศาลามีคนเอาหนังสือเกษตรมาให้เพิ่ม โยมยืมไปอ่านได้ ไม่ต้องรีบคืน"
    - "งานวัดปีนี้จะมีหนังกลางแปลง เณรต้นตื่นเต้นจนนับวันถอยหลังทุกเช้า"
  topic_advice:
    - "ถ้าคืนไหนต้องเดินทางไกล ไปเช่าผ้ายันต์กับลุงจำรัสก่อนสองทุ่ม กันการถูกจับได้ครั้งหนึ่ง"
    - "ใส่บาตรตอนเช้าหรือช่วยงานวัดจะได้แต้มบุญ เอาไปแลกของกับลุงจำรัสได้ แต่อย่าทำเพราะแต้มอย่างเดียวนะโยม"
    - "เดินกลับดึกให้เลาะทางที่มีไฟถนน เปรตไม่เข้าแสงไฟ ส่วนวัดกับร้าน 24 ชม. ก็หลบได้ทั้งคืน"
    - "คลุมฟางที่โคนต้นไม้ไว้ หน้าแล้งจะเสียน้ำน้อยลงมาก อาตมาทำที่แปลงหลังวัดมาสามปีแล้ว"
    - "ตอซังอย่าเผา ไถกลบหรือหมักกับจุลินทรีย์ ดินจะดีขึ้นทุกปี ที่ อบต. ปาล์มมีหัวเชื้อแจก"
    - "เหนื่อยมากให้พักให้พอนะโยม คนที่เป็นลมกลางนาส่วนใหญ่ฝืนทำต่อตอนแดดเที่ยง"
  topic_smalltalk:
    - "ต้นมะม่วงหลังกุฏิปีนี้ติดลูกดก เณรต้นนับได้ร้อยกว่าลูก นับซ้ำได้ไม่เท่าเดิมสักรอบ"
    - "อาตมาหัดต่อกิ่งมะนาวอยู่ ติดบ้างตายบ้าง เหมือนทุกเรื่องในชีวิตนั่นแหละโยม"
    - "หมาวัดตัวดำชื่อ 'ถ่าน' อาตมาไม่ได้ตั้งนะ เณรตั้ง มันชอบนอนขวางบันไดโบสถ์"
    - "โยมเคยตั้งใจฟังกบร้องหน้าฝนไหม ฟังดีๆ มันร้องรับกันเป็นทำนองเลย"
    - "เมื่อวานลุงเชิดจอดรถเมล์รอยายแก่ๆ ขึ้นนานจนเลยเวลา แต่ไม่มีใครบ่นสักคน อาตมาว่านั่นแหละน้ำใจบ้านเรา"
  topic_about_self:
    - "อาตมาบวชมาสามสิบกว่าพรรษาแล้วโยม มาอยู่วัดดงเย็นได้สิบสองปี"
    - "ก่อนบวชอาตมาช่วยพ่อไถนาด้วยควาย ทุกวันนี้ยังจำวิธีเทียมแอกได้"
    - "อาตมาเรียนเรื่องเกษตรจากชาวบ้านมากกว่าจากหนังสือ ยายบัวสอนเรื่องสมุนไพร กล้าสอนเรื่องดิน"
    - "งานที่อาตมาภูมิใจคือป่าชุมชนหลังวัด ตอนมาใหม่มีแต่หญ้าคา ตอนนี้นกกลับมาทำรังแล้ว"
    - "อาตมาไม่เก่งเทศน์ยาวหรอกโยม ชอบชวนคนลงมือทำมากกว่า"
  topic_about_others:
    - "ลุงจำรัสละเอียดมาก จดบัญชีวัดทุกรายการลงสมุด ใครขอดูก็เปิดให้ดู อาตมาสบายใจ"
    - "เณรต้นยังเด็ก บางทีชาวบ้านมาถามอะไรแปลกๆ อาตมาฝากโยมช่วยดูด้วยนะ"
    - "ยายบัวรู้เรื่องสมุนไพรมากกว่าใครในตำบล อาตมายังไปขอยาหม่องไพลสูตรยายอยู่บ่อยๆ"
    - "กล้าเป็นคนใจดีแต่ใจร้อน อาตมาชอบไฟในตัวเขา แค่อยากให้เขาพักบ้าง"
    - "หมอแอนวิ่งงานทั้งวัน ถ้าโยมเห็นข่าวแปลกๆ ในกลุ่ม LINE ไปถามหมอแอนก่อนเชื่อนะ"
    - "ช่างเปี๊ยกซ่อมหลังคาศาลาให้โดยไม่คิดค่าแรง บอกขอแค่ข้าวกลางวันกับเสียงสวดตอนเย็น"
  gossip_theft:
    - "อาตมาได้ยินเรื่องของหาย ยังไม่เห็นกับตาก็จะยังไม่เชื่อ แต่ถ้าโยมพลาดไปจริง เอาไปคืนเขาเสียนะ"
    - "ข่าวลือวิ่งเร็วกว่ารถเมล์ลุงเชิด ถ้าโยมไม่ได้ทำ ก็ใช้ชีวิตตามปกติ เวลาจะพิสูจน์เอง"
    - "ถ้าลำบากถึงขั้นต้องหยิบของคนอื่น มาบอกอาตมาก่อน โรงครัววัดมีข้าวพอแบ่ง"
  gossip_cheating:
    - "เรื่องหัวใจอาตมาไม่ก้าวก่าย แต่ความซื่อตรงกับคนที่รักเรา เป็นของที่ซ่อมยากที่สุด"
    - "ได้ยินคนพูดกันอยู่ โยมคิดให้ดี ใครเจ็บเขาก็เจ็บจริง ไม่ได้เจ็บแค่ในข่าวลือ"
    - "ถ้าไม่จริงก็ปล่อยวาง ถ้าจริงก็พูดความจริงเสีย ทางหลังยากกว่า แต่ใจเบากว่า"
  gossip_unpaid_bill:
    - "ค้างอะไรไว้ก็ค่อยๆ เคลียร์ไปนะโยม ไปคุยกับเขาตรงๆ ดีกว่าหลบหน้า"
    - "อาตมาไม่ถามรายละเอียด แต่ถ้าทุกข์ใจจนนอนไม่หลับ มานั่งที่ศาลาก่อนก็ได้"
    - "คนลำบากไม่ใช่คนเลว อย่าให้ข่าวลือทำให้โยมอายจนไม่กล้าออกจากบ้าน"
  gossip_small_envelope:
    - "ซองหนาซองบางไม่ใช่เครื่องวัดใจ โยมไปช่วยงานด้วยแรงก็มีค่าเหมือนกัน"
    - "ใครพูดเรื่องซองก็ปล่อยเขาพูดไป ทำบุญด้วยใจที่สบาย บุญเกิดตรงนั้น"
    - "งานหน้าถ้ากำลังไม่พอ ไปช่วยครัวป้าทองใบสักครึ่งวัน เจ้าภาพจำน้ำใจได้นานกว่า"
  gossip_skip_longkhaek:
    - "ลงแขกคือการให้แรงแล้วรับแรงคืน โยมได้แรงเขามาแล้ว ไปคืนเขาด้วยนะ"
    - "อาตมาเข้าใจว่าโยมอาจติดธุระ แต่บอกเขาสักคำ ดีกว่าเงียบหาย"
    - "ตำบลนี้อยู่ได้เพราะช่วยกันเกี่ยวข้าว ถ้าทุกคนรอแต่รับ นาก็เกี่ยวไม่ทัน"
  player_fainted:
    - "เมื่อคืนโยมไปตื่นที่ รพ.สต. หรือ อาตมาเป็นห่วง ต่อไปค่ำแล้วแวะเข้าวัดก่อนนะ"
    - "เจริญพร ยังเพลียอยู่ไหม พักให้พอ วันนี้งานหนักเลื่อนได้ก็เลื่อน"
    - "อย่าอายเลยโยม คนในตำบลเจอกันมาแทบทุกบ้าน เอาเป็นบทเรียนว่าดึกแล้วอย่าเดินไกล"
  player_new_vehicle:
    - "รถใหม่หรือโยม ขับช้าๆ นะ ถนนหน้าวัดมีเด็กวิ่งข้ามบ่อย"
    - "ไฟหน้ารถช่วยตอนกลางคืนได้นะโยม แต่อย่าประมาท ผีบางตัวไม่กลัวแสง"
    - "อนุโมทนาด้วย มีรถแล้ววันไหนว่าง ช่วยพาคนแก่ไป รพ.สต. บ้างนะ"
  player_lottery_win:
    - "โชคมาก็ดีใจด้วยโยม แต่โชคมาแล้วก็ไปได้ อย่าให้มันพาเราห่างจากงานในนา"
    - "เจริญพร ได้ของดีมาแล้ว แบ่งให้พ่อแม่ก่อนนะ ที่เหลือใช้ให้เกิดประโยชน์"
    - "อาตมาไม่ได้ว่าอะไรหรอก แค่อย่าให้ครั้งเดียวกลายเป็นนิสัยก็พอ"
  player_muddy:
    - "โคลนเต็มตัวเลยโยม ลงนามาทั้งเช้าใช่ไหม ล้างมือล้างเท้าที่โอ่งหน้าศาลาก่อนนะ"
    - "อาตมาเห็นโคลนติดขาโยมแล้วนึกถึงพ่อ กลับจากนาทีไรเป็นแบบนี้ทุกวัน"
    - "เปื้อนโคลนไม่ใช่เรื่องน่าอายหรอกโยม เป็นรอยของคนทำงาน"
  player_rich:
    - "ช่วงนี้โยมทำกินได้ดี อาตมาดีใจด้วย อย่าลืมคนข้างบ้านที่ยังลำบากนะ"
    - "มีมากก็ต้องดูแลมาก อาตมาเห็นคนทุกข์ใจกับของที่มีมากกว่าของที่ขาดเสียอีก"
    - "ทำกินได้ดีแล้ว ลองชวนคนในตำบลมาทำงานด้วยบ้าง เขาจะได้ไม่ต้องไปโรงงานไกลบ้าน"
  player_in_debt:
    - "ทุกข์เรื่องนี้อย่าแบกไว้คนเดียวนะโยม กล้าที่สหกรณ์รู้เรื่องพวกนี้ดีกว่าอาตมา ไปคุยกับเขา"
    - "หน้าโยมดูเครียดนะ นอนไม่หลับก็มานั่งสมาธิกับอาตมาตอนเย็นได้"
    - "อะไรที่ผูกไว้ก็แก้ทีละปม อย่ากระชากทีเดียวทั้งเส้น เดี๋ยวยิ่งแน่น"
  player_sick:
    - "ไม่สบายหรือโยม ไปให้หมอแอนตรวจก่อน แล้วค่อยถามยายบัวเรื่องสมุนไพรเสริม"
    - "พักเถอะโยม ร่างกายเหมือนควายคู่ใจ ใช้หนักแล้วต้องให้มันพักบ้าง"
    - "อาตมาจะให้เณรต้นเอาข้าวต้มจากโรงครัวไปให้นะ กินแล้วนอนเยอะๆ"
  player_married:
    - "อนุโมทนาด้วยนะโยม ชีวิตคู่ต้องหมั่นรดน้ำพรวนดินเหมือนแปลงผัก"
    - "เจริญพร ขอให้ทั้งสองคนพูดกันดีๆ ขัดใจกันได้ แต่อย่านอนเคืองกันข้ามคืน"
    - "ดีใจด้วยโยม มีอะไรก็พากันมาวัดนะ อาตมาจำหน้าได้ทั้งคู่แล้ว"
  event_disaster:
    - "ศาลาวัดเปิดรับคนหนีน้ำแล้ว โยมช่วยขนเสื่อกับหม้อข้าวขึ้นศาลาได้ไหม"
    - "ของเสียหายซ่อมได้ คนต้องปลอดภัยก่อน อาตมาให้เณรไล่ดูบ้านคนแก่ทุกหลัง"
    - "ช่วงนี้ใครขาดอะไรให้มาบอกที่วัด ลุงจำรัสจดรายชื่อไว้ จะได้แบ่งของกันทั่วถึง"
  event_election:
    - "อาตมาไม่บอกหรอกว่าให้เลือกใคร เลือกด้วยใจตัวเองนะโยม อย่าเลือกเพราะของที่แจก"
    - "ฟังทุกคนให้จบก่อนตัดสินใจ ใครสัญญาอะไรไว้ จดไว้ด้วย วันหน้าจะได้ถามได้"
    - "ช่วงเลือกตั้งคนในตำบลขัดใจกันง่าย เลือกต่างกันได้ แต่อย่าเลิกคบกันเลย"
  event_company_water:
    - "บ่อหลายบ้านแห้งเร็วผิดปกติ อาตมาไม่ได้กล่าวหาใคร แต่ความทุกข์ของชาวบ้านเป็นของจริง"
    - "น้ำใต้ดินเป็นของทุกคนในตำบล ใครจะใช้มากควรมาคุยกันให้เปิดเผย"
    - "อาตมาชวนทุกฝ่ายมาประชุมที่ศาลาวัดแล้ว คุณธนาก็ด้วย ฟังกันก่อนค่อยว่ากัน"
  event_festival_near:
    - "{festival} ใกล้แล้ว โยมมาช่วยงานวัดนะ ครัวป้าทองใบต้องการคนหั่นผักอีกเยอะ"
    - "งาน{festival} ปีนี้อาตมาอยากให้คนในตำบลได้มาเจอกัน มากกว่าแข่งกันว่าใครจัดใหญ่"
    - "ใกล้{festival} แล้ว เณรต้นตื่นเต้นจนกวาดลานวัดเสร็จเร็วกว่าทุกวัน"
  gift_love:
    - "อนุโมทนานะโยม {item} นี้อาตมาดีใจมาก จะนำไปบูชาพระประธานก่อน"
    - "เจริญพร ของที่ทำด้วยมือโยมเองมีค่ามาก ขอให้นาข้าวงามทุกฤดูนะ"
    - "อนุโมทนา อาตมาจะแบ่งไปให้คนแก่ที่มาจำศีลบนศาลาด้วย ได้บุญสองต่อเลยโยม"
  gift_like:
    - "อนุโมทนา {item} นี้ดีนะโยม เณรต้นต้องดีใจแน่"
    - "เจริญพร ขอให้โยมมีความสุข ทำกินขึ้นนะ"
    - "ขอบใจโยม พรุ่งนี้เช้าอาตมาจะนำไปที่โรงครัว ให้ทุกคนได้ฉันได้กินด้วยกัน"
  gift_neutral:
    - "อนุโมทนานะโยม ของที่ให้ด้วยใจ อาตมารับด้วยใจ"
    - "เจริญพร ขอบใจที่นึกถึงวัด"
    - "อาตมาจะเก็บไว้ใช้ให้เกิดประโยชน์นะโยม"
  gift_dislike:
    - "ขอบใจที่ตั้งใจนะโยม แต่ของนี้พระฉันหลังเที่ยงไม่ได้ อาตมาจะให้คนบนศาลาแทนนะ"
    - "อาตมารับไว้ด้วยน้ำใจ แต่วันหลังนำไปให้ยายบัวดีกว่า แกน่าจะได้ใช้มากกว่า"
  gift_hate:
    - "ของนี้อาตมารับไม่ได้โยม ผิดวินัยสงฆ์ อาตมาไม่ได้โกรธนะ เก็บไว้เถอะ"
    - "เจริญพร อาตมารู้ว่าตั้งใจดี แต่พระรับของมึนเมาไม่ได้ ถ้าอยากทำบุญ ข้าวสารสักกระป๋องก็พอแล้ว"
  birthday:
    - "วันเกิดโยมหรือ ขอให้สุขภาพแข็งแรง ทำกินขึ้น จิตใจแจ่มใสนะ เจริญพร"
    - "มานี่โยม อาตมาผูกสายสิญจน์ให้ ให้จำไว้ว่ามีคนเป็นห่วงโยมอยู่"
    - "วันเกิดแล้ว ลองทำบุญด้วยการปลูกต้นไม้สักต้นสิโยม อาตมามีกล้าให้"
  rare:
    - "บางทีอาตมาก็คิดถึงข้าวเหนียวที่แม่นึ่งตอนเช้า กลิ่นมันลอยมาจากครัวทุกวันตอนเด็กๆ"
    - "เมื่อคืนอาตมาเห็นแสงเรืองๆ ริมคลอง ไม่รู้ผีโพงหรือหิ่งห้อย อาตมาเลือกเชื่อว่าหิ่งห้อย"
    - "เณรต้นถามว่าพระฝันไหม อาตมาบอกว่าฝัน เมื่อคืนฝันว่าฝายสร้างเสร็จแล้ว"
    - "อาตมาเกือบสึกตอนพรรษาที่สาม เพราะแม่ป่วย แต่แม่บอกให้อยู่ต่อ ทุกวันนี้อาตมายังสวดให้แม่ทุกคืน"
    - "รู้ไหมโยม ต้นโพธิ์หน้าโบสถ์มีรังนกกระจิบอยู่สามรัง อาตมานับทุกเช้า ไม่เคยบอกใคร"
