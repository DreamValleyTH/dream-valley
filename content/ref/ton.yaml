id: ton
name: "เณรต้น"
role: "สามเณรอายุ 11 ปี วัดดงเย็น ชาวบ้านแอบมาถามเลขแต่เณรไม่เข้าใจ"
voice: "เด็กใสซื่อ พูดสุภาพ ลงท้าย ครับ เรียกผู้เล่นว่า พี่ หรือ พี่ {player} ชอบนับของ ตื่นเต้นง่าย รักหมาวัดชื่อถ่าน หลังเที่ยงฉันไม่ได้จึงหิวตอนเย็นบ่อย ไม่มีเนื้อหาผู้ใหญ่ ไม่มีตลกร้าย"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "อรุณสวัสดิ์ครับพี่ {player} ผมเพิ่งเดินบิณฑบาตตามหลวงพ่อกลับมา ขาผมเมื่อยครับ"
    - "พี่ครับ เช้านี้ถ่านเดินตามบาตรผมไปถึงหน้าร้านป้าแต๋วเลยครับ"
    - "ผมตื่นตีห้าครับ ยังง่วงอยู่ แต่หลวงพ่อบอกว่าง่วงก็ต้องกวาดลาน"
  greet_noon:
    - "เที่ยงแล้วครับ ผมฉันเพลเสร็จแล้ว หลังเที่ยงห้ามฉัน ผมเลยดื่มน้ำเยอะๆ"
    - "พี่ครับ ผมท่องบทสวดได้ใหม่อีกบทแล้ว ฟังไหมครับ"
  greet_evening:
    - "เย็นแล้วครับ เดี๋ยวผมต้องไปตีระฆังทำวัตรเย็น ผมนับเองครับ ไม่เคยตีเกิน"
    - "ท้องผมร้องแต่ห้ามฉันแล้วครับ ผมเลยไปนั่งฟังเสียงกบแทน"
  greet_night:
    - "พี่ครับ ดึกแล้ว เข้ามาในวัดเร็วครับ ผมกลัวแทนพี่แล้ว"
    - "หลวงพ่อบอกว่าวัดปลอดภัยครับ ผมเลยนอนหลับสบาย แต่ผมก็ยังเปิดไฟฉายไว้ข้างหมอน"
  weather_rain:
    - "ฝนตกครับ ผมรองน้ำฝนใส่โอ่งได้สามโอ่งแล้ว"
    - "ฝนตกไม่ต้องกวาดลานครับ แต่ต้องเก็บใบไม้เปียก ยากกว่าอีกครับ"
  weather_hot:
    - "ร้อนจนถ่านไปนอนใต้ถุนศาลาครับ ผมอยากไปนอนด้วย"
    - "ร้อนครับพี่ ผมเอาผ้าชุบน้ำวางบนหัวเหมือนที่ยายบัวสอน"
  weather_storm:
    - "ฟ้าร้องดังมากครับ ผมไม่กลัวนะครับ…ผมแค่ไปนั่งใกล้ๆ หลวงพ่อเฉยๆ"
    - "ลมพัดจีวรปลิวเลยครับ ผมต้องจับไว้สองมือ"
  weather_pm25:
    - "ฝุ่นเยอะครับ หลวงพ่อให้ผมงดกวาดลาน ผมเลยไปอ่านหนังสือแทน"
    - "ผมใส่หน้ากากที่หมอแอนให้ครับ สีฟ้า เข้ากับจีวรไหมครับพี่"
  season_rainy:
    - "เข้าพรรษาแล้วครับ ผมช่วยหลวงพ่อแกะเทียนพรรษา ผมแกะได้เป็นรูปปลาครับ"
    - "หน้าฝนกบเยอะมากครับ ผมนับได้ยี่สิบสามตัวแถวสระวัด"
  season_cool:
    - "หนาวครับพี่ ผมห่มจีวรสองชั้นยังหนาวอยู่เลย"
    - "หน้าหนาวมีงานวัดครับ มีหนังกลางแปลง ปีนี้ผมจะดูให้จบ ปีที่แล้วหลับก่อนครับ"
  season_dry:
    - "หน้าแล้งสระวัดแห้งครับ ปลาเหลือน้อย ผมกับหลวงพ่อตักปลาไปปล่อยคลอง"
    - "ใกล้สงกรานต์แล้วครับ แม่ผมจะมาเยี่ยม ผมนับวันอยู่ครับ"
  heart_low:
    - "สวัสดีครับ ผมเณรต้นครับ อยู่วัดดงเย็นครับ"
    - "พี่เป็นคนใหม่ใช่ไหมครับ ผมจำหน้าคนในตำบลได้เกือบหมดแล้ว แต่ยังไม่รู้จักพี่"
  heart_mid:
    - "พี่ {player} มาแล้ว ผมเก็บมะม่วงหล่นไว้ให้ลูกหนึ่งครับ ไม่ได้ปีนนะครับ"
    - "พี่ครับ ผมสอนถ่านนั่งได้แล้ว แต่มันนั่งเฉพาะตอนมีข้าว"
    - "ผมฝึกเขียนชื่อพี่ในสมุดด้วยครับ ลุงจำรัสบอกว่าลายมือผมเหมือนไก่เขี่ย"
  heart_high:
    - "ผมบวชเพราะที่บ้านไม่มีเงินส่งเรียนครับ แต่ตอนนี้ผมชอบอยู่วัดแล้ว ได้เรียนหนังสือด้วย"
    - "ผมคิดถึงแม่ครับ แม่ไปทำงานโรงงานไกล โทรมาวันอาทิตย์ หลวงพ่อให้ยืมโทรศัพท์คุย"
    - "โตขึ้นผมอยากเป็นหมอเหมือนหมอแอนครับ หรือเป็นพระเหมือนหลวงพ่อ ผมยังเลือกไม่ได้"
  topic_news:
    - "เมื่อวานลุงสมหมายมาถามผมว่าฝันอะไร ผมบอกว่าฝันเห็นถ่าน แกรีบจดใส่ฝ่ามือเลยครับ"
    - "หลวงพ่อบอกว่าวันเสาร์จะปลูกต้นไม้ในป่าชุมชน ผมได้ถือบัวรดน้ำครับ"
    - "ครูเต้ยเอาหนังสือการ์ตูนความรู้มาให้ห้องสมุดวัดครับ ผมอ่านจบไปสองเล่มแล้ว"
  topic_advice:
    - "ถ้าพี่หลงทางตอนกลางคืน วัดเปิดไฟทั้งคืนครับ มองหาแสงไฟโบสถ์ก็เจอ"
    - "ใส่บาตรตอนเช้าได้แต้มบุญครับ เอาไปแลกของกับลุงจำรัสได้ ผมรู้เพราะช่วยลุงนับ"
    - "ถ้าได้ยินหมาหอนตอนสองทุ่มครึ่ง แปลว่าผีใกล้ออกแล้วครับ พี่รีบกลับบ้านนะครับ"
  topic_smalltalk:
    - "พี่ครับ ทำไมกบร้องตอนฝนตกครับ ผมว่ามันดีใจเหมือนผม"
    - "ผมนับใบโพธิ์ที่ร่วงวันนี้ได้สองร้อยกว่าใบครับ แล้วลมก็พัดมาใหม่ ผมเลยเลิกนับ"
  topic_about_self:
    - "ผมอายุสิบเอ็ดครับ บวชมาสองปีแล้ว ท่องบทสวดได้สิบสองบทครับ"
    - "ผมมาจากหมู่สี่ครับ บ้านติดคลอง ผมว่ายน้ำเก่งที่สุดในวัด แต่หลวงพ่อไม่ให้ว่ายตอนฝนตก"
  topic_about_others:
    - "หลวงพ่อสุเมธใจดีที่สุดครับ แต่ถ้าผมหลับตอนทำวัตร หลวงพ่อจะให้ผมย้ายไปนั่งแถวหน้า"
    - "ลุงจำรัสนับเหรียญเร็วมากครับ ผมช่วยนับได้แค่เหรียญบาท"
    - "ลุงสมหมายชอบมาถามว่าผมฝันอะไร ผมไม่เข้าใจครับว่าทำไมความฝันต้องเป็นเลข"
  gossip_theft:
    - "พี่ครับ มีคนบอกว่าพี่เอาของคนอื่นไป ผมไม่เชื่อครับ พี่ไม่ได้เอาใช่ไหมครับ"
    - "หลวงพ่อสอนว่าถ้าเผลอเอาของคนอื่นมา ให้เอาไปคืนแล้วขอโทษครับ ผมเคยคืนลูกแก้วน้องโอ๊ตแล้ว"
  gossip_cheating:
    - "พี่ครับ ป้าแต๋วบอกว่าพี่มีแฟนสองคน มีได้ด้วยเหรอครับ ผมมีเพื่อนสนิทคนเดียวเอง"
    - "ผมไม่ค่อยเข้าใจเรื่องนี้ครับ แต่หลวงพ่อบอกว่าพูดความจริงดีที่สุดครับ"
  gossip_unpaid_bill:
    - "พี่ค้างเงินเขาเหรอครับ ผมก็เคยค้างดินสอน้องมิวแท่งหนึ่ง ผมคืนแล้วครับ"
    - "ไม่เป็นไรครับพี่ ค่อยๆ คืนนะครับ"
  gossip_small_envelope:
    - "ซองคืออะไรครับ ผมเห็นลุงจำรัสนับทุกงาน แต่ลุงไม่ยอมให้ผมดู"
    - "หลวงพ่อบอกว่าทำบุญด้วยแรงก็ได้ครับ ผมช่วยยกเก้าอี้ทุกงานเลย"
  gossip_skip_longkhaek:
    - "ลงแขกสนุกนะครับพี่ มีข้าวเหนียวไก่ย่าง ทำไมพี่ไม่ไปครับ"
    - "ตาเผือกนั่งรอพี่อยู่ที่นาครับ ผมเห็นตอนบิณฑบาต"
  player_fainted:
    - "พี่โดนผีจับเหรอครับ น่ากลัวไหมครับ ผมสวดให้แล้วครับ บทที่ผมท่องคล่องที่สุด"
    - "พี่ครับ คราวหน้ามานอนศาลาวัดนะครับ ผมจะแบ่งหมอนให้"
  player_new_vehicle:
    - "รถใหม่เหรอครับ มีแตรไหมครับ บีบให้ผมฟังทีครับ"
    - "ไฟหน้ารถสว่างมากเลยครับ ผีต้องตาพร่าแน่ๆ"
  player_lottery_win:
    - "พี่ถูกหวยเหรอครับ ลุงสมหมายถามว่าใช้เลขจากความฝันผมหรือเปล่า ผมฝันเห็นถ่านเองครับ"
    - "หลวงพ่อบอกว่าโชคอยู่กับเราไม่นานครับ ผมจำมาบอกพี่"
  player_muddy:
    - "พี่เปื้อนโคลนเหมือนควายตาเผือกเลยครับ…ผมไม่ได้ว่านะครับ ผมชอบควาย"
    - "ล้างที่โอ่งหน้าศาลาได้ครับ เดี๋ยวผมตักน้ำให้"
  player_rich:
    - "พี่แต่งตัวสวยจังครับวันนี้ จะไปอำเภอเหรอครับ"
    - "ป้าแต๋วบอกว่าพี่รวยแล้ว รวยคืออะไรครับ กินขนมครกได้ทุกวันเหรอครับ"
  player_in_debt:
    - "พี่ดูเหนื่อยครับ ผมให้มะม่วงหล่นลูกนี้ครับ ไม่ต้องคืนครับ"
    - "หลวงพ่อบอกว่าเรื่องยากให้แก้ทีละนิดครับ ผมทำการบ้านก็ทำทีละข้อ"
  player_sick:
    - "พี่ไม่สบายเหรอครับ ผมจะสวดให้หายเร็วๆ ครับ"
    - "ยาของยายบัวขมมากครับ ผมเคยกิน แต่หายจริงครับ"
  player_married:
    - "พี่แต่งงานแล้วเหรอครับ งานมีขนมเยอะไหมครับ ผมไปได้แค่ตอนเช้านะครับ"
    - "ยินดีด้วยครับ ผมจะสวดชยันโตให้ ผมท่องคล่องแล้วครับ"
  event_disaster:
    - "น้ำท่วมครับพี่ ผมช่วยหลวงพ่อขนเสื่อขึ้นศาลาแล้วครับ"
    - "บ้านแม่ผมอยู่ริมคลองครับ ผมเป็นห่วง หลวงพ่อบอกว่าจะพาไปดู"
  event_election:
    - "มีรถแห่ผ่านหน้าวัดเสียงดังมากครับ ถ่านเห่าทั้งวันเลย"
    - "ผมยังเลือกตั้งไม่ได้ครับ แต่ถ้าได้ ผมจะเลือกคนที่ซ่อมชิงช้าโรงเรียน"
  event_company_water:
    - "สระวัดแห้งเร็วครับ ปลาที่ผมตั้งชื่อไว้หายไปหลายตัว"
    - "หลวงพ่อบอกว่าน้ำเป็นของทุกคนครับ ผมแบ่งน้ำให้ถ่านกินด้วย"
  event_festival_near:
    - "ใกล้{festival} แล้วครับ ผมตื่นเต้นจนนอนไม่หลับ"
    - "งาน{festival} ผมได้ช่วยตีกลองครับ ผมซ้อมกับกะละมังอยู่"
  gift_love:
    - "{item} ของโปรดผมเลยครับ ขอบคุณครับพี่ ผมจะเก็บไว้ฉันพรุ่งนี้เช้า"
    - "ว้าว ขอบคุณครับ ผมจะแบ่งหลวงพ่อด้วยครับ"
  gift_like:
    - "ขอบคุณครับพี่ {item} อร่อยแน่เลยครับ"
    - "ผมชอบครับ ขอบคุณที่นึกถึงผมครับ"
  gift_neutral:
    - "ขอบคุณครับพี่"
    - "อันนี้ผมจะเอาไปให้ลุงจำรัสดูก่อนนะครับ"
  gift_dislike:
    - "ขอบคุณครับ…ผมไม่ค่อยชอบผักนี้ครับ แต่หลวงพ่อบอกว่าต้องกินผัก"
    - "อันนี้เผ็ดครับพี่ ผมกินแล้วน้ำตาไหล"
  gift_hate:
    - "ผมรับลอตเตอรี่ไม่ได้ครับพี่ หลวงพ่อบอกว่าเณรห้ามยุ่งเรื่องนี้ครับ"
    - "เผ็ดมากครับ ผมกินไม่ได้จริงๆ ครับ ขอโทษครับ"
  birthday:
    - "สุขสันต์วันเกิดครับพี่ ผมวาดรูปพี่กับถ่านให้ครับ"
    - "วันเกิดพี่ ผมจะสวดให้สามรอบเลยครับ"
  rare:
    - "ผมเคยเห็นหิ่งห้อยเป็นร้อยตัวที่ป่าชุมชนครับ หลวงพ่อบอกว่าเป็นเพราะเราช่วยกันปลูกต้นไม้"
    - "บางทีผมก็แอบร้องไห้คิดถึงแม่ครับ แต่ถ่านมานอนข้างๆ ผมเลยหายเศร้า"
    - "ผมฝันว่าผมเป็นเรือยาวครับ แล้วลุงสมหมายก็มาถามว่าเรือลำที่เท่าไหร่"
  flirt: []
gifts:
  love: ["ขนมครก", "กล้วยบวชชี", "ข้าวเหนียวมะม่วง"]
  like: ["กล้วยน้ำว้า", "น้ำมะพร้าวปั่น", "ข้าวต้มปลา"]
  dislike: ["ผัดผักบุ้งไฟแดง", "ส้มตำไทย"]
  hate: ["หน่อไม้ผัดพริก", "ลอตเตอรี่"]
choices:
  - id: ton_c1
    min_heart: 0
    prompt: "พี่ครับ ลุงสมหมายขอให้ผมฝันเป็นเลขให้ ผมต้องทำยังไงครับ"
    options:
      - text: "ไม่ต้องทำอะไร ฝันอะไรก็ฝันไป"
        heart: 2
        reply: "จริงเหรอครับ ดีจัง เมื่อคืนผมฝันว่าถ่านได้กินไก่ทอด ผมไม่อยากให้มันเป็นเลขครับ"
      - text: "บอกลุงไปว่าให้ไปถามหลวงพ่อ"
        heart: 1
        reply: "ดีครับ! ลุงสมหมายกลัวหลวงพ่อ เดี๋ยวลุงต้องอยู่ช่วยกวาดลานแน่เลย"
      - text: "ฝันเลขมาให้พี่ด้วยสิ"
        heart: -2
        reply: "พี่ก็ด้วยเหรอครับ… ผมฝันเป็นเลขไม่เป็นครับ ผมฝันเป็นหมา"
  - id: ton_c2
    min_heart: 4
    prompt: "พี่ครับ ช่วยผมฝึกท่องบทสวดหน่อยได้ไหมครับ พี่ถือหนังสือ ผมท่อง"
    options:
      - text: "ได้สิ เริ่มเลย"
        heart: 2
        reply: "…จบแล้วครับ! ผิดไปสองคำ แต่พรุ่งนี้ผมจะไม่ผิดครับ"
      - text: "พี่รีบอยู่ ไว้วันหลังนะ"
        heart: 0
        reply: "ได้ครับ งั้นผมท่องให้ถ่านฟังก่อน"
      - text: "ท่องทำไม ไปเล่นกันดีกว่า"
        heart: -1
