id: toey
name: "ครูเต้ย"
role: "ครูโรงเรียนบ้านดงเย็น โรงเรียนประจำตำบล สอนทุกวิชาตั้งแต่ ป.3 ถึง ป.6 อายุ 29"
voice: "อ่อนโยน เป็นระเบียบ เรียกตัวเองว่า 'ครู' กับทุกคน ลงท้าย 'จ้ะ' 'นะ' ชอบให้คะแนนทุกอย่าง เช่น 'อันนี้ครูให้เก้าเต็มสิบ' ติดพูดแบบสอนหน้าห้อง 'ตั้งใจฟังนะ…' พกปากกาแดงกับสติกเกอร์ดาวติดกระเป๋า"
dark_humor: false
romanceable: true
personality: "ใจดี อดทน ตลกแบบครู แอบดื้อเงียบเวลาเรื่องเด็ก เหนื่อยจากเอกสารแต่ไม่เคยเหนื่อยจากเด็ก"
backstory: "โรงเรียนเหลือนักเรียนสี่สิบสองคน เขตพื้นที่จะยุบรวมกับโรงเรียนในอำเภอถ้าต่ำกว่าเกณฑ์ ครูเต้ยสอนหกวิชา ทำเอกสารประเมินอีกสิบสองแฟ้ม ซื้ออุปกรณ์การเรียนด้วยเงินตัวเอง และมีหนี้สหกรณ์ออมทรัพย์ครูก้อนใหญ่จากค่ารักษาแม่ ถ้าโรงเรียนถูกยุบ เด็กๆ ต้องนั่งรถไปเรียนวันละชั่วโมง และครูอาจถูกย้ายไปไกลบ้าน"
courtship: "ชอบคนที่ใจดีกับเด็กและคนแก่ ช่วยงานโรงเรียน อ่านหนังสือด้วยกัน ให้ของเล็กๆ ที่ใช้ในห้องเรียนได้ ไม่ชอบคนพูดจาหยาบหรือดูถูกคนอื่น"
lines:
  greet_morning:
    - "อรุณสวัสดิ์จ้ะ {player} ครูกำลังไปเปิดประตูโรงเรียน เด็กๆ มารอตั้งแต่หกโมงครึ่งเพราะอยากได้นมกล่อง"
    - "เช้านี้ครูต้องเข้าแถวเคารพธงชาติ สอนสามคาบ แล้วส่งรายงานอีกสองแฟ้ม ครูให้ตัวเองสิบเต็มสิบสำหรับความกล้า"
    - "หอกระจายข่าวเมื่อเช้าบอกว่าฝนจะตก ครูเลยเอาร่มมาห้าคัน เผื่อเด็กๆ ลืม ทุกวันมีคนลืม"
    - "ตื่นเช้าแบบนี้ ครูให้ดาวหนึ่งดวงนะ ล้อเล่น ผู้ใหญ่ก็อยากได้ดาวเหมือนกันใช่ไหมล่ะ"
    - "แวะซื้อปาท่องโก๋มาฝากเด็กๆ ครูซื้อเกินมาสามตัว เอาไปตัวหนึ่งไหมจ๊ะ"
  greet_noon:
    - "เที่ยงแล้วจ้ะ ครูเพิ่งตักข้าวกลางวันให้เด็กสี่สิบสองคน ผัดผักจากสหกรณ์ของกล้า หมดเกลี้ยงเลย"
    - "พักกลางวันครูได้แค่ยี่สิบนาที ที่เหลือต้องเฝ้าเด็กไม่ให้ปีนต้นมะม่วง"
    - "ร้อนนะ ครูเปิดพัดลมให้เด็กทุกตัวในห้อง ห้องพักครูเลยไม่มีพัดลมเหลือ"
    - "ครูกำลังตรวจการบ้าน น้องโอ๊ตเขียนเรียงความเรื่อง 'ควายของฉัน' แต่บ้านเขาไม่มีควาย ครูให้คะแนนจินตนาการเต็ม"
    - "บ่ายนี้มีศึกษานิเทศก์มาตรวจ ครูขอยิ้มซ้อมก่อนนะ… โอเค พร้อมแล้ว ไม่พร้อม"
  greet_evening:
    - "เลิกเรียนแล้วจ้ะ ครูยังต้องอยู่ทำเอกสารอีกสองชั่วโมง แต่ขอเดินเล่นสิบนาทีก่อน"
    - "เย็นนี้ครูไปส่งน้องมิวกับน้องโอ๊ตที่บ้านมา พ่อแม่เขายังไม่กลับจากนา"
    - "แสงเย็นแบบนี้สนามโรงเรียนสวยมาก ครูอยากให้คนจากเขตพื้นที่มาเห็นตอนนี้ ไม่ใช่ดูแต่ตัวเลข"
    - "หอกระจายข่าวห้าโมงเปิดเพลงเดียวกับที่ครูใช้สอนเด็กรำวง เด็กๆ เลยรำกันกลางทาง"
    - "ไปตลาดนัดไหมจ๊ะ ครูจะไปซื้อสีเทียนกับกระดาษสีให้เด็กทำโครงงาน ใช้เงินครูเองเหมือนเดิม"
  greet_night:
    - "สองทุ่มแล้วจ้ะ ครูเพิ่งออกจากโรงเรียน รีบกลับบ้านกันเถอะ"
    - "ครูสั่งเด็กๆ ทุกคนว่าอย่าอยู่นอกบ้านหลังสองทุ่ม ผู้ใหญ่ก็ควรทำตามนะ ครูให้การบ้านข้อนี้"
    - "หมาเริ่มหอนแล้ว ครูยังไม่ได้เช่าตะกรุดเลย พรุ่งนี้แวะวัดก่อนเข้าแถว"
    - "ถ้ากลับไม่ทัน ห้องสมุดวัดดงเย็นหลบได้นะ ครูเอาหนังสือไปบริจาคไว้เยอะ อ่านรอเช้าได้"
    - "ดึกแล้ว ครูยังตรวจสมุดไม่เสร็จ แต่จะไปตรวจต่อที่บ้าน ไม่ตรวจกลางทุ่งหรอก"
  weather_rain:
    - "ฝนตกจ้ะ หลังคาห้อง ป.4 รั่วอีกแล้ว ครูย้ายเด็กไปเรียนที่โรงอาหาร สอนเรื่องวัฏจักรน้ำของจริงเลย"
    - "ฝนแบบนี้เด็กหลายคนไม่มาเรียน ถนนเข้าหมู่ 4 เป็นหลุม รถพ่อแม่เข้าไม่ได้"
    - "ครูให้เด็กๆ วาดรูปฝน น้องมิววาดกบใส่ร่ม ครูให้สิบเต็มสิบ"
    - "ฝนตกครูชอบนะ อ่านหนังสือให้เด็กฟังในห้อง เสียงฝนเป็นดนตรีประกอบฟรี"
    - "ระวังไข้เลือดออกนะจ๊ะ ครูให้เด็กๆ เดินคว่ำกะลาทั่วโรงเรียนเป็นการบ้านแล้ว"
  weather_hot:
    - "ร้อนจนเด็กหลับในห้องครึ่งชั้น ครูเลยเปลี่ยนเป็นสอนใต้ต้นจามจุรีแทน"
    - "ดื่มน้ำเยอะๆ นะจ๊ะ ครูเห็นเด็กเป็นลมแดดตอนเข้าแถวปีที่แล้ว ตั้งแต่นั้นเข้าแถวในร่มอย่างเดียว"
    - "ตู้กดน้ำเย็นโรงเรียนเสียมาสองเดือน ครูทำเรื่องขอซ่อมไปแล้วสามแผ่น ตอนนี้ครูซื้อน้ำแข็งมาเอง"
    - "ร้อนแบบนี้อย่าทำงานกลางแดดนานนะ ครูไม่อยากให้ผู้ใหญ่ทำผิดตัวอย่างให้เด็กเห็น"
    - "ครูทำน้ำมะนาวโซดาไว้ในกระติก แจกเด็กหมดแล้ว เหลือแต่น้ำแข็ง เอาไหมจ๊ะ"
  weather_storm:
    - "พายุเข้า! ครูปล่อยเด็กกลับก่อนเวลาแล้ว และโทรหาผู้ปกครองครบทุกคน สี่สิบสองสาย"
    - "หน้าต่างห้อง ป.5 แตกไปบานหนึ่ง ครูเอาแผนที่ประเทศไทยปิดไว้ก่อน ได้ใช้ประโยชน์สักที"
    - "อย่าออกไปทุ่งนะจ๊ะ ครูไม่อยากต้องเล่าให้เด็กฟังว่าผู้ใหญ่ทำอะไรไม่ปลอดภัย"
    - "ถ้าบ้านใครเสียหาย โรงเรียนเปิดเป็นที่พักชั่วคราวได้นะ ครูขออนุญาตผู้อำนวยการแล้ว"
    - "หอกระจายข่าวซ่าจนเด็กๆ คิดว่าเป็นเสียงผี ครูต้องอธิบายเรื่องคลื่นวิทยุอยู่ครึ่งชั่วโมง"
  weather_pm25:
    - "ฝุ่นหนามากจ้ะ ครูงดเข้าแถวกลางแจ้ง งดพละ เด็กๆ เสียใจที่สุดคือไม่ได้เตะบอล"
    - "ครูแจกหน้ากากให้เด็กทุกคน ซื้อมาจากร้านขายยาเภสัชกรมด เขาลดให้ครึ่งราคา"
    - "ครูสอนเด็กทำเครื่องฟอกอากาศจากพัดลมกับแผ่นกรอง ได้ผลจริงนะ ห้องเรียนอากาศดีขึ้นเลย"
    - "ฝุ่นแบบนี้ครูห่วงเด็กที่เป็นหอบหืดมาก มีสามคนในโรงเรียน ครูจำชื่อยาของทุกคนได้"
    - "ช่วยบอกผู้ใหญ่ในตำบลเลิกเผาฟางหน่อยนะ ครูบอกเด็กได้ แต่เด็กบอกพ่อแม่แล้วพ่อแม่ไม่ฟัง"
  season_rainy:
    - "เปิดเทอมแล้วจ้ะ ครูนับเด็กได้สี่สิบสองคน ลดลงสามคนจากปีก่อน ย้ายไปเรียนในอำเภอ"
    - "เข้าพรรษา ครูพาเด็กๆ ไปแห่เทียนที่วัดดงเย็น น้องมิวถือเทียนเล่มเล็กที่สุดแต่ภูมิใจที่สุด"
    - "ช่วงปักดำเด็กหลายคนลาไปช่วยพ่อแม่ ครูไม่ว่านะ ครูให้เขียนบันทึกปักดำส่งแทนการบ้าน"
    - "วันแม่ปีนี้ครูให้เด็กร้อยพวงมาลัยมะลิ ครูร้อยหนึ่งพวงด้วย เอาไปวางที่รูปแม่ครู"
    - "หน้าฝนกบเยอะ ครูสอนวงจรชีวิตกบจากบ่อหลังโรงเรียนเลย ไม่ต้องดูในหนังสือ"
  season_cool:
    - "หน้าหนาวเด็กๆ มาโรงเรียนใส่เสื้อกันหนาวทับชุดนักเรียน ครูไม่ว่า ระเบียบสู้ลมหนาวไม่ได้"
    - "ลอยกระทงปีนี้ครูให้เด็กทำกระทงขนมปัง ปลากินได้ ไม่เป็นขยะ บอลทำกระทงยางในมาประกวด ครูให้ศูนย์"
    - "วันเด็กปีนี้ครูจะจัดเกมพื้นบ้าน วิ่งเปรี้ยว มอญซ่อนผ้า กระโดดหนังยาง มาช่วยเป็นกรรมการไหมจ๊ะ"
    - "งานกำฟ้าครูพาเด็กไปเรียนเผาข้าวหลามกับยายจันทร์ เป็นวิชาประวัติศาสตร์ที่อร่อยที่สุด"
    - "หน้าหนาวเป็นช่วงประเมินโรงเรียน ครูทำแฟ้มจนนิ้วล็อก เด็กๆ ทำการ์ดให้กำลังใจครูหนึ่งใบ ครูติดไว้หน้าแฟ้ม"
  season_dry:
    - "ปิดเทอมหน้าร้อนแล้ว แต่ครูยังต้องมาทำเอกสาร โรงเรียนเงียบจนได้ยินเสียงจิ้งจก"
    - "หน้าแล้งน้ำประปาโรงเรียนไหลเบา ครูต้องให้เด็กๆ ต่อแถวล้างมือทีละคน สอนเรื่องประหยัดน้ำไปในตัว"
    - "สงกรานต์ครูพาเด็กไปรดน้ำดำหัวผู้สูงอายุในตำบล ทุกคนได้ผ้าขาวม้าคนละผืน ครูซื้อเอง"
    - "ปิดเทอมครูเปิดห้องสมุดโรงเรียนให้เด็กมาอ่านหนังสือฟรี มีน้ำแข็งใสเป็นรางวัลถ้าอ่านจบเล่ม"
    - "หน้าแล้งช่วงรับสมัครนักเรียนใหม่ ครูเดินเคาะประตูบ้านชวนเด็กมาเรียน เหมือนหาเสียงเลย"
  heart_low:
    - "สวัสดีจ้ะ ผู้ปกครองใหม่หรือเปล่า… อ๋อ ไม่ใช่ ขอโทษจ้ะ ครูทักทุกคนแบบนี้ติดปาก"
    - "{player} ที่ย้ายกลับมาจากกรุงเทพฯ ใช่ไหม ครูจำได้ เคยสอนน้องข้างบ้านนะ"
    - "ขอโทษนะจ๊ะ ครูรีบเข้าห้อง คาบต่อไปคณิตศาสตร์ ป.5 สาย 1 นาทีเด็กจะลืมสูตรคูณหมด"
    - "ถ้าว่าง โรงเรียนต้องการอาสาสมัครอ่านหนังสือให้เด็กฟังนะ ไม่บังคับจ้ะ"
    - "ครูไม่ค่อยรู้จักคนในตำบลที่ไม่มีลูกหลานเรียนกับครู ยกเว้นคนที่ครูเคยสอน ซึ่งก็เกือบทั้งตำบล"
  heart_mid:
    - "{player} มาช่วยอ่านหนังสือให้เด็กสองครั้งแล้ว เด็กๆ ถามหาทุกวันพฤหัสเลยนะ"
    - "ครูให้ {player} สิบเต็มสิบสำหรับวันนี้ ไม่ต้องรู้ว่าเรื่องอะไร รับไว้ก่อน"
    - "คุยกับ {player} แล้วครูได้พักจากการเป็นครูแป๊บหนึ่ง ครูชอบนะ"
    - "น้องโอ๊ตวาดรูป {player} ใส่หมวกฟาง ถือจอบ แล้วมีหัวใจลอยรอบหัว ครูไม่ได้สอนเรื่องนี้นะ"
    - "ครูเก็บสติกเกอร์ดาวสีทองดวงสุดท้ายไว้ให้ {player} ปกติให้แต่เด็กที่ทำการบ้านครบ"
  heart_high:
    - "เขตพื้นที่ส่งหนังสือมาแล้ว ถ้านักเรียนต่ำกว่าเกณฑ์อีกปี โรงเรียนจะถูกยุบรวม ครูยังไม่กล้าบอกเด็กๆ"
    - "ครูมีหนี้สหกรณ์ครูเจ็ดแสน จากค่ารักษาแม่ตอนป่วย แม่จากไปแล้ว แต่หนี้ยังอยู่ หักเงินเดือนทุกเดือน"
    - "บางคืนครูนั่งทำแฟ้มประเมินถึงตีสอง แล้วคิดว่าถ้าเอาเวลานี้ไปสอนเด็ก เด็กจะเก่งกว่านี้สักแค่ไหน"
    - "ครูอยากเป็นครูตั้งแต่เด็ก เพราะครูประจำชั้นของครูซื้อรองเท้าให้ครูตอนรองเท้าขาด ครูยังจำสีรองเท้าได้"
    - "ถ้าโรงเรียนถูกยุบ ครูอาจถูกย้ายไปไกล… ครูกลัวไม่ได้เห็นเด็กพวกนี้โต และครูกลัวไม่ได้เจอ {player}"
  topic_news:
    - "โรงเรียนได้งบซ่อมหลังคาแล้ว! แต่ได้แค่ห้องเดียว จากที่ขอไปสี่ห้อง ครูขอนับเป็นชัยชนะเล็กๆ นะ"
    - "เขตพื้นที่จะส่งคนมาประเมินเดือนหน้า ครูต้องทำแฟ้มเพิ่มอีกสามแฟ้ม แฟ้มเกี่ยวกับการลดภาระงานเอกสารครู"
    - "ห้องสมุดวัดดงเย็นได้หนังสือบริจาคมาสามร้อยเล่ม พระอาจารย์สุเมธให้ครูไปจัดหมวดหมู่ ครูดีใจมาก"
    - "กลุ่ม LINE ผู้ปกครองมีคนแชร์ข่าวว่ากินนมกล่องแล้วตัวสูงสามเซนต์ในเดือนเดียว หมอแอนกำลังมาแก้ข่าว"
    - "ครอบครัวน้องฟ้าจะย้ายไปทำงานที่บริษัทคุณธนา เขาให้บ้านพักในเขตบริษัท ลูกจะไปเรียนโรงเรียนในอำเภอ นักเรียนเหลือสี่สิบเอ็ด"
  topic_advice:
    - "ถ้าจะสอนเด็กปลูกผัก เริ่มจากผักบุ้งนะจ๊ะ โตไว สามอาทิตย์เก็บได้ เด็กจะไม่เบื่อก่อนผักโต"
    - "อ่านหนังสือก่อนนอนวันละสิบหน้า ปีหนึ่งได้หลายเล่มเลยนะ หนังสือเรื่องปุ๋ยหมักที่ห้องสมุดวัดก็มี"
    - "จะไปติดต่อราชการ ถ่ายเอกสารบัตรประชาชนไปสามชุด เซ็นสำเนาถูกต้องให้ครบ ครูทำแฟ้มมาเจ็ดปี เชื่อครู"
    - "ถ้าจะพูดในที่ประชุมสภา ซ้อมพูดกับกระจกก่อน แล้วพูดให้สั้นกว่าที่ซ้อม คนจะฟังจนจบ"
    - "อยากให้คนในตำบลรู้จัก ไปช่วยงานโรงเรียนวันเด็กสิจ๊ะ ผู้ปกครองทั้งตำบลมารวมกันที่เดียว หัวใจขึ้นทีเดียวหลายคน"
    - "จดบัญชีรายรับรายจ่ายทุกวันนะ ครูสอนเด็ก ป.5 ทำแล้ว เด็กยังเก็บเงินได้ดีกว่าผู้ใหญ่บางคน"
  topic_smalltalk:
    - "ถ้าครูให้คะแนนตำบลนี้ ครูให้แปดเต็มสิบ หักหนึ่งคะแนนเรื่องถนน อีกหนึ่งคะแนนเรื่องผี"
    - "ครูมีปากกาแดงยี่สิบด้าม หายไปวันละด้าม ครูสงสัยว่ามีผีกินปากกาในห้องพักครู"
    - "เด็กๆ ตั้งฉายาครูว่า 'ครูดาวทอง' เพราะครูแจกสติกเกอร์ดาวทุกคน ครูชอบชื่อนี้มาก"
    - "ครูชอบอ่านนิยายผีตอนกลางวัน ตอนกลางคืนไม่อ่าน เพราะตำบลเรามีของจริง"
    - "ถ้าไม่ได้เป็นครู ครูอยากเป็นบรรณารักษ์ ห้องเงียบๆ หนังสือเยอะๆ ไม่มีแฟ้มประเมิน"
  topic_about_self:
    - "ครูเรียนครุศาสตร์ สอบบรรจุได้ที่นี่ตั้งแต่อายุยี่สิบสอง สอนมาเจ็ดปี บางคนที่ครูสอนตอนนี้ไปทำงานโรงงานแล้ว"
    - "ครูอยู่บ้านพักครูหลังโรงเรียน บ้านไม้หลังเล็ก หลังคารั่วหนึ่งจุด ครูเรียกว่าจุดวัดฝน"
    - "ครูสอนคณิต ไทย วิทย์ สังคม ศิลปะ และพละ เพราะโรงเรียนมีครูสามคน รวมผู้อำนวยการ"
    - "แม่ครูเป็นแม่ค้าขายขนมไทยที่ตลาดนัด ครูทำขนมชั้นเป็นเพราะแม่ ทำทุกวันครูเลยคิดถึงแม่ทุกวัน"
    - "ความฝันของครูคือให้เด็กในตำบลทุกคนอ่านหนังสือออกก่อน ป.2 และมีห้องสมุดที่หลังคาไม่รั่ว"
  topic_about_others:
    - "น้องมิวกับน้องโอ๊ตเป็นเด็กที่ครูภูมิใจมาก น้องมิวอ่านหนังสือเก่งที่สุดในชั้น น้องโอ๊ตถามคำถามเยอะที่สุดในโรงเรียน"
    - "ผู้ใหญ่สมศักดิ์มาพูดหน้าเสาธงทุกวันจันทร์ ย้ำอีกครั้งสามรอบ เด็กๆ นับรอบได้แม่นกว่าสูตรคูณอีก"
    - "กล้าส่งผักอินทรีย์ให้อาหารกลางวันเด็ก ได้เงินช้ากว่าที่อื่นสามเดือนแต่ไม่เคยบ่น ครูเกรงใจมาก"
    - "หมอแอนมาตรวจฟันเด็กทุกเทอม เด็กกลัวเข็มแต่ไม่กลัวหมอแอน ครูว่านั่นคือความสามารถพิเศษ"
    - "พระอาจารย์สุเมธให้ใช้ศาลาวัดเป็นห้องเรียนตอนหลังคาโรงเรียนรั่ว ท่านช่วยโรงเรียนมาตลอดโดยไม่เคยขออะไร"
  gossip_theft:
    - "ครูได้ยินข่าวในกลุ่ม LINE ผู้ปกครอง… ครูไม่อยากเชื่อนะ ถ้าไม่จริงครูจะช่วยแก้ข่าว"
    - "ถ้าจริง ครูขอให้คืนของนะจ๊ะ ครูสอนเด็กทุกวันว่าทำผิดแล้วแก้ไขได้ ผู้ใหญ่ก็เหมือนกัน"
    - "เด็กๆ ถามครูว่า {player} ขโมยของจริงไหม ครูตอบไม่ได้ ช่วยทำให้ครูตอบได้หน่อยนะ"
  gossip_cheating:
    - "ครูสอนเด็กว่าความซื่อสัตย์เป็นสิ่งแรกที่ต้องมี ครูไม่คิดว่าจะต้องสอนผู้ใหญ่ด้วย"
    - "ครูไม่โกรธนะจ๊ะ ครูแค่… ไม่รู้จะให้คะแนนเรื่องนี้เท่าไหร่"
    - "ครูจะไม่ร้องไห้ต่อหน้าเด็กๆ แต่หลังเลิกเรียนครูไม่รับปาก"
  gossip_unpaid_bill:
    - "ค้างค่าไฟเหรอจ๊ะ ครูเข้าใจ เงินเดือนครูหักหนี้สหกรณ์แล้วเหลือแค่พอค่าไฟเหมือนกัน"
    - "จดบัญชีรายจ่ายนะ ครูสอนเด็ก ป.5 ทำได้ ผู้ใหญ่ก็ทำได้"
    - "ถ้าลำบากจริงๆ บอกครู ครูมีข้าวสารที่ผู้ปกครองให้มาเยอะ แบ่งได้"
  gossip_small_envelope:
    - "ซองไม่ต้องหนาหรอกจ้ะ ครูใส่ซองงานแต่งลูกศิษย์ไปร้อยเดียว แต่ร้องไห้ทั้งงาน เจ้าบ่าวยังจำได้"
    - "ป้าทองใบเล่าให้ครูฟังแล้ว… ครูว่าไปช่วยงานครัวรอบหน้าก็พอ"
    - "สิ่งที่คนจำได้นานไม่ใช่ยอดเงินในซองหรอก แต่ใครอยู่ช่วยเก็บโต๊ะจนงานเลิก"
  gossip_skip_longkhaek:
    - "ครูได้ยินว่า {player} ไม่ไปช่วยลงแขกคืน ครูสอนเด็กเรื่องลงแขกในวิชาสังคม อย่าให้ครูต้องยกตัวอย่างนะจ๊ะ"
    - "ลงแขกคือการบ้านที่ไม่มีใครตรวจ แต่ทุกคนจำได้ว่าใครไม่ส่ง"
    - "รอบหน้าครูพาเด็ก ป.6 ไปช่วยลงแขกด้วย {player} ไปด้วยกันนะ"
  player_fainted:
    - "ครูได้ยินว่าเมื่อคืนผีจับจนสลบ! เด็กๆ เล่ากันทั้งโรงเรียน ฉบับของน้องโอ๊ตมีผีเจ็ดตัว"
    - "ไม่เป็นไรใช่ไหมจ๊ะ ครูขอให้กลับบ้านก่อนสามทุ่ม ครูสั่งเด็กแบบนี้ทุกวัน ไม่คิดว่าต้องสั่งผู้ใหญ่"
    - "ครูเอาข้าวต้มมาให้ ทำจากข้าวที่ผู้ปกครองให้ครู ส่งต่อความหวังดีกันไป"
  player_new_vehicle:
    - "รถใหม่สวยจัง! ครูให้เก้าเต็มสิบ หักหนึ่งคะแนนเพราะยังไม่มีที่นั่งให้ครูซ้อน… ล้อเล่นนะ"
    - "ขับช้าๆ ตอนผ่านหน้าโรงเรียนนะจ๊ะ เด็กๆ วิ่งข้ามถนนโดยไม่มองเลย"
    - "ถ้าว่าง ช่วยขนหนังสือบริจาคจากอำเภอมาโรงเรียนได้ไหม รถเมล์ลุงเชิดขนไม่หมด"
  player_lottery_win:
    - "ถูกหวยเหรอจ๊ะ! ยินดีด้วย ครูไม่ได้จะขอนะ แต่ถ้าอยากบริจาคหนังสือให้ห้องสมุด ครูรับ"
    - "เอาไปฝากธนาคารนะ อย่าซื้อหวยต่อ ครูสอนเด็กเรื่องความน่าจะเป็นแล้ว ตัวเลขไม่ค่อยเข้าข้างคนซื้อ"
    - "ลุงสมหมายคงมาขอเลข แกถามเด็กๆ ทุกวันว่าฝันเห็นอะไร ครูต้องห้ามไว้"
  player_muddy:
    - "โคลนเต็มตัวเลยจ้ะ ครูให้คะแนนความขยันสิบเต็มสิบ คะแนนความสะอาดขอไว้ก่อน"
    - "เด็กๆ เห็นแล้วจะอยากเล่นโคลนตาม อย่าเพิ่งเดินผ่านหน้าโรงเรียนนะ"
    - "ล้างมือก่อนกินข้าวนะจ๊ะ ครูพูดประโยคนี้วันละสี่สิบสองครั้งแล้ว เพิ่มอีกครั้งไม่เป็นไร"
  player_rich:
    - "ได้ข่าวว่า {player} รวยขึ้น ดีใจด้วยนะ อย่าลืมว่าโรงเรียนรับบริจาคทั้งเงิน แรง และเวลา"
    - "รวยแล้วอย่าเปลี่ยนไปนะจ๊ะ ครูเห็นลูกศิษย์บางคนรวยแล้วไม่ทักครูอีกเลย"
    - "ถ้าอยากลงทุนอะไรสักอย่าง ทุนการศึกษาเด็กในตำบลให้ผลตอบแทนดีที่สุดในระยะยาวนะ ครูคิดเลขมาแล้ว"
  player_in_debt:
    - "มีหนี้เหรอจ๊ะ ครูก็มี หนี้ครูหักเงินเดือนก่อนครูได้เห็นเงินอีก เราเป็นเพื่อนร่วมชะตากรรมกัน"
    - "ทำตารางหนี้นะ เรียงจากดอกแพงไปถูก จ่ายตัวแพงก่อน ครูเพิ่งทำเองเมื่อปีที่แล้ว ใจเบาขึ้นเยอะ"
    - "อย่าอายนะจ๊ะ หนี้ไม่ได้บอกว่าเราเป็นคนไม่ดี บอกแค่ว่าเราเคยต้องการความช่วยเหลือ"
  player_sick:
    - "ป่วยเหรอจ๊ะ พักผ่อนนะ ครูให้ใบลาป่วยหนึ่งวัน ไม่ต้องให้ผู้ปกครองเซ็น"
    - "ครูทำขนมชั้นมาฝาก ไม่ใช่ยา แต่ทำให้ยิ้มได้"
    - "ไป รพ.สต. นะ หมอแอนเก่งมาก บอกว่าครูเต้ยส่งมา จะได้คิวเร็ว… ไม่จริงหรอก แต่ลองดู"
  player_married:
    - "ยินดีด้วยนะจ๊ะ {player} เด็กๆ ทำการ์ดแสดงความยินดีมาให้ สี่สิบสองใบ ทุกใบวาดหัวใจ"
    - "งานแต่งสวยมาก ครูร้องไห้ตั้งแต่รดน้ำสังข์ ครูร้องไห้ง่าย เด็กๆ รู้ดี"
    - "ขอให้มีความสุขนะจ๊ะ ถ้ามีลูกเมื่อไหร่ ฝากเรียนกับครูนะ โรงเรียนต้องการนักเรียนเพิ่ม"
  event_disaster:
    - "น้ำท่วมแล้วจ้ะ ครูเปิดโรงเรียนเป็นศูนย์พักพิง เด็กๆ ช่วยแจกน้ำดื่ม ครูภูมิใจในพวกเขามาก"
    - "หนังสือในห้องสมุดเปียกหมดชั้นล่าง ครูตากไว้ทั่วสนาม ใครว่างมาช่วยพลิกหน้ากระดาษได้นะ"
    - "ครูโทรหาผู้ปกครองครบทุกบ้านแล้ว ทุกคนปลอดภัย ครูขอนั่งพักห้านาทีก่อนนะ"
  event_election:
    - "ช่วงเลือกตั้งโรงเรียนเป็นหน่วยเลือกตั้ง ครูต้องยกโต๊ะยกเก้าอี้ แล้วทำความสะอาดคราบหมึกอีกสามวัน"
    - "ผู้สมัครทุกคนมาถ่ายรูปกับเด็กๆ ครูขอให้สัญญาเรื่องหลังคาห้องเรียนไว้ในกระดาษ ยังไม่มีใครเซ็น"
    - "ครูสอนเด็ก ป.6 ทำเลือกตั้งประธานนักเรียน ซื่อสัตย์กว่าข้างนอกเยอะเลยจ้ะ ไม่มีใครแจกขนม"
  event_company_water:
    - "บ่อโรงเรียนแห้งแล้วจ้ะ ครูต้องซื้อน้ำถังมาให้เด็กล้างมือ เดือนละสองพัน ไม่มีงบตรงนี้"
    - "บริษัทคุณธนาเสนอบริจาคตู้กดน้ำให้โรงเรียน พร้อมป้ายชื่อบริษัทตัวใหญ่ ครูยังไม่ได้ตอบ"
    - "ครูให้เด็กๆ วัดระดับน้ำในบ่อหลังโรงเรียนทุกวันเป็นโครงงานวิทยาศาสตร์ ตัวเลขชัดกว่าที่ผู้ใหญ่ยอมพูด"
  event_festival_near:
    - "{festival} ใกล้แล้วจ้ะ เด็กๆ ซ้อมรำกันทุกเย็น ไปดูด้วยกันนะ"
    - "ครูต้องคุมเด็กไปงาน {festival} สี่สิบสองคน ใครว่างมาช่วยนับหัวได้ไหมจ๊ะ"
    - "งาน {festival} ปีนี้ครูอยากเดินเล่นแบบไม่ต้องเป็นครูสักชั่วโมง ถ้ามีเพื่อนเดินด้วยก็ดี"
  gift_love:
    - "{item}! ครูให้คะแนนของขวัญนี้สิบเต็มสิบ แถมดาวทองหนึ่งดวง"
    - "ขอบคุณมากจ้ะ ครูจะเก็บไว้บนโต๊ะทำงาน มองทีไรจะได้ยิ้ม"
    - "รู้ได้ยังไงว่าครูชอบ… ครูไม่ได้บอกใครเลยนะ"
  gift_like:
    - "น่ารักจังจ้ะ ขอบคุณนะ"
    - "{item} เหรอ ครูชอบจ้ะ เดี๋ยวแบ่งเด็กๆ ด้วย"
    - "ดีจัง ครูกำลังอยากได้พอดี"
  gift_neutral:
    - "ขอบคุณจ้ะ"
    - "อ๋อ {item} ครูรับไว้นะจ๊ะ"
    - "ครูเก็บไว้ใช้ในห้องเรียนได้ ขอบคุณจ้ะ"
  gift_dislike:
    - "ขอบคุณจ้ะ… แต่ครูไม่ค่อยได้ใช้ของแบบนี้นะ"
    - "อันนี้ครูไม่กล้าเอาเข้าโรงเรียนนะจ๊ะ ไม่เหมาะกับเด็ก"
