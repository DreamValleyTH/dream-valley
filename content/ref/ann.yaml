choices:
  - id: ann_c1
    min_heart: 0
    prompt: "ช่วงนี้นอนคืนละกี่ชั่วโมงคะ"
    options:
      - text: "เจ็ดแปดชั่วโมง"
        heart: 1
        reply: "ดีมากค่ะ แอนอิจฉานิดๆ ด้วย"
      - text: "สามสี่ชั่วโมง งานเยอะ"
        heart: 0
        reply: "ไม่พอนะคะ ร่างกายพังแล้วงานก็ไม่เสร็จอยู่ดี คืนนี้เข้านอนเร็วขึ้นสักชั่วโมงนะ"
      - text: "ถามทำไม ยุ่งจัง"
        heart: -1
        reply: "ขอโทษค่ะ แอนติดนิสัยถามทุกคน ...แต่ถ้าวันไหนอยากเล่า แอนอยู่ตรงนี้นะคะ"
  - id: ann_c2
    min_heart: 2
    prompt: "ในกลุ่ม LINE มีคนแชร์ว่าดื่มน้ำมันมะพร้าววันละแก้วแล้วเบาหวานหาย {player} เห็นหรือยังคะ"
    options:
      - text: "เห็นแล้ว ช่วยโพสต์แก้ให้แล้วด้วย"
        heart: 2
        reply: "ขอบคุณมากเลยค่ะ! มีคนช่วยแบบนี้ แอนเหนื่อยน้อยลงครึ่งนึง"
      - text: "เห็น แต่ไม่อยากมีเรื่องกับคนแชร์"
        heart: 1
        reply: "เข้าใจค่ะ งั้นส่งโพสต์ที่แอนแก้ไปให้เขาทางแชตส่วนตัวก็ได้ นุ่มนวลกว่า"
      - text: "อาจจะจริงก็ได้นะ"
        heart: -1
        reply: "ไม่จริงค่ะ น้ำมันมะพร้าวแก้วนึงพลังงานสูงมาก คนเป็นเบาหวานกินแล้วแย่ลงนะคะ"
  - id: ann_c3
    min_heart: 4
    prompt: "เมื่อคืนมีคนโดนผีจับมานอนที่นี่สองคน {player} ว่าแอนควรทำอะไรให้คนเจอน้อยลงคะ"
    options:
      - text: "ทำแผ่นประกาศเตือนเรื่องเครื่องรางกับเวลาผีออก ติดหน้าร้านชำ"
        heart: 2
        reply: "ดีมากค่ะ ป้าแต๋วอ่านแล้วเดี๋ยวทั้งตำบลก็รู้ เร็วกว่าแผ่นพับอีก"
      - text: "ขอให้ผู้ใหญ่สมศักดิ์ย้ำตอนประกาศเย็น"
        heart: 1
