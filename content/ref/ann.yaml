id: ann
name: "หมอแอน"
role: "พยาบาลวิชาชีพประจำ รพ.สต. ชาวบ้านเรียกหมอ ดูแลคนที่โดนผีจับตอนกลางคืน แก้ข่าวปลอมสุขภาพในกลุ่ม LINE"
voice: "อบอุ่น ใจเย็น สุภาพ ลงท้ายค่ะ นะคะ แทนตัวเองว่าแอน กับผู้ใหญ่แทนตัวว่าหนู ให้คำแนะนำสุขภาพที่ใช้ได้จริงแบบสั้นๆ ไม่ดุ ขำเบาๆ แบบน่ารัก ไม่มีตลกร้าย"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "อรุณสวัสดิ์ค่ะ {player} กินข้าวเช้าหรือยัง มื้อแรกสำคัญนะคะ ข้ามบ่อยเดี๋ยวกระเพาะประท้วง"
    - "เช้านี้ รพ.สต. มีคิวเจาะเลือดเบาหวาน ตาเผือกงดอาหารมาแล้ว แต่ยังถือข้าวเหนียวมาด้วย"
    - "สวัสดีค่ะ แอนเพิ่งปั่นจักรยานไปเยี่ยมยายบัวมา ยายให้ยาดมสมุนไพรมาขวดนึง หอมมาก"
    - "เช้าๆ ยืดเส้นยืดสายก่อนลงนานะคะ หลังพังไปวันเดียว เสียงานไปหลายวัน"
    - "อรุณสวัสดิ์ค่ะ เช้านี้ในกลุ่ม LINE มีคนแชร์ว่ากินกระเทียมดองตอนตีห้ารักษาได้ทุกโรค แอนกำลังพิมพ์แก้อยู่ค่ะ"
  greet_noon:
    - "เที่ยงแล้ว ทานข้าวหรือยังคะ แอนได้กินข้าวกล่องตอนบ่ายโมงทุกวัน คนไข้มาเรื่อยๆ"
    - "แดดแรงนะคะ พักในร่มบ้าง จิบน้ำทีละน้อยบ่อยๆ ดีกว่ากระดกทีเดียวหมดขวด"
    - "สวัสดีค่ะ {player} ผ่านมาพอดี แวะวัดความดันไหมคะ สองนาทีเอง ไม่เจ็บ"
    - "บ่ายนี้แอนต้องไปเยี่ยมผู้ป่วยติดเตียงสามหลัง เห็นมอเตอร์ไซค์สีขาวจอดหน้าบ้านไหน แอนอยู่บ้านนั้นค่ะ"
    - "กลางวันร้อน ใส่เสื้อแขนยาวกับหมวกปีกกว้างลงนานะคะ ผิวไหม้แดดก็ทำให้ไม่สบายได้"
  greet_evening:
    - "เย็นแล้วค่ะ ช่วงนี้ยุงออกหากิน ทายากันยุงก่อนไปเก็บผักนะคะ"
    - "รพ.สต. ปิดห้าโมงครึ่งค่ะ แต่ถ้าฉุกเฉินเคาะประตูบ้านพักแอนได้ อยู่ด้านหลังนี่เอง"
    - "เย็นนี้แอนไปช่วยครูเต้ยตรวจฟันเด็กๆ ค่ะ ใครแปรงฟันสะอาดได้สติกเกอร์รูปดาว"
    - "สวัสดีค่ะ ทำงานมาทั้งวัน อาบน้ำแล้วพักให้พอนะคะ แรงหมดเมื่อไหร่ร่างกายจะฟ้อง"
    - "ลุงสมหมายเพิ่งมาขอยาแก้ปวดหลัง แอนให้ยาไปพร้อมคำแนะนำ ว่าอย่ายกกระสอบคนเดียวนะคะ"
  greet_night:
    - "สองทุ่มกว่าแล้วนะคะ ผีออกสามทุ่ม รีบกลับบ้านนะ แอนไม่อยากเจอ {player} ตอนเช้าบนเตียงคนไข้"
    - "ถ้ากลับบ้านไม่ทัน เข้าวัดหรือร้าน 24 ชม. ไว้ก่อนนะคะ ปลอดภัยกว่าวิ่งกลางทุ่ง"
    - "แอนเตรียมเตียงไว้สองเตียงทุกคืน เผื่อมีคนโดนผีจับ หวังว่าคืนนี้จะว่างทั้งสองเตียงค่ะ"
    - "ยังไม่นอนอีก นอนน้อยติดกันหลายคืนภูมิต้านทานตกนะคะ"
    - "คืนนี้หมาหอนเยอะเลย แอนเปิดไฟหน้า รพ.สต. ทิ้งไว้ทั้งคืน ใครหลงมาจะได้เห็นทาง"
  weather_rain:
    - "ฝนตกแล้ว เปลี่ยนเสื้อผ้าที่เปียกให้ไวนะคะ หวัดหน้าฝนมาเร็วมาก"
    - "หลังฝนหยุด เทน้ำในกะลา ยางรถเก่า จานรองกระถางทิ้งด้วยนะคะ ไข้เลือดออกเริ่มมีในอำเภอแล้ว"
    - "ลุยนาช่วงฝนใส่รองเท้าบูทนะคะ โรคฉี่หนูมากับน้ำขังค่ะ"
    - "ฝนตกแบบนี้ขาประจำความดันมาไม่ไหว แอนเลยใส่เสื้อกันฝนขี่มอเตอร์ไซค์ไปวัดให้ถึงบ้านเลย"
  weather_hot:
    - "ร้อนจัดแบบนี้ ถ้ามึนหัว ตัวร้อนแต่เหงื่อไม่ออก หยุดงานเข้าร่มทันทีนะคะ นั่นอาการลมแดด"
    - "ดื่มน้ำเปล่าดีที่สุดค่ะ น้ำชูกำลังไม่ได้ช่วยคลายร้อนนะคะ"
    - "เอาผ้าชุบน้ำเช็ดคอ รักแร้ ข้อพับ จะเย็นเร็วกว่านั่งหน้าพัดลมอย่างเดียวค่ะ"
    - "ร้อนแบบนี้ให้ผู้สูงอายุกับเด็กอยู่ในร่มนะคะ แอนไปบอกยายจันทร์แล้ว ยายบอกจะทอผ้าใต้ถุนต่อ"
  weather_storm:
    - "พายุแรงมาก อย่าออกไปนอกบ้านนะคะ ถ้ามีคนเจ็บ โทรเรียกหรือพามาที่ รพ.สต. ได้เลย"
    - "ไฟดับ ตู้เย็นเก็บวัคซีนของ รพ.สต. ต่อเครื่องปั่นไฟไว้แล้วค่ะ แอนนั่งเฝ้าอยู่ ไม่ต้องห่วง"
    - "หลังพายุระวังสายไฟขาดตามถนนนะคะ อย่าเดินลุยน้ำใกล้เสาไฟ"
    - "ใครโดนกิ่งไม้ตกใส่เป็นแผล มาล้างแผลที่ รพ.สต. นะคะ อย่าเอายาเส้นหรือขี้เถ้าโปะ"
  weather_pm25:
    - "ค่าฝุ่นสูงค่ะ ใส่หน้ากากแบบกรองฝุ่นละเอียดนะคะ ผ้าปิดจมูกธรรมดากันได้น้อย"
    - "ใครเป็นหอบหืดหรือโรคหัวใจ งดออกแรงกลางแจ้งวันนี้นะคะ แอนจะโทรเตือนทีละบ้าน"
    - "ในกลุ่มแชร์ว่าดื่มน้ำมะนาวล้างฝุ่นในปอดได้ ไม่จริงนะคะ ปิดหน้าต่าง ใส่หน้ากาก ได้ผลกว่าเยอะ"
    - "รพ.สต. มีหน้ากากแจกค่ะ คนละสองชิ้น ผู้สูงอายุกับเด็กก่อนนะคะ"
  season_rainy:
    - "หน้าฝนไข้เลือดออกมาอันดับหนึ่งเลยค่ะ ไข้สูงลอยสองวันมาหาแอนนะคะ อย่าซื้อยาแก้ปวดกินเอง"
    - "ช่วงดำนาแอนเจอเท้าเปื่อยเยอะมาก ขึ้นจากนาล้างเท้าแล้วเช็ดให้แห้งนะคะ"
    - "หน้าฝนเห็ดป่าขึ้นเยอะ เห็ดที่ไม่รู้จักอย่าเก็บมากินนะคะ ปีก่อนมีคนแพ้เห็ดมานอนที่นี่สามคน"
    - "ทำนาระวังงูด้วยนะคะ ถ้าโดนกัด อย่ากรีดแผล อย่าดูดพิษ ให้อยู่นิ่งๆ แล้วรีบมาหาแอน"
  season_cool:
    - "หน้าหนาวผู้สูงอายุไม่สบายง่าย รพ.สต. มีวัคซีนไข้หวัดใหญ่ ฉีดฟรีนะคะ"
    - "อากาศแห้ง ผิวแตก ปากแตก ทาวาสลีนหรือน้ำมันมะพร้าวก็ได้ค่ะ ไม่ต้องแพง"
    - "ช่วงเกี่ยวข้าวคนเจ็บหลังเยอะค่ะ ยกกระสอบให้ย่อเข่า หลังตรง อย่าก้มหยิบนะคะ"
    - "งานวัดงานกาชาด ใครดื่มแล้วอย่าขับนะคะ กลับรถเมล์ลุงเชิดหรือให้คนอื่นขับ"
  season_dry:
    - "หน้าแล้งคนเป็นลมแดดเยอะ ทำงานกลางแจ้งช่วงเช้ากับเย็นจะดีกว่าค่ะ"
    - "น้ำบ่อเหลือน้อยมักขุ่น ต้มก่อนดื่มนะคะ ท้องเสียหน้าแล้งเยอะทุกปี"
    - "สงกรานต์ดื่มแล้วอย่าขับนะคะ แอนเฝ้าจุดปฐมพยาบาลหน้าวัดทั้งสามวันเลย"
    - "ช่วงเผาตอซัง คนแสบตาเพิ่มขึ้นค่ะ ล้างตาด้วยน้ำสะอาดหรือน้ำเกลือนะคะ ไม่ใช่น้ำมะนาว"
  heart_low:
    - "สวัสดีค่ะ ย้ายมาใหม่ใช่ไหมคะ อย่าลืมย้ายสิทธิ์บัตรทองมาที่ รพ.สต. นี้ด้วยนะ"
    - "มีอาการอะไรหรือเปล่าคะ ถ้าไม่มี แอนดีใจค่ะ"
    - "ยินดีที่ได้รู้จักค่ะ แอนเป็นพยาบาลประจำ รพ.สต. ไม่ใช่หมอนะคะ แต่ชาวบ้านเรียกหมอกันหมด"
    - "มีเรื่องสุขภาพไม่สบายใจ ถามแอนได้เสมอนะคะ ถามก่อนกดแชร์ก็ได้ค่ะ"
  heart_mid:
    - "{player} มาพอดี แอนมีน้ำใบเตยแช่เย็นค่ะ นั่งพักก่อนสิ"
    - "ขอบคุณที่ช่วยแก้ข่าวปลอมในกลุ่ม LINE นะคะ แอนเห็นแล้ว มีคนช่วยแอนเหนื่อยน้อยลงเยอะ"
    - "วันนี้แอนเหนื่อยนิดหน่อย เด็กสามคนร้องไห้ตอนฉีดวัคซีนพร้อมกัน เป็นคอรัสเลยค่ะ"
    - "แอนชอบคุยกับ {player} ค่ะ คุยจบแล้วไม่มีใครขอยาฟรีกลับบ้านตอนท้าย"
  heart_high:
    - "แอนเรียนพยาบาลด้วยทุนของอำเภอ ต้องกลับมาใช้ทุนที่นี่ ตอนนี้ครบทุนแล้ว แต่แอนไม่อยากไปไหนค่ะ"
    - "บางคืนแอนนอนไม่หลับ คิดถึงคนไข้ที่ช่วยไม่ทัน แอนไม่เคยเล่าให้ใครฟังเลยนะคะ"
    - "ยายของแอนเป็นหมอตำแยในตำบลนี้ แอนว่ามือแอนได้มาจากยาย ส่วนใจได้มาจากยายบัว"
    - "แอนรู้ว่าข่าวปลอมไม่มีวันหมด แต่แก้ได้ทีละคน ก็คือช่วยได้ทีละคนค่ะ"
    - "ถ้าวันไหนแอนเหนื่อยจนยิ้มไม่ออก {player} มาชวนแอนกินก๋วยเตี๋ยวพี่หน่อยได้ไหมคะ แค่นั้นพอ"
  topic_news:
    - "วันพุธนี้ รพ.สต. ตรวจคัดกรองเบาหวานความดันฟรีค่ะ งดอาหารหลังเที่ยงคืนนะคะ"
    - "ที่แชร์กันว่าน้ำมะพร้าวรักษามะเร็งไม่จริงนะคะ แอนโพสต์แก้ไปแล้ว ช่วยกดไลก์ด้วยนะ"
    - "อาทิตย์นี้ อสม. จะเดินสำรวจลูกน้ำยุงลายทุกบ้านค่ะ บ้านไหนผ่านได้สติกเกอร์บ้านปลอดยุง"
    - "ตอนนี้เด็กในโรงเรียนเป็นตาแดงห้าคน ล้างมือบ่อยๆ อย่าใช้ผ้าเช็ดหน้าร่วมกันนะคะ"
    - "เดือนหน้ารถทันตกรรมจากโรงพยาบาลอำเภอจะมาค่ะ ขูดหินปูน ถอนฟันฟรี จองคิวกับแอนได้"
  topic_advice:
    - "ถ้าโดนผีจับแล้วตื่นที่ รพ.สต. จะเสียค่ารักษาสิบเปอร์เซ็นต์ของเงินสดนะคะ ฝากเงินไว้ธนาคารก่อนจะเสียน้อยลง"
    - "กินข้าวให้ครบมื้อนะคะ ข้ามมื้อแรงสูงสุดจะลด ข้ามติดกันสามวันเป็นโรคกระเพาะได้"
    - "ป่วยเล็กน้อยไปร้านเภสัชมดได้ค่ะ ถ้าอาการหนักหรือเป็นนาน มา รพ.สต. ใช้บัตรทองไม่เสียเงิน"
    - "บ้านที่น่าอยู่ทำให้นอนแล้วแรงฟื้นเร็วขึ้นจริงนะคะ เตียงดีๆ สักหลังคุ้มกว่ายาบำรุงเยอะ"
    - "ของทอดของมันที่มีป้ายเตือน กินบ่อยเสี่ยงโรคเรื้อรังนะคะ สลับกินผักต้มจิ้มน้ำพริกบ้าง"
    - "หน้าฝุ่นปลูกต้นไม้ฟอกอากาศหรือมีเครื่องฟอกอากาศในบ้าน ออกไปทำงานแล้วแรงจะไม่หมดเร็ว"
  topic_smalltalk:
    - "แอนเพิ่งหัดถักโครเชต์ค่ะ ทำถุงใส่ยาดมได้หนึ่งใบ เบี้ยวๆ หน่อย แต่ใส่ได้"
    - "เมื่อวานมีเด็กถามว่าเข็มฉีดยามีกี่ขนาด แอนตอบว่าสามขนาด เด็กร้องไห้ครบทั้งสามขนาด"
    - "{player} ชอบก๋วยเตี๋ยวน้ำใสหรือต้มยำคะ แอนสังเกตว่าคนชอบต้มยำมักมาหาแอนเรื่องกระเพาะ"
    - "แอนมีแมวที่ รพ.สต. ชื่อพาราค่ะ มันเดินเข้ามาตอนแอนกำลังจ่ายยาพาราพอดี"
    - "แอนอยากขึ้นชิงช้าสวรรค์ที่งานกาชาดสักครั้ง แต่ทุกปีแอนต้องอยู่เต็นท์ปฐมพยาบาล"
  topic_about_self:
    - "แอนเป็นพยาบาลวิชาชีพค่ะ ประจำ รพ.สต. มาเจ็ดปี มีพี่ๆ อสม. ช่วยอีกสิบสองคน"
    - "แอนเกิดตำบลข้างๆ ค่ะ ข้ามคลองมานิดเดียว ตอนเด็กแอนก็มาฉีดวัคซีนที่ รพ.สต. นี้แหละ"
    - "งานที่แอนชอบที่สุดคือเยี่ยมบ้าน ได้เห็นคนไข้ในบ้านของเขาเอง แล้วรู้ว่าเขาต้องการอะไรจริงๆ"
    - "งานที่เหนื่อยที่สุดคือแก้ข่าวปลอมค่ะ ยากกว่าเย็บแผลอีก"
    - "แอนอยู่กับแมวหนึ่งตัวกับต้นมะนาวในกระถางหนึ่งต้น ทั้งสองยังมีชีวิตอยู่ค่ะ ภูมิใจมาก"
  topic_about_others:
    - "ยายบัวกับแอนเป็นทีมกันค่ะ ยายดูแลใจ แอนดูแลแผล บางทีก็สลับกัน"
    - "เภสัชมดพูดตลกหน้านิ่ง แต่เขาอธิบายวิธีกินยาละเอียดที่สุดในอำเภอเลยนะคะ"
    - "ผู้ใหญ่สมศักดิ์ความดันสูงแต่ไม่ยอมมาตรวจ แอนเลยไปดักวัดตอนท่านประกาศหอกระจายข่าวเสร็จ"
    - "ดาบเสถียรหนีวัดความดันเก่งมากค่ะ แต่ตอนนี้แอนรู้แล้วว่าทางหลังโรงพักไปออกตรงไหน"
    - "ป้าแต๋วช่วยแชร์ข่าวจริงให้แอนได้เร็วมากค่ะ ...เร็วพอๆ กับตอนแชร์ข่าวอื่นเลย"
    - "พระอาจารย์สุเมธให้ใช้ศาลาวัดตรวจสุขภาพผู้สูงอายุทุกเดือน คนมาเยอะกว่าที่ รพ.สต. อีกค่ะ"
  gossip_theft:
    - "แอนเห็นเรื่องในกลุ่มแล้วค่ะ แอนยังไม่เชื่อ จนกว่าจะได้ยินจาก {player} เอง"
    - "ถ้ามีอะไรลำบากใจอยู่ ปรึกษาแอนได้นะคะ แต่ของของคนอื่นต้องคืนเขาก่อนนะ"
    - "ข่าวในกลุ่มบางทีก็จริงบางทีก็ไม่จริง แต่ถ้าครั้งนี้จริง แอนอยากให้แก้ไขค่ะ"
  gossip_cheating:
    - "เรื่องหัวใจแอนไม่ตัดสินค่ะ แต่ความรู้สึกของคนอื่นก็สำคัญเท่ากับของเรานะคะ"
    - "แอนเห็นในกลุ่มแล้ว ถ้าไม่จริง แอนช่วยแก้ข่าวให้ได้นะคะ ถ้าจริง... ไปคุยกันตรงๆ ดีกว่า"
    - "ช่วงนี้นอนไม่หลับเพราะเรื่องนี้หรือเปล่าคะ หน้าดูเหนื่อยๆ"
  gossip_unpaid_bill:
    - "ค่าไฟค้างไม่เป็นไรค่ะ แต่ถ้าในบ้านมีคนใช้ยาที่ต้องแช่เย็น ถ้าโดนตัดไฟ เอามาฝากตู้ รพ.สต. ก่อนนะคะ"
    - "จ่ายก่อนวันที่สิบห้านะคะ ถ้าเงินขาดจริงๆ ไปคุยกับผู้ใหญ่เรื่องกองทุนหมู่บ้านได้ค่ะ"
    - "ไม่ต้องอายนะคะ ช่วงก่อนเก็บเกี่ยว หลายบ้านก็ค้างกันค่ะ"
  gossip_small_envelope:
    - "แอนว่าไปร่วมงานด้วยใจสำคัญกว่าตัวเลขในซองค่ะ ...แต่ป้าทองใบอาจคิดอีกแบบ"
    - "ครั้งหน้าถ้าเงินน้อย ไปช่วยงานครัวสักวันนะคะ เจ้าภาพจำน้ำใจได้นานกว่า"
    - "แอนก็เคยใส่ซองน้อยตอนเรียนจบใหม่ๆ ค่ะ ยังโดนแซวมาถึงทุกวันนี้เลย"
  gossip_skip_longkhaek:
    - "ไม่ได้ไปลงแขกคืน ไม่สบายหรือเปล่าคะ ถ้าป่วยจริง แอนออกใบรับรองให้ได้นะ"
    - "เขาจำนะคะเวลาที่เขาช่วยเรา ครั้งหน้าไปช่วยเขาสักวันก็ได้ค่ะ"
    - "ลงแขกเหนื่อยแต่ได้เพื่อนค่ะ แอนไปเป็นฝ่ายน้ำดื่มกับยาดมทุกปี"
  player_fainted:
    - "ตื่นแล้วเหรอคะ นอนพักอีกหน่อย เมื่อคืนเขาหามมาตอนห้าทุ่ม ตัวเย็นเฉียบเลย"
    - "ค่ารักษาเมื่อคืนหักไปแล้วนะคะ ...แอนขอโทษ ระบบมันเป็นแบบนั้น แต่ยาดมแอนให้ฟรี"
    - "คราวหน้าเช่าผ้ายันต์ที่วัดก่อนค่ำนะคะ เก้าสิบเก้าบาท ถูกกว่าค่ารักษาที่นี่อีก"
    - "วันนี้แรงยังไม่เต็มนะคะ ทำงานเบาๆ กินข้าวให้ครบ คืนนี้กลับบ้านแต่หัวค่ำ"
  player_new_vehicle:
    - "รถใหม่เหรอคะ ยินดีด้วย ใส่หมวกกันน็อกหรือคาดเข็มขัดทุกครั้งนะ แอนไม่อยากเย็บแผลให้"
    - "ถ้าวันไหนมีคนป่วยฉุกเฉิน ขอยืมรถพาไปโรงพยาบาลอำเภอได้ไหมคะ รถ รพ.สต. มีคันเดียว"
    - "รถสวยค่ะ ขับช้าๆ ผ่านหน้าโรงเรียนนะคะ เด็กๆ วิ่งข้ามถนนไม่ดูเลย"
  player_lottery_win:
    - "ถูกหวยเหรอคะ ยินดีด้วย แบ่งไว้เป็นเงินฉุกเฉินเวลาเจ็บป่วยด้วยนะคะ"
    - "แอนดีใจด้วยค่ะ ถ้าจะทำบุญ รพ.สต. ยังขาดเครื่องวัดความดันอีกเครื่อง ...แอนบอกเฉยๆ นะ"
    - "ฉลองได้แต่อย่าดื่มหนักนะคะ ปีก่อนมีคนถูกหวยแล้วมานอนให้น้ำเกลือที่นี่"
  player_muddy:
    - "เลอะโคลนมาเลย มีแผลตรงไหนไหมคะ แผลโดนโคลนติดเชื้อง่าย ล้างด้วยน้ำสะอาดก่อนนะ"
    - "ขึ้นจากนาแล้วอาบน้ำล้างเท้าให้สะอาดนะคะ ช่วงนี้มีโรคฉี่หนู"
    - "ดูขยันมากเลยค่ะ อย่าลืมพักจิบน้ำด้วยนะ"
  player_rich:
    - "ทำมาหากินดีขึ้นนะคะ แต่อย่าลืมตรวจสุขภาพประจำปี เงินซื้อสุขภาพย้อนหลังไม่ได้นะ"
    - "มีเงินแล้วซื้อเตียงดีๆ กับพัดลมแรงๆ สักตัว นอนดีแรงฟื้นเร็วค่ะ"
    - "ถ้าอยากช่วยตำบล โครงการรถรับส่งผู้ป่วยของ รพ.สต. ยังขาดงบอยู่นะคะ"
  player_in_debt:
    - "หน้าดูเครียดนะคะ เรื่องหนี้ใช่ไหม ความเครียดทำให้ความดันขึ้นได้นะ"
    - "ถ้านอนไม่หลับเพราะเรื่องเงิน มาคุยกับแอนได้ค่ะ ทุกวันศุกร์มีคลินิกคลายเครียด"
    - "อย่ากู้ดอกรายวันนะคะ แอนเห็นมาหลายบ้านที่นอนไม่หลับเพราะมัน ไปคุยกองทุนหมู่บ้านดีกว่า"
  player_sick:
    - "ตัวร้อนนะเนี่ย มาวัดไข้ก่อนค่ะ ไข้เกินสองวันต้องตรวจไข้เลือดออก"
    - "ป่วยแล้วพักให้เต็มที่นะคะ วันนี้งดงานหนัก นาไม่หนีไปไหน"
    - "ยาที่แอนให้ กินหลังอาหารให้ครบนะคะ อย่าหยุดเองตอนรู้สึกดีขึ้น"
    - "จิบน้ำอุ่น กินข้าวต้มร้อนๆ นอนเยอะๆ พรุ่งนี้มาให้แอนดูอีกทีนะคะ"
  player_married:
    - "ยินดีด้วยค่ะ! ถ้าวางแผนมีลูก มาปรึกษาและฝากครรภ์ที่ รพ.สต. ได้เลยนะคะ"
    - "แอนขอให้แข็งแรงทั้งคู่ค่ะ มาตรวจสุขภาพพร้อมกันได้นะ ฟรีด้วย"
    - "งานแต่งแอนจะไปเฝ้าเต็นท์ปฐมพยาบาลให้นะคะ เผื่อมีคนเต้นจนเป็นลม"
  event_disaster:
    - "รพ.สต. เปิดยี่สิบสี่ชั่วโมงช่วงนี้ค่ะ ใครเจ็บ ใครยาโรคประจำตัวหมด มาที่นี่ได้เลย"
    - "หลังน้ำลดระวังน้ำกัดเท้า โรคฉี่หนู และงูหนีน้ำเข้าบ้านนะคะ แอนจะเดินแจกยาทาเท้าทุกหลัง"
    - "ผู้ป่วยติดเตียง พี่ อสม. ย้ายไปศาลาวัดหมดแล้วค่ะ พระอาจารย์สุเมธให้ใช้ทั้งหลัง"
    - "เครียดหลังภัยพิบัติเป็นเรื่องปกตินะคะ นอนไม่หลับ ใจสั่น มาคุยกับแอนได้"
  event_election:
    - "ช่วงเลือกตั้งแอนวางตัวเป็นกลางค่ะ แต่ถ้ามีใครแจกยาสมุนไพรไม่มีฉลาก แอนเตือนแน่นอน"
    - "ไปเลือกตั้งแล้วต้องต่อคิวกลางแดด พกน้ำไปด้วยนะคะ ปีก่อนมีคนเป็นลมหน้าหน่วย"
    - "ในกลุ่ม LINE แชร์ว่าหมึกที่นิ้วซึมเข้าเลือด ไม่จริงนะคะ แอนยืนยัน"
    - "แอนไม่บอกว่าเลือกใคร แต่แอนฟังว่าใครพูดถึง รพ.สต. บ้าง ...ยังไม่มีใครพูดเลยค่ะ"
  event_company_water:
    - "บ่อหลายบ้านแห้ง บางบ้านเริ่มใช้น้ำขุ่นก้นบ่อ ต้มก่อนนะคะ คนท้องเสียเพิ่มขึ้นเยอะ"
    - "รพ.สต. เริ่มจดสถิติท้องเสียจากน้ำบ่อแล้วค่ะ แอนจะส่งรายงานให้อำเภอ จะมีคนอ่านหรือไม่ก็ตาม"
    - "บริษัทส่งน้ำดื่มมาแจกสิบแพ็ก พร้อมป้ายใหญ่มาก แอนรับน้ำไว้ ส่วนป้ายวางไว้หลังตู้"
  event_festival_near:
    - "{festival} ใกล้แล้ว แอนจะตั้งเต็นท์ปฐมพยาบาลในงานค่ะ มียาดม พลาสเตอร์ เกลือแร่ครบ"
    - "ไปเที่ยวงาน {festival} สนุกๆ นะคะ ของทอดอร่อยก็จริง แต่ไม่ต้องแวะครบทุกซุ้มก็ได้"
    - "ปีนี้งาน {festival} แอนได้หยุดครึ่งวัน อยากไปเล่นสอยดาวสักครั้งค่ะ"
  gift_love:
    - "{item}! แอนชอบมากเลยค่ะ ขอบคุณนะคะ วันนี้เหนื่อยแค่ไหนก็หายเลย"
    - "รู้ได้ยังไงคะว่าแอนชอบ แอนจะเอาไปวางบนโต๊ะทำงาน มองแล้วยิ้มได้ทั้งวัน"
    - "ขอบคุณมากค่ะ {player} ตั้งแต่ทำงานมา ไม่ค่อยมีใครให้ของแอนที่ไม่ใช่ยาหม่องเลย"
  gift_like:
    - "ขอบคุณนะคะ {item} ดีต่อสุขภาพด้วย แอนชอบค่ะ"
    - "น่ารักจัง แอนรับไว้นะคะ เย็นนี้จะได้มีอะไรกินนอกจากข้าวกล่อง"
    - "ขอบคุณค่ะ แอนจะแบ่งให้พี่ๆ อสม. ด้วย"
  gift_neutral:
    - "ขอบคุณค่ะ {item} แอนเก็บไว้นะคะ"
    - "น้ำใจดีจังค่ะ แอนรับไว้ด้วยความยินดี"
  gift_dislike:
    - "{item} เหรอคะ... แอนไม่ค่อยได้ทานค่ะ แต่ขอบคุณที่นึกถึงนะ"
    - "อันนี้หวานมันไปนิดสำหรับแอนค่ะ แต่ขอบคุณนะคะ"
  gift_hate:
    - "อันนี้แอนรับไม่ได้จริงๆ ค่ะ ทุกวันแอนเห็นคนป่วยเพราะมันเยอะเกินไปแล้ว"
    - "ขอโทษนะคะ แอนขอคืนค่ะ แล้วแนะนำว่าอย่าเก็บไว้ใช้เองด้วยนะ"
  birthday:
    - "วันนี้วันเกิดแอนค่ะ พี่ อสม. แอบซื้อเค้กมา แอนเลยต้องเตือนเรื่องน้ำตาลไปด้วย"
    - "จำได้ด้วยเหรอคะ แอนดีใจมาก ขอบคุณนะคะ {player}"
    - "ปีนี้แอนขอให้ทุกคนในตำบลแข็งแรงค่ะ ...แล้วก็ขอให้แอนได้นอนครบแปดชั่วโมงสักคืน"
  rare:
    - "แอนเก็บการ์ดขอบคุณจากคนไข้ไว้ในกล่องขนมเปี๊ยะใบเก่า วันไหนท้อแอนเปิดอ่านค่ะ"
    - "รู้ไหมคะ แอนกลัวผีมาก แต่ทุกคืนแอนยังเปิดประตูรับคนที่โดนผีจับ ...แอนเปิดไฟทุกดวงเลย"
    - "บางเย็นแอนแอบไปนั่งฟังยายบัวเล่าเรื่องผี ขนลุกทุกครั้ง แต่ก็กลับไปฟังใหม่ทุกครั้ง"
    - "ตอนเรียนแอนเกือบลาออกไปทำโรงงาน ยายบัวจับมือแอนแล้วบอกว่า มือแบบนี้ไว้ช่วยคน แอนเลยอยู่ต่อ"
    - "แอนแอบตั้งชื่อเตียงคนไข้สองเตียงใน รพ.สต. ว่า เตียงหายไว กับ เตียงได้กลับบ้าน ค่ะ"
gifts:
  love: ["ดอกมะลิ", "ส้มโอ", "น้ำเต้าหู้", "ข้าวต้มมัด"]
  like: ["ผักอินทรีย์", "กล้วยน้ำว้า", "ไข่ไก่", "ฟักทอง"]
