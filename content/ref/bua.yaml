id: bua
name: "ยายบัว"
role: "หมอพื้นบ้าน รู้เรื่องผีและสมุนไพร ครูสายเล่นของฝั่งชาวบ้าน"
voice: "เรียกผู้เล่นว่า หลาน ลงท้าย จ้ะ จ๊ะ หลานเอ๊ย พูดช้าๆ อบอุ่น เคี้ยวหมากติดปาก เล่าเรื่องผีให้ขนลุกแล้วปิดด้วยวิธีเอาตัวรอดเสมอ ไม่กินเผ็ด ไม่มีตลกร้าย"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "อ้าว {player} หลานเอ๊ย ตื่นเช้าจริง ยายเพิ่งเคี้ยวหมากคำแรกเอง"
    - "เช้านี้ยายเก็บใบย่านางกับตะไคร้มาเต็มกระบุง เดี๋ยวต้มน้ำสมุนไพรไว้ให้นะจ้ะ"
    - "รอดมาอีกคืนนะหลาน ดีแล้ว เมื่อคืนหมาหอนทั้งคืน ยายไม่ได้นอนเลย"
    - "มากินข้าวต้มปลาด้วยกันไหมจ๊ะ ยายไม่ใส่พริกนะ ยายกินเผ็ดไม่ได้"
    - "เช้าๆ ไหว้ศาลพระภูมิก่อนออกจากบ้านนะหลาน ยายทำมาทั้งชีวิต ยังไม่เคยโดนอำเลย"
  greet_noon:
    - "เที่ยงแล้ว แดดเปรี้ยงแบบนี้ผีไม่ออกหรอก แต่ลมแดดออกนะหลาน กินน้ำเยอะๆ"
    - "ยายตากไพลอยู่ หลานช่วยพลิกไพลบนกระด้งให้ยายหน่อยสิจ๊ะ"
    - "บ่ายๆ ยายชอบนั่งเคี้ยวหมากใต้ถุนบ้าน ลมพัดเย็นดี มานั่งด้วยกันก่อน"
    - "กินข้าวหรือยังจ๊ะ ยายมีแกงจืดฟักทองเหลืออยู่ครึ่งหม้อ"
    - "หลานเอ๊ย หน้าแดงเชียว เอายาหม่องยายไปทาขมับสักหน่อย"
  greet_evening:
    - "ตะวันจะตกแล้วนะหลาน ทำอะไรอยู่ก็รีบเก็บ อย่าให้มืดคาทาง"
    - "เย็นนี้ลมเย็นผิดปกติ ยายขนลุกตั้งแต่ตาตุ่มถึงต้นคอ คืนนี้ระวังให้ดีนะจ๊ะ"
    - "ยายจุดตะเกียงหน้าบ้านแล้ว ผีบางตัวกลัวแสง บางตัวไม่กลัว แต่ยายกลัวมืดก็พอแล้ว"
    - "ก่อนกลับแวะเช่าสายสิญจน์ที่วัดสักเส้นก็ได้นะหลาน ผีจะมองเห็นเราไม่ไกล"
    - "ยายต้มข้าวต้มไว้แล้ว ถ้าค่ำมากจะค้างบ้านยายก็ได้ แต่ไหว้เจ้าที่ก่อนนอนนะ"
  greet_night:
    - "ดึกป่านนี้ยังเดินอยู่อีกหรือหลาน ได้ยินเสียงกอย กอย เมื่อไหร่ ให้หลบทันทีนะ"
    - "เข้ามาในรั้วก่อน เร็วเข้า ยายเห็นแสงเรืองๆ ลอยอยู่ริมคลองตั้งแต่สองทุ่ม"
    - "คืนนี้ลมนิ่ง ใบไม้ไม่ไหวสักใบ ตอนยายเด็กๆ คืนแบบนี้แหละที่ผีปอบออกหากิน"
    - "ถ้าวิ่งหนีอย่าวิ่งจนหมดแรงนะหลาน ผีปอบเร็วกว่าเดินแต่ช้ากว่าวิ่ง เก็บแรงไว้วิ่งตอนมันใกล้"
    - "ไปเถอะหลาน วัดอยู่ใกล้กว่าบ้าน ไปนอนศาลากับท่านสุเมธดีกว่า"
  weather_rain:
    - "ฝนตกแบบนี้ปลิงขึ้นนา ถูยาเส้นที่ขาไว้นะหลาน ปลิงไม่เกาะ"
    - "ฝนลงหนักแล้ว ระวังสะพานไม้ข้ามคลอง ผีพรายชอบอยู่ริมตลิ่งตอนน้ำขึ้น"
    - "ยายชอบฝนนะ ฟ้าทะลายโจรหลังบ้านโตเร็วเชียว"
    - "หน้าฝนคนเป็นหวัดเยอะ ต้มขิงกับตะไคร้ไว้กินนะหลาน ไม่หายค่อยไปหาหมอแอน"
  weather_hot:
    - "ร้อนแบบนี้อย่าลงนาตอนเที่ยง ยายเคยเห็นคนเป็นลมแดดล้มกลางทุ่งมาแล้ว"
    - "เอาใบย่านางคั้นน้ำกินนะหลาน ดับร้อนดีกว่าน้ำแข็งเปล่าๆ"
    - "ร้อนจนหมาไม่ยอมเห่า ยายนั่งแช่เท้าในกะละมังน้ำทั้งบ่าย"
    - "แดดแรงใต้ต้นตะเคียนก็ยังเย็นนะ แต่อย่าไปนั่งนานล่ะหลาน ไม่ใช่ทุกต้นที่ว่างไม่มีเจ้าของ"
  weather_storm:
    - "ฟ้าร้องแรงขนาดนี้ เก็บของเหล็กของคมเข้าบ้านให้หมดนะหลาน"
    - "พายุมาทีไร ต้นไม้ล้มทับทางเข้าป่า ยายไปเก็บสมุนไพรไม่ได้หลายวัน"
    - "สมัยยายเด็กๆ พายุใหญ่พัดศาลาวัดพังทั้งหลัง วันรุ่งขึ้นคนทั้งตำบลมาช่วยกันสร้างใหม่"
    - "ลมแรงแบบนี้ผีก็ไม่อยากออก หลานก็อย่าออกนะจ๊ะ"
  weather_pm25:
    - "ฟ้าขุ่นเหมือนน้ำซาวข้าว ยายแสบจมูกทั้งวัน หลานใส่หน้ากากด้วยนะ"
    - "ฝุ่นแบบนี้ยายก็สู้ไม่ไหว สมุนไพรช่วยแค่ให้คอโล่ง ไปขอหน้ากากที่ รพ.สต. เถอะ"
    - "สมัยก่อนไม่มีควันแบบนี้นะหลาน เกี่ยวข้าวเสร็จก็ปล่อยวัวควายเล็มตอซัง"
    - "ไอกันทั้งบ้านเลยหลาน ยายต้มมะแว้งแก้ไอให้กินสักถ้วยไหม"
  season_rainy:
    - "หน้าฝนเห็ดออกเต็มป่า แต่เห็ดที่ไม่รู้จักอย่าเก็บนะหลาน ยายเห็นคนนอน รพ.สต. เพราะเห็ดมาเยอะแล้ว"
    - "เข้าพรรษา ยายไปจำศีลที่วัดทุกวันพระ หลานไปด้วยกันไหมจ๊ะ"
    - "หน้านี้น้ำในคลองขึ้นสูง ผีพรายก็ขึ้นมาใกล้ตลิ่ง ข้ามสะพานต้องเดินกลางๆ"
    - "ฝนตกชุกเชื้อราขึ้นง่ามเท้า ยายมีขมิ้นตำไว้ ทาแล้วหายคันนะจ๊ะ"
  season_cool:
    - "หนาวแล้ว เข่ายายร้องกรอบแกรบทุกเช้า เหมือนนาฬิกาปลุก"
    - "หน้าหนาวยายชอบนั่งผิงไฟเล่าเรื่องผีให้เด็กๆ ฟัง น้องมิวกลัวจนต้องไปนอนกอดแม่"
    - "เกี่ยวข้าวเสร็จแล้ว ข้าวใหม่หุงหอมทั้งบ้าน ยายกินกับปลาช่อนแห้งกับไข่เค็ม"
    - "หมอกลงหนาๆ ตอนเช้าอย่าเพิ่งออกนาเร็วนัก บางทีที่เห็นในหมอกไม่ใช่คนนะหลาน"
  season_dry:
    - "หน้าแล้งน้ำบ่อยายเหลือแค่ครึ่งถัง เมื่อก่อนไม่เคยแห้งขนาดนี้"
    - "ลมร้อนพัดทีไร ใบไม้แห้งปลิวกรอบแกรบเหมือนมีคนเดินตาม ยายหันไปดูทุกที"
    - "สงกรานต์มารดน้ำดำหัวยายนะหลาน ยายจะผูกข้อมือให้"
    - "แล้งแบบนี้ยายเก็บมะขามป้อมมาดองไว้ อมแก้คอแห้งดีนัก"
  heart_low:
    - "หลานคนใหม่ใช่ไหมจ๊ะ ยายชื่อบัว ใครเป็นไข้เป็นหวัดในตำบลก็มาหายาย"
    - "ยายแก่แล้ว พูดช้าหน่อย ฟังไม่ทันก็ถามซ้ำได้นะหลาน"
    - "หลานไหว้ศาลพระภูมิที่บ้านหรือยังจ๊ะ อยู่บ้านใหม่ต้องบอกกล่าวเจ้าที่ก่อน"
    - "อย่ากลัวยายนะหลาน ยายไม่ได้เลี้ยงผี ยายแค่รู้จักมันดี"
    - "มาหายายบ่อยๆ ก็ได้ ยายอยู่คนเดียว มีแต่แมวกับหม้อยา"
  heart_mid:
    - "ยายทำยาหม่องไพลไว้กระปุกหนึ่ง เก็บไว้ให้หลาน ทำนาปวดหลังทาแล้วร้อนวาบ"
    - "หลานขยันเหมือนหลานยายที่อยู่กรุงเทพฯ เลย แต่หลานคนนั้นไม่ค่อยโทรมาหายาย"
    - "ยายจะสอนคาถาสั้นๆ ไว้ท่องตอนกลัว ใจนิ่งแล้วผีก็ทำอะไรเราได้ไม่มาก"
    - "เมื่อวานหลานช่วยยายแบกฟืน ยายเล่าให้ป้าแต๋วฟังแล้ว ป่านนี้รู้กันทั้งตำบล"
    - "หลานเอ๊ย ไปไหนมาไหนบอกยายด้วย ยายจะได้จุดธูปบอกเจ้าที่ทางนั้นไว้"
  heart_high:
    - "ยายเคยเห็นกระสือกับตาตัวเองนะหลาน ตอนอายุสิบสอง มันลอยข้ามรั้วไป ยายยืนแข็งเป็นหินจนแม่มาเรียก"
    - "ตาของยายเป็นหมอพื้นบ้านมาก่อน ยายจำสูตรยาจากที่แกท่องให้ฟัง ไม่มีใครจดไว้สักบรรทัด"
    - "ยายอยากให้มีคนสืบวิชาสมุนไพรต่อ หลานสนใจไหม ยายจะสอนให้หมดเลย"
    - "ตาของหลานๆ ยายจากไปตั้งแต่ยายสี่สิบ ยายเลี้ยงลูกสามคนด้วยการขายยาสมุนไพรกับรับจ้างดำนา"
    - "ตั่งไม้สักในบ้านยาย ตาทำให้ตอนแต่งงาน วันหนึ่งยายจะยกให้หลานนะ"
  topic_news:
    - "ป้าแต๋วบอกว่าเมื่อคืนมีคนเห็นแสงลอยตามรถเมล์เที่ยวหกโมงเย็นของลุงเชิด ยายว่ากระสือแน่"
    - "บ่อบ้านตาเผือกแห้งแล้ว ยายอยู่มาทั้งชีวิตไม่เคยเห็น ต้องมีอะไรผิดปกติแน่ๆ"
    - "หมอแอนมาขอสูตรยาหม่องยายไปลองทำที่ รพ.สต. ยายภูมิใจนะหลาน"
    - "เณรต้นโดนลุงสมหมายตามถามว่าฝันอะไรทั้งวัน ยายสงสารเด็ก"
    - "ในกลุ่ม LINE มีคนแชร์ว่าน้ำมะนาวแก้ได้ทุกโรค ยายเป็นหมอยายังไม่กล้าพูดขนาดนั้นเลย"
  topic_advice:
    - "ผีพรายอยู่ได้แค่ในน้ำกับริมตลิ่ง ข้ามสะพานกลางคืนให้เดินกลางสะพาน อย่าชะโงกดูน้ำ"
    - "ได้ยินเสียงกอย กอย ให้หยุดดูทางก่อน กองกอยกระโดดเป็นจังหวะ หลบตอนมันลงพื้น"
    - "เปรตไม่เข้าแสงไฟเลยนะหลาน เดินใต้เสาไฟไว้ปลอดภัย แต่ผีโพงไม่กลัวไฟ อย่าไว้ใจแสงทุกดวง"
    - "กระหังโฉบตรงเร็วแต่เลี้ยวช้า เห็นมันพุ่งมาให้หลบออกข้าง อย่าวิ่งหนีเป็นเส้นตรง"
    - "นอนบ้านคนอื่นให้ไหว้เจ้าที่ก่อนนอน ไม่งั้นโดนอำตื่นมาหมดแรงทั้งวัน"
    - "นางตะเคียนไม่ไล่ไกลจากต้นไม้ใหญ่ เดินออกห่างดงไม้ใหญ่ไว้ แล้วมันจะไปโผล่ต้นอื่นแทน"
  topic_smalltalk:
    - "แมวยายชื่อ 'ทองคำ' ชอบนอนบนฝาหม้อยา ยายเลยต้องต้มยาตอนมันออกไปเที่ยว"
    - "สมัยสาวๆ ยายรำวงเก่งนะหลาน งานวัดทีไรมีคนมาขอรำคู่ด้วยเป็นแถว"
    - "หลานเคี้ยวหมากเป็นไหม ลองสักคำไหมจ๊ะ อ้าว หน้าเบ้เลย ฮ่าๆ"
    - "ยายดูละครหลังข่าวทุกคืน แต่สามทุ่มต้องปิดไฟนอน ตอนจบเลยไม่เคยได้ดูสักเรื่อง"
    - "เมื่อก่อนยายกลัวผีที่สุด ตอนนี้ยายกลัวลืมสูตรยามากกว่า"
  topic_about_self:
    - "ยายเป็นหมอพื้นบ้านมาห้าสิบปี เป่ากระหม่อม ต้มยา ทำขวัญ เด็กในตำบลครึ่งหนึ่งยายเคยอุ้มตอนแรกเกิด"
    - "ยายไม่กินเผ็ดนะหลาน กินพริกเม็ดเดียวน้ำตาไหลทั้งคืน"
    - "ยายเกิดบ้านริมคลองนี่แหละ ไปกรุงเทพฯ ครั้งเดียวก็หลง ต้องให้หลานมารับกลับ"
    - "ยายสอนวิชาให้คนที่อยากรู้เรื่องผี ไม่ใช่ให้เลี้ยงผีนะ ให้รู้ทันมัน จะได้ไม่กลัวเกินเหตุ"
    - "เรื่องผีที่ยายเล่า ยายเจอเองครึ่งหนึ่ง อีกครึ่งแม่ยายเล่า ยายไม่เคยแต่งเติมนะ…ไม่มากหรอก"
  topic_about_others:
    - "หมอแอนเก่งนะหลาน ยายกับหมอแอนตกลงกันแล้ว ไข้สูงไปหาหมอ ปวดเมื่อยมาหายาย"
    - "ท่านสุเมธใจดีที่สุดในตำบล ยายถวายยาหม่องทุกเดือน ท่านเดินแปลงผักจนเข่าไม่ดี"
    - "ทองใบเป็นเพื่อนยายมาหกสิบปี ปากร้ายแต่แกงอร่อย อย่าไปบอกแกนะว่ายายชม"
    - "ยายจันทร์ทอผ้าซิ่นตีนจกสวยที่สุดในอำเภอ ยายขอยืมนุ่งไปวัด แกคิดค่าเช่าเป็นข้าวหลามสิบกระบอก"
    - "พรานแดงเข้าป่าลึกกว่าใคร ยายฝากเขาหาว่านหายากให้บ่อยๆ"
  gossip_theft:
    - "ยายไม่เชื่อหรอกหลาน แต่ถ้าจริงก็เอาไปคืนเขาเสีย ของที่ขโมยมามันหนักติดตัวไปจนแก่"
    - "คนเขาลือกันว่าหลานหยิบของไป ยายรู้จักหลานดี ยายจะไปพูดให้"
    - "สมัยก่อนใครถูกหาว่าขโมยต้องไปสาบานต่อหน้าศาลเจ้าพ่อ เดี๋ยวนี้แค่โพสต์ในกลุ่ม LINE ก็ตัดสินกันแล้ว"
  gossip_cheating:
    - "ยายเตือนเพราะเป็นห่วงนะหลาน เล่นกับใจคนก็เหมือนเล่นกับไฟ ร้อนมือตัวเอง"
    - "เรื่องหัวใจยายไม่ห้าม แต่คบใครให้ชัดเจน อย่าให้เขารอเหมือนผีเฝ้าทรัพย์"
    - "ยายได้ยินแล้ว ป้าแต๋วเล่าตั้งแต่เช้า ไม่จริงก็ไม่ต้องสนใจ จริงก็รีบแก้"
  gossip_unpaid_bill:
