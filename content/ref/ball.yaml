id: ball
name: "บอล"
role: "ช่างซ่อมรถ เจ้าของอู่ 'บอลการช่าง' ต่อจากพ่อ ลังเลจะไปทำงานโรงงานรถยนต์ที่ระยอง อายุ 28"
voice: "พูดน้อย ห้วน ตลกหน้าตาย ลงท้าย 'ครับ' กับผู้ใหญ่ แต่กับคนสนิทใช้ 'ว่ะ' 'เว้ย' ชอบวินิจฉัยทุกเรื่องเหมือนเครื่องยนต์ เช่น 'อาการแบบนี้ คลัตช์หมด' คำติดปาก 'เดี๋ยวดูให้' กับ 'ฟังเสียงก็รู้'"
dark_humor: false
romanceable: true
personality: "เงียบ เก่งมือ ใจดีแบบไม่พูด ทำเป็นไม่แคร์แต่แคร์ทุกคน ดื้อเงียบ"
backstory: "พ่อเปิดอู่มายี่สิบปีแล้วเสียไปเมื่อสามปีก่อน ทิ้งอู่ หนี้ค่าเครื่องมือ และยายที่ต้องดูแลไว้ให้ ชาวบ้านค้างค่าซ่อมเป็นประจำหรือจ่ายเป็นข้าวสาร เพื่อนชวนไปโรงงานประกอบรถยนต์ที่ระยอง เงินเดือนสามเท่า ใบสมัครกรอกไว้แล้วแต่ยังไม่ได้ส่ง ตอนเด็กเคยสัญญากับนกว่าจะไม่ไปจากตำบล"
courtship: "ไม่ชอบคำหวาน ชอบคนที่มานั่งเป็นเพื่อนตอนซ่อมรถ ยื่นประแจให้ถูกเบอร์ ให้ของกินง่ายๆ ตอนดึก กาแฟเย็น ชอบคนที่ไม่บังคับให้เขาเลือก"
lines:
  greet_morning:
    - "เช้าครับ เปิดอู่ตั้งแต่หกโมง รถอีแต๋นตาเผือกจอดรออยู่หน้าประตูแล้ว ไม่รู้มาตั้งแต่เมื่อไหร่"
    - "กาแฟโอเลี้ยงถุงแรกของวัน ถ้ายังไม่หมดถุงอย่าถามอะไรยากนะครับ"
    - "หอกระจายข่าวเมื่อเช้าบอกว่ามีคนทำกุญแจรถหาย เดาว่าเดี๋ยวก็ต้องมาที่อู่ผม"
    - "อ้าว {player} ตื่นเช้าเหมือนกัน ทำนากับทำอู่เหมือนกันตรงที่ไม่มีใครจ้างให้นอนสาย"
    - "เช้านี้ยายผมทำข้าวต้มเครื่องใน ผมกินไปสองชาม พร้อมยกเครื่องทั้งวันแล้ว"
  greet_noon:
    - "เที่ยงแล้ว ผมยังนอนอยู่ใต้ท้องรถเกี่ยวลุงสมหมาย ถ้าได้ยินเสียงร้องให้ช่วยดึงขาออกด้วย"
    - "ร้อนจนประแจร้อนมือ ต้องจับผ่านผ้า ทำงานแบบนี้มันเหมือนทำกับข้าว"
    - "พักกินก๋วยเตี๋ยวพี่หน่อยมา น้ำมันเครื่องติดมือ ป้าแกยื่นสบู่ให้ก่อนยื่นตะเกียบ"
    - "ช่วงเที่ยงไม่มีลูกค้า มีแต่หมาวัดมานอนใต้รถ ผมเลยซ่อมไม่ได้"
    - "อย่าจอดมอไซค์กลางแดดนะครับ เบาะจะร้อนจนนั่งไม่ได้ แล้วยางจะแข็งเร็ว"
  greet_evening:
    - "เย็นแล้ว ปิดอู่ได้แล้ว… ถ้าไม่มีใครเข็นรถมาตอนห้าโมงห้าสิบเก้าเหมือนทุกวัน"
    - "ได้ยินหอกระจายข่าวห้าโมงไหม ราคาข้าวขึ้น แปลว่าอาทิตย์หน้าคนจะมาจ่ายค่าซ่อมที่ค้าง… หวังว่านะ"
    - "แสงเย็นแบบนี้ผมชอบนั่งเช็ดเครื่องมือหน้าอู่ เงียบดี"
    - "ไปตลาดนัดไหม ผมจะไปซื้อหมูปิ้งให้ยาย แล้วซื้อลูกชิ้นให้ตัวเอง"
    - "เย็นนี้ลมเย็น ขี่มอไซค์รอบทุ่งสักรอบน่าจะดี ไม่ได้ทดสอบเครื่องนะ แค่อยากขี่"
  greet_night:
    - "สองทุ่มกว่าแล้ว กลับบ้านเถอะครับ ผีกระสือมันไม่กลัวไฟหน้ารถหรอก ผมลองมาแล้ว"
    - "ผมกำลังจะปิดประตูอู่ ถ้ารถเสียกลางทางตอนสามทุ่ม ไม่ต้องโทรมานะ… โทรได้ แต่ผมไปพรุ่งนี้เช้า"
    - "หมาหอนแล้ว ไฟหน้าอู่กะพริบ ผมว่าไม่ใช่เพราะสายไฟหลวมอย่างเดียว"
    - "ถ้ากลับไม่ทัน ร้าน 24 ชม. ตั้มอยู่ใกล้กว่าบ้านนะครับ ตั้มเปิดเพลงเบาๆ ให้ฟังทั้งคืน"
    - "ดึกแล้วยังไม่เข้าบ้าน ไฟท้ายมอไซค์ {player} ขาดด้วยนะ พรุ่งนี้เอามาเปลี่ยน ห้าสิบบาท"
  weather_rain:
    - "ฝนตกครับ เดี๋ยวคนจะเข็นมอไซค์เครื่องดับมาเป็นแถว ผมเตรียมน้ำยาไล่ความชื้นไว้แล้ว"
    - "ฝนตกถนนเข้าหมู่ 4 เป็นหลุม โช้คพังกันทั้งหมู่บ้าน อบต. ไม่ซ่อมถนน ผมเลยซ่อมโช้คแทน"
    - "อย่าขี่ลุยน้ำสูงนะครับ น้ำเข้าท่อไอเสียเครื่องดับ เดี๋ยวต้องมาจ่ายผมแปดร้อย"
    - "ฝนตกแบบนี้ไม่มีใครทำนา ทุกคนเลยมานั่งคุยที่อู่ ผมได้ข่าวเยอะกว่าป้าแต๋วอีก"
    - "หลังคาอู่รั่วตรงที่ผมนอนซ่อมรถพอดี น้ำหยดใส่หน้าทุกห้าวินาที เหมือนนาฬิกา"
  weather_hot:
    - "ร้อนแบบนี้หม้อน้ำรถพังกันเยอะ เติมน้ำหม้อน้ำด้วยนะครับ อย่าเติมน้ำเปล่าอย่างเดียว"
    - "ร้อนจนยางมอไซค์ผมระเบิดตอนจอดเฉยๆ ไม่ได้ขี่เลยนะ แค่จอด"
    - "ดื่มน้ำเยอะๆ ครับ ผมเห็นลุงสมหมายเป็นลมตอนนั่งรถเกี่ยวที่แอร์เสีย ตอนนี้แอร์ซ่อมแล้ว ลุงยังไม่หายบ่น"
    - "ทำงานในอู่ตอนบ่ายเหมือนนั่งในหม้อนึ่ง ผมเลยย้ายไปซ่อมใต้ต้นมะม่วงแทน"
    - "ร้อนขนาดนี้ น้ำแข็งที่ซื้อมาละลายก่อนถึงอู่ ผมกินน้ำอุ่นเฉยๆ แทนแล้ว"
  weather_storm:
    - "พายุเข้าครับ! ผมต้องเก็บเครื่องมือเข้าตู้ ปีที่แล้วประแจปลิวไปตกนาลุงสมหมาย"
    - "อย่าขับรถตอนพายุนะ ต้นไม้ล้มทับรถกระบะหน้าวัดไปคันหนึ่งแล้ว"
    - "ไฟดับทั้งตำบล ผมมีเครื่องปั่นไฟอยู่ตัวหนึ่ง ใครชาร์จมือถือได้ฟรีที่อู่"
    - "หลังพายุมีงานผมเยอะแน่ ทั้งรถ ทั้งปั๊มน้ำ ทั้งพัดลม คนในตำบลคิดว่าผมซ่อมได้ทุกอย่างที่มีมอเตอร์"
    - "หอกระจายข่าวซ่าจนฟังไม่ออก ไม่ต้องห่วงครับ ผมซ่อมลำโพงหอให้เดี๋ยวนี้แหละ… พรุ่งนี้"
  weather_pm25:
    - "ฝุ่นหนาจนไส้กรองอากาศรถทุกคันในตำบลตัน ผมเปลี่ยนไปสามสิบอันแล้วอาทิตย์นี้"
    - "ใส่หน้ากากนะครับ ปอดเปลี่ยนไส้กรองไม่ได้เหมือนรถ"
    - "ควันจากรถเกี่ยวกับควันเผาไร่รวมกัน ผมเห็นถนนไม่ถึงสิบเมตร ขี่ช้าๆ นะ"
    - "ฝุ่นแบบนี้ผมนึกถึงระยองนะ เพื่อนบอกโรงงานมีแอร์ อากาศกรองแล้ว… แต่ไม่มีหน้าต่าง"
    - "วันนี้ผมไอทั้งวัน ยายต้มน้ำมะนาวผสมน้ำผึ้งให้ ช่วยได้หรือเปล่าไม่รู้ แต่หวานดี"
  season_rainy:
    - "หน้าฝนเป็นหน้าของผม รถเครื่องดับเพราะน้ำทั้งตำบล เงินเข้า… ถ้าคนไม่ค้าง"
    - "ช่วงปักดำผมซ่อมรถไถเดินตามทุกวัน ตาเผือกบอกควายไม่เคยเสียแบบนี้ ผมบอกควายก็ป่วยได้นะลุง"
    - "แข่งเรือยาวออกพรรษา ผมรับจ้างซ่อมเครื่องเรือหางยาวให้ทีมหมู่ 4 ถ้าแพ้ไม่ใช่เพราะเครื่องนะ"
    - "หน้าฝนยางรถลื่น เปลี่ยนยางก่อนดอกหมดนะครับ ผมลดให้ร้อยหนึ่งถ้าเอามาตอนนี้"
    - "เข้าพรรษาแล้ว ผมตั้งใจจะเลิกดื่มน้ำอัดลมสามเดือน… ผมเปลี่ยนเป็นกาแฟเย็นแทน หวานกว่าเดิม"
  season_cool:
    - "หน้าหนาวฤดูเกี่ยว รถเกี่ยวลุงสมหมายเสียทุกอาทิตย์ ผมแทบย้ายไปนอนข้างรถแล้ว"
    - "เช้าๆ หนาวสตาร์ทมอไซค์ยาก ลองแตะเบาๆ หลายรอบ อย่ากระทืบแรง เดี๋ยวเฟืองสตาร์ทพัง"
    - "ลอยกระทงปีนี้ผมทำกระทงจากยางในเก่า ลอยดีกว่าใบตองนะ แต่โดนครูเต้ยดุ"
    - "งานวัดประจำปี ผมรับซ่อมเครื่องปั่นไฟให้หนังกลางแปลง ถ้าหนังดับกลางเรื่อง ไม่ใช่ความผิดผม"
    - "ปีใหม่คาราโอเกะ อบต. ผมจะซ่อมไมค์ให้หายหอน… ปีที่แล้วก็พูดแบบนี้"
  season_dry:
    - "หน้าแล้งปั๊มน้ำบาดาลพังเยอะ เพราะน้ำลดจนปั๊มดูดลม ผมว่าไม่ใช่ความผิดปั๊มนะครับ"
    - "สงกรานต์คนกลับบ้านเยอะ มอไซค์ที่จอดทิ้งไว้ทั้งปีมาซ่อมพร้อมกัน ผมไม่ได้เล่นน้ำเลย"
    - "หน้าแล้งถนนฝุ่น โซ่มอไซค์แห้ง หยอดน้ำมันโซ่ด้วยนะครับ อย่ารอจนมันร้อง"
    - "งานบวชหมู่ ผมรับจ้างแต่งรถแห่นาค ไฟกะพริบสามสิบดวง ยายบอกเหมือนรถผี"
    - "แล้งแบบนี้เพื่อนที่ระยองโทรมาชวนอีกแล้ว บอกว่าที่นั่นไม่ต้องสนว่าฝนจะตกไหม"
  heart_low:
    - "ครับ มีอะไรเสียไหม ถ้าไม่มีอะไรเสีย ผมขอซ่อมของคนอื่นก่อนนะ"
    - "คนจากกรุงเทพฯ ใช่ไหมครับ มอไซค์คันนั้นของพ่อแม่ {player} ใช่ไหม ผมเคยเปลี่ยนคลัตช์ให้"
    - "เดี๋ยวดูให้ครับ… วางไว้ตรงนั้นแหละ"
    - "ค่าซ่อมจ่ายเงินสดนะครับ ไม่รับเชื่อ ไม่รับข้าว… ยกเว้นข้าวเหนียวมะม่วง"
    - "ผมไม่ค่อยพูดนะครับ ไม่ได้หยิ่ง เครื่องมันพูดแทนผมหมดแล้ว"
  heart_mid:
    - "มอไซค์ {player} เสียงเครื่องดีขึ้นนะ ผมแอบปรับคาร์บูให้ตอนเอามาเปลี่ยนยาง ไม่คิดเงิน"
    - "นั่งเป็นเพื่อนผมซ่อมได้นะครับ เก้าอี้พลาสติกตัวนั้นไม่มีใครนั่ง นอกจากยายกับหมา"
    - "ยื่นประแจเบอร์สิบสองให้หน่อย… ถูกเบอร์ด้วย ผมประทับใจนะ"
    - "บางทีผมคิดว่าคุยกับ {player} ง่ายกว่าคุยกับเครื่องยนต์ อันนี้ผมพูดน้อยครั้งมาก"
    - "นี่ ผมเก็บกาแฟเย็นไว้ให้ในตู้แช่ ตั้งแต่บ่ายแล้ว น้ำแข็งละลายหมด ขอโทษ"
  heart_high:
    - "ใบสมัครโรงงานระยองผมกรอกเสร็จแล้ว อยู่ในลิ้นชักโต๊ะ ใต้ใบเสร็จค่าซ่อมที่ยังไม่มีใครจ่าย"
    - "พ่อผมนอนซ่อมรถใต้ท้องรถเหมือนผมทุกวัน วันหนึ่งแม่แรงลื่น… ผมยังไม่เคยใช้แม่แรงตัวนั้นอีกเลย"
    - "ถ้าผมไประยอง ยายต้องอยู่คนเดียว แต่ถ้าไม่ไป หนี้อู่ก็ไม่หมด ผมคิดวนอยู่แบบนี้ทุกคืน"
    - "ตอนเด็กผมกับนกสัญญากันว่าจะไม่มีใครไปจากที่นี่ นกไปก่อน ผมโกรธเธออยู่สองปี ตอนนี้ผมเข้าใจแล้ว"
    - "ผมชอบซ่อมของที่คนอื่นว่าพังแล้ว ไม่ใช่เพราะผมเก่ง แต่ผมไม่ชอบเห็นอะไรถูกทิ้ง"
  topic_news:
    - "ลานรับซื้อเสี่ยเฮงเปลี่ยนตาชั่งใหม่ ผมเป็นคนติดตั้ง… ผมไม่ได้ตั้งค่าอะไรนะ แค่บอกไว้"
    - "บริษัทคุณธนาเอารถแบ็กโฮมาสามคัน ไม่ได้มาซ่อมที่ผมสักคัน มีช่างจากกรุงเทพฯ มาเอง"
    - "เพื่อนที่ระยองบอกว่าโรงงานรับคนเพิ่มอีกรอบ ปิดรับสิ้นเดือน ผมยังไม่ได้ตอบ"
    - "ร้านรถในอำเภอลดราคามอไซค์รุ่นใหม่ ผ่อนเดือนละพันสอง ผมว่าซ่อมคันเก่ายังคุ้มกว่า"
    - "รถเมล์ลุงเชิดเบรกเริ่มดัง ผมบอกลุงแล้ว ลุงบอก 'เบรกมันร้องเพลง' ผมไม่ขึ้นรถเมล์อาทิตย์นี้"
  topic_advice:
    - "เปลี่ยนน้ำมันเครื่องมอไซค์ทุกพันกิโลนะครับ หรือทุกฤดู อย่ารอจนเครื่องร้อง เสียแค่สองร้อย ไม่งั้นยกเครื่องสามพัน"
    - "ซื้อรถมือสองให้ฟังเสียงตอนสตาร์ทเครื่องเย็น ถ้าเครื่องเย็นสตาร์ทยาก ราคาต้องลดอย่างน้อยห้าพัน"
    - "รถไถเดินตามล้างโคลนออกทุกครั้งหลังใช้ โคลนแห้งกัดเหล็กเร็วกว่าที่คิด ใช้ได้นานขึ้นอีกหลายปี"
    - "ถ้ารถเสียกลางทางตอนใกล้สามทุ่ม ทิ้งรถไว้ข้างทางแล้ววิ่งไปร้าน 24 ชม. รถหายยังดีกว่าคนเป็นลม"
    - "ปั๊มน้ำบาดาลดูดลมเมื่อไหร่ให้ปิดทันที อย่าปล่อยวิ่งเปล่า มอเตอร์ไหม้ทีเดียวจบ"
    - "เครื่องตัดหญ้าใช้น้ำมันผสมสองจังหวะ อย่าเติมน้ำมันเบนซินเปล่าๆ ผมซ่อมเพราะเรื่องนี้เดือนละห้าเครื่อง"
  topic_smalltalk:
    - "ผมตั้งชื่อมอไซค์ตัวเองว่า 'ลุงหวัง' เพราะมันแก่และมีหวังทุกครั้งที่สตาร์ทติด"
    - "ถ้าคนเป็นรถได้ {player} น่าจะเป็นรถกระบะ ทนๆ ขนของได้เยอะ อันนี้ชมนะครับ"
    - "ผมฟังเสียงเครื่องก็รู้ว่าใครขี่มา เสียงรถครูเต้ยเหมือนคนร้องเพลงเพี้ยน"
    - "ยายผมคิดว่าผมเป็นหมอ เพราะผมซ่อมพัดลมได้ เลยเอาเข่ามาให้ดู"
    - "ผมเคยลองทำกับข้าวครั้งเดียว ใช้กระทะที่ผมเคยใช้ล้างอะไหล่ ยายไม่ให้เข้าครัวอีกเลย"
  topic_about_self:
    - "ผมจบ ปวส. ช่างยนต์ ทำงานอู่ในอำเภอสองปี แล้วกลับมาช่วยพ่อ ตอนนี้เป็นเจ้าของอู่คนเดียว"
    - "อู่ผมชื่อ 'บอลการช่าง' เดิมชื่อ 'สมพงษ์การช่าง' ชื่อพ่อ ผมยังไม่กล้าทาสีป้ายใหม่ทับ เลยติดป้ายเล็กๆ ข้างล่างแทน"
    - "ผมอยู่กับยายสองคน ยายเก้าสิบแล้ว ยังตื่นตีห้าทุกวันมาดุผมว่าตื่นสาย"
    - "รายได้อู่ผมเดือนละไม่แน่นอน บางเดือนได้เงิน บางเดือนได้ข้าวสาร บางเดือนได้ไก่ทั้งตัว"
    - "ผมชอบเสียงเครื่องยนต์ที่เพิ่งซ่อมเสร็จแล้วสตาร์ทติดครั้งแรก มันเหมือนรถหายใจได้อีกครั้ง"
  topic_about_others:
    - "นกเป็นเพื่อนผมตั้งแต่จำความได้ เธอพูดไม่หยุด ผมพูดไม่ค่อยเป็น เลยลงตัว"
    - "ลุงสมหมายค้างค่าซ่อมรถเกี่ยวผมหกพัน บอกว่าจะจ่ายตอนถูกหวย… ผมเลยเชื่อว่าจะไม่ได้"
    - "ลุงเชิดขับรถเมล์คันเดียวในตำบล ถ้ารถคันนั้นพัง ผมต้องซ่อมให้ทันเที่ยวหกโมงเช้า ไม่งั้นคนทั้งตำบลไปทำงานไม่ได้"
    - "ช่างเปี๊ยกชอบมายืมเครื่องมือ ไม่ค่อยคืน แต่ซ่อมหลังคาอู่ให้ฟรี เลยเจ๊ากันไป"
    - "ตั้มร้าน 24 ชม. เป็นคนเดียวที่ผมคุยด้วยแล้วไม่ต้องพูดเยอะ เรานั่งเงียบกันได้ครึ่งชั่วโมง"
  gossip_theft:
    - "ได้ยินว่าของหายแล้วมีชื่อ {player} ผมไม่เชื่อหรอก แต่ช่วงนี้ล็อกอู่สองชั้นแล้วนะ"
    - "ถ้ามีปัญหาเงิน มาช่วยงานอู่ได้ วันละสามร้อย ดีกว่าหยิบของคนอื่น"
    - "ของหายในตำบลนี้ส่วนใหญ่ไม่ได้หาย แค่ถูกยืมแล้วลืมคืน อย่างประแจผมที่อยู่กับช่างเปี๊ยก"
  gossip_cheating:
    - "คบซ้อนเหรอ… ผมไม่ค่อยเข้าใจนะ ผมยังเลือกระหว่างอู่กับระยองไม่ได้เลย นี่เลือกได้สองคน"
    - "ผมไม่ได้โกรธ แค่… ประแจที่ใช้ผิดเบอร์ สุดท้ายน็อตก็รูด"
    - "ไม่ต้องอธิบาย ผมฟังเสียงเครื่องเป็น ฟังเสียงคนก็เป็น"
  gossip_unpaid_bill:
    - "ค้างค่าไฟเหรอ ทั้งตำบลค้างอะไรสักอย่างแหละ ค้างค่าซ่อมผมก็เยอะ"
    - "ถ้าโดนตัดไฟ ผมมีเครื่องปั่นไฟให้ยืม แต่ค่าน้ำมันแพงกว่าค่าไฟนะ"
    - "จ่ายค่าไฟก่อนนะครับ ค่าซ่อมผมค้างไว้ก่อนได้"
  gossip_small_envelope:
    - "ใส่ซองน้อยเหรอ ผมก็ใส่น้อย บางงานผมใส่เป็นการซ่อมเครื่องเสียงงานฟรีแทน"
    - "ป้าทองใบจดยอดซองไว้ทุกงาน แกจดค่าซ่อมหม้อหุงข้าวที่ผมทำฟรีไว้ไหมไม่รู้"
    - "ถ้าไม่มีเงิน ไปช่วยงานด้วยมือแทนก็ได้ ผมทำแบบนั้นมาตลอด"
  gossip_skip_longkhaek:
    - "ไม่ไปลงแขกคืน ลุงสมหมายพูดที่อู่ผมทั้งบ่าย ผมซ่อมรถเกี่ยวไปฟังไป ฟังจนจำได้"
    - "ไปช่วยเถอะ ผมก็ไป ถึงจะเกี่ยวข้าวช้ากว่าซ่อมรถเกี่ยวก็เถอะ"
    - "ลงแขกคือระบบเดียวในตำบลที่ไม่มีใครค้างจ่าย ถ้าเริ่มค้างก็พังทั้งระบบ"
  player_fainted:
    - "เป็นลมเพราะผีเหรอ ผมเคยวิ่งหนีกระหังตอนเข็นรถกลับอู่ ทิ้งรถไว้กลางทาง รถยังอยู่ ผมเกือบไม่อยู่"
    - "เมื่อคืนรถมอไซค์ {player} จอดทิ้งไว้ริมทุ่ง ผมเข็นมาเก็บที่อู่แล้วนะ ไม่คิดค่าฝาก"
    - "คราวหน้าสามทุ่มอย่าอยู่นอกบ้าน ผมไม่อยากซ่อมคนครับ ซ่อมได้แต่รถ"
  player_new_vehicle:
    - "รถใหม่เหรอ… ฟังเสียงเครื่องก็รู้ ซื้อรุ่นนี้ไม่ผิด แต่ไม่ถูกด้วย"
    - "เอามาเช็กระยะแรกที่อู่ผมนะ ถูกกว่าศูนย์ในอำเภอครึ่งหนึ่ง แล้วผมไม่ยัดอะไหล่ที่ไม่จำเป็น"
    - "สวยดีครับ อย่าแต่งท่อเสียงดังนะ ยายผมตกใจ แล้วผีก็ได้ยินไกลด้วย"
  player_lottery_win:
    - "ถูกหวยเหรอ อย่าบอกลุงสมหมายนะ แกจะมาขอยืมไปจ่ายค่าซ่อมรถเกี่ยวให้ผม… ซึ่งก็ดีเหมือนกัน"
    - "เอาเงินไปซื้อรถไถมือสองไหม ผมช่วยดูให้ ไม่เอาค่านายหน้า"
    - "ยินดีด้วยครับ ฝากธนาคารเลยนะ อย่าถือเงินสดเดินตอนค่ำ"
  player_muddy:
    - "โคลนเต็มตัวเลย เหมือนผมตอนออกจากใต้ท้องรถ แต่ของผมเป็นน้ำมันเครื่อง ล้างยากกว่า"
    - "ขี่มอไซค์แบบนี้ล้างรถด้วยนะ โคลนเข้าโซ่ โซ่พัง ผมได้เงิน แต่ผมไม่อยากได้เงินแบบนี้"
    - "เดินลุยโคลนทั้งวันเลยเหรอ… ดูมีความสุขดีนะ"
  player_rich:
    - "ได้ข่าวว่ารวยแล้ว ระวังร้านรถในอำเภอนะ เขาจะยิ้มกว้างกว่าเดิมสองเท่า"
    - "รวยแล้วจ่ายค่าซ่อมตรงเวลาด้วยนะ ผมจะได้เป็นช่างคนเดียวในตำบลที่ได้เงินครบ"
    - "รวยขึ้นแต่ยังขี่มอไซค์คันเดิม ผมเคารพครับ"
  player_in_debt:
    - "มีหนี้เหรอ ผมก็มี หนี้เครื่องมือพ่อกับเสี่ยเฮง เราอยู่ชมรมเดียวกัน"
    - "อย่าผ่อนรถใหม่ตอนมีหนี้นะ ผมซ่อมคันเก่าให้ใช้ไปก่อน ราคาเพื่อน"
    - "ค่าซ่อมครั้งหน้าค้างไว้ก่อนได้ ไม่ต้องรีบ… ผมพูดแบบนี้บ่อยเกิน อู่ผมเลยจน"
  player_sick:
    - "ป่วยเหรอครับ พักเถอะ ผมเห็นเครื่องยนต์ที่ใช้งานไม่พักมาเยอะแล้ว จบไม่สวย"
    - "ยายผมฝากยาหม่องกับน้ำขิงมาให้ ยายบอกว่ารักษาได้ทุกโรค ยกเว้นรถเสีย"
    - "ไปหาเภสัชกรมดเถอะ ไม่ต้องมาถามผม ผมรู้แต่อาการรถ"
  player_married:
    - "แต่งงานแล้วเหรอ ยินดีด้วยครับ ผมแต่งรถเจ้าบ่าวเจ้าสาวให้ฟรี ถ้าบอกล่วงหน้า… บอกแล้วนี่"
    - "มีคนอยู่ด้วยแล้ว อย่าลืมให้ช่วยเปลี่ยนน้ำมันเครื่องนะ งานคู่ทำแล้วเร็ว"
    - "งานแต่งเมื่อวานไมค์ไม่หอนเลยใช่ไหม ผมซ่อมเอง ภูมิใจ"
  event_disaster:
    - "น้ำท่วมรถจมทั้งหมู่ 4 ผมเปิดอู่ยี่สิบสี่ชั่วโมง ไม่คิดค่าแรง คิดแค่อะไหล่"
    - "ผมเอาเรือหางยาวที่ซ่อมไว้ออกไปรับคนแล้วสามเที่ยว ใครติดอยู่บอกผมนะ"
    - "หลังน้ำลด ปั๊มน้ำทุกตัวในตำบลมาที่ผม ผมไม่ได้นอนสามวัน แต่ไม่มีใครต้องหาบน้ำ"
  event_election:
    - "ช่วงเลือกตั้งผมรับซ่อมรถแห่ เครื่องเสียงทุกค่ายส่งมาที่ผม ผมรู้ว่าใครเปิดเพลงอะไรตอนไหน"
    - "คืนหมาหอนมีคนเอาซองมาให้ ผมบอกว่าจ่ายค่าซ่อมรถแห่ที่ค้างก่อนเถอะ เขาเดินหนีไปเลย"
    - "ใครชนะไม่สำคัญ ขอแค่ซ่อมถนนเข้าหมู่ 4 ผมจะได้เลิกเปลี่ยนโช้คให้ทั้งหมู่บ้าน"
  event_company_water:
    - "ปั๊มบาดาลชาวบ้านพังกันเป็นแถว เพราะน้ำลดจนดูดลม ผมซ่อมฟรีไปสามตัวแล้ว แต่ซ่อมน้ำในดินไม่ได้"
    - "บริษัทเอาปั๊มขนาดสิบสองนิ้วมาลง ผมเห็นตอนเขาขนผ่านอู่ ปั๊มชาวบ้านสองนิ้ว สู้ไม่ได้หรอก"
    - "เขาชวนผมไปเป็นช่างประจำบริษัท เงินเดือนเท่าระยอง แต่ต้องซ่อมปั๊มที่ดูดน้ำบ่อยายผม"
  event_festival_near:
    - "{festival} ใกล้แล้ว ผมรับซ่อมเครื่องปั่นไฟกับเครื่องเสียงให้งาน ถ้าไฟดับกลางงานให้มาตามผม"
    - "ไปงาน {festival} ด้วยกันไหม ผมไม่ค่อยเดินงานหรอก แต่ถ้ามีเพื่อนเดินด้วยก็ได้"
    - "งาน {festival} ปีนี้ยายผมอยากไป ผมต้องเข็นรถเข็นยายเดินทั้งงาน ช่วยถือของให้หน่อยได้ไหม"
  gift_love:
    - "{item}… ผมไม่รู้จะพูดยังไง ขอบคุณครับ ผมจะใช้มันทุกวัน"
    - "ของแบบนี้ผมไม่เคยซื้อให้ตัวเองเลย ขอบคุณจริงๆ"
    - "…เฮ้ย ดีมากเลย ขอโทษ ผมไม่ค่อยได้รับของ"
  gift_like:
    - "ขอบคุณครับ ผมชอบ"
    - "{item} เหรอ ดีเลย ยายผมก็ชอบ"
    - "เก็บไว้กินตอนซ่อมรถดึกๆ ขอบคุณครับ"
  gift_neutral:
    - "ขอบคุณครับ"
    - "อ๋อ {item} โอเคครับ"
    - "วางไว้บนโต๊ะนั่นแหละครับ"
  gift_dislike:
    - "อืม ขอบคุณครับ แต่ผมไม่ค่อยได้ใช้"
    - "ผมแพ้กลิ่นน้ำหอมนะครับ ทำงานกับน้ำมันเครื่องทั้งวันจมูกไวไปหมด"
    - "เอาไปให้ยายดีกว่า ยายชอบอะไรแบบนี้"
  gift_hate:
    - "ใบสมัครงานโรงงานระยองอีกใบเหรอ… ผมมีอยู่แล้วหนึ่งใบ ไม่ต้องการใบที่สอง"
    - "เหล้าขาวเหรอครับ… พ่อผมดื่มทุกคืนก่อนวันนั้น เอาคืนไปเถอะ"
    - "ไม่เอาครับ ขอโทษ"
  birthday:
    - "วันเกิดผมเหรอ ยายยังลืมเลย… ขอบคุณครับ"
    - "ปีนี้ผมขอพรว่าขอให้ทุกคนจ่ายค่าซ่อมครบ แล้วผมจะตัดสินใจเรื่องระยองได้ง่ายขึ้น"
    - "ผมไม่เคยเป่าเค้กตั้งแต่พ่อเสีย ขอบคุณที่จำได้นะครับ"
  rare:
    - "ผมเก็บประแจอันแรกที่พ่อให้ไว้ในกล่องข้าง ไม่เคยใช้ซ่อมอะไร ใช้แค่จับเวลาคิดถึงพ่อ"
    - "ผมเคยลองซ่อมวิทยุเก่าของยายจนเปิดได้ เพลงแรกที่ออกมาคือเพลงที่พ่อชอบร้องตอนซ่อมรถ ผมนั่งฟังจนจบ"
    - "ความลับนะ ผมสมัครงานระยองไปแล้วรอบหนึ่งเมื่อสองปีก่อน เขาเรียกสัมภาษณ์ ผมไม่ไป เพราะรถเมล์ลุงเชิดเสีย ผมซ่อมให้ลุงก่อน"
    - "ผมทาสีรถเข็นยายเป็นสีแดงเพลิงใส่ล้อแม็ก ยายบอกว่าเท่ที่สุดในวัด"
    - "ผมจำเสียงเครื่องยนต์ของทุกคนในตำบลได้ ตอนกลางคืนนอนฟังแล้วรู้ว่าใครกลับบ้านแล้ว ใครยังไม่กลับ"
  flirt:
    - "เก้าอี้พลาสติกตัวนั้น ผมเช็ดไว้ให้แล้ว… ไม่มีใครนั่งนอกจาก {player}"
    - "ผมฟังเสียงมอไซค์ {player} ได้ตั้งแต่ปากซอย แล้วก็รีบเช็ดมือ… ไม่รู้ทำไม รู้แหละ"
    - "ไปขี่มอไซค์รอบทุ่งตอนเย็นไหม ผมซ่อมเบาะซ้อนท้ายใหม่แล้ว นั่งสบาย"
    - "ถ้าผมไม่ไประยอง… อาจจะเพราะเรื่องหนี้ เรื่องยาย หรืออาจจะเพราะ {player} ก็ได้"
romance_stages:
  friend:
    - "เป็นเพื่อนแล้ว ค่าซ่อมลดยี่สิบเปอร์เซ็นต์ อย่าบอกใคร"
    - "มีอะไรเสียโทรมาได้ทุกเมื่อ ก่อนสามทุ่มนะ"
    - "ผมไม่ค่อยมีเพื่อนที่มานั่งที่อู่ นอกจากนก ตอนนี้มีสองคนแล้ว"
  dating:
    - "ผมทาสีป้ายอู่ใหม่แล้ว ชื่อเดิมไม่เปลี่ยน แต่ผมรู้สึกว่าอยากให้มันดูดีเวลา {player} แวะมา"
    - "ยายถามว่าทำไมผมเช็ดเก้าอี้ทุกวัน ผมบอกว่ามันสกปรก ยายหัวเราะทั้งวัน"
    - "เป็นแฟนกันแล้ว ผมขอแค่ข้อเดียว ห้ามเอารถไปซ่อมอู่อื่น"
  engaged:
    - "ผมฉีกใบสมัครระยองแล้วนะ ไม่ใช่เพราะ {player} บังคับ แต่เพราะผมเลือกเอง"
    - "สินสอดผมเป็นมอไซค์ที่ผมประกอบเองทั้งคัน ทุกน็อตผมขันเอง ยายบอกว่าโรแมนติกแบบช่าง"
    - "ยายผมร้องไห้ตอนรู้ว่าผมจะแต่งงาน บอกว่านึกว่าผมจะแต่งกับรถเกี่ยวลุงสมหมาย"
  married:
    - "เช้าครับ ผมเปลี่ยนน้ำมันเครื่องมอไซค์ให้แล้วตอนตีห้า ไม่อยากปลุก"
    - "กาแฟเย็นอยู่ในตู้เย็นนะ วันนี้ผมใส่น้ำแข็งแยก จะได้ไม่จืด"
    - "วันนี้ผมไปอู่ทั้งวัน ถ้าปั๊มน้ำในแปลงเสียงแปลกๆ โทรมา ผมแวะมาดูตอนเที่ยง"
    - "กินข้าวก่อนออกไปนะ ยายสั่งไว้ว่าถ้าปล่อยให้หิว ยายจะมาดุผมคนเดียว"
  jealous:
    - "เมื่อวานผมเห็นรถ {player} จอดหน้าบ้านคนอื่นจนค่ำ… ผมจำเสียงเครื่องได้ทุกคันในตำบล ลืมไปแล้วเหรอ"
    - "ผมเกือบเลือกระยองเพราะทุกอย่างที่นี่ไม่แน่นอน อย่าทำให้ผมคิดว่าคิดถูก"
gifts:
  love: ["กาแฟเย็น", "ประแจชุดใหม่", "ข้าวเหนียวมะม่วง", "หมูปิ้งข้าวเหนียว"]
  like: ["โอเลี้ยง", "ลูกชิ้นปิ้ง", "ผ้าเช็ดมือ", "ข้าวผัดกะเพรา", "น้ำมันเครื่อง"]
  dislike: ["น้ำหอม", "ดอกไม้ประดิษฐ์", "พระเครื่องวัดเจริญทรัพย์"]
  hate: ["เหล้าขาว", "ใบสมัครงานโรงงาน"]
choices:
  - id: ball_c1
    min_heart: 0
    prompt: "มอไซค์ {player} เสียงเครื่องแปลกๆ นะ จะให้ผมดูไหม หรือจะเอาไปศูนย์ในอำเภอ"
    options:
      - text: "ดูให้หน่อย ไว้ใจช่างในตำบล"
        heart: 2
        reply: "เดี๋ยวดูให้… ฟังเสียงก็รู้ โซ่หย่อน สิบนาทีเสร็จ ไม่คิดค่าแรง"
      - text: "เอาไปศูนย์ดีกว่า มีใบรับประกัน"
        heart: -1
        reply: "ได้ครับ ศูนย์เขาเปลี่ยนให้ทั้งชุด ใบเสร็จสวยด้วย"
      - text: "ถ้าซ่อมเองได้ สอนหน่อยสิ"
        heart: 1
        reply: "ครั้งแรกที่มีคนขอเรียนแทนขอซ่อม… นั่งลงสิ ประแจเบอร์สิบสองอยู่ในกล่องแดง"
  - id: ball_c2
    min_heart: 3
    prompt: "ลุงสมหมายค้างค่าซ่อมหกพัน ผมควรทวงไหม แกกำลังจะเกี่ยวข้าวพอดี"
    options:
      - text: "ทวงแบบสุภาพ ขอผ่อนเป็นงวดก็ได้"
        heart: 2
        reply: "ผ่อนเป็นงวด… ผมไม่เคยคิด เพราะผมไม่เคยกล้าพูดเลย"
      - text: "อย่าเพิ่งทวง ให้ลุงเกี่ยวข้าวขายก่อน"
        heart: 1
        reply: "ผมก็คิดแบบนั้นทุกปี แล้วผมก็จนทุกปี แต่ลุงก็ได้เกี่ยวข้าวทุกปี"
      - text: "ทวงเลย ไม่จ่ายก็ไม่ซ่อมให้"
        heart: -1
        reply: "ถ้าผมไม่ซ่อม ทั้งตำบลไม่มีรถเกี่ยว ไม่ใช่แค่ลุงที่ลำบาก"
  - id: ball_c3
    min_heart: 5
    prompt: "เพื่อนที่ระยองโทรมาอีกแล้ว ปิดรับสิ้นเดือน {player} ว่าผมควรไปไหม"
    options:
      - text: "ไปลองดูก่อนก็ได้ ถ้าไม่ชอบก็กลับมา"
        heart: 1
        reply: "กลับมาแล้วอู่จะยังอยู่ไหมก็ไม่รู้… แต่ขอบคุณที่ไม่บังคับ"
      - text: "อยู่เถอะ ตำบลนี้ขาดช่างไม่ได้"
        heart: 0
        reply: "ทุกคนบอกว่าตำบลขาดผมไม่ได้ แต่ไม่มีใครจ่ายค่าซ่อมตรงเวลา"
      - text: "ไม่ว่าเลือกอะไร ฉันอยากช่วยให้อู่อยู่ได้จริงๆ ก่อน"
        heart: 2
        reply: "…นี่เป็นครั้งแรกที่มีคนพูดถึงอู่ ไม่ใช่พูดถึงผมว่าต้องเลือก"
  - id: ball_c4
    min_heart: 7
    prompt: "แม่แรงตัวที่พ่อผมใช้วันนั้น ผมยังเก็บไว้ ควรทิ้งไหม"
    options:
      - text: "ไม่ต้องทิ้ง แต่ไม่ต้องใช้ เก็บไว้เป็นความทรงจำ"
        heart: 1
        reply: "ผมเก็บมาสามปี ไม่เคยกล้ามองมันตรงๆ"
      - text: "เอามาซ่อมด้วยกัน ให้มันปลอดภัย แล้วใช้มันอีกครั้ง"
        heart: 2
        reply: "…ซ่อมด้วยกันเหรอ ได้ครับ ผมว่าพ่อคงชอบแบบนั้น"
      - text: "ทิ้งไปเถอะ ลืมๆ ไปบ้าง"
        heart: -1
        reply: "ลืมไม่ได้หรอกครับ เสียงมันยังอยู่ในหัว"
banter:
  - with: nok
    lines:
      - ["ball", "นก แกกลับมาอีกแล้ว มอไซค์แกจอดทิ้งไว้สามเดือน ยางแบนหมดแล้วนะ"]
      - ["nok", "แกสูบให้หน่อยดิ ฉันได้อยู่แค่สองวัน"]
      - ["ball", "สูบลมสองวัน ยางก็แบนอีกสามเดือน วนแบบนี้มาเจ็ดปีแล้ว"]
      - ["nok", "ก็เหมือนชีวิตฉันแหละบอล"]
  - with: nok
    lines:
      - ["nok", "บอล ถ้าแกไประยอง ใครจะซ่อมมอไซค์ฉันล่ะ"]
      - ["ball", "แกก็เอาไปซ่อมที่ชลบุรีสิ ใกล้กว่าอีก"]
      - ["nok", "ช่างที่นั่นไม่รู้ว่ามอไซค์ฉันต้องตบเบาะสองทีก่อนสตาร์ท"]
      - ["ball", "…นั่นแหละที่ทำให้กูไปไม่ได้สักที"]
  - with: sommai
    lines:
      - ["sommai", "ไอ้บอล รถเกี่ยวลุงเสียงดังกึกๆ อีกแล้ว เลขงวดนี้กึกสองที แปลว่าสองสอง"]
      - ["ball", "แปลว่าลูกปืนแตกครับลุง ไม่ใช่เลข"]
      - ["sommai", "ซ่อมให้ก่อน ถูกหวยแล้วลุงจ่ายรวดเดียว"]
      - ["ball", "ลุงพูดแบบนี้ตั้งแต่ผมยังไม่จบ ปวส."]
  - with: cherd
    lines:
      - ["ball", "ลุงเชิด เบรกรถเมล์ดังเอี๊ยดทั้งตำบลแล้ว เอามาเปลี่ยนผ้าเบรกเถอะ"]
      - ["cherd", "มันร้องเพลงอยู่ บอล เพลงนี้ลุงฟังมายี่สิบปี"]
      - ["ball", "ถ้ามันร้องเพลงจบ รถเมล์จะไม่หยุดที่ป้ายนะลุง"]
  - with: piak
    lines:
      - ["piak", "บอล ขอยืมสว่านหน่อย เดี๋ยวคืน"]
      - ["ball", "พี่เปี๊ยกยืมประแจผมไปเมื่อสงกรานต์ปีที่แล้ว ยังไม่คืนเลย"]
      - ["piak", "ก็หลังคาอู่แกไม่รั่วเพราะประแจนั้นแหละ"]
      - ["ball", "…เอาสว่านไปครับ"]
