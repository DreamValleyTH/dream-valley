id: daeng
name: "ลุงพรานแดง"
role: "พรานป่ารุ่นเก่าแห่งป่าชุมชนดงเย็น ครูสายล่าสัตว์และตกปลา"
voice: "พูดน้อยแต่คม เสียงแหบ ลงท้าย วะ เว้ย นะหลาน ชอบพูดเรื่องกฎของป่า เคารพเจ้าป่าเจ้าเขา ถือว่าเอาแต่พอกิน"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "เช้านี้ลุงไปกู้ไซมาแล้ว ได้ปลาซิวปลาสร้อยครึ่งข้อง พอทำปลาร้าได้"
    - "ตื่นเช้าดีหลาน ปลากินเหยื่อตอนเช้ามืดกับตอนเย็น กลางวันมันนอน"
    - "หมอกยังไม่จาง ลุงได้ยินไก่ป่าขันในป่าดงเย็น ปีนี้มันกลับมาเยอะขึ้น"
  greet_noon:
    - "เที่ยงแล้ว ลุงนั่งซ่อมแหอยู่ ตาขาดไปสามตา ปลาช่อนมันกัด"
    - "แดดแรงอย่างนี้ปลาลงน้ำลึก ตกไม่ได้หรอก รอเย็นเถอะหลาน"
    - "กินข้าวยัง ลุงมีปลาเผาเกลือเหลือตัวหนึ่ง แบ่งกันได้"
  greet_evening:
    - "เย็นแล้ว ลุงจะไปวางเบ็ดราวที่อ่างเก็บน้ำ พรุ่งนี้เช้าค่อยไปกู้"
    - "ตะวันตก ปลาเริ่มขึ้นมากินแมลงผิวน้ำ ตอนนี้แหละตกได้"
    - "เย็นนี้ลมเงียบ ป่าเงียบ ลุงไม่ชอบเลย ป่าเงียบแปลว่ามีอะไรรออยู่"
  greet_night:
    - "สองทุ่มแล้ว ลุงไม่อยู่ริมน้ำหลังสองทุ่มครึ่ง ผีพรายมันขึ้นมาตามตลิ่ง"
    - "กลับบ้านเถอะหลาน ป่ากลางคืนไม่ใช่ของคน"
    - "ถ้าต้องข้ามสะพานตอนดึก เดินกลางสะพาน อย่าเดินริม ลุงบอกแค่นี้"
  weather_rain:
    - "ฝนตก ปลาว่ายทวนน้ำขึ้นนา วางไซตรงทางน้ำไหลเข้าได้ปลาเต็ม"
    - "ฝนแบบนี้เห็ดขึ้น ป้าทองใบไปเก็บ ลุงไปเก็บปลา เราแบ่งป่ากัน"
    - "ฝนตกรอยสัตว์ชัด ลุงอ่านรอยได้ง่าย แต่ทางลื่นนะหลาน"
  weather_hot:
    - "ร้อนแบบนี้ปลาหอบ ลอยหัวในน้ำตื้น อย่าจับปลาที่หอบนะหลาน มันกำลังจะตาย"
    - "ร้อนจัดสัตว์ในป่าหลบในร่ม ลุงก็หลบ ไม่มีใครล่าใครหรอกวันนี้"
    - "ดื่มน้ำเยอะๆ หลาน ลุงเคยเป็นลมแดดกลางป่า ตื่นมาลิงมานั่งดู"
  weather_storm:
    - "พายุมา อย่าเข้าป่า ต้นไม้ล้มทับพรานตายมานักต่อนักแล้ว"
    - "ฟ้าแบบนี้น้ำในอ่างขึ้นเร็ว ลุงต้องไปกู้ไซก่อนน้ำพัดไป"
    - "อยู่บ้านนะหลาน พายุไม่ใช่เวลาของพราน"
  weather_pm25:
    - "ฝุ่นแบบนี้ใครเผาป่าแน่ สัตว์หนีหมด ไข่นกในรังก็สุกคารัง"
    - "หายใจไม่ค่อยออก ใส่หน้ากากนะหลาน ลุงใส่ผ้าขาวม้าปิดจมูกแทน"
    - "ฝุ่นลงน้ำ ปลาก็ไม่กินเหยื่อ ลุงพักวันหนึ่ง"
  season_rainy:
    - "หน้าฝนปลาวางไข่ ลุงไม่จับปลาที่มีไข่ ปล่อยกลับไป ปีหน้าจะได้มีอีก"
    - "หน้าฝนน้ำหลาก ไซลอบวางได้ทุกร่องน้ำ แต่อย่าวางขวางทางน้ำทั้งหมด ให้ปลาบางส่วนผ่านไปได้"
    - "หน้าฝนในป่ายุงเยอะ ทาตะไคร้หอมก่อนเข้าป่านะหลาน"
  season_cool:
    - "ออกพรรษาน้ำเริ่มลด ปลาไหลกลับลงคลอง วางไซตอนนี้ได้ปลาเยอะที่สุดในปี"
    - "หน้าหนาวปลาในอ่างตัวใหญ่ ลุงเคยได้ปลาช่อนสามกิโลตอนหน้าหนาว"
    - "หนาวแล้วลุงย่างปลาทำปลากรอบเก็บไว้กินหน้าแล้ง"
  season_dry:
    - "หน้าแล้งน้ำในหนองลด ชาวบ้านวิดหนองจับปลากัน ลุงไปช่วยทุกปี"
    - "แล้งแบบนี้สัตว์ในป่ามาหาน้ำที่อ่าง ลุงไม่ล่าตรงแหล่งน้ำ สัตว์มันก็ต้องกินน้ำเหมือนเรา"
    - "หน้าแล้งระวังไฟป่านะหลาน ทิ้งก้นบุหรี่ทีเดียวป่าหายทั้งแปลง"
  heart_low:
    - "หลานจะเข้าป่าเหรอ ไปแค่ชายป่าก่อน ป่าลึกไม่ใช่ที่คนไม่รู้จักป่า"
    - "อยากตกปลาหรือ เบ็ดหลานต้องผูกใหม่ ผูกแบบนั้นปลาดึงทีเดียวหลุด"
    - "ลุงไม่ค่อยคุยหรอกหลาน คุยดังปลาหนี"
  heart_mid:
    - "หลานตกปลาเก่งขึ้นนะ ลุงเห็นถังเมื่อวาน ปลานิลตัวโต"
    - "มานั่งข้างลุงสิ ตกปลาด้วยกัน เงียบๆ ไม่ต้องคุยก็ได้"
    - "ไหว้เจ้าที่ก่อนเข้าป่าทุกครั้งนะหลาน ลุงทำมาทั้งชีวิต ป่ายังไม่เคยทำร้ายลุง"
  heart_high:
    - "หนุ่มๆ ลุงเคยล่าทุกอย่างที่ขวางหน้า ขายในตลาดในเมือง จนวันหนึ่งป่าเงียบไปหมด ลุงเลยเลิก"
    - "ลุงมีปืนแก๊ปเก่ากระบอกหนึ่ง ไม่ได้ยิงมายี่สิบปีแล้ว เก็บไว้ดูให้จำว่าเคยทำอะไรไว้"
    - "ลุงอยากให้ป่าดงเย็นอยู่ไปถึงรุ่นน้องมิวน้องโอ๊ต ให้เด็กมันได้เห็นไก่ป่าตัวจริง ไม่ใช่ในโทรศัพท์"
  topic_news:
    - "ได้ยินว่ามีปลาบึกตัวใหญ่ในอ่างเก็บน้ำ ใครๆ ก็ว่าเป็นปลาในตำนาน ลุงเคยเห็นเงามันครั้งหนึ่ง"
    - "มีคนนอกเข้ามาช็อตปลาในคลองตอนกลางคืน ลุงแจ้งดาบเสถียรแล้ว ดาบบอกพรุ่งนี้จะไปดู"
    - "บริษัทของคุณธนาตั้งปั๊มข้างอ่าง น้ำลดลงเร็วกว่าทุกปี ปลาวางไข่ไม่ทัน"
  topic_advice:
    - "วางไซตรงร่องน้ำไหลเข้านาตอนฝนแรก เช้ามากู้ ได้ปลาเยอะกว่าตกเบ็ดทั้งวัน"
    - "ตกปลาตอนเช้ามืดหรือตอนเย็น ใช้ไส้เดือนสำหรับปลานิล ใช้กบเล็กสำหรับปลาช่อน"
    - "ข้ามสะพานกลางคืนเดินตรงกลาง อย่าเข้าใกล้ตลิ่งหลังสามทุ่ม ผีพรายไม่ขึ้นจากน้ำ แต่มันเอื้อมถึงตลิ่ง"
  topic_smalltalk:
    - "หลานรู้ไหม ปลาช่อนมันเฝ้าลูกนะ พ่อปลาช่อนดุมาก ใครเข้าใกล้ลูกมันกัดเลย"
    - "ลุงอ่านรอยเท้าสัตว์ได้ห้าสิบอย่าง แต่อ่านหนังสือได้ช้ากว่าเด็ก ป.1"
    - "ข้าวหลามกับปลาย่างกินในป่า อร่อยกว่าร้านอาหารในอำเภอทุกร้าน"
  topic_about_self:
    - "ลุงเกิดในป่า แม่คลอดลุงในเถียงไร่ตอนเก็บหน่อไม้ ป่าเลยเหมือนบ้านเกิดจริงๆ"
    - "ลุงเคยเป็นพรานรับจ้างให้คนในเมือง พาเข้าป่าล่าสัตว์ เลิกแล้วตั้งแต่ลูกลุงเกิด"
    - "ลุงไม่มีที่นาของตัวเอง ที่ดินลุงเป็นแค่สิทธิ์ทำกินในเขตป่า ลุงเลยรักษาป่าเหมือนรักษาบ้าน"
  topic_about_others:
    - "ป้าทองใบแกงเก่ง ลุงหาปลาให้ แกแกงให้ ลุงได้หม้อแรกทุกงานบุญ"
    - "ตาเผือกเพื่อนลุง เลี้ยงควาย ลุงหาปลา ไม่เคยแย่งที่กัน"
    - "ยายบัวรู้เรื่องผีในป่ามากกว่าลุง ลุงถามยายก่อนเข้าป่าลึกทุกครั้ง"
  gossip_theft:
    - "ขโมยของเหรอหลาน ในป่ามีกฎว่าไซของใครอย่าไปกู้ หมู่บ้านก็มีกฎเดียวกัน"
    - "ลุงเคยเห็นคนขโมยไซลุง มันไม่เคยกล้ามองหน้าลุงอีกเลย หลานอยากเป็นแบบนั้นเหรอ"
  gossip_cheating:
    - "นกเงือกมันมีคู่ตัวเดียวทั้งชีวิตนะหลาน ลุงไม่ว่าอะไร แค่เล่าเรื่องนก"
    - "เรื่องหัวใจลุงไม่รู้ แต่คนเจ็บเขาเจ็บจริง"
  gossip_unpaid_bill:
    - "ค้างค่าไฟเหรอ ลุงไม่มีไฟฟ้าที่เถียงป่ามาสิบปี อยู่ได้ แต่อย่าให้ถึงขั้นนั้นเลยหลาน"
    - "ช็อตก็มาหาปลากับลุง ปลาในคลองไม่ต้องจ่ายเงิน แค่ต้องตื่นเช้า"
  gossip_small_envelope:
    - "ซองน้อยไม่เป็นไรหลาน ลุงใส่ปลาแทนซองมาทั้งชีวิต ไม่มีใครว่าลุง"
    - "งานหน้าหาปลาไปช่วยครัวป้าทองใบ คนจำปลาได้นานกว่าเงินยี่สิบ"
  gossip_skip_longkhaek:
    - "ใครมาช่วยหลานแล้วหลานต้องไปช่วยคืน เหมือนป่าให้ปลาเรา เราก็ต้องไม่จับปลาที่มีไข่"
    - "ลุงได้ยินคนบ่นแล้ว หลานไปช่วยเขาคืนเถอะ ก่อนจะไม่มีใครมาช่วยหลานอีก"
  player_fainted:
    - "เมื่อคืนผีจับเหรอหลาน ลุงเห็นรอยเท้าหลานวิ่งวนอยู่ชายป่า วิ่งวนแบบนั้นคือโดนผีบังตา"
    - "ถ้าจะเข้าป่าตอนเย็น เช่าผ้ายันต์ที่วัดไว้ เก้าสิบเก้าบาท ลุงไม่อายที่จะบอกว่าลุงก็เช่า"
  player_new_vehicle:
    - "รถใหม่เหรอ อย่าขับเข้าป่าลึกนะหลาน ทางไม่มี ล้อติดแล้วต้องเดินออก"
    - "ขับระวังไก่ป่าตัดหน้านะ มันโง่แต่มันสวย"
  player_lottery_win:
    - "ถูกหวยเหรอ ยินดีด้วย ลุงไม่เล่น ลุงว่าไปตกปลายังมีโอกาสได้มากกว่า"
    - "เงินมาเร็วก็ไปเร็วนะหลาน เหมือนน้ำหลาก"
  player_muddy:
    - "เลอะโคลนขนาดนี้ปลาดุกยังอาย ไปล้างตัวเถอะหลาน"
    - "เลอะโคลนแบบนี้ไปวิดหนองมาเหรอ ได้ปลากี่ตัว"
  player_rich:
    - "รวยแล้วอย่าไปซื้อป่ามาล้อมรั้วนะหลาน ป่าเป็นของทุกคน"
    - "มีเงินแล้วช่วยกองทุนป่าชุมชนบ้าง ลุงจะจดชื่อหลานไว้ข้างต้นยางนา"
  player_in_debt:
    - "เป็นหนี้เหรอ หาปลากับลุงขายตลาดนัดสิ ปลาช่อนกิโลละร้อยกว่าบาท"
    - "ค่อยๆ ใช้หนี้นะหลาน อย่ารีบจนไปกู้ใหม่มาใช้หนี้เก่า"
  player_sick:
    - "ป่วยเหรอ ไป รพ.สต. นะหลาน ยาสมุนไพรลุงช่วยได้แค่ปวดเมื่อย"
    - "กินข้าวต้มปลาร้อนๆ แล้วนอน ลุงจะเอาปลาไปให้ป้าทองใบต้มให้"
  player_married:
    - "แต่งงานแล้ว ดีหลาน ลุงจะหาปลาช่อนตัวใหญ่ที่สุดมาให้ทำแกงงานแต่ง"
    - "ยินดีด้วยหลาน อยู่ด้วยกันให้เหมือนต้นไม้กับเถาวัลย์ อาศัยกันแต่ไม่รัดกันตาย"
  event_disaster:
    - "น้ำท่วม ลุงมีเรือพาย ใครติดอยู่บอกลุง ลุงจะไปรับ"
    - "ภัยมาที สัตว์ในป่าก็หนีเข้าหมู่บ้าน อย่าไปทำร้ายมันนะหลาน มันก็หนีน้ำเหมือนเรา"
  event_election:
    - "ช่วงเลือกตั้งใครๆ ก็พูดถึงป่า พอเลือกเสร็จไม่มีใครเข้าป่าสักคน"
    - "ลุงอยากได้คนที่จะไม่ยกป่าชุมชนให้ใคร ลุงจะไปถามเขาตรงๆ ที่เวที"
  event_company_water:
    - "ตั้งแต่บริษัทดูดน้ำ หนองในป่าแห้งไปสามหนอง สัตว์ป่าไม่มีน้ำกิน ต้องลงมาถึงหมู่บ้าน"
    - "คุณธนาบอกลุงว่าบริษัทจะปลูกป่าทดแทน ลุงถามว่าปลูกที่ไหน เขาบอกว่าปลูกในรายงานประจำปี"
  event_festival_near:
    - "{festival}ใกล้แล้ว ลุงจะหาปลาไปให้ครัววัดเหมือนทุกปี"
    - "ช่วง{festival}คนเยอะ ลุงหลบเข้าป่า แต่กลับมากินแกงป้าทองใบทุกครั้ง"
  gift_love:
    - "{item}! ของดีหลาน ลุงจะเก็บไว้กินในป่า"
    - "ให้ลุงเหรอ หลานรู้ใจพรานนะ"
  gift_like:
    - "{item} ขอบใจหลาน"
    - "ดี ลุงใช้ได้"
  gift_neutral:
    - "อ้อ ขอบใจนะหลาน"
    - "{item}... เก็บไว้ก่อนละกัน"
  gift_dislike:
    - "{item} เหรอ ลุงไม่ค่อยใช้นะหลาน แต่ขอบใจ"
    - "ไม่ใช่ของพรานหรอกหลาน แต่ลุงรับไว้"
  gift_hate:
    - "{item} ห้ามเอาเข้าป่าเด็ดขาดนะหลาน มันฆ่าทั้งคลอง"
    - "ไม่เอา เอากลับไป ลุงไม่อยากเห็นของแบบนี้ในหมู่บ้าน"
  birthday:
    - "วันเกิดลุงเหรอ ลุงลืมไปแล้ว ขอบใจนะหลาน คืนนี้ลุงจะย่างปลาเลี้ยงตัวเอง"
    - "ขอบใจหลาน ปีนี้ลุงขอให้ป่ายังอยู่ หนองยังมีน้ำ ลุงขอแค่นั้น"
  rare:
