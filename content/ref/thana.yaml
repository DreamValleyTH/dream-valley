    prompt: "คุณ{player} ครับ ที่ดินแปลงหลังบ้านคุณ ถ้าวันหนึ่งอยากจะ optimize ผมให้ราคาดีนะครับ"
    options:
      - text: "ไม่ขาย ที่ของยาย"
        heart: 1
        reply: "ผมเคารพครับ จริงๆ นะ… ผมจดไว้แล้วว่าคุณไม่ขาย สำหรับปีนี้"
      - text: "ราคาเท่าไหร่ล่ะ"
        heart: 0
        reply: "ตัวเลขผมพูดตรงนี้ไม่ได้ครับ ต้องคุยในห้องแอร์ ที่นี่ลมพัดข่าวไปถึงป้าแต๋วเร็วเกิน"
      - text: "ไปบริหารที่อื่นเถอะ"
        heart: -1
        reply: "ตรงไปตรงมาดีครับ ผมเก็บไว้เป็น feedback"
  - id: thana_c2
    min_heart: 2
    prompt: "ผมมีโควตาสัญญาข้าวโพดเหลือสองที่ครับ เมล็ดกับปุ๋ยเราให้ก่อน สนใจไหมครับ"
    options:
      - text: "ขอดูสัญญาฉบับเต็มก่อน"
        heart: 1
        reply: "นี่แหละคนที่ผมเคารพ อย่าลืมพลิกดูด้านหลังนะครับ ตัวเล็กอยู่ตรงนั้นทั้งหมด"
      - text: "เอาเลย ตอนนี้เงินช็อต"
        heart: 1
        reply: "ยินดีต้อนรับสู่ครอบครัวครับ ครอบครัวที่มีค่าปรับ"
      - text: "ขายสหกรณ์ของกล้าดีกว่า"
        heart: -1
        reply: "คุณกล้าเป็นคนดีครับ คนดีมักไม่มีงบการตลาด"
  - id: thana_c3
    min_heart: 4
    prompt: "ผมถามจริงนะครับ คุณคิดว่าคนในตำบลเกลียดผมไหม"
    options:
      - text: "ไม่ได้เกลียดคุณ เกลียดสิ่งที่บริษัททำ"
        heart: 2
        reply: "…ประโยคนี้ผมจะเอาไปคิดในรถตอนขับกลับครับ ตลอดทาง"
      - text: "ก็นิดหน่อยนะ"
        heart: 0
        reply: "ขอบคุณที่ใช้คำว่านิดหน่อยครับ ผมรู้ว่ามันไม่นิด"
      - text: "ใครจะไปเกลียด คุณใจดีจะตาย"
        heart: -1
        reply: "คุณพูดเหมือนฝ่ายประชาสัมพันธ์ผมเลยครับ ผมไม่ค่อยเชื่อฝ่ายนั้น"
  - id: thana_c4
    min_heart: 6
    prompt: "ถ้าผมแอบส่งข้อมูลระดับน้ำใต้ดินจริงให้สหกรณ์ คุณว่าผมจะโดนไล่ออกไหมครับ"
    options:
      - text: "โดน แต่คนทั้งตำบลจะจำคุณ"
        heart: 2
        reply: "ผมไม่เคยคิดว่าการถูกจำจะมีค่ากว่าโบนัส… จนวันนี้ครับ"
      - text: "อย่าเสี่ยงเลย คิดถึงลูกด้วย"
        heart: 1
        reply: "คุณพูดเหมือนแม่ผมเลยครับ แม่ผมพูดถูกเกือบทุกเรื่อง"
      - text: "เอาไปขายให้นักข่าวดีกว่า ได้เงินด้วย"
        heart: -2
        reply: "…ผมนึกว่าคุณจะต่างจากผมครับ"
  - id: thana_c5
    min_heart: 8
    prompt: "ถ้าวันหนึ่งผมไม่ได้เป็นคนบริษัทแล้ว ผมยังมานั่งกินก๋วยเตี๋ยวกับคุณได้ไหมครับ"
    options:
      - text: "ได้สิ เดี๋ยวเลี้ยง"
        heart: 2
        reply: "ตกลงครับ ใบเสร็จมื้อนั้นผมจะไม่เบิกบริษัท"
      - text: "ได้ แต่ต้องลาออกก่อนนะ"
        heart: 1
        reply: "ผมจะตั้งเป็น KPI ส่วนตัวครับ ข้อแรกและข้อเดียว"
      - text: "ไม่รู้สิ"
        heart: -1
        reply: "ยุติธรรมดีครับ ผมยังไม่ได้ทำอะไรให้สมควรได้ใช่ไหม"
banter:
  - with: wichai
    lines:
      - ["thana", "ท่านนายกฯ ครับ ใบอนุญาตบ่อที่สามคืบหน้าไหมครับ"]
      - ["wichai", "เรื่องนี้นะ เรารับทราบแล้ว และกำลังพิจารณาอย่างรอบคอบ อย่างรอบด้าน อย่างรอบ…"]
      - ["thana", "รอบที่สามแล้วครับท่าน"]
      - ["wichai", "ใช่ รอบที่สาม ซึ่งจะนำไปสู่รอบต่อไปอย่างมีประสิทธิภาพ"]
      - ["thana", "ผมชอบคำนี้ครับ ท่านใช้ได้ดีกว่าผมอีก"]
  - with: heng
    lines:
      - ["heng", "คุณธนา บริษัทลื้อให้ปุ๋ยชาวบ้านก่อนจ่ายทีหลัง ตัดราคาร้านเฮียนะ"]
      - ["thana", "เราไม่ได้ตัดราคาครับเสี่ย เราแค่ disrupt ห่วงโซ่อุปทาน"]
      - ["heng", "เฮียคิดดอกเดือนละสาม ลื้อชั่งขาดห้าเปอร์เซ็นต์ ใครโหดกว่ากัน"]
      - ["thana", "เรียกว่าเราอยู่ในอุตสาหกรรมเดียวกันดีกว่าครับ"]
      - ["heng", "งั้นวันหลังเลี้ยงข้าวเฮียบ้าง ในฐานะเพื่อนร่วมวงการ"]
  - with: kla
    lines:
      - ["kla", "คุณธนา บ่อลุงสมหมายแห้งตั้งแต่บริษัทเจาะบ่อที่สอง จะว่ายังไง"]
      - ["thana", "ผมเข้าใจความกังวลครับคุณกล้า เราจะตั้งคณะทำงานศึกษา"]
      - ["kla", "ศึกษาไปจนบ่อแห้งหมดตำบลเลยไหม"]
      - ["thana", "เราพร้อมรับฟังทุกเสียงครับ"]
      - ["kla", "ฟังแล้วทำอะไรต่อ"]
      - ["thana", "…ฟังต่อครับ"]
  - with: sathian
    lines:
      - ["thana", "ดาบครับ มีคนมาตัดรั้วบริษัทอีกแล้ว รบกวนช่วยดูหน่อยครับ"]
      - ["sathian", "รั้วยาวตั้งสองกิโลนะคุณ เดินดูทั้งเส้นก็หมดวันพอดี"]
      - ["thana", "บริษัทมีรถกอล์ฟให้ใช้ครับ"]
      - ["sathian", "อ้อ งั้นเดี๋ยวพรุ่งนี้… ถ้าไม่มีอะไรด่วนกว่า เช่นข้าวเที่ยง"]
  - with: may
    lines:
      - ["may", "คุณธนาคะ ระดับน้ำใต้ดินตำบลนี้ลดลงกี่เมตรในสองปีคะ"]
      - ["thana", "คำถามที่ดีมากครับ ผมขอตอบในภาพรวมว่าเราใส่ใจความยั่งยืน"]
      - ["may", "ขอเป็นตัวเลขค่ะ ภาพรวมเอาไปพาดหัวไม่ได้"]
      - ["thana", "ผมจะให้ฝ่ายประชาสัมพันธ์ส่งข้อมูลให้ครับ"]
      - ["may", "ฝ่ายที่ครั้งก่อนส่งรูปต้นไม้สามรูปกับคำว่าสีเขียวมาให้ใช่ไหมคะ"]
