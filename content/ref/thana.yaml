id: thana
name: "คุณธนา"
role: "ผู้จัดการโครงการของบริษัทที่มาซื้อที่ดินและสูบน้ำบาดาล ผู้เสนอเกษตรพันธสัญญา"
voice: "สุภาพมาก ลงท้ายครับเสมอ แทนตัวว่าผม เรียกผู้เล่นว่าคุณ{player} ใช้ศัพท์องค์กรและคำอังกฤษ (stakeholder, sustainability, feedback, KPI, win-win) กลบเรื่องแย่ ยิ้มตลอด ไม่เคยพูดคำว่าดูดน้ำ ลึกๆ เป็นลูกชาวนาที่รู้ตัวว่ากำลังทำอะไร"
dark_humor: true
romanceable: false
lines:
  greet_morning:
    - "อรุณสวัสดิ์ครับคุณ{player} เช้านี้ผมเพิ่งประชุมออนไลน์กับสำนักงานใหญ่ เขาฝากชมว่าตำบลนี้ศักยภาพสูงมาก"
    - "สวัสดีครับ ตื่นเช้าเหมือนกันเลย ผมชอบพาร์ทเนอร์ที่ productive แบบนี้"
    - "เช้านี้ผมวิ่งรอบที่ดินบริษัทครับ ใช้เวลามากกว่าเดือนก่อนสิบนาที รั้วยาวขึ้นนิดหน่อย"
    - "มอร์นิ่งครับ ได้ยินหอกระจายข่าวไหม ผมว่าเพลงก่อนประกาศน่าจะหาสปอนเซอร์ได้นะ"
    - "สวัสดีครับ กาแฟเช้านี้ผมชงด้วยน้ำจากบ่อของเราเอง รสชาติ… มีประสิทธิภาพมากครับ"
  greet_noon:
    - "สวัสดีครับ ทานข้าวหรือยัง ร้านก๋วยเตี๋ยวพี่หน่อยนี่ผมยกให้เป็น local champion เลยนะ"
    - "แดดเที่ยงแรงครับ ทีมเราเลยปรับเวลางานคนงานใหม่ ให้เริ่มเช้าขึ้นและเลิกเท่าเดิม"
    - "อ้าว คุณ{player} บังเอิญจัง ผมกำลังหาคนคุยเรื่อง opportunity ใหม่อยู่พอดี"
    - "บ่ายนี้ผมมีนัดที่ อบต. ครับ แค่ catch-up กันเฉยๆ ไม่มีซองไม่มีอะไร ผมพูดไว้ก่อน"
    - "ขอโทษที่เหงื่อเยอะครับ แอร์รถเสีย ผมเลยเปิดหน้าต่างใช้ลมธรรมชาติแบบ sustainable"
  greet_evening:
    - "สวัสดีตอนเย็นครับ ฟ้าสีส้มสวยดี ชันขึ้นเหมือนกราฟกำไรไตรมาสนี้"
    - "เย็นแล้วครับ ผมเลิกงานแล้ว แต่ mindset ผมไม่เคยเลิก"
    - "หอกระจายข่าวเพิ่งประกาศราคาข้าวพรุ่งนี้ ตกอีกแล้วสินะครับ สัญญากับเราราคาคงที่นะ แค่บอกไว้"
    - "เย็นนี้ผมจะไปนั่งร้านส้มตำครับ อยากเข้าใจ consumer insight ของชุมชนแบบลงพื้นที่"
    - "เลิกงานแล้วเหรอครับ คนงานผมยังไม่เลิกเลย องค์กรเรามี passion สูงครับ ตามสัญญาจ้าง"
  greet_night:
    - "ดึกแล้วนะครับ ได้ยินว่าสามทุ่มผีออก บริษัทไม่มีนโยบายรับผิดชอบเรื่องนี้ แต่ผมเป็นห่วงส่วนตัว"
    - "ผมกำลังขับกลับโรงแรมในอำเภอครับ ที่ดินบริษัทเปิดสปอตไลต์ทั้งคืน ผียังไม่เคยยื่นเรื่องเข้ามา"
    - "รีบกลับบ้านเถอะครับคุณ{player} ถ้าเป็นลมระหว่างทาง ฝ่ายกฎหมายผมจะเรียกว่า force majeure"
    - "กลางคืนแบบนี้ได้ยินเสียงปั๊มชัดดีนะครับ ผมเรียกมันว่าเสียงของการพัฒนา"
    - "ยามรายงานว่าเมื่อคืนมีอะไรมาเกาะรั้ว ผมสั่งเขียน incident report แล้ว ติดอยู่ตรงช่องลายเซ็นผู้แจ้ง"
  weather_rain:
    - "ฝนตกดีครับ ช่วยเติมน้ำใต้ดิน ผมถือว่าธรรมชาติเป็น partner คนสำคัญของเรา"
    - "ฝนแบบนี้ชาวบ้านก็ยิ้มได้ บ่อจะได้มีน้ำ… ในระยะสั้น"
    - "รองเท้าหนังผมไม่ได้ออกแบบมาให้เดินคันนาครับ แต่ผมพร้อม adapt"
    - "วันฝนตกโรงงานรับพริกช้าลงนิดครับ ความชื้นสูง เราต้องหักตามมาตรฐาน มาตรฐานของเรา"
    - "ร่มคันนี้บริษัทแจกครับ โลโก้ใหญ่หน่อย เอาไปสักคันไหม ถือเป็นกิจกรรม CSR"
  weather_hot:
    - "ร้อนจังครับ ผมเลยสั่งเพิ่มกำลังปั๊มอีกนิด ต้นไม้ในโครงการจะได้ไม่เครียด"
    - "วันนี้คนงานผมเป็นลมแดดสองคน เราจัด wellness program ให้แล้วครับ คือพัดลมหนึ่งตัว"
    - "ร้อนขนาดนี้ น้ำดื่มขวดละสิบบาทก็ยังถือว่า affordable นะครับ"
    - "ผมเป็นคนกรุงเทพฯ ครับ ร้อนแค่นี้ยังสู้ห้องประชุมแอร์เสียตอนนำเสนองบไม่ได้"
    - "ดื่มน้ำเยอะๆ นะครับคุณ{player} ถ้าบ่อที่บ้านไม่มี ร้าน 24 ชม. มีขายครับ"
  weather_storm:
    - "ป้ายบริษัทหน้าทางเข้าปลิวไปสองแผ่นครับ ผมมองว่าเป็น brand awareness ที่กระจายตัวดี"
    - "ระวังนะครับ ต้นไม้ล้มขวางถนน ผมแจ้ง อบต. แล้ว เขาว่ารับทราบ"
    - "ไฟดับทั้งตำบล แต่ที่ดินบริษัทมีเครื่องปั่นไฟ ความเหลื่อมล้ำทางพลังงานเป็นประเด็นที่เรากำลังศึกษาครับ"
    - "ประกันภัยพายุของเราครอบคลุมนะครับ เฉพาะแปลงที่อยู่ในสัญญา"
    - "ผมให้คนงานกลับบ้านเร็วครับ แล้วหักชั่วโมงตามจริง ยุติธรรมกับทุกฝ่าย"
  weather_pm25:
    - "ฝุ่นวันนี้สีส้มเลยครับ บริษัทเราไม่ได้เผานะ เราจ้างผู้รับเหมาที่เผา"
    - "หน้ากากนี้มีโลโก้บริษัทครับ แจกฟรี มีคนรับไปสามคน สองคนเป็นลูกน้องผม"
    - "ค่าฝุ่นสูงแบบนี้ผมแนะนำให้ทำงานในอาคารครับ สำหรับคนที่มีอาคาร"
    - "ฝุ่นทำให้แดดดูนุ่มดีนะครับ ถ่ายรูปลงรายงานความยั่งยืนสวยมาก"
    - "ถ้ามาทำสัญญากับเรา จะได้ใบรับรองไม่เผาครับ ค่าออกใบรับรองหักจากรายได้นิดเดียว"
  season_rainy:
    - "หน้าฝนคือ high season ของน้ำครับ บ่อชาวบ้านมีน้ำ ทุกคนใจดีกับบริษัทขึ้นนิดหนึ่ง"
    - "ข้าวโพดในสัญญาเราปลูกช่วงนี้ดีที่สุดครับ เมล็ดกับปุ๋ยให้ก่อน จ่ายทีหลัง คล้ายผ่อนศูนย์เปอร์เซ็นต์ แต่ไม่ใช่"
    - "ฝนมายุงก็มา ผมแจกยากันยุงห้าสิบหลอดครับ ลงเพจบริษัทแล้ว ได้ไลก์มากกว่าจำนวนยุงอีก"
    - "ที่ลุ่มน้ำท่วมทุกปีใช่ไหมครับ ที่ดินบริษัทถมสูงไว้แล้ว น้ำเลยไปรวมที่อื่นแทน"
    - "ผมชอบฤดูนี้ครับ คลองเต็ม คนอารมณ์ดี เซ็นสัญญาง่าย"
  season_cool:
    - "หน้าหนาวผมใส่สูทได้สบายแล้วครับ ในที่สุดพื้นที่นี้ก็ align กับ dress code"
    - "หลังเกี่ยวข้าวที่ดินโล่งเยอะครับ ฝ่ายจัดหาที่ดินเรียกช่วงนี้ว่าฤดูเก็บเกี่ยว แต่ไม่ได้หมายถึงข้าว"
    - "ลอยกระทงปีนี้บริษัทสนับสนุนกระทงขนมปังร้อยใบครับ ป้ายผู้สนับสนุนใหญ่กว่ากระทงนิดหน่อย"
    - "อากาศเย็นแบบนี้ผมนึกถึงคอนโดที่กรุงเทพฯ ครับ ระเบียงผมมองเห็นอีกโครงการของบริษัท"
    - "หน้าหนาวน้ำใต้ดินลดลงตามธรรมชาติครับ ผมขอย้ำ ตามธรรมชาติ"
  season_dry:
    - "หน้าแล้งคนจะเห็นคุณค่าของน้ำครับ และเห็นคุณค่าของคนที่มีน้ำ"
    - "บ่อแห้งเหรอครับ เสียใจด้วย เราส่งรถน้ำไปให้ได้ ราคาเป็นมิตรกับชุมชน"
    - "ปีนี้เราตั้งจุดแจกน้ำหน้าโรงเรียนครับ น้ำจากบ่อเราเอง คืนสู่ชุมชน เป็น circular economy"
    - "สงกรานต์ปีนี้บริษัทไม่ร่วมสาดน้ำครับ เราเป็นองค์กรประหยัดน้ำ ประหยัดเฉพาะขาออก"
    - "ช่วงนี้ปลูกพืชใช้น้ำน้อยดีกว่าครับ เช่นมันสำปะหลังในสัญญาเรา ใช้น้ำน้อย ใช้ใจเยอะ"
  heart_low:
    - "สวัสดีครับ ผมธนา จากบริษัท ยินดีที่ได้รู้จัก นามบัตรครับ"
    - "มีอะไรให้ผมช่วยไหมครับ ถ้าไม่มี ผมก็ยินดีรับฟัง feedback"
    - "คนในตำบลมองผมแปลกๆ ผมเข้าใจครับ change management ต้องใช้เวลา"
    - "ถ้าสนใจเกษตรพันธสัญญา ผมมีโบรชัวร์ครับ เงื่อนไขอยู่ด้านหลัง ตัวเล็กหน่อย แนะนำให้ใช้แว่นขยาย"
    - "คุณ{player} ใช่ไหมครับ ในระบบเราบันทึกว่าคุณมีที่ดิน… ขอโทษครับ ผมจำผิดไฟล์"
  heart_mid:
    - "คุยกับคุณ{player} แล้วสบายใจครับ ไม่ค่อยมีใครในตำบลยอมฟังผมพูดจบประโยค"
    - "บอกตรงๆ ผมก็ไม่อยากใส่เชิ้ตแขนยาวตอนสี่สิบองศา แต่มันอยู่ใน KPI ด้วย"
    - "ผมกินส้มตำปูปลาร้าได้แล้วนะครับ กระเพาะผมยังอยู่ในช่วง onboarding"
    - "เจ้านายโทรมาทุกเช้า ถามแต่ตัวเลข ไม่เคยถามว่าที่นี่ฝนตกไหม"
    - "คุณเป็นคนเดียวที่ไม่เรียกผมว่า คนบริษัท ต่อหน้าครับ ลับหลังผมไม่ทราบ"
  heart_high:
    - "ผมเป็นลูกชาวนาครับ ที่นาแม่ผมที่ต่างจังหวัดก็ขายให้บริษัทหนึ่งไปเมื่อยี่สิบปีก่อน"
    - "บางคืนผมนั่งฟังเสียงปั๊มแล้วนอนไม่หลับ ไม่ใช่เพราะมันดังนะครับ"
    - "ถ้าผมลาออก พรุ่งนี้ก็มีคนใหม่มาแทน คนที่ไม่รู้จักชื่อใครในตำบลเลยสักคน ผมเลยยังไม่ลาออก"
    - "แม่ผมเคยพูดว่าที่ดินขายได้ครั้งเดียว ผมพูดประโยคตรงข้ามกับแม่ในที่ประชุมทุกวัน"
    - "คุณ{player} ถ้าวันหนึ่งผมทำอะไรถูกขึ้นมา อย่าบอกเจ้านายผมนะครับ"
  topic_news:
    - "ข่าวดีครับ บริษัทจะขยายพื้นที่อีกสองร้อยไร่ ข่าวร้าย… เดี๋ยวคุณก็ทราบเองครับ"
    - "ไตรมาสนี้เราปลูกต้นไม้ได้ห้าร้อยต้นครับ ก่อนหน้านั้นตัดไปสามพัน แต่เราต้องดูที่ trend"
    - "ได้ยินว่า อบต. จะทำถนนใหม่ ผ่านหน้าที่ดินบริษัทพอดีครับ บังเอิญมาก"
    - "คุณเมย์ส่งอีเมลขอสัมภาษณ์ผมอีกแล้ว ฝ่ายประชาสัมพันธ์ตอบไปแล้วว่าไม่สะดวก แบบถาวร"
    - "ราคามันสำปะหลังในตลาดพุ่งครับ แต่คนที่ทำสัญญากับเรามีความมั่นคง ได้ราคาเดิม มั่นคงมาก"
  topic_advice:
    - "ไก่เนื้อในสัญญาต้องได้น้ำหนักใน 35 วันครับ ให้อาหารขาดวันเดียว น้ำหนักไม่ถึง โดนหักค่าลูกไก่เต็มๆ"
    - "ถ้าจะทำสัญญากับเรา อ่านข้อค่าปรับส่งไม่ครบให้ดีครับ ผมแนะนำในฐานะคน ไม่ใช่ในฐานะบริษัท"
    - "ช่วงตั้งตัว สัญญาเราไม่ต้องลงทุนก่อนครับ แต่แปลงไหนจะทำอินทรีย์ อย่าเอามาเข้าสัญญา สารตกค้างไม่รอใคร"
    - "พริกส่งโรงงานคัดเกรดเข้มครับ เก็บตอนเช้าก่อนแดดแรง พริกไม่เหี่ยว ไม่ตกเกรด"
    - "ฝีมือค้าขายถึงเลเวลหกแล้วขอชั่งซ้ำได้นะครับ ผมไม่ได้บอกว่าเครื่องชั่งเราขาด ผมแค่บอกว่ามีสิทธิ์"
    - "ปีที่ราคาตลาดพุ่ง ขายสหกรณ์ของกล้าได้มากกว่าครับ ผมไม่ได้แนะนำนะ ผมแค่อ่านกราฟออกเสียงดัง"
  topic_smalltalk:
    - "คุณว่าโลโก้บริษัทเราเขียวเกินไปไหมครับ ฝ่ายแบรนด์บอกว่ายิ่งเขียวยิ่งดูรักษ์โลก"
    - "ผมไปตลาดนัดวันพุธ ซื้อขนมครกสิบบาท แม่ค้าคิดผมยี่สิบ ผมเรียกมันว่าภาษีคนบริษัท"
    - "ผมกำลังหัดฟังเพลงลูกทุ่งครับ เพลงเศร้าๆ ฟังแล้วเหมือนอ่านรายงานผลกระทบสิ่งแวดล้อม"
    - "หมาแถวนี้เห่าผมทุกตัวครับ ผมว่ามันอ่านรายงานประจำปีเราแล้ว"
    - "ผมเคยดำนาในงาน CSR ห้านาทีครับ ถ่ายรูปสามร้อยรูป ปวดหลังสามวัน"
  topic_about_self:
    - "ผมเป็นผู้จัดการโครงการครับ หน้าที่คือทำให้ทุกอย่างดูดี โดยเฉพาะตอนที่มันไม่ดี"
    - "ผมจบบริหารครับ วิชาที่ได้ใช้บ่อยที่สุดไม่ใช่การเงิน แต่เป็นการเลือกคำ"
    - "ผมพักโรงแรมในอำเภอมาสองปีครับ พนักงานต้อนรับรู้จักผมดีกว่าเพื่อนบ้านทุกคนในชีวิต"
    - "ผมมีลูกสาวหนึ่งคน อยู่กรุงเทพฯ กับแม่เขา เขาทำรายงานเรื่องภัยแล้ง มาขอข้อมูลผม ผมไม่รู้จะส่งไฟล์ไหนให้"
    - "สมัยเรียนผมออกค่ายสร้างฝายครับ ตอนนี้ผมสร้างรั้ว ชีวิตเปลี่ยนวัสดุไปเรื่อยๆ"
  topic_about_others:
    - "นายกฯ วิชัยเป็น stakeholder ที่เข้าใจวิสัยทัศน์เราดีมากครับ เข้าใจตั้งแต่ก่อนเราอธิบาย"
    - "คุณกล้าเป็นคนมี passion ครับ ผมเคยชวนมาทำงานกับเรา เขาตอบเป็นคำที่ผมใส่ในรายงานไม่ได้"
    - "เสี่ยเฮงกับผมเป็นคู่แข่งกันครับ แต่ในเชิงหลักการเราคิดคล้ายกันมาก ซึ่งน่ากังวล"
    - "ป้าแต๋วรู้เรื่องบริษัทก่อนผมทุกครั้ง ผมเริ่มคิดว่าควรจ้างป้าเป็นที่ปรึกษา"
    - "ดาบเสถียรมาตรวจที่ดินเราครั้งเดียวครับ ดื่มกาแฟสามแก้ว แล้วเขียนว่าไม่พบสิ่งผิดปกติ ประสิทธิภาพสูงมาก"
    - "คุณเมย์เขียนถึงผมสามบทความแล้วครับ ทุกบทความสะกดชื่อผมถูก ซึ่งน่ากลัวกว่าสะกดผิด"
  gossip_theft:
    - "ในองค์กรเราเรียกว่า asset reallocation ครับ ชาวบ้านเรียกว่าขโมย ผมว่าคำหลังชัดกว่า"
    - "ที่ดินบริษัทมีกล้องวงจรปิดรอบรั้วครับ ถ้าต้องการพิสูจน์ความบริสุทธิ์ เรายินดีร่วมมือ ภายใต้เงื่อนไขที่เหมาะสม"
    - "ผมไม่ตัดสินใครครับ ผมแค่ย้ายกระเป๋าสตางค์มาไว้กระเป๋าหน้า"
  gossip_cheating:
    - "เรื่องส่วนตัวผมไม่ก้าวก่ายครับ แต่ถือสัญญาสองฉบับพร้อมกัน ในทางธุรกิจเราเรียกว่า conflict of interest"
    - "คนในตำบลคุยเรื่องนี้มากกว่าเรื่องบ่อแห้งอีกครับ ผมควรขอบคุณคุณไหมนะ"
    - "ในฐานะคนเขียนสัญญามาเยอะ เงื่อนไขที่ซ่อนไว้ สุดท้ายมีคนอ่านเจอเสมอครับ"
  gossip_unpaid_bill:
    - "ค่าไฟค้างไม่ต้องอายครับ บริษัทเราก็มีหนี้ แต่เราเรียกว่า leverage"
    - "ถ้าโดนตัดไฟ มาชาร์จโทรศัพท์ที่ป้อมยามบริษัทได้ครับ ไม่เก็บเงิน เก็บแค่ชื่อกับเบอร์โทร"
    - "สัญญาเราไม่ต้องลงทุนก่อนนะครับ ผมพูดเฉยๆ ไม่ได้ฉวยโอกาส แค่ timing ดี"
  gossip_small_envelope:
    - "ใส่ซองน้อยไม่ผิดครับ บริษัทใส่ซองงานศพห้าร้อย แต่พวงหรีดเราใหญ่มาก โลโก้ชัด"
    - "ความจริงใจวัดเป็นเงินไม่ได้ครับ แต่กลุ่ม LINE หมู่บ้านวัดได้ทุกครั้ง"
    - "หลังๆ ผมโอนเข้าบัญชีเจ้าภาพครับ ไม่มีใครเห็นยอด ยกเว้นเจ้าภาพ ซึ่งก็พอสำหรับการนินทาแล้ว"
  gossip_skip_longkhaek:
    - "ไม่ไปลงแขกคืนเหรอครับ ทางธุรกิจเรียกผิดนัดชำระ แต่ชาวบ้านจำแม่นกว่าระบบบัญชีเรา"
    - "ถ้าแรงงานในตำบลไม่พอ บริษัทมีรถเกี่ยวให้เช่าครับ ไม่ต้องคืนแรงใคร คืนแค่เงิน"
    - "ผมชื่นชมระบบลงแขกนะครับ เป็น cooperative model ที่ไม่มีใบแจ้งหนี้ แต่มีความจำ"
  player_fainted:
    - "ได้ข่าวว่าเมื่อคืนคุณไปตื่นที่ รพ.สต. เหรอครับ บริษัทไม่มีประกันผีนะ แต่ผมเป็นห่วงจริงๆ"
    - "คราวหน้าถ้าติดอยู่ข้างนอกตอนสามทุ่ม ป้อมยามบริษัทให้หลบไม่ได้นะครับ ไม่ใช่ผมใจร้าย ฝ่ายกฎหมายไม่ให้"
    - "ค่ารักษาสิบเปอร์เซ็นต์ของเงินที่มี ยุติธรรมดีนะครับ รวยจ่ายเยอะ อย่าบอกเจ้านายผมว่าผมชมระบบนี้"
  player_new_vehicle:
    - "รถใหม่สวยครับ ผ่อนกี่งวดครับ ผมถามเพราะสนใจโครงสร้างหนี้ของชุมชน"
    - "ยินดีด้วยครับ ถนนเข้าที่ดินบริษัทลาดยางแล้วนะ ขับผ่านได้ แต่จอดไม่ได้"
    - "คันนี้ขนข้าวโพดสัญญาเราได้เที่ยวละสองตันเลยครับ ขอโทษครับ ผมมองทุกอย่างเป็น logistics"
  player_lottery_win:
    - "ถูกหวยเหรอครับ ยินดีด้วย ที่ดินติดคลองแถวนี้ราคากำลังขึ้นนะ ผมทราบเพราะผมเป็นคนทำให้มันขึ้น"
    - "เงินก้อนแบบนี้กระจายความเสี่ยงนะครับ อย่าเอาไปซื้อหวยต่อหมด ผมเห็นลุงสมหมายแล้วเป็นห่วง"
    - "ความน่าจะเป็นต่ำขนาดนี้ยังถูก ขอยืมดวงไปใช้ตอนประชุมผู้ถือหุ้นได้ไหมครับ"
  player_muddy:
    - "เปื้อนโคลนแบบนี้ผมถือเป็นเครื่องแบบของคนทำงานจริงครับ ผมยังไม่เคยได้ใส่"
    - "ขอยืนห่างนิดหนึ่งนะครับ สูทผมต้องส่งซักแห้งในอำเภอ มีร้านเดียว รอสามวัน"
    - "โคลนดำสนิทเลย ดินดีครับ ผมพูดในความหมายที่ไม่เกี่ยวกับราคาที่ดินนะ"
  player_rich:
    - "ได้ยินว่าคุณ{player} ไปได้สวยนะครับ ถ้าสนใจขยายกิจการ เรามีรูปแบบ partnership หลายแบบ"
    - "คนมีฐานะในตำบลมีไม่กี่คนครับ ผมจำได้ทุกคน ในเชิงความสัมพันธ์ ไม่ใช่ฐานข้อมูล"
    - "ยินดีด้วยครับ เงินซื้อน้ำได้ แต่ซื้อน้ำใต้ดินคืนไม่ได้ ผมพูดจากประสบการณ์ของบริษัท"
  player_in_debt:
    - "หนี้ไม่ใช่เรื่องน่าอายครับ บริษัทเรามีหนี้มากกว่าทั้งตำบลรวมกัน แต่ของเราเรียกว่าโครงสร้างเงินทุน"
    - "ถ้าต้องการกระแสเงินสด เรารับซื้อที่ดินในราคาตลาดครับ ราคาตลาดที่เราช่วยกำหนด"
    - "อย่าไปกู้นอกระบบนะครับ แต่ถ้าต้องเลือกระหว่างเสี่ยเฮงกับบริษัท ขอผมอยู่ในใจคุณสักนิด"
  player_sick:
    - "ไม่สบายเหรอครับ พักเยอะๆ นะ ถ้าเป็นพนักงานผม ผมจะบอกว่าพักได้ แต่ตอบไลน์ด้วย"
    - "ไปตรวจที่ รพ.สต. เถอะครับ หมอแอนเก่งมาก และเป็นคนเดียวในตำบลที่ไม่เคยถามผมเรื่องบ่อ"
    - "ถ้าเป็นพิษสารเคมี… ผมไม่ได้ถามว่าใช้ของใครนะครับ ผมไม่ได้ถามจริงๆ"
  player_married:
    - "ยินดีด้วยครับ การแต่งงานคือ merger ที่ดีที่สุดในชีวิต ผมพูดจริงครั้งนี้"
    - "บริษัทส่งกระเช้าไปแสดงความยินดีครับ ในกระเช้ามีโบรชัวร์สัญญาสำหรับคู่สมรส ลดค่าเมล็ดห้าเปอร์เซ็นต์"
    - "ขอให้มีความสุขครับ ผมหย่ามาแล้ว เลยเชื่อในความรักมากกว่าเดิม"
  event_disaster:
    - "บริษัทตั้งศูนย์ช่วยเหลือผู้ประสบภัยแล้วครับ ตรงหน้าป้ายบริษัทพอดี กล้องจะได้เห็นทั้งสองอย่าง"
    - "เราแจกถุงยังชีพห้าสิบถุงครับ แต่ละถุงมีโลโก้สามจุด ฝ่ายแบรนด์นับมาแล้ว"
    - "ในวิกฤตมีโอกาสเสมอครับ… ขอโทษครับ ประโยคนี้หลุดออกมาเองจากความเคยชิน ผมขอถอน"
  event_election:
    - "บริษัทวางตัวเป็นกลางครับ เราสนับสนุนผู้สมัครทุกคน ในสัดส่วนที่ต่างกัน"
    - "ช่วงเลือกตั้งโครงการใหม่ผุดเยอะนะครับ บางโครงการผมยังไม่รู้เลยว่าบริษัทเป็นสปอนเซอร์"
    - "ผมไม่มีสิทธิ์เลือกตั้งในตำบลนี้ครับ แต่มีสิทธิ์อย่างอื่นค่อนข้างเยอะ"
    - "คืนก่อนเลือกตั้งผมนอนโรงแรมในอำเภอครับ ไม่รู้ไม่เห็นอะไร ซึ่งเป็นความจริงที่ฝ่ายกฎหมายออกแบบไว้แล้ว"
  event_company_water:
    - "เราไม่ได้ดูดน้ำครับ เราแค่ช่วยบริหารน้ำใต้ดินให้มีประสิทธิภาพ"
    - "บ่อแห้งเป็นปรากฏการณ์ธรรมชาติที่ซับซ้อนครับ เราจ้างนักวิชาการมาศึกษาแล้ว นักวิชาการของเราเอง"
    - "เรามีแผนคืนน้ำสู่ชุมชนครับ ในรูปน้ำดื่มบรรจุขวด ราคาพิเศษสำหรับคนในพื้นที่"
    - "ผมเข้าใจความรู้สึกครับ ผมจะนำ feedback เสนอผู้บริหาร ผู้บริหารจะ noted แล้วเราจะ move forward ไปด้วยกัน"
  event_festival_near:
    - "งาน{festival}ใกล้แล้วนะครับ ปีนี้บริษัทเป็นสปอนเซอร์หลัก ป้ายใหญ่ขึ้น ใจเราก็ใหญ่ขึ้นตาม"
    - "ผมจะไปงาน{festival}ครับ ใส่ชุดไทยด้วย ฝ่ายบุคคลบอกว่าเป็นกิจกรรมสร้างความผูกพันกับชุมชน"
    - "ปีที่แล้วงาน{festival}ผมโดนดึงเข้าวงรำวง ผมรำเหมือนนำเสนองานครับ แข็งและมีหัวข้อ"
  gift_love:
    - "อันนี้ให้ผมเหรอครับ ไม่ต้องเซ็นรับเหรอ ขอบคุณจริงๆ ครับ"
    - "ครั้งสุดท้ายที่ผมได้ของขวัญแบบไม่มีเงื่อนไข ผมจำไม่ได้แล้วครับ ขอบคุณมากคุณ{player}"
    - "{item}นี่ของโปรดผมเลยครับ ผมสัญญาว่าจะไม่เอาไปลงรายงาน CSR"
  gift_like:
    - "ขอบคุณครับ {item}ดีมาก ผมให้คะแนนประสบการณ์ห้าดาวเลย"
    - "น่ารักจังครับ ผมจะวางไว้บนโต๊ะทำงาน ข้างกราฟที่ผมไม่อยากมอง"
    - "ขอบคุณครับ ผมจะตอบแทนในรูปแบบที่ไม่ใช่สัญญา"
  gift_neutral:
    - "อ้อ ขอบคุณครับ ผม acknowledge ความตั้งใจนะครับ"
    - "{item}เหรอครับ ขอบคุณครับ เดี๋ยวผมหาที่วาง"
    - "ขอบคุณครับ ผมจะส่งต่อให้ทีมงาน cascade ลงไปตามลำดับขั้น"
  gift_dislike:
    - "อ่า… {item} ขอบคุณครับ ผมจะส่งต่อให้ฝ่ายที่เกี่ยวข้องพิจารณา"
    - "ผมขอจัดไว้ในหมวด ควรปรับปรุง นะครับ ไม่ได้ว่าอะไร"
    - "ขอบคุณครับ แต่ผมแพ้นิดหน่อย ทางใจ"
  gift_hate:
    - "นี่เป็นการประท้วงเชิงสัญลักษณ์ใช่ไหมครับ ผมรับไว้ในฐานะ feedback ที่ไม่ค่อยสร้างสรรค์"
    - "ผมจะทำเป็นว่าไม่ได้รับนะครับ ทั้งสองฝ่ายจะได้ไม่เสียหน้า"
    - "{item}… คุณตั้งใจใช่ไหมครับ และผมว่าผมก็สมควรโดน"
  birthday:
    - "วันนี้วันเกิดผมครับ บริษัทส่งอีเมลอวยพรอัตโนมัติมาตอนตีห้า ผมดีใจที่คุณจำได้มากกว่า"
    - "คุณ{player} จำวันเกิดผมได้ด้วย ผมไม่ได้ใส่ไว้ในโบรชัวร์นะครับ"
    - "อายุผมขึ้นอีกปีครับ ผลประกอบการส่วนตัวยังไม่ดีขึ้นเลย"
  rare:
    - "ผมมีจดหมายลาออกในลิ้นชักสามฉบับครับ ฉบับใหม่สุดสะกดถูกที่สุด"
    - "บางวันผมแอบขับรถไปซื้อผักที่สหกรณ์ของกล้า ใส่หมวกใส่หน้ากาก เขาจำผมได้ แต่ไม่พูดอะไร"
    - "บ่อแรกที่บริษัทเจาะ ผมเป็นคนกดปุ่มเองครับ ผมยังจำเสียงน้ำพุ่งขึ้นมาได้"
    - "ลูกสาวผมถามว่าพ่อทำงานอะไร ผมตอบว่าช่วยบริหารน้ำ เขาถามต่อว่าให้ใคร ผมยังตอบไม่ได้"
    - "ผมเคยแอบส่งข้อมูลให้คุณเมย์… ล้อเล่นครับ ถ้าไม่ได้ล้อเล่น ผมก็ต้องบอกว่าล้อเล่นอยู่ดี"
