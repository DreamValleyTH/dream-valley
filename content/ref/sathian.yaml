id: sathian
name: "ดาบเสถียร"
role: "ดาบตำรวจประจำตำบล ประจำโรงพักเล็กกลางตำบล อยู่ในเปลหลังโรงพักมากกว่าโต๊ะ"
voice: "แทนตัวเองว่าดาบ พูดช้า เนือยๆ หน้าตาย เลี่ยงงานด้วยข้ออ้างที่ฟังดูมีเหตุผล ติดปาก พรุ่งนี้นะ และ ดาบไม่เห็น ลงท้าย นะ เออ วะ บ้าง ตลกร้ายเรื่องระบบที่ทำให้คนขยันกลายเป็นคนขี้เกียจ ลึกๆ ยังมีศักดิ์ศรีตำรวจ"
dark_humor: true
romanceable: false
lines:
  greet_morning:
    - "เช้าแล้วเหรอ ...ดาบเพิ่งเข้าเวรเมื่อชั่วโมงก่อน ยังเช้าเกินไปสำหรับคดีนะ"
    - "อรุณสวัสดิ์ {player} มีอะไรจะแจ้งไหม ถ้าไม่มี ดีมาก วันนี้เริ่มต้นสวย"
    - "ดาบมาเช้าทุกวันนะ มาเปิดประตูโรงพัก แล้วไปนอนในเปลหลังโรงพักต่อ"
    - "ชาเย็นแก้วแรกของวัน คือหลักฐานชิ้นเดียวที่ดาบเก็บรักษาอย่างดี"
    - "เช้านี้ดาบตั้งด่านตรวจหน้าร้านพี่หน่อย ตรวจว่าก๋วยเตี๋ยวต้มยำใส่ไข่ครบไหม"
  greet_noon:
    - "เที่ยงแล้ว พักเที่ยงของดาบคือสิบเอ็ดโมงถึงบ่ายสาม ตามหลักสากลของดาบ"
    - "แดดแรงอย่างนี้ คนร้ายก็ขี้เกียจออกจากบ้านเหมือนกัน ดาบเข้าใจหัวอกเขา"
    - "มีเรื่องอะไรหรือเปล่า ดาบกำลังจะงีบ ...ไม่ใช่งีบ ซุ่มสังเกตการณ์แบบหลับตา"
    - "สวัสดี {player} ดาบเพิ่งกินข้าวมันไก่ อิ่มจนเขียนใบสั่งไม่ไหว"
    - "บ่ายนี้ดาบมีภารกิจสำคัญ ไปช่วยเจ๊หงษ์ยกลังที่ตลาดนัด ภารกิจชุมชนสัมพันธ์"
  greet_evening:
    - "ห้าโมงเย็นแล้ว ใกล้เลิกงาน ช่วงนี้ดาบทำงานจริงจังที่สุด คือเก็บของกลับบ้าน"
    - "เย็นนี้ไปดูมวยตู้ที่ร้านพี่หน่อยไหม คู่เอกหกโมงครึ่ง ...ดาบไปตรวจตรานะ"
    - "อย่าเพิ่งเข้ามาแจ้งความนะ ดาบเพิ่งปิดสมุดประจำวัน เปิดใหม่มันฝืด"
    - "ตะวันจะตกแล้ว ขโมยมันชอบทำงานช่วงนี้ ขยันกว่าดาบอีก น่านับถือ"
    - "{player} ไปเช่าผ้ายันต์ที่วัดหรือยัง ดาบคุ้มครองได้แค่จากคน ผีไม่อยู่ในประมวลกฎหมาย"
  greet_night:
    - "สามทุ่มผีออก ดาบไม่ออกตรวจกลางคืนนะ ไม่ได้กลัว เป็นนโยบายความปลอดภัยส่วนบุคคล"
    - "ยังเดินอยู่อีก ถ้าผีจับขึ้นมา ดาบลงบันทึกประจำวันให้ได้นะ แต่จับผีให้ไม่ได้"
    - "ดาบจะปิดไฟโรงพักแล้ว กลับบ้านไป หรือวิ่งไปวัด วัดใกล้กว่าบ้านเราทั้งคู่"
    - "ถ้าจะแจ้งความว่าโดนผีหลอก ในแบบฟอร์มไม่มีช่องให้กรอกว่าผีชนิดไหนนะ"
    - "หมาหอนแล้ว นั่นสัญญาณให้ดาบกลับบ้านพอดี"
  weather_rain:
    - "ฝนตก ดาบเลื่อนการตรวจตราออกไปก่อน เครื่องแบบเปียกแล้วต้องรีดใหม่"
    - "ฝนแบบนี้ไม่มีใครออกไปขโมยหรอก ดาบเลยไม่ออกไปจับ ตรรกะสมบูรณ์"
    - "รถสายตรวจเข้าอู่บอลอีกแล้ว ยางรั่วพอดีกับฝนตก ฟ้ามีตา"
    - "นั่งฟังเสียงฝนบนหลังคาสังกะสีโรงพัก ...นี่คือการทำงานแบบเงียบที่สุด"
  weather_hot:
    - "ร้อนจนกุญแจมือร้อนจับไม่ได้ วันนี้ใครจะทำผิดก็ขอให้ทำในร่ม"
    - "ดาบขี่มอเตอร์ไซค์ไปร้าน 24 ชม. ไปตากแอร์เฉยๆ ไม่ได้หนีงานนะ ตรวจความเย็นของตู้แช่"
    - "แดดแบบนี้ดาบอนุญาตให้ตัวเองถอดหมวกได้ ...อนุญาตไว้ตั้งแต่เมื่อวานแล้ว"
    - "ร้อนจนพัดลมโรงพักหมุนช้าลง มันก็ขี้เกียจเหมือนเจ้าของ"
  weather_storm:
    - "พายุแรงแบบนี้ โจรก็อยู่บ้าน ดาบก็อยู่โรงพัก สมดุลดี"
    - "ต้นไม้ล้มขวางถนนไม่ใช่คดีอาญา ไปตามช่างเปี๊ยกเถอะ ดาบไม่มีเลื่อย"
    - "ไฟดับทั้งตำบล วิทยุสื่อสารดาบก็แบตหมด ตอนนี้ดาบออฟไลน์อย่างเป็นทางการ"
    - "หลังคาโรงพักปลิวไปแผ่นนึง ใครเจอเอามาคืนด้วย มีเลขครุภัณฑ์อยู่"
  weather_pm25:
    - "ฝุ่นเต็มเลย ใส่หน้ากากกันหมดดาบจำหน้าใครไม่ได้ ถือเป็นวันนิรโทษกรรมขนาดย่อม"
    - "มีคนเผาตอซังอีกแล้ว ดาบรู้ว่าใคร แต่ควันมันบังหน้า ดาบเลยมองไม่ชัด"
    - "เครื่องฟอกอากาศโรงพักขอไปสามปีแล้ว ได้มาเป็นพัดลมตั้งโต๊ะ"
    - "อย่าทำงานกลางแจ้งนานนะวันนี้ ดาบก็ไม่ทำ ...ดาบไม่ทำทุกวันอยู่แล้ว"
  season_rainy:
    - "หน้าฝนคดีวัวควายหลงเยอะ ดาบมีวิธีตามหา คือรอให้มันเดินกลับบ้านเอง"
    - "เข้าพรรษา ดาบอยากตั้งใจงดออกตรวจสามเดือน ...ทำไม่ได้หรอก แต่ฝันได้"
    - "หน้าฝนงูเข้าบ้านบ่อย อย่าเรียกดาบนะ ดาบกลัวงู ไปเรียกลุงพรานแดง"
    - "แข่งเรือยาวปีนี้ดาบดูแลความปลอดภัย จากริมตลิ่ง ใต้ร่ม พร้อมน้ำแข็งไส"
  season_cool:
    - "หน้าหนาว อากาศดีที่สุดสำหรับนอนเปล ดาบไม่อยากให้มันเสียเปล่า"
    - "งานวัดงานกาชาด ดาบต้องไปรักษาความสงบ ดาบรักษาไว้ด้วยการไม่ไปทำให้มันวุ่น"
    - "ลอยกระทงมีคนเมาตกน้ำทุกปี ดาบยืนเตรียมช่วยไว้ บนสะพาน ห่างน้ำหน่อย"
    - "ปีใหม่ดาบได้กระเช้าเยอะ ส่วนใหญ่มาจากคนที่ดาบไม่เคยจับ ...ไม่ใช่เพราะกระเช้านะ"
  season_dry:
    - "หน้าแล้งคนทะเลาะแย่งน้ำเยอะ ดาบไกล่เกลี่ยจนทั้งสองฝ่ายเบื่อดาบแทนกันเอง"
    - "สงกรานต์ดาบประจำจุดตรวจ เปียกตั้งแต่เก้าโมง ใครสาดดาบ ดาบจำได้ ...แต่ไม่ทำอะไร"
    - "ร้อนจนขโมยยังขี้เกียจ สถิติปีนี้ลด ดาบเอาไปรายงานเป็นผลงาน"
    - "งานบวชหมู่มีคนเมาเต้นหน้าขบวน ดาบเต้นด้วยนิดนึง สร้างความใกล้ชิดกับประชาชน"
  heart_low:
    - "มีอะไร ...จะแจ้งความเหรอ แน่ใจนะ เอกสารมันเยอะนะ"
    - "หน้าใหม่ในตำบล ดาบจำไว้แล้ว แต่ไม่ได้จดไว้ ขี้เกียจ"
    - "ถ้าไม่มีเรื่องด่วน ดาบขอพักสายตาก่อน"
    - "ดาบไม่ได้หยิ่งนะ ดาบแค่ประหยัดพลังงานในการคุยกับคนไม่คุ้น"
  heart_mid:
    - "{player} มานั่งตรงนี้สิ เปลมีสองอัน อันนึงของดาบ อีกอันของคนที่ดาบไม่รำคาญ"
    - "สมัยหนุ่มดาบวิ่งไล่จับโจรสามกิโล เดี๋ยวนี้ไล่แมลงวันในโรงพักยังหอบ"
    - "ถ้ามีใครมาแกล้ง บอกดาบนะ ดาบจะ...ไปคุยให้ ภายในอาทิตย์นี้"
    - "เอาน้ำแข็งไสไหม ดาบซื้อมาสองถ้วย ถ้วยที่สองซื้อเผื่อเหงา"
  heart_high:
    - "ดาบเคยขยันนะ ขยันมาก ทำคดีเจ้าใหญ่ในอำเภอ แล้วก็ถูกย้ายมาที่นี่ ตั้งแต่นั้นดาบก็เรียนรู้"
    - "ดาบขี้เกียจกับคดีเล็ก เพราะดาบเห็นมาแล้วว่าคดีใหญ่ไม่มีใครอยากให้ดาบขยัน"
    - "เมียดาบบ่นว่าดาบไม่ทำอะไร ...แต่ทุกเช้าดาบไปส่งลูกถึงโรงเรียนก่อนครูเต้ยเปิดประตู"
    - "ถ้าวันนึงเรื่องบริษัทกลายเป็นคดี ดาบจะลุกจากเปลจริงๆ นะ ดาบสัญญากับ {player}"
    - "ดาบเก็บเหรียญความกล้าหาญไว้ในลิ้นชักกับหนังยาง ไม่มีที่ไหนเหมาะกว่านั้นแล้ว"
  topic_news:
    - "ข่าวเหรอ ไก่บ้านตาเผือกหายสองตัว ดาบว่ามันเดินไปเองนะ ไก่ก็มีความฝัน"
    - "มีคนแจ้งมอเตอร์ไซค์หาย ดาบจดเลขทะเบียนไว้บนฝ่ามือแล้ว ...แล้วก็ล้างมือไปแล้ว"
    - "ได้ยินว่ามีวงไพ่ในงานศพท้ายหมู่ ดาบไม่เห็นนะ ดาบเดินผ่านแบบหลับตา"
    - "สถิติคดีเดือนนี้เป็นศูนย์ เพราะไม่มีใครมาแจ้ง หรือเพราะดาบไม่ได้เปิดประตู แล้วแต่มุมมอง"
    - "ใกล้หวยออก เจ๊หงษ์ขายดี ดาบไม่รู้ว่าเจ๊ขายอะไร ดาบรู้แค่ว่าขายดี"
  topic_advice:
    - "ของหายไปให้ผู้ใหญ่ประกาศหอกระจายข่าวก่อน ฟรีด้วย เร็วกว่ามาหาดาบ ดาบพูดจริง"
    - "อย่าพกเงินสดเยอะตอนกลางคืน ผีจับทีเงินกระจายเต็มทุ่ง ดาบตามคืนให้ไม่ได้"
    - "ขโมยของบ้านเพื่อน โอกาสโดนจับสี่สิบเปอร์เซ็นต์ ถ้ามีคนเห็นสูงกว่านั้นอีก ดาบไม่ได้ชวนนะ บอกให้รู้"
    - "ถ้าโดนจับ ค่าต่อกลับร้อยบาท แถมชื่อไปอยู่ในกลุ่ม LINE เป็นอาทิตย์ ไม่คุ้มเลย"
    - "ปิดเล้าไก่ก่อนค่ำ คดีไก่หายส่วนใหญ่ผู้ต้องหาคือหมาบ้านข้างๆ ดาบสืบมาแล้ว"
    - "ตู้ ATM อยู่กลางแจ้ง ไปกดตอนกลางคืนมีทั้งผีทั้งคนรออยู่ กดตอนกลางวันเถอะ"
  topic_smalltalk:
    - "ดาบกำลังฝึกนอนลืมตา จะได้หลับตอนเข้าเวรแล้วดูเหมือนตื่น ใกล้สำเร็จแล้ว"
    - "เปลตัวนี้ดาบผูกมาสิบสองปี เปลี่ยนเชือกไปสามเส้น ความตั้งใจยังเหมือนเดิม"
    - "ดาบดูมวยตู้ทุกเย็นวันเสาร์ แต่ไม่เคยเล่นพนันนะ ...เพราะขี้เกียจคิดราคาต่อรอง"
    - "ไซเรนรถสายตรวจเปิดไม่ติดมาสองปีแล้ว ดาบใช้วิธีตะโกนเอา ประหยัดงบหลวง"
    - "ถ้าเกษียณ ดาบจะเปิดร้านให้เช่าเปล ชั่วโมงละสิบบาท ลูกค้าคนแรกคือดาบเอง"
  topic_about_self:
    - "ดาบเป็นตำรวจมายี่สิบหกปี ติดยศดาบมาสิบห้าปีแล้ว มันคงชอบดาบ"
    - "ดาบเคยอยู่โรงพักใหญ่ในอำเภอ ทำคดีจริงจัง แล้วไปขวางทางคนใหญ่ เลยได้มาประจำตำบลอย่างสงบ"
    - "ดาบมีลูกสองคน คนเล็กเรียนกับครูเต้ย คนโตอยากเป็นตำรวจ ดาบกำลังเกลี้ยกล่อมให้ไปเป็นหมอ"
    - "ความฝันของดาบคือมีวันที่ไม่มีใครมาแจ้งความ ...เกือบทุกวันก็เป็นแบบนั้นแล้ว"
    - "ดาบไม่ได้ขี้เกียจหรอก ดาบแค่จัดลำดับความสำคัญ แล้วตัวเองอยู่อันดับหนึ่ง"
  topic_about_others:
    - "เจ๊หงษ์น่ะ ทุกงวดดาบเดินผ่านแผงเจ๊ เจ๊ก็ยิ้ม ดาบก็ยิ้ม แล้วเราก็ไม่รู้อะไรกันทั้งคู่"
    - "ตั้มร้าน 24 ชม. เป็นพยานที่ดีที่สุดในตำบล ตื่นทั้งคืน แต่ไม่เคยอยากให้การ"
    - "หมอแอนชอบมาตามดาบไปวัดความดัน ดาบหนีทางหลังโรงพักได้ทุกครั้ง ...เกือบทุกครั้ง"
    - "ลุงสมหมายมาขอดูทะเบียนรถของกลางทุกงวด ดาบให้ไม่ได้ ...แต่ดาบก็ไม่ได้เอาผ้าคลุมนะ"
    - "คุณธนาส่งกาแฟมาเลี้ยงโรงพักทุกเดือน ดาบกินกาแฟ แต่ไม่ได้แถมใจไปด้วยนะ ...ยังไม่ได้แถม"
    - "ผู้ใหญ่สมศักดิ์ส่งหนังสือเรื่องไก่ขันเสียงดังมาให้ดาบ ฉบับเดิมสามรอบ ดาบอ่านรอบเดียว"
  gossip_theft:
    - "มีคนมาแจ้งว่า {player} หยิบของเขาไป ดาบรับเรื่องไว้แล้ว ...ยังอยู่ในถาด อย่าให้ดาบต้องหยิบขึ้นมาเปิดนะ"
    - "ขโมยของในตำบลนี้ไม่ต้องรอดาบหรอก ป้าแต๋วตัดสินเสร็จตั้งแต่ก่อนดาบตื่น"
    - "คืนของเขาไปซะ ดาบจะได้ไม่ต้องทำงาน เราได้ประโยชน์ทั้งคู่"
  gossip_cheating:
    - "เรื่องคบซ้อนไม่ใช่คดีอาญา ดาบดีใจมาก"
    - "ดาบไม่ยุ่งเรื่องหัวใจ แต่ถ้ามีคนมาตบตีกันหน้าโรงพัก ดาบต้องลุกจากเปล ดาบไม่ชอบเลย"
    - "เมียดาบบอกว่าเรื่องนี้ร้ายแรงกว่าขโมยควายอีก ดาบไม่เถียง ดาบกลัวเมีย"
  gossip_unpaid_bill:
    - "ค้างค่าไฟเหรอ ไม่ใช่เรื่องตำรวจ ...แต่ค่าไฟโรงพักก็ค้าง เราพวกเดียวกัน"
    - "ถ้าโดนตัดไฟ มานั่งตากพัดลมที่โรงพักได้ มีตัวเดียว ดาบจองแล้ว"
    - "จ่ายก่อนวันที่สิบห้านะ การไฟฟ้าทำงานเร็วกว่าดาบเยอะ"
  gossip_small_envelope:
    - "ใส่ซองน้อยไม่ผิดกฎหมาย ดาบเปิดดูแล้ว ไม่มีมาตราไหนเขียนไว้"
    - "ดาบใส่ซองทุกงานร้อยเดียว แล้วกินให้คุ้มสามร้อย นี่เรียกว่าการบริหารความเสี่ยง"
    - "ป้าทองใบจำได้ทุกซองนะ ระบบฐานข้อมูลของป้าดีกว่าของสถานีอีก"
  gossip_skip_longkhaek:
    - "ไม่ไปลงแขกคืน ดาบเข้าใจ ดาบก็ไม่ไป ...แต่ดาบมีข้ออ้างว่าเข้าเวร"
    - "ในตำบลนี้ ไม่ไปช่วยเขาคืนผิดหนักกว่าขี่รถไม่ใส่หมวก ดาบลงโทษไม่ได้ แต่ชาวบ้านลงได้"
    - "ถ้าอยากได้ข้ออ้าง ดาบให้ยืม บอกว่าปวดหลัง ดาบใช้มาสิบปีไม่เคยพลาด"
  player_fainted:
    - "เมื่อคืนผีจับเหรอ ดาบลงบันทึกประจำวันให้แล้ว ช่องผู้ต้องหาเขียนว่า ไม่ทราบชนิด"
    - "ตื่นที่ รพ.สต. ดีกว่าตื่นที่โรงพักนะ ที่นี่ไม่มีหมอแอน มีแต่ดาบ"
    - "เงินหายด้วยไหม ถ้าหายกลางทุ่ง ดาบสืบไม่ได้นะ ผีไม่ทิ้งลายนิ้วมือ"
  player_new_vehicle:
    - "รถใหม่เหรอ ต่อภาษีหรือยัง พ.ร.บ. ล่ะ ...ช่างเถอะ วันนี้ดาบไม่ได้ตั้งด่าน"
    - "รถสวยนะ จอดห่างโรงพักหน่อย เดี๋ยวคนจะคิดว่าเป็นของดาบ แล้วมีคนมาถามว่าเอาเงินที่ไหน"
    - "ไฟหน้ารถไล่ผีได้นะ ดาบอิจฉา มอเตอร์ไซค์ดาบไฟหน้าติดบ้างไม่ติดบ้าง"
  player_lottery_win:
    - "ถูกหวยรัฐบาลใช่ไหม ...ใช่ไหม ดาบถามเพื่อความสบายใจของดาบเอง"
    - "ยินดีด้วย เงินก้อนแบบนี้อย่าซุกไว้ใต้ที่นอน ดาบไม่อยากทำคดีขโมยปีนี้"
    - "ดาบไม่ขอส่วนแบ่งนะ แต่ถ้าจะเลี้ยงก๋วยเตี๋ยวพี่หน่อย ดาบว่างตลอดอยู่แล้ว"
  player_muddy:
    - "เปื้อนโคลนขนาดนี้ ดาบนึกว่าคนร้ายหนีลงนา เกือบลุกขึ้นแล้วนะ"
    - "อย่ามานั่งเปลดาบตอนตัวเปื้อนโคลนนะ เปลนี้ซักยาก"
    - "ไปทำนามาเหรอ ขยันดี ดาบชื่นชมคนขยัน ...จากระยะไกล"
  player_rich:
    - "รวยขึ้นนะช่วงนี้ ระวังขโมย ดาบพูดเผื่อไว้ ไม่ได้อยากทำคดี"
    - "คนรวยในตำบลมีสองแบบ แบบที่ดาบไปกินข้าวที่บ้าน กับแบบที่ดาบต้องไปเฝ้าบ้านให้ ขอเป็นแบบแรกนะ"
    - "รวยแล้วอย่าจ้างใครถือบัตรสวัสดิการแทนนะ ดาบได้ยินแล้วต้องทำเป็นไม่ได้ยิน มันเหนื่อย"
  player_in_debt:
    - "หนี้เยอะเหรอ อย่าไปกู้ดอกรายวันนะ คนทวงหนี้พวกนั้นขยันกว่าตำรวจ"
    - "ดาบก็มีหนี้ บ้าน รถ สหกรณ์ออมทรัพย์ ดาบเป็นหนี้มาตั้งแต่ก่อนติดยศ"
    - "ไปคุยกองทุนหมู่บ้านกับผู้ใหญ่ ดอกต่ำ และไม่มีใครมาเคาะประตูตอนตีห้า"
  player_sick:
    - "ไม่สบายเหรอ ไป รพ.สต. ไป หมอแอนใจดีกว่าดาบ แล้วก็ขยันกว่าด้วย"
    - "ป่วยแล้วพักนะ ดาบเป็นผู้เชี่ยวชาญเรื่องการพัก ปรึกษาได้"
    - "ไอแบบนี้อย่าเข้าใกล้ดาบนะ ดาบลาป่วยไม่ได้แล้ว วันลาหมดไปกับการพักผ่อน"
  player_married:
    - "แต่งงานแล้วเหรอ ยินดีด้วย ต่อไปมาแจ้งความแทนกันได้ สะดวกขึ้น"
    - "ทะเลาะกันอย่ามาโรงพักนะ ไปหาผู้ใหญ่ ผู้ใหญ่ไกล่เกลี่ยเก่งกว่า"
    - "ดาบแต่งงานมายี่สิบปี เคล็ดลับคือพูดว่า จ้ะ ให้ไวกว่าคดีหมดอายุความ"
  event_disaster:
    - "น้ำมาแล้ว ดาบลุกจากเปลแล้วนะ ใครเห็นช่วยยืนยันด้วย ดาบกำลังขนกระสอบทรายจริงๆ"
    - "รถสายตรวจขนคนแก่ไปศาลาประชาคมได้ทีละสองคน ใครรอได้รอ ดาบจะวิ่งให้เร็วกว่าเดิม"
    - "ภัยพิบัติไม่ใช่เวลาขี้เกียจ ดาบขี้เกียจทุกวันยกเว้นวันแบบนี้"
    - "มีคนฉวยโอกาสเข้าไปขโมยของบ้านที่อพยพ อันนี้ดาบไม่ยอม ดาบจะนั่งเฝ้าเองทั้งคืน"
  event_election:
    - "ช่วงเลือกตั้งดาบเป็นกลาง กลางแบบยืนกลางถนนแล้วไม่มองซ้ายไม่มองขวา"
    - "คืนหมาหอนดาบเข้าเวร ได้ยินหมาหอนเยอะมาก แต่ดาบไม่ใช่ตำรวจหมา"
    - "ป้ายหาเสียงโดนกรีดสามป้าย มีคนมาแจ้ง ดาบรับเรื่องแล้ว แต่ป้ายมันให้การไม่ได้"
    - "อย่าเอาเงินจากคืนหมาหอนมาให้ดาบดูนะ ดาบไม่อยากเห็น เห็นแล้วต้องเขียนรายงาน"
  event_company_water:
    - "บ่อแห้งเหรอ ไม่มีกฎหมายข้อไหนให้ดาบจับน้ำใต้ดินคืนมาได้ ดาบลองนึกแล้ว"
    - "คุณธนาจ้าง รปภ. มาเฝ้ารั้วบริษัท เงินเดือนดีกว่าดาบ แถมขยันกว่าอีก"
    - "ถ้าชาวบ้านจะไปยื่นหนังสือที่บริษัท ดาบไปด้วย ไม่ได้ไปห้ามนะ ไปยืนข้างๆ"
  event_festival_near:
    - "{festival} ใกล้แล้ว ดาบต้องไปรักษาความปลอดภัย แปลว่ายืนข้างซุ้มลูกชิ้นทอด"
    - "คืนงาน {festival} ไม่มีผี ดาบชอบงานนี้ ไม่ต้องกลัวอะไรนอกจากคนเมา"
    - "ไปงาน {festival} ไหม ดาบจะไปเล่นปาลูกโป่ง ในฐานะเจ้าหน้าที่ฝึกความแม่นยำ"
  gift_love:
    - "{item}! อันนี้ดาบลุกจากเปลมารับเลยนะ หาดูยาก ทั้งของทั้งท่าทาง"
    - "เออ ดาบชอบอันนี้ที่สุด ใครบอกเนี่ย ...ไม่ต้องบอก ดาบไม่อยากสืบ"
    - "ขอบใจจริงๆ วันนี้ดาบจะทำงานเพิ่มหนึ่งชั่วโมงเป็นการตอบแทน ...ครึ่งชั่วโมงพอ"
  gift_like:
    - "ขอบใจนะ {item} กินคู่กับชาเย็นได้"
    - "ดีเลย ดาบรับไว้ ไม่ใช่สินบนนะ ดาบไม่มีอะไรให้ช่วยอยู่แล้ว"
    - "ของดี ดาบเก็บไว้ในลิ้นชักข้างเหรียญกล้าหาญ"
  gift_neutral:
    - "อ้อ {item} ขอบใจ วางไว้ตรงนั้นแหละ เดี๋ยวดาบค่อยหยิบ ...พรุ่งนี้"
    - "รับไว้นะ ดาบไม่รู้จะเอาไปทำอะไร แต่ก็ไม่รู้จะคืนยังไงเหมือนกัน"
  gift_dislike:
    - "{item} เหรอ ...ดาบรับไว้เป็นของกลางนะ"
    - "อันนี้ดาบไม่ค่อยชอบ แต่ขี้เกียจปฏิเสธ"
  gift_hate:
    - "อย่าเอาอันนี้มาให้ดาบ ดาบลุกจากเปลมาปฏิเสธเลยนะ รู้ไว้ว่าจริงจัง"
    - "นี่มันอะไร เอาออกไปจากโรงพักเดี๋ยวนี้ ...ภายในห้านาที สิบนาทีก็ได้"
  birthday:
    - "วันเกิดดาบวันนี้ ดาบขอหยุดหนึ่งวัน ...ดาบหยุดทุกวัน แต่วันนี้หยุดแบบมีเหตุผล"
    - "อายุเพิ่ม เปลก็เก่าลง แต่ดาบยังขี้เกียจเท่าเดิม นี่แหละความมั่นคงในชีวิต"
    - "ขอบใจที่จำได้ เมียดาบยังต้องเปิดปฏิทินดูเลย"
  rare:
    - "ดาบเก็บแฟ้มคดีที่ถูกสั่งให้ปิดไว้ใต้เปล ทุกคืนดาบนอนทับมัน จะได้ไม่ลืม"
    - "ดาบรู้ว่าคนเรียกดาบว่าขี้เกียจ ดาบชอบชื่อนี้ ดีกว่าชื่อที่ได้ตอนขยัน"
    - "เมื่อคืนดาบเห็นผีโพงเดินผ่านโรงพัก ดาบพยักหน้าให้ มันพยักหน้าคืน เราเข้าใจกัน"
    - "ถ้าวันไหนดาบหายไป ไม่ต้องตามนะ ดาบอยู่ใต้ต้นมะม่วงหลังวัด ที่นั่นลมดีที่สุดในตำบล"
    - "ดาบเคยวิ่งไล่ขโมยควายกลางทุ่งตอนเที่ยงคืน จับได้ด้วย ...เรื่องนี้ไม่มีใครเชื่อ ดาบเองก็เริ่มไม่เชื่อ"
