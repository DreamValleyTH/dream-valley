    lines:
      - ["may", "ดาบคะ รถบรรทุกบริษัทวิ่งตอนตีสอง มีลงบันทึกประจำวันไหมคะ"]
      - ["sathian", "มีเมย์ ...แต่ตีสองดาบหลับ หน้านั้นเลยว่าง"]
      - ["may", "หน้าว่างแบบนี้ เขียนข่าวได้ทั้งหน้าเลยค่ะ"]
      - ["sathian", "เขียนได้ แต่อย่าใส่ชื่อดาบนะ ใส่ว่า แหล่งข่าวผู้ง่วงนอน"]
