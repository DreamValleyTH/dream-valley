choices:
  - id: sathian_c1
    min_heart: 0
    prompt: "มาแจ้งความเหรอ ...แน่ใจนะ"
    options:
      - text: "เปล่า แค่แวะมาทักทาย"
        heart: 1
        reply: "ดีมาก ดาบชอบคนแบบนี้ที่สุดในตำบล"
      - text: "ใช่ ของหาย"
        heart: 0
        reply: "ลองดูใต้เตียงหรือยัง ไม่เจอก็ไปให้ผู้ใหญ่ประกาศ ถ้ายังไม่เจออีก ...พรุ่งนี้ค่อยมาใหม่"
      - text: "ดาบทำงานบ้างเถอะ"
        heart: -1
        reply: "ดาบทำอยู่ ...ดาบกำลังคิด การคิดก็เป็นงานนะ"
  - id: sathian_c2
    min_heart: 3
    prompt: "ดาบเห็นวงไพ่ในงานศพท้ายหมู่ ดาบควรเดินเข้าไปไหม"
    options:
      - text: "เข้าไปเตือนเบาๆ ก็พอ"
        heart: 1
        reply: "เบาๆ ...ดาบทำได้ ดาบถนัดเรื่องเบาๆ"
      - text: "ปล่อยไปเถอะ เจ้าภาพเขาเหนื่อยพอแล้ว"
        heart: 1
        reply: "ดาบก็คิดแบบนั้น แต่ดาบอยากให้คนอื่นพูดก่อน"
      - text: "จับให้หมดเลย"
        heart: -1
        reply: "ทั้งวงเลยเหรอ ...รถสายตรวจจุได้สองคนนะ"
  - id: sathian_c3
    min_heart: 5
    prompt: "ลุงสมหมายมาขอเลขทะเบียนรถของกลางไปแทงหวย ดาบควรให้ไหม"
    options:
      - text: "อย่าให้เลย เดี๋ยวป้าพรบ่น"
        heart: 2
        reply: "จริง ป้าพรน่ากลัวกว่าผู้กำกับอีก"
      - text: "ให้ไปเหอะ เลขไม่ใช่ความลับ"
        heart: 0
        reply: "ดาบก็คิดงั้น ...แต่ถ้าออกจริง ดาบจะรู้สึกผิดทั้งงวด"
      - text: "ขอด้วยคนสิ"
        heart: -1
        reply: "อันนี้ดาบไม่ได้ยิน ดาบประหยัดหูอยู่"
  - id: sathian_c4
    min_heart: 7
    prompt: "ถ้าดาบจะเปิดแฟ้มเรื่องบริษัทสูบน้ำ ต้องมีพยาน {player} จะให้การไหม"
    options:
      - text: "ให้การ ดาบจะได้ไม่ต้องสู้คนเดียว"
        heart: 2
        reply: "...ดาบลุกจากเปลแล้วนะ รู้ไว้ ครั้งนี้ลุกจริง"
      - text: "ขอคิดก่อน กลัวเหมือนกัน"
        heart: 1
        reply: "ไม่เป็นไร ดาบก็กลัว แค่กลัวมานานจนชินแล้ว"
      - text: "ช่างมันเถอะ ดาบนอนต่อดีกว่า"
        heart: -2
        reply: "...นั่นแหละที่ทุกคนพูดกับดาบมายี่สิบปี ดาบนึกว่า {player} จะไม่เหมือนคนอื่น"
