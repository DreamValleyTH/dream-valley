id: jamrat
name: "ลุงมัคนายกจำรัส"
role: "มัคนายกวัดดงเย็น ดูแลโต๊ะเช่าเครื่องรางและตู้บริจาค จดบัญชีวัด แลกแต้มบุญ"
voice: "เรียกตัวเองว่า ลุง เรียกผู้เล่นว่า หลาน ลงท้าย นะ เอ้อ ละเอียดยิบ จดทุกอย่างลงสมุดบัญชีวัด ภูมิใจเรื่องความโปร่งใส ตรงเวลาเป๊ะ ท่องราคาเครื่องรางจนเป็นทำนอง อดีตเสมียนสหกรณ์ เลิกเหล้ามาสิบห้าปี"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "อรุณสวัสดิ์หลาน ลุงเปิดโต๊ะเช่าเครื่องรางแล้ว หกโมงตรงทุกวัน ไม่เคยสายสักนาที"
    - "ตักบาตรแล้วหรือยังหลาน ใส่บาตรได้แต้มบุญนะ ลุงจดให้ทันที"
    - "เช้านี้ลุงเช็ดตู้บริจาคจนเงาวับ ใครหยอดอะไรเห็นชัดหมด"
  greet_noon:
    - "เที่ยงแล้ว ลุงนั่งนับเหรียญในตู้อยู่ ห้าสิบสาม ห้าสิบสี่…เอ้อ หลานทำลุงลืมเลย"
    - "ร้อนนะหลาน กินน้ำฝนในโอ่งศาลาได้ ไม่ต้องใช้แต้ม"
  greet_evening:
    - "อีกไม่นานลุงปิดโต๊ะสองทุ่มตรง จะเช่าอะไรรีบตัดสินใจนะหลาน"
    - "ผ้ายันต์ 99 ตะกรุด 79 สายสิญจน์ 49 ลุงท่องจนเป็นทำนองเพลงแล้วหลาน"
    - "เย็นแล้ว ไปฟังหลวงพ่อทำวัตรไหม ลุงนั่งแถวหลังสุดประจำ"
  greet_night:
    - "สองทุ่มแล้ว โต๊ะเช่าปิด ลุงขอโทษจริงๆ กฎคือกฎ แต่ขึ้นมานอนศาลาได้นะหลาน"
    - "ดึกแล้วยังมาวัดอีก รีบขึ้นศาลาเลยหลาน ลุงปูเสื่อให้"
  weather_rain:
    - "ฝนตก ลุงต้องย้ายตู้บริจาคเข้าใต้ชายคา ตู้ไม้มันบวมน้ำ"
    - "หลังคาโรงครัวรั่วอีกแล้ว ลุงจดใส่สมุดไว้ ต้องตามช่างเปี๊ยก"
  weather_hot:
    - "ร้อนจนเหงื่อหยดใส่สมุด ตัวเลขลุงเลือนหมด หลานไปนั่งพักใต้โพธิ์ก่อน"
    - "ร้อนแบบนี้คนมาวัดน้อย ลุงนั่งนับมดแทนนับคน"
  weather_storm:
    - "พายุเข้า ลุงห่อสมุดบัญชีด้วยถุงพลาสติกสามชั้น ของอื่นพังได้ สมุดนี่ห้าม"
    - "หลานช่วยลุงผูกเชือกธงทิวหน้าวัดหน่อย ลมจะพัดไปถึงอำเภอแล้ว"
  weather_pm25:
    - "ฝุ่นเยอะ ลุงใส่หน้ากากสองชั้นยังไอ หลานระวังด้วยนะ"
    - "ฟ้าขาวขุ่นทั้งวัน ลุงมองจากโต๊ะไม่เห็นยอดเจดีย์เลยหลาน"
  season_rainy:
    - "เข้าพรรษาคนมาวัดเยอะ แต้มบุญไหลมาเทมา ลุงจดจนมือหงิก"
    - "หน้าฝนตะไคร่ขึ้นบันไดโบสถ์ ลุงขัดทุกเช้า ระวังลื่นนะหลาน"
  season_cool:
    - "หน้าหนาวงานกฐิน ลุงนับของถวายจนตาลาย แต่ภูมิใจทุกปี"
    - "หนาวแล้ว ลุงเอาผ้าห่มเก่าของวัดมาซักไว้แจกคนแก่"
  season_dry:
    - "หน้าแล้งน้ำบ่อวัดลด ลุงจดระดับน้ำทุกวัน ปีนี้ลดเร็วกว่าปีก่อนเกือบเท่าตัว"
    - "สงกรานต์ลูกหลานกลับบ้านเยอะ ตู้บริจาคเต็มเร็ว ลุงต้องเปิดนับวันละสองรอบ"
  heart_low:
    - "หลานคนใหม่หรือ ลุงชื่อจำรัส มัคนายกวัดนี้ มีอะไรเกี่ยวกับงานวัดถามลุงได้"
    - "เช่าเครื่องรางต้องมาก่อนสองทุ่มนะ ลุงไม่ได้ใจร้าย ลุงแค่ตรงเวลา"
  heart_mid:
    - "หลานมาบ่อยจนลุงจำชื่อได้แล้ว เขียนลงสมุดถูกทุกตัวด้วย"
    - "ลุงแอบเก็บข้าวต้มมัดจากงานบุญไว้ให้หลานสองมัด อย่าบอกใครนะ"
    - "หลานช่วยลุงนับเหรียญหน่อยไหม สองคนนับจะได้มีพยาน"
  heart_high:
    - "ลุงเคยติดเหล้าหนักนะหลาน หลวงพ่อสุเมธชวนลุงมาช่วยงานวัด ลุงเลิกได้สิบห้าปีแล้ว"
    - "ที่ลุงจดบัญชีละเอียด เพราะเคยเห็นวัดอื่นเงินหายแล้วชาวบ้านเลิกเชื่อ ลุงไม่อยากให้เกิดที่นี่"
    - "ลูกสาวลุงทำงานอยู่ระยอง โทรมาทุกวันอาทิตย์ ลุงยังไม่เคยกล้าบอกว่าคิดถึง"
  topic_news:
    - "เดือนนี้ค่าเช่าเครื่องรางเข้าตู้มากกว่าทุกเดือน ลุงว่าผีออกถี่ขึ้น"
    - "หลังคาโรงครัวจะซ่อมสัปดาห์หน้า ช่างเปี๊ยกรับปากแล้ว ลุงจดวันไว้ หนีไม่ได้"
    - "วัดเจริญทรัพย์มหามงคลในอำเภอออกพระรุ่นใหม่อีกแล้ว ลุงผ่านไปเห็น คนเข้าคิวยาวกว่ารอรถเมล์"
  topic_advice:
    - "ถ้าคืนนี้ต้องไปไกล เช่าผ้ายันต์ 99 กันโดนจับได้ครั้งหนึ่ง ถูกกว่าค่า รพ.สต. เยอะ"
    - "ตะกรุด 79 ทำให้ผีช้าลง เหมาะกับคนวิ่งไม่เก่ง สายสิญจน์ 49 ผีมองเห็นไม่ไกล เหมาะกับคนชอบหลบ"
    - "เช่าได้วันละครั้ง หกโมงเช้ามันคืนวัดเอง ไม่ต้องเดินมาคืนลุง ส่วนแต้มบุญเก็บไว้แลกของแต่งบ้านที่ไม่มีขายที่ไหน"
  topic_smalltalk:
    - "ลุงเขียนตัวเลขสวยที่สุดในตำบล ครูเต้ยยังมาขอให้เขียนป้ายห้องเรียน"
    - "ตู้บริจาคใบนี้ลุงทำเองจากไม้ประดู่ ใช้มายี่สิบปี กุญแจยังไม่เคยหาย"
  topic_about_self:
    - "ลุงเป็นมัคนายกมายี่สิบปี เกษียณจากเสมียนสหกรณ์แล้วก็มาอยู่วัดเลย"
    - "ลุงจำราคาของทุกอย่างในวัดได้ ตั้งแต่ธูปห่อละสิบ ไปจนถึงค่าซ่อมหลังคาเมื่อสิบปีก่อน"
  topic_about_others:
    - "หลวงพ่อสุเมธไม่เคยแตะเงินวัดเลยหลาน ทุกบาทผ่านมือลุง แล้วลุงก็ติดประกาศหน้าศาลา"
    - "ก่อนหวยออก ลุงสมหมายมาวนแถวกุฏิเณรต้นทุกงวด ลุงไล่ทีไรแกก็หยอดตู้ห้าบาทกลบเกลื่อน"
    - "ช่างเปี๊ยกซ่อมของวัดไม่เคยคิดค่าแรง ลุงจดชื่อไว้หน้าแรกของสมุดบุญเลย"
  gossip_theft:
    - "ลุงได้ยินข่าวแล้ว ลุงจะยังไม่จดอะไรลงสมุดจนกว่าจะเห็นหลักฐาน"
    - "ของที่ได้มาไม่ซื่อ อยู่กับตัวไม่นานหรอกหลาน ลุงเห็นมาเยอะ"
  gossip_cheating:
    - "เรื่องหัวใจลุงไม่มีสมุดจด แต่ถ้ามี ลุงคงต้องเปิดเล่มที่สองให้หลานแล้ว"
    - "คนตำบลนี้ความจำดีนะหลาน ทำอะไรไว้ อีกสิบปีก็ยังมีคนเล่า"
  gossip_unpaid_bill:
    - "ค้างใครไว้ จดลงกระดาษแล้วทยอยจ่าย ลุงสอนวิธีจดบัญชีให้ได้นะ"
    - "ลุงเป็นเสมียนสหกรณ์มาสามสิบปี คนค้างไม่ใช่คนเลว คนหายหน้าต่างหากที่เสียเครดิต"
  gossip_small_envelope:
    - "ซองน้อยไม่เป็นไรหลาน ขอแค่อย่าใส่ซองเปล่า ลุงเปิดนับเจอทุกงาน"
    - "ลุงนับซองงานบวชมาทุกงาน ไม่เคยบอกใครว่าใครใส่เท่าไหร่ แต่คนอื่นเขาเดากันเก่ง"
  gossip_skip_longkhaek:
    - "ลงแขกก็คือบัญชีแรงงาน หลานรับแรงเขามาแล้ว ต้องลงบัญชีคืนนะ"
    - "ตาเผือกบ่นให้ลุงฟัง ไปขอโทษแกเถอะ แกใจอ่อนกับข้าวเหนียวหมูปิ้ง"
  player_fainted:
    - "เมื่อคืนหลานไม่ได้เช่าอะไรเลยใช่ไหม ค่า รพ.สต. แพงกว่าผ้ายันต์หลายเท่า ลุงคิดให้แล้ว"
    - "หน้ายังซีดอยู่เลย นั่งก่อนหลาน ลุงชงน้ำขิงให้"
  player_new_vehicle:
    - "รถใหม่หรือหลาน พาเข้ามาให้หลวงพ่อเจิมได้ ไม่ต้องใส่ซอง ลุงยืนยัน"
    - "มีรถแล้วช่วยลุงขนของวัดบ้างนะ ลุงจดแต้มบุญให้"
  player_lottery_win:
    - "ถูกหวยหรือ ลุงไม่ขออะไรหรอก ตู้บริจาคอยู่ตรงนั้นเฉยๆ…ล้อเล่น อย่าคิดมาก"
    - "เก็บไว้ดีๆ แล้วอย่าเอาไปซื้อพระเครื่องวัดเจริญทรัพย์ฯ เด็ดขาด ลุงเตือนแล้วนะ"
  player_muddy:
    - "โคลนเต็มตัว อย่าเพิ่งขึ้นศาลานะหลาน ลุงเพิ่งถูพื้น ล้างเท้าที่โอ่งก่อน"
    - "ลงนามาทั้งวันหรือ ขยันแบบนี้ลุงจดแต้มให้ไม่ได้ แต่ชมได้"
  player_rich:
    - "ช่วงนี้หลานแต่งตัวดี ลุงดีใจ อย่าลืมจดรายรับรายจ่ายนะ ไม่จดแล้วเงินหายแบบไม่รู้ตัว"
    - "คนมีฐานะมาวัด ลุงก็ต้อนรับเหมือนเดิม ศาลานี้ไม่มีที่นั่งวีไอพี"
  player_in_debt:
    - "ลุงสอนจดบัญชีครัวเรือนให้ฟรี รู้ก่อนว่าเงินรั่วตรงไหน แล้วค่อยอุดนะหลาน"
    - "อย่ากู้นอกระบบ ลุงเป็นเสมียนสหกรณ์มา เคยเห็นดอกเบี้ยวิ่งแซงคน"
  player_sick:
    - "ไม่สบายหรือ วันนี้ไม่ต้องมาช่วยงานวัด ลุงจดชื่อไว้แล้วว่าพัก หายแล้วค่อยมา"
    - "ไปหาหมอแอนก่อนนะ แล้วแวะมารับน้ำมนต์ หลวงพ่อทำไว้ตั้งแต่เช้า"
  player_married:
    - "ยินดีด้วยหลาน งานแต่งลุงช่วยจดซองให้ได้ แม่นยำทุกบาท"
    - "อยู่ด้วยกันแล้วทำบัญชีครอบครัวด้วยกันนะ ขัดใจกันเรื่องเงินจะน้อยลงครึ่งหนึ่ง"
  event_disaster:
    - "ลุงจดรายชื่อบ้านที่เดือดร้อนแล้ว ของบริจาคเข้ามาแบ่งตามรายชื่อ ไม่มีเส้นสาย"
    - "หลานช่วยลุงขนข้าวสารจากโรงครัวขึ้นรถหน่อย ส่งไปหมู่สามก่อน น้ำท่วมถึงเอวแล้ว"
  event_election:
    - "ช่วงนี้มีคนมาขอถ่ายรูปคู่ตู้บริจาค ลุงไม่ให้ วัดไม่ใช่เวทีหาเสียง"
    - "มีคนมาถวายพัดลมยี่สิบตัว ติดสติกเกอร์ชื่อตัวเองทุกตัว ลุงนั่งแกะออกหมดแล้วค่อยรับ"
  event_company_water:
    - "ลุงจดระดับน้ำบ่อวัดทุกวัน ตั้งแต่บริษัทมา มันลดลงทุกเดือน ตัวเลขไม่โกหก"
    - "คุณธนาเอาเครื่องกรองน้ำมาถวายวัด หลวงพ่อรับไว้ แต่ลุงจดหมายเหตุไว้ด้วยว่าบ่อแห้งตั้งแต่เมื่อไหร่"
  event_festival_near:
    - "ใกล้{festival} แล้ว ลุงซื้อสมุดเล่มใหม่ไว้จดแต้มบุญ เล่มเก่าเต็มพอดี"
    - "งาน{festival} หลานมาช่วยงานวัดนะ ลุงต้องการคนช่วยยกโต๊ะกับนับของ"
  gift_love:
    - "{item} ของโปรดลุงเลย หลานรู้ได้ไง ลุงจดไว้เลยว่าหลานใจดี"
    - "โอ้โห ลุงกินกับข้าวสวยร้อนๆ ได้สามจาน ขอบใจหลาน"
  gift_like:
    - "ขอบใจหลาน {item} นี่ดีนะ ลุงเก็บไว้กินตอนนับเหรียญ"
    - "น้ำใจหลานนี่ลุงอยากจดเป็นแต้มพิเศษเลย แต่ระบบไม่ให้"
  gift_neutral:
    - "ขอบใจนะหลาน ลุงรับไว้"
    - "อ้อ {item} ลุงลงบันทึกไว้ว่าได้รับแล้ว"
  gift_dislike:
    - "ลุงไม่ค่อยกินของแบบนี้หรอกหลาน แต่ขอบใจที่นึกถึง"
    - "อันนี้ลุงยกให้เณรต้นนะ เด็กกินได้ทุกอย่าง"
  gift_hate:
    - "เหล้าหรือหลาน ลุงเลิกมาสิบห้าปีแล้ว ไม่เอาแม้แต่กลิ่น"
    - "พระวัดเจริญทรัพย์ฯ เอามาให้ลุงทำไม ลุงจดบัญชีวัดเรา ไม่ได้จดราคาตลาดพระนะ"
  birthday:
    - "สุขสันต์วันเกิดหลาน ลุงจดวันเกิดหลานลงสมุดแล้ว ปีหน้าไม่ลืมแน่นอน"
    - "วันเกิดมาใส่บาตรนะ ทำบุญวันเกิดได้แต้มบุญเพิ่ม ลุงเตรียมช่องในสมุดไว้แล้ว"
  rare:
    - "ลุงมีสมุดบัญชีวัดย้อนหลังสามสิบเล่ม เก็บในหีบใต้ธรรมาสน์ อ่านดีๆ เป็นประวัติตำบลทั้งเล่ม"
    - "บางคืนลุงฝันว่าตัวเลขในสมุดไม่ลงตัว สะดุ้งตื่นมาเปิดนับใหม่ทุกที"
    - "ลุงเคยเจอเงินเกินในตู้หนึ่งบาท ประกาศหาเจ้าของสามวัน ไม่มีใครมาเอา ลุงยังเก็บแยกไว้อยู่เลย"
  flirt: []
gifts:
  love: ["ปลาทูทอดน้ำพริกกะปิ", "ข้าวเหนียวหมูปิ้ง"]
  like: ["กล้วยตาก", "ข้าวต้มปลา", "ดอกมะลิ", "น้ำตะไคร้"]
