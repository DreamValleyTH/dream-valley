<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dream Valley — ทดลองผีหลอก</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wood:#3b2a1c;--paper:#f6ead2;--paper2:#ecdcb8;--ink:#33251a;--ink2:#6b5440;--sun:#f2b84b;--chili:#c8432f;--leaf2:#7fb04c;--night:#16131f;--font:"Mitr","Leelawadee UI","Thonburi",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:#efe6ff;font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;background:#0d0b14 url(../../assets/story/st_d1_night.png) center/cover;image-rendering:pixelated}
#stage::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(0,0,0,0) 20%,rgba(5,3,12,.85) 75%)}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));gap:10px;z-index:2}
h1{margin:0;font-size:20px;font-weight:600;text-shadow:0 2px 0 #000}
.sub{font-size:13px;color:#c9b7dc;margin-top:-6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.18);color:#efe6ff;border-radius:999px;padding:6px 12px;font:500 13px var(--font)}
.pill.on{background:var(--sun);color:var(--ink);border-color:var(--wood)}
.energy{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:500}
.eb{width:90px;height:12px;border:2px solid #000;border-radius:6px;background:#3a3046;overflow:hidden}.eb i{display:block;height:100%;background:linear-gradient(90deg,#9be36a,#f2d34b);transition:width .4s}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.g{position:relative;aspect-ratio:1;border-radius:12px;border:2px solid rgba(255,255,255,.18);background:#1e1a29 center/cover;image-rendering:pixelated;padding:0;overflow:hidden}
.g span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.85));font:500 12px var(--font);color:#fff;padding:12px 2px 4px}
.walk{width:100%;padding:14px;border-radius:14px;border:3px solid #000;background:var(--sun);color:var(--ink);font:600 18px var(--font)}
.note{font-size:12px;color:#a99bbd;text-align:center}
/* walking / scare */
#walk{position:fixed;inset:0;z-index:5;display:none;align-items:flex-end;justify-content:center;padding-bottom:30vh;background:rgba(0,0,0,.55);font-size:15px;color:#c9b7dc}
#walk.on{display:flex}
#walk b{animation:fade 1.1s infinite alternate}
@keyframes fade{from{opacity:.3}to{opacity:1}}
#scare{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(40,0,10,.55),rgba(0,0,0,.92))}
#scare.on{display:flex}
#scare img{width:min(86vw,440px);image-rendering:pixelated;filter:drop-shadow(0 0 30px rgba(0,0,0,.9))}
#scare.pop img{animation:pop .42s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.25);opacity:0}45%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
#scare.shake{animation:shake .45s linear}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-10px,6px)}30%{transform:translate(9px,-7px)}45%{transform:translate(-7px,-5px)}60%{transform:translate(6px,7px)}75%{transform:translate(-3px,3px)}}
#flash{position:fixed;inset:0;z-index:7;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash .28s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
#scare .name{position:absolute;top:max(18px,env(safe-area-inset-top));left:0;right:0;text-align:center;font:600 26px var(--font);color:#ffdede;text-shadow:0 3px 0 #000,0 0 18px #c8432f;letter-spacing:.04em;opacity:0;transition:opacity .3s}
#scare.named .name{opacity:1}
/* card */
#card{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translate(-50%,120%);width:min(420px,94vw);z-index:8;background:var(--paper);color:var(--ink);border:4px solid var(--wood);border-radius:16px;padding:14px;box-shadow:0 8px 0 rgba(0,0,0,.4);transition:transform .35s cubic-bezier(.2,1.2,.4,1)}
#card.on{transform:translate(-50%,0)}
#card h2{margin:0 0 4px;font-size:19px}#card p{margin:0 0 10px;font-size:14px;color:var(--ink2);line-height:1.5}
.ch{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px;border:2px solid #cdb68c;background:#fff8e8;font:500 15px var(--font);color:var(--ink)}
.ch small{display:block;font-size:12px;color:var(--ink2);font-weight:400}
/* minigame */
#mg{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(10,6,16,.75)}
#mg.on{display:flex}
.mbox{width:min(380px,92vw);background:#2a2433;border:4px solid #120d18;border-radius:16px;padding:16px;text-align:center}
.mbox h3{margin:0;font-size:21px}.mbox .s{font-size:13px;color:#c9b7dc;margin:2px 0 10px}
.chase{position:relative;height:64px;background:#1a1622;border:3px solid #000;border-radius:12px;overflow:hidden;margin-bottom:10px}
.chase .home{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:28px}
.chase .me,.chase .gh{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:30px;transition:left .08s linear}
.chase .gh{filter:drop-shadow(0 0 6px #7cff9a)}
.feet{display:flex;gap:12px}.feet button{flex:1;padding:24px 0;font:600 20px var(--font);border-radius:14px;border:3px solid #000;background:var(--paper2);color:var(--ink);touch-action:manipulation}
.feet button:active{background:var(--sun)}
.t{margin-top:8px;font-weight:500}
#res{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:10;width:min(360px,90vw);background:var(--paper);color:var(--ink);border:4px solid var(--wood);border-radius:16px;padding:16px;text-align:center;display:none}
#res.on{display:block}#res h3{margin:0 0 6px}#res p{margin:0 0 12px;color:var(--ink2)}
#res button{padding:10px 18px;border-radius:10px;border:3px solid var(--wood);background:var(--sun);font:600 16px var(--font)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui">
  <h1>👻 ทดลองผีหลอก (mockup)</h1>
  <div class="sub">เดินนอกบ้านหลังสามทุ่ม แล้วจะเจออะไรบ้าง… ลองระดับความตกใจได้</div>
  <div class="row">
    <button class="pill" data-lv="soft">ตกใจเบา ๆ</button><button class="pill on" data-lv="mid">ปกติ</button><button class="pill" data-lv="max">สะดุ้งสุด</button>
    <div class="energy">⚡<div class="eb"><i id="eb" style="width:100%"></i></div><span id="en">100</span></div>
  </div>
  <div class="grid" id="grid"></div>
  <button class="walk" id="walkBtn">🌙 เดินกลางคืน (สุ่มผี)</button>
  <div class="note">แตะรูปผีเพื่อเลือกตัวที่จะเจอ · เสียงจะดังหลังแตะครั้งแรก</div>
</div>
<div id="walk"><b>ก๊อบ… ก๊อบ… ก๊อบ… (เสียงฝีเท้าบนถนนดิน)</b></div>
<div id="scare"><div class="name" id="gname"></div><img id="gimg" alt=""></div>
<div id="flash"></div>
<div id="card"><h2 id="ct"></h2><p id="cx"></p><div id="cc"></div></div>
<div id="mg"><div class="mbox"><h3 id="mt"></h3><div class="s">สลับกดซ้าย–ขวาให้เร็วที่สุด วิ่งให้ถึงบ้านก่อนโดนจับ!</div>
  <div class="chase"><span class="home">🏠</span><span class="gh" id="gh">👻</span><span class="me" id="me">🏃</span></div>
  <div class="feet"><button data-f="L">ซ้าย</button><button data-f="R">ขวา</button></div><div class="t" id="tt"></div></div></div>
<div id="res"><h3 id="rt"></h3><p id="rx"></p><button id="rb">เดินต่อ</button></div>
<script>
'use strict';
const G = [
  ['pop', 'ผีปอบ', 'ยายแก่ผมกระเซิงยิ้มเห็นฟันดำ “ตับหลานดูน่ากินจัง…” แล้วเรอดังเอิ้ก', 'ปอบ'],
  ['krasue', 'ผีกระสือ', 'หัวผู้หญิงลอยมา ไส้ห้อยวิบวับเป็นไฟเขียว ร้องว่า “เห็นคอกวัวบ้านไหนไหม…”', 'กระสือ'],
  ['krahang', 'ผีกระหัง', 'ผู้ชายกางกระด้งเป็นปีก ขาคร่อมสากกระเดือก โฉบต่ำมาจนผมปลิว', 'กระหัง'],
  ['pret', 'เปรต', 'ร่างผอมสูงเท่าต้นตาล ปากเท่ารูเข็ม ส่งเสียงหวีดเบา ๆ “ขอส่วนบุญหน่อย…”', 'เปรต'],
  ['kumanthong', 'กุมารทอง', 'เด็กตัวทองอร่ามโผล่จากพุ่มไม้ “เล่นด้วยกันไหม… พ่อ… แม่…”', 'กุมารทอง'],
  ['kongkoi', 'ผีกองกอย', 'ตัวเล็กขนรุงรัง กระโดดขาเดียวมาตามคันนา “กองกอย! กองกอย!”', 'กองกอย'],
  ['chaothi', 'ผีเจ้าที่', 'ยายในชุดขาวยืนข้างศาลพระภูมิ ตาเขียวปั้ด “มาอยู่ตั้งนานไม่ไหว้สักที!”', 'เจ้าที่'],
  ['kokhad', 'ผีคอขาด', 'ทหารเกณฑ์หิ้วหัวตัวเองไว้ใต้วงแขน หัวยิ้มแล้วถาม “ทางไปกรมฯ ไปทางไหน”', 'ผีคอขาด'],
  ['taithongklom', 'ผีตายทั้งกลม', 'หญิงท้องโตในผ้าขาว ร้องไห้เบา ๆ ใต้ต้นตะเคียน แล้วหันมาช้า ๆ…', 'ตายทั้งกลม'],
];
const $ = id => document.getElementById(id);
let lv = 'mid', en = 100, pick = null, ac = null;
// ---- sound (made on the fly, no files) ----
const audio = () => { if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} if (ac && ac.state === 'suspended') ac.resume(); return ac; };
function tone(f, d, type = 'sine', v = .2, slide = 0, t0 = 0) { const a = audio(); if (!a) return; const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0008, t + d); o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .05); }
function noise(d, v = .25, t0 = 0) { const a = audio(); if (!a) return; const n = a.sampleRate * d, b = a.createBuffer(1, n, a.sampleRate), x = b.getChannelData(0); for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; s.buffer = b; g.gain.value = v; s.connect(f).connect(g).connect(a.destination); s.start(a.currentTime + t0); }
const step = i => tone(90 + Math.random() * 20, .09, 'triangle', .12, -30, i * .42);
function sting() { const v = lv === 'soft' ? .07 : lv === 'mid' ? .16 : .26;
  [0, 1, 2].forEach(i => tone(220 * Math.pow(1.06, i * 3), 1.1, 'sawtooth', v * .5, -120, 0)); tone(55, 1.4, 'sine', v * 1.6, -15); noise(.35, v * 1.2); if (lv === 'max') tone(1600, .5, 'square', .06, -1200, .02); }
// ---- grid ----
$('grid').innerHTML = G.map((g, i) => `<button class="g" data-i="${i}" style="background-image:url(../../assets/ghosts/${g[0]}.png)"><span>${g[1]}</span></button>`).join('');
$('grid').onclick = e => { const b = e.target.closest('.g'); if (!b) return; pick = +b.dataset.i; walk(); };
document.querySelectorAll('.pill').forEach(b => b.onclick = () => { lv = b.dataset.lv; document.querySelectorAll('.pill').forEach(x => x.classList.toggle('on', x === b)); audio(); });
$('walkBtn').onclick = () => { pick = null; walk(); };
const setEn = v => { en = Math.max(0, Math.min(100, v)); $('eb').style.width = en + '%'; $('en').textContent = en; };
// ---- 1. walking in the dark ----
function walk() { audio(); const g = G[pick == null ? Math.floor(Math.random() * G.length) : pick];
  $('walk').classList.add('on'); [0, 1, 2, 3].forEach(step); tone(1900, .06, 'sine', .03, 300, .6); tone(2100, .06, 'sine', .03, 300, .75);   // crickets
  setTimeout(() => { $('walk').classList.remove('on'); scare(g); }, 1700 + Math.random() * 900); }
// ---- 2. the jump scare: zoom in, flash, shake, sting — then the name, then the card ----
function scare(g) { const s = $('scare'); $('gimg').src = `../../assets/ghosts/${g[0]}.png`; $('gname').textContent = g[1];
  s.className = 'on'; void s.offsetWidth; s.classList.add('pop'); sting();
  if (lv !== 'soft') { $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go'); s.classList.add('shake'); }
  if (navigator.vibrate && lv === 'max') try { navigator.vibrate([80, 40, 120]); } catch (_) {}
  setTimeout(() => s.classList.add('named'), 450);
  setTimeout(() => card(g), lv === 'soft' ? 700 : 1100); }
function card(g) { $('ct').textContent = g[1] + '!'; $('cx').textContent = g[2];
  const C = [
    ['🏃 วิ่งหนีกลับบ้าน!', 'มินิเกม · รอด = แรง −6 · ล้ม = แรง −35', () => run(g)],
    ['🙏 ยกมือไหว้ขอทาง', 'ไหว้ศาลพระภูมิเมื่อเช้าไว้จะรอดง่ายขึ้น', () => done(Math.random() < .55, 'ลมเย็นพัดผ่าน แล้วทุกอย่างก็เงียบ… ' + g[3] + 'หายไป', 'ขาอ่อนทรุดลงกับพื้น ตื่นมาอีกทีที่ รพ.สต.', -3, -45)],
    ['😑 ยืนนิ่ง หลับตา นับหนึ่งถึงสิบ', 'สุ่ม', () => done(Math.random() < .5, 'พอลืมตา ก็ไม่มีอะไรแล้ว', 'มีมือเย็น ๆ แตะไหล่… แล้วเสียงหัวเราะคิกคัก', -5, -40)]];
  $('cc').innerHTML = C.map((c, i) => `<button class="ch" data-i="${i}">${c[0]}<small>${c[1]}</small></button>`).join('');
  $('cc').onclick = e => { const b = e.target.closest('.ch'); if (!b) return; $('card').classList.remove('on'); $('scare').className = ''; C[+b.dataset.i][2](); };
  $('card').classList.add('on'); }
// ---- 3. run-away minigame: alternate feet; the ghost closes in over time ----
function run(g) { let n = 0, last = '', left = 55, need = 24; $('mt').textContent = `${g[1]}ไล่ตาม!`; $('mg').classList.add('on');
  const me = $('me'), gh = $('gh'); gh.textContent = '👻';
  const draw = () => { const p = n / need, gp = (55 - left) / 55; me.style.left = (14 + p * 74) + '%'; gh.style.left = (4 + gp * 80) + '%'; $('tt').textContent = `⏱ ${(left / 10).toFixed(1)}`; };
  const end = ok => { clearInterval(tk); $('mg').classList.remove('on'); document.querySelectorAll('.feet button').forEach(b => b.onpointerdown = null);
    done(ok, 'วิ่งถึงบันไดบ้านทัน! หอบนิดหน่อย', 'ขาพันกันล้มกลางทาง… กว่าจะคลานถึงบ้านแรงหมด', -6, -35); };
  document.querySelectorAll('.feet button').forEach(b => b.onpointerdown = e => { e.preventDefault(); if (b.dataset.f === last) return; last = b.dataset.f; n++; tone(120, .05, 'triangle', .1); draw(); if (n >= need) end(true); });
  const tk = setInterval(() => { left--; draw(); if (left <= 0) end(false); }, 100); draw(); }
function done(ok, win, lose, ew, el) { setEn(en + (ok ? ew : el)); $('rt').textContent = ok ? '😮‍💨 รอดไปได้' : '😵 แย่แล้ว'; $('rx').textContent = (ok ? win : lose) + ` (แรง ${ok ? ew : el})`; $('res').classList.add('on');
  if (!ok) tone(160, .6, 'sine', .15, -100); }
$('rb').onclick = () => { $('res').classList.remove('on'); if (en <= 0) setEn(100); };
</script>
</body>
</html>
