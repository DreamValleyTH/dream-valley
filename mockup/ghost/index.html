<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dream Valley — ทดลองผีหลอก</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wood:#3b2a1c;--paper:#f6ead2;--ink:#33251a;--sun:#f2b84b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#14111c;color:#efe6ff;font-family:"Mitr","Leelawadee UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
main{padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:10px;max-width:520px;margin:0 auto}
h1{margin:0;font-size:20px}.sub{font-size:13px;color:#c9b7dc;margin-top:-4px}
.lbl{font-size:12px;color:#a99bbd;margin-bottom:-4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18);color:#efe6ff;border-radius:999px;padding:6px 12px;font:500 13px inherit;font-family:inherit}
.pill.on{background:var(--sun);color:var(--ink);border-color:var(--wood)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g{position:relative;aspect-ratio:1;border-radius:12px;border:2px solid rgba(255,255,255,.16);background:#211c2c center/contain no-repeat;image-rendering:pixelated;padding:0}
.g.on{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun)}
.g span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.85));font:500 12px inherit;font-family:inherit;color:#fff;padding:12px 2px 4px;border-radius:0 0 10px 10px}
.walk{width:100%;padding:14px;border-radius:14px;border:3px solid #000;background:var(--sun);color:var(--ink);font:600 18px inherit;font-family:inherit}
.energy{display:flex;align-items:center;gap:6px;font-weight:500}.eb{flex:1;height:12px;border:2px solid #000;border-radius:6px;background:#3a3046;overflow:hidden}.eb i{display:block;height:100%;background:linear-gradient(90deg,#9be36a,#f2d34b);transition:width .4s}
#res{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:70;width:min(360px,90vw);background:var(--paper);color:var(--ink);border:4px solid var(--wood);border-radius:16px;padding:16px;text-align:center;display:none}
#res.on{display:block}#res h3{margin:0 0 6px}#res p{margin:0 0 12px;color:#6b5440}
#res button{padding:10px 18px;border-radius:10px;border:3px solid var(--wood);background:var(--sun);font:600 16px inherit;font-family:inherit}
.note{font-size:12px;color:#8f82a3;text-align:center}
</style>
</head>
<body>
<main>
  <h1>👻 ทดลองผีหลอก v2</h1>
  <div class="sub">ฉากค่อย ๆ มืด → เห็นหนองน้ำ/ป่า/ทุ่งนา → ผีโผล่แบบมีท่าของตัวเอง แล้วพุ่งออกมาจากจอ · ทุกตัวเลือกเป็นมินิเกม</div>
  <div class="lbl">ระดับความตกใจ</div>
  <div class="row" id="lv"><button class="pill" data-v="soft">เบา</button><button class="pill on" data-v="mid">ปกติ</button><button class="pill" data-v="max">สะดุ้งสุด</button></div>
  <div class="lbl">ฉาก</div>
  <div class="row" id="bg"><button class="pill on" data-v="">สุ่ม</button><button class="pill" data-v="swamp">หนองน้ำ</button><button class="pill" data-v="forest">ป่า</button><button class="pill" data-v="field">ทุ่งนา</button></div>
  <div class="lbl">ผี (แตะเลือก · ไม่เลือก = สุ่ม)</div>
  <div class="grid" id="grid"></div>
  <div class="energy">⚡<div class="eb"><i id="eb" style="width:100%"></i></div><span id="en">100</span></div>
  <button class="walk" id="walkBtn">🌙 เดินกลางคืน</button>
  <div class="note">เปิดเสียงด้วยนะ · โทรศัพท์จะสั่นในระดับปกติ/สะดุ้งสุด</div>
</main>
<div id="res"><h3 id="rt"></h3><p id="rx"></p><button id="rb">เดินต่อ</button></div>
<script src="../../js/minigames.js"></script>
<script src="../../js/ghosts.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
let lv = 'mid', bg = '', sel = null, en = 100;
$('grid').innerHTML = GS.LIST.map(g => `<button class="g" data-id="${g.id}" style="background-image:url(../../assets/ghosts/gh_${g.id}.png)"><span>${g.name}</span></button>`).join('');
$('grid').onclick = e => { const b = e.target.closest('.g'); if (!b) return; sel = sel === b.dataset.id ? null : b.dataset.id; document.querySelectorAll('.g').forEach(x => x.classList.toggle('on', x.dataset.id === sel)); };
const pills = (id, set) => $(id).onclick = e => { const b = e.target.closest('.pill'); if (!b) return; $(id).querySelectorAll('.pill').forEach(x => x.classList.toggle('on', x === b)); set(b.dataset.v); };
pills('lv', v => lv = v); pills('bg', v => bg = v);
const setEn = v => { en = Math.max(0, Math.min(100, v)); $('eb').style.width = en + '%'; $('en').textContent = en; };
function result(ok, win, lose, ew, el) { GS.end(); setTimeout(() => { setEn(en - (ok ? ew : el)); $('rt').textContent = ok ? '😮‍💨 รอดไปได้' : '😵 แย่แล้ว'; $('rx').textContent = `${ok ? win : lose} (แรง −${ok ? ew : el})`; $('res').classList.add('on'); }, 500); }
$('rb').onclick = () => { $('res').classList.remove('on'); if (en <= 0) setEn(100); };
$('walkBtn').onclick = () => {
  GS.play({ id: sel, bg: bg || null, level: lv, base: '../../', onReady: api => { const G = api.ghost;
    const c = api.say(`<h2>${G.name}!</h2><p>${G.line}</p><button data-c="run">🏃 วิ่งหนีกลับบ้าน!<small>มินิเกม (สุ่ม 3 แบบ) · รอด = แรง −6 · ล้ม = แรง −35</small></button>
      <button data-c="pray">🙏 ยกมือไหว้ ท่องคาถา<small>มินิเกมจำลำดับ · ไหว้ศาล/มีผ้ายันต์ จะท่องสั้นลง</small></button><button data-c="still">😶 ยืนนิ่ง กลั้นหายใจ<small>มินิเกมกดค้าง</small></button>`);
    c.onclick = e => { const b = e.target.closest('button'); if (!b) return; api.hideSay();
      if (b.dataset.c === 'run') MG.pick(['mash', 'dodge', 'arrows'], { key: 'run', dark: true, title: `${G.name}ไล่ตาม!`, per: { mash: { need: 24, time: 5.5 }, dodge: { time: 8, obstacles: ['🌳', '🪨', '🐍', '🕸️', '🎋'] }, arrows: { n: 8, limit: 1050 } },
        onEnd: sc => result(sc >= .7, 'วิ่งถึงบันไดบ้านทัน! หอบนิดหน่อย', 'ขาพันกันล้มกลางทาง… กว่าจะคลานถึงบ้านแรงหมด', 6, 35) });
      else if (b.dataset.c === 'pray') MG.play('sequence', { dark: true, title: '🙏 ท่องคาถาให้ถูก', symbols: ['🙏', '📿', '🕯️', '🪷'], len: 5, prompt: 'ท่องตามลำดับ… อย่าให้ผิด!',
        onEnd: sc => result(sc >= .99, `ลมเย็นพัดผ่าน ${G.name}ค่อย ๆ จางหายไป`, 'ท่องผิดคำเดียว… เสียงหัวเราะดังอยู่ข้างหู', 3, 40) });
      else MG.play('hold', { dark: true, title: '😶 กลั้นหายใจ… อย่าขยับ', rounds: 2, zone: .16, btn: 'กดค้าง = กลั้นหายใจ', sub: 'ปล่อยตอนแถบอยู่ในช่องเขียว',
        onEnd: sc => result(sc >= .99, 'พอลืมตา ก็ไม่มีอะไรแล้ว…', 'มีมือเย็น ๆ แตะไหล่ ขาอ่อนจนทรุด', 5, 40) }); }; } });
};
</script>
</body>
</html>
