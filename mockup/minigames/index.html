<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dream Valley — มินิเกม</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#2b2117;color:#f6ead2;font-family:"Mitr",system-ui,sans-serif;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 20px max(14px,env(safe-area-inset-left))}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 12px;color:#cdb68c;font-size:13px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g button{padding:12px 8px;border-radius:12px;border:3px solid #3b2a1c;background:#f6ead2;color:#33251a;font:500 15px "Mitr",sans-serif;text-align:left}
.g button small{display:block;font-size:11px;color:#6b5440;font-weight:400}
#res{margin-top:12px;min-height:24px;font-weight:500}
</style>
</head>
<body>
<h1>🎮 มินิเกมทั้งหมด (12 แบบ)</h1>
<p>ในเกม แต่ละงานจะสุ่มมินิเกมจากชุดของมัน และจะไม่ซ้ำแบบเดิมติดกัน</p>
<div class="g" id="g"></div>
<div id="res"></div>
<script src="../../js/minigames.js"></script>
<script>
const L = [
  ['timing', 'จังหวะเข็ม', 'ตกปลา · ทำอาหาร · งัดลิ้นชัก', { title: '🎣 ดึงเบ็ด!' }],
  ['tension', 'คุมปลาในแถบ', 'ตกปลา', { title: '🎣 ปลาตัวใหญ่!' }],
  ['hold', 'กดค้างแล้วปล่อย', 'ตกปลา · เทน้ำปลา · ดึงลิ้นชัก', { title: '🫙 เทน้ำปลาพอดี ๆ' }],
  ['stir', 'วนนิ้วคนหม้อ', 'ทำอาหาร', { title: '🍲 คนแกงให้ทั่ว' }],
  ['sequence', 'จำลำดับ', 'ใส่เครื่องปรุง · รหัสกุญแจ · ท่องคาถา', { title: '🍳 ใส่เครื่องตามลำดับ' }],
  ['taps', 'แตะเก็บของ', 'งานทำความสะอาด', { title: '🧹 เก็บขยะลานวัด', bad: ['🐝'] }],
  ['sweep', 'ลากกวาด', 'งานทำความสะอาด', { title: '🧹 กวาดใบไม้' }],
  ['catch', 'ลากตะกร้ารับของ', 'งานทำความสะอาด · เก็บไข่', { title: '🥚 รับไข่ให้ทัน', good: ['🥚'], bad: ['🪨', '💩'] }],
  ['pairs', 'เปิดไพ่จับคู่', 'จัดของเข้าที่', { title: '🧺 จัดของเข้าที่' }],
  ['mash', 'สลับเท้าวิ่ง', 'หนีผี', { title: '👻 ผีกระสือไล่ตาม!', dark: true }],
  ['dodge', 'หลบสิ่งกีดขวาง 3 เลน', 'หนีผี', { title: '👻 วิ่งหนีในป่า!', dark: true }],
  ['arrows', 'กดลูกศรให้ทัน', 'หนีผี · หลบสายตาเพื่อน', { title: '🙈 หลบให้ทัน!', dark: true }],
];
const g = document.getElementById('g'), res = document.getElementById('res');
g.innerHTML = L.map((x, i) => `<button data-i="${i}">${x[1]}<small>${x[2]}</small></button>`).join('');
g.onclick = e => { const b = e.target.closest('button'); if (!b) return; const x = L[+b.dataset.i];
  MG.play(x[0], Object.assign({}, x[3], { onEnd: sc => { res.textContent = `${x[1]}: ได้คะแนน ${Math.round(sc * 100)}% ${sc >= .9 ? '⭐⭐⭐' : sc >= .6 ? '⭐⭐' : sc >= .3 ? '⭐' : '💀'}`; } })); };
</script>
</body>
</html>
