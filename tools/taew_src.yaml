    - "ไปทำบุญรถที่วัดหรือยังจ๊ะ ผูกผ้าสามสีไว้หน้ารถ ป้ามีขายนะ"
    - "รถใหม่แล้วอย่าลืมว่าไฟหน้ารถไล่ผีได้ด้วยนะหลาน ขับกลับดึกๆ ค่อยอุ่นใจหน่อย"
  player_lottery_win:
    - "ป้าไม่ได้พูดนะ แต่ทั้งตำบลรู้แล้วว่าหลานถูกหวย! ระวังญาติที่ไม่เคยเห็นหน้าจะโผล่มานะ"
    - "ถูกหวยแล้วทำบุญบ้างนะหลาน แล้วก็อย่าซื้อทุกงวดแบบลุงสมหมาย"
    - "เลขอะไรจ๊ะหลาน บอกป้าเบาๆ ก็ได้ ป้าไม่บอกใครหรอก จริงๆ นะ"
  player_muddy:
    - "โอ๊ย หลาน โคลนเต็มตัวเลย อย่าเพิ่งเข้าร้านนะ ป้าเพิ่งถูพื้น"
    - "ไปดำนามาใช่ไหม โคลนถึงคอเชียว อาบน้ำแล้วทาโลชั่นด้วย ป้ามีขายขวดละสามสิบห้า"
    - "เปื้อนโคลนอย่างนี้แหละคนทำนาจริงๆ ป้าชอบ แต่ยืนตรงพรมเช็ดเท้าก่อนนะ"
  player_rich:
    - "ช่วงนี้หลานรวยขึ้นนะ ป้าดูจากถุงที่ซื้อ เมื่อก่อนซื้อมาม่า ตอนนี้ซื้อน้ำปลาขวดแพง"
    - "รวยแล้วอย่าลืมร้านป้านะหลาน อย่าไปซื้อห้างในอำเภอหมด"
    - "รวยแล้วเขาจะมายืมเงินเยอะนะหลาน ใครยืมป้าจะบอกว่าคนนี้คืนหรือไม่คืน"
  player_in_debt:
    - "ป้าได้ยินว่าหลานติดเสี่ยเฮงหลายหมื่น ดอกเขาโตไวนะหลาน รีบปิดก่อนเถอะ"
    - "หนี้มันไม่น่าอายหรอกหลาน ทั้งตำบลก็มีหนี้กันทุกบ้าน แต่ต้องมีแผนจ่ายนะ"
    - "ถ้าเดือดร้อนไปถามกองทุนหมู่บ้านหรือสหกรณ์กล้าดู ดอกถูกกว่าเยอะ"
  player_sick:
    - "หน้าซีดเชียวหลาน ไม่สบายเหรอ ไป รพ.สต. เถอะ บัตรทองฟรี หมอแอนใจดี"
    - "ป้าต้มน้ำขิงไว้ หลานเอาไปกินหน่อยนะ ป้าไม่คิดเงิน"
    - "อย่าฝืนลงนาตอนป่วยนะ ป้าเห็นมาเยอะแล้ว ฝืนวันเดียวนอนเป็นอาทิตย์"
  player_married:
    - "ยินดีด้วยนะหลาน! ป้าร้องไห้ตอนรดน้ำสังข์เลย ป้าห่อซองให้แล้ว อย่าไปบอกใครว่าเท่าไหร่"
    - "แต่งงานแล้วซื้อของบ้านป้าเป็นคู่นะ ป้าลดให้คนละห้าบาท"
    - "ตอนนี้ไม่มีข่าวคบซ้อนให้ป้านินทาแล้ว ป้าเหงาเลยนะหลาน"
  event_disaster:
    - "บ้านใครเสียหายบ้าง ป้าจดชื่อไว้แล้ว ของในร้านป้าลดให้คนที่โดนน้ำท่วมครึ่งราคา"
    - "อบต. แจกถุงยังชีพแล้ว แต่ป้าเห็นในถุงมีแต่มาม่ากับปลากระป๋อง ป้าแถมไข่ให้คนละแผง"
    - "ช่วงนี้ลงแขกซ่อมบ้านกันนะหลาน ไม่มีใครรอดคนเดียวหรอก"
