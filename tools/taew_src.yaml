    - "ค่าไฟค้างนี่มันขึ้นในกลุ่ม LINE นะหลาน ป้าเห็นแล้วอายแทน ไปจ่ายที่ร้าน 24 ชม. ก็ได้ ค่าธรรมเนียมสิบบาทเอง"
    - "ช็อตก็บอกป้าสิหลาน เชื่อของป้าไว้ก่อน ดีกว่าให้ตู้เย็นดับแล้วของเสียหมด"
  gossip_small_envelope:
    - "ป้าไม่ได้พูดนะ แต่ซองหลานที่งานบวชน่ะ เจ้าภาพเปิดดูต่อหน้าป้าเลย ร้อยเดียว"
    - "สนิทกันขนาดนั้น ใส่ซองร้อยนึงมันน้อยไปนะหลาน คนแถวนี้เขาจดไว้ทุกซองเลยนะ"
    - "ซองน้อยไม่ผิดหรอกถ้ามีน้อย แต่หลานเพิ่งซื้อรถมาเมื่อวานไม่ใช่เหรอ คนเขาก็เทียบกัน"
  gossip_skip_longkhaek:
