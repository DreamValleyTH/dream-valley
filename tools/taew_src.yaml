id: taew
name: "ป้าแต๋ว"
role: "เจ้าของร้านชำ ศูนย์ข่าวลือประจำตำบล ให้เชื่อของ ครูสายปากหวาน"
voice: "เรียกผู้เล่นว่าหลาน ลงท้าย จ้ะ นะหลาน ตายแล้ว อุ๊ยตาย คำติดปาก “ป้าไม่ได้พูดนะ แต่เขาว่ากันว่า…” พูดเร็ว ลดเสียงกระซิบตอนนินทา ใจดี ขี้ตกใจ กลัวผี"
dark_humor: false
romanceable: false
lines:
  greet_morning:
    - "อ้าว {player} ตื่นเช้าเชียว ไข่ไก่เพิ่งมาส่งเมื่อกี้ ยังอุ่นอยู่เลยจ้ะ"
    - "หอกระจายข่าวยังเปิดเพลงไม่จบเพลงเลย หลานมาก่อนผู้ใหญ่สมศักดิ์อีก"
    - "เช้านี้ป้ากวาดหน้าร้านไปสองรอบแล้ว ใบมะขามมันร่วงไม่เลิกเลยจ้ะ"
    - "กินอะไรมาหรือยังหลาน ปาท่องโก๋ป้ายังเหลือ ถุงละสิบ เอาไปจิ้มนมข้นสิ"
    - "มาเช้าดีนะ เดี๋ยวสายๆ ป้าต้องเปิดกลุ่ม LINE อ่านสติกเกอร์สวัสดีวันจันทร์อีกร้อยกว่าอัน"
    - "สวัสดีจ้ะ วันนี้ป้าเปิดร้านตั้งแต่ตีห้าครึ่ง พวกไปนาเขามาซื้อบุหรี่ซื้อน้ำแข็งกันแต่เช้า"
  greet_noon:
    - "แดดเที่ยงอย่างนี้ เข้ามานั่งใต้พัดลมก่อนหลาน น้ำแข็งเปล่าป้าให้ฟรี"
    - "ป้าเพิ่งกินข้าวเสร็จ แกงส้มผักรวมของป้าทองใบ ฝากมาให้ถุงนึงจ้ะ"
    - "เที่ยงๆ อย่างนี้ร้านเงียบ ป้าเลยได้ฟังข่าวจากแม่ค้าที่แวะมาเต็มหูเลย"
    - "อ้าว {player} มาพอดี ป้ากำลังจะงีบ แต่ถ้ามีเรื่องเล่าป้าตื่นทันทีนะ"
    - "หยิบเองเลยหลาน ป้านั่งทอนเงินอยู่ เหรียญห้าบาทหมดอีกแล้ว"
  greet_evening:
    - "ห้าโมงเย็นแล้ว ป้าจะปิดร้านไปนั่งใต้ถุนบ้านป้าพรสักหน่อย ข่าวเย็นสดกว่าข่าวเช้านะหลาน"
    - "เย็นแล้วรีบซื้อของรีบกลับนะหลาน อย่าเถลไถลไปไหนมืดค่ำ"
    - "ได้ยินหอกระจายข่าวรอบห้าโมงไหม ราคาข้าวพรุ่งนี้ขึ้นนิดนึงจ้ะ ลานเสี่ยเฮงก็หักความชื้นเท่าเดิมแหละ"
    - "มาซื้อข้าวสารเหรอหลาน ถุงห้ากิโลเหลือถุงเดียว ป้าเก็บไว้ให้เลย"
    - "เย็นนี้ลมเย็นดีนะ ป้าเห็นยุงเริ่มมาแล้ว ยากันยุงขดก็มีจ้ะ"
  greet_night:
    - "ตายแล้ว สองทุ่มแล้วหลานยังเดินอยู่อีก! เดี๋ยวสามทุ่มผีออกนะ"
    - "หมาบ้านลุงสมหมายเริ่มหอนแล้ว ป้าจะปิดประตูแล้วนะ รีบกลับไปเถอะ"
    - "ถ้ากลับบ้านไม่ทัน ไปนอนร้าน 24 ชม. ของตั้มก็ได้ ไฟสว่างทั้งคืน หรือเข้าวัดไปเลยจ้ะ"
    - "ป้าไม่ได้ขู่นะ แต่ทางไปทุ่งนาตอนดึกน่ะ ไม่มีไฟถนนสักดวง"
    - "ยังไม่ได้เช่าผ้ายันต์ที่วัดอีกล่ะสิ ร้อยนึงไม่ถึง ถูกกว่าค่า รพ.สต. นะหลาน"
  weather_rain:
    - "ฝนมาแล้ว! เก็บผ้าทันไหมหลาน ป้าวิ่งเก็บผ้าถุงแทบไม่ทัน"
    - "ฝนตกอย่างนี้ร่มขายดี ป้าเหลือร่มลายดอกสามคัน คันละแปดสิบจ้ะ"
    - "ฝนตกแปลงผักไม่ต้องรด หลานได้พักแขนวันนึงนะ"
    - "หลังคาสังกะสีร้านป้ารั่วตรงตู้แช่อีกแล้ว ต้องเรียกช่างเปี๊ยกมาดูสักที"
    - "เดินระวังนะหลาน ถนนลูกรังหน้าบ้านกำนันเป็นหลุมเป็นบ่อ เมื่อวานมอไซค์ล้มไปคันนึง"
  weather_hot:
    - "ร้อนจนไข่จะสุกในแผงแล้วหลาน ป้าต้องย้ายไปไว้ในร่ม"
    - "น้ำแข็งหลอดขายหมดตั้งแต่สิบโมง วันนี้ร้อนจริงๆ"
    - "อย่าไปตากแดดกลางนานะหลาน ปีที่แล้วมีคนเป็นลมแดดล้มที่ลานตากข้าว"
    - "ป้าเปิดพัดลมสามตัวยังไม่หายร้อน ค่าไฟเดือนนี้ป้าไม่กล้าดูเลย"
    - "เอาผ้าขาวม้าชุบน้ำพันคอไว้นะหลาน วิธีโบราณแต่ได้ผลจ้ะ"
  weather_storm:
    - "พายุมาแรงอย่างนี้ อย่าออกไปไหนนะหลาน กิ่งมะม่วงหน้าวัดหักลงมาแล้วกิ่งนึง"
    - "ไฟดับอีกแล้ว ตู้แช่ป้าละลายหมด ไอติมแท่งป้าขายลดครึ่งราคาเลย"
    - "หอกระจายข่าวเสียงซ่าๆ ฟังไม่รู้เรื่องเลย ป้าต้องโทรถามหมอแอนเอา"
    - "ป้าจุดเทียนรอไว้แล้ว เทียนไขแพ็คละยี่สิบ ซื้อติดบ้านไว้นะหลาน"
    - "ลมแรงจนป้ายร้านป้าปลิวไปติดรั้วบ้านป้าพร เดี๋ยวพรุ่งนี้ต้องไปขอคืน"
  weather_pm25:
    - "ฟ้าขมุกขมัวอย่างนี้ไม่ใช่หมอกนะหลาน ฝุ่นทั้งนั้น ป้ามีหน้ากากผ้าขายจ้ะ"
    - "ไอแค่กๆ ทั้งตำบลเลยช่วงนี้ เขาว่ากันว่าไร่อ้อยฝั่งอำเภอเผาอีกแล้ว"
    - "ทำงานกลางแจ้งเหนื่อยไวนะหลาน ช่วงนี้ปลูกต้นไม้ไว้ในบ้านบ้างก็ดี"
    - "ผ้าที่ตากไว้มีขี้เถ้าติดดำปี๋ ป้าต้องซักใหม่หมด"
  season_rainy:
    - "หน้าฝนแล้ว นาข้าวเขียวทั้งทุ่ง ป้ามองแล้วชื่นใจทุกปีเลยจ้ะ"
    - "หน้าฝนกบออกเยอะ ลูกหลานแถวนี้ไปส่องกบกันทุกคืน ป้ากลัวเจอผีมากกว่าเจอกบ"
    - "เข้าพรรษาแล้ว คนมาซื้อเทียนกับธูปเยอะขึ้น ป้าต้องสั่งของเพิ่ม"
    - "หน้าฝนยุงชุมนะหลาน ติดมุ้งลวดหรือยัง ไข้เลือดออกไม่ใช่เล่นๆ"
    - "เห็ดโคนออกแล้วล่ะ ป้าทองใบไปเก็บมาได้เต็มตะกร้า ใครๆ ก็อยากรู้ว่าไปเก็บที่ไหน"
  season_cool:
    - "หน้าหนาวแล้ว ป้าเอาเสื้อกันหนาวมือสองมาขาย ตัวละห้าสิบจ้ะ"
    - "ลมหนาวมาทีไรป้าปวดเข่าทุกที แต่ก็ชอบนะ อากาศสบาย"
    - "หน้าหนาวงานบุญเยอะ กฐิน ลอยกระทง งานวัด ซองป้าหมดเป็นตั้งๆ"
    - "เช้าๆ หมอกลงขาวโพลน มองไม่เห็นบ้านฝั่งตรงข้ามเลยหลาน ขับรถระวังด้วย"
    - "ข้าวใหม่ออกแล้ว หอมไปทั้งตำบล ป้าชอบกลิ่นนี้ที่สุดในโลกเลย"
  season_dry:
    - "หน้าแล้งน้ำประปาไหลกะปริบกะปรอย ป้ารองน้ำใส่โอ่งไว้ตั้งแต่ตีห้า"
    - "มะนาวแพงขึ้นอีกแล้ว ลูกละห้าบาท ป้าบีบน้ำปลาพริกต้องประหยัด"
    - "หน้าแล้งคนหนุ่มสาวไปทำงานโรงงานกันหมด ตำบลเงียบเหงานะหลาน"
    - "ใกล้สงกรานต์แล้ว ป้าสั่งแป้งดินสอพองกับปืนฉีดน้ำมาเตรียมไว้แล้ว"
    - "ร้อนแล้งอย่างนี้ คลองหลังวัดแห้งจนเห็นก้นคลอง ป้าไม่เคยเห็นแห้งขนาดนี้"
  heart_low:
    - "จะเอาอะไรจ๊ะ ของอยู่ตามชั้น ราคาเขียนไว้แล้ว"
    - "อ้อ ลูกบ้านหลังโน้นใช่ไหม ป้าจำหน้าได้ลางๆ"
    - "ซื้อเงินสดนะหลาน ของเชื่อป้าให้เฉพาะคนที่รู้จักกันนานๆ"
    - "จ้ะ จ้ะ ทอนสิบบาทนะ"
    - "หลานกลับมาอยู่บ้านจริงเหรอ คนส่วนใหญ่มาอยู่ได้ไม่ถึงปีก็กลับกรุงเทพฯ"
  heart_mid:
    - "หลานมาร้านป้าบ่อยขึ้นนะ ป้าเลยแอบเก็บไข่เป็ดไว้ให้สองฟอง"
    - "นั่งก่อนสิ ป้าเพิ่งได้เรื่องสนุกมา แต่ป้าไม่ได้พูดนะ"
    - "ถ้าเงินช็อต มาเชื่อของป้าก่อนได้ ป้าคิดดอกนิดเดียว ไม่เหมือนบางเจ้าหรอก"
    - "ป้าเห็นหลานทำนาแล้วนึกถึงพ่อหลานตอนหนุ่มๆ ขยันเหมือนกันเลย"
    - "หลานแวะมาทีไร ป้าคุยเพลินลืมทอนเงินทุกที"
  heart_high:
    - "หลานรู้ไหม สมุดเชื่อของป้าน่ะ ป้าฉีกทิ้งไปหลายหน้าแล้ว คนบางบ้านเขาไม่มีจริงๆ"
    - "ลุงของหลานน่ะ เอ๊ย สามีป้าน่ะ เขาสร้างร้านนี้มากับมือ ป้าเลยไม่ยอมปิดสักวัน"
    - "ลูกสาวป้าอยู่กรุงเทพฯ โอนเงินมาทุกเดือน แต่ป้าอยากได้ยินเสียงมากกว่าเงินนะหลาน"
    - "ข่าวที่ป้าเล่นๆ น่ะเรื่องเล็ก เรื่องใหญ่จริงๆ ป้าเก็บไว้กับตัวทั้งนั้น ป้าก็รู้จักขอบเขตนะ"
    - "ถ้าป้าเป็นอะไรไป ร้านนี้ป้าอยากให้คนที่รักตำบลนี้ดูแลต่อ หลานพอจะเข้าใจใช่ไหม"
    - "ป้าดีใจที่หลานกลับมา บ้านหลังนั้นเงียบมาหลายปีแล้ว ตอนนี้มีไฟเปิดทุกคืน"
  topic_news:
    - "ป้าไม่ได้พูดนะ แต่เขาว่ากันว่าบอลจะไประยองจริงๆ แล้ว อู่ซ่อมรถจะเหลือใครล่ะทีนี้"
    - "ได้ยินมาว่าคนของบริษัทคุณธนามาวัดที่ดินหลังโรงเรียนอีกแล้ว วัดกันบ่อยจัง"
    - "ลุงสมหมายถูกเลขท้ายสองตัวงวดนี้ สองพัน! ป้าพรยังบ่นเหมือนเดิม เพราะลุงซื้อไปสามพัน"
    - "ตลาดนัดวันเสาร์นี้มีแผงใหม่มาขายหมูปิ้ง ป้าว่าน่าจะแย่งลูกค้าเจ๊หงษ์แน่ๆ"
    - "กองทุนหมู่บ้านเปิดให้กู้รอบใหม่ แต่ต้องใช้สำเนาบัตรประชาชนสามชุดเหมือนเดิมนั่นแหละ"
    - "แพรวลูกสาวกำนันไปเรียนทำขนมที่อำเภอทุกวันอังคาร เขาว่ากันว่าไปคนเดียวกลับสองคน ป้าไม่ได้พูดนะ"
  topic_advice:
    - "อยากให้ใครรักต้องจำวันเกิดเขาให้ได้นะหลาน ของขวัญวันเกิดได้ใจกว่าวันธรรมดาหลายเท่า"
    - "คนในตำบลนี้ถ้าเขามีเรื่องร้ายๆ ลือในกลุ่ม LINE อย่าไปเถียง ทำดีกับเขาไปเรื่อยๆ ข่าวมันจางเอง"
    - "เงินสดอย่าพกเยอะตอนกลางคืน เป็นลมกลางทางเงินหายหมดนะหลาน ฝากธนาคารไว้ดีที่สุด"
    - "จะให้ของใคร ลองถามป้าก่อน ป้ารู้หมดว่าใครชอบอะไร ยายบัวไม่กินเผ็ด หมอแอนชอบของไม่หวาน"
    - "งานบวชงานแต่ง ใส่ซองให้สมกับที่สนิทกันนะหลาน สนิทมากใส่น้อย คนจำไปอีกนานเลย"
    - "เชื่อของป้าได้ไม่เกินสามพัน ดอกเดือนละบาท จ่ายตรงเวลาป้าก็ให้เชื่อเพิ่ม ดีกว่าไปหาเสี่ยเฮงเยอะ"
  topic_smalltalk:
    - "ป้าดูละครหลังข่าวเมื่อคืน นางเอกโดนตบอีกแล้ว ป้าลุ้นจนลืมปิดร้าน"
    - "แมวส้มที่นอนหน้าร้านป้าน่ะ ไม่ใช่แมวป้านะ มันมาเองทุกวัน ป้าเลยต้องซื้อปลาทูให้มัน"
    - "หลานว่าป้าย้อมผมสีน้ำตาลดีไหม ป้าพรบอกแก่ ป้าว่าดูทันสมัยออก"
    - "ป้าให้น้องมิวสอนไลฟ์ขายของในโทรศัพท์ ไลฟ์ไปครั้งนึง คนดูสามคน เป็นป้าพรสองเครื่อง"
    - "ขนมเปี๊ยะไส้ทุเรียนนี่นะหลาน ป้ากินกับชาร้อนทุกบ่าย นี่แหละความสุขของคนแก่"
  topic_about_self:
    - "ป้าเปิดร้านนี้มาสามสิบปีแล้ว ตั้งแต่ถนนหน้าร้านยังเป็นดินแดงอยู่เลย"
    - "ป้าไม่ได้เรียนสูงหรอก จบ ป.4 แต่ทอนเงินไม่เคยผิดสักบาทนะ"
    - "ทุกเช้าป้าใส่บาตรพระอาจารย์สุเมธก่อนเปิดร้าน ทำมาตั้งแต่สาวๆ แล้ว"
    - "ป้ากลัวผีที่สุดในตำบล สามทุ่มเมื่อไหร่ป้าเข้ามุ้งแล้ว ต่อให้ละครยังไม่จบ"
    - "คนชอบว่าป้าปากมาก ก็จริงนะ แต่ป้าพูดเพราะป้าห่วง ใครป่วยใครลำบากป้ารู้ก่อนคนอื่นทั้งนั้น"
  topic_about_others:
    - "ป้าพรน่ะเพื่อนรักป้าตั้งแต่เด็ก บ่นเรื่องหวยลุงสมหมายทุกวัน แต่ซองลุงถูกรางวัลก็เก็บไว้เองนะ"
    - "เสี่ยเฮงน่ะ ใจดีนะหลาน แต่ใจดีแบบมีใบเสร็จ"
    - "ตั้มเด็กร้าน 24 ชม. น่ะ จบปริญญามาแต่อยู่กะดึก ป้าเห็นแล้วสงสาร หน้าตาซีดเหมือนผีเลย"
    - "หมอแอนนี่ป้าเกรงใจที่สุด ป้าส่งข่าวเรื่องน้ำมะนาวรักษามะเร็งในกลุ่ม หมอแอนมาแก้ข่าวป้าทุกที"
    - "พี่หน่อยร้านก๋วยเตี๋ยวน่ะ ฝีมือดีที่สุดในตำบล แต่ใส่ผักให้ป้าเยอะเกิน ป้าขอลูกชิ้นเพิ่มก็ไม่ให้"
    - "ดาบเสถียรเข้าร้านป้าทุกวัน ซื้อกาแฟกระป๋องแล้วนั่งเฝ้าร้านป้าแทนเฝ้าโรงพัก"
  gossip_theft:
    - "หลาน… ป้าได้ยินเรื่องในกลุ่ม LINE มา ป้าไม่อยากเชื่อนะ แต่ช่วงนี้ป้าขอขายเงินสดก่อนแล้วกัน"
    - "ป้าไม่ได้พูดนะ แต่เขาว่ากันว่าของหายบ้านตาเผือกน่ะ… หลานคงไม่ใช่หรอกใช่ไหม"
    - "เรื่องลือเรื่องขโมยนี่ล้างยากนะหลาน คนจำไปถึงรุ่นลูก ป้าเตือนเพราะป้าห่วง"
  gossip_cheating:
